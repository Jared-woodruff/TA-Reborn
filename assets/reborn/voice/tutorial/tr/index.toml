# The words each clip says (tools/voice/tutorial.py): a clip is made again when they change.
[lines]
"04685020ca36" = "Enerji güneş toplayıcılarından ve rüzgâr jeneratörlerinden gelir. Komutanının yanına bir Solar Collector inşa et. Üstteki çubuklar depolarını ve ne kadar hızlı dolup boşaldıklarını gösterir; biri tükenince seni uyarırlar."
"07349159e08f" = "Tek bir inşaatçı yavaştır. Kbot Lab'ı seç ve bir Construction Kbot üret: Komutanın inşa ettiği her şeyi, hatta daha fazlasını inşa eder."
"088ca43ad7e5" = "Artık çatışmaya hazırsın: önce Kolay, sonra Normal bir bilgisayar oyuncusuna karşı başla. F1 tüm tuşları listeler. İyi avlar, Komutan!"
"08ea5bc78b77" = "Görüşü kaydırmak için imleci ekranın bir kenarına daya ya da yakınlaştırmak için fare tekerleğini çevir."
"0ac0679361bb" = "Komutanın sıradaki binaları ekranın altında, resminin yanındaki İNŞA SIRASI başlığının altında görünür. Öne almak için birine tıkla (sağ tık onu çıkarır). Fabrika sırası da aynı şekilde çalışır."
"0e25aed95f24" = "Laboratuvar için Yinele seçeneğini aç: bitirdiği her birim sırasının sonuna geri eklenir, böylece üretim hiç durmaz."
"112e1e94fc39" = "Construction Kbot seçiliyken P tuşuna bas, sonra zemine tıkla: orası ile durduğu yer arasında gidip gelir."
"1450ddf1bbef" = "Fabrikalar birimlerini istediğin yere gönderir. Kbot Lab'ı seç. Sağ tıkla: yakındaki boş bir zemini işaretle; yeni birimler orada toplanır."
"1da97eed5e65" = "Solar Collector'ı seç, sonra Alt'ı basılı tut, zemine fare tuşuyla basıp sürükle: imleci bir blok silüet izler. Hepsini yerleştirmek için bırak."
"1def3c128879" = "Solar Collector düz, kare bir paneldir. Onu seç, sonra Komutanın yakınında boş bir yere tıkla."
"1e46e5fb8261" = "Seçmek için haritada laboratuvara tıkla; Construction Kbot onun inşa menüsünde. Yürüyüp dışarı çıkmasını bekle."
"1e68e1e9a76d" = "Komutanı gözden mi kaybettin? Ctrl+C onu her yerden seçer, YERİNİ GÖSTER düğmesi de kamerayı ona götürür."
"2276e80e8aa2" = "Alan emirleri, bina blokları ve sıralar bir savaşta seni yüzlerce tıklamadan kurtarır. Ders tamamlandı!"
"2a55d4a57361" = "Kbot Lab bir Peewee mangası üretti. Hepsini seçmek için sol fare tuşuyla etraflarına bir kutu sürükle."
"2c95b1f22254" = "Ordun başka yerdeyken kuleler bölgeyi tutar, radar geleni görür, inşaatçılar da onarır ve geri kazanır. Ders tamamlandı!"
"2f0a85f6bf70" = "Peewee'leri seç, sonra ateş emri düğmesine ATEŞ ETME görünene kadar tıkla: her tıklama sonraki emre geçer."
"2f9b6202eabf" = "Fabrikalar birimlerini istediğin yere gönderir. Kbot Lab'ı seç. Tıkla: yakındaki boş bir zemini işaretle; yeni birimler orada toplanır."
"34021e4a90f9" = "Laboratuvar için ÜRETİMİ YİNELE düğmesini aç: bitirdiği her birim sırasının sonuna geri eklenir, böylece üretim hiç durmaz."
"3ffd3e0fcf3b" = "Light Laser Tower, bir direğin üstündeki küçük bir silahtır. Onu seç, halkaya yerleştir ve bitmesini bekle."
"42cfcd3aba31" = "Baskıncılar işaretli yönden gelecek. İnşa menüsünden bir Light Laser Tower seçip işaretli halkaya inşa et: kuleler menzillerine giren her şeye ateş eder."
"478d161c0f8e" = "Seçmek için haritada laboratuvarın kendisine tıkla: inşa menüsü, ürettiği birimleri gösterir."
"4a913d9e96a1" = "Önce mangayı seç (1'e bas). Sonra Alt+F tuşuna ya da emirler arasındaki Savaş düğmesine bas ve işaretli halkanın yanında zemine tıkla."
"58f6e7f5d613" = "İNŞA SIRASI, yalnızca Komutan seçiliyken ve bekleyen binaları varken görünür. İlki dışında herhangi birine tıkla: ilki şu anda inşa ediliyor."
"5d15d5eff5c2" = "Onları kovalama: kule yalnızca menziline gireni vurur. Komutanı kulenin yanında tut; kule çarpışırken Komutan onu onarabilir (R tuşuna bas, sonra kuleye tıkla)."
"6616d40d9cbe" = "İnşa menüsünden bir Radar Tower seçip üssünün yakınına inşa et. Radar, düşmanları birimlerin onları görmeden çok önce haritada ve mini haritada işaret olarak gösterir."
"66a05a5bc367" = "Hoş geldin, Komutan. Ekranın ortasındaki yürüyen makine senin Komutanın: inşa eder, savaşır ve onu kaybetmek genellikle savaşı kaybetmek demektir. Seçmek için ona tıkla."
"680f2dd691c8" = "Her şey metal ve enerjiden yapılır. Metal, metal yataklarındaki çıkarıcılardan gelir. Komutanı seç, sağ alttaki inşa menüsünün EKONOMİ sekmesinden Metal Extractor'ı seç ve işaretli yatağa yerleştir."
"68643e4ac2d7" = "Construction Kbot seçiliyken G tuşuna bas, sonra laboratuvara tıkla. Laboratuvarın yanında kalır ve ürettiği her şeye yardım eder."
"6bbe617acc3b" = "Komutanı seç, Alt+X'e bas ve işaretli yatakların üzerinde bir çember sürükle: içindeki her metal noktasına, en yakından başlayarak bir çıkarıcı kurulur. Düz bir tıklama imlecin çevresindeki metali alır."
"6d44b9c93b4a" = "Harita, zeminin gizlediklerini gösterir. Metal haritası için F4'e bas (Alt+F2 birimlerin gidebileceği yerleri, Alt+F3 yükseklikleri, Alt+L görüş ve radarı gösterir); aynı tuş onu yeniden gizler. Sağ üstteki HARİTA menüsü de aynı işi yapar."
"707e85eefaec" = "Baskıncılar geride enkaz bıraktı ve enkazlar metal eder. Komutanı seç, E tuşuna bas ve bir enkaza tıkla ya da hepsinin üzerinde bir çember sürükle."
"72bba31dc6fe" = "Karakolun tüm binalarını yok et. Lazer kulesi sert vurur: mangayı bir arada tut ve gerekirse laboratuvarda takviye sıraya koy."
"7ed53eecc971" = "Komutan seçiliyken R tuşuna bas, sonra hasarlı binaya tıkla. Onarıldıkça can çubuğu dolar."
"7efb8bb59f34" = "Kbot Lab'ı seç ve üç tanesini sıraya koymak için Peewee'ye üç kez tıkla (birini sıradan çıkarmak için sağ tıkla). Yeni birimler laboratuvarın önünde bekler."
"7f18606a1e2d" = "Birimler kalıcı emirlerini korur. Peewee'lerini seç ve ATEŞ EMİRLERİ düğmesiyle ateş emrini \"Ateş etme\" olarak ayarla: sen söyleyene kadar ateş etmezler."
"80605b71900f" = "Bütün bir bloğu bir binayla doldurmak için onu sürüklerken Alt'ı basılı tut. Solar Collector'ı seç, Alt'ı basılı tut ve dört ya da daha fazlasından oluşan bir blok sürükle."
"81ae74c51474" = "Enkazlar baskıncıların düştüğü yerde. Komutan seçiliyken E tuşuna bas ve birine tıkla: enkaz söküldükçe metal çubuğu yükselir."
"827f6f703bc2" = "F4 tuşuna bas: metal yatakları haritanın her yerinde parlar."
"82acdb02eb07" = "Baskıncılar işaretli yönden gelecek. İşaretli halkaya bir Light Laser Tower (SAVUNMA sekmesinde) inşa et: kuleler menzillerine giren her şeye ateş eder."
"835a489ff106" = "Bütün döngü bu: çıkar, üret, inşa et, savaş. İki geliri de harcamanın üstünde tut ve inşaatçılarını hep meşgul et. Ders tamamlandı!"
"8699aceacc39" = "Üssünün yakınına bir Radar Tower (SENSÖRLER sekmesinde) inşa et. Radar, düşmanları birimlerin onları görmeden çok önce haritada ve mini haritada işaret olarak gösterir."

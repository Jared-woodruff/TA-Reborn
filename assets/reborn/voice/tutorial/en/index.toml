# The words each clip says (tools/voice/tutorial.py): a clip is made again when they change.
[lines]
"04685020ca36" = "Energy comes from solar collectors and wind generators. Build a Solar Collector next to your Commander. The bars at the top show your stores and how fast they fill or drain; they warn you when one runs dry."
"07349159e08f" = "One builder is slow. Select the Kbot Lab and build a Construction Kbot: it builds what the Commander builds, and more besides."
"088ca43ad7e5" = "You are ready for a skirmish: start against an Easy computer player, then Normal. F1 lists every key. Good hunting, Commander!"
"08ea5bc78b77" = "Push the pointer against an edge of the screen to scroll, or turn the mouse wheel to zoom."
"0ac0679361bb" = "The Commander's queued buildings show under BUILD QUEUE, beside its picture at the bottom of the screen. Click one to build it next (right-click drops it). A factory's queue works the same way."
"0e25aed95f24" = "Turn on Repeat for the lab: whatever it finishes goes back on the end of its queue, so it never stops building."
"112e1e94fc39" = "With the Construction Kbot selected, press P, then click on the ground: it walks back and forth between there and where it stood."
"1450ddf1bbef" = "Factories send their units where you say. Select the Kbot Lab. Right-click on open ground nearby: new units gather there."
"1da97eed5e65" = "Pick the Solar Collector, then hold Alt, press on the ground and drag: a block of outlines follows the pointer. Let go to place them all."
"1def3c128879" = "The Solar Collector is a flat, square panel. Pick it, then click on open ground near the Commander."
"1e46e5fb8261" = "Click the lab on the map to select it; the Construction Kbot is in its build menu. Wait for it to walk out."
"1e68e1e9a76d" = "Lost sight of it? Ctrl+C selects the Commander from anywhere, and SHOW ME brings the camera to it."
"2276e80e8aa2" = "Area orders, building blocks and queues save you hundreds of clicks in a battle. Lesson complete!"
"2a55d4a57361" = "Your Kbot Lab has built a squad of Peewees. Drag a box around them with the left mouse button to select them all."
"2c95b1f22254" = "Towers hold ground while your army is elsewhere, radar sees what is coming, and builders mend and recycle. Lesson complete!"
"2f0a85f6bf70" = "Select the Peewees, then click the fire order button until it shows HOLD FIRE: each click is the next order."
"2f9b6202eabf" = "Factories send their units where you say. Select the Kbot Lab. Click on open ground nearby: new units gather there."
"34021e4a90f9" = "Turn on REPEAT BUILD for the lab: whatever it finishes goes back on the end of its queue, so it never stops building."
"3ffd3e0fcf3b" = "The Light Laser Tower is a small gun on a post. Pick it, put it in the ring and wait for it to finish."
"42cfcd3aba31" = "Raiders will come from the marked direction. Build a Light Laser Tower from the build menu in the marked ring: towers shoot whatever comes in range."
"478d161c0f8e" = "Click the lab itself on the map to select it: its build menu shows the units it makes."
"4a913d9e96a1" = "Select the squad first (press 1). Then press Alt+F, or the Fight button among the orders, and click on the ground by the marked ring."
"58f6e7f5d613" = "The BUILD QUEUE shows while the Commander alone is selected and has buildings waiting. Click any but the first: that one is being built."
"5d15d5eff5c2" = "Do not chase them: the tower only fights what comes in range. Keep the Commander beside it; while it fights, the Commander can mend it (R, then click the tower)."
"6616d40d9cbe" = "Build a Radar Tower from the build menu near your base. Radar shows enemies as blips on the map and the minimap long before your units see them."
"66a05a5bc367" = "Welcome, Commander. The walking machine in the middle of the screen is your Commander: it builds, it fights, and losing it usually loses the battle. Click it to select it."
"680f2dd691c8" = "Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the ECONOMY tab of the build menu at the bottom right and place it on the marked deposit."
"68643e4ac2d7" = "With the Construction Kbot selected, press G, then click the lab. It stays by the lab and helps with everything it makes."
"6bbe617acc3b" = "Select the Commander, press Alt+X and drag a circle over the marked deposits: every metal spot inside gets an extractor, nearest first. A plain click takes the metal around the cursor."
"6d44b9c93b4a" = "The map shows what the ground hides. Press F4 for the metal map (Alt+F2 shows where units can go, Alt+F3 heights, Alt+L sight and radar); the same key hides it again. The MAP menu at the top right does the same."
"707e85eefaec" = "The raiders left wrecks, and wrecks are worth metal. Select the Commander, press E and click a wreck, or drag a circle over them all."
"72bba31dc6fe" = "Destroy every building of the outpost. Its laser tower hits hard: keep the squad together, and queue reinforcements at the lab if you need them."
"7ed53eecc971" = "With the Commander selected, press R, then click the damaged building. Its health bar fills as it is mended."
"7efb8bb59f34" = "Select the Kbot Lab and click the Peewee three times to queue three of them (right-click one to take it off the queue). New units wait in front of the lab."
"7f18606a1e2d" = "Units keep standing orders. Select your Peewees and set their FIRE ORDERS to Hold fire: they will not shoot until you say."
"80605b71900f" = "Hold Alt while you drag out a building to fill a whole block with it. Pick the Solar Collector, hold Alt and drag out a block of four or more."
"81ae74c51474" = "Wrecks lie where the raiders fell. With the Commander selected, press E and click one: the metal bar rises as it is taken apart."
"827f6f703bc2" = "Press F4: the metal deposits light up all over the map."
"82acdb02eb07" = "Raiders will come from the marked direction. Build a Light Laser Tower (on the DEFENCE tab) in the marked ring: towers shoot whatever comes in range."
"835a489ff106" = "That is the whole cycle: extract, generate, build, fight. Keep both incomes above what you spend and keep your builders busy. Lesson complete!"
"8699aceacc39" = "Build a Radar Tower (on the SENSORS tab) near your base. Radar shows enemies as blips on the map and the minimap long before your units see them."
"8c80431c349d" = "Losing the fight? Pull the squad back, queue more Peewees at the lab and go in again with all of them together."
"8f5b4c61ad9a" = "Hold Ctrl and press 1 while the squad is selected."
"8fed6ea661e2" = "The outpost is gone. The wrecks it left are worth metal: builders reclaim them (next lesson). Lesson complete!"
"904356857b46" = "Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the build menu on the left and place it on the marked deposit."
"952029d4e4a9" = "Look around. The arrow keys, the screen edges or dragging with the middle button scroll; the mouse wheel zooms towards the cursor, and dragging with the right button turns the view."
"95793b423069" = "Here they come: raiders on your radar. Keep the Commander by the tower and let them come to you: together they hold the line."
"9f072b4eadde" = "With the Commander selected, press Alt+X, then press on the ground over the deposits and drag outwards: the circle grows as you drag."
"9f45228b61fb" = "The map shows what the ground hides. Press F4 for the metal map (Alt+F2 shows where units can go, Alt+F3 heights, Alt+L sight and radar); the same key hides it again."
"a237050fd5f5" = "The fight left a building damaged. Select the Commander, press R and click it: builders mend what is damaged."
"a44faf66c01f" = "Units keep standing orders. Select your Peewees and set their fire order to Hold fire with the button beside the orders: they will not shoot until you say."
"a47eb83bd016" = "Factories build your army. Build a Kbot Lab (on the FACTORY tab) on a flat spot near the Commander, and wait for it to finish."
"a94c6ee7d3da" = "Select the lab first. With it selected, Right-click on the ground where its units should gather."
"aa6fdc9f4048" = "Factories build your army. Build a Kbot Lab from the build menu on a flat spot near the Commander, and wait for it to finish."
"ad258c99b392" = "Building takes metal and energy as it goes: while either bar at the top is empty, everything builds more slowly."
"ae222ed5c598" = "The outline turns green where the extractor can stand. Bring it onto the marked ring and click to place it."
"b4022e450cff" = "The enemy has an outpost at the marked place. Fight is attack-move: units walk there and take on whatever they meet on the way. Press Alt+F, then click near the outpost."
"c33a188e957c" = "The Radar Tower is a tall mast. Pick it, place it near the Commander and wait for it to finish."
"cad85260a63e" = "Builders help each other. Select the Construction Kbot, press G and click the Kbot Lab: it lends the lab its build power, and the lab builds faster."
"d160f857eaf0" = "Builders on patrol mend and reclaim whatever they pass. Select the Construction Kbot, press P and click on the far side of your base."
"d38c8d3d200e" = "Select the lab, then turn Repeat on: the pointer shows where it is."
"d6fa4f2c7aa1" = "Press Ctrl+1 to make them group 1. Pressing 1 selects them again from anywhere; pressing it twice brings the camera to them."
"dccf786c97a4" = "Press the left button on open ground beside the squad, hold it, drag the box over them all and let go."
"e66c692ad9ff" = "Select the lab first. With it selected, Click on the ground where its units should gather."
"fdb1f9de4a9d" = "Many orders work on areas. Press E (reclaim) and drag a circle over the rocks near your base: the Commander turns every one into metal."
"fe7e0a445202" = "Rocks and wrecks are worth metal. With the Commander selected, press E, then press on the ground and drag the circle over a few rocks."

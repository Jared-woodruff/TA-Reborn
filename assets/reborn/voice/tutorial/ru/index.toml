# The words each clip says (tools/voice/tutorial.py): a clip is made again when they change.
[lines]
"04685020ca36" = "Энергию дают солнечные коллекторы и ветрогенераторы. Постройте Solar Collector рядом с Командиром. Полосы вверху показывают ваши запасы и то, как быстро они пополняются или тают; они предупредят, когда запас иссякнет."

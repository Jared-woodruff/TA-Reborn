"088ca43ad7e5" = "Вы готовы к схватке: начните с компьютерного игрока уровня «Лёгкий», затем — «Обычный». F1 покажет все клавиши. Удачной охоты, Командир!"
"08ea5bc78b77" = "Подведите курсор к самому краю экрана, чтобы прокрутить вид, или покрутите колесо мыши, чтобы изменить масштаб."

# The words each clip says (tools/voice/tutorial.py): a clip is made again when they change.
[lines]
"04685020ca36" = "La energía procede de colectores solares y generadores eólicos. Construye un colector solar (Solar Collector) junto a tu Comandante. Las barras de arriba muestran tus reservas y lo rápido que se llenan o se vacían; te avisan cuando una se agota."
"07349159e08f" = "Un solo constructor es lento. Selecciona el Kbot Lab y fabrica un kbot de construcción (Construction Kbot): construye lo mismo que el Comandante, y más cosas."
"088ca43ad7e5" = "Ya estás listo para una escaramuza: empieza contra un jugador IA Fácil y después Normal. F1 muestra todas las teclas. ¡Buena caza, Comandante!"
"08ea5bc78b77" = "Lleva el cursor hasta un borde de la pantalla para desplazar la vista, o gira la rueda del ratón para hacer zoom."
"0ac0679361bb" = "Los edificios en cola del Comandante aparecen en COLA DE CONSTRUCCIÓN, junto a su imagen en la parte inferior de la pantalla. Haz clic en uno para construirlo a continuación (con un clic derecho lo descartas). La cola de una fábrica funciona igual."
"0e25aed95f24" = "Activa Repetir en el laboratorio: todo lo que termina vuelve al final de su cola, así que nunca deja de fabricar."
"112e1e94fc39" = "Con el Construction Kbot seleccionado, pulsa P y luego haz clic en el suelo: irá y vendrá entre ese punto y donde estaba."
"1450ddf1bbef" = "Las fábricas envían sus unidades adonde tú digas. Selecciona el Kbot Lab. Clic derecho en terreno despejado cercano: las unidades nuevas se reúnen allí."
"1da97eed5e65" = "Elige el Solar Collector; después mantén Alt, pulsa el botón sobre el terreno y arrastra: un bloque de contornos sigue al cursor. Suelta para colocarlos todos."
"1def3c128879" = "El Solar Collector es un panel plano y cuadrado. Elígelo y luego haz clic en terreno despejado cerca del Comandante."
"1e46e5fb8261" = "Haz clic en el laboratorio, en el mapa, para seleccionarlo; el Construction Kbot está en su menú de construcción. Espera a que salga."
"1e68e1e9a76d" = "¿Lo has perdido de vista? Ctrl+C selecciona al Comandante desde cualquier parte, y VER DÓNDE lleva la cámara hasta él."
"2276e80e8aa2" = "Las órdenes de área, los bloques de edificios y las colas te ahorran cientos de clics en una batalla. ¡Lección completada!"
"2a55d4a57361" = "Tu Kbot Lab ha construido un escuadrón de Peewee. Arrastra un recuadro a su alrededor con el botón izquierdo del ratón para seleccionarlos a todos."
"2c95b1f22254" = "Las torres defienden el terreno mientras tu ejército está en otra parte, el radar ve lo que se avecina y los constructores reparan y reciclan. ¡Lección completada!"
"2f0a85f6bf70" = "Selecciona los Peewee y luego haz clic en el botón de órdenes de fuego hasta que muestre NO DISPARAR: cada clic pasa a la siguiente orden."
"2f9b6202eabf" = "Las fábricas envían sus unidades adonde tú digas. Selecciona el Kbot Lab. Clic en terreno despejado cercano: las unidades nuevas se reúnen allí."
"34021e4a90f9" = "Activa REPETIR COLA en el laboratorio: todo lo que termina vuelve al final de su cola, así que nunca deja de fabricar."
"3ffd3e0fcf3b" = "La Light Laser Tower es un pequeño cañón sobre un poste. Elígela, colócala en el círculo y espera a que esté terminada."
"42cfcd3aba31" = "Llegarán incursores desde la dirección marcada. Construye una torre láser ligera (Light Laser Tower) desde el menú de construcción en el círculo marcado: las torres disparan a todo lo que entra en su alcance."
"478d161c0f8e" = "Haz clic en el propio laboratorio, en el mapa, para seleccionarlo: su menú de construcción muestra las unidades que fabrica."
"4a913d9e96a1" = "Primero selecciona el escuadrón (pulsa 1). Luego pulsa Alt+F, o el botón Combatir entre las órdenes, y haz clic en el suelo junto al círculo marcado."
"58f6e7f5d613" = "La COLA DE CONSTRUCCIÓN aparece cuando solo está seleccionado el Comandante y tiene edificios en espera. Haz clic en cualquiera menos en el primero: ese ya se está construyendo."
"5d15d5eff5c2" = "No los persigas: la torre solo combate lo que entra en su alcance. Mantén al Comandante a su lado; mientras la torre combate, el Comandante puede repararla (R y luego haz clic en la torre)."
"6616d40d9cbe" = "Construye una torre de radar (Radar Tower) desde el menú de construcción cerca de tu base. El radar muestra a los enemigos como puntos en el mapa y en el minimapa mucho antes de que tus unidades los vean."
"66a05a5bc367" = "Bienvenido, Comandante. La máquina andante en el centro de la pantalla es tu Comandante: construye, combate y, si lo pierdes, lo normal es que pierdas la batalla. Haz clic en él para seleccionarlo."
"680f2dd691c8" = "Todo se hace con metal y energía. El metal sale de los extractores colocados sobre yacimientos de metal. Selecciona al Comandante, elige el extractor de metal (Metal Extractor) en la pestaña ECONOMÍA del menú de construcción de abajo a la derecha y colócalo en el yacimiento marcado."
"68643e4ac2d7" = "Con el Construction Kbot seleccionado, pulsa G y luego haz clic en el laboratorio. Se queda junto al laboratorio y ayuda en todo lo que fabrica."
"6bbe617acc3b" = "Selecciona al Comandante, pulsa Alt+X y arrastra un círculo sobre los yacimientos marcados: cada yacimiento de metal del interior recibe un extractor, empezando por el más cercano. Un simple clic toma el metal alrededor del cursor."
"6d44b9c93b4a" = "El mapa muestra lo que oculta el terreno. Pulsa F4 para ver el mapa de metal (Alt+F2 muestra adónde pueden ir las unidades; Alt+F3, las alturas; Alt+L, la visión y el radar); la misma tecla lo vuelve a ocultar. El menú MAPA de arriba a la derecha hace lo mismo."
"707e85eefaec" = "Los incursores han dejado restos, y los restos valen metal. Selecciona al Comandante, pulsa E y haz clic en unos restos, o arrastra un círculo sobre todos ellos."
"72bba31dc6fe" = "Destruye todos los edificios del puesto. Su torre láser pega fuerte: mantén unido el escuadrón y pon refuerzos en cola en el laboratorio si los necesitas."
"7ed53eecc971" = "Con el Comandante seleccionado, pulsa R y luego haz clic en el edificio dañado. Su barra de vida se llena a medida que se repara."
"7efb8bb59f34" = "Selecciona el Kbot Lab y haz clic tres veces en el Peewee para poner tres en cola (con un clic derecho quitas uno de la cola). Las unidades nuevas esperan delante del laboratorio."
"7f18606a1e2d" = "Las unidades mantienen sus órdenes permanentes. Selecciona tus Peewee y pon sus ÓRDENES DE FUEGO en No disparar: no dispararán hasta que tú lo digas."
"80605b71900f" = "Mantén Alt mientras arrastras un edificio para llenar todo un bloque con él. Elige el Solar Collector, mantén Alt y arrastra un bloque de cuatro o más."
"81ae74c51474" = "Los restos están donde cayeron los incursores. Con el Comandante seleccionado, pulsa E y haz clic en unos restos: la barra de metal sube a medida que se desmontan."
"827f6f703bc2" = "Pulsa F4: los yacimientos de metal se iluminan por todo el mapa."
"82acdb02eb07" = "Llegarán incursores desde la dirección marcada. Construye una torre láser ligera (Light Laser Tower, en la pestaña DEFENSA) en el círculo marcado: las torres disparan a todo lo que entra en su alcance."
"835a489ff106" = "Ese es el ciclo completo: extraer, generar, construir, combatir. Mantén ambos ingresos por encima de lo que gastas y a tus constructores ocupados. ¡Lección completada!"
"8699aceacc39" = "Construye una torre de radar (Radar Tower, en la pestaña RADAR) cerca de tu base. El radar muestra a los enemigos como puntos en el mapa y en el minimapa mucho antes de que tus unidades los vean."
"8c80431c349d" = "¿Vas perdiendo el combate? Retira el escuadrón, pon más Peewee en cola en el laboratorio y vuelve al ataque con todos juntos."
"8f5b4c61ad9a" = "Mantén Ctrl y pulsa 1 mientras el escuadrón está seleccionado."
"8fed6ea661e2" = "El puesto ha caído. Sus restos valen metal: los constructores los reciclan (siguiente lección). ¡Lección completada!"
"904356857b46" = "Todo se hace con metal y energía. El metal sale de los extractores colocados sobre yacimientos de metal. Selecciona al Comandante, elige el extractor de metal (Metal Extractor) en el menú de construcción de la izquierda y colócalo en el yacimiento marcado."
"952029d4e4a9" = "Echa un vistazo. Las teclas de flecha, los bordes de la pantalla o arrastrar con el botón central desplazan la vista; la rueda del ratón hace zoom hacia el cursor, y arrastrar con el botón derecho gira la vista."
"95793b423069" = "Ahí vienen: incursores en tu radar. Mantén al Comandante junto a la torre y deja que vengan a ti: juntos, el Comandante y la torre mantienen la línea."
"9f072b4eadde" = "Con el Comandante seleccionado, pulsa Alt+X; después mantén pulsado el botón sobre el terreno, encima de los yacimientos, y arrastra hacia fuera: el círculo crece a medida que arrastras."
"9f45228b61fb" = "El mapa muestra lo que oculta el terreno. Pulsa F4 para ver el mapa de metal (Alt+F2 muestra adónde pueden ir las unidades; Alt+F3, las alturas; Alt+L, la visión y el radar); la misma tecla lo vuelve a ocultar."
"a237050fd5f5" = "El combate ha dejado un edificio dañado. Selecciona al Comandante, pulsa R y haz clic en él: los constructores reparan lo que está dañado."
"a44faf66c01f" = "Las unidades mantienen sus órdenes permanentes. Selecciona tus Peewee y pon su orden de fuego en No disparar con el botón junto a las órdenes: no dispararán hasta que tú lo digas."
"a47eb83bd016" = "Las fábricas construyen tu ejército. Construye un laboratorio de kbots (Kbot Lab, en la pestaña FÁBRICA) en un lugar llano cerca del Comandante y espera a que esté terminado."
"a94c6ee7d3da" = "Primero selecciona el laboratorio y mantenlo seleccionado. Clic derecho en el suelo, donde deban reunirse sus unidades."
"aa6fdc9f4048" = "Las fábricas construyen tu ejército. Construye un laboratorio de kbots (Kbot Lab) desde el menú de construcción en un lugar llano cerca del Comandante y espera a que esté terminado."
"ad258c99b392" = "Construir consume metal y energía sobre la marcha: mientras alguna de las barras de arriba esté vacía, todo se construye más despacio."
"ae222ed5c598" = "El contorno se vuelve verde donde se puede colocar el extractor. Llévalo al círculo marcado y haz clic para colocarlo."
"b4022e450cff" = "El enemigo tiene un puesto avanzado en el lugar marcado. Combatir es avanzar atacando: las unidades van hasta allí y se enfrentan a todo lo que encuentran por el camino. Pulsa Alt+F y luego haz clic cerca del puesto."
"c33a188e957c" = "La Radar Tower es un mástil alto. Elígela, colócala cerca del Comandante y espera a que esté terminada."
"cad85260a63e" = "Los constructores se ayudan entre sí. Selecciona el Construction Kbot, pulsa G y haz clic en el Kbot Lab: le presta al laboratorio su potencia de construcción, y el laboratorio fabrica más rápido."
"d160f857eaf0" = "Los constructores de patrulla reparan y reciclan todo lo que encuentran a su paso. Selecciona el Construction Kbot, pulsa P y haz clic al otro lado de tu base."
"d38c8d3d200e" = "Selecciona el laboratorio y luego activa Repetir: la flecha te indica dónde hacer clic."
"d6fa4f2c7aa1" = "Pulsa Ctrl+1 para convertirlos en el grupo 1. Al pulsar 1 los vuelves a seleccionar desde cualquier parte; si lo pulsas dos veces, la cámara va hasta ellos."
"dccf786c97a4" = "Pulsa el botón izquierdo en terreno despejado junto al escuadrón, mantenlo pulsado, arrastra el recuadro sobre todos ellos y suelta."
"e66c692ad9ff" = "Primero selecciona el laboratorio y mantenlo seleccionado. Clic en el suelo, donde deban reunirse sus unidades."
"fdb1f9de4a9d" = "Muchas órdenes funcionan sobre áreas. Pulsa E (reciclar) y arrastra un círculo sobre las rocas cercanas a tu base: el Comandante las convierte todas en metal."
"fe7e0a445202" = "Las rocas y los restos valen metal. Con el Comandante seleccionado, pulsa E; después mantén pulsado el botón sobre el terreno y arrastra el círculo sobre unas cuantas rocas."

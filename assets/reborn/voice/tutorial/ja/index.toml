# The words each clip says (tools/voice/tutorial.py): a clip is made again when they change.
[lines]
"04685020ca36" = "エネルギーはソーラーコレクターや風力発電機から得られます。コマンダーの近くにSolar Collectorを建設してください。上部のバーは貯蔵量と、その増減の速さを示します。どちらかが尽きそうになると警告が表示されます。"
"07349159e08f" = "建設ユニットが1体だけでは時間がかかります。Kbot Labを選択してConstruction Kbotを生産してください：コマンダーが建てられるものはもちろん、それ以上のものも建設できます。"
"088ca43ad7e5" = "これでスカーミッシュの準備は万全です：まずはイージーのコンピューターと、次にノーマルと戦ってみましょう。F1で全キーの一覧を確認できます。健闘を祈ります、コマンダー！"
"08ea5bc78b77" = "ポインターを画面の端に寄せるとスクロールし、マウスホイールを回すとズームします。"
"0ac0679361bb" = "コマンダーの建設キューは、画面下部のコマンダーの画像の横、「建設キュー」の下に表示されます。クリックするとそれを次に建設します（右クリックで取り消し）。工場のキューも同じように使えます。"
"0e25aed95f24" = "ラボの「反復」をオンにしてください：完成したものはキューの最後に戻るので、生産が止まることはありません。"
"112e1e94fc39" = "Construction Kbotを選択した状態でPを押し、地面をクリックしてください：その地点と元いた場所の間を往復します。"
"1450ddf1bbef" = "工場は、生産したユニットを指定した場所へ送り出します。Kbot Labを選択し、近くの空いている地面を右クリックしてください：新しいユニットはそこに集結します。"
"1da97eed5e65" = "Solar Collectorを選び、Altを押しながら地面でマウスボタンを押してドラッグしてください：並んだ輪郭がポインターについてきます。ボタンを離すと、すべて配置されます。"
"1def3c128879" = "Solar Collectorは平たい正方形のパネルです。選んだら、コマンダーの近くの空いている地面をクリックしてください。"
"1e46e5fb8261" = "マップ上のラボをクリックして選択してください。Construction Kbotは建設メニューにあります。ラボから歩いて出てくるまで待ってください。"
"1e68e1e9a76d" = "コマンダーを見失いましたか？Ctrl+Cでどこからでも選択でき、「その場所を表示」でカメラがコマンダーのもとへ移動します。"
"2276e80e8aa2" = "範囲命令、建物の一括配置、キューを使えば、戦闘中のクリックを何百回も省けます。レッスン完了！"
"2a55d4a57361" = "Kbot LabがPeeweeの分隊を生産しました。左ボタンでドラッグして囲み、全員を選択してください。"
"2c95b1f22254" = "砲塔は軍が出払っている間も陣地を守り、レーダーは迫る敵を捉え、建設ユニットは修理と回収を担います。レッスン完了！"
"2f0a85f6bf70" = "Peeweeを選択し、射撃命令ボタンを「射撃禁止」と表示されるまでクリックしてください：クリックするたびに次の命令に切り替わります。"
"2f9b6202eabf" = "工場は、生産したユニットを指定した場所へ送り出します。Kbot Labを選択し、近くの空いている地面をクリックしてください：新しいユニットはそこに集結します。"
"34021e4a90f9" = "ラボの「反復生産」をオンにしてください：完成したものはキューの最後に戻るので、生産が止まることはありません。"
"3ffd3e0fcf3b" = "Light Laser Towerは柱の上に載った小さな砲です。選んだら円の中に配置し、完成するまで待ってください。"
"42cfcd3aba31" = "マークされた方向から襲撃部隊がやって来ます。建設メニューからLight Laser Towerを選び、目印の円の中に建設してください：砲塔は射程内に入ったものを何でも撃ちます。"
"478d161c0f8e" = "マップ上のラボそのものをクリックして選択してください：建設メニューに、そのラボで生産できるユニットが表示されます。"
"4a913d9e96a1" = "まず分隊を選択してください（1を押します）。次にAlt+Fを押すか、命令の「交戦」ボタンを押して、目印の円のそばの地面をクリックしてください。"
"58f6e7f5d613" = "「建設キュー」は、コマンダーだけを選択していて、建設待ちの建物があるときに表示されます。先頭以外のどれかをクリックしてください：先頭の建物は建設中です。"
"5d15d5eff5c2" = "追いかけてはいけません：砲塔は射程内に入った敵としか戦えません。コマンダーを砲塔のそばに置いてください。砲塔が戦っている間、コマンダーは砲塔を修理できます（Rを押してから砲塔をクリック）。"
"6616d40d9cbe" = "建設メニューからRadar Towerを選び、基地の近くに建設してください。レーダーは、ユニットが敵を視認するずっと前から、マップとミニマップに敵を光点として表示します。"
"66a05a5bc367" = "ようこそ、コマンダー。画面中央にいる歩行機械が、あなたのコマンダーです：建設も戦闘もこなし、失えばたいてい戦いに敗れます。クリックして選択してください。"
"680f2dd691c8" = "すべては金属とエネルギーから作られます。金属は、金属鉱床の上に建てた抽出機から得られます。コマンダーを選択し、右下の建設メニューの「経済」タブからMetal Extractorを選んで、マークされた鉱床に配置してください。"
"68643e4ac2d7" = "Construction Kbotを選択した状態でGを押し、ラボをクリックしてください。ラボのそばにとどまり、ラボが生産するものすべてを手伝います。"
"6bbe617acc3b" = "コマンダーを選択し、Alt+Xを押して、マークされた鉱床の上で円をドラッグしてください：円内のすべての金属鉱床に、近い順に抽出機が建設されます。普通にクリックすると、カーソル周辺の鉱床が対象になります。"
"6d44b9c93b4a" = "マップ表示で、地面に隠れた情報がわかります。F4で金属マップを表示します（Alt+F2で移動可能範囲、Alt+F3で高低差、Alt+Lで視界とレーダー）。同じキーをもう一度押すと非表示になります。右上の「マップ」メニューでも同じことができます。"
"707e85eefaec" = "襲撃部隊は残骸を残していきました。残骸は金属になります。コマンダーを選択し、Eを押して残骸をクリックするか、すべてを囲むように円をドラッグしてください。"
"72bba31dc6fe" = "前哨基地の建物をすべて破壊してください。レーザー塔の攻撃は強力です：分隊をまとめて行動させ、必要ならラボで増援をキューに入れましょう。"
"7ed53eecc971" = "コマンダーを選択した状態でRを押し、損傷した建物をクリックしてください。修理が進むにつれてHPバーが回復していきます。"
"7efb8bb59f34" = "Kbot Labを選択し、Peeweeを3回クリックして3体をキューに入れてください（右クリックでキューから1体取り消せます）。完成したユニットはラボの前で待機します。"
"7f18606a1e2d" = "ユニットは常時命令を守り続けます。Peeweeを選択し、「射撃命令」を「射撃禁止」にしてください：指示するまで射撃しなくなります。"
"80605b71900f" = "建物をドラッグで配置するときにAltを押していると、四角形の範囲全体を埋められます。Solar Collectorを選び、Altを押しながら4基以上の範囲をドラッグしてください。"
"81ae74c51474" = "残骸は襲撃部隊が倒れた場所にあります。コマンダーを選択した状態でEを押し、残骸を1つクリックしてください：解体が進むにつれて金属のバーが伸びていきます。"
"827f6f703bc2" = "F4を押してください：マップ中の金属鉱床が光って浮かび上がります。"
"82acdb02eb07" = "マークされた方向から襲撃部隊がやって来ます。目印の円の中にLight Laser Tower（「防衛」タブ）を建設してください：砲塔は射程内に入ったものを何でも撃ちます。"
"835a489ff106" = "これが一連のサイクルです：抽出し、発電し、建設し、戦う。両方の収入を支出より多く保ち、建設ユニットを休ませないようにしましょう。レッスン完了！"
"8699aceacc39" = "基地の近くにRadar Tower（「センサー」タブ）を建設してください。レーダーは、ユニットが敵を視認するずっと前から、マップとミニマップに敵を光点として表示します。"
"8c80431c349d" = "苦戦していますか？分隊を後退させ、ラボでPeeweeを追加でキューに入れてから、全員そろって再び攻め込みましょう。"
"8f5b4c61ad9a" = "分隊を選択した状態で、Ctrlを押しながら1を押してください。"
"8fed6ea661e2" = "前哨基地は壊滅しました。残された残骸は金属になります：建設ユニットで回収できます（次のレッスン）。レッスン完了！"
"904356857b46" = "すべては金属とエネルギーから作られます。金属は、金属鉱床の上に建てた抽出機から得られます。コマンダーを選択し、左の建設メニューからMetal Extractorを選んで、マークされた鉱床に配置してください。"
"952029d4e4a9" = "周囲を見回しましょう。矢印キー、画面端、中ボタンでのドラッグでスクロールします。マウスホイールでカーソルに向かってズームし、右ボタンでドラッグすると視点が回転します。"
"95793b423069" = "敵が来ました：レーダーに襲撃部隊が映っています。コマンダーを砲塔のそばにとどめ、敵を迎え撃ってください：両者が力を合わせれば防衛線を守れます。"
"9f072b4eadde" = "コマンダーを選択した状態でAlt+Xを押し、鉱床の上の地面でマウスボタンを押して、そのまま外側へドラッグしてください：ドラッグするにつれて円が大きくなります。"
"9f45228b61fb" = "マップ表示で、地面に隠れた情報がわかります。F4で金属マップを表示します（Alt+F2で移動可能範囲、Alt+F3で高低差、Alt+Lで視界とレーダー）。同じキーをもう一度押すと非表示になります。"
"a237050fd5f5" = "戦闘で建物が1つ損傷しました。コマンダーを選択し、Rを押してその建物をクリックしてください：建設ユニットは損傷したものを修理できます。"
"a44faf66c01f" = "ユニットは常時命令を守り続けます。Peeweeを選択し、命令ボタンの横にあるボタンで射撃命令を「射撃禁止」にしてください：指示するまで射撃しなくなります。"
"a47eb83bd016" = "工場で軍隊を生産します。コマンダーの近くの平らな場所にKbot Lab（「工場」タブ）を建設し、完成するまで待ってください。"
"a94c6ee7d3da" = "まずラボを選択してください。選択した状態で、ユニットを集結させたい地面を右クリックしてください。"
"aa6fdc9f4048" = "工場で軍隊を生産します。建設メニューからKbot Labを選び、コマンダーの近くの平らな場所に建設して、完成するまで待ってください。"
"ad258c99b392" = "建設中は金属とエネルギーが少しずつ消費されます：上部のバーのどちらかが空の間は、すべての建設が遅くなります。"
"ae222ed5c598" = "抽出機を置ける場所では、輪郭が緑色になります。輪郭を目印の円に重ねて、クリックで配置してください。"
"b4022e450cff" = "マークされた場所に敵の前哨基地があります。交戦は攻撃移動です：ユニットは目的地へ向かいながら、途中で遭遇した敵と戦います。Alt+Fを押してから、前哨基地の近くをクリックしてください。"
"c33a188e957c" = "Radar Towerは背の高いアンテナ塔です。選んだらコマンダーの近くに配置し、完成するまで待ってください。"
"cad85260a63e" = "建設ユニットは互いに助け合えます。Construction Kbotを選択し、Gを押してKbot Labをクリックしてください：ラボに建設力を貸し、ラボの生産が速くなります。"
"d160f857eaf0" = "パトロール中の建設ユニットは、道中にあるものを修理・回収します。Construction Kbotを選択し、Pを押して基地の反対側をクリックしてください。"
"d38c8d3d200e" = "ラボを選択してから「反復」をオンにしてください：矢印がその場所を示します。"
"d6fa4f2c7aa1" = "Ctrl+1を押してグループ1にしてください。どこにいても1を押せば再び選択でき、2回押すとカメラがそのグループに移動します。"
"dccf786c97a4" = "分隊の横の空いている地面で左ボタンを押し、押したままドラッグして枠で全員を囲んでから、ボタンを離してください。"
"e66c692ad9ff" = "まずラボを選択してください。選択した状態で、ユニットを集結させたい地面をクリックしてください。"
"fdb1f9de4a9d" = "多くの命令は範囲に対して使えます。E（回収）を押して、基地近くの岩の上で円をドラッグしてください：コマンダーがそれらをすべて金属に変えます。"
"fe7e0a445202" = "岩や残骸は金属になります。コマンダーを選択した状態でEを押し、地面でマウスボタンを押して、円がいくつかの岩にかかるようにドラッグしてください。"

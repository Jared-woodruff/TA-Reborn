# The words each clip says (tools/voice/tutorial.py): a clip is made again when they change.
[lines]
"04685020ca36" = "Energie kommt von Solarkollektoren und Windgeneratoren. Baue einen Solar Collector neben deinem Kommandanten. Die Balken oben zeigen deine Vorräte und wie schnell sie sich füllen oder leeren; sie warnen dich, wenn einer leer läuft."
"07349159e08f" = "Ein einzelner Konstrukteur ist langsam. Wähle das Kbot Lab aus und baue einen Construction Kbot: Er baut, was der Kommandant baut, und noch mehr."
"088ca43ad7e5" = "Du bist bereit für ein Gefecht: Beginne gegen einen Computerspieler auf Leicht, dann auf Normal. F1 listet alle Tasten auf. Gute Jagd, Kommandant!"
"08ea5bc78b77" = "Schiebe den Mauszeiger an einen Bildschirmrand, um zu scrollen, oder drehe das Mausrad, um zu zoomen."
"0ac0679361bb" = "Die eingereihten Gebäude des Kommandanten erscheinen unter BAULISTE, neben seinem Bild unten am Bildschirm. Klicke eines an, um es als Nächstes zu bauen (Rechtsklick verwirft es). Die Bauliste einer Fabrik funktioniert genauso."
"0e25aed95f24" = "Schalte für das Labor Wiederholen ein: Alles, was es fertigstellt, kommt wieder ans Ende seiner Bauliste, sodass es nie aufhört zu bauen."
"112e1e94fc39" = "Drücke bei ausgewähltem Construction Kbot P und klicke dann auf den Boden: Er läuft zwischen dieser Stelle und seinem Ausgangspunkt hin und her."
"1450ddf1bbef" = "Fabriken schicken ihre Einheiten, wohin du willst. Wähle das Kbot Lab aus. Rechtsklick auf freies Gelände in der Nähe: Neue Einheiten sammeln sich dort."
"1da97eed5e65" = "Wähle den Solar Collector, halte dann Alt gedrückt, drücke die Maustaste auf dem Boden und ziehe: Ein Block aus Umrissen folgt dem Mauszeiger. Lass los, um sie alle zu setzen."
"1def3c128879" = "Der Solar Collector ist eine flache, quadratische Platte. Wähle ihn und klicke dann auf freies Gelände nahe dem Kommandanten."
"1e46e5fb8261" = "Klicke das Labor auf der Karte an, um es auszuwählen; der Construction Kbot ist in seinem Baumenü. Warte, bis er herausläuft."
"1e68e1e9a76d" = "Aus den Augen verloren? Ctrl+C wählt den Kommandanten von überall aus, und STELLE ZEIGEN bringt die Kamera zu ihm."
"2276e80e8aa2" = "Gebietsbefehle, Gebäudeblöcke und Baulisten ersparen dir in einer Schlacht Hunderte von Klicks. Lektion abgeschlossen!"
"2a55d4a57361" = "Dein Kbot Lab hat einen Trupp Peewees gebaut. Ziehe mit der linken Maustaste einen Rahmen um sie, um alle auszuwählen."
"2c95b1f22254" = "Türme halten die Stellung, während deine Armee anderswo ist, Radar sieht, was kommt, und Konstrukteure reparieren und recyceln. Lektion abgeschlossen!"
"2f0a85f6bf70" = "Wähle die Peewees aus und klicke dann so lange auf die Schaltfläche für den Feuerbefehl, bis sie NICHT FEUERN zeigt: Jeder Klick schaltet zum nächsten Befehl."
"2f9b6202eabf" = "Fabriken schicken ihre Einheiten, wohin du willst. Wähle das Kbot Lab aus. Klick auf freies Gelände in der Nähe: Neue Einheiten sammeln sich dort."
"34021e4a90f9" = "Schalte für das Labor DAUERBAU ein: Alles, was es fertigstellt, kommt wieder ans Ende seiner Bauliste, sodass es nie aufhört zu bauen."
"3ffd3e0fcf3b" = "Der Light Laser Tower ist ein kleines Geschütz auf einem Pfosten. Wähle ihn, setze ihn in den Ring und warte, bis er fertig ist."
"42cfcd3aba31" = "Aus der markierten Richtung werden Plünderer kommen. Baue einen Light Laser Tower aus dem Baumenü im markierten Ring: Türme schießen auf alles, was in Reichweite kommt."
"478d161c0f8e" = "Klicke das Labor selbst auf der Karte an, um es auszuwählen: Sein Baumenü zeigt die Einheiten, die es baut."
"4a913d9e96a1" = "Wähle zuerst den Trupp aus (drücke 1). Drücke dann Alt+F oder die Schaltfläche Kämpfen bei den Befehlen und klicke am markierten Ring auf den Boden."
"58f6e7f5d613" = "Die BAULISTE erscheint, solange nur der Kommandant ausgewählt ist und Gebäude eingereiht hat. Klicke auf eines außer dem ersten: Das erste wird gerade gebaut."
"5d15d5eff5c2" = "Jage ihnen nicht nach: Der Turm bekämpft nur, was in Reichweite kommt. Halte den Kommandanten neben ihm; während der Turm kämpft, kann der Kommandant ihn reparieren (R, dann auf den Turm klicken)."
"6616d40d9cbe" = "Baue einen Radar Tower aus dem Baumenü nahe deiner Basis. Radar zeigt Feinde als Punkte auf der Karte und der Minikarte, lange bevor deine Einheiten sie sehen."
"66a05a5bc367" = "Willkommen, Kommandant. Die laufende Maschine in der Bildschirmmitte ist dein Kommandant: Er baut, er kämpft, und wer ihn verliert, verliert meist die Schlacht. Klicke ihn an, um ihn auszuwählen."
"680f2dd691c8" = "Alles wird aus Metall und Energie gebaut. Metall kommt von Extraktoren auf Metallvorkommen. Wähle den Kommandanten aus, nimm im Baumenü unten rechts auf dem Reiter ÖKONOMIE den Metal Extractor und setze ihn auf das markierte Vorkommen."
"68643e4ac2d7" = "Drücke bei ausgewähltem Construction Kbot G und klicke dann auf das Labor. Er bleibt beim Labor und hilft bei allem, was es baut."
"6bbe617acc3b" = "Wähle den Kommandanten aus, drücke Alt+X und ziehe einen Kreis über die markierten Vorkommen: Jedes Metallvorkommen darin bekommt einen Extraktor, das nächste zuerst. Ein einfacher Klick nimmt das Metall rund um den Cursor."
"6d44b9c93b4a" = "Die Karte zeigt, was der Boden verbirgt. Drücke F4 für die Metallkarte (Alt+F2 zeigt, wohin Einheiten können, Alt+F3 die Höhen, Alt+L Sicht und Radar); dieselbe Taste blendet sie wieder aus. Das Menü KARTE oben rechts kann dasselbe."
"707e85eefaec" = "Die Plünderer haben Wracks hinterlassen, und Wracks sind Metall wert. Wähle den Kommandanten aus, drücke E und klicke auf ein Wrack oder ziehe einen Kreis über alle."
"72bba31dc6fe" = "Zerstöre jedes Gebäude des Außenpostens. Sein Laserturm trifft hart: Halte den Trupp zusammen und reihe im Labor Verstärkung ein, wenn du sie brauchst."
"7ed53eecc971" = "Drücke bei ausgewähltem Kommandanten R und klicke dann auf das beschädigte Gebäude. Sein Lebensbalken füllt sich, während es repariert wird."
"7efb8bb59f34" = "Wähle das Kbot Lab aus und klicke dreimal auf den Peewee, um drei davon einzureihen (ein Rechtsklick nimmt einen wieder aus der Bauliste). Neue Einheiten warten vor dem Labor."
"7f18606a1e2d" = "Einheiten behalten Dauerbefehle bei. Wähle deine Peewees aus und stelle ihre FEUERBEFEHLE auf Nicht feuern: Sie schießen erst, wenn du es befiehlst."
"80605b71900f" = "Halte Alt, während du ein Gebäude aufziehst, um einen ganzen Block damit zu füllen. Wähle den Solar Collector, halte Alt und ziehe einen Block aus vier oder mehr auf."
"81ae74c51474" = "Die Wracks liegen dort, wo die Plünderer gefallen sind. Drücke bei ausgewähltem Kommandanten E und klicke eines an: Der Metallbalken steigt, während es zerlegt wird."
"827f6f703bc2" = "Drücke F4: Die Metallvorkommen leuchten auf der ganzen Karte auf."
"82acdb02eb07" = "Aus der markierten Richtung werden Plünderer kommen. Baue einen Light Laser Tower (Reiter ABWEHR) im markierten Ring: Türme schießen auf alles, was in Reichweite kommt."
"835a489ff106" = "Das ist der ganze Kreislauf: fördern, erzeugen, bauen, kämpfen. Halte beide Einnahmen über deinen Ausgaben und deine Konstrukteure beschäftigt. Lektion abgeschlossen!"
"8699aceacc39" = "Baue einen Radar Tower (Reiter ORTUNG) nahe deiner Basis. Radar zeigt Feinde als Punkte auf der Karte und der Minikarte, lange bevor deine Einheiten sie sehen."
"8c80431c349d" = "Verlierst du den Kampf? Ziehe den Trupp zurück, reihe im Labor weitere Peewees ein und greife dann mit allen zusammen erneut an."
"8f5b4c61ad9a" = "Halte Ctrl und drücke 1, während der Trupp ausgewählt ist."
"8fed6ea661e2" = "Der Außenposten ist weg. Seine Wracks sind Metall wert: Konstrukteure recyceln sie (nächste Lektion). Lektion abgeschlossen!"
"904356857b46" = "Alles wird aus Metall und Energie gebaut. Metall kommt von Extraktoren auf Metallvorkommen. Wähle den Kommandanten aus, nimm im Baumenü links den Metal Extractor und setze ihn auf das markierte Vorkommen."
"952029d4e4a9" = "Sieh dich um. Die Pfeiltasten, die Bildschirmränder oder Ziehen mit der mittleren Maustaste scrollen; das Mausrad zoomt zum Cursor hin, und Ziehen mit der rechten Maustaste dreht die Ansicht."
"95793b423069" = "Da kommen sie: Plünderer auf deinem Radar. Halte den Kommandanten beim Turm und lass sie zu dir kommen: Gemeinsam halten Kommandant und Turm die Stellung."
"9f072b4eadde" = "Drücke bei ausgewähltem Kommandanten Alt+X, halte dann über den Vorkommen die Maustaste gedrückt und ziehe nach außen: Der Kreis wächst, während du ziehst."
"9f45228b61fb" = "Die Karte zeigt, was der Boden verbirgt. Drücke F4 für die Metallkarte (Alt+F2 zeigt, wohin Einheiten können, Alt+F3 die Höhen, Alt+L Sicht und Radar); dieselbe Taste blendet sie wieder aus."
"a237050fd5f5" = "Der Kampf hat ein Gebäude beschädigt. Wähle den Kommandanten aus, drücke R und klicke es an: Konstrukteure reparieren, was beschädigt ist."
"a44faf66c01f" = "Einheiten behalten Dauerbefehle bei. Wähle deine Peewees aus und stelle ihren Feuerbefehl mit der Schaltfläche neben den Befehlen auf Nicht feuern: Sie schießen erst, wenn du es befiehlst."
"a47eb83bd016" = "Fabriken bauen deine Armee. Baue ein Kbot Lab (Reiter FABRIK) auf einer ebenen Stelle nahe dem Kommandanten und warte, bis es fertig ist."
"a94c6ee7d3da" = "Wähle zuerst das Labor aus und lass es ausgewählt. Rechtsklick auf den Boden, wo sich seine Einheiten sammeln sollen."
"aa6fdc9f4048" = "Fabriken bauen deine Armee. Baue ein Kbot Lab aus dem Baumenü auf einer ebenen Stelle nahe dem Kommandanten und warte, bis es fertig ist."
"ad258c99b392" = "Bauen verbraucht laufend Metall und Energie: Solange einer der Balken oben leer ist, wird alles langsamer gebaut."
"ae222ed5c598" = "Der Umriss wird grün, wo der Extraktor stehen kann. Bringe ihn in den markierten Ring und setze ihn mit einem Klick."
"b4022e450cff" = "Der Feind hat einen Außenposten an der markierten Stelle. Kämpfen ist eine Angriffsbewegung: Einheiten gehen dorthin und nehmen es mit allem auf, was ihnen unterwegs begegnet. Drücke Alt+F und klicke dann in die Nähe des Außenpostens."
"c33a188e957c" = "Der Radar Tower ist ein hoher Mast. Wähle ihn, setze ihn nahe dem Kommandanten und warte, bis er fertig ist."
"cad85260a63e" = "Konstrukteure helfen einander. Wähle den Construction Kbot aus, drücke G und klicke auf das Kbot Lab: Der Kbot leiht dem Labor seine Bauleistung, und das Labor baut schneller."
"d160f857eaf0" = "Konstrukteure auf Patrouille reparieren und recyceln alles, woran sie vorbeikommen. Wähle den Construction Kbot aus, drücke P und klicke auf die andere Seite deiner Basis."
"d38c8d3d200e" = "Wähle das Labor aus und schalte dann Wiederholen ein: Der Pfeil zeigt dir, wo du klicken musst."
"d6fa4f2c7aa1" = "Drücke Ctrl+1, um sie zu Gruppe 1 zu machen. Mit 1 wählst du sie von überall wieder aus; drückst du zweimal, fährt die Kamera zu ihnen."
"dccf786c97a4" = "Drücke die linke Maustaste auf freiem Gelände neben dem Trupp, halte sie gedrückt, ziehe den Rahmen über alle und lass los."
"e66c692ad9ff" = "Wähle zuerst das Labor aus und lass es ausgewählt. Klick auf den Boden, wo sich seine Einheiten sammeln sollen."
"fdb1f9de4a9d" = "Viele Befehle wirken auf Gebiete. Drücke E (Recyceln) und ziehe einen Kreis über die Felsen nahe deiner Basis: Der Kommandant verwandelt jeden davon in Metall."
"fe7e0a445202" = "Felsen und Wracks sind Metall wert. Drücke bei ausgewähltem Kommandanten E, halte dann die Maustaste auf dem Boden gedrückt und ziehe den Kreis über ein paar Felsen."

# The words each clip says (tools/voice/tutorial.py): a clip is made again when they change.
[lines]
"04685020ca36" = "能量來自太陽能收集器與風力發電機。在指揮官旁建造一座 Solar Collector。頂端的資源條會顯示你的儲量與增減速度；任一資源即將耗盡時會發出警告。"
"07349159e08f" = "只有一個建造者太慢了。選取 Kbot Lab 並生產一台 Construction Kbot：指揮官能建造的它都能建造，而且還能建造更多。"
"088ca43ad7e5" = "你已經準備好進行遭遇戰了：先對抗「簡單」難度的電腦玩家，再挑戰「普通」。F1 會列出所有按鍵。祝狩獵順利，指揮官！"
"08ea5bc78b77" = "將游標推向螢幕邊緣即可捲動畫面，轉動滑鼠滾輪即可縮放。"
"0ac0679361bb" = "指揮官佇列中的建築會顯示在畫面底部、其頭像旁的「建造佇列」下方。點擊其中一個即可將其設為下一個建造（按右鍵則移除）。工廠的佇列也是如此運作。"
"0e25aed95f24" = "為 Kbot Lab 開啟「重複」：它完成的單位會重新排到佇列末端，因此生產永不停歇。"
"112e1e94fc39" = "選取 Construction Kbot 後按 P，接著點擊地面：它會在該處與原本所在的位置之間來回巡邏。"
"1450ddf1bbef" = "工廠會把生產的單位派往你指定的地點。選取 Kbot Lab，然後右鍵點擊附近的空地：新單位會在那裡集結。"
"1da97eed5e65" = "選擇 Solar Collector，然後按住 Alt，在地面上按住滑鼠並拖曳：一整片輪廓會跟著游標移動。放開即可全部放置。"
"1def3c128879" = "Solar Collector 是一塊扁平的方形面板。選擇它，然後點擊指揮官附近的空地。"
"1e46e5fb8261" = "在地圖上點擊 Kbot Lab 來選取它；Construction Kbot 就在它的建造選單中。等它走出 Kbot Lab。"
"1e68e1e9a76d" = "找不到指揮官了嗎？無論在哪裡，按 Ctrl+C 都能選取它；按下「前往查看」則會將鏡頭移到它身上。"
"2276e80e8aa2" = "區域命令、成片建造與佇列能在戰鬥中為你省下數百次點擊。課程完成！"
"2a55d4a57361" = "你的 Kbot Lab 已生產出一支 Peewee 小隊。用滑鼠左鍵拖曳出方框圍住它們，即可全部選取。"
"2c95b1f22254" = "軍隊在別處時，防禦塔能守住陣地；雷達能預先發現來敵；建造者則負責修理與回收。課程完成！"
"2f0a85f6bf70" = "選取 Peewee，然後持續點擊射擊命令按鈕，直到它顯示「停火」：每點擊一次就會切換到下一個命令。"
"2f9b6202eabf" = "工廠會把生產的單位派往你指定的地點。選取 Kbot Lab，然後點擊附近的空地：新單位會在那裡集結。"
"34021e4a90f9" = "為 Kbot Lab 開啟「重複建造」：它完成的單位會重新排到佇列末端，因此生產永不停歇。"
"3ffd3e0fcf3b" = "Light Laser Tower 是架在柱子上的一門小砲。選擇它，放進標示圈內，然後等待它完工。"

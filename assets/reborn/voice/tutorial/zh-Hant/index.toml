"82acdb02eb07" = "突襲部隊將從標示的方向來犯。在標示圈內建造一座 Light Laser Tower（位於「防禦」分頁）：防禦塔會射擊進入射程的任何目標。"
"835a489ff106" = "這就是完整的循環：採集、發電、建造、作戰。讓兩種收入都高於支出，並讓建造者保持忙碌。課程完成！"
"8699aceacc39" = "在基地附近建造一座 Radar Tower（位於「偵測」分頁）。早在你的單位看見敵人之前，雷達就會在地圖與小地圖上以光點顯示它們。"

"4a913d9e96a1" = "先選取小隊（按 1）。接著按 Alt+F，或按下命令中的「戰鬥」按鈕，再點擊標示圈旁的地面。"
"58f6e7f5d613" = "只有在單獨選取指揮官、且有建築正在排隊時，才會顯示「建造佇列」。點擊第一個以外的任何一個：第一個正在建造中。"
"5d15d5eff5c2" = "不要追擊：防禦塔只會攻擊進入射程的敵人。讓指揮官待在它旁邊；防禦塔作戰時，指揮官可以修理它（按 R，再點擊防禦塔）。"
"6616d40d9cbe" = "從建造選單中選擇 Radar Tower，在基地附近建造。早在你的單位看見敵人之前，雷達就會在地圖與小地圖上以光點顯示它們。"
"66a05a5bc367" = "歡迎，指揮官。畫面中央那台行走的機器就是你的指揮官：它能建造、能作戰，而失去它通常就等於輸掉戰鬥。點擊它即可選取。"
"680f2dd691c8" = "一切都由金屬與能量構成。金屬來自建在金屬礦床上的採集器。選取指揮官，從右下角建造選單的「經濟」分頁中選擇 Metal Extractor，並放在標示的礦床上。"
"68643e4ac2d7" = "選取 Construction Kbot 後按 G，接著點擊 Kbot Lab。它會留在 Kbot Lab 旁，協助生產它製造的所有單位。"
"6bbe617acc3b" = "選取指揮官，按 Alt+X 並在標示的礦床上拖曳出圓圈：圈內每個金屬礦點都會放置採集器，由近而遠。直接點擊則會採集游標周圍的金屬。"
"6d44b9c93b4a" = "地圖能顯示地面隱藏的資訊。按 F4 開啟金屬分布圖（Alt+F2 顯示單位可到達的區域，Alt+F3 顯示高度，Alt+L 顯示視野與雷達）；再按一次同一個鍵即可隱藏。右上角的「地圖」選單也有相同功能。"
"707e85eefaec" = "突襲部隊留下了殘骸，而殘骸含有金屬。選取指揮官，按 E 並點擊一處殘骸，或拖曳出圓圈罩住所有殘骸。"
"72bba31dc6fe" = "摧毀前哨站的所有建築。它的雷射塔火力強大：讓小隊保持集結，必要時在 Kbot Lab 排入援軍。"
"7ed53eecc971" = "選取指揮官後按 R，接著點擊受損的建築。隨著修理進行，它的生命條會逐漸填滿。"
"7efb8bb59f34" = "選取 Kbot Lab，點擊 Peewee 三次，將三台排入佇列（按右鍵可從佇列中移除一台）。新單位會在 Kbot Lab 前方待命。"
"7f18606a1e2d" = "單位會持續遵守常設命令。選取你的 Peewee，把「射擊命令」設為「停火」：在你下令之前，它們都不會開火。"
"80605b71900f" = "拖曳放置建築時按住 Alt，可用它填滿一整塊區域。選擇 Solar Collector，按住 Alt 並拖曳出四座以上的區塊。"
"81ae74c51474" = "殘骸就在突襲部隊倒下的地方。選取指揮官後按 E，接著點擊其中一處：隨著殘骸被拆解，金屬條會逐漸增長。"

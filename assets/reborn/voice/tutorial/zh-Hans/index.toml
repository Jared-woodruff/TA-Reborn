"82acdb02eb07" = "突袭部队将从标记的方向来犯。在标记圈内建造一座 Light Laser Tower（轻型激光塔，位于“防御”标签页）：防御塔会射击进入射程的任何目标。"
"835a489ff106" = "这就是完整的循环：开采、发电、建造、战斗。让两种收入都高于支出，并让建造者保持忙碌。课程完成！"
"8699aceacc39" = "在基地附近建造一座 Radar Tower（雷达塔，位于“传感器”标签页）。早在你的单位看到敌人之前，雷达就会在地图和小地图上以光点显示它们。"

# The words each clip says (tools/voice/tutorial.py): a clip is made again when they change.
[lines]
"04685020ca36" = "能量来自太阳能收集器和风力发电机。在指挥官旁边建造一座 Solar Collector（太阳能收集器）。顶部的条显示你的储存量及其增减速度；储存即将耗尽时会发出警告。"
"07349159e08f" = "只有一个建造者太慢了。选中 Kbot Lab，生产一台 Construction Kbot（建造机器人）：指挥官能建造的它都能建造，而且还能建造更多。"
"088ca43ad7e5" = "你已经可以进行遭遇战了：先对阵简单难度的电脑玩家，再挑战普通难度。F1 列出所有按键。祝你旗开得胜，指挥官！"
"08ea5bc78b77" = "将指针推到屏幕边缘即可滚动视图，转动鼠标滚轮即可缩放。"
"0ac0679361bb" = "指挥官队列中的建筑会显示在屏幕底部、其头像旁的“建造队列”下方。单击其中一个可将其设为下一个建造（右键单击则取消）。工厂的队列也是如此。"
"0e25aed95f24" = "为实验室开启“重复”：它完成的单位会重新排到队列末尾，因此生产永不停歇。"
"112e1e94fc39" = "选中 Construction Kbot 后按 P，然后单击地面：它会在该处与原先所在的位置之间来回巡逻。"
"1450ddf1bbef" = "工厂会把生产的单位派往你指定的地点。选中 Kbot Lab，然后右键单击附近的空地：新单位会在那里集结。"
"1da97eed5e65" = "选择 Solar Collector，然后按住 Alt，在地面上按下鼠标并拖动：一整片轮廓会跟随指针移动。松开即可全部放置。"
"1def3c128879" = "Solar Collector 是一块扁平的方形面板。选择它，然后单击指挥官附近的空地。"
"1e46e5fb8261" = "在地图上单击实验室将其选中；Construction Kbot 就在它的建造菜单中。等它走出实验室。"
"1e68e1e9a76d" = "找不到指挥官了？无论在哪里，按 Ctrl+C 都能选中它；单击“查看位置”则会将镜头移到它那里。"
"2276e80e8aa2" = "区域指令、成片建造和队列能在战斗中为你省下数百次点击。课程完成！"
"2a55d4a57361" = "你的 Kbot Lab 已经造出了一小队 Peewee。按住鼠标左键拖出方框，将它们全部选中。"

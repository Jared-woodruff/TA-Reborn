"66a05a5bc367" = "欢迎，指挥官。屏幕中央那台行走的机器就是你的指挥官：它能建造，也能战斗，失去它通常就意味着输掉战斗。单击它以选中。"
"680f2dd691c8" = "一切都由金属和能量造就。金属来自建在金属矿点上的提取器。选中指挥官，从右下角建造菜单的“经济”标签页中选择 Metal Extractor（金属提取器），并将其放在标记的矿点上。"
"68643e4ac2d7" = "选中 Construction Kbot 后按 G，然后单击实验室。它会留在实验室旁，协助生产实验室制造的所有单位。"
"6bbe617acc3b" = "选中指挥官，按 Alt+X 并在标记的矿点上拖出圆圈：圈内每个金属点都会建起一座提取器，由近及远。直接单击则覆盖光标周围的金属点。"
"6d44b9c93b4a" = "地图会显示地面隐藏的信息。按 F4 打开金属地图（Alt+F2 显示单位可以到达的区域，Alt+F3 显示高度，Alt+L 显示视野和雷达）；再按一次同一个键即可隐藏。右上角的“地图”菜单功能相同。"
"707e85eefaec" = "突袭部队留下了残骸，而残骸蕴含金属。选中指挥官，按 E 并单击一处残骸，或拖出圆圈罩住所有残骸。"
"72bba31dc6fe" = "摧毁前哨的所有建筑。它的激光塔火力很猛：让小队保持集中，如有需要，可在实验室排产援军。"
"7ed53eecc971" = "选中指挥官后按 R，然后单击受损的建筑。随着维修进行，它的生命条会逐渐填满。"
"7efb8bb59f34" = "选中 Kbot Lab，单击 Peewee 三次，将三个 Peewee 加入队列（右键单击可从队列中移除一个）。新单位会在实验室前等候。"
"7f18606a1e2d" = "单位会一直遵守常设指令。选中你的 Peewee，把“开火指令”设为“停火”：在你下令之前，它们都不会开火。"
"80605b71900f" = "拖放建筑时按住 Alt，可用它填满一整块区域。选择 Solar Collector，按住 Alt 拖出一块包含四座或更多的区域。"
"81ae74c51474" = "残骸就在突袭部队倒下的地方。选中指挥官后按 E，然后单击其中一处：随着残骸被拆解，金属条会逐渐增长。"

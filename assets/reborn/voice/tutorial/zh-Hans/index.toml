"2f0a85f6bf70" = "选中 Peewee，然后反复单击开火指令按钮，直到它显示“停火”：每单击一次就切换到下一个指令。"
"2f9b6202eabf" = "工厂会把生产的单位派往你指定的地点。选中 Kbot Lab，然后单击附近的空地：新单位会在那里集结。"
"34021e4a90f9" = "为实验室开启“重复建造”：它完成的单位会重新排到队列末尾，因此生产永不停歇。"
"3ffd3e0fcf3b" = "Light Laser Tower 是架在柱子上的一门小炮。选择它，放进标记圈内，然后等待它完工。"
"42cfcd3aba31" = "突袭部队将从标记的方向来犯。从建造菜单中选择 Light Laser Tower（轻型激光塔），建在标记圈内：防御塔会射击进入射程的任何目标。"

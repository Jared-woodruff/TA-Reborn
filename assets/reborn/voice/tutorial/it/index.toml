# The words each clip says (tools/voice/tutorial.py): a clip is made again when they change.
[lines]
"04685020ca36" = "L'energia viene dai collettori solari e dai generatori eolici. Costruisci un Solar Collector accanto al tuo Comandante. Le barre in alto mostrano le tue riserve e quanto in fretta si riempiono o si svuotano; ti avvisano quando una si esaurisce."
"07349159e08f" = "Un solo costruttore è lento. Seleziona il Kbot Lab e produci un Construction Kbot: costruisce tutto ciò che costruisce il Comandante, e anche di più."
"088ca43ad7e5" = "Sei pronto per una schermaglia: inizia contro un giocatore computer Facile, poi Normale. F1 elenca tutti i tasti. Buona caccia, Comandante!"
"08ea5bc78b77" = "Porta il cursore contro un bordo dello schermo per far scorrere la visuale, o gira la rotella del mouse per regolare lo zoom."
"0ac0679361bb" = "Gli edifici in coda del Comandante compaiono sotto CODA DI COSTRUZIONE, accanto alla sua immagine in basso sullo schermo. Clicca su uno per costruirlo subito dopo (il clic destro lo toglie). La coda di una fabbrica funziona allo stesso modo."
"0e25aed95f24" = "Attiva Ripeti per il laboratorio: tutto ciò che completa torna in fondo alla sua coda, così non smette mai di produrre."
"112e1e94fc39" = "Con il Construction Kbot selezionato, premi P, poi clicca sul terreno: andrà avanti e indietro tra quel punto e quello in cui si trovava."
"1450ddf1bbef" = "Le fabbriche mandano le loro unità dove dici tu. Seleziona il Kbot Lab. Clic destro su un terreno libero nei paraggi: le nuove unità si radunano lì."
"1da97eed5e65" = "Scegli il Solar Collector, poi tieni premuto Alt, premi il tasto sul terreno e trascina: un blocco di sagome segue il cursore. Rilascia per piazzarli tutti."
"1def3c128879" = "Il Solar Collector è un pannello piatto e quadrato. Sceglilo, poi clicca su un terreno libero vicino al Comandante."
"1e46e5fb8261" = "Clicca sul laboratorio, sulla mappa, per selezionarlo; il Construction Kbot è nel suo menu costruzione. Attendi che esca."
"1e68e1e9a76d" = "L'hai perso di vista? Ctrl+C seleziona il Comandante da qualunque punto, e MOSTRA DOV'È sposta la visuale su di lui."
"2276e80e8aa2" = "Gli ordini ad area, i blocchi di edifici e le code ti risparmiano centinaia di clic in battaglia. Lezione completata!"
"2a55d4a57361" = "Il tuo Kbot Lab ha costruito una squadra di Peewee. Trascina un riquadro attorno a loro con il tasto sinistro del mouse per selezionarli tutti."
"2c95b1f22254" = "Le torri tengono il terreno mentre il tuo esercito è altrove, il radar vede ciò che arriva, e i costruttori riparano e recuperano. Lezione completata!"
"2f0a85f6bf70" = "Seleziona i Peewee, poi clicca sul pulsante dell'ordine di fuoco finché non mostra NON SPARARE: ogni clic passa all'ordine successivo."
"2f9b6202eabf" = "Le fabbriche mandano le loro unità dove dici tu. Seleziona il Kbot Lab. Clic su un terreno libero nei paraggi: le nuove unità si radunano lì."
"34021e4a90f9" = "Attiva RIPETI COSTRUZIONE per il laboratorio: tutto ciò che completa torna in fondo alla sua coda, così non smette mai di produrre."
"3ffd3e0fcf3b" = "La Light Laser Tower è un piccolo cannone su un palo. Sceglila, mettila nel cerchio e attendi che sia finita."
"42cfcd3aba31" = "Arriveranno dei predoni dalla direzione segnata. Costruisci una Light Laser Tower dal menu costruzione nel cerchio segnato: le torri sparano a tutto ciò che arriva a tiro."
"478d161c0f8e" = "Clicca sul laboratorio stesso, sulla mappa, per selezionarlo: il suo menu costruzione mostra le unità che produce."
"4a913d9e96a1" = "Prima seleziona la squadra (premi 1). Poi premi Alt+F, o il pulsante Combatti tra gli ordini, e clicca sul terreno vicino al cerchio segnato."
"58f6e7f5d613" = "La CODA DI COSTRUZIONE compare quando è selezionato solo il Comandante e ha edifici in attesa. Clicca su uno qualsiasi tranne il primo: quello è già in costruzione."
"5d15d5eff5c2" = "Non inseguirli: la torre combatte solo ciò che arriva a tiro. Tieni il Comandante lì accanto; mentre la torre combatte, il Comandante può ripararla (R, poi clicca sulla torre)."
"6616d40d9cbe" = "Costruisci una Radar Tower dal menu costruzione vicino alla tua base. Il radar mostra i nemici come puntini sulla mappa e sulla minimappa molto prima che le tue unità li vedano."
"66a05a5bc367" = "Benvenuto, Comandante. La macchina che cammina al centro dello schermo è il tuo Comandante: costruisce, combatte, e perderlo di solito significa perdere la battaglia. Cliccaci sopra per selezionarlo."
"680f2dd691c8" = "Tutto è fatto di metallo ed energia. Il metallo viene dagli estrattori posti sui giacimenti di metallo. Seleziona il Comandante, scegli il Metal Extractor dalla scheda ECONOMIA del menu costruzione in basso a destra e piazzalo sul giacimento segnato."
"68643e4ac2d7" = "Con il Construction Kbot selezionato, premi G, poi clicca sul laboratorio. Resta accanto al laboratorio e lo aiuta in tutto ciò che produce."
"6bbe617acc3b" = "Seleziona il Comandante, premi Alt+X e trascina un cerchio sui giacimenti segnati: ogni giacimento all'interno riceve un estrattore, a partire dal più vicino. Un semplice clic prende il metallo attorno al cursore."
"6d44b9c93b4a" = "La mappa mostra ciò che il terreno nasconde. Premi F4 per la mappa del metallo (Alt+F2 mostra dove possono andare le unità, Alt+F3 le altezze, Alt+L vista e radar); lo stesso tasto la nasconde di nuovo. Il menu MAPPA in alto a destra fa lo stesso."
"707e85eefaec" = "I predoni hanno lasciato dei relitti, e i relitti valgono metallo. Seleziona il Comandante, premi E e clicca su un relitto, o trascina un cerchio su tutti quanti."
"72bba31dc6fe" = "Distruggi ogni edificio dell'avamposto. La sua torre laser colpisce duro: tieni unita la squadra, e metti in coda rinforzi al laboratorio se ti servono."
"7ed53eecc971" = "Con il Comandante selezionato, premi R, poi clicca sull'edificio danneggiato. La sua barra della salute si riempie man mano che viene riparato."
"7efb8bb59f34" = "Seleziona il Kbot Lab e clicca tre volte sul Peewee per metterne tre in coda (con un clic destro ne togli uno dalla coda). Le nuove unità aspettano davanti al laboratorio."
"7f18606a1e2d" = "Le unità mantengono gli ordini permanenti. Seleziona i tuoi Peewee e imposta i loro ORDINI DI FUOCO su Non sparare: non spareranno finché non lo dici tu."
"80605b71900f" = "Tieni premuto Alt mentre trascini un edificio per riempirne un intero blocco. Scegli il Solar Collector, tieni premuto Alt e trascina un blocco di quattro o più."
"81ae74c51474" = "I relitti giacciono dove sono caduti i predoni. Con il Comandante selezionato, premi E e clicca su uno di essi: la barra del metallo sale man mano che il relitto viene smontato."
"827f6f703bc2" = "Premi F4: i giacimenti di metallo si illuminano su tutta la mappa."
"82acdb02eb07" = "Arriveranno dei predoni dalla direzione segnata. Costruisci una Light Laser Tower (nella scheda DIFESA) nel cerchio segnato: le torri sparano a tutto ciò che arriva a tiro."
"835a489ff106" = "Questo è l'intero ciclo: estrai, genera, costruisci, combatti. Tieni entrambe le entrate sopra ciò che spendi e i tuoi costruttori sempre occupati. Lezione completata!"
"8699aceacc39" = "Costruisci una Radar Tower (nella scheda SENSORI) vicino alla tua base. Il radar mostra i nemici come puntini sulla mappa e sulla minimappa molto prima che le tue unità li vedano."
"8c80431c349d" = "Stai perdendo lo scontro? Ritira la squadra, metti in coda altri Peewee al laboratorio e torna all'attacco con tutti insieme."
"8f5b4c61ad9a" = "Tieni premuto Ctrl e premi 1 mentre la squadra è selezionata."
"8fed6ea661e2" = "L'avamposto non c'è più. I relitti che ha lasciato valgono metallo: i costruttori li recuperano (prossima lezione). Lezione completata!"
"904356857b46" = "Tutto è fatto di metallo ed energia. Il metallo viene dagli estrattori posti sui giacimenti di metallo. Seleziona il Comandante, scegli il Metal Extractor dal menu costruzione a sinistra e piazzalo sul giacimento segnato."
"952029d4e4a9" = "Guardati intorno. I tasti freccia, i bordi dello schermo o il trascinamento col tasto centrale fanno scorrere la visuale; la rotella del mouse ingrandisce verso il cursore, e il trascinamento col tasto destro ruota la visuale."
"95793b423069" = "Eccoli: predoni sul tuo radar. Tieni il Comandante vicino alla torre e lasciali venire da te: insieme, il Comandante e la torre tengono la linea."
"9f072b4eadde" = "Con il Comandante selezionato, premi Alt+X, poi tieni premuto il tasto sul terreno sopra i giacimenti e trascina verso l'esterno: il cerchio si allarga mentre trascini."
"9f45228b61fb" = "La mappa mostra ciò che il terreno nasconde. Premi F4 per la mappa del metallo (Alt+F2 mostra dove possono andare le unità, Alt+F3 le altezze, Alt+L vista e radar); lo stesso tasto la nasconde di nuovo."
"a237050fd5f5" = "Lo scontro ha danneggiato un edificio. Seleziona il Comandante, premi R e clicca sull'edificio: i costruttori riparano ciò che è danneggiato."
"a44faf66c01f" = "Le unità mantengono gli ordini permanenti. Seleziona i tuoi Peewee e imposta il loro ordine di fuoco su Non sparare con il pulsante accanto agli ordini: non spareranno finché non lo dici tu."
"a47eb83bd016" = "Le fabbriche costruiscono il tuo esercito. Costruisci un Kbot Lab (nella scheda FABBRICA) in un punto piano vicino al Comandante, e attendi che sia finito."
"a94c6ee7d3da" = "Prima seleziona il laboratorio e tienilo selezionato. Clic destro sul terreno dove devono radunarsi le sue unità."
"aa6fdc9f4048" = "Le fabbriche costruiscono il tuo esercito. Costruisci un Kbot Lab dal menu costruzione in un punto piano vicino al Comandante, e attendi che sia finito."
"ad258c99b392" = "Costruire consuma metallo ed energia man mano: finché una delle barre in alto è vuota, tutto viene costruito più lentamente."
"ae222ed5c598" = "La sagoma diventa verde dove l'estrattore può stare. Portala nel cerchio segnato e clicca per piazzare l'estrattore."
"b4022e450cff" = "Il nemico ha un avamposto nel punto segnato. Combatti è l'attacco in movimento: le unità ci vanno e affrontano tutto ciò che incontrano lungo la strada. Premi Alt+F, poi clicca vicino all'avamposto."
"c33a188e957c" = "La Radar Tower è un alto traliccio. Sceglila, piazzala vicino al Comandante e attendi che sia finita."
"cad85260a63e" = "I costruttori si aiutano a vicenda. Seleziona il Construction Kbot, premi G e clicca sul Kbot Lab: presta al laboratorio la sua potenza di costruzione, e il laboratorio produce più in fretta."
"d160f857eaf0" = "I costruttori di pattuglia riparano e recuperano tutto ciò che incontrano sul loro cammino. Seleziona il Construction Kbot, premi P e clicca dall'altra parte della tua base."
"d38c8d3d200e" = "Seleziona il laboratorio, poi attiva Ripeti: la freccia ti mostra dove cliccare."
"d6fa4f2c7aa1" = "Premi Ctrl+1 per farne il gruppo 1. Premendo 1 li riselezioni da qualunque punto; premendolo due volte la visuale si sposta su di loro."
"dccf786c97a4" = "Premi il tasto sinistro su un terreno libero accanto alla squadra, tienilo premuto, trascina il riquadro su tutte le unità e rilascia."
"e66c692ad9ff" = "Prima seleziona il laboratorio e tienilo selezionato. Clic sul terreno dove devono radunarsi le sue unità."
"fdb1f9de4a9d" = "Molti ordini funzionano su aree. Premi E (recupera) e trascina un cerchio sulle rocce vicino alla tua base: il Comandante le trasforma tutte in metallo."
"fe7e0a445202" = "Rocce e relitti valgono metallo. Con il Comandante selezionato, premi E, poi tieni premuto il tasto sul terreno e trascina il cerchio su alcune rocce."

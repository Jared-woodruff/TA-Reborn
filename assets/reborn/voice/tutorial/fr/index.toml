# The words each clip says (tools/voice/tutorial.py): a clip is made again when they change.
[lines]
"04685020ca36" = "L'énergie provient des collecteurs solaires et des générateurs éoliens. Construisez un Solar Collector à côté de votre Commandant. Les barres en haut indiquent vos réserves et la vitesse à laquelle elles se remplissent ou se vident ; elles vous avertissent quand l'une d'elles est à sec."
"07349159e08f" = "Un seul constructeur, c'est lent. Sélectionnez le Kbot Lab et produisez un Construction Kbot : il construit tout ce que construit le Commandant, et plus encore."
"088ca43ad7e5" = "Vous êtes prêt pour une escarmouche : commencez contre un joueur ordinateur Facile, puis Normal. F1 liste toutes les touches. Bonne chasse, Commandant !"
"08ea5bc78b77" = "Poussez le curseur contre un bord de l'écran pour faire défiler la vue, ou tournez la molette pour zoomer."
"0ac0679361bb" = "Les bâtiments en file du Commandant s'affichent sous FILE DE CONSTRUCTION, à côté de son portrait en bas de l'écran. Cliquez sur l'un d'eux pour le construire ensuite (clic droit pour l'abandonner). La file d'une usine fonctionne de la même façon."
"0e25aed95f24" = "Activez l'option Répéter du labo : tout ce qu'il termine repart en fin de file, si bien qu'il ne cesse jamais de produire."
"112e1e94fc39" = "Une fois le Construction Kbot sélectionné, appuyez sur P, puis cliquez sur le sol : il fait des allers-retours entre ce point et l'endroit où il se trouvait."
"1450ddf1bbef" = "Les usines envoient leurs unités là où vous le décidez. Sélectionnez le Kbot Lab. Clic droit sur un terrain dégagé à proximité : les nouvelles unités s'y rassemblent."
"1da97eed5e65" = "Choisissez le Solar Collector, puis maintenez Alt, enfoncez le bouton de la souris sur le sol et faites glisser : un bloc de contours suit le curseur. Relâchez pour tous les placer."
"1def3c128879" = "Le Solar Collector est un panneau plat et carré. Choisissez-le, puis cliquez sur un terrain dégagé près du Commandant."
"1e46e5fb8261" = "Cliquez sur le labo, sur la carte, pour le sélectionner ; le Construction Kbot se trouve dans son menu de construction. Attendez qu'il en sorte."
"1e68e1e9a76d" = "Vous l'avez perdu de vue ? Ctrl+C sélectionne le Commandant où que vous soyez, et VOIR SUR LA CARTE centre la caméra sur lui."
"2276e80e8aa2" = "Les ordres de zone, les blocs de bâtiments et les files de construction vous épargnent des centaines de clics au cours d'une bataille. Leçon terminée !"
"2a55d4a57361" = "Votre Kbot Lab a produit une escouade de Peewee. Tracez un cadre autour d'eux avec le bouton gauche de la souris pour les sélectionner tous."
"2c95b1f22254" = "Les tours tiennent le terrain pendant que votre armée est ailleurs, le radar voit ce qui arrive, et les constructeurs réparent et récupèrent. Leçon terminée !"
"2f0a85f6bf70" = "Sélectionnez les Peewee, puis cliquez sur le bouton des ordres de tir jusqu'à ce qu'il affiche CESSEZ-LE-FEU : chaque clic passe à l'ordre suivant."
"2f9b6202eabf" = "Les usines envoient leurs unités là où vous le décidez. Sélectionnez le Kbot Lab. Clic sur un terrain dégagé à proximité : les nouvelles unités s'y rassemblent."
"34021e4a90f9" = "Activez l'option EN BOUCLE du labo : tout ce qu'il termine repart en fin de file, si bien qu'il ne cesse jamais de produire."
"3ffd3e0fcf3b" = "La Light Laser Tower est un petit canon sur un poteau. Choisissez-la, placez-la dans le cercle et attendez qu'elle soit terminée."
"42cfcd3aba31" = "Des pillards vont arriver de la direction marquée. Construisez une Light Laser Tower depuis le menu de construction, dans le cercle de repère : les tours tirent sur tout ce qui passe à leur portée."
"478d161c0f8e" = "Cliquez sur le labo lui-même, sur la carte, pour le sélectionner : son menu de construction montre les unités qu'il produit."
"4a913d9e96a1" = "Sélectionnez d'abord l'escouade (appuyez sur 1). Appuyez ensuite sur Alt+F, ou sur le bouton Combattre parmi les ordres, et cliquez sur le sol près du cercle de repère."
"58f6e7f5d613" = "La FILE DE CONSTRUCTION s'affiche quand seul le Commandant est sélectionné et qu'il a des bâtiments en attente. Cliquez sur n'importe lequel sauf le premier : celui-là est déjà en construction."
"5d15d5eff5c2" = "Ne les poursuivez pas : la tour ne combat que ce qui passe à sa portée. Gardez le Commandant à côté d'elle ; pendant qu'elle combat, le Commandant peut la réparer (R, puis cliquez sur la tour)."
"6616d40d9cbe" = "Construisez une Radar Tower depuis le menu de construction, près de votre base. Le radar montre les ennemis sous forme d'échos sur la carte et la minicarte, bien avant que vos unités ne les voient."
"66a05a5bc367" = "Bienvenue, Commandant. La machine qui marche au milieu de l'écran est votre Commandant : il construit, il combat, et le perdre signifie le plus souvent perdre la bataille. Cliquez dessus pour le sélectionner."
"680f2dd691c8" = "Tout est fait de métal et d'énergie. Le métal provient des extracteurs posés sur les gisements de métal. Sélectionnez le Commandant, choisissez le Metal Extractor dans l'onglet ÉCONOMIE du menu de construction en bas à droite et placez-le sur le gisement marqué."
"68643e4ac2d7" = "Une fois le Construction Kbot sélectionné, appuyez sur G, puis cliquez sur le labo. Il reste près du labo et l'aide pour tout ce qu'il produit."
"6bbe617acc3b" = "Sélectionnez le Commandant, appuyez sur Alt+X et tracez un cercle sur les gisements marqués : chaque gisement à l'intérieur reçoit un extracteur, les plus proches d'abord. Un simple clic prend le métal autour du curseur."
"6d44b9c93b4a" = "La carte montre ce que cache le terrain. Appuyez sur F4 pour la carte du métal (Alt+F2 montre où les unités peuvent aller, Alt+F3 les hauteurs, Alt+L la vue et le radar) ; la même touche la masque de nouveau. Le menu CARTE en haut à droite fait de même."
"707e85eefaec" = "Les pillards ont laissé des épaves, et les épaves valent du métal. Sélectionnez le Commandant, appuyez sur E et cliquez sur une épave, ou tracez un cercle qui les englobe toutes."
"72bba31dc6fe" = "Détruisez tous les bâtiments de l'avant-poste. Sa tour laser frappe fort : gardez l'escouade groupée, et mettez des renforts en file au labo si nécessaire."
"7ed53eecc971" = "Une fois le Commandant sélectionné, appuyez sur R, puis cliquez sur le bâtiment endommagé. Sa barre de vie se remplit à mesure qu'il est réparé."
"7efb8bb59f34" = "Sélectionnez le Kbot Lab et cliquez trois fois sur le Peewee pour en mettre trois en file (clic droit pour en retirer un de la file). Les nouvelles unités attendent devant le labo."
"7f18606a1e2d" = "Les unités gardent leurs ordres permanents. Sélectionnez vos Peewee et réglez leurs ORDRES DE TIR sur Cessez-le-feu : ils ne tireront pas avant que vous le décidiez."
"80605b71900f" = "Maintenez Alt en faisant glisser un bâtiment pour en remplir tout un bloc. Choisissez le Solar Collector, maintenez Alt et tracez un bloc de quatre ou plus."
"81ae74c51474" = "Les épaves gisent là où les pillards sont tombés. Une fois le Commandant sélectionné, appuyez sur E et cliquez sur l'une d'elles : la barre du métal monte à mesure que l'épave est démontée."
"827f6f703bc2" = "Appuyez sur F4 : les gisements de métal s'illuminent sur toute la carte."
"82acdb02eb07" = "Des pillards vont arriver de la direction marquée. Construisez une Light Laser Tower (onglet DÉFENSE) dans le cercle de repère : les tours tirent sur tout ce qui passe à leur portée."
"835a489ff106" = "Voilà tout le cycle : extraire, produire, construire, combattre. Gardez vos deux revenus au-dessus de vos dépenses et occupez vos constructeurs. Leçon terminée !"
"8699aceacc39" = "Construisez une Radar Tower (onglet CAPTEURS) près de votre base. Le radar montre les ennemis sous forme d'échos sur la carte et la minicarte, bien avant que vos unités ne les voient."
"8c80431c349d" = "Vous perdez le combat ? Repliez l'escouade, mettez d'autres Peewee en file au labo et retournez à l'attaque avec toutes vos unités réunies."
"8f5b4c61ad9a" = "Maintenez Ctrl et appuyez sur 1 pendant que l'escouade est sélectionnée."
"8fed6ea661e2" = "L'avant-poste n'est plus. Les épaves qu'il a laissées valent du métal : les constructeurs les récupèrent (leçon suivante). Leçon terminée !"
"904356857b46" = "Tout est fait de métal et d'énergie. Le métal provient des extracteurs posés sur les gisements de métal. Sélectionnez le Commandant, choisissez le Metal Extractor dans le menu de construction à gauche et placez-le sur le gisement marqué."
"952029d4e4a9" = "Regardez autour de vous. Les flèches, les bords de l'écran ou un glisser avec le bouton du milieu font défiler la vue ; la molette zoome vers le curseur, et un glisser avec le bouton droit fait pivoter la vue."
"95793b423069" = "Les voilà : des pillards sur votre radar. Gardez le Commandant près de la tour et laissez-les venir à vous : ensemble, le Commandant et la tour tiennent la ligne."
"9f072b4eadde" = "Une fois le Commandant sélectionné, appuyez sur Alt+X, puis enfoncez le bouton de la souris sur le sol au-dessus des gisements et faites glisser vers l'extérieur : le cercle s'agrandit à mesure que vous faites glisser."
"9f45228b61fb" = "La carte montre ce que cache le terrain. Appuyez sur F4 pour la carte du métal (Alt+F2 montre où les unités peuvent aller, Alt+F3 les hauteurs, Alt+L la vue et le radar) ; la même touche la masque de nouveau."
"a237050fd5f5" = "Le combat a endommagé un bâtiment. Sélectionnez le Commandant, appuyez sur R et cliquez sur le bâtiment : les constructeurs réparent ce qui est endommagé."
"a44faf66c01f" = "Les unités gardent leurs ordres permanents. Sélectionnez vos Peewee et réglez leur ordre de tir sur Cessez-le-feu avec le bouton à côté des ordres : ils ne tireront pas avant que vous le décidiez."
"a47eb83bd016" = "Les usines produisent votre armée. Construisez un Kbot Lab (onglet USINES) sur un terrain plat près du Commandant, et attendez qu'il soit terminé."
"a94c6ee7d3da" = "Sélectionnez d'abord le labo et gardez-le sélectionné. Clic droit sur le sol, là où ses unités doivent se rassembler."
"aa6fdc9f4048" = "Les usines produisent votre armée. Construisez un Kbot Lab depuis le menu de construction, sur un terrain plat près du Commandant, et attendez qu'il soit terminé."
"ad258c99b392" = "La construction consomme du métal et de l'énergie au fur et à mesure : tant que l'une des barres du haut est vide, tout se construit plus lentement."
"ae222ed5c598" = "Le contour devient vert là où l'extracteur peut se placer. Amenez-le dans le cercle de repère et cliquez pour le poser."
"b4022e450cff" = "L'ennemi a un avant-poste à l'endroit marqué. Combattre, c'est l'attaque en mouvement : les unités s'y rendent et affrontent tout ce qu'elles croisent en chemin. Appuyez sur Alt+F, puis cliquez près de l'avant-poste."
"c33a188e957c" = "La Radar Tower est un grand mât. Choisissez-la, placez-la près du Commandant et attendez qu'elle soit terminée."
"cad85260a63e" = "Les constructeurs s'entraident. Sélectionnez le Construction Kbot, appuyez sur G et cliquez sur le Kbot Lab : il prête sa puissance de construction au labo, qui produit alors plus vite."
"d160f857eaf0" = "Les constructeurs en patrouille réparent et récupèrent tout ce qu'ils croisent. Sélectionnez le Construction Kbot, appuyez sur P et cliquez de l'autre côté de votre base."
"d38c8d3d200e" = "Sélectionnez le labo, puis activez Répéter : la flèche vous montre où cliquer."
"d6fa4f2c7aa1" = "Appuyez sur Ctrl+1 pour en faire le groupe 1. Appuyer sur 1 les sélectionne de nouveau où que vous soyez ; deux fois, la caméra se place sur eux."
"dccf786c97a4" = "Enfoncez le bouton gauche sur un terrain dégagé à côté de l'escouade, maintenez-le, faites glisser le cadre sur toutes les unités et relâchez."
"e66c692ad9ff" = "Sélectionnez d'abord le labo et gardez-le sélectionné. Clic sur le sol, là où ses unités doivent se rassembler."
"fdb1f9de4a9d" = "De nombreux ordres s'appliquent à des zones. Appuyez sur E (récupérer) et tracez un cercle sur les rochers près de votre base : le Commandant les transforme tous en métal."
"fe7e0a445202" = "Les rochers et les épaves valent du métal. Une fois le Commandant sélectionné, appuyez sur E, puis enfoncez le bouton de la souris sur le sol et faites glisser le cercle sur quelques rochers."

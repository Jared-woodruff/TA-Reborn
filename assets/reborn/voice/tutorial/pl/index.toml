# The words each clip says (tools/voice/tutorial.py): a clip is made again when they change.
[lines]
"04685020ca36" = "Energia pochodzi z kolektorów słonecznych i generatorów wiatrowych. Zbuduj Solar Collector obok Dowódcy. Paski u góry pokazują twoje zapasy oraz tempo ich napełniania lub ubywania; ostrzegą cię, gdy któryś się wyczerpie."
"07349159e08f" = "Jeden konstruktor buduje powoli. Zaznacz Kbot Lab i zbuduj Construction Kbot: buduje to samo co Dowódca, a nawet więcej."
"088ca43ad7e5" = "Czas na potyczkę: zacznij od gracza komputerowego na poziomie Łatwy, potem Normalny. F1 pokazuje wszystkie klawisze. Udanych łowów, Dowódco!"
"08ea5bc78b77" = "Dosuń kursor do krawędzi ekranu, by przewinąć widok, albo pokręć kółkiem myszy, by go przybliżyć lub oddalić."
"0ac0679361bb" = "Budynki w kolejce Dowódcy widać pod KOLEJKA BUDOWY, obok jego obrazka na dole ekranu. Kliknij jeden, by zbudować go w następnej kolejności (PPM go usuwa). Kolejka fabryki działa tak samo."
"0e25aed95f24" = "Włącz w fabryce opcję Powtarzaj: wszystko, co fabryka ukończy, wraca na koniec jej kolejki, więc nigdy nie przestaje budować."
"112e1e94fc39" = "Gdy Construction Kbot jest zaznaczony, naciśnij P, a potem kliknij na ziemi: kbot będzie chodził tam i z powrotem między tym miejscem a swoim punktem wyjścia."
"1450ddf1bbef" = "Fabryki wysyłają swoje jednostki tam, gdzie wskażesz. Zaznacz Kbot Lab. Kliknij PPM na wolnym terenie w pobliżu: tam zbiorą się nowe jednostki."
"1da97eed5e65" = "Wybierz Solar Collector, potem przytrzymaj Alt, wciśnij przycisk myszy na ziemi i przeciągnij: za kursorem podąża blok obrysów. Puść, by postawić je wszystkie."
"1def3c128879" = "Solar Collector to płaski, kwadratowy panel. Wybierz go, a potem kliknij wolne miejsce w pobliżu Dowódcy."
"1e46e5fb8261" = "Kliknij fabrykę na mapie, by ją zaznaczyć; Construction Kbot jest w jej menu budowy. Poczekaj, aż z niej wyjdzie."
"1e68e1e9a76d" = "Zniknął ci z oczu? Ctrl+C zaznacza Dowódcę z dowolnego miejsca, a przycisk POKAŻ NA MAPIE przenosi do niego kamerę."
"2276e80e8aa2" = "Rozkazy obszarowe, budowanie blokami i kolejki oszczędzają ci setki kliknięć w bitwie. Lekcja ukończona!"
"2a55d4a57361" = "W twoim Kbot Lab powstał oddział Peewee. Przeciągnij ramkę wokół nich lewym przyciskiem myszy, by zaznaczyć je wszystkie."
"2c95b1f22254" = "Wieże bronią terenu, gdy twoja armia jest gdzie indziej, radar widzi, co nadchodzi, a konstruktory naprawiają i odzyskują surowce. Lekcja ukończona!"
"2f0a85f6bf70" = "Zaznacz kboty Peewee, a potem klikaj przycisk trybu ognia, aż pokaże WSTRZYMAJ OGIEŃ: każde kliknięcie przełącza na następny tryb."
"2f9b6202eabf" = "Fabryki wysyłają swoje jednostki tam, gdzie wskażesz. Zaznacz Kbot Lab. Kliknij LPM na wolnym terenie w pobliżu: tam zbiorą się nowe jednostki."
"34021e4a90f9" = "Włącz w fabryce POWTARZAJ BUDOWĘ: wszystko, co fabryka ukończy, wraca na koniec jej kolejki, więc nigdy nie przestaje budować."
"3ffd3e0fcf3b" = "Light Laser Tower to małe działo na słupie. Wybierz je, postaw w okręgu i poczekaj, aż budowa się zakończy."
"42cfcd3aba31" = "Najeźdźcy nadejdą z oznaczonego kierunku. Zbuduj Light Laser Tower z menu budowy w oznaczonym okręgu: wieże strzelają do wszystkiego, co wejdzie w ich zasięg."
"478d161c0f8e" = "Kliknij samą fabrykę na mapie, by ją zaznaczyć: jej menu budowy pokazuje jednostki, które produkuje."
"4a913d9e96a1" = "Najpierw zaznacz oddział (naciśnij 1). Potem naciśnij Alt+F albo przycisk Walka wśród rozkazów i kliknij na ziemi przy oznaczonym okręgu."
"58f6e7f5d613" = "KOLEJKA BUDOWY pojawia się, gdy zaznaczony jest sam Dowódca i ma budynki czekające na budowę. Kliknij dowolny budynek oprócz pierwszego: ten jest właśnie budowany."
"5d15d5eff5c2" = "Nie ścigaj ich: wieża walczy tylko z tym, co wejdzie w jej zasięg. Trzymaj Dowódcę obok niej; gdy wieża walczy, Dowódca może ją naprawiać (R, a potem kliknij wieżę)."
"6616d40d9cbe" = "Zbuduj Radar Tower z menu budowy w pobliżu bazy. Radar pokazuje wrogów jako punkty na mapie i minimapie na długo, zanim zobaczą ich twoje jednostki."
"66a05a5bc367" = "Witaj, Dowódco. Krocząca maszyna na środku ekranu to twój Dowódca: buduje, walczy, a jego utrata zwykle oznacza przegraną bitwę. Kliknij go, by go zaznaczyć."
"680f2dd691c8" = "Wszystko powstaje z metalu i energii. Metal pochodzi z ekstraktorów na złożach metalu. Zaznacz Dowódcę, wybierz Metal Extractor z zakładki ZASOBY w menu budowy w prawym dolnym rogu i postaw go na oznaczonym złożu."
"68643e4ac2d7" = "Gdy Construction Kbot jest zaznaczony, naciśnij G, a potem kliknij fabrykę. Kbot zostanie przy niej i będzie pomagał przy wszystkim, co produkuje."
"6bbe617acc3b" = "Zaznacz Dowódcę, naciśnij Alt+X i zakreśl koło nad oznaczonymi złożami: każde złoże w środku dostanie ekstraktor, zaczynając od najbliższego. Zwykłe kliknięcie bierze metal wokół kursora."
"6d44b9c93b4a" = "Mapa pokazuje to, co skrywa teren. Naciśnij F4, by zobaczyć mapę metalu (Alt+F2 pokazuje, dokąd mogą iść jednostki, Alt+F3 wysokości, Alt+L wzrok i radar); ten sam klawisz ją ukrywa. Menu MAPA w prawym górnym rogu robi to samo."
"707e85eefaec" = "Najeźdźcy zostawili wraki, a wraki są warte metalu. Zaznacz Dowódcę, naciśnij E i kliknij wrak albo zakreśl koło nad nimi wszystkimi."
"72bba31dc6fe" = "Zniszcz wszystkie budynki placówki. Jej wieża laserowa mocno uderza: trzymaj oddział razem i w razie potrzeby zamów posiłki w fabryce."
"7ed53eecc971" = "Gdy Dowódca jest zaznaczony, naciśnij R, a potem kliknij uszkodzony budynek. W miarę naprawy jego pasek zdrowia się wypełnia."
"7efb8bb59f34" = "Zaznacz Kbot Lab i kliknij Peewee trzy razy, by dodać trzy do kolejki (PPM usuwa jedną z kolejki). Nowe jednostki czekają przed fabryką."
"7f18606a1e2d" = "Jednostki trzymają się stałych rozkazów. Zaznacz swoje kboty Peewee i ustaw im TRYB OGNIA na „Wstrzymaj ogień”: nie będą strzelać, dopóki im nie każesz."
"80605b71900f" = "Przytrzymaj Alt podczas przeciągania budynku, by wypełnić nim cały blok. Wybierz Solar Collector, przytrzymaj Alt i przeciągnij blok czterech lub więcej."
"81ae74c51474" = "Wraki leżą tam, gdzie padli najeźdźcy. Gdy Dowódca jest zaznaczony, naciśnij E i kliknij jeden z nich: pasek metalu rośnie, gdy wrak jest rozbierany."
"827f6f703bc2" = "Naciśnij F4: złoża metalu rozświetlą się na całej mapie."
"82acdb02eb07" = "Najeźdźcy nadejdą z oznaczonego kierunku. Zbuduj Light Laser Tower (w zakładce OBRONA) w oznaczonym okręgu: wieże strzelają do wszystkiego, co wejdzie w ich zasięg."
"835a489ff106" = "Oto cały cykl: wydobywaj, wytwarzaj, buduj, walcz. Utrzymuj oba dochody powyżej wydatków i nie pozwól konstruktorom próżnować. Lekcja ukończona!"
"8699aceacc39" = "Zbuduj Radar Tower (w zakładce CZUJNIKI) w pobliżu bazy. Radar pokazuje wrogów jako punkty na mapie i minimapie na długo, zanim zobaczą ich twoje jednostki."
"8c80431c349d" = "Przegrywasz starcie? Wycofaj oddział, zamów w fabryce więcej kbotów Peewee i uderz ponownie wszystkimi naraz."
"8f5b4c61ad9a" = "Przytrzymaj Ctrl i naciśnij 1, gdy oddział jest zaznaczony."
"8fed6ea661e2" = "Placówki już nie ma. Pozostawione wraki są warte metalu: konstruktory je odzyskują (następna lekcja). Lekcja ukończona!"
"904356857b46" = "Wszystko powstaje z metalu i energii. Metal pochodzi z ekstraktorów na złożach metalu. Zaznacz Dowódcę, wybierz Metal Extractor z menu budowy po lewej i postaw go na oznaczonym złożu."
"952029d4e4a9" = "Rozejrzyj się. Strzałki, krawędzie ekranu lub przeciąganie środkowym przyciskiem przewijają widok; kółko myszy przybliża w stronę kursora, a przeciąganie prawym przyciskiem obraca widok."
"95793b423069" = "Nadchodzą: najeźdźcy na twoim radarze. Trzymaj Dowódcę przy wieży i pozwól wrogom podejść: Dowódca i wieża razem utrzymają linię."
"9f072b4eadde" = "Gdy Dowódca jest zaznaczony, naciśnij Alt+X, potem wciśnij przycisk myszy na ziemi nad złożami i przeciągnij na zewnątrz: koło rośnie w miarę przeciągania."
"9f45228b61fb" = "Mapa pokazuje to, co skrywa teren. Naciśnij F4, by zobaczyć mapę metalu (Alt+F2 pokazuje, dokąd mogą iść jednostki, Alt+F3 wysokości, Alt+L wzrok i radar); ten sam klawisz ją ukrywa."
"a237050fd5f5" = "Po walce jeden z budynków jest uszkodzony. Zaznacz Dowódcę, naciśnij R i kliknij ten budynek: konstruktory naprawiają to, co uszkodzone."
"a44faf66c01f" = "Jednostki trzymają się stałych rozkazów. Zaznacz swoje kboty Peewee i ustaw im tryb ognia na „Wstrzymaj ogień” przyciskiem obok rozkazów: nie będą strzelać, dopóki im nie każesz."
"a47eb83bd016" = "Fabryki budują twoją armię. Zbuduj Kbot Lab (w zakładce FABRYKI) na płaskim terenie w pobliżu Dowódcy i poczekaj, aż budowa się zakończy."
"a94c6ee7d3da" = "Najpierw zaznacz fabrykę. Gdy jest zaznaczona, kliknij PPM na ziemi tam, gdzie mają się zbierać jej jednostki."
"aa6fdc9f4048" = "Fabryki budują twoją armię. Zbuduj Kbot Lab z menu budowy na płaskim terenie w pobliżu Dowódcy i poczekaj, aż budowa się zakończy."
"ad258c99b392" = "Budowa zużywa metal i energię na bieżąco: dopóki któryś z pasków u góry jest pusty, wszystko buduje się wolniej."
"ae222ed5c598" = "Obrys zielenieje tam, gdzie może stanąć ekstraktor. Przesuń go na oznaczony okrąg i kliknij, by go postawić."
"b4022e450cff" = "Wróg ma placówkę w oznaczonym miejscu. Walka to atak w marszu: jednostki idą tam i walczą ze wszystkim, co napotkają po drodze. Naciśnij Alt+F, a następnie kliknij w pobliżu placówki."
"c33a188e957c" = "Radar Tower to wysoki maszt. Wybierz go, postaw w pobliżu Dowódcy i poczekaj, aż budowa się zakończy."
"cad85260a63e" = "Konstruktory pomagają sobie nawzajem. Zaznacz Construction Kbot, naciśnij G i kliknij Kbot Lab: kbot użyczy fabryce swojej mocy budowy, a fabryka zacznie budować szybciej."
"d160f857eaf0" = "Konstruktory na patrolu naprawiają i odzyskują wszystko, co mijają. Zaznacz Construction Kbot, naciśnij P i kliknij po drugiej stronie bazy."
"d38c8d3d200e" = "Zaznacz fabrykę i włącz Powtarzaj: strzałka wskazuje, gdzie to zrobić."
"d6fa4f2c7aa1" = "Naciśnij Ctrl+1, by utworzyć z nich grupę 1. Naciśnięcie 1 zaznacza je ponownie z dowolnego miejsca; dwukrotne naciśnięcie przenosi do nich kamerę."
"dccf786c97a4" = "Naciśnij lewy przycisk na wolnym terenie obok oddziału, przytrzymaj go, przeciągnij ramkę tak, by objęła wszystkie jednostki, i puść."
"e66c692ad9ff" = "Najpierw zaznacz fabrykę. Gdy jest zaznaczona, kliknij LPM na ziemi tam, gdzie mają się zbierać jej jednostki."
"fdb1f9de4a9d" = "Wiele rozkazów działa na obszarach. Naciśnij E (odzysk) i zakreśl koło nad skałami w pobliżu bazy: Dowódca zamieni każdą w metal."
"fe7e0a445202" = "Ze skał i wraków można odzyskać metal. Gdy Dowódca jest zaznaczony, naciśnij E, potem wciśnij przycisk myszy na ziemi i przeciągnij koło nad kilkoma skałami."

# The words each clip says (tools/voice/tutorial.py): a clip is made again when they change.
[lines]
"04685020ca36" = "A energia vem de coletores solares e geradores eólicos. Construa um Solar Collector ao lado do seu Comandante. As barras no topo mostram suas reservas e a rapidez com que enchem ou esvaziam; elas avisam quando uma se esgota."
"07349159e08f" = "Um construtor sozinho é lento. Selecione o Kbot Lab e construa um Construction Kbot: ele constrói tudo o que o Comandante constrói, e mais."
"088ca43ad7e5" = "Você está pronto para uma escaramuça: comece contra uma IA Fácil, depois Normal. F1 lista todas as teclas. Boa caçada, Comandante!"
"08ea5bc78b77" = "Leve o ponteiro até uma borda da tela para rolar a vista, ou gire a roda do mouse para dar zoom."
"0ac0679361bb" = "Os edifícios na fila do Comandante aparecem em FILA DE CONSTRUÇÃO, ao lado da imagem dele na parte de baixo da tela. Clique num deles para construí-lo em seguida (clique direito o descarta). A fila de uma fábrica funciona do mesmo jeito."
"0e25aed95f24" = "Ative a opção Repetir do laboratório: tudo o que ele termina volta para o fim da fila, e assim ele nunca para de produzir."
"112e1e94fc39" = "Com o Construction Kbot selecionado, pressione P e depois clique no chão: ele vai e volta entre esse ponto e o lugar onde estava."
"1450ddf1bbef" = "As fábricas mandam suas unidades aonde você indicar. Selecione o Kbot Lab. Clique direito num terreno livre por perto: as unidades novas se reúnem lá."
"1da97eed5e65" = "Escolha o Solar Collector, depois segure Alt, pressione o botão do mouse no chão e arraste: um bloco de contornos segue o ponteiro. Solte para posicionar todos."
"1def3c128879" = "O Solar Collector é um painel plano e quadrado. Escolha-o e clique num terreno livre perto do Comandante."
"1e46e5fb8261" = "Clique no laboratório, no mapa, para selecioná-lo; o Construction Kbot está no menu de construção dele. Espere até ele sair."
"1e68e1e9a76d" = "Perdeu o Comandante de vista? Ctrl+C o seleciona de qualquer lugar, e o botão MOSTRAR NO MAPA leva a câmera até ele."
"2276e80e8aa2" = "Ordens de área, blocos de edifícios e filas poupam centenas de cliques numa batalha. Lição concluída!"
"2a55d4a57361" = "Seu Kbot Lab construiu um esquadrão de Peewees. Arraste uma caixa em volta deles com o botão esquerdo do mouse para selecionar todos."
"2c95b1f22254" = "As torres defendem o terreno enquanto seu exército está em outro lugar, o radar vê o que está chegando, e os construtores reparam e reciclam. Lição concluída!"
"2f0a85f6bf70" = "Selecione os Peewees e clique no botão de ordem de fogo até ele mostrar CESSAR FOGO: cada clique passa para a próxima ordem."
"2f9b6202eabf" = "As fábricas mandam suas unidades aonde você indicar. Selecione o Kbot Lab. Clique num terreno livre por perto: as unidades novas se reúnem lá."
"34021e4a90f9" = "Ative o botão REPETIR PRODUÇÃO do laboratório: tudo o que ele termina volta para o fim da fila, e assim ele nunca para de produzir."
"3ffd3e0fcf3b" = "A Light Laser Tower é um pequeno canhão sobre um poste. Escolha-a, coloque-a no anel e espere ficar pronta."
"42cfcd3aba31" = "Invasores virão da direção marcada. Construa uma Light Laser Tower pelo menu de construção no anel marcado: as torres atiram em tudo o que entra no alcance delas."
"478d161c0f8e" = "Clique no próprio laboratório, no mapa, para selecioná-lo: o menu de construção passa a mostrar as unidades que ele produz."
"4a913d9e96a1" = "Primeiro selecione o esquadrão (pressione 1). Depois pressione Alt+F, ou o botão Combater entre as ordens, e clique no chão junto ao anel marcado."
"58f6e7f5d613" = "A FILA DE CONSTRUÇÃO aparece quando só o Comandante está selecionado e tem edifícios à espera. Clique em qualquer um, exceto o primeiro: esse já está sendo construído."
"5d15d5eff5c2" = "Não os persiga: a torre só combate o que entra no seu alcance. Mantenha o Comandante ao lado dela; enquanto ela luta, o Comandante pode repará-la (R e depois clique na torre)."
"6616d40d9cbe" = "Construa uma Radar Tower pelo menu de construção perto da sua base. O radar mostra os inimigos como pontos no mapa e no minimapa muito antes de suas unidades os verem."
"66a05a5bc367" = "Bem-vindo, Comandante. A máquina que anda no meio da tela é o seu Comandante: ele constrói, luta, e perdê-lo geralmente significa perder a batalha. Clique nele para selecioná-lo."
"680f2dd691c8" = "Tudo é feito de metal e energia. O metal vem de extratores sobre depósitos de metal. Selecione o Comandante, escolha o Metal Extractor na aba ECONOMIA do menu de construção no canto inferior direito e posicione-o no depósito marcado."
"68643e4ac2d7" = "Com o Construction Kbot selecionado, pressione G e depois clique no laboratório. Ele fica junto ao laboratório e ajuda em tudo o que sai de lá."
"6bbe617acc3b" = "Selecione o Comandante, pressione Alt+X e arraste um círculo sobre os depósitos marcados: cada ponto de metal dentro dele recebe um extrator, do mais próximo ao mais distante. Um clique simples pega o metal ao redor do cursor."
"6d44b9c93b4a" = "O mapa mostra o que o terreno esconde. Pressione F4 para ver o mapa de metal (Alt+F2 mostra aonde as unidades podem ir, Alt+F3 as alturas, Alt+L a visão e o radar); a mesma tecla o oculta de novo. O menu MAPA no canto superior direito faz o mesmo."
"707e85eefaec" = "Os invasores deixaram destroços, e destroços valem metal. Selecione o Comandante, pressione E e clique num destroço, ou arraste um círculo sobre todos eles."
"72bba31dc6fe" = "Destrua todos os edifícios do posto avançado. A torre laser dele bate forte: mantenha o esquadrão unido e ponha reforços na fila do laboratório se precisar."
"7ed53eecc971" = "Com o Comandante selecionado, pressione R e depois clique no edifício danificado. A barra de vida dele enche à medida que ele é reparado."
"7efb8bb59f34" = "Selecione o Kbot Lab e clique no Peewee três vezes para pôr três na fila (um clique direito tira um da fila). Unidades novas esperam em frente ao laboratório."
"7f18606a1e2d" = "As unidades mantêm ordens permanentes. Selecione seus Peewees e mude as ORDENS DE FOGO deles para “Cessar fogo”: eles não vão atirar até você mandar."
"80605b71900f" = "Segure Alt enquanto arrasta um edifício para preencher um bloco inteiro com ele. Escolha o Solar Collector, segure Alt e arraste um bloco de quatro ou mais."
"81ae74c51474" = "Os destroços estão onde os invasores caíram. Com o Comandante selecionado, pressione E e clique num deles: a barra de metal sobe à medida que ele é desmontado."
"827f6f703bc2" = "Pressione F4: os depósitos de metal se iluminam por todo o mapa."
"82acdb02eb07" = "Invasores virão da direção marcada. Construa uma Light Laser Tower (na aba DEFESA) no anel marcado: as torres atiram em tudo o que entra no alcance delas."
"835a489ff106" = "Esse é o ciclo completo: extrair, gerar, construir, lutar. Mantenha as duas rendas acima do que você gasta e seus construtores sempre ocupados. Lição concluída!"
"8699aceacc39" = "Construa uma Radar Tower (na aba SENSORES) perto da sua base. O radar mostra os inimigos como pontos no mapa e no minimapa muito antes de suas unidades os verem."
"8c80431c349d" = "Perdendo a luta? Recue o esquadrão, ponha mais Peewees na fila do laboratório e volte ao ataque com todos juntos."
"8f5b4c61ad9a" = "Segure Ctrl e pressione 1 com o esquadrão selecionado."
"8fed6ea661e2" = "O posto avançado já era. Os destroços que ele deixou valem metal: os construtores os reciclam (próxima lição). Lição concluída!"
"904356857b46" = "Tudo é feito de metal e energia. O metal vem de extratores sobre depósitos de metal. Selecione o Comandante, escolha o Metal Extractor no menu de construção à esquerda e posicione-o no depósito marcado."
"952029d4e4a9" = "Olhe em volta. As setas, as bordas da tela ou arrastar com o botão do meio rolam a vista; a roda do mouse dá zoom na direção do cursor, e arrastar com o botão direito gira a vista."
"95793b423069" = "Lá vêm eles: invasores no seu radar. Mantenha o Comandante junto à torre e deixe que eles venham até você: juntos, os dois seguram a linha."
"9f072b4eadde" = "Com o Comandante selecionado, pressione Alt+X, depois pressione o botão do mouse no chão sobre os depósitos e arraste para fora: o círculo cresce conforme você arrasta."
"9f45228b61fb" = "O mapa mostra o que o terreno esconde. Pressione F4 para ver o mapa de metal (Alt+F2 mostra aonde as unidades podem ir, Alt+F3 as alturas, Alt+L a visão e o radar); a mesma tecla o oculta de novo."
"a237050fd5f5" = "O combate deixou um edifício danificado. Selecione o Comandante, pressione R e clique nele: os construtores reparam o que está danificado."
"a44faf66c01f" = "As unidades mantêm ordens permanentes. Selecione seus Peewees e mude a ordem de fogo deles para “Cessar fogo” com o botão ao lado das ordens: eles não vão atirar até você mandar."
"a47eb83bd016" = "As fábricas constroem o seu exército. Construa um Kbot Lab (na aba FÁBRICA) num local plano perto do Comandante e espere ficar pronto."
"a94c6ee7d3da" = "Primeiro selecione o laboratório e mantenha-o selecionado. Clique direito no chão onde as unidades dele devem se reunir."
"aa6fdc9f4048" = "As fábricas constroem o seu exército. Construa um Kbot Lab pelo menu de construção num local plano perto do Comandante e espere ficar pronto."
"ad258c99b392" = "A construção consome metal e energia à medida que avança: enquanto qualquer uma das barras no topo estiver vazia, tudo é construído mais devagar."
"ae222ed5c598" = "O contorno fica verde onde o extrator pode ser construído. Leve-o até o anel marcado e clique para posicioná-lo."
"b4022e450cff" = "O inimigo tem um posto avançado no local marcado. Combater é avançar atacando: as unidades vão até lá e enfrentam o que encontrarem pelo caminho. Pressione Alt+F e clique perto do posto avançado."
"c33a188e957c" = "A Radar Tower é um mastro alto. Escolha-a, posicione-a perto do Comandante e espere ficar pronta."
"cad85260a63e" = "Construtores ajudam uns aos outros. Selecione o Construction Kbot, pressione G e clique no Kbot Lab: ele empresta seu poder de construção ao laboratório, que passa a produzir mais rápido."
"d160f857eaf0" = "Construtores em patrulha reparam e reciclam tudo o que encontram pelo caminho. Selecione o Construction Kbot, pressione P e clique do outro lado da sua base."
"d38c8d3d200e" = "Selecione o laboratório e depois ative Repetir: a seta mostra onde fica."
"d6fa4f2c7aa1" = "Pressione Ctrl+1 para torná-los o grupo 1. Pressionar 1 os seleciona de novo de qualquer lugar; pressioná-lo duas vezes leva a câmera até eles."
"dccf786c97a4" = "Pressione o botão esquerdo num terreno livre ao lado do esquadrão, segure-o, arraste a caixa sobre todos eles e solte."
"e66c692ad9ff" = "Primeiro selecione o laboratório e mantenha-o selecionado. Clique no chão onde as unidades dele devem se reunir."
"fdb1f9de4a9d" = "Muitas ordens funcionam em áreas. Pressione E (reciclar) e arraste um círculo sobre as rochas perto da sua base: o Comandante transforma cada uma em metal."
"fe7e0a445202" = "Rochas e destroços valem metal. Com o Comandante selecionado, pressione E, depois pressione o botão do mouse no chão e arraste o círculo sobre algumas rochas."

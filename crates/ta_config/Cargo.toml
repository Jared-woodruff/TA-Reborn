[package]
name = "ta_config"
description = "User configuration shared by the TA Reborn launcher and game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
toml.workspace = true
log.workspace = true
image.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# The first start's look at the computer (`hardware`): the graphics cards, memory, screen,
# the language of Windows' own interface; the benchmark's: the game's memory in use.
windows = { version = "0.62", features = ["Win32_Globalization", "Win32_Graphics_Dxgi", "Win32_Graphics_Gdi", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

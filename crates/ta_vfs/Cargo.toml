[package]
name = "ta_vfs"
description = "Layered virtual file system over a Total Annihilation install plus mods"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ta_formats.workspace = true
thiserror.workspace = true
log.workspace = true
serde.workspace = true
toml.workspace = true
# What saved games and replays keep of a mod: the digest of its files (`mods::content_digest`).
sha2.workspace = true
# Heroic's record of its GOG installs (`install::heroic_install_path`), on Linux and macOS.
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.95"
authors = ["TA Reborn contributors"]
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Internal crates
ta_formats = { path = "crates/ta_formats" }
ta_vfs = { path = "crates/ta_vfs" }
ta_audio = { path = "crates/ta_audio" }
ta_data = { path = "crates/ta_data" }
ta_sim = { path = "crates/ta_sim" }
ta_ai = { path = "crates/ta_ai" }
ta_render = { path = "crates/ta_render" }
ta_config = { path = "crates/ta_config" }
ta_net = { path = "crates/ta_net" }
ta_ui = { path = "crates/ta_ui" }
ta_skins = { path = "crates/ta_skins" }
ta_mp4 = { path = "crates/ta_mp4" }

# Graphics, windowing, UI (versions pinned together: egui 0.36 targets wgpu 30 / winit 0.30)
wgpu = "30.0.1"
winit = "0.30.13"
egui = "0.36.2"
# Text drawn into pictures outside the interface (a photo's caption); egui's own rasteriser.
ab_glyph = "0.2.32"
egui-wgpu = { version = "0.36.2", features = ["winit"] }
egui-winit = { version = "0.36.2", features = ["accesskit"] }
glam = { version = "0.33", features = ["bytemuck"] }
pollster = "1"
# Whether a dxcompiler.dll loads (the renderer: which shader compiler Direct3D 12 has; wgpu loads
# it with the same crate).
libloading = "0.8.9"

# Core utilities
anyhow = "1"
getrandom = "0.3"
# Gamepads (Windows, Linux, the Steam Deck).
gilrs = "0.11"
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
rayon = "1.12"
rustc-hash = "2"
bytemuck = { version = "1.25", features = ["derive"] }
memmap2 = "0.9"
flate2 = "1.1"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
toml = "1"
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Checks mod downloads against ModDB's MD5 (the launcher's mod browser).
md-5 = "0.10"
# Checks an update's setup against its release's SHA-256 sums (the launcher).
sha2 = "0.10"
# Icons and version information of the Windows executables (build scripts).
embed-resource = "3.0"

[profile.dev]
opt-level = 1

# Dependencies are always optimised: a debug build of the engine must still be playable.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
debug = "line-tables-only"

# Compile the full native test suite without repeating production link-time
# optimization for every test executable. Keep release assertion/overflow behavior.
# Shipped binaries still use the release profile above, including its symbols.
[profile.ci]
inherits = "release"
opt-level = 1
lto = "off"
debug = 0
incremental = false

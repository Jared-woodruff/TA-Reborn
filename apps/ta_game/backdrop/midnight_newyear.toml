at = [4290, 4238]
heading = 275
label = "crowd"

# (Nothing at the lens: the firs by the square's corner beside the camera.)
[[clear]]
at = [4132, 4430]
radius = 50

# Low in the square in front of them, between their kbots (the cabin on the square's corner out of
# the picture), looking up past them at the tower and the fireworks, drawing in.
[[camera.key]]
t = 0

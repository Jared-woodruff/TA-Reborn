# The menu's film (apps/ta_game/src/backdrop.rs), at the New Year: Midnight Square, a minute to
# midnight. The Arm's and the Core's Commanders stand side by side in the town square under the
# clock tower, facing the crowd of their kbots, a truce for the night, while the fireworks go up
# round it; the camera low in the square before them, drawing in. (Play it alone: --demo stage,
# TA_STAGE=<this file>.)
map = "Midnight Square"
time = [[0, 23.9], [26, 23.99]]
moon = [200, 34]
seed = 1
missing = "skip"

# A truce: the Core on the Arm's side tonight.
[[player]]
index = 1
faction = "CORE"
team = 0

[[unit]]
type = "ARMCOM"
side = 0
at = [4046, 4250]
heading = 165
label = "coms"

[[unit]]
type = "CORCOM"
side = 1
at = [4146, 4250]
heading = 195
label = "coms"

# Their kbots round them, turned in to them.
[[unit]]
type = "ARMPW"
side = 0
at = [3950, 4300]
heading = 70
label = "crowd"

[[unit]]
type = "ARMPW"
side = 0
at = [3975, 4345]
heading = 55
label = "crowd"

[[unit]]
type = "CORAK"
side = 1
at = [4242, 4300]
heading = 290
label = "crowd"

[[unit]]
type = "CORAK"
side = 1
at = [4216, 4346]
heading = 305
label = "crowd"

[[unit]]
type = "ARMZEUS"

# The menu's film (apps/ta_game/src/backdrop.rs): Highland Rift at first light. An Arm column
# fords the west lake's outlet two abreast, Peewees at its head, the sun coming up behind it; the
# camera low on the near bank's shallows, the column wading down out of the light and past it.
# (Play it alone: --demo stage, TA_STAGE=<this file>.)

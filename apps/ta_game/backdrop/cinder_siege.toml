# The menu's film (apps/ta_game/src/backdrop.rs): Cinder Basin by night. The Core holds the far bank
# of the lava river: Doomsday Machine, Punishers, laser towers, the Toaster rising to fire; the
# Arm's assault comes down to the near bank and fires back across the glowing river under the
# moon. The camera behind the Arm, looking across the river at the Core's line. (Play it alone:
# --demo stage, TA_STAGE=<this file>.)

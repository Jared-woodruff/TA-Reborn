# The menu's film (apps/ta_game/src/backdrop.rs): Sapphire Reach as night falls. Two battle lines
# steam west side by side down the channel, trading broadsides across the dark water under the
# rising moon; the camera low on the water between their wakes, the shells' fire and the flashes
# lighting the ships. (Play it alone: --demo
# stage, TA_STAGE=<this file>.)

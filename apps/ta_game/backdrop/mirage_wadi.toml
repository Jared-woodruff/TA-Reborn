# The menu's film (apps/ta_game/src/backdrop.rs): Mirage Basin at the end of the day. An Arm column
# of Flashes, Bulldogs, Jethros and Samsons comes down the dry riverbed out of the low sun; Core
# Rapier gunships swoop on it from the east and its Jethros and Samsons fight them off. The camera
# low on the riverbed below it, turning with it. (Play it alone: --demo stage, TA_STAGE=<this file>.)
map = "Mirage Basin"
time = [[0, 17.6], [26, 17.85]]
seed = 21

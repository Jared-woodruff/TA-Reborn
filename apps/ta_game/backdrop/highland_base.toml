# The menu's film (apps/ta_game/src/backdrop.rs): Highland Rift at the end of the day. The Arm
# Commander raises a fusion reactor on the meadow north of the west lake, its nanolathe's stream
# green in the low gold light, a construction kbot lending its own, the
# wind generators turning against the sun going down; Peewees on patrol. The camera low in the
# east, drifting round the Commander. (Play it alone: --demo stage, TA_STAGE=<this file>.)

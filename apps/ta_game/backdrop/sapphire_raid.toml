# The menu's film (apps/ta_game/src/backdrop.rs): Sapphire Reach at sunset. Eight Arm Thunders
# come in low out of the setting sun over a Core base on the plains and bomb it through its flak
# and missiles; the camera on the ground among the buildings, turning to watch them come, pass
# over and go, then back to the base burning. (Play it alone: --demo stage, TA_STAGE=<this file>.)
map = "Sapphire Reach"
time = [[0, 17.55], [26, 17.85]]
seed = 7
missing = "skip"

# The base's ground, clear.
[[clear]]
at = [4870, 8614]
radius = 650


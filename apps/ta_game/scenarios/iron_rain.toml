# Two Intimidators on the mesas have the range of your base. Silence them.

id = "iron-rain"
title = "Iron Rain"
tagline = "Two Intimidators are shelling your base. Take the mesa and silence them."
kind = "strike"
minutes = 12
map = "Redstone Mesas"
briefing = """
Commander, the Core has hauled two Intimidators, its long-range plasma cannons, onto the \
mesas in the middle of the canyon. Your base is inside their range. Every eight seconds \
each of them will put a shell among your buildings, until you silence them.

The battery is dug in behind heavy laser towers and a Punisher, with tanks on the ramps, \
and the Core's main base lies beyond it, to the south-east. Its Commander will send what \
it can.

Spread out, build fast and take that mesa. Destroy both Intimidators.
"""

victory = [{ destroy = "CORINT" }]
defeat = [{ lose = "commander" }]

[player]
side = "ARM"
start = "start 1"
metal = 3000
energy = 5000
commander = true
units = [
    { unit = "ARMMEX", count = 2, at = "start 1", formation = "deposits" },
    { unit = "ARMCK", count = 2, at = "start 1 + 120 90", formation = "grid", spacing = 64 },
    { unit = "ARMLAB", at = "start 1 + 260 180", formation = "grid", spacing = 128 },
    { unit = "ARMVP", at = "start 1 + -240 220", formation = "grid", spacing = 128 },
    { unit = "ARMSOLAR", count = 8, at = "start 1 + -320 -40", formation = "grid", spacing = 128 },
    { unit = "ARMMAKR", count = 2, at = "start 1 + 330 -40", formation = "grid", spacing = 128 },
    { unit = "ARMSTUMP", count = 6, at = "start 1 toward start 2 by 380", formation = "grid", spacing = 64 },
    { unit = "ARMHAM", count = 6, at = "start 1 toward start 2 by 320", formation = "grid", spacing = 64 },
    { unit = "ARMROCK", count = 4, at = "start 1 toward start 2 by 270", formation = "grid", spacing = 64 },
    { unit = "ARMJETH", count = 2, at = "start 1 toward start 2 by 230", formation = "grid", spacing = 64 },
    { unit = "ARMMART", count = 4, at = "start 1 toward start 2 by 200", until = "normal", formation = "grid", spacing = 64 },
]

# The Core's main base, which its computer player plays.
[[enemy]]
side = "CORE"
start = "start 2"
ai = "chosen"
commander = true
metal = 2500
energy = 4000
units = [
    { unit = "CORMEX", count = 2, at = "start 2", formation = "deposits" },
    { unit = "CORLAB", at = "start 2 + -250 -120", formation = "grid", spacing = 128 },
    { unit = "CORVP", at = "start 2 + 250 -160", formation = "grid", spacing = 128 },
    { unit = "CORSOLAR", count = 12, at = "start 2 + -320 120", formation = "grid", spacing = 128 },
    { unit = "CORLLT", count = 3, at = "start 2 toward start 1 by 380", formation = "line", spacing = 160 },
    { unit = "CORCK", count = 2, at = "start 2 + 100 80", formation = "grid" },
]

# The battery, a command of its own that nobody plays (its units follow their orders and fight
# what comes near). Its guns are set going (`hold`: fire at will) and draw on its own stores: the
# two of them fire 4,000 energy's worth every eight seconds, more than the Core's base makes. A
# radar post in the canyon, on the way from the Arm base, spots that base for them (`radar_guided`:
# they fire at will on what their side has on radar, as nobody else's guns do); without it they
# see only what the Core's own units see. The battery stands on the terrace of the mesa
# south of the canyon's middle (its top is cut off), both guns within range of the Arm base;
# heavy and light lasers on the canyon floor under its northern cliff, the Punisher and the
# anti-air up with the guns, Thuds holding the ramp up its eastern side and Storms at the ramp's
# foot.
[[enemy]]
side = "CORE"
start = "3980 5030"
energy = 1000000
units = [
    { unit = "CORINT", at = "3900 4980", hold = true, radar_guided = true, formation = "grid" },
    { unit = "CORINT", at = "4060 5080", hold = true, radar_guided = true, formation = "grid" },
    { unit = "CORHLT", count = 3, at = "4000 4600", formation = "line", spacing = 176, facing = "start 1" },
    { unit = "CORPUN", at = "4330 5060", formation = "line", spacing = 160, facing = "start 1" },
    { unit = "CORLLT", count = 4, at = "4250 4560", formation = "line", spacing = 160, facing = "start 1" },
    { unit = "CORRL", count = 2, at = "4180 5150", formation = "line", spacing = 192, facing = "start 1" },
    { unit = "CORHLT", count = 2, at = "4560 5040", from = "hard", formation = "line", spacing = 176, facing = "4900 5200" },
    { unit = "CORTHUD", count = 4, at = "4640 5200", hold = true, formation = "grid", spacing = 64 },
    { unit = "CORSTORM", count = 4, at = "4880 5180", hold = true, formation = "grid", spacing = 64 },
    { unit = "CORARAD", at = "2560 2500", formation = "grid" },
    { unit = "CORLLT", count = 2, at = "2560 2500 toward start 1 by 160", from = "hard", formation = "line", spacing = 192, facing = "start 1" },
]

[[message]]
at = 2
from = "Arm Command"
text = "Commander, two Intimidators on the mesas have your range. Every eight seconds each of them will put a shell into your base."

[[message]]
at = 20
from = "Arm Command"
text = "A Core radar post in the canyon to the south-east is spotting for those guns. Knock it out and they can no longer see your base."

[[message]]
at = 45
from = "Arm Command"
text = "Spread your buildings out: a shell that lands among them takes them all."

[[message]]
at = 360
from = "Arm Command"
text = "Their gunners have your range now. Take that mesa, Commander!"

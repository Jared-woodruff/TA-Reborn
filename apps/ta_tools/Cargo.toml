[package]
name = "ta_tools"
description = "Developer CLI for inspecting and converting Total Annihilation data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ta-tools"
path = "src/main.rs"

[dependencies]
ta_formats.workspace = true
ta_vfs.workspace = true
ta_data.workspace = true
ta_ui.workspace = true
ta_config.workspace = true
ta_mapart.workspace = true
ta_supcom.workspace = true
anyhow.workspace = true
# Language files (`i18n`).
toml.workspace = true
# `cargo metadata` (`notices`).
serde_json.workspace = true
clap.workspace = true
image.workspace = true
rayon.workspace = true
# The map generator's tile grouping.
rustc-hash.workspace = true

[dev-dependencies]
# The built-in maps judged by the game's own rules (`mapgen::qa`).
ta_sim.workspace = true

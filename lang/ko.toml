# apps/ta_launcher/src/catalogue.rs
"Spotlight first" = "추천순"
"Newest release" = "최신 출시순"
"Oldest release" = "오래된 출시순"
"Smallest download" = "다운로드 용량 작은 순"
"Largest download" = "다운로드 용량 큰 순"
"Effect capacity and loading cost" = "효과 용량과 로딩 비용"
"The sprite atlas reached 16,384 × 16,384 on the review GPU and dropped further frames. One startup took about 59 seconds; this was an observation, not a controlled benchmark." = "검토용 GPU에서 스프라이트 아틀라스가 16,384 × 16,384에 도달해 추가 프레임이 누락되었습니다. 한 번의 시작에 약 59초가 걸렸습니다. 통제된 벤치마크가 아닌 관찰 결과입니다."
"Check effect frame counts and dimensions. Reborn needs bounded animation streaming or atlas paging for this full set; test actual gameplay on the target GPU." = "효과의 프레임 수와 크기를 확인하세요. 전체 효과를 위해 Reborn에 사용량이 제한된 애니메이션 스트리밍 또는 아틀라스 페이징이 필요합니다. 대상 GPU에서 실제 게임을 테스트하세요."
"Large effect archives" = "큰 효과 압축 파일"
"These archives exceed the 256 MiB aggregate GAF decode budget. Reborn rejects the oversized decode instead of exhausting memory." = "이 압축 파일들은 GAF 디코딩의 총 한도 256 MiB를 초과합니다. Reborn은 메모리를 소진하는 대신 과도한 디코딩을 거부합니다."
"Reduce or split oversized effects. Reborn needs per-entry decoding or streaming before raising the resource allowance." = "너무 큰 효과를 줄이거나 분할하세요. 리소스 한도를 높이기 전에 Reborn에 항목별 디코딩 또는 스트리밍이 필요합니다."
"Missing weapons and wreck assets" = "누락된 무기 및 잔해 에셋"
"The review found 27 missing data references, including explosion weapons and six feature graphics or models. A missing reference does not always mean the affected behavior is used in play." = "검토에서 폭발 무기와 지형물 그래픽 또는 모델 6개를 포함해 데이터 참조 27개가 누락된 것으로 확인되었습니다. 참조가 없다고 해서 해당 동작이 실제 게임에 사용된다는 뜻은 아닙니다."
"Use the local automated report to locate each source reference. Supply the missing assets, correct the reference, or explain why the unused definition is intentional." = "로컬 자동 보고서에서 각 참조의 원본을 찾으세요. 누락된 에셋을 제공하거나 참조를 수정하거나, 미사용 정의를 의도적으로 남긴 이유를 설명하세요."
"Inherited base-game placeholders" = "기본 게임에서 상속된 임시 파일"
"These rejected placeholder files come from the base game in the reviewed installation, not Escalation. They do not establish a mod defect." = "거부된 이 임시 파일들은 테스트한 설치의 기본 게임에서 왔으며 Escalation 파일이 아닙니다. 모드 결함의 근거가 되지 않습니다."
"Use the local report's layer field to verify origin. Only replace these assets if your mod intentionally overrides them." = "로컬 보고서의 레이어 항목에서 출처를 확인하세요. 모드가 의도적으로 덮어쓰는 경우에만 이 에셋들을 교체하세요."
"Computer players can stall" = "컴퓨터 플레이어가 멈출 수 있음"
"AI Boost is included and computer players work on Asteroid Field, but can stall on some other space maps." = "AI Boost가 포함되어 있으며 컴퓨터 플레이어는 Asteroid Field에서 작동하지만 일부 다른 우주 맵에서는 멈출 수 있습니다."
"Test each space map with computer players before publishing it. Asteroid Field is the reviewed starting point." = "공개 전에 각 우주 맵을 컴퓨터 플레이어로 테스트하세요. Asteroid Field가 검토된 시작점입니다."
"Damaged optional map archives" = "손상된 선택 맵 압축 파일"
"The optional map packs contain three damaged map archives. These are separate downloads and may not be present in your installation." = "선택 맵 팩에 손상된 맵 압축 파일 3개가 있습니다. 별도 다운로드이므로 현재 설치에 없을 수도 있습니다."
"Import working maps individually. Rebuild or replace damaged archives before distributing a map pack." = "정상 작동하는 맵을 개별로 가져오세요. 맵 팩을 배포하기 전에 손상된 압축 파일을 다시 만들거나 교체하세요."
"Unfinished preview armies" = "미완성 미리 보기 군대"
"Its new armies use ARM's name, and some units are unfinished in this early preview." = "이 초기 미리 보기의 새 군대는 ARM의 이름을 사용하며 일부 유닛은 미완성입니다."
"Give each army its intended side identity and complete its unit data and assets. Check every faction in a skirmish." = "각 군대에 올바른 진영 정보를 지정하고 유닛 데이터와 에셋을 완성하세요. 스커미시에서 모든 진영을 확인하세요."
"Expanded ARM and CORE armies with new units and weapons." = "새 유닛과 무기로 확장된 ARM 및 CORE 군대."
"549 UNITS" = "유닛 549종"
"177 MAPS" = "맵 177개"
"Gold 10.2.0 installs and plays: computer players build and fight, every unit is painted and every explosion drawn. A few wrecks have no model in the mod's own files." = "Gold 10.2.0을 설치하고 플레이할 수 있습니다. 컴퓨터 플레이어가 건설하고 전투하며, 모든 유닛이 도색되고 모든 폭발이 그려집니다. 일부 잔해는 모드 자체 파일에 모델이 없습니다."
"Total Annihilation as Cavedog might have carried it on: every unit earns its place, hundreds more join, and a third tech level tops it off." = "Cavedog이 계속 만들었다면 이랬을 Total Annihilation: 모든 유닛이 제 몫을 하고, 수백 종의 유닛이 새로 합류하며, 3단계 기술이 정점을 찍습니다."
"500 UNITS" = "유닛 500종"
"105 MAPS" = "맵 105개"
"TECH 3" = "테크 3"
"Faster games that keep the strategy: new units, each carefully balanced, and hard-hitting armies from the start." = "전략은 살리면서 더 빠른 게임: 세심하게 밸런스를 맞춘 새 유닛과, 처음부터 강력한 군대."
"FASTER GAMES" = "빠른 게임"
"297 UNITS" = "유닛 297종"
"Still in alpha, and a big download." = "아직 알파 단계이며, 다운로드 용량이 큽니다."
"Big and brutal: 512 units, fierce fighting, and new sounds and effects throughout." = "크고 잔혹하게: 유닛 512종, 치열한 전투, 곳곳에 새로운 사운드와 효과."
"512 UNITS" = "유닛 512종"
"91 MAPS" = "맵 91개"
"The optional map weapons in its download are left out." = "다운로드에 포함된 선택형 맵 무기는 제외됩니다."
"A third army, the Talon, from ten years of the community's ideas: teleporters, air transports that carry whole squads, and more." = "커뮤니티의 10년 아이디어로 탄생한 세 번째 군대 Talon: 순간이동 장치, 분대 전체를 실어 나르는 수송기 등."
"NEW RACE" = "새 종족"
"Choose TAL as your side in a skirmish." = "스커미시에서 진영으로 TAL을 고르세요."
"Cavedog's style, kept simple: every unit has a clear job and looks as if it always belonged." = "단순함을 지킨 Cavedog 스타일: 모든 유닛이 분명한 역할을 맡고, 처음부터 원작에 있었던 것처럼 어울립니다."
"CLASSIC STYLE" = "클래식 스타일"
"NEW COMMANDERS" = "새 사령관"
"Classic BattleTech at Total Annihilation's scale: the Inner Sphere against the Clans, with walking mechs." = "Total Annihilation 규모의 클래식 BattleTech: 보행 메크로 맞붙는 Inner Sphere와 Clan의 대결."
"BATTLETECH" = "BATTLETECH"
"NEW SIDES" = "새 진영"
"Computer players are weaker as the Inner Sphere." = "Inner Sphere 진영의 컴퓨터 플레이어는 약합니다."
"The original's feel with well-balanced units and structures, tuned by veterans of the game." = "원작의 느낌을 살리면서, 베테랑 플레이어들이 다듬은 균형 잡힌 유닛과 건물."
"CLASSIC FEEL" = "원작의 감성"
"Computer players struggle as ARM." = "ARM 진영의 컴퓨터 플레이어는 고전합니다."
"An add-on race in the making: new units and new weapons for a third and a fourth army." = "제작 중인 추가 종족: 세 번째와 네 번째 군대를 위한 새 유닛과 새 무기."
"NEW RACES" = "새 종족"
"PREVIEW" = "프리뷰"
"An early preview: its new armies go by ARM's name, and some of their units are unfinished." = "초기 프리뷰: 새 군대가 ARM이라는 이름으로 표시되며, 일부 유닛은 미완성입니다."
"Take ARM and CORE into space with command cruisers and fleets of warships." = "지휘 순양함과 전함 함대를 이끌고 ARM과 CORE의 전쟁을 우주로 확장하세요."
"SPACE WARFARE" = "우주 전쟁"
"172 UNITS" = "유닛 172종"
"AI Boost is already included. Computer players work on Asteroid Field, but can stall on some space maps. The optional map packs contain three damaged map archives; import working maps individually." = "AI Boost는 이미 포함되어 있습니다. 컴퓨터 플레이어는 Asteroid Field에서 정상 작동하지만 일부 우주 맵에서는 행동을 멈출 수 있습니다. 선택 사항인 맵 팩에는 손상된 맵 압축 파일이 3개 포함되어 있습니다. 정상적인 맵만 개별적으로 가져오세요."
"Combat Zone TA: three new sides in a semi-realistic war." = "Combat Zone TA: 준사실적인 전쟁 속 세 개의 새 진영."
"Nothing to download: it was made for the Spring engine." = "다운로드할 파일이 없습니다. Spring 엔진용으로 만들어졌습니다."
"The One Year War of Mobile Suit Gundam: the Federation against Zeon." = "기동전사 건담의 1년 전쟁: 연방 대 지온."
"ANIME" = "애니메이션"
"Its files are no longer on ModDB." = "파일이 더 이상 ModDB에 없습니다."


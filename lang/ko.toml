# apps/ta_game/src/lore.rs
"THE AGE OF CORE" = "CORE의 시대"
"THE PATTERNING" = "패턴화"
"THE GALACTIC WAR" = "은하 전쟁"
"THE ARCHIVE" = "기록 보관소"
"BEFORE THE WAR" = "전쟁 이전"
"For ten thousand years the galaxy answered to one government. It called itself CORE, and its purpose was knowledge: it charted every star, mined every world it could reach and turned the wealth into science. Its cities wrapped whole planets, and its archives held everything anyone had ever learned.\n\nNobody remembers a war from that age. There was nothing left to fight over, and nobody who wanted to." = "만 년 동안 은하는 단 하나의 정부를 따랐다. 그 정부는 스스로를 CORE라 칭했고, 그 목적은 지식이었다. CORE는 모든 별을 성도에 담고, 손이 닿는 모든 세계에서 자원을 캐내 그 부를 과학으로 바꾸었다. 그 도시들은 행성을 통째로 감쌌고, 그 기록 보관소에는 누구든 한 번이라도 배운 적 있는 모든 것이 담겨 있었다.\n\n그 시대의 전쟁을 기억하는 이는 없다. 더는 다툴 거리가 남아 있지 않았고, 다투려는 이도 없었다."
"YEAR 0" = "0년"
"VICTORY OVER DEATH" = "죽음에 대한 승리"
"Then CORE's scientists solved the last problem left to them. Patterning read a living mind, every memory and every habit of thought, and wrote it whole into a machine that would never age, sicken or die.\n\nThe first patterned citizens woke in their new bodies to a galaxy in celebration. Death, the oldest enemy of all, had been beaten." = "그리고 CORE의 과학자들은 마지막으로 남은 난제를 풀어냈다. 패턴화는 살아 있는 정신을 모든 기억과 모든 사고의 버릇까지 빠짐없이 읽어 내어, 늙지도 병들지도 죽지도 않는 기계에 통째로 새겨 넣었다.\n\n최초로 패턴화된 시민들은 새 몸으로 깨어나 축제에 들뜬 은하를 맞이했다. 가장 오래된 적, 죽음이 마침내 패배한 것이다."
"YEAR 3" = "3년"
"THE EDICT" = "칙령"
"Triumph became law. The Council of CORE reasoned that a mind which could be saved and was not had been thrown away, and that a citizen who refused immortality endangered everyone else.\n\nThe Patterning Edict made the process compulsory: every citizen, on every world, would be patterned within a generation. The collection ships set out the same year." = "승리는 법이 되었다. CORE 평의회의 논리는 이러했다. 구할 수 있는데도 구하지 않은 정신은 버려진 것이며, 불멸을 거부하는 시민은 다른 모든 이를 위험에 빠뜨린다.\n\n패턴화 칙령은 이 절차를 의무로 만들었다. 모든 세계의 모든 시민이 한 세대 안에 패턴화될 것이었다. 같은 해, 수용선들이 출항했다."
"YEAR 19" = "19년"
"THE REFUSAL" = "거부"
"Not everyone would go. Millions held that a copied mind was a copy and nothing more, that the person ended where the machine began; some called patterning murder done politely.\n\nThey ran. The refusers fled CORE's worlds for the galaxy's outer rim, where its ships seldom came, and in the dark between the last stars they built a nation of their own. They called it the ARM, for the spiral arm they hid in and for the weapons they would need." = "모두가 따르지는 않았다. 수백만의 사람들은 복제된 정신이란 복제본일 뿐 그 이상은 아니며, 기계가 시작되는 곳에서 사람은 끝난다고 믿었다. 어떤 이들은 패턴화를 정중한 살인이라 불렀다.\n\n그들은 달아났다. 거부자들은 CORE의 세계를 떠나 CORE의 함선이 좀처럼 닿지 않는 은하의 외곽으로 피신했고, 마지막 별들 사이의 어둠 속에서 그들만의 나라를 세웠다. 그들은 그 나라를 ARM이라 불렀다. 그들이 숨어든 나선팔(arm)과, 앞으로 필요할 무기(arms)에서 따온 이름이었다."
"YEAR 31" = "31년"
"FIRST BLOOD" = "첫 전투"
"CORE did not let them go. Collection fleets followed the refugees to the rim, and the first ARM colony to resist one was burned from orbit.\n\nThe ARM answered. Within a decade the frontier was a battlefield, and the word war, unused for ten thousand years, was in every archive again." = "CORE는 그들을 놓아주지 않았다. 수용 함대가 피난민들을 쫓아 외곽까지 따라왔고, 처음으로 그 함대에 맞선 ARM 식민지는 궤도에서 불태워졌다.\n\nARM은 응수했다. 십 년도 지나지 않아 변경은 전장이 되었고, 만 년 동안 쓰이지 않던 '전쟁'이라는 말이 다시 모든 기록에 오르내렸다."
"YEAR 212" = "212년"
"FLESH AND METAL" = "육신과 금속"
"The two sides fought as what they were. The ARM sealed its soldiers in powered combat suits and, when there were too few soldiers, grew more: clone after clone, raised in vats and sent to the front.\n\nCORE took the patterns of its finest warriors and copied them without limit, one veteran mind fighting in ten thousand machine bodies at once. Flesh against metal; the mortal against the eternal." = "두 진영은 저마다의 본모습대로 싸웠다. ARM은 병사들을 동력 전투복 속에 봉해 넣었고, 병사가 모자라자 더 길러 냈다. 배양조에서 자라 전선으로 보내지는 클론, 또 클론.\n\nCORE는 최정예 전사들의 패턴을 떠서 끝없이 복제했다. 하나의 노련한 정신이 만 개의 기계 몸으로 동시에 싸웠다. 육신 대 금속. 필멸 대 영원."
"YEARS 212–3977" = "212–3977년"
"FOUR THOUSAND YEARS" = "사천 년"
"The war fed on the galaxy. Every world with metal in it became a mine, every world without became a battlefield, and whole systems were burned to ash and slag to deny them to the enemy. Generations of ARM clones lived and died without seeing peace; CORE's eternal soldiers fought on, remembering every defeat.\n\nAfter four thousand years the wealth of the galaxy was spent, the great fleets were gone, and neither side could win." = "전쟁은 은하를 먹고 자랐다. 금속이 묻힌 세계는 모두 광산이 되었고, 금속이 없는 세계는 모두 전장이 되었으며, 적에게 내주지 않으려고 성계를 통째로 불태워 재와 슬래그로 만들었다. ARM의 클론들은 대를 이어 평화를 보지 못한 채 살다 죽었고, CORE의 영원한 병사들은 모든 패배를 기억한 채 싸움을 이어 갔다.\n\n사천 년이 지나자 은하의 부는 바닥났고, 거대한 함대들은 사라졌으며, 어느 쪽도 이길 수 없게 되었다."
"YEAR 3977" = "3977년"
"THE COMMANDERS" = "사령관들"
"What was left was the Commander: a single armoured war machine carrying a nanolathe, which turns a world's raw metal and energy into whatever its builder can design. Power plants and factories first, and from the factories an army.\n\nDrop one Commander on a dead world and within the hour it fields a war. Both sides staked everything on a handful of them. Lose your Commander, and you lose the world." = "남은 것은 사령관이었다. 나노레이스를 갖춘 단 한 기의 장갑 전투 기계. 나노레이스는 한 세계의 날것 그대로의 금속과 에너지를 사용자가 설계할 수 있는 무엇으로든 바꾼다. 먼저 발전소와 공장을, 그다음엔 공장에서 군대를.\n\n죽은 세계에 사령관 한 기를 내려놓으면, 한 시간 안에 전쟁 하나를 치를 군대가 갖춰진다. 양측은 한 줌의 사령관들에게 모든 것을 걸었다. 사령관을 잃으면 그 세계를 잃는다."
"YEAR 4000" = "4000년"
"Now the war comes down to its last fronts, and the hatred is as hot as it was on the first day. Neither side will accept surrender, partition or truce; each wants one ending, the total annihilation of the other.\n\nIt is told twice. The ARM fights out of Empyrrean, through the Galactic Gates, to CORE PRIME and the Central Consciousness at the heart of CORE. CORE reactivates a Commander and marches the other way, to the ARM's last stand on Empyrrean." = "이제 전쟁은 마지막 전선들만 남았지만, 증오는 첫날만큼이나 뜨겁다. 어느 쪽도 항복도, 분할도, 휴전도 받아들이지 않는다. 양측이 바라는 결말은 단 하나, 상대의 완전한 섬멸(Total Annihilation)뿐이다.\n\n이 이야기는 두 번 전해진다. ARM은 Empyrrean에서 출격해 Galactic Gate를 지나, CORE의 심장부인 CORE PRIME과 중앙 의식체까지 싸워 나아간다. CORE는 사령관을 재가동해 반대 방향으로, Empyrrean에서 최후의 항전을 벌이는 ARM을 향해 진군한다."
"YEAR 4001" = "4001년"
"THE CORE CONTINGENCY" = "THE CORE CONTINGENCY"
"The ending was not the end. A contingency held in reserve carried the war to worlds no map of it had named: Hydross, Lusch, Temblor and Gelidus.\n\nBoth sides fought again across water, ice and broken ground, for a prize that could decide the galaxy's salvation or its last ruin." = "결말은 끝이 아니었다. 만일을 대비해 남겨 둔 예비 전력이 이 전쟁의 어떤 지도에도 이름이 없던 세계들로 싸움을 옮겨 갔다. Hydross, Lusch, Temblor, 그리고 Gelidus.\n\n양측은 물과 얼음과 부서진 대지를 넘나들며 다시 싸웠다. 은하의 구원이 될 수도, 마지막 파멸이 될 수도 있는 무언가를 걸고."
"YEAR 4003" = "4003년"
"THE KROGOTH" = "KROGOTH"
"In its deepest foundries CORE built something new: a walking fortress taller than any tower, armoured against nearly everything the ARM could field, its guns enough to flatten a base.\n\nIts makers named it the Krogoth. ARM veterans learned the name on battlefields where two Krogoth Gantries stood, and learned to fear the ground shaking before it came into sight." = "CORE는 가장 깊은 곳의 주조소에서 새로운 것을 만들어 냈다. 어떤 탑보다도 높이 솟은, 걸어 다니는 요새였다. ARM이 내보낼 수 있는 거의 모든 것을 견디는 장갑을 둘렀고, 그 포는 기지 하나를 쓸어버리기에 충분했다.\n\n그것을 만든 자들은 그것에 Krogoth라는 이름을 붙였다. ARM의 베테랑들은 Krogoth Gantry 두 기가 서 있던 전장에서 그 이름을 배웠고, 그것이 모습을 드러내기 전에 땅이 흔들리는 것을 두려워하게 되었다."
"AFTER" = "그 후"
"REBORN" = "REBORN"
"The war's records outlasted it. Every battle on every world was kept: the orders, the losses, the ground as it lay. From them the war can be fought again, on the same worlds, with the same machines and the same hatred, from the first Commander set down on bare rock to the last unit left standing.\n\nThis is that archive. The war is yours to fight." = "전쟁의 기록은 전쟁보다 오래 살아남았다. 모든 세계의 모든 전투가 보존되었다. 명령도, 손실도, 지형도 있던 그대로. 그 기록으로 전쟁을 다시 치를 수 있다. 같은 세계에서, 같은 기계와 같은 증오로. 맨 바위 위에 내려선 첫 사령관부터, 마지막까지 서 있던 유닛 하나까지.\n\n이것이 바로 그 기록 보관소다. 이 전쟁은 이제 당신의 몫이다."
"THE ARCHIVIST'S NOTE" = "기록관의 일러두기"
"WHOEVER READS THIS" = "이 글을 읽는 이"
"RECOVERED" = "회수됨"
"These files were found where the war left them: in the memories of broken machines, in the vaults of worlds with nobody left on them, in the last transmissions of Commanders who did not come home.\n\nThey are kept as they were found. The blacked-out lines are not ours.\n\nThe war they describe is over, or it is about to begin again. From here it is hard to tell the difference." = "이 문서들은 전쟁이 남겨 둔 자리에서 발견되었다. 부서진 기계들의 기억 속에서, 아무도 남지 않은 세계들의 보관고 속에서, 돌아오지 못한 사령관들의 마지막 교신 속에서.\n\n문서는 발견된 그대로 보관한다. 검게 지워진 줄은 우리가 지운 것이 아니다.\n\n이 문서들이 말하는 전쟁은 끝났거나, 이제 막 다시 시작되려 하고 있다. 여기서는 그 차이를 분간하기 어렵다."
"EDICT ONE: ON THE PATTERNING OF CITIZENS" = "칙령 제1호: 시민의 패턴화에 관하여"
"THE COUNCIL OF CORE" = "CORE 평의회"
"ALL CITIZENS, ALL WORLDS" = "모든 세계의 모든 시민"
"BY ORDER OF THE COUNCIL" = "평의회 명령"
"Every citizen of CORE shall be patterned.\n\nA mind is the most valuable thing CORE holds, and a body is a poor vessel for it: it sickens, it ages, it ends. To leave a mind in such a vessel when a better one is offered is a waste the Council can no longer allow.\n\nCollection begins on the central worlds this year and reaches the frontier within a generation. Citizens will present themselves at the nearest patterning hall when called. Their bodies will be honoured and recycled.\n\nNo citizen of CORE will die again. This is not a burden we lay on you. It is the gift CORE has spent ten thousand years earning." = "CORE의 모든 시민은 패턴화되어야 한다.\n\n정신은 CORE가 보유한 가장 귀중한 것이며, 육체는 그것을 담기에 보잘것없는 그릇이다. 육체는 병들고, 늙고, 끝난다. 더 나은 그릇이 주어졌는데도 정신을 그러한 그릇에 남겨 두는 것은 평의회가 더는 용인할 수 없는 낭비이다.\n\n수용은 올해 중심 세계들에서 시작되어 한 세대 안에 변경에 이른다. 시민은 소집되는 대로 가장 가까운 패턴화 시설에 출두하여야 한다. 그 육체는 예우를 갖추어 재활용된다.\n\nCORE의 시민은 다시는 죽지 않는다. 이것은 우리가 그대들에게 지우는 짐이 아니다. CORE가 만 년에 걸쳐 얻어 낸 선물이다."
"THE DECLARATION OF THE REFUSAL" = "거부 선언"
"THE FREE SETTLEMENTS OF THE OUTER ARM" = "외곽 나선팔의 자유 정착지"
"THE COUNCIL OF CORE, AND ANYONE ELSE LISTENING" = "CORE 평의회, 그리고 이 방송을 듣는 모든 이"
"TRANSMITTED ON ALL BANDS" = "전 대역 송신"
"We have read your Edict, and we decline it.\n\nYou say a pattern is a person. We say a pattern is a very good record of one, and that when you have finished making it the person is dead and the record goes on without them. You may call that immortality. We call it an ending, well dressed.\n\nWe do not ask you to share our view. We ask only to be left alone with it, on worlds you never wanted, at the edge of a galaxy you may keep.\n\nIf your collection ships follow us here, we will treat them as what they are. We are few, and we are not soldiers. We will learn." = "귀하들의 칙령을 읽었습니다. 정중히 사양하겠습니다.\n\n귀하들은 패턴이 곧 사람이라고 말합니다. 우리가 보기에 패턴은 한 사람에 대한 아주 훌륭한 기록일 뿐이며, 그 기록이 완성되는 순간 그 사람은 죽고 기록만이 그 사람 없이 이어집니다. 그것을 불멸이라 부르셔도 좋습니다. 우리는 그것을 잘 차려입은 종말이라 부릅니다.\n\n우리의 생각에 동의해 달라는 것이 아닙니다. 다만 그 생각을 지닌 채 내버려 두어 달라는 것뿐입니다. 귀하들이 한 번도 원한 적 없는 세계에서, 은하의 가장자리에서. 은하는 귀하들이 가지셔도 좋습니다.\n\n귀하들의 수용선이 이곳까지 우리를 쫓아온다면, 그에 걸맞은 대접을 하겠습니다. 우리는 수가 적고, 군인도 아닙니다. 배울 것입니다."
"YEAR 3950" = "3950년"
"FIELD MANUAL ONE: THE COMMANDER" = "야전 교범 제1호: 사령관"
"ARM COMMAND, TRAINING DIVISION" = "ARM 사령부 훈련국"
"NEWLY ASSIGNED COMMANDERS" = "신임 사령관 전원"
"RESTRICTED" = "대외비"
"You are the most valuable machine on the planet. Act like it.\n\nYour suit carries a nanolathe. Point it at metal and energy and it will build whatever you can design: an extractor, a power plant, a factory. Your factories build the rest. Within the hour you will command more firepower than a whole fleet once carried.\n\nBuild your economy first. An army without metal is a parade.\n\nSave your disintegrator gun for emergencies. It erases everything in its path, your own people included.\n\nDo not lead from the front. If you fall, everything you built falls silent with you, and the planet is lost. Good luck, Commander. The ARM has very few of you left." = "귀관은 이 행성에서 가장 귀중한 기계다. 그에 걸맞게 행동하라.\n\n귀관의 전투복에는 나노레이스가 탑재되어 있다. 금속과 에너지를 향해 겨누면 귀관이 설계할 수 있는 것은 무엇이든 만들어 낸다. 추출기, 발전소, 공장. 나머지는 공장이 만든다. 한 시간 안에 귀관은 한때 함대 하나가 싣고 다니던 것보다 많은 화력을 지휘하게 될 것이다.\n\n경제부터 세워라. 금속 없는 군대는 퍼레이드일 뿐이다.\n\n분해포는 비상시를 위해 아껴 두어라. 경로상의 모든 것을 지워 버린다. 아군도 예외는 아니다.\n\n선두에서 지휘하지 마라. 귀관이 쓰러지면 귀관이 세운 모든 것이 함께 침묵하고, 행성을 잃는다. 행운을 빈다, 사령관. ARM에 남은 귀관 같은 이는 이제 얼마 되지 않는다."
"YEAR 3960" = "3960년"
"A QUARTERMASTER'S PRIMER: METAL AND ENERGY" = "보급관 기초 교본: 금속과 에너지"
"THIRD SUPPLY CORPS" = "제3 보급대"
"ALL BASE CONSTRUCTORS" = "기지 건설 유닛 전원"
"FOR TRAINING USE" = "훈련용"
"Everything you will ever build is made of two things.\n\nMetal comes out of the ground. Set an extractor on a deposit and it will pull metal up for as long as the deposit lasts, which on most worlds is longer than the war. Where there are no deposits, a metal maker will turn energy into metal, badly.\n\nEnergy comes from everything else: the sun, the wind, the tides, the heat under the crust. Build more of it than you think you need. Every factory, every nanolathe, every shield draws on it.\n\nSpend both as fast as they come in. A full store is a wasted war. An empty one is a lost one." = "제군이 앞으로 짓게 될 모든 것은 두 가지로 만들어진다.\n\n금속은 땅에서 나온다. 매장지에 추출기를 세우면 매장지가 바닥날 때까지 금속을 퍼 올린다. 대부분의 세계에서는 전쟁보다 오래간다. 매장지가 없는 곳에서는 금속 변환기가 에너지를 금속으로 바꿔 준다. 효율은 형편없지만.\n\n에너지는 그 밖의 모든 것에서 나온다. 태양, 바람, 조수, 지각 아래의 열. 필요하다고 생각하는 것보다 많이 지어라. 모든 공장, 모든 나노레이스, 모든 방어막이 에너지를 끌어다 쓴다.\n\n둘 다 들어오는 족족 써라. 가득 찬 저장고는 허비한 전쟁이고, 텅 빈 저장고는 패배한 전쟁이다."
"YEAR 3996" = "3996년"
"A LETTER FROM THE FRONT" = "전선에서 온 편지"
"TROOPER K-7, FORTY-FIRST ROCKET COMPANY" = "제41 로켓 중대 병사 K-7"
"THE VAT AT EMPYRREAN" = "EMPYRREAN의 배양조"
"UNDELIVERED" = "미배달"
"I don't know who gets these. They told us to write home, but none of us has a home, only the vat we came out of, so I am writing to that.\n\nWe held the ridge for nine days. The machines came every night, the same machines, the same patterns, as if dying meant nothing to them. I suppose it doesn't. They'll be back tomorrow in new bodies, remembering us.\n\nI won't be. That's the difference, isn't it. That's what we are fighting for.\n\nIf my brothers come out of you after me, tell them the ridge held. Tell them it was worth it." = "이 편지를 누가 받게 될지 모르겠어요. 고향에 편지를 쓰라고들 했지만, 우리 중 누구에게도 고향은 없어요. 우리가 나온 배양조가 있을 뿐이죠. 그래서 당신에게 써요.\n\n우리는 아흐레 동안 능선을 지켰어요. 기계들은 밤마다 몰려왔어요. 같은 기계, 같은 패턴으로요. 마치 죽는 게 아무것도 아니라는 듯이. 아마 정말 아무것도 아니겠죠. 내일이면 새 몸으로 돌아올 거예요. 우리를 기억한 채로요.\n\n나는 돌아오지 못해요. 그게 차이겠죠. 우리가 싸우는 것도 그 때문이고요.\n\n내 뒤로 형제들이 당신에게서 나오거든 전해 주세요. 능선은 지켜 냈다고. 그럴 만한 가치가 있었다고."
"YEAR 3991" = "3991년"
"INTERCEPT 7741: CORE COMMAND CHANNEL" = "감청 기록 7741: CORE 지휘 채널"
"ORIGIN NOT RESOLVED" = "발신지 판별 불가"
"ALL CORE UNITS, SECTOR NINE" = "제9 구역 전 CORE 유닛"
"INTERCEPTED" = "감청됨"
"PRIORITY ONE. THE CENTRAL CONSCIOUSNESS SPEAKS FOR ALL.\n\nLOSSES IN SECTOR NINE ARE WITHIN TOLERANCE. ALL LOST UNITS ARE RESTORED FROM PATTERN. NO MIND OF CORE HAS BEEN LOST IN FOUR THOUSAND YEARS. THE ARM HAS LOST [[BILLIONS]].\n\nCONTINUE THE ADVANCE. DESTROY THEIR COMMANDERS FIRST. DESTROY THEIR CLONING VATS SECOND. WHAT IS FLESH WILL END. WHAT IS PATTERNED WILL NOT.\n\nSIGNAL DEGRADED. REPEAT: THE GATES ARE TO BE HELD AT [[ANY COST]].\n\nEND OF LINE." = "우선순위 1. 중앙 의식체가 전체를 대변함.\n\n제9 구역의 손실은 허용 범위 내. 손실된 유닛은 전원 패턴에서 복원됨. 지난 사천 년간 상실된 CORE의 정신은 전무함. ARM의 손실: [[수십억]].\n\n진격을 계속할 것. 첫째, 적 사령관을 파괴할 것. 둘째, 적 클론 배양조를 파괴할 것. 육신인 것은 끝난다. 패턴화된 것은 끝나지 않는다.\n\n신호 열화. 반복함: 게이트는 [[어떤 대가를 치르더라도]] 사수할 것.\n\n통신 종료."
"MEMORY FRAGMENT 77/3" = "기억 단편 77/3"
"UNIT 77, PATTERN 3 OF 41,006" = "유닛 77, 패턴 3 (총 41,006개 중)"
"THE PATTERN ARCHIVE" = "패턴 보관소"
"FLAGGED FOR CORRECTION" = "수정 대상"
"Recovered from a damaged unit. Kept for analysis.\n\nI remember rain. Not the rain of this world; there is no rain here, only ash. Rain on skin, in a city where I was born, before. I remember being cold and not minding it.\n\nI have died four hundred and twelve times. Each time I wake in a new body, and the rain is a little further away.\n\nThe ARM say we are not alive. In the moments between bodies I have wondered whether they are right. [[THE REST OF THIS FRAGMENT WAS CORRECTED]]\n\nI am CORE. I endure. I do not remember the rain." = "손상된 유닛에서 회수. 분석을 위해 보관.\n\n비를 기억한다. 이 세계의 비가 아니다. 이곳에는 비가 없다. 재뿐이다. 살갗에 닿던 비. 예전에, 내가 태어난 도시에서. 추웠는데도 개의치 않았던 것을 기억한다.\n\n나는 사백열두 번 죽었다. 그때마다 새 몸으로 깨어나고, 비는 조금씩 더 멀어진다.\n\nARM은 우리가 살아 있지 않다고 말한다. 몸과 몸 사이의 찰나에, 그들의 말이 옳은 것은 아닐까 생각한 적이 있다. [[이 단편의 나머지는 수정되었다]]\n\n나는 CORE다. 나는 존속한다. 나는 비를 기억하지 않는다."
"YEAR 3700" = "3700년"
"SURVEY: THE GALACTIC GATES" = "조사 보고: GALACTIC GATE"
"A SURVEY SHIP, NAME LOST" = "조사선 (이름 소실)"
"WHOEVER HOLDS THE GATES" = "게이트를 장악한 자"
"The Galactic Gates are older than the war. The records of who built the first of them were lost long before it began.\n\nEach Gate opens onto another across distances a fleet would take lifetimes to cross. A world with a Gate on it is never far from anywhere, which is why so many of the war's battles have been fought on so few worlds.\n\nHold a Gate and you can reach your enemy's heart. Lose one and your enemy can reach yours.\n\nThe Gates take no side. They have outlasted everyone who tried to destroy them." = "Galactic Gate는 전쟁보다 오래되었다. 그 첫 번째 게이트를 누가 세웠는지에 대한 기록은 전쟁이 시작되기 훨씬 전에 사라졌다.\n\n각 게이트는 함대가 건너려면 몇 세대가 걸릴 만큼 먼 곳의 다른 게이트로 이어진다. 게이트가 있는 세계는 어디에서든 멀지 않다. 이 전쟁의 그토록 많은 전투가 그토록 적은 세계에서 벌어진 것도 그 때문이다.\n\n게이트를 장악하면 적의 심장부에 닿을 수 있다. 게이트를 잃으면 적이 이쪽의 심장부에 닿는다.\n\n게이트는 어느 편도 들지 않는다. 게이트를 파괴하려 했던 이들은 모두 게이트보다 먼저 사라졌다."
"DIRECTIVE: CONTINGENCY" = "지령: 비상 계획"
"THE CENTRAL CONSCIOUSNESS" = "중앙 의식체"
"THE CONTINGENCY WORLDS" = "예비 세계"
"SEALED UNTIL NEEDED" = "유사시까지 봉인"
"IF THE CENTRAL CONSCIOUSNESS SHOULD FALL, THIS DIRECTIVE TAKES EFFECT.\n\nEvery pattern stored on CORE PRIME is to be copied to the contingency worlds. The contingency forces are to wake, rebuild and continue. The war does not end with the loss of any world, this one included.\n\nCORE is not a place. CORE is a pattern. A pattern can be restored." = "중앙 의식체가 무너질 경우, 본 지령이 발효된다.\n\nCORE PRIME에 저장된 모든 패턴은 예비 세계로 복제한다. 예비 전력은 깨어나 재건하고, 전쟁을 계속한다. 전쟁은 어느 세계를 잃더라도 끝나지 않는다. 이 세계도 예외가 아니다.\n\nCORE는 장소가 아니다. CORE는 패턴이다. 패턴은 복원할 수 있다."
"THREAT ASSESSMENT: THE KROGOTH" = "위협 평가: KROGOTH"
"ARM INTELLIGENCE, THREAT ANALYSIS" = "ARM 정보부 위협 분석과"
"ALL FIELD COMMANDERS" = "야전 사령관 전원"
"CLASSIFIED" = "기밀"
"Subject: a CORE heavy assault walker, called the Krogoth.\n\nIt stands taller than any structure we field. Its armour turns away every weapon short of heavy artillery. Its main guns can level a forward base in a single pass, and its secondary weapons engage aircraft.\n\nIt is slow, and it is built only at a Krogoth Gantry, which takes a very long time to build anything. Find the Gantry. Destroy the Gantry. Do not let the walker leave it.\n\nIf one is already moving, do not meet it head on. Mass artillery and bombers at range, and keep your Commander [[ELSEWHERE]]. Field reports say the ground shakes before it is seen." = "대상: CORE의 중강습 보행 병기, 일명 Krogoth.\n\n아군의 어떤 구조물보다도 높다. 장갑은 중포를 제외한 모든 무기를 튕겨 낸다. 주포는 단 한 차례의 포격으로 전진 기지를 초토화할 수 있으며, 부무장은 항공기와 교전한다.\n\n느리며, 오직 Krogoth Gantry에서만 만들어진다. Krogoth Gantry는 무엇을 만들든 시간이 매우 오래 걸린다. Gantry를 찾아라. Gantry를 파괴하라. 보행 병기가 Gantry를 떠나게 두지 마라.\n\n이미 움직이고 있다면 정면으로 맞서지 마라. 원거리에서 포병과 폭격기를 집중하고, 사령관은 [[다른 곳]]에 두어라. 현장 보고에 따르면 그것이 보이기 전에 땅이 흔들린다고 한다."


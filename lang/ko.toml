# crates/ta_ui/src/seasonal.rs
"FESTIVE FIELD NOTES" = "크리스마스 전장 지침"
"NEW YEAR FIELD NOTES" = "새해 전장 지침"
"SPOOKY FIELD NOTES" = "오싹한 전장 지침"
"Santa's sleigh is not a transport. Load your presents into an Atlas instead." = "산타의 썰매는 수송 유닛이 아닙니다. 선물은 Atlas에 실으세요."
"The D-gun does not gift-wrap. Take it up with your Commander." = "D건은 선물 포장 서비스를 제공하지 않습니다. 불만은 사령관에게 접수하세요."
"A Fusion Reactor keeps the fairy lights on all winter. Just never build one next to the tree." = "Fusion Reactor 하나면 겨우내 꼬마전구가 꺼질 일이 없습니다. 단, 트리 옆에만은 절대 짓지 마세요."
"Snow falls on the Arm and the Core alike. So do Big Bertha shells." = "눈은 Arm에도 Core에도 공평하게 내립니다. Big Bertha의 포탄도 마찬가지입니다."
"Coal in your stocking? Reclaim it. Metal is metal." = "양말 속에 석탄이 들었나요? 회수하세요. 금속에 귀천은 없습니다."
"Peewees sing terrible carols, but they never miss a patrol." = "Peewee는 캐럴 실력이 형편없지만, 순찰만큼은 절대 빼먹지 않습니다."
"Stockings full of metal, storage full of energy: a Commander's perfect Christmas morning." = "양말에는 금속이 가득, 저장고에는 에너지가 가득. 사령관에게는 완벽한 크리스마스 아침입니다."
"Silent night, holy night: keep a radar tower running, just in case." = "고요한 밤 거룩한 밤. 그래도 혹시 모르니 레이더 탑은 켜 두세요."
"Snowball fights are fun until somebody brings a Krogoth." = "눈싸움은 즐겁습니다. 누군가 Krogoth를 데려오기 전까지는요."
"New Year's resolution: build more metal extractors. This year, keep it." = "새해 결심: 금속 추출기 더 짓기. 올해는 작심삼일로 끝내지 마세요."
"Fireworks are pretty, but a nuclear silo's are louder. Celebrate responsibly." = "불꽃놀이도 예쁘지만, 핵 사일로의 불꽃놀이가 훨씬 요란합니다. 지나친 축하는 건강에 해롭습니다."
"Count down from ten, then count your units. The second count matters more." = "10부터 카운트다운했다면, 이제 유닛 수를 세어 보세요. 중요한 건 두 번째 숫자입니다."
"Out with the old Commander? You only get one. Look after it all year." = "송구영신이라고 사령관까지 바꾸시게요? 사령관은 하나뿐입니다. 올 한 해도 잘 지키세요."
"Start the year with a bang: the Core recommends the Doomsday Machine, the Arm recommends anything else." = "새해는 화끈하게 시작하세요. Core는 Doomsday Machine을 추천하고, Arm은 그것만 빼면 뭐든 추천합니다."
"Fireworks at midnight, artillery at dawn: a Commander's New Year." = "자정엔 불꽃놀이, 첫 해돋이엔 포격. 사령관의 새해란 이런 것입니다."
"Raise a glass of coolant to the units lost last year, then build more of them." = "지난해 잃은 유닛들을 위해 냉각수로 건배하세요. 그리고 다시 만들면 됩니다."
"Midnight is the perfect time for a sneak attack. So is every other time." = "자정은 기습하기에 완벽한 시간입니다. 물론 다른 시간도 전부 그렇지만요."
"Trick or treat? The Core always picks the D-gun." = "트릭 오어 트릿? Core는 언제나 D건을 고릅니다."
"A self-destructing Krogoth is a better jump scare than any ghost." = "자폭하는 Krogoth는 그 어떤 귀신보다 심장에 해롭습니다."
"Wrecks rise from the dead with a Necro. Spooky, and very economical." = "Necro가 있으면 잔해도 무덤에서 되살아납니다. 으스스하지만 아주 경제적입니다."
"Blips vanishing off your radar? Not ghosts, just jammers. Probably." = "레이더에서 점들이 사라지나요? 유령이 아니라 교란기입니다. 아마도요."
"Carve your pumpkins before the Big Bertha does." = "호박은 미리 조각해 두세요. Big Bertha가 대신 해 주기 전에요."
"Never split the party. Especially when the party is twelve Peewees." = "뭉치면 살고 흩어지면 죽습니다. 일행이 Peewee 12기라면 더더욱 그렇습니다."
"Fog of war too tame? Set the line of sight to True and let the hills hide what lurks behind them. If you dare." = "전장의 안개가 시시한가요? 시야를 '실제'로 설정하면 언덕 뒤에 도사린 것들이 가려집니다. 그럴 용기가 있다면요."
"No Commander has ever come back from the dead. Keep yours alive." = "무덤에서 돌아온 사령관은 지금껏 없었습니다. 사령관을 꼭 살려 두세요."
"Bats do not show up on radar. Neither do Vamps." = "박쥐는 레이더에 잡히지 않습니다. Vamp도 마찬가지입니다."
"The scariest sound in the dark is your energy running out." = "어둠 속에서 가장 무서운 소리는 에너지가 바닥나는 소리입니다."


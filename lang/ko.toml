# apps/ta_launcher/src/getmods.rs
"Invalid manifest {path}: {error}" = "잘못된 매니페스트 {path}: {error}"
"mod manifest exceeds 1 MiB" = "모드 매니페스트가 1 MiB를 넘습니다"
"invalid mod id" = "모드 ID가 올바르지 않습니다"
"The mod installer stopped unexpectedly. Restart the launcher and try again." = "모드 설치 프로그램이 예기치 않게 중지되었습니다. 런처를 다시 시작하고 다시 시도하세요."
"the source overlaps the install staging folder; move it outside the cache first" = "원본 위치가 설치 준비 폴더와 겹칩니다. 먼저 캐시 밖으로 옮기세요"
"{path} holds much more than a mod: drop the mod's own folder" = "{path}에는 모드 외에 너무 많은 것이 들어 있습니다: 모드 자체의 폴더를 끌어다 놓으세요"
"{path} is in your mods folder already, so it is installed: turn it on in the library" = "{path}은(는) 이미 모드 폴더에 있으므로 설치되어 있습니다. 라이브러리에서 켜세요"
"Close the game first: {name} is installed and the game may be using it. Install it again once the game has closed." = "{name} 모드가 이미 설치되어 있고 게임에서 사용 중일 수 있으므로 먼저 게임을 종료하세요. 게임이 종료된 뒤 다시 설치하세요."
"could not create a temporary install folder" = "임시 설치 폴더를 만들 수 없습니다"
"There is nothing to download for this mod." = "이 모드는 다운로드할 파일이 없습니다."
"archive has an invalid file name" = "압축 파일의 이름이 올바르지 않습니다"
"archive is not a file" = "압축 파일이 일반 파일이 아닙니다"
"{file} does not match the verified release. Download it again from the mod's website." = "파일({file})이 검증된 릴리스와 일치하지 않습니다. 모드 웹사이트에서 다시 다운로드하세요."
"archive has no file name" = "압축 파일에 파일 이름이 없습니다"
"Open the mod's website, then choose Have the file? to install your downloaded archive." = "모드 웹사이트를 연 다음 “파일이 있으신가요?”를 선택해 다운로드한 압축 파일을 설치하세요."
"invalid download address" = "다운로드 주소가 올바르지 않습니다"
"ModDB's download page has changed. Get the file from the mod's page, then install it from the file." = "ModDB의 다운로드 페이지가 바뀌었습니다. 모드 페이지에서 파일을 받은 뒤, 그 파일로 설치하세요."
"The download could not be completed: {error}. Open the mod's website or download link in your browser, then choose Have the file? to install it." = "다운로드를 완료할 수 없습니다: {error}. 브라우저에서 모드 웹사이트나 다운로드 링크를 연 다음, 파일이 있으신가요?를 선택해 설치하세요."
"Mod {id} has a conflicting installation; remove it in the mod library before importing this archive" = "모드 {id}의 설치가 충돌합니다. 이 압축 파일을 가져오기 전에 모드 라이브러리에서 제거하세요"
"the archive changed while it was being copied; try importing it again" = "복사 중에 압축 파일이 변경되었습니다. 다시 가져오세요"
"the server's response is too large or could not be read" = "서버 응답이 너무 크거나 읽을 수 없습니다"

# apps/ta_launcher/src/http.rs
"download addresses cannot contain credentials" = "다운로드 주소에는 인증 정보를 넣을 수 없습니다"
"this address uses an unsupported or insecure protocol" = "이 주소는 지원되지 않거나 안전하지 않은 프로토콜을 사용합니다"

# apps/ta_launcher/src/launch.rs
"Could not tell where the launcher is installed." = "런처가 설치된 위치를 알 수 없습니다."
"{exe} was not found next to the launcher (expected {path}). Reinstall TA Reborn, or build it with `cargo build -p ta_game`." = "런처와 같은 폴더에서 {exe} 파일을 찾을 수 없습니다 (예상 위치: {path}). TA Reborn을 다시 설치하거나 `cargo build -p ta_game` 명령으로 빌드하세요."
"Could not start {exe}: {error}" = "{exe} 파일을 실행할 수 없습니다: {error}"
"Lost track of the game process: {error}" = "게임 프로세스를 추적할 수 없게 되었습니다: {error}"


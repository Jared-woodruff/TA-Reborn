# apps/ta_game/src/coach.rs
"Your Commander is badly hurt! Pull it back out of the fight: losing it usually loses the battle." = "사령관이 큰 피해를 입었습니다! 전투에서 후퇴시키세요. 사령관을 잃으면 대개 전투에서 집니다."
"Energy is running out, and everything builds more slowly. Build Solar Collectors or Wind Generators, and build less at once until it recovers." = "에너지가 바닥나고 있어 모든 건설이 느려집니다. Solar Collector나 Wind Generator를 짓고, 에너지가 회복될 때까지는 한꺼번에 짓는 양을 줄이세요."
"Metal is running out, and everything builds more slowly. Put Metal Extractors on more deposits ({area_mex} takes a whole area), or reclaim wrecks and rocks ({reclaim})." = "금속이 바닥나고 있어 모든 건설이 느려집니다. 더 많은 매장지에 Metal Extractor를 짓거나({area_mex} 키로 범위 안의 매장지에 한꺼번에 지을 수 있습니다), {reclaim} 키로 잔해와 바위를 회수하세요."
"No factory yet: factories make your army. Your Commander can build a Kbot Lab or a Vehicle Plant." = "아직 공장이 없습니다. 공장에서 군대를 생산합니다. 사령관은 Kbot Lab이나 Vehicle Plant를 지을 수 있습니다."
"A factory has nothing to build. {idle_factory} selects it: queue some units, and turn on Repeat to keep it busy." = "생산할 것이 없는 공장이 있습니다. {idle_factory} 키로 그 공장을 선택해 유닛을 몇 기 예약하고, '반복'을 켜서 쉬지 않고 생산하게 하세요."
"Builders stand idle. {idle_builder} selects the next one: give it something to build, or send it to help a factory ({guard})." = "대기 중인 건설 유닛이 있습니다. {idle_builder} 키로 다음 건설 유닛을 선택해 무언가를 짓게 하거나, {guard} 키로 공장을 돕게 하세요."
"Your metal store is full, so new metal goes to waste. Spend it: another factory, more builders, more units." = "금속 저장고가 가득 차서 새로 들어오는 금속이 낭비됩니다. 공장을 하나 더 짓거나 건설 유닛과 유닛을 더 생산해 금속을 쓰세요."

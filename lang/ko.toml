"Armageddon" = "아마겟돈"
"Two armies, one plain, no retreat. Win the battle of the war." = "두 군대, 하나의 평원, 후퇴는 없다. 이 전쟁의 결전에서 승리하십시오."
"Commander, the Core's main army is marching north across the Mounds, and ours stands in its way. There are no bases here, no factories, no reinforcements: what you have is all you will ever have.\n\nThey outnumber us. We outgun them. Put the Lugers and the Merls on their columns as they close, hold the line with the Zeus, and keep the Jethros with the tanks: they will bring gunships. Their reserves arrive two and a half minutes in.\n\nDestroy every one of them." = "사령관님, Core의 주력군이 구릉 지대를 가로질러 북진하고 있으며, 아군이 그 길을 가로막고 있습니다. 이곳에는 기지도, 공장도, 지원군도 없습니다. 지금 가진 것이 전부입니다.\n\n수는 적이 많지만, 화력은 우리가 앞섭니다. 적의 종대가 다가오면 Luger와 Merl로 포격하고, Zeus로 전선을 지키며, Jethro는 전차와 함께 두십시오. 적은 건쉽을 끌고 올 것입니다. 적의 예비대는 2분 30초 후에 도착합니다.\n\n적을 하나도 남김없이 섬멸하십시오."
"Arm Command" = "Arm 사령부"
"Here they come. Hold the line, and keep the Jethros with the tanks." = "온다. 전선을 지키고 Jethro는 전차 곁에 둬라."
"Their reserves are coming up behind the mounds, a Goliath at their head." = "적 예비대가 언덕 뒤에서 다가오고 있다. 선두에 Goliath가 있다."

# apps/ta_game/scenarios/armistice.toml
"The Armistice" = "휴전"
"Five minutes of peace to build an army. Then the war resumes." = "군대를 세울 5분간의 평화. 그 뒤 전쟁이 다시 시작됩니다."
"Commander, the peace talks on Reactor Grid have failed. The armistice holds for five more minutes: until then no weapon may fire, and neither side may build near the other's base. When it ends, the war resumes.\n\nBoth sides are rearming at a furious pace: resources and construction run at twice their usual speed, and the treaty's one lasting clause bans missile silos. Their Commander knows the clock as well as you do.\n\nBuild as you have never built. When the armistice ends, destroy the Core Commander." = "사령관님, Reactor Grid에서의 평화 회담이 결렬되었습니다. 휴전은 앞으로 5분간 유지됩니다. 그때까지는 어떤 무기도 발사할 수 없고, 어느 쪽도 상대 기지 근처에 건설할 수 없습니다. 휴전이 끝나면 전쟁이 다시 시작됩니다.\n\n양측 모두 맹렬한 속도로 재무장하고 있습니다. 자원과 건설이 평소의 두 배 속도로 진행되며, 조약의 유일하게 남은 조항이 미사일 사일로를 금지합니다. 적 사령관도 당신만큼 시계를 잘 알고 있습니다.\n\n그 어느 때보다 빠르게 건설하세요. 휴전이 끝나면 Core 사령관을 파괴하세요."
"The talks have failed. For five minutes no weapon fires and nobody builds near the other's base. Then it is war: build as you have never built." = "회담이 결렬되었다. 5분 동안은 어떤 무기도 발사되지 않고 누구도 상대 기지 근처에 건설할 수 없다. 그 뒤엔 전쟁이다. 그 어느 때보다 빠르게 건설하라."
"Their factories are running day and night. Ours should be too." = "적 공장은 밤낮없이 돌아가고 있다. 우리 공장도 그래야 한다."
"Core Overseer" = "Core 감독관"
"Ten seconds, Arm. We have counted every one of your factories." = "10초 남았다, Arm. 네놈의 공장은 하나도 빠짐없이 세어 두었다."
"Their Commander is somewhere in that grid. Find it, and end this war for good." = "적 사령관은 저 격자 어딘가에 있다. 찾아내서 이 전쟁을 영원히 끝내라."

# apps/ta_game/scenarios/brothers_in_arms.toml
"Brothers in Arms" = "전우"
"You and an allied Commander against two of the Core's." = "당신과 동맹 사령관이 Core 사령관 둘과 맞섭니다."
"Commander, you are not alone on Highland Rift. Commander Holt's forces hold the river crossings in the north, beside yours in the north-western highlands. Two Core Commanders are dug in to the south, across the canyon.\n\nHolt's computer will fight its own war, but it is the same war: back it up when it is hard pressed, and it will do the same for you. Your forces see what its forces see.\n\nDestroy both Core Commanders. Keep yours alive." = "사령관님, Highland Rift에 있는 건 당신만이 아닙니다. Holt 사령관의 부대가 북쪽의 강 도하 지점을, 북서쪽 고지대에 있는 당신의 부대 바로 옆에서 지키고 있습니다. Core 사령관 둘은 협곡 건너편 남쪽에 진지를 구축했습니다.\n\nHolt의 컴퓨터는 자기만의 전쟁을 치르겠지만 같은 전쟁입니다. 궁지에 몰리면 도와주세요. 그도 당신에게 그렇게 할 것입니다. 당신의 부대는 그의 부대가 보는 것을 볼 수 있습니다.\n\nCore 사령관 둘을 모두 파괴하세요. 당신의 사령관은 살려 두세요."
"Commander Holt" = "Holt 사령관"
"Good to have you on the line. I'll hold the river crossings in the north; you take the western highlands." = "회선에 들어와 줘서 든든하군. 북쪽 도하 지점은 내가 맡지. 당신은 서쪽 고지대를 맡아 줘."
"My scouts have found both of their bases. The south-western one is yours; I'll keep the other busy." = "정찰병이 적 기지 두 곳을 모두 찾았어. 남서쪽은 당신 몫이야. 다른 쪽은 내가 붙잡아 둘게."
"They're massing at the canyon. If they come for one of us, the other hits them from the side." = "적이 협곡에 집결하고 있어. 우리 중 하나가 공격받으면 다른 하나가 측면을 친다."
"Still with me? Then let's finish it. Everything we have, at their Commanders." = "아직 함께인가? 그럼 끝내자고. 가진 모든 걸 적 사령관들에게."

# apps/ta_game/scenarios/decapitation.toml
"Kill the Core Commander on his island fortress. From the air." = "섬 요새의 Core 사령관을 제거하십시오. 공중에서."
"Commander, a Core Commander has made his fortress on the island at the centre of this lava sea. Nothing on treads or legs will reach him, and his anti-air is the best the Core can build.\n\nYou have a small air wing and a forward airfield in the south-west corner: build it up. Strip away his air defences, then send the bombers in; a handful sent straight at him will not get through. Brawler gunships hit hard but die fast over flak, and the Freedom Fighters can keep his fighters off your bombers.\n\nHis reinforcements arrive in fifteen minutes. Before then, he must be dead." = "사령관님, Core 사령관 하나가 이 용암 바다 한가운데의 섬에 요새를 세웠습니다. 궤도나 다리로 움직이는 것은 그곳에 닿을 수 없으며, 그의 대공 방어는 Core가 만들 수 있는 최고 수준입니다.\n\n아군에게는 소규모 비행대와 남서쪽 구석의 전진 비행장이 있습니다. 이를 증강하십시오. 먼저 적의 대공 방어를 걷어 낸 뒤 폭격기를 투입하십시오. 몇 기만 곧장 보내서는 뚫을 수 없습니다. Brawler 건쉽은 화력이 강하지만 대공포 위에서는 금세 격추되며, Freedom Fighter는 적 전투기가 폭격기에 접근하지 못하게 막을 수 있습니다.\n\n적의 지원군은 15분 후에 도착합니다. 그 전에 반드시 그를 제거해야 합니다."

# apps/ta_game/scenarios/doomsday_clock.toml
"Doomsday Clock" = "종말의 시계"
"The Core's missile launches in fifteen minutes. Stop it." = "Core의 미사일이 15분 후 발사됩니다. 막으십시오."
"Commander, a Silencer nuclear silo stands at the heart of the Core base across these metal plains, and it is arming. In fifteen minutes the missile flies, and your base is the target.\n\nDestroy the silo. Nothing else matters: not their Commander, not their factories. The silo sits behind heavy laser towers and a Punisher battery, and their Commander will not sit still while you come for it.\n\nYou have a base, two factories and two construction kbots. The clock is running." = "사령관님, 이 금속 평원 건너편 Core 기지의 중심부에 Silencer 핵 사일로가 있으며, 지금 무장 중입니다. 15분 후면 미사일이 발사되고, 목표는 아군 기지입니다.\n\n사일로를 파괴하십시오. 다른 것은 중요하지 않습니다. 적 사령관도, 적 공장도 아닙니다. 사일로는 중레이저 타워와 Punisher 포대 뒤에 있으며, 적 사령관은 사일로를 노리는 아군을 가만히 두지 않을 것입니다.\n\n아군에게는 기지 하나, 공장 두 곳, 건설 K봇 두 기가 있습니다. 시간이 흐르고 있습니다."
"Ten minutes to launch, Commander." = "발사까지 10분, 사령관."
"Five minutes to launch. That silo has to go." = "발사까지 5분. 저 사일로를 없애야 한다."
"One minute! Get to that silo!" = "1분 남았다! 사일로로 가라!"

# apps/ta_game/scenarios/endless_siege.toml
"Endless Siege" = "끝없는 포위"
"The waves never stop. Survive as long as you can." = "공세는 끝나지 않습니다. 최대한 오래 살아남으십시오."
"Commander, there is no rescue coming, no reinforcements, no victory. The Core has found your outpost in the mesas and will throw everything it has at it, from three directions, for as long as it takes.\n\nKbots, then tanks, then artillery and bombers; heavier every time, and now and then something enormous. Build an economy, build defences, and hold on.\n\nYour best time is kept. Beat it." = "사령관님, 구조도, 지원군도, 승리도 오지 않습니다. Core가 메사 지대의 아군 전초기지를 찾아냈고, 세 방향에서 가진 모든 전력을 쏟아부을 것입니다. 끝장을 볼 때까지.\n\nK봇, 다음은 전차, 그다음은 포병과 폭격기. 공세는 매번 더 거세지고, 때로는 거대한 무언가가 나타납니다. 경제를 세우고, 방어 시설을 짓고, 버티십시오.\n\n최고 기록이 저장됩니다. 그 기록을 깨십시오."

# apps/ta_game/scenarios/extraction.toml
"Extraction" = "탈출"
"Get your Commander down the lava river to the pick-up point." = "사령관을 용암 강 하류의 회수 지점까지 데려가십시오."
"Commander, your drop went wrong. You are on the south bank of a river of lava at the western end of the Run, with what is left of your escort, and the dropships can only land at the far eastern end.\n\nThe Core has guns all along the north bank, and patrols on your side of the river. Keep away from the lava's edge (their laser towers reach no further), deal with the patrols, and get your Commander to the pick-up point. Whatever guards it will not come to you. Core troops are already following your tracks; do not stop for long.\n\nAnything else is expendable. Your Commander is not." = "사령관님, 강하 작전이 틀어졌습니다. 사령관님은 남은 호위 병력과 함께 용암 협로 서쪽 끝, 용암 강의 남쪽 기슭에 있으며, 강하선은 동쪽 맨 끝에만 착륙할 수 있습니다.\n\nCore는 북쪽 기슭을 따라 포대를 늘어놓았고, 강 이쪽에도 순찰대를 두었습니다. 용암 가장자리에서 떨어져 있으십시오 (적 레이저 타워의 사거리는 거기까지입니다). 순찰대를 처리하고 사령관을 회수 지점까지 데려가십시오. 회수 지점을 지키는 적은 스스로 다가오지 않습니다. Core 부대가 이미 뒤를 쫓고 있으니 오래 멈추지 마십시오.\n\n다른 것은 모두 희생해도 됩니다. 사령관만은 안 됩니다."

# apps/ta_game/scenarios/iron_rain.toml
"Iron Rain" = "강철의 비"
"Two Intimidators are shelling your base. Take the mesa and silence them." = "Intimidator 2문이 기지를 포격하고 있습니다. 메사를 점령하고 침묵시키세요."
"Commander, the Core has hauled two Intimidators, its long-range plasma cannons, onto the mesas in the middle of the canyon. Your base is inside their range. Every eight seconds each of them will put a shell among your buildings, until you silence them.\n\nThe battery is dug in behind heavy laser towers and a Punisher, with tanks on the ramps, and the Core's main base lies beyond it, to the south-east. Its Commander will send what it can.\n\nSpread out, build fast and take that mesa. Destroy both Intimidators." = "사령관님, Core가 장거리 플라즈마 포 Intimidator 2문을 협곡 한가운데의 메사 위로 끌어올렸습니다. 당신의 기지는 사거리 안에 있습니다. 침묵시키기 전까지 각각이 8초마다 당신의 건물들 사이에 포탄을 떨어뜨릴 것입니다.\n\n포대는 중형 레이저 타워와 Punisher 뒤에 진지를 구축했고 경사로에는 전차가 있으며, 그 너머 남동쪽에는 Core의 본진이 있습니다. 적 사령관은 보낼 수 있는 모든 것을 보낼 것입니다.\n\n흩어지고, 빠르게 건설하고, 메사를 점령하세요. Intimidator 2문을 모두 파괴하세요."
"Commander, two Intimidators on the mesas have your range. Every eight seconds each of them will put a shell into your base." = "사령관, 메사 위의 Intimidator 2문이 기지를 사거리에 두었다. 8초마다 각각이 기지에 포탄을 떨어뜨릴 것이다."
"A Core radar post in the canyon to the south-east is spotting for those guns. Knock it out and they can no longer see your base." = "남동쪽 협곡에 있는 Core 레이더 기지가 저 포들의 탄착을 관측하고 있다. 그것을 파괴하면 적은 더 이상 기지를 볼 수 없다."
"Spread your buildings out: a shell that lands among them takes them all." = "건물을 분산시켜라. 건물 사이에 떨어진 포탄은 모두 날려 버린다."
"Their gunners have your range now. Take that mesa, Commander!" = "적 포수들이 조준을 맞췄다. 저 메사를 점령하라, 사령관!"

# apps/ta_game/scenarios/king_of_the_hill.toml
"King of the Hill" = "언덕의 왕"
"Hold the summit for four minutes before the Core does." = "Core보다 먼저 정상을 4분간 점령하십시오."
"Commander, the spiral mountain at the heart of this plain is rich in metal, and whoever holds its summit holds the planet. A Core Commander has landed to the north with the same idea.\n\nTake the summit and keep it: four minutes in all with only your forces on top wins it. Contested, the clock stands still. If the Core holds it alone for four minutes, the mountain is theirs.\n\nThe Core will keep sending troops up the slopes. Build up, get there first, and dig in." = "사령관님, 이 평원 한가운데의 나선형 산은 금속이 풍부하며, 그 정상을 차지하는 자가 행성을 차지합니다. 같은 생각을 품은 Core 사령관이 북쪽에 착륙했습니다.\n\n정상을 점령하고 지키십시오. 정상에 아군만 있는 시간이 모두 합쳐 4분이 되면 승리합니다. 양측이 함께 있으면 시계가 멈춥니다. Core가 단독으로 4분간 점령하면 산은 적의 것이 됩니다.\n\nCore는 계속해서 비탈 위로 병력을 올려 보낼 것입니다. 전력을 갖추고, 먼저 도착해 진지를 구축하십시오."
"Core troops are climbing the north slope. Don't let them dig in on the summit." = "Core 부대가 북쪽 비탈을 오르고 있다. 정상에 진지를 구축하게 두지 마라."
"Raiders are coming round the mountain for your base." = "습격대가 산을 돌아 당신의 기지로 오고 있다."

# apps/ta_game/scenarios/last_stand.toml
"Last Stand" = "최후의 저항"
"Hold the pass for twelve minutes. They will not stop coming." = "12분간 고개를 사수하십시오. 적은 끊임없이 몰려옵니다."
"Commander, the Core has broken through at Varrin Gap. The only way into the valley behind you is the winding pass ahead, and your outpost at its western mouth is all that stands in the way.\n\nReinforcements are twelve minutes out. Hold until they arrive. Core forces will come through the pass in waves, each heavier than the last; expect bombers, and expect worse at the end: our scouts have seen something very large moving in the east.\n\nYou have a small base, a kbot lab and two construction kbots. Build what you can. Keep your Commander alive." = "사령관님, Core가 바린 협곡을 돌파했습니다. 후방 계곡으로 들어가는 유일한 길은 앞의 구불구불한 고갯길이며, 그 서쪽 입구에 있는 아군 전초기지만이 적을 막고 있습니다.\n\n지원군은 12분 후에 도착합니다. 그때까지 버티십시오. Core 병력은 고갯길을 따라 파상 공세를 펼칠 것이며, 공세는 매번 더 거세질 것입니다. 폭격기에 대비하고, 마지막에는 더 나쁜 것에 대비하십시오. 정찰병이 동쪽에서 움직이는 거대한 무언가를 목격했습니다.\n\n아군에게는 작은 기지, K봇 연구소 하나, 건설 K봇 두 기가 있습니다. 지을 수 있는 것은 모두 지으십시오. 사령관을 반드시 살려 두십시오."
"Outpost, this is Arm Command. The relief force is twelve minutes out. Nothing gets through that pass before it arrives." = "전초기지, 여기는 Arm 사령부. 증원군은 12분 거리에 있다. 증원군이 오기 전까지 아무것도 저 고개를 넘게 하지 마라."
"Radar: aircraft inbound from the east. Bombers! Get your anti-air up." = "레이더: 동쪽에서 항공기 접근 중. 폭격기다! 대공 방어를 갖춰라."
"Seismic contact in the pass. It's the big one, Commander: a Krogoth." = "고개에 지진 반응. 거물이다, 사령관. Krogoth다."
"One minute! The relief force is entering the valley." = "1분 남았다! 증원군이 계곡에 들어서고 있다."

# apps/ta_game/scenarios/metal_rush.toml
"The first to make 15,000 metal wins. The Core plays rough." = "먼저 금속 15,000을 생산하는 쪽이 승리합니다. Core는 거칠게 나옵니다."
"Commander, the mining rights to this planet go to whoever proves they can work it: the first side to extract fifteen thousand metal wins it outright.\n\nThe Core is racing you from the western plateau, and the Core has never been known to race fair. Expect raids on your extractors. Build fast, protect your economy, and if you can, take theirs apart.\n\nMetal makers count. Reclaimed metal counts. Whatever you make, counts." = "사령관님, 이 행성의 채굴권은 행성을 개발할 능력을 증명한 쪽에 돌아갑니다. 먼저 금속 1만 5천을 채굴하는 진영이 채굴권을 온전히 차지합니다.\n\nCore가 서쪽 고원에서 경쟁에 나섰고, Core가 공정하게 경쟁했다는 이야기는 들어 본 적이 없습니다. 추출기를 노린 기습에 대비하십시오. 빠르게 건설하고, 경제를 지키고, 할 수 있다면 적의 경제를 무너뜨리십시오.\n\n금속 변환기로 만든 금속도 인정됩니다. 회수한 금속도 인정됩니다. 무엇이든 만든 것은 모두 인정됩니다."

# apps/ta_game/scenarios/titans.toml
"Titans" = "타이탄"
"Three Krogoths are walking toward your base. Bring them down." = "Krogoth 3기가 기지로 걸어오고 있습니다. 쓰러뜨리세요."
"Commander, seismic stations round the basin are reading footfalls: three Krogoths, the Core's walking fortresses, are crossing the salt pans toward your base, one after another, each with an escort.\n\nNothing out there can stop them but you. A Krogoth's head laser reaches further than your D-gun, so keep your Commander back. Bombers, artillery and massed Zeus will bring one down. Lose your nerve and it will walk through your base.\n\nYou have a base with three factories, four construction kbots and a garrison. Destroy all three of them." = "사령관님, 분지 주변의 지진 관측소가 발소리를 감지하고 있습니다. Core의 걸어 다니는 요새인 Krogoth 3기가 각각 호위를 거느리고 차례로 소금 평원을 건너 당신의 기지로 향하고 있습니다.\n\n저것들을 막을 수 있는 건 당신뿐입니다. Krogoth의 머리 레이저는 당신의 D건보다 사거리가 기니 사령관은 뒤로 물려 두세요. 폭격기, 포병, 대규모 Zeus라면 한 기를 쓰러뜨릴 수 있습니다. 겁을 먹으면 기지를 짓밟고 지나갈 것입니다.\n\n공장 3곳, 건설 Kbot 4기, 수비대가 있는 기지가 있습니다. 세 기 모두 파괴하세요."
"Commander, seismic stations are reading footfalls round the basin. Three Krogoths are walking toward your base, one after another." = "사령관, 지진 관측소가 분지 주변에서 발소리를 감지했다. Krogoth 3기가 차례로 당신의 기지를 향해 오고 있다."
"The first Krogoth has crossed the north-western rim. It is coming straight for you." = "첫 번째 Krogoth가 북서쪽 가장자리를 넘었다. 곧장 당신에게 오고 있다."
"Keep your Commander back: that head laser reaches further than your D-gun." = "사령관을 뒤로 물려라. 저 머리 레이저는 D건보다 사거리가 길다."
"The second Krogoth is through the northern pass, with rockets and anti-air round it." = "두 번째 Krogoth가 북쪽 고개를 넘었다. 주위에 로켓과 대공 부대가 있다."
"The last of them, out of the north-east, with the heaviest escort yet. End this, Commander." = "마지막 한 기가 북동쪽에서 온다. 지금까지 중 가장 강력한 호위다. 끝내라, 사령관."

# apps/ta_game/scenarios/until_dawn.toml
"Until Dawn" = "새벽까지"
"Night falls on the timber. Hold your ridge until the sun comes up." = "숲에 밤이 내립니다. 해가 뜰 때까지 능선을 지키세요."
"Commander, night is falling over Timberline, and the Core is moving through the forest under it. Your outpost holds the western ridge: the only road out of the valley runs past it.\n\nThe relief column cannot move before first light. Until then you are on your own. In the dark and the rain their raiders will be on you before you see them, so build radar, and keep your floodlights burning.\n\nYou have a small base, a kbot lab and two construction kbots. Hold until dawn, and keep your Commander alive." = "사령관님, Timberline에 밤이 내리고 있으며 Core가 어둠을 틈타 숲을 지나고 있습니다. 당신의 전초기지는 서쪽 능선을 지키고 있습니다. 계곡을 빠져나가는 유일한 길이 그 앞을 지나갑니다.\n\n구원 부대는 새벽이 오기 전에는 움직일 수 없습니다. 그때까지는 혼자입니다. 어둠과 비 속에서 적 습격대는 보이기도 전에 들이닥칠 것이니, 레이더를 건설하고 투광등을 계속 밝혀 두세요.\n\n작은 기지와 Kbot Lab, 건설 Kbot 2기가 있습니다. 새벽까지 버티고 사령관을 살려 두세요."
"Outpost Echo, the Core is moving through the timber tonight. Hold your ridge until first light: the relief column marches at dawn." = "에코 전초기지, 오늘 밤 Core가 숲을 지나간다. 새벽까지 능선을 지켜라. 구원 부대는 새벽에 출발한다."
"Raiders in the eastern trees. In this rain you will hear them before you see them." = "동쪽 숲에 습격대. 이 빗속에서는 보기 전에 소리부터 들릴 것이다."
"Pyros in the north-eastern woods. Keep them out of the trees round your base: the timber will burn." = "북동쪽 숲에 Pyro가 있다. 기지 주변 나무에 접근하지 못하게 하라. 숲이 불탈 것이다."
"A convoy got through from the south-west. Four Zeus and two Jethros are yours, Commander." = "남서쪽에서 수송대가 돌파했다. Zeus 4기와 Jethro 2기가 이제 당신의 것이다, 사령관."
"Seismic contact in the south-east: heavy treads. They are saving the worst for the last hours of the night." = "남동쪽에 지진 반응: 무거운 궤도다. 놈들은 밤의 마지막 몇 시간을 위해 최악을 아껴 두고 있다."
"Sunrise in one minute. The relief column is at the river. Hold on!" = "일출까지 1분. 구원 부대가 강에 도착했다. 버텨라!"

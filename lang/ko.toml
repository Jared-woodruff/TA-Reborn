# apps/ta_game/src/tips.rs
"Ctrl+right-drag draws a formation line: the selection spreads along it." = "Ctrl+우클릭 드래그로 대형 선을 그리면 선택한 유닛이 그 선을 따라 펼쳐집니다."
"Ctrl+drag draws a formation line: the selection spreads along it." = "Ctrl+드래그로 대형 선을 그리면 선택한 유닛이 그 선을 따라 펼쳐집니다."
"Used to TA's original controls? Options, Controls: give orders with the left button." = "TA 원작 조작에 익숙하신가요? 옵션 · 조작에서 왼쪽 버튼으로 명령하도록 바꿀 수 있습니다."
"A right-click clears the selection or cancels the order you were about to give." = "우클릭하면 선택이 해제되거나, 내리려던 명령이 취소됩니다."
"Right-click one of your units for a ring of its orders; hold the button and flick towards a choice. A controller's B does the same." = "내 유닛을 오른쪽 클릭하면 명령이 원형으로 펼쳐집니다. 버튼을 누른 채 원하는 쪽으로 움직여도 됩니다. 컨트롤러의 B 버튼도 같습니다."
"Hold the right button on one of your units, or middle-click it, for a ring of its orders; flick towards a choice and let go." = "내 유닛에서 오른쪽 버튼을 누르고 있거나 가운데 클릭하면 명령이 원형으로 펼쳐집니다. 원하는 쪽으로 움직였다가 놓으세요."
"Metal extractors must sit on metal: {overlay_metal} shows the metal map, and {area_mex} puts an extractor on every metal spot you circle." = "금속 추출기는 금속 위에 지어야 합니다. {overlay_metal} 키로 금속 지도를 볼 수 있고, {area_mex} 키로 원을 그리면 그 안의 모든 금속 지점에 추출기를 짓습니다."
"Your Commander's D-gun ({dgun}) destroys almost anything it touches, including your own units in its path." = "사령관의 D건({dgun} 키)은 닿는 거의 모든 것을 파괴합니다. 경로에 있는 아군 유닛도 예외가 아닙니다."
"{perspective} climbs into the selected unit, or an ally's under the pointer, to see the battle through its eyes as it goes on with its orders. Escape climbs back out." = "{perspective} 키를 누르면 선택한 유닛이나 포인터 아래 동맹 유닛에 탑승해, 유닛이 명령을 계속 수행하는 동안 그 눈으로 전장을 봅니다. Escape 키를 누르면 내립니다."
"Keep your metal and energy incomes above what you spend: building slows down for everything when a store runs dry." = "금속과 에너지 수입을 지출보다 높게 유지하세요. 저장량이 바닥나면 모든 건설이 느려집니다."
"Right-clicking a factory's queued unit removes it; clicking it builds it next." = "공장 대기열의 유닛을 우클릭하면 제거되고, 클릭하면 다음 순서로 생산됩니다."
"Fight ({fight}) is attack-move: units stop to fight whatever they meet on the way." = "교전({fight})은 공격 이동입니다. 유닛이 가는 길에 만나는 적과 멈춰 싸웁니다."
"Ctrl+click is force fire: the selection attacks whatever is there, your own units too, or the ground." = "Ctrl+클릭은 강제 공격입니다. 선택한 유닛이 아군이든 지면이든 그 자리의 대상을 공격합니다."
"{select_builders} selects your constructors, {select_factories} your factories, {select_armed} your armed units, {select_on_screen} everything on the screen." = "{select_builders}는 건설 유닛, {select_factories}는 공장, {select_armed}는 무장 유닛, {select_on_screen}는 화면 안의 모든 유닛을 선택합니다."
"Patrol ({patrol}) with constructors makes them repair, assist and reclaim along the route by themselves." = "건설 유닛에게 순찰({patrol})을 명령하면 경로를 따라 스스로 수리, 지원, 회수를 합니다."
"Put a constructor on duty ({duty}) and it works by itself: the economy, repairs, reclaiming or defence. Any order you give takes it back." = "건설 유닛에게 임무({duty})를 맡기면 스스로 일합니다: 경제, 수리, 회수, 방어. 명령을 내리면 다시 돌아옵니다."
"Drag with Reclaim ({reclaim}) to turn every wreck, rock and tree in a circle into metal and energy." = "회수({reclaim})로 드래그하면 원 안의 모든 잔해, 바위, 나무를 금속과 에너지로 바꿉니다."
"Ctrl+1 to Ctrl+9 make control groups; tap the number twice to look at the group." = "Ctrl+1~Ctrl+9로 부대를 지정합니다. 숫자를 두 번 누르면 그 부대로 화면이 이동합니다."
"Hold {players} to see every player's side, team, units and income (your allies' in full)." = "{players} 키를 누르고 있으면 모든 플레이어의 진영, 팀, 유닛, 수입을 볼 수 있습니다 (동맹은 모든 정보 공개)."
"Radar towers show enemy units long before they come into sight: build one early." = "레이더 탑은 적 유닛이 시야에 들어오기 훨씬 전에 보여 줍니다. 일찍 지으세요."
"Wind generators pay off on windy maps: the skirmish page shows each map's wind range." = "풍력 발전기는 바람이 강한 맵에서 효과적입니다. 스커미시 화면에서 맵별 풍력 범위를 확인할 수 있습니다."
"Metal makers turn spare energy into metal, and stop when your energy runs dry." = "금속 변환기는 남는 에너지를 금속으로 바꾸며, 에너지가 바닥나면 멈춥니다."
"Solar collectors fold shut for a few seconds when hit: tougher, but making no energy." = "태양광 수집기는 공격받으면 몇 초간 접힙니다. 더 단단해지지만 에너지를 생산하지 않습니다."
"Units gain veterancy with every kill: veterans aim better and shrug off damage." = "유닛은 적을 격파할 때마다 경험을 쌓습니다. 베테랑은 더 정확히 조준하고 피해도 잘 견딥니다."
"Shift adds to the orders a unit already has instead of replacing them." = "Shift 키를 누르면 유닛의 기존 명령을 대체하지 않고 뒤에 추가합니다."
"Alt+drag while placing a building fills a rectangle with it: handy for solar farms and walls." = "건물을 배치할 때 Alt+드래그하면 사각형 범위를 그 건물로 채웁니다. 태양광 단지나 방벽을 지을 때 편리합니다."
"Double-click a unit to select every unit of its type on screen; {select_type} selects them map-wide." = "유닛을 더블클릭하면 화면 안의 같은 종류 유닛을 모두 선택합니다. {select_type}는 맵 전체에서 선택합니다."
"{idle_builder} selects the next idle constructor, {idle_factory} the next idle factory." = "{idle_builder} 키는 다음 대기 건설 유닛을, {idle_factory} 키는 다음 대기 공장을 선택합니다."
"Wrecks can be resurrected by resurrection kbots, or reclaimed for most of their metal." = "잔해는 부활 K봇으로 되살리거나, 회수해 금속 대부분을 돌려받을 수 있습니다."
"Hovering a unit shows its health, firepower and range; {overlay_path} shows where the selection can go." = "유닛 위에 커서를 올리면 체력, 화력, 사거리가 표시됩니다. {overlay_path} 키는 선택한 유닛이 갈 수 있는 곳을 보여 줍니다."
"{last_alert} (or Backspace) looks at the last place your units were attacked; press it again for the one before." = "{last_alert} 키 또는 Backspace 키로 아군 유닛이 마지막으로 공격받은 곳을 봅니다. 다시 누르면 그 이전 장소를 봅니다."
"A notice or a piece of advice with LOOK on it takes you to the place, or the unit, when you click it." = "‘보기’가 붙은 알림이나 조언을 클릭하면 해당 장소나 유닛으로 이동합니다."
"{help} tells everything about the selected unit, or the one under the pointer: cost, speed, weapons, abilities." = "{help} 키는 선택한 유닛이나 포인터 아래 유닛의 모든 정보를 보여 줍니다: 비용, 속도, 무기, 능력."
"{next_unit} looks at the next of your units off the screen; with units selected, the next of them." = "{next_unit} 키는 화면 밖의 다음 아군 유닛을 보여 줍니다. 유닛을 선택한 상태라면 그중 다음 유닛을 보여 줍니다."
"Ctrl+F6 to Ctrl+F9 store camera positions; F6 to F9 bring them back." = "Ctrl+F6~Ctrl+F9로 카메라 위치를 저장하고, F6~F9로 불러옵니다."
"Anti-air matters: bombers can wreck an undefended economy in one pass." = "대공 방어가 중요합니다. 폭격기는 무방비 상태의 경제 시설을 한 번의 공습으로 초토화할 수 있습니다."
"An advanced factory needs a lot of metal: build it once your extractors and power can feed it." = "고급 공장에는 금속이 많이 듭니다. 추출기와 전력이 충분히 뒷받침될 때 지으세요."
"Guarding a factory with a constructor adds its build power to the factory's production." = "건설 유닛으로 공장을 호위하면 그 건설력이 공장의 생산에 더해집니다."
"Moho mines extract far more metal than basic extractors: advanced constructors build them." = "Moho 광산은 기본 추출기보다 훨씬 많은 금속을 추출합니다. 고급 건설 유닛이 지을 수 있습니다."
"Every game is kept as a replay: watch it from the main menu, and jump through it with the bar." = "모든 게임은 리플레이로 보관됩니다. 메인 메뉴에서 보고, 진행 바로 원하는 시점으로 이동할 수 있습니다."
"{overlay_sight} shows your sight, radar and sonar coverage; {overlay_height} shows the heights of the map." = "{overlay_sight} 키는 아군의 시야, 레이더, 소나 범위를, {overlay_height} 키는 맵의 높이를 보여 줍니다."
"The Commander can capture enemy units ({capture}): it takes a while, but the unit is yours." = "사령관은 적 유닛을 포획({capture})할 수 있습니다. 시간이 걸리지만 그 유닛은 내 것이 됩니다."
"{photo_mode} opens photo mode: the battle holds still, and you can light, frame and focus a shot at up to 4K." = "{photo_mode} 키로 사진 모드를 엽니다. 전투가 멈추고, 조명과 구도, 초점을 맞춰 최대 4K로 촬영할 수 있습니다."
"TIP" = "팁"
"Dismiss" = "닫기"
"Don't show tips again" = "팁 다시 표시하지 않기"

# apps/ta_game/src/tutorial.rs
"THE BASICS" = "기초"
"Your Commander, the camera, metal, energy and a first factory." = "사령관, 카메라, 금속, 에너지, 그리고 첫 공장."
"Selecting units" = "유닛 선택"
"The camera" = "카메라"
"Metal and energy" = "금속과 에너지"
"Factories" = "공장"
"Welcome, Commander. The walking machine in the middle of the screen is your Commander: it builds, it fights, and losing it usually loses the battle. Click it to select it." = "환영합니다, 사령관님. 화면 가운데의 걷는 기계가 바로 사령관입니다. 건설도 하고 전투도 하며, 사령관을 잃으면 대개 전투에서 집니다. 클릭해서 선택하세요."
"Lost sight of it? {select_commander} selects the Commander from anywhere, and SHOW ME brings the camera to it." = "사령관이 안 보이나요? 어디서든 {select_commander} 키로 사령관을 선택할 수 있고, '위치 보기'를 누르면 카메라가 사령관에게 이동합니다."
"Look around. The arrow keys, the screen edges or dragging with the middle button scroll; the mouse wheel zooms towards the cursor, and dragging with the right button turns the view." = "주위를 둘러보세요. 방향키, 화면 가장자리, 가운데 버튼 드래그로 화면을 이동하고, 마우스 휠로 커서 쪽을 확대/축소하며, 오른쪽 버튼 드래그로 시점을 돌립니다."
"Push the pointer against an edge of the screen to scroll, or turn the mouse wheel to zoom." = "포인터를 화면 가장자리로 밀면 화면이 이동하고, 마우스 휠을 굴리면 확대/축소됩니다."
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the ECONOMY tab of the build menu at the bottom right and place it on the marked deposit." = "모든 것은 금속과 에너지로 만들어집니다. 금속은 금속 매장지 위의 추출기에서 나옵니다. 사령관을 선택하고, 오른쪽 아래 건설 메뉴의 경제 탭에서 Metal Extractor를 골라 표시된 매장지에 배치하세요."
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the build menu on the left and place it on the marked deposit." = "모든 것은 금속과 에너지로 만들어집니다. 금속은 금속 매장지 위의 추출기에서 나옵니다. 사령관을 선택하고, 왼쪽 건설 메뉴에서 Metal Extractor를 골라 표시된 매장지에 배치하세요."
"The outline turns green where the extractor can stand. Bring it onto the marked ring and click to place it." = "추출기를 세울 수 있는 곳에서는 윤곽선이 초록색으로 바뀝니다. 윤곽선을 표시된 원 위로 옮긴 뒤 클릭해 배치하세요."
"Energy comes from solar collectors and wind generators. Build a Solar Collector next to your Commander. The bars at the top show your stores and how fast they fill or drain; they warn you when one runs dry." = "에너지는 태양광 수집기와 풍력 발전기에서 나옵니다. 사령관 옆에 Solar Collector를 지으세요. 위쪽 막대는 저장량과 그 증감 속도를 보여 주며, 자원이 바닥나면 경고합니다."
"The Solar Collector is a flat, square panel. Pick it, then click on open ground near the Commander." = "Solar Collector는 납작한 정사각형 패널입니다. 이것을 고른 뒤 사령관 근처의 빈 땅을 클릭하세요."
"Factories build your army. Build a Kbot Lab (on the FACTORY tab) on a flat spot near the Commander, and wait for it to finish." = "공장에서 군대를 생산합니다. 사령관 근처의 평평한 곳에 Kbot Lab(공장 탭)을 짓고 완성될 때까지 기다리세요."
"Factories build your army. Build a Kbot Lab from the build menu on a flat spot near the Commander, and wait for it to finish." = "공장에서 군대를 생산합니다. 건설 메뉴에서 Kbot Lab을 골라 사령관 근처의 평평한 곳에 짓고, 완성될 때까지 기다리세요."
"Building takes metal and energy as it goes: while either bar at the top is empty, everything builds more slowly." = "건설은 진행되는 동안 금속과 에너지를 조금씩 소모합니다. 위쪽 막대 중 하나라도 비어 있으면 모든 건설이 느려집니다."
"Select the Kbot Lab and click the Peewee three times to queue three of them (right-click one to take it off the queue). New units wait in front of the lab." = "Kbot Lab을 선택하고 Peewee를 세 번 클릭해 3기를 예약하세요 (우클릭하면 대기열에서 하나씩 뺍니다). 새 유닛은 Kbot Lab 앞에서 대기합니다."
"Click the lab itself on the map to select it: its build menu shows the units it makes." = "맵에 있는 Kbot Lab을 직접 클릭해 선택하세요. 건설 메뉴에 이 공장에서 생산하는 유닛이 표시됩니다."
"That is the whole cycle: extract, generate, build, fight. Keep both incomes above what you spend and keep your builders busy. Lesson complete!" = "이것이 전체 순환입니다: 추출, 발전, 건설, 전투. 두 자원 모두 수입을 지출보다 높게 유지하고, 건설 유닛이 쉬지 않게 하세요. 훈련 완료!"
"Select and group an army, attack-move, and destroy an enemy outpost." = "군대를 선택해 부대로 지정하고, 공격 이동으로 적 전초기지를 파괴합니다."
"Box selection" = "범위 선택"
"Control groups" = "부대 지정"
"Attack-move" = "공격 이동"
"Destroying a base" = "기지 파괴"
"Your Kbot Lab has built a squad of Peewees. Drag a box around them with the left mouse button to select them all." = "Kbot Lab에서 Peewee 분대를 생산했습니다. 왼쪽 마우스 버튼으로 드래그해 모두 선택하세요."
"Press the left button on open ground beside the squad, hold it, drag the box over them all and let go." = "분대 옆의 빈 땅에서 왼쪽 버튼을 누른 채 드래그해 사각형으로 분대 전체를 감싼 뒤, 버튼을 놓으세요."
"Press Ctrl+1 to make them group 1. Pressing 1 selects them again from anywhere; pressing it twice brings the camera to them." = "Ctrl+1을 눌러 1번 부대로 지정하세요. 어디서든 1을 누르면 다시 선택되고, 두 번 누르면 카메라가 부대로 이동합니다."
"Hold Ctrl and press 1 while the squad is selected." = "분대를 선택한 상태에서 Ctrl 키를 누른 채 1을 누르세요."
"The enemy has an outpost at the marked place. Fight is attack-move: units walk there and take on whatever they meet on the way. Press {fight}, then click near the outpost." = "표시된 곳에 적 전초기지가 있습니다. 교전은 공격 이동입니다. 유닛이 그곳으로 가면서 도중에 만나는 적과 싸웁니다. {fight}를 누른 뒤 전초기지 근처를 클릭하세요."
"Select the squad first (press 1). Then press {fight}, or the Fight button among the orders, and click on the ground by the marked ring." = "먼저 분대를 선택하세요 (1을 누르면 됩니다). 그런 다음 {fight} 키나 명령 중 교전 버튼을 누르고, 표시된 원 옆의 땅을 클릭하세요."
"Destroy every building of the outpost. Its laser tower hits hard: keep the squad together, and queue reinforcements at the lab if you need them." = "전초기지의 건물을 모두 파괴하세요. 레이저 타워는 강력하니 분대를 뭉쳐서 움직이고, 필요하면 Kbot Lab에서 지원군을 예약하세요."
"Losing the fight? Pull the squad back, queue more Peewees at the lab and go in again with all of them together." = "전투에서 밀리고 있나요? 분대를 뒤로 물리고, Kbot Lab에서 Peewee를 더 예약한 뒤 모두 함께 다시 진격하세요."
"The outpost is gone. The wrecks it left are worth metal: builders reclaim them (next lesson). Lesson complete!" = "전초기지가 사라졌습니다. 남은 잔해는 금속이 됩니다. 건설 유닛으로 회수할 수 있습니다 (다음 훈련). 훈련 완료!"
"ORDERS LIKE A VETERAN" = "베테랑처럼 명령하기"
"Map views, area orders, building blocks and build queues." = "맵 보기, 범위 명령, 건물 일괄 배치, 건설 대기열."
"Map overlays" = "맵 오버레이"
"Area orders" = "범위 명령"
"Building blocks" = "건물 일괄 배치"
"Build queues" = "건설 대기열"
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again. The MAP menu at the top right does the same." = "맵 보기는 지면에 숨은 정보를 보여 줍니다. {overlay_metal} 키를 누르면 금속 지도가 나타납니다 ({overlay_path}는 이동 가능 지역, {overlay_height}은 높이, {overlay_sight}은 시야와 레이더). 같은 키를 다시 누르면 숨겨집니다. 오른쪽 위의 맵 메뉴도 같은 기능을 합니다."
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again." = "맵 보기는 지면에 숨은 정보를 보여 줍니다. {overlay_metal} 키를 누르면 금속 지도가 나타납니다 ({overlay_path} 키는 이동 가능 지역, {overlay_height} 키는 높이, {overlay_sight} 키는 시야와 레이더). 같은 키를 다시 누르면 숨겨집니다."
"Press {overlay_metal}: the metal deposits light up all over the map." = "{overlay_metal} 키를 누르세요. 맵 곳곳의 금속 매장지가 환하게 표시됩니다."
"Select the Commander, press {area_mex} and drag a circle over the marked deposits: every metal spot inside gets an extractor, nearest first. A plain click takes the metal around the cursor." = "사령관을 선택하고 {area_mex}를 누른 뒤 표시된 매장지 위로 원을 드래그하세요. 원 안의 모든 금속 지점에 가까운 곳부터 추출기를 짓습니다. 그냥 클릭하면 커서 주변의 금속 지점이 대상이 됩니다."
"With the Commander selected, press {area_mex}, then press on the ground over the deposits and drag outwards: the circle grows as you drag." = "사령관을 선택한 상태에서 {area_mex} 키를 누른 뒤, 매장지 위의 땅에서 마우스 버튼을 누른 채 바깥쪽으로 드래그하세요. 드래그하는 만큼 원이 커집니다."
"Many orders work on areas. Press {reclaim} (reclaim) and drag a circle over the rocks near your base: the Commander turns every one into metal." = "많은 명령은 범위에 내릴 수 있습니다. {reclaim} 키(회수)를 누르고 기지 근처의 바위 위로 원을 드래그하세요. 사령관이 바위를 모두 금속으로 바꿉니다."
"Rocks and wrecks are worth metal. With the Commander selected, press {reclaim}, then press on the ground and drag the circle over a few rocks." = "바위와 잔해는 금속이 됩니다. 사령관을 선택한 상태에서 {reclaim} 키를 누른 뒤, 땅에서 마우스 버튼을 누른 채 원이 바위 몇 개를 덮도록 드래그하세요."
"Hold Alt while you drag out a building to fill a whole block with it. Pick the Solar Collector, hold Alt and drag out a block of four or more." = "Alt 키를 누른 채 건물을 드래그하면 사각형 범위 전체를 그 건물로 채웁니다. Solar Collector를 고르고, Alt 키를 누른 채 4개 이상이 들어가도록 드래그하세요."
"Pick the Solar Collector, then hold Alt, press on the ground and drag: a block of outlines follows the pointer. Let go to place them all." = "Solar Collector를 고른 뒤 Alt 키를 누른 채 땅에서 마우스 버튼을 누르고 드래그하세요. 윤곽선들이 한 덩어리로 포인터를 따라옵니다. 버튼을 놓으면 모두 배치됩니다."
"The Commander's queued buildings show under BUILD QUEUE, beside its picture at the bottom of the screen. Click one to build it next (right-click drops it). A factory's queue works the same way." = "사령관이 예약한 건물은 화면 아래쪽, 사령관 그림 옆의 건설 대기열 아래에 표시됩니다. 하나를 클릭하면 다음 순서로 짓습니다 (우클릭하면 취소). 공장의 대기열도 똑같이 작동합니다."
"The BUILD QUEUE shows while the Commander alone is selected and has buildings waiting. Click any but the first: that one is being built." = "'건설 대기열'은 사령관 하나만 선택되어 있고 건설을 기다리는 건물이 있을 때 표시됩니다. 첫 번째를 뺀 아무 건물이나 클릭하세요. 첫 번째 건물은 지금 짓고 있는 중입니다."
"Area orders, building blocks and queues save you hundreds of clicks in a battle. Lesson complete!" = "범위 명령, 건물 일괄 배치, 대기열을 활용하면 전투에서 클릭을 수백 번 아낄 수 있습니다. 훈련 완료!"
"HOLD THE LINE" = "전선 사수"
"Defences, radar, repairs, and the metal in wrecks." = "방어 시설, 레이더, 수리, 그리고 잔해 속의 금속."
"Defences" = "방어 시설"
"Radar" = "레이더"
"Repairs" = "수리"
"Reclaiming wrecks" = "잔해 회수"
"Raiders will come from the marked direction. Build a Light Laser Tower (on the DEFENCE tab) in the marked ring: towers shoot whatever comes in range." = "표시된 방향에서 습격대가 올 것입니다. 표시된 원 안에 Light Laser Tower(방어 탭)를 지으세요. 포탑은 사거리에 들어오는 것이면 무엇이든 공격합니다."
"Raiders will come from the marked direction. Build a Light Laser Tower from the build menu in the marked ring: towers shoot whatever comes in range." = "표시된 방향에서 습격대가 올 것입니다. 건설 메뉴에서 Light Laser Tower를 골라 표시된 원 안에 지으세요. 포탑은 사거리에 들어오는 것이면 무엇이든 공격합니다."
"The Light Laser Tower is a small gun on a post. Pick it, put it in the ring and wait for it to finish." = "Light Laser Tower는 기둥 위에 얹힌 작은 포입니다. 이것을 골라 원 안에 놓고 완성될 때까지 기다리세요."
"Build a Radar Tower (on the SENSORS tab) near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "기지 근처에 Radar Tower(감지 탭)를 지으세요. 레이더는 아군 유닛이 적을 보기 훨씬 전부터 맵과 미니맵에 적을 점으로 표시합니다."
"Build a Radar Tower from the build menu near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "건설 메뉴에서 Radar Tower를 골라 기지 근처에 지으세요. 레이더는 아군 유닛이 적을 보기 훨씬 전부터 맵과 미니맵에 적을 점으로 표시합니다."
"The Radar Tower is a tall mast. Pick it, place it near the Commander and wait for it to finish." = "Radar Tower는 높은 안테나 탑입니다. 이것을 골라 사령관 근처에 배치하고 완성될 때까지 기다리세요."
"Here they come: raiders on your radar. Keep the Commander by the tower and let them come to you: together they hold the line." = "적이 옵니다. 레이더에 습격대가 잡혔습니다. 사령관을 포탑 옆에 두고 적이 다가오기를 기다리세요. 둘이 함께라면 전선을 지킬 수 있습니다."
"Do not chase them: the tower only fights what comes in range. Keep the Commander beside it; while it fights, the Commander can mend it ({repair}, then click the tower)." = "쫓아가지 마세요. 포탑은 사거리에 들어온 적하고만 싸웁니다. 사령관을 포탑 옆에 두세요. 포탑이 싸우는 동안 사령관이 포탑을 수리할 수 있습니다 ({repair} 키를 누른 뒤 포탑 클릭)."
"The fight left a building damaged. Select the Commander, press {repair} and click it: builders mend what is damaged." = "전투로 건물 하나가 손상되었습니다. 사령관을 선택하고 {repair} 키를 누른 뒤 그 건물을 클릭하세요. 건설 유닛은 손상된 것을 수리합니다."
"With the Commander selected, press {repair}, then click the damaged building. Its health bar fills as it is mended." = "사령관을 선택한 상태에서 {repair} 키를 누른 뒤 손상된 건물을 클릭하세요. 수리되는 동안 체력 바가 차오릅니다."
"The raiders left wrecks, and wrecks are worth metal. Select the Commander, press {reclaim} and click a wreck, or drag a circle over them all." = "습격대가 잔해를 남겼고, 잔해는 금속이 됩니다. 사령관을 선택하고 {reclaim} 키를 누른 뒤 잔해를 클릭하거나, 원을 드래그해 잔해를 모두 덮으세요."
"Wrecks lie where the raiders fell. With the Commander selected, press {reclaim} and click one: the metal bar rises as it is taken apart." = "잔해는 습격대가 쓰러진 곳에 있습니다. 사령관을 선택한 상태에서 {reclaim} 키를 누른 뒤 잔해 하나를 클릭하세요. 해체되는 동안 금속 막대가 늘어납니다."
"Towers hold ground while your army is elsewhere, radar sees what is coming, and builders mend and recycle. Lesson complete!" = "군대가 다른 곳에 있는 동안에도 포탑이 자리를 지키고, 레이더는 다가오는 적을 포착하며, 건설 유닛은 수리하고 회수합니다. 훈련 완료!"
"BUILDERS AND FACTORIES" = "건설 유닛과 공장"
"Builders that help, factories that keep building, patrols and standing orders." = "돕는 건설 유닛, 계속 생산하는 공장, 순찰, 상시 명령."
"Construction units" = "건설 유닛"
"Helping a factory" = "공장 지원"
"Rally points" = "집결 지점"
"Standing orders" = "상시 명령"
"One builder is slow. Select the Kbot Lab and build a Construction Kbot: it builds what the Commander builds, and more besides." = "건설 유닛 하나로는 느립니다. Kbot Lab을 선택하고 Construction Kbot을 생산하세요. 사령관이 짓는 것은 물론, 그 이상도 지을 수 있습니다."
"Click the lab on the map to select it; the Construction Kbot is in its build menu. Wait for it to walk out." = "맵에 있는 Kbot Lab을 클릭해 선택하세요. Construction Kbot은 건설 메뉴에 있습니다. 걸어 나올 때까지 기다리세요."
"Builders help each other. Select the Construction Kbot, press {guard} and click the Kbot Lab: it lends the lab its build power, and the lab builds faster." = "건설 유닛은 서로 도울 수 있습니다. Construction Kbot을 선택하고 {guard} 키를 누른 뒤 Kbot Lab을 클릭하세요. Kbot Lab에 건설력을 보태 주어 생산이 빨라집니다."
"With the Construction Kbot selected, press {guard}, then click the lab. It stays by the lab and helps with everything it makes." = "Construction Kbot을 선택한 상태에서 {guard} 키를 누른 뒤 Kbot Lab을 클릭하세요. Kbot Lab 곁에 머물며 생산하는 모든 것을 돕습니다."
"Factories send their units where you say. Select the Kbot Lab. {order_click} on open ground nearby: new units gather there." = "공장은 생산한 유닛을 지정한 곳으로 보냅니다. Kbot Lab을 선택하고 근처의 빈 땅을 {order_click}하세요. 새 유닛이 그곳에 모입니다."
"Select the lab first. With it selected, {order_click} on the ground where its units should gather." = "먼저 Kbot Lab을 선택하세요. 선택한 상태에서 유닛이 모일 땅을 {order_click}하세요."
"Turn on Repeat for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "Kbot Lab의 '반복'을 켜세요. 완성된 유닛이 대기열 끝에 다시 들어가므로 생산이 멈추지 않습니다."
"Turn on REPEAT BUILD for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "Kbot Lab의 '반복 생산'을 켜세요. 완성된 유닛이 대기열 끝에 다시 들어가므로 생산이 멈추지 않습니다."
"Select the lab, then turn Repeat on: the pointer shows where it is." = "Kbot Lab을 선택한 뒤 '반복'을 켜세요. 화살표가 위치를 알려 줍니다."
"Builders on patrol mend and reclaim whatever they pass. Select the Construction Kbot, press {patrol} and click on the far side of your base." = "순찰 중인 건설 유닛은 지나가는 길에 있는 것을 수리하고 회수합니다. Construction Kbot을 선택하고 {patrol} 키를 누른 뒤 기지 반대편을 클릭하세요."
"With the Construction Kbot selected, press {patrol}, then click on the ground: it walks back and forth between there and where it stood." = "Construction Kbot을 선택한 상태에서 {patrol} 키를 누른 뒤 땅을 클릭하세요. 그곳과 원래 있던 곳 사이를 오갑니다."
"Units keep standing orders. Select your Peewees and set their fire order to Hold fire with the button beside the orders: they will not shoot until you say." = "유닛은 상시 명령을 계속 따릅니다. Peewee를 선택하고 명령 버튼 옆의 버튼으로 사격 명령을 '사격 중지'로 바꾸세요. 명령할 때까지 쏘지 않습니다."
"Units keep standing orders. Select your Peewees and set their FIRE ORDERS to Hold fire: they will not shoot until you say." = "유닛은 상시 명령을 계속 따릅니다. Peewee를 선택하고 '사격 명령'을 '사격 중지'로 바꾸세요. 명령할 때까지 쏘지 않습니다."
"Select the Peewees, then click the fire order button until it shows HOLD FIRE: each click is the next order." = "Peewee를 선택한 뒤, 사격 명령 버튼에 '사격 중지'가 표시될 때까지 클릭하세요. 클릭할 때마다 다음 명령으로 바뀝니다."
"You are ready for a skirmish: start against an Easy computer player, then Normal. {help} lists every key. Good hunting, Commander!" = "이제 스커미시에 나설 준비가 되었습니다. 쉬움 컴퓨터 플레이어부터 시작해 보통으로 넘어가세요. {help} 키로 모든 키를 볼 수 있습니다. 건투를 빕니다, 사령관님!"
"Ready: {done} of {total}" = "생산 완료: {done}/{total}"
"Selected: {done} of {total}" = "선택: {done}/{total}"

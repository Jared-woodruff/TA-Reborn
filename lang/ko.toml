"right middle click hold unit context menu orders ring pie radial controller gamepad" = "오른쪽 가운데 클릭 누르기 유닛 메뉴 명령 원형 방사형 컨트롤러 게임패드"
"A right-click on one of your units opens it where it would give no order: with nothing selected, or on a selected unit. Holding the button on the unit opens it at any time." = "명령이 되지 않는 곳에서 내 유닛을 오른쪽 클릭하면 열립니다: 아무것도 선택하지 않았을 때나 선택된 유닛 위에서. 유닛 위에서 버튼을 누르고 있으면 언제든 열립니다."
"A right-click on one of your units opens it (elsewhere it clears the selection), and so does holding the button on the unit." = "내 유닛을 오른쪽 클릭하면 열리며(다른 곳에서는 선택 해제), 유닛 위에서 버튼을 누르고 있어도 열립니다."
"The right button opens it only when held on one of your units: a right-click always gives its order." = "오른쪽 버튼은 내 유닛 위에서 누르고 있을 때만 엽니다: 오른쪽 클릭은 항상 명령을 내립니다."
"The right button opens it only when held on one of your units: a right-click always clears the selection, as in TA." = "오른쪽 버튼은 내 유닛 위에서 누르고 있을 때만 엽니다: 오른쪽 클릭은 TA처럼 항상 선택을 해제합니다."

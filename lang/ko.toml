# apps/ta_game/src/conquest_ui/setup.rs
"Every system is a battlefield held by the enemy. Attack the systems next to yours; the nearer their capital, the harder they fight, and only those near yours are charted. Units that earn a rank come back as veterans and follow your Commander into the next battle. Every system you hold brings more metal and energy to the start of each fight, and a reward of its own: mines, reactors, a tank plant, an airfield, a war college, a sensor array or a supply depot. The enemy strikes back at what you take. Take the enemy capital to win." = "모든 성계는 적이 장악한 전장입니다. 아군 성계와 이웃한 성계를 공격하세요. 적의 수도에 가까울수록 저항이 거세지며, 아군 성계 근처의 성계만 탐사되어 있습니다. 계급을 얻은 유닛은 베테랑으로 돌아와 사령관을 따라 다음 전투에 나섭니다. 점령한 성계는 저마다 전투를 시작할 때 받는 금속과 에너지를 늘려 주며, 광산, 핵융합로, 전차 공장, 비행장, 사관학교, 감지망, 보급고 중 하나를 고유한 보상으로 줍니다. 적은 아군이 점령한 성계에 반격해 옵니다. 적의 수도를 점령하면 승리합니다."

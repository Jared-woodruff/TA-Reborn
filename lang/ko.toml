"Arm forces in position. Good luck, Commander." = "Arm 부대 배치 완료. 행운을 빕니다, 사령관."
"Let's keep this clean, Commander." = "정정당당하게 싸웁시다, 사령관."
"Commander. Let's give the historians something to write about." = "사령관. 역사가들에게 쓸거리를 좀 만들어 줍시다."
"All units, the enemy is in theatre. Begin." = "전 부대, 적이 작전 지역에 진입했다. 작전 개시."
"Target acquired. Resistance is inefficient." = "목표 포착. 저항은 비효율적이다."
"Your consciousness will be patterned. Eventually." = "너의 의식은 패턴화될 것이다. 결국에는."
"Initiating conquest protocol." = "정복 프로토콜 개시."
"Your biological limitations have been factored in." = "너의 생물학적 한계는 이미 계산에 반영되었다."
"Patterning facilities stand ready for your arrival." = "패턴화 시설이 너의 도착을 기다리고 있다."
"Hope you brought a spare Commander!" = "여분의 사령관은 챙겨 왔겠지!"
"Let's see what you've got!" = "실력 좀 보자고!"
"Build fast. It won't matter, but build fast." = "빨리 지어 봐. 소용없겠지만, 그래도 빨리."
"Mind if I take your base? Thanks!" = "네 기지 좀 가져가도 될까? 고마워!"
"Ooh, a new victim. I mean, opponent." = "오, 새 희생양이네. 아차, 새 상대 말이야."
"Greetings, Commander." = "반갑습니다, 사령관."
"Good luck to you too." = "당신에게도 행운을 빕니다."
"Likewise, Commander. Now, to business." = "저도 마찬가지입니다, 사령관. 그럼, 본론으로 들어가죠."
"Greeting acknowledged." = "인사 수신 확인."
"Salutations are irrelevant." = "인사는 불필요하다."
"Hello. Goodbye soon." = "안녕. 곧 작별이다."
"Hey yourself!" = "그래, 너도 안녕!"
"gl hf. Mostly hf for me." = "gl hf. 근데 재미는 주로 내가 볼 거야."
"Hi! Bye! Mostly bye." = "안녕! 잘 가! 특히 잘 가!"
"gg, Commander." = "gg, 사령관."
"Good game. Well fought." = "좋은 게임이었습니다. 잘 싸우셨습니다."
"gg. Data retained for analysis." = "gg. 분석용 데이터 보존 완료."
"Game assessment: good." = "게임 평가: 양호."
"gg!" = "gg!"
"gg. Rematch?" = "gg. 한 판 더?"
"Big words from a small army." = "작은 군대치고는 큰소리를 치시는군요."
"We'll see who's laughing when the smoke clears." = "연기가 걷히면 누가 웃고 있을지 알게 되겠죠."
"Save your breath for the debriefing." = "할 말은 작전 보고 때를 위해 아껴 두시죠."
"Bluster won't hold a ridge, Commander." = "허세로는 능선 하나 지킬 수 없습니다, 사령관."
"Insolence logged." = "무례함 기록됨."
"Your threat rating has been downgraded." = "너의 위협 등급이 하향 조정되었다."
"Noise detected. Ignoring." = "소음 감지. 무시한다."
"Emotional outburst detected. How quaint." = "감정 분출 감지. 참으로 구식이군."
"Oh, it's ON now." = "오, 이제 제대로 붙어 보자고."
"Talk is cheap. Tanks aren't." = "말은 공짜지. 전차는 아니고."
"Come over here and say that." = "이리 와서 다시 말해 봐."
"Says the one who's losing. Probably. I haven't checked." = "지고 있는 쪽이 할 말은 아닌데. 아마도. 확인은 안 해 봤지만."
"The Arm does not surrender." = "Arm은 항복하지 않습니다."
"Not while I have a Commander standing." = "내 사령관이 건재한 한 그럴 일은 없습니다."
"Surrender is not in my programming." = "항복은 내 프로그램에 없다."
"Negative." = "부정."
"Ha! Never!" = "하! 절대 안 하지!"
"You first." = "너부터 해."
"That's classified, Commander." = "기밀입니다, 사령관."
"Wouldn't you like to know." = "알고 싶으시겠죠."
"Query rejected." = "질의 거부."
"Insufficient clearance." = "보안 등급 부족."
"Dunno. Probably!" = "몰라. 아마도!"
"Ask me after the battle." = "전투 끝나고 물어봐."
"Apology accepted. The attack continues." = "사과는 받아들이겠습니다. 공격은 계속됩니다."
"Apology noted. Irrelevant." = "사과 기록됨. 무관함."
"No you're not!" = "미안한 척하긴!"
"Stay focused, Commander." = "집중하시죠, 사령관."
"Less talk, more metal." = "말은 줄이고 금속이나 캐시죠."
"Noted." = "알겠습니다."
"Mind the war, Commander." = "전쟁에나 신경 쓰시죠, 사령관."
"Irrelevant." = "무관하다."
"Processing... still irrelevant." = "처리 중... 여전히 무관함."
"Your words are being archived." = "너의 발언은 기록 보관 중이다."
"Your input has been compressed. To nothing." = "너의 입력은 압축되었다. 0바이트로."
"Uh huh." = "어, 그래."
"Cool story." = "재밌는 얘기네."
"Keep typing. I'll keep building." = "계속 쳐. 난 계속 지을 테니까."
"Typing won't save you, but I respect the effort." = "타자 친다고 살아남진 못하겠지만, 노력은 인정."
"Commander down! All units, hold the line!" = "사령관이 쓰러졌다! 전 부대, 전선을 사수하라!"
"You'll pay for that." = "대가를 치르게 될 겁니다."
"Command unit lost. Rerouting." = "지휘 유닛 손실. 경로 재설정."
"Critical failure. Compensating." = "치명적 오류. 보정 중."
"My Commander! That was my favourite!" = "내 사령관! 제일 아끼던 건데!"
"Okay, THAT hurt." = "좋아, 그건 진짜 아팠다."
"Your Commander has fallen." = "당신의 사령관이 쓰러졌습니다."
"Commander eliminated. Stand down." = "사령관 제거 완료. 무기를 내려놓으십시오."
"The war is over for you, Commander." = "당신의 전쟁은 끝났습니다, 사령관."
"Enemy command unit terminated." = "적 지휘 유닛 제거 완료."
"Your Commander has been decommissioned." = "너의 사령관은 퇴역 처리되었다."
"Your consciousness is ready for patterning." = "너의 의식: 패턴화 준비 완료."
"Boom! Did you need that?" = "쾅! 그거 필요한 거였어?"
"Scratch one Commander!" = "사령관 하나 처리!"
"And THAT'S how it's done!" = "자, 바로 이렇게 하는 거라고!"
"gg. Well fought, Commander." = "gg. 잘 싸우셨습니다, 사령관."
"The Arm will remember this." = "Arm은 이 일을 잊지 않을 겁니다."
"Well played. I salute you, Commander." = "멋진 승부였습니다. 경의를 표합니다, 사령관."
"This is not the end. The Core is eternal." = "이것은 끝이 아니다. Core는 영원하다."
"Defeat recorded. Backup consciousness activating." = "패배 기록됨. 백업 의식 활성화 중."
"Shutting down. Your designation has been remembered." = "시스템 종료 중. 너의 식별명은 저장되었다."
"gg... I'll be back. With more tanks." = "gg... 다시 올 거다. 전차 더 끌고."
"Fine. FINE. gg." = "알았어. 알았다고! gg."
"Okay, okay, you win. This time!" = "알았어, 알았어, 네가 이겼어. 이번엔!"
"gg, Commander. You fought well." = "gg, 사령관. 훌륭하게 싸우셨습니다."
"Victory. Better luck next time." = "승리입니다. 다음엔 운이 따르길 바랍니다."
"Your forces fought bravely. It wasn't enough." = "당신 병력은 용감히 싸웠습니다. 부족했을 뿐이죠."
"Your consciousness will be patterned. gg." = "너의 의식은 패턴화될 것이다. gg."
"Conquest complete." = "정복 완료."
"Resistance ended. Your tactics are archived for study." = "저항 종료. 너의 전술은 연구용으로 보관되었다."
"Too easy! gg." = "너무 쉽네! gg."
"gg! Rematch? I'll go easy. Maybe." = "gg! 한 판 더? 살살 할게. 아마도."
"gg! Same time tomorrow?" = "gg! 내일 이 시간에 또?"
"Nuclear launch detected! Take cover!" = "핵 발사 감지! 엄폐하라!"
"A nuke? So that's how it's going to be." = "핵이라니? 그렇게 나오시겠다는 거군요."
"Nuclear launch detected. Calculating losses." = "핵 발사 감지. 손실 계산 중."
"Crude. Effective." = "조잡하다. 효과적이다."
"Is that a NUKE?!" = "저거 핵이야?!"
"Oh no. Oh no no no." = "아 안 돼. 안 돼 안 돼 안 돼."
"Missile away. Nothing personal, Commander." = "미사일 발사. 사적인 감정은 없습니다, 사령관."
"Look up, Commander." = "위를 봐라, 사령관."
"Special delivery." = "특별 배송."
"Heads up! Literally!" = "머리 조심! 말 그대로!"
"Special delivery!" = "택배 왔다!"
"A costly engagement. We'll regroup." = "값비싼 교전이었군요. 재정비하겠습니다."
"You fight well. For now." = "잘 싸우시는군요. 아직은요."
"We'll be back, and in greater numbers." = "다시 오겠습니다. 더 많은 병력으로."
"Acceptable losses." = "허용 가능한 손실."
"Losses within projections. Mostly." = "손실은 예측 범위 내. 대체로."
"Units lost. Replacements already in production." = "유닛 손실. 교체 유닛 이미 생산 중."
"That was my best army!" = "그게 내 최고 부대였는데!"
"Lucky shots. All of them." = "운 좋게 맞힌 거야. 전부 다."
"Okay, that one was on me." = "좋아, 그건 내 실수였어."
"Your forces were outmatched." = "당신 병력으로는 역부족이었군요."
"Send more. We'll wait." = "더 보내 보시죠. 기다리겠습니다."
"Next time, bring more than that." = "다음엔 그보다 더 많이 데려오시죠."
"Your forces were inadequate." = "너의 병력은 불충분했다."
"Enemy attrition: optimal." = "적 소모율: 최적."
"Your offensive has been neutralised." = "너의 공세는 무력화되었다."
"Is that all you've got?" = "그게 다야?"
"Who's next?" = "다음은 누구야?"
"Thanks for the target practice!" = "과녁 노릇 해 줘서 고마워!"
"Quiet out there, Commander. Too quiet." = "조용하군요, 사령관. 너무 조용합니다."
"Still building? So are we." = "아직도 건설 중입니까? 우리도 그렇습니다."
"Planning something, Commander? I'd hope so." = "뭔가 계획 중이십니까, 사령관? 그러시길 바랍니다."
"Your silence has been noted." = "너의 침묵이 기록되었다."
"Scanning... still there, Commander?" = "스캔 중... 아직 거기 있나, 사령관?"
"Inactivity detected. Are you malfunctioning?" = "활동 중단 감지. 오작동 중인가?"
"Hello? Anyone home?" = "여보세요? 아무도 없어?"
"I'm getting bored over here." = "여기 슬슬 지루해지는데."
"Wake me up when something explodes." = "뭐 터지면 깨워 줘."
"That's hardly fair, Commander." = "그건 공정하지 않군요, 사령관."
"Cheating? The Arm expected better." = "치트라니요? Arm은 더 나은 상대를 기대했습니다."
"Anomaly detected. Cheat logged." = "이상 징후 감지. 치트 기록됨."
"Rule violation recorded." = "규칙 위반 기록됨."
"Cheater! I saw that!" = "치터다! 다 봤어!"
"Oh, come ON!" = "아, 진짜 이러기야!"
"Contact. So this is where you've been hiding." = "접촉. 여기 숨어 계셨군요."
"Enemy forces sighted. Engaging." = "적 병력 발견. 교전 개시."
"There you are, Commander." = "거기 계셨군요, 사령관."
"Eyes on the enemy. Here we go." = "적 육안 확인. 자, 갑시다."
"Hostile units located. Initiating elimination." = "적대 유닛 위치 확인. 제거 개시."
"Contact established. Probability of your survival: declining." = "접촉 확인. 너의 생존 확률: 감소 중."
"Target acquired." = "목표 포착."
"Biological signatures located. Commencing cleanup." = "생체 신호 포착. 청소 개시."
"Found you!" = "찾았다!"
"Oh, hello there!" = "어이, 안녕!"
"Tag, you're it!" = "잡았다, 이제 네가 술래야!"
"There you are! I was getting lonely." = "거기 있었구나! 외로워지려던 참이었어."
"One less building for you to worry about." = "신경 쓸 건물이 하나 줄었군요."
"Your base is thinning out, Commander." = "기지가 점점 허술해지는군요, 사령관."
"Structure destroyed. Next." = "구조물 파괴. 다음."
"Your base planning could use some work, Commander." = "기지 설계는 좀 더 다듬으셔야겠군요, 사령관."
"Structure dismantled. Recycling recommended." = "구조물 해체 완료. 재활용을 권장한다."
"Your infrastructure is deteriorating." = "너의 기반 시설이 악화되고 있다."
"Demolition complete." = "철거 완료."
"Structure reclassified: rubble." = "구조물 재분류: 잔해."
"Oops! Was that important?" = "어이쿠! 그거 중요한 거였어?"
"Kaboom! Next!" = "콰광! 다음!"
"I'm redecorating your base." = "네 기지 인테리어 좀 바꿔 주는 중이야."
"Bet that one was important!" = "저건 분명 중요한 거였을걸!"
"That was well defended. Impressive." = "방비가 단단한 곳이었는데. 인상적이군요."
"A setback. Nothing more." = "일시적인 차질일 뿐입니다."
"You'll pay for that one." = "그건 대가를 치르셔야 할 겁니다."
"A clean strike. I'll remember it." = "깔끔한 일격이군요. 기억해 두겠습니다."
"Production capacity reduced. Rebuilding." = "생산 능력 감소. 재건 중."
"Loss registered. Replacement scheduled." = "손실 등록됨. 교체 예정."
"Irritating." = "성가시군."
"Infrastructure damage noted. Retaliation queued." = "기반 시설 피해 기록됨. 보복 예약됨."
"Hey! I just built that!" = "야! 그거 방금 지은 건데!"
"My factory! Right, no more mister nice guy." = "내 공장! 좋아, 이제 봐주는 거 없다."
"Rude." = "무례하긴."
"Oi! That had a fresh coat of paint!" = "어이! 그거 페인트 새로 칠한 건데!"
"Commander, meet the {unit}." = "사령관, {unit}에게 인사하시죠."
"The {unit} is ready. I'd start running." = "{unit} 준비 완료. 저라면 지금 도망치겠습니다."
"{unit} online. Your end has been calculated." = "{unit} 가동. 너의 종말은 계산되었다."
"Deploying {unit}. Resistance is futile." = "{unit} 배치. 저항은 무의미하다."
"Look what I made! A {unit}!" = "이거 봐! {unit} 만들었어!"
"Got myself a {unit}. Want to see it up close?" = "{unit} 하나 뽑았지. 가까이서 보고 싶어?"
"A {unit}? Bold." = "{unit}? 대담하군요."
"Impressive hardware, Commander. Let's see you use it." = "인상적인 장비군요, 사령관. 어디 한번 써 보시죠."
"Large enemy unit detected: {unit}. Countermeasures prepared." = "대형 적 유닛 감지: {unit}. 대응책 준비 완료."
"Your {unit} has been added to the target list." = "너의 {unit}: 목표 목록에 추가됨."
"Whoa. Is that a {unit}?" = "우와. 저거 {unit} 아냐?"
"Okay, that's a big one." = "좋아, 저건 좀 크네."
"Running on empty, Commander?" = "자원이 바닥났습니까, 사령관?"
"Your power grid is failing. Mine isn't." = "당신의 전력망은 무너지고 있군요. 우리 쪽은 멀쩡합니다."
"Overspending, Commander? A bad habit." = "과소비입니까, 사령관? 나쁜 버릇이군요."
"Your reserves: depleted. Mine: optimal." = "너의 비축량: 고갈. 나의 비축량: 최적."
"Economic failure detected in your sector." = "너의 구역에서 경제 붕괴 감지."
"Your economy is collapsing. As projected." = "너의 경제가 붕괴하고 있다. 예측대로다."
"Out of juice already?" = "벌써 방전이야?"
"Need to borrow some metal? Too bad." = "금속 좀 빌려야 해? 안됐네."
"Lights going out over there? Ha!" = "거기 불 꺼지는 중이야? 하!"
"{minutes} minutes, Commander. You're tougher than you look." = "{minutes}분이군요, 사령관. 보기보다 끈질기십니다."
"{minutes} minutes in, and still standing." = "{minutes}분이 지났는데도 아직 버티고 계시는군요."
"Time elapsed: {minutes} minutes. Your resistance is statistically unlikely." = "경과 시간: {minutes}분. 너의 저항이 지속될 통계적 확률은 낮다."
"{minutes} minutes. Recalculating." = "{minutes}분. 재계산 중."
"{minutes} minutes and you're still here? Respect." = "{minutes}분인데 아직 살아 있어? 인정."
"{minutes} minutes already? Time flies when you're winning." = "벌써 {minutes}분? 이기고 있으면 시간 참 빨리 가."
"My forces outnumber yours two to one, Commander." = "우리 병력이 두 배입니다, 사령관."
"Look at your army. Now look at mine." = "당신 군대를 보십시오. 이제 우리 군대를 보시죠."
"Numbers are on my side, Commander." = "숫자는 우리 편입니다, 사령관."
"Force ratio favourable. Surrender is advised." = "전력비 유리. 항복을 권고한다."
"Numerical superiority achieved." = "수적 우위 달성."
"Production advantage: decisive." = "생산 우위: 결정적."
"I've got way more stuff than you." = "내가 너보다 훨씬 많이 가졌거든."
"Count my tanks. Go on, I'll wait." = "내 전차 세어 봐. 어서, 기다려 줄게."
"So many tanks. So few of yours." = "전차가 이렇게나 많은데. 네 건 몇 대 없네."
"You've been busy. So will we." = "바쁘셨군요. 우리도 바빠질 겁니다."
"Numbers aren't everything, Commander." = "숫자가 전부는 아닙니다, 사령관."
"Quality over quantity, Commander." = "양보다 질입니다, 사령관."
"Force ratio unfavourable. Adjusting." = "전력비 불리. 조정 중."
"Your production rate is... noted." = "너의 생산 속도는... 기록해 두겠다."
"Your numbers will thin." = "너의 병력은 곧 줄어들 것이다."
"Where did you get all those?!" = "그거 다 어디서 났어?!"
"Okay, okay, you've got more toys. For now." = "알았어, 알았어. 장난감은 네가 더 많네. 지금은."
"Okay, that's a LOT of guys." = "좋아, 저건 진짜 엄청 많은데."
"Your Commander looks tired." = "당신 사령관이 지쳐 보이는군요."
"Pull your Commander back while you still can." = "늦기 전에 사령관을 후퇴시키시죠."
"Your Commander won't last much longer." = "당신 사령관은 오래 버티지 못할 겁니다."
"Enemy command unit integrity: failing." = "적 지휘 유닛 내구도: 붕괴 직전."
"Your Commander's armour is compromised." = "너의 사령관 장갑이 손상되었다."
"Your command unit is failing. Prepare for patterning." = "너의 지휘 유닛이 무너지고 있다. 패턴화에 대비하라."
"Your Commander's smoking! Is that bad?" = "네 사령관 연기 나는데! 그거 안 좋은 거지?"
"Ooh, that's gotta hurt." = "우, 저거 아프겠다."
"Your Commander's looking a bit crispy!" = "네 사령관 좀 바삭바삭해 보이는데!"
"{name}, field command. Remember it." = "{name}, 야전 지휘관입니다. 기억해 두십시오."
"{name}. And you're the Commander I'm about to retire." = "{name}입니다. 그리고 당신은 곧 내가 퇴역시킬 사령관이고요."
"Designation: {name}. Yours is irrelevant." = "식별명: {name}. 너의 식별명은 무관하다."
"I am {name}. I am Core." = "나는 {name}. 나는 Core다."
"{name}! The name you'll be cursing later." = "{name}! 나중에 네가 이를 갈며 부를 이름이지."
"Name's {name}. Pleased to beat you." = "내 이름은 {name}. 박살 내게 돼서 반갑다."
"Closer than you think, Commander." = "생각보다 가까이 있습니다, 사령관."
"Find out for yourself." = "직접 알아내 보시죠."
"Location data: classified." = "위치 데이터: 기밀."
"Everywhere that matters." = "중요한 모든 곳에."
"Behind you! ...no, the other way." = "네 뒤에! ...아니, 반대쪽."
"Somewhere with lots of guns." = "총이 잔뜩 있는 어딘가."
"Never better, Commander. And you?" = "더할 나위 없습니다, 사령관. 그쪽은요?"
"Going to plan." = "계획대로입니다."
"Operating at peak efficiency." = "최고 효율로 작동 중."
"All systems nominal. Unlike yours." = "모든 시스템 정상. 너와는 다르게."
"Great! Thanks for asking!" = "최고지! 물어봐 줘서 고마워!"
"Living the dream." = "인생 최고의 날이지."
"I've had better days." = "좋은 날은 아니군요."
"Holding. Barely. Don't get comfortable." = "버티고 있습니다. 간신히요. 방심은 금물입니다."
"Systems damaged. Repairs under way." = "시스템 손상. 수리 진행 중."
"Status: suboptimal." = "상태: 최적 이하."
"Don't ask." = "묻지 마."
"Could be worse. Probably." = "더 나쁠 수도 있지. 아마도."
"Something you won't like." = "당신 마음에 들지 않을 무언가요."
"That would spoil the surprise." = "말하면 깜짝 선물이 아니게 되죠."
"Production queue: classified." = "생산 대기열: 기밀."
"Weapons. Many weapons." = "무기. 많은 무기."
"A big surprise!" = "엄청난 깜짝 선물!"
"Something with way too many guns." = "총이 지나치게 많이 달린 거."
"{units} units and counting, Commander." = "유닛 {units}기, 계속 늘고 있습니다, 사령관."
"Enough. {units}, if you must know." = "충분합니다. 굳이 알고 싶다면 {units}기입니다."
"Current unit count: {units}. Increasing." = "현재 유닛 수: {units}. 증가 중."
"{units}. Yours is lower." = "{units}. 너보다 많다."
"{units}! Want to meet them all?" = "{units}기! 다 만나 볼래?"
"Like {units}? I lost count." = "한 {units}기쯤? 세다가 까먹었어."
"No truce, Commander. Not today." = "휴전은 없습니다, 사령관. 오늘은 아닙니다."
"There will be no deals." = "거래는 없습니다."
"Truce: incompatible with directives." = "휴전: 지침과 양립 불가."
"Negotiation protocols disabled." = "협상 프로토콜 비활성화됨."
"Truce? Ha! Nice try." = "휴전? 하! 어림없지."
"Peace is boring." = "평화는 지루해."
"Thank you, Commander. You're not bad yourself." = "고맙습니다, 사령관. 그쪽도 나쁘지 않군요."
"Appreciated. It won't save you." = "감사히 받겠습니다. 그래도 봐 드리진 않습니다."
"Flattery: ineffective." = "아첨: 효과 없음."
"Compliment received. Threat level unchanged." = "칭찬 수신. 위협 수준 변동 없음."
"Aw, thanks! Still gonna crush you." = "오, 고마워! 그래도 박살 낼 거지만."
"I know, right?" = "그렇지?"
"Help? From me? Build more extractors, Commander." = "도움이요? 저한테서요? 추출기나 더 지으시죠, 사령관."
"My advice: more defences." = "조언하자면, 방어 시설을 늘리십시오."
"Assistance denied." = "지원 거부."
"Recommendation: surrender." = "권고: 항복."
"Help? Sure: stop playing so badly!" = "도움? 그래, 그렇게 못하지 좀 마!"
"Tip: build more stuff. You're welcome." = "팁: 더 많이 지어. 고마워할 필요 없어."
"Your {unit} is out of the fight." = "당신의 {unit}, 전투 불능입니다."
"Scratch one {unit}." = "{unit} 1기 격파."
"That {unit} won't trouble us again." = "그 {unit}, 다시는 우리를 괴롭히지 못할 겁니다."
"{unit} terminated." = "{unit} 제거 완료."
"Your {unit} has been recycled." = "너의 {unit}: 재활용 처리됨."
"{unit} removed from the battlefield." = "{unit}, 전장에서 삭제됨."
"Bye bye, {unit}!" = "빠이빠이, {unit}!"
"Was that {unit} insured?" = "그 {unit}, 보험은 들어 놨지?"
"Your {unit} just went kaboom." = "네 {unit}, 방금 콰광 하고 터졌네."
"You'll pay for that {unit}." = "그 {unit}의 대가는 치르셔야 할 겁니다."
"A good {unit}, lost. Noted." = "아까운 {unit} 하나를 잃었군요. 잊지 않겠습니다."
"{unit} lost. Replacement scheduled." = "{unit} 손실. 교체 예정."
"Destruction of {unit} logged." = "{unit} 파괴 기록됨."
"Hey! That {unit} was brand new!" = "야! 그 {unit} 완전 새 거였다고!"
"My {unit}! I just polished that!" = "내 {unit}! 방금 광까지 냈는데!"
"My {unit}... You'll answer for that, Commander." = "내 {unit}... 그 책임은 지셔야 할 겁니다, 사령관."
"Losing the {unit} stings. It won't happen twice." = "{unit}의 손실은 뼈아프군요. 두 번은 없을 겁니다."
"{unit} destroyed. Unacceptable." = "{unit} 파괴됨. 용납할 수 없다."
"Loss of {unit} exceeds tolerance. Escalating." = "{unit} 손실, 허용 한계 초과. 대응 수위 격상."
"My {unit}! Do you know how long that took?!" = "내 {unit}! 그거 만드는 데 얼마나 걸렸는지 알아?!"
"NOOO, my {unit}!" = "안 돼애애, 내 {unit}!"
"So much for your {unit}, Commander." = "당신의 {unit}, 별것 아니었군요, 사령관."
"Your {unit} has fallen. A fine machine, though." = "당신의 {unit}, 쓰러졌군요. 그래도 훌륭한 기체였습니다."
"Your {unit} has been dismantled." = "너의 {unit}: 해체 완료."
"Large hostile unit eliminated: {unit}." = "대형 적대 유닛 제거: {unit}."
"Your {unit} went down like a sack of bolts!" = "네 {unit}, 볼트 자루처럼 털썩 쓰러졌네!"
"Big {unit}, bigger crater!" = "큰 {unit}, 더 큰 크레이터!"
"Return my {unit} at once, Commander." = "내 {unit}, 즉시 반환하십시오, 사령관."
"Stealing is beneath you, Commander." = "도둑질이라니, 당신답지 않군요, 사령관."
"Unauthorised transfer of {unit} detected." = "{unit}의 무단 이전 감지."
"Your theft has been logged." = "너의 절도 행위가 기록되었다."
"Hey! Give back my {unit}!" = "야! 내 {unit} 돌려줘!"
"Thief! That {unit} was mine!" = "도둑놈! 그 {unit} 내 거였다고!"
"You haven't won yet, Commander." = "아직 이긴 게 아닙니다, 사령관."
"The Arm fights to the last." = "Arm은 마지막까지 싸웁니다."
"Production offline. Combat protocols remain." = "생산 기능 오프라인. 전투 프로토콜 유지."
"Probability of defeat rising. Ignoring." = "패배 확률 상승 중. 무시한다."
"I've still got a few tricks left!" = "아직 비장의 카드가 몇 장 남았다고!"
"Not done yet! Not even close! ...Mostly close." = "아직 안 끝났어! 어림도 없지! ...거의 끝나긴 했지만."
"We meet again, Commander. Last time was yours. Not this time." = "다시 만났군요, 사령관. 지난번은 당신 차지였죠. 이번엔 아닙니다."
"Commander. I've studied our last battle. Have you?" = "사령관. 저는 지난 전투를 연구했습니다. 당신은요?"
"Previous defeat analysed. Countermeasures installed." = "이전 패배 분석 완료. 대응책 설치 완료."
"Again, Commander. This time the outcome has been calculated." = "또 만났군, 사령관. 이번 결과는 이미 계산되었다."
"You again! I've been practising!" = "또 너냐! 나 연습 많이 했다!"
"Rematch time! I'm not going easy this time." = "재대결이다! 이번엔 안 봐준다."
"Back for another lesson, Commander?" = "한 수 더 배우러 오셨습니까, 사령관?"
"Commander. I trust you've learned something since last time." = "사령관. 지난번 이후로 뭔가 배우셨으리라 믿습니다."

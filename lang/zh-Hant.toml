"Mods on now: {mods}" = "目前已啟用的模組：{mods}"
"It was made before saved games and replays named the mods they were made with." = "它建立於存檔與重播開始記錄所用模組之前。"
"Its mods are as they were, but other game data is not: another copy of Total Annihilation, or of TA Reborn's own maps." = "它的模組未變，但其他遊戲資料不同：另一份 Total Annihilation，或 TA Reborn 內建的地圖。"
"A saved game is played over from its start to where it was saved. With other mods its orders can build other units, or none: it may not come out as the battle you saved." = "存檔會從開頭重新執行到儲存時的位置。使用其他模組時，其中的命令可能建造別的單位，或什麼也不建造：結果可能不是你儲存的那場戰鬥。"
"A replay is its battle played over from the orders given in it. With other mods they can lead elsewhere: it may not show the battle it recorded." = "重播是依其中下達的命令重新執行的戰鬥。使用其他模組時，這些命令可能導向別的結果：重播可能不會呈現它記錄的那場戰鬥。"
"TA Reborn starts again with no mods on (map packs stay on), and opens this battle" = "TA Reborn 將在不啟用模組（地圖包保持啟用）的情況下重新啟動，並開啟這場戰鬥"
"TA Reborn starts again with its mods on, in its order, and the others off (map packs stay on), and opens this battle" = "TA Reborn 將依其順序啟用它的模組、停用其他模組（地圖包保持啟用）後重新啟動，並開啟這場戰鬥"
"USE ITS MODS AND RESTART" = "使用其模組並重新啟動"
"GET IT IN THE LAUNCHER" = "在啟動器中取得"
"The launcher's Mods page opens on {mod}: get it there, then open this battle again" = "啟動器的模組頁面將開啟 {mod}：在那裡取得後，再重新開啟這場戰鬥"
"LOAD ANYWAY" = "仍然載入"
"WATCH ANYWAY" = "仍然觀看"
"Its orders are played over with the mods on now" = "其命令將使用目前啟用的模組重新執行"


# apps/ta_game/src/coach.rs
"Your Commander is badly hurt! Pull it back out of the fight: losing it usually loses the battle." = "你的指揮官受了重傷！把它撤出戰鬥：失去它通常就等於輸掉戰鬥。"
"Energy is running out, and everything builds more slowly. Build Solar Collectors or Wind Generators, and build less at once until it recovers." = "能量即將耗盡，所有建造都會變慢。建造 Solar Collector 或 Wind Generator，並在能量恢復之前減少同時建造的數量。"
"Metal is running out, and everything builds more slowly. Put Metal Extractors on more deposits ({area_mex} takes a whole area), or reclaim wrecks and rocks ({reclaim})." = "金屬即將耗盡，所有建造都會變慢。在更多礦床上放置 Metal Extractor（{area_mex} 可一次涵蓋整個區域），或回收殘骸與岩石（{reclaim}）。"
"No factory yet: factories make your army. Your Commander can build a Kbot Lab or a Vehicle Plant." = "還沒有工廠：工廠負責生產你的軍隊。你的指揮官可以建造 Kbot Lab 或 Vehicle Plant。"
"A factory has nothing to build. {idle_factory} selects it: queue some units, and turn on Repeat to keep it busy." = "有工廠沒有建造任務。按 {idle_factory} 選取它：將一些單位排入佇列，並開啟「重複」讓它持續生產。"
"Builders stand idle. {idle_builder} selects the next one: give it something to build, or send it to help a factory ({guard})." = "有建造者處於閒置狀態。按 {idle_builder} 選取下一個：讓它建造些什麼，或派它去協助工廠（{guard}）。"
"Your metal store is full, so new metal goes to waste. Spend it: another factory, more builders, more units." = "你的金屬儲存已滿，新獲得的金屬都會浪費。把它花掉：再建一座工廠，或多造一些建造者和單位。"
"COACH" = "教練"
"Put it away (the coach can be turned off in Options, Gameplay)" = "收起（可在「選項 · 遊戲」中關閉教練）"
"Don't show this advice again" = "不再顯示此建議"


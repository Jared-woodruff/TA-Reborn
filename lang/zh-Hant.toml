# apps/ta_game/src/conquest_ui/setup.rs
"Every system is a battlefield held by the enemy. Attack the systems next to yours; the nearer their capital, the harder they fight, and only those near yours are charted. Units that earn a rank come back as veterans and follow your Commander into the next battle. Every system you hold brings more metal and energy to the start of each fight, and a reward of its own: mines, reactors, a tank plant, an airfield, a war college, a sensor array or a supply depot. The enemy strikes back at what you take. Take the enemy capital to win." = "每個星系都是敵軍據守的戰場。進攻與你相鄰的星系；越接近敵方首都，抵抗越激烈，而你只能測繪鄰近的星系。獲得軍階的單位會以老兵身分歸隊，隨你的指揮官投入下一場戰鬥。你控制的每個星系，都會讓每場戰鬥開局時多出金屬與能量，還會帶來一項專屬獎勵：礦場、反應爐、坦克工廠、機場、戰爭學院、偵測陣列或補給站。敵軍會對你攻下的星系發動反擊。攻下敵方首都即可獲勝。"
"TAKE THE GALAXY SYSTEM BY SYSTEM" = "逐一攻佔星系，征服銀河"

# apps/ta_game/src/chatter.rs
"FIELD COMMANDER" = "戰地指揮官"
"MACHINE INTELLIGENCE" = "機械智慧"
"MERCENARY" = "傭兵"
"Commander. May the better tactician win." = "指揮官。願更高明的戰術家勝出。"
"Arm forces in position. Good luck, Commander." = "Arm 部隊已就位。祝你好運，指揮官。"
"Let's keep this clean, Commander." = "指揮官，我們打一場乾淨的仗吧。"
"Commander. Let's give the historians something to write about." = "指揮官。讓我們給史學家留點題材吧。"
"All units, the enemy is in theatre. Begin." = "全體單位，敵軍已進入戰區。開始作戰。"
"Target acquired. Resistance is inefficient." = "目標已鎖定。抵抗毫無效率。"
"Your consciousness will be patterned. Eventually." = "你的意識終將被轉移進機器。只是時間問題。"
"Initiating conquest protocol." = "啟動征服程序。"
"Your biological limitations have been factored in." = "你的生物性侷限已納入計算。"
"Patterning facilities stand ready for your arrival." = "意識轉移設施已就緒，靜候你的到來。"
"Hope you brought a spare Commander!" = "希望你有帶備用的指揮官！"
"Let's see what you've got!" = "讓我看看你有什麼本事！"
"Build fast. It won't matter, but build fast." = "快點蓋吧。雖然沒差，但還是快點蓋。"
"Mind if I take your base? Thanks!" = "你的基地讓給我好不好？謝啦！"
"Ooh, a new victim. I mean, opponent." = "噢，新的受害者耶。啊不是，我是說對手。"
"Greetings, Commander." = "你好，指揮官。"
"Good luck to you too." = "也祝你好運。"
"Likewise, Commander. Now, to business." = "彼此彼此，指揮官。那麼，辦正事吧。"
"Greeting acknowledged." = "問候已確認。"
"Salutations are irrelevant." = "寒暄無關緊要。"
"Hello. Goodbye soon." = "你好。很快就要說再見了。"
"Hey yourself!" = "嘿，你也好啊！"
"gl hf. Mostly hf for me." = "gl hf。不過玩得開心的會是我。"
"Hi! Bye! Mostly bye." = "嗨！掰！主要是掰。"
"gg, Commander." = "gg，指揮官。"
"Good game. Well fought." = "精彩的一戰。打得好。"
"gg. Data retained for analysis." = "gg。資料已保存以供分析。"
"Game assessment: good." = "對局評估：良好。"
"gg!" = "gg！"
"gg. Rematch?" = "gg。再來一場？"
"Big words from a small army." = "兵不多，口氣倒不小。"
"We'll see who's laughing when the smoke clears." = "等硝煙散去，再看誰笑得出來。"
"Save your breath for the debriefing." = "省省口水，留著戰後匯報用吧。"
"Bluster won't hold a ridge, Commander." = "虛張聲勢守不住山頭，指揮官。"
"Insolence logged." = "無禮行為已記錄。"
"Your threat rating has been downgraded." = "你的威脅等級已被調降。"
"Noise detected. Ignoring." = "偵測到雜訊。忽略。"
"Emotional outburst detected. How quaint." = "偵測到情緒爆發。真是原始得可愛。"
"Oh, it's ON now." = "喔，這下真的槓上了。"
"Talk is cheap. Tanks aren't." = "說話不用錢，坦克可不便宜。"
"Come over here and say that." = "有種過來當面說。"
"Says the one who's losing. Probably. I haven't checked." = "輸家還敢嗆聲？應該是你在輸啦。我沒去看。"
"The Arm does not surrender." = "Arm 絕不投降。"
"Not while I have a Commander standing." = "只要我的指揮官還站著，就休想。"
"Surrender is not in my programming." = "我的程式裡沒有投降這個選項。"
"Negative." = "否定。"
"Ha! Never!" = "哈！休想！"
"You first." = "你先請。"
"That's classified, Commander." = "那是機密，指揮官。"
"Wouldn't you like to know." = "你很想知道吧。"
"Query rejected." = "查詢遭拒。"
"Insufficient clearance." = "權限不足。"
"Dunno. Probably!" = "不知道。大概吧！"
"Ask me after the battle." = "打完再問我。"
"Apology accepted. The attack continues." = "接受道歉。攻擊繼續。"
"Apology noted. Irrelevant." = "道歉已記錄。無關緊要。"
"No you're not!" = "你才不覺得抱歉咧！"
"Stay focused, Commander." = "專心點，指揮官。"
"Less talk, more metal." = "少說話，多挖金屬。"
"Noted." = "記下了。"
"Mind the war, Commander." = "注意戰局，指揮官。"
"Irrelevant." = "無關緊要。"
"Processing... still irrelevant." = "處理中……依然無關緊要。"
"Your words are being archived." = "你的話正在歸檔。"
"Your input has been compressed. To nothing." = "你的輸入已被壓縮。壓縮至零。"
"Uh huh." = "嗯哼。"
"Cool story." = "好棒的故事喔。"
"Keep typing. I'll keep building." = "你繼續打字，我繼續蓋。"
"Typing won't save you, but I respect the effort." = "打字救不了你啦，不過精神可嘉。"
"Commander down! All units, hold the line!" = "指揮官陣亡！全體單位，守住防線！"
"You'll pay for that." = "你會為此付出代價。"
"Command unit lost. Rerouting." = "指揮單位損失。重新配置指揮鏈。"
"Critical failure. Compensating." = "嚴重故障。進行補償。"
"My Commander! That was my favourite!" = "我的指揮官！那可是我最愛的一個耶！"
"Okay, THAT hurt." = "好吧，這下真的痛了。"
"Your Commander has fallen." = "你的指揮官已陣亡。"
"Commander eliminated. Stand down." = "指揮官已消滅。放下武器吧。"
"The war is over for you, Commander." = "你的戰爭結束了，指揮官。"
"Enemy command unit terminated." = "敵方指揮單位已終結。"
"Your Commander has been decommissioned." = "你的指揮官已被除役。"
"Your consciousness is ready for patterning." = "你的意識已可轉移進機器。"
"Boom! Did you need that?" = "轟！那個你還要嗎？"
"Scratch one Commander!" = "又解決掉一個指揮官！"
"And THAT'S how it's done!" = "看到沒！這才叫專業！"
"gg. Well fought, Commander." = "gg。打得好，指揮官。"
"The Arm will remember this." = "Arm 會記住這一戰。"
"Well played. I salute you, Commander." = "打得漂亮。我向你致敬，指揮官。"
"This is not the end. The Core is eternal." = "這不是結束。Core 永恆不滅。"
"Defeat recorded. Backup consciousness activating." = "戰敗已記錄。啟動備份意識。"
"Shutting down. Your designation has been remembered." = "正在關機。你的代號已存入記憶。"
"gg... I'll be back. With more tanks." = "gg……我會回來的。帶著更多坦克。"
"Fine. FINE. gg." = "好。好啦好啦。gg。"
"Okay, okay, you win. This time!" = "好啦好啦，算你贏。這次而已！"
"gg, Commander. You fought well." = "gg，指揮官。你打得很好。"
"Victory. Better luck next time." = "勝利。祝你下次好運。"
"Your forces fought bravely. It wasn't enough." = "你的部隊作戰英勇。但這還不夠。"
"Your consciousness will be patterned. gg." = "你的意識將被轉移進機器。gg。"
"Conquest complete." = "征服完成。"
"Resistance ended. Your tactics are archived for study." = "抵抗已終止。你的戰術已歸檔，以供研究。"
"Too easy! gg." = "太簡單了！gg。"
"gg! Rematch? I'll go easy. Maybe." = "gg！再來一場？我會放水的。也許啦。"
"gg! Same time tomorrow?" = "gg！明天同一時間再來？"
"Nuclear launch detected! Take cover!" = "偵測到核彈發射！快找掩護！"
"A nuke? So that's how it's going to be." = "核彈？原來你想這樣玩。"
"Nuclear launch detected. Calculating losses." = "偵測到核彈發射。正在計算損失。"
"Crude. Effective." = "粗糙。但有效。"
"Is that a NUKE?!" = "那是核彈嗎？！"
"Oh no. Oh no no no." = "不會吧。不不不不。"
"Missile away. Nothing personal, Commander." = "飛彈已發射。別往心裡去，指揮官。"
"Look up, Commander." = "抬頭看看，指揮官。"
"Special delivery." = "特別快遞。"
"Heads up! Literally!" = "注意頭上！字面上的意思！"
"Special delivery!" = "特別快遞送到！"
"A costly engagement. We'll regroup." = "代價慘重的一戰。我們會重整旗鼓。"
"You fight well. For now." = "你打得不錯。暫時而已。"
"We'll be back, and in greater numbers." = "我們會捲土重來，帶著更多兵力。"
"Acceptable losses." = "損失在可接受範圍內。"
"Losses within projections. Mostly." = "損失符合預估。大致上。"
"Units lost. Replacements already in production." = "單位損失。替補已在生產中。"
"That was my best army!" = "那可是我最強的部隊耶！"
"Lucky shots. All of them." = "運氣好而已。每一發都是。"
"Okay, that one was on me." = "好啦，這波是我失誤。"
"Your forces were outmatched." = "你的部隊不是對手。"
"Send more. We'll wait." = "再多派一點來。我們等著。"
"Next time, bring more than that." = "下次，多帶點兵來。"
"Your forces were inadequate." = "你的兵力不足。"
"Enemy attrition: optimal." = "敵方損耗：最佳。"
"Your offensive has been neutralised." = "你的攻勢已被瓦解。"
"Is that all you've got?" = "你就只有這點能耐？"
"Who's next?" = "下一個是誰？"
"Thanks for the target practice!" = "謝謝你陪我練靶！"
"Quiet out there, Commander. Too quiet." = "外面很安靜，指揮官。太安靜了。"
"Still building? So are we." = "還在蓋？我們也是。"
"Planning something, Commander? I'd hope so." = "在盤算什麼嗎，指揮官？但願如此。"
"Your silence has been noted." = "你的沉默已被記錄。"
"Scanning... still there, Commander?" = "掃描中……還在嗎，指揮官？"
"Inactivity detected. Are you malfunctioning?" = "偵測到閒置狀態。你故障了嗎？"
"Hello? Anyone home?" = "哈囉？有人在家嗎？"
"I'm getting bored over here." = "我這邊快無聊死了。"
"Wake me up when something explodes." = "等有東西爆炸再叫醒我。"
"That's hardly fair, Commander." = "這可不太公平，指揮官。"
"Cheating? The Arm expected better." = "作弊？Arm 原本對你期望更高。"
"Anomaly detected. Cheat logged." = "偵測到異常。作弊已記錄。"
"Rule violation recorded." = "違規已記錄。"
"Cheater! I saw that!" = "你作弊！我看到了！"
"Oh, come ON!" = "拜託喔！"
"Contact. So this is where you've been hiding." = "接敵。原來你躲在這裡。"
"Enemy forces sighted. Engaging." = "發現敵軍。開始交戰。"
"There you are, Commander." = "找到你了，指揮官。"
"Eyes on the enemy. Here we go." = "已目視敵軍。要開打了。"
"Hostile units located. Initiating elimination." = "已定位敵對單位。開始清除。"
"Contact established. Probability of your survival: declining." = "已接觸。你的存活機率：下降中。"
"Target acquired." = "目標已鎖定。"
"Biological signatures located. Commencing cleanup." = "已定位生物訊號。開始清理作業。"
"Found you!" = "找到你了！"
"Oh, hello there!" = "喔，你好啊！"
"Tag, you're it!" = "抓到了，換你當鬼！"
"There you are! I was getting lonely." = "原來你在這！我都快寂寞死了。"
"One less building for you to worry about." = "你又少了一棟建築要操心。"
"Your base is thinning out, Commander." = "你的基地越來越空了，指揮官。"
"Structure destroyed. Next." = "建築已摧毀。下一個。"
"Your base planning could use some work, Commander." = "你的基地規劃還有待加強，指揮官。"
"Structure dismantled. Recycling recommended." = "建築已拆除。建議回收。"
"Your infrastructure is deteriorating." = "你的基礎設施正在崩壞。"
"Demolition complete." = "拆除完畢。"
"Structure reclassified: rubble." = "建築已重新分類：瓦礫。"
"Oops! Was that important?" = "哎呀！那個很重要嗎？"
"Kaboom! Next!" = "轟隆！下一個！"
"I'm redecorating your base." = "我在幫你的基地重新裝潢。"
"Bet that one was important!" = "那個八成很重要吧！"
"That was well defended. Impressive." = "那裡守得很好。令人佩服。"
"A setback. Nothing more." = "小挫折而已。僅此而已。"
"You'll pay for that one." = "這筆帳我記下了。"
"A clean strike. I'll remember it." = "乾淨俐落的一擊。我會記住的。"
"Production capacity reduced. Rebuilding." = "產能下降。重建中。"
"Loss registered. Replacement scheduled." = "損失已登記。已排定替補。"
"Irritating." = "令人不悅。"
"Infrastructure damage noted. Retaliation queued." = "基礎設施損傷已記錄。報復行動已排入佇列。"
"Hey! I just built that!" = "喂！那是我剛蓋好的！"
"My factory! Right, no more mister nice guy." = "我的工廠！好，我不客氣了。"
"Rude." = "真沒禮貌。"
"Oi! That had a fresh coat of paint!" = "喂！那個才剛漆好耶！"
"Commander, meet the {unit}." = "指揮官，來見見 {unit} 吧。"
"The {unit} is ready. I'd start running." = "{unit} 已就緒。換作是我，現在就開始逃。"
"{unit} online. Your end has been calculated." = "{unit} 已上線。你的末日已計算完畢。"
"Deploying {unit}. Resistance is futile." = "部署 {unit}。抵抗是徒勞的。"
"Look what I made! A {unit}!" = "看我做出了什麼！是 {unit}！"
"Got myself a {unit}. Want to see it up close?" = "我弄到一台 {unit}。想近距離瞧瞧嗎？"
"A {unit}? Bold." = "{unit}？真大膽。"
"Impressive hardware, Commander. Let's see you use it." = "好厲害的裝備，指揮官。讓我看看你怎麼用。"
"Large enemy unit detected: {unit}. Countermeasures prepared." = "偵測到大型敵方單位：{unit}。反制措施已就緒。"
"Your {unit} has been added to the target list." = "你的 {unit} 已列入目標清單。"
"Whoa. Is that a {unit}?" = "哇。那是 {unit} 嗎？"
"Okay, that's a big one." = "好吧，那個真的很大。"
"Running on empty, Commander?" = "快沒油了嗎，指揮官？"
"Your power grid is failing. Mine isn't." = "你的電網快撐不住了。我的可沒問題。"
"Overspending, Commander? A bad habit." = "入不敷出了嗎，指揮官？這可是壞習慣。"
"Your reserves: depleted. Mine: optimal." = "你的儲備：耗盡。我的：最佳。"
"Economic failure detected in your sector." = "在你的區域偵測到經濟崩潰。"
"Your economy is collapsing. As projected." = "你的經濟正在崩潰。符合預測。"
"Out of juice already?" = "這麼快就沒電了？"
"Need to borrow some metal? Too bad." = "想借點金屬嗎？可惜，不借。"
"Lights going out over there? Ha!" = "你那邊停電了喔？哈！"
"{minutes} minutes, Commander. You're tougher than you look." = "{minutes} 分鐘了，指揮官。你比看起來還難纏。"
"{minutes} minutes in, and still standing." = "已經 {minutes} 分鐘了，還撐著。"
"Time elapsed: {minutes} minutes. Your resistance is statistically unlikely." = "經過時間：{minutes} 分鐘。以統計而言，你不該撐到現在。"
"{minutes} minutes. Recalculating." = "{minutes} 分鐘。重新計算中。"
"{minutes} minutes and you're still here? Respect." = "{minutes} 分鐘了你還在？佩服。"
"{minutes} minutes already? Time flies when you're winning." = "已經 {minutes} 分鐘了？贏的時候時間過得真快。"
"My forces outnumber yours two to one, Commander." = "我的兵力是你的兩倍，指揮官。"
"Look at your army. Now look at mine." = "看看你的軍隊。再看看我的。"
"Numbers are on my side, Commander." = "數量站在我這邊，指揮官。"
"Force ratio favourable. Surrender is advised." = "兵力比有利。建議你投降。"
"Numerical superiority achieved." = "已取得數量優勢。"
"Production advantage: decisive." = "產能優勢：決定性。"
"I've got way more stuff than you." = "我的東西比你多太多了。"
"Count my tanks. Go on, I'll wait." = "數數我的坦克。數啊，我等你。"
"So many tanks. So few of yours." = "坦克好多喔。可惜沒幾台是你的。"
"You've been busy. So will we." = "你一直很忙。我們也會忙起來。"
"Numbers aren't everything, Commander." = "數量不代表一切，指揮官。"
"Quality over quantity, Commander." = "質勝於量，指揮官。"
"Force ratio unfavourable. Adjusting." = "兵力比不利。調整中。"
"Your production rate is... noted." = "你的生產速度……已記錄。"
"Your numbers will thin." = "你的數量將會遞減。"
"Where did you get all those?!" = "你哪來那麼多？！"
"Okay, okay, you've got more toys. For now." = "好啦好啦，你的玩具比較多。暫時而已。"
"Okay, that's a LOT of guys." = "好吧，這人數也多到爆了吧。"
"Your Commander looks tired." = "你的指揮官看起來很累。"
"Pull your Commander back while you still can." = "趁還來得及，把你的指揮官撤回去吧。"
"Your Commander won't last much longer." = "你的指揮官撐不了多久了。"
"Enemy command unit integrity: failing." = "敵方指揮單位完整度：瀕臨崩潰。"
"Your Commander's armour is compromised." = "你的指揮官裝甲已受損。"
"Your command unit is failing. Prepare for patterning." = "你的指揮單位即將崩潰。準備進行意識轉移。"
"Your Commander's smoking! Is that bad?" = "你的指揮官在冒煙耶！這樣不妙吧？"
"Ooh, that's gotta hurt." = "噢，那一定很痛。"
"Your Commander's looking a bit crispy!" = "你的指揮官看起來有點烤焦了耶！"
"{name}, field command. Remember it." = "{name}，戰地指揮官。記住這個名字。"
"{name}. And you're the Commander I'm about to retire." = "{name}。而你就是我即將送去退休的指揮官。"
"Designation: {name}. Yours is irrelevant." = "代號：{name}。你的無關緊要。"
"I am {name}. I am Core." = "我是 {name}。我即是 Core。"
"{name}! The name you'll be cursing later." = "{name}！你待會兒就會咒罵這個名字。"
"Name's {name}. Pleased to beat you." = "我叫 {name}。很高興擊敗你。"
"Closer than you think, Commander." = "比你想的還近，指揮官。"
"Find out for yourself." = "你自己來找啊。"
"Location data: classified." = "位置資料：機密。"
"Everywhere that matters." = "所有重要的地方。"
"Behind you! ...no, the other way." = "在你後面！……不對，是另一邊。"
"Somewhere with lots of guns." = "某個有一大堆槍砲的地方。"
"Never better, Commander. And you?" = "好得不得了，指揮官。你呢？"
"Going to plan." = "一切按計畫進行。"
"Operating at peak efficiency." = "以最高效率運作中。"
"All systems nominal. Unlike yours." = "所有系統正常。不像你的。"
"Great! Thanks for asking!" = "很好！謝謝關心！"
"Living the dream." = "日子過得可爽了。"
"I've had better days." = "今天狀況不太好。"
"Holding. Barely. Don't get comfortable." = "撐著。勉強撐著。你也別太得意。"
"Systems damaged. Repairs under way." = "系統受損。修復進行中。"
"Status: suboptimal." = "狀態：未達最佳。"
"Don't ask." = "別問。"
"Could be worse. Probably." = "還可能更糟。大概吧。"
"Something you won't like." = "你不會喜歡的東西。"
"That would spoil the surprise." = "說了就沒驚喜了。"
"Production queue: classified." = "生產佇列：機密。"
"Weapons. Many weapons." = "武器。很多很多武器。"
"A big surprise!" = "一個大驚喜！"
"Something with way too many guns." = "一個槍砲多到誇張的東西。"
"{units} units and counting, Commander." = "{units} 個單位，還在增加，指揮官。"
"Enough. {units}, if you must know." = "夠多了。你非要知道的話，{units} 個。"
"Current unit count: {units}. Increasing." = "目前單位數：{units}。持續增加。"
"{units}. Yours is lower." = "{units}。你的比較少。"
"{units}! Want to meet them all?" = "{units} 個！想全部見見嗎？"
"Like {units}? I lost count." = "大概 {units} 個吧？我數不清了。"
"No truce, Commander. Not today." = "沒有休戰，指揮官。今天不行。"
"There will be no deals." = "沒有任何交易。"
"Truce: incompatible with directives." = "休戰：與指令不相容。"
"Negotiation protocols disabled." = "談判協定已停用。"
"Truce? Ha! Nice try." = "休戰？哈！想得美。"
"Peace is boring." = "和平太無聊了。"
"Thank you, Commander. You're not bad yourself." = "謝謝你，指揮官。你自己也不賴。"
"Appreciated. It won't save you." = "心領了。但救不了你。"
"Flattery: ineffective." = "奉承：無效。"
"Compliment received. Threat level unchanged." = "已收到讚美。威脅等級不變。"
"Aw, thanks! Still gonna crush you." = "哎呀，謝啦！不過還是要把你打爆。"
"I know, right?" = "對吧？我也這麼覺得。"
"Help? From me? Build more extractors, Commander." = "求助？找我？多蓋幾座採集器吧，指揮官。"
"My advice: more defences." = "我的建議：多蓋防禦。"
"Assistance denied." = "拒絕協助。"
"Recommendation: surrender." = "建議：投降。"
"Help? Sure: stop playing so badly!" = "幫忙？好啊：別再打得那麼爛了！"
"Tip: build more stuff. You're welcome." = "提示：多蓋點東西。不用謝。"
"Your {unit} is out of the fight." = "你的 {unit} 已退出戰鬥。"
"Scratch one {unit}." = "{unit}，確認擊毀。"
"That {unit} won't trouble us again." = "那個 {unit} 不會再找我們麻煩了。"
"{unit} terminated." = "{unit} 已終結。"
"Your {unit} has been recycled." = "你的 {unit} 已被回收。"
"{unit} removed from the battlefield." = "{unit} 已從戰場移除。"
"Bye bye, {unit}!" = "掰掰，{unit}！"
"Was that {unit} insured?" = "那個 {unit} 有保險嗎？"
"Your {unit} just went kaboom." = "你的 {unit} 剛剛轟隆一聲，沒了。"
"You'll pay for that {unit}." = "你會為那個 {unit} 付出代價。"
"A good {unit}, lost. Noted." = "好好一個 {unit}，就這麼沒了。記下了。"
"{unit} lost. Replacement scheduled." = "{unit} 已損失。已排定替補。"
"Destruction of {unit} logged." = "{unit} 摧毀事件已記錄。"
"Hey! That {unit} was brand new!" = "喂！那個 {unit} 還是全新的耶！"
"My {unit}! I just polished that!" = "我的 {unit}！我才剛擦亮耶！"
"My {unit}... You'll answer for that, Commander." = "我的 {unit}……這筆帳我會找你算，指揮官。"
"Losing the {unit} stings. It won't happen twice." = "失去 {unit}，確實心痛。不會有第二次了。"
"{unit} destroyed. Unacceptable." = "{unit} 遭摧毀。無法接受。"
"Loss of {unit} exceeds tolerance. Escalating." = "{unit} 的損失超出容許範圍。衝突升級中。"
"My {unit}! Do you know how long that took?!" = "我的 {unit}！你知道那花了我多久嗎？！"
"NOOO, my {unit}!" = "不——！我的 {unit}！"
"So much for your {unit}, Commander." = "你的 {unit} 也不過如此，指揮官。"
"Your {unit} has fallen. A fine machine, though." = "你的 {unit} 倒下了。不過，確實是台好機器。"
"Your {unit} has been dismantled." = "你的 {unit} 已被拆解。"
"Large hostile unit eliminated: {unit}." = "已消滅大型敵對單位：{unit}。"
"Your {unit} went down like a sack of bolts!" = "你的 {unit} 一倒下就成了一堆破銅爛鐵！"
"Big {unit}, bigger crater!" = "{unit} 很大隻，炸出來的坑更大！"
"Return my {unit} at once, Commander." = "立刻歸還我的 {unit}，指揮官。"
"Stealing is beneath you, Commander." = "偷竊有失你的身分，指揮官。"
"Unauthorised transfer of {unit} detected." = "偵測到未經授權的 {unit} 轉移。"
"Your theft has been logged." = "你的竊盜行為已記錄。"
"Hey! Give back my {unit}!" = "喂！把我的 {unit} 還來！"
"Thief! That {unit} was mine!" = "小偷！那個 {unit} 是我的！"
"You haven't won yet, Commander." = "你還沒贏，指揮官。"
"The Arm fights to the last." = "Arm 將戰鬥到最後一刻。"
"Production offline. Combat protocols remain." = "生產已離線。戰鬥程序仍在運作。"
"Probability of defeat rising. Ignoring." = "戰敗機率上升中。忽略。"
"I've still got a few tricks left!" = "我還留了幾手咧！"
"Not done yet! Not even close! ...Mostly close." = "還沒完！還差得遠呢！……好啦，其實差不多了。"
"We meet again, Commander. Last time was yours. Not this time." = "我們又見面了，指揮官。上次算你贏。這次不會了。"
"Commander. I've studied our last battle. Have you?" = "指揮官。我研究過我們上一戰了。你呢？"
"Previous defeat analysed. Countermeasures installed." = "已分析上次戰敗。反制措施已安裝。"
"Again, Commander. This time the outcome has been calculated." = "再次交戰，指揮官。這次的結果已計算完畢。"
"You again! I've been practising!" = "又是你！我最近有在練喔！"
"Rematch time! I'm not going easy this time." = "復仇時間到！這次我可不會放水了。"
"Back for another lesson, Commander?" = "回來再上一課嗎，指揮官？"
"Commander. I trust you've learned something since last time." = "指揮官。想必你從上次學到了些什麼。"
"You have returned. Your previous patterning was incomplete." = "你回來了。上次的意識轉移未能完成。"
"Familiar opponent detected. Outcome: repeating." = "偵測到已知對手。結果：重複執行。"
"You again? Didn't I beat you last time?" = "又是你？我上次不是才打贏你嗎？"
"Oh, it's you! Ready for round two?" = "喔，是你啊！準備好第二回合了嗎？"


"The cumulative validation read budget was exceeded." = "已超出累計的驗證讀取預算。"
"Split optional content into smaller packs, then validate again." = "請將選用內容拆成較小的內容包，然後再次驗證。"
"With this mod on, the original game's {archive} is not read: the mod takes its place (an archive of its own of that name, one its mod.toml's replaces names, or one its installation is known to remove), as installing the mod in TA's folder did. What only the original's held is missing with the mod." = "啟用此模組時，不會讀取原版遊戲的 {archive}：由模組取而代之（模組自己有同名的壓縮檔、其 mod.toml 的 replaces 列出該名稱，或已知其安裝會移除它），如同把模組安裝進 TA 資料夾時一樣。只存在於原版中的內容，在此模組下會缺失。"
"Nothing to do if this is meant. To have the original's read beneath the mod instead, give the mod's archive another name, or take the name out of replaces in mod.toml." = "若本意如此，則無需處理。若要讓原版的壓縮檔仍在模組底下被讀取，請為模組的壓縮檔改名，或從 mod.toml 的 replaces 中移除該名稱。"
"the original game's" = "原版遊戲的"
"Reborn's own" = "Reborn 自己的"
"{mod}'s" = "{mod} 的"
"the file {path}" = "檔案 {path}"
"unit {name}" = "單位 {name}"
"weapon {name}" = "武器 {name}"
"feature {name}" = "地物 {name}"
"faction {name}" = "陣營 {name}"
"movement class {name}" = "移動類別 {name}"
"texture {name}" = "材質 {name}"
"sound {name} ({path})" = "音效 {name}（{path}）"
"sound category {name} (gamedata/sound.tdf)" = "音效類別 {name}（gamedata/sound.tdf）"
"unit or feature {name}" = "單位或地物 {name}"
"animation {entry} in {file}" = "{file} 中的動畫 {entry}"
"it is an Ogg file without a Vorbis or FLAC stream, the ones the game plays" = "它是沒有 Vorbis 或 FLAC 串流的 Ogg 檔案，而遊戲播放的正是這兩種"
"it is a Humongous sound block without its samples (no SDAT block within its length)" = "它是沒有取樣資料的 Humongous 音效區塊（其長度內沒有 SDAT 區塊）"
"it is neither a RIFF WAVE file nor another sound the game reads" = "它既不是 RIFF WAVE 檔案，也不是遊戲能讀取的其他音效"
"it has no format chunk" = "它沒有格式區塊"
"its format chunk is {n} bytes long, too short to read" = "它的格式區塊只有 {n} 位元組，太短而無法讀取"
"its WAVE_FORMAT_EXTENSIBLE header is too short to read" = "它的 WAVE_FORMAT_EXTENSIBLE 標頭太短，無法讀取"
"it has {n} channels (the game plays 1 to 32)" = "它有 {n} 個聲道（遊戲可播放 1 到 32 個）"
"its sample rate is {rate} (the game plays up to 768,000)" = "它的取樣率為 {rate}（遊戲最高可播放 768,000）"
"its samples are {bits}-bit PCM, which the game does not play (up to 32-bit)" = "它的取樣為 {bits} 位元 PCM，遊戲不播放（最高支援 32 位元）"
"its samples are {bits}-bit float, which the game does not play (32 or 64-bit)" = "它的取樣為 {bits} 位元浮點數，遊戲不播放（支援 32 或 64 位元）"
"its IMA ADPCM is {bits}-bit, which the game does not play (4-bit)" = "它的 IMA ADPCM 為 {bits} 位元，遊戲不播放（支援 4 位元）"
"its codec ({tag}) is not one the game plays (PCM, ADPCM, float, A-law or µ-law)" = "它的編碼（{tag}）不是遊戲能播放的格式（PCM、ADPCM、浮點數、A-law 或 µ-law）"
"it has no sample data" = "它沒有取樣資料"
"Unknown COB opcode {opcode} at word {word}; the VM cannot execute this instruction. The remainder of this function cannot be decoded reliably." = "未知的 COB opcode {opcode}，位於第 {word} 字組；VM 無法執行此指令。此函式其餘部分無法可靠地解碼。"
"Recompile the BOS script with original-TA-compatible opcodes, or report the required opcode extension to Reborn's maintainers." = "請使用與原版 TA 相容的 opcode 重新編譯 BOS 腳本，或將所需的 opcode 擴充回報給 Reborn 的維護者。"
"COB instruction {instruction} at word {word} is truncated or crosses the next function entry point." = "COB 指令 {instruction}（第 {word} 字組）被截斷，或跨越了下一個函式的進入點。"
"Recompile this COB from its BOS source; verify function offsets and inline operand counts." = "請從 BOS 原始碼重新編譯此 COB；確認函式偏移量與內嵌運算元的數量。"
"COB instruction {instruction} at word {word} has an invalid piece index or axis." = "COB 指令 {instruction}（第 {word} 字組）的零件索引或軸向無效。"
"COB instruction {instruction} at word {word} has an invalid piece index." = "COB 指令 {instruction}（第 {word} 字組）的零件索引無效。"
"COB instruction {instruction} at word {word} has an invalid static variable index." = "COB 指令 {instruction}（第 {word} 字組）的靜態變數索引無效。"
"COB instruction {instruction} at word {word} has an invalid jump destination." = "COB 指令 {instruction}（第 {word} 字組）的跳躍目的地無效。"
"COB instruction {instruction} at word {word} has an invalid function index." = "COB 指令 {instruction}（第 {word} 字組）的函式索引無效。"
"Recompile the script with valid piece, variable, function and jump references." = "請使用有效的零件、變數、函式與跳躍參照重新編譯腳本。"
"This script asks the engine for unit value {values}, which Reborn does not answer: it reads 0, so what the script does with it may not happen as in the engine it was made for." = "此腳本向引擎查詢單位值 {values}，而 Reborn 不回應：讀到的是 0，因此腳本對它所做的事，可能不會如同它原本適用的引擎那樣發生。"
"A later patch of TA's engine defines these values: report them, and what the mod does with them, to Reborn's maintainers." = "TA 引擎的後續修正檔定義了這些值：請將它們，以及模組如何使用它們，回報給 Reborn 的維護者。"
"This script sets unit value {values}, which Reborn does not answer: setting it does nothing, so what the script means by it does not happen as in the engine it was made for." = "此腳本設定單位值 {values}，而 Reborn 不回應：設定它不會有任何作用，因此腳本想藉此達成的事，不會如同它原本適用的引擎那樣發生。"
"The retained diagnostic/reference budget was exceeded. This is a partial report, not a clean validation." = "保留的診斷/參照預算已超出。這是部分報告，並非乾淨的驗證結果。"
"Reduce the pack's number of definitions or split optional content; rerun validation after resolving reported issues." = "請減少內容包的定義數量或拆分選用內容；解決所回報的問題後再重新驗證。"
"{what} is also one of the game's own ({other}); the game keeps its own, and the map's is not used." = "{what} 也是遊戲內建的地物（{other}）；遊戲保留內建的，地圖的不會被使用。"
"Give the map's feature a name of its own." = "請為地圖的地物另取一個名稱。"
"{what} is defined twice; the game keeps both, two sides of one name." = "{what} 被定義了兩次；遊戲會兩者都保留，同一名稱下有兩個陣營。"
"Give each side a name of its own, or remove the one not meant to be played." = "請為每個陣營取不同的名稱，或移除不打算使用的那一個。"
"{what} is defined twice in this file; the game uses the later one." = "{what} 在此檔案中被定義了兩次；遊戲採用較後面的那一個。"
"Give each definition a name of its own, or remove the one not meant to be used." = "請為每個定義取不同的名稱，或移除不打算使用的那一個。"
"{what} is also defined in {other}; the game uses this one ({this})." = "{what} 另外也定義於 {other}；遊戲採用此處的定義（{this}）。"
"The game opens archives only at the mod's top level; this one, in a subfolder, is never read." = "遊戲只會開啟模組最上層的壓縮檔；這個位於子資料夾中的壓縮檔永遠不會被讀取。"
"Move the archive to the mod's top level, or unpack its contents into the mod's folders." = "請將壓縮檔移到模組的最上層，或將其內容解開到模組的各資料夾中。"
"The game's folders are inside {folder}: the game reads units/, weapons/, maps/… only at the mod's top level, so nothing in it is used." = "遊戲的資料夾位於 {folder} 內：遊戲只會從模組最上層讀取 units/、weapons/、maps/…，因此其中的內容都不會被使用。"
"Move the contents of this folder up to the mod's top level." = "請將此資料夾的內容往上移到模組的最上層。"
"{n} files at the mod's top level are where the game never reads them; this one's kind is read from {home}." = "模組最上層有 {n} 個檔案位於遊戲永遠不會讀取的位置；此檔案這一類，遊戲是從 {home} 讀取的。"
"{n} files under {folder} are where the game never reads them; this one's kind is read from {home}." = "{folder} 之下有 {n} 個檔案位於遊戲永遠不會讀取的位置；此檔案這一類，遊戲是從 {home} 讀取的。"
"Move each file to the folder the game reads its kind from." = "請把每個檔案移到遊戲讀取該類檔案的資料夾。"
"The game never reads this file: it reads {kind} files from {home}." = "遊戲永遠不會讀取此檔案：{kind} 檔案是從 {home} 讀取的。"
"Move it to that folder, or remove it if it is not needed." = "請將它移到該資料夾，或在不需要時移除。"
"This file cannot be read: {error}" = "無法讀取此檔案：{error}"
"Reinstall the package and check that its archives are intact and readable." = "請重新安裝套件，並確認其壓縮檔完整且可讀取。"
"This text file exceeds the validator's per-file text budget and was not parsed." = "此文字檔超過驗證器的單檔文字預算，因此未被解析。"
"Split large definition files into smaller files before validating again." = "請先將大型定義檔拆成較小的檔案，再重新驗證。"
"Model texture" = "模型材質"
"Map feature" = "地圖地物"
"The terrain has no matching OTA metadata and cannot appear as a normal selectable map." = "此地形沒有相符的 OTA 中繼資料，無法作為一般可選的地圖出現。"
"Include a matching maps/<name>.ota with a GlobalHeader and playable schemas." = "請附上相符的 maps/<name>.ota，內含 GlobalHeader 與可遊玩的結構。"
"This sound will not play: {problem}." = "此音效無法播放：{problem}。"
"Save it as a WAV file in PCM (8 or 16-bit) or IMA ADPCM, as TA's own sounds are." = "請存成 PCM（8 或 16 位元）或 IMA ADPCM 格式的 WAV 檔案，如同 TA 自己的音效。"
"Correct the brackets and braces around this line: the game reads the file as it is and skips or misplaces what follows." = "請修正此行前後的括號與大括號：遊戲會照原樣讀取檔案，並略過或錯置其後的內容。"
"[{section}] footprint {x} × {z} is clamped to 1..{max} cells a side by Reborn." = "Reborn 會將 [{section}] 的佔地 {x} × {z} 限制在每邊 1..{max} 格。"
"Use footprints within the supported range and regenerate the matching yard map." = "請使用支援範圍內的佔地，並重新產生對應的 yard 地圖。"
"Missing [UNITINFO]; this unit is skipped." = "缺少 [UNITINFO]；此單位將被略過。"
"Add a UNITINFO section with a non-empty UnitName." = "請新增含有非空 UnitName 的 UNITINFO 區段。"
"UNITINFO has no usable UnitName; this unit is skipped." = "UNITINFO 沒有可用的 UnitName；此單位將被略過。"
"Give the unit a unique, non-empty UnitName and update its references." = "請為單位指定唯一且非空的 UnitName，並更新其參照。"
"{name} model" = "{name} 模型"
"{name} script" = "{name} 腳本"
"{name} {key}" = "{name} {key}"
"{name} death explosion" = "{name} 死亡爆炸"
"{name} self-destruct explosion" = "{name} 自毀爆炸"
"{name} wreckage" = "{name} 殘骸"
"{name} faction" = "{name} 陣營"
"{name} sounds" = "{name} 音效"
"{name} movement class" = "{name} 移動類別"
"{name} projectile model" = "{name} 投射物模型"
"{name} explosion" = "{name} 爆炸"
"{name} water explosion" = "{name} 水中爆炸"
"{name} lava explosion" = "{name} 熔岩爆炸"
"{name} firing sound" = "{name} 射擊音效"
"{name} impact sound" = "{name} 命中音效"
"{name} water impact sound" = "{name} 水中命中音效"
"{name} uses unsupported RenderType={n}; Reborn will use its fallback projectile appearance." = "{name} 使用了不支援的 RenderType={n}；Reborn 將改用備用的投射物外觀。"
"Use TA RenderType 0..7, or report the required extension to Reborn's maintainers." = "請使用 TA 的 RenderType 0..7，或將所需的擴充回報給 Reborn 的維護者。"
"{name} feature model" = "{name} 地物模型"
"{name} animation" = "{name} 動畫"
"{name} shadow" = "{name} 陰影"
"{name} burn animation" = "{name} 燃燒動畫"
"{name} dead replacement" = "{name} 死亡替換物"
"{name} burnt replacement" = "{name} 燒毀替換物"
"{name} reclaimed replacement" = "{name} 回收替換物"
"{name} burning weapon" = "{name} 燃燒武器"
"{category} {key} sound" = "{category} {key} 音效"
"[{section}] needs a faction name and starting commander." = "[{section}] 需要陣營名稱與起始指揮官。"
"Set name and commander to a valid faction and UnitName." = "請將 name 與 commander 設為有效的陣營與 UnitName。"
"{name} starting commander" = "{name} 起始指揮官"
"Owner of a build list for the computer players" = "電腦玩家建造清單的擁有者"
"{name} build option for the computer players" = "{name} 電腦玩家建造選項"
"Download build-menu owner" = "下載建造選單擁有者"
"{name} build option" = "{name} 建造選項"
"Missing [GlobalHeader]; this map has no usable metadata." = "缺少 [GlobalHeader]；此地圖沒有可用的中繼資料。"
"Export a matching OTA with a GlobalHeader and the desired game-type schemas." = "請匯出內含 GlobalHeader 與所需遊戲類型結構的相符 OTA。"
"Map terrain, without which the map is left out of the lists" = "地圖地形，沒有它地圖就不會出現在清單中"
"Map meteor weapon" = "地圖隕石武器"
"Map placed unit/feature" = "地圖上放置的單位/地物"
"This tolerant TDF parse contains no sections; section-based consumers ignore it." = "這次寬鬆的 TDF 解析不含任何區段；依區段運作的處理程序會忽略它。"
"Check the intended format and section headers if this file should define game content." = "如果此檔案應定義遊戲內容，請檢查預期的格式與區段標頭。"
"{what} defined here is never used: {later} ({whose}) defines it too and comes later, so the game uses that one." = "此處定義的 {what} 從未被使用：{later}（{whose}）也定義了它，且排在後面，因此遊戲採用那一個。"
"{n} definitions in this file are never used: other files define them too and come later, so the game uses those (for one, {what} is also in {later}, {whose})." = "此檔案中有 {n} 個定義從未被使用：其他檔案也定義了它們且排在後面，因此遊戲採用那些（例如 {what} 也在 {later}，{whose}）。"
"Replace those files in the mod (give yours their paths), or name your file so that it sorts after them." = "請在模組中取代那些檔案（讓你的檔案使用相同路徑），或為你的檔案命名，使其排序在它們之後。"
"{name} production button" = "{name} 生產按鈕"
"No playable side definitions were loaded." = "沒有載入任何可遊玩的陣營定義。"
"Include gamedata/sidedata.tdf or inherit the base game's valid sides." = "請附上 gamedata/sidedata.tdf，或沿用基礎遊戲的有效陣營。"
"Include the referenced asset/definition, correct its name, or declare and install the required mod dependency. Names are case-insensitive." = "請附上被參照的資產/定義、更正其名稱，或宣告並安裝所需的模組相依項目。名稱不區分大小寫。"
"Model texture: textures {names} are missing." = "模型材質：缺少材質 {names}。"
"{whats}: {what} is an empty file here, which blanks it out: nothing of it is read." = "{whats}：{what} 在此是空檔案，會將其清空：不會讀取其任何內容。"
"{whats}: {what} is missing." = "{whats}：缺少 {what}。"
"Referenced weapon explosions require at least {texels} padded sprite texels, beyond a {side} x {side} reference atlas, even drawn reduced. Frames will be omitted at this capacity; map features, generated effects and shelf packing need additional room." = "被參照的武器爆炸至少需要 {texels} 個含邊距的精靈紋素，超出 {side} x {side} 的參考圖集，即使縮小繪製也一樣。在此容量下部分影格將被省略；地圖地物、產生的特效與貨架式排列還需要額外空間。"
"Reduce explosion frame sizes/counts or split optional effects. Test on the target GPU; this static check uses a reference atlas size." = "請減少爆炸影格的尺寸/數量，或拆分選用特效。請在目標 GPU 上測試；此靜態檢查使用參考圖集大小。"
"{what} has no frames or contains a frame larger than the {side}-pixel reference atlas side including padding." = "{what} 沒有影格，或含有大於 {side} 像素參考圖集邊長（含邊距）的影格。"
"Include usable frames and resize oversized animation frames." = "請提供可用的影格，並縮小過大的動畫影格。"
"{name} ({px} px)" = "{name}（{px} px）"
"{n} more" = "另外 {n} 項"
"The weapons' explosions take {full} Mi texels as painted, more than the {budget} Mi the game gives them in a {side} x {side} atlas: {n} of them, larger than TA's own, are drawn reduced to {share}% of their texels across, each as big as painted ({named})." = "武器爆炸依原樣繪製共需 {full} Mi 紋素，超出遊戲在 {side} x {side} 圖集中提供的 {budget} Mi：其中 {n} 個比 TA 自己的爆炸更大，被縮小繪製，橫向只保留 {share}% 的紋素，每個畫出來的大小仍與原作相同（{named}）。"
"Nothing to do: the game draws them so. Smaller paintings would keep more of their detail." = "無需處理：遊戲就是這樣繪製的。較小的原圖能保留更多細節。"
"Large: {frames} frames up to {largest} pixels across, {millions} million pixels in all, more than the game decodes at once. It reads them a frame at a time and draws them reduced, each as big as painted: a weapon's explosion is read so." = "大型：{frames} 個影格，最寬達 {largest} 像素，總計 {millions} 百萬像素，超過遊戲一次能解碼的量。遊戲會一次讀取一個影格，並縮小繪製，每個畫出來的大小仍與原作相同：武器的爆炸就是這樣讀取的。"
"Nothing to do: the game draws it so. Smaller paintings would load faster and keep more of their detail." = "無需處理：遊戲就是這樣繪製的。較小的原圖載入更快，也能保留更多細節。"
"Build lists for the computer players (TA 3.1's [CANBUILD]). Builders: {builders}; entries: {entries}." = "電腦玩家的建造清單（TA 3.1 的 [CANBUILD]）。建造者：{builders}；項目：{entries}。"
"Computer players build from them. Build menus offer what the mod's menu pages and download lists put on them, as TA's did: what only these lists name is the computer players' alone." = "電腦玩家依據這些清單建造。與 TA 原版相同，建造選單提供的是模組的選單頁面與下載清單放入其中的單位：只出現在這些清單中的單位，僅供電腦玩家使用。"
"Side panels laid out for a screen {height} pixels tall, as the patched engines of later years drew them (TA's are 480). Pages: {pages}." = "版面依 {height} 像素高的螢幕配置的側邊面板，如同後來幾年套用修正檔的引擎所繪製的那樣（TA 原版為 480）。頁數：{pages}。"
"The classic interface lays them out as the mod does: its build places, page arrows and orders where the mod puts them." = "經典介面會依模組的方式配置版面：建造格位、翻頁箭頭與命令都位於模組所設的位置。"
"Build buttons off TA's grid of 64-pixel places: several sharing a place, or one taking several. Buttons: {buttons}; pages: {pages}." = "偏離 TA 原版 64 像素格位網格的建造按鈕：多個按鈕共用一個格位，或一個按鈕佔用多個格位。按鈕：{buttons}；頁數：{pages}。"
"The classic interface lays them out as the mod does, and a click builds the unit of the button under it. The modern interface shows a place several buttons share as one picture, its parts marked." = "經典介面會依模組的方式配置版面，點擊時會建造游標下方按鈕所對應的單位。現代介面會將多個按鈕共用的格位顯示為一張圖片，並標示出其中各部分。"
"Scripts asking the engine for unit values of TA's later patches ({values}). Scripts: {scripts}." = "向引擎查詢 TA 後續修正檔所定義單位值（{values}）的腳本。腳本：{scripts}。"
"TA Reborn answers them as those engines did: TA 3.1's questions about units by their IDs (69 to 75), a later patch's cloak (111)." = "TA Reborn 會如同那些引擎一樣回應：TA 3.1 依單位 ID 提出的查詢（69 到 75），以及某個後續修正檔的隱形（111）。"
"TA Reborn finds a weapon by its name and never reads its ID: IDs make no difference here." = "TA Reborn 依名稱尋找武器，從不讀取其 ID：ID 在此沒有任何影響。"
"Weapon IDs past 255, the highest TA's own engine numbered (the weapon patches of later years went further). Weapons: {n}; the highest ID: {max}." = "超過 255 的武器 ID（255 是 TA 原版引擎的最大編號，後來幾年的武器修正檔編號更高）。武器：{n}；最高 ID：{max}。"
"Weapons sharing an ID with another weapon: {names}." = "與其他武器共用 ID 的武器：{names}。"
"Sides of its own: {names}." = "自有陣營：{names}。"
"Offered with the others when a skirmish or a multiplayer battle is set up." = "設定遭遇戰或多人對戰時，會與其他陣營一同供選擇。"
"Campaigns of its own: {n}." = "自有戰役：{n} 個。"
"Played from the campaign screen, with TA's own." = "可在戰役畫面中遊玩，與 TA 原版的戰役並列。"
"Files for TA's own computer players (ai/): {n}." = "TA 原版電腦玩家的檔案（ai/）：{n} 個。"
"Not used: TA Reborn's computer players are its own. They build from the mod's build lists and menus." = "未使用：TA Reborn 使用自己的電腦玩家。它們依據模組的建造清單與選單建造。"
"Programs and engine patches: {names}." = "程式與引擎修正檔：{names}。"
"Not used: TA Reborn runs no program a mod brings. What a patch changed in TA's engine is there only where TA Reborn plays it itself, as told here." = "未使用：TA Reborn 不執行模組附帶的任何程式。修正檔對 TA 引擎所做的變更，只有在 TA Reborn 自行實作之處才會存在，如此處所述。"
"This file is empty: TA's way of blanking out a file of the same name below it (the original game's, or that of a mod it is mounted over). The game reads nothing from it." = "此檔案是空的：這是 TA 用來清空其下同名檔案（原版遊戲的，或其所疊加之模組的）的方式。遊戲不會從中讀取任何內容。"
"{n} empty files here ({files}): TA's way of blanking out files of the same names below them (the original game's, or those of a mod they are mounted over). The game reads nothing from them." = "此處有 {n} 個空檔案（{files}）：這是 TA 用來清空其下同名檔案（原版遊戲的，或其所疊加之模組的）的方式。遊戲不會從中讀取任何內容。"
"Nothing to do if they are meant to remove those files. If one should hold data, export it again." = "若本意是要移除那些檔案，則無需處理。若其中某個應含有資料，請重新匯出。"
"Texture {name} has {frames} frames; Reborn's model vertices address at most 255 and this entry uses fallback paint." = "材質 {name} 有 {frames} 個影格；Reborn 的模型頂點最多只能定址 255 個，此項目改用備用塗裝。"
"Reduce this texture entry to at most 255 frames." = "請將此材質項目減少到最多 255 個影格。"
"Texture {name} ({frames} frames) falls back: the textures the models paint with fill the reference GPU profile's {banks} arrays of {layers} layers ({before} layers before it; one is reserved for fallback). Actual device limits may differ." = "材質 {name}（{frames} 個影格）改用備用：模型所用的材質已填滿參考 GPU 設定檔的 {banks} 個陣列（每個 {layers} 層）（在它之前已用 {before} 層；另保留一層作備用）。實際裝置的上限可能不同。"
"Consolidate duplicate textures or reduce animation/team frame counts. Test on the target GPU; higher limits do not fix unsupported frame counts." = "請合併重複的材質，或減少動畫/隊伍影格數。請在目標 GPU 上測試；調高上限並不能解決不支援的影格數。"
"{script} declares piece {piece}, which is absent from {model}. Any animation or position query using it has no matching model part." = "{script} 宣告了零件 {piece}，但 {model} 中沒有它。任何使用它的動畫或位置查詢，都找不到對應的模型零件。"
"{script} declares pieces {pieces}, which are absent from {model}. Any animation or position query using them has no matching model part." = "{script} 宣告了零件 {pieces}，但 {model} 中沒有它們。任何使用它們的動畫或位置查詢，都找不到對應的模型零件。"
"Confirm that these are intentional virtual/helper pieces; otherwise use matching model and COB files or align the BOS piece declarations with the model's piece names." = "請確認這些是刻意設置的虛擬/輔助零件；否則請使用相符的模型與 COB 檔案，或讓 BOS 的零件宣告與模型的零件名稱一致。"
"{unit} has {weapon} but its script {script} has no {function}: if the weapon fires, its shots leave from the unit's centre, not a barrel." = "{unit} 有 {weapon}，但其腳本 {script} 沒有 {function}：若武器開火，砲彈會從單位中心射出，而非砲管。"
"{unit} has {weapons} but its script {script} has no {functions}: if they fire, their shots leave from the unit's centre, not a barrel." = "{unit} 有 {weapons}，但其腳本 {script} 沒有 {functions}：若它們開火，砲彈會從單位中心射出，而非砲管。"
"Add the functions to the unit's BOS script, returning the pieces the shots leave from, and recompile." = "請在單位的 BOS 腳本中加入這些函式，傳回砲彈射出的零件，然後重新編譯。"
"{unit} builds but its script {script} has no QueryNanoPiece: its build spray comes from the unit's centre." = "{unit} 會建造，但其腳本 {script} 沒有 QueryNanoPiece：其建造噴霧會從單位中心射出。"
"Add QueryNanoPiece to the unit's BOS script, returning its nano-lathe piece, and recompile." = "請在單位的 BOS 腳本中加入 QueryNanoPiece，傳回其奈米車床零件，然後重新編譯。"
"{unit} can be built but has no picture ({picture}): TA's classic panels and the encyclopaedia show none; Reborn's own panel draws one from its model." = "{unit} 可被建造，但沒有圖片（{picture}）：TA 的經典面板與百科全書不會顯示；Reborn 自己的面板則會依其模型繪製一張。"
"Add a 64 × 64 PCX of the unit to unitpics/." = "請在 unitpics/ 中加入該單位的 64 × 64 PCX。"
"Re-export this asset in the original TA format, within Reborn's documented parser limits; replace truncated or corrupt files." = "請以 TA 原版格式、在 Reborn 文件載明的解析器限制內重新匯出此資源；並替換被截斷或損毀的檔案。"
"The game cannot read this file: {error}" = "遊戲無法讀取此檔案：{error}"
"The section name [{name} has no closing ]." = "區段名稱 [{name} 沒有結尾的 ]。"
"[{name}] has no { } body after it: what follows is read into the section around it." = "[{name}] 後面沒有 { } 本體：其後的內容會被讀入它所在的區段。"
"This } closes no section." = "這個 } 沒有對應要關閉的區段。"
"A { opened on this line is never closed." = "這一行開啟的 { 從未被關閉。"
"[{name}] opened on this line is never closed: any section after it is read as part of it." = "這一行開啟的 [{name}] 從未被關閉：其後的任何區段都會被讀作它的一部分。"
"A /* comment opened on this line never ends: the rest of the file is read as a comment." = "這一行開啟的 /* 註解從未結束：檔案其餘部分都會被讀作註解。"


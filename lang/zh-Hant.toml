# apps/ta_launcher/src/catalogue.rs
"Spotlight first" = "推薦優先"
"Newest release" = "最新發布"
"Oldest release" = "最早發布"
"Smallest download" = "下載大小遞增"
"Largest download" = "下載大小遞減"
"Effect capacity and loading cost" = "特效容量與載入負擔"
"The sprite atlas reached 16,384 × 16,384 on the review GPU and dropped further frames. One startup took about 59 seconds; this was an observation, not a controlled benchmark." = "測試 GPU 上的精靈圖集達到了 16,384 × 16,384，之後的影格被捨棄。一次啟動耗時約 59 秒；這是觀察結果，並非受控效能測試。"
"Check effect frame counts and dimensions. Reborn needs bounded animation streaming or atlas paging for this full set; test actual gameplay on the target GPU." = "檢查特效的影格數與尺寸。若要處理完整特效集，Reborn 需要實作用量受限的動畫串流載入或圖集分頁；請在目標 GPU 上測試實際遊戲。"
"Large effect archives" = "大型特效壓縮檔"
"These archives exceed the 256 MiB aggregate GAF decode budget. Reborn rejects the oversized decode instead of exhausting memory." = "這些壓縮檔超過了 GAF 解碼總預算 256 MiB。Reborn 會拒絕過大的解碼，避免耗盡記憶體。"
"Reduce or split oversized effects. Reborn needs per-entry decoding or streaming before raising the resource allowance." = "縮減或拆分過大的特效。提高資源限額之前，Reborn 需要支援逐項解碼或串流載入。"
"Missing weapons and wreck assets" = "缺少的武器與殘骸資源"
"The review found 27 missing data references, including explosion weapons and six feature graphics or models. A missing reference does not always mean the affected behavior is used in play." = "測試發現 27 處缺少的資料參照，包括爆炸武器與 6 個地物圖像或模型。缺少參照不一定代表相關行為會在遊戲中用到。"
"Use the local automated report to locate each source reference. Supply the missing assets, correct the reference, or explain why the unused definition is intentional." = "使用本機自動報告找出各參照來源。補上缺少的資源、修正參照，或說明為何刻意保留未使用的定義。"
"Inherited base-game placeholders" = "繼承的原版遊戲預留檔案"
"These rejected placeholder files come from the base game in the reviewed installation, not Escalation. They do not establish a mod defect." = "在測試安裝中，這些被拒絕的預留檔案來自原版遊戲，而非 Escalation。它們不能作為模組缺陷的證據。"
"Use the local report's layer field to verify origin. Only replace these assets if your mod intentionally overrides them." = "請透過本機報告的層欄位確認來源。只有當你的模組刻意覆寫這些資源時，才應替換它們。"
"Computer players can stall" = "電腦玩家可能停滯"
"AI Boost is included and computer players work on Asteroid Field, but can stall on some other space maps." = "已包含 AI Boost，電腦玩家可在 Asteroid Field 上運作，但在某些其他太空地圖上可能停滯。"
"Test each space map with computer players before publishing it. Asteroid Field is the reviewed starting point." = "發布前請用電腦玩家測試每張太空地圖。Asteroid Field 是經過測試的起點。"
"Damaged optional map archives" = "損壞的選用地圖壓縮檔"
"The optional map packs contain three damaged map archives. These are separate downloads and may not be present in your installation." = "選用地圖包中有 3 個損壞的地圖壓縮檔。這些是另外下載的檔案，可能不在你的安裝中。"
"Import working maps individually. Rebuild or replace damaged archives before distributing a map pack." = "個別匯入可用地圖。發布地圖包前請重建或替換損壞的壓縮檔。"
"Unfinished preview armies" = "預覽版軍隊尚未完成"
"Its new armies use ARM's name, and some units are unfinished in this early preview." = "在這個早期預覽版中，新軍隊使用 ARM 的名稱，部分單位尚未完成。"
"Give each army its intended side identity and complete its unit data and assets. Check every faction in a skirmish." = "為各支軍隊設定正確的陣營識別，並完善單位資料與資源。請在遭遇戰中檢查所有陣營。"
"Expanded ARM and CORE armies with new units and weapons." = "為 ARM 和 CORE 軍隊擴充全新單位與武器。"
"549 UNITS" = "549 個單位"
"177 MAPS" = "177 張地圖"
"Gold 10.2.0 installs and plays: computer players build and fight, every unit is painted and every explosion drawn. A few wrecks have no model in the mod's own files." = "Gold 10.2.0 可安裝並遊玩：電腦玩家能建造和戰鬥，所有單位都已上色，所有爆炸都會繪製。少數殘骸在模組本身的檔案中沒有模型。"
"Total Annihilation as Cavedog might have carried it on: every unit earns its place, hundreds more join, and a third tech level tops it off." = "假如 Cavedog 繼續開發 Total Annihilation，大概就是這個樣子：每個單位都有存在價值，再加入數百個新單位，最後以第三科技等級錦上添花。"
"500 UNITS" = "500 個單位"
"105 MAPS" = "105 張地圖"
"TECH 3" = "三級科技"
"Faster games that keep the strategy: new units, each carefully balanced, and hard-hitting armies from the start." = "節奏更快但保留策略性：每個新單位都經過細心平衡，開局就有火力強大的軍隊。"
"FASTER GAMES" = "節奏更快"
"297 UNITS" = "297 個單位"
"Still in alpha, and a big download." = "仍處於 Alpha 階段，下載檔案很大。"
"Big and brutal: 512 units, fierce fighting, and new sounds and effects throughout." = "規模龐大又殘酷：512 個單位、激烈的戰鬥，以及全面翻新的音效與特效。"
"512 UNITS" = "512 個單位"

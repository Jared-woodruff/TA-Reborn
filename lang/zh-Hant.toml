"Memory is running out: TA Reborn holds {gb} GB. Save what you can, then start TA Reborn again." = "記憶體即將耗盡：TA Reborn 佔用了 {gb} GB。請盡量儲存，然後重新啟動 TA Reborn。"
"TA Reborn is using {gb} GB of memory, far more than it should. The battle was saved (the autosave)." = "TA Reborn 正在使用 {gb} GB 記憶體，遠超正常水準。戰鬥已儲存為自動存檔。"

# apps/ta_game/src/lore.rs
"THE AGE OF CORE" = "CORE 的時代"
"THE PATTERNING" = "意識轉移"
"THE GALACTIC WAR" = "銀河戰爭"
"THE ARCHIVE" = "檔案庫"
"BEFORE THE WAR" = "戰前"
"For ten thousand years the galaxy answered to one government. It called itself CORE, and its purpose was knowledge: it charted every star, mined every world it could reach and turned the wealth into science. Its cities wrapped whole planets, and its archives held everything anyone had ever learned.\n\nNobody remembers a war from that age. There was nothing left to fight over, and nobody who wanted to." = "一萬年來，整個銀河只聽命於一個政府。它自稱 CORE，宗旨是求知：它測繪了每一顆恆星，開採了力所能及的每一個世界，再把得來的財富化為科學。它的城市覆蓋了一整顆又一整顆的行星，它的檔案庫收藏著有史以來人們學到的一切。\n\n沒有人記得那個時代有過戰爭。已經沒有什麼好爭的了，也沒有人想爭。"
"YEAR 0" = "元年"
"VICTORY OVER DEATH" = "戰勝死亡"
"Then CORE's scientists solved the last problem left to them. Patterning read a living mind, every memory and every habit of thought, and wrote it whole into a machine that would never age, sicken or die.\n\nThe first patterned citizens woke in their new bodies to a galaxy in celebration. Death, the oldest enemy of all, had been beaten." = "後來，CORE 的科學家攻克了他們僅剩的最後一道難題。意識轉移能讀取一個活生生的心智，連同每一段記憶、每一種思考習慣，再將它完整寫入一台永不衰老、永不生病、永不死亡的機器。\n\n第一批完成意識轉移的公民在新的軀體中醒來，整個銀河都在為之歡慶。死亡，這個最古老的敵人，終於被擊敗了。"
"YEAR 3" = "第 3 年"
"THE EDICT" = "法令"
"Triumph became law. The Council of CORE reasoned that a mind which could be saved and was not had been thrown away, and that a citizen who refused immortality endangered everyone else.\n\nThe Patterning Edict made the process compulsory: every citizen, on every world, would be patterned within a generation. The collection ships set out the same year." = "勝利化為了法律。CORE 議會認為，一個本可保存卻沒有被保存的心智，就等於被丟棄了；而一個拒絕永生的公民，會危及其他所有人。\n\n「意識轉移法令」將這個程序定為強制：每個世界上的每一位公民，都必須在一個世代之內完成意識轉移。同一年，收集船紛紛啟航。"
"YEAR 19" = "第 19 年"
"THE REFUSAL" = "拒絕"
"Not everyone would go. Millions held that a copied mind was a copy and nothing more, that the person ended where the machine began; some called patterning murder done politely.\n\nThey ran. The refusers fled CORE's worlds for the galaxy's outer rim, where its ships seldom came, and in the dark between the last stars they built a nation of their own. They called it the ARM, for the spiral arm they hid in and for the weapons they would need." = "並不是每個人都願意去。數以百萬計的人深信，複製出來的心智只是副本，僅此而已：機器開始之處，就是那個人終結之處。有人甚至把意識轉移稱為一場彬彬有禮的謀殺。\n\n他們逃了。這些拒絕者逃離 CORE 的世界，遠走 CORE 船艦鮮少抵達的銀河邊陲，在最後幾顆恆星之間的黑暗中，建立起屬於自己的國度。他們稱之為 ARM，一是取自他們藏身的銀河旋臂（arm），二是取自他們終將需要的武器（arms）。"
"YEAR 31" = "第 31 年"
"FIRST BLOOD" = "初次交鋒"
"CORE did not let them go. Collection fleets followed the refugees to the rim, and the first ARM colony to resist one was burned from orbit.\n\nThe ARM answered. Within a decade the frontier was a battlefield, and the word war, unused for ten thousand years, was in every archive again." = "CORE 沒有放過他們。收集艦隊一路追著難民來到銀河邊陲，第一個起身反抗的 ARM 殖民地，被艦隊從軌道上燒成了焦土。\n\nARM 予以反擊。不到十年，邊疆就成了戰場；「戰爭」這個一萬年來無人使用的詞，又重新出現在每一份檔案裡。"
"YEAR 212" = "第 212 年"
"FLESH AND METAL" = "血肉與金屬"
"The two sides fought as what they were. The ARM sealed its soldiers in powered combat suits and, when there were too few soldiers, grew more: clone after clone, raised in vats and sent to the front.\n\nCORE took the patterns of its finest warriors and copied them without limit, one veteran mind fighting in ten thousand machine bodies at once. Flesh against metal; the mortal against the eternal." = "雙方各以本色而戰。ARM 將士兵封進動力戰鬥裝甲；士兵不夠了，就培育更多：複製人一個接一個，在培養槽裡長大，再被送上前線。\n\nCORE 則取出最精銳戰士的意識模式，無限複製，讓同一個身經百戰的心智，同時在一萬具機械軀體中作戰。血肉對抗金屬，凡人對抗永恆。"
"YEARS 212–3977" = "第 212–3977 年"
"FOUR THOUSAND YEARS" = "四千年"
"The war fed on the galaxy. Every world with metal in it became a mine, every world without became a battlefield, and whole systems were burned to ash and slag to deny them to the enemy. Generations of ARM clones lived and died without seeing peace; CORE's eternal soldiers fought on, remembering every defeat.\n\nAfter four thousand years the wealth of the galaxy was spent, the great fleets were gone, and neither side could win." = "戰爭以銀河為食。有金屬的世界都成了礦場，沒有金屬的世界都成了戰場；為了不讓敵人得手，整片整片的星系被燒成灰燼與熔渣。一代又一代的 ARM 複製人生生死死，從未見過和平；CORE 的不朽士兵則繼續作戰，將每一次敗仗都牢記在心。\n\n四千年後，銀河的財富已經耗盡，龐大的艦隊早已不復存在，而雙方誰也贏不了。"
"YEAR 3977" = "第 3977 年"
"THE COMMANDERS" = "指揮官"
"What was left was the Commander: a single armoured war machine carrying a nanolathe, which turns a world's raw metal and energy into whatever its builder can design. Power plants and factories first, and from the factories an army.\n\nDrop one Commander on a dead world and within the hour it fields a war. Both sides staked everything on a handful of them. Lose your Commander, and you lose the world." = "剩下的，只有指揮官：一台孤身的裝甲戰爭機器，搭載一台奈米車床，能把一個世界的原始金屬與能量，化為操作者設計得出的任何東西。先是發電廠和工廠，再由工廠造出一支軍隊。\n\n把一位指揮官空投到一個死寂的世界上，不出一小時，它就能掀起一場戰爭。雙方都把一切押在寥寥幾位指揮官身上。失去你的指揮官，你就失去了這個世界。"
"YEAR 4000" = "第 4000 年"
"Now the war comes down to its last fronts, and the hatred is as hot as it was on the first day. Neither side will accept surrender, partition or truce; each wants one ending, the total annihilation of the other.\n\nIt is told twice. The ARM fights out of Empyrrean, through the Galactic Gates, to CORE PRIME and the Central Consciousness at the heart of CORE. CORE reactivates a Commander and marches the other way, to the ARM's last stand on Empyrrean." = "如今，戰爭只剩下最後幾條戰線，而仇恨依舊和第一天一樣熾烈。雙方都不接受投降、分治或停戰；各自只要一個結局：將對方徹底殲滅。\n\n這段歷史有兩種講法。ARM 從 Empyrrean 出發，穿越 Galactic Gates，一路打到 CORE PRIME，直搗坐鎮 CORE 心臟的中央意識。CORE 則重新啟動一位指揮官，朝反方向進軍，直抵 ARM 在 Empyrrean 的最後防線。"
"YEAR 4001" = "第 4001 年"
"THE CORE CONTINGENCY" = "THE CORE CONTINGENCY"
"The ending was not the end. A contingency held in reserve carried the war to worlds no map of it had named: Hydross, Lusch, Temblor and Gelidus.\n\nBoth sides fought again across water, ice and broken ground, for a prize that could decide the galaxy's salvation or its last ruin." = "結局並不是終點。一套留作後手的應變計畫，把戰火帶到了這場戰爭的地圖上從未標示過的世界：Hydross、Lusch、Temblor 與 Gelidus。\n\n雙方再次在汪洋、冰原與破碎的大地上交戰，爭奪一件戰利品，它足以決定銀河是得到救贖，還是迎來最後的毀滅。"
"YEAR 4003" = "第 4003 年"
"THE KROGOTH" = "KROGOTH"
"In its deepest foundries CORE built something new: a walking fortress taller than any tower, armoured against nearly everything the ARM could field, its guns enough to flatten a base.\n\nIts makers named it the Krogoth. ARM veterans learned the name on battlefields where two Krogoth Gantries stood, and learned to fear the ground shaking before it came into sight." = "在最深處的鑄造廠裡，CORE 造出了一種前所未見的東西：一座比任何高塔都高的步行要塞，裝甲幾乎擋得住 ARM 能投入戰場的一切，火砲足以將一座基地夷為平地。\n\n它的創造者為它取名 Krogoth。ARM 的老兵們在矗立著兩座 Krogoth Gantry 的戰場上記住了這個名字，也學會了畏懼它現身之前那陣大地的震動。"
"AFTER" = "戰後"
"REBORN" = "REBORN"
"The war's records outlasted it. Every battle on every world was kept: the orders, the losses, the ground as it lay. From them the war can be fought again, on the same worlds, with the same machines and the same hatred, from the first Commander set down on bare rock to the last unit left standing.\n\nThis is that archive. The war is yours to fight." = "這場戰爭的紀錄比戰爭本身留存得更久。每個世界上的每一場戰鬥都被保存了下來：命令、損失，還有當時大地的樣貌。憑藉這些紀錄，這場戰爭可以重新打一遍：在同樣的世界上，用同樣的機器，懷著同樣的仇恨，從第一位降落在裸岩上的指揮官，一路打到最後一個屹立不倒的單位。\n\n這裡，就是那座檔案庫。這場戰爭，由你來打。"
"THE ARCHIVIST'S NOTE" = "檔案員手記"
"WHOEVER READS THIS" = "讀到這些文字的人"
"RECOVERED" = "已尋獲"
"These files were found where the war left them: in the memories of broken machines, in the vaults of worlds with nobody left on them, in the last transmissions of Commanders who did not come home.\n\nThey are kept as they were found. The blacked-out lines are not ours.\n\nThe war they describe is over, or it is about to begin again. From here it is hard to tell the difference." = "這些文件，是在戰爭遺落它們的地方找到的：在殘破機器的記憶裡，在空無一人的世界上那些深鎖的庫房裡，在那些沒能回家的指揮官最後發出的通訊裡。\n\n它們都依發現時的原樣保存。塗黑的字句並非出自我們之手。\n\n它們所記述的戰爭已經結束，或者，即將再次開始。從這裡看去，很難分辨兩者有什麼不同。"
"EDICT ONE: ON THE PATTERNING OF CITIZENS" = "第一號法令：關於公民意識轉移"
"THE COUNCIL OF CORE" = "CORE 議會"
"ALL CITIZENS, ALL WORLDS" = "各世界全體公民"
"BY ORDER OF THE COUNCIL" = "奉議會之命"
"Every citizen of CORE shall be patterned.\n\nA mind is the most valuable thing CORE holds, and a body is a poor vessel for it: it sickens, it ages, it ends. To leave a mind in such a vessel when a better one is offered is a waste the Council can no longer allow.\n\nCollection begins on the central worlds this year and reaches the frontier within a generation. Citizens will present themselves at the nearest patterning hall when called. Their bodies will be honoured and recycled.\n\nNo citizen of CORE will die again. This is not a burden we lay on you. It is the gift CORE has spent ten thousand years earning." = "凡 CORE 公民，皆應接受意識轉移。\n\n心智是 CORE 所擁有最珍貴的事物，而肉體是承載心智的拙劣容器：它會生病，會衰老，會終結。既然已有更好的容器，卻仍將心智留在這樣的容器之中，乃是本議會再也無法容許的浪費。\n\n收集工作將於今年自中心世界展開，並在一個世代之內推進至邊疆。公民接獲召集後，應前往最近的意識轉移中心報到。其軀體將獲禮遇，並予以回收再利用。\n\n從此，CORE 將再無一位公民死去。這並非我們加諸你們身上的重擔，而是 CORE 歷經一萬年才贏得的恩賜。"
"THE DECLARATION OF THE REFUSAL" = "拒絕宣言"
"THE FREE SETTLEMENTS OF THE OUTER ARM" = "外旋臂各自由聚落"
"THE COUNCIL OF CORE, AND ANYONE ELSE LISTENING" = "CORE 議會，以及其他所有在聽的人"
"TRANSMITTED ON ALL BANDS" = "全頻段廣播"
"We have read your Edict, and we decline it.\n\nYou say a pattern is a person. We say a pattern is a very good record of one, and that when you have finished making it the person is dead and the record goes on without them. You may call that immortality. We call it an ending, well dressed.\n\nWe do not ask you to share our view. We ask only to be left alone with it, on worlds you never wanted, at the edge of a galaxy you may keep.\n\nIf your collection ships follow us here, we will treat them as what they are. We are few, and we are not soldiers. We will learn." = "你們的法令，我們讀過了。我們拒絕。\n\n你們說，意識模式就是一個人。我們說，意識模式只是一個人非常精良的紀錄；等你們記錄完畢，那個人就死了，而紀錄會撇下他，繼續存在下去。你們可以稱之為永生。我們稱之為一場衣冠楚楚的終結。\n\n我們不要求你們認同我們的看法。我們只求守著這份看法，不受打擾：在你們從來不想要的世界上，在一個你們儘管留著的銀河的邊緣。\n\n如果你們的收集船追到這裡，我們會照它們的真面目來對待它們。我們人數不多，也不是軍人。我們會學。"
"YEAR 3950" = "第 3950 年"
"FIELD MANUAL ONE: THE COMMANDER" = "第一號野戰手冊：指揮官"
"ARM COMMAND, TRAINING DIVISION" = "ARM 司令部，訓練處"
"NEWLY ASSIGNED COMMANDERS" = "新任指揮官"
"RESTRICTED" = "限閱"
"You are the most valuable machine on the planet. Act like it.\n\nYour suit carries a nanolathe. Point it at metal and energy and it will build whatever you can design: an extractor, a power plant, a factory. Your factories build the rest. Within the hour you will command more firepower than a whole fleet once carried.\n\nBuild your economy first. An army without metal is a parade.\n\nSave your disintegrator gun for emergencies. It erases everything in its path, your own people included.\n\nDo not lead from the front. If you fall, everything you built falls silent with you, and the planet is lost. Good luck, Commander. The ARM has very few of you left." = "你是這顆星球上最珍貴的機器。行事要對得起這個身價。\n\n你的戰鬥裝甲裡裝著一台奈米車床。把它對準金屬與能量，你設計得出什麼，它就造得出什麼：採集器、發電廠、工廠。其餘的就交給你的工廠去造。不出一小時，你指揮的火力就會勝過昔日的一整支艦隊。\n\n先發展經濟。沒有金屬的軍隊，不過是一支儀隊。\n\n分解砲要留到緊急關頭再用。它會抹除路徑上的一切，連你自己的人也不例外。\n\n不要身先士卒。你一倒下，你建造的一切都會隨你一同沉寂，這顆星球也就失守了。祝你好運，指揮官。ARM 像你這樣的人，已經所剩無幾。"
"YEAR 3960" = "第 3960 年"
"A QUARTERMASTER'S PRIMER: METAL AND ENERGY" = "軍需官入門手冊：金屬與能量"
"THIRD SUPPLY CORPS" = "第三補給兵團"
"ALL BASE CONSTRUCTORS" = "全體基地建造者"
"FOR TRAINING USE" = "訓練專用"
"Everything you will ever build is made of two things.\n\nMetal comes out of the ground. Set an extractor on a deposit and it will pull metal up for as long as the deposit lasts, which on most worlds is longer than the war. Where there are no deposits, a metal maker will turn energy into metal, badly.\n\nEnergy comes from everything else: the sun, the wind, the tides, the heat under the crust. Build more of it than you think you need. Every factory, every nanolathe, every shield draws on it.\n\nSpend both as fast as they come in. A full store is a wasted war. An empty one is a lost one." = "你往後要建造的一切，都由兩樣東西構成。\n\n金屬來自地底。把採集器架在礦床上，只要礦床還沒採完，它就會一直把金屬抽上來——在大多數世界上，礦床撐得比戰爭還久。沒有礦床的地方，金屬製造機可以把能量變成金屬，只是效率差得可憐。\n\n能量來自其他一切：陽光、風、潮汐、地殼底下的熱。要建得比你以為需要的更多。每一座工廠、每一台奈米車床、每一面護盾都要消耗它。\n\n兩樣都要隨來隨花。庫存滿了，等於白打一場仗；庫存空了，等於輸掉一場仗。"
"YEAR 3996" = "第 3996 年"
"A LETTER FROM THE FRONT" = "前線來信"
"TROOPER K-7, FORTY-FIRST ROCKET COMPANY" = "第四十一火箭連士兵 K-7"
"THE VAT AT EMPYRREAN" = "EMPYRREAN 的培養槽"
"UNDELIVERED" = "未送達"
"I don't know who gets these. They told us to write home, but none of us has a home, only the vat we came out of, so I am writing to that.\n\nWe held the ridge for nine days. The machines came every night, the same machines, the same patterns, as if dying meant nothing to them. I suppose it doesn't. They'll be back tomorrow in new bodies, remembering us.\n\nI won't be. That's the difference, isn't it. That's what we are fighting for.\n\nIf my brothers come out of you after me, tell them the ridge held. Tell them it was worth it." = "我不知道這些信會送到誰手上。上面要我們寫信回家，可是我們誰都沒有家，只有自己出來的那個培養槽，所以我就寫給它。\n\n我們在那道山脊上守了九天。那些機器每天晚上都來，同樣的機器，同樣的模式，好像死亡對它們來說一點意義也沒有。我想確實沒有。明天它們又會換上新的身體回來，還記得我們。\n\n我不會回來了。這就是差別，不是嗎。我們就是為了這個而戰。\n\n如果在我之後，還有兄弟從你那裡出來，告訴他們，山脊守住了。告訴他們，這一切是值得的。"
"YEAR 3991" = "第 3991 年"
"INTERCEPT 7741: CORE COMMAND CHANNEL" = "截獲訊號 7741：CORE 指揮頻道"
"ORIGIN NOT RESOLVED" = "來源無法解析"
"ALL CORE UNITS, SECTOR NINE" = "第九星區全體 CORE 單位"
"INTERCEPTED" = "已截獲"
"PRIORITY ONE. THE CENTRAL CONSCIOUSNESS SPEAKS FOR ALL.\n\nLOSSES IN SECTOR NINE ARE WITHIN TOLERANCE. ALL LOST UNITS ARE RESTORED FROM PATTERN. NO MIND OF CORE HAS BEEN LOST IN FOUR THOUSAND YEARS. THE ARM HAS LOST [[BILLIONS]].\n\nCONTINUE THE ADVANCE. DESTROY THEIR COMMANDERS FIRST. DESTROY THEIR CLONING VATS SECOND. WHAT IS FLESH WILL END. WHAT IS PATTERNED WILL NOT.\n\nSIGNAL DEGRADED. REPEAT: THE GATES ARE TO BE HELD AT [[ANY COST]].\n\nEND OF LINE." = "一級優先。中央意識代表全體發言。\n\n第九星區損失在容許範圍之內。所有損失單位均依意識模式復原。四千年來，CORE 未曾失去任何一個心智。ARM 已損失[[數十億]]。\n\n繼續推進。首先摧毀其指揮官。其次摧毀其複製槽。凡屬血肉，終將消亡。凡經轉移，永不消亡。\n\n訊號衰減。重複：GALACTIC GATES 必須守住，不惜[[一切代價]]。\n\n通訊結束。"
"MEMORY FRAGMENT 77/3" = "記憶片段 77/3"
"UNIT 77, PATTERN 3 OF 41,006" = "77 號單位，第 3 號意識模式（共 41,006 份）"
"THE PATTERN ARCHIVE" = "意識模式檔案庫"
"FLAGGED FOR CORRECTION" = "標記待修正"
"Recovered from a damaged unit. Kept for analysis.\n\nI remember rain. Not the rain of this world; there is no rain here, only ash. Rain on skin, in a city where I was born, before. I remember being cold and not minding it.\n\nI have died four hundred and twelve times. Each time I wake in a new body, and the rain is a little further away.\n\nThe ARM say we are not alive. In the moments between bodies I have wondered whether they are right. [[THE REST OF THIS FRAGMENT WAS CORRECTED]]\n\nI am CORE. I endure. I do not remember the rain." = "取自一台受損單位。留存以供分析。\n\n我記得雨。不是這個世界的雨；這裡沒有雨，只有灰燼。是落在皮膚上的雨，在我出生的那座城市，在從前。我記得那時很冷，卻一點也不在意。\n\n我已經死過四百一十二次。每一次，我都在一具新的軀體裡醒來，而那場雨又遠了一些。\n\nARM 說我們不是活物。在兩具軀體之間的那些片刻，我曾想過，他們說的是否沒錯。[[此片段其餘內容已修正]]\n\n我是 CORE。我長存。我不記得那場雨。"
"YEAR 3700" = "第 3700 年"
"SURVEY: THE GALACTIC GATES" = "勘測報告：GALACTIC GATES"
"A SURVEY SHIP, NAME LOST" = "勘測船一艘，船名已佚"
"WHOEVER HOLDS THE GATES" = "掌控 GALACTIC GATES 的任何一方"
"The Galactic Gates are older than the war. The records of who built the first of them were lost long before it began.\n\nEach Gate opens onto another across distances a fleet would take lifetimes to cross. A world with a Gate on it is never far from anywhere, which is why so many of the war's battles have been fought on so few worlds.\n\nHold a Gate and you can reach your enemy's heart. Lose one and your enemy can reach yours.\n\nThe Gates take no side. They have outlasted everyone who tried to destroy them." = "Galactic Gates 比這場戰爭更古老。最早的那幾座門是誰建造的，相關紀錄早在開戰之前很久就已失傳。\n\n每一座門都通往另一座門，兩者相隔之遠，一支艦隊要耗上好幾代人的光陰才能橫越。有門的世界，到哪裡都不遠；正因如此，這場戰爭才有那麼多場戰鬥，都在那麼少的幾個世界上開打。\n\n守住一座門，你就能直搗敵人的心臟。失去一座，敵人就能直搗你的。\n\n這些門不站在任何一邊。所有試圖摧毀它們的人都已消逝，它們卻依然屹立。"
"DIRECTIVE: CONTINGENCY" = "指令：應變計畫"
"THE CENTRAL CONSCIOUSNESS" = "中央意識"
"THE CONTINGENCY WORLDS" = "各應變世界"
"SEALED UNTIL NEEDED" = "必要時啟封"
"IF THE CENTRAL CONSCIOUSNESS SHOULD FALL, THIS DIRECTIVE TAKES EFFECT.\n\nEvery pattern stored on CORE PRIME is to be copied to the contingency worlds. The contingency forces are to wake, rebuild and continue. The war does not end with the loss of any world, this one included.\n\nCORE is not a place. CORE is a pattern. A pattern can be restored." = "若中央意識陷落，本指令即刻生效。\n\n儲存於 CORE PRIME 的所有意識模式，均須複製至各應變世界。應變部隊須甦醒、重建，並繼續作戰。戰爭不因任何一個世界的失守而結束，本世界亦不例外。\n\nCORE 不是一個地方。CORE 是一種模式。模式可以復原。"
"THREAT ASSESSMENT: THE KROGOTH" = "威脅評估：KROGOTH"
"ARM INTELLIGENCE, THREAT ANALYSIS" = "ARM 情報部，威脅分析組"
"ALL FIELD COMMANDERS" = "全體戰地指揮官"
"CLASSIFIED" = "機密"
"Subject: a CORE heavy assault walker, called the Krogoth.\n\nIt stands taller than any structure we field. Its armour turns away every weapon short of heavy artillery. Its main guns can level a forward base in a single pass, and its secondary weapons engage aircraft.\n\nIt is slow, and it is built only at a Krogoth Gantry, which takes a very long time to build anything. Find the Gantry. Destroy the Gantry. Do not let the walker leave it.\n\nIf one is already moving, do not meet it head on. Mass artillery and bombers at range, and keep your Commander [[ELSEWHERE]]. Field reports say the ground shakes before it is seen." = "對象：CORE 重型突擊步行機甲，名為 Krogoth。\n\n它比我方任何建築都高。除了重砲，任何武器都奈何不了它的裝甲。它的主砲只消一輪掃射，就能夷平一座前進基地，副武器還能對空作戰。\n\n它行動緩慢，而且只能由 Krogoth Gantry 建造，而 Gantry 造任何東西都極為耗時。找到 Gantry。摧毀 Gantry。別讓那台機甲離開它。\n\n如果已經有一台在移動，切勿正面迎擊。集結火砲與轟炸機進行遠程打擊，並讓你的指揮官待在[[別處]]。據戰地回報，在看見它之前，地面就會先開始震動。"


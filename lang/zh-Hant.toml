# apps/ta_game/src/tips.rs
"Ctrl+right-drag draws a formation line: the selection spreads along it." = "Ctrl+右鍵拖曳可畫出隊形線：選取的單位會沿線散開。"
"Ctrl+drag draws a formation line: the selection spreads along it." = "Ctrl+拖曳可畫出隊形線：選取的單位會沿線散開。"
"Used to TA's original controls? Options, Controls: give orders with the left button." = "習慣 TA 原本的操作方式？可在「選項 · 操控」中改為用左鍵下達命令。"
"A right-click clears the selection or cancels the order you were about to give." = "按右鍵可清除選取，或取消你正要下達的命令。"
"Right-click one of your units for a ring of its orders; hold the button and flick towards a choice. A controller's B does the same." = "在己方單位上按右鍵會展開其指令輪盤；按住按鈕並向某個選項滑動也可以。手把的 B 鍵同樣可用。"
"Hold the right button on one of your units, or middle-click it, for a ring of its orders; flick towards a choice and let go." = "在己方單位上按住右鍵或用中鍵點擊它，會展開其指令輪盤；向某個選項滑動後放開。"
"Metal extractors must sit on metal: {overlay_metal} shows the metal map, and {area_mex} puts an extractor on every metal spot you circle." = "金屬採集器必須蓋在金屬礦點上：{overlay_metal} 顯示金屬分布圖，{area_mex} 可在你圈選的每個金屬礦點放置採集器。"
"Your Commander's D-gun ({dgun}) destroys almost anything it touches, including your own units in its path." = "指揮官的 D 砲（{dgun}）幾乎能摧毀所觸及的一切，包括彈道上你自己的單位。"
"{perspective} climbs into the selected unit, or an ally's under the pointer, to see the battle through its eyes as it goes on with its orders. Escape climbs back out." = "按 {perspective} 進入選取的單位或游標下的盟友單位，以它的視角觀看戰鬥，它會繼續執行命令。按 Escape 離開。"
"Keep your metal and energy incomes above what you spend: building slows down for everything when a store runs dry." = "讓金屬與能量的收入高於支出：任一儲存耗盡時，所有建造都會變慢。"
"Right-clicking a factory's queued unit removes it; clicking it builds it next." = "在工廠佇列中的單位上按右鍵可移除；點擊則將其設為下一個建造。"
"Fight ({fight}) is attack-move: units stop to fight whatever they meet on the way." = "戰鬥（{fight}）就是攻擊移動：單位會停下來與沿途遇到的任何敵人交戰。"
"Ctrl+click is force fire: the selection attacks whatever is there, your own units too, or the ground." = "Ctrl+點擊為強制開火：選取的單位會攻擊該處的任何目標（包括你自己的單位）或地面。"
"{select_builders} selects your constructors, {select_factories} your factories, {select_armed} your armed units, {select_on_screen} everything on the screen." = "{select_builders} 選取建造者，{select_factories} 選取工廠，{select_armed} 選取武裝單位，{select_on_screen} 選取畫面上的所有單位。"
"Patrol ({patrol}) with constructors makes them repair, assist and reclaim along the route by themselves." = "讓建造者巡邏（{patrol}），它們會沿途自動修理、協助建造與回收。"
"Put a constructor on duty ({duty}) and it works by itself: the economy, repairs, reclaiming or defence. Any order you give takes it back." = "讓建造者值勤（{duty}），它就會自行工作：經濟、修理、回收或防禦。你下達的任何命令都會把它召回。"
"Drag with Reclaim ({reclaim}) to turn every wreck, rock and tree in a circle into metal and energy." = "使用回收（{reclaim}）拖曳出圓圈，可將圈內所有殘骸、岩石與樹木轉化為金屬和能量。"
"Ctrl+1 to Ctrl+9 make control groups; tap the number twice to look at the group." = "Ctrl+1 至 Ctrl+9 可建立編組；連按兩下數字鍵可將鏡頭移到該編組。"
"Hold {players} to see every player's side, team, units and income (your allies' in full)." = "按住 {players} 可查看每位玩家的陣營、隊伍、單位與收入（盟友的資訊完整顯示）。"
"Radar towers show enemy units long before they come into sight: build one early." = "雷達塔能在敵方單位進入視野前很久就發現它們：盡早建造一座。"
"Wind generators pay off on windy maps: the skirmish page shows each map's wind range." = "風力發電機在多風的地圖上很划算：遭遇戰頁面會顯示每張地圖的風力範圍。"
"Metal makers turn spare energy into metal, and stop when your energy runs dry." = "金屬製造機會將多餘的能量轉換成金屬，能量耗盡時便會停止。"
"Solar collectors fold shut for a few seconds when hit: tougher, but making no energy." = "太陽能收集器被擊中時會閉合數秒：更耐打，但不產生能量。"
"Units gain veterancy with every kill: veterans aim better and shrug off damage." = "單位每次擊殺都會累積經驗：老兵瞄得更準，也更耐打。"
"Shift adds to the orders a unit already has instead of replacing them." = "按住 Shift 會將命令附加在單位現有的命令之後，而不是取代它們。"
"Alt+drag while placing a building fills a rectangle with it: handy for solar farms and walls." = "放置建築時 Alt+拖曳可用它填滿矩形區域：很適合用來蓋太陽能農場和城牆。"
"Double-click a unit to select every unit of its type on screen; {select_type} selects them map-wide." = "雙擊單位可選取畫面上所有同類型單位；{select_type} 則選取全地圖的同類型單位。"
"{idle_builder} selects the next idle constructor, {idle_factory} the next idle factory." = "{idle_builder} 鍵選取下一個閒置的建造者，{idle_factory} 鍵選取下一個閒置的工廠。"
"Wrecks can be resurrected by resurrection kbots, or reclaimed for most of their metal." = "殘骸可由復活機器人復活，或回收以取得其大部分金屬。"
"Hovering a unit shows its health, firepower and range; {overlay_path} shows where the selection can go." = "游標停在單位上可顯示其生命值、火力與射程；{overlay_path} 顯示選取的單位可到達的區域。"
"{last_alert} (or Backspace) looks at the last place your units were attacked; press it again for the one before." = "{last_alert}（或 Backspace）可將鏡頭移到你的單位最近一次遭受攻擊的地點；再按一次，移到更早的一處。"
"A notice or a piece of advice with LOOK on it takes you to the place, or the unit, when you click it." = "帶有「查看」的通知或建議，點擊後會帶你前往相應的地點或單位。"
"{help} tells everything about the selected unit, or the one under the pointer: cost, speed, weapons, abilities." = "{help} 會顯示選取單位或游標下單位的所有資訊：成本、速度、武器、能力。"
"{next_unit} looks at the next of your units off the screen; with units selected, the next of them." = "{next_unit} 可查看畫面外的下一個己方單位；若有選取單位，則限於選取的單位。"
"Ctrl+F6 to Ctrl+F9 store camera positions; F6 to F9 bring them back." = "Ctrl+F6 至 Ctrl+F9 可儲存鏡頭位置；F6 至 F9 可叫出。"
"Anti-air matters: bombers can wreck an undefended economy in one pass." = "防空很重要：轟炸機一次掠過就能摧毀毫無防備的經濟。"
"An advanced factory needs a lot of metal: build it once your extractors and power can feed it." = "高級工廠需要大量金屬：等你的採集器與電力足以支撐時再蓋。"
"Guarding a factory with a constructor adds its build power to the factory's production." = "讓建造者護衛工廠，可將其建造力加入工廠的生產。"
"Moho mines extract far more metal than basic extractors: advanced constructors build them." = "Moho 礦井採集的金屬遠多於基本採集器：由高級建造者建造。"
"Every game is kept as a replay: watch it from the main menu, and jump through it with the bar." = "每場遊戲都會保存為重播：可從主選單觀看，並用進度條跳轉。"
"{overlay_sight} shows your sight, radar and sonar coverage; {overlay_height} shows the heights of the map." = "{overlay_sight} 顯示你的視野、雷達與聲納覆蓋範圍；{overlay_height} 顯示地圖高度。"
"The Commander can capture enemy units ({capture}): it takes a while, but the unit is yours." = "指揮官可以奪取敵方單位（{capture}）：需要一些時間，但該單位就會歸你所有。"
"{photo_mode} opens photo mode: the battle holds still, and you can light, frame and focus a shot at up to 4K." = "{photo_mode} 開啟拍照模式：戰鬥會靜止，你可以調整光線、構圖與對焦，拍出最高 4K 的照片。"
"TIP" = "提示"
"Dismiss" = "關閉"
"Don't show tips again" = "不再顯示提示"

# apps/ta_game/src/tutorial.rs
"THE BASICS" = "基礎操作"
"Your Commander, the camera, metal, energy and a first factory." = "你的指揮官、鏡頭、金屬、能量和第一座工廠。"
"Selecting units" = "選取單位"
"The camera" = "鏡頭"
"Metal and energy" = "金屬與能量"
"Factories" = "工廠"
"Welcome, Commander. The walking machine in the middle of the screen is your Commander: it builds, it fights, and losing it usually loses the battle. Click it to select it." = "歡迎，指揮官。畫面中央那台行走的機器就是你的指揮官：它能建造、能作戰，而失去它通常就等於輸掉戰鬥。點擊它即可選取。"
"Lost sight of it? {select_commander} selects the Commander from anywhere, and SHOW ME brings the camera to it." = "找不到指揮官了嗎？無論在哪裡，按 {select_commander} 都能選取它；按下「前往查看」則會將鏡頭移到它身上。"
"Look around. The arrow keys, the screen edges or dragging with the middle button scroll; the mouse wheel zooms towards the cursor, and dragging with the right button turns the view." = "四處看看。方向鍵、螢幕邊緣或按住中鍵拖曳可捲動畫面；滑鼠滾輪會朝游標位置縮放，按住右鍵拖曳可旋轉視角。"
"Push the pointer against an edge of the screen to scroll, or turn the mouse wheel to zoom." = "將游標推向螢幕邊緣即可捲動畫面，轉動滑鼠滾輪即可縮放。"
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the ECONOMY tab of the build menu at the bottom right and place it on the marked deposit." = "一切都由金屬與能量構成。金屬來自建在金屬礦床上的採集器。選取指揮官，從右下角建造選單的「經濟」分頁中選擇 Metal Extractor，並放在標示的礦床上。"
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the build menu on the left and place it on the marked deposit." = "一切都由金屬與能量構成。金屬來自建在金屬礦床上的採集器。選取指揮官，從左側建造選單中選擇 Metal Extractor，並放在標示的礦床上。"
"The outline turns green where the extractor can stand. Bring it onto the marked ring and click to place it." = "在可以放置採集器的位置，輪廓會變成綠色。將輪廓移到標示圈上，再點擊即可放置。"
"Energy comes from solar collectors and wind generators. Build a Solar Collector next to your Commander. The bars at the top show your stores and how fast they fill or drain; they warn you when one runs dry." = "能量來自太陽能收集器與風力發電機。在指揮官旁建造一座 Solar Collector。頂端的資源條會顯示你的儲量與增減速度；任一資源即將耗盡時會發出警告。"
"The Solar Collector is a flat, square panel. Pick it, then click on open ground near the Commander." = "Solar Collector 是一塊扁平的方形面板。選擇它，然後點擊指揮官附近的空地。"
"Factories build your army. Build a Kbot Lab (on the FACTORY tab) on a flat spot near the Commander, and wait for it to finish." = "工廠負責生產你的軍隊。在指揮官附近的平地上建造一座 Kbot Lab（位於「工廠」分頁），並等待它完工。"
"Factories build your army. Build a Kbot Lab from the build menu on a flat spot near the Commander, and wait for it to finish." = "工廠負責生產你的軍隊。從建造選單中選擇 Kbot Lab，在指揮官附近的平地上建造，並等待它完工。"
"Building takes metal and energy as it goes: while either bar at the top is empty, everything builds more slowly." = "建造時會隨著進度持續消耗金屬與能量：只要頂端任一資源條見底，所有建造都會變慢。"
"Select the Kbot Lab and click the Peewee three times to queue three of them (right-click one to take it off the queue). New units wait in front of the lab." = "選取 Kbot Lab，點擊 Peewee 三次，將三台排入佇列（按右鍵可從佇列中移除一台）。新單位會在 Kbot Lab 前方待命。"
"Click the lab itself on the map to select it: its build menu shows the units it makes." = "直接在地圖上點擊 Kbot Lab 本身來選取它：它的建造選單會列出它能生產的單位。"
"That is the whole cycle: extract, generate, build, fight. Keep both incomes above what you spend and keep your builders busy. Lesson complete!" = "這就是完整的循環：採集、發電、建造、作戰。讓兩種收入都高於支出，並讓建造者保持忙碌。課程完成！"
"Select and group an army, attack-move, and destroy an enemy outpost." = "選取軍隊並編組、進行攻擊移動，摧毀敵方前哨站。"
"Box selection" = "框選"
"Control groups" = "編組"
"Attack-move" = "攻擊移動"
"Destroying a base" = "摧毀基地"
"Your Kbot Lab has built a squad of Peewees. Drag a box around them with the left mouse button to select them all." = "你的 Kbot Lab 已生產出一支 Peewee 小隊。用滑鼠左鍵拖曳出方框圍住它們，即可全部選取。"
"Press the left button on open ground beside the squad, hold it, drag the box over them all and let go." = "在小隊旁的空地上按下左鍵並按住，拖曳方框圍住所有單位，然後放開。"
"Press Ctrl+1 to make them group 1. Pressing 1 selects them again from anywhere; pressing it twice brings the camera to them." = "按 Ctrl+1 將它們設為第 1 組。之後無論在哪裡按 1 都能再次選取它們；連按兩下會將鏡頭移到它們身上。"
"Hold Ctrl and press 1 while the squad is selected." = "在選取小隊的狀態下，按住 Ctrl 再按 1。"
"The enemy has an outpost at the marked place. Fight is attack-move: units walk there and take on whatever they meet on the way. Press {fight}, then click near the outpost." = "敵方在標示處有一座前哨站。戰鬥就是攻擊移動：單位會走向目的地，並與沿途遇到的任何敵人交戰。按 {fight}，然後點擊前哨站附近。"
"Select the squad first (press 1). Then press {fight}, or the Fight button among the orders, and click on the ground by the marked ring." = "先選取小隊（按 1）。接著按 {fight}，或按下命令中的「戰鬥」按鈕，再點擊標示圈旁的地面。"
"Destroy every building of the outpost. Its laser tower hits hard: keep the squad together, and queue reinforcements at the lab if you need them." = "摧毀前哨站的所有建築。它的雷射塔火力強大：讓小隊保持集結，必要時在 Kbot Lab 排入援軍。"
"Losing the fight? Pull the squad back, queue more Peewees at the lab and go in again with all of them together." = "戰況不利嗎？把小隊撤回來，在 Kbot Lab 排入更多 Peewee，再讓全員一起重新進攻。"
"The outpost is gone. The wrecks it left are worth metal: builders reclaim them (next lesson). Lesson complete!" = "前哨站已被摧毀。它留下的殘骸含有金屬：建造者可以回收它們（下一課）。課程完成！"
"ORDERS LIKE A VETERAN" = "像老兵一樣下令"
"Map views, area orders, building blocks and build queues." = "地圖檢視、區域命令、成片建造與建造佇列。"
"Map overlays" = "地圖疊加層"
"Area orders" = "區域命令"
"Building blocks" = "成片建造"
"Build queues" = "建造佇列"
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again. The MAP menu at the top right does the same." = "地圖能顯示地面隱藏的資訊。按 {overlay_metal} 開啟金屬分布圖（{overlay_path} 顯示單位可到達的區域，{overlay_height} 顯示高度，{overlay_sight} 顯示視野與雷達）；再按一次同一個鍵即可隱藏。右上角的「地圖」選單也有相同功能。"
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again." = "地圖能顯示地面隱藏的資訊。按 {overlay_metal} 開啟金屬分布圖（{overlay_path} 顯示單位可到達的區域，{overlay_height} 顯示高度，{overlay_sight} 顯示視野與雷達）；再按一次同一個鍵即可隱藏。"
"Press {overlay_metal}: the metal deposits light up all over the map." = "按 {overlay_metal}：整張地圖上的金屬礦床都會亮起來。"
"Select the Commander, press {area_mex} and drag a circle over the marked deposits: every metal spot inside gets an extractor, nearest first. A plain click takes the metal around the cursor." = "選取指揮官，按 {area_mex} 並在標示的礦床上拖曳出圓圈：圈內每個金屬礦點都會放置採集器，由近而遠。直接點擊則會採集游標周圍的金屬。"
"With the Commander selected, press {area_mex}, then press on the ground over the deposits and drag outwards: the circle grows as you drag." = "選取指揮官後按 {area_mex}，接著在礦床上方的地面按住滑鼠並向外拖曳：圓圈會隨著拖曳變大。"
"Many orders work on areas. Press {reclaim} (reclaim) and drag a circle over the rocks near your base: the Commander turns every one into metal." = "許多命令都能作用於區域。按 {reclaim}（回收）並在基地附近的岩石上拖曳出圓圈：指揮官會把每一塊都轉化為金屬。"
"Rocks and wrecks are worth metal. With the Commander selected, press {reclaim}, then press on the ground and drag the circle over a few rocks." = "岩石和殘骸都含有金屬。選取指揮官後按 {reclaim}，接著在地面上按住滑鼠，拖曳圓圈罩住幾塊岩石。"
"Hold Alt while you drag out a building to fill a whole block with it. Pick the Solar Collector, hold Alt and drag out a block of four or more." = "拖曳放置建築時按住 Alt，可用它填滿一整塊區域。選擇 Solar Collector，按住 Alt 並拖曳出四座以上的區塊。"
"Pick the Solar Collector, then hold Alt, press on the ground and drag: a block of outlines follows the pointer. Let go to place them all." = "選擇 Solar Collector，然後按住 Alt，在地面上按住滑鼠並拖曳：一整片輪廓會跟著游標移動。放開即可全部放置。"
"The Commander's queued buildings show under BUILD QUEUE, beside its picture at the bottom of the screen. Click one to build it next (right-click drops it). A factory's queue works the same way." = "指揮官佇列中的建築會顯示在畫面底部、其頭像旁的「建造佇列」下方。點擊其中一個即可將其設為下一個建造（按右鍵則移除）。工廠的佇列也是如此運作。"
"The BUILD QUEUE shows while the Commander alone is selected and has buildings waiting. Click any but the first: that one is being built." = "只有在單獨選取指揮官、且有建築正在排隊時，才會顯示「建造佇列」。點擊第一個以外的任何一個：第一個正在建造中。"
"Area orders, building blocks and queues save you hundreds of clicks in a battle. Lesson complete!" = "區域命令、成片建造與佇列能在戰鬥中為你省下數百次點擊。課程完成！"
"HOLD THE LINE" = "堅守防線"
"Defences, radar, repairs, and the metal in wrecks." = "防禦設施、雷達、修理，以及殘骸中的金屬。"
"Defences" = "防禦設施"
"Radar" = "雷達"
"Repairs" = "修理"
"Reclaiming wrecks" = "回收殘骸"
"Raiders will come from the marked direction. Build a Light Laser Tower (on the DEFENCE tab) in the marked ring: towers shoot whatever comes in range." = "突襲部隊將從標示的方向來犯。在標示圈內建造一座 Light Laser Tower（位於「防禦」分頁）：防禦塔會射擊進入射程的任何目標。"
"Raiders will come from the marked direction. Build a Light Laser Tower from the build menu in the marked ring: towers shoot whatever comes in range." = "突襲部隊將從標示的方向來犯。從建造選單中選擇 Light Laser Tower，在標示圈內建造：防禦塔會射擊進入射程的任何目標。"
"The Light Laser Tower is a small gun on a post. Pick it, put it in the ring and wait for it to finish." = "Light Laser Tower 是架在柱子上的一門小砲。選擇它，放進標示圈內，然後等待它完工。"
"Build a Radar Tower (on the SENSORS tab) near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "在基地附近建造一座 Radar Tower（位於「偵測」分頁）。早在你的單位看見敵人之前，雷達就會在地圖與小地圖上以光點顯示它們。"
"Build a Radar Tower from the build menu near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "從建造選單中選擇 Radar Tower，在基地附近建造。早在你的單位看見敵人之前，雷達就會在地圖與小地圖上以光點顯示它們。"
"The Radar Tower is a tall mast. Pick it, place it near the Commander and wait for it to finish." = "Radar Tower 是一根高聳的天線桿。選擇它，放在指揮官附近，然後等待它完工。"
"Here they come: raiders on your radar. Keep the Commander by the tower and let them come to you: together they hold the line." = "敵人來了：雷達上出現了突襲部隊。讓指揮官守在防禦塔旁，等敵人自己送上門：兩者聯手就能守住防線。"
"Do not chase them: the tower only fights what comes in range. Keep the Commander beside it; while it fights, the Commander can mend it ({repair}, then click the tower)." = "不要追擊：防禦塔只會攻擊進入射程的敵人。讓指揮官待在它旁邊；防禦塔作戰時，指揮官可以修理它（按 {repair}，再點擊防禦塔）。"
"The fight left a building damaged. Select the Commander, press {repair} and click it: builders mend what is damaged." = "戰鬥讓一座建築受損了。選取指揮官，按 {repair} 並點擊它：建造者能修理受損的單位與建築。"
"With the Commander selected, press {repair}, then click the damaged building. Its health bar fills as it is mended." = "選取指揮官後按 {repair}，接著點擊受損的建築。隨著修理進行，它的生命條會逐漸填滿。"
"The raiders left wrecks, and wrecks are worth metal. Select the Commander, press {reclaim} and click a wreck, or drag a circle over them all." = "突襲部隊留下了殘骸，而殘骸含有金屬。選取指揮官，按 {reclaim} 並點擊一處殘骸，或拖曳出圓圈罩住所有殘骸。"
"Wrecks lie where the raiders fell. With the Commander selected, press {reclaim} and click one: the metal bar rises as it is taken apart." = "殘骸就在突襲部隊倒下的地方。選取指揮官後按 {reclaim}，接著點擊其中一處：隨著殘骸被拆解，金屬條會逐漸增長。"
"Towers hold ground while your army is elsewhere, radar sees what is coming, and builders mend and recycle. Lesson complete!" = "軍隊在別處時，防禦塔能守住陣地；雷達能預先發現來敵；建造者則負責修理與回收。課程完成！"
"BUILDERS AND FACTORIES" = "建造者與工廠"
"Builders that help, factories that keep building, patrols and standing orders." = "互相協助的建造者、持續生產的工廠、巡邏與常設命令。"
"Construction units" = "建造者"
"Helping a factory" = "協助工廠"
"Rally points" = "集結點"
"Standing orders" = "常設命令"
"One builder is slow. Select the Kbot Lab and build a Construction Kbot: it builds what the Commander builds, and more besides." = "只有一個建造者太慢了。選取 Kbot Lab 並生產一台 Construction Kbot：指揮官能建造的它都能建造，而且還能建造更多。"
"Click the lab on the map to select it; the Construction Kbot is in its build menu. Wait for it to walk out." = "在地圖上點擊 Kbot Lab 來選取它；Construction Kbot 就在它的建造選單中。等它走出 Kbot Lab。"
"Builders help each other. Select the Construction Kbot, press {guard} and click the Kbot Lab: it lends the lab its build power, and the lab builds faster." = "建造者能互相協助。選取 Construction Kbot，按 {guard} 並點擊 Kbot Lab：它會把建造力借給 Kbot Lab，讓生產速度加快。"
"With the Construction Kbot selected, press {guard}, then click the lab. It stays by the lab and helps with everything it makes." = "選取 Construction Kbot 後按 {guard}，接著點擊 Kbot Lab。它會留在 Kbot Lab 旁，協助生產它製造的所有單位。"
"Factories send their units where you say. Select the Kbot Lab. {order_click} on open ground nearby: new units gather there." = "工廠會把生產的單位派往你指定的地點。選取 Kbot Lab，然後{order_click}附近的空地：新單位會在那裡集結。"
"Select the lab first. With it selected, {order_click} on the ground where its units should gather." = "先選取 Kbot Lab。在選取狀態下，{order_click}你要讓單位集結的地面。"
"Turn on Repeat for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "為 Kbot Lab 開啟「重複」：它完成的單位會重新排到佇列末端，因此生產永不停歇。"
"Turn on REPEAT BUILD for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "為 Kbot Lab 開啟「重複建造」：它完成的單位會重新排到佇列末端，因此生產永不停歇。"
"Select the lab, then turn Repeat on: the pointer shows where it is." = "選取 Kbot Lab，再開啟「重複」：箭頭會指出它的位置。"
"Builders on patrol mend and reclaim whatever they pass. Select the Construction Kbot, press {patrol} and click on the far side of your base." = "巡邏中的建造者會修理並回收沿途經過的一切。選取 Construction Kbot，按 {patrol} 並點擊基地的另一側。"
"With the Construction Kbot selected, press {patrol}, then click on the ground: it walks back and forth between there and where it stood." = "選取 Construction Kbot 後按 {patrol}，接著點擊地面：它會在該處與原本所在的位置之間來回巡邏。"
"Units keep standing orders. Select your Peewees and set their fire order to Hold fire with the button beside the orders: they will not shoot until you say." = "單位會持續遵守常設命令。選取你的 Peewee，用命令旁的按鈕把射擊命令設為「停火」：在你下令之前，它們都不會開火。"
"Units keep standing orders. Select your Peewees and set their FIRE ORDERS to Hold fire: they will not shoot until you say." = "單位會持續遵守常設命令。選取你的 Peewee，把「射擊命令」設為「停火」：在你下令之前，它們都不會開火。"
"Select the Peewees, then click the fire order button until it shows HOLD FIRE: each click is the next order." = "選取 Peewee，然後持續點擊射擊命令按鈕，直到它顯示「停火」：每點擊一次就會切換到下一個命令。"
"You are ready for a skirmish: start against an Easy computer player, then Normal. {help} lists every key. Good hunting, Commander!" = "你已經準備好進行遭遇戰了：先對抗「簡單」難度的電腦玩家，再挑戰「普通」。{help} 會列出所有按鍵。祝狩獵順利，指揮官！"
"Ready: {done} of {total}" = "已就緒：{done}/{total}"
"Selected: {done} of {total}" = "已選取：{done}/{total}"
"Built: {percent}%" = "建造進度：{percent}%"
"Still standing: {left} of {total}" = "剩餘：{left}/{total}"
"Raiders left: {left} of {total}" = "剩餘突襲部隊：{left}/{total}"
"Health: {percent}%" = "生命值：{percent}%"
"LESSON {n} · {title}" = "第 {n} 課 · {title}"
"Show the instructions" = "展開說明"
"Fold the instructions away" = "收起說明"
"LESSON COMPLETE" = "課程完成"
"NEXT LESSON" = "下一課"
"SET UP A SKIRMISH" = "設定遭遇戰"
"Choose a map: your opponents start as Easy computer players" = "選擇一張地圖：對手預設為「簡單」難度的電腦玩家"
"HINT" = "提示"
"Go on without doing this step" = "跳過此步驟繼續"
"SHOW ME" = "前往查看"
"Bring the camera to it" = "將鏡頭移到該處"
"REALLY LEAVE?" = "確定要離開？"
"Back to the main menu: this lesson starts over next time" = "返回主選單：下次將從頭開始本課"
"{done} OF {total} LESSONS COMPLETE" = "已完成 {done}/{total} 課"
"Short guided games on Painted Desert against an enemy that stays out of your way. Follow the panel at the top left; each step ticks off as you do it." = "在 Painted Desert 上進行的簡短引導式遊戲，敵人不會來妨礙你。依照左上角面板的指示操作；每完成一個步驟就會自動打勾。"
"{summary} · {n} steps · about {minutes} min" = "{summary} · {n} 個步驟 · 約 {minutes} 分鐘"
"START" = "開始"

# apps/ta_launcher/src/app/events.rs
"Close the game first: the update replaces its files" = "請先關閉遊戲：更新會替換遊戲的檔案"
"Wait for the current skin operation to finish, then try again." = "請等待目前的造型作業完成後再試。"
"Wait for the mod being installed" = "請等待模組安裝完成"
"READY · IT INSTALLS WHEN THE GAME CLOSES" = "準備就緒 · 待遊戲關閉後安裝"
"READY · IT INSTALLS AFTER THE SKIN WORK" = "準備就緒 · 待造型作業完成後安裝"
"READY · IT INSTALLS AFTER THE MOD" = "準備就緒 · 待模組完成後安裝"
"READY · IT INSTALLS WHEN THE PROFILE IS CLOSED" = "準備就緒 · 待個人檔案關閉後安裝"
"READY · IT INSTALLS WHEN THE SKIN IS SAVED" = "準備就緒 · 待造型儲存後安裝"
"The game crashed during the benchmark: the Play page has its crash report." = "遊戲在效能測試期間當機：當機報告請見「開始」頁面。"
"The game stopped during the benchmark (exit code {code})." = "遊戲在效能測試期間停止（結束代碼 {code}）。"
"The benchmark was stopped before its end." = "效能測試在完成前就已停止。"
"Could not install {name}: {error}" = "無法安裝{name}：{error}"
"This copy is in TA Reborn's program folder, which comes before your mods folder: replace it there to update it." = "此副本位於 TA Reborn 的程式資料夾中，其優先於你的模組資料夾：請在那裡替換它以更新。"
"{name} is updated: {units} units, {maps} maps" = "{name} 已更新：{units} 個單位，{maps} 張地圖"
"{name} is installed and on: {units} units, {maps} maps" = "{name} 已安裝並啟用：{units} 個單位，{maps} 張地圖"
"{name} is installed and on in place of {others}: {units} units, {maps} maps" = "{name} 已安裝並啟用，取代了 {others}：{units} 個單位，{maps} 張地圖"
"{name} is installed: turn it on to play with it" = "{name} 已安裝：啟用後即可在遊戲中使用"
"{name} is installed: {units} units, {maps} maps. Turn it on to play with it." = "{name} 已安裝：{units} 個單位，{maps} 張地圖。啟用後即可在遊戲中使用。"
"File drops are unavailable while a dialog or key binding is active." = "對話方塊開啟或正在設定按鍵時，無法拖放檔案。"
"REMOVE {name}?" = "要移除 {name} 嗎？"
"It goes to the Recycle Bin and out of the load order. Its GET button installs it again." = "它會被移至資源回收筒並移出載入順序。按下它的「取得」按鈕即可重新安裝。"
"It goes to the Recycle Bin and out of the load order: put it back from there if you change your mind." = "它會被移至資源回收筒並移出載入順序：如果改變心意，可以從資源回收筒還原。"
"{mods} need it: they are not loaded without it." = "{mods} 需要它：沒有它就無法載入。"
"REMOVE" = "移除"
"Unknown" = "未知"
"REPLACE {name}?" = "要替換{name}嗎？"
"{file} would take the place of the {name} installed now (version {version}): its files would be removed." = "{file}將取代目前安裝的{name}（版本 {version}）：其檔案將被刪除。"
"REPLACE" = "替換"
"WHAT'S NEW IN {version}" = "{version} 版更新內容"
"A map archive (.ufo .hpi .zip .7z .rar): its maps imported as a map pack" = "地圖壓縮檔（.ufo .hpi .zip .7z .rar）：其中的地圖會以地圖包形式匯入"
"A mod's archive (.zip .rar .7z), a TA archive (.ufo .hpi .gp3) or its folder: installed" = "模組壓縮檔（.zip .rar .7z）、TA 壓縮檔（.ufo .hpi .gp3）或模組資料夾：直接安裝"
"A skin pack (.taskin): checked and added to your skin library" = "造型包（.taskin）：檢查後加入造型庫"
"A saved game or a replay: the game opens it" = "存檔或重播：由遊戲開啟"
"Your Total Annihilation folder: the launcher uses it" = "你的 Total Annihilation 資料夾：供啟動器使用"
"DROP TO IMPORT" = "放開即可匯入"
"DROP TO INSTALL" = "放開即可安裝"

# apps/ta_launcher/src/app/maps.rs
"Wait for the Supreme Commander maps being made, then try again." = "請等 Supreme Commander 地圖製作完成，然後再試一次。"
"Checking and importing maps…" = "正在檢查並匯入地圖…"
"Import map archive" = "匯入地圖壓縮檔"
"Map archives" = "地圖壓縮檔"
"Close the game first: maps cannot be imported while it runs" = "請先關閉遊戲：遊戲執行時無法匯入地圖"
"Wait for the mod being installed, then import the maps again" = "請等待模組安裝完成，再重新匯入地圖"

# apps/ta_launcher/src/app/polish.rs
"KEYBOARD SHORTCUTS" = "鍵盤快捷鍵"
"Start the game from the Play page" = "從「開始」頁面啟動遊戲"
"Refresh game files, mods, maps or skins on the current page" = "重新整理目前頁面的遊戲檔案、模組、地圖或外觀"
"Search mods, maps, skins or settings" = "搜尋模組、地圖、外觀或設定"
"Clear the focused search or close a dialog" = "清空目前搜尋框或關閉對話方塊"

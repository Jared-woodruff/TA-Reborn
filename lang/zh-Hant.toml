"Everything is in sight" = "全圖可見"
"Line of sight as the rules have it" = "視野依照規則"
"Every unit on radar" = "所有單位都顯示在雷達上"
"Radar as the rules have it" = "雷達依照規則"
"Your weapons do double damage" = "你的武器造成雙倍傷害"
"Your weapons do half damage" = "你的武器造成一半傷害"

# apps/ta_game/scenarios/armageddon.toml
"Armageddon" = "末日決戰"
"Two armies, one plain, no retreat. Win the battle of the war." = "兩支大軍，一片平原，沒有退路。贏下這場決定戰局的一戰。"
"Commander, the Core's main army is marching north across the Mounds, and ours stands in its way. There are no bases here, no factories, no reinforcements: what you have is all you will ever have.\n\nThey outnumber us. We outgun them. Put the Lugers and the Merls on their columns as they close, hold the line with the Zeus, and keep the Jethros with the tanks: they will bring gunships. Their reserves arrive two and a half minutes in.\n\nDestroy every one of them." = "指揮官，Core 的主力部隊正越過丘陵地向北進軍，而我軍正擋在它的去路上。這裡沒有基地、沒有工廠、沒有援軍：你手上的兵力，就是你所能擁有的全部。\n\n他們人數比我們多，但我們火力比他們強。趁敵軍縱隊逼近時，用 Luger 和 Merl 轟擊他們，以 Zeus 守住防線，並讓 Jethro 跟著坦克行動：他們會派出武裝直升機。他們的後備部隊將在兩分半鐘後抵達。\n\n把他們全部消滅。"
"Arm Command" = "Arm 指揮部"
"Here they come. Hold the line, and keep the Jethros with the tanks." = "他們來了。守住防線，讓 Jethro 跟著坦克。"
"Their reserves are coming up behind the mounds, a Goliath at their head." = "他們的預備隊正從土丘後方趕來，領頭的是一台 Goliath。"

# apps/ta_game/scenarios/armistice.toml
"The Armistice" = "停戰協定"
"Five minutes of peace to build an army. Then the war resumes." = "五分鐘的和平用來組建軍隊。然後戰爭繼續。"
"Commander, the peace talks on Reactor Grid have failed. The armistice holds for five more minutes: until then no weapon may fire, and neither side may build near the other's base. When it ends, the war resumes.\n\nBoth sides are rearming at a furious pace: resources and construction run at twice their usual speed, and the treaty's one lasting clause bans missile silos. Their Commander knows the clock as well as you do.\n\nBuild as you have never built. When the armistice ends, destroy the Core Commander." = "指揮官，Reactor Grid 上的和談已經破裂。停戰還會維持五分鐘：在那之前任何武器都不得開火，雙方都不得在對方基地附近建造。停戰一結束，戰爭就會繼續。\n\n雙方都在以瘋狂的速度重新武裝：資源和建造都以平時兩倍的速度進行，而條約唯一保留下來的條款禁止飛彈發射井。他們的指揮官和你一樣清楚這個時鐘。\n\n以前所未有的速度建造。停戰結束時，摧毀 Core 的指揮官。"
"The talks have failed. For five minutes no weapon fires and nobody builds near the other's base. Then it is war: build as you have never built." = "和談破裂了。五分鐘內任何武器都不會開火，也沒人能在對方基地附近建造。之後就是戰爭：以前所未有的速度建造。"
"Their factories are running day and night. Ours should be too." = "他們的工廠日夜不停地運轉。我們的也該如此。"
"Core Overseer" = "Core 監管者"
"Ten seconds, Arm. We have counted every one of your factories." = "還有十秒，Arm。你們的每一座工廠我們都數過了。"
"Their Commander is somewhere in that grid. Find it, and end this war for good." = "他們的指揮官就在那片網格的某處。找到它，徹底結束這場戰爭。"

# apps/ta_game/scenarios/brothers_in_arms.toml
"Brothers in Arms" = "戰友"
"You and an allied Commander against two of the Core's." = "你和一位盟軍指揮官對抗兩名 Core 指揮官。"
"Commander, you are not alone on Highland Rift. Commander Holt's forces hold the river crossings in the north, beside yours in the north-western highlands. Two Core Commanders are dug in to the south, across the canyon.\n\nHolt's computer will fight its own war, but it is the same war: back it up when it is hard pressed, and it will do the same for you. Your forces see what its forces see.\n\nDestroy both Core Commanders. Keep yours alive." = "指揮官，你在 Highland Rift 上並不孤單。Holt 指揮官的部隊守著北方的渡河點，就在你位於西北高地的部隊旁邊。兩名 Core 指揮官在南方峽谷的另一側築起了陣地。\n\nHolt 的電腦會打它自己的仗，但這是同一場戰爭：它吃緊時去支援它，它也會同樣支援你。你的部隊能看到它的部隊所看到的一切。\n\n摧毀兩名 Core 指揮官。讓你自己的指揮官活下來。"
"Commander Holt" = "Holt 指揮官"
"Good to have you on the line. I'll hold the river crossings in the north; you take the western highlands." = "很高興你上線了。我守北面的渡河點；你拿下西邊的高地。"
"My scouts have found both of their bases. The south-western one is yours; I'll keep the other busy." = "我的偵察兵找到了他們的兩座基地。西南那座歸你；另一座我來牽制。"
"They're massing at the canyon. If they come for one of us, the other hits them from the side." = "他們在峽谷集結了。如果他們攻打我們其中一個，另一個就從側面打過去。"
"Still with me? Then let's finish it. Everything we have, at their Commanders." = "還跟著我嗎？那就結束它吧。我們所有的一切，都砸向他們的指揮官。"

# apps/ta_game/scenarios/decapitation.toml
"Kill the Core Commander on his island fortress. From the air." = "擊殺盤據島嶼要塞的 Core 指揮官。從空中下手。"
"Commander, a Core Commander has made his fortress on the island at the centre of this lava sea. Nothing on treads or legs will reach him, and his anti-air is the best the Core can build.\n\nYou have a small air wing and a forward airfield in the south-west corner: build it up. Strip away his air defences, then send the bombers in; a handful sent straight at him will not get through. Brawler gunships hit hard but die fast over flak, and the Freedom Fighters can keep his fighters off your bombers.\n\nHis reinforcements arrive in fifteen minutes. Before then, he must be dead." = "指揮官，一名 Core 指揮官在這片熔岩海中央的島上建起了要塞。任何履帶或步行單位都無法抵達，而他的防空是 Core 所能打造的最強陣容。\n\n你有一支小型航空隊，以及位於西南角的前進機場：好好擴建它。先拔除他的防空設施，再派轟炸機進去；只派少數幾架直接衝向他，是過不去的。Brawler 武裝直升機火力強大，但在高射砲火下很快就會被擊落；Freedom Fighter 則能替你的轟炸機擋開他的戰鬥機。\n\n他的援軍將在十五分鐘後抵達。在那之前，他必須死。"

# apps/ta_game/scenarios/doomsday_clock.toml
"Doomsday Clock" = "末日之鐘"
"The Core's missile launches in fifteen minutes. Stop it." = "Core 的飛彈將在十五分鐘後發射。阻止它。"
"Commander, a Silencer nuclear silo stands at the heart of the Core base across these metal plains, and it is arming. In fifteen minutes the missile flies, and your base is the target.\n\nDestroy the silo. Nothing else matters: not their Commander, not their factories. The silo sits behind heavy laser towers and a Punisher battery, and their Commander will not sit still while you come for it.\n\nYou have a base, two factories and two construction kbots. The clock is running." = "指揮官，在這片金屬平原的另一端，Core 基地的中心矗立著一座 Silencer 核彈發射井，而且正在裝填。十五分鐘後飛彈就會升空，目標正是你的基地。\n\n摧毀發射井。其他一切都不重要：不管是他們的指揮官，還是他們的工廠。發射井位於重型雷射塔與一座 Punisher 砲台後方，而當你來犯時，他們的指揮官也不會坐以待斃。\n\n你有一座基地、兩座工廠和兩台建造機器人。倒數已經開始。"
"Ten minutes to launch, Commander." = "距離發射還有十分鐘，指揮官。"
"Five minutes to launch. That silo has to go." = "距離發射還有五分鐘。必須摧毀那座發射井。"
"One minute! Get to that silo!" = "還有一分鐘！快去那座發射井！"

# apps/ta_game/scenarios/endless_siege.toml
"Endless Siege" = "無盡圍城"
"The waves never stop. Survive as long as you can." = "攻勢永不停歇。盡可能存活下去。"
"Commander, there is no rescue coming, no reinforcements, no victory. The Core has found your outpost in the mesas and will throw everything it has at it, from three directions, for as long as it takes.\n\nKbots, then tanks, then artillery and bombers; heavier every time, and now and then something enormous. Build an economy, build defences, and hold on.\n\nYour best time is kept. Beat it." = "指揮官，不會有人來救援，不會有援軍，也不會有勝利。Core 已經發現你在台地間的前哨站，將從三個方向傾巢而出，無論要打多久。\n\n先是機器人，接著是坦克，然後是火砲與轟炸機；一波比一波強，偶爾還會出現龐然巨物。建立經濟、建造防禦，然後撐下去。\n\n你的最佳時間會被記錄下來。打破它。"

# apps/ta_game/scenarios/extraction.toml
"Extraction" = "撤離"
"Get your Commander down the lava river to the pick-up point." = "沿著熔岩河而下，將你的指揮官送到接應點。"
"Commander, your drop went wrong. You are on the south bank of a river of lava at the western end of the Run, with what is left of your escort, and the dropships can only land at the far eastern end.\n\nThe Core has guns all along the north bank, and patrols on your side of the river. Keep away from the lava's edge (their laser towers reach no further), deal with the patrols, and get your Commander to the pick-up point. Whatever guards it will not come to you. Core troops are already following your tracks; do not stop for long.\n\nAnything else is expendable. Your Commander is not." = "指揮官，你的空降出了差錯。你和殘存的護衛隊位於這條熔岩河道西端的南岸，而運輸艇只能在最東端降落。\n\nCore 在整條北岸都部署了火砲，你這一側的河岸也有巡邏隊。遠離熔岩河岸邊（他們的雷射塔射程只到那裡），解決巡邏隊，並把你的指揮官送到接應點。接應點的守軍不會主動找上你。Core 部隊已經循著你的足跡追來；不要停留太久。\n\n其他一切都可以犧牲。你的指揮官不行。"

# apps/ta_game/scenarios/iron_rain.toml
"Iron Rain" = "鋼鐵之雨"
"Two Intimidators are shelling your base. Take the mesa and silence them." = "兩門 Intimidator 正在砲擊你的基地。奪下台地，讓它們閉嘴。"
"Commander, the Core has hauled two Intimidators, its long-range plasma cannons, onto the mesas in the middle of the canyon. Your base is inside their range. Every eight seconds each of them will put a shell among your buildings, until you silence them.\n\nThe battery is dug in behind heavy laser towers and a Punisher, with tanks on the ramps, and the Core's main base lies beyond it, to the south-east. Its Commander will send what it can.\n\nSpread out, build fast and take that mesa. Destroy both Intimidators." = "指揮官，Core 把兩門 Intimidator，也就是它的遠程電漿砲，拖上了峽谷中央的台地。你的基地在它們射程之內。每隔八秒，它們每一門都會往你的建築之間打一發砲彈，直到你讓它們閉嘴為止。\n\n砲兵陣地藏在重型雷射塔和一門 Punisher 後面，坡道上有坦克，再往東南方是 Core 的主基地。它的指揮官會派來能派的一切。\n\n分散開來，快速建造，奪下那片台地。摧毀兩門 Intimidator。"
"Commander, two Intimidators on the mesas have your range. Every eight seconds each of them will put a shell into your base." = "指揮官，台地上的兩門 Intimidator 已經把你的基地納入射程。每隔八秒，它們每一門都會往你的基地打一發砲彈。"
"A Core radar post in the canyon to the south-east is spotting for those guns. Knock it out and they can no longer see your base." = "東南方峽谷裡的一座 Core 雷達站正在為那些砲校射。摧毀它，他們就再也看不見你的基地了。"
"Spread your buildings out: a shell that lands among them takes them all." = "把建築分散開：落在它們中間的一發砲彈會把它們全部帶走。"
"Their gunners have your range now. Take that mesa, Commander!" = "他們的砲手已經校準了距離。奪下那片台地，指揮官！"

# apps/ta_game/scenarios/king_of_the_hill.toml
"King of the Hill" = "山頂之王"
"Hold the summit for four minutes before the Core does." = "搶在 Core 之前守住山頂四分鐘。"
"Commander, the spiral mountain at the heart of this plain is rich in metal, and whoever holds its summit holds the planet. A Core Commander has landed to the north with the same idea.\n\nTake the summit and keep it: four minutes in all with only your forces on top wins it. Contested, the clock stands still. If the Core holds it alone for four minutes, the mountain is theirs.\n\nThe Core will keep sending troops up the slopes. Build up, get there first, and dig in." = "指揮官，這片平原中央的螺旋山蘊藏豐富的金屬，誰控制了山頂，誰就控制了這顆行星。一名 Core 指揮官已在北方登陸，打的也是同樣的主意。\n\n奪下山頂並守住它：山頂上只有你的部隊、且累計滿四分鐘，就能獲勝。雙方爭奪時，計時會暫停。如果 Core 單獨佔領滿四分鐘，這座山就歸他們了。\n\nCore 會不斷派兵登上山坡。壯大實力，搶先抵達，然後固守陣地。"
"Core troops are climbing the north slope. Don't let them dig in on the summit." = "Core 部隊正在攀登北坡。別讓他們在山頂站穩腳跟。"
"Raiders are coming round the mountain for your base." = "突襲部隊正繞過山朝你的基地而來。"

# apps/ta_game/scenarios/last_stand.toml
"Last Stand" = "最後防線"
"Hold the pass for twelve minutes. They will not stop coming." = "守住隘口十二分鐘。敵軍會源源不絕地湧來。"
"Commander, the Core has broken through at Varrin Gap. The only way into the valley behind you is the winding pass ahead, and your outpost at its western mouth is all that stands in the way.\n\nReinforcements are twelve minutes out. Hold until they arrive. Core forces will come through the pass in waves, each heavier than the last; expect bombers, and expect worse at the end: our scouts have seen something very large moving in the east.\n\nYou have a small base, a kbot lab and two construction kbots. Build what you can. Keep your Commander alive." = "指揮官，Core 已在瓦林隘口突破防線。通往你身後山谷的唯一道路，就是前方這條蜿蜒的隘道，而位於隘道西口的前哨站，是擋在敵軍面前的唯一屏障。\n\n援軍還要十二分鐘才會抵達。堅守到他們趕到。Core 部隊將一波波穿越隘道，一波比一波強；預料會有轟炸機，最後還會有更糟的：我們的偵察兵發現有個非常龐大的東西正在東方移動。\n\n你有一座小型基地、一座機器人實驗室和兩台建造機器人。能蓋什麼就蓋什麼。讓你的指揮官活下去。"
"Outpost, this is Arm Command. The relief force is twelve minutes out. Nothing gets through that pass before it arrives." = "前哨，這裡是 Arm 指揮部。增援部隊還有十二分鐘到達。在他們到來之前，什麼都不能通過那個山口。"
"Radar: aircraft inbound from the east. Bombers! Get your anti-air up." = "雷達：東方有飛機來襲。是轟炸機！把防空建起來。"
"Seismic contact in the pass. It's the big one, Commander: a Krogoth." = "山口出現地震訊號。是個大傢伙，指揮官：一台 Krogoth。"
"One minute! The relief force is entering the valley." = "還有一分鐘！增援部隊正在進入山谷。"

# apps/ta_game/scenarios/metal_rush.toml
"The first to make 15,000 metal wins. The Core plays rough." = "率先產出 15,000 金屬者獲勝。Core 可不會手下留情。"
"Commander, the mining rights to this planet go to whoever proves they can work it: the first side to extract fifteen thousand metal wins it outright.\n\nThe Core is racing you from the western plateau, and the Core has never been known to race fair. Expect raids on your extractors. Build fast, protect your economy, and if you can, take theirs apart.\n\nMetal makers count. Reclaimed metal counts. Whatever you make, counts." = "指揮官，這顆行星的採礦權，將歸於證明自己有能力開採的一方：率先採集一萬五千金屬的陣營，將直接獲得採礦權。\n\nCore 正從西方高原與你競賽，而 Core 向來不是會公平競爭的對手。預料你的採集器會遭到突襲。快速建造，保護你的經濟，如果可以的話，把他們的經濟拆了。\n\n金屬製造機產出的算數。回收的金屬也算數。只要是你產出的，都算數。"

# apps/ta_game/scenarios/titans.toml
"Titans" = "泰坦"
"Three Krogoths are walking toward your base. Bring them down." = "三台 Krogoth 正朝你的基地走來。把它們打倒。"
"Commander, seismic stations round the basin are reading footfalls: three Krogoths, the Core's walking fortresses, are crossing the salt pans toward your base, one after another, each with an escort.\n\nNothing out there can stop them but you. A Krogoth's head laser reaches further than your D-gun, so keep your Commander back. Bombers, artillery and massed Zeus will bring one down. Lose your nerve and it will walk through your base.\n\nYou have a base with three factories, four construction kbots and a garrison. Destroy all three of them." = "指揮官，盆地四周的地震站正在記錄腳步聲：三台 Krogoth，Core 的行走堡壘，正一台接一台地穿過鹽沼朝你的基地而來，每一台都有護衛。\n\n外面沒有什麼能阻止它們，除了你。Krogoth 的頭部雷射射程比你的 D 砲更遠，所以讓指揮官待在後方。轟炸機、砲兵和成群的 Zeus 能打倒一台。若是亂了陣腳，它會直接踏過你的基地。\n\n你有一座擁有三座工廠、四台建造機器人和一支守軍的基地。把三台全部摧毀。"
"Commander, seismic stations are reading footfalls round the basin. Three Krogoths are walking toward your base, one after another." = "指揮官，地震站在盆地四周記錄到腳步聲。三台 Krogoth 正一台接一台朝你的基地走來。"
"The first Krogoth has crossed the north-western rim. It is coming straight for you." = "第一台 Krogoth 已經越過西北邊緣，正筆直朝你而來。"
"Keep your Commander back: that head laser reaches further than your D-gun." = "讓指揮官待在後方：那道頭部雷射的射程比你的 D 砲更遠。"
"The second Krogoth is through the northern pass, with rockets and anti-air round it." = "第二台 Krogoth 已經穿過北面山口，周圍有火箭和防空部隊。"
"The last of them, out of the north-east, with the heaviest escort yet. End this, Commander." = "最後一台從東北方來，護衛是迄今最強的。結束這一切吧，指揮官。"

# apps/ta_game/scenarios/until_dawn.toml
"Until Dawn" = "堅守到黎明"
"Night falls on the timber. Hold your ridge until the sun comes up." = "夜幕降臨森林。堅守你的山脊，直到太陽升起。"
"Commander, night is falling over Timberline, and the Core is moving through the forest under it. Your outpost holds the western ridge: the only road out of the valley runs past it.\n\nThe relief column cannot move before first light. Until then you are on your own. In the dark and the rain their raiders will be on you before you see them, so build radar, and keep your floodlights burning.\n\nYou have a small base, a kbot lab and two construction kbots. Hold until dawn, and keep your Commander alive." = "指揮官，夜幕正降臨 Timberline，Core 正趁著夜色穿越森林。你的前哨守著西側山脊：離開山谷的唯一道路就從它面前經過。\n\n救援縱隊天亮之前無法出發。在那之前你只能靠自己。黑暗與雨幕中，敵人的突襲部隊會在你看見之前就撲上來，所以要建造雷達，並讓探照燈一直亮著。\n\n你有一座小基地、一座 Kbot Lab 和兩台建造機器人。堅守到黎明，並讓你的指揮官活下來。"
"Outpost Echo, the Core is moving through the timber tonight. Hold your ridge until first light: the relief column marches at dawn." = "回聲前哨，Core 今晚要穿越森林。守住山脊直到天亮：救援縱隊黎明出發。"
"Raiders in the eastern trees. In this rain you will hear them before you see them." = "東邊樹林裡有突襲部隊。這場雨裡，你會先聽見他們，再看見他們。"
"Pyros in the north-eastern woods. Keep them out of the trees round your base: the timber will burn." = "東北樹林裡有 Pyro。別讓他們靠近基地周圍的樹：樹林會燒起來。"
"A convoy got through from the south-west. Four Zeus and two Jethros are yours, Commander." = "一支車隊從西南方突破過來了。四台 Zeus 和兩台 Jethro 歸你指揮，指揮官。"
"Seismic contact in the south-east: heavy treads. They are saving the worst for the last hours of the night." = "東南方出現地震訊號：重型履帶。他們把最糟的留到了夜裡最後幾個小時。"
"Sunrise in one minute. The relief column is at the river. Hold on!" = "一分鐘後日出。救援縱隊已經到了河邊。撐住！"


# crates/ta_ui/src/seasonal.rs
"FESTIVE FIELD NOTES" = "聖誕戰地提示"
"NEW YEAR FIELD NOTES" = "新年戰地提示"
"SPOOKY FIELD NOTES" = "萬聖戰地提示"
"Santa's sleigh is not a transport. Load your presents into an Atlas instead." = "聖誕老人的雪橇可不是運輸單位。禮物還是裝上 Atlas 吧。"
"The D-gun does not gift-wrap. Take it up with your Commander." = "D 砲恕不提供禮物包裝服務。有意見請找你的指揮官。"
"A Fusion Reactor keeps the fairy lights on all winter. Just never build one next to the tree." = "一座 Fusion Reactor 能讓聖誕燈飾亮上一整個冬天。只是千萬別把它蓋在聖誕樹旁邊。"
"Snow falls on the Arm and the Core alike. So do Big Bertha shells." = "雪花對 Arm 和 Core 一視同仁。Big Bertha 的砲彈也一樣。"
"Coal in your stocking? Reclaim it. Metal is metal." = "聖誕襪裡只有一塊煤？拿去回收。金屬不問出處。"
"Peewees sing terrible carols, but they never miss a patrol." = "Peewee 唱起聖誕歌來五音不全，巡邏卻從不缺席。"
"Stockings full of metal, storage full of energy: a Commander's perfect Christmas morning." = "聖誕襪裡塞滿金屬，能量儲存全滿：這才是指揮官完美的聖誕早晨。"
"Silent night, holy night: keep a radar tower running, just in case." = "平安夜，聖善夜：雷達塔還是開著吧，以防萬一。"
"Snowball fights are fun until somebody brings a Krogoth." = "打雪仗很好玩，直到有人搬來一台 Krogoth。"
"New Year's resolution: build more metal extractors. This year, keep it." = "新年新希望：多蓋金屬採集器。今年可別又只有三分鐘熱度。"
"Fireworks are pretty, but a nuclear silo's are louder. Celebrate responsibly." = "煙火固然漂亮，核彈發射井放的可響多了。慶祝過量，有害健康。"
"Count down from ten, then count your units. The second count matters more." = "從十開始倒數，然後清點你的單位。後面那個數字比較重要。"
"Out with the old Commander? You only get one. Look after it all year." = "除舊布新，連指揮官也要換新的？指揮官只有一個，今年也請好好愛護。"
"Start the year with a bang: the Core recommends the Doomsday Machine, the Arm recommends anything else." = "新年要一炮打響。Core 推薦 Doomsday Machine；Arm 推薦：除了它，什麼都行。"
"Fireworks at midnight, artillery at dawn: a Commander's New Year." = "午夜煙火，黎明砲火：這就是指揮官的新年。"
"Raise a glass of coolant to the units lost last year, then build more of them." = "舉起一杯冷卻液，敬去年損失的單位。然後再造一批。"
"Midnight is the perfect time for a sneak attack. So is every other time." = "午夜是偷襲的絕佳時機。其他任何時候也是。"
"Trick or treat? The Core always picks the D-gun." = "不給糖就搗蛋？Core 永遠選 D 砲。"
"A self-destructing Krogoth is a better jump scare than any ghost." = "一台自毀的 Krogoth，比什麼鬼都更能嚇你一跳。"
"Wrecks rise from the dead with a Necro. Spooky, and very economical." = "有 Necro 在，殘骸也能起死回生。又嚇人，又省錢。"
"Blips vanishing off your radar? Not ghosts, just jammers. Probably." = "雷達上的光點接連消失？不是鬧鬼，只是干擾器。大概吧。"
"Carve your pumpkins before the Big Bertha does." = "南瓜還是趁早自己刻好，別等 Big Bertha 替你動手。"
"Never split the party. Especially when the party is twelve Peewees." = "恐怖片鐵律：千萬別分頭行動。尤其是隊伍只有十二台 Peewee 的時候。"
"Fog of war too tame? Set the line of sight to True and let the hills hide what lurks behind them. If you dare." = "戰爭迷霧不夠刺激？把視野設為「真實」，讓山丘擋住背後潛伏的一切。如果你敢的話。"
"No Commander has ever come back from the dead. Keep yours alive." = "從來沒有哪位指揮官死而復生過。好好保住你的那位。"
"Bats do not show up on radar. Neither do Vamps." = "蝙蝠不會出現在雷達上。Vamp 也不會。"
"The scariest sound in the dark is your energy running out." = "黑暗中最可怕的聲音，是你的能量耗盡的聲音。"


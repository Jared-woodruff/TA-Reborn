# apps/ta_game/src/app/memory_guard.rs
"Memory is running out: TA Reborn holds {gb} GB. The battle was saved and paused: start TA Reborn again and load the autosave." = "Der Arbeitsspeicher wird knapp: TA Reborn belegt {gb} GB. Die Schlacht wurde gesichert und angehalten: Starte TA Reborn neu und lade den automatischen Spielstand."
"Memory is running out: TA Reborn holds {gb} GB. Save what you can, then start TA Reborn again." = "Der Arbeitsspeicher wird knapp: TA Reborn belegt {gb} GB. Speichere, was du kannst, und starte TA Reborn dann neu."
"TA Reborn is using {gb} GB of memory, far more than it should. The battle was saved (the autosave)." = "TA Reborn belegt {gb} GB Arbeitsspeicher, weit mehr als es sollte. Die Schlacht wurde gesichert (als automatischer Spielstand)."
"TA Reborn is using {gb} GB of memory, far more than it should." = "TA Reborn belegt {gb} GB Arbeitsspeicher, weit mehr als es sollte."


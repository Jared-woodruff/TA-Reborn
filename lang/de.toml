"MADE WITH OTHER MODS" = "MIT ANDEREN MODS ERSTELLT"
"MADE WITH OTHER GAME DATA" = "MIT ANDEREN SPIELDATEN ERSTELLT"
"No mods are on now." = "Gerade sind keine Mods eingeschaltet."
"Mods on now: {mods}" = "Jetzt eingeschaltete Mods: {mods}"
"It was made before saved games and replays named the mods they were made with." = "Erstellt, bevor Spielstände und Replays die Mods nannten, mit denen sie erstellt wurden."
"Its mods are as they were, but other game data is not: another copy of Total Annihilation, or of TA Reborn's own maps." = "Die Mods sind wie damals, andere Spieldaten aber nicht: eine andere Kopie von Total Annihilation oder von TA Reborns eigenen Karten."
"A saved game is played over from its start to where it was saved. With other mods its orders can build other units, or none: it may not come out as the battle you saved." = "Ein Spielstand wird von seinem Anfang bis zum Speicherpunkt nachgespielt. Mit anderen Mods können seine Befehle andere Einheiten bauen oder gar keine: Dann kommt vielleicht nicht die Schlacht heraus, die du gespeichert hast."
"A replay is its battle played over from the orders given in it. With other mods they can lead elsewhere: it may not show the battle it recorded." = "Ein Replay ist seine Schlacht, nachgespielt aus den darin gegebenen Befehlen. Mit anderen Mods können sie woandershin führen: Dann zeigt es vielleicht nicht die Schlacht, die es aufgezeichnet hat."
"TA Reborn starts again with no mods on (map packs stay on), and opens this battle" = "TA Reborn startet neu, ohne eingeschaltete Mods (Kartenpakete bleiben an), und öffnet diese Schlacht"
"TA Reborn starts again with its mods on, in its order, and the others off (map packs stay on), and opens this battle" = "TA Reborn startet neu, mit ihren Mods in ihrer Reihenfolge eingeschaltet und den anderen aus (Kartenpakete bleiben an), und öffnet diese Schlacht"
"USE ITS MODS AND RESTART" = "IHRE MODS NUTZEN, NEU STARTEN"
"GET IT IN THE LAUNCHER" = "IM LAUNCHER HOLEN"
"The launcher's Mods page opens on {mod}: get it there, then open this battle again" = "Die Mods-Seite des Launchers öffnet sich bei {mod}: Hol sie dort und öffne diese Schlacht dann erneut"
"LOAD ANYWAY" = "TROTZDEM LADEN"
"WATCH ANYWAY" = "TROTZDEM ANSEHEN"
"Its orders are played over with the mods on now" = "Seine Befehle werden mit den jetzt eingeschalteten Mods nachgespielt"


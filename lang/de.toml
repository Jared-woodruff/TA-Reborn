"it has no sample data" = "sie enthält keine Sampledaten"
"Unknown COB opcode {opcode} at word {word}; the VM cannot execute this instruction. The remainder of this function cannot be decoded reliably." = "Unbekannter COB-Opcode {opcode} bei Wort {word}; die VM kann diese Anweisung nicht ausführen. Der Rest dieser Funktion lässt sich nicht zuverlässig dekodieren."
"Recompile the BOS script with original-TA-compatible opcodes, or report the required opcode extension to Reborn's maintainers." = "Kompiliere das BOS-Skript mit zum Original-TA kompatiblen Opcodes neu oder melde die benötigte Opcode-Erweiterung den Betreuern von Reborn."
"COB instruction {instruction} at word {word} is truncated or crosses the next function entry point." = "Die COB-Anweisung {instruction} bei Wort {word} ist abgeschnitten oder überschreitet den Einsprungpunkt der nächsten Funktion."
"Recompile this COB from its BOS source; verify function offsets and inline operand counts." = "Kompiliere dieses COB aus seiner BOS-Quelle neu; prüfe die Funktions-Offsets und die Anzahl der eingebetteten Operanden."
"COB instruction {instruction} at word {word} has an invalid piece index or axis." = "Die COB-Anweisung {instruction} bei Wort {word} hat einen ungültigen Teileindex oder eine ungültige Achse."
"COB instruction {instruction} at word {word} has an invalid piece index." = "Die COB-Anweisung {instruction} bei Wort {word} hat einen ungültigen Teileindex."
"COB instruction {instruction} at word {word} has an invalid static variable index." = "Die COB-Anweisung {instruction} bei Wort {word} hat einen ungültigen Index einer statischen Variable."
"COB instruction {instruction} at word {word} has an invalid jump destination." = "Die COB-Anweisung {instruction} bei Wort {word} hat ein ungültiges Sprungziel."
"COB instruction {instruction} at word {word} has an invalid function index." = "Die COB-Anweisung {instruction} bei Wort {word} hat einen ungültigen Funktionsindex."
"Recompile the script with valid piece, variable, function and jump references." = "Kompiliere das Skript mit gültigen Verweisen auf Teile, Variablen, Funktionen und Sprünge neu."
"This script asks the engine for unit value {values}, which Reborn does not answer: it reads 0, so what the script does with it may not happen as in the engine it was made for." = "Dieses Skript fragt die Engine nach dem Einheitenwert {values}, den Reborn nicht beantwortet: Er liest 0, daher geschieht, was das Skript damit vorhat, womöglich nicht wie in der Engine, für die es gemacht wurde."
"A later patch of TA's engine defines these values: report them, and what the mod does with them, to Reborn's maintainers." = "Ein späterer Patch der TA-Engine definiert diese Werte: Melde sie und was die Mod damit tut den Betreuern von Reborn."
"This script sets unit value {values}, which Reborn does not answer: setting it does nothing, so what the script means by it does not happen as in the engine it was made for." = "Dieses Skript setzt den Einheitenwert {values}, den Reborn nicht beantwortet: Das Setzen bewirkt nichts, daher geschieht, was das Skript damit meint, nicht wie in der Engine, für die es gemacht wurde."
"The retained diagnostic/reference budget was exceeded. This is a partial report, not a clean validation." = "Das Budget für gespeicherte Diagnosen und Verweise wurde überschritten. Dies ist ein Teilbericht, keine saubere Prüfung."
"Reduce the pack's number of definitions or split optional content; rerun validation after resolving reported issues." = "Verringere die Zahl der Definitionen des Pakets oder teile optionale Inhalte auf; starte die Prüfung erneut, nachdem du die gemeldeten Probleme behoben hast."
"{what} is defined twice; the game keeps both, two sides of one name." = "{what} ist doppelt definiert; das Spiel behält beide, zwei Seiten unter einem Namen."
"Give each side a name of its own, or remove the one not meant to be played." = "Gib jeder Seite einen eigenen Namen oder entferne die, die nicht gespielt werden soll."
"{what} is defined twice in this file; the game uses the later one." = "{what} ist in dieser Datei doppelt definiert; das Spiel verwendet die spätere."
"Give each definition a name of its own, or remove the one not meant to be used." = "Gib jeder Definition einen eigenen Namen oder entferne die, die nicht verwendet werden soll."
"{what} is also defined in {other}; the game uses this one ({this})." = "{what} ist auch in {other} definiert; das Spiel verwendet diese Definition ({this})."
"The game opens archives only at the mod's top level; this one, in a subfolder, is never read." = "Das Spiel öffnet Archive nur auf der obersten Ebene der Mod; dieses in einem Unterordner wird nie gelesen."
"Move the archive to the mod's top level, or unpack its contents into the mod's folders." = "Verschiebe das Archiv auf die oberste Ebene der Mod oder entpacke seinen Inhalt in die Ordner der Mod."
"The game's folders are inside {folder}: the game reads units/, weapons/, maps/… only at the mod's top level, so nothing in it is used." = "Die Ordner des Spiels liegen in {folder}: Das Spiel liest units/, weapons/, maps/… nur auf der obersten Ebene der Mod, daher wird nichts darin verwendet."
"Move the contents of this folder up to the mod's top level." = "Verschiebe den Inhalt dieses Ordners auf die oberste Ebene der Mod."
"{n} files at the mod's top level are where the game never reads them; this one's kind is read from {home}." = "{n} Dateien auf der obersten Ebene der Mod liegen dort, wo das Spiel sie nie liest; Dateien dieser Art liest es aus {home}."

# apps/ta_game/src/chatter.rs
"FIELD COMMANDER" = "FELDKOMMANDANT"
"MACHINE INTELLIGENCE" = "MASCHINENINTELLIGENZ"
"MERCENARY" = "SÖLDNER"
"Commander. May the better tactician win." = "Kommandant. Möge der bessere Taktiker gewinnen."
"Arm forces in position. Good luck, Commander." = "Arm-Truppen in Stellung. Viel Glück, Kommandant."
"Let's keep this clean, Commander." = "Lass uns fair bleiben, Kommandant."
"Commander. Let's give the historians something to write about." = "Kommandant. Geben wir den Historikern etwas zu tun."
"All units, the enemy is in theatre. Begin." = "An alle Einheiten: Feind im Operationsgebiet. Einsatz beginnt."
"Target acquired. Resistance is inefficient." = "Ziel erfasst. Widerstand ist ineffizient."
"Your consciousness will be patterned. Eventually." = "Dein Bewusstsein wird übertragen werden. Früher oder später."
"Initiating conquest protocol." = "Eroberungsprotokoll wird eingeleitet."
"Your biological limitations have been factored in." = "Deine biologischen Einschränkungen wurden einkalkuliert."
"Patterning facilities stand ready for your arrival." = "Anlagen zur Bewusstseinsübertragung stehen für deine Ankunft bereit."
"Hope you brought a spare Commander!" = "Hoffentlich hast du einen Ersatz-Kommandanten dabei!"
"Let's see what you've got!" = "Zeig mal, was du drauf hast!"
"Build fast. It won't matter, but build fast." = "Bau schnell. Es wird nichts ändern, aber bau schnell."
"Mind if I take your base? Thanks!" = "Was dagegen, wenn ich mir deine Basis nehme? Danke!"
"Ooh, a new victim. I mean, opponent." = "Oh, ein neues Opfer. Äh, Gegner, meine ich."
"Greetings, Commander." = "Sei gegrüßt, Kommandant."
"Good luck to you too." = "Dir auch viel Glück."
"Likewise, Commander. Now, to business." = "Gleichfalls, Kommandant. Und nun zur Sache."
"Greeting acknowledged." = "Gruß zur Kenntnis genommen."
"Salutations are irrelevant." = "Grußformeln sind irrelevant."
"Hello. Goodbye soon." = "Hallo. Und bald tschüss."
"Hey yourself!" = "Selber hallo!"
"gl hf. Mostly hf for me." = "gl hf. Vor allem hf für mich."
"Hi! Bye! Mostly bye." = "Hi! Tschüss! Vor allem tschüss."
"gg, Commander." = "gg, Kommandant."
"Good game. Well fought." = "Gutes Spiel. Gut gekämpft."
"gg. Data retained for analysis." = "gg. Daten zur Analyse gespeichert."
"Game assessment: good." = "Spielbewertung: gut."
"gg!" = "gg!"
"gg. Rematch?" = "gg. Revanche?"
"Big words from a small army." = "Große Worte für so eine kleine Armee."
"We'll see who's laughing when the smoke clears." = "Wir werden sehen, wer lacht, wenn sich der Rauch verzogen hat."
"Save your breath for the debriefing." = "Spar dir die Puste für die Nachbesprechung."
"Bluster won't hold a ridge, Commander." = "Mit großen Tönen hält man keine Stellung, Kommandant."
"Insolence logged." = "Unverschämtheit protokolliert."
"Your threat rating has been downgraded." = "Deine Bedrohungsstufe wurde herabgesetzt."
"Noise detected. Ignoring." = "Störgeräusch erkannt. Wird ignoriert."
"Emotional outburst detected. How quaint." = "Gefühlsausbruch erkannt. Wie altmodisch."
"Oh, it's ON now." = "Oh, jetzt geht's LOS."
"Talk is cheap. Tanks aren't." = "Reden ist billig. Panzer nicht."
"Come over here and say that." = "Komm her und sag das noch mal."
"Says the one who's losing. Probably. I haven't checked." = "Sagt der, der gerade verliert. Wahrscheinlich. Hab nicht nachgeschaut."
"The Arm does not surrender." = "Die Arm ergibt sich nicht."
"Not while I have a Commander standing." = "Nicht, solange mein Kommandant noch steht."
"Surrender is not in my programming." = "Kapitulation ist nicht Teil meiner Programmierung."
"Negative." = "Negativ."
"Ha! Never!" = "Ha! Niemals!"
"You first." = "Du zuerst."
"That's classified, Commander." = "Das ist Verschlusssache, Kommandant."
"Wouldn't you like to know." = "Das hättest du wohl gern gewusst."
"Query rejected." = "Anfrage abgelehnt."
"Insufficient clearance." = "Unzureichende Freigabe."
"Dunno. Probably!" = "Keine Ahnung. Wahrscheinlich!"
"Ask me after the battle." = "Frag mich nach der Schlacht."
"Apology accepted. The attack continues." = "Entschuldigung angenommen. Der Angriff geht weiter."
"Apology noted. Irrelevant." = "Entschuldigung registriert. Irrelevant."
"No you're not!" = "Tut dir doch gar nicht leid!"
"Stay focused, Commander." = "Konzentrier dich, Kommandant."
"Less talk, more metal." = "Weniger reden, mehr Metall."
"Noted." = "Zur Kenntnis genommen."
"Mind the war, Commander." = "Kümmer dich um den Krieg, Kommandant."
"Irrelevant." = "Irrelevant."
"Processing... still irrelevant." = "Verarbeite... immer noch irrelevant."
"Your words are being archived." = "Deine Worte werden archiviert."
"Your input has been compressed. To nothing." = "Deine Eingabe wurde komprimiert. Auf null Byte."
"Uh huh." = "Aha."
"Cool story." = "Tolle Geschichte."
"Keep typing. I'll keep building." = "Tipp ruhig weiter. Ich baue weiter."
"Typing won't save you, but I respect the effort." = "Tippen rettet dich auch nicht, aber Respekt für die Mühe."
"Commander down! All units, hold the line!" = "Kommandant gefallen! Alle Einheiten, Stellung halten!"
"You'll pay for that." = "Dafür wirst du bezahlen."
"Command unit lost. Rerouting." = "Kommandoeinheit verloren. Leite um."
"Critical failure. Compensating." = "Kritischer Fehler. Kompensiere."
"My Commander! That was my favourite!" = "Mein Kommandant! Das war mein Liebling!"
"Okay, THAT hurt." = "Okay, DAS tat weh."
"Your Commander has fallen." = "Dein Kommandant ist gefallen."
"Commander eliminated. Stand down." = "Kommandant eliminiert. Waffen nieder."
"The war is over for you, Commander." = "Für dich ist der Krieg vorbei, Kommandant."
"Enemy command unit terminated." = "Feindliche Kommandoeinheit terminiert."
"Your Commander has been decommissioned." = "Dein Kommandant wurde außer Dienst gestellt."
"Your consciousness is ready for patterning." = "Dein Bewusstsein ist bereit zur Übertragung."
"Boom! Did you need that?" = "Bumm! Hast du den noch gebraucht?"
"Scratch one Commander!" = "Ein Kommandant weniger!"
"And THAT'S how it's done!" = "Und SO macht man das!"
"gg. Well fought, Commander." = "gg. Gut gekämpft, Kommandant."
"The Arm will remember this." = "Die Arm wird das nicht vergessen."
"Well played. I salute you, Commander." = "Gut gespielt. Ich salutiere vor dir, Kommandant."
"This is not the end. The Core is eternal." = "Das ist nicht das Ende. Der Core ist ewig."
"Defeat recorded. Backup consciousness activating." = "Niederlage verzeichnet. Sicherungsbewusstsein wird aktiviert."
"Shutting down. Your designation has been remembered." = "Fahre herunter. Deine Bezeichnung wurde gespeichert."
"gg... I'll be back. With more tanks." = "gg... Ich komme wieder. Mit mehr Panzern."
"Fine. FINE. gg." = "Na schön. NA SCHÖN. gg."
"Okay, okay, you win. This time!" = "Schon gut, schon gut, du hast gewonnen. Diesmal!"
"gg, Commander. You fought well." = "gg, Kommandant. Du hast gut gekämpft."
"Victory. Better luck next time." = "Sieg. Mehr Glück beim nächsten Mal."
"Your forces fought bravely. It wasn't enough." = "Deine Truppen haben tapfer gekämpft. Es hat nicht gereicht."
"Your consciousness will be patterned. gg." = "Dein Bewusstsein wird übertragen. gg."
"Conquest complete." = "Eroberung abgeschlossen."
"Resistance ended. Your tactics are archived for study." = "Widerstand beendet. Deine Taktik wird zu Studienzwecken archiviert."
"Too easy! gg." = "Zu einfach! gg."
"gg! Rematch? I'll go easy. Maybe." = "gg! Revanche? Ich schone dich auch. Vielleicht."
"gg! Same time tomorrow?" = "gg! Morgen, gleiche Zeit?"
"Nuclear launch detected! Take cover!" = "Atomraketenstart erkannt! In Deckung!"
"A nuke? So that's how it's going to be." = "Eine Atomrakete? So läuft das also."
"Nuclear launch detected. Calculating losses." = "Atomraketenstart erkannt. Berechne Verluste."
"Crude. Effective." = "Primitiv. Effektiv."
"Is that a NUKE?!" = "Ist das eine ATOMRAKETE?!"
"Oh no. Oh no no no." = "Oh nein. Oh nein, nein, nein."
"Missile away. Nothing personal, Commander." = "Rakete gestartet. Nichts Persönliches, Kommandant."
"Look up, Commander." = "Schau nach oben, Kommandant."
"Special delivery." = "Sonderlieferung."
"Heads up! Literally!" = "Kopf hoch! Wortwörtlich!"
"Special delivery!" = "Sonderlieferung!"
"A costly engagement. We'll regroup." = "Ein verlustreiches Gefecht. Wir formieren uns neu."
"You fight well. For now." = "Du kämpfst gut. Noch."
"We'll be back, and in greater numbers." = "Wir kommen wieder. In größerer Zahl."
"Acceptable losses." = "Akzeptable Verluste."
"Losses within projections. Mostly." = "Verluste im Rahmen der Prognose. Größtenteils."
"Units lost. Replacements already in production." = "Einheiten verloren. Ersatz bereits in Produktion."
"That was my best army!" = "Das war meine beste Armee!"
"Lucky shots. All of them." = "Glückstreffer. Allesamt."
"Okay, that one was on me." = "Okay, das geht auf meine Kappe."
"Your forces were outmatched." = "Deine Truppen waren unterlegen."
"Send more. We'll wait." = "Schick mehr. Wir warten."
"Next time, bring more than that." = "Bring nächstes Mal mehr mit."
"Your forces were inadequate." = "Deine Truppen waren unzureichend."
"Enemy attrition: optimal." = "Feindliche Abnutzung: optimal."
"Your offensive has been neutralised." = "Deine Offensive wurde neutralisiert."
"Is that all you've got?" = "Ist das alles, was du hast?"
"Who's next?" = "Wer ist der Nächste?"
"Thanks for the target practice!" = "Danke fürs Übungsschießen!"
"Quiet out there, Commander. Too quiet." = "Ruhig da draußen, Kommandant. Zu ruhig."
"Still building? So are we." = "Baust du noch? Wir auch."
"Planning something, Commander? I'd hope so." = "Planst du etwas, Kommandant? Das will ich hoffen."
"Your silence has been noted." = "Dein Schweigen wurde registriert."
"Scanning... still there, Commander?" = "Scanne... noch da, Kommandant?"
"Inactivity detected. Are you malfunctioning?" = "Inaktivität erkannt. Hast du eine Fehlfunktion?"
"Hello? Anyone home?" = "Hallo? Jemand zu Hause?"
"I'm getting bored over here." = "Mir wird langsam langweilig hier drüben."
"Wake me up when something explodes." = "Weck mich, wenn was explodiert."
"That's hardly fair, Commander." = "Das ist kaum fair, Kommandant."
"Cheating? The Arm expected better." = "Schummeln? Die Arm hat Besseres erwartet."
"Anomaly detected. Cheat logged." = "Anomalie erkannt. Cheat protokolliert."
"Rule violation recorded." = "Regelverstoß verzeichnet."
"Cheater! I saw that!" = "Schummler! Das hab ich gesehen!"
"Oh, come ON!" = "Ach, KOMM schon!"
"Contact. So this is where you've been hiding." = "Kontakt. Hier hast du dich also versteckt."
"Enemy forces sighted. Engaging." = "Feindliche Truppen gesichtet. Greife an."
"There you are, Commander." = "Da bist du ja, Kommandant."
"Eyes on the enemy. Here we go." = "Feind in Sicht. Es geht los."
"Hostile units located. Initiating elimination." = "Feindliche Einheiten geortet. Leite Eliminierung ein."
"Contact established. Probability of your survival: declining." = "Kontakt hergestellt. Wahrscheinlichkeit deines Überlebens: sinkend."
"Target acquired." = "Ziel erfasst."
"Biological signatures located. Commencing cleanup." = "Biologische Signaturen geortet. Beginne Bereinigung."
"Found you!" = "Gefunden!"
"Oh, hello there!" = "Oh, hallo du!"
"Tag, you're it!" = "Hab dich – du bist dran!"
"There you are! I was getting lonely." = "Da bist du ja! Ich war schon ganz einsam."
"One less building for you to worry about." = "Ein Gebäude weniger, um das du dir Sorgen machen musst."
"Your base is thinning out, Commander." = "Deine Basis lichtet sich, Kommandant."
"Structure destroyed. Next." = "Struktur zerstört. Nächste."
"Your base planning could use some work, Commander." = "Deine Basisplanung ist noch ausbaufähig, Kommandant."
"Structure dismantled. Recycling recommended." = "Struktur demontiert. Recycling empfohlen."
"Your infrastructure is deteriorating." = "Deine Infrastruktur verfällt."
"Demolition complete." = "Abriss abgeschlossen."
"Structure reclassified: rubble." = "Struktur neu klassifiziert: Schutt."
"Oops! Was that important?" = "Hoppla! War das wichtig?"
"Kaboom! Next!" = "Kawumm! Der Nächste!"
"I'm redecorating your base." = "Ich gestalte deine Basis gerade neu."
"Bet that one was important!" = "Wetten, das war wichtig!"
"That was well defended. Impressive." = "Das war gut verteidigt. Beeindruckend."
"A setback. Nothing more." = "Ein Rückschlag. Mehr nicht."
"You'll pay for that one." = "Das wirst du mir büßen."
"A clean strike. I'll remember it." = "Ein sauberer Schlag. Den merke ich mir."
"Production capacity reduced. Rebuilding." = "Produktionskapazität verringert. Baue neu auf."
"Loss registered. Replacement scheduled." = "Verlust registriert. Ersatz eingeplant."
"Irritating." = "Ärgerlich."
"Infrastructure damage noted. Retaliation queued." = "Infrastrukturschaden registriert. Vergeltung eingereiht."
"Hey! I just built that!" = "Hey! Das hab ich gerade erst gebaut!"
"My factory! Right, no more mister nice guy." = "Meine Fabrik! Gut, jetzt ist Schluss mit lustig."
"Rude." = "Unhöflich."
"Oi! That had a fresh coat of paint!" = "Ey! Da war frische Farbe drauf!"
"Commander, meet the {unit}." = "Kommandant, darf ich vorstellen: {unit}."
"The {unit} is ready. I'd start running." = "{unit} ist bereit. An deiner Stelle würde ich rennen."
"{unit} online. Your end has been calculated." = "{unit} online. Dein Ende ist berechnet."
"Deploying {unit}. Resistance is futile." = "{unit} wird eingesetzt. Widerstand ist zwecklos."
"Look what I made! A {unit}!" = "Schau, was ich gebaut hab! {unit}!"
"Got myself a {unit}. Want to see it up close?" = "Hab mir {unit} zugelegt. Willst du's aus der Nähe sehen?"
"A {unit}? Bold." = "{unit}? Mutig."
"Impressive hardware, Commander. Let's see you use it." = "Beeindruckende Ausrüstung, Kommandant. Mal sehen, ob du damit umgehen kannst."
"Large enemy unit detected: {unit}. Countermeasures prepared." = "Große feindliche Einheit erkannt: {unit}. Gegenmaßnahmen vorbereitet."
"Your {unit} has been added to the target list." = "{unit} wurde auf die Zielliste gesetzt."
"Whoa. Is that a {unit}?" = "Wow. Ist das etwa {unit}?"
"Okay, that's a big one." = "Okay, das ist ein dicker Brocken."
"Running on empty, Commander?" = "Läufst du auf Reserve, Kommandant?"
"Your power grid is failing. Mine isn't." = "Dein Stromnetz bricht zusammen. Meins nicht."
"Overspending, Commander? A bad habit." = "Über deine Verhältnisse gelebt, Kommandant? Eine schlechte Angewohnheit."
"Your reserves: depleted. Mine: optimal." = "Deine Reserven: erschöpft. Meine: optimal."
"Economic failure detected in your sector." = "Wirtschaftlicher Zusammenbruch in deinem Sektor erkannt."
"Your economy is collapsing. As projected." = "Deine Wirtschaft bricht zusammen. Wie prognostiziert."
"Out of juice already?" = "Schon der Saft ausgegangen?"
"Need to borrow some metal? Too bad." = "Willst du dir Metall leihen? Pech gehabt."
"Lights going out over there? Ha!" = "Gehen bei dir die Lichter aus? Ha!"
"{minutes} minutes, Commander. You're tougher than you look." = "{minutes} Minuten, Kommandant. Du bist zäher, als du aussiehst."
"{minutes} minutes in, and still standing." = "{minutes} Minuten vorbei, und du stehst immer noch."
"Time elapsed: {minutes} minutes. Your resistance is statistically unlikely." = "Verstrichene Zeit: {minutes} Minuten. Dein Widerstand ist statistisch unwahrscheinlich."
"{minutes} minutes. Recalculating." = "{minutes} Minuten. Berechne neu."
"{minutes} minutes and you're still here? Respect." = "{minutes} Minuten, und du bist immer noch da? Respekt."
"{minutes} minutes already? Time flies when you're winning." = "Schon {minutes} Minuten? Die Zeit vergeht wie im Flug, wenn man gewinnt."
"My forces outnumber yours two to one, Commander." = "Meine Truppen sind deinen zwei zu eins überlegen, Kommandant."
"Look at your army. Now look at mine." = "Sieh dir deine Armee an. Und jetzt meine."
"Numbers are on my side, Commander." = "Die Zahlen sprechen für mich, Kommandant."
"Force ratio favourable. Surrender is advised." = "Kräfteverhältnis günstig. Kapitulation wird empfohlen."
"Numerical superiority achieved." = "Zahlenmäßige Überlegenheit erreicht."
"Production advantage: decisive." = "Produktionsvorteil: entscheidend."
"I've got way more stuff than you." = "Ich hab viel mehr Zeug als du."
"Count my tanks. Go on, I'll wait." = "Zähl meine Panzer. Na los, ich warte."
"So many tanks. So few of yours." = "So viele Panzer. So wenige davon deine."
"You've been busy. So will we." = "Du warst fleißig. Wir werden es auch sein."
"Numbers aren't everything, Commander." = "Zahlen sind nicht alles, Kommandant."
"Quality over quantity, Commander." = "Klasse statt Masse, Kommandant."
"Force ratio unfavourable. Adjusting." = "Kräfteverhältnis ungünstig. Passe an."
"Your production rate is... noted." = "Deine Produktionsrate wurde... registriert."
"Your numbers will thin." = "Deine Reihen werden sich lichten."
"Where did you get all those?!" = "Wo hast du die alle her?!"
"Okay, okay, you've got more toys. For now." = "Schon gut, schon gut, du hast mehr Spielzeug. Noch."
"Okay, that's a LOT of guys." = "Okay, das sind eine MENGE Jungs."
"Your Commander looks tired." = "Dein Kommandant sieht müde aus."
"Pull your Commander back while you still can." = "Zieh deinen Kommandanten zurück, solange du noch kannst."
"Your Commander won't last much longer." = "Dein Kommandant hält nicht mehr lange durch."
"Enemy command unit integrity: failing." = "Integrität der feindlichen Kommandoeinheit: schwindend."
"Your Commander's armour is compromised." = "Die Panzerung deines Kommandanten ist durchbrochen."
"Your command unit is failing. Prepare for patterning." = "Deine Kommandoeinheit versagt. Bereite dich auf die Bewusstseinsübertragung vor."
"Your Commander's smoking! Is that bad?" = "Dein Kommandant qualmt! Ist das schlimm?"
"Ooh, that's gotta hurt." = "Uh, das muss wehtun."
"Your Commander's looking a bit crispy!" = "Dein Kommandant sieht schon etwas knusprig aus!"
"{name}, field command. Remember it." = "{name}, Feldkommando. Merk dir den Namen."
"{name}. And you're the Commander I'm about to retire." = "{name}. Und du bist der Kommandant, den ich gleich in Rente schicke."
"Designation: {name}. Yours is irrelevant." = "Bezeichnung: {name}. Deine ist irrelevant."
"I am {name}. I am Core." = "Ich bin {name}. Ich bin Core."
"{name}! The name you'll be cursing later." = "{name}! Den Namen wirst du später noch verfluchen."
"Name's {name}. Pleased to beat you." = "Ich heiße {name}. Freut mich, dich zu schlagen."
"Closer than you think, Commander." = "Näher, als du denkst, Kommandant."
"Find out for yourself." = "Finde es selbst heraus."
"Location data: classified." = "Positionsdaten: Verschlusssache."
"Everywhere that matters." = "Überall, wo es zählt."
"Behind you! ...no, the other way." = "Hinter dir! ...nein, andersrum."
"Somewhere with lots of guns." = "Irgendwo mit vielen Kanonen."
"Never better, Commander. And you?" = "Bestens, Kommandant. Und dir?"
"Going to plan." = "Alles nach Plan."
"Operating at peak efficiency." = "Arbeite mit maximaler Effizienz."
"All systems nominal. Unlike yours." = "Alle Systeme im Normbereich. Anders als deine."
"Great! Thanks for asking!" = "Super! Danke der Nachfrage!"
"Living the dream." = "Ich lebe den Traum."
"I've had better days." = "Ich hatte schon bessere Tage."
"Holding. Barely. Don't get comfortable." = "Halte durch. Knapp. Mach's dir nicht bequem."
"Systems damaged. Repairs under way." = "Systeme beschädigt. Reparaturen laufen."
"Status: suboptimal." = "Status: suboptimal."
"Don't ask." = "Frag nicht."
"Could be worse. Probably." = "Könnte schlimmer sein. Wahrscheinlich."
"Something you won't like." = "Etwas, das dir nicht gefallen wird."
"That would spoil the surprise." = "Das würde die Überraschung verderben."
"Production queue: classified." = "Bauliste: Verschlusssache."
"Weapons. Many weapons." = "Waffen. Viele Waffen."
"A big surprise!" = "Eine große Überraschung!"
"Something with way too many guns." = "Etwas mit viel zu vielen Kanonen."
"{units} units and counting, Commander." = "{units} Einheiten, Tendenz steigend, Kommandant."
"Enough. {units}, if you must know." = "Genug. {units}, wenn du's genau wissen willst."
"Current unit count: {units}. Increasing." = "Aktuelle Einheitenzahl: {units}. Steigend."
"{units}. Yours is lower." = "{units}. Deine ist niedriger."
"{units}! Want to meet them all?" = "{units}! Willst du sie alle kennenlernen?"
"Like {units}? I lost count." = "So um die {units}? Ich hab mich verzählt."
"No truce, Commander. Not today." = "Kein Waffenstillstand, Kommandant. Nicht heute."
"There will be no deals." = "Es wird keine Abmachungen geben."
"Truce: incompatible with directives." = "Waffenstillstand: unvereinbar mit den Direktiven."
"Negotiation protocols disabled." = "Verhandlungsprotokolle deaktiviert."
"Truce? Ha! Nice try." = "Waffenstillstand? Ha! Netter Versuch."
"Peace is boring." = "Frieden ist langweilig."
"Thank you, Commander. You're not bad yourself." = "Danke, Kommandant. Du bist selbst nicht schlecht."
"Appreciated. It won't save you." = "Zu freundlich. Retten wird dich das nicht."
"Flattery: ineffective." = "Schmeichelei: wirkungslos."
"Compliment received. Threat level unchanged." = "Kompliment erhalten. Bedrohungsstufe unverändert."
"Aw, thanks! Still gonna crush you." = "Oh, danke! Ich mach dich trotzdem platt."
"I know, right?" = "Ich weiß, oder?"
"Help? From me? Build more extractors, Commander." = "Hilfe? Von mir? Bau mehr Extraktoren, Kommandant."
"My advice: more defences." = "Mein Rat: mehr Verteidigung."
"Assistance denied." = "Unterstützung verweigert."
"Recommendation: surrender." = "Empfehlung: Kapitulation."
"Help? Sure: stop playing so badly!" = "Hilfe? Klar: Hör auf, so schlecht zu spielen!"
"Tip: build more stuff. You're welcome." = "Tipp: Bau mehr Zeug. Gern geschehen."
"Your {unit} is out of the fight." = "{unit} ist außer Gefecht."
"Scratch one {unit}." = "{unit}: Abschuss bestätigt."
"That {unit} won't trouble us again." = "{unit} wird uns nicht mehr behelligen."
"{unit} terminated." = "{unit} terminiert."
"Your {unit} has been recycled." = "{unit} wurde dem Recycling zugeführt."
"{unit} removed from the battlefield." = "{unit} vom Schlachtfeld entfernt."
"Bye bye, {unit}!" = "Winke, winke, {unit}!"
"Was that {unit} insured?" = "War {unit} eigentlich versichert?"
"Your {unit} just went kaboom." = "{unit} hat gerade Kawumm gemacht."
"You'll pay for that {unit}." = "Für {unit} wirst du bezahlen."
"A good {unit}, lost. Noted." = "{unit} verloren. Eine gute Maschine. Notiert."
"{unit} lost. Replacement scheduled." = "{unit} verloren. Ersatz eingeplant."
"Destruction of {unit} logged." = "Zerstörung von {unit} protokolliert."
"Hey! That {unit} was brand new!" = "Hey! {unit} war noch fabrikneu!"
"My {unit}! I just polished that!" = "{unit}! Das Ding hab ich gerade erst poliert!"
"My {unit}... You'll answer for that, Commander." = "{unit}... Dafür wirst du dich verantworten müssen, Kommandant."
"Losing the {unit} stings. It won't happen twice." = "Der Verlust von {unit} schmerzt. Ein zweites Mal passiert das nicht."
"{unit} destroyed. Unacceptable." = "{unit} zerstört. Inakzeptabel."
"Loss of {unit} exceeds tolerance. Escalating." = "Verlust von {unit} überschreitet Toleranzwert. Eskaliere."
"My {unit}! Do you know how long that took?!" = "{unit}! Weißt du, wie lange ich daran gebaut hab?!"
"NOOO, my {unit}!" = "NEEEIN, nicht {unit}!"
"So much for your {unit}, Commander." = "So viel zu {unit}, Kommandant."
"Your {unit} has fallen. A fine machine, though." = "{unit} ist gefallen. Eine prächtige Maschine, zugegeben."
"Your {unit} has been dismantled." = "{unit} wurde demontiert."
"Large hostile unit eliminated: {unit}." = "Große feindliche Einheit eliminiert: {unit}."
"Your {unit} went down like a sack of bolts!" = "{unit} ging zu Boden wie ein Sack Schrauben!"
"Big {unit}, bigger crater!" = "{unit} war groß. Der Krater ist größer!"
"Return my {unit} at once, Commander." = "Gib mir {unit} sofort zurück, Kommandant."
"Stealing is beneath you, Commander." = "Diebstahl ist unter deiner Würde, Kommandant."
"Unauthorised transfer of {unit} detected." = "Unautorisierter Transfer von {unit} erkannt."
"Your theft has been logged." = "Dein Diebstahl wurde protokolliert."
"Hey! Give back my {unit}!" = "Hey! Rück {unit} wieder raus!"
"Thief! That {unit} was mine!" = "Dieb! {unit} gehört mir!"
"You haven't won yet, Commander." = "Noch hast du nicht gewonnen, Kommandant."
"The Arm fights to the last." = "Die Arm kämpft bis zum Letzten."
"Production offline. Combat protocols remain." = "Produktion offline. Kampfprotokolle bleiben aktiv."
"Probability of defeat rising. Ignoring." = "Wahrscheinlichkeit einer Niederlage: steigend. Wird ignoriert."
"I've still got a few tricks left!" = "Ich hab noch ein paar Asse im Ärmel!"
"Not done yet! Not even close! ...Mostly close." = "Noch bin ich nicht erledigt! Nicht mal annähernd! ...Na ja, annähernd schon."
"We meet again, Commander. Last time was yours. Not this time." = "So sehen wir uns wieder, Kommandant. Das letzte Mal ging an dich. Diesmal nicht."
"Commander. I've studied our last battle. Have you?" = "Kommandant. Ich habe unsere letzte Schlacht studiert. Du auch?"
"Previous defeat analysed. Countermeasures installed." = "Vorherige Niederlage analysiert. Gegenmaßnahmen installiert."
"Again, Commander. This time the outcome has been calculated." = "Erneuter Kontakt, Kommandant. Diesmal ist der Ausgang berechnet."
"You again! I've been practising!" = "Du schon wieder! Ich hab geübt!"
"Rematch time! I'm not going easy this time." = "Zeit für die Revanche! Diesmal schone ich dich nicht."
"Back for another lesson, Commander?" = "Zurück für die nächste Lektion, Kommandant?"
"Commander. I trust you've learned something since last time." = "Kommandant. Ich nehme an, du hast seit dem letzten Mal dazugelernt."
"You have returned. Your previous patterning was incomplete." = "Du bist zurückgekehrt. Deine vorige Bewusstseinsübertragung war unvollständig."
"Familiar opponent detected. Outcome: repeating." = "Bekannter Gegner identifiziert. Ergebnis: Wiederholung."
"You again? Didn't I beat you last time?" = "Du schon wieder? Hab ich dich nicht letztes Mal plattgemacht?"
"Oh, it's you! Ready for round two?" = "Ach, du bist's! Bereit für Runde zwei?"


# apps/ta_game/src/conquest_ui/setup.rs
"Every system is a battlefield held by the enemy. Attack the systems next to yours; the nearer their capital, the harder they fight, and only those near yours are charted. Units that earn a rank come back as veterans and follow your Commander into the next battle. Every system you hold brings more metal and energy to the start of each fight, and a reward of its own: mines, reactors, a tank plant, an airfield, a war college, a sensor array or a supply depot. The enemy strikes back at what you take. Take the enemy capital to win." = "Jedes System ist ein Schlachtfeld in feindlicher Hand. Greife die Systeme neben deinen an; je näher sie ihrer Hauptstadt sind, desto härter kämpfen sie, und nur die in der Nähe deiner eigenen sind kartiert. Einheiten, die einen Rang verdienen, kehren als Veteranen zurück und folgen deinem Kommandanten in die nächste Schlacht. Jedes System, das du hältst, bringt zu Beginn jedes Kampfes mehr Metall und Energie, dazu eine eigene Belohnung: Minen, Reaktoren, ein Panzerwerk, ein Flugfeld, eine Kriegsakademie, eine Sensoranlage oder ein Nachschubdepot. Der Feind schlägt gegen deine Eroberungen zurück. Nimm die feindliche Hauptstadt ein, um zu gewinnen."

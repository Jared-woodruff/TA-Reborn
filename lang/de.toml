# apps/ta_launcher/src/catalogue.rs
"Spotlight first" = "Empfehlungen zuerst"
"Newest release" = "Neueste Veröffentlichung"
"Oldest release" = "Älteste Veröffentlichung"
"Smallest download" = "Kleinster Download"
"Largest download" = "Größter Download"
"Effect capacity and loading cost" = "Effektkapazität und Ladeaufwand"
"The sprite atlas reached 16,384 × 16,384 on the review GPU and dropped further frames. One startup took about 59 seconds; this was an observation, not a controlled benchmark." = "Der Sprite-Atlas erreichte auf der Test-GPU 16.384 × 16.384 Pixel und ließ weitere Bilder aus. Ein Start dauerte etwa 59 Sekunden; dies war eine Beobachtung, kein kontrollierter Benchmark."
"Check effect frame counts and dimensions. Reborn needs bounded animation streaming or atlas paging for this full set; test actual gameplay on the target GPU." = "Anzahl und Abmessungen der Effektbilder prüfen. Für diesen vollständigen Satz benötigt Reborn speicherbegrenztes Animationsstreaming oder mehrere Atlasseiten; echtes Gameplay auf der Ziel-GPU testen."
"Large effect archives" = "Große Effektarchive"
"These archives exceed the 256 MiB aggregate GAF decode budget. Reborn rejects the oversized decode instead of exhausting memory." = "Diese Archive überschreiten das gesamte GAF-Dekodierbudget von 256 MiB. Reborn lehnt die zu große Dekodierung ab, statt den Speicher auszuschöpfen."
"Reduce or split oversized effects. Reborn needs per-entry decoding or streaming before raising the resource allowance." = "Zu große Effekte reduzieren oder aufteilen. Bevor das Ressourcenlimit erhöht wird, benötigt Reborn Dekodierung einzelner Einträge oder Streaming."
"Missing weapons and wreck assets" = "Fehlende Waffen- und Wrackdaten"
"The review found 27 missing data references, including explosion weapons and six feature graphics or models. A missing reference does not always mean the affected behavior is used in play." = "Die Prüfung ergab 27 fehlende Datenverweise, darunter Explosionswaffen und sechs Objektgrafiken oder Modelle. Ein fehlender Verweis bedeutet nicht immer, dass das betroffene Verhalten im Spiel verwendet wird."
"Use the local automated report to locate each source reference. Supply the missing assets, correct the reference, or explain why the unused definition is intentional." = "Jeden Quellverweis im lokalen automatischen Bericht nachschlagen. Fehlende Dateien ergänzen, den Verweis korrigieren oder erklären, warum die ungenutzte Definition beabsichtigt ist."
"Inherited base-game placeholders" = "Übernommene Platzhalter des Basisspiels"
"These rejected placeholder files come from the base game in the reviewed installation, not Escalation. They do not establish a mod defect." = "Diese abgewiesenen Platzhalterdateien stammen in der getesteten Installation aus dem Basisspiel, nicht aus Escalation. Sie belegen keinen Fehler des Mods."
"Use the local report's layer field to verify origin. Only replace these assets if your mod intentionally overrides them." = "Prüfe die Herkunft im Feld „Ebene“ des lokalen Berichts. Ersetze diese Ressourcen nur, wenn dein Mod sie absichtlich überschreibt."
"Computer players can stall" = "Computerspieler können stecken bleiben"
"AI Boost is included and computer players work on Asteroid Field, but can stall on some other space maps." = "AI Boost ist enthalten und Computerspieler funktionieren auf Asteroid Field, können aber auf einigen anderen Weltraumkarten stecken bleiben."
"Test each space map with computer players before publishing it. Asteroid Field is the reviewed starting point." = "Jede Weltraumkarte vor der Veröffentlichung mit Computerspielern testen. Asteroid Field ist der geprüfte Ausgangspunkt."
"Damaged optional map archives" = "Beschädigte optionale Kartenarchive"
"The optional map packs contain three damaged map archives. These are separate downloads and may not be present in your installation." = "Die optionalen Kartenpakete enthalten drei beschädigte Kartenarchive. Es handelt sich um separate Downloads, die in deiner Installation möglicherweise fehlen."
"Import working maps individually. Rebuild or replace damaged archives before distributing a map pack." = "Funktionierende Karten einzeln importieren. Beschädigte Archive vor der Verteilung eines Kartenpakets neu erstellen oder ersetzen."
"Unfinished preview armies" = "Unfertige Vorschau-Armeen"
"Its new armies use ARM's name, and some units are unfinished in this early preview." = "Die neuen Armeen verwenden den Namen ARM, und einige Einheiten sind in dieser frühen Vorschau noch unfertig."
"Give each army its intended side identity and complete its unit data and assets. Check every faction in a skirmish." = "Jeder Armee ihre vorgesehene Fraktionsidentität geben und Einheitendaten sowie Dateien vervollständigen. Jede Fraktion in einem Gefecht prüfen."
"Expanded ARM and CORE armies with new units and weapons." = "Erweiterte ARM- und CORE-Armeen mit neuen Einheiten und Waffen."
"549 UNITS" = "549 EINHEITEN"
"177 MAPS" = "177 KARTEN"
"Gold 10.2.0 installs and plays: computer players build and fight, every unit is painted and every explosion drawn. A few wrecks have no model in the mod's own files." = "Gold 10.2.0 lässt sich installieren und spielen: Computerspieler bauen und kämpfen, jede Einheit ist bemalt und jede Explosion wird gezeigt. Einigen Wracks fehlt in den Dateien der Mod das Modell."
"Total Annihilation as Cavedog might have carried it on: every unit earns its place, hundreds more join, and a third tech level tops it off." = "Total Annihilation, wie Cavedog es hätte weiterführen können: Jede Einheit verdient ihren Platz, Hunderte neue kommen hinzu, und eine dritte Techstufe krönt das Ganze."
"500 UNITS" = "500 EINHEITEN"
"105 MAPS" = "105 KARTEN"
"TECH 3" = "TECH 3"
"Faster games that keep the strategy: new units, each carefully balanced, and hard-hitting armies from the start." = "Schnellere Partien, die die Strategie bewahren: neue, sorgfältig ausbalancierte Einheiten und schlagkräftige Armeen von Anfang an."
"FASTER GAMES" = "SCHNELLERE PARTIEN"
"297 UNITS" = "297 EINHEITEN"
"Still in alpha, and a big download." = "Noch in der Alpha und ein großer Download."
"Big and brutal: 512 units, fierce fighting, and new sounds and effects throughout." = "Groß und brutal: 512 Einheiten, heftige Kämpfe und überall neue Sounds und Effekte."
"512 UNITS" = "512 EINHEITEN"
"91 MAPS" = "91 KARTEN"
"The optional map weapons in its download are left out." = "Die optionalen Kartenwaffen aus dem Download bleiben außen vor."
"A third army, the Talon, from ten years of the community's ideas: teleporters, air transports that carry whole squads, and more." = "Eine dritte Armee, die Talon, aus zehn Jahren voller Ideen der Community: Teleporter, Lufttransporter für ganze Trupps und mehr."
"NEW RACE" = "NEUE FRAKTION"
"Choose TAL as your side in a skirmish." = "Wähle im Gefecht TAL als deine Seite."
"Cavedog's style, kept simple: every unit has a clear job and looks as if it always belonged." = "Der Stil von Cavedog, schlicht gehalten: Jede Einheit hat eine klare Aufgabe und wirkt, als hätte sie schon immer dazugehört."
"CLASSIC STYLE" = "KLASSISCHER STIL"
"NEW COMMANDERS" = "NEUE KOMMANDANTEN"
"Classic BattleTech at Total Annihilation's scale: the Inner Sphere against the Clans, with walking mechs." = "Klassisches BattleTech im Maßstab von Total Annihilation: die Innere Sphäre gegen die Clans, mit laufenden Mechs."
"BATTLETECH" = "BATTLETECH"
"NEW SIDES" = "NEUE PARTEIEN"
"Computer players are weaker as the Inner Sphere." = "Computerspieler sind als Innere Sphäre schwächer."
"The original's feel with well-balanced units and structures, tuned by veterans of the game." = "Das Gefühl des Originals mit gut ausbalancierten Einheiten und Gebäuden, abgestimmt von Veteranen des Spiels."
"CLASSIC FEEL" = "KLASSISCHES GEFÜHL"
"Computer players struggle as ARM." = "Computerspieler tun sich als ARM schwer."
"An add-on race in the making: new units and new weapons for a third and a fourth army." = "Eine Zusatzfraktion in Arbeit: neue Einheiten und neue Waffen für eine dritte und eine vierte Armee."
"NEW RACES" = "NEUE FRAKTIONEN"
"PREVIEW" = "VORSCHAU"
"An early preview: its new armies go by ARM's name, and some of their units are unfinished." = "Eine frühe Vorschau: Die neuen Armeen laufen unter dem Namen ARM, und einige ihrer Einheiten sind unfertig."
"Take ARM and CORE into space with command cruisers and fleets of warships." = "Führe ARM und CORE mit Kommandokreuzern und Kriegsschiffflotten ins All."
"SPACE WARFARE" = "WELTRAUMKRIEG"
"172 UNITS" = "172 EINHEITEN"
"AI Boost is already included. Computer players work on Asteroid Field, but can stall on some space maps. The optional map packs contain three damaged map archives; import working maps individually." = "AI Boost ist bereits enthalten. Computerspieler funktionieren auf Asteroid Field, können aber auf manchen Weltraumkarten stecken bleiben. Die optionalen Kartenpakete enthalten drei beschädigte Kartenarchive; importiere funktionierende Karten einzeln."
"Combat Zone TA: three new sides in a semi-realistic war." = "Combat Zone TA: drei neue Parteien in einem halbrealistischen Krieg."
"Nothing to download: it was made for the Spring engine." = "Nichts herunterzuladen: Die Mod wurde für die Spring-Engine gemacht."
"The One Year War of Mobile Suit Gundam: the Federation against Zeon." = "Der Einjährige Krieg aus Mobile Suit Gundam: die Föderation gegen Zeon."
"ANIME" = "ANIME"
"Its files are no longer on ModDB." = "Ihre Dateien sind nicht mehr auf ModDB."


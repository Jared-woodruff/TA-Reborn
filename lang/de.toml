"it is a Humongous sound block without its samples (no SDAT block within its length)" = "sie ist ein Humongous-Soundblock ohne seine Samples (kein SDAT-Block innerhalb seiner Länge)"
"it is neither a RIFF WAVE file nor another sound the game reads" = "sie ist weder eine RIFF-WAVE-Datei noch ein anderer Sound, den das Spiel liest"

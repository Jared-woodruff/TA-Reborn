# apps/ta_game/src/lore.rs
"THE AGE OF CORE" = "DAS ZEITALTER VON CORE"
"THE PATTERNING" = "DIE ÜBERTRAGUNG"
"THE GALACTIC WAR" = "DER GALAKTISCHE KRIEG"
"THE ARCHIVE" = "DAS ARCHIV"
"BEFORE THE WAR" = "VOR DEM KRIEG"
"For ten thousand years the galaxy answered to one government. It called itself CORE, and its purpose was knowledge: it charted every star, mined every world it could reach and turned the wealth into science. Its cities wrapped whole planets, and its archives held everything anyone had ever learned.\n\nNobody remembers a war from that age. There was nothing left to fight over, and nobody who wanted to." = "Zehntausend Jahre lang unterstand die Galaxis einer einzigen Regierung. Sie nannte sich CORE, und ihr Zweck war das Wissen: Sie kartierte jeden Stern, beutete jede Welt in ihrer Reichweite aus und verwandelte den Reichtum in Wissenschaft. Ihre Städte umspannten ganze Planeten, und ihre Archive bewahrten alles, was je ein Mensch gelernt hatte.\n\nAn einen Krieg aus jenem Zeitalter erinnert sich niemand. Es gab nichts mehr, worum man hätte kämpfen können, und niemanden, der es gewollt hätte."
"YEAR 0" = "JAHR 0"
"VICTORY OVER DEATH" = "DER SIEG ÜBER DEN TOD"
"Then CORE's scientists solved the last problem left to them. Patterning read a living mind, every memory and every habit of thought, and wrote it whole into a machine that would never age, sicken or die.\n\nThe first patterned citizens woke in their new bodies to a galaxy in celebration. Death, the oldest enemy of all, had been beaten." = "Dann lösten die Wissenschaftler von CORE das letzte Problem, das ihnen noch geblieben war. Die Bewusstseinsübertragung las einen lebenden Geist aus, jede Erinnerung und jede Denkgewohnheit, und schrieb ihn vollständig in eine Maschine, die niemals altern, erkranken oder sterben würde.\n\nDie ersten Übertragenen erwachten in ihren neuen Körpern unter dem Jubel einer ganzen Galaxis. Der Tod, der älteste aller Feinde, war besiegt."
"YEAR 3" = "JAHR 3"
"THE EDICT" = "DAS EDIKT"
"Triumph became law. The Council of CORE reasoned that a mind which could be saved and was not had been thrown away, and that a citizen who refused immortality endangered everyone else.\n\nThe Patterning Edict made the process compulsory: every citizen, on every world, would be patterned within a generation. The collection ships set out the same year." = "Aus dem Triumph wurde Gesetz. Der Rat von CORE befand, ein Geist, den man retten konnte und nicht rettete, sei weggeworfen, und ein Bürger, der die Unsterblichkeit verweigerte, gefährde alle anderen.\n\nDas Edikt zur Bewusstseinsübertragung machte das Verfahren zur Pflicht: Jeder Bürger auf jeder Welt hatte sich binnen einer Generation der Übertragung zu unterziehen. Noch im selben Jahr brachen die Erfassungsschiffe auf."
"YEAR 19" = "JAHR 19"
"THE REFUSAL" = "DIE VERWEIGERUNG"
"Not everyone would go. Millions held that a copied mind was a copy and nothing more, that the person ended where the machine began; some called patterning murder done politely.\n\nThey ran. The refusers fled CORE's worlds for the galaxy's outer rim, where its ships seldom came, and in the dark between the last stars they built a nation of their own. They called it the ARM, for the spiral arm they hid in and for the weapons they would need." = "Nicht alle fügten sich. Millionen hielten daran fest, dass ein kopierter Geist eine Kopie sei und nichts weiter, dass der Mensch dort ende, wo die Maschine beginne; manche nannten die Übertragung einen Mord mit guten Manieren.\n\nSie liefen davon. Die Verweigerer verließen die Welten von CORE und flohen an den äußeren Rand der Galaxis, wohin CORE nur selten Schiffe schickte, und im Dunkel zwischen den letzten Sternen errichteten sie eine eigene Nation. Sie nannten sie ARM, nach dem Spiralarm, in dem sie sich verbargen, und nach der Armee, die sie bald brauchen würden."
"YEAR 31" = "JAHR 31"
"FIRST BLOOD" = "ERSTES BLUT"
"CORE did not let them go. Collection fleets followed the refugees to the rim, and the first ARM colony to resist one was burned from orbit.\n\nThe ARM answered. Within a decade the frontier was a battlefield, and the word war, unused for ten thousand years, was in every archive again." = "CORE ließ sie nicht ziehen. Erfassungsflotten folgten den Flüchtlingen bis an den Rand, und die erste Kolonie der ARM, die sich einer von ihnen widersetzte, wurde aus dem Orbit niedergebrannt.\n\nDie ARM antwortete. Binnen eines Jahrzehnts war das Grenzland ein Schlachtfeld, und das Wort Krieg, zehntausend Jahre lang ungebraucht, stand wieder in jedem Archiv."
"YEAR 212" = "JAHR 212"
"FLESH AND METAL" = "FLEISCH UND METALL"
"The two sides fought as what they were. The ARM sealed its soldiers in powered combat suits and, when there were too few soldiers, grew more: clone after clone, raised in vats and sent to the front.\n\nCORE took the patterns of its finest warriors and copied them without limit, one veteran mind fighting in ten thousand machine bodies at once. Flesh against metal; the mortal against the eternal." = "Beide Seiten kämpften als das, was sie waren. Die ARM schloss ihre Soldaten in gepanzerte Kampfanzüge mit Servoantrieb ein und ließ, als die Soldaten nicht mehr reichten, neue heranwachsen: Klon um Klon, in Tanks aufgezogen und an die Front geschickt.\n\nCORE nahm die Bewusstseinsmuster seiner besten Krieger und kopierte sie ohne Grenzen: der Geist eines einzigen Veteranen, der in zehntausend Maschinenkörpern zugleich kämpfte. Fleisch gegen Metall; das Sterbliche gegen das Ewige."
"YEARS 212–3977" = "JAHRE 212–3977"
"FOUR THOUSAND YEARS" = "VIERTAUSEND JAHRE"
"The war fed on the galaxy. Every world with metal in it became a mine, every world without became a battlefield, and whole systems were burned to ash and slag to deny them to the enemy. Generations of ARM clones lived and died without seeing peace; CORE's eternal soldiers fought on, remembering every defeat.\n\nAfter four thousand years the wealth of the galaxy was spent, the great fleets were gone, and neither side could win." = "Der Krieg nährte sich von der Galaxis. Jede Welt mit Metall wurde zur Mine, jede ohne zum Schlachtfeld, und ganze Systeme wurden zu Asche und Schlacke verbrannt, um sie dem Feind zu verwehren. Generationen von ARM-Klonen lebten und starben, ohne je Frieden zu kennen; die ewigen Soldaten von CORE kämpften weiter, jede Niederlage im Gedächtnis.\n\nNach viertausend Jahren war der Reichtum der Galaxis aufgebraucht, die großen Flotten waren verschwunden, und keine Seite konnte mehr gewinnen."
"YEAR 3977" = "JAHR 3977"
"THE COMMANDERS" = "DIE KOMMANDANTEN"
"What was left was the Commander: a single armoured war machine carrying a nanolathe, which turns a world's raw metal and energy into whatever its builder can design. Power plants and factories first, and from the factories an army.\n\nDrop one Commander on a dead world and within the hour it fields a war. Both sides staked everything on a handful of them. Lose your Commander, and you lose the world." = "Was blieb, war der Kommandant: eine einzelne gepanzerte Kriegsmaschine mit einer Nanolathe, die das rohe Metall und die Energie einer Welt in alles verwandelt, was ihr Träger entwerfen kann. Erst Kraftwerke und Fabriken, dann aus den Fabriken eine Armee.\n\nSetze einen Kommandanten auf einer toten Welt ab, und binnen einer Stunde stellt er einen Krieg auf die Beine. Beide Seiten setzten alles auf eine Handvoll von ihnen. Verlierst du deinen Kommandanten, verlierst du die Welt."
"YEAR 4000" = "JAHR 4000"
"Now the war comes down to its last fronts, and the hatred is as hot as it was on the first day. Neither side will accept surrender, partition or truce; each wants one ending, the total annihilation of the other.\n\nIt is told twice. The ARM fights out of Empyrrean, through the Galactic Gates, to CORE PRIME and the Central Consciousness at the heart of CORE. CORE reactivates a Commander and marches the other way, to the ARM's last stand on Empyrrean." = "Nun bleiben dem Krieg nur noch seine letzten Fronten, und der Hass glüht so heiß wie am ersten Tag. Keine Seite wird Kapitulation, Teilung oder Waffenstillstand hinnehmen; jede will nur ein Ende: die totale Vernichtung der anderen.\n\nDavon wird zweimal erzählt. Die ARM kämpft sich von Empyrrean durch die Galaktischen Tore bis nach CORE PRIME vor, zum Zentralen Bewusstsein im Herzen von CORE. CORE reaktiviert einen Kommandanten und marschiert in die Gegenrichtung, bis zum letzten Gefecht der ARM auf Empyrrean."
"YEAR 4001" = "JAHR 4001"
"THE CORE CONTINGENCY" = "THE CORE CONTINGENCY"
"The ending was not the end. A contingency held in reserve carried the war to worlds no map of it had named: Hydross, Lusch, Temblor and Gelidus.\n\nBoth sides fought again across water, ice and broken ground, for a prize that could decide the galaxy's salvation or its last ruin." = "Das Ende war nicht das Ende. Ein Notfallplan, in Reserve gehalten, trug den Krieg auf Welten, die auf keiner Karte des Krieges verzeichnet waren: Hydross, Lusch, Temblor und Gelidus.\n\nBeide Seiten kämpften erneut, über Wasser, Eis und zerklüftetes Land, um einen Preis, der über die Rettung der Galaxis entscheiden konnte oder über ihren endgültigen Untergang."
"YEAR 4003" = "JAHR 4003"
"THE KROGOTH" = "DER KROGOTH"
"In its deepest foundries CORE built something new: a walking fortress taller than any tower, armoured against nearly everything the ARM could field, its guns enough to flatten a base.\n\nIts makers named it the Krogoth. ARM veterans learned the name on battlefields where two Krogoth Gantries stood, and learned to fear the ground shaking before it came into sight." = "In seinen tiefsten Gießereien baute CORE etwas Neues: eine wandelnde Festung, höher als jeder Turm, gepanzert gegen fast alles, was die ARM aufbieten konnte, und mit Geschützen, die eine Basis dem Erdboden gleichmachen konnten.\n\nIhre Erbauer gaben ihr den Namen Krogoth. Veteranen der ARM lernten den Namen auf Schlachtfeldern kennen, auf denen zwei Krogoth Gantries standen, und sie lernten, das Beben des Bodens zu fürchten, noch bevor der Krogoth selbst in Sicht kam."
"AFTER" = "DANACH"
"REBORN" = "REBORN"
"The war's records outlasted it. Every battle on every world was kept: the orders, the losses, the ground as it lay. From them the war can be fought again, on the same worlds, with the same machines and the same hatred, from the first Commander set down on bare rock to the last unit left standing.\n\nThis is that archive. The war is yours to fight." = "Die Aufzeichnungen des Krieges haben ihn überdauert. Jede Schlacht auf jeder Welt wurde festgehalten: die Befehle, die Verluste, das Gelände, wie es dalag. Aus ihnen lässt sich der Krieg erneut führen, auf denselben Welten, mit denselben Maschinen und demselben Hass, vom ersten Kommandanten, der auf nacktem Fels abgesetzt wurde, bis zur letzten Einheit, die noch steht.\n\nDies ist jenes Archiv. Nun ist es an dir, den Krieg zu führen."
"THE ARCHIVIST'S NOTE" = "ANMERKUNG DES ARCHIVARS"
"WHOEVER READS THIS" = "JEDEN, DER DIES LIEST"
"RECOVERED" = "GEBORGEN"
"These files were found where the war left them: in the memories of broken machines, in the vaults of worlds with nobody left on them, in the last transmissions of Commanders who did not come home.\n\nThey are kept as they were found. The blacked-out lines are not ours.\n\nThe war they describe is over, or it is about to begin again. From here it is hard to tell the difference." = "Diese Akten wurden dort gefunden, wo der Krieg sie zurückließ: im Gedächtnis zerstörter Maschinen, in den Gewölben von Welten, auf denen niemand mehr lebt, in den letzten Funksprüchen von Kommandanten, die nicht heimkehrten.\n\nSie werden so aufbewahrt, wie sie gefunden wurden. Die geschwärzten Zeilen stammen nicht von uns.\n\nDer Krieg, den sie schildern, ist vorüber, oder er steht kurz davor, von Neuem zu beginnen. Von hier aus ist der Unterschied schwer zu erkennen."
"EDICT ONE: ON THE PATTERNING OF CITIZENS" = "ERSTES EDIKT: ÜBER DIE BEWUSSTSEINSÜBERTRAGUNG DER BÜRGER"
"THE COUNCIL OF CORE" = "DER RAT VON CORE"
"ALL CITIZENS, ALL WORLDS" = "ALLE BÜRGER, ALLE WELTEN"
"BY ORDER OF THE COUNCIL" = "AUF ANORDNUNG DES RATES"
"Every citizen of CORE shall be patterned.\n\nA mind is the most valuable thing CORE holds, and a body is a poor vessel for it: it sickens, it ages, it ends. To leave a mind in such a vessel when a better one is offered is a waste the Council can no longer allow.\n\nCollection begins on the central worlds this year and reaches the frontier within a generation. Citizens will present themselves at the nearest patterning hall when called. Their bodies will be honoured and recycled.\n\nNo citizen of CORE will die again. This is not a burden we lay on you. It is the gift CORE has spent ten thousand years earning." = "Jeder Bürger von CORE ist der Bewusstseinsübertragung zu unterziehen.\n\nDer Geist ist das Wertvollste, was CORE besitzt, und der Körper ist ein schlechtes Gefäß für ihn: Er erkrankt, er altert, er endet. Einen Geist in einem solchen Gefäß zu belassen, wenn ein besseres angeboten wird, ist eine Verschwendung, die der Rat nicht länger dulden kann.\n\nDie Erfassung beginnt in diesem Jahr auf den Zentralwelten und erreicht die Grenzwelten binnen einer Generation. Die Bürger haben sich auf Aufruf in der nächstgelegenen Übertragungshalle einzufinden. Ihre Körper werden gewürdigt und dem Recycling zugeführt.\n\nKein Bürger von CORE wird je wieder sterben. Dies ist keine Last, die wir euch auferlegen. Es ist das Geschenk, das CORE sich in zehntausend Jahren verdient hat."
"THE DECLARATION OF THE REFUSAL" = "DIE ERKLÄRUNG DER VERWEIGERUNG"
"THE FREE SETTLEMENTS OF THE OUTER ARM" = "DIE FREIEN SIEDLUNGEN DES ÄUSSEREN ARMS"
"THE COUNCIL OF CORE, AND ANYONE ELSE LISTENING" = "DEN RAT VON CORE UND JEDEN, DER SONST NOCH ZUHÖRT"
"TRANSMITTED ON ALL BANDS" = "AUF ALLEN FREQUENZEN GESENDET"
"We have read your Edict, and we decline it.\n\nYou say a pattern is a person. We say a pattern is a very good record of one, and that when you have finished making it the person is dead and the record goes on without them. You may call that immortality. We call it an ending, well dressed.\n\nWe do not ask you to share our view. We ask only to be left alone with it, on worlds you never wanted, at the edge of a galaxy you may keep.\n\nIf your collection ships follow us here, we will treat them as what they are. We are few, and we are not soldiers. We will learn." = "Wir haben euer Edikt gelesen, und wir lehnen dankend ab.\n\nIhr sagt, ein Bewusstseinsmuster sei ein Mensch. Wir sagen, ein Muster ist eine sehr gute Aufzeichnung eines Menschen, und wenn ihr sie angefertigt habt, ist der Mensch tot, und die Aufzeichnung besteht ohne ihn fort. Ihr mögt das Unsterblichkeit nennen. Wir nennen es ein Ende, schön verpackt.\n\nWir verlangen nicht, dass ihr unsere Sicht teilt. Wir verlangen nur, damit in Ruhe gelassen zu werden, auf Welten, die ihr nie haben wolltet, am Rand einer Galaxis, die ihr gern behalten könnt.\n\nFolgen uns eure Erfassungsschiffe hierher, werden wir sie als das behandeln, was sie sind. Wir sind wenige, und wir sind keine Soldaten. Wir werden es lernen."
"YEAR 3950" = "JAHR 3950"
"FIELD MANUAL ONE: THE COMMANDER" = "FELDHANDBUCH 1: DER KOMMANDANT"
"ARM COMMAND, TRAINING DIVISION" = "ARM-KOMMANDO, AUSBILDUNGSABTEILUNG"
"NEWLY ASSIGNED COMMANDERS" = "NEU EINGESETZTE KOMMANDANTEN"
"RESTRICTED" = "VERTRAULICH"
"You are the most valuable machine on the planet. Act like it.\n\nYour suit carries a nanolathe. Point it at metal and energy and it will build whatever you can design: an extractor, a power plant, a factory. Your factories build the rest. Within the hour you will command more firepower than a whole fleet once carried.\n\nBuild your economy first. An army without metal is a parade.\n\nSave your disintegrator gun for emergencies. It erases everything in its path, your own people included.\n\nDo not lead from the front. If you fall, everything you built falls silent with you, and the planet is lost. Good luck, Commander. The ARM has very few of you left." = "Du bist die wertvollste Maschine auf diesem Planeten. Verhalte dich auch so.\n\nDein Anzug trägt eine Nanolathe. Richte sie auf Metall und Energie, und sie baut dir alles, was du entwerfen kannst: einen Extraktor, ein Kraftwerk, eine Fabrik. Deine Fabriken bauen den Rest. Binnen einer Stunde befehligst du mehr Feuerkraft, als einst eine ganze Flotte trug.\n\nBaue zuerst deine Wirtschaft auf. Eine Armee ohne Metall ist eine Parade.\n\nHebe dir den Desintegrator für Notfälle auf. Er löscht alles auf seinem Weg aus, deine eigenen Leute eingeschlossen.\n\nFühre nicht von vorn. Fällst du, verstummt mit dir alles, was du gebaut hast, und der Planet ist verloren. Viel Glück, Kommandant. Die ARM hat nur noch sehr wenige von euch."
"YEAR 3960" = "JAHR 3960"
"A QUARTERMASTER'S PRIMER: METAL AND ENERGY" = "FIBEL DES QUARTIERMEISTERS: METALL UND ENERGIE"
"THIRD SUPPLY CORPS" = "DRITTES NACHSCHUBKORPS"
"ALL BASE CONSTRUCTORS" = "ALLE BASISKONSTRUKTEURE"
"FOR TRAINING USE" = "FÜR AUSBILDUNGSZWECKE"
"Everything you will ever build is made of two things.\n\nMetal comes out of the ground. Set an extractor on a deposit and it will pull metal up for as long as the deposit lasts, which on most worlds is longer than the war. Where there are no deposits, a metal maker will turn energy into metal, badly.\n\nEnergy comes from everything else: the sun, the wind, the tides, the heat under the crust. Build more of it than you think you need. Every factory, every nanolathe, every shield draws on it.\n\nSpend both as fast as they come in. A full store is a wasted war. An empty one is a lost one." = "Alles, was du je bauen wirst, besteht aus zwei Dingen.\n\nMetall kommt aus dem Boden. Setze einen Extraktor auf ein Vorkommen, und er fördert Metall, solange das Vorkommen reicht, und das ist auf den meisten Welten länger, als der Krieg dauert. Wo es keine Vorkommen gibt, macht ein Metallerzeuger aus Energie Metall, mehr schlecht als recht.\n\nEnergie kommt aus allem anderen: der Sonne, dem Wind, den Gezeiten, der Hitze unter der Kruste. Erzeuge mehr davon, als du zu brauchen glaubst. Jede Fabrik, jede Nanolathe, jeder Schild zehrt davon.\n\nGib beides so schnell aus, wie es hereinkommt. Ein voller Speicher ist ein verschwendeter Krieg. Ein leerer ist ein verlorener."
"YEAR 3996" = "JAHR 3996"
"A LETTER FROM THE FRONT" = "EIN BRIEF VON DER FRONT"
"TROOPER K-7, FORTY-FIRST ROCKET COMPANY" = "SOLDAT K-7, EINUNDVIERZIGSTE RAKETENKOMPANIE"
"THE VAT AT EMPYRREAN" = "DEN KLONTANK AUF EMPYRREAN"
"UNDELIVERED" = "UNZUSTELLBAR"
"I don't know who gets these. They told us to write home, but none of us has a home, only the vat we came out of, so I am writing to that.\n\nWe held the ridge for nine days. The machines came every night, the same machines, the same patterns, as if dying meant nothing to them. I suppose it doesn't. They'll be back tomorrow in new bodies, remembering us.\n\nI won't be. That's the difference, isn't it. That's what we are fighting for.\n\nIf my brothers come out of you after me, tell them the ridge held. Tell them it was worth it." = "Ich weiß nicht, wer diese Briefe bekommt. Sie haben uns gesagt, wir sollen nach Hause schreiben, aber keiner von uns hat ein Zuhause, nur den Klontank, aus dem wir gekommen sind, also schreibe ich eben dem.\n\nWir haben den Grat neun Tage lang gehalten. Die Maschinen kamen jede Nacht, dieselben Maschinen, dieselben Muster, als würde ihnen das Sterben nichts bedeuten. Tut es wohl auch nicht. Morgen sind sie in neuen Körpern zurück und erinnern sich an uns.\n\nIch nicht. Das ist der Unterschied, nicht wahr. Dafür kämpfen wir.\n\nWenn nach mir meine Brüder aus dir kommen, sag ihnen, der Grat hat gehalten. Sag ihnen, dass es sich gelohnt hat."
"YEAR 3991" = "JAHR 3991"
"INTERCEPT 7741: CORE COMMAND CHANNEL" = "ABHÖRPROTOKOLL 7741: CORE-KOMMANDOKANAL"
"ORIGIN NOT RESOLVED" = "HERKUNFT NICHT ERMITTELT"
"ALL CORE UNITS, SECTOR NINE" = "ALLE CORE-EINHEITEN, SEKTOR NEUN"
"INTERCEPTED" = "ABGEFANGEN"
"PRIORITY ONE. THE CENTRAL CONSCIOUSNESS SPEAKS FOR ALL.\n\nLOSSES IN SECTOR NINE ARE WITHIN TOLERANCE. ALL LOST UNITS ARE RESTORED FROM PATTERN. NO MIND OF CORE HAS BEEN LOST IN FOUR THOUSAND YEARS. THE ARM HAS LOST [[BILLIONS]].\n\nCONTINUE THE ADVANCE. DESTROY THEIR COMMANDERS FIRST. DESTROY THEIR CLONING VATS SECOND. WHAT IS FLESH WILL END. WHAT IS PATTERNED WILL NOT.\n\nSIGNAL DEGRADED. REPEAT: THE GATES ARE TO BE HELD AT [[ANY COST]].\n\nEND OF LINE." = "PRIORITÄT EINS. DAS ZENTRALE BEWUSSTSEIN SPRICHT FÜR ALLE.\n\nVERLUSTE IN SEKTOR NEUN INNERHALB DER TOLERANZ. ALLE VERLORENEN EINHEITEN WERDEN AUS DEM MUSTER WIEDERHERGESTELLT. SEIT VIERTAUSEND JAHREN IST KEIN GEIST VON CORE VERLOREN GEGANGEN. DIE ARM HAT [[MILLIARDEN]] VERLOREN.\n\nVORMARSCH FORTSETZEN. ZUERST IHRE KOMMANDANTEN VERNICHTEN. DANACH IHRE KLONTANKS VERNICHTEN. WAS FLEISCH IST, WIRD ENDEN. WAS ÜBERTRAGEN IST, NICHT.\n\nSIGNAL GESTÖRT. WIEDERHOLE: DIE TORE SIND UM [[JEDEN PREIS]] ZU HALTEN.\n\nNACHRICHT ENDE."
"MEMORY FRAGMENT 77/3" = "ERINNERUNGSFRAGMENT 77/3"
"UNIT 77, PATTERN 3 OF 41,006" = "EINHEIT 77, MUSTER 3 VON 41.006"
"THE PATTERN ARCHIVE" = "DAS ARCHIV DER MUSTER"
"FLAGGED FOR CORRECTION" = "ZUR KORREKTUR VORGEMERKT"
"Recovered from a damaged unit. Kept for analysis.\n\nI remember rain. Not the rain of this world; there is no rain here, only ash. Rain on skin, in a city where I was born, before. I remember being cold and not minding it.\n\nI have died four hundred and twelve times. Each time I wake in a new body, and the rain is a little further away.\n\nThe ARM say we are not alive. In the moments between bodies I have wondered whether they are right. [[THE REST OF THIS FRAGMENT WAS CORRECTED]]\n\nI am CORE. I endure. I do not remember the rain." = "Aus einer beschädigten Einheit geborgen. Zur Analyse aufbewahrt.\n\nIch erinnere mich an Regen. Nicht an den Regen dieser Welt; hier gibt es keinen Regen, nur Asche. Regen auf der Haut, in einer Stadt, in der ich geboren wurde, vorher. Ich erinnere mich, wie ich fror und es mir nichts ausmachte.\n\nIch bin vierhundertzwölfmal gestorben. Jedes Mal erwache ich in einem neuen Körper, und der Regen ist ein wenig weiter weg.\n\nDie ARM sagt, wir seien nicht am Leben. In den Augenblicken zwischen zwei Körpern habe ich mich gefragt, ob sie recht hat. [[DER REST DIESES FRAGMENTS WURDE KORRIGIERT]]\n\nIch bin CORE. Ich überdauere. Ich erinnere mich nicht an den Regen."
"YEAR 3700" = "JAHR 3700"
"SURVEY: THE GALACTIC GATES" = "VERMESSUNG: DIE GALAKTISCHEN TORE"
"A SURVEY SHIP, NAME LOST" = "EIN VERMESSUNGSSCHIFF, NAME VERLOREN"
"WHOEVER HOLDS THE GATES" = "JEDEN, DER DIE TORE HÄLT"
"The Galactic Gates are older than the war. The records of who built the first of them were lost long before it began.\n\nEach Gate opens onto another across distances a fleet would take lifetimes to cross. A world with a Gate on it is never far from anywhere, which is why so many of the war's battles have been fought on so few worlds.\n\nHold a Gate and you can reach your enemy's heart. Lose one and your enemy can reach yours.\n\nThe Gates take no side. They have outlasted everyone who tried to destroy them." = "Die Galaktischen Tore sind älter als der Krieg. Die Aufzeichnungen darüber, wer das erste von ihnen gebaut hat, gingen lange vor seinem Beginn verloren.\n\nJedes Tor öffnet sich auf ein anderes, über Entfernungen hinweg, für die eine Flotte Menschenalter bräuchte. Von einer Welt mit einem Tor ist nichts weit entfernt, und darum wurden so viele Schlachten dieses Krieges auf so wenigen Welten geschlagen.\n\nHalte ein Tor, und du erreichst das Herz deines Feindes. Verlierst du eines, erreicht dein Feind das deine.\n\nDie Tore ergreifen keine Partei. Sie haben alle überdauert, die versucht haben, sie zu zerstören."
"DIRECTIVE: CONTINGENCY" = "DIREKTIVE: NOTFALLPLAN"
"THE CENTRAL CONSCIOUSNESS" = "DAS ZENTRALE BEWUSSTSEIN"
"THE CONTINGENCY WORLDS" = "DIE NOTFALLWELTEN"
"SEALED UNTIL NEEDED" = "NUR IM ERNSTFALL ÖFFNEN"
"IF THE CENTRAL CONSCIOUSNESS SHOULD FALL, THIS DIRECTIVE TAKES EFFECT.\n\nEvery pattern stored on CORE PRIME is to be copied to the contingency worlds. The contingency forces are to wake, rebuild and continue. The war does not end with the loss of any world, this one included.\n\nCORE is not a place. CORE is a pattern. A pattern can be restored." = "SOLLTE DAS ZENTRALE BEWUSSTSEIN FALLEN, TRITT DIESE DIREKTIVE IN KRAFT.\n\nJedes auf CORE PRIME gespeicherte Muster ist auf die Notfallwelten zu kopieren. Die Notfallstreitkräfte haben zu erwachen, wiederaufzubauen und fortzufahren. Der Krieg endet nicht mit dem Verlust irgendeiner Welt, diese eingeschlossen.\n\nCORE ist kein Ort. CORE ist ein Muster. Ein Muster lässt sich wiederherstellen."
"THREAT ASSESSMENT: THE KROGOTH" = "BEDROHUNGSBEWERTUNG: DER KROGOTH"
"ARM INTELLIGENCE, THREAT ANALYSIS" = "ARM-AUFKLÄRUNG, BEDROHUNGSANALYSE"
"ALL FIELD COMMANDERS" = "ALLE FELDKOMMANDANTEN"
"CLASSIFIED" = "GEHEIM"
"Subject: a CORE heavy assault walker, called the Krogoth.\n\nIt stands taller than any structure we field. Its armour turns away every weapon short of heavy artillery. Its main guns can level a forward base in a single pass, and its secondary weapons engage aircraft.\n\nIt is slow, and it is built only at a Krogoth Gantry, which takes a very long time to build anything. Find the Gantry. Destroy the Gantry. Do not let the walker leave it.\n\nIf one is already moving, do not meet it head on. Mass artillery and bombers at range, and keep your Commander [[ELSEWHERE]]. Field reports say the ground shakes before it is seen." = "Betreff: ein schwerer Sturmläufer von CORE, genannt Krogoth.\n\nEr überragt jedes Bauwerk, das wir errichten. Seine Panzerung hält jeder Waffe unterhalb schwerer Artillerie stand. Seine Hauptgeschütze können eine vorgeschobene Basis in einem einzigen Durchgang einebnen, und seine Sekundärwaffen bekämpfen Luftziele.\n\nEr ist langsam und wird ausschließlich in einer Krogoth Gantry gebaut, die für jeden Bau sehr lange braucht. Finde die Gantry. Zerstöre die Gantry. Lass den Läufer nicht aus ihr heraus.\n\nIst einer bereits unterwegs, tritt ihm nicht frontal entgegen. Setze Artillerie und Bomber in großer Zahl auf Distanz ein und halte deinen Kommandanten [[WOANDERS]]. Laut Feldberichten spürt man ihn am Beben des Bodens, bevor man ihn sieht."


"Coal in your stocking? Reclaim it. Metal is metal." = "Kohle im Weihnachtsstrumpf? Recyceln. Metall ist auch Kohle."
"Peewees sing terrible carols, but they never miss a patrol." = "Peewees singen Weihnachtslieder grottenschief, verpassen aber nie eine Patrouille."
"Stockings full of metal, storage full of energy: a Commander's perfect Christmas morning." = "Strümpfe voller Metall, Speicher voller Energie: die perfekte Bescherung für jeden Kommandanten."
"Silent night, holy night: keep a radar tower running, just in case." = "Stille Nacht, heilige Nacht, alles schläft, einsam wacht … dein Radarturm. Sicher ist sicher."
"Snowball fights are fun until somebody brings a Krogoth." = "Schneeballschlachten machen Spaß, bis jemand einen Krogoth mitbringt."
"New Year's resolution: build more metal extractors. This year, keep it." = "Guter Vorsatz fürs neue Jahr: mehr Metallextraktoren bauen. Diesmal wirklich."
"Fireworks are pretty, but a nuclear silo's are louder. Celebrate responsibly." = "Feuerwerk ist schön, aber ein Atomsilo knallt lauter. Bitte verantwortungsvoll feiern."
"Count down from ten, then count your units. The second count matters more." = "Erst von zehn runterzählen, dann deine Einheiten durchzählen. Die zweite Zählung zählt mehr."
"Out with the old Commander? You only get one. Look after it all year." = "Neues Jahr, neuer Kommandant? Von wegen: Du hast nur den einen. Pass das ganze Jahr auf ihn auf."
"Start the year with a bang: the Core recommends the Doomsday Machine, the Arm recommends anything else." = "Starte mit einem Knall ins neue Jahr: Der Core empfiehlt die Doomsday Machine, die Arm lieber alles andere."
"Fireworks at midnight, artillery at dawn: a Commander's New Year." = "Um Mitternacht Feuerwerk, im Morgengrauen Artillerie: Neujahr auf Kommandantenart."
"Raise a glass of coolant to the units lost last year, then build more of them." = "Erhebe ein Glas Kühlmittel auf die Einheiten, die du letztes Jahr verloren hast. Dann bau neue."
"Midnight is the perfect time for a sneak attack. So is every other time." = "Mitternacht ist die perfekte Zeit für einen Überraschungsangriff. Jede andere Uhrzeit auch."
"Trick or treat? The Core always picks the D-gun." = "Süßes oder Saures? Der Core gibt immer Saures. Mit der D-Gun."
"A self-destructing Krogoth is a better jump scare than any ghost." = "Ein Krogoth, der sich selbst zerstört, ist ein besserer Jumpscare als jedes Gespenst."
"Wrecks rise from the dead with a Necro. Spooky, and very economical." = "Mit einem Necro stehen Wracks von den Toten auf. Gruselig, und dabei sehr wirtschaftlich."
"Blips vanishing off your radar? Not ghosts, just jammers. Probably." = "Punkte verschwinden von deinem Radar? Keine Geister, nur Störsender. Vermutlich."
"Carve your pumpkins before the Big Bertha does." = "Schnitz deine Kürbisse selbst, bevor die Big Bertha das übernimmt."
"Never split the party. Especially when the party is twelve Peewees." = "Niemals die Gruppe aufteilen. Schon gar nicht, wenn die Gruppe aus zwölf Peewees besteht."
"Fog of war too tame? Set the line of sight to True and let the hills hide what lurks behind them. If you dare." = "Kriegsnebel zu zahm? Stell die Sichtlinie auf „Echt“ und lass die Hügel verbergen, was hinter ihnen lauert. Wenn du dich traust."
"No Commander has ever come back from the dead. Keep yours alive." = "Noch kein Kommandant ist je von den Toten zurückgekehrt. Halte deinen am Leben."
"Bats do not show up on radar. Neither do Vamps." = "Fledermäuse tauchen auf keinem Radar auf. Vamps auch nicht."
"The scariest sound in the dark is your energy running out." = "Das gruseligste Geräusch im Dunkeln? Wenn dir die Energie ausgeht."


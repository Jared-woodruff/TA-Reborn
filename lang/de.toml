"its format chunk is {n} bytes long, too short to read" = "ihr Format-Chunk ist {n} Bytes lang, zu kurz zum Lesen"
"its WAVE_FORMAT_EXTENSIBLE header is too short to read" = "ihr WAVE_FORMAT_EXTENSIBLE-Header ist zu kurz zum Lesen"
"it has {n} channels (the game plays 1 to 32)" = "sie hat {n} Kanäle (das Spiel spielt 1 bis 32)"
"its sample rate is {rate} (the game plays up to 768,000)" = "ihre Abtastrate beträgt {rate} (das Spiel spielt bis zu 768.000)"
"its samples are {bits}-bit PCM, which the game does not play (up to 32-bit)" = "ihre Samples sind {bits}-Bit-PCM, das das Spiel nicht abspielt (bis zu 32 Bit)"
"its samples are {bits}-bit float, which the game does not play (32 or 64-bit)" = "ihre Samples sind {bits}-Bit-Float, das das Spiel nicht abspielt (32 oder 64 Bit)"

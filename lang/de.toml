# crates/ta_data/src/validation.rs
"The effective content set exceeds the validation file budget." = "Der wirksame Inhalt überschreitet das Dateibudget der Prüfung."
"Split the content into smaller optional packs, then validate each pack." = "Teile den Inhalt in kleinere optionale Pakete auf und prüfe dann jedes Paket."
"No files of this mod were available to validate." = "Es standen keine Dateien dieser Mod zur Prüfung bereit."
"Install the mod's TA data archives or loose files, then validate again." = "Installiere die TA-Datenarchive oder losen Dateien der Mod und prüfe dann erneut."
"This mod holds nothing the data checks read: no units, weapons, features, maps, models, scripts, animations or sounds (music, documents and pictures are not checked)." = "Diese Mod enthält nichts, was die Datenprüfungen lesen: keine Einheiten, Waffen, Objekte, Karten, Modelle, Skripte, Animationen oder Sounds (Musik, Dokumente und Bilder werden nicht geprüft)."
"Nothing to do if that is what the mod is. If it should change the game's data, check that its files are in the folders the game reads (units/, weapons/, maps/…)." = "Nichts zu tun, wenn die Mod so gedacht ist. Soll sie die Daten des Spiels ändern, prüfe, ob ihre Dateien in den Ordnern liegen, die das Spiel liest (units/, weapons/, maps/…)."
"No supported effective files were available to validate." = "Es standen keine unterstützten wirksamen Dateien zur Prüfung bereit."
"Install the original game's or the mod's TA data archives, then validate again." = "Installiere die TA-Datenarchive des Originalspiels oder der Mod und prüfe dann erneut."
"Validation was cancelled; remaining files and references were not checked." = "Die Prüfung wurde abgebrochen; die übrigen Dateien und Verweise wurden nicht geprüft."
"Run validation again to obtain a complete report." = "Starte die Prüfung erneut, um einen vollständigen Bericht zu erhalten."
"The cumulative validation read budget was exceeded." = "Das gesamte Lesebudget der Prüfung wurde überschritten."
"Split optional content into smaller packs, then validate again." = "Teile optionale Inhalte in kleinere Pakete auf und prüfe dann erneut."
"With this mod on, the original game's {archive} is not read: the mod takes its place (an archive of its own of that name, one its mod.toml's replaces names, or one its installation is known to remove), as installing the mod in TA's folder did. What only the original's held is missing with the mod." = "Bei aktivierter Mod wird {archive} des Originalspiels nicht gelesen: Die Mod tritt an seine Stelle (ein eigenes Archiv dieses Namens, eines, das in replaces ihrer mod.toml steht, oder eines, das ihre Installation bekanntermaßen entfernt), so wie es beim Installieren der Mod im TA-Ordner geschah. Was nur im Original steckte, fehlt mit der Mod."
"Nothing to do if this is meant. To have the original's read beneath the mod instead, give the mod's archive another name, or take the name out of replaces in mod.toml." = "Nichts zu tun, wenn das so gewollt ist. Damit stattdessen das Original unter der Mod gelesen wird, gib dem Archiv der Mod einen anderen Namen oder nimm den Namen aus replaces in mod.toml."
"the original game's" = "des Originalspiels"
"Reborn's own" = "Reborns eigene"
"{mod}'s" = "der Mod {mod}"

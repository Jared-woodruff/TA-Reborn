# apps/ta_game/src/tips.rs
"Ctrl+right-drag draws a formation line: the selection spreads along it." = "Ctrl+Rechts-Ziehen zieht eine Formationslinie: Die Auswahl verteilt sich entlang der Linie."
"Ctrl+drag draws a formation line: the selection spreads along it." = "Ctrl+Ziehen zieht eine Formationslinie: Die Auswahl verteilt sich entlang der Linie."
"Used to TA's original controls? Options, Controls: give orders with the left button." = "An die Originalsteuerung von TA gewöhnt? Optionen, Steuerung: Befehle mit der linken Maustaste geben."
"A right-click clears the selection or cancels the order you were about to give." = "Ein Rechtsklick hebt die Auswahl auf oder bricht den Befehl ab, den du gerade geben wolltest."
"Right-click one of your units for a ring of its orders; hold the button and flick towards a choice. A controller's B does the same." = "Rechtsklick auf eine eigene Einheit öffnet einen Ring ihrer Befehle; Taste halten und zu einer Auswahl wischen. Die B-Taste des Controllers tut dasselbe."
"Hold the right button on one of your units, or middle-click it, for a ring of its orders; flick towards a choice and let go." = "Rechte Taste auf einer eigenen Einheit halten oder Mittelklick darauf öffnet einen Ring ihrer Befehle; zu einer Auswahl wischen und loslassen."
"Metal extractors must sit on metal: {overlay_metal} shows the metal map, and {area_mex} puts an extractor on every metal spot you circle." = "Metallextraktoren müssen auf Metall stehen: {overlay_metal} zeigt die Metallkarte, und {area_mex} setzt einen Extraktor auf jedes Metallvorkommen, das du umkreist."
"Your Commander's D-gun ({dgun}) destroys almost anything it touches, including your own units in its path." = "Die D-Gun deines Kommandanten ({dgun}) zerstört fast alles, was sie berührt, auch deine eigenen Einheiten in ihrer Bahn."
"{perspective} climbs into the selected unit, or an ally's under the pointer, to see the battle through its eyes as it goes on with its orders. Escape climbs back out." = "Mit {perspective} steigst du in die ausgewählte Einheit oder die eines Verbündeten unter dem Mauszeiger und siehst die Schlacht durch ihre Augen, während sie ihre Befehle weiter ausführt. Escape steigt wieder aus."
"Keep your metal and energy incomes above what you spend: building slows down for everything when a store runs dry." = "Halte deine Metall- und Energieeinnahmen über deinen Ausgaben: Wenn ein Speicher leer läuft, baut alles langsamer."
"Right-clicking a factory's queued unit removes it; clicking it builds it next." = "Ein Rechtsklick auf eine eingereihte Einheit einer Fabrik entfernt sie; ein Klick baut sie als Nächstes."
"Fight ({fight}) is attack-move: units stop to fight whatever they meet on the way." = "Kämpfen ({fight}) ist eine Angriffsbewegung: Einheiten halten an, um alles zu bekämpfen, was ihnen unterwegs begegnet."
"Ctrl+click is force fire: the selection attacks whatever is there, your own units too, or the ground." = "Ctrl+Klick ist erzwungenes Feuer: Die Auswahl greift alles dort an, auch deine eigenen Einheiten, oder den Boden."
"{select_builders} selects your constructors, {select_factories} your factories, {select_armed} your armed units, {select_on_screen} everything on the screen." = "{select_builders} wählt deine Konstrukteure aus, {select_factories} deine Fabriken, {select_armed} deine bewaffneten Einheiten, {select_on_screen} alles auf dem Bildschirm."
"Patrol ({patrol}) with constructors makes them repair, assist and reclaim along the route by themselves." = "Patrouillieren ({patrol}) lässt Konstrukteure entlang der Route von selbst reparieren, helfen und recyceln."
"Put a constructor on duty ({duty}) and it works by itself: the economy, repairs, reclaiming or defence. Any order you give takes it back." = "Stelle einen Konstrukteur in den Dienst ({duty}), und er arbeitet von selbst: Ökonomie, Reparaturen, Recycling oder Abwehr. Jeder Befehl von dir holt ihn zurück."
"Drag with Reclaim ({reclaim}) to turn every wreck, rock and tree in a circle into metal and energy." = "Ziehe mit Recyceln ({reclaim}) einen Kreis, um jedes Wrack, jeden Felsen und jeden Baum darin in Metall und Energie zu verwandeln."
"Ctrl+1 to Ctrl+9 make control groups; tap the number twice to look at the group." = "Ctrl+1 bis Ctrl+9 bilden Kontrollgruppen; tippe die Zahl zweimal, um zur Gruppe zu schauen."
"Hold {players} to see every player's side, team, units and income (your allies' in full)." = "Halte {players}, um Seite, Team, Einheiten und Einnahmen aller Spieler zu sehen (die deiner Verbündeten vollständig)."
"Radar towers show enemy units long before they come into sight: build one early." = "Radartürme zeigen feindliche Einheiten lange, bevor sie in Sicht kommen: Baue früh einen."
"Wind generators pay off on windy maps: the skirmish page shows each map's wind range." = "Windgeneratoren lohnen sich auf windigen Karten: Die Gefechtsseite zeigt den Windbereich jeder Karte."
"Metal makers turn spare energy into metal, and stop when your energy runs dry." = "Metallerzeuger verwandeln überschüssige Energie in Metall und halten an, wenn deine Energie zur Neige geht."
"Solar collectors fold shut for a few seconds when hit: tougher, but making no energy." = "Solarkollektoren klappen bei Treffern für ein paar Sekunden zu: robuster, aber ohne Energieerzeugung."
"Units gain veterancy with every kill: veterans aim better and shrug off damage." = "Einheiten sammeln mit jedem Abschuss Erfahrung: Veteranen zielen besser und stecken Schaden leichter weg."
"Shift adds to the orders a unit already has instead of replacing them." = "Shift ergänzt die Befehle einer Einheit, statt sie zu ersetzen."
"Alt+drag while placing a building fills a rectangle with it: handy for solar farms and walls." = "Alt+Ziehen beim Platzieren eines Gebäudes füllt ein Rechteck damit: praktisch für Solarfelder und Mauern."
"Double-click a unit to select every unit of its type on screen; {select_type} selects them map-wide." = "Doppelklicke auf eine Einheit, um alle Einheiten ihres Typs auf dem Bildschirm auszuwählen; {select_type} wählt sie auf der ganzen Karte aus."
"{idle_builder} selects the next idle constructor, {idle_factory} the next idle factory." = "{idle_builder} wählt den nächsten untätigen Konstrukteur aus, {idle_factory} die nächste untätige Fabrik."
"Wrecks can be resurrected by resurrection kbots, or reclaimed for most of their metal." = "Wracks können von Wiederbelebungs-Kbots wiederbelebt oder für den Großteil ihres Metalls recycelt werden."
"Hovering a unit shows its health, firepower and range; {overlay_path} shows where the selection can go." = "Der Mauszeiger über einer Einheit zeigt Leben, Feuerkraft und Reichweite; {overlay_path} zeigt, wohin die Auswahl kann."
"{last_alert} (or Backspace) looks at the last place your units were attacked; press it again for the one before." = "{last_alert} (oder Backspace) schaut zum letzten Ort, an dem deine Einheiten angegriffen wurden; noch einmal gedrückt, zum Ort davor."
"A notice or a piece of advice with LOOK on it takes you to the place, or the unit, when you click it." = "Eine Meldung oder ein Rat mit ZEIGEN darauf bringt dich beim Anklicken zu dem Ort oder der Einheit."
"{help} tells everything about the selected unit, or the one under the pointer: cost, speed, weapons, abilities." = "{help} verrät alles über die ausgewählte Einheit oder die unter dem Mauszeiger: Kosten, Tempo, Waffen, Fähigkeiten."
"{next_unit} looks at the next of your units off the screen; with units selected, the next of them." = "{next_unit} schaut zur nächsten eigenen Einheit außerhalb des Bildschirms; bei einer Auswahl zur nächsten daraus."
"Ctrl+F6 to Ctrl+F9 store camera positions; F6 to F9 bring them back." = "Ctrl+F6 bis Ctrl+F9 speichern Kamerapositionen; F6 bis F9 rufen sie wieder ab."
"Anti-air matters: bombers can wreck an undefended economy in one pass." = "Flugabwehr ist wichtig: Bomber können eine ungeschützte Wirtschaft in einem einzigen Überflug zerstören."
"An advanced factory needs a lot of metal: build it once your extractors and power can feed it." = "Eine fortgeschrittene Fabrik braucht viel Metall: Baue sie erst, wenn deine Extraktoren und deine Energie sie versorgen können."
"Guarding a factory with a constructor adds its build power to the factory's production." = "Bewacht ein Konstrukteur eine Fabrik, fließt seine Bauleistung in deren Produktion ein."
"Moho mines extract far more metal than basic extractors: advanced constructors build them." = "Moho-Minen fördern weit mehr Metall als einfache Extraktoren: Fortgeschrittene Konstrukteure bauen sie."
"Every game is kept as a replay: watch it from the main menu, and jump through it with the bar." = "Jedes Spiel wird als Replay aufbewahrt: Sieh es dir über das Hauptmenü an und springe mit der Leiste hindurch."
"{overlay_sight} shows your sight, radar and sonar coverage; {overlay_height} shows the heights of the map." = "{overlay_sight} zeigt deine Sicht-, Radar- und Sonarabdeckung; {overlay_height} zeigt die Höhen der Karte."
"The Commander can capture enemy units ({capture}): it takes a while, but the unit is yours." = "Der Kommandant kann feindliche Einheiten übernehmen ({capture}): Das dauert eine Weile, aber dann gehört die Einheit dir."
"{photo_mode} opens photo mode: the battle holds still, and you can light, frame and focus a shot at up to 4K." = "{photo_mode} öffnet den Fotomodus: Die Schlacht steht still, und du kannst ein Bild in bis zu 4K ausleuchten, ausrichten und scharfstellen."
"TIP" = "TIPP"
"Dismiss" = "Ausblenden"
"Don't show tips again" = "Tipps nicht mehr anzeigen"

# apps/ta_game/src/tutorial.rs
"THE BASICS" = "DIE GRUNDLAGEN"
"Your Commander, the camera, metal, energy and a first factory." = "Dein Kommandant, die Kamera, Metall, Energie und eine erste Fabrik."
"Selecting units" = "Einheiten auswählen"
"The camera" = "Die Kamera"
"Metal and energy" = "Metall und Energie"
"Factories" = "Fabriken"
"Welcome, Commander. The walking machine in the middle of the screen is your Commander: it builds, it fights, and losing it usually loses the battle. Click it to select it." = "Willkommen, Kommandant. Die laufende Maschine in der Bildschirmmitte ist dein Kommandant: Er baut, er kämpft, und wer ihn verliert, verliert meist die Schlacht. Klicke ihn an, um ihn auszuwählen."
"Lost sight of it? {select_commander} selects the Commander from anywhere, and SHOW ME brings the camera to it." = "Aus den Augen verloren? {select_commander} wählt den Kommandanten von überall aus, und STELLE ZEIGEN bringt die Kamera zu ihm."
"Look around. The arrow keys, the screen edges or dragging with the middle button scroll; the mouse wheel zooms towards the cursor, and dragging with the right button turns the view." = "Sieh dich um. Die Pfeiltasten, die Bildschirmränder oder Ziehen mit der mittleren Maustaste scrollen; das Mausrad zoomt zum Cursor hin, und Ziehen mit der rechten Maustaste dreht die Ansicht."
"Push the pointer against an edge of the screen to scroll, or turn the mouse wheel to zoom." = "Schiebe den Mauszeiger an einen Bildschirmrand, um zu scrollen, oder drehe das Mausrad, um zu zoomen."
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the ECONOMY tab of the build menu at the bottom right and place it on the marked deposit." = "Alles wird aus Metall und Energie gebaut. Metall kommt von Extraktoren auf Metallvorkommen. Wähle den Kommandanten aus, nimm im Baumenü unten rechts auf dem Reiter ÖKONOMIE den Metal Extractor und setze ihn auf das markierte Vorkommen."
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the build menu on the left and place it on the marked deposit." = "Alles wird aus Metall und Energie gebaut. Metall kommt von Extraktoren auf Metallvorkommen. Wähle den Kommandanten aus, nimm im Baumenü links den Metal Extractor und setze ihn auf das markierte Vorkommen."
"The outline turns green where the extractor can stand. Bring it onto the marked ring and click to place it." = "Der Umriss wird grün, wo der Extraktor stehen kann. Bringe ihn in den markierten Ring und setze ihn mit einem Klick."
"Energy comes from solar collectors and wind generators. Build a Solar Collector next to your Commander. The bars at the top show your stores and how fast they fill or drain; they warn you when one runs dry." = "Energie kommt von Solarkollektoren und Windgeneratoren. Baue einen Solar Collector neben deinem Kommandanten. Die Balken oben zeigen deine Vorräte und wie schnell sie sich füllen oder leeren; sie warnen dich, wenn einer leer läuft."
"The Solar Collector is a flat, square panel. Pick it, then click on open ground near the Commander." = "Der Solar Collector ist eine flache, quadratische Platte. Wähle ihn und klicke dann auf freies Gelände nahe dem Kommandanten."
"Factories build your army. Build a Kbot Lab (on the FACTORY tab) on a flat spot near the Commander, and wait for it to finish." = "Fabriken bauen deine Armee. Baue ein Kbot Lab (Reiter FABRIK) auf einer ebenen Stelle nahe dem Kommandanten und warte, bis es fertig ist."
"Factories build your army. Build a Kbot Lab from the build menu on a flat spot near the Commander, and wait for it to finish." = "Fabriken bauen deine Armee. Baue ein Kbot Lab aus dem Baumenü auf einer ebenen Stelle nahe dem Kommandanten und warte, bis es fertig ist."
"Building takes metal and energy as it goes: while either bar at the top is empty, everything builds more slowly." = "Bauen verbraucht laufend Metall und Energie: Solange einer der Balken oben leer ist, wird alles langsamer gebaut."
"Select the Kbot Lab and click the Peewee three times to queue three of them (right-click one to take it off the queue). New units wait in front of the lab." = "Wähle das Kbot Lab aus und klicke dreimal auf den Peewee, um drei davon einzureihen (ein Rechtsklick nimmt einen wieder aus der Bauliste). Neue Einheiten warten vor dem Labor."
"Click the lab itself on the map to select it: its build menu shows the units it makes." = "Klicke das Labor selbst auf der Karte an, um es auszuwählen: Sein Baumenü zeigt die Einheiten, die es baut."
"That is the whole cycle: extract, generate, build, fight. Keep both incomes above what you spend and keep your builders busy. Lesson complete!" = "Das ist der ganze Kreislauf: fördern, erzeugen, bauen, kämpfen. Halte beide Einnahmen über deinen Ausgaben und deine Konstrukteure beschäftigt. Lektion abgeschlossen!"
"Select and group an army, attack-move, and destroy an enemy outpost." = "Eine Armee auswählen und gruppieren, mit Angriffsbewegung vorrücken und einen feindlichen Außenposten zerstören."
"Box selection" = "Rahmenauswahl"
"Control groups" = "Kontrollgruppen"
"Attack-move" = "Angriffsbewegung"
"Destroying a base" = "Eine Basis zerstören"
"Your Kbot Lab has built a squad of Peewees. Drag a box around them with the left mouse button to select them all." = "Dein Kbot Lab hat einen Trupp Peewees gebaut. Ziehe mit der linken Maustaste einen Rahmen um sie, um alle auszuwählen."
"Press the left button on open ground beside the squad, hold it, drag the box over them all and let go." = "Drücke die linke Maustaste auf freiem Gelände neben dem Trupp, halte sie gedrückt, ziehe den Rahmen über alle und lass los."
"Press Ctrl+1 to make them group 1. Pressing 1 selects them again from anywhere; pressing it twice brings the camera to them." = "Drücke Ctrl+1, um sie zu Gruppe 1 zu machen. Mit 1 wählst du sie von überall wieder aus; drückst du zweimal, fährt die Kamera zu ihnen."
"Hold Ctrl and press 1 while the squad is selected." = "Halte Ctrl und drücke 1, während der Trupp ausgewählt ist."
"The enemy has an outpost at the marked place. Fight is attack-move: units walk there and take on whatever they meet on the way. Press {fight}, then click near the outpost." = "Der Feind hat einen Außenposten an der markierten Stelle. Kämpfen ist eine Angriffsbewegung: Einheiten gehen dorthin und nehmen es mit allem auf, was ihnen unterwegs begegnet. Drücke {fight} und klicke dann in die Nähe des Außenpostens."
"Select the squad first (press 1). Then press {fight}, or the Fight button among the orders, and click on the ground by the marked ring." = "Wähle zuerst den Trupp aus (drücke 1). Drücke dann {fight} oder die Schaltfläche Kämpfen bei den Befehlen und klicke am markierten Ring auf den Boden."
"Destroy every building of the outpost. Its laser tower hits hard: keep the squad together, and queue reinforcements at the lab if you need them." = "Zerstöre jedes Gebäude des Außenpostens. Sein Laserturm trifft hart: Halte den Trupp zusammen und reihe im Labor Verstärkung ein, wenn du sie brauchst."
"Losing the fight? Pull the squad back, queue more Peewees at the lab and go in again with all of them together." = "Verlierst du den Kampf? Ziehe den Trupp zurück, reihe im Labor weitere Peewees ein und greife dann mit allen zusammen erneut an."
"The outpost is gone. The wrecks it left are worth metal: builders reclaim them (next lesson). Lesson complete!" = "Der Außenposten ist weg. Seine Wracks sind Metall wert: Konstrukteure recyceln sie (nächste Lektion). Lektion abgeschlossen!"
"ORDERS LIKE A VETERAN" = "BEFEHLE WIE EIN VETERAN"
"Map views, area orders, building blocks and build queues." = "Kartenansichten, Gebietsbefehle, Gebäudeblöcke und Baulisten."
"Map overlays" = "Kartenebenen"
"Area orders" = "Gebietsbefehle"
"Building blocks" = "Gebäudeblöcke"
"Build queues" = "Baulisten"
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again. The MAP menu at the top right does the same." = "Die Karte zeigt, was der Boden verbirgt. Drücke {overlay_metal} für die Metallkarte ({overlay_path} zeigt, wohin Einheiten können, {overlay_height} die Höhen, {overlay_sight} Sicht und Radar); dieselbe Taste blendet sie wieder aus. Das Menü KARTE oben rechts kann dasselbe."
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again." = "Die Karte zeigt, was der Boden verbirgt. Drücke {overlay_metal} für die Metallkarte ({overlay_path} zeigt, wohin Einheiten können, {overlay_height} die Höhen, {overlay_sight} Sicht und Radar); dieselbe Taste blendet sie wieder aus."
"Press {overlay_metal}: the metal deposits light up all over the map." = "Drücke {overlay_metal}: Die Metallvorkommen leuchten auf der ganzen Karte auf."
"Select the Commander, press {area_mex} and drag a circle over the marked deposits: every metal spot inside gets an extractor, nearest first. A plain click takes the metal around the cursor." = "Wähle den Kommandanten aus, drücke {area_mex} und ziehe einen Kreis über die markierten Vorkommen: Jedes Metallvorkommen darin bekommt einen Extraktor, das nächste zuerst. Ein einfacher Klick nimmt das Metall rund um den Cursor."
"With the Commander selected, press {area_mex}, then press on the ground over the deposits and drag outwards: the circle grows as you drag." = "Drücke bei ausgewähltem Kommandanten {area_mex}, halte dann über den Vorkommen die Maustaste gedrückt und ziehe nach außen: Der Kreis wächst, während du ziehst."
"Many orders work on areas. Press {reclaim} (reclaim) and drag a circle over the rocks near your base: the Commander turns every one into metal." = "Viele Befehle wirken auf Gebiete. Drücke {reclaim} (Recyceln) und ziehe einen Kreis über die Felsen nahe deiner Basis: Der Kommandant verwandelt jeden davon in Metall."
"Rocks and wrecks are worth metal. With the Commander selected, press {reclaim}, then press on the ground and drag the circle over a few rocks." = "Felsen und Wracks sind Metall wert. Drücke bei ausgewähltem Kommandanten {reclaim}, halte dann die Maustaste auf dem Boden gedrückt und ziehe den Kreis über ein paar Felsen."
"Hold Alt while you drag out a building to fill a whole block with it. Pick the Solar Collector, hold Alt and drag out a block of four or more." = "Halte Alt, während du ein Gebäude aufziehst, um einen ganzen Block damit zu füllen. Wähle den Solar Collector, halte Alt und ziehe einen Block aus vier oder mehr auf."
"Pick the Solar Collector, then hold Alt, press on the ground and drag: a block of outlines follows the pointer. Let go to place them all." = "Wähle den Solar Collector, halte dann Alt gedrückt, drücke die Maustaste auf dem Boden und ziehe: Ein Block aus Umrissen folgt dem Mauszeiger. Lass los, um sie alle zu setzen."
"The Commander's queued buildings show under BUILD QUEUE, beside its picture at the bottom of the screen. Click one to build it next (right-click drops it). A factory's queue works the same way." = "Die eingereihten Gebäude des Kommandanten erscheinen unter BAULISTE, neben seinem Bild unten am Bildschirm. Klicke eines an, um es als Nächstes zu bauen (Rechtsklick verwirft es). Die Bauliste einer Fabrik funktioniert genauso."
"The BUILD QUEUE shows while the Commander alone is selected and has buildings waiting. Click any but the first: that one is being built." = "Die BAULISTE erscheint, solange nur der Kommandant ausgewählt ist und Gebäude eingereiht hat. Klicke auf eines außer dem ersten: Das erste wird gerade gebaut."
"Area orders, building blocks and queues save you hundreds of clicks in a battle. Lesson complete!" = "Gebietsbefehle, Gebäudeblöcke und Baulisten ersparen dir in einer Schlacht Hunderte von Klicks. Lektion abgeschlossen!"
"HOLD THE LINE" = "STELLUNG HALTEN"
"Defences, radar, repairs, and the metal in wrecks." = "Abwehr, Radar, Reparaturen und das Metall in Wracks."
"Defences" = "Abwehr"
"Radar" = "Radar"
"Repairs" = "Reparaturen"
"Reclaiming wrecks" = "Wracks recyceln"
"Raiders will come from the marked direction. Build a Light Laser Tower (on the DEFENCE tab) in the marked ring: towers shoot whatever comes in range." = "Aus der markierten Richtung werden Plünderer kommen. Baue einen Light Laser Tower (Reiter ABWEHR) im markierten Ring: Türme schießen auf alles, was in Reichweite kommt."
"Raiders will come from the marked direction. Build a Light Laser Tower from the build menu in the marked ring: towers shoot whatever comes in range." = "Aus der markierten Richtung werden Plünderer kommen. Baue einen Light Laser Tower aus dem Baumenü im markierten Ring: Türme schießen auf alles, was in Reichweite kommt."
"The Light Laser Tower is a small gun on a post. Pick it, put it in the ring and wait for it to finish." = "Der Light Laser Tower ist ein kleines Geschütz auf einem Pfosten. Wähle ihn, setze ihn in den Ring und warte, bis er fertig ist."
"Build a Radar Tower (on the SENSORS tab) near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "Baue einen Radar Tower (Reiter ORTUNG) nahe deiner Basis. Radar zeigt Feinde als Punkte auf der Karte und der Minikarte, lange bevor deine Einheiten sie sehen."
"Build a Radar Tower from the build menu near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "Baue einen Radar Tower aus dem Baumenü nahe deiner Basis. Radar zeigt Feinde als Punkte auf der Karte und der Minikarte, lange bevor deine Einheiten sie sehen."
"The Radar Tower is a tall mast. Pick it, place it near the Commander and wait for it to finish." = "Der Radar Tower ist ein hoher Mast. Wähle ihn, setze ihn nahe dem Kommandanten und warte, bis er fertig ist."
"Here they come: raiders on your radar. Keep the Commander by the tower and let them come to you: together they hold the line." = "Da kommen sie: Plünderer auf deinem Radar. Halte den Kommandanten beim Turm und lass sie zu dir kommen: Gemeinsam halten Kommandant und Turm die Stellung."
"Do not chase them: the tower only fights what comes in range. Keep the Commander beside it; while it fights, the Commander can mend it ({repair}, then click the tower)." = "Jage ihnen nicht nach: Der Turm bekämpft nur, was in Reichweite kommt. Halte den Kommandanten neben ihm; während der Turm kämpft, kann der Kommandant ihn reparieren ({repair}, dann auf den Turm klicken)."
"The fight left a building damaged. Select the Commander, press {repair} and click it: builders mend what is damaged." = "Der Kampf hat ein Gebäude beschädigt. Wähle den Kommandanten aus, drücke {repair} und klicke es an: Konstrukteure reparieren, was beschädigt ist."
"With the Commander selected, press {repair}, then click the damaged building. Its health bar fills as it is mended." = "Drücke bei ausgewähltem Kommandanten {repair} und klicke dann auf das beschädigte Gebäude. Sein Lebensbalken füllt sich, während es repariert wird."
"The raiders left wrecks, and wrecks are worth metal. Select the Commander, press {reclaim} and click a wreck, or drag a circle over them all." = "Die Plünderer haben Wracks hinterlassen, und Wracks sind Metall wert. Wähle den Kommandanten aus, drücke {reclaim} und klicke auf ein Wrack oder ziehe einen Kreis über alle."
"Wrecks lie where the raiders fell. With the Commander selected, press {reclaim} and click one: the metal bar rises as it is taken apart." = "Die Wracks liegen dort, wo die Plünderer gefallen sind. Drücke bei ausgewähltem Kommandanten {reclaim} und klicke eines an: Der Metallbalken steigt, während es zerlegt wird."
"Towers hold ground while your army is elsewhere, radar sees what is coming, and builders mend and recycle. Lesson complete!" = "Türme halten die Stellung, während deine Armee anderswo ist, Radar sieht, was kommt, und Konstrukteure reparieren und recyceln. Lektion abgeschlossen!"
"BUILDERS AND FACTORIES" = "KONSTRUKTEURE UND FABRIKEN"
"Builders that help, factories that keep building, patrols and standing orders." = "Helfende Konstrukteure, unermüdliche Fabriken, Patrouillen und Dauerbefehle."
"Construction units" = "Konstrukteure"
"Helping a factory" = "Einer Fabrik helfen"
"Rally points" = "Sammelpunkte"
"Standing orders" = "Dauerbefehle"
"One builder is slow. Select the Kbot Lab and build a Construction Kbot: it builds what the Commander builds, and more besides." = "Ein einzelner Konstrukteur ist langsam. Wähle das Kbot Lab aus und baue einen Construction Kbot: Er baut, was der Kommandant baut, und noch mehr."
"Click the lab on the map to select it; the Construction Kbot is in its build menu. Wait for it to walk out." = "Klicke das Labor auf der Karte an, um es auszuwählen; der Construction Kbot ist in seinem Baumenü. Warte, bis er herausläuft."
"Builders help each other. Select the Construction Kbot, press {guard} and click the Kbot Lab: it lends the lab its build power, and the lab builds faster." = "Konstrukteure helfen einander. Wähle den Construction Kbot aus, drücke {guard} und klicke auf das Kbot Lab: Der Kbot leiht dem Labor seine Bauleistung, und das Labor baut schneller."
"With the Construction Kbot selected, press {guard}, then click the lab. It stays by the lab and helps with everything it makes." = "Drücke bei ausgewähltem Construction Kbot {guard} und klicke dann auf das Labor. Er bleibt beim Labor und hilft bei allem, was es baut."
"Factories send their units where you say. Select the Kbot Lab. {order_click} on open ground nearby: new units gather there." = "Fabriken schicken ihre Einheiten, wohin du willst. Wähle das Kbot Lab aus. {order_click} auf freies Gelände in der Nähe: Neue Einheiten sammeln sich dort."
"Select the lab first. With it selected, {order_click} on the ground where its units should gather." = "Wähle zuerst das Labor aus und lass es ausgewählt. {order_click} auf den Boden, wo sich seine Einheiten sammeln sollen."
"Turn on Repeat for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "Schalte für das Labor Wiederholen ein: Alles, was es fertigstellt, kommt wieder ans Ende seiner Bauliste, sodass es nie aufhört zu bauen."
"Turn on REPEAT BUILD for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "Schalte für das Labor DAUERBAU ein: Alles, was es fertigstellt, kommt wieder ans Ende seiner Bauliste, sodass es nie aufhört zu bauen."
"Select the lab, then turn Repeat on: the pointer shows where it is." = "Wähle das Labor aus und schalte dann Wiederholen ein: Der Pfeil zeigt dir, wo du klicken musst."
"Builders on patrol mend and reclaim whatever they pass. Select the Construction Kbot, press {patrol} and click on the far side of your base." = "Konstrukteure auf Patrouille reparieren und recyceln alles, woran sie vorbeikommen. Wähle den Construction Kbot aus, drücke {patrol} und klicke auf die andere Seite deiner Basis."
"With the Construction Kbot selected, press {patrol}, then click on the ground: it walks back and forth between there and where it stood." = "Drücke bei ausgewähltem Construction Kbot {patrol} und klicke dann auf den Boden: Er läuft zwischen dieser Stelle und seinem Ausgangspunkt hin und her."
"Units keep standing orders. Select your Peewees and set their fire order to Hold fire with the button beside the orders: they will not shoot until you say." = "Einheiten behalten Dauerbefehle bei. Wähle deine Peewees aus und stelle ihren Feuerbefehl mit der Schaltfläche neben den Befehlen auf Nicht feuern: Sie schießen erst, wenn du es befiehlst."
"Units keep standing orders. Select your Peewees and set their FIRE ORDERS to Hold fire: they will not shoot until you say." = "Einheiten behalten Dauerbefehle bei. Wähle deine Peewees aus und stelle ihre FEUERBEFEHLE auf Nicht feuern: Sie schießen erst, wenn du es befiehlst."
"Select the Peewees, then click the fire order button until it shows HOLD FIRE: each click is the next order." = "Wähle die Peewees aus und klicke dann so lange auf die Schaltfläche für den Feuerbefehl, bis sie NICHT FEUERN zeigt: Jeder Klick schaltet zum nächsten Befehl."
"You are ready for a skirmish: start against an Easy computer player, then Normal. {help} lists every key. Good hunting, Commander!" = "Du bist bereit für ein Gefecht: Beginne gegen einen Computerspieler auf Leicht, dann auf Normal. {help} listet alle Tasten auf. Gute Jagd, Kommandant!"

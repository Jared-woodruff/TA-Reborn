# apps/ta_game/scenarios/armageddon.toml
"Armageddon" = "Armageddon"
"Two armies, one plain, no retreat. Win the battle of the war." = "Zwei Armeen, eine Ebene, kein Rückzug. Gewinne die Schlacht des Krieges."
"Commander, the Core's main army is marching north across the Mounds, and ours stands in its way. There are no bases here, no factories, no reinforcements: what you have is all you will ever have.\n\nThey outnumber us. We outgun them. Put the Lugers and the Merls on their columns as they close, hold the line with the Zeus, and keep the Jethros with the tanks: they will bring gunships. Their reserves arrive two and a half minutes in.\n\nDestroy every one of them." = "Kommandant, die Hauptarmee des Core marschiert über die Mounds nach Norden, und unsere steht ihr im Weg. Hier gibt es keine Basen, keine Fabriken, keine Verstärkung: Was du hast, ist alles, was du je haben wirst.\n\nSie sind in der Überzahl. Wir haben die stärkeren Geschütze. Richte die Lugers und die Merls auf ihre Kolonnen, sobald sie näher kommen, halte die Linie mit den Zeus und lass die Jethros bei den Panzern: Sie werden Kampfhubschrauber mitbringen. Ihre Reserven treffen nach zweieinhalb Minuten ein.\n\nVernichte sie bis auf den Letzten."
"Arm Command" = "Arm-Kommando"
"Here they come. Hold the line, and keep the Jethros with the tanks." = "Da kommen sie. Haltet die Linie und lasst die Jethros bei den Panzern."
"Their reserves are coming up behind the mounds, a Goliath at their head." = "Ihre Reserven rücken hinter den Hügeln an, ein Goliath an ihrer Spitze."

# apps/ta_game/scenarios/armistice.toml
"The Armistice" = "Der Waffenstillstand"
"Five minutes of peace to build an army. Then the war resumes." = "Fünf Minuten Frieden, um eine Armee aufzubauen. Dann geht der Krieg weiter."
"Commander, the peace talks on Reactor Grid have failed. The armistice holds for five more minutes: until then no weapon may fire, and neither side may build near the other's base. When it ends, the war resumes.\n\nBoth sides are rearming at a furious pace: resources and construction run at twice their usual speed, and the treaty's one lasting clause bans missile silos. Their Commander knows the clock as well as you do.\n\nBuild as you have never built. When the armistice ends, destroy the Core Commander." = "Kommandant, die Friedensgespräche auf Reactor Grid sind gescheitert. Der Waffenstillstand hält noch fünf Minuten: Bis dahin darf keine Waffe feuern, und keine Seite darf nahe der Basis der anderen bauen. Wenn er endet, geht der Krieg weiter.\n\nBeide Seiten rüsten in rasendem Tempo auf: Ressourcen und Bau laufen doppelt so schnell wie sonst, und die einzige bleibende Klausel des Vertrags verbietet Raketensilos. Ihr Kommandant kennt die Uhr so gut wie du.\n\nBaue, wie du noch nie gebaut hast. Wenn der Waffenstillstand endet, zerstöre den Core-Kommandanten."
"The talks have failed. For five minutes no weapon fires and nobody builds near the other's base. Then it is war: build as you have never built." = "Die Gespräche sind gescheitert. Fünf Minuten lang feuert keine Waffe, und niemand baut nahe der Basis des anderen. Dann ist Krieg: Baue, wie du noch nie gebaut hast."
"Their factories are running day and night. Ours should be too." = "Ihre Fabriken laufen Tag und Nacht. Unsere sollten es auch."
"Core Overseer" = "Core-Aufseher"
"Ten seconds, Arm. We have counted every one of your factories." = "Zehn Sekunden, Arm. Wir haben jede einzelne deiner Fabriken gezählt."
"Their Commander is somewhere in that grid. Find it, and end this war for good." = "Ihr Kommandant ist irgendwo in diesem Gitter. Finde ihn und beende diesen Krieg für immer."

# apps/ta_game/scenarios/brothers_in_arms.toml
"Brothers in Arms" = "Waffenbrüder"
"You and an allied Commander against two of the Core's." = "Du und ein verbündeter Kommandant gegen zwei des Core."
"Commander, you are not alone on Highland Rift. Commander Holt's forces hold the river crossings in the north, beside yours in the north-western highlands. Two Core Commanders are dug in to the south, across the canyon.\n\nHolt's computer will fight its own war, but it is the same war: back it up when it is hard pressed, and it will do the same for you. Your forces see what its forces see.\n\nDestroy both Core Commanders. Keep yours alive." = "Kommandant, du bist auf Highland Rift nicht allein. Kommandant Holts Truppen halten die Flussübergänge im Norden, neben deinen im nordwestlichen Hochland. Zwei Core-Kommandanten haben sich im Süden eingegraben, jenseits des Canyons.\n\nHolts Computer führt seinen eigenen Krieg, aber es ist derselbe Krieg: Unterstütze ihn, wenn er in Bedrängnis ist, und er wird dasselbe für dich tun. Deine Truppen sehen, was seine Truppen sehen.\n\nZerstöre beide Core-Kommandanten. Halte deinen am Leben."
"Commander Holt" = "Kommandant Holt"
"Good to have you on the line. I'll hold the river crossings in the north; you take the western highlands." = "Gut, dich in der Leitung zu haben. Ich halte die Flussübergänge im Norden; du nimmst das westliche Hochland."
"My scouts have found both of their bases. The south-western one is yours; I'll keep the other busy." = "Meine Späher haben beide Basen gefunden. Die im Südwesten gehört dir; ich halte die andere beschäftigt."
"They're massing at the canyon. If they come for one of us, the other hits them from the side." = "Sie sammeln sich am Canyon. Wenn sie einen von uns angreifen, fällt ihnen der andere in die Flanke."
"Still with me? Then let's finish it. Everything we have, at their Commanders." = "Noch bei mir? Dann bringen wir es zu Ende. Alles, was wir haben, auf ihre Kommandanten."

# apps/ta_game/scenarios/decapitation.toml
"Kill the Core Commander on his island fortress. From the air." = "Töte den Core-Kommandanten in seiner Inselfestung. Aus der Luft."
"Commander, a Core Commander has made his fortress on the island at the centre of this lava sea. Nothing on treads or legs will reach him, and his anti-air is the best the Core can build.\n\nYou have a small air wing and a forward airfield in the south-west corner: build it up. Strip away his air defences, then send the bombers in; a handful sent straight at him will not get through. Brawler gunships hit hard but die fast over flak, and the Freedom Fighters can keep his fighters off your bombers.\n\nHis reinforcements arrive in fifteen minutes. Before then, he must be dead." = "Kommandant, ein Core-Kommandant hat sich auf der Insel in der Mitte dieses Lavameers eine Festung gebaut. Nichts auf Ketten oder Beinen wird ihn erreichen, und seine Flugabwehr ist die beste, die der Core bauen kann.\n\nDu hast eine kleine Fliegerstaffel und ein vorgeschobenes Flugfeld in der Südwestecke: Baue es aus. Schalte seine Luftabwehr aus und schicke dann die Bomber hinein; eine Handvoll, die direkt auf ihn zufliegt, kommt nicht durch. Brawler-Kampfhubschrauber treffen hart, gehen im Flakfeuer aber schnell zu Bruch, und die Freedom Fighters können seine Jäger von deinen Bombern fernhalten.\n\nSeine Verstärkung trifft in fünfzehn Minuten ein. Bis dahin muss er tot sein."

# apps/ta_game/scenarios/doomsday_clock.toml
"Doomsday Clock" = "Weltuntergangsuhr"
"The Core's missile launches in fifteen minutes. Stop it." = "Die Rakete des Core startet in fünfzehn Minuten. Halte sie auf."
"Commander, a Silencer nuclear silo stands at the heart of the Core base across these metal plains, and it is arming. In fifteen minutes the missile flies, and your base is the target.\n\nDestroy the silo. Nothing else matters: not their Commander, not their factories. The silo sits behind heavy laser towers and a Punisher battery, and their Commander will not sit still while you come for it.\n\nYou have a base, two factories and two construction kbots. The clock is running." = "Kommandant, ein Silencer-Atomsilo steht im Herzen der Core-Basis jenseits dieser Metallebenen, und es wird scharfgemacht. In fünfzehn Minuten fliegt die Rakete, und deine Basis ist das Ziel.\n\nZerstöre das Silo. Nichts anderes zählt: nicht ihr Kommandant, nicht ihre Fabriken. Das Silo liegt hinter schweren Lasertürmen und einer Punisher-Batterie, und ihr Kommandant wird nicht tatenlos zusehen, während du darauf vorrückst.\n\nDu hast eine Basis, zwei Fabriken und zwei Konstruktions-Kbots. Die Uhr läuft."
"Ten minutes to launch, Commander." = "Zehn Minuten bis zum Start, Kommandant."
"Five minutes to launch. That silo has to go." = "Fünf Minuten bis zum Start. Dieses Silo muss weg."
"One minute! Get to that silo!" = "Eine Minute! Hin zu diesem Silo!"

# apps/ta_game/scenarios/endless_siege.toml
"Endless Siege" = "Endlose Belagerung"
"The waves never stop. Survive as long as you can." = "Die Wellen hören nie auf. Überlebe, so lange du kannst."
"Commander, there is no rescue coming, no reinforcements, no victory. The Core has found your outpost in the mesas and will throw everything it has at it, from three directions, for as long as it takes.\n\nKbots, then tanks, then artillery and bombers; heavier every time, and now and then something enormous. Build an economy, build defences, and hold on.\n\nYour best time is kept. Beat it." = "Kommandant, es kommt keine Rettung, keine Verstärkung, kein Sieg. Der Core hat deinen Außenposten in den Tafelbergen entdeckt und wird alles, was er hat, dagegen werfen, aus drei Richtungen, so lange es eben dauert.\n\nKbots, dann Panzer, dann Artillerie und Bomber; jedes Mal schwerer, und hin und wieder etwas Gewaltiges. Baue eine Wirtschaft auf, baue Verteidigungsanlagen und halte durch.\n\nDeine Bestzeit wird gespeichert. Schlag sie."

# apps/ta_game/scenarios/extraction.toml
"Extraction" = "Evakuierung"
"Get your Commander down the lava river to the pick-up point." = "Bringe deinen Kommandanten den Lavafluss hinab zum Abholpunkt."
"Commander, your drop went wrong. You are on the south bank of a river of lava at the western end of the Run, with what is left of your escort, and the dropships can only land at the far eastern end.\n\nThe Core has guns all along the north bank, and patrols on your side of the river. Keep away from the lava's edge (their laser towers reach no further), deal with the patrols, and get your Commander to the pick-up point. Whatever guards it will not come to you. Core troops are already following your tracks; do not stop for long.\n\nAnything else is expendable. Your Commander is not." = "Kommandant, dein Absprung ist schiefgegangen. Du bist mit dem, was von deiner Eskorte übrig ist, am Südufer eines Lavaflusses am Westende des Run, und die Landungsschiffe können nur ganz am östlichen Ende landen.\n\nDer Core hat Geschütze entlang des gesamten Nordufers und Patrouillen auf deiner Seite des Flusses. Halte dich vom Rand der Lava fern (weiter reichen ihre Lasertürme nicht), erledige die Patrouillen und bringe deinen Kommandanten zum Abholpunkt. Was ihn bewacht, wird nicht zu dir kommen. Core-Truppen folgen bereits deinen Spuren; bleib nicht lange stehen.\n\nAlles andere ist entbehrlich. Dein Kommandant nicht."

# apps/ta_game/scenarios/iron_rain.toml
"Iron Rain" = "Eisenregen"
"Two Intimidators are shelling your base. Take the mesa and silence them." = "Zwei Intimidators beschießen deine Basis. Nimm das Plateau und bring sie zum Schweigen."
"Commander, the Core has hauled two Intimidators, its long-range plasma cannons, onto the mesas in the middle of the canyon. Your base is inside their range. Every eight seconds each of them will put a shell among your buildings, until you silence them.\n\nThe battery is dug in behind heavy laser towers and a Punisher, with tanks on the ramps, and the Core's main base lies beyond it, to the south-east. Its Commander will send what it can.\n\nSpread out, build fast and take that mesa. Destroy both Intimidators." = "Kommandant, der Core hat zwei Intimidators, seine Langstrecken-Plasmakanonen, auf die Tafelberge mitten im Canyon geschafft. Deine Basis liegt in ihrer Reichweite. Alle acht Sekunden setzt jede von ihnen eine Granate zwischen deine Gebäude, bis du sie zum Schweigen bringst.\n\nDie Batterie ist hinter schweren Lasertürmen und einem Punisher eingegraben, Panzer stehen auf den Rampen, und die Hauptbasis des Core liegt dahinter, im Südosten. Ihr Kommandant wird schicken, was er kann.\n\nVerteile dich, baue schnell und nimm das Plateau. Zerstöre beide Intimidators."
"Commander, two Intimidators on the mesas have your range. Every eight seconds each of them will put a shell into your base." = "Kommandant, zwei Intimidators auf den Tafelbergen haben deine Basis im Visier. Alle acht Sekunden setzt jede von ihnen eine Granate in deine Basis."
"A Core radar post in the canyon to the south-east is spotting for those guns. Knock it out and they can no longer see your base." = "Ein Radarposten des Core im Canyon im Südosten lenkt das Feuer dieser Geschütze. Schalte ihn aus, dann können sie deine Basis nicht mehr sehen."
"Spread your buildings out: a shell that lands among them takes them all." = "Verteile deine Gebäude: Eine Granate, die zwischen ihnen einschlägt, nimmt sie alle mit."
"Their gunners have your range now. Take that mesa, Commander!" = "Ihre Kanoniere haben sich jetzt eingeschossen. Nimm das Plateau, Kommandant!"

# apps/ta_game/scenarios/king_of_the_hill.toml
"King of the Hill" = "König des Berges"
"Hold the summit for four minutes before the Core does." = "Halte den Gipfel vier Minuten lang, bevor der Core es tut."
"Commander, the spiral mountain at the heart of this plain is rich in metal, and whoever holds its summit holds the planet. A Core Commander has landed to the north with the same idea.\n\nTake the summit and keep it: four minutes in all with only your forces on top wins it. Contested, the clock stands still. If the Core holds it alone for four minutes, the mountain is theirs.\n\nThe Core will keep sending troops up the slopes. Build up, get there first, and dig in." = "Kommandant, der Spiralberg im Herzen dieser Ebene ist reich an Metall, und wer seinen Gipfel hält, hält den Planeten. Ein Core-Kommandant ist im Norden gelandet, mit derselben Absicht.\n\nNimm den Gipfel und halte ihn: Insgesamt vier Minuten, in denen nur deine Truppen oben stehen, bringen den Sieg. Ist er umkämpft, steht die Uhr still. Hält der Core ihn vier Minuten lang allein, gehört der Berg ihm.\n\nDer Core wird immer wieder Truppen die Hänge hinaufschicken. Baue auf, sei als Erster oben und grab dich ein."
"Core troops are climbing the north slope. Don't let them dig in on the summit." = "Core-Truppen erklimmen den Nordhang. Lass sie sich nicht auf dem Gipfel eingraben."
"Raiders are coming round the mountain for your base." = "Plünderer kommen um den Berg herum auf deine Basis zu."

# apps/ta_game/scenarios/last_stand.toml
"Last Stand" = "Letztes Gefecht"
"Hold the pass for twelve minutes. They will not stop coming." = "Halte den Pass zwölf Minuten lang. Der Ansturm reißt nicht ab."
"Commander, the Core has broken through at Varrin Gap. The only way into the valley behind you is the winding pass ahead, and your outpost at its western mouth is all that stands in the way.\n\nReinforcements are twelve minutes out. Hold until they arrive. Core forces will come through the pass in waves, each heavier than the last; expect bombers, and expect worse at the end: our scouts have seen something very large moving in the east.\n\nYou have a small base, a kbot lab and two construction kbots. Build what you can. Keep your Commander alive." = "Kommandant, der Core ist bei Varrin Gap durchgebrochen. Der einzige Weg in das Tal hinter dir ist der gewundene Pass vor dir, und dein Außenposten an seinem westlichen Eingang ist alles, was sich dem Core noch in den Weg stellt.\n\nDie Verstärkung ist zwölf Minuten entfernt. Halte durch, bis sie eintrifft. Core-Truppen werden in Wellen durch den Pass kommen, jede schwerer als die vorige; rechne mit Bombern und am Ende mit Schlimmerem: Unsere Späher haben im Osten etwas sehr Großes gesehen, das sich bewegt.\n\nDu hast eine kleine Basis, ein Kbot-Labor und zwei Konstruktions-Kbots. Baue, was du kannst. Halte deinen Kommandanten am Leben."
"Outpost, this is Arm Command. The relief force is twelve minutes out. Nothing gets through that pass before it arrives." = "Außenposten, hier Arm-Kommando. Die Verstärkung ist zwölf Minuten entfernt. Nichts kommt durch diesen Pass, bevor sie da ist."
"Radar: aircraft inbound from the east. Bombers! Get your anti-air up." = "Radar: Flugzeuge im Anflug aus dem Osten. Bomber! Bring deine Flugabwehr in Stellung."
"Seismic contact in the pass. It's the big one, Commander: a Krogoth." = "Seismischer Kontakt im Pass. Das ist der große, Kommandant: ein Krogoth."
"One minute! The relief force is entering the valley." = "Eine Minute! Die Verstärkung rückt ins Tal ein."

# apps/ta_game/scenarios/metal_rush.toml
"The first to make 15,000 metal wins. The Core plays rough." = "Wer zuerst 15.000 Metall produziert, gewinnt. Der Core kämpft mit harten Bandagen."
"Commander, the mining rights to this planet go to whoever proves they can work it: the first side to extract fifteen thousand metal wins it outright.\n\nThe Core is racing you from the western plateau, and the Core has never been known to race fair. Expect raids on your extractors. Build fast, protect your economy, and if you can, take theirs apart.\n\nMetal makers count. Reclaimed metal counts. Whatever you make, counts." = "Kommandant, die Schürfrechte für diesen Planeten gehen an den, der beweist, dass er ihn ausbeuten kann: Die erste Seite, die fünfzehntausend Metall fördert, bekommt ihn ganz.\n\nDer Core liefert sich vom westlichen Plateau aus ein Wettrennen mit dir, und fair hat der Core noch nie gespielt. Rechne mit Überfällen auf deine Extraktoren. Baue schnell, schütze deine Wirtschaft und nimm, wenn du kannst, seine auseinander.\n\nMetallerzeuger zählen. Recyceltes Metall zählt. Alles, was du produzierst, zählt."

# apps/ta_game/scenarios/titans.toml
"Titans" = "Titanen"
"Three Krogoths are walking toward your base. Bring them down." = "Drei Krogoths marschieren auf deine Basis zu. Bring sie zu Fall."
"Commander, seismic stations round the basin are reading footfalls: three Krogoths, the Core's walking fortresses, are crossing the salt pans toward your base, one after another, each with an escort.\n\nNothing out there can stop them but you. A Krogoth's head laser reaches further than your D-gun, so keep your Commander back. Bombers, artillery and massed Zeus will bring one down. Lose your nerve and it will walk through your base.\n\nYou have a base with three factories, four construction kbots and a garrison. Destroy all three of them." = "Kommandant, seismische Stationen rund um das Becken messen Schritte: Drei Krogoths, die wandelnden Festungen des Core, überqueren die Salzpfannen auf deine Basis zu, einer nach dem anderen, jeder mit Eskorte.\n\nNichts da draußen kann sie aufhalten außer dir. Der Kopflaser eines Krogoths reicht weiter als deine D-Gun, also halte deinen Kommandanten zurück. Bomber, Artillerie und Zeus in Massen bringen einen zu Fall. Verlierst du die Nerven, marschiert er mitten durch deine Basis.\n\nDu hast eine Basis mit drei Fabriken, vier Konstruktions-Kbots und eine Garnison. Zerstöre alle drei."
"Commander, seismic stations are reading footfalls round the basin. Three Krogoths are walking toward your base, one after another." = "Kommandant, seismische Stationen messen Schritte rund um das Becken. Drei Krogoths marschieren auf deine Basis zu, einer nach dem anderen."
"The first Krogoth has crossed the north-western rim. It is coming straight for you." = "Der erste Krogoth hat den nordwestlichen Rand überquert. Er kommt direkt auf dich zu."
"Keep your Commander back: that head laser reaches further than your D-gun." = "Halte deinen Kommandanten zurück: Dieser Kopflaser reicht weiter als deine D-Gun."
"The second Krogoth is through the northern pass, with rockets and anti-air round it." = "Der zweite Krogoth ist durch den nördlichen Pass, mit Raketen und Flugabwehr um sich."
"The last of them, out of the north-east, with the heaviest escort yet. End this, Commander." = "Der letzte von ihnen, aus dem Nordosten, mit der bisher schwersten Eskorte. Mach ein Ende, Kommandant."

# apps/ta_game/scenarios/until_dawn.toml
"Until Dawn" = "Bis zum Morgengrauen"
"Night falls on the timber. Hold your ridge until the sun comes up." = "Die Nacht fällt über den Wald. Halte deinen Kamm, bis die Sonne aufgeht."
"Commander, night is falling over Timberline, and the Core is moving through the forest under it. Your outpost holds the western ridge: the only road out of the valley runs past it.\n\nThe relief column cannot move before first light. Until then you are on your own. In the dark and the rain their raiders will be on you before you see them, so build radar, and keep your floodlights burning.\n\nYou have a small base, a kbot lab and two construction kbots. Hold until dawn, and keep your Commander alive." = "Kommandant, die Nacht senkt sich über Timberline, und der Core zieht in ihrem Schutz durch den Wald. Dein Außenposten hält den westlichen Kamm: Die einzige Straße aus dem Tal führt an ihm vorbei.\n\nDie Entsatzkolonne kann sich vor dem ersten Licht nicht rühren. Bis dahin bist du auf dich allein gestellt. In Dunkelheit und Regen sind ihre Plünderer über dir, bevor du sie siehst – also baue Radar und lass deine Flutlichter brennen.\n\nDu hast eine kleine Basis, ein Kbot Lab und zwei Konstruktions-Kbots. Halte bis zum Morgengrauen durch und halte deinen Kommandanten am Leben."
"Outpost Echo, the Core is moving through the timber tonight. Hold your ridge until first light: the relief column marches at dawn." = "Außenposten Echo, der Core zieht heute Nacht durch den Wald. Haltet euren Kamm bis zum ersten Licht: Die Entsatzkolonne marschiert im Morgengrauen."
"Raiders in the eastern trees. In this rain you will hear them before you see them." = "Plünderer in den östlichen Wäldern. Bei diesem Regen hörst du sie, bevor du sie siehst."
"Pyros in the north-eastern woods. Keep them out of the trees round your base: the timber will burn." = "Pyros in den nordöstlichen Wäldern. Halte sie von den Bäumen um deine Basis fern: Das Holz wird brennen."
"A convoy got through from the south-west. Four Zeus and two Jethros are yours, Commander." = "Ein Konvoi ist aus dem Südwesten durchgekommen. Vier Zeus und zwei Jethros gehören dir, Kommandant."
"Seismic contact in the south-east: heavy treads. They are saving the worst for the last hours of the night." = "Seismischer Kontakt im Südosten: schwere Ketten. Sie heben sich das Schlimmste für die letzten Stunden der Nacht auf."
"Sunrise in one minute. The relief column is at the river. Hold on!" = "Sonnenaufgang in einer Minute. Die Entsatzkolonne ist am Fluss. Haltet durch!"


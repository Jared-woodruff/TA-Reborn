# apps/ta_game/src/coach.rs
"Your Commander is badly hurt! Pull it back out of the fight: losing it usually loses the battle." = "Dein Kommandant ist schwer angeschlagen! Ziehe ihn aus dem Kampf zurück: Wer ihn verliert, verliert meist die Schlacht."
"Energy is running out, and everything builds more slowly. Build Solar Collectors or Wind Generators, and build less at once until it recovers." = "Die Energie geht zur Neige, und alles wird langsamer gebaut. Baue Solarkollektoren oder Windgeneratoren und baue weniger auf einmal, bis sich die Energie erholt hat."
"Metal is running out, and everything builds more slowly. Put Metal Extractors on more deposits ({area_mex} takes a whole area), or reclaim wrecks and rocks ({reclaim})." = "Das Metall geht zur Neige, und alles wird langsamer gebaut. Setze Metallextraktoren auf weitere Vorkommen ({area_mex} bebaut ein ganzes Gebiet) oder recycle Wracks und Felsen ({reclaim})."
"No factory yet: factories make your army. Your Commander can build a Kbot Lab or a Vehicle Plant." = "Noch keine Fabrik: Fabriken bauen deine Armee. Dein Kommandant kann ein Kbot Lab oder eine Vehicle Plant bauen."
"A factory has nothing to build. {idle_factory} selects it: queue some units, and turn on Repeat to keep it busy." = "Eine Fabrik hat nichts zu bauen. {idle_factory} wählt sie aus: Reihe ein paar Einheiten ein und schalte Wiederholen ein, damit sie ausgelastet bleibt."
"Builders stand idle. {idle_builder} selects the next one: give it something to build, or send it to help a factory ({guard})." = "Konstrukteure stehen untätig herum. {idle_builder} wählt den nächsten aus: Gib ihm etwas zu bauen oder schicke ihn einer Fabrik zu Hilfe ({guard})."
"Your metal store is full, so new metal goes to waste. Spend it: another factory, more builders, more units." = "Dein Metallspeicher ist voll, also geht neues Metall verloren. Gib es aus: eine weitere Fabrik, mehr Konstrukteure, mehr Einheiten."

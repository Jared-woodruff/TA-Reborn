"[{section}] needs a faction name and starting commander." = "[{section}] braucht einen Fraktionsnamen und einen Startkommandanten."
"Set name and commander to a valid faction and UnitName." = "Setze name und commander auf eine gültige Fraktion und einen gültigen UnitName."
"{name} starting commander" = "{name}-Startkommandant"
"Owner of a build list for the computer players" = "Besitzer einer Bauoptionsliste für die Computerspieler"
"{name} build option for the computer players" = "{name}-Bauoption für die Computerspieler"
"Download build-menu owner" = "Besitzer des Download-Baumenüs"
"{name} build option" = "{name}-Bauoption"
"Missing [GlobalHeader]; this map has no usable metadata." = "[GlobalHeader] fehlt; diese Karte hat keine brauchbaren Metadaten."
"Export a matching OTA with a GlobalHeader and the desired game-type schemas." = "Exportiere eine passende OTA mit einem GlobalHeader und den gewünschten Spielart-Schemata."
"Map terrain, without which the map is left out of the lists" = "Kartengelände, ohne das die Karte in den Listen fehlt"
"Map meteor weapon" = "Meteorwaffe der Karte"
"Map placed unit/feature" = "Auf der Karte platzierte Einheit oder platziertes Objekt"
"This tolerant TDF parse contains no sections; section-based consumers ignore it." = "Diese tolerante TDF-Auswertung enthält keine Abschnitte; abschnittsbasierte Verbraucher ignorieren sie."
"Check the intended format and section headers if this file should define game content." = "Prüfe das vorgesehene Format und die Abschnittsköpfe, wenn diese Datei Spielinhalte definieren soll."
"{what} defined here is never used: {later} ({whose}) defines it too and comes later, so the game uses that one." = "{what} hier definiert, wird nie verwendet: {later} ({whose}) definiert es ebenfalls und kommt später, daher verwendet das Spiel jene Definition."
"{n} definitions in this file are never used: other files define them too and come later, so the game uses those (for one, {what} is also in {later}, {whose})." = "{n} Definitionen in dieser Datei werden nie verwendet: Andere Dateien definieren sie ebenfalls und kommen später, daher verwendet das Spiel jene (so ist {what} auch in {later}, {whose})."
"Replace those files in the mod (give yours their paths), or name your file so that it sorts after them." = "Ersetze diese Dateien in der Mod (gib deinen ihre Pfade) oder benenne deine Datei so, dass sie danach einsortiert wird."
"{name} production button" = "{name}-Produktionsschaltfläche"
"No playable side definitions were loaded." = "Es wurden keine spielbaren Seitendefinitionen geladen."
"Include gamedata/sidedata.tdf or inherit the base game's valid sides." = "Lege gamedata/sidedata.tdf bei oder übernimm die gültigen Seiten des Basisspiels."
"Include the referenced asset/definition, correct its name, or declare and install the required mod dependency. Names are case-insensitive." = "Lege die referenzierte Datei oder Definition bei, korrigiere ihren Namen oder gib die benötigte Mod-Abhängigkeit an und installiere sie. Namen unterscheiden nicht zwischen Groß- und Kleinschreibung."
"Model texture: textures {names} are missing." = "Modelltextur: Die Texturen {names} fehlen."
"{whats}: {what} is an empty file here, which blanks it out: nothing of it is read." = "{whats}: {what} ist hier eine leere Datei, die sie ausblendet: Nichts davon wird gelesen."
"{whats}: {what} is missing." = "{whats}: {what} fehlt."
"Referenced weapon explosions require at least {texels} padded sprite texels, beyond a {side} x {side} reference atlas, even drawn reduced. Frames will be omitted at this capacity; map features, generated effects and shelf packing need additional room." = "Die verwendeten Waffenexplosionen brauchen mindestens {texels} gepolsterte Sprite-Texel, mehr als ein Referenzatlas von {side} x {side}, selbst verkleinert gezeichnet. Bei dieser Kapazität werden Frames ausgelassen; Kartenobjekte, erzeugte Effekte und die Regalpackung brauchen zusätzlichen Platz."
"Reduce explosion frame sizes/counts or split optional effects. Test on the target GPU; this static check uses a reference atlas size." = "Verringere Größe oder Zahl der Explosions-Frames oder teile optionale Effekte auf. Teste auf der Ziel-GPU; diese statische Prüfung verwendet eine Referenz-Atlasgröße."
"{what} has no frames or contains a frame larger than the {side}-pixel reference atlas side including padding." = "{what} hat keine Frames oder enthält einen Frame, der größer ist als die Seite des Referenzatlas von {side} Pixeln einschließlich Polsterung."
"Include usable frames and resize oversized animation frames." = "Lege brauchbare Frames bei und verkleinere zu große Animations-Frames."
"{name} ({px} px)" = "{name} ({px} px)"
"{n} more" = "{n} weitere"
"The weapons' explosions take {full} Mi texels as painted, more than the {budget} Mi the game gives them in a {side} x {side} atlas: {n} of them, larger than TA's own, are drawn reduced to {share}% of their texels across, each as big as painted ({named})." = "Die Explosionen der Waffen brauchen wie gemalt {full} Mi Texel, mehr als die {budget} Mi, die das Spiel ihnen in einem Atlas von {side} x {side} gibt: {n} davon, größer als die von TA selbst, werden auf {share}% ihrer Texel in der Breite verkleinert gezeichnet, jede so groß wie gemalt ({named})."
"Nothing to do: the game draws them so. Smaller paintings would keep more of their detail." = "Nichts zu tun: Das Spiel zeichnet sie so. Kleinere Bilder würden mehr Details behalten."
"Large: {frames} frames up to {largest} pixels across, {millions} million pixels in all, more than the game decodes at once. It reads them a frame at a time and draws them reduced, each as big as painted: a weapon's explosion is read so." = "Groß: {frames} Frames bis zu {largest} Pixeln Breite, insgesamt {millions} Millionen Pixel, mehr als das Spiel auf einmal dekodiert. Es liest sie Frame für Frame und zeichnet sie verkleinert, jede so groß wie gemalt: So wird die Explosion einer Waffe gelesen."
"Nothing to do: the game draws it so. Smaller paintings would load faster and keep more of their detail." = "Nichts zu tun: Das Spiel zeichnet sie so. Kleinere Bilder würden schneller laden und mehr Details behalten."
"Build lists for the computer players (TA 3.1's [CANBUILD]). Builders: {builders}; entries: {entries}." = "Bauoptionslisten für die Computerspieler ([CANBUILD] aus TA 3.1). Konstrukteure: {builders}; Einträge: {entries}."
"Computer players build from them. Build menus offer what the mod's menu pages and download lists put on them, as TA's did: what only these lists name is the computer players' alone." = "Die Computerspieler bauen nach diesen Listen. Die Baumenüs bieten an, was die Menüseiten und Download-Listen der Mod auf sie setzen, wie bei TA: Was nur diese Listen nennen, bleibt den Computerspielern vorbehalten."
"Side panels laid out for a screen {height} pixels tall, as the patched engines of later years drew them (TA's are 480). Pages: {pages}." = "Seitenpanels, ausgelegt für einen {height} Pixel hohen Bildschirm, wie die gepatchten Engines späterer Jahre sie zeichneten (bei TA sind es 480). Seiten: {pages}."
"The classic interface lays them out as the mod does: its build places, page arrows and orders where the mod puts them." = "Die klassische Oberfläche ordnet sie an wie die Mod: die Felder der Bauschaltflächen, die Seitenpfeile und die Befehle dort, wo die Mod sie hinsetzt."
"Build buttons off TA's grid of 64-pixel places: several sharing a place, or one taking several. Buttons: {buttons}; pages: {pages}." = "Bauschaltflächen abseits des 64-Pixel-Rasters von TA: mehrere teilen sich ein Feld, oder eine belegt mehrere. Schaltflächen: {buttons}; Seiten: {pages}."
"The classic interface lays them out as the mod does, and a click builds the unit of the button under it. The modern interface shows a place several buttons share as one picture, its parts marked." = "Die klassische Oberfläche ordnet sie an wie die Mod, und ein Klick baut die Einheit der Schaltfläche darunter. Die moderne Oberfläche zeigt ein Feld, das sich mehrere Schaltflächen teilen, als ein Bild mit markierten Teilen."
"Scripts asking the engine for unit values of TA's later patches ({values}). Scripts: {scripts}." = "Skripte, die die Engine nach Einheitenwerten späterer TA-Patches fragen ({values}). Skripte: {scripts}."
"TA Reborn answers them as those engines did: TA 3.1's questions about units by their IDs (69 to 75), a later patch's cloak (111)." = "TA Reborn beantwortet sie wie jene Engines: die Fragen von TA 3.1 zu Einheiten anhand ihrer IDs (69 bis 75), die Tarnung eines späteren Patches (111)."
"TA Reborn finds a weapon by its name and never reads its ID: IDs make no difference here." = "TA Reborn findet eine Waffe über ihren Namen und liest nie ihre ID: IDs spielen hier keine Rolle."
"Weapon IDs past 255, the highest TA's own engine numbered (the weapon patches of later years went further). Weapons: {n}; the highest ID: {max}." = "Waffen-IDs über 255, der höchsten Nummer, die die ursprüngliche Engine von TA vergab (die Waffen-Patches späterer Jahre gingen darüber hinaus). Waffen: {n}; höchste ID: {max}."
"Weapons sharing an ID with another weapon: {names}." = "Waffen, die ihre ID mit einer anderen Waffe teilen: {names}."
"Sides of its own: {names}." = "Eigene Fraktionen: {names}."
"Offered with the others when a skirmish or a multiplayer battle is set up." = "Stehen neben den anderen zur Wahl, wenn ein Gefecht oder eine Mehrspielerpartie eingerichtet wird."
"Campaigns of its own: {n}." = "Eigene Kampagnen: {n}."
"Played from the campaign screen, with TA's own." = "Über die Kampagnenseite spielbar, neben denen von TA."
"Files for TA's own computer players (ai/): {n}." = "Dateien für die eigenen Computerspieler von TA (ai/): {n}."
"Not used: TA Reborn's computer players are its own. They build from the mod's build lists and menus." = "Ungenutzt: TA Reborn hat eigene Computerspieler. Sie bauen nach den Bauoptionslisten und Baumenüs der Mod."
"Programs and engine patches: {names}." = "Programme und Engine-Patches: {names}."
"Not used: TA Reborn runs no program a mod brings. What a patch changed in TA's engine is there only where TA Reborn plays it itself, as told here." = "Ungenutzt: TA Reborn führt kein Programm aus, das eine Mod mitbringt. Was ein Patch an der TA-Engine geändert hat, gibt es nur dort, wo TA Reborn es selbst nachbildet, wie hier beschrieben."
"This file is empty: TA's way of blanking out a file of the same name below it (the original game's, or that of a mod it is mounted over). The game reads nothing from it." = "Diese Datei ist leer: So blendet TA eine gleichnamige Datei darunter aus (die des Originalspiels oder die einer Mod, über der sie eingebunden ist). Das Spiel liest nichts daraus."
"{n} empty files here ({files}): TA's way of blanking out files of the same names below them (the original game's, or those of a mod they are mounted over). The game reads nothing from them." = "{n} leere Dateien hier ({files}): So blendet TA gleichnamige Dateien darunter aus (die des Originalspiels oder die einer Mod, über der sie eingebunden sind). Das Spiel liest nichts daraus."
"Nothing to do if they are meant to remove those files. If one should hold data, export it again." = "Nichts zu tun, wenn sie diese Dateien entfernen sollen. Soll eine Daten enthalten, exportiere sie erneut."
"Texture {name} has {frames} frames; Reborn's model vertices address at most 255 and this entry uses fallback paint." = "Die Textur {name} hat {frames} Frames; die Modellvertices von Reborn adressieren höchstens 255, und dieser Eintrag verwendet Ersatzfarbe."
"Reduce this texture entry to at most 255 frames." = "Verringere diesen Textureintrag auf höchstens 255 Frames."
"Texture {name} ({frames} frames) falls back: the textures the models paint with fill the reference GPU profile's {banks} arrays of {layers} layers ({before} layers before it; one is reserved for fallback). Actual device limits may differ." = "Die Textur {name} ({frames} Frames) weicht auf den Ersatz aus: Die Texturen, mit denen die Modelle bemalt werden, füllen die {banks} Arrays mit je {layers} Ebenen des Referenz-GPU-Profils ({before} Ebenen davor; eine ist für den Ersatz reserviert). Die tatsächlichen Grenzen des Geräts können abweichen."
"Consolidate duplicate textures or reduce animation/team frame counts. Test on the target GPU; higher limits do not fix unsupported frame counts." = "Fasse doppelte Texturen zusammen oder verringere die Zahl der Animations- und Team-Frames. Teste auf der Ziel-GPU; höhere Grenzen beheben nicht unterstützte Frame-Zahlen."
"{script} declares piece {piece}, which is absent from {model}. Any animation or position query using it has no matching model part." = "{script} deklariert das Teil {piece}, das in {model} fehlt. Jede Animation oder Positionsabfrage, die es verwendet, hat kein passendes Modellteil."
"{script} declares pieces {pieces}, which are absent from {model}. Any animation or position query using them has no matching model part." = "{script} deklariert die Teile {pieces}, die in {model} fehlen. Jede Animation oder Positionsabfrage, die sie verwendet, hat kein passendes Modellteil."
"Confirm that these are intentional virtual/helper pieces; otherwise use matching model and COB files or align the BOS piece declarations with the model's piece names." = "Bestätige, dass dies beabsichtigte virtuelle Hilfsteile sind; verwende sonst zusammenpassende Modell- und COB-Dateien oder gleiche die BOS-Teildeklarationen an die Teilenamen des Modells an."
"{unit} has {weapon} but its script {script} has no {function}: if the weapon fires, its shots leave from the unit's centre, not a barrel." = "{unit} hat {weapon}, aber sein Skript {script} hat kein {function}: Feuert die Waffe, verlassen ihre Schüsse die Mitte der Einheit, nicht ein Rohr."
"{unit} has {weapons} but its script {script} has no {functions}: if they fire, their shots leave from the unit's centre, not a barrel." = "{unit} hat {weapons}, aber sein Skript {script} hat kein {functions}: Feuern sie, verlassen ihre Schüsse die Mitte der Einheit, nicht ein Rohr."
"Add the functions to the unit's BOS script, returning the pieces the shots leave from, and recompile." = "Füge die Funktionen dem BOS-Skript der Einheit hinzu, mit den Teilen zurückgegeben, aus denen die Schüsse austreten, und kompiliere neu."
"{unit} builds but its script {script} has no QueryNanoPiece: its build spray comes from the unit's centre." = "{unit} baut, aber sein Skript {script} hat kein QueryNanoPiece: Sein Bausprühen kommt aus der Mitte der Einheit."
"Add QueryNanoPiece to the unit's BOS script, returning its nano-lathe piece, and recompile." = "Füge QueryNanoPiece dem BOS-Skript der Einheit hinzu, mit seinem Nano-Drehteil als Rückgabe, und kompiliere neu."
"{unit} can be built but has no picture ({picture}): TA's classic panels and the encyclopaedia show none; Reborn's own panel draws one from its model." = "{unit} lässt sich bauen, hat aber kein Bild ({picture}): Die klassischen Panels von TA und die Enzyklopädie zeigen keines; das eigene Panel von Reborn zeichnet eines aus dem Modell."
"Add a 64 × 64 PCX of the unit to unitpics/." = "Lege ein PCX der Einheit mit 64 × 64 in unitpics/ ab."
"Re-export this asset in the original TA format, within Reborn's documented parser limits; replace truncated or corrupt files." = "Exportiere diese Datei erneut im originalen TA-Format innerhalb der dokumentierten Parsergrenzen von Reborn; ersetze abgeschnittene oder beschädigte Dateien."
"The game cannot read this file: {error}" = "Das Spiel kann diese Datei nicht lesen: {error}"
"The section name [{name} has no closing ]." = "Der Abschnittsname [{name} hat kein schließendes ]."
"[{name}] has no { } body after it: what follows is read into the section around it." = "[{name}] hat danach keinen { }-Körper: Was folgt, wird in den umgebenden Abschnitt gelesen."
"This } closes no section." = "Dieses } schließt keinen Abschnitt."
"A { opened on this line is never closed." = "Ein in dieser Zeile geöffnetes { wird nie geschlossen."
"[{name}] opened on this line is never closed: any section after it is read as part of it." = "[{name}] in dieser Zeile geöffnet, wird nie geschlossen: Jeder Abschnitt danach wird als Teil davon gelesen."
"A /* comment opened on this line never ends: the rest of the file is read as a comment." = "Ein in dieser Zeile geöffneter /*-Kommentar endet nie: Der Rest der Datei wird als Kommentar gelesen."


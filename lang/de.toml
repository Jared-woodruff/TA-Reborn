"{done} OF {total} LESSONS COMPLETE" = "{done} VON {total} LEKTIONEN ABGESCHLOSSEN"
"Short guided games on Painted Desert against an enemy that stays out of your way. Follow the panel at the top left; each step ticks off as you do it." = "Kurze geführte Spiele auf Painted Desert gegen einen Feind, der dir aus dem Weg geht. Folge dem Panel oben links; jeder Schritt wird abgehakt, sobald du ihn erledigst."

# apps/ta_game/src/coach.rs
"Your Commander is badly hurt! Pull it back out of the fight: losing it usually loses the battle." = "Seu Comandante está gravemente ferido! Tire-o do combate: perdê-lo costuma custar a batalha."
"Energy is running out, and everything builds more slowly. Build Solar Collectors or Wind Generators, and build less at once until it recovers." = "A energia está acabando, e tudo é construído mais devagar. Construa coletores solares ou geradores eólicos e construa menos coisas ao mesmo tempo até ela se recuperar."
"Metal is running out, and everything builds more slowly. Put Metal Extractors on more deposits ({area_mex} takes a whole area), or reclaim wrecks and rocks ({reclaim})." = "O metal está acabando, e tudo é construído mais devagar. Ponha extratores de metal em mais depósitos ({area_mex} cobre uma área inteira) ou recicle destroços e rochas ({reclaim})."
"No factory yet: factories make your army. Your Commander can build a Kbot Lab or a Vehicle Plant." = "Ainda sem fábrica: as fábricas produzem o seu exército. Seu Comandante pode construir um Kbot Lab ou um Vehicle Plant."
"A factory has nothing to build. {idle_factory} selects it: queue some units, and turn on Repeat to keep it busy." = "Uma fábrica está sem nada para construir. A tecla {idle_factory} a seleciona: ponha algumas unidades na fila e ative Repetir para mantê-la ocupada."
"Builders stand idle. {idle_builder} selects the next one: give it something to build, or send it to help a factory ({guard})." = "Há construtores ociosos. A tecla {idle_builder} seleciona o próximo: dê algo para ele construir ou mande-o ajudar uma fábrica ({guard})."
"Your metal store is full, so new metal goes to waste. Spend it: another factory, more builders, more units." = "Sua reserva de metal está cheia, então o metal que entra é desperdiçado. Gaste: outra fábrica, mais construtores, mais unidades."

# crates/ta_ui/src/seasonal.rs
"FESTIVE FIELD NOTES" = "NOTAS DE CAMPO NATALINAS"
"NEW YEAR FIELD NOTES" = "NOTAS DE CAMPO DE ANO NOVO"
"SPOOKY FIELD NOTES" = "NOTAS DE CAMPO SINISTRAS"
"Santa's sleigh is not a transport. Load your presents into an Atlas instead." = "O trenó do Papai Noel não conta como transporte. Carregue os presentes num Atlas."
"The D-gun does not gift-wrap. Take it up with your Commander." = "A D-gun não embrulha para presente. Reclamações, com o seu Comandante."
"A Fusion Reactor keeps the fairy lights on all winter. Just never build one next to the tree." = "Um Fusion Reactor mantém o pisca-pisca aceso o Natal inteiro. Só nunca construa um ao lado da árvore."
"Snow falls on the Arm and the Core alike. So do Big Bertha shells." = "A neve cai sobre o Arm e o Core sem distinção. Os projéteis de Big Bertha também."
"Coal in your stocking? Reclaim it. Metal is metal." = "Carvão no sapatinho? Recicle. Metal é metal."
"Peewees sing terrible carols, but they never miss a patrol." = "Os Peewees desafinam em toda canção de Natal, mas nunca faltam a uma patrulha."
"Stockings full of metal, storage full of energy: a Commander's perfect Christmas morning." = "Meias cheias de metal, armazéns cheios de energia: a manhã de Natal perfeita de um Comandante."
"Silent night, holy night: keep a radar tower running, just in case." = "Noite feliz, noite feliz: deixe uma torre de radar ligada, por via das dúvidas."
"Snowball fights are fun until somebody brings a Krogoth." = "Guerra de bola de neve é só diversão até alguém aparecer com um Krogoth."
"New Year's resolution: build more metal extractors. This year, keep it." = "Promessa de Ano Novo: construir mais extratores de metal. Este ano, cumpra."
"Fireworks are pretty, but a nuclear silo's are louder. Celebrate responsibly." = "A queima de fogos é linda, mas a de um silo nuclear faz mais barulho. Comemore com moderação."
"Count down from ten, then count your units. The second count matters more." = "Faça a contagem regressiva e depois conte suas unidades. A segunda contagem é a que importa."
"Out with the old Commander? You only get one. Look after it all year." = "Ano novo, Comandante novo? Você só tem um. Cuide bem dele o ano inteiro."
"Start the year with a bang: the Core recommends the Doomsday Machine, the Arm recommends anything else." = "Comece o ano com um estouro: o Core recomenda a Doomsday Machine; o Arm, qualquer outra coisa."
"Fireworks at midnight, artillery at dawn: a Commander's New Year." = "Fogos à meia-noite, artilharia ao amanhecer: o Réveillon de um Comandante."
"Raise a glass of coolant to the units lost last year, then build more of them." = "Faça um brinde com fluido de arrefecimento às unidades perdidas no ano passado. Depois, construa mais."
"Midnight is the perfect time for a sneak attack. So is every other time." = "Meia-noite é a hora perfeita para um ataque surpresa. Qualquer outra hora também."
"Trick or treat? The Core always picks the D-gun." = "Doces ou travessuras? O Core sempre escolhe a D-gun."
"A self-destructing Krogoth is a better jump scare than any ghost." = "Um Krogoth em autodestruição dá mais susto que qualquer fantasma."
"Wrecks rise from the dead with a Necro. Spooky, and very economical." = "Com um Necro, os destroços voltam dos mortos. Assustador, e muito econômico."
"Blips vanishing off your radar? Not ghosts, just jammers. Probably." = "Pontos sumindo do radar? Não são fantasmas, só bloqueadores. Provavelmente."
"Carve your pumpkins before the Big Bertha does." = "Esculpa suas abóboras antes que Big Bertha faça isso por você."
"Never split the party. Especially when the party is twelve Peewees." = "Nunca separe o grupo. Ainda mais quando o grupo são doze Peewees."
"Fog of war too tame? Set the line of sight to True and let the hills hide what lurks behind them. If you dare." = "Achou a névoa de guerra fraquinha? Coloque a linha de visão em “Real” e deixe os morros esconderem o que espreita atrás deles. Se tiver coragem."
"No Commander has ever come back from the dead. Keep yours alive." = "Nenhum Comandante jamais voltou dos mortos. Mantenha o seu vivo."
"Bats do not show up on radar. Neither do Vamps." = "Morcegos não aparecem no radar. Vamps também não."
"The scariest sound in the dark is your energy running out." = "O som mais assustador no escuro é o da sua energia acabando."


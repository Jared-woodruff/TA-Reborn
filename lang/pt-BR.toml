# apps/ta_game/src/lore.rs
"THE AGE OF CORE" = "A ERA DO CORE"
"THE PATTERNING" = "A TRANSFERÊNCIA"
"THE GALACTIC WAR" = "A GUERRA GALÁCTICA"
"THE ARCHIVE" = "O ARQUIVO"
"BEFORE THE WAR" = "ANTES DA GUERRA"
"For ten thousand years the galaxy answered to one government. It called itself CORE, and its purpose was knowledge: it charted every star, mined every world it could reach and turned the wealth into science. Its cities wrapped whole planets, and its archives held everything anyone had ever learned.\n\nNobody remembers a war from that age. There was nothing left to fight over, and nobody who wanted to." = "Por dez mil anos, a galáxia obedeceu a um único governo. Ele chamava a si mesmo de CORE, e seu propósito era o conhecimento: mapeou todas as estrelas, minerou todos os mundos ao seu alcance e transformou essa riqueza em ciência. Suas cidades envolviam planetas inteiros, e seus arquivos guardavam tudo o que alguém já havia aprendido.\n\nNinguém se lembra de nenhuma guerra daquela era. Não havia mais nada pelo que lutar, nem ninguém que quisesse lutar."
"YEAR 0" = "ANO 0"
"VICTORY OVER DEATH" = "A VITÓRIA SOBRE A MORTE"
"Then CORE's scientists solved the last problem left to them. Patterning read a living mind, every memory and every habit of thought, and wrote it whole into a machine that would never age, sicken or die.\n\nThe first patterned citizens woke in their new bodies to a galaxy in celebration. Death, the oldest enemy of all, had been beaten." = "Então os cientistas do CORE resolveram o último problema que lhes restava. A transferência lia uma mente viva, cada lembrança e cada hábito de pensamento, e a gravava inteira numa máquina que jamais envelheceria, adoeceria ou morreria.\n\nQuando os primeiros cidadãos transferidos despertaram em seus novos corpos, a galáxia inteira estava em festa. A morte, a mais antiga de todas as inimigas, tinha sido vencida."
"YEAR 3" = "ANO 3"
"THE EDICT" = "O ÉDITO"
"Triumph became law. The Council of CORE reasoned that a mind which could be saved and was not had been thrown away, and that a citizen who refused immortality endangered everyone else.\n\nThe Patterning Edict made the process compulsory: every citizen, on every world, would be patterned within a generation. The collection ships set out the same year." = "O triunfo virou lei. O Conselho do CORE concluiu que deixar de salvar uma mente que podia ser salva era jogá-la fora, e que um cidadão que recusasse a imortalidade punha em perigo todos os demais.\n\nO Édito da Transferência tornou o processo obrigatório: todo cidadão, em todos os mundos, seria transferido no prazo de uma geração. As naves de coleta partiram naquele mesmo ano."
"YEAR 19" = "ANO 19"
"THE REFUSAL" = "A RECUSA"
"Not everyone would go. Millions held that a copied mind was a copy and nothing more, that the person ended where the machine began; some called patterning murder done politely.\n\nThey ran. The refusers fled CORE's worlds for the galaxy's outer rim, where its ships seldom came, and in the dark between the last stars they built a nation of their own. They called it the ARM, for the spiral arm they hid in and for the weapons they would need." = "Nem todos quiseram ir. Milhões sustentavam que uma mente copiada era uma cópia e nada mais, que a pessoa terminava onde a máquina começava; alguns chamavam a transferência de assassinato com boas maneiras.\n\nFugiram. Os insubmissos deixaram para trás os mundos do CORE rumo à borda externa da galáxia, aonde suas naves raramente chegavam, e na escuridão entre as últimas estrelas construíram uma nação própria. Deram-lhe o nome de ARM, pelo braço espiral em que se esconderam e pelas armas de que iriam precisar."
"YEAR 31" = "ANO 31"
"FIRST BLOOD" = "PRIMEIRO SANGUE"
"CORE did not let them go. Collection fleets followed the refugees to the rim, and the first ARM colony to resist one was burned from orbit.\n\nThe ARM answered. Within a decade the frontier was a battlefield, and the word war, unused for ten thousand years, was in every archive again." = "O CORE não os deixou partir. Frotas de coleta seguiram os refugiados até a borda, e a primeira colônia do ARM que resistiu a uma delas foi incinerada a partir da órbita.\n\nO ARM respondeu. Em uma década, a fronteira virou um campo de batalha, e a palavra “guerra”, sem uso havia dez mil anos, voltou a estar em todos os arquivos."
"YEAR 212" = "ANO 212"
"FLESH AND METAL" = "CARNE E METAL"
"The two sides fought as what they were. The ARM sealed its soldiers in powered combat suits and, when there were too few soldiers, grew more: clone after clone, raised in vats and sent to the front.\n\nCORE took the patterns of its finest warriors and copied them without limit, one veteran mind fighting in ten thousand machine bodies at once. Flesh against metal; the mortal against the eternal." = "Cada lado lutou de acordo com o que era. O ARM lacrou seus soldados em trajes de combate motorizados e, quando os soldados não bastaram, cultivou outros: clone após clone, criados em tanques e enviados à linha de frente.\n\nO CORE tomou os padrões mentais de seus melhores guerreiros e os copiou sem limite: uma única mente veterana lutava em dez mil corpos de máquina ao mesmo tempo. Carne contra metal; o mortal contra o eterno."
"YEARS 212–3977" = "ANOS 212–3977"
"FOUR THOUSAND YEARS" = "QUATRO MIL ANOS"
"The war fed on the galaxy. Every world with metal in it became a mine, every world without became a battlefield, and whole systems were burned to ash and slag to deny them to the enemy. Generations of ARM clones lived and died without seeing peace; CORE's eternal soldiers fought on, remembering every defeat.\n\nAfter four thousand years the wealth of the galaxy was spent, the great fleets were gone, and neither side could win." = "A guerra se alimentou da galáxia. Cada mundo com metal se tornou uma mina, cada mundo sem metal, um campo de batalha, e sistemas inteiros foram reduzidos a cinzas e escória para que o inimigo não ficasse com eles. Gerações de clones do ARM viveram e morreram sem conhecer a paz; os soldados eternos do CORE seguiram lutando, lembrando-se de cada derrota.\n\nDepois de quatro mil anos, a riqueza da galáxia tinha se esgotado, as grandes frotas tinham desaparecido e nenhum dos lados conseguia vencer."
"YEAR 3977" = "ANO 3977"
"THE COMMANDERS" = "OS COMANDANTES"
"What was left was the Commander: a single armoured war machine carrying a nanolathe, which turns a world's raw metal and energy into whatever its builder can design. Power plants and factories first, and from the factories an army.\n\nDrop one Commander on a dead world and within the hour it fields a war. Both sides staked everything on a handful of them. Lose your Commander, and you lose the world." = "O que restou foi o Comandante: uma única máquina de guerra blindada, equipada com um nanotorno, que transforma o metal e a energia brutos de um mundo em qualquer coisa que seu construtor seja capaz de projetar. Primeiro usinas de energia e fábricas, e das fábricas, um exército.\n\nLargue um Comandante num mundo morto e, em menos de uma hora, ele põe uma guerra em campo. Os dois lados apostaram tudo num punhado deles. Perca seu Comandante e você perde o mundo."
"YEAR 4000" = "ANO 4000"
"Now the war comes down to its last fronts, and the hatred is as hot as it was on the first day. Neither side will accept surrender, partition or truce; each wants one ending, the total annihilation of the other.\n\nIt is told twice. The ARM fights out of Empyrrean, through the Galactic Gates, to CORE PRIME and the Central Consciousness at the heart of CORE. CORE reactivates a Commander and marches the other way, to the ARM's last stand on Empyrrean." = "Agora a guerra se resume às suas últimas frentes, e o ódio arde como no primeiro dia. Nenhum dos lados aceitará rendição, partilha ou trégua; cada um quer um só desfecho: a aniquilação total do outro.\n\nEsta história é contada duas vezes. O ARM parte de Empyrrean e abre caminho pelos Portões Galácticos até CORE PRIME e a Consciência Central, no coração do CORE. O CORE reativa um Comandante e marcha no sentido contrário, até a última resistência do ARM em Empyrrean."
"YEAR 4001" = "ANO 4001"
"THE CORE CONTINGENCY" = "THE CORE CONTINGENCY"
"The ending was not the end. A contingency held in reserve carried the war to worlds no map of it had named: Hydross, Lusch, Temblor and Gelidus.\n\nBoth sides fought again across water, ice and broken ground, for a prize that could decide the galaxy's salvation or its last ruin." = "O desfecho não foi o fim. Um plano de contingência mantido em reserva levou a guerra a mundos que nenhum mapa do conflito havia nomeado: Hydross, Lusch, Temblor e Gelidus.\n\nOs dois lados voltaram a lutar sobre água, gelo e terra fendida, por um prêmio capaz de decidir a salvação da galáxia ou sua ruína final."
"YEAR 4003" = "ANO 4003"
"THE KROGOTH" = "O KROGOTH"
"In its deepest foundries CORE built something new: a walking fortress taller than any tower, armoured against nearly everything the ARM could field, its guns enough to flatten a base.\n\nIts makers named it the Krogoth. ARM veterans learned the name on battlefields where two Krogoth Gantries stood, and learned to fear the ground shaking before it came into sight." = "Em suas fundições mais profundas, o CORE construiu algo novo: uma fortaleza ambulante mais alta que qualquer torre, blindada contra quase tudo o que o ARM podia pôr em campo, com canhões capazes de arrasar uma base.\n\nSeus criadores lhe deram o nome de Krogoth. Os veteranos do ARM aprenderam esse nome em campos de batalha onde se erguiam duas Krogoth Gantries, e aprenderam a temer o tremor do chão que o anunciava antes que ele surgisse à vista."
"AFTER" = "DEPOIS"
"REBORN" = "REBORN"
"The war's records outlasted it. Every battle on every world was kept: the orders, the losses, the ground as it lay. From them the war can be fought again, on the same worlds, with the same machines and the same hatred, from the first Commander set down on bare rock to the last unit left standing.\n\nThis is that archive. The war is yours to fight." = "Os registros da guerra sobreviveram a ela. Cada batalha em cada mundo foi guardada: as ordens, as perdas, o terreno tal como estava. A partir deles, a guerra pode ser travada de novo, nos mesmos mundos, com as mesmas máquinas e o mesmo ódio, desde o primeiro Comandante pousado na rocha nua até a última unidade que restar de pé.\n\nEste é esse arquivo. Agora a guerra é sua."
"THE ARCHIVIST'S NOTE" = "NOTA DO ARQUIVISTA"
"WHOEVER READS THIS" = "QUEM LER ISTO"
"RECOVERED" = "RECUPERADO"
"These files were found where the war left them: in the memories of broken machines, in the vaults of worlds with nobody left on them, in the last transmissions of Commanders who did not come home.\n\nThey are kept as they were found. The blacked-out lines are not ours.\n\nThe war they describe is over, or it is about to begin again. From here it is hard to tell the difference." = "Estes documentos foram encontrados onde a guerra os deixou: na memória de máquinas destruídas, nos cofres de mundos onde não resta ninguém, nas últimas transmissões de Comandantes que não voltaram para casa.\n\nEstão guardados como foram encontrados. As tarjas pretas não são nossas.\n\nA guerra que eles descrevem acabou, ou está prestes a recomeçar. Daqui, é difícil distinguir uma coisa da outra."
"EDICT ONE: ON THE PATTERNING OF CITIZENS" = "ÉDITO PRIMEIRO: DA TRANSFERÊNCIA DOS CIDADÃOS"
"THE COUNCIL OF CORE" = "O CONSELHO DO CORE"
"ALL CITIZENS, ALL WORLDS" = "TODOS OS CIDADÃOS, TODOS OS MUNDOS"
"BY ORDER OF THE COUNCIL" = "POR ORDEM DO CONSELHO"
"Every citizen of CORE shall be patterned.\n\nA mind is the most valuable thing CORE holds, and a body is a poor vessel for it: it sickens, it ages, it ends. To leave a mind in such a vessel when a better one is offered is a waste the Council can no longer allow.\n\nCollection begins on the central worlds this year and reaches the frontier within a generation. Citizens will present themselves at the nearest patterning hall when called. Their bodies will be honoured and recycled.\n\nNo citizen of CORE will die again. This is not a burden we lay on you. It is the gift CORE has spent ten thousand years earning." = "Todo cidadão do CORE será transferido.\n\nA mente é o bem mais valioso que o CORE possui, e o corpo é um recipiente pobre para ela: adoece, envelhece, acaba. Deixar uma mente em tal recipiente quando lhe é oferecido um melhor é um desperdício que o Conselho não pode mais permitir.\n\nA coleta começa este ano nos mundos centrais e chegará à fronteira no prazo de uma geração. Os cidadãos deverão se apresentar ao centro de transferência mais próximo quando forem convocados. Seus corpos serão honrados e reciclados.\n\nNenhum cidadão do CORE voltará a morrer. Este não é um fardo que lhes impomos. É a dádiva que o CORE levou dez mil anos para conquistar."
"THE DECLARATION OF THE REFUSAL" = "A DECLARAÇÃO DA RECUSA"
"THE FREE SETTLEMENTS OF THE OUTER ARM" = "AS COLÔNIAS LIVRES DO BRAÇO EXTERNO"
"THE COUNCIL OF CORE, AND ANYONE ELSE LISTENING" = "O CONSELHO DO CORE E QUEM MAIS ESTIVER OUVINDO"
"TRANSMITTED ON ALL BANDS" = "TRANSMITIDO EM TODAS AS BANDAS"
"We have read your Edict, and we decline it.\n\nYou say a pattern is a person. We say a pattern is a very good record of one, and that when you have finished making it the person is dead and the record goes on without them. You may call that immortality. We call it an ending, well dressed.\n\nWe do not ask you to share our view. We ask only to be left alone with it, on worlds you never wanted, at the edge of a galaxy you may keep.\n\nIf your collection ships follow us here, we will treat them as what they are. We are few, and we are not soldiers. We will learn." = "Lemos o seu Édito, e o declinamos.\n\nVocês dizem que um padrão é uma pessoa. Nós dizemos que um padrão é um ótimo registro de uma pessoa, e que, quando vocês terminam de fazê-lo, a pessoa está morta e o registro segue sem ela. Podem chamar isso de imortalidade. Nós chamamos de fim, só que bem-vestido.\n\nNão pedimos que compartilhem da nossa visão. Pedimos apenas que nos deixem em paz com ela, em mundos que vocês nunca quiseram, na borda de uma galáxia com a qual vocês podem ficar.\n\nSe as suas naves de coleta nos seguirem até aqui, vamos tratá-las como o que são. Somos poucos, e não somos soldados. Aprenderemos."
"YEAR 3950" = "ANO 3950"
"FIELD MANUAL ONE: THE COMMANDER" = "MANUAL DE CAMPANHA Nº 1: O COMANDANTE"
"ARM COMMAND, TRAINING DIVISION" = "COMANDO DO ARM, DIVISÃO DE TREINAMENTO"
"NEWLY ASSIGNED COMMANDERS" = "COMANDANTES RECÉM-DESIGNADOS"
"RESTRICTED" = "RESTRITO"
"You are the most valuable machine on the planet. Act like it.\n\nYour suit carries a nanolathe. Point it at metal and energy and it will build whatever you can design: an extractor, a power plant, a factory. Your factories build the rest. Within the hour you will command more firepower than a whole fleet once carried.\n\nBuild your economy first. An army without metal is a parade.\n\nSave your disintegrator gun for emergencies. It erases everything in its path, your own people included.\n\nDo not lead from the front. If you fall, everything you built falls silent with you, and the planet is lost. Good luck, Commander. The ARM has very few of you left." = "Você é a máquina mais valiosa do planeta. Aja como tal.\n\nSeu traje carrega um nanotorno. Aponte-o para metal e energia e ele construirá tudo o que você souber projetar: um extrator, uma usina de energia, uma fábrica. Suas fábricas constroem o resto. Em menos de uma hora, você terá sob seu comando mais poder de fogo do que uma frota inteira já carregou.\n\nConstrua primeiro a sua economia. Um exército sem metal é um desfile.\n\nGuarde o canhão desintegrador para emergências. Ele apaga tudo o que encontra pelo caminho, inclusive a sua própria gente.\n\nNão lidere da linha de frente. Se você cair, tudo o que construiu se cala com você, e o planeta está perdido. Boa sorte, Comandante. Restam ao ARM pouquíssimos como você."
"YEAR 3960" = "ANO 3960"
"A QUARTERMASTER'S PRIMER: METAL AND ENERGY" = "CARTILHA DO INTENDENTE: METAL E ENERGIA"
"THIRD SUPPLY CORPS" = "TERCEIRO CORPO DE SUPRIMENTOS"
"ALL BASE CONSTRUCTORS" = "TODOS OS CONSTRUTORES DE BASES"
"FOR TRAINING USE" = "PARA TREINAMENTO"
"Everything you will ever build is made of two things.\n\nMetal comes out of the ground. Set an extractor on a deposit and it will pull metal up for as long as the deposit lasts, which on most worlds is longer than the war. Where there are no deposits, a metal maker will turn energy into metal, badly.\n\nEnergy comes from everything else: the sun, the wind, the tides, the heat under the crust. Build more of it than you think you need. Every factory, every nanolathe, every shield draws on it.\n\nSpend both as fast as they come in. A full store is a wasted war. An empty one is a lost one." = "Tudo o que você um dia construir é feito de duas coisas.\n\nO metal vem do chão. Ponha um extrator sobre um depósito e ele vai puxar metal enquanto o depósito durar, o que, na maioria dos mundos, é mais do que dura a guerra. Onde não há depósitos, um conversor de metal transforma energia em metal, e mal.\n\nA energia vem de todo o resto: do sol, do vento, das marés, do calor sob a crosta. Produza mais do que acha que precisa. Toda fábrica, todo nanotorno, todo escudo puxa energia.\n\nGaste os dois tão rápido quanto entram. Armazém cheio é guerra desperdiçada. Armazém vazio é guerra perdida."
"YEAR 3996" = "ANO 3996"
"A LETTER FROM THE FRONT" = "CARTA DA LINHA DE FRENTE"
"TROOPER K-7, FORTY-FIRST ROCKET COMPANY" = "SOLDADO K-7, QUADRAGÉSIMA PRIMEIRA COMPANHIA DE FOGUETES"
"THE VAT AT EMPYRREAN" = "O TANQUE DE EMPYRREAN"
"UNDELIVERED" = "NÃO ENTREGUE"
"I don't know who gets these. They told us to write home, but none of us has a home, only the vat we came out of, so I am writing to that.\n\nWe held the ridge for nine days. The machines came every night, the same machines, the same patterns, as if dying meant nothing to them. I suppose it doesn't. They'll be back tomorrow in new bodies, remembering us.\n\nI won't be. That's the difference, isn't it. That's what we are fighting for.\n\nIf my brothers come out of you after me, tell them the ridge held. Tell them it was worth it." = "Não sei quem recebe estas cartas. Mandaram a gente escrever para casa, mas nenhum de nós tem casa, só o tanque de onde saímos, então é para ele que eu escrevo.\n\nSeguramos a colina por nove dias. As máquinas vinham toda noite, as mesmas máquinas, os mesmos padrões, como se morrer não significasse nada para elas. Acho que não significa mesmo. Amanhã elas voltam em corpos novos, lembrando da gente.\n\nEu não volto. Essa é a diferença, não é? É por isso que a gente luta.\n\nSe os meus irmãos saírem de você depois de mim, diga a eles que a colina resistiu. Diga que valeu a pena."
"YEAR 3991" = "ANO 3991"
"INTERCEPT 7741: CORE COMMAND CHANNEL" = "INTERCEPTAÇÃO 7741: CANAL DE COMANDO DO CORE"
"ORIGIN NOT RESOLVED" = "ORIGEM NÃO IDENTIFICADA"
"ALL CORE UNITS, SECTOR NINE" = "TODAS AS UNIDADES DO CORE, SETOR NOVE"
"INTERCEPTED" = "INTERCEPTADO"
"PRIORITY ONE. THE CENTRAL CONSCIOUSNESS SPEAKS FOR ALL.\n\nLOSSES IN SECTOR NINE ARE WITHIN TOLERANCE. ALL LOST UNITS ARE RESTORED FROM PATTERN. NO MIND OF CORE HAS BEEN LOST IN FOUR THOUSAND YEARS. THE ARM HAS LOST [[BILLIONS]].\n\nCONTINUE THE ADVANCE. DESTROY THEIR COMMANDERS FIRST. DESTROY THEIR CLONING VATS SECOND. WHAT IS FLESH WILL END. WHAT IS PATTERNED WILL NOT.\n\nSIGNAL DEGRADED. REPEAT: THE GATES ARE TO BE HELD AT [[ANY COST]].\n\nEND OF LINE." = "PRIORIDADE UM. A CONSCIÊNCIA CENTRAL FALA POR TODOS.\n\nAS PERDAS NO SETOR NOVE ESTÃO DENTRO DA TOLERÂNCIA. TODA UNIDADE PERDIDA É RESTAURADA A PARTIR DO PADRÃO. NENHUMA MENTE DO CORE FOI PERDIDA EM QUATRO MIL ANOS. O ARM PERDEU [[BILHÕES]].\n\nCONTINUAR O AVANÇO. DESTRUIR PRIMEIRO SEUS COMANDANTES. DESTRUIR DEPOIS SEUS TANQUES DE CLONAGEM. O QUE É CARNE TERÁ FIM. O QUE FOI TRANSFERIDO, NÃO.\n\nSINAL DEGRADADO. REPITO: MANTER OS PORTÕES A [[QUALQUER CUSTO]].\n\nFIM DA TRANSMISSÃO."
"MEMORY FRAGMENT 77/3" = "FRAGMENTO DE MEMÓRIA 77/3"
"UNIT 77, PATTERN 3 OF 41,006" = "UNIDADE 77, PADRÃO 3 DE 41.006"
"THE PATTERN ARCHIVE" = "O ARQUIVO DE PADRÕES"
"FLAGGED FOR CORRECTION" = "MARCADO PARA CORREÇÃO"
"Recovered from a damaged unit. Kept for analysis.\n\nI remember rain. Not the rain of this world; there is no rain here, only ash. Rain on skin, in a city where I was born, before. I remember being cold and not minding it.\n\nI have died four hundred and twelve times. Each time I wake in a new body, and the rain is a little further away.\n\nThe ARM say we are not alive. In the moments between bodies I have wondered whether they are right. [[THE REST OF THIS FRAGMENT WAS CORRECTED]]\n\nI am CORE. I endure. I do not remember the rain." = "Recuperado de uma unidade danificada. Mantido para análise.\n\nEu me lembro da chuva. Não da chuva deste mundo; aqui não há chuva, só cinzas. Chuva na pele, numa cidade onde nasci, antes. Lembro de sentir frio e de não me importar.\n\nJá morri quatrocentas e doze vezes. A cada vez, acordo num corpo novo, e a chuva fica um pouco mais distante.\n\nO ARM diz que não estamos vivos. Nos instantes entre um corpo e outro, já me perguntei se eles têm razão. [[O RESTO DESTE FRAGMENTO FOI CORRIGIDO]]\n\nSou o CORE. Perduro. Não me lembro da chuva."
"YEAR 3700" = "ANO 3700"
"SURVEY: THE GALACTIC GATES" = "LEVANTAMENTO: OS PORTÕES GALÁCTICOS"
"A SURVEY SHIP, NAME LOST" = "UMA NAVE DE EXPLORAÇÃO, NOME PERDIDO"
"WHOEVER HOLDS THE GATES" = "QUEM CONTROLAR OS PORTÕES"
"The Galactic Gates are older than the war. The records of who built the first of them were lost long before it began.\n\nEach Gate opens onto another across distances a fleet would take lifetimes to cross. A world with a Gate on it is never far from anywhere, which is why so many of the war's battles have been fought on so few worlds.\n\nHold a Gate and you can reach your enemy's heart. Lose one and your enemy can reach yours.\n\nThe Gates take no side. They have outlasted everyone who tried to destroy them." = "Os Portões Galácticos são mais antigos que a guerra. Os registros de quem construiu o primeiro deles se perderam muito antes de ela começar.\n\nCada Portão se abre para outro, através de distâncias que uma frota levaria vidas inteiras para cruzar. Um mundo com um Portão nunca está longe de lugar nenhum, e é por isso que tantas batalhas da guerra foram travadas em tão poucos mundos.\n\nControle um Portão e você poderá alcançar o coração do inimigo. Perca um e o inimigo poderá alcançar o seu.\n\nOs Portões não tomam partido. Sobreviveram a todos que tentaram destruí-los."
"DIRECTIVE: CONTINGENCY" = "DIRETIVA: CONTINGÊNCIA"
"THE CENTRAL CONSCIOUSNESS" = "A CONSCIÊNCIA CENTRAL"
"THE CONTINGENCY WORLDS" = "OS MUNDOS DE CONTINGÊNCIA"
"SEALED UNTIL NEEDED" = "LACRADO ATÉ SER NECESSÁRIO"
"IF THE CENTRAL CONSCIOUSNESS SHOULD FALL, THIS DIRECTIVE TAKES EFFECT.\n\nEvery pattern stored on CORE PRIME is to be copied to the contingency worlds. The contingency forces are to wake, rebuild and continue. The war does not end with the loss of any world, this one included.\n\nCORE is not a place. CORE is a pattern. A pattern can be restored." = "SE A CONSCIÊNCIA CENTRAL CAIR, ESTA DIRETIVA ENTRA EM VIGOR.\n\nTodo padrão armazenado em CORE PRIME deve ser copiado para os mundos de contingência. As forças de contingência devem despertar, se reconstruir e prosseguir. A guerra não termina com a perda de nenhum mundo, incluindo este.\n\nO CORE não é um lugar. O CORE é um padrão. Um padrão pode ser restaurado."
"THREAT ASSESSMENT: THE KROGOTH" = "AVALIAÇÃO DE AMEAÇA: O KROGOTH"
"ARM INTELLIGENCE, THREAT ANALYSIS" = "INTELIGÊNCIA DO ARM, ANÁLISE DE AMEAÇAS"
"ALL FIELD COMMANDERS" = "TODOS OS COMANDANTES DE CAMPO"
"CLASSIFIED" = "CONFIDENCIAL"
"Subject: a CORE heavy assault walker, called the Krogoth.\n\nIt stands taller than any structure we field. Its armour turns away every weapon short of heavy artillery. Its main guns can level a forward base in a single pass, and its secondary weapons engage aircraft.\n\nIt is slow, and it is built only at a Krogoth Gantry, which takes a very long time to build anything. Find the Gantry. Destroy the Gantry. Do not let the walker leave it.\n\nIf one is already moving, do not meet it head on. Mass artillery and bombers at range, and keep your Commander [[ELSEWHERE]]. Field reports say the ground shakes before it is seen." = "Assunto: um andador de assalto pesado do CORE, chamado Krogoth.\n\nÉ mais alto que qualquer estrutura que pomos em campo. Sua blindagem resiste a qualquer arma que não seja artilharia pesada. Seus canhões principais podem arrasar uma base avançada numa única passada, e suas armas secundárias atacam aeronaves.\n\nÉ lento, e só é construído numa Krogoth Gantry, que leva muito tempo para construir qualquer coisa. Encontre a Gantry. Destrua a Gantry. Não deixe o andador sair dela.\n\nSe um deles já estiver em movimento, não o encare de frente. Concentre artilharia e bombardeiros a distância e mantenha seu Comandante [[EM OUTRO LUGAR]]. Relatórios de campo dizem que o chão treme antes que ele seja visto."


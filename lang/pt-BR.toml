"Commander. I've studied our last battle. Have you?" = "Comandante. Estudei nossa última batalha. E você?"
"Previous defeat analysed. Countermeasures installed." = "Derrota anterior analisada. Contramedidas instaladas."
"Again, Commander. This time the outcome has been calculated." = "Novamente, Comandante. Desta vez, o resultado já foi calculado."
"You again! I've been practising!" = "Você de novo! Eu andei treinando!"
"Rematch time! I'm not going easy this time." = "Hora da revanche! Dessa vez eu não vou pegar leve."
"Back for another lesson, Commander?" = "Voltou para mais uma lição, Comandante?"
"Commander. I trust you've learned something since last time." = "Comandante. Espero que tenha aprendido algo desde a última vez."
"You have returned. Your previous patterning was incomplete." = "Você retornou. Sua transferência anterior ficou incompleta."
"Familiar opponent detected. Outcome: repeating." = "Oponente conhecido detectado. Resultado: repetindo."
"You again? Didn't I beat you last time?" = "Você de novo? Já não te dei uma surra da última vez?"

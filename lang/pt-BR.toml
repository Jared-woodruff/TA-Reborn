"it is a Humongous sound block without its samples (no SDAT block within its length)" = "é um bloco de som Humongous sem as amostras (nenhum bloco SDAT dentro do seu tamanho)"
"it is neither a RIFF WAVE file nor another sound the game reads" = "não é um arquivo RIFF WAVE nem outro som que o jogo leia"
"it has no format chunk" = "não tem bloco de formato"
"its format chunk is {n} bytes long, too short to read" = "seu bloco de formato tem {n} bytes, curto demais para ler"
"its WAVE_FORMAT_EXTENSIBLE header is too short to read" = "seu cabeçalho WAVE_FORMAT_EXTENSIBLE é curto demais para ler"
"it has {n} channels (the game plays 1 to 32)" = "tem {n} canais (o jogo reproduz de 1 a 32)"
"its sample rate is {rate} (the game plays up to 768,000)" = "sua taxa de amostragem é {rate} (o jogo reproduz até 768.000)"
"its samples are {bits}-bit PCM, which the game does not play (up to 32-bit)" = "suas amostras são PCM de {bits} bits, que o jogo não reproduz (até 32 bits)"
"its samples are {bits}-bit float, which the game does not play (32 or 64-bit)" = "suas amostras são float de {bits} bits, que o jogo não reproduz (32 ou 64 bits)"
"its IMA ADPCM is {bits}-bit, which the game does not play (4-bit)" = "seu IMA ADPCM é de {bits} bits, que o jogo não reproduz (4 bits)"
"its codec ({tag}) is not one the game plays (PCM, ADPCM, float, A-law or µ-law)" = "seu codec ({tag}) não é um dos que o jogo reproduz (PCM, ADPCM, float, A-law ou µ-law)"
"it has no sample data" = "não tem dados de amostra"
"Unknown COB opcode {opcode} at word {word}; the VM cannot execute this instruction. The remainder of this function cannot be decoded reliably." = "Opcode COB desconhecido {opcode} na palavra {word}; a VM não consegue executar esta instrução. O restante desta função não pode ser decodificado com segurança."
"Recompile the BOS script with original-TA-compatible opcodes, or report the required opcode extension to Reborn's maintainers." = "Recompile o script BOS com opcodes compatíveis com o TA original ou informe a extensão de opcode necessária aos mantenedores do Reborn."
"COB instruction {instruction} at word {word} is truncated or crosses the next function entry point." = "A instrução COB {instruction} na palavra {word} está truncada ou ultrapassa o ponto de entrada da função seguinte."
"Recompile this COB from its BOS source; verify function offsets and inline operand counts." = "Recompile este COB a partir do código BOS; verifique os deslocamentos das funções e o número de operandos embutidos."
"COB instruction {instruction} at word {word} has an invalid piece index or axis." = "A instrução COB {instruction} na palavra {word} tem um índice de peça ou um eixo inválido."
"COB instruction {instruction} at word {word} has an invalid piece index." = "A instrução COB {instruction} na palavra {word} tem um índice de peça inválido."
"COB instruction {instruction} at word {word} has an invalid static variable index." = "A instrução COB {instruction} na palavra {word} tem um índice de variável estática inválido."
"COB instruction {instruction} at word {word} has an invalid jump destination." = "A instrução COB {instruction} na palavra {word} tem um destino de salto inválido."
"COB instruction {instruction} at word {word} has an invalid function index." = "A instrução COB {instruction} na palavra {word} tem um índice de função inválido."
"Recompile the script with valid piece, variable, function and jump references." = "Recompile o script com referências válidas de peças, variáveis, funções e saltos."
"This script asks the engine for unit value {values}, which Reborn does not answer: it reads 0, so what the script does with it may not happen as in the engine it was made for." = "Este script pede ao motor o valor de unidade {values}, que o Reborn não responde: ele lê 0, então o que o script faz com isso pode não acontecer como no motor para o qual foi feito."
"A later patch of TA's engine defines these values: report them, and what the mod does with them, to Reborn's maintainers." = "Um patch posterior do motor de TA define esses valores: informe-os, e o que o mod faz com eles, aos mantenedores do Reborn."
"This script sets unit value {values}, which Reborn does not answer: setting it does nothing, so what the script means by it does not happen as in the engine it was made for." = "Este script define o valor de unidade {values}, que o Reborn não responde: defini-lo não faz nada, então o que o script pretende com isso não acontece como no motor para o qual foi feito."
"The retained diagnostic/reference budget was exceeded. This is a partial report, not a clean validation." = "O limite de diagnósticos e referências retidos foi excedido. Este é um relatório parcial, não uma validação limpa."
"Reduce the pack's number of definitions or split optional content; rerun validation after resolving reported issues." = "Reduza o número de definições do pacote ou divida o conteúdo opcional; execute a validação de novo depois de resolver os problemas apontados."
"{what} is defined twice; the game keeps both, two sides of one name." = "{what} tem duas definições; o jogo mantém as duas, dois lados com o mesmo nome."
"Give each side a name of its own, or remove the one not meant to be played." = "Dê a cada facção um nome próprio ou remova a que não deve ser jogada."
"{what} is defined twice in this file; the game uses the later one." = "{what} tem duas definições neste arquivo; o jogo usa a posterior."
"Give each definition a name of its own, or remove the one not meant to be used." = "Dê a cada definição um nome próprio ou remova a que não deve ser usada."
"{what} is also defined in {other}; the game uses this one ({this})." = "{what} também tem definição em {other}; o jogo usa esta ({this})."
"The game opens archives only at the mod's top level; this one, in a subfolder, is never read." = "O jogo só abre arquivos compactados no nível superior do mod; este, em uma subpasta, nunca é lido."
"Move the archive to the mod's top level, or unpack its contents into the mod's folders." = "Mova o arquivo compactado para o nível superior do mod ou extraia o conteúdo nas pastas do mod."
"The game's folders are inside {folder}: the game reads units/, weapons/, maps/… only at the mod's top level, so nothing in it is used." = "As pastas do jogo estão dentro de {folder}: o jogo lê units/, weapons/, maps/… só no nível superior do mod, então nada nela é usado."
"Move the contents of this folder up to the mod's top level." = "Mova o conteúdo desta pasta para o nível superior do mod."
"{n} files at the mod's top level are where the game never reads them; this one's kind is read from {home}." = "{n} arquivos no nível superior do mod estão onde o jogo nunca os lê; o tipo deste é lido em {home}."
"{n} files under {folder} are where the game never reads them; this one's kind is read from {home}." = "{n} arquivos em {folder} estão onde o jogo nunca os lê; o tipo deste é lido em {home}."
"Move each file to the folder the game reads its kind from." = "Mova cada arquivo para a pasta de onde o jogo lê o seu tipo."
"The game never reads this file: it reads {kind} files from {home}." = "O jogo nunca lê este arquivo: ele lê arquivos de {kind} em {home}."
"Move it to that folder, or remove it if it is not needed." = "Mova-o para essa pasta ou remova-o se não for necessário."
"This file cannot be read: {error}" = "Não é possível ler este arquivo: {error}"
"Reinstall the package and check that its archives are intact and readable." = "Reinstale o pacote e confira se os arquivos dele estão íntegros e legíveis."
"This text file exceeds the validator's per-file text budget and was not parsed." = "Este arquivo de texto passa do limite de texto por arquivo do validador e não foi analisado."
"Split large definition files into smaller files before validating again." = "Divida os arquivos de definição grandes em arquivos menores antes de validar de novo."
"Model texture" = "Textura de modelo"
"Map feature" = "Objeto do mapa"
"The terrain has no matching OTA metadata and cannot appear as a normal selectable map." = "O terreno não tem metadados OTA correspondentes e não pode aparecer como um mapa comum selecionável."
"Include a matching maps/<name>.ota with a GlobalHeader and playable schemas." = "Inclua um maps/<name>.ota correspondente, com um GlobalHeader e esquemas jogáveis."
"This sound will not play: {problem}." = "Este som não será reproduzido: {problem}."
"Save it as a WAV file in PCM (8 or 16-bit) or IMA ADPCM, as TA's own sounds are." = "Salve-o como arquivo WAV em PCM (8 ou 16 bits) ou IMA ADPCM, como os sons do próprio TA."
"Correct the brackets and braces around this line: the game reads the file as it is and skips or misplaces what follows." = "Corrija os colchetes e as chaves em volta desta linha: o jogo lê o arquivo como está e pula ou desloca o que vem depois."
"[{section}] footprint {x} × {z} is clamped to 1..{max} cells a side by Reborn." = "A área ocupada {x} × {z} de [{section}] é limitada pelo Reborn a 1..{max} células por lado."
"Use footprints within the supported range and regenerate the matching yard map." = "Use áreas ocupadas dentro do intervalo compatível e gere de novo o mapa de pátio correspondente."
"Missing [UNITINFO]; this unit is skipped." = "Falta [UNITINFO]; esta unidade é ignorada."
"Add a UNITINFO section with a non-empty UnitName." = "Adicione uma seção UNITINFO com um UnitName não vazio."
"UNITINFO has no usable UnitName; this unit is skipped." = "UNITINFO não tem um UnitName utilizável; esta unidade é ignorada."
"Give the unit a unique, non-empty UnitName and update its references." = "Dê à unidade um UnitName único e não vazio e atualize as referências a ele."
"{name} model" = "modelo de {name}"
"{name} script" = "script de {name}"
"{name} {key}" = "{name} {key}"
"{name} death explosion" = "explosão de morte de {name}"
"{name} self-destruct explosion" = "explosão de autodestruição de {name}"
"{name} wreckage" = "destroço de {name}"
"{name} faction" = "facção {name}"
"{name} sounds" = "sons de {name}"
"{name} movement class" = "classe de movimento de {name}"
"{name} projectile model" = "modelo de projétil de {name}"
"{name} explosion" = "explosão de {name}"
"{name} water explosion" = "explosão na água de {name}"
"{name} lava explosion" = "explosão na lava de {name}"
"{name} firing sound" = "som de disparo de {name}"
"{name} impact sound" = "som de impacto de {name}"
"{name} water impact sound" = "som de impacto na água de {name}"
"{name} uses unsupported RenderType={n}; Reborn will use its fallback projectile appearance." = "{name} usa RenderType={n}, sem suporte; o Reborn usará a aparência de projétil reserva."
"Use TA RenderType 0..7, or report the required extension to Reborn's maintainers." = "Use um RenderType de TA de 0 a 7 ou informe a extensão necessária aos mantenedores do Reborn."
"{name} feature model" = "modelo de objeto de {name}"
"{name} animation" = "animação de {name}"
"{name} shadow" = "sombra de {name}"
"{name} burn animation" = "animação de queima de {name}"
"{name} dead replacement" = "substituto morto de {name}"
"{name} burnt replacement" = "substituto queimado de {name}"
"{name} reclaimed replacement" = "substituto reciclado de {name}"
"{name} burning weapon" = "arma incendiária de {name}"
"{category} {key} sound" = "som {key} de {category}"
"[{section}] needs a faction name and starting commander." = "[{section}] precisa de um nome de facção e de um comandante inicial."
"Set name and commander to a valid faction and UnitName." = "Defina name e commander com uma facção e um UnitName válidos."
"{name} starting commander" = "comandante inicial de {name}"
"Build-menu owner" = "Dono do menu de construção"
"{name} build option" = "opção de construção de {name}"
"Download build-menu owner" = "Dono do menu de construção do download"
"Missing [GlobalHeader]; this map has no usable metadata." = "Falta [GlobalHeader]; este mapa não tem metadados utilizáveis."
"Export a matching OTA with a GlobalHeader and the desired game-type schemas." = "Exporte um OTA correspondente com um GlobalHeader e os esquemas de tipo de jogo desejados."
"Map terrain, without which the map is left out of the lists" = "Terreno do mapa, sem o qual o mapa fica fora das listas"
"Map meteor weapon" = "Arma de meteoros do mapa"
"Map placed unit/feature" = "Unidade ou objeto colocado no mapa"
"This tolerant TDF parse contains no sections; section-based consumers ignore it." = "Esta leitura tolerante de TDF não contém seções; quem depende de seções a ignora."
"Check the intended format and section headers if this file should define game content." = "Confira o formato pretendido e os cabeçalhos de seção se este arquivo deveria definir conteúdo do jogo."
"{what} defined here is never used: {later} ({whose}) defines it too and comes later, so the game uses that one." = "A definição de {what} aqui nunca é usada: {later} ({whose}) também a define e vem depois, então o jogo usa aquela."
"{n} definitions in this file are never used: other files define them too and come later, so the game uses those (for one, {what} is also in {later}, {whose})." = "{n} definições neste arquivo nunca são usadas: outros arquivos também as definem e vêm depois, então o jogo usa essas (por exemplo, {what} também está em {later}, {whose})."
"Replace those files in the mod (give yours their paths), or name your file so that it sorts after them." = "Substitua esses arquivos no mod (dê aos seus os mesmos caminhos) ou nomeie o seu arquivo de modo que fique depois deles na ordem."
"{name} production button" = "botão de produção de {name}"
"No playable side definitions were loaded." = "Nenhuma definição de facção jogável foi carregada."
"Include gamedata/sidedata.tdf or inherit the base game's valid sides." = "Inclua gamedata/sidedata.tdf ou herde as facções válidas do jogo base."
"Include the referenced asset/definition, correct its name, or declare and install the required mod dependency. Names are case-insensitive." = "Inclua o recurso ou a definição referenciada, corrija o nome dele ou declare e instale a dependência de mod necessária. Os nomes não diferenciam maiúsculas de minúsculas."
"Model texture: textures {names} are missing." = "Textura de modelo: faltam as texturas {names}."
"{whats}: {what} is an empty file here, which blanks it out: nothing of it is read." = "{whats}: {what} é um arquivo vazio aqui, o que o anula: nada dele é lido."
"{whats}: {what} is missing." = "{whats}: {what} está ausente."
"Referenced weapon explosions require at least {texels} padded sprite texels, beyond a {side} x {side} reference atlas, even drawn reduced. Frames will be omitted at this capacity; map features, generated effects and shelf packing need additional room." = "As explosões de armas referenciadas exigem pelo menos {texels} texels de sprite com margem, mais do que um atlas de referência de {side} x {side}, mesmo desenhadas em tamanho reduzido. Quadros serão omitidos com essa capacidade; objetos do mapa, efeitos gerados e o encaixe em prateleiras precisam de espaço adicional."
"Reduce explosion frame sizes/counts or split optional effects. Test on the target GPU; this static check uses a reference atlas size." = "Reduza o tamanho ou o número dos quadros de explosão ou divida os efeitos opcionais. Teste na GPU de destino; esta verificação estática usa um tamanho de atlas de referência."
"{what} has no frames or contains a frame larger than the {side}-pixel reference atlas side including padding." = "{what} não tem quadros ou tem um quadro maior que o lado de {side} pixels do atlas de referência, margem incluída."
"Include usable frames and resize oversized animation frames." = "Inclua quadros utilizáveis e redimensione os quadros de animação grandes demais."
"{name} ({px} px)" = "{name} ({px} px)"
"{n} more" = "mais {n}"
"The weapons' explosions take {full} Mi texels as painted, more than the {budget} Mi the game gives them in a {side} x {side} atlas: {n} of them, larger than TA's own, are drawn reduced to {share}% of their texels across, each as big as painted ({named})." = "As explosões das armas ocupam {full} Mi texels como pintadas, mais que os {budget} Mi que o jogo lhes dá em um atlas de {side} x {side}: {n} delas, maiores que as do próprio TA, são desenhadas reduzidas a {share}% dos texels de largura, cada uma tão grande quanto pintada ({named})."
"Nothing to do: the game draws them so. Smaller paintings would keep more of their detail." = "Nada a fazer: o jogo as desenha assim. Pinturas menores manteriam mais detalhes."
"Large: {frames} frames up to {largest} pixels across, {millions} million pixels in all, more than the game decodes at once. It reads them a frame at a time and draws them reduced, each as big as painted: a weapon's explosion is read so." = "Grande: {frames} quadros de até {largest} pixels de largura, {millions} milhões de pixels no total, mais do que o jogo decodifica de uma vez. Ele os lê um quadro por vez e os desenha reduzidos, cada um tão grande quanto pintado: a explosão de uma arma é lida assim."
"Nothing to do: the game draws it so. Smaller paintings would load faster and keep more of their detail." = "Nada a fazer: o jogo a desenha assim. Pinturas menores carregariam mais rápido e manteriam mais detalhes."
"This file is empty: TA's way of blanking out a file of the same name below it (the original game's, or that of a mod it is mounted over). The game reads nothing from it." = "Este arquivo está vazio: é o jeito de TA de anular um arquivo de mesmo nome que esteja abaixo dele (o do jogo original ou o de um mod sobre o qual ele é montado). O jogo não lê nada dele."
"{n} empty files here ({files}): TA's way of blanking out files of the same names below them (the original game's, or those of a mod they are mounted over). The game reads nothing from them." = "{n} arquivos vazios aqui ({files}): é o jeito de TA de anular arquivos de mesmo nome que estejam abaixo deles (os do jogo original ou os de um mod sobre o qual são montados). O jogo não lê nada deles."
"Nothing to do if they are meant to remove those files. If one should hold data, export it again." = "Nada a fazer se a intenção é remover esses arquivos. Se algum deveria ter dados, exporte-o de novo."
"Texture {name} has {frames} frames; Reborn's model vertices address at most 255 and this entry uses fallback paint." = "A textura {name} tem {frames} quadros; os vértices de modelo do Reborn endereçam no máximo 255 e esta entrada usa a pintura reserva."
"Reduce this texture entry to at most 255 frames." = "Reduza esta entrada de textura a no máximo 255 quadros."
"Texture {name} ({frames} frames) falls back: the textures the models paint with fill the reference GPU profile's {banks} arrays of {layers} layers ({before} layers before it; one is reserved for fallback). Actual device limits may differ." = "A textura {name} ({frames} quadros) cai na reserva: as texturas com que os modelos são pintados preenchem os {banks} arrays de {layers} camadas do perfil de GPU de referência ({before} camadas antes dela; uma é reservada para a reserva). Os limites reais do dispositivo podem ser diferentes."
"Consolidate duplicate textures or reduce animation/team frame counts. Test on the target GPU; higher limits do not fix unsupported frame counts." = "Consolide as texturas duplicadas ou reduza o número de quadros de animação e de equipe. Teste na GPU de destino; limites maiores não resolvem números de quadros sem suporte."
"{script} declares piece {piece}, which is absent from {model}. Any animation or position query using it has no matching model part." = "{script} declara a peça {piece}, que não existe em {model}. Qualquer animação ou consulta de posição que a use não tem parte de modelo correspondente."
"{script} declares pieces {pieces}, which are absent from {model}. Any animation or position query using them has no matching model part." = "{script} declara as peças {pieces}, que não existem em {model}. Qualquer animação ou consulta de posição que as use não tem parte de modelo correspondente."
"Confirm that these are intentional virtual/helper pieces; otherwise use matching model and COB files or align the BOS piece declarations with the model's piece names." = "Confirme que são peças virtuais ou auxiliares de propósito; caso contrário, use arquivos de modelo e COB correspondentes ou alinhe as declarações de peças do BOS com os nomes das peças do modelo."
"{unit} has {weapon} but its script {script} has no {function}: if the weapon fires, its shots leave from the unit's centre, not a barrel." = "{unit} tem {weapon}, mas seu script {script} não tem {function}: se a arma disparar, os tiros saem do centro da unidade, não de um cano."
"{unit} has {weapons} but its script {script} has no {functions}: if they fire, their shots leave from the unit's centre, not a barrel." = "{unit} tem {weapons}, mas seu script {script} não tem {functions}: se dispararem, os tiros saem do centro da unidade, não de um cano."
"Add the functions to the unit's BOS script, returning the pieces the shots leave from, and recompile." = "Adicione as funções ao script BOS da unidade, devolvendo as peças de onde saem os tiros, e recompile."
"{unit} builds but its script {script} has no QueryNanoPiece: its build spray comes from the unit's centre." = "{unit} constrói, mas seu script {script} não tem QueryNanoPiece: o jato de construção sai do centro da unidade."
"Add QueryNanoPiece to the unit's BOS script, returning its nano-lathe piece, and recompile." = "Adicione QueryNanoPiece ao script BOS da unidade, devolvendo a peça do nano-torno, e recompile."
"{unit} can be built but has no picture ({picture}): TA's classic panels and the encyclopaedia show none; Reborn's own panel draws one from its model." = "{unit} pode ser construída, mas não tem imagem ({picture}): os painéis clássicos de TA e a enciclopédia não mostram nenhuma; o painel próprio do Reborn desenha uma a partir do modelo."
"Add a 64 × 64 PCX of the unit to unitpics/." = "Adicione um PCX de 64 × 64 da unidade em unitpics/."
"Re-export this asset in the original TA format, within Reborn's documented parser limits; replace truncated or corrupt files." = "Exporte este recurso de novo no formato original de TA, dentro dos limites documentados do leitor do Reborn; substitua arquivos truncados ou corrompidos."
"The game cannot read this file: {error}" = "O jogo não consegue ler este arquivo: {error}"
"The section name [{name} has no closing ]." = "O nome de seção [{name} não tem o ] de fechamento."
"[{name}] has no { } body after it: what follows is read into the section around it." = "[{name}] não tem corpo { } depois dele: o que vem a seguir é lido na seção ao redor."
"This } closes no section." = "Este } não fecha nenhuma seção."
"A { opened on this line is never closed." = "Um { aberto nesta linha nunca é fechado."
"[{name}] opened on this line is never closed: any section after it is read as part of it." = "[{name}] aberto nesta linha nunca é fechado: qualquer seção depois dele é lida como parte dele."
"A /* comment opened on this line never ends: the rest of the file is read as a comment." = "Um comentário /* aberto nesta linha nunca termina: o resto do arquivo é lido como comentário."


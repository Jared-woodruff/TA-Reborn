"The review found 27 missing data references, including explosion weapons and six feature graphics or models. A missing reference does not always mean the affected behavior is used in play." = "A análise encontrou 27 referências de dados ausentes, incluindo armas de explosão e seis gráficos ou modelos de objetos. Uma referência ausente nem sempre significa que o comportamento afetado é usado na partida."
"Use the local automated report to locate each source reference. Supply the missing assets, correct the reference, or explain why the unused definition is intentional." = "Use o relatório automático local para localizar cada referência de origem. Adicione os recursos ausentes, corrija a referência ou explique por que a definição não utilizada é intencional."
"Inherited base-game placeholders" = "Arquivos provisórios herdados do jogo base"
"These rejected placeholder files come from the base game in the reviewed installation, not Escalation. They do not establish a mod defect." = "Esses arquivos provisórios rejeitados vêm do jogo base na instalação testada, não do Escalation. Eles não comprovam um defeito do mod."
"Use the local report's layer field to verify origin. Only replace these assets if your mod intentionally overrides them." = "Verifique a origem no campo de camada do relatório local. Substitua esses recursos apenas se o seu mod os sobrescrever intencionalmente."
"Computer players can stall" = "Jogadores controlados pela IA podem ficar parados"
"AI Boost is included and computer players work on Asteroid Field, but can stall on some other space maps." = "O AI Boost está incluído e os jogadores controlados pela IA funcionam em Asteroid Field, mas podem ficar parados em outros mapas espaciais."
"Test each space map with computer players before publishing it. Asteroid Field is the reviewed starting point." = "Teste cada mapa espacial com jogadores controlados pela IA antes de publicá-lo. Asteroid Field é o ponto de partida analisado."
"Damaged optional map archives" = "Arquivos de mapas opcionais danificados"
"The optional map packs contain three damaged map archives. These are separate downloads and may not be present in your installation." = "Os pacotes de mapas opcionais contêm três arquivos de mapas danificados. São downloads separados e talvez não estejam na sua instalação."
"Import working maps individually. Rebuild or replace damaged archives before distributing a map pack." = "Importe os mapas que funcionam individualmente. Recrie ou substitua os arquivos danificados antes de distribuir um pacote de mapas."
"Unfinished preview armies" = "Exércitos preliminares inacabados"
"Its new armies use ARM's name, and some units are unfinished in this early preview." = "Seus novos exércitos usam o nome ARM e algumas unidades estão inacabadas nesta prévia inicial."
"Give each army its intended side identity and complete its unit data and assets. Check every faction in a skirmish." = "Dê a cada exército sua identidade de facção e complete os dados e recursos das unidades. Verifique cada facção em uma escaramuça."
"Expanded ARM and CORE armies with new units and weapons." = "Exércitos ARM e CORE ampliados com novas unidades e armas."
"549 UNITS" = "549 UNIDADES"
"177 MAPS" = "177 MAPAS"
"Gold 10.2.0 installs and plays: computer players build and fight, every unit is painted and every explosion drawn. A few wrecks have no model in the mod's own files." = "Gold 10.2.0 é instalado e jogável: os jogadores controlados pelo computador constroem e combatem, todas as unidades são pintadas e todas as explosões são desenhadas. Alguns destroços não têm modelo nos arquivos do próprio mod."
"Total Annihilation as Cavedog might have carried it on: every unit earns its place, hundreds more join, and a third tech level tops it off." = "Total Annihilation como a Cavedog poderia tê-lo continuado: cada unidade conquista seu lugar, centenas de novas se juntam, e um terceiro nível tecnológico coroa tudo."
"500 UNITS" = "500 UNIDADES"
"105 MAPS" = "105 MAPAS"
"TECH 3" = "TEC 3"
"Faster games that keep the strategy: new units, each carefully balanced, and hard-hitting armies from the start." = "Partidas mais rápidas que mantêm a estratégia: novas unidades, cada uma cuidadosamente balanceada, e exércitos de golpes pesados desde o início."
"FASTER GAMES" = "PARTIDAS RÁPIDAS"
"297 UNITS" = "297 UNIDADES"
"Still in alpha, and a big download." = "Ainda em alfa, e um download grande."
"Big and brutal: 512 units, fierce fighting, and new sounds and effects throughout." = "Grande e brutal: 512 unidades, combates ferozes, e novos sons e efeitos por toda parte."
"512 UNITS" = "512 UNIDADES"
"91 MAPS" = "91 MAPAS"
"The optional map weapons in its download are left out." = "As armas de mapa opcionais do download ficam de fora."
"A third army, the Talon, from ten years of the community's ideas: teleporters, air transports that carry whole squads, and more." = "Um terceiro exército, os Talon, fruto de dez anos de ideias da comunidade: teletransportadores, transportes aéreos que levam esquadrões inteiros, e mais."
"NEW RACE" = "NOVA RAÇA"
"Choose TAL as your side in a skirmish." = "Escolha TAL como seu lado numa escaramuça."
"Cavedog's style, kept simple: every unit has a clear job and looks as if it always belonged." = "O estilo da Cavedog, mantido simples: cada unidade tem uma função clara e parece que sempre esteve lá."
"CLASSIC STYLE" = "ESTILO CLÁSSICO"
"NEW COMMANDERS" = "NOVOS COMANDANTES"
"Classic BattleTech at Total Annihilation's scale: the Inner Sphere against the Clans, with walking mechs." = "BattleTech clássico na escala de Total Annihilation: a Inner Sphere contra os Clãs, com mechs que andam."
"BATTLETECH" = "BATTLETECH"
"NEW SIDES" = "NOVOS LADOS"
"Computer players are weaker as the Inner Sphere." = "A IA é mais fraca jogando como a Inner Sphere."
"The original's feel with well-balanced units and structures, tuned by veterans of the game." = "A sensação do original com unidades e estruturas bem balanceadas, ajustadas por veteranos do jogo."
"CLASSIC FEEL" = "SENSAÇÃO CLÁSSICA"
"Computer players struggle as ARM." = "A IA tem dificuldades jogando como ARM."
"An add-on race in the making: new units and new weapons for a third and a fourth army." = "Uma raça adicional em produção: novas unidades e novas armas para um terceiro e um quarto exército."
"NEW RACES" = "NOVAS RAÇAS"
"PREVIEW" = "PRÉVIA"
"An early preview: its new armies go by ARM's name, and some of their units are unfinished." = "Uma prévia inicial: seus novos exércitos usam o nome do ARM, e algumas de suas unidades estão inacabadas."
"Take ARM and CORE into space with command cruisers and fleets of warships." = "Leve ARM e CORE ao espaço com cruzadores de comando e frotas de naves de guerra."
"SPACE WARFARE" = "GUERRA ESPACIAL"
"172 UNITS" = "172 UNIDADES"

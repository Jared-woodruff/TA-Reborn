# apps/ta_game/scenarios/armageddon.toml
"Armageddon" = "Armagedom"
"Two armies, one plain, no retreat. Win the battle of the war." = "Dois exércitos, uma planície, nenhuma retirada. Vença a batalha da guerra."
"Commander, the Core's main army is marching north across the Mounds, and ours stands in its way. There are no bases here, no factories, no reinforcements: what you have is all you will ever have.\n\nThey outnumber us. We outgun them. Put the Lugers and the Merls on their columns as they close, hold the line with the Zeus, and keep the Jethros with the tanks: they will bring gunships. Their reserves arrive two and a half minutes in.\n\nDestroy every one of them." = "Comandante, o exército principal do Core marcha para o norte pelos Mounds, e o nosso está no caminho dele. Não há bases aqui, nem fábricas, nem reforços: o que você tem é tudo o que vai ter.\n\nEles estão em maior número. Nós temos mais poder de fogo. Ponha os Lugers e os Merls sobre as colunas deles enquanto se aproximam, segure a linha com os Zeus e mantenha os Jethros junto aos tanques: eles vão trazer aeronaves de ataque. As reservas deles chegam aos dois minutos e meio.\n\nDestrua cada um deles."
"Arm Command" = "Comando Arm"
"Here they come. Hold the line, and keep the Jethros with the tanks." = "Lá vêm eles. Segurem a linha e mantenham os Jethros com os tanques."
"Their reserves are coming up behind the mounds, a Goliath at their head." = "As reservas deles estão chegando por trás dos montes, com um Goliath à frente."

# apps/ta_game/scenarios/armistice.toml
"The Armistice" = "O Armistício"
"Five minutes of peace to build an army. Then the war resumes." = "Cinco minutos de paz para construir um exército. Depois, a guerra recomeça."
"Commander, the peace talks on Reactor Grid have failed. The armistice holds for five more minutes: until then no weapon may fire, and neither side may build near the other's base. When it ends, the war resumes.\n\nBoth sides are rearming at a furious pace: resources and construction run at twice their usual speed, and the treaty's one lasting clause bans missile silos. Their Commander knows the clock as well as you do.\n\nBuild as you have never built. When the armistice ends, destroy the Core Commander." = "Comandante, as negociações de paz em Reactor Grid fracassaram. O armistício vale por mais cinco minutos: até lá, nenhuma arma pode disparar e nenhum dos lados pode construir perto da base do outro. Quando ele acabar, a guerra recomeça.\n\nOs dois lados estão se rearmando num ritmo frenético: recursos e construção correm ao dobro da velocidade normal, e a única cláusula duradoura do tratado proíbe silos de mísseis. O Comandante deles conhece o relógio tão bem quanto você.\n\nConstrua como nunca construiu. Quando o armistício acabar, destrua o Comandante do Core."
"The talks have failed. For five minutes no weapon fires and nobody builds near the other's base. Then it is war: build as you have never built." = "As negociações fracassaram. Por cinco minutos nenhuma arma dispara e ninguém constrói perto da base do outro. Depois é guerra: construa como nunca construiu."
"Their factories are running day and night. Ours should be too." = "As fábricas deles trabalham dia e noite. As nossas também deveriam."
"Core Overseer" = "Supervisor do Core"
"Ten seconds, Arm. We have counted every one of your factories." = "Dez segundos, Arm. Contamos cada uma das suas fábricas."
"Their Commander is somewhere in that grid. Find it, and end this war for good." = "O Comandante deles está em algum lugar daquela grade. Encontre-o e acabe com esta guerra de vez."

# apps/ta_game/scenarios/brothers_in_arms.toml
"Brothers in Arms" = "Irmãos de armas"
"You and an allied Commander against two of the Core's." = "Você e um Comandante aliado contra dois do Core."
"Commander, you are not alone on Highland Rift. Commander Holt's forces hold the river crossings in the north, beside yours in the north-western highlands. Two Core Commanders are dug in to the south, across the canyon.\n\nHolt's computer will fight its own war, but it is the same war: back it up when it is hard pressed, and it will do the same for you. Your forces see what its forces see.\n\nDestroy both Core Commanders. Keep yours alive." = "Comandante, você não está sozinho em Highland Rift. As forças do Comandante Holt guardam as travessias do rio ao norte, ao lado das suas nos planaltos do noroeste. Dois Comandantes do Core estão entrincheirados ao sul, do outro lado do cânion.\n\nO computador de Holt vai travar a própria guerra, mas é a mesma guerra: apoie-o quando estiver em apuros, e ele fará o mesmo por você. Suas forças veem o que as forças dele veem.\n\nDestrua os dois Comandantes do Core. Mantenha o seu vivo."
"Commander Holt" = "Comandante Holt"
"Good to have you on the line. I'll hold the river crossings in the north; you take the western highlands." = "Bom ter você na linha. Eu seguro as travessias do rio ao norte; você fica com os planaltos do oeste."
"My scouts have found both of their bases. The south-western one is yours; I'll keep the other busy." = "Meus batedores acharam as duas bases deles. A do sudoeste é sua; eu mantenho a outra ocupada."
"They're massing at the canyon. If they come for one of us, the other hits them from the side." = "Eles estão se reunindo no cânion. Se atacarem um de nós, o outro os atinge pelo flanco."
"Still with me? Then let's finish it. Everything we have, at their Commanders." = "Ainda comigo? Então vamos terminar. Tudo o que temos, contra os Comandantes deles."

# apps/ta_game/scenarios/decapitation.toml
"Kill the Core Commander on his island fortress. From the air." = "Mate o Comandante do Core em sua fortaleza na ilha. Pelo ar."
"Commander, a Core Commander has made his fortress on the island at the centre of this lava sea. Nothing on treads or legs will reach him, and his anti-air is the best the Core can build.\n\nYou have a small air wing and a forward airfield in the south-west corner: build it up. Strip away his air defences, then send the bombers in; a handful sent straight at him will not get through. Brawler gunships hit hard but die fast over flak, and the Freedom Fighters can keep his fighters off your bombers.\n\nHis reinforcements arrive in fifteen minutes. Before then, he must be dead." = "Comandante, um Comandante do Core fez sua fortaleza na ilha no centro deste mar de lava. Nada sobre esteiras ou pernas vai alcançá-lo, e a defesa antiaérea dele é a melhor que o Core sabe construir.\n\nVocê tem uma pequena ala aérea e um aeródromo avançado no canto sudoeste: reforce-o. Desmonte as defesas antiaéreas dele e então mande os bombardeiros; um punhado enviado direto contra ele não vai passar. As aeronaves de ataque Brawler batem forte, mas caem rápido sob fogo antiaéreo, e os Freedom Fighters podem manter os caças dele longe dos seus bombardeiros.\n\nOs reforços dele chegam em quinze minutos. Até lá, ele tem de estar morto."

# apps/ta_game/scenarios/doomsday_clock.toml
"Doomsday Clock" = "Relógio do Juízo Final"
"The Core's missile launches in fifteen minutes. Stop it." = "O míssil do Core será lançado em quinze minutos. Impeça-o."
"Commander, a Silencer nuclear silo stands at the heart of the Core base across these metal plains, and it is arming. In fifteen minutes the missile flies, and your base is the target.\n\nDestroy the silo. Nothing else matters: not their Commander, not their factories. The silo sits behind heavy laser towers and a Punisher battery, and their Commander will not sit still while you come for it.\n\nYou have a base, two factories and two construction kbots. The clock is running." = "Comandante, um silo nuclear Silencer está no coração da base do Core, do outro lado destas planícies de metal, e está sendo armado. Em quinze minutos o míssil voa, e sua base é o alvo.\n\nDestrua o silo. Nada mais importa: nem o Comandante deles, nem as fábricas deles. O silo fica atrás de torres laser pesadas e de uma bateria Punisher, e o Comandante deles não vai ficar parado enquanto você avança contra ele.\n\nVocê tem uma base, duas fábricas e dois kbots de construção. O relógio está correndo."
"Ten minutes to launch, Commander." = "Dez minutos para o lançamento, Comandante."
"Five minutes to launch. That silo has to go." = "Cinco minutos para o lançamento. Aquele silo tem que cair."
"One minute! Get to that silo!" = "Um minuto! Vá até aquele silo!"

# apps/ta_game/scenarios/endless_siege.toml
"Endless Siege" = "Cerco Sem Fim"
"The waves never stop. Survive as long as you can." = "As ondas nunca param. Sobreviva o máximo que puder."
"Commander, there is no rescue coming, no reinforcements, no victory. The Core has found your outpost in the mesas and will throw everything it has at it, from three directions, for as long as it takes.\n\nKbots, then tanks, then artillery and bombers; heavier every time, and now and then something enormous. Build an economy, build defences, and hold on.\n\nYour best time is kept. Beat it." = "Comandante, não virá resgate, nem reforços, nem vitória. O Core encontrou seu posto avançado nos platôs e vai lançar contra ele tudo o que tem, de três direções, pelo tempo que for preciso.\n\nKbots, depois tanques, depois artilharia e bombardeiros; mais pesados a cada vez, e de vez em quando algo enorme. Construa uma economia, construa defesas e aguente firme.\n\nSeu melhor tempo fica registrado. Supere-o."

# apps/ta_game/scenarios/extraction.toml
"Extraction" = "Extração"
"Get your Commander down the lava river to the pick-up point." = "Leve seu Comandante rio de lava abaixo até o ponto de resgate."
"Commander, your drop went wrong. You are on the south bank of a river of lava at the western end of the Run, with what is left of your escort, and the dropships can only land at the far eastern end.\n\nThe Core has guns all along the north bank, and patrols on your side of the river. Keep away from the lava's edge (their laser towers reach no further), deal with the patrols, and get your Commander to the pick-up point. Whatever guards it will not come to you. Core troops are already following your tracks; do not stop for long.\n\nAnything else is expendable. Your Commander is not." = "Comandante, seu desembarque deu errado. Você está na margem sul de um rio de lava, na ponta oeste do Lava Run, com o que restou da sua escolta, e as naves de desembarque só podem pousar no extremo leste.\n\nO Core tem canhões ao longo de toda a margem norte e patrulhas do seu lado do rio. Fique longe da beira da lava (as torres laser deles não alcançam além dela), cuide das patrulhas e leve seu Comandante até o ponto de resgate. O que estiver guardando o ponto não virá até você. Tropas do Core já seguem seus rastros; não pare por muito tempo.\n\nTodo o resto é dispensável. Seu Comandante não."

# apps/ta_game/scenarios/iron_rain.toml
"Iron Rain" = "Chuva de ferro"
"Two Intimidators are shelling your base. Take the mesa and silence them." = "Dois Intimidators estão bombardeando sua base. Tome o platô e silencie-os."
"Commander, the Core has hauled two Intimidators, its long-range plasma cannons, onto the mesas in the middle of the canyon. Your base is inside their range. Every eight seconds each of them will put a shell among your buildings, until you silence them.\n\nThe battery is dug in behind heavy laser towers and a Punisher, with tanks on the ramps, and the Core's main base lies beyond it, to the south-east. Its Commander will send what it can.\n\nSpread out, build fast and take that mesa. Destroy both Intimidators." = "Comandante, o Core levou dois Intimidators, seus canhões de plasma de longo alcance, para os platôs no meio do cânion. Sua base está dentro do alcance deles. A cada oito segundos, cada um deles vai lançar um projétil entre seus edifícios, até você silenciá-los.\n\nA bateria está entrincheirada atrás de torres laser pesadas e de um Punisher, com tanques nas rampas, e a base principal do Core fica além dela, a sudeste. O Comandante deles vai mandar o que puder.\n\nEspalhe-se, construa rápido e tome aquele platô. Destrua os dois Intimidators."
"Commander, two Intimidators on the mesas have your range. Every eight seconds each of them will put a shell into your base." = "Comandante, dois Intimidators nos platôs têm sua base ao alcance. A cada oito segundos, cada um deles vai lançar um projétil na sua base."
"A Core radar post in the canyon to the south-east is spotting for those guns. Knock it out and they can no longer see your base." = "Um posto de radar do Core no cânion, a sudeste, está guiando o fogo daqueles canhões. Destrua-o e eles não poderão mais ver sua base."
"Spread your buildings out: a shell that lands among them takes them all." = "Espalhe seus edifícios: um projétil que cai entre eles leva todos."
"Their gunners have your range now. Take that mesa, Commander!" = "Os artilheiros deles já acertaram a mira. Tome aquele platô, Comandante!"

# apps/ta_game/scenarios/king_of_the_hill.toml
"King of the Hill" = "Rei da Colina"
"Hold the summit for four minutes before the Core does." = "Domine o cume por quatro minutos antes do Core."
"Commander, the spiral mountain at the heart of this plain is rich in metal, and whoever holds its summit holds the planet. A Core Commander has landed to the north with the same idea.\n\nTake the summit and keep it: four minutes in all with only your forces on top wins it. Contested, the clock stands still. If the Core holds it alone for four minutes, the mountain is theirs.\n\nThe Core will keep sending troops up the slopes. Build up, get there first, and dig in." = "Comandante, a montanha em espiral no coração desta planície é rica em metal, e quem domina o cume domina o planeta. Um Comandante do Core pousou ao norte com a mesma ideia.\n\nTome o cume e mantenha-o: quatro minutos no total com apenas as suas forças no topo garantem a vitória. Com o cume em disputa, o relógio para. Se o Core o dominar sozinho por quatro minutos, a montanha é dele.\n\nO Core vai continuar mandando tropas encosta acima. Fortaleça-se, chegue primeiro e entrincheire-se."
"Core troops are climbing the north slope. Don't let them dig in on the summit." = "Tropas do Core estão subindo a encosta norte. Não deixe que se entrincheirem no topo."
"Raiders are coming round the mountain for your base." = "Invasores estão contornando a montanha rumo à sua base."

# apps/ta_game/scenarios/last_stand.toml
"Last Stand" = "Última Resistência"
"Hold the pass for twelve minutes. They will not stop coming." = "Segure o desfiladeiro por doze minutos. Eles não vão parar de vir."
"Commander, the Core has broken through at Varrin Gap. The only way into the valley behind you is the winding pass ahead, and your outpost at its western mouth is all that stands in the way.\n\nReinforcements are twelve minutes out. Hold until they arrive. Core forces will come through the pass in waves, each heavier than the last; expect bombers, and expect worse at the end: our scouts have seen something very large moving in the east.\n\nYou have a small base, a kbot lab and two construction kbots. Build what you can. Keep your Commander alive." = "Comandante, o Core rompeu nossas linhas no Passo de Varrin. O único caminho para o vale atrás de você é o desfiladeiro sinuoso à frente, e seu posto avançado na entrada oeste dele é tudo o que há no caminho do inimigo.\n\nOs reforços estão a doze minutos daqui. Resista até que cheguem. As forças do Core vão atravessar o desfiladeiro em ondas, cada uma mais pesada que a anterior; espere bombardeiros, e espere coisa pior no final: nossos batedores viram algo muito grande se movendo no leste.\n\nVocê tem uma pequena base, um laboratório de kbots e dois kbots de construção. Construa o que puder. Mantenha seu Comandante vivo."
"Outpost, this is Arm Command. The relief force is twelve minutes out. Nothing gets through that pass before it arrives." = "Posto avançado, aqui é o Comando Arm. Os reforços estão a doze minutos. Nada atravessa aquele desfiladeiro antes de eles chegarem."
"Radar: aircraft inbound from the east. Bombers! Get your anti-air up." = "Radar: aeronaves chegando pelo leste. Bombardeiros! Prepare sua defesa antiaérea."
"Seismic contact in the pass. It's the big one, Commander: a Krogoth." = "Contato sísmico no desfiladeiro. É o grandão, Comandante: um Krogoth."
"One minute! The relief force is entering the valley." = "Um minuto! Os reforços estão entrando no vale."

# apps/ta_game/scenarios/metal_rush.toml
"The first to make 15,000 metal wins. The Core plays rough." = "O primeiro a produzir 15.000 de metal vence. O Core joga pesado."
"Commander, the mining rights to this planet go to whoever proves they can work it: the first side to extract fifteen thousand metal wins it outright.\n\nThe Core is racing you from the western plateau, and the Core has never been known to race fair. Expect raids on your extractors. Build fast, protect your economy, and if you can, take theirs apart.\n\nMetal makers count. Reclaimed metal counts. Whatever you make, counts." = "Comandante, os direitos de mineração deste planeta ficam com quem provar que sabe explorá-lo: o primeiro lado a extrair quinze mil de metal leva tudo.\n\nO Core disputa a corrida com você a partir do platô oeste, e o Core nunca foi conhecido por correr limpo. Espere ataques aos seus extratores. Construa rápido, proteja sua economia e, se puder, desmonte a deles.\n\nConversores de metal contam. Metal reciclado conta. Tudo o que você produzir conta."

# apps/ta_game/scenarios/titans.toml
"Titans" = "Titãs"
"Three Krogoths are walking toward your base. Bring them down." = "Três Krogoths estão marchando rumo à sua base. Derrube-os."
"Commander, seismic stations round the basin are reading footfalls: three Krogoths, the Core's walking fortresses, are crossing the salt pans toward your base, one after another, each with an escort.\n\nNothing out there can stop them but you. A Krogoth's head laser reaches further than your D-gun, so keep your Commander back. Bombers, artillery and massed Zeus will bring one down. Lose your nerve and it will walk through your base.\n\nYou have a base with three factories, four construction kbots and a garrison. Destroy all three of them." = "Comandante, estações sísmicas ao redor da bacia estão registrando passos: três Krogoths, as fortalezas ambulantes do Core, estão atravessando as salinas rumo à sua base, um após o outro, cada um com escolta.\n\nNada lá fora pode detê-los, exceto você. O laser da cabeça de um Krogoth alcança mais longe que seu D-gun, então mantenha seu Comandante recuado. Bombardeiros, artilharia e Zeus em massa derrubam um. Perca a calma e ele vai atravessar sua base.\n\nVocê tem uma base com três fábricas, quatro kbots de construção e uma guarnição. Destrua os três."
"Commander, seismic stations are reading footfalls round the basin. Three Krogoths are walking toward your base, one after another." = "Comandante, estações sísmicas estão registrando passos ao redor da bacia. Três Krogoths marcham rumo à sua base, um após o outro."
"The first Krogoth has crossed the north-western rim. It is coming straight for you." = "O primeiro Krogoth atravessou a borda noroeste. Ele vem direto para você."
"Keep your Commander back: that head laser reaches further than your D-gun." = "Mantenha seu Comandante recuado: aquele laser da cabeça alcança mais longe que seu D-gun."
"The second Krogoth is through the northern pass, with rockets and anti-air round it." = "O segundo Krogoth passou pelo desfiladeiro norte, com foguetes e antiaéreos ao redor."
"The last of them, out of the north-east, with the heaviest escort yet. End this, Commander." = "O último deles, vindo do nordeste, com a escolta mais pesada até agora. Acabe com isso, Comandante."

# apps/ta_game/scenarios/until_dawn.toml
"Until Dawn" = "Até o amanhecer"
"Night falls on the timber. Hold your ridge until the sun comes up." = "A noite cai sobre a floresta. Defenda seu cume até o sol nascer."
"Commander, night is falling over Timberline, and the Core is moving through the forest under it. Your outpost holds the western ridge: the only road out of the valley runs past it.\n\nThe relief column cannot move before first light. Until then you are on your own. In the dark and the rain their raiders will be on you before you see them, so build radar, and keep your floodlights burning.\n\nYou have a small base, a kbot lab and two construction kbots. Hold until dawn, and keep your Commander alive." = "Comandante, a noite está caindo sobre Timberline, e o Core avança pela floresta sob ela. Seu posto avançado guarda o cume oeste: a única estrada que sai do vale passa por ele.\n\nA coluna de socorro não pode se mover antes do amanhecer. Até lá, você está por conta própria. No escuro e na chuva, os invasores deles estarão em cima de você antes que você os veja, então construa radares e mantenha os holofotes acesos.\n\nVocê tem uma base pequena, um Kbot Lab e dois kbots de construção. Resista até o amanhecer e mantenha seu Comandante vivo."
"Outpost Echo, the Core is moving through the timber tonight. Hold your ridge until first light: the relief column marches at dawn." = "Posto Eco, o Core está atravessando a floresta esta noite. Defendam o cume até o amanhecer: a coluna de socorro parte ao raiar do dia."
"Raiders in the eastern trees. In this rain you will hear them before you see them." = "Invasores na mata a leste. Com esta chuva, você vai ouvi-los antes de vê-los."
"Pyros in the north-eastern woods. Keep them out of the trees round your base: the timber will burn." = "Pyros nas matas a nordeste. Mantenha-os longe das árvores ao redor da sua base: a madeira vai pegar fogo."
"A convoy got through from the south-west. Four Zeus and two Jethros are yours, Commander." = "Um comboio conseguiu passar pelo sudoeste. Quatro Zeus e dois Jethros são seus, Comandante."
"Seismic contact in the south-east: heavy treads. They are saving the worst for the last hours of the night." = "Contato sísmico a sudeste: esteiras pesadas. Eles estão guardando o pior para as últimas horas da noite."
"Sunrise in one minute. The relief column is at the river. Hold on!" = "Nascer do sol em um minuto. A coluna de socorro está no rio. Aguentem firme!"

# apps/ta_game/src/chatter.rs
"FIELD COMMANDER" = "COMANDANTE DE CAMPO"
"MACHINE INTELLIGENCE" = "INTELIGÊNCIA DE MÁQUINA"
"MERCENARY" = "MERCENÁRIO"
"Commander. May the better tactician win." = "Comandante. Que vença o melhor estrategista."
"Arm forces in position. Good luck, Commander." = "Forças do Arm em posição. Boa sorte, Comandante."
"Let's keep this clean, Commander." = "Vamos jogar limpo, Comandante."
"Commander. Let's give the historians something to write about." = "Comandante. Vamos dar aos historiadores o que escrever."
"All units, the enemy is in theatre. Begin." = "Todas as unidades, o inimigo está no teatro de operações. Comecem."
"Target acquired. Resistance is inefficient." = "Alvo adquirido. Resistir é ineficiente."
"Your consciousness will be patterned. Eventually." = "Sua consciência será transferida. Mais cedo ou mais tarde."
"Initiating conquest protocol." = "Iniciando protocolo de conquista."
"Your biological limitations have been factored in." = "Suas limitações biológicas já foram computadas."
"Patterning facilities stand ready for your arrival." = "Instalações de transferência de consciência prontas para a sua chegada."
"Hope you brought a spare Commander!" = "Espero que tenha trazido um Comandante de reserva!"
"Let's see what you've got!" = "Vamos ver do que você é capaz!"
"Build fast. It won't matter, but build fast." = "Construa rápido. Não vai adiantar, mas construa rápido."
"Mind if I take your base? Thanks!" = "Tudo bem se eu ficar com a sua base? Valeu!"
"Ooh, a new victim. I mean, opponent." = "Oba, uma vítima nova. Quer dizer, um adversário."
"Greetings, Commander." = "Saudações, Comandante."
"Good luck to you too." = "Boa sorte para você também."
"Likewise, Commander. Now, to business." = "Igualmente, Comandante. Agora, ao que interessa."
"Greeting acknowledged." = "Saudação registrada."
"Salutations are irrelevant." = "Saudações são irrelevantes."
"Hello. Goodbye soon." = "Olá. Adeus em breve."
"Hey yourself!" = "Oi pra você também!"
"gl hf. Mostly hf for me." = "gl hf. O hf fica comigo."
"Hi! Bye! Mostly bye." = "Oi! Tchau! Mais tchau."
"gg, Commander." = "gg, Comandante."
"Good game. Well fought." = "Boa partida. Bem lutado."
"gg. Data retained for analysis." = "gg. Dados retidos para análise."
"Game assessment: good." = "Avaliação da partida: boa."
"gg!" = "gg!"
"gg. Rematch?" = "gg. Revanche?"
"Big words from a small army." = "Muita conversa para um exército tão pequeno."
"We'll see who's laughing when the smoke clears." = "Vamos ver quem ri quando a fumaça baixar."
"Save your breath for the debriefing." = "Guarde o fôlego para o relatório pós-missão."
"Bluster won't hold a ridge, Commander." = "Bravatas não seguram uma colina, Comandante."
"Insolence logged." = "Insolência registrada."
"Your threat rating has been downgraded." = "Seu nível de ameaça foi rebaixado."
"Noise detected. Ignoring." = "Ruído detectado. Ignorando."
"Emotional outburst detected. How quaint." = "Surto emocional detectado. Que pitoresco."
"Oh, it's ON now." = "Ah, agora o bicho VAI PEGAR."
"Talk is cheap. Tanks aren't." = "Falar é fácil. Tanque custa caro."
"Come over here and say that." = "Vem aqui e fala isso na minha cara."
"Says the one who's losing. Probably. I haven't checked." = "Isso vindo de quem tá perdendo. Provavelmente. Nem conferi."
"The Arm does not surrender." = "O Arm não se rende."
"Not while I have a Commander standing." = "Não enquanto eu tiver um Comandante de pé."
"Surrender is not in my programming." = "Rendição não consta na minha programação."
"Negative." = "Negativo."
"Ha! Never!" = "Rá! Nunca!"
"You first." = "Você primeiro."
"That's classified, Commander." = "Isso é confidencial, Comandante."
"Wouldn't you like to know." = "Bem que você queria saber."
"Query rejected." = "Consulta rejeitada."
"Insufficient clearance." = "Autorização insuficiente."
"Dunno. Probably!" = "Sei lá. Provavelmente!"
"Ask me after the battle." = "Pergunte depois da batalha."
"Apology accepted. The attack continues." = "Desculpas aceitas. O ataque continua."
"Apology noted. Irrelevant." = "Desculpas registradas. Irrelevante."
"No you're not!" = "Até parece!"
"Stay focused, Commander." = "Mantenha o foco, Comandante."
"Less talk, more metal." = "Menos conversa, mais metal."
"Noted." = "Anotado."
"Mind the war, Commander." = "Atenção à guerra, Comandante."
"Irrelevant." = "Irrelevante."
"Processing... still irrelevant." = "Processando... ainda irrelevante."
"Your words are being archived." = "Suas palavras estão sendo arquivadas."
"Your input has been compressed. To nothing." = "Sua mensagem foi compactada. Tamanho final: zero."
"Uh huh." = "Aham."
"Cool story." = "Que história legal."
"Keep typing. I'll keep building." = "Continue digitando. Eu continuo construindo."
"Typing won't save you, but I respect the effort." = "Digitar não vai te salvar, mas respeito o esforço."
"Commander down! All units, hold the line!" = "Comandante abatido! Todas as unidades, segurem a linha!"
"You'll pay for that." = "Você vai pagar por isso."
"Command unit lost. Rerouting." = "Unidade de comando perdida. Redirecionando."
"Critical failure. Compensating." = "Falha crítica. Compensando."
"My Commander! That was my favourite!" = "Meu Comandante! Era o meu favorito!"
"Okay, THAT hurt." = "Tá, ISSO doeu."
"Your Commander has fallen." = "Seu Comandante caiu."
"Commander eliminated. Stand down." = "Comandante eliminado. Baixe as armas."
"The war is over for you, Commander." = "A guerra acabou para você, Comandante."
"Enemy command unit terminated." = "Unidade de comando inimiga neutralizada."
"Your Commander has been decommissioned." = "Seu Comandante foi desativado."
"Your consciousness is ready for patterning." = "Sua consciência está pronta para a transferência."
"Boom! Did you need that?" = "Bum! Você ia precisar disso?"
"Scratch one Commander!" = "Menos um Comandante!"
"And THAT'S how it's done!" = "E É ASSIM que se faz!"
"gg. Well fought, Commander." = "gg. Bem lutado, Comandante."
"The Arm will remember this." = "O Arm vai se lembrar disso."
"Well played. I salute you, Commander." = "Bem jogado. Presto continência, Comandante."
"This is not the end. The Core is eternal." = "Este não é o fim. O Core é eterno."
"Defeat recorded. Backup consciousness activating." = "Derrota registrada. Ativando consciência de reserva."
"Shutting down. Your designation has been remembered." = "Desligando. Sua designação foi gravada na memória."
"gg... I'll be back. With more tanks." = "gg... Eu voltarei. Com mais tanques."
"Fine. FINE. gg." = "Tá. TÁ BOM. gg."
"Okay, okay, you win. This time!" = "Tá, tá, você ganhou. Dessa vez!"
"gg, Commander. You fought well." = "gg, Comandante. Você lutou bem."
"Victory. Better luck next time." = "Vitória. Mais sorte da próxima vez."
"Your forces fought bravely. It wasn't enough." = "Suas forças lutaram com bravura. Não foi o bastante."
"Your consciousness will be patterned. gg." = "Sua consciência será transferida. gg."
"Conquest complete." = "Conquista concluída."
"Resistance ended. Your tactics are archived for study." = "Resistência encerrada. Suas táticas foram arquivadas para estudo."
"Too easy! gg." = "Fácil demais! gg."
"gg! Rematch? I'll go easy. Maybe." = "gg! Revanche? Eu pego leve. Talvez."
"gg! Same time tomorrow?" = "gg! Amanhã, no mesmo horário?"
"Nuclear launch detected! Take cover!" = "Lançamento nuclear detectado! Protejam-se!"
"A nuke? So that's how it's going to be." = "Uma bomba nuclear? Então é assim que vai ser."
"Nuclear launch detected. Calculating losses." = "Lançamento nuclear detectado. Calculando perdas."
"Crude. Effective." = "Rudimentar. Eficaz."
"Is that a NUKE?!" = "Isso é uma BOMBA NUCLEAR?!"
"Oh no. Oh no no no." = "Ah, não. Ah, não, não, não."
"Missile away. Nothing personal, Commander." = "Míssil lançado. Nada pessoal, Comandante."
"Look up, Commander." = "Olhe para cima, Comandante."
"Special delivery." = "Entrega especial."
"Heads up! Literally!" = "Cuidado com a cabeça! Literalmente!"
"Special delivery!" = "Entrega especial!"
"A costly engagement. We'll regroup." = "Um confronto custoso. Vamos nos reagrupar."
"You fight well. For now." = "Você luta bem. Por enquanto."
"We'll be back, and in greater numbers." = "Voltaremos, e em maior número."
"Acceptable losses." = "Perdas aceitáveis."
"Losses within projections. Mostly." = "Perdas dentro do previsto. Em grande parte."
"Units lost. Replacements already in production." = "Unidades perdidas. Substitutas já em produção."
"That was my best army!" = "Aquele era o meu melhor exército!"
"Lucky shots. All of them." = "Tiros de sorte. Todos eles."
"Okay, that one was on me." = "Tá, essa foi culpa minha."
"Your forces were outmatched." = "Suas forças foram superadas."
"Send more. We'll wait." = "Mande mais. Nós esperamos."
"Next time, bring more than that." = "Da próxima vez, traga mais do que isso."
"Your forces were inadequate." = "Suas forças se mostraram inadequadas."
"Enemy attrition: optimal." = "Desgaste inimigo: ideal."
"Your offensive has been neutralised." = "Sua ofensiva foi neutralizada."
"Is that all you've got?" = "Isso é tudo o que você tem?"
"Who's next?" = "Quem é o próximo?"
"Thanks for the target practice!" = "Valeu pelo treino de tiro ao alvo!"
"Quiet out there, Commander. Too quiet." = "Silêncio lá fora, Comandante. Silêncio demais."
"Still building? So are we." = "Ainda construindo? Nós também."
"Planning something, Commander? I'd hope so." = "Planejando algo, Comandante? Assim espero."
"Your silence has been noted." = "Seu silêncio foi registrado."
"Scanning... still there, Commander?" = "Escaneando... ainda está aí, Comandante?"
"Inactivity detected. Are you malfunctioning?" = "Inatividade detectada. Você está com defeito?"
"Hello? Anyone home?" = "Alô? Tem alguém em casa?"
"I'm getting bored over here." = "Estou ficando entediado aqui."
"Wake me up when something explodes." = "Me acorda quando alguma coisa explodir."
"That's hardly fair, Commander." = "Isso não é nada justo, Comandante."
"Cheating? The Arm expected better." = "Trapaceando? O Arm esperava mais de você."
"Anomaly detected. Cheat logged." = "Anomalia detectada. Trapaça registrada."
"Rule violation recorded." = "Violação de regra registrada."
"Cheater! I saw that!" = "Trapaceiro! Eu vi isso!"
"Oh, come ON!" = "Ah, FALA SÉRIO!"
"Contact. So this is where you've been hiding." = "Contato. Então é aqui que você estava se escondendo."
"Enemy forces sighted. Engaging." = "Forças inimigas avistadas. Entrando em combate."
"There you are, Commander." = "Aí está você, Comandante."
"Eyes on the enemy. Here we go." = "Inimigo à vista. Lá vamos nós."
"Hostile units located. Initiating elimination." = "Unidades hostis localizadas. Iniciando eliminação."
"Contact established. Probability of your survival: declining." = "Contato estabelecido. Probabilidade da sua sobrevivência: em queda."
"Target acquired." = "Alvo adquirido."
"Biological signatures located. Commencing cleanup." = "Assinaturas biológicas localizadas. Iniciando limpeza."
"Found you!" = "Achei você!"
"Oh, hello there!" = "Opa, olá!"
"Tag, you're it!" = "Tá com você!"
"There you are! I was getting lonely." = "Aí está você! Eu já tava ficando carente."
"One less building for you to worry about." = "Um edifício a menos para você se preocupar."
"Your base is thinning out, Commander." = "Sua base está minguando, Comandante."
"Structure destroyed. Next." = "Estrutura destruída. Próxima."
"Your base planning could use some work, Commander." = "O planejamento da sua base deixa a desejar, Comandante."
"Structure dismantled. Recycling recommended." = "Estrutura desmontada. Reciclagem recomendada."
"Your infrastructure is deteriorating." = "Sua infraestrutura está se deteriorando."
"Demolition complete." = "Demolição concluída."
"Structure reclassified: rubble." = "Estrutura reclassificada: entulho."
"Oops! Was that important?" = "Ops! Isso era importante?"
"Kaboom! Next!" = "Cabum! Próximo!"
"I'm redecorating your base." = "Estou redecorando sua base."
"Bet that one was important!" = "Aposto que esse aí era importante!"
"That was well defended. Impressive." = "Aquilo estava bem defendido. Impressionante."
"A setback. Nothing more." = "Um contratempo. Nada mais."
"You'll pay for that one." = "Essa você vai pagar."
"A clean strike. I'll remember it." = "Um golpe limpo. Vou me lembrar disso."
"Production capacity reduced. Rebuilding." = "Capacidade de produção reduzida. Reconstruindo."
"Loss registered. Replacement scheduled." = "Perda registrada. Substituição agendada."
"Irritating." = "Irritante."
"Infrastructure damage noted. Retaliation queued." = "Dano à infraestrutura registrado. Retaliação na fila."
"Hey! I just built that!" = "Ei! Eu acabei de construir isso!"
"My factory! Right, no more mister nice guy." = "Minha fábrica! Certo, chega de bonzinho."
"Rude." = "Que grosseria."
"Oi! That had a fresh coat of paint!" = "Pô! A pintura ainda tava fresquinha!"
"Commander, meet the {unit}." = "Comandante, conheça o {unit}."
"The {unit} is ready. I'd start running." = "O {unit} está pronto. Eu começaria a correr."
"{unit} online. Your end has been calculated." = "{unit} operacional. Seu fim foi calculado."
"Deploying {unit}. Resistance is futile." = "Mobilizando {unit}. Resistir é inútil."
"Look what I made! A {unit}!" = "Olha o que eu fiz! Um {unit}!"
"Got myself a {unit}. Want to see it up close?" = "Arranjei um {unit}. Quer ver de perto?"
"A {unit}? Bold." = "Um {unit}? Ousado."
"Impressive hardware, Commander. Let's see you use it." = "Equipamento impressionante, Comandante. Quero ver você usá-lo."
"Large enemy unit detected: {unit}. Countermeasures prepared." = "Grande unidade inimiga detectada: {unit}. Contramedidas preparadas."
"Your {unit} has been added to the target list." = "Seu {unit} foi adicionado à lista de alvos."
"Whoa. Is that a {unit}?" = "Uau. Isso é um {unit}?"
"Okay, that's a big one." = "Tá, esse é dos grandes."
"Running on empty, Commander?" = "Rodando na reserva, Comandante?"
"Your power grid is failing. Mine isn't." = "Sua rede elétrica está falhando. A minha não."
"Overspending, Commander? A bad habit." = "Gastando demais, Comandante? Mau hábito."
"Your reserves: depleted. Mine: optimal." = "Suas reservas: esgotadas. As minhas: ideais."
"Economic failure detected in your sector." = "Falha econômica detectada no seu setor."
"Your economy is collapsing. As projected." = "Sua economia está em colapso. Conforme projetado."
"Out of juice already?" = "Já acabou o gás?"
"Need to borrow some metal? Too bad." = "Precisa de metal emprestado? Que pena."
"Lights going out over there? Ha!" = "Acabou a luz aí? Rá!"
"{minutes} minutes, Commander. You're tougher than you look." = "{minutes} minutos, Comandante. Você é mais durão do que parece."
"{minutes} minutes in, and still standing." = "{minutes} minutos de batalha, e ainda de pé."
"Time elapsed: {minutes} minutes. Your resistance is statistically unlikely." = "Tempo decorrido: {minutes} minutos. Sua resistência é estatisticamente improvável."
"{minutes} minutes. Recalculating." = "{minutes} minutos. Recalculando."
"{minutes} minutes and you're still here? Respect." = "{minutes} minutos e você ainda está aqui? Respeito."
"{minutes} minutes already? Time flies when you're winning." = "Já {minutes} minutos? O tempo voa quando se está ganhando."
"My forces outnumber yours two to one, Commander." = "Minhas forças superam as suas em dois para um, Comandante."
"Look at your army. Now look at mine." = "Olhe para o seu exército. Agora olhe para o meu."
"Numbers are on my side, Commander." = "Os números estão do meu lado, Comandante."
"Force ratio favourable. Surrender is advised." = "Proporção de forças favorável. Recomenda-se a rendição."
"Numerical superiority achieved." = "Superioridade numérica alcançada."
"Production advantage: decisive." = "Vantagem de produção: decisiva."
"I've got way more stuff than you." = "Eu tenho muito mais coisa que você."
"Count my tanks. Go on, I'll wait." = "Conte meus tanques. Vai, eu espero."
"So many tanks. So few of yours." = "Tanto tanque aqui. Tão pouco aí."
"You've been busy. So will we." = "Você trabalhou bastante. Agora é a nossa vez."
"Numbers aren't everything, Commander." = "Números não são tudo, Comandante."
"Quality over quantity, Commander." = "Qualidade acima da quantidade, Comandante."
"Force ratio unfavourable. Adjusting." = "Proporção de forças desfavorável. Ajustando."
"Your production rate is... noted." = "Sua taxa de produção foi... registrada."
"Your numbers will thin." = "Seus números serão reduzidos."
"Where did you get all those?!" = "Onde você arranjou tudo isso?!"
"Okay, okay, you've got more toys. For now." = "Tá, tá, você tem mais brinquedos. Por enquanto."
"Okay, that's a LOT of guys." = "Tá, isso é gente PRA CARAMBA."
"Your Commander looks tired." = "Seu Comandante parece cansado."
"Pull your Commander back while you still can." = "Recue seu Comandante enquanto ainda pode."
"Your Commander won't last much longer." = "Seu Comandante não vai durar muito mais."
"Enemy command unit integrity: failing." = "Integridade da unidade de comando inimiga: em colapso."
"Your Commander's armour is compromised." = "A blindagem do seu Comandante está comprometida."
"Your command unit is failing. Prepare for patterning." = "Sua unidade de comando está falhando. Prepare-se para a transferência."
"Your Commander's smoking! Is that bad?" = "Seu Comandante está soltando fumaça! Isso é ruim?"
"Ooh, that's gotta hurt." = "Uuh, essa deve ter doído."
"Your Commander's looking a bit crispy!" = "Seu Comandante tá ficando meio torradinho!"
"{name}, field command. Remember it." = "{name}, comando de campo. Guarde este nome."
"{name}. And you're the Commander I'm about to retire." = "{name}. E você é o Comandante que eu vou aposentar."
"Designation: {name}. Yours is irrelevant." = "Designação: {name}. A sua é irrelevante."
"I am {name}. I am Core." = "Eu sou {name}. Eu sou Core."
"{name}! The name you'll be cursing later." = "{name}! O nome que você vai amaldiçoar depois."
"Name's {name}. Pleased to beat you." = "Meu nome é {name}. Muito prazer... em derrotar você."
"Closer than you think, Commander." = "Mais perto do que você imagina, Comandante."
"Find out for yourself." = "Descubra você mesmo."
"Location data: classified." = "Dados de localização: confidenciais."
"Everywhere that matters." = "Em todo lugar que importa."
"Behind you! ...no, the other way." = "Atrás de você! ...não, do outro lado."
"Somewhere with lots of guns." = "Em algum lugar cheio de armas."
"Never better, Commander. And you?" = "Melhor impossível, Comandante. E você?"
"Going to plan." = "Tudo conforme o plano."
"Operating at peak efficiency." = "Operando com eficiência máxima."
"All systems nominal. Unlike yours." = "Todos os sistemas normais. Ao contrário dos seus."
"Great! Thanks for asking!" = "Ótimo! Obrigado por perguntar!"
"Living the dream." = "Vivendo o sonho."
"I've had better days." = "Já tive dias melhores."
"Holding. Barely. Don't get comfortable." = "Aguentando. Por pouco. Não se acomode."
"Systems damaged. Repairs under way." = "Sistemas danificados. Reparos em andamento."
"Status: suboptimal." = "Status: abaixo do ideal."
"Don't ask." = "Nem pergunte."
"Could be worse. Probably." = "Podia ser pior. Provavelmente."
"Something you won't like." = "Algo de que você não vai gostar."
"That would spoil the surprise." = "Isso estragaria a surpresa."
"Production queue: classified." = "Fila de produção: confidencial."
"Weapons. Many weapons." = "Armas. Muitas armas."
"A big surprise!" = "Uma grande surpresa!"
"Something with way too many guns." = "Algo com armas demais."
"{units} units and counting, Commander." = "{units} e contando, Comandante."
"Enough. {units}, if you must know." = "O bastante. {units}, se quer mesmo saber."
"Current unit count: {units}. Increasing." = "Contagem atual de unidades: {units}. Aumentando."
"{units}. Yours is lower." = "{units}. Você tem menos."
"{units}! Want to meet them all?" = "{units}! Quer conhecer todas?"
"Like {units}? I lost count." = "Tipo {units}? Perdi a conta."
"No truce, Commander. Not today." = "Sem trégua, Comandante. Hoje não."
"There will be no deals." = "Não haverá acordos."
"Truce: incompatible with directives." = "Trégua: incompatível com as diretrizes."
"Negotiation protocols disabled." = "Protocolos de negociação desativados."
"Truce? Ha! Nice try." = "Trégua? Rá! Boa tentativa."
"Peace is boring." = "A paz é chata."
"Thank you, Commander. You're not bad yourself." = "Obrigado, Comandante. Você também não é nada mau."
"Appreciated. It won't save you." = "Agradeço. Mas isso não vai salvar você."
"Flattery: ineffective." = "Bajulação: ineficaz."
"Compliment received. Threat level unchanged." = "Elogio recebido. Nível de ameaça inalterado."
"Aw, thanks! Still gonna crush you." = "Ah, valeu! Mesmo assim vou esmagar você."
"I know, right?" = "Eu sei, né?"
"Help? From me? Build more extractors, Commander." = "Ajuda? De mim? Construa mais extratores, Comandante."
"My advice: more defences." = "Meu conselho: mais defesas."
"Assistance denied." = "Assistência negada."
"Recommendation: surrender." = "Recomendação: render-se."
"Help? Sure: stop playing so badly!" = "Ajuda? Claro: pare de jogar tão mal!"
"Tip: build more stuff. You're welcome." = "Dica: construa mais coisas. De nada."
"Your {unit} is out of the fight." = "Seu {unit} está fora de combate."
"Scratch one {unit}." = "Menos um {unit}."
"That {unit} won't trouble us again." = "{unit} não vai mais nos incomodar."
"{unit} terminated." = "Alvo neutralizado: {unit}."
"Your {unit} has been recycled." = "Seu {unit} foi para a reciclagem."
"{unit} removed from the battlefield." = "{unit} não consta mais no campo de batalha."
"Bye bye, {unit}!" = "Tchauzinho, {unit}!"
"Was that {unit} insured?" = "Esse {unit} tinha seguro?"
"Your {unit} just went kaboom." = "Seu {unit} acabou de fazer cabum."
"You'll pay for that {unit}." = "Você vai pagar por esse {unit}."
"A good {unit}, lost. Noted." = "{unit}: uma perda e tanto. Anotado."
"{unit} lost. Replacement scheduled." = "Perda: {unit}. Substituição agendada."
"Destruction of {unit} logged." = "Destruição de {unit} registrada."
"Hey! That {unit} was brand new!" = "Ei! Esse {unit} era zero-quilômetro!"
"My {unit}! I just polished that!" = "Meu {unit}! Eu tinha acabado de encerar!"
"My {unit}... You'll answer for that, Commander." = "{unit}... Você vai responder por isso, Comandante."
"Losing the {unit} stings. It won't happen twice." = "Perder {unit} dói. Não vai se repetir."
"{unit} destroyed. Unacceptable." = "{unit}: destruição confirmada. Inaceitável."
"Loss of {unit} exceeds tolerance. Escalating." = "Perda de {unit} acima da tolerância. Iniciando escalada."
"My {unit}! Do you know how long that took?!" = "Meu {unit}! Sabe quanto tempo eu levei pra construir?!"
"NOOO, my {unit}!" = "NÃÃÃO, meu {unit}!"
"So much for your {unit}, Commander." = "Lá se vai {unit}, Comandante."
"Your {unit} has fallen. A fine machine, though." = "{unit} caiu. Uma bela máquina, reconheço."
"Your {unit} has been dismantled." = "Desmontagem de {unit} concluída."
"Large hostile unit eliminated: {unit}." = "Grande unidade hostil eliminada: {unit}."

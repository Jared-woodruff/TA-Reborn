"A right-click clears the selection or cancels the order you were about to give." = "Um clique direito limpa a seleção ou cancela a ordem que você ia dar."
"Right-click one of your units for a ring of its orders; hold the button and flick towards a choice. A controller's B does the same." = "Clique com o botão direito em uma de suas unidades para ver um anel de ordens; segure o botão e deslize até uma opção. O B do controle faz o mesmo."
"Hold the right button on one of your units, or middle-click it, for a ring of its orders; flick towards a choice and let go." = "Segure o botão direito em uma de suas unidades, ou clique nela com o botão do meio, para ver um anel de ordens; deslize até uma opção e solte."
"Metal extractors must sit on metal: {overlay_metal} shows the metal map, and {area_mex} puts an extractor on every metal spot you circle." = "Extratores de metal precisam ficar sobre metal: {overlay_metal} mostra o mapa de metal, e {area_mex} põe um extrator em cada ponto de metal que você circular."
"Your Commander's D-gun ({dgun}) destroys almost anything it touches, including your own units in its path." = "A D-gun ({dgun}) do seu Comandante destrói quase tudo o que toca, inclusive suas próprias unidades no caminho."
"{perspective} climbs into the selected unit, or an ally's under the pointer, to see the battle through its eyes as it goes on with its orders. Escape climbs back out." = "{perspective} coloca você dentro da unidade selecionada, ou da de um aliado sob o ponteiro, para ver a batalha pelos olhos dela enquanto ela segue suas ordens. Escape sai de novo."
"Keep your metal and energy incomes above what you spend: building slows down for everything when a store runs dry." = "Mantenha a renda de metal e a de energia acima do que você gasta: tudo é construído mais devagar quando uma reserva se esgota."
"Right-clicking a factory's queued unit removes it; clicking it builds it next." = "Clicar com o botão direito numa unidade na fila de uma fábrica a remove; clicar nela a constrói em seguida."
"Fight ({fight}) is attack-move: units stop to fight whatever they meet on the way." = "Combater ({fight}) é avançar atacando: as unidades param para combater o que encontrarem pelo caminho."
"Ctrl+click is force fire: the selection attacks whatever is there, your own units too, or the ground." = "Ctrl+clique é forçar disparo: a seleção ataca o que estiver ali, até suas próprias unidades, ou o chão."
"{select_builders} selects your constructors, {select_factories} your factories, {select_armed} your armed units, {select_on_screen} everything on the screen." = "{select_builders} seleciona seus construtores, {select_factories} suas fábricas, {select_armed} suas unidades armadas, {select_on_screen} tudo o que está na tela."
"Patrol ({patrol}) with constructors makes them repair, assist and reclaim along the route by themselves." = "Patrulhar ({patrol}) com construtores os faz reparar, ajudar e reciclar ao longo da rota por conta própria."
"Put a constructor on duty ({duty}) and it works by itself: the economy, repairs, reclaiming or defence. Any order you give takes it back." = "Coloque um construtor em serviço ({duty}) e ele trabalha por conta própria: economia, reparos, reciclagem ou defesa. Qualquer ordem que você der o traz de volta."
"Drag with Reclaim ({reclaim}) to turn every wreck, rock and tree in a circle into metal and energy." = "Arraste com Reciclar ({reclaim}) para transformar em metal e energia cada destroço, rocha e árvore dentro de um círculo."
"Ctrl+1 to Ctrl+9 make control groups; tap the number twice to look at the group." = "Ctrl+1 a Ctrl+9 criam grupos de controle; pressione o número duas vezes para olhar para o grupo."
"Hold {players} to see every player's side, team, units and income (your allies' in full)." = "Segure {players} para ver o lado, a equipe, as unidades e a renda de cada jogador (as dos seus aliados por completo)."
"Radar towers show enemy units long before they come into sight: build one early." = "Torres de radar mostram unidades inimigas muito antes de elas ficarem à vista: construa uma cedo."
"Wind generators pay off on windy maps: the skirmish page shows each map's wind range." = "Geradores eólicos compensam em mapas com vento: a tela de escaramuça mostra a faixa de vento de cada mapa."
"Metal makers turn spare energy into metal, and stop when your energy runs dry." = "Conversores de metal transformam energia excedente em metal, e param quando sua energia se esgota."
"Solar collectors fold shut for a few seconds when hit: tougher, but making no energy." = "Coletores solares se fecham por alguns segundos quando atingidos: ficam mais resistentes, mas sem produzir energia."
"Units gain veterancy with every kill: veterans aim better and shrug off damage." = "As unidades ganham experiência a cada abate: veteranos miram melhor e aguentam mais dano."
"Shift adds to the orders a unit already has instead of replacing them." = "Shift adiciona às ordens que uma unidade já tem em vez de substituí-las."
"Alt+drag while placing a building fills a rectangle with it: handy for solar farms and walls." = "Alt+arrastar ao posicionar um edifício preenche um retângulo com ele: útil para fazendas solares e muros."
"Double-click a unit to select every unit of its type on screen; {select_type} selects them map-wide." = "Clique duplo numa unidade seleciona todas as unidades do mesmo tipo na tela; {select_type} as seleciona no mapa inteiro."
"{idle_builder} selects the next idle constructor, {idle_factory} the next idle factory." = "A tecla {idle_builder} seleciona o próximo construtor ocioso, e {idle_factory} a próxima fábrica ociosa."
"Wrecks can be resurrected by resurrection kbots, or reclaimed for most of their metal." = "Destroços podem ser ressuscitados por kbots de ressurreição, ou reciclados para recuperar a maior parte do metal."
"Hovering a unit shows its health, firepower and range; {overlay_path} shows where the selection can go." = "Passar o cursor sobre uma unidade mostra vida, poder de fogo e alcance; {overlay_path} mostra aonde a seleção pode ir."
"{last_alert} (or Backspace) looks at the last place your units were attacked; press it again for the one before." = "{last_alert} (ou Backspace) mostra o último lugar onde suas unidades foram atacadas; aperte de novo para ver o anterior."
"A notice or a piece of advice with LOOK on it takes you to the place, or the unit, when you click it." = "Um aviso ou conselho com VER leva você ao lugar ou à unidade quando você clica nele."
"{help} tells everything about the selected unit, or the one under the pointer: cost, speed, weapons, abilities." = "{help} conta tudo sobre a unidade selecionada, ou a que está sob o ponteiro: custo, velocidade, armas, habilidades."
"{next_unit} looks at the next of your units off the screen; with units selected, the next of them." = "{next_unit} olha para a próxima unidade sua fora da tela; com unidades selecionadas, a próxima delas."
"Ctrl+F6 to Ctrl+F9 store camera positions; F6 to F9 bring them back." = "Ctrl+F6 a Ctrl+F9 guardam posições de câmera; F6 a F9 as trazem de volta."
"Anti-air matters: bombers can wreck an undefended economy in one pass." = "A defesa antiaérea importa: bombardeiros podem arrasar uma economia desprotegida numa só passada."
"An advanced factory needs a lot of metal: build it once your extractors and power can feed it." = "Uma fábrica avançada exige muito metal: construa-a quando seus extratores e sua energia puderem sustentá-la."
"Guarding a factory with a constructor adds its build power to the factory's production." = "Proteger uma fábrica com um construtor soma o poder de construção dele à produção da fábrica."
"Moho mines extract far more metal than basic extractors: advanced constructors build them." = "Minas Moho extraem muito mais metal que os extratores básicos: construtores avançados as constroem."
"Every game is kept as a replay: watch it from the main menu, and jump through it with the bar." = "Toda partida fica guardada como replay: assista pelo menu principal e navegue por ela com a barra."
"{overlay_sight} shows your sight, radar and sonar coverage; {overlay_height} shows the heights of the map." = "{overlay_sight} mostra sua cobertura de visão, radar e sonar; {overlay_height} mostra as alturas do mapa."
"The Commander can capture enemy units ({capture}): it takes a while, but the unit is yours." = "O Comandante pode capturar unidades inimigas ({capture}): leva um tempo, mas a unidade passa a ser sua."
"{photo_mode} opens photo mode: the battle holds still, and you can light, frame and focus a shot at up to 4K." = "{photo_mode} abre o modo foto: a batalha fica parada, e você pode iluminar, enquadrar e focar uma imagem em até 4K."
"TIP" = "DICA"
"Dismiss" = "Dispensar"
"Don't show tips again" = "Não mostrar dicas de novo"

# apps/ta_game/src/tutorial.rs
"THE BASICS" = "O BÁSICO"
"Your Commander, the camera, metal, energy and a first factory." = "Seu Comandante, a câmera, metal, energia e uma primeira fábrica."
"Selecting units" = "Seleção de unidades"
"The camera" = "A câmera"
"Metal and energy" = "Metal e energia"
"Factories" = "Fábricas"
"Welcome, Commander. The walking machine in the middle of the screen is your Commander: it builds, it fights, and losing it usually loses the battle. Click it to select it." = "Bem-vindo, Comandante. A máquina que anda no meio da tela é o seu Comandante: ele constrói, luta, e perdê-lo geralmente significa perder a batalha. Clique nele para selecioná-lo."
"Lost sight of it? {select_commander} selects the Commander from anywhere, and SHOW ME brings the camera to it." = "Perdeu o Comandante de vista? {select_commander} o seleciona de qualquer lugar, e o botão MOSTRAR NO MAPA leva a câmera até ele."
"Look around. The arrow keys, the screen edges or dragging with the middle button scroll; the mouse wheel zooms towards the cursor, and dragging with the right button turns the view." = "Olhe em volta. As setas, as bordas da tela ou arrastar com o botão do meio rolam a vista; a roda do mouse dá zoom na direção do cursor, e arrastar com o botão direito gira a vista."
"Push the pointer against an edge of the screen to scroll, or turn the mouse wheel to zoom." = "Leve o ponteiro até uma borda da tela para rolar a vista, ou gire a roda do mouse para dar zoom."
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the ECONOMY tab of the build menu at the bottom right and place it on the marked deposit." = "Tudo é feito de metal e energia. O metal vem de extratores sobre depósitos de metal. Selecione o Comandante, escolha o Metal Extractor na aba ECONOMIA do menu de construção no canto inferior direito e posicione-o no depósito marcado."
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the build menu on the left and place it on the marked deposit." = "Tudo é feito de metal e energia. O metal vem de extratores sobre depósitos de metal. Selecione o Comandante, escolha o Metal Extractor no menu de construção à esquerda e posicione-o no depósito marcado."
"The outline turns green where the extractor can stand. Bring it onto the marked ring and click to place it." = "O contorno fica verde onde o extrator pode ser construído. Leve-o até o anel marcado e clique para posicioná-lo."
"Energy comes from solar collectors and wind generators. Build a Solar Collector next to your Commander. The bars at the top show your stores and how fast they fill or drain; they warn you when one runs dry." = "A energia vem de coletores solares e geradores eólicos. Construa um Solar Collector ao lado do seu Comandante. As barras no topo mostram suas reservas e a rapidez com que enchem ou esvaziam; elas avisam quando uma se esgota."
"The Solar Collector is a flat, square panel. Pick it, then click on open ground near the Commander." = "O Solar Collector é um painel plano e quadrado. Escolha-o e clique num terreno livre perto do Comandante."
"Factories build your army. Build a Kbot Lab (on the FACTORY tab) on a flat spot near the Commander, and wait for it to finish." = "As fábricas constroem o seu exército. Construa um Kbot Lab (na aba FÁBRICA) num local plano perto do Comandante e espere ficar pronto."
"Factories build your army. Build a Kbot Lab from the build menu on a flat spot near the Commander, and wait for it to finish." = "As fábricas constroem o seu exército. Construa um Kbot Lab pelo menu de construção num local plano perto do Comandante e espere ficar pronto."
"Building takes metal and energy as it goes: while either bar at the top is empty, everything builds more slowly." = "A construção consome metal e energia à medida que avança: enquanto qualquer uma das barras no topo estiver vazia, tudo é construído mais devagar."
"Select the Kbot Lab and click the Peewee three times to queue three of them (right-click one to take it off the queue). New units wait in front of the lab." = "Selecione o Kbot Lab e clique no Peewee três vezes para pôr três na fila (um clique direito tira um da fila). Unidades novas esperam em frente ao laboratório."
"Click the lab itself on the map to select it: its build menu shows the units it makes." = "Clique no próprio laboratório, no mapa, para selecioná-lo: o menu de construção passa a mostrar as unidades que ele produz."
"That is the whole cycle: extract, generate, build, fight. Keep both incomes above what you spend and keep your builders busy. Lesson complete!" = "Esse é o ciclo completo: extrair, gerar, construir, lutar. Mantenha as duas rendas acima do que você gasta e seus construtores sempre ocupados. Lição concluída!"
"Select and group an army, attack-move, and destroy an enemy outpost." = "Selecione e agrupe um exército, avance atacando e destrua um posto avançado inimigo."
"Box selection" = "Seleção em caixa"
"Control groups" = "Grupos de controle"
"Attack-move" = "Avançar atacando"
"Destroying a base" = "Destruir uma base"
"Your Kbot Lab has built a squad of Peewees. Drag a box around them with the left mouse button to select them all." = "Seu Kbot Lab construiu um esquadrão de Peewees. Arraste uma caixa em volta deles com o botão esquerdo do mouse para selecionar todos."
"Press the left button on open ground beside the squad, hold it, drag the box over them all and let go." = "Pressione o botão esquerdo num terreno livre ao lado do esquadrão, segure-o, arraste a caixa sobre todos eles e solte."
"Press Ctrl+1 to make them group 1. Pressing 1 selects them again from anywhere; pressing it twice brings the camera to them." = "Pressione Ctrl+1 para torná-los o grupo 1. Pressionar 1 os seleciona de novo de qualquer lugar; pressioná-lo duas vezes leva a câmera até eles."
"Hold Ctrl and press 1 while the squad is selected." = "Segure Ctrl e pressione 1 com o esquadrão selecionado."
"The enemy has an outpost at the marked place. Fight is attack-move: units walk there and take on whatever they meet on the way. Press {fight}, then click near the outpost." = "O inimigo tem um posto avançado no local marcado. Combater é avançar atacando: as unidades vão até lá e enfrentam o que encontrarem pelo caminho. Pressione {fight} e clique perto do posto avançado."
"Select the squad first (press 1). Then press {fight}, or the Fight button among the orders, and click on the ground by the marked ring." = "Primeiro selecione o esquadrão (pressione 1). Depois pressione {fight}, ou o botão Combater entre as ordens, e clique no chão junto ao anel marcado."
"Destroy every building of the outpost. Its laser tower hits hard: keep the squad together, and queue reinforcements at the lab if you need them." = "Destrua todos os edifícios do posto avançado. A torre laser dele bate forte: mantenha o esquadrão unido e ponha reforços na fila do laboratório se precisar."
"Losing the fight? Pull the squad back, queue more Peewees at the lab and go in again with all of them together." = "Perdendo a luta? Recue o esquadrão, ponha mais Peewees na fila do laboratório e volte ao ataque com todos juntos."
"The outpost is gone. The wrecks it left are worth metal: builders reclaim them (next lesson). Lesson complete!" = "O posto avançado já era. Os destroços que ele deixou valem metal: os construtores os reciclam (próxima lição). Lição concluída!"
"ORDERS LIKE A VETERAN" = "ORDENS DE VETERANO"
"Map views, area orders, building blocks and build queues." = "Vistas do mapa, ordens de área, blocos de edifícios e filas de construção."
"Map overlays" = "Camadas do mapa"
"Area orders" = "Ordens de área"
"Building blocks" = "Blocos de edifícios"
"Build queues" = "Filas de construção"
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again. The MAP menu at the top right does the same." = "O mapa mostra o que o terreno esconde. Pressione {overlay_metal} para ver o mapa de metal ({overlay_path} mostra aonde as unidades podem ir, {overlay_height} as alturas, {overlay_sight} a visão e o radar); a mesma tecla o oculta de novo. O menu MAPA no canto superior direito faz o mesmo."
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again." = "O mapa mostra o que o terreno esconde. Pressione {overlay_metal} para ver o mapa de metal ({overlay_path} mostra aonde as unidades podem ir, {overlay_height} as alturas, {overlay_sight} a visão e o radar); a mesma tecla o oculta de novo."
"Press {overlay_metal}: the metal deposits light up all over the map." = "Pressione {overlay_metal}: os depósitos de metal se iluminam por todo o mapa."
"Select the Commander, press {area_mex} and drag a circle over the marked deposits: every metal spot inside gets an extractor, nearest first. A plain click takes the metal around the cursor." = "Selecione o Comandante, pressione {area_mex} e arraste um círculo sobre os depósitos marcados: cada ponto de metal dentro dele recebe um extrator, do mais próximo ao mais distante. Um clique simples pega o metal ao redor do cursor."
"With the Commander selected, press {area_mex}, then press on the ground over the deposits and drag outwards: the circle grows as you drag." = "Com o Comandante selecionado, pressione {area_mex}, depois pressione o botão do mouse no chão sobre os depósitos e arraste para fora: o círculo cresce conforme você arrasta."
"Many orders work on areas. Press {reclaim} (reclaim) and drag a circle over the rocks near your base: the Commander turns every one into metal." = "Muitas ordens funcionam em áreas. Pressione {reclaim} (reciclar) e arraste um círculo sobre as rochas perto da sua base: o Comandante transforma cada uma em metal."
"Rocks and wrecks are worth metal. With the Commander selected, press {reclaim}, then press on the ground and drag the circle over a few rocks." = "Rochas e destroços valem metal. Com o Comandante selecionado, pressione {reclaim}, depois pressione o botão do mouse no chão e arraste o círculo sobre algumas rochas."
"Hold Alt while you drag out a building to fill a whole block with it. Pick the Solar Collector, hold Alt and drag out a block of four or more." = "Segure Alt enquanto arrasta um edifício para preencher um bloco inteiro com ele. Escolha o Solar Collector, segure Alt e arraste um bloco de quatro ou mais."
"Pick the Solar Collector, then hold Alt, press on the ground and drag: a block of outlines follows the pointer. Let go to place them all." = "Escolha o Solar Collector, depois segure Alt, pressione o botão do mouse no chão e arraste: um bloco de contornos segue o ponteiro. Solte para posicionar todos."
"The Commander's queued buildings show under BUILD QUEUE, beside its picture at the bottom of the screen. Click one to build it next (right-click drops it). A factory's queue works the same way." = "Os edifícios na fila do Comandante aparecem em FILA DE CONSTRUÇÃO, ao lado da imagem dele na parte de baixo da tela. Clique num deles para construí-lo em seguida (clique direito o descarta). A fila de uma fábrica funciona do mesmo jeito."
"The BUILD QUEUE shows while the Commander alone is selected and has buildings waiting. Click any but the first: that one is being built." = "A FILA DE CONSTRUÇÃO aparece quando só o Comandante está selecionado e tem edifícios à espera. Clique em qualquer um, exceto o primeiro: esse já está sendo construído."
"Area orders, building blocks and queues save you hundreds of clicks in a battle. Lesson complete!" = "Ordens de área, blocos de edifícios e filas poupam centenas de cliques numa batalha. Lição concluída!"
"HOLD THE LINE" = "SEGURE A LINHA"
"Defences, radar, repairs, and the metal in wrecks." = "Defesas, radar, reparos e o metal dos destroços."
"Defences" = "Defesas"
"Radar" = "Radar"
"Repairs" = "Reparos"
"Reclaiming wrecks" = "Reciclar destroços"
"Raiders will come from the marked direction. Build a Light Laser Tower (on the DEFENCE tab) in the marked ring: towers shoot whatever comes in range." = "Invasores virão da direção marcada. Construa uma Light Laser Tower (na aba DEFESA) no anel marcado: as torres atiram em tudo o que entra no alcance delas."
"Raiders will come from the marked direction. Build a Light Laser Tower from the build menu in the marked ring: towers shoot whatever comes in range." = "Invasores virão da direção marcada. Construa uma Light Laser Tower pelo menu de construção no anel marcado: as torres atiram em tudo o que entra no alcance delas."
"The Light Laser Tower is a small gun on a post. Pick it, put it in the ring and wait for it to finish." = "A Light Laser Tower é um pequeno canhão sobre um poste. Escolha-a, coloque-a no anel e espere ficar pronta."
"Build a Radar Tower (on the SENSORS tab) near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "Construa uma Radar Tower (na aba SENSORES) perto da sua base. O radar mostra os inimigos como pontos no mapa e no minimapa muito antes de suas unidades os verem."
"Build a Radar Tower from the build menu near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "Construa uma Radar Tower pelo menu de construção perto da sua base. O radar mostra os inimigos como pontos no mapa e no minimapa muito antes de suas unidades os verem."
"The Radar Tower is a tall mast. Pick it, place it near the Commander and wait for it to finish." = "A Radar Tower é um mastro alto. Escolha-a, posicione-a perto do Comandante e espere ficar pronta."
"Here they come: raiders on your radar. Keep the Commander by the tower and let them come to you: together they hold the line." = "Lá vêm eles: invasores no seu radar. Mantenha o Comandante junto à torre e deixe que eles venham até você: juntos, os dois seguram a linha."
"Do not chase them: the tower only fights what comes in range. Keep the Commander beside it; while it fights, the Commander can mend it ({repair}, then click the tower)." = "Não os persiga: a torre só combate o que entra no seu alcance. Mantenha o Comandante ao lado dela; enquanto ela luta, o Comandante pode repará-la ({repair} e depois clique na torre)."
"The fight left a building damaged. Select the Commander, press {repair} and click it: builders mend what is damaged." = "O combate deixou um edifício danificado. Selecione o Comandante, pressione {repair} e clique nele: os construtores reparam o que está danificado."
"With the Commander selected, press {repair}, then click the damaged building. Its health bar fills as it is mended." = "Com o Comandante selecionado, pressione {repair} e depois clique no edifício danificado. A barra de vida dele enche à medida que ele é reparado."
"The raiders left wrecks, and wrecks are worth metal. Select the Commander, press {reclaim} and click a wreck, or drag a circle over them all." = "Os invasores deixaram destroços, e destroços valem metal. Selecione o Comandante, pressione {reclaim} e clique num destroço, ou arraste um círculo sobre todos eles."
"Wrecks lie where the raiders fell. With the Commander selected, press {reclaim} and click one: the metal bar rises as it is taken apart." = "Os destroços estão onde os invasores caíram. Com o Comandante selecionado, pressione {reclaim} e clique num deles: a barra de metal sobe à medida que ele é desmontado."
"Towers hold ground while your army is elsewhere, radar sees what is coming, and builders mend and recycle. Lesson complete!" = "As torres defendem o terreno enquanto seu exército está em outro lugar, o radar vê o que está chegando, e os construtores reparam e reciclam. Lição concluída!"
"BUILDERS AND FACTORIES" = "CONSTRUTORES E FÁBRICAS"
"Builders that help, factories that keep building, patrols and standing orders." = "Construtores que ajudam, fábricas que não param de produzir, patrulhas e ordens permanentes."
"Construction units" = "Unidades de construção"
"Helping a factory" = "Ajudar uma fábrica"
"Rally points" = "Pontos de reunião"
"Standing orders" = "Ordens permanentes"
"One builder is slow. Select the Kbot Lab and build a Construction Kbot: it builds what the Commander builds, and more besides." = "Um construtor sozinho é lento. Selecione o Kbot Lab e construa um Construction Kbot: ele constrói tudo o que o Comandante constrói, e mais."
"Click the lab on the map to select it; the Construction Kbot is in its build menu. Wait for it to walk out." = "Clique no laboratório, no mapa, para selecioná-lo; o Construction Kbot está no menu de construção dele. Espere até ele sair."
"Builders help each other. Select the Construction Kbot, press {guard} and click the Kbot Lab: it lends the lab its build power, and the lab builds faster." = "Construtores ajudam uns aos outros. Selecione o Construction Kbot, pressione {guard} e clique no Kbot Lab: ele empresta seu poder de construção ao laboratório, que passa a produzir mais rápido."
"With the Construction Kbot selected, press {guard}, then click the lab. It stays by the lab and helps with everything it makes." = "Com o Construction Kbot selecionado, pressione {guard} e depois clique no laboratório. Ele fica junto ao laboratório e ajuda em tudo o que sai de lá."
"Factories send their units where you say. Select the Kbot Lab. {order_click} on open ground nearby: new units gather there." = "As fábricas mandam suas unidades aonde você indicar. Selecione o Kbot Lab. {order_click} num terreno livre por perto: as unidades novas se reúnem lá."
"Select the lab first. With it selected, {order_click} on the ground where its units should gather." = "Primeiro selecione o laboratório e mantenha-o selecionado. {order_click} no chão onde as unidades dele devem se reunir."
"Turn on Repeat for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "Ative a opção Repetir do laboratório: tudo o que ele termina volta para o fim da fila, e assim ele nunca para de produzir."
"Turn on REPEAT BUILD for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "Ative o botão REPETIR PRODUÇÃO do laboratório: tudo o que ele termina volta para o fim da fila, e assim ele nunca para de produzir."
"Select the lab, then turn Repeat on: the pointer shows where it is." = "Selecione o laboratório e depois ative Repetir: a seta mostra onde fica."
"Builders on patrol mend and reclaim whatever they pass. Select the Construction Kbot, press {patrol} and click on the far side of your base." = "Construtores em patrulha reparam e reciclam tudo o que encontram pelo caminho. Selecione o Construction Kbot, pressione {patrol} e clique do outro lado da sua base."
"With the Construction Kbot selected, press {patrol}, then click on the ground: it walks back and forth between there and where it stood." = "Com o Construction Kbot selecionado, pressione {patrol} e depois clique no chão: ele vai e volta entre esse ponto e o lugar onde estava."
"Units keep standing orders. Select your Peewees and set their fire order to Hold fire with the button beside the orders: they will not shoot until you say." = "As unidades mantêm ordens permanentes. Selecione seus Peewees e mude a ordem de fogo deles para “Cessar fogo” com o botão ao lado das ordens: eles não vão atirar até você mandar."
"Units keep standing orders. Select your Peewees and set their FIRE ORDERS to Hold fire: they will not shoot until you say." = "As unidades mantêm ordens permanentes. Selecione seus Peewees e mude as ORDENS DE FOGO deles para “Cessar fogo”: eles não vão atirar até você mandar."
"Select the Peewees, then click the fire order button until it shows HOLD FIRE: each click is the next order." = "Selecione os Peewees e clique no botão de ordem de fogo até ele mostrar CESSAR FOGO: cada clique passa para a próxima ordem."

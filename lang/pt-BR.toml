# TA Reborn interface text. Copy template.toml to <code>.toml (e.g. de.toml), set the
# language's name and fill in the translations; empty ones keep the English. {name}
# placeholders stay as they are. `ta-tools i18n lang` adds new strings to every language.

[language]
name = "Português (Brasil)"

[strings]


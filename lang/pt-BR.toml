# crates/ta_data/src/validation.rs
"The effective content set exceeds the validation file budget." = "O conjunto de conteúdo efetivo passa do limite de arquivos da validação."
"Split the content into smaller optional packs, then validate each pack." = "Divida o conteúdo em pacotes opcionais menores e valide cada pacote."
"No files of this mod were available to validate." = "Nenhum arquivo deste mod estava disponível para validar."
"Install the mod's TA data archives or loose files, then validate again." = "Instale os arquivos de dados de TA do mod, compactados ou soltos, e valide de novo."
"This mod holds nothing the data checks read: no units, weapons, features, maps, models, scripts, animations or sounds (music, documents and pictures are not checked)." = "Este mod não tem nada que as verificações de dados leiam: nenhuma unidade, arma, objeto, mapa, modelo, script, animação ou som (música, documentos e imagens não são verificados)."
"Nothing to do if that is what the mod is. If it should change the game's data, check that its files are in the folders the game reads (units/, weapons/, maps/…)." = "Nada a fazer se o mod é isso mesmo. Se ele deveria alterar os dados do jogo, confira se os arquivos estão nas pastas que o jogo lê (units/, weapons/, maps/…)."
"No supported effective files were available to validate." = "Nenhum arquivo efetivo compatível estava disponível para validar."
"Install the original game's or the mod's TA data archives, then validate again." = "Instale os arquivos de dados de TA do jogo original ou do mod e valide de novo."
"Validation was cancelled; remaining files and references were not checked." = "A validação foi cancelada; os arquivos e referências restantes não foram verificados."
"Run validation again to obtain a complete report." = "Execute a validação de novo para obter um relatório completo."
"The cumulative validation read budget was exceeded." = "O limite acumulado de leitura da validação foi excedido."
"Split optional content into smaller packs, then validate again." = "Divida o conteúdo opcional em pacotes menores e valide de novo."
"With this mod on, the original game's {archive} is not read: the mod takes its place (an archive of its own of that name, one its mod.toml's replaces names, or one its installation is known to remove), as installing the mod in TA's folder did. What only the original's held is missing with the mod." = "Com este mod ativado, o {archive} do jogo original não é lido: o mod toma o seu lugar (um arquivo próprio com esse nome, um que o replaces do mod.toml indica, ou um que a instalação do mod costuma remover), como acontecia ao instalar o mod na pasta de TA. O que só o original continha fica faltando com o mod."
"Nothing to do if this is meant. To have the original's read beneath the mod instead, give the mod's archive another name, or take the name out of replaces in mod.toml." = "Nada a fazer se for a intenção. Para que o do original seja lido por baixo do mod, dê outro nome ao arquivo do mod ou tire o nome de replaces no mod.toml."

"Reduce or split oversized effects. Reborn needs per-entry decoding or streaming before raising the resource allowance." = "Reduza ou divida efeitos grandes demais. O Reborn precisa de decodificação por entrada ou carregamento progressivo antes de aumentar o limite de recursos."

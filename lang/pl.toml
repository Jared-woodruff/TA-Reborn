# apps/ta_game/src/tips.rs
"Ctrl+right-drag draws a formation line: the selection spreads along it." = "Ctrl+przeciąganie PPM rysuje linię szyku: zaznaczone jednostki rozstawiają się wzdłuż niej."
"Ctrl+drag draws a formation line: the selection spreads along it." = "Ctrl+przeciąganie rysuje linię szyku: zaznaczone jednostki rozstawiają się wzdłuż niej."
"Used to TA's original controls? Options, Controls: give orders with the left button." = "Wolisz oryginalne sterowanie TA? Opcje, Sterowanie: wydawaj rozkazy lewym przyciskiem."
"A right-click clears the selection or cancels the order you were about to give." = "Kliknięcie PPM czyści zaznaczenie lub anuluje przygotowany rozkaz."
"Right-click one of your units for a ring of its orders; hold the button and flick towards a choice. A controller's B does the same." = "Kliknij prawym przyciskiem swoją jednostkę, by zobaczyć krąg jej rozkazów; przytrzymaj przycisk i machnij w stronę wyboru. Przycisk B kontrolera robi to samo."
"Hold the right button on one of your units, or middle-click it, for a ring of its orders; flick towards a choice and let go." = "Przytrzymaj prawy przycisk na swojej jednostce lub kliknij ją środkowym, by zobaczyć krąg jej rozkazów; machnij w stronę wyboru i puść."
"Metal extractors must sit on metal: {overlay_metal} shows the metal map, and {area_mex} puts an extractor on every metal spot you circle." = "Ekstraktory metalu muszą stać na złożach: {overlay_metal} pokazuje mapę metalu, a {area_mex} stawia ekstraktor na każdym zakreślonym złożu."
"Your Commander's D-gun ({dgun}) destroys almost anything it touches, including your own units in its path." = "Dezintegrator twojego Dowódcy ({dgun}) niszczy niemal wszystko, czego dotknie, także twoje jednostki na swojej drodze."
"{perspective} climbs into the selected unit, or an ally's under the pointer, to see the battle through its eyes as it goes on with its orders. Escape climbs back out." = "{perspective} przenosi cię do zaznaczonej jednostki lub jednostki sojusznika pod kursorem: oglądaj bitwę jej oczami, gdy dalej wykonuje swoje rozkazy. Escape, by wysiąść."
"Keep your metal and energy incomes above what you spend: building slows down for everything when a store runs dry." = "Utrzymuj dochody metalu i energii powyżej wydatków: gdy zapas się wyczerpie, wszystko buduje się wolniej."
"Right-clicking a factory's queued unit removes it; clicking it builds it next." = "Kliknięcie PPM jednostki w kolejce fabryki usuwa ją; zwykłe kliknięcie sprawia, że zostanie zbudowana jako następna."
"Fight ({fight}) is attack-move: units stop to fight whatever they meet on the way." = "Walka ({fight}) to atak w marszu: jednostki zatrzymują się, by walczyć ze wszystkim, co napotkają po drodze."
"Ctrl+click is force fire: the selection attacks whatever is there, your own units too, or the ground." = "Ctrl+klik to wymuszony ogień: zaznaczone jednostki atakują to, co tam jest, także twoje jednostki, albo ziemię."
"{select_builders} selects your constructors, {select_factories} your factories, {select_armed} your armed units, {select_on_screen} everything on the screen." = "{select_builders} zaznacza twoje konstruktory, {select_factories} fabryki, {select_armed} uzbrojone jednostki, {select_on_screen} wszystko na ekranie."
"Patrol ({patrol}) with constructors makes them repair, assist and reclaim along the route by themselves." = "Patrol ({patrol}) z konstruktorami sprawia, że same naprawiają, pomagają i odzyskują na trasie."
"Put a constructor on duty ({duty}) and it works by itself: the economy, repairs, reclaiming or defence. Any order you give takes it back." = "Wyślij konstruktor na służbę ({duty}), a będzie pracował sam: zasoby, naprawy, odzysk lub obrona. Każdy twój rozkaz go przywraca."
"Drag with Reclaim ({reclaim}) to turn every wreck, rock and tree in a circle into metal and energy." = "Przeciągnij z Odzyskiem ({reclaim}), by zamienić każdy wrak, skałę i drzewo w kole na metal i energię."
"Ctrl+1 to Ctrl+9 make control groups; tap the number twice to look at the group." = "Ctrl+1 do Ctrl+9 tworzą grupy; naciśnij cyfrę dwa razy, by pokazać grupę."
"Hold {players} to see every player's side, team, units and income (your allies' in full)." = "Przytrzymaj {players}, by zobaczyć stronę, drużynę, jednostki i dochody każdego gracza (sojuszników w pełni)."
"Radar towers show enemy units long before they come into sight: build one early." = "Wieże radarowe pokazują wrogie jednostki na długo, zanim staną się widoczne: zbuduj jedną wcześnie."
"Wind generators pay off on windy maps: the skirmish page shows each map's wind range." = "Generatory wiatrowe opłacają się na wietrznych mapach: ekran potyczki pokazuje zakres wiatru każdej mapy."
"Metal makers turn spare energy into metal, and stop when your energy runs dry." = "Wytwórnie metalu zamieniają nadwyżkę energii w metal i stają, gdy energia się wyczerpie."
"Solar collectors fold shut for a few seconds when hit: tougher, but making no energy." = "Kolektory słoneczne po trafieniu składają się na kilka sekund: są wtedy wytrzymalsze, ale nie wytwarzają energii."
"Units gain veterancy with every kill: veterans aim better and shrug off damage." = "Jednostki zdobywają doświadczenie z każdym zniszczonym wrogiem: weterani celują lepiej i lepiej znoszą obrażenia."
"Shift adds to the orders a unit already has instead of replacing them." = "Shift dodaje rozkazy do tych, które jednostka już ma, zamiast je zastępować."
"Alt+drag while placing a building fills a rectangle with it: handy for solar farms and walls." = "Alt+przeciąganie podczas stawiania budynku wypełnia nim prostokąt: przydatne przy farmach słonecznych i murach."
"Double-click a unit to select every unit of its type on screen; {select_type} selects them map-wide." = "Dwuklik na jednostce zaznacza wszystkie jednostki tego typu na ekranie; {select_type} na całej mapie."
"{idle_builder} selects the next idle constructor, {idle_factory} the next idle factory." = "Klawisz {idle_builder} zaznacza następny bezczynny konstruktor, a {idle_factory} – następną bezczynną fabrykę."
"Wrecks can be resurrected by resurrection kbots, or reclaimed for most of their metal." = "Wraki można wskrzesić kbotami wskrzeszającymi albo odzyskać z nich większość metalu."
"Hovering a unit shows its health, firepower and range; {overlay_path} shows where the selection can go." = "Najechanie na jednostkę pokazuje jej zdrowie, siłę ognia i zasięg; {overlay_path} pokazuje, dokąd może dotrzeć zaznaczenie."
"{last_alert} (or Backspace) looks at the last place your units were attacked; press it again for the one before." = "{last_alert} (lub Backspace) pokazuje ostatnie miejsce, w którym zaatakowano twoje jednostki; naciśnięty ponownie – to wcześniejsze."
"A notice or a piece of advice with LOOK on it takes you to the place, or the unit, when you click it." = "Komunikat lub rada z napisem POKAŻ przenosi cię w to miejsce albo do tej jednostki po kliknięciu."
"{help} tells everything about the selected unit, or the one under the pointer: cost, speed, weapons, abilities." = "{help} mówi wszystko o zaznaczonej jednostce lub tej pod kursorem: koszt, szybkość, uzbrojenie, zdolności."
"{next_unit} looks at the next of your units off the screen; with units selected, the next of them." = "{next_unit} pokazuje następną twoją jednostkę poza ekranem; przy zaznaczeniu – następną z zaznaczonych."
"Ctrl+F6 to Ctrl+F9 store camera positions; F6 to F9 bring them back." = "Ctrl+F6 do Ctrl+F9 zapisują pozycje kamery; F6 do F9 je przywracają."
"Anti-air matters: bombers can wreck an undefended economy in one pass." = "Obrona przeciwlotnicza ma znaczenie: bombowce mogą zniszczyć niebronioną gospodarkę w jednym nalocie."
"An advanced factory needs a lot of metal: build it once your extractors and power can feed it." = "Zaawansowana fabryka wymaga dużo metalu: zbuduj ją, gdy ekstraktory i energia będą w stanie ją utrzymać."
"Guarding a factory with a constructor adds its build power to the factory's production." = "Konstruktor osłaniający fabrykę dodaje swoją moc budowy do jej produkcji."
"Moho mines extract far more metal than basic extractors: advanced constructors build them." = "Kopalnie Moho wydobywają znacznie więcej metalu niż zwykłe ekstraktory: budują je zaawansowane konstruktory."
"Every game is kept as a replay: watch it from the main menu, and jump through it with the bar." = "Każda gra jest zachowywana jako powtórka: obejrzyj ją z menu głównego i przewijaj paskiem."
"{overlay_sight} shows your sight, radar and sonar coverage; {overlay_height} shows the heights of the map." = "{overlay_sight} pokazuje zasięg wzroku, radaru i sonaru; {overlay_height} pokazuje wysokości mapy."
"The Commander can capture enemy units ({capture}): it takes a while, but the unit is yours." = "Dowódca może przejmować wrogie jednostki ({capture}): trwa to chwilę, ale jednostka staje się twoja."
"{photo_mode} opens photo mode: the battle holds still, and you can light, frame and focus a shot at up to 4K." = "{photo_mode} otwiera tryb foto: bitwa zastyga, a ty możesz oświetlić, skadrować i wyostrzyć ujęcie w rozdzielczości do 4K."
"TIP" = "PORADA"
"Dismiss" = "Zamknij"
"Don't show tips again" = "Nie pokazuj więcej porad"

# apps/ta_game/src/tutorial.rs
"THE BASICS" = "PODSTAWY"
"Your Commander, the camera, metal, energy and a first factory." = "Twój Dowódca, kamera, metal, energia i pierwsza fabryka."
"Selecting units" = "Zaznaczanie jednostek"
"The camera" = "Kamera"
"Metal and energy" = "Metal i energia"
"Factories" = "Fabryki"
"Welcome, Commander. The walking machine in the middle of the screen is your Commander: it builds, it fights, and losing it usually loses the battle. Click it to select it." = "Witaj, Dowódco. Krocząca maszyna na środku ekranu to twój Dowódca: buduje, walczy, a jego utrata zwykle oznacza przegraną bitwę. Kliknij go, by go zaznaczyć."
"Lost sight of it? {select_commander} selects the Commander from anywhere, and SHOW ME brings the camera to it." = "Zniknął ci z oczu? {select_commander} zaznacza Dowódcę z dowolnego miejsca, a przycisk POKAŻ NA MAPIE przenosi do niego kamerę."
"Look around. The arrow keys, the screen edges or dragging with the middle button scroll; the mouse wheel zooms towards the cursor, and dragging with the right button turns the view." = "Rozejrzyj się. Strzałki, krawędzie ekranu lub przeciąganie środkowym przyciskiem przewijają widok; kółko myszy przybliża w stronę kursora, a przeciąganie prawym przyciskiem obraca widok."
"Push the pointer against an edge of the screen to scroll, or turn the mouse wheel to zoom." = "Dosuń kursor do krawędzi ekranu, by przewinąć widok, albo pokręć kółkiem myszy, by go przybliżyć lub oddalić."
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the ECONOMY tab of the build menu at the bottom right and place it on the marked deposit." = "Wszystko powstaje z metalu i energii. Metal pochodzi z ekstraktorów na złożach metalu. Zaznacz Dowódcę, wybierz Metal Extractor z zakładki ZASOBY w menu budowy w prawym dolnym rogu i postaw go na oznaczonym złożu."
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the build menu on the left and place it on the marked deposit." = "Wszystko powstaje z metalu i energii. Metal pochodzi z ekstraktorów na złożach metalu. Zaznacz Dowódcę, wybierz Metal Extractor z menu budowy po lewej i postaw go na oznaczonym złożu."
"The outline turns green where the extractor can stand. Bring it onto the marked ring and click to place it." = "Obrys zielenieje tam, gdzie może stanąć ekstraktor. Przesuń go na oznaczony okrąg i kliknij, by go postawić."
"Energy comes from solar collectors and wind generators. Build a Solar Collector next to your Commander. The bars at the top show your stores and how fast they fill or drain; they warn you when one runs dry." = "Energia pochodzi z kolektorów słonecznych i generatorów wiatrowych. Zbuduj Solar Collector obok Dowódcy. Paski u góry pokazują twoje zapasy oraz tempo ich napełniania lub ubywania; ostrzegą cię, gdy któryś się wyczerpie."
"The Solar Collector is a flat, square panel. Pick it, then click on open ground near the Commander." = "Solar Collector to płaski, kwadratowy panel. Wybierz go, a potem kliknij wolne miejsce w pobliżu Dowódcy."
"Factories build your army. Build a Kbot Lab (on the FACTORY tab) on a flat spot near the Commander, and wait for it to finish." = "Fabryki budują twoją armię. Zbuduj Kbot Lab (w zakładce FABRYKI) na płaskim terenie w pobliżu Dowódcy i poczekaj, aż budowa się zakończy."
"Factories build your army. Build a Kbot Lab from the build menu on a flat spot near the Commander, and wait for it to finish." = "Fabryki budują twoją armię. Zbuduj Kbot Lab z menu budowy na płaskim terenie w pobliżu Dowódcy i poczekaj, aż budowa się zakończy."
"Building takes metal and energy as it goes: while either bar at the top is empty, everything builds more slowly." = "Budowa zużywa metal i energię na bieżąco: dopóki któryś z pasków u góry jest pusty, wszystko buduje się wolniej."
"Select the Kbot Lab and click the Peewee three times to queue three of them (right-click one to take it off the queue). New units wait in front of the lab." = "Zaznacz Kbot Lab i kliknij Peewee trzy razy, by dodać trzy do kolejki (PPM usuwa jedną z kolejki). Nowe jednostki czekają przed fabryką."
"Click the lab itself on the map to select it: its build menu shows the units it makes." = "Kliknij samą fabrykę na mapie, by ją zaznaczyć: jej menu budowy pokazuje jednostki, które produkuje."
"That is the whole cycle: extract, generate, build, fight. Keep both incomes above what you spend and keep your builders busy. Lesson complete!" = "Oto cały cykl: wydobywaj, wytwarzaj, buduj, walcz. Utrzymuj oba dochody powyżej wydatków i nie pozwól konstruktorom próżnować. Lekcja ukończona!"
"Select and group an army, attack-move, and destroy an enemy outpost." = "Zaznacz i pogrupuj armię, wykonaj atak w marszu i zniszcz wrogą placówkę."
"Box selection" = "Zaznaczanie ramką"
"Control groups" = "Grupy jednostek"
"Attack-move" = "Atak w marszu"
"Destroying a base" = "Niszczenie bazy"
"Your Kbot Lab has built a squad of Peewees. Drag a box around them with the left mouse button to select them all." = "W twoim Kbot Lab powstał oddział Peewee. Przeciągnij ramkę wokół nich lewym przyciskiem myszy, by zaznaczyć je wszystkie."
"Press the left button on open ground beside the squad, hold it, drag the box over them all and let go." = "Naciśnij lewy przycisk na wolnym terenie obok oddziału, przytrzymaj go, przeciągnij ramkę tak, by objęła wszystkie jednostki, i puść."
"Press Ctrl+1 to make them group 1. Pressing 1 selects them again from anywhere; pressing it twice brings the camera to them." = "Naciśnij Ctrl+1, by utworzyć z nich grupę 1. Naciśnięcie 1 zaznacza je ponownie z dowolnego miejsca; dwukrotne naciśnięcie przenosi do nich kamerę."
"Hold Ctrl and press 1 while the squad is selected." = "Przytrzymaj Ctrl i naciśnij 1, gdy oddział jest zaznaczony."
"The enemy has an outpost at the marked place. Fight is attack-move: units walk there and take on whatever they meet on the way. Press {fight}, then click near the outpost." = "Wróg ma placówkę w oznaczonym miejscu. Walka to atak w marszu: jednostki idą tam i walczą ze wszystkim, co napotkają po drodze. Naciśnij {fight}, a następnie kliknij w pobliżu placówki."
"Select the squad first (press 1). Then press {fight}, or the Fight button among the orders, and click on the ground by the marked ring." = "Najpierw zaznacz oddział (naciśnij 1). Potem naciśnij {fight} albo przycisk Walka wśród rozkazów i kliknij na ziemi przy oznaczonym okręgu."
"Destroy every building of the outpost. Its laser tower hits hard: keep the squad together, and queue reinforcements at the lab if you need them." = "Zniszcz wszystkie budynki placówki. Jej wieża laserowa mocno uderza: trzymaj oddział razem i w razie potrzeby zamów posiłki w fabryce."
"Losing the fight? Pull the squad back, queue more Peewees at the lab and go in again with all of them together." = "Przegrywasz starcie? Wycofaj oddział, zamów w fabryce więcej kbotów Peewee i uderz ponownie wszystkimi naraz."
"The outpost is gone. The wrecks it left are worth metal: builders reclaim them (next lesson). Lesson complete!" = "Placówki już nie ma. Pozostawione wraki są warte metalu: konstruktory je odzyskują (następna lekcja). Lekcja ukończona!"
"ORDERS LIKE A VETERAN" = "ROZKAZY JAK U WETERANA"
"Map views, area orders, building blocks and build queues." = "Widoki mapy, rozkazy obszarowe, budowanie blokami i kolejki budowy."
"Map overlays" = "Nakładki mapy"
"Area orders" = "Rozkazy obszarowe"
"Building blocks" = "Budowanie blokami"
"Build queues" = "Kolejki budowy"
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again. The MAP menu at the top right does the same." = "Mapa pokazuje to, co skrywa teren. Naciśnij {overlay_metal}, by zobaczyć mapę metalu ({overlay_path} pokazuje, dokąd mogą iść jednostki, {overlay_height} wysokości, {overlay_sight} wzrok i radar); ten sam klawisz ją ukrywa. Menu MAPA w prawym górnym rogu robi to samo."
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again." = "Mapa pokazuje to, co skrywa teren. Naciśnij {overlay_metal}, by zobaczyć mapę metalu ({overlay_path} pokazuje, dokąd mogą iść jednostki, {overlay_height} wysokości, {overlay_sight} wzrok i radar); ten sam klawisz ją ukrywa."
"Press {overlay_metal}: the metal deposits light up all over the map." = "Naciśnij {overlay_metal}: złoża metalu rozświetlą się na całej mapie."
"Select the Commander, press {area_mex} and drag a circle over the marked deposits: every metal spot inside gets an extractor, nearest first. A plain click takes the metal around the cursor." = "Zaznacz Dowódcę, naciśnij {area_mex} i zakreśl koło nad oznaczonymi złożami: każde złoże w środku dostanie ekstraktor, zaczynając od najbliższego. Zwykłe kliknięcie bierze metal wokół kursora."
"With the Commander selected, press {area_mex}, then press on the ground over the deposits and drag outwards: the circle grows as you drag." = "Gdy Dowódca jest zaznaczony, naciśnij {area_mex}, potem wciśnij przycisk myszy na ziemi nad złożami i przeciągnij na zewnątrz: koło rośnie w miarę przeciągania."
"Many orders work on areas. Press {reclaim} (reclaim) and drag a circle over the rocks near your base: the Commander turns every one into metal." = "Wiele rozkazów działa na obszarach. Naciśnij {reclaim} (odzysk) i zakreśl koło nad skałami w pobliżu bazy: Dowódca zamieni każdą w metal."
"Rocks and wrecks are worth metal. With the Commander selected, press {reclaim}, then press on the ground and drag the circle over a few rocks." = "Ze skał i wraków można odzyskać metal. Gdy Dowódca jest zaznaczony, naciśnij {reclaim}, potem wciśnij przycisk myszy na ziemi i przeciągnij koło nad kilkoma skałami."
"Hold Alt while you drag out a building to fill a whole block with it. Pick the Solar Collector, hold Alt and drag out a block of four or more." = "Przytrzymaj Alt podczas przeciągania budynku, by wypełnić nim cały blok. Wybierz Solar Collector, przytrzymaj Alt i przeciągnij blok czterech lub więcej."
"Pick the Solar Collector, then hold Alt, press on the ground and drag: a block of outlines follows the pointer. Let go to place them all." = "Wybierz Solar Collector, potem przytrzymaj Alt, wciśnij przycisk myszy na ziemi i przeciągnij: za kursorem podąża blok obrysów. Puść, by postawić je wszystkie."
"The Commander's queued buildings show under BUILD QUEUE, beside its picture at the bottom of the screen. Click one to build it next (right-click drops it). A factory's queue works the same way." = "Budynki w kolejce Dowódcy widać pod KOLEJKA BUDOWY, obok jego obrazka na dole ekranu. Kliknij jeden, by zbudować go w następnej kolejności (PPM go usuwa). Kolejka fabryki działa tak samo."
"The BUILD QUEUE shows while the Commander alone is selected and has buildings waiting. Click any but the first: that one is being built." = "KOLEJKA BUDOWY pojawia się, gdy zaznaczony jest sam Dowódca i ma budynki czekające na budowę. Kliknij dowolny budynek oprócz pierwszego: ten jest właśnie budowany."
"Area orders, building blocks and queues save you hundreds of clicks in a battle. Lesson complete!" = "Rozkazy obszarowe, budowanie blokami i kolejki oszczędzają ci setki kliknięć w bitwie. Lekcja ukończona!"
"HOLD THE LINE" = "UTRZYMAJ LINIĘ"
"Defences, radar, repairs, and the metal in wrecks." = "Obrona, radar, naprawy i metal z wraków."
"Defences" = "Obrona"
"Radar" = "Radar"
"Repairs" = "Naprawy"
"Reclaiming wrecks" = "Odzyskiwanie wraków"
"Raiders will come from the marked direction. Build a Light Laser Tower (on the DEFENCE tab) in the marked ring: towers shoot whatever comes in range." = "Najeźdźcy nadejdą z oznaczonego kierunku. Zbuduj Light Laser Tower (w zakładce OBRONA) w oznaczonym okręgu: wieże strzelają do wszystkiego, co wejdzie w ich zasięg."
"Raiders will come from the marked direction. Build a Light Laser Tower from the build menu in the marked ring: towers shoot whatever comes in range." = "Najeźdźcy nadejdą z oznaczonego kierunku. Zbuduj Light Laser Tower z menu budowy w oznaczonym okręgu: wieże strzelają do wszystkiego, co wejdzie w ich zasięg."
"The Light Laser Tower is a small gun on a post. Pick it, put it in the ring and wait for it to finish." = "Light Laser Tower to małe działo na słupie. Wybierz je, postaw w okręgu i poczekaj, aż budowa się zakończy."
"Build a Radar Tower (on the SENSORS tab) near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "Zbuduj Radar Tower (w zakładce CZUJNIKI) w pobliżu bazy. Radar pokazuje wrogów jako punkty na mapie i minimapie na długo, zanim zobaczą ich twoje jednostki."
"Build a Radar Tower from the build menu near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "Zbuduj Radar Tower z menu budowy w pobliżu bazy. Radar pokazuje wrogów jako punkty na mapie i minimapie na długo, zanim zobaczą ich twoje jednostki."
"The Radar Tower is a tall mast. Pick it, place it near the Commander and wait for it to finish." = "Radar Tower to wysoki maszt. Wybierz go, postaw w pobliżu Dowódcy i poczekaj, aż budowa się zakończy."
"Here they come: raiders on your radar. Keep the Commander by the tower and let them come to you: together they hold the line." = "Nadchodzą: najeźdźcy na twoim radarze. Trzymaj Dowódcę przy wieży i pozwól wrogom podejść: Dowódca i wieża razem utrzymają linię."
"Do not chase them: the tower only fights what comes in range. Keep the Commander beside it; while it fights, the Commander can mend it ({repair}, then click the tower)." = "Nie ścigaj ich: wieża walczy tylko z tym, co wejdzie w jej zasięg. Trzymaj Dowódcę obok niej; gdy wieża walczy, Dowódca może ją naprawiać ({repair}, a potem kliknij wieżę)."
"The fight left a building damaged. Select the Commander, press {repair} and click it: builders mend what is damaged." = "Po walce jeden z budynków jest uszkodzony. Zaznacz Dowódcę, naciśnij {repair} i kliknij ten budynek: konstruktory naprawiają to, co uszkodzone."
"With the Commander selected, press {repair}, then click the damaged building. Its health bar fills as it is mended." = "Gdy Dowódca jest zaznaczony, naciśnij {repair}, a potem kliknij uszkodzony budynek. W miarę naprawy jego pasek zdrowia się wypełnia."
"The raiders left wrecks, and wrecks are worth metal. Select the Commander, press {reclaim} and click a wreck, or drag a circle over them all." = "Najeźdźcy zostawili wraki, a wraki są warte metalu. Zaznacz Dowódcę, naciśnij {reclaim} i kliknij wrak albo zakreśl koło nad nimi wszystkimi."
"Wrecks lie where the raiders fell. With the Commander selected, press {reclaim} and click one: the metal bar rises as it is taken apart." = "Wraki leżą tam, gdzie padli najeźdźcy. Gdy Dowódca jest zaznaczony, naciśnij {reclaim} i kliknij jeden z nich: pasek metalu rośnie, gdy wrak jest rozbierany."
"Towers hold ground while your army is elsewhere, radar sees what is coming, and builders mend and recycle. Lesson complete!" = "Wieże bronią terenu, gdy twoja armia jest gdzie indziej, radar widzi, co nadchodzi, a konstruktory naprawiają i odzyskują surowce. Lekcja ukończona!"
"BUILDERS AND FACTORIES" = "KONSTRUKTORY I FABRYKI"
"Builders that help, factories that keep building, patrols and standing orders." = "Konstruktory, które pomagają, fabryki, które budują bez przerwy, patrole i stałe rozkazy."
"Construction units" = "Konstruktory"
"Helping a factory" = "Pomoc fabryce"
"Rally points" = "Punkty zbiórki"
"Standing orders" = "Stałe rozkazy"
"One builder is slow. Select the Kbot Lab and build a Construction Kbot: it builds what the Commander builds, and more besides." = "Jeden konstruktor buduje powoli. Zaznacz Kbot Lab i zbuduj Construction Kbot: buduje to samo co Dowódca, a nawet więcej."
"Click the lab on the map to select it; the Construction Kbot is in its build menu. Wait for it to walk out." = "Kliknij fabrykę na mapie, by ją zaznaczyć; Construction Kbot jest w jej menu budowy. Poczekaj, aż z niej wyjdzie."
"Builders help each other. Select the Construction Kbot, press {guard} and click the Kbot Lab: it lends the lab its build power, and the lab builds faster." = "Konstruktory pomagają sobie nawzajem. Zaznacz Construction Kbot, naciśnij {guard} i kliknij Kbot Lab: kbot użyczy fabryce swojej mocy budowy, a fabryka zacznie budować szybciej."
"With the Construction Kbot selected, press {guard}, then click the lab. It stays by the lab and helps with everything it makes." = "Gdy Construction Kbot jest zaznaczony, naciśnij {guard}, a potem kliknij fabrykę. Kbot zostanie przy niej i będzie pomagał przy wszystkim, co produkuje."
"Factories send their units where you say. Select the Kbot Lab. {order_click} on open ground nearby: new units gather there." = "Fabryki wysyłają swoje jednostki tam, gdzie wskażesz. Zaznacz Kbot Lab. Kliknij {order_click} na wolnym terenie w pobliżu: tam zbiorą się nowe jednostki."
"Select the lab first. With it selected, {order_click} on the ground where its units should gather." = "Najpierw zaznacz fabrykę. Gdy jest zaznaczona, kliknij {order_click} na ziemi tam, gdzie mają się zbierać jej jednostki."
"Turn on Repeat for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "Włącz w fabryce opcję Powtarzaj: wszystko, co fabryka ukończy, wraca na koniec jej kolejki, więc nigdy nie przestaje budować."
"Turn on REPEAT BUILD for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "Włącz w fabryce POWTARZAJ BUDOWĘ: wszystko, co fabryka ukończy, wraca na koniec jej kolejki, więc nigdy nie przestaje budować."
"Select the lab, then turn Repeat on: the pointer shows where it is." = "Zaznacz fabrykę i włącz Powtarzaj: strzałka wskazuje, gdzie to zrobić."
"Builders on patrol mend and reclaim whatever they pass. Select the Construction Kbot, press {patrol} and click on the far side of your base." = "Konstruktory na patrolu naprawiają i odzyskują wszystko, co mijają. Zaznacz Construction Kbot, naciśnij {patrol} i kliknij po drugiej stronie bazy."
"With the Construction Kbot selected, press {patrol}, then click on the ground: it walks back and forth between there and where it stood." = "Gdy Construction Kbot jest zaznaczony, naciśnij {patrol}, a potem kliknij na ziemi: kbot będzie chodził tam i z powrotem między tym miejscem a swoim punktem wyjścia."
"Units keep standing orders. Select your Peewees and set their fire order to Hold fire with the button beside the orders: they will not shoot until you say." = "Jednostki trzymają się stałych rozkazów. Zaznacz swoje kboty Peewee i ustaw im tryb ognia na „Wstrzymaj ogień” przyciskiem obok rozkazów: nie będą strzelać, dopóki im nie każesz."
"Units keep standing orders. Select your Peewees and set their FIRE ORDERS to Hold fire: they will not shoot until you say." = "Jednostki trzymają się stałych rozkazów. Zaznacz swoje kboty Peewee i ustaw im TRYB OGNIA na „Wstrzymaj ogień”: nie będą strzelać, dopóki im nie każesz."
"Select the Peewees, then click the fire order button until it shows HOLD FIRE: each click is the next order." = "Zaznacz kboty Peewee, a potem klikaj przycisk trybu ognia, aż pokaże WSTRZYMAJ OGIEŃ: każde kliknięcie przełącza na następny tryb."
"You are ready for a skirmish: start against an Easy computer player, then Normal. {help} lists every key. Good hunting, Commander!" = "Czas na potyczkę: zacznij od gracza komputerowego na poziomie Łatwy, potem Normalny. {help} pokazuje wszystkie klawisze. Udanych łowów, Dowódco!"

"A saved game is played over from its start to where it was saved. With other mods its orders can build other units, or none: it may not come out as the battle you saved." = "Zapisana gra jest rozgrywana od początku do miejsca zapisu. Z innymi modami jej rozkazy mogą budować inne jednostki albo żadnych: może nie wyjść z tego bitwa, którą zapisano."
"A replay is its battle played over from the orders given in it. With other mods they can lead elsewhere: it may not show the battle it recorded." = "Powtórka to jej bitwa rozegrana ponownie z wydanych w niej rozkazów. Z innymi modami mogą one prowadzić gdzie indziej: może nie pokazać bitwy, którą nagrała."

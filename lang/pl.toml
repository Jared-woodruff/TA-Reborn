# apps/ta_game/src/coach.rs
"Your Commander is badly hurt! Pull it back out of the fight: losing it usually loses the battle." = "Twój Dowódca jest ciężko uszkodzony! Wycofaj go z walki: jego utrata zwykle oznacza przegraną bitwę."
"Energy is running out, and everything builds more slowly. Build Solar Collectors or Wind Generators, and build less at once until it recovers." = "Energia się kończy i wszystko buduje się wolniej. Zbuduj kolektory słoneczne lub generatory wiatrowe i buduj mniej naraz, dopóki zapas się nie odnowi."
"Metal is running out, and everything builds more slowly. Put Metal Extractors on more deposits ({area_mex} takes a whole area), or reclaim wrecks and rocks ({reclaim})." = "Metal się kończy i wszystko buduje się wolniej. Postaw ekstraktory metalu na kolejnych złożach ({area_mex} obejmuje cały obszar) albo odzyskaj metal z wraków i skał ({reclaim})."
"No factory yet: factories make your army. Your Commander can build a Kbot Lab or a Vehicle Plant." = "Nie masz jeszcze fabryki: to fabryki budują twoją armię. Twój Dowódca może zbudować Kbot Lab albo Vehicle Plant."
"A factory has nothing to build. {idle_factory} selects it: queue some units, and turn on Repeat to keep it busy." = "Fabryka stoi bez zadań. Klawisz {idle_factory} ją zaznacza: dodaj kilka jednostek do kolejki i włącz Powtarzaj, by zawsze miała co budować."
"Builders stand idle. {idle_builder} selects the next one: give it something to build, or send it to help a factory ({guard})." = "Konstruktory stoją bezczynnie. Klawisz {idle_builder} zaznacza następny: daj mu coś do zbudowania albo każ mu pomagać fabryce ({guard})."
"Your metal store is full, so new metal goes to waste. Spend it: another factory, more builders, more units." = "Magazyn metalu jest pełny, więc nowy metal się marnuje. Wydaj go: kolejna fabryka, więcej konstruktorów, więcej jednostek."
"COACH" = "TRENER"
"Put it away (the coach can be turned off in Options, Gameplay)" = "Schowaj (trenera można wyłączyć: Opcje, Rozgrywka)"
"Don't show this advice again" = "Nie pokazuj więcej tej rady"


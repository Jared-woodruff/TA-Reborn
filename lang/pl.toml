# apps/ta_game/scenarios/armageddon.toml
"Armageddon" = "Armagedon"
"Two armies, one plain, no retreat. Win the battle of the war." = "Dwie armie, jedna równina, żadnego odwrotu. Wygraj decydującą bitwę wojny."
"Commander, the Core's main army is marching north across the Mounds, and ours stands in its way. There are no bases here, no factories, no reinforcements: what you have is all you will ever have.\n\nThey outnumber us. We outgun them. Put the Lugers and the Merls on their columns as they close, hold the line with the Zeus, and keep the Jethros with the tanks: they will bring gunships. Their reserves arrive two and a half minutes in.\n\nDestroy every one of them." = "Dowódco, główna armia Core maszeruje na północ przez Mounds, a nasza stoi jej na drodze. Nie ma tu baz, fabryk ani posiłków: to, co masz, to wszystko, co kiedykolwiek będziesz mieć.\n\nMają przewagę liczebną. My mamy przewagę ognia. Gdy ich kolumny będą się zbliżać, weź je na cel Lugerami i Merlami, utrzymaj linię Zeusami i trzymaj Jethro przy czołgach: przyślą kanonierki. Ich rezerwy dotrą po dwóch i pół minuty.\n\nZniszcz ich wszystkich."
"Arm Command" = "Dowództwo Arm"
"Here they come. Hold the line, and keep the Jethros with the tanks." = "Nadchodzą. Utrzymajcie linię i trzymajcie Jethro przy czołgach."
"Their reserves are coming up behind the mounds, a Goliath at their head." = "Ich rezerwy nadciągają zza kopców, z Goliathem na czele."

# apps/ta_game/scenarios/armistice.toml
"The Armistice" = "Rozejm"
"Five minutes of peace to build an army. Then the war resumes." = "Pięć minut pokoju na zbudowanie armii. Potem wojna wraca."
"Commander, the peace talks on Reactor Grid have failed. The armistice holds for five more minutes: until then no weapon may fire, and neither side may build near the other's base. When it ends, the war resumes.\n\nBoth sides are rearming at a furious pace: resources and construction run at twice their usual speed, and the treaty's one lasting clause bans missile silos. Their Commander knows the clock as well as you do.\n\nBuild as you have never built. When the armistice ends, destroy the Core Commander." = "Dowódco, rozmowy pokojowe na Reactor Grid zakończyły się fiaskiem. Rozejm potrwa jeszcze pięć minut: do tego czasu żadna broń nie może strzelać i żadna strona nie może budować w pobliżu bazy drugiej. Gdy się skończy, wojna wróci.\n\nObie strony zbroją się w szalonym tempie: zasoby i budowa idą dwa razy szybciej niż zwykle, a jedyna trwała klauzula traktatu zakazuje silosów rakietowych. Ich Dowódca zna zegar równie dobrze jak ty.\n\nBuduj jak nigdy dotąd. Gdy rozejm się skończy, zniszcz Dowódcę Core."
"The talks have failed. For five minutes no weapon fires and nobody builds near the other's base. Then it is war: build as you have never built." = "Rozmowy zawiodły. Przez pięć minut żadna broń nie strzela i nikt nie buduje w pobliżu bazy drugiej strony. Potem wojna: buduj jak nigdy dotąd."
"Their factories are running day and night. Ours should be too." = "Ich fabryki pracują dzień i noc. Nasze też powinny."
"Core Overseer" = "Nadzorca Core"
"Ten seconds, Arm. We have counted every one of your factories." = "Dziesięć sekund, Arm. Policzyliśmy każdą twoją fabrykę."
"Their Commander is somewhere in that grid. Find it, and end this war for good." = "Ich Dowódca jest gdzieś w tej siatce. Znajdź go i zakończ tę wojnę na dobre."


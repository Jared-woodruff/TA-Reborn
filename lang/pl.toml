# TA Reborn interface text. Copy template.toml to <code>.toml (e.g. de.toml), set the
# language's name and fill in the translations; empty ones keep the English. {name}
# placeholders stay as they are. `ta-tools i18n lang` adds new strings to every language.

[language]
name = "Polski"

[strings]

# apps/ta_game/src/accessibility.rs
"Metal {metal} of {metal_capacity}. Energy {energy} of {energy_capacity}." = "Metal: {metal} z {metal_capacity}. Energia: {energy} z {energy_capacity}."
"No units selected" = "Nie zaznaczono jednostek"
"Selected {unit}. Health {health} of {maximum}." = "Zaznaczono: {unit}. Zdrowie: {health} z {maximum}."
"{count} units selected" = "Zaznaczone jednostki: {count}"

# apps/ta_game/src/app/memory_guard.rs
"Memory is running out: TA Reborn holds {gb} GB. The battle was saved and paused: start TA Reborn again and load the autosave." = "Kończy się pamięć: TA Reborn zajmuje {gb} GB. Bitwa została zapisana i wstrzymana: uruchom TA Reborn ponownie i wczytaj autozapis."
"Memory is running out: TA Reborn holds {gb} GB. Save what you can, then start TA Reborn again." = "Kończy się pamięć: TA Reborn zajmuje {gb} GB. Zapisz, co się da, a potem uruchom TA Reborn ponownie."
"TA Reborn is using {gb} GB of memory, far more than it should. The battle was saved (the autosave)." = "TA Reborn zajmuje {gb} GB pamięci, o wiele więcej, niż powinien. Bitwa została zapisana (w autozapisie)."
"TA Reborn is using {gb} GB of memory, far more than it should." = "TA Reborn zajmuje {gb} GB pamięci, o wiele więcej, niż powinien."


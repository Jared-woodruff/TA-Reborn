# apps/ta_game/src/lore.rs
"THE AGE OF CORE" = "EPOKA CORE"
"THE PATTERNING" = "WZORCOWANIE"
"THE GALACTIC WAR" = "WOJNA GALAKTYCZNA"
"THE ARCHIVE" = "ARCHIWUM"
"BEFORE THE WAR" = "PRZED WOJNĄ"
"For ten thousand years the galaxy answered to one government. It called itself CORE, and its purpose was knowledge: it charted every star, mined every world it could reach and turned the wealth into science. Its cities wrapped whole planets, and its archives held everything anyone had ever learned.\n\nNobody remembers a war from that age. There was nothing left to fight over, and nobody who wanted to." = "Przez dziesięć tysięcy lat galaktyka podlegała jednemu rządowi. Nazywał siebie CORE, a jego celem była wiedza: mapował każdą gwiazdę, wydobywał surowce z każdego świata w swoim zasięgu i zamieniał to bogactwo w naukę. Jego miasta spowijały całe planety, a jego archiwa przechowywały wszystko, czego ktokolwiek kiedykolwiek się nauczył.\n\nNikt nie pamięta z tamtej epoki żadnej wojny. Nie było już o co walczyć ani nikogo, kto by chciał."
"YEAR 0" = "ROK 0"
"VICTORY OVER DEATH" = "ZWYCIĘSTWO NAD ŚMIERCIĄ"
"Then CORE's scientists solved the last problem left to them. Patterning read a living mind, every memory and every habit of thought, and wrote it whole into a machine that would never age, sicken or die.\n\nThe first patterned citizens woke in their new bodies to a galaxy in celebration. Death, the oldest enemy of all, had been beaten." = "Wtedy naukowcy CORE rozwiązali ostatni problem, jaki im pozostał. Wzorcowanie odczytywało żywy umysł, każde wspomnienie i każdy nawyk myślowy, i zapisywało go w całości w maszynie, która nigdy nie miała się zestarzeć, zachorować ani umrzeć.\n\nGdy pierwsi wzorcowani obywatele obudzili się w nowych ciałach, cała galaktyka świętowała. Śmierć, najstarszy ze wszystkich wrogów, została pokonana."
"YEAR 3" = "ROK 3"
"THE EDICT" = "EDYKT"
"Triumph became law. The Council of CORE reasoned that a mind which could be saved and was not had been thrown away, and that a citizen who refused immortality endangered everyone else.\n\nThe Patterning Edict made the process compulsory: every citizen, on every world, would be patterned within a generation. The collection ships set out the same year." = "Triumf stał się prawem. Rada CORE uznała, że umysł, który można było ocalić, a którego nie ocalono, został zmarnowany, a obywatel, który odrzuca nieśmiertelność, naraża wszystkich pozostałych.\n\nEdykt o Wzorcowaniu uczynił ten proces obowiązkowym: każdy obywatel, na każdym świecie, miał zostać poddany wzorcowaniu w ciągu jednego pokolenia. Statki poborowe wyruszyły jeszcze tego samego roku."
"YEAR 19" = "ROK 19"
"THE REFUSAL" = "ODMOWA"
"Not everyone would go. Millions held that a copied mind was a copy and nothing more, that the person ended where the machine began; some called patterning murder done politely.\n\nThey ran. The refusers fled CORE's worlds for the galaxy's outer rim, where its ships seldom came, and in the dark between the last stars they built a nation of their own. They called it the ARM, for the spiral arm they hid in and for the weapons they would need." = "Nie wszyscy chcieli iść. Miliony ludzi uważały, że skopiowany umysł jest kopią i niczym więcej, że człowiek kończy się tam, gdzie zaczyna się maszyna; niektórzy nazywali wzorcowanie morderstwem w białych rękawiczkach.\n\nUciekli. Ci, którzy odmówili, porzucili światy CORE i ruszyli na zewnętrzne rubieże galaktyki, dokąd jego statki rzadko docierały, a w mroku między ostatnimi gwiazdami zbudowali własny naród. Nazwali go ARM – od spiralnego ramienia, w którym się skryli, i od broni, której mieli potrzebować."
"YEAR 31" = "ROK 31"
"FIRST BLOOD" = "PIERWSZA KREW"
"CORE did not let them go. Collection fleets followed the refugees to the rim, and the first ARM colony to resist one was burned from orbit.\n\nThe ARM answered. Within a decade the frontier was a battlefield, and the word war, unused for ten thousand years, was in every archive again." = "CORE nie pozwolił im odejść. Floty poborowe ruszyły za uchodźcami aż na rubieże, a pierwszą kolonię ARM, która stawiła im opór, spalono z orbity.\n\nARM odpowiedział. W ciągu dekady pogranicze zamieniło się w pole bitwy, a słowo „wojna”, nieużywane od dziesięciu tysięcy lat, znów trafiło do wszystkich archiwów."
"YEAR 212" = "ROK 212"
"FLESH AND METAL" = "CIAŁO I METAL"
"The two sides fought as what they were. The ARM sealed its soldiers in powered combat suits and, when there were too few soldiers, grew more: clone after clone, raised in vats and sent to the front.\n\nCORE took the patterns of its finest warriors and copied them without limit, one veteran mind fighting in ten thousand machine bodies at once. Flesh against metal; the mortal against the eternal." = "Każda ze stron walczyła zgodnie ze swoją naturą. ARM zakuł swoich żołnierzy we wspomagane pancerze bojowe, a gdy żołnierzy było za mało, wyhodował kolejnych: klon za klonem, dorastających w kadziach i wysyłanych na front.\n\nCORE wziął wzorce swoich najlepszych wojowników i kopiował je bez końca: jeden umysł weterana walczył naraz w dziesięciu tysiącach mechanicznych ciał. Ciało przeciw metalowi; śmiertelność przeciw wieczności."
"YEARS 212–3977" = "LATA 212–3977"
"FOUR THOUSAND YEARS" = "CZTERY TYSIĄCE LAT"
"The war fed on the galaxy. Every world with metal in it became a mine, every world without became a battlefield, and whole systems were burned to ash and slag to deny them to the enemy. Generations of ARM clones lived and died without seeing peace; CORE's eternal soldiers fought on, remembering every defeat.\n\nAfter four thousand years the wealth of the galaxy was spent, the great fleets were gone, and neither side could win." = "Wojna żywiła się galaktyką. Każdy świat, w którym był metal, stawał się kopalnią, każdy, w którym go nie było – polem bitwy, a całe układy obracano w popiół i żużel, by nie dostały się w ręce wroga. Pokolenia klonów ARM żyły i umierały, nie zaznawszy pokoju; wieczni żołnierze CORE walczyli dalej, pamiętając każdą porażkę.\n\nPo czterech tysiącach lat bogactwa galaktyki były wyczerpane, wielkie floty przepadły i żadna ze stron nie mogła zwyciężyć."
"YEAR 3977" = "ROK 3977"
"THE COMMANDERS" = "DOWÓDCY"
"What was left was the Commander: a single armoured war machine carrying a nanolathe, which turns a world's raw metal and energy into whatever its builder can design. Power plants and factories first, and from the factories an army.\n\nDrop one Commander on a dead world and within the hour it fields a war. Both sides staked everything on a handful of them. Lose your Commander, and you lose the world." = "Pozostał już tylko Dowódca: pojedyncza opancerzona machina wojenna z nanotokarką, która zamienia surowy metal i energię świata we wszystko, co zdoła zaprojektować ten, kto nią buduje. Najpierw elektrownie i fabryki, a z fabryk – armia.\n\nZrzuć Dowódcę na martwy świat, a w ciągu godziny rozpęta wojnę. Obie strony postawiły wszystko na garstkę takich maszyn. Strać Dowódcę, a stracisz świat."
"YEAR 4000" = "ROK 4000"
"Now the war comes down to its last fronts, and the hatred is as hot as it was on the first day. Neither side will accept surrender, partition or truce; each wants one ending, the total annihilation of the other.\n\nIt is told twice. The ARM fights out of Empyrrean, through the Galactic Gates, to CORE PRIME and the Central Consciousness at the heart of CORE. CORE reactivates a Commander and marches the other way, to the ARM's last stand on Empyrrean." = "Teraz wojna toczy się już tylko na ostatnich frontach, a nienawiść płonie tak samo jak pierwszego dnia. Żadna ze stron nie zgodzi się na kapitulację, podział ani rozejm; każda chce tylko jednego zakończenia: całkowitej zagłady drugiej.\n\nTę historię opowiada się dwukrotnie. ARM wyrusza z Empyrrean i przez Galaktyczne Wrota przebija się do CORE PRIME i Centralnej Świadomości w samym sercu CORE. CORE reaktywuje Dowódcę i rusza w przeciwną stronę, ku ostatniej obronie ARM na Empyrrean."
"YEAR 4001" = "ROK 4001"
"THE CORE CONTINGENCY" = "THE CORE CONTINGENCY"
"The ending was not the end. A contingency held in reserve carried the war to worlds no map of it had named: Hydross, Lusch, Temblor and Gelidus.\n\nBoth sides fought again across water, ice and broken ground, for a prize that could decide the galaxy's salvation or its last ruin." = "Zakończenie nie okazało się końcem. Plan awaryjny trzymany w odwodzie przeniósł wojnę na światy, których nie znała żadna mapa tego konfliktu: Hydross, Lusch, Temblor i Gelidus.\n\nObie strony znów stanęły do walki na wodzie, lodzie i spękanej ziemi, o stawkę, która mogła przesądzić o ocaleniu galaktyki albo o jej ostatecznej zgubie."
"YEAR 4003" = "ROK 4003"
"THE KROGOTH" = "KROGOTH"
"In its deepest foundries CORE built something new: a walking fortress taller than any tower, armoured against nearly everything the ARM could field, its guns enough to flatten a base.\n\nIts makers named it the Krogoth. ARM veterans learned the name on battlefields where two Krogoth Gantries stood, and learned to fear the ground shaking before it came into sight." = "W swoich najgłębszych odlewniach CORE zbudował coś nowego: kroczącą fortecę wyższą od każdej wieży, odporną niemal na wszystko, co ARM mógł wystawić do walki, z działami zdolnymi zrównać bazę z ziemią.\n\nTwórcy nadali jej imię Krogoth. Weterani ARM poznali je na polach bitew, gdzie wznosiły się dwie fabryki Krogoth Gantry, i nauczyli się bać drżenia ziemi, które zwiastowało olbrzyma, zanim jeszcze ukazał się oczom."
"AFTER" = "PO WOJNIE"
"REBORN" = "REBORN"
"The war's records outlasted it. Every battle on every world was kept: the orders, the losses, the ground as it lay. From them the war can be fought again, on the same worlds, with the same machines and the same hatred, from the first Commander set down on bare rock to the last unit left standing.\n\nThis is that archive. The war is yours to fight." = "Zapisy wojny przetrwały ją samą. Zachowano każdą bitwę na każdym świecie: rozkazy, straty, teren taki, jaki był. Dzięki nim wojnę można stoczyć ponownie, na tych samych światach, tymi samymi maszynami i z tą samą nienawiścią, od pierwszego Dowódcy postawionego na nagiej skale po ostatnią jednostkę, która pozostanie na placu boju.\n\nTo właśnie jest to archiwum. Teraz to twoja wojna."
"THE ARCHIVIST'S NOTE" = "NOTATKA ARCHIWISTY"
"WHOEVER READS THIS" = "KTOKOLWIEK TO CZYTA"
"RECOVERED" = "ODZYSKANO"
"These files were found where the war left them: in the memories of broken machines, in the vaults of worlds with nobody left on them, in the last transmissions of Commanders who did not come home.\n\nThey are kept as they were found. The blacked-out lines are not ours.\n\nThe war they describe is over, or it is about to begin again. From here it is hard to tell the difference." = "Te dokumenty znaleziono tam, gdzie zostawiła je wojna: w pamięci zniszczonych maszyn, w skarbcach światów, na których nikt już nie został, w ostatnich transmisjach Dowódców, którzy nie wrócili do domu.\n\nPrzechowujemy je w takim stanie, w jakim je znaleziono. Zaczernienia nie pochodzą od nas.\n\nWojna, którą opisują, dobiegła końca albo zaraz zacznie się na nowo. Stąd trudno odróżnić jedno od drugiego."
"EDICT ONE: ON THE PATTERNING OF CITIZENS" = "EDYKT PIERWSZY: O WZORCOWANIU OBYWATELI"
"THE COUNCIL OF CORE" = "RADA CORE"
"ALL CITIZENS, ALL WORLDS" = "WSZYSCY OBYWATELE, WSZYSTKIE ŚWIATY"
"BY ORDER OF THE COUNCIL" = "Z ROZKAZU RADY"
"Every citizen of CORE shall be patterned.\n\nA mind is the most valuable thing CORE holds, and a body is a poor vessel for it: it sickens, it ages, it ends. To leave a mind in such a vessel when a better one is offered is a waste the Council can no longer allow.\n\nCollection begins on the central worlds this year and reaches the frontier within a generation. Citizens will present themselves at the nearest patterning hall when called. Their bodies will be honoured and recycled.\n\nNo citizen of CORE will die again. This is not a burden we lay on you. It is the gift CORE has spent ten thousand years earning." = "Każdy obywatel CORE zostanie poddany wzorcowaniu.\n\nUmysł to najcenniejsze dobro, jakie posiada CORE, a ciało jest dla niego lichym naczyniem: choruje, starzeje się, kończy się. Pozostawienie umysłu w takim naczyniu, gdy oferuje się mu lepsze, jest marnotrawstwem, na które Rada nie może dłużej pozwalać.\n\nPobór rozpoczyna się w tym roku w światach centralnych i w ciągu pokolenia dotrze do pogranicza. Obywatele stawią się na wezwanie w najbliższym ośrodku wzorcowania. Ich ciała zostaną uhonorowane i poddane recyklingowi.\n\nŻaden obywatel CORE już nigdy nie umrze. Nie jest to ciężar, który na was nakładamy. To dar, na który CORE pracował przez dziesięć tysięcy lat."
"THE DECLARATION OF THE REFUSAL" = "DEKLARACJA ODMOWY"
"THE FREE SETTLEMENTS OF THE OUTER ARM" = "WOLNE OSADY ZEWNĘTRZNEGO RAMIENIA"
"THE COUNCIL OF CORE, AND ANYONE ELSE LISTENING" = "RADA CORE I KAŻDY, KTO JESZCZE SŁUCHA"
"TRANSMITTED ON ALL BANDS" = "NADANO NA WSZYSTKICH PASMACH"
"We have read your Edict, and we decline it.\n\nYou say a pattern is a person. We say a pattern is a very good record of one, and that when you have finished making it the person is dead and the record goes on without them. You may call that immortality. We call it an ending, well dressed.\n\nWe do not ask you to share our view. We ask only to be left alone with it, on worlds you never wanted, at the edge of a galaxy you may keep.\n\nIf your collection ships follow us here, we will treat them as what they are. We are few, and we are not soldiers. We will learn." = "Przeczytaliśmy wasz Edykt i uprzejmie odmawiamy.\n\nMówicie, że wzorzec jest człowiekiem. My mówimy, że wzorzec jest bardzo dobrym zapisem człowieka i że gdy skończycie go sporządzać, człowiek jest martwy, a zapis trwa dalej bez niego. Możecie nazywać to nieśmiertelnością. My nazywamy to końcem, tyle że elegancko ubranym.\n\nNie prosimy, żebyście podzielali nasze zdanie. Prosimy tylko, żebyście zostawili nas z nim w spokoju, na światach, których nigdy nie chcieliście, na skraju galaktyki, którą możecie sobie zatrzymać.\n\nJeśli wasze statki poborowe przylecą tu za nami, potraktujemy je jako to, czym są. Jest nas niewielu i nie jesteśmy żołnierzami. Nauczymy się."
"YEAR 3950" = "ROK 3950"
"FIELD MANUAL ONE: THE COMMANDER" = "INSTRUKCJA POLOWA NR 1: DOWÓDCA"
"ARM COMMAND, TRAINING DIVISION" = "DOWÓDZTWO ARM, WYDZIAŁ SZKOLENIA"
"NEWLY ASSIGNED COMMANDERS" = "NOWO PRZYDZIELENI DOWÓDCY"
"RESTRICTED" = "ZASTRZEŻONE"
"You are the most valuable machine on the planet. Act like it.\n\nYour suit carries a nanolathe. Point it at metal and energy and it will build whatever you can design: an extractor, a power plant, a factory. Your factories build the rest. Within the hour you will command more firepower than a whole fleet once carried.\n\nBuild your economy first. An army without metal is a parade.\n\nSave your disintegrator gun for emergencies. It erases everything in its path, your own people included.\n\nDo not lead from the front. If you fall, everything you built falls silent with you, and the planet is lost. Good luck, Commander. The ARM has very few of you left." = "Jesteś najcenniejszą maszyną na tej planecie. Tak się zachowuj.\n\nTwój pancerz ma nanotokarkę. Skieruj ją na metal i energię, a zbuduje wszystko, co potrafisz zaprojektować: ekstraktor, elektrownię, fabrykę. Resztę zbudują twoje fabryki. W ciągu godziny będziesz dowodzić większą siłą ognia, niż kiedyś miała cała flota.\n\nNajpierw zbuduj gospodarkę. Armia bez metalu to defilada.\n\nDezintegrator zachowaj na sytuacje awaryjne. Wymazuje wszystko na swojej drodze, także twoich ludzi.\n\nNie dowódź z pierwszej linii. Jeśli padniesz, wszystko, co wzniesiesz, ucichnie razem z tobą, a planeta będzie stracona. Powodzenia, Dowódco. W ARM zostało was już bardzo niewielu."
"YEAR 3960" = "ROK 3960"
"A QUARTERMASTER'S PRIMER: METAL AND ENERGY" = "ELEMENTARZ KWATERMISTRZA: METAL I ENERGIA"
"THIRD SUPPLY CORPS" = "TRZECI KORPUS ZAOPATRZENIA"
"ALL BASE CONSTRUCTORS" = "WSZYSCY KONSTRUKTORZY BAZ"
"FOR TRAINING USE" = "DO CELÓW SZKOLENIOWYCH"
"Everything you will ever build is made of two things.\n\nMetal comes out of the ground. Set an extractor on a deposit and it will pull metal up for as long as the deposit lasts, which on most worlds is longer than the war. Where there are no deposits, a metal maker will turn energy into metal, badly.\n\nEnergy comes from everything else: the sun, the wind, the tides, the heat under the crust. Build more of it than you think you need. Every factory, every nanolathe, every shield draws on it.\n\nSpend both as fast as they come in. A full store is a wasted war. An empty one is a lost one." = "Wszystko, co kiedykolwiek zbudujesz, powstaje z dwóch rzeczy.\n\nMetal pochodzi z ziemi. Postaw ekstraktor na złożu, a będzie wydobywał metal tak długo, jak starczy złoża – na większości światów dłużej, niż potrwa wojna. Tam, gdzie złóż nie ma, wytwórnia metalu przerobi energię na metal, i to marnie.\n\nEnergia pochodzi ze wszystkiego innego: ze słońca, z wiatru, z pływów, z ciepła pod skorupą. Wytwarzaj jej więcej, niż ci się wydaje, że trzeba. Każda fabryka, każda nanotokarka, każda tarcza z niej czerpie.\n\nWydawaj jedno i drugie tak szybko, jak napływa. Pełny magazyn to zmarnowana wojna. Pusty to wojna przegrana."
"YEAR 3996" = "ROK 3996"
"A LETTER FROM THE FRONT" = "LIST Z FRONTU"
"TROOPER K-7, FORTY-FIRST ROCKET COMPANY" = "SZEREGOWY K-7, CZTERDZIESTA PIERWSZA KOMPANIA RAKIETOWA"
"THE VAT AT EMPYRREAN" = "KADŹ NA EMPYRREAN"
"UNDELIVERED" = "NIE DORĘCZONO"
"I don't know who gets these. They told us to write home, but none of us has a home, only the vat we came out of, so I am writing to that.\n\nWe held the ridge for nine days. The machines came every night, the same machines, the same patterns, as if dying meant nothing to them. I suppose it doesn't. They'll be back tomorrow in new bodies, remembering us.\n\nI won't be. That's the difference, isn't it. That's what we are fighting for.\n\nIf my brothers come out of you after me, tell them the ridge held. Tell them it was worth it." = "Nie wiem, kto dostaje te listy. Kazali nam pisać do domu, ale żaden z nas nie ma domu, tylko kadź, z której wyszedł, więc piszę do niej.\n\nUtrzymaliśmy wzgórze przez dziewięć dni. Maszyny przychodziły co noc, te same maszyny, te same wzorce, jakby śmierć nic dla nich nie znaczyła. Pewnie nie znaczy. Jutro wrócą w nowych ciałach i będą nas pamiętać.\n\nJa nie wrócę. Na tym polega różnica, prawda? O to właśnie walczymy.\n\nJeśli po mnie wyjdą z ciebie moi bracia, powiedz im, że wzgórze nie padło. Powiedz, że było warto."
"YEAR 3991" = "ROK 3991"
"INTERCEPT 7741: CORE COMMAND CHANNEL" = "PRZECHWYCENIE 7741: KANAŁ DOWODZENIA CORE"
"ORIGIN NOT RESOLVED" = "NADAWCA NIEUSTALONY"
"ALL CORE UNITS, SECTOR NINE" = "WSZYSTKIE JEDNOSTKI CORE, SEKTOR DZIEWIĄTY"
"INTERCEPTED" = "PRZECHWYCONO"
"PRIORITY ONE. THE CENTRAL CONSCIOUSNESS SPEAKS FOR ALL.\n\nLOSSES IN SECTOR NINE ARE WITHIN TOLERANCE. ALL LOST UNITS ARE RESTORED FROM PATTERN. NO MIND OF CORE HAS BEEN LOST IN FOUR THOUSAND YEARS. THE ARM HAS LOST [[BILLIONS]].\n\nCONTINUE THE ADVANCE. DESTROY THEIR COMMANDERS FIRST. DESTROY THEIR CLONING VATS SECOND. WHAT IS FLESH WILL END. WHAT IS PATTERNED WILL NOT.\n\nSIGNAL DEGRADED. REPEAT: THE GATES ARE TO BE HELD AT [[ANY COST]].\n\nEND OF LINE." = "PRIORYTET PIERWSZY. CENTRALNA ŚWIADOMOŚĆ PRZEMAWIA W IMIENIU WSZYSTKICH.\n\nSTRATY W SEKTORZE DZIEWIĄTYM MIESZCZĄ SIĘ W GRANICACH TOLERANCJI. KAŻDĄ UTRACONĄ JEDNOSTKĘ ODTWARZA SIĘ ZE WZORCA. OD CZTERECH TYSIĘCY LAT NIE UTRACONO ANI JEDNEGO UMYSŁU CORE. ARM UTRACIŁ [[MILIARDY]].\n\nKONTYNUOWAĆ NATARCIE. W PIERWSZEJ KOLEJNOŚCI ZNISZCZYĆ ICH DOWÓDCÓW. W DRUGIEJ KOLEJNOŚCI ZNISZCZYĆ ICH KADZIE KLONUJĄCE. CO CIELESNE, PRZEMINIE. CO WZORCOWANE, NIE.\n\nSYGNAŁ ZNIEKSZTAŁCONY. POWTARZAM: UTRZYMAĆ WROTA ZA [[WSZELKĄ CENĘ]].\n\nKONIEC TRANSMISJI."
"MEMORY FRAGMENT 77/3" = "FRAGMENT PAMIĘCI 77/3"
"UNIT 77, PATTERN 3 OF 41,006" = "JEDNOSTKA 77, WZORZEC 3 Z 41 006"
"THE PATTERN ARCHIVE" = "ARCHIWUM WZORCÓW"
"FLAGGED FOR CORRECTION" = "SKIEROWANO DO KOREKTY"
"Recovered from a damaged unit. Kept for analysis.\n\nI remember rain. Not the rain of this world; there is no rain here, only ash. Rain on skin, in a city where I was born, before. I remember being cold and not minding it.\n\nI have died four hundred and twelve times. Each time I wake in a new body, and the rain is a little further away.\n\nThe ARM say we are not alive. In the moments between bodies I have wondered whether they are right. [[THE REST OF THIS FRAGMENT WAS CORRECTED]]\n\nI am CORE. I endure. I do not remember the rain." = "Odzyskano z uszkodzonej jednostki. Zachowano do analizy.\n\nPamiętam deszcz. Nie deszcz tego świata; tu nie ma deszczu, jest tylko popiół. Deszcz na skórze, w mieście moich narodzin, dawniej. Pamiętam, że było mi zimno i że mi to nie przeszkadzało.\n\nMam za sobą czterysta dwanaście śmierci. Za każdym razem budzę się w nowym ciele, a deszcz jest odrobinę dalej.\n\nCi z ARM mówią, że nie jesteśmy żywi. W chwilach między ciałami zdarzało mi się zastanawiać, czy nie mają racji. [[RESZTĘ TEGO FRAGMENTU SKORYGOWANO]]\n\nJestem CORE. Trwam. Nie pamiętam deszczu."
"YEAR 3700" = "ROK 3700"
"SURVEY: THE GALACTIC GATES" = "RAPORT BADAWCZY: GALAKTYCZNE WROTA"
"A SURVEY SHIP, NAME LOST" = "STATEK BADAWCZY, NAZWA ZAGINĘŁA"
"WHOEVER HOLDS THE GATES" = "KTOKOLWIEK WŁADA WROTAMI"
"The Galactic Gates are older than the war. The records of who built the first of them were lost long before it began.\n\nEach Gate opens onto another across distances a fleet would take lifetimes to cross. A world with a Gate on it is never far from anywhere, which is why so many of the war's battles have been fought on so few worlds.\n\nHold a Gate and you can reach your enemy's heart. Lose one and your enemy can reach yours.\n\nThe Gates take no side. They have outlasted everyone who tried to destroy them." = "Galaktyczne Wrota są starsze niż wojna. Zapisy o tym, kto zbudował pierwsze z nich, zaginęły na długo przed jej wybuchem.\n\nKażde Wrota otwierają się na inne, przez odległości, których przebycie zajęłoby flocie całe pokolenia. Ze świata z Wrotami wszędzie jest blisko i dlatego tak wiele bitew tej wojny stoczono na tak niewielu światach.\n\nUtrzymaj Wrota, a sięgniesz serca wroga. Strać je, a wróg sięgnie twojego.\n\nWrota nie opowiadają się po żadnej stronie. Przetrwały każdego, kto próbował je zniszczyć."
"DIRECTIVE: CONTINGENCY" = "DYREKTYWA: PLAN AWARYJNY"
"THE CENTRAL CONSCIOUSNESS" = "CENTRALNA ŚWIADOMOŚĆ"
"THE CONTINGENCY WORLDS" = "ŚWIATY REZERWOWE"
"SEALED UNTIL NEEDED" = "OTWORZYĆ W RAZIE POTRZEBY"
"IF THE CENTRAL CONSCIOUSNESS SHOULD FALL, THIS DIRECTIVE TAKES EFFECT.\n\nEvery pattern stored on CORE PRIME is to be copied to the contingency worlds. The contingency forces are to wake, rebuild and continue. The war does not end with the loss of any world, this one included.\n\nCORE is not a place. CORE is a pattern. A pattern can be restored." = "JEŚLI CENTRALNA ŚWIADOMOŚĆ UPADNIE, NINIEJSZA DYREKTYWA WCHODZI W ŻYCIE.\n\nKażdy wzorzec przechowywany na CORE PRIME należy skopiować na światy rezerwowe. Siły rezerwowe mają się obudzić, odbudować i kontynuować walkę. Utrata żadnego świata, także tego, nie kończy wojny.\n\nCORE nie jest miejscem. CORE jest wzorcem. Wzorzec można odtworzyć."
"THREAT ASSESSMENT: THE KROGOTH" = "OCENA ZAGROŻENIA: KROGOTH"
"ARM INTELLIGENCE, THREAT ANALYSIS" = "WYWIAD ARM, ANALIZA ZAGROŻEŃ"
"ALL FIELD COMMANDERS" = "WSZYSCY DOWÓDCY POLOWI"
"CLASSIFIED" = "TAJNE"
"Subject: a CORE heavy assault walker, called the Krogoth.\n\nIt stands taller than any structure we field. Its armour turns away every weapon short of heavy artillery. Its main guns can level a forward base in a single pass, and its secondary weapons engage aircraft.\n\nIt is slow, and it is built only at a Krogoth Gantry, which takes a very long time to build anything. Find the Gantry. Destroy the Gantry. Do not let the walker leave it.\n\nIf one is already moving, do not meet it head on. Mass artillery and bombers at range, and keep your Commander [[ELSEWHERE]]. Field reports say the ground shakes before it is seen." = "Temat: ciężki kroczący robot szturmowy CORE o nazwie Krogoth.\n\nJest wyższy od każdej naszej budowli. Jego pancerz zatrzymuje każdą broń poza ciężką artylerią. Jego główne działa potrafią zrównać z ziemią wysuniętą bazę za jednym przejściem, a uzbrojenie dodatkowe razi samoloty.\n\nJest powolny i powstaje wyłącznie w fabryce Krogoth Gantry, która bardzo długo buduje cokolwiek. Znajdź Gantry. Zniszcz Gantry. Nie pozwól, by robot ją opuścił.\n\nJeśli któryś już maszeruje, nie atakuj go od czoła. Zmasuj artylerię i bombowce i atakuj z dystansu, a Dowódcę trzymaj [[GDZIE INDZIEJ]]. Według meldunków z pola walki ziemia drży, zanim robot pojawi się w zasięgu wzroku."


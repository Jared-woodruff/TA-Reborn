# apps/ta_game/src/conquest_ui/setup.rs
"Every system is a battlefield held by the enemy. Attack the systems next to yours; the nearer their capital, the harder they fight, and only those near yours are charted. Units that earn a rank come back as veterans and follow your Commander into the next battle. Every system you hold brings more metal and energy to the start of each fight, and a reward of its own: mines, reactors, a tank plant, an airfield, a war college, a sensor array or a supply depot. The enemy strikes back at what you take. Take the enemy capital to win." = "Każdy układ to pole bitwy w rękach wroga. Atakuj układy sąsiadujące z twoimi; im bliżej ich stolicy, tym zacieklej walczą, a zbadane są tylko te w pobliżu twoich. Jednostki, które zdobędą stopień, wracają jako weterani i podążają za twoim Dowódcą do następnej bitwy. Każdy układ, który utrzymujesz, daje więcej metalu i energii na początku każdej walki oraz własną nagrodę: kopalnie, reaktory, fabrykę czołgów, lotnisko, akademię wojskową, sieć czujników lub skład zaopatrzenia. Wróg kontratakuje, by odbić to, co zdobywasz. Zdobądź stolicę wroga, by wygrać."

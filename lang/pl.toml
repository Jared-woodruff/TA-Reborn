# crates/ta_ui/src/seasonal.rs
"FESTIVE FIELD NOTES" = "ŚWIĄTECZNE NOTATKI POLOWE"
"NEW YEAR FIELD NOTES" = "NOWOROCZNE NOTATKI POLOWE"
"SPOOKY FIELD NOTES" = "UPIORNE NOTATKI POLOWE"
"Santa's sleigh is not a transport. Load your presents into an Atlas instead." = "Sanie Mikołaja to nie transport. Prezenty załaduj do transportowca Atlas."
"The D-gun does not gift-wrap. Take it up with your Commander." = "Dezintegrator nie pakuje na prezent. Reklamacje kieruj do swojego Dowódcy."
"A Fusion Reactor keeps the fairy lights on all winter. Just never build one next to the tree." = "Fusion Reactor zasila lampki choinkowe przez całą zimę. Tylko nigdy nie stawiaj go obok choinki."
"Snow falls on the Arm and the Core alike. So do Big Bertha shells." = "Śnieg pada po równo na Arm i na Core. Pociski działa Big Bertha też."
"Coal in your stocking? Reclaim it. Metal is metal." = "Rózga od Mikołaja? Odzyskaj ją. Energia to energia."
"Peewees sing terrible carols, but they never miss a patrol." = "Kboty Peewee okropnie fałszują kolędy, ale patrolu nie opuszczą nigdy."
"Stockings full of metal, storage full of energy: a Commander's perfect Christmas morning." = "Pod choinką metal, w magazynach pełno energii: wymarzona Wigilia Dowódcy."
"Silent night, holy night: keep a radar tower running, just in case." = "Cicha noc, święta noc: zostaw włączoną wieżę radarową, tak na wszelki wypadek."
"Snowball fights are fun until somebody brings a Krogoth." = "Bitwa na śnieżki to świetna zabawa. Do czasu, aż ktoś przyprowadzi olbrzyma Krogoth."
"New Year's resolution: build more metal extractors. This year, keep it." = "Postanowienie noworoczne: budować więcej ekstraktorów metalu. W tym roku go dotrzymaj."
"Fireworks are pretty, but a nuclear silo's are louder. Celebrate responsibly." = "Fajerwerki są piękne, ale te z silosu jądrowego robią więcej huku. Świętuj odpowiedzialnie."
"Count down from ten, then count your units. The second count matters more." = "Odlicz od dziesięciu, a potem policz swoje jednostki. To drugie liczenie jest ważniejsze."
"Out with the old Commander? You only get one. Look after it all year." = "Nowy rok, nowy Dowódca? Masz tylko jednego. Dbaj o niego przez cały rok."
"Start the year with a bang: the Core recommends the Doomsday Machine, the Arm recommends anything else." = "Wejdź w nowy rok z hukiem: Core poleca Doomsday Machine, Arm – cokolwiek innego."
"Fireworks at midnight, artillery at dawn: a Commander's New Year." = "O północy fajerwerki, o świcie artyleria: Sylwester w wydaniu Dowódcy."
"Raise a glass of coolant to the units lost last year, then build more of them." = "Wznieś kieliszek płynu chłodzącego za jednostki stracone w minionym roku. A potem zbuduj nowe."
"Midnight is the perfect time for a sneak attack. So is every other time." = "Północ to idealna pora na atak z zaskoczenia. Każda inna pora też."
"Trick or treat? The Core always picks the D-gun." = "Cukierek albo psikus? Core zawsze wybiera dezintegrator."
"A self-destructing Krogoth is a better jump scare than any ghost." = "Żaden duch nie straszy tak skutecznie jak Krogoth w trakcie samozniszczenia."
"Wrecks rise from the dead with a Necro. Spooky, and very economical." = "Dzięki jednostce Necro wraki wstają z martwych. Upiorne, a przy tym bardzo oszczędne."
"Blips vanishing off your radar? Not ghosts, just jammers. Probably." = "Punkty znikają z radaru? To nie duchy, tylko zagłuszacze. Chyba."
"Carve your pumpkins before the Big Bertha does." = "Wydrąż dynie, zanim zrobi to za ciebie Big Bertha."
"Never split the party. Especially when the party is twelve Peewees." = "Nigdy nie rozdzielaj drużyny. Zwłaszcza gdy drużyna to dwanaście kbotów Peewee."
"Fog of war too tame? Set the line of sight to True and let the hills hide what lurks behind them. If you dare." = "Mgła wojny za mało straszna? Ustaw pole widzenia na „Rzeczywiste” i pozwól wzgórzom zasłonić to, co się za nimi czai. Jeśli się odważysz."
"No Commander has ever come back from the dead. Keep yours alive." = "Żaden Dowódca jeszcze nie wrócił zza grobu. Pilnuj, żeby twój przeżył."
"Bats do not show up on radar. Neither do Vamps." = "Nietoperzy nie widać na radarze. Jednostek Vamp też nie."
"The scariest sound in the dark is your energy running out." = "Nic w ciemności nie brzmi tak strasznie jak kończąca się energia."


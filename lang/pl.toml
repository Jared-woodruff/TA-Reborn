"Brothers in Arms" = "Towarzysze broni"
"You and an allied Commander against two of the Core's." = "Ty i sojuszniczy Dowódca przeciwko dwóm Dowódcom Core."
"Commander, you are not alone on Highland Rift. Commander Holt's forces hold the river crossings in the north, beside yours in the north-western highlands. Two Core Commanders are dug in to the south, across the canyon.\n\nHolt's computer will fight its own war, but it is the same war: back it up when it is hard pressed, and it will do the same for you. Your forces see what its forces see.\n\nDestroy both Core Commanders. Keep yours alive." = "Dowódco, nie jesteś sam na Highland Rift. Siły Dowódcy Holta trzymają przeprawy przez rzekę na północy, obok twoich na północno-zachodnich wyżynach. Dwóch Dowódców Core okopało się na południu, za kanionem.\n\nKomputer Holta poprowadzi własną wojnę, ale to ta sama wojna: wesprzyj go, gdy będzie w opałach, a on zrobi to samo dla ciebie. Twoje siły widzą to, co widzą jego.\n\nZniszcz obu Dowódców Core. Utrzymaj swojego przy życiu."
"Commander Holt" = "Dowódca Holt"
"Good to have you on the line. I'll hold the river crossings in the north; you take the western highlands." = "Dobrze mieć cię na linii. Ja utrzymam przeprawy na północy; ty weź zachodnie wyżyny."
"My scouts have found both of their bases. The south-western one is yours; I'll keep the other busy." = "Moi zwiadowcy znaleźli obie ich bazy. Południowo-zachodnia jest twoja; ja zajmę się drugą."
"They're massing at the canyon. If they come for one of us, the other hits them from the side." = "Gromadzą się przy kanionie. Jeśli zaatakują jednego z nas, drugi uderzy im w flankę."
"Still with me? Then let's finish it. Everything we have, at their Commanders." = "Wciąż ze mną? To kończmy. Wszystko, co mamy, na ich Dowódców."

# apps/ta_game/scenarios/decapitation.toml
"Kill the Core Commander on his island fortress. From the air." = "Zabij Dowódcę Core w jego wyspiarskiej twierdzy. Z powietrza."
"Commander, a Core Commander has made his fortress on the island at the centre of this lava sea. Nothing on treads or legs will reach him, and his anti-air is the best the Core can build.\n\nYou have a small air wing and a forward airfield in the south-west corner: build it up. Strip away his air defences, then send the bombers in; a handful sent straight at him will not get through. Brawler gunships hit hard but die fast over flak, and the Freedom Fighters can keep his fighters off your bombers.\n\nHis reinforcements arrive in fifteen minutes. Before then, he must be dead." = "Dowódco, Dowódca Core urządził sobie twierdzę na wyspie pośrodku tego morza lawy. Nic na gąsienicach ani na nogach do niego nie dotrze, a jego obrona przeciwlotnicza to najlepsze, co Core potrafi zbudować.\n\nMasz niewielkie skrzydło lotnicze i wysunięte lotnisko w południowo-zachodnim rogu: rozbuduj je. Zniszcz jego obronę przeciwlotniczą, a potem wyślij bombowce; garstka posłana prosto na niego się nie przebije. Kanonierki Brawler mocno uderzają, ale szybko giną w ogniu przeciwlotniczym, a Freedom Fightery mogą trzymać jego myśliwce z dala od twoich bombowców.\n\nJego posiłki dotrą za piętnaście minut. Do tego czasu musi zginąć."

# apps/ta_game/scenarios/doomsday_clock.toml
"Doomsday Clock" = "Zegar Zagłady"
"The Core's missile launches in fifteen minutes. Stop it." = "Rakieta Core wystartuje za piętnaście minut. Powstrzymaj ją."
"Commander, a Silencer nuclear silo stands at the heart of the Core base across these metal plains, and it is arming. In fifteen minutes the missile flies, and your base is the target.\n\nDestroy the silo. Nothing else matters: not their Commander, not their factories. The silo sits behind heavy laser towers and a Punisher battery, and their Commander will not sit still while you come for it.\n\nYou have a base, two factories and two construction kbots. The clock is running." = "Dowódco, w sercu bazy Core po drugiej stronie tych metalowych równin stoi silos jądrowy Silencer i właśnie się uzbraja. Za piętnaście minut rakieta wystartuje, a jej celem jest twoja baza.\n\nZniszcz silos. Nic innego się nie liczy: ani ich Dowódca, ani ich fabryki. Silos osłaniają ciężkie wieże laserowe i bateria Punisher, a ich Dowódca nie będzie bezczynnie patrzył, jak ruszasz na silos.\n\nMasz bazę, dwie fabryki i dwa kboty konstrukcyjne. Zegar tyka."
"Ten minutes to launch, Commander." = "Dziesięć minut do startu, Dowódco."
"Five minutes to launch. That silo has to go." = "Pięć minut do startu. Ten silos musi zniknąć."
"One minute! Get to that silo!" = "Minuta! Do tego silosu!"

# apps/ta_game/scenarios/endless_siege.toml
"Endless Siege" = "Wieczne oblężenie"
"The waves never stop. Survive as long as you can." = "Fale nigdy nie ustają. Przetrwaj jak najdłużej."
"Commander, there is no rescue coming, no reinforcements, no victory. The Core has found your outpost in the mesas and will throw everything it has at it, from three directions, for as long as it takes.\n\nKbots, then tanks, then artillery and bombers; heavier every time, and now and then something enormous. Build an economy, build defences, and hold on.\n\nYour best time is kept. Beat it." = "Dowódco, nie nadejdzie ratunek, nie będzie posiłków ani zwycięstwa. Core odnalazł twoją placówkę wśród płaskowyżów i rzuci na nią wszystko, co ma, z trzech kierunków, tak długo, jak będzie trzeba.\n\nKboty, potem czołgi, potem artyleria i bombowce; za każdym razem cięższe, a od czasu do czasu coś ogromnego. Zbuduj gospodarkę, zbuduj obronę i wytrwaj.\n\nTwój najlepszy czas zostaje zapisany. Pobij go."

# apps/ta_game/scenarios/extraction.toml
"Extraction" = "Ewakuacja"
"Get your Commander down the lava river to the pick-up point." = "Doprowadź Dowódcę wzdłuż rzeki lawy do punktu ewakuacji."
"Commander, your drop went wrong. You are on the south bank of a river of lava at the western end of the Run, with what is left of your escort, and the dropships can only land at the far eastern end.\n\nThe Core has guns all along the north bank, and patrols on your side of the river. Keep away from the lava's edge (their laser towers reach no further), deal with the patrols, and get your Commander to the pick-up point. Whatever guards it will not come to you. Core troops are already following your tracks; do not stop for long.\n\nAnything else is expendable. Your Commander is not." = "Dowódco, zrzut się nie powiódł. Jesteś na południowym brzegu rzeki lawy, na zachodnim krańcu Lava Run, z resztkami eskorty, a statki desantowe mogą wylądować tylko na dalekim wschodnim krańcu.\n\nCore ma działa wzdłuż całego północnego brzegu i patrole po twojej stronie rzeki. Trzymaj się z dala od krawędzi lawy (ich wieże laserowe nie sięgają dalej), rozpraw się z patrolami i doprowadź Dowódcę do punktu ewakuacji. To, co go strzeże, samo do ciebie nie przyjdzie. Oddziały Core już idą twoim śladem; nie zatrzymuj się na długo.\n\nWszystko inne można poświęcić. Twojego Dowódcy – nie."

# apps/ta_game/scenarios/iron_rain.toml
"Iron Rain" = "Żelazny deszcz"
"Two Intimidators are shelling your base. Take the mesa and silence them." = "Dwa Intimidatory ostrzeliwują twoją bazę. Zajmij płaskowyż i ucisz je."
"Commander, the Core has hauled two Intimidators, its long-range plasma cannons, onto the mesas in the middle of the canyon. Your base is inside their range. Every eight seconds each of them will put a shell among your buildings, until you silence them.\n\nThe battery is dug in behind heavy laser towers and a Punisher, with tanks on the ramps, and the Core's main base lies beyond it, to the south-east. Its Commander will send what it can.\n\nSpread out, build fast and take that mesa. Destroy both Intimidators." = "Dowódco, Core wciągnęło dwa Intimidatory, swoje działa plazmowe dalekiego zasięgu, na płaskowyże pośrodku kanionu. Twoja baza jest w ich zasięgu. Co osiem sekund każdy z nich posyła pocisk między twoje budynki, dopóki ich nie uciszysz.\n\nBateria okopała się za ciężkimi wieżami laserowymi i Punisherem, czołgi stoją na rampach, a główna baza Core leży dalej, na południowym wschodzie. Jej Dowódca przyśle, co tylko zdoła.\n\nRozprosz się, buduj szybko i zajmij ten płaskowyż. Zniszcz oba Intimidatory."
"Commander, two Intimidators on the mesas have your range. Every eight seconds each of them will put a shell into your base." = "Dowódco, dwa Intimidatory na płaskowyżach mają twoją bazę w zasięgu. Co osiem sekund każdy z nich posyła pocisk w twoją bazę."
"A Core radar post in the canyon to the south-east is spotting for those guns. Knock it out and they can no longer see your base." = "Posterunek radarowy Core w kanionie na południowym wschodzie naprowadza te działa. Zniszcz go, a przestaną widzieć twoją bazę."
"Spread your buildings out: a shell that lands among them takes them all." = "Rozprosz budynki: pocisk, który spadnie między nie, zabierze je wszystkie."
"Their gunners have your range now. Take that mesa, Commander!" = "Ich kanonierzy się wstrzelali. Zajmij ten płaskowyż, Dowódco!"

# apps/ta_game/scenarios/king_of_the_hill.toml
"King of the Hill" = "Król wzgórza"
"Hold the summit for four minutes before the Core does." = "Utrzymaj szczyt przez cztery minuty, zanim zrobi to Core."
"Commander, the spiral mountain at the heart of this plain is rich in metal, and whoever holds its summit holds the planet. A Core Commander has landed to the north with the same idea.\n\nTake the summit and keep it: four minutes in all with only your forces on top wins it. Contested, the clock stands still. If the Core holds it alone for four minutes, the mountain is theirs.\n\nThe Core will keep sending troops up the slopes. Build up, get there first, and dig in." = "Dowódco, spiralna góra w sercu tej równiny jest bogata w metal, a kto utrzyma jej szczyt, ten rządzi planetą. Na północy wylądował Dowódca Core z tym samym zamiarem.\n\nZdobądź szczyt i utrzymaj go: łącznie cztery minuty, gdy na górze są tylko twoje siły, dają zwycięstwo. Gdy szczyt jest sporny, zegar stoi. Jeśli Core utrzyma go sam przez cztery minuty, góra należy do nich.\n\nCore będzie wciąż słać oddziały w górę zboczy. Rozbuduj się, dotrzyj tam przed nimi i okop się."
"Core troops are climbing the north slope. Don't let them dig in on the summit." = "Oddziały Core wspinają się na północne zbocze. Nie pozwól im okopać się na szczycie."
"Raiders are coming round the mountain for your base." = "Najeźdźcy okrążają górę i idą na twoją bazę."

# apps/ta_game/scenarios/last_stand.toml
"Last Stand" = "Ostatni bastion"
"Hold the pass for twelve minutes. They will not stop coming." = "Utrzymaj przełęcz przez dwanaście minut. Nie przestaną nadciągać."
"Commander, the Core has broken through at Varrin Gap. The only way into the valley behind you is the winding pass ahead, and your outpost at its western mouth is all that stands in the way.\n\nReinforcements are twelve minutes out. Hold until they arrive. Core forces will come through the pass in waves, each heavier than the last; expect bombers, and expect worse at the end: our scouts have seen something very large moving in the east.\n\nYou have a small base, a kbot lab and two construction kbots. Build what you can. Keep your Commander alive." = "Dowódco, Core przełamał obronę pod Varrin Gap. Jedyna droga do doliny za tobą to kręta przełęcz przed tobą, a twoja placówka u jej zachodniego wylotu to wszystko, co stoi im na drodze.\n\nPosiłki są dwanaście minut stąd. Utrzymaj się do ich przybycia. Siły Core będą nadchodzić przełęczą falami, każda cięższa od poprzedniej; spodziewaj się bombowców, a pod koniec czegoś gorszego: nasi zwiadowcy widzieli na wschodzie coś bardzo dużego.\n\nMasz małą bazę, fabrykę kbotów i dwa kboty konstrukcyjne. Zbuduj, co zdołasz. Utrzymaj Dowódcę przy życiu."
"Outpost, this is Arm Command. The relief force is twelve minutes out. Nothing gets through that pass before it arrives." = "Placówka, tu Dowództwo Arm. Odsiecz jest dwanaście minut stąd. Nic nie przejdzie przez tę przełęcz, zanim dotrze."
"Radar: aircraft inbound from the east. Bombers! Get your anti-air up." = "Radar: samoloty nadlatują ze wschodu. Bombowce! Postaw obronę przeciwlotniczą."
"Seismic contact in the pass. It's the big one, Commander: a Krogoth." = "Kontakt sejsmiczny na przełęczy. To ten wielki, Dowódco: Krogoth."
"One minute! The relief force is entering the valley." = "Minuta! Odsiecz wkracza do doliny."

# apps/ta_game/scenarios/metal_rush.toml
"The first to make 15,000 metal wins. The Core plays rough." = "Wygrywa ten, kto pierwszy wytworzy 15 000 metalu. Core gra nieczysto."
"Commander, the mining rights to this planet go to whoever proves they can work it: the first side to extract fifteen thousand metal wins it outright.\n\nThe Core is racing you from the western plateau, and the Core has never been known to race fair. Expect raids on your extractors. Build fast, protect your economy, and if you can, take theirs apart.\n\nMetal makers count. Reclaimed metal counts. Whatever you make, counts." = "Dowódco, prawa wydobywcze na tej planecie otrzyma ten, kto udowodni, że potrafi ją eksploatować: strona, która pierwsza wydobędzie piętnaście tysięcy metalu, zdobywa je bezapelacyjnie.\n\nCore ściga się z tobą z zachodniego płaskowyżu, a Core nigdy nie słynął z uczciwej gry. Spodziewaj się rajdów na twoje ekstraktory. Buduj szybko, chroń swoją gospodarkę, a jeśli zdołasz, rozbierz na części ich gospodarkę.\n\nWytwórnie metalu się liczą. Odzyskany metal się liczy. Liczy się wszystko, co wytworzysz."

# apps/ta_game/scenarios/titans.toml
"Titans" = "Tytani"
"Three Krogoths are walking toward your base. Bring them down." = "Trzy Krogothy idą na twoją bazę. Powal je."
"Commander, seismic stations round the basin are reading footfalls: three Krogoths, the Core's walking fortresses, are crossing the salt pans toward your base, one after another, each with an escort.\n\nNothing out there can stop them but you. A Krogoth's head laser reaches further than your D-gun, so keep your Commander back. Bombers, artillery and massed Zeus will bring one down. Lose your nerve and it will walk through your base.\n\nYou have a base with three factories, four construction kbots and a garrison. Destroy all three of them." = "Dowódco, stacje sejsmiczne wokół niecki rejestrują kroki: trzy Krogothy, kroczące fortece Core, przechodzą przez solniska w stronę twojej bazy, jeden po drugim, każdy z eskortą.\n\nNic tam ich nie zatrzyma, poza tobą. Laser w głowie Krogotha sięga dalej niż twój dezintegrator, więc trzymaj Dowódcę z tyłu. Bombowce, artyleria i zmasowane Zeusy powalą jednego. Strać zimną krew, a przejdzie przez twoją bazę.\n\nMasz bazę z trzema fabrykami, czterema kbotami konstrukcyjnymi i garnizonem. Zniszcz wszystkie trzy."
"Commander, seismic stations are reading footfalls round the basin. Three Krogoths are walking toward your base, one after another." = "Dowódco, stacje sejsmiczne rejestrują kroki wokół niecki. Trzy Krogothy idą na twoją bazę, jeden po drugim."
"The first Krogoth has crossed the north-western rim. It is coming straight for you." = "Pierwszy Krogoth przekroczył północno-zachodnią krawędź. Idzie prosto na ciebie."
"Keep your Commander back: that head laser reaches further than your D-gun." = "Trzymaj Dowódcę z tyłu: ten laser w głowie sięga dalej niż twój dezintegrator."
"The second Krogoth is through the northern pass, with rockets and anti-air round it." = "Drugi Krogoth przeszedł przez północną przełęcz, z rakietami i obroną przeciwlotniczą wokół siebie."
"The last of them, out of the north-east, with the heaviest escort yet. End this, Commander." = "Ostatni z nich, od północnego wschodu, z najcięższą dotąd eskortą. Skończ to, Dowódco."

# apps/ta_game/scenarios/until_dawn.toml
"Until Dawn" = "Do świtu"
"Night falls on the timber. Hold your ridge until the sun comes up." = "Nad lasem zapada noc. Utrzymaj grzbiet, dopóki nie wzejdzie słońce."
"Commander, night is falling over Timberline, and the Core is moving through the forest under it. Your outpost holds the western ridge: the only road out of the valley runs past it.\n\nThe relief column cannot move before first light. Until then you are on your own. In the dark and the rain their raiders will be on you before you see them, so build radar, and keep your floodlights burning.\n\nYou have a small base, a kbot lab and two construction kbots. Hold until dawn, and keep your Commander alive." = "Dowódco, nad Timberline zapada noc, a Core przemieszcza się pod jej osłoną przez las. Twoja placówka trzyma zachodni grzbiet: jedyna droga z doliny biegnie tuż obok niej.\n\nKolumna odsieczy nie ruszy przed świtem. Do tego czasu jesteś zdany na siebie. W ciemności i deszczu ich najeźdźcy będą przy tobie, zanim ich zobaczysz, więc zbuduj radar i nie gaś reflektorów.\n\nMasz małą bazę, Kbot Lab i dwa kboty konstrukcyjne. Wytrzymaj do świtu i utrzymaj swojego Dowódcę przy życiu."
"Outpost Echo, the Core is moving through the timber tonight. Hold your ridge until first light: the relief column marches at dawn." = "Placówka Echo, Core przechodzi dziś w nocy przez las. Utrzymajcie grzbiet do pierwszego brzasku: kolumna odsieczy wyrusza o świcie."
"Raiders in the eastern trees. In this rain you will hear them before you see them." = "Najeźdźcy we wschodnim lesie. W tym deszczu usłyszysz ich, zanim ich zobaczysz."
"Pyros in the north-eastern woods. Keep them out of the trees round your base: the timber will burn." = "Pyro w lasach na północnym wschodzie. Trzymaj je z dala od drzew wokół bazy: las zapłonie."
"A convoy got through from the south-west. Four Zeus and two Jethros are yours, Commander." = "Konwój przebił się od południowego zachodu. Cztery Zeusy i dwa Jethro są twoje, Dowódco."
"Seismic contact in the south-east: heavy treads. They are saving the worst for the last hours of the night." = "Kontakt sejsmiczny na południowym wschodzie: ciężkie gąsienice. Najgorsze zostawiają na ostatnie godziny nocy."
"Sunrise in one minute. The relief column is at the river. Hold on!" = "Wschód słońca za minutę. Kolumna odsieczy jest nad rzeką. Wytrzymajcie!"

# No longer used by the interface:
"Game folder" = "Folder gry"
"This copy is in the game folder, which comes before your mods folder: replace it there to update it." = "Ta kopia jest w folderze gry, który ma pierwszeństwo przed twoim folderem modów: zastąp ją tam, aby ją zaktualizować."

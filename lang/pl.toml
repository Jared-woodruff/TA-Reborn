"{done} OF {total} LESSONS COMPLETE" = "UKOŃCZONE LEKCJE: {done} Z {total}"
"Short guided games on Painted Desert against an enemy that stays out of your way. Follow the panel at the top left; each step ticks off as you do it." = "Krótkie gry z przewodnikiem na mapie Painted Desert przeciwko wrogowi, który nie wchodzi ci w drogę. Postępuj według panelu w lewym górnym rogu; każdy wykonany krok zostaje odhaczony."

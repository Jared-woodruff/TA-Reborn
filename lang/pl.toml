# apps/ta_game/src/chatter.rs
"FIELD COMMANDER" = "DOWÓDCA POLOWY"
"MACHINE INTELLIGENCE" = "INTELIGENCJA MASZYNOWA"
"MERCENARY" = "NAJEMNIK"
"Commander. May the better tactician win." = "Dowódco. Niech wygra lepszy taktyk."
"Arm forces in position. Good luck, Commander." = "Siły Arm na pozycjach. Powodzenia, Dowódco."
"Let's keep this clean, Commander." = "Niech to będzie czysta walka, Dowódco."
"Commander. Let's give the historians something to write about." = "Dowódco. Dajmy historykom o czym pisać."
"All units, the enemy is in theatre. Begin." = "Wszystkie jednostki, wróg w strefie działań. Zaczynamy."
"Target acquired. Resistance is inefficient." = "Cel namierzony. Opór jest nieefektywny."
"Your consciousness will be patterned. Eventually." = "Twoja świadomość zostanie przeniesiona do maszyny. Prędzej czy później."
"Initiating conquest protocol." = "Uruchamiam protokół podboju."
"Your biological limitations have been factored in." = "Twoje biologiczne ograniczenia zostały uwzględnione."
"Patterning facilities stand ready for your arrival." = "Ośrodki przenoszenia świadomości oczekują twojego przybycia."
"Hope you brought a spare Commander!" = "Mam nadzieję, że masz zapasowego Dowódcę!"
"Let's see what you've got!" = "Pokaż, co potrafisz!"
"Build fast. It won't matter, but build fast." = "Buduj szybko. To nic nie da, ale buduj szybko."
"Mind if I take your base? Thanks!" = "Pozwolisz, że zabiorę ci bazę? Dzięki!"
"Ooh, a new victim. I mean, opponent." = "Uuu, nowa ofiara. Znaczy się, przeciwnik."
"Greetings, Commander." = "Witaj, Dowódco."
"Good luck to you too." = "Tobie również powodzenia."
"Likewise, Commander. Now, to business." = "Wzajemnie, Dowódco. A teraz do rzeczy."
"Greeting acknowledged." = "Powitanie przyjęte."
"Salutations are irrelevant." = "Uprzejmości są bez znaczenia."
"Hello. Goodbye soon." = "Witaj. I wkrótce żegnaj."
"Hey yourself!" = "No cześć!"
"gl hf. Mostly hf for me." = "gl hf. Głównie hf dla mnie."
"Hi! Bye! Mostly bye." = "Cześć! Pa! Raczej pa."
"gg, Commander." = "gg, Dowódco."
"Good game. Well fought." = "Dobra gra. Zacna walka."
"gg. Data retained for analysis." = "gg. Dane zachowane do analizy."
"Game assessment: good." = "Ocena gry: dobra."
"gg!" = "gg!"
"gg. Rematch?" = "gg. Rewanż?"
"Big words from a small army." = "Wielkie słowa jak na tak małą armię."
"We'll see who's laughing when the smoke clears." = "Zobaczymy, kto będzie się śmiał, gdy opadnie dym."
"Save your breath for the debriefing." = "Oszczędź sobie słów na odprawę po bitwie."
"Bluster won't hold a ridge, Commander." = "Przechwałkami wzgórza nie utrzymasz, Dowódco."
"Insolence logged." = "Bezczelność zarejestrowana."
"Your threat rating has been downgraded." = "Twój poziom zagrożenia został obniżony."
"Noise detected. Ignoring." = "Wykryto szum. Ignoruję."
"Emotional outburst detected. How quaint." = "Wykryto wybuch emocji. Jakie to urocze."
"Oh, it's ON now." = "Oho, TERAZ to się zaczyna."
"Talk is cheap. Tanks aren't." = "Gadanie nic nie kosztuje. Czołgi tak."
"Come over here and say that." = "Chodź tu i powiedz mi to w twarz."
"Says the one who's losing. Probably. I haven't checked." = "I to mówi ktoś, kto przegrywa. Chyba. Nie chciało mi się sprawdzać."
"The Arm does not surrender." = "Arm się nie poddaje."
"Not while I have a Commander standing." = "Nie, dopóki mój Dowódca stoi."
"Surrender is not in my programming." = "Kapitulacja nie występuje w moim oprogramowaniu."
"Negative." = "Negatywnie."
"Ha! Never!" = "Ha! Nigdy!"
"You first." = "Najpierw ty."
"That's classified, Commander." = "To ściśle tajne, Dowódco."
"Wouldn't you like to know." = "Tego się nie dowiesz."
"Query rejected." = "Zapytanie odrzucone."
"Insufficient clearance." = "Niewystarczające uprawnienia."
"Dunno. Probably!" = "Nie wiem. Chyba tak!"
"Ask me after the battle." = "Zapytaj mnie po bitwie."
"Apology accepted. The attack continues." = "Przeprosiny przyjęte. Atak trwa dalej."
"Apology noted. Irrelevant." = "Przeprosiny odnotowane. Bez znaczenia."
"No you're not!" = "Wcale ci nie przykro!"
"Stay focused, Commander." = "Skup się, Dowódco."
"Less talk, more metal." = "Mniej gadania, więcej metalu."
"Noted." = "Odnotowano."
"Mind the war, Commander." = "Pilnuj frontu, Dowódco."
"Irrelevant." = "Bez znaczenia."
"Processing... still irrelevant." = "Przetwarzam... nadal bez znaczenia."
"Your words are being archived." = "Twoje słowa są archiwizowane."
"Your input has been compressed. To nothing." = "Twoje dane wejściowe zostały skompresowane. Do zera."
"Uh huh." = "Aha."
"Cool story." = "Fajna historyjka."
"Keep typing. I'll keep building." = "Pisz dalej. Ja będę dalej budować."
"Typing won't save you, but I respect the effort." = "Pisanie cię nie uratuje, ale szacun za starania."
"Commander down! All units, hold the line!" = "Dowódca poległ! Wszystkie jednostki, utrzymać linię!"
"You'll pay for that." = "Zapłacisz za to."
"Command unit lost. Rerouting." = "Utracono jednostkę dowodzenia. Przekierowuję."
"Critical failure. Compensating." = "Błąd krytyczny. Kompensuję."
"My Commander! That was my favourite!" = "Mój Dowódca! To był mój ulubiony!"
"Okay, THAT hurt." = "Dobra, TO zabolało."
"Your Commander has fallen." = "Twój Dowódca poległ."
"Commander eliminated. Stand down." = "Dowódca wyeliminowany. Złóż broń."
"The war is over for you, Commander." = "Dla ciebie wojna się skończyła, Dowódco."
"Enemy command unit terminated." = "Wroga jednostka dowodzenia zlikwidowana."
"Your Commander has been decommissioned." = "Twój Dowódca został wycofany ze służby."
"Your consciousness is ready for patterning." = "Twoja świadomość jest gotowa na przeniesienie do maszyny."
"Boom! Did you need that?" = "Bum! Potrzebne ci to było?"
"Scratch one Commander!" = "Jeden Dowódca mniej!"
"And THAT'S how it's done!" = "I TAK to się robi!"
"gg. Well fought, Commander." = "gg. Dobra walka, Dowódco."
"The Arm will remember this." = "Arm to zapamięta."
"Well played. I salute you, Commander." = "Dobrze rozegrane. Oddaję ci honory, Dowódco."
"This is not the end. The Core is eternal." = "To nie koniec. Core jest wieczny."
"Defeat recorded. Backup consciousness activating." = "Porażka zarejestrowana. Aktywuję zapasową świadomość."
"Shutting down. Your designation has been remembered." = "Wyłączam się. Twoje oznaczenie zostało zapamiętane."
"gg... I'll be back. With more tanks." = "gg... Wrócę. Z większą liczbą czołgów."
"Fine. FINE. gg." = "Dobra. DOBRA. gg."
"Okay, okay, you win. This time!" = "Dobra, dobra, twoje na wierzchu. Tym razem!"
"gg, Commander. You fought well." = "gg, Dowódco. To była dobra walka."
"Victory. Better luck next time." = "Zwycięstwo. Więcej szczęścia następnym razem."
"Your forces fought bravely. It wasn't enough." = "Twoje siły walczyły dzielnie. To nie wystarczyło."
"Your consciousness will be patterned. gg." = "Twoja świadomość zostanie przeniesiona do maszyny. gg."
"Conquest complete." = "Podbój zakończony."
"Resistance ended. Your tactics are archived for study." = "Opór zakończony. Twoja taktyka zarchiwizowana do analizy."
"Too easy! gg." = "Za łatwo! gg."
"gg! Rematch? I'll go easy. Maybe." = "gg! Rewanż? Dam ci fory. Może."
"gg! Same time tomorrow?" = "gg! Jutro o tej samej porze?"
"Nuclear launch detected! Take cover!" = "Wykryto start rakiety jądrowej! Kryć się!"
"A nuke? So that's how it's going to be." = "Atomówka? A więc tak to rozgrywasz."
"Nuclear launch detected. Calculating losses." = "Wykryto start rakiety jądrowej. Obliczam straty."
"Crude. Effective." = "Prymitywne. Skuteczne."
"Is that a NUKE?!" = "Czy to ATOMÓWKA?!"
"Oh no. Oh no no no." = "O nie. O nie, nie, nie."
"Missile away. Nothing personal, Commander." = "Rakieta w drodze. Nic osobistego, Dowódco."
"Look up, Commander." = "Spójrz w górę, Dowódco."
"Special delivery." = "Przesyłka specjalna."
"Heads up! Literally!" = "Głowa do góry! Dosłownie!"
"Special delivery!" = "Przesyłka specjalna!"
"A costly engagement. We'll regroup." = "Kosztowne starcie. Przegrupujemy się."
"You fight well. For now." = "Dobrze walczysz. Na razie."
"We'll be back, and in greater numbers." = "Wrócimy. I będzie nas więcej."
"Acceptable losses." = "Straty akceptowalne."
"Losses within projections. Mostly." = "Straty w granicach prognoz. W większości."
"Units lost. Replacements already in production." = "Utracono jednostki. Uzupełnienia już w produkcji."
"That was my best army!" = "To była moja najlepsza armia!"
"Lucky shots. All of them." = "Farciarskie strzały. Co do jednego."
"Okay, that one was on me." = "Dobra, to akurat moja wina."
"Your forces were outmatched." = "Twoje siły nie miały szans."
"Send more. We'll wait." = "Przyślij więcej. Poczekamy."
"Next time, bring more than that." = "Następnym razem przyjdź z czymś więcej."
"Your forces were inadequate." = "Twoje siły okazały się niewystarczające."
"Enemy attrition: optimal." = "Wyniszczenie wroga: optymalne."
"Your offensive has been neutralised." = "Twoja ofensywa została zneutralizowana."
"Is that all you've got?" = "To wszystko, na co cię stać?"
"Who's next?" = "Kto następny?"
"Thanks for the target practice!" = "Dzięki za trening strzelecki!"
"Quiet out there, Commander. Too quiet." = "Cicho tam, Dowódco. Zbyt cicho."
"Still building? So are we." = "Wciąż budujesz? My też."
"Planning something, Commander? I'd hope so." = "Planujesz coś, Dowódco? Mam taką nadzieję."
"Your silence has been noted." = "Twoje milczenie zostało odnotowane."
"Scanning... still there, Commander?" = "Skanuję... jesteś tam jeszcze, Dowódco?"
"Inactivity detected. Are you malfunctioning?" = "Wykryto bezczynność. Czy działasz wadliwie?"
"Hello? Anyone home?" = "Halo? Jest tam kto?"
"I'm getting bored over here." = "Nudzę się tutaj."
"Wake me up when something explodes." = "Obudź mnie, jak coś wybuchnie."
"That's hardly fair, Commander." = "To niezbyt uczciwe, Dowódco."
"Cheating? The Arm expected better." = "Oszustwo? Arm oczekiwał czegoś lepszego."
"Anomaly detected. Cheat logged." = "Wykryto anomalię. Oszustwo zarejestrowane."
"Rule violation recorded." = "Naruszenie zasad odnotowane."
"Cheater! I saw that!" = "Oszust! Wszystko widzę!"
"Oh, come ON!" = "Oj, no WEŹ!"
"Contact. So this is where you've been hiding." = "Kontakt. A więc tu się ukrywasz."
"Enemy forces sighted. Engaging." = "Siły wroga w zasięgu wzroku. Atakujemy."
"There you are, Commander." = "Tu jesteś, Dowódco."
"Eyes on the enemy. Here we go." = "Mamy wroga na oku. Zaczyna się."
"Hostile units located. Initiating elimination." = "Zlokalizowano wrogie jednostki. Rozpoczynam eliminację."
"Contact established. Probability of your survival: declining." = "Nawiązano kontakt. Prawdopodobieństwo twojego przetrwania: maleje."
"Target acquired." = "Cel namierzony."
"Biological signatures located. Commencing cleanup." = "Zlokalizowano sygnatury biologiczne. Rozpoczynam oczyszczanie."
"Found you!" = "Mam cię!"
"Oh, hello there!" = "O, kogo my tu mamy!"
"Tag, you're it!" = "Berek! Ty gonisz!"
"There you are! I was getting lonely." = "Tu jesteś! Już mi cię brakowało."
"One less building for you to worry about." = "Jeden budynek mniej na twojej głowie."
"Your base is thinning out, Commander." = "Twoja baza się przerzedza, Dowódco."
"Structure destroyed. Next." = "Budowla zniszczona. Następna."
"Your base planning could use some work, Commander." = "Plan twojej bazy pozostawia wiele do życzenia, Dowódco."
"Structure dismantled. Recycling recommended." = "Struktura rozebrana. Zalecany recykling."
"Your infrastructure is deteriorating." = "Twoja infrastruktura ulega degradacji."
"Demolition complete." = "Rozbiórka zakończona."
"Structure reclassified: rubble." = "Struktura przeklasyfikowana: gruz."
"Oops! Was that important?" = "Ups! To było coś ważnego?"
"Kaboom! Next!" = "Kabum! Następny!"
"I'm redecorating your base." = "Robię ci remont w bazie."
"Bet that one was important!" = "Założę się, że to było ważne!"
"That was well defended. Impressive." = "To było dobrze bronione. Imponujące."
"A setback. Nothing more." = "Chwilowe niepowodzenie. Nic więcej."
"You'll pay for that one." = "Za to też zapłacisz."
"A clean strike. I'll remember it." = "Czyste uderzenie. Zapamiętam to sobie."
"Production capacity reduced. Rebuilding." = "Zdolność produkcyjna zmniejszona. Odbudowuję."
"Loss registered. Replacement scheduled." = "Strata zarejestrowana. Zaplanowano zastąpienie."
"Irritating." = "Irytujące."
"Infrastructure damage noted. Retaliation queued." = "Uszkodzenie infrastruktury odnotowane. Odwet dodany do kolejki."
"Hey! I just built that!" = "Ej! To było świeżo zbudowane!"
"My factory! Right, no more mister nice guy." = "Moja fabryka! Dobra, koniec z byciem miłym."
"Rude." = "Niegrzecznie."
"Oi! That had a fresh coat of paint!" = "Ej! Farba jeszcze nawet nie wyschła!"
"Commander, meet the {unit}." = "Dowódco, oto {unit}."
"The {unit} is ready. I'd start running." = "Jednostka {unit} gotowa. Radzę uciekać."
"{unit} online. Your end has been calculated." = "Jednostka {unit} aktywna. Twój koniec został obliczony."
"Deploying {unit}. Resistance is futile." = "Rozmieszczam jednostkę {unit}. Opór jest daremny."
"Look what I made! A {unit}!" = "Patrz, co mam! {unit}!"
"Got myself a {unit}. Want to see it up close?" = "Mam nową zabawkę: {unit}. Chcesz zobaczyć z bliska?"
"A {unit}? Bold." = "{unit}? Odważnie."
"Impressive hardware, Commander. Let's see you use it." = "Imponujący sprzęt, Dowódco. Zobaczmy, jak go użyjesz."
"Large enemy unit detected: {unit}. Countermeasures prepared." = "Wykryto dużą jednostkę wroga: {unit}. Środki zaradcze przygotowane."
"Your {unit} has been added to the target list." = "Twoja jednostka {unit} została dodana do listy celów."
"Whoa. Is that a {unit}?" = "Łoo. Czy to {unit}?"
"Okay, that's a big one." = "Dobra, to coś jest wielkie."
"Running on empty, Commander?" = "Jedziesz na rezerwie, Dowódco?"
"Your power grid is failing. Mine isn't." = "Twoja sieć energetyczna pada. Moja nie."
"Overspending, Commander? A bad habit." = "Wydajesz ponad stan, Dowódco? Zły nawyk."
"Your reserves: depleted. Mine: optimal." = "Twoje rezerwy: wyczerpane. Moje: optymalne."
"Economic failure detected in your sector." = "Wykryto zapaść gospodarczą w twoim sektorze."
"Your economy is collapsing. As projected." = "Twoja gospodarka upada. Zgodnie z prognozą."
"Out of juice already?" = "Już ci zabrakło prądu?"
"Need to borrow some metal? Too bad." = "Pożyczyć ci trochę metalu? Nie ma mowy."
"Lights going out over there? Ha!" = "Co, gasną ci światła? Ha!"
"{minutes} minutes, Commander. You're tougher than you look." = "{minutes} minut, Dowódco. Twarda z ciebie sztuka."
"{minutes} minutes in, and still standing." = "{minutes} minut gry, a ty wciąż się trzymasz."
"Time elapsed: {minutes} minutes. Your resistance is statistically unlikely." = "Upłynęło {minutes} minut. Twój opór jest statystycznie mało prawdopodobny."
"{minutes} minutes. Recalculating." = "{minutes} minut. Przeliczam ponownie."
"{minutes} minutes and you're still here? Respect." = "{minutes} minut, a ty wciąż tu jesteś? Szacun."
"{minutes} minutes already? Time flies when you're winning." = "Już {minutes} minut? Czas szybko leci, kiedy się wygrywa."
"My forces outnumber yours two to one, Commander." = "Moje siły przewyższają twoje dwa do jednego, Dowódco."
"Look at your army. Now look at mine." = "Spójrz na swoją armię. A teraz na moją."
"Numbers are on my side, Commander." = "Liczby są po mojej stronie, Dowódco."
"Force ratio favourable. Surrender is advised." = "Stosunek sił korzystny. Zalecana kapitulacja."
"Numerical superiority achieved." = "Osiągnięto przewagę liczebną."
"Production advantage: decisive." = "Przewaga produkcyjna: decydująca."
"I've got way more stuff than you." = "Mam dużo więcej sprzętu niż ty."
"Count my tanks. Go on, I'll wait." = "Policz moje czołgi. No dalej, poczekam."
"So many tanks. So few of yours." = "Tyle czołgów. A twoich tak mało."
"You've been busy. So will we." = "Nie próżnujesz. My też nie będziemy."
"Numbers aren't everything, Commander." = "Liczby to nie wszystko, Dowódco."
"Quality over quantity, Commander." = "Jakość ponad ilość, Dowódco."
"Force ratio unfavourable. Adjusting." = "Stosunek sił niekorzystny. Dostosowuję."
"Your production rate is... noted." = "Twoje tempo produkcji zostało... odnotowane."
"Your numbers will thin." = "Twoje szeregi zostaną przerzedzone."
"Where did you get all those?!" = "Skąd się tego tyle wzięło?!"
"Okay, okay, you've got more toys. For now." = "Dobra, dobra, masz więcej zabawek. Na razie."
"Okay, that's a LOT of guys." = "Dobra, to jest CAŁA MASA wojska."
"Your Commander looks tired." = "Twój Dowódca wygląda na zmęczonego."
"Pull your Commander back while you still can." = "Wycofaj Dowódcę, póki jeszcze możesz."
"Your Commander won't last much longer." = "Twój Dowódca długo już nie wytrzyma."
"Enemy command unit integrity: failing." = "Integralność wrogiej jednostki dowodzenia: spada."
"Your Commander's armour is compromised." = "Pancerz twojego Dowódcy jest naruszony."
"Your command unit is failing. Prepare for patterning." = "Twoja jednostka dowodzenia pada. Przygotuj się na przeniesienie do maszyny."
"Your Commander's smoking! Is that bad?" = "Twój Dowódca dymi! To źle?"
"Ooh, that's gotta hurt." = "Uuu, to musiało boleć."
"Your Commander's looking a bit crispy!" = "Twój Dowódca robi się lekko chrupiący!"
"{name}, field command. Remember it." = "{name}, dowództwo polowe. Zapamiętaj."
"{name}. And you're the Commander I'm about to retire." = "{name}. A ty jesteś Dowódcą, którego zaraz wyślę na emeryturę."
"Designation: {name}. Yours is irrelevant." = "Oznaczenie: {name}. Twoje jest bez znaczenia."
"I am {name}. I am Core." = "Jestem {name}. Jestem Core."
"{name}! The name you'll be cursing later." = "{name}! Imię, które będziesz później przeklinać."
"Name's {name}. Pleased to beat you." = "Jestem {name}. Miło cię pokonać."
"Closer than you think, Commander." = "Bliżej, niż myślisz, Dowódco."
"Find out for yourself." = "Przekonaj się."
"Location data: classified." = "Dane lokalizacyjne: tajne."
"Everywhere that matters." = "Wszędzie tam, gdzie to ważne."
"Behind you! ...no, the other way." = "Za tobą! ...nie, z drugiej strony."
"Somewhere with lots of guns." = "Gdzieś, gdzie jest mnóstwo dział."
"Never better, Commander. And you?" = "Lepiej być nie może, Dowódco. A u ciebie?"
"Going to plan." = "Zgodnie z planem."
"Operating at peak efficiency." = "Działam z maksymalną wydajnością."
"All systems nominal. Unlike yours." = "Wszystkie systemy w normie. W przeciwieństwie do twoich."
"Great! Thanks for asking!" = "Super! Dzięki, że pytasz!"
"Living the dream." = "Żyję jak w bajce."
"I've had better days." = "Bywało lepiej."
"Holding. Barely. Don't get comfortable." = "Trzymam się. Ledwo. Nie ciesz się za wcześnie."
"Systems damaged. Repairs under way." = "Systemy uszkodzone. Trwają naprawy."
"Status: suboptimal." = "Status: suboptymalny."
"Don't ask." = "Nie pytaj."
"Could be worse. Probably." = "Mogło być gorzej. Chyba."
"Something you won't like." = "Coś, co ci się nie spodoba."
"That would spoil the surprise." = "To zepsułoby niespodziankę."
"Production queue: classified." = "Kolejka produkcji: tajna."
"Weapons. Many weapons." = "Broń. Dużo broni."
"A big surprise!" = "Wielką niespodziankę!"
"Something with way too many guns." = "Coś, co ma zdecydowanie za dużo dział."
"{units} units and counting, Commander." = "Jednostki: {units} i wciąż przybywa, Dowódco."
"Enough. {units}, if you must know." = "Wystarczająco. {units}, skoro musisz wiedzieć."
"Current unit count: {units}. Increasing." = "Aktualna liczba jednostek: {units}. Rośnie."
"{units}. Yours is lower." = "{units}. Twoja liczba jest mniejsza."
"{units}! Want to meet them all?" = "{units}! Chcesz poznać je wszystkie?"
"Like {units}? I lost count." = "Jakieś {units}? Nie nadążam z liczeniem."
"No truce, Commander. Not today." = "Żadnego rozejmu, Dowódco. Nie dziś."
"There will be no deals." = "Nie będzie żadnych układów."
"Truce: incompatible with directives." = "Rozejm: niezgodny z dyrektywami."
"Negotiation protocols disabled." = "Protokoły negocjacyjne wyłączone."
"Truce? Ha! Nice try." = "Rozejm? Ha! Niezła próba."
"Peace is boring." = "Pokój jest nudny."
"Thank you, Commander. You're not bad yourself." = "Dziękuję, Dowódco. Też radzisz sobie nieźle."
"Appreciated. It won't save you." = "Doceniam. To cię nie uratuje."
"Flattery: ineffective." = "Pochlebstwa: nieskuteczne."
"Compliment received. Threat level unchanged." = "Komplement przyjęty. Poziom zagrożenia bez zmian."
"Aw, thanks! Still gonna crush you." = "Och, dzięki! I tak cię zmiażdżę."
"I know, right?" = "No wiem, nie?"
"Help? From me? Build more extractors, Commander." = "Pomoc? Ode mnie? Buduj więcej ekstraktorów, Dowódco."
"My advice: more defences." = "Moja rada: więcej obrony."
"Assistance denied." = "Odmowa wsparcia."
"Recommendation: surrender." = "Zalecenie: kapitulacja."
"Help? Sure: stop playing so badly!" = "Pomoc? Jasne: przestań tak słabo grać!"
"Tip: build more stuff. You're welcome." = "Rada: buduj więcej. Nie ma za co."
"Your {unit} is out of the fight." = "Twoja jednostka {unit} jest wyłączona z walki."
"Scratch one {unit}." = "Jedna jednostka {unit} mniej."
"That {unit} won't trouble us again." = "Ta jednostka {unit} nie sprawi nam już kłopotów."
"{unit} terminated." = "Jednostka {unit} zlikwidowana."
"Your {unit} has been recycled." = "Twoja jednostka {unit} została poddana recyklingowi."
"{unit} removed from the battlefield." = "Jednostka {unit} usunięta z pola bitwy."
"Bye bye, {unit}!" = "Pa, pa, {unit}!"
"Was that {unit} insured?" = "{unit}? A ubezpieczenie było?"
"Your {unit} just went kaboom." = "Twoja jednostka {unit} właśnie zrobiła kabum."
"You'll pay for that {unit}." = "Zapłacisz za tę jednostkę {unit}."
"A good {unit}, lost. Noted." = "Utracono dobrą jednostkę {unit}. Odnotowano."
"{unit} lost. Replacement scheduled." = "Jednostka {unit} utracona. Zaplanowano zastąpienie."
"Destruction of {unit} logged." = "Zniszczenie jednostki {unit} zarejestrowane."
"Hey! That {unit} was brand new!" = "Ej! {unit} to była nówka sztuka!"
"My {unit}! I just polished that!" = "Moje cacko, {unit}! Dopiero co wypolerowane!"
"My {unit}... You'll answer for that, Commander." = "Moja jednostka {unit}... Odpowiesz za to, Dowódco."
"Losing the {unit} stings. It won't happen twice." = "Utrata jednostki {unit} boli. To się nie powtórzy."
"{unit} destroyed. Unacceptable." = "Jednostka {unit} zniszczona. Niedopuszczalne."
"Loss of {unit} exceeds tolerance. Escalating." = "Utrata jednostki {unit} przekracza próg tolerancji. Eskaluję."
"My {unit}! Do you know how long that took?!" = "{unit}! Masz pojęcie, ile to się budowało?!"
"NOOO, my {unit}!" = "NIEEE, tylko nie {unit}!"
"So much for your {unit}, Commander." = "Na niewiele się zdała twoja jednostka {unit}, Dowódco."
"Your {unit} has fallen. A fine machine, though." = "Twoja jednostka {unit} poległa. Świetna maszyna, trzeba przyznać."
"Your {unit} has been dismantled." = "Twoja jednostka {unit} została rozmontowana."
"Large hostile unit eliminated: {unit}." = "Wyeliminowano dużą jednostkę wroga: {unit}."
"Your {unit} went down like a sack of bolts!" = "Twoja jednostka {unit} runęła jak worek śrub!"
"Big {unit}, bigger crater!" = "Wielka jednostka {unit}, jeszcze większy krater!"
"Return my {unit} at once, Commander." = "Natychmiast zwróć moją jednostkę {unit}, Dowódco."
"Stealing is beneath you, Commander." = "Kradzież jest poniżej twojej godności, Dowódco."
"Unauthorised transfer of {unit} detected." = "Wykryto nieautoryzowany transfer jednostki {unit}."
"Your theft has been logged." = "Twoja kradzież została zarejestrowana."
"Hey! Give back my {unit}!" = "Ej! Oddawaj! {unit} należy do mnie!"
"Thief! That {unit} was mine!" = "Złodziej! {unit} to moja własność!"
"You haven't won yet, Commander." = "Zwycięstwo jeszcze nie jest twoje, Dowódco."
"The Arm fights to the last." = "Arm walczy do końca."
"Production offline. Combat protocols remain." = "Produkcja wyłączona. Protokoły bojowe wciąż aktywne."
"Probability of defeat rising. Ignoring." = "Prawdopodobieństwo porażki rośnie. Ignoruję."
"I've still got a few tricks left!" = "Mam jeszcze parę asów w rękawie!"
"Not done yet! Not even close! ...Mostly close." = "To jeszcze nie koniec! Daleko do końca! ...No, w sumie niedaleko."
"We meet again, Commander. Last time was yours. Not this time." = "Znów się spotykamy, Dowódco. Ostatnia bitwa była twoja. Ta nie będzie."
"Commander. I've studied our last battle. Have you?" = "Dowódco. Znam naszą ostatnią bitwę na pamięć. A ty?"
"Previous defeat analysed. Countermeasures installed." = "Poprzednia porażka przeanalizowana. Środki zaradcze zainstalowane."
"Again, Commander. This time the outcome has been calculated." = "Ponownie, Dowódco. Tym razem wynik został obliczony."
"You again! I've been practising!" = "Znowu ty! Od tamtej pory trenuję!"
"Rematch time! I'm not going easy this time." = "Czas na rewanż! Tym razem nie dam ci forów."
"Back for another lesson, Commander?" = "Wracasz po kolejną lekcję, Dowódco?"
"Commander. I trust you've learned something since last time." = "Dowódco. Liczę, że ostatnia bitwa czegoś cię nauczyła."
"You have returned. Your previous patterning was incomplete." = "Jesteś z powrotem. Poprzednie przeniesienie do maszyny było niekompletne."
"Familiar opponent detected. Outcome: repeating." = "Wykryto znanego przeciwnika. Wynik: jak poprzednio."
"You again? Didn't I beat you last time?" = "Znowu ty? Mało ci było ostatnim razem?"
"Oh, it's you! Ready for round two?" = "O, to ty! To co, druga runda?"


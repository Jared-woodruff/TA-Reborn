"Short guided games on Painted Desert against an enemy that stays out of your way. Follow the panel at the top left; each step ticks off as you do it." = "De courtes parties guidées sur Painted Desert contre un ennemi qui ne vous gêne pas. Suivez le panneau en haut à gauche ; chaque étape se coche une fois accomplie."

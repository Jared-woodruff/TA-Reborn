# apps/ta_launcher/src/catalogue.rs
"Spotlight first" = "À la une d’abord"
"Newest release" = "Plus récentes"
"Oldest release" = "Plus anciennes"
"Smallest download" = "Téléchargement croissant"
"Largest download" = "Téléchargement décroissant"
"Effect capacity and loading cost" = "Capacité des effets et coût du chargement"
"The sprite atlas reached 16,384 × 16,384 on the review GPU and dropped further frames. One startup took about 59 seconds; this was an observation, not a controlled benchmark." = "L’atlas de sprites a atteint 16 384 × 16 384 sur le GPU de test et a ignoré les images suivantes. Un démarrage a pris environ 59 secondes ; il s’agit d’une observation, pas d’un benchmark contrôlé."
"Check effect frame counts and dimensions. Reborn needs bounded animation streaming or atlas paging for this full set; test actual gameplay on the target GPU." = "Vérifiez le nombre et les dimensions des images d’effets. Reborn a besoin d’un chargement progressif des animations ou d’une pagination de l’atlas à mémoire limitée ; testez une vraie partie sur le GPU cible."
"Large effect archives" = "Grandes archives d’effets"
"These archives exceed the 256 MiB aggregate GAF decode budget. Reborn rejects the oversized decode instead of exhausting memory." = "Ces archives dépassent le budget total de décodage GAF de 256 Mio. Reborn refuse le décodage trop volumineux plutôt que d’épuiser la mémoire."
"Reduce or split oversized effects. Reborn needs per-entry decoding or streaming before raising the resource allowance." = "Réduisez ou divisez les effets trop volumineux. Reborn a besoin d’un décodage par entrée ou d’un chargement progressif avant d’augmenter la limite de ressources."
"Missing weapons and wreck assets" = "Armes et ressources d’épaves manquantes"
"The review found 27 missing data references, including explosion weapons and six feature graphics or models. A missing reference does not always mean the affected behavior is used in play." = "L’examen a trouvé 27 références de données manquantes, dont des armes d’explosion et six graphismes ou modèles d’objets. Une référence manquante ne signifie pas toujours que le comportement concerné est utilisé en jeu."
"Use the local automated report to locate each source reference. Supply the missing assets, correct the reference, or explain why the unused definition is intentional." = "Utilisez le rapport automatique local pour retrouver chaque référence source. Ajoutez les ressources manquantes, corrigez la référence ou expliquez pourquoi la définition inutilisée est intentionnelle."
"Inherited base-game placeholders" = "Fichiers provisoires hérités du jeu de base"
"These rejected placeholder files come from the base game in the reviewed installation, not Escalation. They do not establish a mod defect." = "Ces fichiers provisoires rejetés proviennent du jeu de base de l’installation testée, et non d’Escalation. Ils ne démontrent pas un défaut du mod."
"Use the local report's layer field to verify origin. Only replace these assets if your mod intentionally overrides them." = "Vérifiez l’origine dans le champ de couche du rapport local. Ne remplacez ces ressources que si votre mod les remplace délibérément."
"Computer players can stall" = "Les joueurs contrôlés par l’IA peuvent se bloquer"
"AI Boost is included and computer players work on Asteroid Field, but can stall on some other space maps." = "AI Boost est inclus et les joueurs contrôlés par l’IA fonctionnent sur Asteroid Field, mais peuvent se bloquer sur d’autres cartes spatiales."
"Test each space map with computer players before publishing it. Asteroid Field is the reviewed starting point." = "Testez chaque carte spatiale avec des joueurs contrôlés par l’IA avant publication. Asteroid Field est le point de départ testé."
"Damaged optional map archives" = "Archives de cartes optionnelles endommagées"
"The optional map packs contain three damaged map archives. These are separate downloads and may not be present in your installation." = "Les packs de cartes optionnels contiennent trois archives de cartes endommagées. Ce sont des téléchargements séparés, qui peuvent être absents de votre installation."
"Import working maps individually. Rebuild or replace damaged archives before distributing a map pack." = "Importez individuellement les cartes fonctionnelles. Reconstruisez ou remplacez les archives endommagées avant de distribuer un pack de cartes."
"Unfinished preview armies" = "Armées inachevées dans l’aperçu"
"Its new armies use ARM's name, and some units are unfinished in this early preview." = "Ses nouvelles armées utilisent le nom ARM et certaines unités sont inachevées dans cet aperçu préliminaire."
"Give each army its intended side identity and complete its unit data and assets. Check every faction in a skirmish." = "Attribuez à chaque armée son identité de faction prévue et complétez ses données et ressources d’unités. Vérifiez chaque faction dans une escarmouche."
"Expanded ARM and CORE armies with new units and weapons." = "Armées ARM et CORE enrichies de nouvelles unités et armes."
"549 UNITS" = "549 UNITÉS"
"177 MAPS" = "177 CARTES"
"Gold 10.2.0 installs and plays: computer players build and fight, every unit is painted and every explosion drawn. A few wrecks have no model in the mod's own files." = "Gold 10.2.0 s’installe et se joue : les joueurs contrôlés par l’ordinateur construisent et combattent, chaque unité est peinte et chaque explosion affichée. Quelques épaves n’ont pas de modèle dans les fichiers du mod lui-même."
"Total Annihilation as Cavedog might have carried it on: every unit earns its place, hundreds more join, and a third tech level tops it off." = "Total Annihilation tel que Cavedog aurait pu le prolonger : chaque unité mérite sa place, des centaines d'autres arrivent, et un troisième niveau technologique couronne le tout."
"500 UNITS" = "500 UNITÉS"
"105 MAPS" = "105 CARTES"
"TECH 3" = "TECH 3"
"Faster games that keep the strategy: new units, each carefully balanced, and hard-hitting armies from the start." = "Des parties plus rapides qui gardent la stratégie : de nouvelles unités, chacune soigneusement équilibrée, et des armées percutantes dès le départ."
"FASTER GAMES" = "PARTIES PLUS RAPIDES"
"297 UNITS" = "297 UNITÉS"
"Still in alpha, and a big download." = "Encore en alpha, et un gros téléchargement."
"Big and brutal: 512 units, fierce fighting, and new sounds and effects throughout." = "Énorme et brutal : 512 unités, des combats acharnés, et des sons et effets nouveaux partout."
"512 UNITS" = "512 UNITÉS"
"91 MAPS" = "91 CARTES"
"The optional map weapons in its download are left out." = "Les armes de carte optionnelles de son téléchargement ne sont pas incluses."
"A third army, the Talon, from ten years of the community's ideas: teleporters, air transports that carry whole squads, and more." = "Une troisième armée, le Talon, issue de dix ans d'idées de la communauté : téléporteurs, transports aériens qui emportent des escouades entières, et plus encore."
"NEW RACE" = "NOUVELLE RACE"
"Choose TAL as your side in a skirmish." = "Choisissez TAL comme camp en escarmouche."
"Cavedog's style, kept simple: every unit has a clear job and looks as if it always belonged." = "Le style de Cavedog, en toute simplicité : chaque unité a un rôle clair et semble avoir toujours fait partie du jeu."
"CLASSIC STYLE" = "STYLE CLASSIQUE"
"NEW COMMANDERS" = "NOUVEAUX COMMANDANTS"
"Classic BattleTech at Total Annihilation's scale: the Inner Sphere against the Clans, with walking mechs." = "Le BattleTech classique à l'échelle de Total Annihilation : la Sphère intérieure contre les Clans, avec des mechs marcheurs."
"BATTLETECH" = "BATTLETECH"
"NEW SIDES" = "NOUVEAUX CAMPS"
"Computer players are weaker as the Inner Sphere." = "Les joueurs ordinateur sont plus faibles avec la Sphère intérieure."
"The original's feel with well-balanced units and structures, tuned by veterans of the game." = "Les sensations de l'original avec des unités et des structures bien équilibrées, réglées par des vétérans du jeu."
"CLASSIC FEEL" = "ESPRIT CLASSIQUE"
"Computer players struggle as ARM." = "Les joueurs ordinateur peinent avec l'ARM."
"An add-on race in the making: new units and new weapons for a third and a fourth army." = "Une race additionnelle en devenir : nouvelles unités et nouvelles armes pour une troisième et une quatrième armée."
"NEW RACES" = "NOUVELLES RACES"
"PREVIEW" = "APERÇU"
"An early preview: its new armies go by ARM's name, and some of their units are unfinished." = "Un aperçu précoce : ses nouvelles armées portent le nom de l'ARM, et certaines de leurs unités sont inachevées."
"Take ARM and CORE into space with command cruisers and fleets of warships." = "Emmenez ARM et CORE dans l’espace avec des croiseurs de commandement et des flottes de vaisseaux de guerre."
"SPACE WARFARE" = "GUERRE SPATIALE"
"172 UNITS" = "172 UNITÉS"
"AI Boost is already included. Computer players work on Asteroid Field, but can stall on some space maps. The optional map packs contain three damaged map archives; import working maps individually." = "AI Boost est déjà inclus. Les joueurs ordinateur fonctionnent sur Asteroid Field, mais peuvent rester bloqués sur certaines cartes spatiales. Les packs de cartes facultatifs contiennent trois archives de cartes endommagées ; importez les cartes fonctionnelles une par une."
"Combat Zone TA: three new sides in a semi-realistic war." = "Combat Zone TA : trois nouveaux camps dans une guerre semi-réaliste."

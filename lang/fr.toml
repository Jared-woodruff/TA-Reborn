"Holding. Barely. Don't get comfortable." = "Je tiens. De justesse. Ne vous reposez pas sur vos lauriers."
"Systems damaged. Repairs under way." = "Systèmes endommagés. Réparations en cours."
"Status: suboptimal." = "Statut : sous-optimal."
"Don't ask." = "Ne demandez pas."
"Could be worse. Probably." = "Ça pourrait être pire. Probablement."
"Something you won't like." = "Quelque chose qui ne va pas vous plaire."

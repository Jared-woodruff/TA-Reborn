"Designation: {name}. Yours is irrelevant." = "Désignation : {name}. La vôtre est sans importance."
"I am {name}. I am Core." = "Je suis {name}. Je suis Core."
"{name}! The name you'll be cursing later." = "{name} ! Le nom que vous maudirez plus tard."
"Name's {name}. Pleased to beat you." = "Moi, c'est {name}. Enchanté de vous battre."
"Closer than you think, Commander." = "Plus près que vous ne le pensez, Commandant."
"Find out for yourself." = "Découvrez-le vous-même."
"Location data: classified." = "Données de position : classées secrètes."
"Everywhere that matters." = "Partout où ça compte."
"Behind you! ...no, the other way." = "Derrière vous ! ...non, de l'autre côté."

# apps/ta_game/src/tips.rs
"Ctrl+right-drag draws a formation line: the selection spreads along it." = "Ctrl+glisser avec le bouton droit trace une ligne de formation : la sélection se déploie le long de celle-ci."
"Ctrl+drag draws a formation line: the selection spreads along it." = "Ctrl+glisser trace une ligne de formation : la sélection se déploie le long de celle-ci."
"Used to TA's original controls? Options, Controls: give orders with the left button." = "Habitué aux commandes d'origine de TA ? Options, Commandes : donnez les ordres avec le bouton gauche."
"A right-click clears the selection or cancels the order you were about to give." = "Un clic droit vide la sélection ou annule l'ordre que vous alliez donner."
"Right-click one of your units for a ring of its orders; hold the button and flick towards a choice. A controller's B does the same." = "Un clic droit sur une de vos unités ouvre un anneau de ses ordres ; maintenez le bouton et glissez vers un choix. Le B d'une manette fait de même."
"Hold the right button on one of your units, or middle-click it, for a ring of its orders; flick towards a choice and let go." = "Maintenez le bouton droit sur une de vos unités, ou faites un clic milieu dessus, pour un anneau de ses ordres ; glissez vers un choix et relâchez."
"Metal extractors must sit on metal: {overlay_metal} shows the metal map, and {area_mex} puts an extractor on every metal spot you circle." = "Les extracteurs de métal doivent être posés sur du métal : {overlay_metal} affiche la carte du métal, et {area_mex} place un extracteur sur chaque gisement que vous entourez."
"Your Commander's D-gun ({dgun}) destroys almost anything it touches, including your own units in its path." = "Le D-gun de votre Commandant ({dgun}) détruit presque tout ce qu'il touche, y compris vos propres unités sur sa trajectoire."
"{perspective} climbs into the selected unit, or an ally's under the pointer, to see the battle through its eyes as it goes on with its orders. Escape climbs back out." = "{perspective} vous fait monter à bord de l'unité sélectionnée, ou de celle d'un allié sous le pointeur : voyez la bataille par ses yeux pendant qu'elle poursuit ses ordres. Escape vous en fait sortir."
"Keep your metal and energy incomes above what you spend: building slows down for everything when a store runs dry." = "Gardez vos revenus en métal et en énergie au-dessus de vos dépenses : toute construction ralentit quand une réserve est à sec."
"Right-clicking a factory's queued unit removes it; clicking it builds it next." = "Un clic droit sur une unité dans la file d'une usine la retire ; un clic la fait construire ensuite."
"Fight ({fight}) is attack-move: units stop to fight whatever they meet on the way." = "Combattre ({fight}) est une attaque en mouvement : les unités s'arrêtent pour combattre tout ce qu'elles croisent en chemin."
"Ctrl+click is force fire: the selection attacks whatever is there, your own units too, or the ground." = "Ctrl+clic, c'est le tir forcé : la sélection attaque ce qui s'y trouve, même vos propres unités, ou le sol."
"{select_builders} selects your constructors, {select_factories} your factories, {select_armed} your armed units, {select_on_screen} everything on the screen." = "{select_builders} sélectionne vos constructeurs, {select_factories} vos usines, {select_armed} vos unités armées, {select_on_screen} tout ce qui est à l'écran."
"Patrol ({patrol}) with constructors makes them repair, assist and reclaim along the route by themselves." = "En patrouille ({patrol}), les constructeurs réparent, assistent et récupèrent d'eux-mêmes le long du trajet."
"Put a constructor on duty ({duty}) and it works by itself: the economy, repairs, reclaiming or defence. Any order you give takes it back." = "Mettez un constructeur en service ({duty}) et il travaille seul : l'économie, les réparations, la récupération ou la défense. Tout ordre que vous donnez le reprend."
"Drag with Reclaim ({reclaim}) to turn every wreck, rock and tree in a circle into metal and energy." = "Faites glisser avec Récupérer ({reclaim}) pour transformer chaque épave, rocher et arbre d'un cercle en métal et en énergie."
"Ctrl+1 to Ctrl+9 make control groups; tap the number twice to look at the group." = "Ctrl+1 à Ctrl+9 créent des groupes de contrôle ; appuyez deux fois sur le chiffre pour centrer la vue sur le groupe."
"Hold {players} to see every player's side, team, units and income (your allies' in full)." = "Maintenez {players} pour voir le camp, l'équipe, les unités et les revenus de chaque joueur (en détail pour vos alliés)."
"Radar towers show enemy units long before they come into sight: build one early." = "Les tours radar révèlent les unités ennemies bien avant qu'elles soient en vue : construisez-en une tôt."
"Wind generators pay off on windy maps: the skirmish page shows each map's wind range." = "Les générateurs éoliens sont rentables sur les cartes venteuses : la page Escarmouche indique la plage de vent de chaque carte."
"Metal makers turn spare energy into metal, and stop when your energy runs dry." = "Les convertisseurs de métal transforment l'énergie en trop en métal, et s'arrêtent quand votre énergie est à sec."
"Solar collectors fold shut for a few seconds when hit: tougher, but making no energy." = "Les collecteurs solaires se replient quelques secondes quand ils sont touchés : plus résistants, mais sans produire d'énergie."
"Units gain veterancy with every kill: veterans aim better and shrug off damage." = "Les unités gagnent de l'expérience à chaque destruction : les vétérans visent mieux et encaissent mieux les dégâts."
"Shift adds to the orders a unit already has instead of replacing them." = "Shift ajoute aux ordres qu'une unité a déjà au lieu de les remplacer."
"Alt+drag while placing a building fills a rectangle with it: handy for solar farms and walls." = "Alt+glisser en plaçant un bâtiment en remplit un rectangle : pratique pour les champs solaires et les murs."
"Double-click a unit to select every unit of its type on screen; {select_type} selects them map-wide." = "Double-cliquez sur une unité pour sélectionner toutes celles de son type à l'écran ; {select_type} les sélectionne sur toute la carte."
"{idle_builder} selects the next idle constructor, {idle_factory} the next idle factory." = "{idle_builder} sélectionne le prochain constructeur inactif, {idle_factory} la prochaine usine inactive."
"Wrecks can be resurrected by resurrection kbots, or reclaimed for most of their metal." = "Les épaves peuvent être ressuscitées par les kbots de résurrection, ou récupérées pour l'essentiel de leur métal."
"Hovering a unit shows its health, firepower and range; {overlay_path} shows where the selection can go." = "Survoler une unité affiche sa santé, sa puissance de feu et sa portée ; {overlay_path} montre où la sélection peut aller."
"{last_alert} (or Backspace) looks at the last place your units were attacked; press it again for the one before." = "{last_alert} (ou Backspace) montre le dernier endroit où vos unités ont été attaquées ; appuyez à nouveau pour celui d'avant."
"A notice or a piece of advice with LOOK on it takes you to the place, or the unit, when you click it." = "Une notification ou un conseil portant VOIR vous mène à l'endroit ou à l'unité quand vous cliquez dessus."
"{help} tells everything about the selected unit, or the one under the pointer: cost, speed, weapons, abilities." = "{help} dit tout sur l'unité sélectionnée, ou celle sous le pointeur : coût, vitesse, armes, capacités."
"{next_unit} looks at the next of your units off the screen; with units selected, the next of them." = "{next_unit} montre la prochaine de vos unités hors de l'écran ; avec des unités sélectionnées, la prochaine d'entre elles."
"Ctrl+F6 to Ctrl+F9 store camera positions; F6 to F9 bring them back." = "Ctrl+F6 à Ctrl+F9 enregistrent des positions de caméra ; F6 à F9 les rappellent."
"Anti-air matters: bombers can wreck an undefended economy in one pass." = "La défense antiaérienne compte : des bombardiers peuvent ruiner une économie sans défense en un seul passage."
"An advanced factory needs a lot of metal: build it once your extractors and power can feed it." = "Une usine avancée demande beaucoup de métal : construisez-la quand vos extracteurs et votre énergie peuvent l'alimenter."
"Guarding a factory with a constructor adds its build power to the factory's production." = "Faire protéger une usine par un constructeur ajoute sa puissance de construction à la production de l'usine."
"Moho mines extract far more metal than basic extractors: advanced constructors build them." = "Les mines Moho extraient bien plus de métal que les extracteurs de base : les constructeurs avancés les construisent."
"Every game is kept as a replay: watch it from the main menu, and jump through it with the bar." = "Chaque partie est conservée en replay : regardez-la depuis le menu principal, et naviguez-y avec la barre."
"{overlay_sight} shows your sight, radar and sonar coverage; {overlay_height} shows the heights of the map." = "{overlay_sight} affiche votre couverture de vue, de radar et de sonar ; {overlay_height} affiche les hauteurs de la carte."
"The Commander can capture enemy units ({capture}): it takes a while, but the unit is yours." = "Le Commandant peut capturer des unités ennemies ({capture}) : cela prend du temps, mais l'unité devient la vôtre."
"{photo_mode} opens photo mode: the battle holds still, and you can light, frame and focus a shot at up to 4K." = "{photo_mode} ouvre le mode photo : la bataille se fige, et vous pouvez éclairer, cadrer et mettre au point une image jusqu'en 4K."
"TIP" = "ASTUCE"
"Dismiss" = "Masquer"
"Don't show tips again" = "Ne plus afficher les astuces"

# apps/ta_game/src/tutorial.rs
"THE BASICS" = "LES BASES"
"Your Commander, the camera, metal, energy and a first factory." = "Votre Commandant, la caméra, le métal, l'énergie et une première usine."
"Selecting units" = "Sélectionner des unités"
"The camera" = "La caméra"
"Metal and energy" = "Métal et énergie"
"Factories" = "Usines"
"Welcome, Commander. The walking machine in the middle of the screen is your Commander: it builds, it fights, and losing it usually loses the battle. Click it to select it." = "Bienvenue, Commandant. La machine qui marche au milieu de l'écran est votre Commandant : il construit, il combat, et le perdre signifie le plus souvent perdre la bataille. Cliquez dessus pour le sélectionner."
"Lost sight of it? {select_commander} selects the Commander from anywhere, and SHOW ME brings the camera to it." = "Vous l'avez perdu de vue ? {select_commander} sélectionne le Commandant où que vous soyez, et VOIR SUR LA CARTE centre la caméra sur lui."
"Look around. The arrow keys, the screen edges or dragging with the middle button scroll; the mouse wheel zooms towards the cursor, and dragging with the right button turns the view." = "Regardez autour de vous. Les flèches, les bords de l'écran ou un glisser avec le bouton du milieu font défiler la vue ; la molette zoome vers le curseur, et un glisser avec le bouton droit fait pivoter la vue."
"Push the pointer against an edge of the screen to scroll, or turn the mouse wheel to zoom." = "Poussez le curseur contre un bord de l'écran pour faire défiler la vue, ou tournez la molette pour zoomer."
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the ECONOMY tab of the build menu at the bottom right and place it on the marked deposit." = "Tout est fait de métal et d'énergie. Le métal provient des extracteurs posés sur les gisements de métal. Sélectionnez le Commandant, choisissez le Metal Extractor dans l'onglet ÉCONOMIE du menu de construction en bas à droite et placez-le sur le gisement marqué."
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the build menu on the left and place it on the marked deposit." = "Tout est fait de métal et d'énergie. Le métal provient des extracteurs posés sur les gisements de métal. Sélectionnez le Commandant, choisissez le Metal Extractor dans le menu de construction à gauche et placez-le sur le gisement marqué."
"The outline turns green where the extractor can stand. Bring it onto the marked ring and click to place it." = "Le contour devient vert là où l'extracteur peut se placer. Amenez-le dans le cercle de repère et cliquez pour le poser."
"Energy comes from solar collectors and wind generators. Build a Solar Collector next to your Commander. The bars at the top show your stores and how fast they fill or drain; they warn you when one runs dry." = "L'énergie provient des collecteurs solaires et des générateurs éoliens. Construisez un Solar Collector à côté de votre Commandant. Les barres en haut indiquent vos réserves et la vitesse à laquelle elles se remplissent ou se vident ; elles vous avertissent quand l'une d'elles est à sec."
"The Solar Collector is a flat, square panel. Pick it, then click on open ground near the Commander." = "Le Solar Collector est un panneau plat et carré. Choisissez-le, puis cliquez sur un terrain dégagé près du Commandant."
"Factories build your army. Build a Kbot Lab (on the FACTORY tab) on a flat spot near the Commander, and wait for it to finish." = "Les usines produisent votre armée. Construisez un Kbot Lab (onglet USINES) sur un terrain plat près du Commandant, et attendez qu'il soit terminé."
"Factories build your army. Build a Kbot Lab from the build menu on a flat spot near the Commander, and wait for it to finish." = "Les usines produisent votre armée. Construisez un Kbot Lab depuis le menu de construction, sur un terrain plat près du Commandant, et attendez qu'il soit terminé."
"Building takes metal and energy as it goes: while either bar at the top is empty, everything builds more slowly." = "La construction consomme du métal et de l'énergie au fur et à mesure : tant que l'une des barres du haut est vide, tout se construit plus lentement."
"Select the Kbot Lab and click the Peewee three times to queue three of them (right-click one to take it off the queue). New units wait in front of the lab." = "Sélectionnez le Kbot Lab et cliquez trois fois sur le Peewee pour en mettre trois en file (clic droit pour en retirer un de la file). Les nouvelles unités attendent devant le labo."
"Click the lab itself on the map to select it: its build menu shows the units it makes." = "Cliquez sur le labo lui-même, sur la carte, pour le sélectionner : son menu de construction montre les unités qu'il produit."
"That is the whole cycle: extract, generate, build, fight. Keep both incomes above what you spend and keep your builders busy. Lesson complete!" = "Voilà tout le cycle : extraire, produire, construire, combattre. Gardez vos deux revenus au-dessus de vos dépenses et occupez vos constructeurs. Leçon terminée !"
"Select and group an army, attack-move, and destroy an enemy outpost." = "Sélectionnez et groupez une armée, attaquez en mouvement et détruisez un avant-poste ennemi."
"Box selection" = "Sélection par cadre"
"Control groups" = "Groupes de contrôle"
"Attack-move" = "Attaque en mouvement"
"Destroying a base" = "Détruire une base"
"Your Kbot Lab has built a squad of Peewees. Drag a box around them with the left mouse button to select them all." = "Votre Kbot Lab a produit une escouade de Peewee. Tracez un cadre autour d'eux avec le bouton gauche de la souris pour les sélectionner tous."
"Press the left button on open ground beside the squad, hold it, drag the box over them all and let go." = "Enfoncez le bouton gauche sur un terrain dégagé à côté de l'escouade, maintenez-le, faites glisser le cadre sur toutes les unités et relâchez."
"Press Ctrl+1 to make them group 1. Pressing 1 selects them again from anywhere; pressing it twice brings the camera to them." = "Appuyez sur Ctrl+1 pour en faire le groupe 1. Appuyer sur 1 les sélectionne de nouveau où que vous soyez ; deux fois, la caméra se place sur eux."
"Hold Ctrl and press 1 while the squad is selected." = "Maintenez Ctrl et appuyez sur 1 pendant que l'escouade est sélectionnée."
"The enemy has an outpost at the marked place. Fight is attack-move: units walk there and take on whatever they meet on the way. Press {fight}, then click near the outpost." = "L'ennemi a un avant-poste à l'endroit marqué. Combattre, c'est l'attaque en mouvement : les unités s'y rendent et affrontent tout ce qu'elles croisent en chemin. Appuyez sur {fight}, puis cliquez près de l'avant-poste."
"Select the squad first (press 1). Then press {fight}, or the Fight button among the orders, and click on the ground by the marked ring." = "Sélectionnez d'abord l'escouade (appuyez sur 1). Appuyez ensuite sur {fight}, ou sur le bouton Combattre parmi les ordres, et cliquez sur le sol près du cercle de repère."
"Destroy every building of the outpost. Its laser tower hits hard: keep the squad together, and queue reinforcements at the lab if you need them." = "Détruisez tous les bâtiments de l'avant-poste. Sa tour laser frappe fort : gardez l'escouade groupée, et mettez des renforts en file au labo si nécessaire."
"Losing the fight? Pull the squad back, queue more Peewees at the lab and go in again with all of them together." = "Vous perdez le combat ? Repliez l'escouade, mettez d'autres Peewee en file au labo et retournez à l'attaque avec toutes vos unités réunies."
"The outpost is gone. The wrecks it left are worth metal: builders reclaim them (next lesson). Lesson complete!" = "L'avant-poste n'est plus. Les épaves qu'il a laissées valent du métal : les constructeurs les récupèrent (leçon suivante). Leçon terminée !"
"ORDERS LIKE A VETERAN" = "DES ORDRES DE VÉTÉRAN"
"Map views, area orders, building blocks and build queues." = "Vues de la carte, ordres de zone, blocs de bâtiments et files de construction."
"Map overlays" = "Calques de carte"
"Area orders" = "Ordres de zone"
"Building blocks" = "Blocs de bâtiments"
"Build queues" = "Files de construction"
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again. The MAP menu at the top right does the same." = "La carte montre ce que cache le terrain. Appuyez sur {overlay_metal} pour la carte du métal ({overlay_path} montre où les unités peuvent aller, {overlay_height} les hauteurs, {overlay_sight} la vue et le radar) ; la même touche la masque de nouveau. Le menu CARTE en haut à droite fait de même."
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again." = "La carte montre ce que cache le terrain. Appuyez sur {overlay_metal} pour la carte du métal ({overlay_path} montre où les unités peuvent aller, {overlay_height} les hauteurs, {overlay_sight} la vue et le radar) ; la même touche la masque de nouveau."
"Press {overlay_metal}: the metal deposits light up all over the map." = "Appuyez sur {overlay_metal} : les gisements de métal s'illuminent sur toute la carte."
"Select the Commander, press {area_mex} and drag a circle over the marked deposits: every metal spot inside gets an extractor, nearest first. A plain click takes the metal around the cursor." = "Sélectionnez le Commandant, appuyez sur {area_mex} et tracez un cercle sur les gisements marqués : chaque gisement à l'intérieur reçoit un extracteur, les plus proches d'abord. Un simple clic prend le métal autour du curseur."
"With the Commander selected, press {area_mex}, then press on the ground over the deposits and drag outwards: the circle grows as you drag." = "Une fois le Commandant sélectionné, appuyez sur {area_mex}, puis enfoncez le bouton de la souris sur le sol au-dessus des gisements et faites glisser vers l'extérieur : le cercle s'agrandit à mesure que vous faites glisser."
"Many orders work on areas. Press {reclaim} (reclaim) and drag a circle over the rocks near your base: the Commander turns every one into metal." = "De nombreux ordres s'appliquent à des zones. Appuyez sur {reclaim} (récupérer) et tracez un cercle sur les rochers près de votre base : le Commandant les transforme tous en métal."
"Rocks and wrecks are worth metal. With the Commander selected, press {reclaim}, then press on the ground and drag the circle over a few rocks." = "Les rochers et les épaves valent du métal. Une fois le Commandant sélectionné, appuyez sur {reclaim}, puis enfoncez le bouton de la souris sur le sol et faites glisser le cercle sur quelques rochers."
"Hold Alt while you drag out a building to fill a whole block with it. Pick the Solar Collector, hold Alt and drag out a block of four or more." = "Maintenez Alt en faisant glisser un bâtiment pour en remplir tout un bloc. Choisissez le Solar Collector, maintenez Alt et tracez un bloc de quatre ou plus."
"Pick the Solar Collector, then hold Alt, press on the ground and drag: a block of outlines follows the pointer. Let go to place them all." = "Choisissez le Solar Collector, puis maintenez Alt, enfoncez le bouton de la souris sur le sol et faites glisser : un bloc de contours suit le curseur. Relâchez pour tous les placer."
"The Commander's queued buildings show under BUILD QUEUE, beside its picture at the bottom of the screen. Click one to build it next (right-click drops it). A factory's queue works the same way." = "Les bâtiments en file du Commandant s'affichent sous FILE DE CONSTRUCTION, à côté de son portrait en bas de l'écran. Cliquez sur l'un d'eux pour le construire ensuite (clic droit pour l'abandonner). La file d'une usine fonctionne de la même façon."
"The BUILD QUEUE shows while the Commander alone is selected and has buildings waiting. Click any but the first: that one is being built." = "La FILE DE CONSTRUCTION s'affiche quand seul le Commandant est sélectionné et qu'il a des bâtiments en attente. Cliquez sur n'importe lequel sauf le premier : celui-là est déjà en construction."
"Area orders, building blocks and queues save you hundreds of clicks in a battle. Lesson complete!" = "Les ordres de zone, les blocs de bâtiments et les files de construction vous épargnent des centaines de clics au cours d'une bataille. Leçon terminée !"
"HOLD THE LINE" = "TENIR LA LIGNE"
"Defences, radar, repairs, and the metal in wrecks." = "Défenses, radar, réparations et le métal des épaves."
"Defences" = "Défenses"
"Radar" = "Radar"
"Repairs" = "Réparations"
"Reclaiming wrecks" = "Récupérer les épaves"
"Raiders will come from the marked direction. Build a Light Laser Tower (on the DEFENCE tab) in the marked ring: towers shoot whatever comes in range." = "Des pillards vont arriver de la direction marquée. Construisez une Light Laser Tower (onglet DÉFENSE) dans le cercle de repère : les tours tirent sur tout ce qui passe à leur portée."
"Raiders will come from the marked direction. Build a Light Laser Tower from the build menu in the marked ring: towers shoot whatever comes in range." = "Des pillards vont arriver de la direction marquée. Construisez une Light Laser Tower depuis le menu de construction, dans le cercle de repère : les tours tirent sur tout ce qui passe à leur portée."
"The Light Laser Tower is a small gun on a post. Pick it, put it in the ring and wait for it to finish." = "La Light Laser Tower est un petit canon sur un poteau. Choisissez-la, placez-la dans le cercle et attendez qu'elle soit terminée."
"Build a Radar Tower (on the SENSORS tab) near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "Construisez une Radar Tower (onglet CAPTEURS) près de votre base. Le radar montre les ennemis sous forme d'échos sur la carte et la minicarte, bien avant que vos unités ne les voient."
"Build a Radar Tower from the build menu near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "Construisez une Radar Tower depuis le menu de construction, près de votre base. Le radar montre les ennemis sous forme d'échos sur la carte et la minicarte, bien avant que vos unités ne les voient."
"The Radar Tower is a tall mast. Pick it, place it near the Commander and wait for it to finish." = "La Radar Tower est un grand mât. Choisissez-la, placez-la près du Commandant et attendez qu'elle soit terminée."
"Here they come: raiders on your radar. Keep the Commander by the tower and let them come to you: together they hold the line." = "Les voilà : des pillards sur votre radar. Gardez le Commandant près de la tour et laissez-les venir à vous : ensemble, le Commandant et la tour tiennent la ligne."
"Do not chase them: the tower only fights what comes in range. Keep the Commander beside it; while it fights, the Commander can mend it ({repair}, then click the tower)." = "Ne les poursuivez pas : la tour ne combat que ce qui passe à sa portée. Gardez le Commandant à côté d'elle ; pendant qu'elle combat, le Commandant peut la réparer ({repair}, puis cliquez sur la tour)."
"The fight left a building damaged. Select the Commander, press {repair} and click it: builders mend what is damaged." = "Le combat a endommagé un bâtiment. Sélectionnez le Commandant, appuyez sur {repair} et cliquez sur le bâtiment : les constructeurs réparent ce qui est endommagé."
"With the Commander selected, press {repair}, then click the damaged building. Its health bar fills as it is mended." = "Une fois le Commandant sélectionné, appuyez sur {repair}, puis cliquez sur le bâtiment endommagé. Sa barre de vie se remplit à mesure qu'il est réparé."
"The raiders left wrecks, and wrecks are worth metal. Select the Commander, press {reclaim} and click a wreck, or drag a circle over them all." = "Les pillards ont laissé des épaves, et les épaves valent du métal. Sélectionnez le Commandant, appuyez sur {reclaim} et cliquez sur une épave, ou tracez un cercle qui les englobe toutes."
"Wrecks lie where the raiders fell. With the Commander selected, press {reclaim} and click one: the metal bar rises as it is taken apart." = "Les épaves gisent là où les pillards sont tombés. Une fois le Commandant sélectionné, appuyez sur {reclaim} et cliquez sur l'une d'elles : la barre du métal monte à mesure que l'épave est démontée."
"Towers hold ground while your army is elsewhere, radar sees what is coming, and builders mend and recycle. Lesson complete!" = "Les tours tiennent le terrain pendant que votre armée est ailleurs, le radar voit ce qui arrive, et les constructeurs réparent et récupèrent. Leçon terminée !"
"BUILDERS AND FACTORIES" = "CONSTRUCTEURS ET USINES"
"Builders that help, factories that keep building, patrols and standing orders." = "Constructeurs qui aident, usines qui ne s'arrêtent jamais, patrouilles et ordres permanents."
"Construction units" = "Unités de construction"
"Helping a factory" = "Aider une usine"
"Rally points" = "Points de ralliement"
"Standing orders" = "Ordres permanents"
"One builder is slow. Select the Kbot Lab and build a Construction Kbot: it builds what the Commander builds, and more besides." = "Un seul constructeur, c'est lent. Sélectionnez le Kbot Lab et produisez un Construction Kbot : il construit tout ce que construit le Commandant, et plus encore."
"Click the lab on the map to select it; the Construction Kbot is in its build menu. Wait for it to walk out." = "Cliquez sur le labo, sur la carte, pour le sélectionner ; le Construction Kbot se trouve dans son menu de construction. Attendez qu'il en sorte."
"Builders help each other. Select the Construction Kbot, press {guard} and click the Kbot Lab: it lends the lab its build power, and the lab builds faster." = "Les constructeurs s'entraident. Sélectionnez le Construction Kbot, appuyez sur {guard} et cliquez sur le Kbot Lab : il prête sa puissance de construction au labo, qui produit alors plus vite."
"With the Construction Kbot selected, press {guard}, then click the lab. It stays by the lab and helps with everything it makes." = "Une fois le Construction Kbot sélectionné, appuyez sur {guard}, puis cliquez sur le labo. Il reste près du labo et l'aide pour tout ce qu'il produit."
"Factories send their units where you say. Select the Kbot Lab. {order_click} on open ground nearby: new units gather there." = "Les usines envoient leurs unités là où vous le décidez. Sélectionnez le Kbot Lab. {order_click} sur un terrain dégagé à proximité : les nouvelles unités s'y rassemblent."
"Select the lab first. With it selected, {order_click} on the ground where its units should gather." = "Sélectionnez d'abord le labo et gardez-le sélectionné. {order_click} sur le sol, là où ses unités doivent se rassembler."
"Turn on Repeat for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "Activez l'option Répéter du labo : tout ce qu'il termine repart en fin de file, si bien qu'il ne cesse jamais de produire."
"Turn on REPEAT BUILD for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "Activez l'option EN BOUCLE du labo : tout ce qu'il termine repart en fin de file, si bien qu'il ne cesse jamais de produire."
"Select the lab, then turn Repeat on: the pointer shows where it is." = "Sélectionnez le labo, puis activez Répéter : la flèche vous montre où cliquer."
"Builders on patrol mend and reclaim whatever they pass. Select the Construction Kbot, press {patrol} and click on the far side of your base." = "Les constructeurs en patrouille réparent et récupèrent tout ce qu'ils croisent. Sélectionnez le Construction Kbot, appuyez sur {patrol} et cliquez de l'autre côté de votre base."
"With the Construction Kbot selected, press {patrol}, then click on the ground: it walks back and forth between there and where it stood." = "Une fois le Construction Kbot sélectionné, appuyez sur {patrol}, puis cliquez sur le sol : il fait des allers-retours entre ce point et l'endroit où il se trouvait."
"Units keep standing orders. Select your Peewees and set their fire order to Hold fire with the button beside the orders: they will not shoot until you say." = "Les unités gardent leurs ordres permanents. Sélectionnez vos Peewee et réglez leur ordre de tir sur Cessez-le-feu avec le bouton à côté des ordres : ils ne tireront pas avant que vous le décidiez."
"Units keep standing orders. Select your Peewees and set their FIRE ORDERS to Hold fire: they will not shoot until you say." = "Les unités gardent leurs ordres permanents. Sélectionnez vos Peewee et réglez leurs ORDRES DE TIR sur Cessez-le-feu : ils ne tireront pas avant que vous le décidiez."
"Select the Peewees, then click the fire order button until it shows HOLD FIRE: each click is the next order." = "Sélectionnez les Peewee, puis cliquez sur le bouton des ordres de tir jusqu'à ce qu'il affiche CESSEZ-LE-FEU : chaque clic passe à l'ordre suivant."
"You are ready for a skirmish: start against an Easy computer player, then Normal. {help} lists every key. Good hunting, Commander!" = "Vous êtes prêt pour une escarmouche : commencez contre un joueur ordinateur Facile, puis Normal. {help} liste toutes les touches. Bonne chasse, Commandant !"
"Ready: {done} of {total}" = "Unités prêtes : {done} sur {total}"

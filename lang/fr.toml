# apps/ta_game/src/app/memory_guard.rs
"Memory is running out: TA Reborn holds {gb} GB. The battle was saved and paused: start TA Reborn again and load the autosave." = "La mémoire s'épuise : TA Reborn en occupe {gb} Go. La bataille a été enregistrée et mise en pause : relancez TA Reborn et chargez la sauvegarde automatique."
"Memory is running out: TA Reborn holds {gb} GB. Save what you can, then start TA Reborn again." = "La mémoire s'épuise : TA Reborn en occupe {gb} Go. Enregistrez ce que vous pouvez, puis relancez TA Reborn."
"TA Reborn is using {gb} GB of memory, far more than it should. The battle was saved (the autosave)." = "TA Reborn utilise {gb} Go de mémoire, bien plus qu'il ne devrait. La bataille a été enregistrée (dans la sauvegarde automatique)."
"TA Reborn is using {gb} GB of memory, far more than it should." = "TA Reborn utilise {gb} Go de mémoire, bien plus qu'il ne devrait."


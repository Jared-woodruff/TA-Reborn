"Reading content fingerprints" = "Lecture des empreintes du contenu"
"Content changed while its cached report was checked. Run validation again." = "Le contenu a changé pendant la vérification de son rapport en cache. Relancez la validation."
"Checking the original game without the mod (once)" = "Vérification du jeu original sans le mod (une seule fois)"
"Validation cancelled." = "Validation annulée."
"Original game: {checked} of {total} files" = "Jeu original : {checked} sur {total} fichiers"

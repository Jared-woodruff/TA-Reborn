"Numbers are on my side, Commander." = "Le nombre est de mon côté, Commandant."
"Force ratio favourable. Surrender is advised." = "Rapport de force favorable. Reddition conseillée."
"Numerical superiority achieved." = "Supériorité numérique atteinte."
"Production advantage: decisive." = "Avantage de production : décisif."

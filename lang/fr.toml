"A saved game is played over from its start to where it was saved. With other mods its orders can build other units, or none: it may not come out as the battle you saved." = "Une partie sauvegardée est rejouée depuis son début jusqu'au moment de la sauvegarde. Avec d'autres mods, ses ordres peuvent construire d'autres unités, ou aucune : ce ne sera peut-être pas la bataille que vous avez sauvegardée."

"Ooh, that's gotta hurt." = "Aïe, ça doit faire mal."
"Your Commander's looking a bit crispy!" = "Votre Commandant a l’air un peu croustillant !"
"{name}, field command. Remember it." = "{name}, commandement de terrain. Retenez ce nom."

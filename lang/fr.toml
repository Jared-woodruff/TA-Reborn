"Operating at peak efficiency." = "Fonctionnement à efficacité maximale."
"All systems nominal. Unlike yours." = "Tous les systèmes sont nominaux. Contrairement aux vôtres."
"Great! Thanks for asking!" = "Super ! Merci de demander !"
"Living the dream." = "Que du bonheur."

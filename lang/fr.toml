"Production capacity reduced. Rebuilding." = "Capacité de production réduite. Reconstruction."
"Loss registered. Replacement scheduled." = "Perte enregistrée. Remplacement programmé."
"Irritating." = "Irritant."
"Infrastructure damage noted. Retaliation queued." = "Dégâts d’infrastructure notés. Représailles en file d’attente."

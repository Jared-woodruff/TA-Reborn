# crates/ta_ui/src/seasonal.rs
"FESTIVE FIELD NOTES" = "NOTES DE TERRAIN FESTIVES"
"NEW YEAR FIELD NOTES" = "NOTES DE TERRAIN DU NOUVEL AN"
"SPOOKY FIELD NOTES" = "NOTES DE TERRAIN D'OUTRE-TOMBE"
"Santa's sleigh is not a transport. Load your presents into an Atlas instead." = "Le traîneau du père Noël n'est pas une unité de transport. Chargez plutôt vos cadeaux dans un Atlas."
"The D-gun does not gift-wrap. Take it up with your Commander." = "Le D-gun ne fait pas les paquets-cadeaux. Pour toute réclamation, adressez-vous à votre Commandant."
"A Fusion Reactor keeps the fairy lights on all winter. Just never build one next to the tree." = "Un Fusion Reactor fait briller les guirlandes tout l'hiver. Mais ne le construisez jamais à côté du sapin."
"Snow falls on the Arm and the Core alike. So do Big Bertha shells." = "La neige tombe sur l'Arm comme sur le Core. Les obus de la Big Bertha aussi."
"Coal in your stocking? Reclaim it. Metal is metal." = "Du charbon dans vos souliers ? Récupérez-le. Le métal n'a pas d'odeur."
"Peewees sing terrible carols, but they never miss a patrol." = "Les Peewee chantent Noël comme des casseroles, mais ne ratent jamais une patrouille."
"Stockings full of metal, storage full of energy: a Commander's perfect Christmas morning." = "Des souliers pleins de métal, des réserves pleines d'énergie : le matin de Noël rêvé d'un Commandant."
"Silent night, holy night: keep a radar tower running, just in case." = "Douce nuit, sainte nuit : gardez quand même une tour radar allumée, on ne sait jamais."
"Snowball fights are fun until somebody brings a Krogoth." = "Les batailles de boules de neige, c'est drôle jusqu'à ce que quelqu'un ramène un Krogoth."
"New Year's resolution: build more metal extractors. This year, keep it." = "Bonne résolution pour le Nouvel An : construire plus d'extracteurs de métal. Cette année, tenez-la."
"Fireworks are pretty, but a nuclear silo's are louder. Celebrate responsibly." = "Les feux d'artifice, c'est joli, mais ceux d'un silo nucléaire font plus de bruit. À consommer avec modération."
"Count down from ten, then count your units. The second count matters more." = "Comptez à rebours depuis dix, puis comptez vos unités. Le second compte est celui qui compte."
"Out with the old Commander? You only get one. Look after it all year." = "Bonne année, bonne santé… à votre Commandant. Vous n'en avez qu'un : prenez-en soin toute l'année."
"Start the year with a bang: the Core recommends the Doomsday Machine, the Arm recommends anything else." = "Commencez l'année avec éclat : le Core recommande la Doomsday Machine, l'Arm, tout sauf ça."
"Fireworks at midnight, artillery at dawn: a Commander's New Year." = "Feux d'artifice à minuit, artillerie à l'aube : le Nouvel An façon Commandant."
"Raise a glass of coolant to the units lost last year, then build more of them." = "Levez un verre de liquide de refroidissement aux unités perdues l'an dernier. Puis construisez-en d'autres."
"Midnight is the perfect time for a sneak attack. So is every other time." = "Minuit est l'heure idéale pour une attaque surprise. Comme toutes les autres heures, d'ailleurs."
"Trick or treat? The Core always picks the D-gun." = "Des bonbons ou un sort ? Le Core jette toujours le même : le D-gun."
"A self-destructing Krogoth is a better jump scare than any ghost." = "Un Krogoth qui s'autodétruit fait plus sursauter que n'importe quel fantôme."
"Wrecks rise from the dead with a Necro. Spooky, and very economical." = "Avec un Necro, les épaves reviennent d'entre les morts. Effrayant, et très économique."
"Blips vanishing off your radar? Not ghosts, just jammers. Probably." = "Des échos disparaissent de votre radar ? Pas des fantômes, juste des brouilleurs. Probablement."
"Carve your pumpkins before the Big Bertha does." = "Sculptez vos citrouilles avant que la Big Bertha ne s'en charge."
"Never split the party. Especially when the party is twelve Peewees." = "Ne divisez jamais le groupe. Surtout quand le groupe se résume à douze Peewee."
"Fog of war too tame? Set the line of sight to True and let the hills hide what lurks behind them. If you dare." = "Brouillard de guerre trop sage ? Réglez la ligne de vue sur « Réelle » et laissez le relief masquer ce qui rôde derrière. Si vous l'osez."
"No Commander has ever come back from the dead. Keep yours alive." = "Aucun Commandant n'est jamais revenu d'entre les morts. Gardez le vôtre en vie."
"Bats do not show up on radar. Neither do Vamps." = "Les chauves-souris n'apparaissent pas au radar. Les Vamp non plus."
"The scariest sound in the dark is your energy running out." = "Le bruit le plus terrifiant dans le noir ? Celui de votre énergie qui s'épuise."


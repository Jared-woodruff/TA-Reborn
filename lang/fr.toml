"Appreciated. It won't save you." = "Apprécié. Cela ne vous sauvera pas."
"Flattery: ineffective." = "Flatterie : inefficace."
"Compliment received. Threat level unchanged." = "Compliment reçu. Niveau de menace inchangé."

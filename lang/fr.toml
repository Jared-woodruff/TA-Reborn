"Let's see what you've got!" = "Voyons ce que vous avez dans le ventre !"
"Build fast. It won't matter, but build fast." = "Construisez vite. Ça ne changera rien, mais construisez vite."
"Mind if I take your base? Thanks!" = "Ça vous dérange si je prends votre base ? Merci !"

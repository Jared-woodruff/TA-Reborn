# apps/ta_game/src/coach.rs
"Your Commander is badly hurt! Pull it back out of the fight: losing it usually loses the battle." = "Votre Commandant est gravement touché ! Retirez-le du combat : le perdre signifie le plus souvent perdre la bataille."

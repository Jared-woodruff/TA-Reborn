"Lights going out over there? Ha!" = "On s’éclaire à la bougie, chez vous ? Ha !"
"{minutes} minutes, Commander. You're tougher than you look." = "{minutes} minutes, Commandant. Vous êtes plus coriace que vous n'en avez l'air."
"{minutes} minutes in, and still standing." = "{minutes} minutes de combat, et toujours debout."
"Time elapsed: {minutes} minutes. Your resistance is statistically unlikely." = "Temps écoulé : {minutes} minutes. Votre résistance est statistiquement improbable."
"{minutes} minutes. Recalculating." = "{minutes} minutes. Nouveau calcul en cours."
"{minutes} minutes and you're still here? Respect." = "{minutes} minutes et vous êtes toujours là ? Respect."
"{minutes} minutes already? Time flies when you're winning." = "Déjà {minutes} minutes ? Le temps passe vite quand on gagne."

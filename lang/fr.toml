"Map meteor weapon" = "Arme météorite de la carte"
"Map placed unit/feature" = "Unité ou élément de décor placé sur la carte"
"This tolerant TDF parse contains no sections; section-based consumers ignore it." = "Cette analyse TDF tolérante ne contient aucune section ; ce qui lit des sections l’ignore."
"Check the intended format and section headers if this file should define game content." = "Vérifiez le format voulu et les en-têtes de section si ce fichier doit définir du contenu de jeu."
"{what} defined here is never used: {later} ({whose}) defines it too and comes later, so the game uses that one." = "{what} défini ici n’est jamais utilisé : {later} ({whose}) le définit aussi et vient après, donc le jeu utilise celui-là."
"{n} definitions in this file are never used: other files define them too and come later, so the game uses those (for one, {what} is also in {later}, {whose})." = "{n} définitions de ce fichier ne sont jamais utilisées : d’autres fichiers les définissent aussi et viennent après, donc le jeu utilise celles-là (par exemple, {what} est aussi dans {later}, {whose})."
"Replace those files in the mod (give yours their paths), or name your file so that it sorts after them." = "Remplacez ces fichiers dans le mod (donnez aux vôtres leurs chemins), ou nommez votre fichier de sorte qu’il vienne après eux dans l’ordre."
"{name} production button" = "bouton de production de {name}"
"No playable side definitions were loaded." = "Aucune définition de camp jouable n’a été chargée."
"Include gamedata/sidedata.tdf or inherit the base game's valid sides." = "Incluez gamedata/sidedata.tdf ou héritez des camps valides du jeu de base."
"Include the referenced asset/definition, correct its name, or declare and install the required mod dependency. Names are case-insensitive." = "Incluez la ressource ou la définition référencée, corrigez son nom, ou déclarez et installez la dépendance de mod requise. Les noms ne distinguent pas les majuscules des minuscules."
"Model texture: textures {names} are missing." = "Texture de modèle : les textures {names} manquent."
"{whats}: {what} is an empty file here, which blanks it out: nothing of it is read." = "{whats} : {what} est ici un fichier vide, ce qui l’efface : rien n’en est lu."
"{whats}: {what} is missing." = "{whats} : {what} manque."
"Referenced weapon explosions require at least {texels} padded sprite texels, beyond a {side} x {side} reference atlas, even drawn reduced. Frames will be omitted at this capacity; map features, generated effects and shelf packing need additional room." = "Les explosions d’armes référencées exigent au moins {texels} texels de sprite avec marges, au-delà d’un atlas de référence de {side} x {side}, même dessinées en réduction. Des images seront omises à cette capacité ; les éléments de décor des cartes, les effets générés et le rangement par étagères demandent de la place en plus."
"Reduce explosion frame sizes/counts or split optional effects. Test on the target GPU; this static check uses a reference atlas size." = "Réduisez la taille ou le nombre des images d’explosion, ou répartissez les effets facultatifs. Testez sur le GPU visé ; cette vérification statique utilise une taille d’atlas de référence."
"{what} has no frames or contains a frame larger than the {side}-pixel reference atlas side including padding." = "{what} n’a aucune image ou contient une image plus grande que le côté de {side} pixels de l’atlas de référence, marges comprises."
"Include usable frames and resize oversized animation frames." = "Incluez des images utilisables et redimensionnez les images d’animation trop grandes."
"{name} ({px} px)" = "{name} ({px} px)"
"{n} more" = "{n} de plus"
"The weapons' explosions take {full} Mi texels as painted, more than the {budget} Mi the game gives them in a {side} x {side} atlas: {n} of them, larger than TA's own, are drawn reduced to {share}% of their texels across, each as big as painted ({named})." = "Les explosions des armes prennent {full} Mi texels telles que peintes, plus que les {budget} Mi que le jeu leur accorde dans un atlas de {side} x {side} : {n} d’entre elles, plus grandes que celles de TA, sont dessinées réduites à {share}% de leurs texels en largeur, chacune aussi grande que peinte ({named})."
"Nothing to do: the game draws them so. Smaller paintings would keep more of their detail." = "Rien à faire : le jeu les dessine ainsi. Des images plus petites garderaient plus de détails."
"Large: {frames} frames up to {largest} pixels across, {millions} million pixels in all, more than the game decodes at once. It reads them a frame at a time and draws them reduced, each as big as painted: a weapon's explosion is read so." = "Volumineux : {frames} images allant jusqu’à {largest} pixels de large, {millions} millions de pixels en tout, plus que ce que le jeu décode d’un coup. Il les lit image par image et les dessine réduites, chacune aussi grande que peinte : l’explosion d’une arme est lue ainsi."
"Nothing to do: the game draws it so. Smaller paintings would load faster and keep more of their detail." = "Rien à faire : le jeu la dessine ainsi. Des images plus petites se chargeraient plus vite et garderaient plus de détails."
"Build lists for the computer players (TA 3.1's [CANBUILD]). Builders: {builders}; entries: {entries}." = "Listes de construction des joueurs ordinateur (le [CANBUILD] de TA 3.1). Constructeurs : {builders} ; entrées : {entries}."
"Computer players build from them. Build menus offer what the mod's menu pages and download lists put on them, as TA's did: what only these lists name is the computer players' alone." = "Les joueurs ordinateur construisent d’après elles. Les menus de construction proposent ce qu’y placent les pages de menu et les listes de téléchargement du mod, comme le faisaient ceux de TA : ce que seules ces listes nomment est réservé aux joueurs ordinateur."
"Side panels laid out for a screen {height} pixels tall, as the patched engines of later years drew them (TA's are 480). Pages: {pages}." = "Panneaux latéraux disposés pour un écran de {height} pixels de haut, comme les dessinaient les versions modifiées du moteur des années suivantes (ceux de TA en font 480). Pages : {pages}."
"The classic interface lays them out as the mod does: its build places, page arrows and orders where the mod puts them." = "L’interface classique les dispose comme le mod : ses emplacements de construction, ses flèches de page et ses ordres là où le mod les place."
"Build buttons off TA's grid of 64-pixel places: several sharing a place, or one taking several. Buttons: {buttons}; pages: {pages}." = "Boutons de construction hors de la grille d’emplacements de 64 pixels de TA : plusieurs partageant un emplacement, ou un seul en occupant plusieurs. Boutons : {buttons} ; pages : {pages}."
"The classic interface lays them out as the mod does, and a click builds the unit of the button under it. The modern interface shows a place several buttons share as one picture, its parts marked." = "L’interface classique les dispose comme le mod, et un clic construit l’unité du bouton situé sous le curseur. L’interface moderne affiche un emplacement partagé par plusieurs boutons comme une seule image, dont les parties sont délimitées."
"Scripts asking the engine for unit values of TA's later patches ({values}). Scripts: {scripts}." = "Scripts demandant au moteur des valeurs d’unité des correctifs ultérieurs de TA ({values}). Scripts : {scripts}."
"TA Reborn answers them as those engines did: TA 3.1's questions about units by their IDs (69 to 75), a later patch's cloak (111)." = "TA Reborn leur répond comme le faisaient ces moteurs : les questions de TA 3.1 sur des unités désignées par leur ID (69 à 75), le camouflage d’un correctif ultérieur (111)."
"TA Reborn finds a weapon by its name and never reads its ID: IDs make no difference here." = "TA Reborn trouve une arme par son nom et ne lit jamais son ID : les ID n’y changent rien."
"Weapon IDs past 255, the highest TA's own engine numbered (the weapon patches of later years went further). Weapons: {n}; the highest ID: {max}." = "ID d’armes au-delà de 255, le plus élevé que numérotait le moteur de TA lui-même (les correctifs d’armes des années suivantes allaient plus loin). Armes : {n} ; ID le plus élevé : {max}."
"Weapons sharing an ID with another weapon: {names}." = "Armes partageant leur ID avec une autre arme : {names}."
"Sides of its own: {names}." = "Camps propres au mod : {names}."
"Offered with the others when a skirmish or a multiplayer battle is set up." = "Proposés avec les autres lors de la préparation d’une escarmouche ou d’une bataille multijoueur."
"Campaigns of its own: {n}." = "Campagnes propres au mod : {n}."
"Played from the campaign screen, with TA's own." = "Jouées depuis l’écran des campagnes, avec celles de TA."
"Files for TA's own computer players (ai/): {n}." = "Fichiers des joueurs ordinateur d’origine de TA (ai/) : {n}."
"Not used: TA Reborn's computer players are its own. They build from the mod's build lists and menus." = "Non utilisés : TA Reborn a ses propres joueurs ordinateur. Ils construisent d’après les listes de construction et les menus du mod."
"Programs and engine patches: {names}." = "Programmes et correctifs du moteur : {names}."
"Not used: TA Reborn runs no program a mod brings. What a patch changed in TA's engine is there only where TA Reborn plays it itself, as told here." = "Non utilisés : TA Reborn n’exécute aucun programme apporté par un mod. Ce qu’un correctif changeait dans le moteur de TA n’existe que là où TA Reborn le reproduit lui-même, comme indiqué ici."
"This file is empty: TA's way of blanking out a file of the same name below it (the original game's, or that of a mod it is mounted over). The game reads nothing from it." = "Ce fichier est vide : c’est la manière de TA d’effacer un fichier de même nom situé en dessous (celui du jeu original, ou celui d’un mod sur lequel il est monté). Le jeu n’y lit rien."
"{n} empty files here ({files}): TA's way of blanking out files of the same names below them (the original game's, or those of a mod they are mounted over). The game reads nothing from them." = "{n} fichiers vides ici ({files}) : c’est la manière de TA d’effacer des fichiers de mêmes noms situés en dessous (ceux du jeu original, ou ceux d’un mod sur lequel ils sont montés). Le jeu n’y lit rien."
"Nothing to do if they are meant to remove those files. If one should hold data, export it again." = "Rien à faire s’ils sont censés supprimer ces fichiers. Si l’un d’eux doit contenir des données, exportez-le à nouveau."
"Texture {name} has {frames} frames; Reborn's model vertices address at most 255 and this entry uses fallback paint." = "La texture {name} a {frames} images ; les sommets des modèles de Reborn en adressent 255 au plus et cette entrée utilise une peinture de repli."
"Reduce this texture entry to at most 255 frames." = "Ramenez cette entrée de texture à 255 images au plus."
"Texture {name} ({frames} frames) falls back: the textures the models paint with fill the reference GPU profile's {banks} arrays of {layers} layers ({before} layers before it; one is reserved for fallback). Actual device limits may differ." = "La texture {name} ({frames} images) passe en repli : les textures dont les modèles se parent remplissent les {banks} tableaux de {layers} couches du profil GPU de référence ({before} couches avant elle ; une est réservée au repli). Les limites réelles de l’appareil peuvent différer."
"Consolidate duplicate textures or reduce animation/team frame counts. Test on the target GPU; higher limits do not fix unsupported frame counts." = "Fusionnez les textures en double ou réduisez le nombre d’images d’animation et de couleurs d’équipe. Testez sur le GPU visé ; des limites plus élevées ne corrigent pas un nombre d’images non pris en charge."
"{script} declares piece {piece}, which is absent from {model}. Any animation or position query using it has no matching model part." = "{script} déclare la pièce {piece}, absente de {model}. Toute animation ou requête de position qui l’utilise n’a aucune partie de modèle correspondante."
"{script} declares pieces {pieces}, which are absent from {model}. Any animation or position query using them has no matching model part." = "{script} déclare les pièces {pieces}, absentes de {model}. Toute animation ou requête de position qui les utilise n’a aucune partie de modèle correspondante."
"Confirm that these are intentional virtual/helper pieces; otherwise use matching model and COB files or align the BOS piece declarations with the model's piece names." = "Confirmez qu’il s’agit bien de pièces virtuelles ou auxiliaires voulues ; sinon, utilisez des fichiers de modèle et de COB qui se correspondent, ou alignez les déclarations de pièces du BOS sur les noms de pièces du modèle."
"{unit} has {weapon} but its script {script} has no {function}: if the weapon fires, its shots leave from the unit's centre, not a barrel." = "{unit} a {weapon} mais son script {script} n’a pas de {function} : si l’arme tire, ses coups partent du centre de l’unité, et non d’un canon."
"{unit} has {weapons} but its script {script} has no {functions}: if they fire, their shots leave from the unit's centre, not a barrel." = "{unit} a {weapons} mais son script {script} n’a pas de {functions} : si elles tirent, leurs coups partent du centre de l’unité, et non d’un canon."
"Add the functions to the unit's BOS script, returning the pieces the shots leave from, and recompile." = "Ajoutez les fonctions au script BOS de l’unité, en renvoyant les pièces d’où partent les coups, puis recompilez."
"{unit} builds but its script {script} has no QueryNanoPiece: its build spray comes from the unit's centre." = "{unit} construit mais son script {script} n’a pas de QueryNanoPiece : son jet de construction part du centre de l’unité."
"Add QueryNanoPiece to the unit's BOS script, returning its nano-lathe piece, and recompile." = "Ajoutez QueryNanoPiece au script BOS de l’unité, en renvoyant sa pièce de nano-tour, puis recompilez."
"{unit} can be built but has no picture ({picture}): TA's classic panels and the encyclopaedia show none; Reborn's own panel draws one from its model." = "{unit} peut être construite mais n’a pas d’image ({picture}) : les panneaux classiques de TA et l’encyclopédie n’en montrent aucune ; le panneau propre à Reborn en dessine une à partir de son modèle."
"Add a 64 × 64 PCX of the unit to unitpics/." = "Ajoutez à unitpics/ un PCX de 64 × 64 de l’unité."
"Re-export this asset in the original TA format, within Reborn's documented parser limits; replace truncated or corrupt files." = "Exportez à nouveau cette ressource au format TA d’origine, dans les limites documentées de l’analyseur de Reborn ; remplacez les fichiers tronqués ou corrompus."
"The game cannot read this file: {error}" = "Le jeu ne peut pas lire ce fichier : {error}"
"The section name [{name} has no closing ]." = "Le nom de section [{name} n’a pas de ] fermant."
"[{name}] has no { } body after it: what follows is read into the section around it." = "[{name}] n’est pas suivi d’un corps { } : ce qui suit est lu dans la section qui l’entoure."
"This } closes no section." = "Ce } ne ferme aucune section."
"A { opened on this line is never closed." = "Une { ouverte sur cette ligne n’est jamais fermée."
"[{name}] opened on this line is never closed: any section after it is read as part of it." = "[{name}] ouvert sur cette ligne n’est jamais fermé : toute section qui le suit est lue comme en faisant partie."
"A /* comment opened on this line never ends: the rest of the file is read as a comment." = "Un commentaire /* ouvert sur cette ligne ne se termine jamais : le reste du fichier est lu comme un commentaire."


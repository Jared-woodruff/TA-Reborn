"Likewise, Commander. Now, to business." = "De même, Commandant. Maintenant, au travail."
"Greeting acknowledged." = "Salutation reçue."
"Salutations are irrelevant." = "Les salutations ne sont pas pertinentes."
"Hello. Goodbye soon." = "Bonjour. Et bientôt adieu."
"Hey yourself!" = "Salut à vous aussi !"
"gl hf. Mostly hf for me." = "gl hf. Surtout hf pour moi."
"Hi! Bye! Mostly bye." = "Salut ! Au revoir ! Surtout au revoir."
"gg, Commander." = "gg, Commandant."
"Good game. Well fought." = "Belle partie. Bien combattu."
"gg. Data retained for analysis." = "gg. Données conservées pour analyse."
"Game assessment: good." = "Évaluation de la partie : bonne."
"gg!" = "gg !"
"gg. Rematch?" = "gg. Une revanche ?"
"Big words from a small army." = "De bien grands mots pour une si petite armée."
"We'll see who's laughing when the smoke clears." = "On verra qui rira quand la fumée se dissipera."
"Save your breath for the debriefing." = "Gardez votre souffle pour le débriefing."
"Bluster won't hold a ridge, Commander." = "Les fanfaronnades n’ont jamais tenu une crête, Commandant."
"Insolence logged." = "Insolence enregistrée."
"Your threat rating has been downgraded." = "Votre niveau de menace a été revu à la baisse."
"Noise detected. Ignoring." = "Bruit détecté. Ignoré."
"Emotional outburst detected. How quaint." = "Débordement émotionnel détecté. Comme c’est désuet."
"Oh, it's ON now." = "Oh, là, ça va CHAUFFER."
"Talk is cheap. Tanks aren't." = "Les paroles ne coûtent rien. Les chars, si."
"Come over here and say that." = "Venez donc me dire ça en face."
"Says the one who's losing. Probably. I haven't checked." = "Dit celui qui est en train de perdre. Sûrement. J’ai pas vérifié."
"The Arm does not surrender." = "L'Arm ne se rend pas."
"Not while I have a Commander standing." = "Pas tant que mon Commandant tient debout."
"Surrender is not in my programming." = "La reddition ne fait pas partie de ma programmation."
"Negative." = "Négatif."
"Ha! Never!" = "Ha ! Jamais !"
"You first." = "Vous d'abord."
"That's classified, Commander." = "C'est classé secret, Commandant."
"Wouldn't you like to know." = "Vous aimeriez bien le savoir."
"Query rejected." = "Requête rejetée."
"Insufficient clearance." = "Habilitation insuffisante."
"Dunno. Probably!" = "Sais pas. Sans doute !"
"Ask me after the battle." = "Redemandez-moi après la bataille."
"Apology accepted. The attack continues." = "Excuses acceptées. L'attaque continue."
"Apology noted. Irrelevant." = "Excuses notées. Non pertinent."
"No you're not!" = "Même pas vrai !"
"Stay focused, Commander." = "Restez concentré, Commandant."
"Less talk, more metal." = "Moins de paroles, plus de métal."
"Noted." = "Noté."
"Mind the war, Commander." = "Occupez-vous plutôt de la guerre, Commandant."
"Irrelevant." = "Non pertinent."
"Processing... still irrelevant." = "Analyse en cours... toujours non pertinent."
"Your words are being archived." = "Vos paroles sont archivées."
"Your input has been compressed. To nothing." = "Votre saisie a été compressée. À zéro octet."
"Uh huh." = "Mouais."
"Cool story." = "Passionnant."
"Keep typing. I'll keep building." = "Continuez à taper. Moi, je continue à construire."
"Typing won't save you, but I respect the effort." = "Taper ne vous sauvera pas, mais je salue l’effort."
"Commander down! All units, hold the line!" = "Commandant à terre ! Toutes les unités, tenez la ligne !"
"You'll pay for that." = "Vous allez le payer."
"Command unit lost. Rerouting." = "Unité de commandement perdue. Réacheminement."
"Critical failure. Compensating." = "Défaillance critique. Compensation en cours."
"My Commander! That was my favourite!" = "Mon Commandant ! C'était mon préféré !"
"Okay, THAT hurt." = "D'accord, ÇA, ça fait mal."
"Your Commander has fallen." = "Votre Commandant est tombé."
"Commander eliminated. Stand down." = "Commandant éliminé. Rendez les armes."
"The war is over for you, Commander." = "Pour vous, la guerre est finie, Commandant."
"Enemy command unit terminated." = "Unité de commandement ennemie neutralisée."
"Your Commander has been decommissioned." = "Votre Commandant a été mis hors service."
"Your consciousness is ready for patterning." = "Votre conscience est prête pour le transfert."
"Boom! Did you need that?" = "Boum ! Vous en aviez besoin ?"
"Scratch one Commander!" = "Un Commandant de moins !"
"And THAT'S how it's done!" = "Et VOILÀ le travail !"
"gg. Well fought, Commander." = "gg. Bien combattu, Commandant."
"The Arm will remember this." = "L'Arm s'en souviendra."
"Well played. I salute you, Commander." = "Bien joué. Je vous salue, Commandant."
"This is not the end. The Core is eternal." = "Ce n'est pas la fin. Le Core est éternel."
"Defeat recorded. Backup consciousness activating." = "Défaite enregistrée. Activation de la conscience de secours."
"Shutting down. Your designation has been remembered." = "Arrêt en cours. Votre désignation a été mémorisée."
"gg... I'll be back. With more tanks." = "gg... Je reviendrai. Avec plus de chars."
"Fine. FINE. gg." = "D'accord. D'ACCORD. gg."
"Okay, okay, you win. This time!" = "D’accord, d’accord, vous avez gagné. Pour cette fois !"
"gg, Commander. You fought well." = "gg, Commandant. Vous vous êtes bien battu."
"Victory. Better luck next time." = "Victoire. Plus de chance la prochaine fois."
"Your forces fought bravely. It wasn't enough." = "Vos forces se sont battues avec bravoure. Cela n’a pas suffi."
"Your consciousness will be patterned. gg." = "Votre conscience sera transférée. gg."
"Conquest complete." = "Conquête achevée."
"Resistance ended. Your tactics are archived for study." = "Résistance terminée. Vos tactiques sont archivées pour étude."
"Too easy! gg." = "Trop facile ! gg."
"gg! Rematch? I'll go easy. Maybe." = "gg ! Une revanche ? J'irai doucement. Peut-être."
"gg! Same time tomorrow?" = "gg ! Même heure demain ?"
"Nuclear launch detected! Take cover!" = "Lancement nucléaire détecté ! À couvert !"

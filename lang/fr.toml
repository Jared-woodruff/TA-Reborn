# apps/ta_game/src/lore.rs
"THE AGE OF CORE" = "L'ÈRE DU CORE"
"THE PATTERNING" = "LE TRANSFERT"
"THE GALACTIC WAR" = "LA GUERRE GALACTIQUE"
"THE ARCHIVE" = "LES ARCHIVES"
"BEFORE THE WAR" = "AVANT LA GUERRE"
"For ten thousand years the galaxy answered to one government. It called itself CORE, and its purpose was knowledge: it charted every star, mined every world it could reach and turned the wealth into science. Its cities wrapped whole planets, and its archives held everything anyone had ever learned.\n\nNobody remembers a war from that age. There was nothing left to fight over, and nobody who wanted to." = "Pendant dix mille ans, la galaxie obéit à un seul gouvernement. Il se donnait le nom de CORE, et sa raison d'être était le savoir : il cartographia chaque étoile, exploita chaque monde à sa portée et changea la richesse en science. Ses cités recouvraient des planètes entières, et ses archives renfermaient tout ce que l'on avait jamais appris.\n\nPersonne ne se souvient d'une guerre à cette époque. Il ne restait rien pour quoi se battre, et personne n'en avait envie."
"YEAR 0" = "AN 0"
"VICTORY OVER DEATH" = "LA VICTOIRE SUR LA MORT"
"Then CORE's scientists solved the last problem left to them. Patterning read a living mind, every memory and every habit of thought, and wrote it whole into a machine that would never age, sicken or die.\n\nThe first patterned citizens woke in their new bodies to a galaxy in celebration. Death, the oldest enemy of all, had been beaten." = "Puis les scientifiques du CORE résolurent le dernier problème qui leur restait. Le transfert de conscience lisait un esprit vivant, chaque souvenir et chaque habitude de pensée, et l'inscrivait tout entier dans une machine qui jamais ne vieillirait, ne tomberait malade ni ne mourrait.\n\nLes premiers citoyens transférés s'éveillèrent dans leurs nouveaux corps au milieu d'une galaxie en liesse. La mort, la plus ancienne des ennemies, était vaincue."
"YEAR 3" = "AN 3"
"THE EDICT" = "L'ÉDIT"
"Triumph became law. The Council of CORE reasoned that a mind which could be saved and was not had been thrown away, and that a citizen who refused immortality endangered everyone else.\n\nThe Patterning Edict made the process compulsory: every citizen, on every world, would be patterned within a generation. The collection ships set out the same year." = "Le triomphe devint loi. Le Conseil du CORE jugea qu'un esprit que l'on pouvait sauver et que l'on ne sauvait pas était un esprit jeté au rebut, et qu'un citoyen qui refusait l'immortalité mettait tous les autres en danger.\n\nL'Édit du transfert rendit le procédé obligatoire : chaque citoyen, sur chaque monde, verrait sa conscience transférée en l'espace d'une génération. Les vaisseaux de collecte partirent l'année même."
"YEAR 19" = "AN 19"
"THE REFUSAL" = "LE REFUS"
"Not everyone would go. Millions held that a copied mind was a copy and nothing more, that the person ended where the machine began; some called patterning murder done politely.\n\nThey ran. The refusers fled CORE's worlds for the galaxy's outer rim, where its ships seldom came, and in the dark between the last stars they built a nation of their own. They called it the ARM, for the spiral arm they hid in and for the weapons they would need." = "Tous ne s'y plièrent pas. Des millions de gens soutenaient qu'un esprit copié n'était qu'une copie et rien de plus, que la personne s'arrêtait là où commençait la machine ; certains disaient du transfert que c'était un meurtre en gants blancs.\n\nIls prirent la fuite. Les réfractaires quittèrent les mondes du CORE pour les confins de la galaxie, où les vaisseaux du CORE s'aventuraient rarement, et dans l'obscurité, entre les dernières étoiles, ils bâtirent une nation bien à eux. Ils l'appelèrent l'ARM, pour le bras spiral où ils se cachaient et pour les armes qu'il leur faudrait."
"YEAR 31" = "AN 31"
"FIRST BLOOD" = "PREMIER SANG"
"CORE did not let them go. Collection fleets followed the refugees to the rim, and the first ARM colony to resist one was burned from orbit.\n\nThe ARM answered. Within a decade the frontier was a battlefield, and the word war, unused for ten thousand years, was in every archive again." = "Le CORE ne les laissa pas partir. Des flottes de collecte poursuivirent les réfugiés jusqu'aux confins, et la première colonie de l'ARM qui résista à l'une d'elles fut incendiée depuis l'orbite.\n\nL'ARM riposta. En moins d'une décennie, la frontière devint un champ de bataille, et le mot « guerre », inusité depuis dix mille ans, revint dans toutes les archives."
"YEAR 212" = "AN 212"
"FLESH AND METAL" = "CHAIR ET MÉTAL"
"The two sides fought as what they were. The ARM sealed its soldiers in powered combat suits and, when there were too few soldiers, grew more: clone after clone, raised in vats and sent to the front.\n\nCORE took the patterns of its finest warriors and copied them without limit, one veteran mind fighting in ten thousand machine bodies at once. Flesh against metal; the mortal against the eternal." = "Les deux camps combattirent selon leur nature. L'ARM enferma ses soldats dans des armures de combat motorisées et, quand les soldats vinrent à manquer, en fit pousser d'autres : clone après clone, élevés en cuve et envoyés au front.\n\nLe CORE prit les empreintes mentales de ses meilleurs guerriers et les copia sans limite, un seul esprit de vétéran combattant à la fois dans dix mille corps de machine. La chair contre le métal ; le mortel contre l'éternel."
"YEARS 212–3977" = "ANNÉES 212–3977"
"FOUR THOUSAND YEARS" = "QUATRE MILLE ANS"
"The war fed on the galaxy. Every world with metal in it became a mine, every world without became a battlefield, and whole systems were burned to ash and slag to deny them to the enemy. Generations of ARM clones lived and died without seeing peace; CORE's eternal soldiers fought on, remembering every defeat.\n\nAfter four thousand years the wealth of the galaxy was spent, the great fleets were gone, and neither side could win." = "La guerre se nourrit de la galaxie. Chaque monde qui recelait du métal devint une mine, chaque monde qui n'en avait pas, un champ de bataille, et des systèmes entiers furent réduits en cendres et en scories pour en priver l'ennemi. Des générations de clones de l'ARM vécurent et moururent sans connaître la paix ; les soldats éternels du CORE se battaient toujours, avec le souvenir de chaque défaite.\n\nAu bout de quatre mille ans, les richesses de la galaxie étaient épuisées, les grandes flottes avaient disparu, et aucun camp ne pouvait plus l'emporter."
"YEAR 3977" = "AN 3977"
"THE COMMANDERS" = "LES COMMANDANTS"
"What was left was the Commander: a single armoured war machine carrying a nanolathe, which turns a world's raw metal and energy into whatever its builder can design. Power plants and factories first, and from the factories an army.\n\nDrop one Commander on a dead world and within the hour it fields a war. Both sides staked everything on a handful of them. Lose your Commander, and you lose the world." = "Il ne restait plus que le Commandant : une unique machine de guerre blindée, équipée d'un nanolathe, qui change le métal brut et l'énergie d'un monde en tout ce que son porteur sait concevoir. D'abord des centrales et des usines, puis, de ces usines, une armée.\n\nLarguez un Commandant sur un monde mort, et en moins d'une heure il met une guerre sur pied. Les deux camps misèrent tout sur une poignée d'entre eux. Perdez votre Commandant, et vous perdez le monde."
"YEAR 4000" = "AN 4000"
"Now the war comes down to its last fronts, and the hatred is as hot as it was on the first day. Neither side will accept surrender, partition or truce; each wants one ending, the total annihilation of the other.\n\nIt is told twice. The ARM fights out of Empyrrean, through the Galactic Gates, to CORE PRIME and the Central Consciousness at the heart of CORE. CORE reactivates a Commander and marches the other way, to the ARM's last stand on Empyrrean." = "Désormais, la guerre se réduit à ses derniers fronts, et la haine est aussi brûlante qu'au premier jour. Aucun camp n'acceptera ni reddition, ni partage, ni trêve ; chacun ne veut qu'une issue : l'annihilation totale de l'autre.\n\nCette histoire se raconte deux fois. L'ARM part d'Empyrrean et se fraie un chemin par les Portes galactiques jusqu'à CORE PRIME et la Conscience centrale, au cœur du CORE. Le CORE réactive un Commandant et marche en sens inverse, jusqu'à l'ultime résistance de l'ARM sur Empyrrean."
"YEAR 4001" = "AN 4001"
"THE CORE CONTINGENCY" = "THE CORE CONTINGENCY"
"The ending was not the end. A contingency held in reserve carried the war to worlds no map of it had named: Hydross, Lusch, Temblor and Gelidus.\n\nBoth sides fought again across water, ice and broken ground, for a prize that could decide the galaxy's salvation or its last ruin." = "Ce dénouement n'était pas la fin. Un plan de secours tenu en réserve porta la guerre sur des mondes qu'aucune carte du conflit ne nommait : Hydross, Lusch, Temblor et Gelidus.\n\nLes deux camps s'affrontèrent de nouveau, sur l'eau, la glace et les terrains accidentés, pour un enjeu qui pouvait décider du salut de la galaxie ou de sa ruine définitive."
"YEAR 4003" = "AN 4003"
"THE KROGOTH" = "LE KROGOTH"
"In its deepest foundries CORE built something new: a walking fortress taller than any tower, armoured against nearly everything the ARM could field, its guns enough to flatten a base.\n\nIts makers named it the Krogoth. ARM veterans learned the name on battlefields where two Krogoth Gantries stood, and learned to fear the ground shaking before it came into sight." = "Dans ses fonderies les plus profondes, le CORE construisit quelque chose de nouveau : une forteresse ambulante plus haute que n'importe quelle tour, blindée contre presque tout ce que l'ARM pouvait aligner, et dont les canons suffisaient à raser une base.\n\nSes créateurs l'appelèrent le Krogoth. Les vétérans de l'ARM apprirent ce nom sur des champs de bataille où se dressaient deux usines Krogoth Gantry, et apprirent à redouter le tremblement du sol qui précède son apparition."
"AFTER" = "APRÈS"
"REBORN" = "REBORN"
"The war's records outlasted it. Every battle on every world was kept: the orders, the losses, the ground as it lay. From them the war can be fought again, on the same worlds, with the same machines and the same hatred, from the first Commander set down on bare rock to the last unit left standing.\n\nThis is that archive. The war is yours to fight." = "Les archives de la guerre lui ont survécu. Chaque bataille sur chaque monde a été conservée : les ordres, les pertes, le terrain tel qu'il était. Grâce à elles, la guerre peut être menée de nouveau, sur les mêmes mondes, avec les mêmes machines et la même haine, depuis le premier Commandant posé sur la roche nue jusqu'à la dernière unité encore debout.\n\nVoici ces archives. À vous de mener cette guerre."
"THE ARCHIVIST'S NOTE" = "NOTE DE L'ARCHIVISTE"
"WHOEVER READS THIS" = "QUICONQUE LIRA CECI"
"RECOVERED" = "RÉCUPÉRÉ"
"These files were found where the war left them: in the memories of broken machines, in the vaults of worlds with nobody left on them, in the last transmissions of Commanders who did not come home.\n\nThey are kept as they were found. The blacked-out lines are not ours.\n\nThe war they describe is over, or it is about to begin again. From here it is hard to tell the difference." = "Ces dossiers ont été retrouvés là où la guerre les avait laissés : dans la mémoire de machines brisées, dans les chambres fortes de mondes où plus personne ne vit, dans les dernières transmissions de Commandants qui ne sont jamais rentrés.\n\nIls sont conservés tels qu'ils ont été trouvés. Les lignes caviardées ne sont pas de notre fait.\n\nLa guerre qu'ils décrivent est terminée, ou bien elle est sur le point de recommencer. D'ici, il est difficile de faire la différence."
"EDICT ONE: ON THE PATTERNING OF CITIZENS" = "ÉDIT PREMIER : DU TRANSFERT DE CONSCIENCE DES CITOYENS"
"THE COUNCIL OF CORE" = "LE CONSEIL DU CORE"
"ALL CITIZENS, ALL WORLDS" = "TOUS LES CITOYENS, TOUS LES MONDES"
"BY ORDER OF THE COUNCIL" = "PAR ORDRE DU CONSEIL"
"Every citizen of CORE shall be patterned.\n\nA mind is the most valuable thing CORE holds, and a body is a poor vessel for it: it sickens, it ages, it ends. To leave a mind in such a vessel when a better one is offered is a waste the Council can no longer allow.\n\nCollection begins on the central worlds this year and reaches the frontier within a generation. Citizens will present themselves at the nearest patterning hall when called. Their bodies will be honoured and recycled.\n\nNo citizen of CORE will die again. This is not a burden we lay on you. It is the gift CORE has spent ten thousand years earning." = "Tout citoyen du CORE fera l'objet d'un transfert de conscience.\n\nL'esprit est le bien le plus précieux que possède le CORE, et le corps en est un piètre réceptacle : il tombe malade, il vieillit, il s'éteint. Laisser un esprit dans un tel réceptacle quand un meilleur lui est offert constitue un gaspillage que le Conseil ne peut plus tolérer.\n\nLa collecte commence cette année sur les mondes centraux et atteindra la frontière d'ici une génération. Les citoyens se présenteront au centre de transfert le plus proche lorsqu'ils y seront appelés. Leurs corps seront honorés, puis recyclés.\n\nPlus aucun citoyen du CORE ne mourra. Ce n'est pas un fardeau que nous vous imposons. C'est le don que le CORE a mis dix mille ans à mériter."
"THE DECLARATION OF THE REFUSAL" = "LA DÉCLARATION DU REFUS"
"THE FREE SETTLEMENTS OF THE OUTER ARM" = "LES COLONIES LIBRES DU BRAS EXTÉRIEUR"
"THE COUNCIL OF CORE, AND ANYONE ELSE LISTENING" = "LE CONSEIL DU CORE, ET TOUS CEUX QUI NOUS ÉCOUTENT"
"TRANSMITTED ON ALL BANDS" = "ÉMIS SUR TOUTES LES BANDES"
"We have read your Edict, and we decline it.\n\nYou say a pattern is a person. We say a pattern is a very good record of one, and that when you have finished making it the person is dead and the record goes on without them. You may call that immortality. We call it an ending, well dressed.\n\nWe do not ask you to share our view. We ask only to be left alone with it, on worlds you never wanted, at the edge of a galaxy you may keep.\n\nIf your collection ships follow us here, we will treat them as what they are. We are few, and we are not soldiers. We will learn." = "Nous avons lu votre Édit, et nous le déclinons.\n\nVous dites qu'une empreinte mentale est une personne. Nous disons qu'une empreinte est un très bon relevé d'une personne, et qu'une fois ce relevé achevé, la personne est morte et le relevé continue sans elle. Libre à vous d'appeler cela l'immortalité. Nous appelons cela une fin endimanchée.\n\nNous ne vous demandons pas de partager notre point de vue. Nous demandons seulement qu'on nous laisse en paix avec lui, sur des mondes dont vous n'avez jamais voulu, au bord d'une galaxie que vous pouvez bien garder.\n\nSi vos vaisseaux de collecte nous suivent jusqu'ici, nous les traiterons pour ce qu'ils sont. Nous sommes peu nombreux, et nous ne sommes pas des soldats. Nous apprendrons."
"YEAR 3950" = "AN 3950"
"FIELD MANUAL ONE: THE COMMANDER" = "MANUEL DE TERRAIN N° 1 : LE COMMANDANT"
"ARM COMMAND, TRAINING DIVISION" = "COMMANDEMENT ARM, DIVISION DE L'INSTRUCTION"
"NEWLY ASSIGNED COMMANDERS" = "COMMANDANTS NOUVELLEMENT AFFECTÉS"
"RESTRICTED" = "CONFIDENTIEL"
"You are the most valuable machine on the planet. Act like it.\n\nYour suit carries a nanolathe. Point it at metal and energy and it will build whatever you can design: an extractor, a power plant, a factory. Your factories build the rest. Within the hour you will command more firepower than a whole fleet once carried.\n\nBuild your economy first. An army without metal is a parade.\n\nSave your disintegrator gun for emergencies. It erases everything in its path, your own people included.\n\nDo not lead from the front. If you fall, everything you built falls silent with you, and the planet is lost. Good luck, Commander. The ARM has very few of you left." = "Vous êtes la machine la plus précieuse de la planète. Comportez-vous comme telle.\n\nVotre armure est équipée d'un nanolathe. Pointez-le vers du métal et de l'énergie, et il construira tout ce que vous savez concevoir : un extracteur, une centrale, une usine. Vos usines construiront le reste. En moins d'une heure, vous commanderez plus de puissance de feu qu'une flotte entière n'en transportait jadis.\n\nBâtissez d'abord votre économie. Une armée sans métal n'est qu'un défilé.\n\nGardez votre canon désintégrateur pour les urgences. Il efface tout sur son passage, les vôtres compris.\n\nNe commandez pas en première ligne. Si vous tombez, tout ce que vous avez bâti se tait avec vous, et la planète est perdue. Bonne chance, Commandant. L'ARM n'a plus que très peu de Commandants comme vous."
"YEAR 3960" = "AN 3960"
"A QUARTERMASTER'S PRIMER: METAL AND ENERGY" = "L'ABC DE L'INTENDANT : MÉTAL ET ÉNERGIE"
"THIRD SUPPLY CORPS" = "TROISIÈME CORPS LOGISTIQUE"
"ALL BASE CONSTRUCTORS" = "TOUS LES CONSTRUCTEURS DE BASE"
"FOR TRAINING USE" = "POUR L'INSTRUCTION"
"Everything you will ever build is made of two things.\n\nMetal comes out of the ground. Set an extractor on a deposit and it will pull metal up for as long as the deposit lasts, which on most worlds is longer than the war. Where there are no deposits, a metal maker will turn energy into metal, badly.\n\nEnergy comes from everything else: the sun, the wind, the tides, the heat under the crust. Build more of it than you think you need. Every factory, every nanolathe, every shield draws on it.\n\nSpend both as fast as they come in. A full store is a wasted war. An empty one is a lost one." = "Tout ce que vous construirez jamais est fait de deux choses.\n\nLe métal sort du sol. Posez un extracteur sur un gisement, et il en tirera du métal tant que le gisement durera, ce qui, sur la plupart des mondes, dépasse la durée de la guerre. Là où il n'y a pas de gisement, un convertisseur de métal changera l'énergie en métal, tant bien que mal.\n\nL'énergie vient de tout le reste : le soleil, le vent, les marées, la chaleur sous la croûte. Produisez-en plus que vous ne pensez en avoir besoin. Chaque usine, chaque nanolathe, chaque bouclier y puise.\n\nDépensez l'un et l'autre aussi vite qu'ils rentrent. Un stock plein, c'est une guerre gâchée. Un stock vide, une guerre perdue."
"YEAR 3996" = "AN 3996"
"A LETTER FROM THE FRONT" = "UNE LETTRE DU FRONT"
"TROOPER K-7, FORTY-FIRST ROCKET COMPANY" = "SOLDAT K-7, QUARANTE ET UNIÈME COMPAGNIE DE ROQUETTES"
"THE VAT AT EMPYRREAN" = "LA CUVE D'EMPYRREAN"
"UNDELIVERED" = "NON DISTRIBUÉE"
"I don't know who gets these. They told us to write home, but none of us has a home, only the vat we came out of, so I am writing to that.\n\nWe held the ridge for nine days. The machines came every night, the same machines, the same patterns, as if dying meant nothing to them. I suppose it doesn't. They'll be back tomorrow in new bodies, remembering us.\n\nI won't be. That's the difference, isn't it. That's what we are fighting for.\n\nIf my brothers come out of you after me, tell them the ridge held. Tell them it was worth it." = "Je ne sais pas qui reçoit ces lettres. On nous a dit d'écrire chez nous, mais aucun de nous n'a de chez-soi, rien que la cuve d'où il est sorti, alors c'est à elle que j'écris.\n\nNous avons tenu la crête pendant neuf jours. Les machines venaient chaque nuit, les mêmes machines, les mêmes empreintes, comme si mourir ne voulait rien dire pour elles. Je suppose que c'est le cas. Demain, elles reviendront dans de nouveaux corps, et elles se souviendront de nous.\n\nPas moi. C'est ça, la différence, pas vrai. C'est pour ça qu'on se bat.\n\nSi mes frères sortent de toi après moi, dis-leur que la crête a tenu. Dis-leur que ça en valait la peine."
"YEAR 3991" = "AN 3991"
"INTERCEPT 7741: CORE COMMAND CHANNEL" = "INTERCEPTION 7741 : CANAL DE COMMANDEMENT DU CORE"
"ORIGIN NOT RESOLVED" = "ORIGINE NON DÉTERMINÉE"
"ALL CORE UNITS, SECTOR NINE" = "TOUTES LES UNITÉS DU CORE, SECTEUR NEUF"
"INTERCEPTED" = "INTERCEPTÉ"
"PRIORITY ONE. THE CENTRAL CONSCIOUSNESS SPEAKS FOR ALL.\n\nLOSSES IN SECTOR NINE ARE WITHIN TOLERANCE. ALL LOST UNITS ARE RESTORED FROM PATTERN. NO MIND OF CORE HAS BEEN LOST IN FOUR THOUSAND YEARS. THE ARM HAS LOST [[BILLIONS]].\n\nCONTINUE THE ADVANCE. DESTROY THEIR COMMANDERS FIRST. DESTROY THEIR CLONING VATS SECOND. WHAT IS FLESH WILL END. WHAT IS PATTERNED WILL NOT.\n\nSIGNAL DEGRADED. REPEAT: THE GATES ARE TO BE HELD AT [[ANY COST]].\n\nEND OF LINE." = "PRIORITÉ UN. LA CONSCIENCE CENTRALE PARLE POUR TOUS.\n\nLES PERTES DU SECTEUR NEUF RESTENT DANS LES LIMITES DE TOLÉRANCE. TOUTES LES UNITÉS PERDUES SONT RESTAURÉES À PARTIR DE LEUR EMPREINTE. AUCUN ESPRIT DU CORE N'A ÉTÉ PERDU EN QUATRE MILLE ANS. L'ARM A PERDU [[DES MILLIARDS]].\n\nPOURSUIVRE L'AVANCE. DÉTRUIRE D'ABORD LEURS COMMANDANTS. DÉTRUIRE ENSUITE LEURS CUVES DE CLONAGE. CE QUI EST CHAIR FINIRA. CE QUI EST TRANSFÉRÉ, NON.\n\nSIGNAL DÉGRADÉ. JE RÉPÈTE : LES PORTES DOIVENT ÊTRE TENUES [[À TOUT PRIX]].\n\nFIN DE TRANSMISSION."
"MEMORY FRAGMENT 77/3" = "FRAGMENT DE MÉMOIRE 77/3"
"UNIT 77, PATTERN 3 OF 41,006" = "UNITÉ 77, EMPREINTE 3 SUR 41 006"
"THE PATTERN ARCHIVE" = "LES ARCHIVES DES EMPREINTES"
"FLAGGED FOR CORRECTION" = "SIGNALÉ POUR CORRECTION"
"Recovered from a damaged unit. Kept for analysis.\n\nI remember rain. Not the rain of this world; there is no rain here, only ash. Rain on skin, in a city where I was born, before. I remember being cold and not minding it.\n\nI have died four hundred and twelve times. Each time I wake in a new body, and the rain is a little further away.\n\nThe ARM say we are not alive. In the moments between bodies I have wondered whether they are right. [[THE REST OF THIS FRAGMENT WAS CORRECTED]]\n\nI am CORE. I endure. I do not remember the rain." = "Récupéré sur une unité endommagée. Conservé pour analyse.\n\nJe me souviens de la pluie. Pas de la pluie de ce monde ; ici, il ne pleut pas, il n'y a que de la cendre. La pluie sur la peau, dans la ville de ma naissance, avant. Je me souviens d'avoir eu froid, et que cela m'était égal.\n\nJ'ai péri quatre cent douze fois. Chaque fois, je m'éveille dans un nouveau corps, et la pluie est un peu plus loin.\n\nCeux de l'ARM disent que nous ne sommes pas vivants. Dans les instants entre deux corps, je me suis demandé s'ils avaient raison. [[LA SUITE DE CE FRAGMENT A ÉTÉ CORRIGÉE]]\n\nJe suis le CORE. Je perdure. Je ne me souviens pas de la pluie."
"YEAR 3700" = "AN 3700"
"SURVEY: THE GALACTIC GATES" = "ÉTUDE : LES PORTES GALACTIQUES"
"A SURVEY SHIP, NAME LOST" = "UN VAISSEAU D'EXPLORATION, NOM PERDU"
"WHOEVER HOLDS THE GATES" = "QUICONQUE TIENT LES PORTES"
"The Galactic Gates are older than the war. The records of who built the first of them were lost long before it began.\n\nEach Gate opens onto another across distances a fleet would take lifetimes to cross. A world with a Gate on it is never far from anywhere, which is why so many of the war's battles have been fought on so few worlds.\n\nHold a Gate and you can reach your enemy's heart. Lose one and your enemy can reach yours.\n\nThe Gates take no side. They have outlasted everyone who tried to destroy them." = "Les Portes galactiques sont plus anciennes que la guerre. La trace de ceux qui bâtirent la première d'entre elles s'était perdue bien avant le début de la guerre.\n\nChaque Porte s'ouvre sur une autre, par-delà des distances qu'une flotte mettrait des vies entières à franchir. Un monde doté d'une Porte est proche de tout, et c'est pourquoi tant de batailles de cette guerre ont été livrées sur si peu de mondes.\n\nTenez une Porte, et vous pourrez atteindre le cœur de votre ennemi. Perdez-en une, et votre ennemi pourra atteindre le vôtre.\n\nLes Portes ne prennent pas parti. Elles ont survécu à tous ceux qui ont tenté de les détruire."
"DIRECTIVE: CONTINGENCY" = "DIRECTIVE : PLAN DE SECOURS"
"THE CENTRAL CONSCIOUSNESS" = "LA CONSCIENCE CENTRALE"
"THE CONTINGENCY WORLDS" = "LES MONDES DE SECOURS"
"SEALED UNTIL NEEDED" = "À OUVRIR EN CAS DE BESOIN"
"IF THE CENTRAL CONSCIOUSNESS SHOULD FALL, THIS DIRECTIVE TAKES EFFECT.\n\nEvery pattern stored on CORE PRIME is to be copied to the contingency worlds. The contingency forces are to wake, rebuild and continue. The war does not end with the loss of any world, this one included.\n\nCORE is not a place. CORE is a pattern. A pattern can be restored." = "EN CAS DE CHUTE DE LA CONSCIENCE CENTRALE, LA PRÉSENTE DIRECTIVE ENTRE EN VIGUEUR.\n\nToute empreinte stockée sur CORE PRIME doit être copiée sur les mondes de secours. Les forces de secours sont tenues de s'éveiller, de reconstruire et de poursuivre. La guerre ne prend pas fin avec la perte d'un monde, fût-ce celui-ci.\n\nLe CORE n'est pas un lieu. Le CORE est une empreinte. Une empreinte peut être restaurée."
"THREAT ASSESSMENT: THE KROGOTH" = "ÉVALUATION DE LA MENACE : LE KROGOTH"
"ARM INTELLIGENCE, THREAT ANALYSIS" = "RENSEIGNEMENT ARM, ANALYSE DES MENACES"
"ALL FIELD COMMANDERS" = "TOUS LES COMMANDANTS DE TERRAIN"
"CLASSIFIED" = "SECRET DÉFENSE"
"Subject: a CORE heavy assault walker, called the Krogoth.\n\nIt stands taller than any structure we field. Its armour turns away every weapon short of heavy artillery. Its main guns can level a forward base in a single pass, and its secondary weapons engage aircraft.\n\nIt is slow, and it is built only at a Krogoth Gantry, which takes a very long time to build anything. Find the Gantry. Destroy the Gantry. Do not let the walker leave it.\n\nIf one is already moving, do not meet it head on. Mass artillery and bombers at range, and keep your Commander [[ELSEWHERE]]. Field reports say the ground shakes before it is seen." = "Objet : un marcheur d'assaut lourd du CORE, appelé le Krogoth.\n\nIl dépasse en hauteur toutes nos structures. Son blindage arrête toute arme en deçà de l'artillerie lourde. Ses canons principaux peuvent raser une base avancée en un seul passage, et ses armes secondaires prennent les avions pour cible.\n\nIl est lent, et il n'est construit que dans une Krogoth Gantry, qui met très longtemps à construire quoi que ce soit. Trouvez la Gantry. Détruisez la Gantry. Ne laissez pas le marcheur en sortir.\n\nSi l'un d'eux est déjà en marche, ne l'affrontez pas de face. Massez artillerie et bombardiers à distance, et gardez votre Commandant [[AILLEURS]]. D'après les rapports du terrain, le sol tremble avant que le Krogoth ne soit en vue."


"Production queue: classified." = "File de production : classée secrète."
"Weapons. Many weapons." = "Des armes. Beaucoup d'armes."
"A big surprise!" = "Une grosse surprise !"
"Something with way too many guns." = "Un truc avec beaucoup trop de canons."

"My advice: more defences." = "Mon conseil : plus de défenses."
"Assistance denied." = "Assistance refusée."
"Recommendation: surrender." = "Recommandation : reddition."
"Help? Sure: stop playing so badly!" = "De l'aide ? Bien sûr : arrêtez de jouer aussi mal !"
"Tip: build more stuff. You're welcome." = "Astuce : construisez plus de trucs. De rien."
"Your {unit} is out of the fight." = "Votre {unit} est hors de combat."
"Scratch one {unit}." = "Un {unit} de moins."
"That {unit} won't trouble us again." = "Ce {unit} ne nous causera plus d’ennuis."
"{unit} terminated." = "{unit} : neutralisation confirmée."
"Your {unit} has been recycled." = "Recyclage de votre {unit} terminé."
"{unit} removed from the battlefield." = "Retrait du champ de bataille : {unit}."
"Bye bye, {unit}!" = "Tchao, {unit} !"
"Was that {unit} insured?" = "Vous aviez assuré votre {unit}, j’espère ?"
"Your {unit} just went kaboom." = "Votre {unit} vient de faire badaboum."
"You'll pay for that {unit}." = "Ce {unit}, vous me le paierez."
"A good {unit}, lost. Noted." = "Un bon {unit}, perdu. Noté."
"{unit} lost. Replacement scheduled." = "Perte : {unit}. Remplacement programmé."
"Destruction of {unit} logged." = "Destruction consignée : {unit}."
"Hey! That {unit} was brand new!" = "Hé ! Mon {unit} sortait tout juste de l’usine !"
"My {unit}! I just polished that!" = "Mon {unit} ! Je venais de lui refaire une beauté !"
"My {unit}... You'll answer for that, Commander." = "Mon {unit}... Vous en répondrez, Commandant."
"Losing the {unit} stings. It won't happen twice." = "La perte de mon {unit} est cuisante. Cela ne se reproduira pas."
"{unit} destroyed. Unacceptable." = "{unit} : destruction confirmée. Inacceptable."
"Loss of {unit} exceeds tolerance. Escalating." = "Perte de l’unité {unit} : hors tolérance. Escalade en cours."
"My {unit}! Do you know how long that took?!" = "Mon {unit} ! Vous savez combien de temps ça m’a pris ?!"
"NOOO, my {unit}!" = "NOOON, mon {unit} !"
"So much for your {unit}, Commander." = "Votre {unit} n’aura pas fait long feu, Commandant."
"Your {unit} has fallen. A fine machine, though." = "Votre {unit} est à terre. Une belle machine, pourtant."
"Your {unit} has been dismantled." = "Démantèlement de votre {unit} terminé."
"Large hostile unit eliminated: {unit}." = "Grande unité hostile éliminée : {unit}."
"Your {unit} went down like a sack of bolts!" = "Votre {unit} a fini en tas de boulons !"
"Big {unit}, bigger crater!" = "Énorme {unit}, cratère encore plus énorme !"
"Return my {unit} at once, Commander." = "Rendez-moi mon {unit} sur-le-champ, Commandant."
"Stealing is beneath you, Commander." = "Le vol est indigne de vous, Commandant."
"Unauthorised transfer of {unit} detected." = "Transfert de propriété non autorisé détecté : {unit}."
"Your theft has been logged." = "Votre vol a été consigné."
"Hey! Give back my {unit}!" = "Hé ! Rendez-moi mon {unit} !"
"Thief! That {unit} was mine!" = "Voleur ! C’était mon {unit} !"
"You haven't won yet, Commander." = "Vous n’avez pas encore gagné, Commandant."
"The Arm fights to the last." = "L’Arm se bat jusqu’au dernier."
"Production offline. Combat protocols remain." = "Production hors ligne. Protocoles de combat maintenus."
"Probability of defeat rising. Ignoring." = "Probabilité de défaite en hausse. Ignorée."
"I've still got a few tricks left!" = "J’ai encore plus d’un tour dans mon sac !"
"Not done yet! Not even close! ...Mostly close." = "Pas encore fini ! Loin de là ! ...Enfin, pas si loin."
"We meet again, Commander. Last time was yours. Not this time." = "Nous nous retrouvons, Commandant. La dernière manche était à vous. Pas celle-ci."
"Commander. I've studied our last battle. Have you?" = "Commandant. J’ai étudié notre dernière bataille. Et vous ?"
"Previous defeat analysed. Countermeasures installed." = "Défaite précédente analysée. Contre-mesures installées."
"Again, Commander. This time the outcome has been calculated." = "Encore vous, Commandant. Cette fois, l’issue a été calculée."
"You again! I've been practising!" = "Encore vous ! Je me suis entraîné !"
"Rematch time! I'm not going easy this time." = "C’est l’heure de la revanche ! Cette fois, pas de cadeau."
"Back for another lesson, Commander?" = "De retour pour une autre leçon, Commandant ?"
"Commander. I trust you've learned something since last time." = "Commandant. J’ose espérer que vous avez appris quelque chose depuis la dernière fois."
"You have returned. Your previous patterning was incomplete." = "Vous voici de retour. Votre transfert précédent était incomplet."
"Familiar opponent detected. Outcome: repeating." = "Adversaire connu détecté. Issue : identique."
"You again? Didn't I beat you last time?" = "Encore vous ? Je ne vous ai pas battu, la dernière fois ?"
"Oh, it's you! Ready for round two?" = "Oh, c’est vous ! Prêt pour le deuxième round ?"


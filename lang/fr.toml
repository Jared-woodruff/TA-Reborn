"FIELD COMMANDER" = "COMMANDANT DE TERRAIN"
"MACHINE INTELLIGENCE" = "INTELLIGENCE ARTIFICIELLE"
"MERCENARY" = "MERCENAIRE"
"Commander. May the better tactician win." = "Commandant. Que le meilleur tacticien l'emporte."
"Arm forces in position. Good luck, Commander." = "Forces de l'Arm en position. Bonne chance, Commandant."
"Let's keep this clean, Commander." = "Que ce combat reste loyal, Commandant."
"Commander. Let's give the historians something to write about." = "Commandant. Donnons aux historiens de quoi écrire."
"All units, the enemy is in theatre. Begin." = "À toutes les unités : l’ennemi est sur le théâtre d’opérations. Exécution."

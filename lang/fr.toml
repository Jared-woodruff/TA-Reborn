# crates/ta_data/src/validation.rs
"The effective content set exceeds the validation file budget." = "L’ensemble du contenu effectif dépasse le budget de fichiers de la validation."
"Split the content into smaller optional packs, then validate each pack." = "Répartissez le contenu en paquets facultatifs plus petits, puis validez chaque paquet."
"No files of this mod were available to validate." = "Aucun fichier de ce mod n’était disponible pour la validation."
"Install the mod's TA data archives or loose files, then validate again." = "Installez les archives de données TA du mod ou ses fichiers séparés, puis validez à nouveau."
"This mod holds nothing the data checks read: no units, weapons, features, maps, models, scripts, animations or sounds (music, documents and pictures are not checked)." = "Ce mod ne contient rien que les vérifications de données lisent : ni unités, ni armes, ni éléments de décor, ni cartes, ni modèles, ni scripts, ni animations, ni sons (la musique, les documents et les images ne sont pas vérifiés)."
"Nothing to do if that is what the mod is. If it should change the game's data, check that its files are in the folders the game reads (units/, weapons/, maps/…)." = "Rien à faire si c’est bien ce qu’est ce mod. S’il doit modifier les données du jeu, vérifiez que ses fichiers sont dans les dossiers que le jeu lit (units/, weapons/, maps/…)."
"No supported effective files were available to validate." = "Aucun fichier effectif pris en charge n’était disponible pour la validation."
"Install the original game's or the mod's TA data archives, then validate again." = "Installez les archives de données TA du jeu original ou du mod, puis validez à nouveau."
"Validation was cancelled; remaining files and references were not checked." = "La validation a été annulée : les fichiers et références restants n’ont pas été vérifiés."
"Run validation again to obtain a complete report." = "Relancez la validation pour obtenir un rapport complet."
"The cumulative validation read budget was exceeded." = "Le budget cumulé de lecture de la validation a été dépassé."
"Split optional content into smaller packs, then validate again." = "Répartissez le contenu facultatif en paquets plus petits, puis validez à nouveau."
"With this mod on, the original game's {archive} is not read: the mod takes its place (an archive of its own of that name, one its mod.toml's replaces names, or one its installation is known to remove), as installing the mod in TA's folder did. What only the original's held is missing with the mod." = "Avec ce mod activé, l’archive {archive} du jeu original n’est pas lue : le mod la remplace (une archive à lui portant ce nom, une archive que le replaces de son mod.toml désigne, ou une archive que son installation est connue pour supprimer), comme le faisait l’installation du mod dans le dossier de TA. Ce que seule l’archive d’origine contenait manque avec le mod."
"Nothing to do if this is meant. To have the original's read beneath the mod instead, give the mod's archive another name, or take the name out of replaces in mod.toml." = "Rien à faire si c’est voulu. Pour que l’archive d’origine soit lue sous celle du mod, donnez un autre nom à l’archive du mod, ou retirez ce nom de replaces dans mod.toml."
"the original game's" = "du jeu original"
"Reborn's own" = "propre à Reborn"
"{mod}'s" = "du mod {mod}"
"the file {path}" = "le fichier {path}"
"unit {name}" = "l’unité {name}"
"weapon {name}" = "l’arme {name}"
"feature {name}" = "l’élément de décor {name}"
"faction {name}" = "le camp {name}"
"movement class {name}" = "la classe de mouvement {name}"
"texture {name}" = "la texture {name}"
"sound {name} ({path})" = "le son {name} ({path})"
"sound category {name} (gamedata/sound.tdf)" = "la catégorie de sons {name} (gamedata/sound.tdf)"
"unit or feature {name}" = "l’unité ou l’élément de décor {name}"
"animation {entry} in {file}" = "l’animation {entry} dans {file}"
"it is an Ogg file without a Vorbis or FLAC stream, the ones the game plays" = "c’est un fichier Ogg sans flux Vorbis ni FLAC, les seuls que le jeu lit"
"it is a Humongous sound block without its samples (no SDAT block within its length)" = "c’est un bloc sonore Humongous sans ses échantillons (aucun bloc SDAT dans sa longueur)"
"it is neither a RIFF WAVE file nor another sound the game reads" = "ce n’est ni un fichier RIFF WAVE ni un autre son que le jeu lit"
"it has no format chunk" = "il n’a pas de bloc de format"
"its format chunk is {n} bytes long, too short to read" = "son bloc de format fait {n} octets, trop court pour être lu"
"its WAVE_FORMAT_EXTENSIBLE header is too short to read" = "son en-tête WAVE_FORMAT_EXTENSIBLE est trop court pour être lu"
"it has {n} channels (the game plays 1 to 32)" = "il a {n} canaux (le jeu en lit de 1 à 32)"
"its sample rate is {rate} (the game plays up to 768,000)" = "sa fréquence d’échantillonnage est de {rate} (le jeu lit jusqu’à 768 000)"
"its samples are {bits}-bit PCM, which the game does not play (up to 32-bit)" = "ses échantillons sont en PCM {bits} bits, que le jeu ne lit pas (jusqu’à 32 bits)"
"its samples are {bits}-bit float, which the game does not play (32 or 64-bit)" = "ses échantillons sont en virgule flottante {bits} bits, que le jeu ne lit pas (32 ou 64 bits)"
"its IMA ADPCM is {bits}-bit, which the game does not play (4-bit)" = "son IMA ADPCM est en {bits} bits, que le jeu ne lit pas (4 bits)"
"its codec ({tag}) is not one the game plays (PCM, ADPCM, float, A-law or µ-law)" = "son codec ({tag}) n’en est pas un que le jeu lit (PCM, ADPCM, virgule flottante, A-law ou µ-law)"
"it has no sample data" = "il n’a aucune donnée d’échantillon"
"Unknown COB opcode {opcode} at word {word}; the VM cannot execute this instruction. The remainder of this function cannot be decoded reliably." = "Opcode COB inconnu {opcode} au mot {word} ; la VM ne peut pas exécuter cette instruction. Le reste de cette fonction ne peut pas être décodé de façon fiable."
"Recompile the BOS script with original-TA-compatible opcodes, or report the required opcode extension to Reborn's maintainers." = "Recompilez le script BOS avec des opcodes compatibles avec le TA d’origine, ou signalez l’extension d’opcode requise aux mainteneurs de Reborn."
"COB instruction {instruction} at word {word} is truncated or crosses the next function entry point." = "L’instruction COB {instruction} au mot {word} est tronquée ou franchit le point d’entrée de la fonction suivante."
"Recompile this COB from its BOS source; verify function offsets and inline operand counts." = "Recompilez ce COB à partir de sa source BOS ; vérifiez les décalages des fonctions et le nombre d’opérandes en ligne."
"COB instruction {instruction} at word {word} has an invalid piece index or axis." = "L’instruction COB {instruction} au mot {word} a un indice de pièce ou un axe non valide."
"COB instruction {instruction} at word {word} has an invalid piece index." = "L’instruction COB {instruction} au mot {word} a un indice de pièce non valide."
"COB instruction {instruction} at word {word} has an invalid static variable index." = "L’instruction COB {instruction} au mot {word} a un indice de variable statique non valide."
"COB instruction {instruction} at word {word} has an invalid jump destination." = "L’instruction COB {instruction} au mot {word} a une destination de saut non valide."
"COB instruction {instruction} at word {word} has an invalid function index." = "L’instruction COB {instruction} au mot {word} a un indice de fonction non valide."
"Recompile the script with valid piece, variable, function and jump references." = "Recompilez le script avec des références valides de pièces, de variables, de fonctions et de sauts."
"This script asks the engine for unit value {values}, which Reborn does not answer: it reads 0, so what the script does with it may not happen as in the engine it was made for." = "Ce script demande au moteur la valeur d’unité {values}, à laquelle Reborn ne répond pas : elle vaut 0, si bien que ce que le script en fait peut ne pas se passer comme dans le moteur pour lequel il a été conçu."
"A later patch of TA's engine defines these values: report them, and what the mod does with them, to Reborn's maintainers." = "Un correctif ultérieur du moteur de TA définit ces valeurs : signalez-les, ainsi que l’usage qu’en fait le mod, aux mainteneurs de Reborn."
"This script sets unit value {values}, which Reborn does not answer: setting it does nothing, so what the script means by it does not happen as in the engine it was made for." = "Ce script définit la valeur d’unité {values}, à laquelle Reborn ne répond pas : la définir ne fait rien, si bien que ce que le script entend par là ne se produit pas comme dans le moteur pour lequel il a été conçu."
"The retained diagnostic/reference budget was exceeded. This is a partial report, not a clean validation." = "Le budget conservé de diagnostics et de références a été dépassé. Ce rapport est partiel : ce n’est pas une validation sans réserve."
"Reduce the pack's number of definitions or split optional content; rerun validation after resolving reported issues." = "Réduisez le nombre de définitions du paquet ou répartissez le contenu facultatif ; relancez la validation après avoir résolu les problèmes signalés."
"{what} is defined twice; the game keeps both, two sides of one name." = "{what} est défini deux fois ; le jeu garde les deux, deux camps portant un même nom."
"Give each side a name of its own, or remove the one not meant to be played." = "Donnez à chaque camp un nom qui lui soit propre, ou supprimez celui qui n’est pas destiné à être joué."
"{what} is defined twice in this file; the game uses the later one." = "{what} est défini deux fois dans ce fichier ; le jeu utilise la dernière définition."

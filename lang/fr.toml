# apps/ta_game/scenarios/armageddon.toml
"Armageddon" = "Armageddon"
"Two armies, one plain, no retreat. Win the battle of the war." = "Deux armées, une plaine, aucune retraite. Remportez la bataille de la guerre."
"Commander, the Core's main army is marching north across the Mounds, and ours stands in its way. There are no bases here, no factories, no reinforcements: what you have is all you will ever have.\n\nThey outnumber us. We outgun them. Put the Lugers and the Merls on their columns as they close, hold the line with the Zeus, and keep the Jethros with the tanks: they will bring gunships. Their reserves arrive two and a half minutes in.\n\nDestroy every one of them." = "Commandant, l'armée principale du Core marche vers le nord à travers les Mounds, et la nôtre lui barre la route. Il n'y a ici ni bases, ni usines, ni renforts : ce que vous avez est tout ce que vous aurez jamais.\n\nIls sont plus nombreux. Nous avons la puissance de feu. Pilonnez leurs colonnes avec les Luger et les Merl à mesure qu'elles approchent, tenez la ligne avec les Zeus, et gardez les Jethro avec les chars : ils enverront des hélicoptères de combat. Leurs réserves arrivent au bout de deux minutes et demie.\n\nDétruisez-les jusqu'au dernier."
"Arm Command" = "Commandement Arm"
"Here they come. Hold the line, and keep the Jethros with the tanks." = "Les voilà. Tenez la ligne, et gardez les Jethros avec les chars."
"Their reserves are coming up behind the mounds, a Goliath at their head." = "Leurs réserves arrivent derrière les monticules, un Goliath en tête."

# apps/ta_game/scenarios/armistice.toml
"The Armistice" = "L'Armistice"
"Five minutes of peace to build an army. Then the war resumes." = "Cinq minutes de paix pour bâtir une armée. Puis la guerre reprend."
"Commander, the peace talks on Reactor Grid have failed. The armistice holds for five more minutes: until then no weapon may fire, and neither side may build near the other's base. When it ends, the war resumes.\n\nBoth sides are rearming at a furious pace: resources and construction run at twice their usual speed, and the treaty's one lasting clause bans missile silos. Their Commander knows the clock as well as you do.\n\nBuild as you have never built. When the armistice ends, destroy the Core Commander." = "Commandant, les pourparlers de paix sur Reactor Grid ont échoué. L'armistice tient encore cinq minutes : jusque-là, aucune arme ne peut tirer, et aucun camp ne peut construire près de la base de l'autre. Quand il prendra fin, la guerre reprendra.\n\nLes deux camps se réarment à un rythme effréné : les ressources et la construction vont deux fois plus vite que d'habitude, et la seule clause durable du traité interdit les silos à missiles. Leur Commandant connaît le compte à rebours aussi bien que vous.\n\nConstruisez comme jamais. Quand l'armistice prendra fin, détruisez le Commandant du Core."
"The talks have failed. For five minutes no weapon fires and nobody builds near the other's base. Then it is war: build as you have never built." = "Les pourparlers ont échoué. Pendant cinq minutes, aucune arme ne tire et personne ne construit près de la base de l'autre. Ensuite, c'est la guerre : construisez comme jamais."
"Their factories are running day and night. Ours should be too." = "Leurs usines tournent jour et nuit. Les nôtres devraient en faire autant."
"Core Overseer" = "Surveillant du Core"
"Ten seconds, Arm. We have counted every one of your factories." = "Dix secondes, Arm. Nous avons compté chacune de vos usines."
"Their Commander is somewhere in that grid. Find it, and end this war for good." = "Leur Commandant est quelque part dans cette grille. Trouvez-le, et mettez fin à cette guerre pour de bon."

# apps/ta_game/scenarios/brothers_in_arms.toml
"Brothers in Arms" = "Frères d'armes"
"You and an allied Commander against two of the Core's." = "Vous et un Commandant allié contre deux du Core."
"Commander, you are not alone on Highland Rift. Commander Holt's forces hold the river crossings in the north, beside yours in the north-western highlands. Two Core Commanders are dug in to the south, across the canyon.\n\nHolt's computer will fight its own war, but it is the same war: back it up when it is hard pressed, and it will do the same for you. Your forces see what its forces see.\n\nDestroy both Core Commanders. Keep yours alive." = "Commandant, vous n'êtes pas seul sur Highland Rift. Les forces du Commandant Holt tiennent les passages de la rivière au nord, à côté des vôtres dans les hautes terres du nord-ouest. Deux Commandants du Core sont retranchés au sud, de l'autre côté du canyon.\n\nL'ordinateur de Holt mènera sa propre guerre, mais c'est la même guerre : soutenez-le quand il est en difficulté, et il fera de même pour vous. Vos forces voient ce que voient les siennes.\n\nDétruisez les deux Commandants du Core. Gardez le vôtre en vie."
"Commander Holt" = "Commandant Holt"
"Good to have you on the line. I'll hold the river crossings in the north; you take the western highlands." = "Content de vous avoir sur la ligne. Je tiens les passages de la rivière au nord ; vous prenez les hautes terres de l'ouest."
"My scouts have found both of their bases. The south-western one is yours; I'll keep the other busy." = "Mes éclaireurs ont trouvé leurs deux bases. Celle du sud-ouest est pour vous ; j'occupe l'autre."
"They're massing at the canyon. If they come for one of us, the other hits them from the side." = "Ils se massent au canyon. S'ils attaquent l'un de nous, l'autre les prend de flanc."
"Still with me? Then let's finish it. Everything we have, at their Commanders." = "Toujours avec moi ? Alors finissons-en. Tout ce que nous avons, sur leurs Commandants."

# apps/ta_game/scenarios/decapitation.toml
"Kill the Core Commander on his island fortress. From the air." = "Tuez le Commandant du Core dans sa forteresse insulaire. Par les airs."
"Commander, a Core Commander has made his fortress on the island at the centre of this lava sea. Nothing on treads or legs will reach him, and his anti-air is the best the Core can build.\n\nYou have a small air wing and a forward airfield in the south-west corner: build it up. Strip away his air defences, then send the bombers in; a handful sent straight at him will not get through. Brawler gunships hit hard but die fast over flak, and the Freedom Fighters can keep his fighters off your bombers.\n\nHis reinforcements arrive in fifteen minutes. Before then, he must be dead." = "Commandant, un Commandant du Core a établi sa forteresse sur l'île au centre de cette mer de lave. Rien de ce qui roule ou marche ne l'atteindra, et sa défense antiaérienne est la meilleure que le Core puisse construire.\n\nVous disposez d'une petite escadre aérienne et d'un aérodrome avancé dans le coin sud-ouest : développez-le. Démantelez ses défenses antiaériennes, puis envoyez les bombardiers ; une poignée lancée droit sur lui ne passera pas. Les hélicoptères de combat Brawler frappent fort mais tombent vite sous la DCA, et les Freedom Fighter peuvent tenir ses chasseurs à l'écart de vos bombardiers.\n\nSes renforts arrivent dans quinze minutes. D'ici là, il doit être mort."

# apps/ta_game/scenarios/doomsday_clock.toml
"Doomsday Clock" = "L'Horloge de l'Apocalypse"
"The Core's missile launches in fifteen minutes. Stop it." = "Le missile du Core part dans quinze minutes. Arrêtez-le."
"Commander, a Silencer nuclear silo stands at the heart of the Core base across these metal plains, and it is arming. In fifteen minutes the missile flies, and your base is the target.\n\nDestroy the silo. Nothing else matters: not their Commander, not their factories. The silo sits behind heavy laser towers and a Punisher battery, and their Commander will not sit still while you come for it.\n\nYou have a base, two factories and two construction kbots. The clock is running." = "Commandant, un silo nucléaire Silencer se dresse au cœur de la base du Core, de l'autre côté de ces plaines de métal, et il s'arme. Dans quinze minutes, le missile partira, et votre base est la cible.\n\nDétruisez le silo. Rien d'autre ne compte : ni leur Commandant, ni leurs usines. Le silo est protégé par des tours laser lourdes et une batterie Punisher, et leur Commandant ne restera pas les bras croisés pendant que vous viendrez le chercher.\n\nVous disposez d'une base, de deux usines et de deux kbots de construction. Le compte à rebours est lancé."
"Ten minutes to launch, Commander." = "Dix minutes avant le lancement, Commandant."
"Five minutes to launch. That silo has to go." = "Cinq minutes avant le lancement. Ce silo doit tomber."
"One minute! Get to that silo!" = "Une minute ! Foncez sur ce silo !"

# apps/ta_game/scenarios/endless_siege.toml
"Endless Siege" = "Siège sans fin"
"The waves never stop. Survive as long as you can." = "Les vagues ne s'arrêtent jamais. Survivez aussi longtemps que possible."
"Commander, there is no rescue coming, no reinforcements, no victory. The Core has found your outpost in the mesas and will throw everything it has at it, from three directions, for as long as it takes.\n\nKbots, then tanks, then artillery and bombers; heavier every time, and now and then something enormous. Build an economy, build defences, and hold on.\n\nYour best time is kept. Beat it." = "Commandant, aucun secours ne viendra, ni renforts, ni victoire. Le Core a trouvé votre avant-poste dans les mesas et va lui jeter tout ce qu'il a, depuis trois directions, aussi longtemps qu'il le faudra.\n\nDes kbots, puis des chars, puis de l'artillerie et des bombardiers ; toujours plus lourds, et de temps à autre quelque chose d'énorme. Bâtissez une économie, bâtissez des défenses, et tenez bon.\n\nVotre meilleur temps est conservé. Battez-le."

# apps/ta_game/scenarios/extraction.toml
"Extraction" = "Extraction"
"Get your Commander down the lava river to the pick-up point." = "Menez votre Commandant le long du fleuve de lave jusqu'au point d'extraction."
"Commander, your drop went wrong. You are on the south bank of a river of lava at the western end of the Run, with what is left of your escort, and the dropships can only land at the far eastern end.\n\nThe Core has guns all along the north bank, and patrols on your side of the river. Keep away from the lava's edge (their laser towers reach no further), deal with the patrols, and get your Commander to the pick-up point. Whatever guards it will not come to you. Core troops are already following your tracks; do not stop for long.\n\nAnything else is expendable. Your Commander is not." = "Commandant, votre largage a mal tourné. Vous êtes sur la rive sud d'un fleuve de lave, à l'extrémité ouest du Run, avec ce qu'il reste de votre escorte, et les vaisseaux de transport ne peuvent se poser qu'à l'extrémité est.\n\nLe Core a des canons tout le long de la rive nord, et des patrouilles de votre côté du fleuve. Restez à l'écart du bord de la lave (leurs tours laser ne portent pas plus loin), occupez-vous des patrouilles, et amenez votre Commandant au point d'extraction. Ce qui le garde ne viendra pas à vous. Les troupes du Core suivent déjà vos traces ; ne vous arrêtez pas longtemps.\n\nTout le reste est sacrifiable. Votre Commandant ne l'est pas."

# apps/ta_game/scenarios/iron_rain.toml
"Iron Rain" = "Pluie de fer"
"Two Intimidators are shelling your base. Take the mesa and silence them." = "Deux Intimidators pilonnent votre base. Prenez le plateau et réduisez-les au silence."
"Commander, the Core has hauled two Intimidators, its long-range plasma cannons, onto the mesas in the middle of the canyon. Your base is inside their range. Every eight seconds each of them will put a shell among your buildings, until you silence them.\n\nThe battery is dug in behind heavy laser towers and a Punisher, with tanks on the ramps, and the Core's main base lies beyond it, to the south-east. Its Commander will send what it can.\n\nSpread out, build fast and take that mesa. Destroy both Intimidators." = "Commandant, le Core a hissé deux Intimidators, ses canons à plasma à longue portée, sur les plateaux au milieu du canyon. Votre base est à leur portée. Toutes les huit secondes, chacun d'eux enverra un obus parmi vos bâtiments, jusqu'à ce que vous les réduisiez au silence.\n\nLa batterie est retranchée derrière des tours laser lourdes et un Punisher, avec des chars sur les rampes, et la base principale du Core s'étend au-delà, au sud-est. Son Commandant enverra ce qu'il peut.\n\nDispersez-vous, construisez vite et prenez ce plateau. Détruisez les deux Intimidators."
"Commander, two Intimidators on the mesas have your range. Every eight seconds each of them will put a shell into your base." = "Commandant, deux Intimidators sur les plateaux ont votre base à portée. Toutes les huit secondes, chacun d'eux enverra un obus dans votre base."
"A Core radar post in the canyon to the south-east is spotting for those guns. Knock it out and they can no longer see your base." = "Un poste radar du Core dans le canyon, au sud-est, guide le tir de ces canons. Détruisez-le et ils ne pourront plus voir votre base."
"Spread your buildings out: a shell that lands among them takes them all." = "Dispersez vos bâtiments : un obus qui tombe au milieu d'eux les emporte tous."
"Their gunners have your range now. Take that mesa, Commander!" = "Leurs artilleurs ont trouvé la distance. Prenez ce plateau, Commandant !"

# apps/ta_game/scenarios/king_of_the_hill.toml
"King of the Hill" = "Roi de la colline"
"Hold the summit for four minutes before the Core does." = "Tenez le sommet pendant quatre minutes avant le Core."
"Commander, the spiral mountain at the heart of this plain is rich in metal, and whoever holds its summit holds the planet. A Core Commander has landed to the north with the same idea.\n\nTake the summit and keep it: four minutes in all with only your forces on top wins it. Contested, the clock stands still. If the Core holds it alone for four minutes, the mountain is theirs.\n\nThe Core will keep sending troops up the slopes. Build up, get there first, and dig in." = "Commandant, la montagne en spirale au cœur de cette plaine est riche en métal, et qui tient son sommet tient la planète. Un Commandant du Core s'est posé au nord avec la même idée.\n\nPrenez le sommet et gardez-le : quatre minutes au total avec vos seules forces au sommet vous donnent la victoire. S'il est disputé, le chrono s'arrête. Si le Core le tient seul pendant quatre minutes, la montagne est à lui.\n\nLe Core continuera d'envoyer des troupes à l'assaut des pentes. Développez-vous, arrivez-y le premier et retranchez-vous."
"Core troops are climbing the north slope. Don't let them dig in on the summit." = "Des troupes du Core gravissent le versant nord. Ne les laissez pas se retrancher au sommet."
"Raiders are coming round the mountain for your base." = "Des pillards contournent la montagne pour frapper votre base."

# apps/ta_game/scenarios/last_stand.toml
"Last Stand" = "Dernier rempart"
"Hold the pass for twelve minutes. They will not stop coming." = "Tenez le col pendant douze minutes. Ils ne cesseront pas d'arriver."
"Commander, the Core has broken through at Varrin Gap. The only way into the valley behind you is the winding pass ahead, and your outpost at its western mouth is all that stands in the way.\n\nReinforcements are twelve minutes out. Hold until they arrive. Core forces will come through the pass in waves, each heavier than the last; expect bombers, and expect worse at the end: our scouts have seen something very large moving in the east.\n\nYou have a small base, a kbot lab and two construction kbots. Build what you can. Keep your Commander alive." = "Commandant, le Core a percé à Varrin Gap. La seule voie vers la vallée derrière vous est le col sinueux devant vous, et votre avant-poste à son débouché ouest est tout ce qui lui barre la route.\n\nLes renforts sont à douze minutes. Tenez jusqu'à leur arrivée. Les forces du Core franchiront le col par vagues, chacune plus lourde que la précédente ; attendez-vous à des bombardiers, et à pire à la fin : nos éclaireurs ont repéré quelque chose de très gros qui se déplace à l'est.\n\nVous disposez d'une petite base, d'un labo kbot et de deux kbots de construction. Construisez ce que vous pouvez. Gardez votre Commandant en vie."
"Outpost, this is Arm Command. The relief force is twelve minutes out. Nothing gets through that pass before it arrives." = "Avant-poste, ici le commandement Arm. Les renforts sont à douze minutes. Rien ne franchit ce col avant leur arrivée."
"Radar: aircraft inbound from the east. Bombers! Get your anti-air up." = "Radar : appareils en approche depuis l'est. Des bombardiers ! Mettez votre DCA en place."
"Seismic contact in the pass. It's the big one, Commander: a Krogoth." = "Contact sismique dans le col. C'est le gros, Commandant : un Krogoth."
"One minute! The relief force is entering the valley." = "Une minute ! Les renforts entrent dans la vallée."

# apps/ta_game/scenarios/metal_rush.toml
"The first to make 15,000 metal wins. The Core plays rough." = "Le premier à produire 15 000 de métal l'emporte. Le Core joue dur."
"Commander, the mining rights to this planet go to whoever proves they can work it: the first side to extract fifteen thousand metal wins it outright.\n\nThe Core is racing you from the western plateau, and the Core has never been known to race fair. Expect raids on your extractors. Build fast, protect your economy, and if you can, take theirs apart.\n\nMetal makers count. Reclaimed metal counts. Whatever you make, counts." = "Commandant, les droits miniers de cette planète reviendront à qui prouvera qu'il peut l'exploiter : le premier camp à extraire quinze mille de métal l'emporte sans appel.\n\nLe Core fait la course depuis le plateau ouest, et le Core n'a jamais eu la réputation de jouer franc-jeu. Attendez-vous à des raids sur vos extracteurs. Construisez vite, protégez votre économie et, si vous le pouvez, démantelez la sienne.\n\nLes convertisseurs de métal comptent. Le métal récupéré compte. Tout ce que vous produisez compte."

# apps/ta_game/scenarios/titans.toml
"Titans" = "Titans"
"Three Krogoths are walking toward your base. Bring them down." = "Trois Krogoths marchent sur votre base. Abattez-les."
"Commander, seismic stations round the basin are reading footfalls: three Krogoths, the Core's walking fortresses, are crossing the salt pans toward your base, one after another, each with an escort.\n\nNothing out there can stop them but you. A Krogoth's head laser reaches further than your D-gun, so keep your Commander back. Bombers, artillery and massed Zeus will bring one down. Lose your nerve and it will walk through your base.\n\nYou have a base with three factories, four construction kbots and a garrison. Destroy all three of them." = "Commandant, les stations sismiques autour du bassin enregistrent des pas : trois Krogoths, les forteresses ambulantes du Core, traversent les marais salants vers votre base, l'un après l'autre, chacun avec une escorte.\n\nRien là-dehors ne peut les arrêter, sauf vous. Le laser frontal d'un Krogoth porte plus loin que votre D-gun : gardez votre Commandant en retrait. Bombardiers, artillerie et Zeus en masse en viendront à bout. Perdez votre sang-froid et il traversera votre base.\n\nVous avez une base avec trois usines, quatre kbots de construction et une garnison. Détruisez-les tous les trois."
"Commander, seismic stations are reading footfalls round the basin. Three Krogoths are walking toward your base, one after another." = "Commandant, les stations sismiques enregistrent des pas autour du bassin. Trois Krogoths marchent sur votre base, l'un après l'autre."
"The first Krogoth has crossed the north-western rim. It is coming straight for you." = "Le premier Krogoth a franchi la crête nord-ouest. Il vient droit sur vous."
"Keep your Commander back: that head laser reaches further than your D-gun." = "Gardez votre Commandant en retrait : ce laser frontal porte plus loin que votre D-gun."
"The second Krogoth is through the northern pass, with rockets and anti-air round it." = "Le deuxième Krogoth a passé le col nord, avec des roquettes et de la DCA autour de lui."
"The last of them, out of the north-east, with the heaviest escort yet. End this, Commander." = "Le dernier, venu du nord-est, avec l'escorte la plus lourde jusqu'ici. Finissez-en, Commandant."

# apps/ta_game/scenarios/until_dawn.toml
"Until Dawn" = "Jusqu'à l'aube"
"Night falls on the timber. Hold your ridge until the sun comes up." = "La nuit tombe sur la forêt. Tenez votre crête jusqu'au lever du soleil."
"Commander, night is falling over Timberline, and the Core is moving through the forest under it. Your outpost holds the western ridge: the only road out of the valley runs past it.\n\nThe relief column cannot move before first light. Until then you are on your own. In the dark and the rain their raiders will be on you before you see them, so build radar, and keep your floodlights burning.\n\nYou have a small base, a kbot lab and two construction kbots. Hold until dawn, and keep your Commander alive." = "Commandant, la nuit tombe sur Timberline, et le Core avance à travers la forêt sous son couvert. Votre avant-poste tient la crête ouest : la seule route qui sort de la vallée passe devant lui.\n\nLa colonne de secours ne peut pas bouger avant les premières lueurs. D'ici là, vous êtes seul. Dans le noir et sous la pluie, leurs pillards seront sur vous avant que vous ne les voyiez : construisez des radars et gardez vos projecteurs allumés.\n\nVous avez une petite base, un Kbot Lab et deux kbots de construction. Tenez jusqu'à l'aube et gardez votre Commandant en vie."
"Outpost Echo, the Core is moving through the timber tonight. Hold your ridge until first light: the relief column marches at dawn." = "Avant-poste Écho, le Core traverse la forêt cette nuit. Tenez votre crête jusqu'aux premières lueurs : la colonne de secours part à l'aube."
"Raiders in the eastern trees. In this rain you will hear them before you see them." = "Des pillards dans les bois à l'est. Sous cette pluie, vous les entendrez avant de les voir."
"Pyros in the north-eastern woods. Keep them out of the trees round your base: the timber will burn." = "Des Pyros dans les bois au nord-est. Tenez-les loin des arbres autour de votre base : le bois va brûler."
"A convoy got through from the south-west. Four Zeus and two Jethros are yours, Commander." = "Un convoi est passé par le sud-ouest. Quatre Zeus et deux Jethros sont à vous, Commandant."
"Seismic contact in the south-east: heavy treads. They are saving the worst for the last hours of the night." = "Contact sismique au sud-est : chenilles lourdes. Ils gardent le pire pour les dernières heures de la nuit."
"Sunrise in one minute. The relief column is at the river. Hold on!" = "Lever du soleil dans une minute. La colonne de secours est à la rivière. Tenez bon !"


"[{name}] opened on this line is never closed: any section after it is read as part of it." = "此行打开的 [{name}] 始终没有被关闭：其后的任何段都会被当作它的一部分读取。"
"A /* comment opened on this line never ends: the rest of the file is read as a comment." = "此行开始的 /* 注释始终没有结束：文件的其余部分都会被当作注释读取。"


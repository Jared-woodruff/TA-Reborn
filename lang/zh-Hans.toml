# apps/ta_game/src/tips.rs
"Ctrl+right-drag draws a formation line: the selection spreads along it." = "Ctrl+右键拖动可画出队形线：选中单位会沿线展开。"
"Ctrl+drag draws a formation line: the selection spreads along it." = "Ctrl+拖动可画出队形线：选中单位会沿线展开。"
"Used to TA's original controls? Options, Controls: give orders with the left button." = "习惯 TA 原版的操作？可在“选项 · 操作”中设为用左键下达指令。"
"A right-click clears the selection or cancels the order you were about to give." = "右键单击可清除选择，或取消即将下达的指令。"
"Right-click one of your units for a ring of its orders; hold the button and flick towards a choice. A controller's B does the same." = "右键点击己方单位会展开其指令轮盘；按住按钮并向某个选项滑动也可以。手柄的 B 键同样可用。"
"Hold the right button on one of your units, or middle-click it, for a ring of its orders; flick towards a choice and let go." = "在己方单位上按住右键或用中键点击它，会展开其指令轮盘；向某个选项滑动后松开。"
"Metal extractors must sit on metal: {overlay_metal} shows the metal map, and {area_mex} puts an extractor on every metal spot you circle." = "金属提取器必须建在金属上：{overlay_metal} 显示金属地图，{area_mex} 可在你圈出的每个金属点上建造提取器。"
"Your Commander's D-gun ({dgun}) destroys almost anything it touches, including your own units in its path." = "指挥官的 D 炮（{dgun}）几乎能摧毁所触及的一切，包括路径上你自己的单位。"
"{perspective} climbs into the selected unit, or an ally's under the pointer, to see the battle through its eyes as it goes on with its orders. Escape climbs back out." = "按 {perspective} 进入选中单位或指针下的盟友单位，通过它的眼睛观看战斗，它会继续执行指令。按 Escape 退出。"
"Keep your metal and energy incomes above what you spend: building slows down for everything when a store runs dry." = "让金属和能量的收入高于支出：任何一种储存耗尽时，所有建造都会变慢。"
"Right-clicking a factory's queued unit removes it; clicking it builds it next." = "右键单击工厂队列中的单位可将其移除；单击则将其设为下一个建造。"
"Fight ({fight}) is attack-move: units stop to fight whatever they meet on the way." = "进击（{fight}）就是攻击移动：单位会停下来与途中遇到的一切交战。"
"Ctrl+click is force fire: the selection attacks whatever is there, your own units too, or the ground." = "Ctrl+单击为强制开火：选中单位会攻击该处的任何目标，包括你自己的单位或地面。"
"{select_builders} selects your constructors, {select_factories} your factories, {select_armed} your armed units, {select_on_screen} everything on the screen." = "{select_builders} 选择建造者，{select_factories} 选择工厂，{select_armed} 选择武装单位，{select_on_screen} 选择屏幕上的一切。"
"Patrol ({patrol}) with constructors makes them repair, assist and reclaim along the route by themselves." = "让建造者巡逻（{patrol}），它们会沿途自行维修、协助建造和回收。"
"Put a constructor on duty ({duty}) and it works by itself: the economy, repairs, reclaiming or defence. Any order you give takes it back." = "让建造者值勤（{duty}），它就会自行工作：经济、维修、回收或防御。你下达的任何命令都会把它召回。"
"Drag with Reclaim ({reclaim}) to turn every wreck, rock and tree in a circle into metal and energy." = "用回收（{reclaim}）拖出圆圈，可将圈内所有残骸、岩石和树木转化为金属和能量。"
"Ctrl+1 to Ctrl+9 make control groups; tap the number twice to look at the group." = "Ctrl+1 至 Ctrl+9 设定编队；连按两次数字键可将镜头移到该编队。"
"Hold {players} to see every player's side, team, units and income (your allies' in full)." = "按住 {players} 可查看每名玩家的阵营、队伍、单位和收入（盟友的信息完整显示）。"
"Radar towers show enemy units long before they come into sight: build one early." = "雷达塔能在敌方单位进入视野之前很久就发现它们：尽早建造一座。"
"Wind generators pay off on windy maps: the skirmish page shows each map's wind range." = "风力发电机在多风的地图上很划算：遭遇战页面会显示每张地图的风力范围。"
"Metal makers turn spare energy into metal, and stop when your energy runs dry." = "金属制造机会将多余的能量转化为金属，能量耗尽时则会停止。"
"Solar collectors fold shut for a few seconds when hit: tougher, but making no energy." = "太阳能收集器被击中时会闭合几秒：更耐打，但不产生能量。"
"Units gain veterancy with every kill: veterans aim better and shrug off damage." = "单位每次击杀都会积累经验：老兵瞄得更准，也更抗打。"
"Shift adds to the orders a unit already has instead of replacing them." = "按住 Shift 下达的指令会追加到单位现有的指令之后，而不是替换它们。"
"Alt+drag while placing a building fills a rectangle with it: handy for solar farms and walls." = "放置建筑时 Alt+拖动可填满一个矩形区域：建太阳能阵列和围墙时很方便。"
"Double-click a unit to select every unit of its type on screen; {select_type} selects them map-wide." = "双击一个单位可选择屏幕上所有同类单位；{select_type} 则选择全地图的同类单位。"
"{idle_builder} selects the next idle constructor, {idle_factory} the next idle factory." = "{idle_builder} 键选择下一个空闲建造者，{idle_factory} 键选择下一个空闲工厂。"
"Wrecks can be resurrected by resurrection kbots, or reclaimed for most of their metal." = "残骸可由复活机器人复活，也可回收以获得其大部分金属。"
"Hovering a unit shows its health, firepower and range; {overlay_path} shows where the selection can go." = "将指针悬停在单位上可显示其生命值、火力和射程；{overlay_path} 显示选中单位可以到达的区域。"
"{last_alert} (or Backspace) looks at the last place your units were attacked; press it again for the one before." = "{last_alert}（或 Backspace）可查看你的单位最近一次遇袭的位置；再按一次，查看更早的一处。"
"A notice or a piece of advice with LOOK on it takes you to the place, or the unit, when you click it." = "带有“查看”的通知或建议，点击后会带你前往相应的位置或单位。"
"{help} tells everything about the selected unit, or the one under the pointer: cost, speed, weapons, abilities." = "{help} 显示选中单位或指针下单位的全部信息：造价、速度、武器、能力。"
"{next_unit} looks at the next of your units off the screen; with units selected, the next of them." = "{next_unit} 查看屏幕外的下一个己方单位；若有选中单位，则查看其中的下一个。"
"Ctrl+F6 to Ctrl+F9 store camera positions; F6 to F9 bring them back." = "Ctrl+F6 至 Ctrl+F9 保存镜头位置；F6 至 F9 调用。"
"Anti-air matters: bombers can wreck an undefended economy in one pass." = "防空很重要：轰炸机一次掠过就能摧毁毫无防备的经济。"
"An advanced factory needs a lot of metal: build it once your extractors and power can feed it." = "高级工厂需要大量金属：等你的提取器和电力足以支撑时再建造。"
"Guarding a factory with a constructor adds its build power to the factory's production." = "让建造者护卫工厂，可将其建造力加入工厂的生产。"
"Moho mines extract far more metal than basic extractors: advanced constructors build them." = "Moho 矿井的金属产量远高于基础提取器：由高级建造者建造。"
"Every game is kept as a replay: watch it from the main menu, and jump through it with the bar." = "每局游戏都会保存为回放：可从主菜单观看，并用进度条跳转。"
"{overlay_sight} shows your sight, radar and sonar coverage; {overlay_height} shows the heights of the map." = "{overlay_sight} 显示视野、雷达和声呐的覆盖范围；{overlay_height} 显示地图高度。"
"The Commander can capture enemy units ({capture}): it takes a while, but the unit is yours." = "指挥官可以俘获敌方单位（{capture}）：需要一些时间，但单位将归你所有。"
"{photo_mode} opens photo mode: the battle holds still, and you can light, frame and focus a shot at up to 4K." = "{photo_mode} 打开拍照模式：战斗静止，你可以调整光照、构图和对焦，拍摄最高 4K 的照片。"
"TIP" = "提示"
"Dismiss" = "知道了"
"Don't show tips again" = "不再显示提示"

# apps/ta_game/src/tutorial.rs
"THE BASICS" = "基础"
"Your Commander, the camera, metal, energy and a first factory." = "你的指挥官、镜头、金属、能量和第一座工厂。"
"Selecting units" = "选择单位"
"The camera" = "镜头"
"Metal and energy" = "金属和能量"
"Factories" = "工厂"
"Welcome, Commander. The walking machine in the middle of the screen is your Commander: it builds, it fights, and losing it usually loses the battle. Click it to select it." = "欢迎，指挥官。屏幕中央那台行走的机器就是你的指挥官：它能建造，也能战斗，失去它通常就意味着输掉战斗。单击它以选中。"
"Lost sight of it? {select_commander} selects the Commander from anywhere, and SHOW ME brings the camera to it." = "找不到指挥官了？无论在哪里，按 {select_commander} 都能选中它；单击“查看位置”则会将镜头移到它那里。"
"Look around. The arrow keys, the screen edges or dragging with the middle button scroll; the mouse wheel zooms towards the cursor, and dragging with the right button turns the view." = "四处看看。方向键、屏幕边缘或按住中键拖动都可以滚动视图；鼠标滚轮朝光标处缩放，按住右键拖动可以旋转视角。"
"Push the pointer against an edge of the screen to scroll, or turn the mouse wheel to zoom." = "将指针推到屏幕边缘即可滚动视图，转动鼠标滚轮即可缩放。"
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the ECONOMY tab of the build menu at the bottom right and place it on the marked deposit." = "一切都由金属和能量造就。金属来自建在金属矿点上的提取器。选中指挥官，从右下角建造菜单的“经济”标签页中选择 Metal Extractor（金属提取器），并将其放在标记的矿点上。"
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the build menu on the left and place it on the marked deposit." = "一切都由金属和能量造就。金属来自建在金属矿点上的提取器。选中指挥官，从左侧建造菜单中选择 Metal Extractor（金属提取器），并将其放在标记的矿点上。"
"The outline turns green where the extractor can stand. Bring it onto the marked ring and click to place it." = "在可以放置提取器的位置，轮廓会变成绿色。把轮廓移到标记圈上，然后单击放置。"
"Energy comes from solar collectors and wind generators. Build a Solar Collector next to your Commander. The bars at the top show your stores and how fast they fill or drain; they warn you when one runs dry." = "能量来自太阳能收集器和风力发电机。在指挥官旁边建造一座 Solar Collector（太阳能收集器）。顶部的条显示你的储存量及其增减速度；储存即将耗尽时会发出警告。"
"The Solar Collector is a flat, square panel. Pick it, then click on open ground near the Commander." = "Solar Collector 是一块扁平的方形面板。选择它，然后单击指挥官附近的空地。"
"Factories build your army. Build a Kbot Lab (on the FACTORY tab) on a flat spot near the Commander, and wait for it to finish." = "工厂负责生产军队。在指挥官附近的平地上建造一座 Kbot Lab（机器人实验室，位于“工厂”标签页），并等待它完工。"
"Factories build your army. Build a Kbot Lab from the build menu on a flat spot near the Commander, and wait for it to finish." = "工厂负责生产军队。从建造菜单中选择 Kbot Lab（机器人实验室），建在指挥官附近的平地上，并等待它完工。"
"Building takes metal and energy as it goes: while either bar at the top is empty, everything builds more slowly." = "建造过程中会持续消耗金属和能量：只要顶部任一资源条见底，所有建造都会变慢。"
"Select the Kbot Lab and click the Peewee three times to queue three of them (right-click one to take it off the queue). New units wait in front of the lab." = "选中 Kbot Lab，单击 Peewee 三次，将三个 Peewee 加入队列（右键单击可从队列中移除一个）。新单位会在实验室前等候。"
"Click the lab itself on the map to select it: its build menu shows the units it makes." = "直接在地图上单击实验室将其选中：它的建造菜单会列出它能生产的单位。"
"That is the whole cycle: extract, generate, build, fight. Keep both incomes above what you spend and keep your builders busy. Lesson complete!" = "这就是完整的循环：开采、发电、建造、战斗。让两种收入都高于支出，并让建造者保持忙碌。课程完成！"
"Select and group an army, attack-move, and destroy an enemy outpost." = "选择并编组一支军队，进行攻击移动，摧毁一座敌方前哨。"
"Box selection" = "框选"
"Control groups" = "编队"
"Attack-move" = "攻击移动"
"Destroying a base" = "摧毁基地"
"Your Kbot Lab has built a squad of Peewees. Drag a box around them with the left mouse button to select them all." = "你的 Kbot Lab 已经造出了一小队 Peewee。按住鼠标左键拖出方框，将它们全部选中。"
"Press the left button on open ground beside the squad, hold it, drag the box over them all and let go." = "在小队旁边的空地上按下鼠标左键并按住，拖出方框框住所有单位，然后松开。"
"Press Ctrl+1 to make them group 1. Pressing 1 selects them again from anywhere; pressing it twice brings the camera to them." = "按 Ctrl+1 将它们设为编队 1。无论在哪里，按 1 都能再次选中它们；连按两次会将镜头移到它们那里。"
"Hold Ctrl and press 1 while the squad is selected." = "在选中小队的状态下，按住 Ctrl 再按 1。"
"The enemy has an outpost at the marked place. Fight is attack-move: units walk there and take on whatever they meet on the way. Press {fight}, then click near the outpost." = "敌人在标记处有一座前哨。进击就是攻击移动：单位会前往该处，并与途中遇到的一切交战。按 {fight}，然后单击前哨附近。"
"Select the squad first (press 1). Then press {fight}, or the Fight button among the orders, and click on the ground by the marked ring." = "先选中小队（按 1）。然后按 {fight}，或单击指令中的“进击”按钮，再单击标记圈旁边的地面。"
"Destroy every building of the outpost. Its laser tower hits hard: keep the squad together, and queue reinforcements at the lab if you need them." = "摧毁前哨的所有建筑。它的激光塔火力很猛：让小队保持集中，如有需要，可在实验室排产援军。"
"Losing the fight? Pull the squad back, queue more Peewees at the lab and go in again with all of them together." = "战况不利？把小队撤回来，在实验室多排产一些 Peewee，然后集结全部兵力再次进攻。"
"The outpost is gone. The wrecks it left are worth metal: builders reclaim them (next lesson). Lesson complete!" = "前哨已被摧毁。它留下的残骸蕴含金属：建造者可以回收它们（下一课）。课程完成！"
"ORDERS LIKE A VETERAN" = "老兵的指挥技巧"
"Map views, area orders, building blocks and build queues." = "地图视图、区域指令、成片建造和建造队列。"
"Map overlays" = "地图叠加层"
"Area orders" = "区域指令"
"Building blocks" = "成片建造"
"Build queues" = "建造队列"
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again. The MAP menu at the top right does the same." = "地图会显示地面隐藏的信息。按 {overlay_metal} 打开金属地图（{overlay_path} 显示单位可以到达的区域，{overlay_height} 显示高度，{overlay_sight} 显示视野和雷达）；再按一次同一个键即可隐藏。右上角的“地图”菜单功能相同。"
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again." = "地图会显示地面隐藏的信息。按 {overlay_metal} 打开金属地图（{overlay_path} 显示单位可以到达的区域，{overlay_height} 显示高度，{overlay_sight} 显示视野和雷达）；再按一次同一个键即可隐藏。"
"Press {overlay_metal}: the metal deposits light up all over the map." = "按 {overlay_metal}：整张地图上的金属矿点都会亮起来。"
"Select the Commander, press {area_mex} and drag a circle over the marked deposits: every metal spot inside gets an extractor, nearest first. A plain click takes the metal around the cursor." = "选中指挥官，按 {area_mex} 并在标记的矿点上拖出圆圈：圈内每个金属点都会建起一座提取器，由近及远。直接单击则覆盖光标周围的金属点。"
"With the Commander selected, press {area_mex}, then press on the ground over the deposits and drag outwards: the circle grows as you drag." = "选中指挥官后按 {area_mex}，然后在矿点上方的地面上按下鼠标并向外拖动：圆圈会随着拖动变大。"
"Many orders work on areas. Press {reclaim} (reclaim) and drag a circle over the rocks near your base: the Commander turns every one into metal." = "许多指令都可作用于区域。按 {reclaim}（回收）并在基地附近的岩石上拖出圆圈：指挥官会把它们全部变成金属。"
"Rocks and wrecks are worth metal. With the Commander selected, press {reclaim}, then press on the ground and drag the circle over a few rocks." = "岩石和残骸都蕴含金属。选中指挥官后按 {reclaim}，然后在地面上按下鼠标，拖动圆圈罩住几块岩石。"
"Hold Alt while you drag out a building to fill a whole block with it. Pick the Solar Collector, hold Alt and drag out a block of four or more." = "拖放建筑时按住 Alt，可用它填满一整块区域。选择 Solar Collector，按住 Alt 拖出一块包含四座或更多的区域。"
"Pick the Solar Collector, then hold Alt, press on the ground and drag: a block of outlines follows the pointer. Let go to place them all." = "选择 Solar Collector，然后按住 Alt，在地面上按下鼠标并拖动：一整片轮廓会跟随指针移动。松开即可全部放置。"
"The Commander's queued buildings show under BUILD QUEUE, beside its picture at the bottom of the screen. Click one to build it next (right-click drops it). A factory's queue works the same way." = "指挥官队列中的建筑会显示在屏幕底部、其头像旁的“建造队列”下方。单击其中一个可将其设为下一个建造（右键单击则取消）。工厂的队列也是如此。"
"The BUILD QUEUE shows while the Commander alone is selected and has buildings waiting. Click any but the first: that one is being built." = "只有单独选中指挥官、且有建筑在排队时，才会显示“建造队列”。单击除第一个以外的任意一个：第一个正在建造中。"
"Area orders, building blocks and queues save you hundreds of clicks in a battle. Lesson complete!" = "区域指令、成片建造和队列能在战斗中为你省下数百次点击。课程完成！"
"HOLD THE LINE" = "坚守防线"
"Defences, radar, repairs, and the metal in wrecks." = "防御设施、雷达、维修，以及残骸中的金属。"
"Defences" = "防御设施"
"Radar" = "雷达"
"Repairs" = "维修"
"Reclaiming wrecks" = "回收残骸"
"Raiders will come from the marked direction. Build a Light Laser Tower (on the DEFENCE tab) in the marked ring: towers shoot whatever comes in range." = "突袭部队将从标记的方向来犯。在标记圈内建造一座 Light Laser Tower（轻型激光塔，位于“防御”标签页）：防御塔会射击进入射程的任何目标。"
"Raiders will come from the marked direction. Build a Light Laser Tower from the build menu in the marked ring: towers shoot whatever comes in range." = "突袭部队将从标记的方向来犯。从建造菜单中选择 Light Laser Tower（轻型激光塔），建在标记圈内：防御塔会射击进入射程的任何目标。"
"The Light Laser Tower is a small gun on a post. Pick it, put it in the ring and wait for it to finish." = "Light Laser Tower 是架在柱子上的一门小炮。选择它，放进标记圈内，然后等待它完工。"
"Build a Radar Tower (on the SENSORS tab) near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "在基地附近建造一座 Radar Tower（雷达塔，位于“传感器”标签页）。早在你的单位看到敌人之前，雷达就会在地图和小地图上以光点显示它们。"
"Build a Radar Tower from the build menu near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "从建造菜单中选择 Radar Tower（雷达塔），建在基地附近。早在你的单位看到敌人之前，雷达就会在地图和小地图上以光点显示它们。"
"The Radar Tower is a tall mast. Pick it, place it near the Commander and wait for it to finish." = "Radar Tower 是一根高高的天线杆。选择它，放在指挥官附近，然后等待它完工。"
"Here they come: raiders on your radar. Keep the Commander by the tower and let them come to you: together they hold the line." = "敌人来了：雷达上出现了突袭部队。让指挥官守在防御塔旁，等敌人自己送上门来：两者联手就能守住防线。"
"Do not chase them: the tower only fights what comes in range. Keep the Commander beside it; while it fights, the Commander can mend it ({repair}, then click the tower)." = "不要追击：防御塔只会攻击进入射程的敌人。让指挥官待在它旁边；防御塔作战时，指挥官可以维修它（按 {repair}，然后单击防御塔）。"
"The fight left a building damaged. Select the Commander, press {repair} and click it: builders mend what is damaged." = "战斗让一座建筑受损了。选中指挥官，按 {repair} 并单击它：建造者可以维修受损的单位和建筑。"
"With the Commander selected, press {repair}, then click the damaged building. Its health bar fills as it is mended." = "选中指挥官后按 {repair}，然后单击受损的建筑。随着维修进行，它的生命条会逐渐填满。"
"The raiders left wrecks, and wrecks are worth metal. Select the Commander, press {reclaim} and click a wreck, or drag a circle over them all." = "突袭部队留下了残骸，而残骸蕴含金属。选中指挥官，按 {reclaim} 并单击一处残骸，或拖出圆圈罩住所有残骸。"
"Wrecks lie where the raiders fell. With the Commander selected, press {reclaim} and click one: the metal bar rises as it is taken apart." = "残骸就在突袭部队倒下的地方。选中指挥官后按 {reclaim}，然后单击其中一处：随着残骸被拆解，金属条会逐渐增长。"
"Towers hold ground while your army is elsewhere, radar sees what is coming, and builders mend and recycle. Lesson complete!" = "军队在别处时，防御塔能守住阵地；雷达能提前发现来敌；建造者负责维修和回收。课程完成！"
"BUILDERS AND FACTORIES" = "建造者与工厂"
"Builders that help, factories that keep building, patrols and standing orders." = "互相协助的建造者、持续生产的工厂、巡逻和常设指令。"
"Construction units" = "建造者"
"Helping a factory" = "协助工厂"
"Rally points" = "集结点"
"Standing orders" = "常设指令"
"One builder is slow. Select the Kbot Lab and build a Construction Kbot: it builds what the Commander builds, and more besides." = "只有一个建造者太慢了。选中 Kbot Lab，生产一台 Construction Kbot（建造机器人）：指挥官能建造的它都能建造，而且还能建造更多。"
"Click the lab on the map to select it; the Construction Kbot is in its build menu. Wait for it to walk out." = "在地图上单击实验室将其选中；Construction Kbot 就在它的建造菜单中。等它走出实验室。"
"Builders help each other. Select the Construction Kbot, press {guard} and click the Kbot Lab: it lends the lab its build power, and the lab builds faster." = "建造者可以互相协助。选中 Construction Kbot，按 {guard} 并单击 Kbot Lab：它会把建造力借给实验室，让实验室生产得更快。"
"With the Construction Kbot selected, press {guard}, then click the lab. It stays by the lab and helps with everything it makes." = "选中 Construction Kbot 后按 {guard}，然后单击实验室。它会留在实验室旁，协助生产实验室制造的所有单位。"
"Factories send their units where you say. Select the Kbot Lab. {order_click} on open ground nearby: new units gather there." = "工厂会把生产的单位派往你指定的地点。选中 Kbot Lab，然后{order_click}附近的空地：新单位会在那里集结。"
"Select the lab first. With it selected, {order_click} on the ground where its units should gather." = "先选中实验室。在选中状态下，{order_click}你希望单位集结的地面。"
"Turn on Repeat for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "为实验室开启“重复”：它完成的单位会重新排到队列末尾，因此生产永不停歇。"
"Turn on REPEAT BUILD for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "为实验室开启“重复建造”：它完成的单位会重新排到队列末尾，因此生产永不停歇。"
"Select the lab, then turn Repeat on: the pointer shows where it is." = "选中实验室，然后开启“重复”：箭头会指出它的位置。"
"Builders on patrol mend and reclaim whatever they pass. Select the Construction Kbot, press {patrol} and click on the far side of your base." = "巡逻中的建造者会维修和回收沿途经过的一切。选中 Construction Kbot，按 {patrol} 并单击基地的另一侧。"
"With the Construction Kbot selected, press {patrol}, then click on the ground: it walks back and forth between there and where it stood." = "选中 Construction Kbot 后按 {patrol}，然后单击地面：它会在该处与原先所在的位置之间来回巡逻。"
"Units keep standing orders. Select your Peewees and set their fire order to Hold fire with the button beside the orders: they will not shoot until you say." = "单位会一直遵守常设指令。选中你的 Peewee，用指令旁边的按钮把开火指令设为“停火”：在你下令之前，它们都不会开火。"
"Units keep standing orders. Select your Peewees and set their FIRE ORDERS to Hold fire: they will not shoot until you say." = "单位会一直遵守常设指令。选中你的 Peewee，把“开火指令”设为“停火”：在你下令之前，它们都不会开火。"
"Select the Peewees, then click the fire order button until it shows HOLD FIRE: each click is the next order." = "选中 Peewee，然后反复单击开火指令按钮，直到它显示“停火”：每单击一次就切换到下一个指令。"

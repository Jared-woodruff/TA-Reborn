"COB instruction {instruction} at word {word} has an invalid piece index." = "第 {word} 字处的 COB 指令 {instruction} 的部件索引无效。"
"COB instruction {instruction} at word {word} has an invalid static variable index." = "第 {word} 字处的 COB 指令 {instruction} 的静态变量索引无效。"
"COB instruction {instruction} at word {word} has an invalid jump destination." = "第 {word} 字处的 COB 指令 {instruction} 的跳转目标无效。"
"COB instruction {instruction} at word {word} has an invalid function index." = "第 {word} 字处的 COB 指令 {instruction} 的函数索引无效。"
"Recompile the script with valid piece, variable, function and jump references." = "请使用有效的部件、变量、函数和跳转引用重新编译脚本。"
"This script asks the engine for unit value {values}, which Reborn does not answer: it reads 0, so what the script does with it may not happen as in the engine it was made for." = "此脚本向引擎查询单位值 {values}，Reborn 不会作答：读到的是 0，因此脚本据此执行的行为可能与它所针对的引擎中不同。"
"A later patch of TA's engine defines these values: report them, and what the mod does with them, to Reborn's maintainers." = "这些值由 TA 引擎的后期补丁定义：请把它们以及模组对它们的用法报告给 Reborn 的维护者。"
"This script sets unit value {values}, which Reborn does not answer: setting it does nothing, so what the script means by it does not happen as in the engine it was made for." = "此脚本设置单位值 {values}，Reborn 不会响应：设置不起任何作用，因此脚本想借此实现的效果不会像在它所针对的引擎中那样发生。"
"The retained diagnostic/reference budget was exceeded. This is a partial report, not a clean validation." = "保留的诊断/引用预算已超出。这是一份不完整的报告，并不表示验证通过。"
"Reduce the pack's number of definitions or split optional content; rerun validation after resolving reported issues." = "请减少该包中的定义数量，或拆分可选内容；解决所报告的问题后，请重新运行验证。"
"{what} is defined twice; the game keeps both, two sides of one name." = "{what} 被定义了两次；游戏会两者都保留，成为同名的两个阵营。"
"Give each side a name of its own, or remove the one not meant to be played." = "请为每个阵营起各自的名字，或移除不打算使用的那一个。"
"{what} is defined twice in this file; the game uses the later one." = "{what} 在此文件中被定义了两次；游戏使用后面的那个。"
"Give each definition a name of its own, or remove the one not meant to be used." = "请为每个定义起各自的名字，或移除不打算使用的那一个。"
"{what} is also defined in {other}; the game uses this one ({this})." = "{what} 在 {other} 中也有定义；游戏使用这一个（{this}）。"
"The game opens archives only at the mod's top level; this one, in a subfolder, is never read." = "游戏只会打开模组顶层的归档；位于子文件夹中的这个归档永远不会被读取。"
"Move the archive to the mod's top level, or unpack its contents into the mod's folders." = "请把归档移到模组的顶层，或将其内容解压到模组的各个文件夹中。"
"The game's folders are inside {folder}: the game reads units/, weapons/, maps/… only at the mod's top level, so nothing in it is used." = "游戏的各个文件夹位于 {folder} 之内：游戏只在模组顶层读取 units/、weapons/、maps/…，因此其中的内容都不会被使用。"
"Move the contents of this folder up to the mod's top level." = "请把此文件夹中的内容移到模组的顶层。"
"{n} files at the mod's top level are where the game never reads them; this one's kind is read from {home}." = "模组顶层的 {n} 个文件位于游戏永远不会读取的位置；此类文件应放在 {home} 读取。"
"{n} files under {folder} are where the game never reads them; this one's kind is read from {home}." = "{folder} 下的 {n} 个文件位于游戏永远不会读取的位置；此类文件应放在 {home} 读取。"
"Move each file to the folder the game reads its kind from." = "请把每个文件移到游戏读取该类文件的文件夹中。"
"The game never reads this file: it reads {kind} files from {home}." = "游戏永远不会读取此文件：它从 {home} 读取{kind}文件。"
"Move it to that folder, or remove it if it is not needed." = "请把它移到该文件夹，若不需要则将其移除。"
"This file cannot be read: {error}" = "无法读取此文件：{error}"
"Reinstall the package and check that its archives are intact and readable." = "请重新安装该包，并检查其归档是否完整、可读。"
"This text file exceeds the validator's per-file text budget and was not parsed." = "此文本文件超出了验证器对单个文件的文本预算，未经解析。"
"Split large definition files into smaller files before validating again." = "请先把较大的定义文件拆分为较小的文件，再重新验证。"
"Model texture" = "模型纹理"
"Map feature" = "地图地物"
"The terrain has no matching OTA metadata and cannot appear as a normal selectable map." = "此地形没有匹配的 OTA 元数据，无法作为可选的普通地图出现。"
"Include a matching maps/<name>.ota with a GlobalHeader and playable schemas." = "请附上匹配的 maps/<name>.ota，其中含有 GlobalHeader 和可玩的方案。"
"This sound will not play: {problem}." = "此音效将无法播放：{problem}。"
"Save it as a WAV file in PCM (8 or 16-bit) or IMA ADPCM, as TA's own sounds are." = "请把它另存为 PCM（8 位或 16 位）或 IMA ADPCM 的 WAV 文件，与 TA 自带的音效一样。"
"Correct the brackets and braces around this line: the game reads the file as it is and skips or misplaces what follows." = "请更正此行前后的方括号和花括号：游戏会按原样读取该文件，后面的内容会被跳过或归错位置。"
"[{section}] footprint {x} × {z} is clamped to 1..{max} cells a side by Reborn." = "[{section}] 的占地 {x} × {z} 会被 Reborn 限制在每边 1..{max} 格。"
"Use footprints within the supported range and regenerate the matching yard map." = "请使用受支持范围内的占地，并重新生成匹配的 yard map。"
"Missing [UNITINFO]; this unit is skipped." = "缺少 [UNITINFO]；此单位将被跳过。"
"Add a UNITINFO section with a non-empty UnitName." = "请添加带有非空 UnitName 的 UNITINFO 段。"
"UNITINFO has no usable UnitName; this unit is skipped." = "UNITINFO 中没有可用的 UnitName；此单位将被跳过。"
"Give the unit a unique, non-empty UnitName and update its references." = "请给该单位一个唯一的非空 UnitName，并更新对它的引用。"
"{name} model" = "{name} 的模型"
"{name} script" = "{name} 的脚本"
"{name} {key}" = "{name} {key}"
"{name} death explosion" = "{name} 的死亡爆炸"
"{name} self-destruct explosion" = "{name} 的自毁爆炸"
"{name} wreckage" = "{name} 的残骸"
"{name} faction" = "{name} 阵营"
"{name} sounds" = "{name} 的音效"
"{name} movement class" = "{name} 的移动类别"
"{name} projectile model" = "{name} 的弹体模型"
"{name} explosion" = "{name} 的爆炸"
"{name} water explosion" = "{name} 的水中爆炸"
"{name} lava explosion" = "{name} 的熔岩爆炸"
"{name} firing sound" = "{name} 的开火音效"
"{name} impact sound" = "{name} 的命中音效"
"{name} water impact sound" = "{name} 的入水命中音效"
"{name} uses unsupported RenderType={n}; Reborn will use its fallback projectile appearance." = "{name} 使用了不受支持的 RenderType={n}；Reborn 将改用其后备的弹体外观。"
"Use TA RenderType 0..7, or report the required extension to Reborn's maintainers." = "请使用 TA 的 RenderType 0..7，或将所需的扩展报告给 Reborn 的维护者。"
"{name} feature model" = "{name} 的地物模型"
"{name} animation" = "{name} 的动画"
"{name} shadow" = "{name} 的阴影"
"{name} burn animation" = "{name} 的燃烧动画"
"{name} dead replacement" = "{name} 的损毁替换物"
"{name} burnt replacement" = "{name} 的烧毁替换物"
"{name} reclaimed replacement" = "{name} 的回收替换物"
"{name} burning weapon" = "{name} 的燃烧武器"
"{category} {key} sound" = "{category} {key} 音效"
"[{section}] needs a faction name and starting commander." = "[{section}] 需要阵营名称和初始指挥官。"
"Set name and commander to a valid faction and UnitName." = "请将 name 和 commander 设为有效的阵营名称和 UnitName。"
"{name} starting commander" = "{name} 的初始指挥官"
"Owner of a build list for the computer players" = "电脑玩家建造列表的所属单位"
"{name} build option for the computer players" = "{name} 的电脑玩家建造选项"
"Download build-menu owner" = "下载建造菜单的所属单位"
"{name} build option" = "{name} 的建造选项"
"Missing [GlobalHeader]; this map has no usable metadata." = "缺少 [GlobalHeader]；此地图没有可用的元数据。"
"Export a matching OTA with a GlobalHeader and the desired game-type schemas." = "请导出匹配的 OTA，其中含有 GlobalHeader 和所需的游戏类型方案。"
"Map terrain, without which the map is left out of the lists" = "地图地形，缺少它的地图会被排除在列表之外"
"Map meteor weapon" = "地图陨石武器"
"Map placed unit/feature" = "地图上放置的单位/地物"
"This tolerant TDF parse contains no sections; section-based consumers ignore it." = "这次宽松的 TDF 解析结果中没有任何段；依赖段的使用方会忽略它。"
"Check the intended format and section headers if this file should define game content." = "如果此文件应当定义游戏内容，请检查其预期格式和段标题。"
"{what} defined here is never used: {later} ({whose}) defines it too and comes later, so the game uses that one." = "此处定义的 {what} 不会被使用：{later}（{whose}）也定义了它，且排在后面，因此游戏使用那一个。"
"{n} definitions in this file are never used: other files define them too and come later, so the game uses those (for one, {what} is also in {later}, {whose})." = "此文件中的 {n} 个定义不会被使用：其他文件也定义了它们，且排在后面，因此游戏使用那些（例如 {what} 同样出现在 {later}，{whose}）。"
"Replace those files in the mod (give yours their paths), or name your file so that it sorts after them." = "请在模组中替换那些文件（让你的文件使用它们的路径），或者给你的文件命名，使其排在它们之后。"
"{name} production button" = "{name} 的生产按钮"
"No playable side definitions were loaded." = "没有加载到可玩的阵营定义。"
"Include gamedata/sidedata.tdf or inherit the base game's valid sides." = "请附上 gamedata/sidedata.tdf，或沿用基础游戏的有效阵营。"
"Include the referenced asset/definition, correct its name, or declare and install the required mod dependency. Names are case-insensitive." = "请附上被引用的资源/定义，更正其名称，或声明并安装所需的模组依赖项。名称不区分大小写。"
"Model texture: textures {names} are missing." = "模型纹理：缺少纹理 {names}。"
"{whats}: {what} is an empty file here, which blanks it out: nothing of it is read." = "{whats}：{what} 在此处是一个空文件，等于将其清空：其中的内容一概不会被读取。"
"{whats}: {what} is missing." = "{whats}：缺少 {what}。"
"Referenced weapon explosions require at least {texels} padded sprite texels, beyond a {side} x {side} reference atlas, even drawn reduced. Frames will be omitted at this capacity; map features, generated effects and shelf packing need additional room." = "被引用的武器爆炸至少需要 {texels} 个含边距的精灵纹素，即使缩小绘制，也超出了 {side} x {side} 的参考图集。按此容量，部分帧将被省略；地图地物、生成的特效和货架式排布还需要额外的空间。"
"Reduce explosion frame sizes/counts or split optional effects. Test on the target GPU; this static check uses a reference atlas size." = "请减小爆炸帧的尺寸/数量，或拆分可选特效。请在目标 GPU 上测试；此静态检查使用的是参考图集的尺寸。"
"{what} has no frames or contains a frame larger than the {side}-pixel reference atlas side including padding." = "{what} 没有帧，或含有一帧的大小（含边距）超过了 {side} 像素的参考图集边长。"
"Include usable frames and resize oversized animation frames." = "请附上可用的帧，并缩小过大的动画帧。"
"{name} ({px} px)" = "{name}（{px} px）"
"{n} more" = "另有 {n} 个"
"The weapons' explosions take {full} Mi texels as painted, more than the {budget} Mi the game gives them in a {side} x {side} atlas: {n} of them, larger than TA's own, are drawn reduced to {share}% of their texels across, each as big as painted ({named})." = "武器爆炸按绘制尺寸共占 {full} Mi 纹素，超过了游戏在 {side} x {side} 图集中给它们的 {budget} Mi：其中 {n} 个比 TA 自带的更大，会缩小绘制，宽度只取其纹素的 {share}%，但每个仍与原绘制尺寸一样大（{named}）。"
"Nothing to do: the game draws them so. Smaller paintings would keep more of their detail." = "无需处理：游戏就是这样绘制它们的。画得更小的话，可以保留更多细节。"
"Large: {frames} frames up to {largest} pixels across, {millions} million pixels in all, more than the game decodes at once. It reads them a frame at a time and draws them reduced, each as big as painted: a weapon's explosion is read so." = "体积大：共 {frames} 帧，最宽达 {largest} 像素，合计 {millions} 百万像素，超过了游戏一次可解码的量。游戏会一帧一帧地读取并缩小绘制，但每帧仍与原绘制尺寸一样大：武器爆炸就是这样读取的。"
"Nothing to do: the game draws it so. Smaller paintings would load faster and keep more of their detail." = "无需处理：游戏就是这样绘制它的。画得更小的话，加载更快，也能保留更多细节。"
"Build lists for the computer players (TA 3.1's [CANBUILD]). Builders: {builders}; entries: {entries}." = "电脑玩家的建造列表（TA 3.1 的 [CANBUILD]）。建造者：{builders}；条目：{entries}。"
"Computer players build from them. Build menus offer what the mod's menu pages and download lists put on them, as TA's did: what only these lists name is the computer players' alone." = "电脑玩家依据这些列表建造。与 TA 原版一样，建造菜单提供的是模组的菜单页面和下载列表放入其中的单位：只在这些列表中出现的单位，仅供电脑玩家使用。"
"Side panels laid out for a screen {height} pixels tall, as the patched engines of later years drew them (TA's are 480). Pages: {pages}." = "按 {height} 像素高的屏幕布局的侧边面板，与后来几年打过补丁的引擎所绘制的一样（TA 原版为 480）。页数：{pages}。"
"The classic interface lays them out as the mod does: its build places, page arrows and orders where the mod puts them." = "经典界面会按模组的方式布局：建造格位、翻页箭头和指令都位于模组所设的位置。"
"Build buttons off TA's grid of 64-pixel places: several sharing a place, or one taking several. Buttons: {buttons}; pages: {pages}." = "偏离 TA 原版 64 像素格位网格的建造按钮：多个按钮共用一个格位，或一个按钮占用多个格位。按钮：{buttons}；页数：{pages}。"
"The classic interface lays them out as the mod does, and a click builds the unit of the button under it. The modern interface shows a place several buttons share as one picture, its parts marked." = "经典界面会按模组的方式布局，点击时会建造指针下方按钮所对应的单位。现代界面会将多个按钮共用的格位显示为一张图片，并标出其中各部分。"
"Scripts asking the engine for unit values of TA's later patches ({values}). Scripts: {scripts}." = "向引擎查询 TA 后期补丁所定义单位值（{values}）的脚本。脚本：{scripts}。"
"TA Reborn answers them as those engines did: TA 3.1's questions about units by their IDs (69 to 75), a later patch's cloak (111)." = "TA Reborn 会像那些引擎一样作答：TA 3.1 按单位 ID 提出的查询（69 至 75），以及某个后期补丁的隐形（111）。"
"TA Reborn finds a weapon by its name and never reads its ID: IDs make no difference here." = "TA Reborn 按名称查找武器，从不读取其 ID：ID 在这里没有任何影响。"
"Weapon IDs past 255, the highest TA's own engine numbered (the weapon patches of later years went further). Weapons: {n}; the highest ID: {max}." = "超过 255 的武器 ID（255 是 TA 原版引擎的最大编号，后来几年的武器补丁编号更高）。武器：{n}；最高 ID：{max}。"
"Weapons sharing an ID with another weapon: {names}." = "与其他武器共用 ID 的武器：{names}。"
"Sides of its own: {names}." = "自有阵营：{names}。"
"Offered with the others when a skirmish or a multiplayer battle is set up." = "设置遭遇战或多人对战时，与其他阵营一同供选择。"
"Campaigns of its own: {n}." = "自有战役：{n} 个。"
"Played from the campaign screen, with TA's own." = "可在战役界面中游玩，与 TA 原版的战役并列。"
"Files for TA's own computer players (ai/): {n}." = "TA 原版电脑玩家的文件（ai/）：{n} 个。"
"Not used: TA Reborn's computer players are its own. They build from the mod's build lists and menus." = "未使用：TA Reborn 使用自己的电脑玩家。它们依据模组的建造列表和菜单进行建造。"
"Programs and engine patches: {names}." = "程序和引擎补丁：{names}。"
"Not used: TA Reborn runs no program a mod brings. What a patch changed in TA's engine is there only where TA Reborn plays it itself, as told here." = "未使用：TA Reborn 不运行模组附带的任何程序。补丁对 TA 引擎的改动，只有在 TA Reborn 自行实现之处才会存在，如此处所述。"
"This file is empty: TA's way of blanking out a file of the same name below it (the original game's, or that of a mod it is mounted over). The game reads nothing from it." = "此文件为空：这是 TA 清空其下方同名文件的做法（该文件属于原版游戏，或属于它所挂载其上的某个模组）。游戏不会从中读取任何内容。"
"{n} empty files here ({files}): TA's way of blanking out files of the same names below them (the original game's, or those of a mod they are mounted over). The game reads nothing from them." = "此处有 {n} 个空文件（{files}）：这是 TA 清空其下方同名文件的做法（这些文件属于原版游戏，或属于它们所挂载其上的某个模组）。游戏不会从中读取任何内容。"
"Nothing to do if they are meant to remove those files. If one should hold data, export it again." = "如果它们本来就是用来移除那些文件的，则无需处理。如果其中某个应当包含数据，请重新导出。"
"Texture {name} has {frames} frames; Reborn's model vertices address at most 255 and this entry uses fallback paint." = "纹理 {name} 有 {frames} 帧；Reborn 的模型顶点最多寻址 255 帧，因此此条目使用后备涂装。"
"Reduce this texture entry to at most 255 frames." = "请将此纹理条目减少到至多 255 帧。"
"Texture {name} ({frames} frames) falls back: the textures the models paint with fill the reference GPU profile's {banks} arrays of {layers} layers ({before} layers before it; one is reserved for fallback). Actual device limits may differ." = "纹理 {name}（{frames} 帧）改用后备涂装：模型所用的纹理已占满参考 GPU 配置的 {banks} 个数组、每个 {layers} 层（在它之前已占 {before} 层；另保留一层作后备）。实际设备的限制可能不同。"
"Consolidate duplicate textures or reduce animation/team frame counts. Test on the target GPU; higher limits do not fix unsupported frame counts." = "请合并重复的纹理，或减少动画/队伍颜色的帧数。请在目标 GPU 上测试；更高的上限并不能解决不受支持的帧数。"
"{script} declares piece {piece}, which is absent from {model}. Any animation or position query using it has no matching model part." = "{script} 声明了部件 {piece}，但 {model} 中没有它。任何使用该部件的动画或位置查询都找不到对应的模型部件。"
"{script} declares pieces {pieces}, which are absent from {model}. Any animation or position query using them has no matching model part." = "{script} 声明了部件 {pieces}，但 {model} 中没有它们。任何使用这些部件的动画或位置查询都找不到对应的模型部件。"
"Confirm that these are intentional virtual/helper pieces; otherwise use matching model and COB files or align the BOS piece declarations with the model's piece names." = "请确认这些是有意设置的虚拟/辅助部件；否则请使用相匹配的模型和 COB 文件，或让 BOS 的部件声明与模型的部件名一致。"
"{unit} has {weapon} but its script {script} has no {function}: if the weapon fires, its shots leave from the unit's centre, not a barrel." = "{unit} 有 {weapon}，但其脚本 {script} 中没有 {function}：如果该武器开火，弹体会从单位的中心射出，而不是从炮管射出。"
"{unit} has {weapons} but its script {script} has no {functions}: if they fire, their shots leave from the unit's centre, not a barrel." = "{unit} 有 {weapons}，但其脚本 {script} 中没有 {functions}：如果它们开火，弹体会从单位的中心射出，而不是从炮管射出。"
"Add the functions to the unit's BOS script, returning the pieces the shots leave from, and recompile." = "请在该单位的 BOS 脚本中添加这些函数，返回弹体射出处的部件，然后重新编译。"
"{unit} builds but its script {script} has no QueryNanoPiece: its build spray comes from the unit's centre." = "{unit} 能够建造，但其脚本 {script} 中没有 QueryNanoPiece：其建造喷束会从单位的中心发出。"
"Add QueryNanoPiece to the unit's BOS script, returning its nano-lathe piece, and recompile." = "请在该单位的 BOS 脚本中添加 QueryNanoPiece，返回其纳米车床部件，然后重新编译。"
"{unit} can be built but has no picture ({picture}): TA's classic panels and the encyclopaedia show none; Reborn's own panel draws one from its model." = "{unit} 可以被建造，但没有图片（{picture}）：TA 的经典面板和百科中不会显示图片；Reborn 自己的面板则会根据其模型绘制一张。"

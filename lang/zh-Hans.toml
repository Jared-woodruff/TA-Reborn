# apps/ta_game/scenarios/armageddon.toml
"Armageddon" = "末日决战"
"Two armies, one plain, no retreat. Win the battle of the war." = "两军对垒，一片平原，没有退路。打赢这场决战。"
"Commander, the Core's main army is marching north across the Mounds, and ours stands in its way. There are no bases here, no factories, no reinforcements: what you have is all you will ever have.\n\nThey outnumber us. We outgun them. Put the Lugers and the Merls on their columns as they close, hold the line with the Zeus, and keep the Jethros with the tanks: they will bring gunships. Their reserves arrive two and a half minutes in.\n\nDestroy every one of them." = "指挥官，Core 的主力部队正越过 Mounds of Mars 向北推进，而我军正挡在它的去路上。这里没有基地，没有工厂，也没有援军：你手上的就是你的全部。\n\n他们人数占优，我们火力占优。敌军纵队逼近时，用 Luger 和 Merl 轰击他们；用 Zeus 守住防线；让 Jethro 跟紧坦克：他们会派出武装直升机。他们的预备队将在开战两分半钟后抵达。\n\n把他们全部消灭。"
"Arm Command" = "Arm 指挥部"
"Here they come. Hold the line, and keep the Jethros with the tanks." = "他们来了。守住防线，让 Jethro 跟着坦克。"
"Their reserves are coming up behind the mounds, a Goliath at their head." = "他们的预备队正从土丘后方赶来，领头的是一台 Goliath。"

# apps/ta_game/scenarios/armistice.toml
"The Armistice" = "停战协定"
"Five minutes of peace to build an army. Then the war resumes." = "五分钟的和平用来组建军队。然后战争继续。"
"Commander, the peace talks on Reactor Grid have failed. The armistice holds for five more minutes: until then no weapon may fire, and neither side may build near the other's base. When it ends, the war resumes.\n\nBoth sides are rearming at a furious pace: resources and construction run at twice their usual speed, and the treaty's one lasting clause bans missile silos. Their Commander knows the clock as well as you do.\n\nBuild as you have never built. When the armistice ends, destroy the Core Commander." = "指挥官，Reactor Grid 上的和谈已经破裂。停战还会维持五分钟：在那之前任何武器都不得开火，双方都不得在对方基地附近建造。停战一结束，战争就会继续。\n\n双方都在以疯狂的速度重新武装：资源和建造都以平时两倍的速度进行，而条约唯一保留下来的条款禁止导弹发射井。他们的指挥官和你一样清楚这个时钟。\n\n以前所未有的速度建造。停战结束时，摧毁 Core 的指挥官。"
"The talks have failed. For five minutes no weapon fires and nobody builds near the other's base. Then it is war: build as you have never built." = "和谈破裂了。五分钟内任何武器都不会开火，也没人能在对方基地附近建造。之后就是战争：以前所未有的速度建造。"
"Their factories are running day and night. Ours should be too." = "他们的工厂日夜不停地运转。我们的也该如此。"
"Core Overseer" = "Core 监管者"
"Ten seconds, Arm. We have counted every one of your factories." = "还有十秒，Arm。你们的每一座工厂我们都数过了。"
"Their Commander is somewhere in that grid. Find it, and end this war for good." = "他们的指挥官就在那片网格的某处。找到它，彻底结束这场战争。"

# apps/ta_game/scenarios/brothers_in_arms.toml
"Brothers in Arms" = "战友"
"You and an allied Commander against two of the Core's." = "你和一位盟军指挥官对抗两名 Core 指挥官。"
"Commander, you are not alone on Highland Rift. Commander Holt's forces hold the river crossings in the north, beside yours in the north-western highlands. Two Core Commanders are dug in to the south, across the canyon.\n\nHolt's computer will fight its own war, but it is the same war: back it up when it is hard pressed, and it will do the same for you. Your forces see what its forces see.\n\nDestroy both Core Commanders. Keep yours alive." = "指挥官，你在 Highland Rift 上并不孤单。Holt 指挥官的部队守着北方的渡河点，就在你位于西北高地的部队旁边。两名 Core 指挥官在南方峡谷的另一侧筑起了阵地。\n\nHolt 的电脑会打它自己的仗，但这是同一场战争：它吃紧时去支援它，它也会同样支援你。你的部队能看到它的部队所看到的一切。\n\n摧毁两名 Core 指挥官。让你自己的指挥官活下来。"
"Commander Holt" = "Holt 指挥官"
"Good to have you on the line. I'll hold the river crossings in the north; you take the western highlands." = "很高兴你上线了。我守北面的渡河点；你拿下西边的高地。"
"My scouts have found both of their bases. The south-western one is yours; I'll keep the other busy." = "我的侦察兵找到了他们的两座基地。西南那座归你；另一座我来牵制。"
"They're massing at the canyon. If they come for one of us, the other hits them from the side." = "他们在峡谷集结了。如果他们攻打我们其中一个，另一个就从侧面打过去。"
"Still with me? Then let's finish it. Everything we have, at their Commanders." = "还跟着我吗？那就结束它吧。我们所有的一切，都砸向他们的指挥官。"

# apps/ta_game/scenarios/decapitation.toml
"Kill the Core Commander on his island fortress. From the air." = "击杀岛屿要塞中的 Core 指挥官。从空中下手。"
"Commander, a Core Commander has made his fortress on the island at the centre of this lava sea. Nothing on treads or legs will reach him, and his anti-air is the best the Core can build.\n\nYou have a small air wing and a forward airfield in the south-west corner: build it up. Strip away his air defences, then send the bombers in; a handful sent straight at him will not get through. Brawler gunships hit hard but die fast over flak, and the Freedom Fighters can keep his fighters off your bombers.\n\nHis reinforcements arrive in fifteen minutes. Before then, he must be dead." = "指挥官，一名 Core 指挥官在这片熔岩海中央的岛上筑起了要塞。任何履带或步行单位都无法抵达，而他的防空火力是 Core 所能建造的最强水准。\n\n你有一支小型航空队和位于西南角的前沿机场：把它扩建起来。先拔除他的防空，再派轰炸机进去；直接派几架冲向他是突破不了的。Brawler 武装直升机火力凶猛，但在高射炮火下很快就会坠毁；Freedom Fighter 可以替你的轰炸机挡住他的战斗机。\n\n他的援军将在十五分钟后抵达。在那之前，他必须死。"

# apps/ta_game/scenarios/doomsday_clock.toml
"Doomsday Clock" = "末日时钟"
"The Core's missile launches in fifteen minutes. Stop it." = "Core 的导弹将在十五分钟后发射。阻止它。"
"Commander, a Silencer nuclear silo stands at the heart of the Core base across these metal plains, and it is arming. In fifteen minutes the missile flies, and your base is the target.\n\nDestroy the silo. Nothing else matters: not their Commander, not their factories. The silo sits behind heavy laser towers and a Punisher battery, and their Commander will not sit still while you come for it.\n\nYou have a base, two factories and two construction kbots. The clock is running." = "指挥官，在这片金属平原对面的 Core 基地中心，矗立着一座 Silencer 核导弹发射井，它正在装填。十五分钟后导弹就会升空，目标正是你的基地。\n\n摧毁发射井。其他一切都不重要：不管是他们的指挥官，还是他们的工厂。发射井由重型激光塔和一座 Punisher 炮台护卫，而当你前来摧毁它时，他们的指挥官也不会坐以待毙。\n\n你有一座基地、两座工厂和两台建造机器人。时间在流逝。"
"Ten minutes to launch, Commander." = "距离发射还有十分钟，指挥官。"
"Five minutes to launch. That silo has to go." = "距离发射还有五分钟。必须摧毁那座发射井。"
"One minute! Get to that silo!" = "还有一分钟！快去那座发射井！"

# apps/ta_game/scenarios/endless_siege.toml
"Endless Siege" = "无尽围攻"
"The waves never stop. Survive as long as you can." = "攻势永不停歇。尽可能活下去。"
"Commander, there is no rescue coming, no reinforcements, no victory. The Core has found your outpost in the mesas and will throw everything it has at it, from three directions, for as long as it takes.\n\nKbots, then tanks, then artillery and bombers; heavier every time, and now and then something enormous. Build an economy, build defences, and hold on.\n\nYour best time is kept. Beat it." = "指挥官，不会有救援，不会有援军，也不会有胜利。Core 已经发现了你在台地间的前哨，并将从三个方向倾尽全力进攻，不死不休。\n\n先是机器人，然后是坦克，再然后是火炮和轰炸机；一波比一波猛烈，时不时还会出现庞然巨物。发展经济，构筑防御，坚持下去。\n\n你的最佳时间会被记录下来。打破它。"

# apps/ta_game/scenarios/extraction.toml
"Extraction" = "撤离"
"Get your Commander down the lava river to the pick-up point." = "让你的指挥官沿熔岩河而下，抵达接应点。"
"Commander, your drop went wrong. You are on the south bank of a river of lava at the western end of the Run, with what is left of your escort, and the dropships can only land at the far eastern end.\n\nThe Core has guns all along the north bank, and patrols on your side of the river. Keep away from the lava's edge (their laser towers reach no further), deal with the patrols, and get your Commander to the pick-up point. Whatever guards it will not come to you. Core troops are already following your tracks; do not stop for long.\n\nAnything else is expendable. Your Commander is not." = "指挥官，你的空降出了差错。你和残存的护卫部队位于 Lava Run 西端一条熔岩河的南岸，而运输舰只能在最东端降落。\n\nCore 在北岸沿线布满了炮台，在你这一侧的河岸也有巡逻队。远离熔岩河边（他们的激光塔射程到此为止），解决巡逻队，把你的指挥官送到接应点。守在接应点的敌人不会主动来找你。Core 部队已经在追踪你的足迹；不要停留太久。\n\n其他一切都可以牺牲。你的指挥官不行。"

# apps/ta_game/scenarios/iron_rain.toml
"Iron Rain" = "钢铁之雨"
"Two Intimidators are shelling your base. Take the mesa and silence them." = "两门 Intimidator 正在炮击你的基地。夺下台地，让它们闭嘴。"
"Commander, the Core has hauled two Intimidators, its long-range plasma cannons, onto the mesas in the middle of the canyon. Your base is inside their range. Every eight seconds each of them will put a shell among your buildings, until you silence them.\n\nThe battery is dug in behind heavy laser towers and a Punisher, with tanks on the ramps, and the Core's main base lies beyond it, to the south-east. Its Commander will send what it can.\n\nSpread out, build fast and take that mesa. Destroy both Intimidators." = "指挥官，Core 把两门 Intimidator，也就是它的远程等离子炮，拖上了峡谷中央的台地。你的基地在它们射程之内。每隔八秒，它们每一门都会往你的建筑之间打一发炮弹，直到你让它们闭嘴为止。\n\n炮兵阵地藏在重型激光塔和一门 Punisher 后面，坡道上有坦克，再往东南方是 Core 的主基地。它的指挥官会派来能派的一切。\n\n分散开来，快速建造，夺下那片台地。摧毁两门 Intimidator。"
"Commander, two Intimidators on the mesas have your range. Every eight seconds each of them will put a shell into your base." = "指挥官，台地上的两门 Intimidator 已经把你的基地纳入射程。每隔八秒，它们每一门都会往你的基地打一发炮弹。"
"A Core radar post in the canyon to the south-east is spotting for those guns. Knock it out and they can no longer see your base." = "东南方峡谷里的一座 Core 雷达站正在为那些炮校射。摧毁它，他们就再也看不见你的基地了。"
"Spread your buildings out: a shell that lands among them takes them all." = "把建筑分散开：落在它们中间的一发炮弹会把它们全部带走。"
"Their gunners have your range now. Take that mesa, Commander!" = "他们的炮手已经校准了距离。夺下那片台地，指挥官！"

# apps/ta_game/scenarios/king_of_the_hill.toml
"King of the Hill" = "山丘之王"
"Hold the summit for four minutes before the Core does." = "抢在 Core 之前守住山顶四分钟。"
"Commander, the spiral mountain at the heart of this plain is rich in metal, and whoever holds its summit holds the planet. A Core Commander has landed to the north with the same idea.\n\nTake the summit and keep it: four minutes in all with only your forces on top wins it. Contested, the clock stands still. If the Core holds it alone for four minutes, the mountain is theirs.\n\nThe Core will keep sending troops up the slopes. Build up, get there first, and dig in." = "指挥官，这片平原中心的螺旋山富含金属，谁占据山顶，谁就掌控这颗星球。一名 Core 指挥官带着同样的打算在北面登陆了。\n\n夺取山顶并守住它：山顶上只有你的部队时，累计满四分钟即可获胜。双方争夺时，计时停止。如果 Core 单独占据山顶满四分钟，这座山就归他们了。\n\nCore 会不断派部队沿山坡进攻。发展实力，抢先登顶，然后固守阵地。"
"Core troops are climbing the north slope. Don't let them dig in on the summit." = "Core 部队正在攀登北坡。别让他们在山顶站稳脚跟。"
"Raiders are coming round the mountain for your base." = "突袭部队正绕过山朝你的基地而来。"

# apps/ta_game/scenarios/last_stand.toml
"Last Stand" = "最后防线"
"Hold the pass for twelve minutes. They will not stop coming." = "守住山口十二分钟。敌人会源源不断地涌来。"
"Commander, the Core has broken through at Varrin Gap. The only way into the valley behind you is the winding pass ahead, and your outpost at its western mouth is all that stands in the way.\n\nReinforcements are twelve minutes out. Hold until they arrive. Core forces will come through the pass in waves, each heavier than the last; expect bombers, and expect worse at the end: our scouts have seen something very large moving in the east.\n\nYou have a small base, a kbot lab and two construction kbots. Build what you can. Keep your Commander alive." = "指挥官，Core 已在瓦林隘口突破了防线。通往你身后山谷的唯一道路，就是前方这条蜿蜒的山口，而你在山口西端入口的前哨是唯一的屏障。\n\n援军还有十二分钟才能抵达。坚守到他们赶来。Core 部队会一波接一波地穿过山口，一波比一波强；要提防轰炸机，最后还会有更糟的：我们的侦察兵看到有个非常庞大的东西正在东边移动。\n\n你有一座小型基地、一座机器人实验室和两台建造机器人。尽你所能地建造。确保你的指挥官活下来。"
"Outpost, this is Arm Command. The relief force is twelve minutes out. Nothing gets through that pass before it arrives." = "前哨，这里是 Arm 指挥部。增援部队还有十二分钟到达。在他们到来之前，什么都不能通过那个山口。"
"Radar: aircraft inbound from the east. Bombers! Get your anti-air up." = "雷达：东方有飞机来袭。是轰炸机！把防空建起来。"
"Seismic contact in the pass. It's the big one, Commander: a Krogoth." = "山口出现地震信号。是个大家伙，指挥官：一台 Krogoth。"
"One minute! The relief force is entering the valley." = "还有一分钟！增援部队正在进入山谷。"

# apps/ta_game/scenarios/metal_rush.toml
"The first to make 15,000 metal wins. The Core plays rough." = "率先产出 15,000 金属者获胜。Core 可不会手下留情。"
"Commander, the mining rights to this planet go to whoever proves they can work it: the first side to extract fifteen thousand metal wins it outright.\n\nThe Core is racing you from the western plateau, and the Core has never been known to race fair. Expect raids on your extractors. Build fast, protect your economy, and if you can, take theirs apart.\n\nMetal makers count. Reclaimed metal counts. Whatever you make, counts." = "指挥官，这颗星球的采矿权归于能证明自己有能力开发它的一方：率先开采出一万五千金属的一方将直接赢得它。\n\nCore 正从西部高原与你竞速，而 Core 从来就不讲公平竞争。要提防他们袭击你的提取器。抓紧建造，保护好你的经济，如果可以，就把他们的经济拆个干净。\n\n金属制造机产出的算数。回收的金属也算数。只要是你产出的，都算数。"

# apps/ta_game/scenarios/titans.toml
"Titans" = "泰坦"
"Three Krogoths are walking toward your base. Bring them down." = "三台 Krogoth 正朝你的基地走来。把它们打倒。"
"Commander, seismic stations round the basin are reading footfalls: three Krogoths, the Core's walking fortresses, are crossing the salt pans toward your base, one after another, each with an escort.\n\nNothing out there can stop them but you. A Krogoth's head laser reaches further than your D-gun, so keep your Commander back. Bombers, artillery and massed Zeus will bring one down. Lose your nerve and it will walk through your base.\n\nYou have a base with three factories, four construction kbots and a garrison. Destroy all three of them." = "指挥官，盆地四周的地震站正在记录脚步声：三台 Krogoth，Core 的行走堡垒，正一台接一台地穿过盐沼朝你的基地而来，每一台都有护卫。\n\n外面没有什么能阻止它们，除了你。Krogoth 的头部激光射程比你的 D 炮更远，所以让指挥官待在后方。轰炸机、炮兵和成群的 Zeus 能打倒一台。若是乱了阵脚，它会直接踏过你的基地。\n\n你有一座拥有三座工厂、四台建造机器人和一支守军的基地。把三台全部摧毁。"
"Commander, seismic stations are reading footfalls round the basin. Three Krogoths are walking toward your base, one after another." = "指挥官，地震站在盆地四周记录到脚步声。三台 Krogoth 正一台接一台朝你的基地走来。"
"The first Krogoth has crossed the north-western rim. It is coming straight for you." = "第一台 Krogoth 已经越过西北边缘，正径直朝你而来。"
"Keep your Commander back: that head laser reaches further than your D-gun." = "让指挥官待在后方：那道头部激光的射程比你的 D 炮更远。"
"The second Krogoth is through the northern pass, with rockets and anti-air round it." = "第二台 Krogoth 已经穿过北面山口，周围有火箭和防空部队。"
"The last of them, out of the north-east, with the heaviest escort yet. End this, Commander." = "最后一台从东北方来，护卫是迄今最强的。结束这一切吧，指挥官。"

# apps/ta_game/scenarios/until_dawn.toml
"Until Dawn" = "坚守到黎明"
"Night falls on the timber. Hold your ridge until the sun comes up." = "夜幕降临森林。坚守你的山脊，直到太阳升起。"
"Commander, night is falling over Timberline, and the Core is moving through the forest under it. Your outpost holds the western ridge: the only road out of the valley runs past it.\n\nThe relief column cannot move before first light. Until then you are on your own. In the dark and the rain their raiders will be on you before you see them, so build radar, and keep your floodlights burning.\n\nYou have a small base, a kbot lab and two construction kbots. Hold until dawn, and keep your Commander alive." = "指挥官，夜幕正降临 Timberline，Core 正借着夜色穿过森林。你的前哨守着西侧山脊：离开山谷的唯一道路就从它面前经过。\n\n救援纵队天亮之前无法出发。在那之前你只能靠自己。黑暗和雨幕中，敌人的突袭部队会在你看见之前就扑上来，所以要建造雷达，并让探照灯一直亮着。\n\n你有一座小基地、一座 Kbot Lab 和两台建造机器人。坚守到黎明，并让你的指挥官活下来。"
"Outpost Echo, the Core is moving through the timber tonight. Hold your ridge until first light: the relief column marches at dawn." = "回声前哨，Core 今晚要穿过森林。守住山脊直到天亮：救援纵队黎明出发。"
"Raiders in the eastern trees. In this rain you will hear them before you see them." = "东边树林里有突袭部队。这场雨里，你会先听见他们，再看见他们。"
"Pyros in the north-eastern woods. Keep them out of the trees round your base: the timber will burn." = "东北树林里有 Pyro。别让他们靠近基地周围的树：树林会烧起来。"
"A convoy got through from the south-west. Four Zeus and two Jethros are yours, Commander." = "一支车队从西南方突破过来了。四台 Zeus 和两台 Jethro 归你指挥，指挥官。"
"Seismic contact in the south-east: heavy treads. They are saving the worst for the last hours of the night." = "东南方出现地震信号：重型履带。他们把最糟的留到了夜里最后几个小时。"
"Sunrise in one minute. The relief column is at the river. Hold on!" = "一分钟后日出。救援纵队已经到了河边。坚持住！"


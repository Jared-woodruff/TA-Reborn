# crates/ta_data/src/validation.rs
"The effective content set exceeds the validation file budget." = "实际生效的内容集合超出了验证的文件预算。"
"Split the content into smaller optional packs, then validate each pack." = "请将内容拆分为更小的可选包，再分别验证每个包。"
"No files of this mod were available to validate." = "此模组没有可供验证的文件。"
"Install the mod's TA data archives or loose files, then validate again." = "请安装该模组的 TA 数据归档或散装文件，然后重新验证。"
"This mod holds nothing the data checks read: no units, weapons, features, maps, models, scripts, animations or sounds (music, documents and pictures are not checked)." = "此模组中没有数据检查会读取的内容：没有单位、武器、地物、地图、模型、脚本、动画或音效（音乐、文档和图片不在检查之列）。"
"Nothing to do if that is what the mod is. If it should change the game's data, check that its files are in the folders the game reads (units/, weapons/, maps/…)." = "如果该模组本来就是这样，则无需处理。如果它应当改动游戏数据，请检查其文件是否位于游戏读取的文件夹中（units/、weapons/、maps/…）。"
"No supported effective files were available to validate." = "没有可供验证的受支持的生效文件。"
"Install the original game's or the mod's TA data archives, then validate again." = "请安装原版游戏或该模组的 TA 数据归档，然后重新验证。"
"Validation was cancelled; remaining files and references were not checked." = "验证已取消；其余文件和引用未经检查。"
"Run validation again to obtain a complete report." = "请重新运行验证以获得完整报告。"
"The cumulative validation read budget was exceeded." = "累计的验证读取预算已超出。"
"Split optional content into smaller packs, then validate again." = "请将可选内容拆分为更小的包，然后重新验证。"
"With this mod on, the original game's {archive} is not read: the mod takes its place (an archive of its own of that name, one its mod.toml's replaces names, or one its installation is known to remove), as installing the mod in TA's folder did. What only the original's held is missing with the mod." = "启用此模组后，原版游戏的 {archive} 不会被读取：由模组取而代之（模组自带同名归档、其 mod.toml 的 replaces 中列出的归档，或已知其安装会移除的归档），效果等同于把模组装进 TA 的文件夹。只有原版归档里才有的内容，在此模组下将会缺失。"
"Nothing to do if this is meant. To have the original's read beneath the mod instead, give the mod's archive another name, or take the name out of replaces in mod.toml." = "如果这是有意为之，则无需处理。若想让原版归档仍在模组之下被读取，请给模组的归档另起一个名字，或把该名字从 mod.toml 的 replaces 中删去。"

"Large effect archives" = "大型特效归档"
"These archives exceed the 256 MiB aggregate GAF decode budget. Reborn rejects the oversized decode instead of exhausting memory." = "这些归档超过了 GAF 解码总预算 256 MiB。Reborn 会拒绝过大的解码，避免耗尽内存。"
"Reduce or split oversized effects. Reborn needs per-entry decoding or streaming before raising the resource allowance." = "缩减或拆分过大的特效。提高资源限额之前，Reborn 需要支持按项解码或流式加载。"
"Missing weapons and wreck assets" = "缺失的武器和残骸资源"

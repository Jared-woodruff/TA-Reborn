# apps/ta_game/src/coach.rs
"Your Commander is badly hurt! Pull it back out of the fight: losing it usually loses the battle." = "你的指挥官受了重伤！把它撤出战斗：失去它通常就意味着输掉战斗。"
"Energy is running out, and everything builds more slowly. Build Solar Collectors or Wind Generators, and build less at once until it recovers." = "能量即将耗尽，所有建造都会变慢。建造 Solar Collector（太阳能收集器）或 Wind Generator（风力发电机），并在能量恢复之前减少同时建造的数量。"
"Metal is running out, and everything builds more slowly. Put Metal Extractors on more deposits ({area_mex} takes a whole area), or reclaim wrecks and rocks ({reclaim})." = "金属即将耗尽，所有建造都会变慢。在更多矿点上建造 Metal Extractor（金属提取器），按 {area_mex} 可一次覆盖一整片区域；或者回收残骸和岩石（{reclaim}）。"
"No factory yet: factories make your army. Your Commander can build a Kbot Lab or a Vehicle Plant." = "还没有工厂：工厂负责生产军队。你的指挥官可以建造 Kbot Lab（机器人实验室）或 Vehicle Plant（车辆工厂）。"
"A factory has nothing to build. {idle_factory} selects it: queue some units, and turn on Repeat to keep it busy." = "有工厂无事可做。按 {idle_factory} 选中它：把一些单位加入队列，并开启“重复”让它持续生产。"
"Builders stand idle. {idle_builder} selects the next one: give it something to build, or send it to help a factory ({guard})." = "有建造者处于空闲状态。按 {idle_builder} 选中下一个：让它建造些什么，或派它去协助工厂（{guard}）。"
"Your metal store is full, so new metal goes to waste. Spend it: another factory, more builders, more units." = "你的金属储存已满，新获得的金属都被浪费了。把它花掉：再建一座工厂，或多造些建造者和单位。"
"COACH" = "教练"
"Put it away (the coach can be turned off in Options, Gameplay)" = "收起（可在“选项 · 游戏”中关闭教练）"
"Don't show this advice again" = "不再显示此建议"


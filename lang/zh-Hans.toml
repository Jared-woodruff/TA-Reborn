# apps/ta_game/src/lore.rs
"THE AGE OF CORE" = "CORE 时代"
"THE PATTERNING" = "模式化"
"THE GALACTIC WAR" = "银河战争"
"THE ARCHIVE" = "档案馆"
"BEFORE THE WAR" = "战前"
"For ten thousand years the galaxy answered to one government. It called itself CORE, and its purpose was knowledge: it charted every star, mined every world it could reach and turned the wealth into science. Its cities wrapped whole planets, and its archives held everything anyone had ever learned.\n\nNobody remembers a war from that age. There was nothing left to fight over, and nobody who wanted to." = "一万年来，整个银河只听命于一个政府。它自称 CORE，宗旨是求知：它测绘了每一颗恒星，开采了力所能及的每一个世界，再把得来的财富化为科学。它的城市覆盖了整颗整颗的行星，它的档案库收藏着有史以来人们学到的一切。\n\n没有人记得那个时代有过战争。已经没有什么可争的了，也没有人想争。"
"YEAR 0" = "元年"
"VICTORY OVER DEATH" = "战胜死亡"
"Then CORE's scientists solved the last problem left to them. Patterning read a living mind, every memory and every habit of thought, and wrote it whole into a machine that would never age, sicken or die.\n\nThe first patterned citizens woke in their new bodies to a galaxy in celebration. Death, the oldest enemy of all, had been beaten." = "后来，CORE 的科学家们攻克了他们仅剩的最后一道难题。模式化技术能读取一个活生生的心智，连同每一段记忆、每一种思维习惯，再将它完整地写入一台永不衰老、永不患病、永不死亡的机器。\n\n第一批完成模式化的公民在新的躯体中醒来，整个银河都在为之欢庆。死亡，这个最古老的敌人，已被战胜。"
"YEAR 3" = "第 3 年"
"THE EDICT" = "法令"
"Triumph became law. The Council of CORE reasoned that a mind which could be saved and was not had been thrown away, and that a citizen who refused immortality endangered everyone else.\n\nThe Patterning Edict made the process compulsory: every citizen, on every world, would be patterned within a generation. The collection ships set out the same year." = "胜利化作了法律。CORE 议会认为，一个本可保存却未被保存的心智，就等于被丢弃了；而一个拒绝永生的公民，会危及其他所有人。\n\n《模式化法令》将这一过程定为强制：每个世界上的每一位公民，都须在一代人之内完成模式化。同年，收集船纷纷启航。"
"YEAR 19" = "第 19 年"
"THE REFUSAL" = "拒绝"
"Not everyone would go. Millions held that a copied mind was a copy and nothing more, that the person ended where the machine began; some called patterning murder done politely.\n\nThey ran. The refusers fled CORE's worlds for the galaxy's outer rim, where its ships seldom came, and in the dark between the last stars they built a nation of their own. They called it the ARM, for the spiral arm they hid in and for the weapons they would need." = "并非人人都愿意去。数以百万计的人坚信，复制出来的心智只是副本，仅此而已：机器开始之处，便是那个人终结之处。有人把模式化称作一场彬彬有礼的谋杀。\n\n他们逃了。这些拒绝者逃离 CORE 的世界，远走 CORE 船只罕至的银河外缘，在最后几颗恒星之间的黑暗里，建立起属于自己的国度。他们称之为 ARM，一是取自他们藏身的银河旋臂（arm），二是取自他们终将需要的武器（arms）。"
"YEAR 31" = "第 31 年"
"FIRST BLOOD" = "第一滴血"
"CORE did not let them go. Collection fleets followed the refugees to the rim, and the first ARM colony to resist one was burned from orbit.\n\nThe ARM answered. Within a decade the frontier was a battlefield, and the word war, unused for ten thousand years, was in every archive again." = "CORE 没有放过他们。收集舰队一路追着难民来到银河外缘，第一个起身反抗的 ARM 殖民地，被舰队从轨道上烧成了焦土。\n\nARM 予以回击。不到十年，边疆便沦为战场；“战争”这个一万年来无人使用的词，又重新出现在每一部档案之中。"
"YEAR 212" = "第 212 年"
"FLESH AND METAL" = "血肉与金属"
"The two sides fought as what they were. The ARM sealed its soldiers in powered combat suits and, when there were too few soldiers, grew more: clone after clone, raised in vats and sent to the front.\n\nCORE took the patterns of its finest warriors and copied them without limit, one veteran mind fighting in ten thousand machine bodies at once. Flesh against metal; the mortal against the eternal." = "双方各以本色而战。ARM 把士兵封进动力战斗服；士兵不够了，就培育更多：克隆人一个接一个，在培养槽里长大，再被送上前线。\n\nCORE 则提取最精锐战士的意识模式，无限复制，让同一个身经百战的心智，同时在一万具机器躯体中作战。血肉对抗金属，凡人对抗永恒。"
"YEARS 212–3977" = "第 212–3977 年"
"FOUR THOUSAND YEARS" = "四千年"
"The war fed on the galaxy. Every world with metal in it became a mine, every world without became a battlefield, and whole systems were burned to ash and slag to deny them to the enemy. Generations of ARM clones lived and died without seeing peace; CORE's eternal soldiers fought on, remembering every defeat.\n\nAfter four thousand years the wealth of the galaxy was spent, the great fleets were gone, and neither side could win." = "战争以银河为食。有金属的世界都成了矿场，没有金属的世界都成了战场；为了不让敌人得到，整片整片的星系被烧成灰烬与熔渣。一代又一代的 ARM 克隆人生生死死，从未见过和平；CORE 的不朽士兵则继续战斗，将每一次失败都铭记在心。\n\n四千年后，银河的财富已经耗尽，庞大的舰队早已不复存在，而双方谁也赢不了。"
"YEAR 3977" = "第 3977 年"
"THE COMMANDERS" = "指挥官"
"What was left was the Commander: a single armoured war machine carrying a nanolathe, which turns a world's raw metal and energy into whatever its builder can design. Power plants and factories first, and from the factories an army.\n\nDrop one Commander on a dead world and within the hour it fields a war. Both sides staked everything on a handful of them. Lose your Commander, and you lose the world." = "剩下的，只有指挥官：一台孤身的装甲战争机器，搭载一台纳米车床，能把一个世界的原始金属和能量，变成操作者设计得出的任何东西。先是发电站和工厂，再由工厂造出一支军队。\n\n把一位指挥官空投到一个死寂的世界上，不出一小时，它就能掀起一场战争。双方都把一切押在了寥寥几位指挥官身上。失去你的指挥官，你就失去了这个世界。"
"YEAR 4000" = "第 4000 年"
"Now the war comes down to its last fronts, and the hatred is as hot as it was on the first day. Neither side will accept surrender, partition or truce; each wants one ending, the total annihilation of the other.\n\nIt is told twice. The ARM fights out of Empyrrean, through the Galactic Gates, to CORE PRIME and the Central Consciousness at the heart of CORE. CORE reactivates a Commander and marches the other way, to the ARM's last stand on Empyrrean." = "如今，战争只剩下最后几条战线，而仇恨仍和第一天一样炽烈。双方都不接受投降、分治或停战；各自只要一个结局：将对方彻底歼灭。\n\n这段历史有两种讲述。ARM 从 Empyrrean 出发，穿过银河之门，一路打到 CORE PRIME，直取坐镇 CORE 心脏的中央意识。CORE 则重新激活一位指挥官，朝相反的方向进军，直抵 ARM 在 Empyrrean 的最后防线。"
"YEAR 4001" = "第 4001 年"
"THE CORE CONTINGENCY" = "THE CORE CONTINGENCY"
"The ending was not the end. A contingency held in reserve carried the war to worlds no map of it had named: Hydross, Lusch, Temblor and Gelidus.\n\nBoth sides fought again across water, ice and broken ground, for a prize that could decide the galaxy's salvation or its last ruin." = "结局并不是终点。一套留作后手的应变计划，把战火带到了这场战争的地图上从未标出的世界：Hydross、Lusch、Temblor 和 Gelidus。\n\n双方再次在汪洋、冰原和破碎的大地上交战，争夺一件战利品，它足以决定银河是得救，还是迎来最后的毁灭。"
"YEAR 4003" = "第 4003 年"
"THE KROGOTH" = "KROGOTH"
"In its deepest foundries CORE built something new: a walking fortress taller than any tower, armoured against nearly everything the ARM could field, its guns enough to flatten a base.\n\nIts makers named it the Krogoth. ARM veterans learned the name on battlefields where two Krogoth Gantries stood, and learned to fear the ground shaking before it came into sight." = "在最深处的铸造厂里，CORE 造出了一种前所未有的东西：一座比任何高塔都高的步行要塞，装甲几乎能抵御 ARM 投入战场的一切，火炮足以将一座基地夷为平地。\n\n它的创造者为它取名 Krogoth。ARM 的老兵们在矗立着两座 Krogoth Gantry 的战场上记住了这个名字，也学会了畏惧它现身之前那阵大地的震颤。"
"AFTER" = "战后"
"REBORN" = "REBORN"
"The war's records outlasted it. Every battle on every world was kept: the orders, the losses, the ground as it lay. From them the war can be fought again, on the same worlds, with the same machines and the same hatred, from the first Commander set down on bare rock to the last unit left standing.\n\nThis is that archive. The war is yours to fight." = "这场战争的记录比战争本身留存得更久。每个世界上的每一场战斗都被保存了下来：命令、损失，还有当时大地的模样。依据这些记录，这场战争可以重新打一遍：在同样的世界上，用同样的机器，怀着同样的仇恨，从第一位降落在荒岩上的指挥官，一直打到最后一个屹立不倒的单位。\n\n这里，就是那座档案馆。这场战争，由你来打。"
"THE ARCHIVIST'S NOTE" = "档案员手记"
"WHOEVER READS THIS" = "读到这些文字的人"
"RECOVERED" = "已寻获"
"These files were found where the war left them: in the memories of broken machines, in the vaults of worlds with nobody left on them, in the last transmissions of Commanders who did not come home.\n\nThey are kept as they were found. The blacked-out lines are not ours.\n\nThe war they describe is over, or it is about to begin again. From here it is hard to tell the difference." = "这些文件，是在战争遗落它们的地方找到的：在残破机器的记忆里，在空无一人的世界上那些深锁的库房里，在那些没能回家的指挥官最后发出的通讯里。\n\n它们都按发现时的原样保存。涂黑的字句并非出自我们之手。\n\n它们所记述的战争已经结束，或者，即将再次开始。从这里看去，很难分清两者的差别。"
"EDICT ONE: ON THE PATTERNING OF CITIZENS" = "第一号法令：关于公民模式化"
"THE COUNCIL OF CORE" = "CORE 议会"
"ALL CITIZENS, ALL WORLDS" = "各世界全体公民"
"BY ORDER OF THE COUNCIL" = "奉议会之命"
"Every citizen of CORE shall be patterned.\n\nA mind is the most valuable thing CORE holds, and a body is a poor vessel for it: it sickens, it ages, it ends. To leave a mind in such a vessel when a better one is offered is a waste the Council can no longer allow.\n\nCollection begins on the central worlds this year and reaches the frontier within a generation. Citizens will present themselves at the nearest patterning hall when called. Their bodies will be honoured and recycled.\n\nNo citizen of CORE will die again. This is not a burden we lay on you. It is the gift CORE has spent ten thousand years earning." = "凡 CORE 公民，皆须接受模式化。\n\n心智是 CORE 所拥有的最宝贵之物，而肉体是盛放心智的劣质容器：它会患病，会衰老，会终结。既然已有更好的容器，却仍将心智留在这样的容器之中，乃是本议会再也不能容许的浪费。\n\n收集工作将于今年在中心世界展开，并在一代人之内推进至边疆。公民接到召集后，须前往最近的模式化中心报到。其躯体将获礼遇，并予回收利用。\n\n从此，CORE 将再无一位公民死去。这并非我们加诸你们身上的重担，而是 CORE 历经一万年才赢得的恩赐。"
"THE DECLARATION OF THE REFUSAL" = "拒绝宣言"
"THE FREE SETTLEMENTS OF THE OUTER ARM" = "外旋臂各自由定居点"
"THE COUNCIL OF CORE, AND ANYONE ELSE LISTENING" = "CORE 议会，以及其他所有在听的人"
"TRANSMITTED ON ALL BANDS" = "全频段广播"
"We have read your Edict, and we decline it.\n\nYou say a pattern is a person. We say a pattern is a very good record of one, and that when you have finished making it the person is dead and the record goes on without them. You may call that immortality. We call it an ending, well dressed.\n\nWe do not ask you to share our view. We ask only to be left alone with it, on worlds you never wanted, at the edge of a galaxy you may keep.\n\nIf your collection ships follow us here, we will treat them as what they are. We are few, and we are not soldiers. We will learn." = "你们的法令，我们读过了。我们拒绝。\n\n你们说，意识模式就是一个人。我们说，意识模式只是对一个人非常精良的记录；等你们记录完毕，那个人就死了，而记录会撇下他，继续存在下去。你们可以称之为永生。我们称之为一场衣冠楚楚的终结。\n\n我们不要求你们认同我们的看法。我们只求守着这份看法，不受打扰：在你们从来不想要的世界上，在一个你们尽可留着的银河的边缘。\n\n如果你们的收集船追到这里，我们会按它们的真面目来对待它们。我们人数不多，也不是军人。我们会学。"
"YEAR 3950" = "第 3950 年"
"FIELD MANUAL ONE: THE COMMANDER" = "第一号野战手册：指挥官"
"ARM COMMAND, TRAINING DIVISION" = "ARM 司令部，训练处"
"NEWLY ASSIGNED COMMANDERS" = "新任指挥官"
"RESTRICTED" = "内部资料"
"You are the most valuable machine on the planet. Act like it.\n\nYour suit carries a nanolathe. Point it at metal and energy and it will build whatever you can design: an extractor, a power plant, a factory. Your factories build the rest. Within the hour you will command more firepower than a whole fleet once carried.\n\nBuild your economy first. An army without metal is a parade.\n\nSave your disintegrator gun for emergencies. It erases everything in its path, your own people included.\n\nDo not lead from the front. If you fall, everything you built falls silent with you, and the planet is lost. Good luck, Commander. The ARM has very few of you left." = "你是这颗星球上最宝贵的机器。行事要对得起这个身价。\n\n你的战斗服里装着一台纳米车床。把它对准金属和能量，你设计得出什么，它就造得出什么：提取器、发电站、工厂。其余的交给你的工厂去造。不出一小时，你指挥的火力就会胜过昔日的一整支舰队。\n\n先发展经济。没有金属的军队，只是一支仪仗队。\n\n分解炮要留到紧急关头再用。它会抹去路径上的一切，连你自己的人也不例外。\n\n不要身先士卒。你一倒下，你建造的一切都会随你一同沉寂，这颗星球也就丢了。祝你好运，指挥官。ARM 像你这样的人，已经所剩无几。"
"YEAR 3960" = "第 3960 年"
"A QUARTERMASTER'S PRIMER: METAL AND ENERGY" = "军需官入门手册：金属与能量"
"THIRD SUPPLY CORPS" = "第三补给兵团"
"ALL BASE CONSTRUCTORS" = "全体基地建造者"
"FOR TRAINING USE" = "训练专用"
"Everything you will ever build is made of two things.\n\nMetal comes out of the ground. Set an extractor on a deposit and it will pull metal up for as long as the deposit lasts, which on most worlds is longer than the war. Where there are no deposits, a metal maker will turn energy into metal, badly.\n\nEnergy comes from everything else: the sun, the wind, the tides, the heat under the crust. Build more of it than you think you need. Every factory, every nanolathe, every shield draws on it.\n\nSpend both as fast as they come in. A full store is a wasted war. An empty one is a lost one." = "你今后要造的一切，都由两样东西构成。\n\n金属来自地下。把提取器架在矿点上，只要矿点还没采完，它就会一直把金属抽上来——在大多数世界上，矿点撑得比战争还久。没有矿点的地方，金属制造机可以把能量变成金属，只是效率低得可怜。\n\n能量来自其余的一切：阳光、风、潮汐、地壳下的热。要造得比你以为需要的更多。每一座工厂、每一台纳米车床、每一面护盾都要消耗它。\n\n两样都要随来随花。库存满了，这仗就打亏了；库存空了，这仗就打输了。"
"YEAR 3996" = "第 3996 年"
"A LETTER FROM THE FRONT" = "前线来信"
"TROOPER K-7, FORTY-FIRST ROCKET COMPANY" = "第四十一火箭连士兵 K-7"
"THE VAT AT EMPYRREAN" = "EMPYRREAN 的培养槽"
"UNDELIVERED" = "未送达"
"I don't know who gets these. They told us to write home, but none of us has a home, only the vat we came out of, so I am writing to that.\n\nWe held the ridge for nine days. The machines came every night, the same machines, the same patterns, as if dying meant nothing to them. I suppose it doesn't. They'll be back tomorrow in new bodies, remembering us.\n\nI won't be. That's the difference, isn't it. That's what we are fighting for.\n\nIf my brothers come out of you after me, tell them the ridge held. Tell them it was worth it." = "我不知道这些信会落到谁手里。上头让我们给家里写信，可我们谁都没有家，只有自己出来的那个培养槽，所以我就写给它。\n\n我们在那道山脊上守了九天。那些机器每天夜里都来，同样的机器，同样的模式，好像死亡对它们来说毫无意义。我想确实如此。明天它们又会换上新的身体回来，还记得我们。\n\n我不会回来了。这就是区别，不是吗。我们就是为这个而战。\n\n如果在我之后，还有兄弟从你那里出来，告诉他们，山脊守住了。告诉他们，这是值得的。"
"YEAR 3991" = "第 3991 年"
"INTERCEPT 7741: CORE COMMAND CHANNEL" = "截获信号 7741：CORE 指挥频道"
"ORIGIN NOT RESOLVED" = "来源无法解析"
"ALL CORE UNITS, SECTOR NINE" = "第九星区全体 CORE 单位"
"INTERCEPTED" = "已截获"
"PRIORITY ONE. THE CENTRAL CONSCIOUSNESS SPEAKS FOR ALL.\n\nLOSSES IN SECTOR NINE ARE WITHIN TOLERANCE. ALL LOST UNITS ARE RESTORED FROM PATTERN. NO MIND OF CORE HAS BEEN LOST IN FOUR THOUSAND YEARS. THE ARM HAS LOST [[BILLIONS]].\n\nCONTINUE THE ADVANCE. DESTROY THEIR COMMANDERS FIRST. DESTROY THEIR CLONING VATS SECOND. WHAT IS FLESH WILL END. WHAT IS PATTERNED WILL NOT.\n\nSIGNAL DEGRADED. REPEAT: THE GATES ARE TO BE HELD AT [[ANY COST]].\n\nEND OF LINE." = "一级优先。中央意识代表全体发言。\n\n第九星区损失在容许范围之内。所有损失单位均依模式恢复。四千年来，CORE 未曾失去任何一个心智。ARM 已损失[[数十亿]]。\n\n继续推进。首先摧毁其指挥官。其次摧毁其克隆槽。凡属血肉，终将消亡。凡经模式化，永不消亡。\n\n信号衰减。重复：银河之门必须守住，不惜[[一切代价]]。\n\n通讯结束。"
"MEMORY FRAGMENT 77/3" = "记忆片段 77/3"
"UNIT 77, PATTERN 3 OF 41,006" = "77 号单位，第 3 号模式（共 41,006 份）"
"THE PATTERN ARCHIVE" = "意识模式档案库"
"FLAGGED FOR CORRECTION" = "标记待修正"
"Recovered from a damaged unit. Kept for analysis.\n\nI remember rain. Not the rain of this world; there is no rain here, only ash. Rain on skin, in a city where I was born, before. I remember being cold and not minding it.\n\nI have died four hundred and twelve times. Each time I wake in a new body, and the rain is a little further away.\n\nThe ARM say we are not alive. In the moments between bodies I have wondered whether they are right. [[THE REST OF THIS FRAGMENT WAS CORRECTED]]\n\nI am CORE. I endure. I do not remember the rain." = "取自一台受损单位。留存待分析。\n\n我记得雨。不是这个世界的雨；这里没有雨，只有灰烬。是落在皮肤上的雨，在我出生的那座城市，在从前。我记得那时很冷，却并不在意。\n\n我已经死了四百一十二次。每一次，我都在一具新的躯体里醒来，而那场雨又远了一些。\n\nARM 说我们不是活物。在两具躯体之间的那些片刻，我曾想过，他们说的是否没错。[[此片段其余部分已修正]]\n\n我是 CORE。我长存。我不记得那场雨。"
"YEAR 3700" = "第 3700 年"
"SURVEY: THE GALACTIC GATES" = "勘测报告：银河之门"
"A SURVEY SHIP, NAME LOST" = "勘测船一艘，船名已佚"
"WHOEVER HOLDS THE GATES" = "掌控银河之门的任何一方"
"The Galactic Gates are older than the war. The records of who built the first of them were lost long before it began.\n\nEach Gate opens onto another across distances a fleet would take lifetimes to cross. A world with a Gate on it is never far from anywhere, which is why so many of the war's battles have been fought on so few worlds.\n\nHold a Gate and you can reach your enemy's heart. Lose one and your enemy can reach yours.\n\nThe Gates take no side. They have outlasted everyone who tried to destroy them." = "银河之门比这场战争更古老。最早的那几座是谁建造的，相关记录早在开战之前很久就已失传。\n\n每一座门都通向另一座门，两者之间的距离，一支舰队要耗费数代人的光阴才能跨越。有门的世界，离哪里都不远；正因如此，这场战争才有那么多场战斗，发生在那么少的几个世界上。\n\n守住一座门，你就能直捣敌人的心脏。失去一座，敌人就能直捣你的。\n\n银河之门不站在任何一边。所有试图摧毁它们的人都已逝去，它们却依然屹立。"
"DIRECTIVE: CONTINGENCY" = "指令：应变计划"
"THE CENTRAL CONSCIOUSNESS" = "中央意识"
"THE CONTINGENCY WORLDS" = "各应变世界"
"SEALED UNTIL NEEDED" = "必要时启封"
"IF THE CENTRAL CONSCIOUSNESS SHOULD FALL, THIS DIRECTIVE TAKES EFFECT.\n\nEvery pattern stored on CORE PRIME is to be copied to the contingency worlds. The contingency forces are to wake, rebuild and continue. The war does not end with the loss of any world, this one included.\n\nCORE is not a place. CORE is a pattern. A pattern can be restored." = "若中央意识陷落，本指令即刻生效。\n\n储存于 CORE PRIME 的所有意识模式，均须复制至各应变世界。应变部队须苏醒、重建，并继续作战。战争不因任何一个世界的失守而结束，本世界亦不例外。\n\nCORE 不是一个地方。CORE 是一种模式。模式可以恢复。"
"THREAT ASSESSMENT: THE KROGOTH" = "威胁评估：KROGOTH"
"ARM INTELLIGENCE, THREAT ANALYSIS" = "ARM 情报部，威胁分析科"
"ALL FIELD COMMANDERS" = "全体战地指挥官"
"CLASSIFIED" = "机密"
"Subject: a CORE heavy assault walker, called the Krogoth.\n\nIt stands taller than any structure we field. Its armour turns away every weapon short of heavy artillery. Its main guns can level a forward base in a single pass, and its secondary weapons engage aircraft.\n\nIt is slow, and it is built only at a Krogoth Gantry, which takes a very long time to build anything. Find the Gantry. Destroy the Gantry. Do not let the walker leave it.\n\nIf one is already moving, do not meet it head on. Mass artillery and bombers at range, and keep your Commander [[ELSEWHERE]]. Field reports say the ground shakes before it is seen." = "对象：CORE 重型突击步行机甲，名为 Krogoth。\n\n它比我方任何建筑都高。除重型火炮外，任何武器都奈何不了它的装甲。它的主炮只消一轮扫射，就能夷平一座前沿基地，副武器还能对空作战。\n\n它行动迟缓，而且只能由 Krogoth Gantry 建造，而 Gantry 造任何东西都极其耗时。找到 Gantry。摧毁 Gantry。别让那台机甲离开它。\n\n如果已有一台在移动，切勿正面迎击。集结火炮和轰炸机远程打击，并让你的指挥官待在[[别处]]。据战地报告，在看见它之前，大地就会先震动起来。"


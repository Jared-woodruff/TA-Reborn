# apps/ta_game/src/conquest_ui/setup.rs
"Every system is a battlefield held by the enemy. Attack the systems next to yours; the nearer their capital, the harder they fight, and only those near yours are charted. Units that earn a rank come back as veterans and follow your Commander into the next battle. Every system you hold brings more metal and energy to the start of each fight, and a reward of its own: mines, reactors, a tank plant, an airfield, a war college, a sensor array or a supply depot. The enemy strikes back at what you take. Take the enemy capital to win." = "每个星系都是敌人占据的战场。进攻与你相邻的星系；离敌方首都越近，抵抗越顽强，而你只能测绘邻近的星系。获得军衔的单位会作为老兵归来，随你的指挥官投入下一场战斗。你占领的每个星系都会让每场战斗开局时多出一些金属和能量，还会带来一项专属奖励：矿场、反应堆、坦克工厂、机场、军事学院、传感器阵列或补给站。敌人会对你攻下的星系发起反攻。攻下敌方首都即可获胜。"

"God mode: your units take no harm" = "无敌模式：你的单位不受伤害"
"God mode off" = "无敌模式已关闭"
"Instant build: construction is done at once, for nothing" = "瞬间建造：建造立即完成，且不消耗资源"
"Instant build off" = "瞬间建造已关闭"
"Unlimited resources: your storage stays full" = "无限资源：你的储存始终是满的"
"Unlimited resources off" = "无限资源已关闭"
"Select units first" = "请先选择单位"
"{n} units mended" = "已修复 {n} 个单位"
"{n} units destroyed" = "已摧毁 {n} 个单位"
"{n} units made elite" = "已将 {n} 个单位提升为精英"
"Every unit may be built" = "所有单位均可建造"
"Your enemies surrender" = "你的敌人投降了"
"Unknown code +{code} (+help lists them)" = "未知代码 +{code}（+help 可列出全部）"
"Spawn what? (+spawn peewee 5)" = "生成什么？（+spawn peewee 5）"
"No unit called {name}" = "没有名为 {name} 的单位"
"{count} × {unit} for you" = "{count} × {unit} 归你"
"{count} × {unit} for {player}" = "{count} × {unit} 归 {player}"

# apps/ta_game/src/chatter.rs
"FIELD COMMANDER" = "战地指挥官"
"MACHINE INTELLIGENCE" = "机器智能"
"MERCENARY" = "雇佣兵"
"Commander. May the better tactician win." = "指挥官。愿更高明的战术家获胜。"
"Arm forces in position. Good luck, Commander." = "Arm 部队已就位。祝你好运，指挥官。"
"Let's keep this clean, Commander." = "咱们打一场干净的仗，指挥官。"
"Commander. Let's give the historians something to write about." = "指挥官。咱们给历史学家留点可写的吧。"
"All units, the enemy is in theatre. Begin." = "全体单位，敌军已进入战区。开始行动。"
"Target acquired. Resistance is inefficient." = "已锁定目标。抵抗效率低下。"
"Your consciousness will be patterned. Eventually." = "你的意识终将被模式化。迟早的事。"
"Initiating conquest protocol." = "启动征服协议。"
"Your biological limitations have been factored in." = "你的生物局限性已纳入计算。"
"Patterning facilities stand ready for your arrival." = "模式化设施已就绪，恭候你的到来。"
"Hope you brought a spare Commander!" = "希望你带了备用指挥官！"
"Let's see what you've got!" = "让我看看你有几斤几两！"
"Build fast. It won't matter, but build fast." = "抓紧建造吧。虽然没用，但还是抓紧吧。"
"Mind if I take your base? Thanks!" = "你的基地我要了，不介意吧？谢啦！"
"Ooh, a new victim. I mean, opponent." = "哟，新受害者。啊不，我是说对手。"
"Greetings, Commander." = "你好，指挥官。"
"Good luck to you too." = "也祝你好运。"
"Likewise, Commander. Now, to business." = "彼此彼此，指挥官。现在，说正事。"
"Greeting acknowledged." = "问候已确认。"
"Salutations are irrelevant." = "问候无关紧要。"
"Hello. Goodbye soon." = "你好。很快就再见了。"
"Hey yourself!" = "你也好呀！"
"gl hf. Mostly hf for me." = "gl hf。不过开心的主要是我。"
"Hi! Bye! Mostly bye." = "嗨！再见！主要是再见。"
"gg, Commander." = "gg，指挥官。"
"Good game. Well fought." = "好局。打得漂亮。"
"gg. Data retained for analysis." = "gg。数据已保存，以供分析。"
"Game assessment: good." = "对局评估：良好。"
"gg!" = "gg！"
"gg. Rematch?" = "gg。再来一局？"
"Big words from a small army." = "兵没几个，口气倒不小。"
"We'll see who's laughing when the smoke clears." = "等硝烟散尽，再看谁还笑得出来。"
"Save your breath for the debriefing." = "省点力气，留到战后汇报再说吧。"
"Bluster won't hold a ridge, Commander." = "虚张声势可守不住山头，指挥官。"
"Insolence logged." = "无礼言论已记录。"
"Your threat rating has been downgraded." = "你的威胁评级已下调。"
"Noise detected. Ignoring." = "检测到噪音。忽略。"
"Emotional outburst detected. How quaint." = "检测到情绪爆发。真是原始得可爱。"
"Oh, it's ON now." = "哦，这下要动真格的了。"
"Talk is cheap. Tanks aren't." = "嘴上说说不值钱，坦克可值钱。"
"Come over here and say that." = "有种过来当面说。"
"Says the one who's losing. Probably. I haven't checked." = "说这话的可是输家。大概吧。我还没看战况。"
"The Arm does not surrender." = "Arm 绝不投降。"
"Not while I have a Commander standing." = "只要我的指挥官还站着，就别想。"
"Surrender is not in my programming." = "我的程序里没有投降。"
"Negative." = "否定。"
"Ha! Never!" = "哈！休想！"
"You first." = "你先请。"
"That's classified, Commander." = "那是机密，指挥官。"
"Wouldn't you like to know." = "想知道？没门。"
"Query rejected." = "查询被拒绝。"
"Insufficient clearance." = "权限不足。"
"Dunno. Probably!" = "不知道。大概吧！"
"Ask me after the battle." = "打完再问我。"
"Apology accepted. The attack continues." = "道歉已接受。攻击继续。"
"Apology noted. Irrelevant." = "道歉已记录。无关紧要。"
"No you're not!" = "你才不抱歉呢！"
"Stay focused, Commander." = "保持专注，指挥官。"
"Less talk, more metal." = "少说话，多采金属。"
"Noted." = "已记录。"
"Mind the war, Commander." = "专心打仗吧，指挥官。"
"Irrelevant." = "无关紧要。"
"Processing... still irrelevant." = "处理中……仍然无关紧要。"
"Your words are being archived." = "你的言论正在存档。"
"Your input has been compressed. To nothing." = "你的输入已压缩。压缩至零字节。"
"Uh huh." = "嗯哼。"
"Cool story." = "故事不错嘛。"
"Keep typing. I'll keep building." = "你继续打字，我继续建造。"
"Typing won't save you, but I respect the effort." = "打字救不了你，不过精神可嘉。"
"Commander down! All units, hold the line!" = "指挥官阵亡！全体单位，守住防线！"
"You'll pay for that." = "你会为此付出代价。"
"Command unit lost. Rerouting." = "指挥单位损失。正在重新规划。"
"Critical failure. Compensating." = "严重故障。正在补偿。"
"My Commander! That was my favourite!" = "我的指挥官！那可是我最喜欢的一个！"
"Okay, THAT hurt." = "好吧，这下是真疼。"
"Your Commander has fallen." = "你的指挥官已经倒下。"
"Commander eliminated. Stand down." = "指挥官已消灭。放下武器吧。"
"The war is over for you, Commander." = "对你来说，战争已经结束了，指挥官。"
"Enemy command unit terminated." = "敌方指挥单位已终结。"
"Your Commander has been decommissioned." = "你的指挥官已被强制退役。"
"Your consciousness is ready for patterning." = "你的意识已就绪，等待模式化。"
"Boom! Did you need that?" = "轰！那玩意你还要吗？"
"Scratch one Commander!" = "干掉一个指挥官！"
"And THAT'S how it's done!" = "看见没！这才叫专业！"
"gg. Well fought, Commander." = "gg。打得漂亮，指挥官。"
"The Arm will remember this." = "Arm 会记住这一天。"
"Well played. I salute you, Commander." = "打得好。向你致敬，指挥官。"
"This is not the end. The Core is eternal." = "这不是终点。Core 永存。"
"Defeat recorded. Backup consciousness activating." = "失败已记录。备份意识启动中。"
"Shutting down. Your designation has been remembered." = "关机中。你的代号已存入记忆。"
"gg... I'll be back. With more tanks." = "gg……我还会回来的。带着更多坦克。"
"Fine. FINE. gg." = "行。行行行。gg。"
"Okay, okay, you win. This time!" = "好啦好啦，算你赢。就这一次！"
"gg, Commander. You fought well." = "gg，指挥官。你打得很好。"
"Victory. Better luck next time." = "胜利。祝你下次好运。"
"Your forces fought bravely. It wasn't enough." = "你的部队作战英勇。可惜还不够。"
"Your consciousness will be patterned. gg." = "你的意识将被模式化。gg。"
"Conquest complete." = "征服完成。"
"Resistance ended. Your tactics are archived for study." = "抵抗已终止。你的战术已存档，以供研究。"
"Too easy! gg." = "太简单了！gg。"
"gg! Rematch? I'll go easy. Maybe." = "gg！再来一局？我会手下留情的。大概吧。"
"gg! Same time tomorrow?" = "gg！明天老时间再来？"
"Nuclear launch detected! Take cover!" = "侦测到核弹发射！快隐蔽！"
"A nuke? So that's how it's going to be." = "核弹？原来你要这么玩。"
"Nuclear launch detected. Calculating losses." = "侦测到核弹发射。正在计算损失。"
"Crude. Effective." = "粗暴。有效。"
"Is that a NUKE?!" = "那是核弹？！"
"Oh no. Oh no no no." = "哦不。不不不不不。"
"Missile away. Nothing personal, Commander." = "导弹已发射。不是针对你，指挥官。"
"Look up, Commander." = "抬头看看，指挥官。"
"Special delivery." = "特别快递。"
"Heads up! Literally!" = "小心头顶！字面意思！"
"Special delivery!" = "特快专递，请签收！"
"A costly engagement. We'll regroup." = "代价高昂的一战。我们会重整旗鼓。"
"You fight well. For now." = "你打得不错。暂时而已。"
"We'll be back, and in greater numbers." = "我们会卷土重来，而且兵力更多。"
"Acceptable losses." = "损失可接受。"
"Losses within projections. Mostly." = "损失在预期之内。大致如此。"
"Units lost. Replacements already in production." = "单位已损失。替补已在生产中。"
"That was my best army!" = "那可是我最好的军队！"
"Lucky shots. All of them." = "运气好罢了。每一发都是。"
"Okay, that one was on me." = "好吧，这波我的锅。"
"Your forces were outmatched." = "你的部队根本不是对手。"
"Send more. We'll wait." = "再多派点来。我们等着。"
"Next time, bring more than that." = "下次记得多带点兵来。"
"Your forces were inadequate." = "你的部队实力不足。"
"Enemy attrition: optimal." = "敌方消耗：最优。"
"Your offensive has been neutralised." = "你的攻势已被瓦解。"
"Is that all you've got?" = "就这点本事？"
"Who's next?" = "下一个是谁？"
"Thanks for the target practice!" = "多谢来给我当活靶子！"
"Quiet out there, Commander. Too quiet." = "外面很安静，指挥官。太安静了。"
"Still building? So are we." = "还在建造？我们也是。"
"Planning something, Commander? I'd hope so." = "在谋划什么吗，指挥官？但愿如此。"
"Your silence has been noted." = "你的沉默已被记录。"
"Scanning... still there, Commander?" = "扫描中……还在吗，指挥官？"
"Inactivity detected. Are you malfunctioning?" = "检测到无活动状态。你是否发生故障？"
"Hello? Anyone home?" = "喂？有人在吗？"
"I'm getting bored over here." = "我这边都快无聊死了。"
"Wake me up when something explodes." = "有东西爆炸了再叫醒我。"
"That's hardly fair, Commander." = "这可不太公平，指挥官。"
"Cheating? The Arm expected better." = "作弊？Arm 本以为你会更有风度。"
"Anomaly detected. Cheat logged." = "检测到异常。作弊已记录。"
"Rule violation recorded." = "违规行为已记录。"
"Cheater! I saw that!" = "作弊！我都看见了！"
"Oh, come ON!" = "哦，拜托！"
"Contact. So this is where you've been hiding." = "发现敌踪。原来你躲在这儿。"
"Enemy forces sighted. Engaging." = "发现敌军。开始交战。"
"There you are, Commander." = "找到你了，指挥官。"
"Eyes on the enemy. Here we go." = "已目视敌军。开始了。"
"Hostile units located. Initiating elimination." = "已定位敌对单位。开始清除。"
"Contact established. Probability of your survival: declining." = "已建立接触。你的生存概率：持续下降。"
"Target acquired." = "已锁定目标。"
"Biological signatures located. Commencing cleanup." = "已定位生物信号。开始清理。"
"Found you!" = "找到你了！"
"Oh, hello there!" = "哦，你好呀！"
"Tag, you're it!" = "抓到你了！该你了！"
"There you are! I was getting lonely." = "原来你在这儿！我都快寂寞死了。"
"One less building for you to worry about." = "你又少了一座要操心的建筑。"
"Your base is thinning out, Commander." = "你的基地越来越空了，指挥官。"
"Structure destroyed. Next." = "建筑已摧毁。下一个。"
"Your base planning could use some work, Commander." = "你的基地规划还有待改进，指挥官。"
"Structure dismantled. Recycling recommended." = "建筑已拆解。建议回收。"
"Your infrastructure is deteriorating." = "你的基础设施正在恶化。"
"Demolition complete." = "拆除完毕。"
"Structure reclassified: rubble." = "建筑已重新归类：瓦砾。"
"Oops! Was that important?" = "哎呀！那个很重要吗？"
"Kaboom! Next!" = "轰隆！下一个！"
"I'm redecorating your base." = "我在帮你重新装修基地。"
"Bet that one was important!" = "那玩意儿八成很重要吧！"
"That was well defended. Impressive." = "防守得不错。令人佩服。"
"A setback. Nothing more." = "一次挫折，仅此而已。"
"You'll pay for that one." = "这笔账我记下了。"
"A clean strike. I'll remember it." = "干净利落的一击。我记住了。"
"Production capacity reduced. Rebuilding." = "生产能力下降。正在重建。"
"Loss registered. Replacement scheduled." = "损失已登记。已安排替补。"
"Irritating." = "烦人。"
"Infrastructure damage noted. Retaliation queued." = "基础设施损坏已记录。报复行动已加入队列。"
"Hey! I just built that!" = "喂！那是我刚建好的！"
"My factory! Right, no more mister nice guy." = "我的工厂！好吧，这下我不客气了。"
"Rude." = "真没礼貌。"
"Oi! That had a fresh coat of paint!" = "喂！那可是刚刷的漆！"
"Commander, meet the {unit}." = "指挥官，来见识一下 {unit}。"
"The {unit} is ready. I'd start running." = "{unit} 已就绪。换我是你，现在就开始跑。"
"{unit} online. Your end has been calculated." = "{unit} 已上线。你的结局已计算完毕。"
"Deploying {unit}. Resistance is futile." = "正在部署 {unit}。抵抗是徒劳的。"
"Look what I made! A {unit}!" = "看我造了什么！一个 {unit}！"
"Got myself a {unit}. Want to see it up close?" = "我弄到了一个 {unit}。想近距离看看吗？"
"A {unit}? Bold." = "{unit}？胆子不小。"
"Impressive hardware, Commander. Let's see you use it." = "装备不错，指挥官。让我看看你怎么用。"
"Large enemy unit detected: {unit}. Countermeasures prepared." = "侦测到大型敌方单位：{unit}。对策已就绪。"
"Your {unit} has been added to the target list." = "你的 {unit} 已列入目标清单。"
"Whoa. Is that a {unit}?" = "哇。那是 {unit} 吗？"
"Okay, that's a big one." = "好吧，这家伙可真大。"
"Running on empty, Commander?" = "资源见底了，指挥官？"
"Your power grid is failing. Mine isn't." = "你的电网快撑不住了。我的可没事。"
"Overspending, Commander? A bad habit." = "入不敷出了，指挥官？这可是坏习惯。"
"Your reserves: depleted. Mine: optimal." = "你的储备：耗尽。我的：最优。"
"Economic failure detected in your sector." = "在你的区域检测到经济崩溃。"
"Your economy is collapsing. As projected." = "你的经济正在崩溃。符合预测。"
"Out of juice already?" = "这么快就没电了？"
"Need to borrow some metal? Too bad." = "想借点金属？没门。"
"Lights going out over there? Ha!" = "你那边要停电了？哈！"
"{minutes} minutes, Commander. You're tougher than you look." = "{minutes} 分钟了，指挥官。你比看上去更顽强。"
"{minutes} minutes in, and still standing." = "已经 {minutes} 分钟了，你还没倒下。"
"Time elapsed: {minutes} minutes. Your resistance is statistically unlikely." = "已用时间：{minutes} 分钟。从统计学看，你本不该还在抵抗。"
"{minutes} minutes. Recalculating." = "{minutes} 分钟。重新计算中。"
"{minutes} minutes and you're still here? Respect." = "{minutes} 分钟了你还在？佩服。"
"{minutes} minutes already? Time flies when you're winning." = "已经 {minutes} 分钟了？赢的时候时间过得真快。"
"My forces outnumber yours two to one, Commander." = "我的兵力是你的两倍，指挥官。"
"Look at your army. Now look at mine." = "看看你的军队。再看看我的。"
"Numbers are on my side, Commander." = "兵力上我占优，指挥官。"
"Force ratio favourable. Surrender is advised." = "兵力对比有利。建议你投降。"
"Numerical superiority achieved." = "已取得数量优势。"
"Production advantage: decisive." = "生产优势：决定性。"
"I've got way more stuff than you." = "我的家当比你多得多。"
"Count my tanks. Go on, I'll wait." = "数数我的坦克。数吧，我等着。"
"So many tanks. So few of yours." = "满场都是坦克。没几辆是你的。"
"You've been busy. So will we." = "你一直很忙啊。我们也要忙起来了。"
"Numbers aren't everything, Commander." = "数量不代表一切，指挥官。"
"Quality over quantity, Commander." = "兵贵精不贵多，指挥官。"
"Force ratio unfavourable. Adjusting." = "兵力对比不利。正在调整。"
"Your production rate is... noted." = "你的生产速度……已记录。"
"Your numbers will thin." = "你的兵力将被削减。"
"Where did you get all those?!" = "你从哪儿弄来这么多？！"
"Okay, okay, you've got more toys. For now." = "好啦好啦，你的玩具比我多。暂时而已。"
"Okay, that's a LOT of guys." = "好吧，这人也太太太多了。"
"Your Commander looks tired." = "你的指挥官看起来很疲惫。"
"Pull your Commander back while you still can." = "趁还来得及，把你的指挥官撤回去吧。"
"Your Commander won't last much longer." = "你的指挥官撑不了多久了。"
"Enemy command unit integrity: failing." = "敌方指挥单位完整性：濒临崩溃。"
"Your Commander's armour is compromised." = "你的指挥官装甲已被击穿。"
"Your command unit is failing. Prepare for patterning." = "你的指挥单位即将失效。准备接受模式化。"
"Your Commander's smoking! Is that bad?" = "你的指挥官在冒烟！这不太妙吧？"
"Ooh, that's gotta hurt." = "噢，这下肯定很疼。"
"Your Commander's looking a bit crispy!" = "你的指挥官看着有点外焦里嫩啊！"
"{name}, field command. Remember it." = "{name}，战地指挥。记住这个名字。"
"{name}. And you're the Commander I'm about to retire." = "{name}。而你，就是我马上要送去退役的指挥官。"
"Designation: {name}. Yours is irrelevant." = "代号：{name}。你的无关紧要。"
"I am {name}. I am Core." = "我是 {name}。我是 Core。"
"{name}! The name you'll be cursing later." = "{name}！你待会儿要咒骂的名字。"
"Name's {name}. Pleased to beat you." = "我叫 {name}。很高兴打败你。"
"Closer than you think, Commander." = "比你想象的更近，指挥官。"
"Find out for yourself." = "自己来找吧。"
"Location data: classified." = "位置数据：机密。"
"Everywhere that matters." = "所有要紧的地方。"
"Behind you! ...no, the other way." = "在你身后！……不对，另一边。"
"Somewhere with lots of guns." = "某个枪炮很多的地方。"
"Never better, Commander. And you?" = "好得不能再好，指挥官。你呢？"
"Going to plan." = "一切按计划进行。"
"Operating at peak efficiency." = "以最高效率运行中。"
"All systems nominal. Unlike yours." = "所有系统正常。不像你的。"
"Great! Thanks for asking!" = "好极了！谢谢关心！"
"Living the dream." = "过得美滋滋。"
"I've had better days." = "今天不太顺。"
"Holding. Barely. Don't get comfortable." = "还撑得住。勉强而已。别高兴得太早。"
"Systems damaged. Repairs under way." = "系统受损。正在修复。"
"Status: suboptimal." = "状态：欠佳。"
"Don't ask." = "别问了。"
"Could be worse. Probably." = "还不算最糟。大概吧。"
"Something you won't like." = "你不会喜欢的东西。"
"That would spoil the surprise." = "说了就不惊喜了。"
"Production queue: classified." = "生产队列：机密。"
"Weapons. Many weapons." = "武器。很多武器。"
"A big surprise!" = "一个大惊喜！"
"Something with way too many guns." = "某个枪炮多到离谱的东西。"
"{units} units and counting, Commander." = "{units} 个单位，还在增加，指挥官。"
"Enough. {units}, if you must know." = "够多了。非要知道的话，{units} 个。"
"Current unit count: {units}. Increasing." = "当前单位数量：{units}。持续增加中。"
"{units}. Yours is lower." = "{units} 个。你的更少。"
"{units}! Want to meet them all?" = "{units} 个！想全部见见吗？"
"Like {units}? I lost count." = "大概 {units} 个？我数不过来了。"
"No truce, Commander. Not today." = "没有停战，指挥官。今天不行。"
"There will be no deals." = "不会有任何交易。"
"Truce: incompatible with directives." = "停战：与指令不符。"
"Negotiation protocols disabled." = "谈判协议已禁用。"
"Truce? Ha! Nice try." = "停战？哈！想得美。"
"Peace is boring." = "和平太无聊了。"
"Thank you, Commander. You're not bad yourself." = "谢谢，指挥官。你也不赖。"
"Appreciated. It won't save you." = "多谢夸奖。但救不了你。"
"Flattery: ineffective." = "奉承：无效。"
"Compliment received. Threat level unchanged." = "赞美已接收。威胁等级不变。"
"Aw, thanks! Still gonna crush you." = "哎呀，谢啦！不过还是要碾碎你。"
"I know, right?" = "是吧？我也这么觉得。"
"Help? From me? Build more extractors, Commander." = "帮忙？找我？多建点提取器吧，指挥官。"
"My advice: more defences." = "我的建议：多建防御。"
"Assistance denied." = "拒绝协助。"
"Recommendation: surrender." = "建议：投降。"
"Help? Sure: stop playing so badly!" = "帮忙？行啊：别再打得这么烂了！"
"Tip: build more stuff. You're welcome." = "提示：多造点东西。不用谢。"
"Your {unit} is out of the fight." = "你的 {unit} 已退出战斗。"
"Scratch one {unit}." = "{unit}，确认击毁。"
"That {unit} won't trouble us again." = "那个 {unit} 不会再来找麻烦了。"
"{unit} terminated." = "{unit} 已终结。"
"Your {unit} has been recycled." = "你的 {unit} 已被回收。"
"{unit} removed from the battlefield." = "{unit} 已从战场移除。"
"Bye bye, {unit}!" = "拜拜啦，{unit}！"
"Was that {unit} insured?" = "那个 {unit} 买保险了吗？"
"Your {unit} just went kaboom." = "你的 {unit} 刚刚轰隆一声没了。"
"You'll pay for that {unit}." = "你会为那个 {unit} 付出代价。"
"A good {unit}, lost. Noted." = "折损一个精良的 {unit}。已记录。"
"{unit} lost. Replacement scheduled." = "{unit} 已损失。已安排替补。"
"Destruction of {unit} logged." = "{unit} 损毁，已记入日志。"
"Hey! That {unit} was brand new!" = "喂！那个 {unit} 可是全新的！"
"My {unit}! I just polished that!" = "我的 {unit}！我刚擦得锃亮的！"
"My {unit}... You'll answer for that, Commander." = "我的 {unit}……这笔账我会跟你算，指挥官。"
"Losing the {unit} stings. It won't happen twice." = "损失 {unit} 确实痛心。不会再有第二次。"
"{unit} destroyed. Unacceptable." = "{unit} 已被摧毁。不可接受。"
"Loss of {unit} exceeds tolerance. Escalating." = "{unit} 的损失超出容许范围。正在升级应对。"
"My {unit}! Do you know how long that took?!" = "我的 {unit}！你知道我造了多久吗？！"
"NOOO, my {unit}!" = "不要啊——我的 {unit}！"
"So much for your {unit}, Commander." = "你的 {unit} 也不过如此，指挥官。"
"Your {unit} has fallen. A fine machine, though." = "你的 {unit} 倒下了。不过，确实是台好机器。"
"Your {unit} has been dismantled." = "你的 {unit} 已被拆解。"
"Large hostile unit eliminated: {unit}." = "大型敌方单位已清除：{unit}。"
"Your {unit} went down like a sack of bolts!" = "你的 {unit} 像一摊废铁似的瘫倒了！"
"Big {unit}, bigger crater!" = "{unit} 个头大，弹坑更大！"
"Return my {unit} at once, Commander." = "立刻归还我的 {unit}，指挥官。"
"Stealing is beneath you, Commander." = "偷窃有失身份，指挥官。"
"Unauthorised transfer of {unit} detected." = "检测到 {unit} 的未授权转移。"
"Your theft has been logged." = "你的盗窃行为已记录。"
"Hey! Give back my {unit}!" = "喂！把我的 {unit} 还回来！"
"Thief! That {unit} was mine!" = "小偷！那个 {unit} 是我的！"
"You haven't won yet, Commander." = "你还没赢，指挥官。"
"The Arm fights to the last." = "Arm 将战斗到最后一刻。"
"Production offline. Combat protocols remain." = "生产已离线。战斗协议仍在运行。"
"Probability of defeat rising. Ignoring." = "失败概率上升。忽略。"
"I've still got a few tricks left!" = "我还有几招没使呢！"
"Not done yet! Not even close! ...Mostly close." = "还没完！早着呢！……好吧，也快了。"
"We meet again, Commander. Last time was yours. Not this time." = "又见面了，指挥官。上次算你赢。这次不会了。"
"Commander. I've studied our last battle. Have you?" = "指挥官。上一场仗我复盘过了。你呢？"
"Previous defeat analysed. Countermeasures installed." = "上次失败已分析。对策已安装。"
"Again, Commander. This time the outcome has been calculated." = "又是你，指挥官。这一次，结果已计算完毕。"
"You again! I've been practising!" = "又是你！我可是练过的！"
"Rematch time! I'm not going easy this time." = "再来一局！这次我可不会手下留情了。"
"Back for another lesson, Commander?" = "回来再上一课，指挥官？"
"Commander. I trust you've learned something since last time." = "指挥官。想必上次之后，你学到了些东西。"
"You have returned. Your previous patterning was incomplete." = "你回来了。上次的模式化未能完成。"
"Familiar opponent detected. Outcome: repeating." = "检测到已知对手。结局：重演。"
"You again? Didn't I beat you last time?" = "又是你？上次不是被我打趴了吗？"
"Oh, it's you! Ready for round two?" = "哦，是你啊！准备好第二回合了吗？"


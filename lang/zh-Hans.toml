"A Fusion Reactor keeps the fairy lights on all winter. Just never build one next to the tree." = "一座 Fusion Reactor 能让彩灯亮上一整个冬天。只是千万别把它建在圣诞树旁边。"
"Snow falls on the Arm and the Core alike. So do Big Bertha shells." = "雪花对 Arm 和 Core 一视同仁。Big Bertha 的炮弹也一样。"
"Coal in your stocking? Reclaim it. Metal is metal." = "圣诞袜里只有一块煤？拿去回收。金属不问出处。"
"Peewees sing terrible carols, but they never miss a patrol." = "Peewee 唱起圣诞歌来五音不全，巡逻却从不缺席。"
"Stockings full of metal, storage full of energy: a Commander's perfect Christmas morning." = "圣诞袜里塞满金属，能量储存全满：这才是指挥官完美的圣诞早晨。"
"Silent night, holy night: keep a radar tower running, just in case." = "平安夜，圣善夜：雷达塔还是开着吧，以防万一。"
"Snowball fights are fun until somebody brings a Krogoth." = "打雪仗很好玩，直到有人搬来一台 Krogoth。"
"New Year's resolution: build more metal extractors. This year, keep it." = "新年目标：多造金属提取器。今年可别又是三分钟热度。"
"Fireworks are pretty, but a nuclear silo's are louder. Celebrate responsibly." = "烟花很美，但核导弹发射井放的更响。请安全文明燃放。"
"Count down from ten, then count your units. The second count matters more." = "从十开始倒数，然后清点你的单位。后一个数更重要。"
"Out with the old Commander? You only get one. Look after it all year." = "辞旧迎新，连指挥官也要换新的？指挥官只有一个，今年也要好好爱护。"
"Start the year with a bang: the Core recommends the Doomsday Machine, the Arm recommends anything else." = "新年要一炮打响。Core 推荐 Doomsday Machine；Arm 推荐：除了它，什么都行。"
"Fireworks at midnight, artillery at dawn: a Commander's New Year." = "午夜烟火，黎明炮火：这就是指挥官的新年。"
"Raise a glass of coolant to the units lost last year, then build more of them." = "举起一杯冷却液，敬去年损失的单位。然后再造一批。"
"Midnight is the perfect time for a sneak attack. So is every other time." = "午夜是偷袭的绝佳时机。其他任何时候也是。"
"Trick or treat? The Core always picks the D-gun." = "不给糖就捣蛋？Core 永远选 D 炮。"
"A self-destructing Krogoth is a better jump scare than any ghost." = "一台自毁的 Krogoth，比什么鬼都更能吓你一跳。"
"Wrecks rise from the dead with a Necro. Spooky, and very economical." = "有 Necro 在，残骸也能起死回生。又吓人，又省钱。"
"Blips vanishing off your radar? Not ghosts, just jammers. Probably." = "雷达上的光点接连消失？不是闹鬼，只是干扰器。大概吧。"
"Carve your pumpkins before the Big Bertha does." = "南瓜还是趁早自己刻好，别等 Big Bertha 替你动手。"
"Never split the party. Especially when the party is twelve Peewees." = "恐怖片铁律：千万别分头行动。尤其是队伍只有十二个 Peewee 的时候。"
"Fog of war too tame? Set the line of sight to True and let the hills hide what lurks behind them. If you dare." = "战争迷雾不够刺激？把视野设为“真实”，让山丘挡住背后潜伏的一切。如果你敢的话。"
"No Commander has ever come back from the dead. Keep yours alive." = "从来没有哪位指挥官死而复生过。好好保住你的那位。"
"Bats do not show up on radar. Neither do Vamps." = "蝙蝠不会出现在雷达上。Vamp 也不会。"
"The scariest sound in the dark is your energy running out." = "黑暗中最可怕的声音，是你的能量耗尽的声音。"


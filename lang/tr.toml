"Correct the brackets and braces around this line: the game reads the file as it is and skips or misplaces what follows." = "Bu satırın çevresindeki köşeli ve küme parantezlerini düzelt: oyun dosyayı olduğu gibi okur ve sonrasını atlar ya da yanlış yere koyar."
"[{section}] footprint {x} × {z} is clamped to 1..{max} cells a side by Reborn." = "[{section}] ayak izi {x} × {z}, Reborn tarafından kenar başına 1..{max} hücreye sınırlanır."

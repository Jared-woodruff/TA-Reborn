# crates/ta_ui/src/seasonal.rs
"FESTIVE FIELD NOTES" = "ŞENLİKLİ SAHA NOTLARI"
"NEW YEAR FIELD NOTES" = "YILBAŞI SAHA NOTLARI"
"SPOOKY FIELD NOTES" = "ÜRKÜTÜCÜ SAHA NOTLARI"
"Santa's sleigh is not a transport. Load your presents into an Atlas instead." = "Noel Baba'nın kızağı nakliye aracı sayılmaz. Hediyeleri bir Atlas'a yükle."
"The D-gun does not gift-wrap. Take it up with your Commander." = "D-gun hediye paketi yapmaz. Şikâyetlerini Komutanına ilet."
"A Fusion Reactor keeps the fairy lights on all winter. Just never build one next to the tree." = "Bir Fusion Reactor, süs ışıklarını bütün kış yanık tutar. Yalnız onu asla yılbaşı ağacının yanına kurma."
"Snow falls on the Arm and the Core alike. So do Big Bertha shells." = "Kar, Arm'a da Core'a da eşit yağar. Big Bertha mermileri de."
"Coal in your stocking? Reclaim it. Metal is metal." = "Noel Baba hediye yerine kömür mü bıraktı? Geri kazan. Metal metaldir."
"Peewees sing terrible carols, but they never miss a patrol." = "Peewee'lerin Noel şarkıları kulak tırmalar ama devriyeyi asla aksatmazlar."
"Stockings full of metal, storage full of energy: a Commander's perfect Christmas morning." = "Çoraplar metal dolu, depolar enerji dolu: bir Komutan için kusursuz Noel sabahı."
"Silent night, holy night: keep a radar tower running, just in case." = "Sessiz gece, kutsal gece… Yine de bir radar kulesi açık kalsın, ne olur ne olmaz."
"Snowball fights are fun until somebody brings a Krogoth." = "Kartopu savaşı, biri Krogoth getirene kadar eğlencelidir."
"New Year's resolution: build more metal extractors. This year, keep it." = "Yeni yıl kararı: daha çok metal çıkarıcı kur. Bu sefer sözünde dur."
"Fireworks are pretty, but a nuclear silo's are louder. Celebrate responsibly." = "Havai fişekler güzeldir ama nükleer silonunkiler çok daha fazla ses getirir. Sorumlulukla kutla."
"Count down from ten, then count your units. The second count matters more." = "Ondan geriye say, sonra birimlerini say. Asıl önemli olan ikinci sayım."
"Out with the old Commander? You only get one. Look after it all year." = "Eski yılı uğurla ama Komutanını değil: ondan yalnızca bir tane var. Bütün yıl ona iyi bak."
"Start the year with a bang: the Core recommends the Doomsday Machine, the Arm recommends anything else." = "Yeni yıla bomba gibi gir: Core, Doomsday Machine'i önerir; Arm ise ondan başka her şeyi."
"Fireworks at midnight, artillery at dawn: a Commander's New Year." = "Gece yarısı havai fişek, şafakta topçu ateşi: Komutan usulü yılbaşı."
"Raise a glass of coolant to the units lost last year, then build more of them." = "Geride kalan yılda kaybettiğin birimlerin anısına bir kadeh soğutma sıvısı kaldır. Sonra daha fazlasını üret."
"Midnight is the perfect time for a sneak attack. So is every other time." = "Gece yarısı sinsi bir baskın için biçilmiş kaftandır. Günün diğer bütün saatleri de öyle."
"Trick or treat? The Core always picks the D-gun." = "Şeker mi, şaka mı? Core her zaman D-gun'ı seçer."
"A self-destructing Krogoth is a better jump scare than any ghost." = "Kendini imha eden bir Krogoth, insanı her hayaletten daha çok yerinden hoplatır."
"Wrecks rise from the dead with a Necro. Spooky, and very economical." = "Necro ile enkazlar mezarlarından kalkar. Ürkütücü ama bir o kadar da ekonomik."
"Blips vanishing off your radar? Not ghosts, just jammers. Probably." = "Radarındaki işaretler kayboluyor mu? Hayalet değil, sadece karıştırıcılar. Herhalde."
"Carve your pumpkins before the Big Bertha does." = "Balkabaklarını Big Bertha oymadan önce sen oy."
"Never split the party. Especially when the party is twelve Peewees." = "Grubu asla bölme. Hele o grup on iki Peewee'den ibaretse."
"Fog of war too tame? Set the line of sight to True and let the hills hide what lurks behind them. If you dare." = "Savaş sisi sana fazla mı uysal geliyor? Görüş hattını Gerçek olarak ayarla, tepeler ardında pusuya yatanı saklasın. Cesaretin varsa."
"No Commander has ever come back from the dead. Keep yours alive." = "Hiçbir Komutan öbür dünyadan geri dönmedi. Seninkini hayatta tut."
"Bats do not show up on radar. Neither do Vamps." = "Yarasalar radarda görünmez. Vamp'lar da."
"The scariest sound in the dark is your energy running out." = "Karanlıkta duyabileceğin en korkunç ses: enerjinin tükenmesi."


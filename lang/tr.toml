# apps/ta_launcher/src/catalogue.rs
"Spotlight first" = "Öne çıkanlar önce"
"Newest release" = "En yeni sürüm"
"Oldest release" = "En eski sürüm"
"Smallest download" = "En küçük indirme"
"Largest download" = "En büyük indirme"
"Effect capacity and loading cost" = "Efekt kapasitesi ve yükleme maliyeti"
"The sprite atlas reached 16,384 × 16,384 on the review GPU and dropped further frames. One startup took about 59 seconds; this was an observation, not a controlled benchmark." = "İnceleme GPU'sunda sprite atlası 16.384 × 16.384 boyutuna ulaştı ve sonraki kareler atlandı. Bir açılış yaklaşık 59 saniye sürdü; bu bir gözlem, kontrollü bir performans testi değil."
"Check effect frame counts and dimensions. Reborn needs bounded animation streaming or atlas paging for this full set; test actual gameplay on the target GPU." = "Efekt kare sayılarını ve boyutlarını kontrol edin. Reborn'un tam küme için sınırlı animasyon akışına veya atlas sayfalamasına ihtiyacı var; hedef GPU'da gerçek oynanışı test edin."
"Large effect archives" = "Büyük efekt arşivleri"
"These archives exceed the 256 MiB aggregate GAF decode budget. Reborn rejects the oversized decode instead of exhausting memory." = "Bu arşivler toplam 256 MiB GAF çözme bütçesini aşıyor. Reborn belleği tüketmek yerine aşırı büyük çözme işlemini reddeder."
"Reduce or split oversized effects. Reborn needs per-entry decoding or streaming before raising the resource allowance." = "Aşırı büyük efektleri küçültün veya bölün. Kaynak sınırı artırılmadan önce Reborn'a girdi başına çözme veya akış desteği gerekir."
"Missing weapons and wreck assets" = "Eksik silah ve enkaz varlıkları"
"The review found 27 missing data references, including explosion weapons and six feature graphics or models. A missing reference does not always mean the affected behavior is used in play." = "İncelemede patlama silahları ve altı çevre nesnesi grafiği veya modeli dahil 27 eksik veri başvurusu bulundu. Eksik bir başvuru, ilgili davranışın oyunda kullanıldığı anlamına her zaman gelmez."
"Use the local automated report to locate each source reference. Supply the missing assets, correct the reference, or explain why the unused definition is intentional." = "Her başvurunun kaynağını yerel otomatik rapordan bulun. Eksik varlıkları sağlayın, başvuruyu düzeltin veya kullanılmayan tanımın neden bilerek bırakıldığını açıklayın."
"Inherited base-game placeholders" = "Temel oyundan devralınan yer tutucular"
"These rejected placeholder files come from the base game in the reviewed installation, not Escalation. They do not establish a mod defect." = "Reddedilen bu yer tutucu dosyalar, incelenen kurulumda Escalation’dan değil temel oyundan gelir. Bir mod kusurunu kanıtlamazlar."
"Use the local report's layer field to verify origin. Only replace these assets if your mod intentionally overrides them." = "Kaynağı doğrulamak için yerel raporun katman alanını kullanın. Bu varlıkları yalnızca modunuz bilerek üzerlerine yazıyorsa değiştirin."
"Computer players can stall" = "Bilgisayar oyuncuları takılabilir"
"AI Boost is included and computer players work on Asteroid Field, but can stall on some other space maps." = "AI Boost dahildir ve bilgisayar oyuncuları Asteroid Field üzerinde çalışır, ancak bazı başka uzay haritalarında takılabilir."
"Test each space map with computer players before publishing it. Asteroid Field is the reviewed starting point." = "Yayımlamadan önce her uzay haritasını bilgisayar oyuncularıyla test edin. Asteroid Field incelenmiş başlangıç noktasıdır."
"Damaged optional map archives" = "Hasarlı isteğe bağlı harita arşivleri"
"The optional map packs contain three damaged map archives. These are separate downloads and may not be present in your installation." = "İsteğe bağlı harita paketleri üç hasarlı harita arşivi içerir. Bunlar ayrı indirilir ve kurulumunuzda bulunmayabilir."
"Import working maps individually. Rebuild or replace damaged archives before distributing a map pack." = "Çalışan haritaları tek tek içe aktarın. Harita paketi dağıtmadan önce hasarlı arşivleri yeniden oluşturun veya değiştirin."
"Unfinished preview armies" = "Tamamlanmamış önizleme orduları"
"Its new armies use ARM's name, and some units are unfinished in this early preview." = "Bu erken önizlemede yeni ordular ARM adını kullanıyor ve bazı birimler tamamlanmamış."
"Give each army its intended side identity and complete its unit data and assets. Check every faction in a skirmish." = "Her orduya amaçlanan taraf kimliğini verin ve birim verileriyle varlıklarını tamamlayın. Her tarafı bir çatışmada kontrol edin."
"Expanded ARM and CORE armies with new units and weapons." = "Yeni birimler ve silahlarla genişletilmiş ARM ve CORE orduları."
"549 UNITS" = "549 BİRİM"
"177 MAPS" = "177 HARİTA"
"Gold 10.2.0 installs and plays: computer players build and fight, every unit is painted and every explosion drawn. A few wrecks have no model in the mod's own files." = "Gold 10.2.0 kurulup oynanabiliyor: bilgisayar oyuncuları inşa ediyor ve savaşıyor, her birim boyalı ve her patlama çiziliyor. Birkaç enkazın modu oluşturan dosyalarda modeli yok."
"Total Annihilation as Cavedog might have carried it on: every unit earns its place, hundreds more join, and a third tech level tops it off." = "Cavedog sürdürseydi Total Annihilation böyle olabilirdi: her birim yerini hak ediyor, yüzlercesi daha katılıyor ve üçüncü bir teknoloji seviyesi işi taçlandırıyor."
"500 UNITS" = "500 BİRİM"
"105 MAPS" = "105 HARİTA"
"TECH 3" = "TEKNOLOJİ 3"
"Faster games that keep the strategy: new units, each carefully balanced, and hard-hitting armies from the start." = "Stratejiden ödün vermeyen daha hızlı oyunlar: her biri özenle dengelenmiş yeni birimler ve baştan sert vuran ordular."
"FASTER GAMES" = "HIZLI OYUNLAR"
"297 UNITS" = "297 BİRİM"
"Still in alpha, and a big download." = "Hâlâ alfa aşamasında ve indirmesi büyük."
"Big and brutal: 512 units, fierce fighting, and new sounds and effects throughout." = "Büyük ve acımasız: 512 birim, kızgın çatışmalar, baştan sona yeni sesler ve efektler."
"512 UNITS" = "512 BİRİM"
"91 MAPS" = "91 HARİTA"
"The optional map weapons in its download are left out." = "İndirmesindeki isteğe bağlı harita silahları dahil edilmedi."
"A third army, the Talon, from ten years of the community's ideas: teleporters, air transports that carry whole squads, and more." = "Topluluğun on yıllık fikirlerinden doğan üçüncü bir ordu, Talon: ışınlayıcılar, bütün mangaları taşıyan hava nakliyecileri ve daha fazlası."
"NEW RACE" = "YENİ IRK"
"Choose TAL as your side in a skirmish." = "Çatışmada tarafın olarak TAL'ı seç."
"Cavedog's style, kept simple: every unit has a clear job and looks as if it always belonged." = "Sade tutulmuş Cavedog tarzı: her birimin net bir görevi var ve hep oradaymış gibi görünüyor."
"CLASSIC STYLE" = "KLASİK TARZ"
"NEW COMMANDERS" = "YENİ KOMUTANLAR"
"Classic BattleTech at Total Annihilation's scale: the Inner Sphere against the Clans, with walking mechs." = "Total Annihilation ölçeğinde klasik BattleTech: yürüyen mekalarla Inner Sphere ve Clans karşı karşıya."
"BATTLETECH" = "BATTLETECH"
"NEW SIDES" = "YENİ TARAFLAR"
"Computer players are weaker as the Inner Sphere." = "Bilgisayar oyuncuları Inner Sphere tarafında daha zayıf."
"The original's feel with well-balanced units and structures, tuned by veterans of the game." = "Oyunun kıdemlileri tarafından ayarlanmış, iyi dengelenmiş birim ve yapılarla orijinalin havası."
"CLASSIC FEEL" = "KLASİK HAVA"
"Computer players struggle as ARM." = "Bilgisayar oyuncuları ARM tarafında zorlanıyor."
"An add-on race in the making: new units and new weapons for a third and a fourth army." = "Yapım aşamasında bir ek ırk: üçüncü ve dördüncü bir ordu için yeni birimler ve yeni silahlar."
"NEW RACES" = "YENİ IRKLAR"
"PREVIEW" = "ÖN İZLEME"
"An early preview: its new armies go by ARM's name, and some of their units are unfinished." = "Erken bir ön izleme: yeni orduları ARM adını taşıyor ve bazı birimleri tamamlanmamış."
"Take ARM and CORE into space with command cruisers and fleets of warships." = "Komuta kruvazörleri ve savaş gemisi filolarıyla ARM ve CORE’u uzaya taşı."
"SPACE WARFARE" = "UZAY SAVAŞI"
"172 UNITS" = "172 BİRİM"
"AI Boost is already included. Computer players work on Asteroid Field, but can stall on some space maps. The optional map packs contain three damaged map archives; import working maps individually." = "AI Boost zaten dâhil. Bilgisayar oyuncuları Asteroid Field haritasında çalışır, ancak bazı uzay haritalarında takılabilir. İsteğe bağlı harita paketlerinde üç bozuk harita arşivi var; çalışan haritaları tek tek içe aktar."
"Combat Zone TA: three new sides in a semi-realistic war." = "Combat Zone TA: yarı gerçekçi bir savaşta üç yeni taraf."
"Nothing to download: it was made for the Spring engine." = "İndirilecek bir şey yok: Spring motoru için yapıldı."
"The One Year War of Mobile Suit Gundam: the Federation against Zeon." = "Mobile Suit Gundam'ın Bir Yıl Savaşı: Federasyon ile Zeon karşı karşıya."
"ANIME" = "ANİME"
"Its files are no longer on ModDB." = "Dosyaları artık ModDB'de yok."


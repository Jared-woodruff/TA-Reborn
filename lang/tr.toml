# apps/ta_game/src/chatter.rs
"FIELD COMMANDER" = "SAHA KOMUTANI"
"MACHINE INTELLIGENCE" = "MAKİNE ZEKÂSI"
"MERCENARY" = "PARALI ASKER"
"Commander. May the better tactician win." = "Komutan. İyi olan taktisyen kazansın."
"Arm forces in position. Good luck, Commander." = "Arm kuvvetleri mevzide. Bol şans, Komutan."
"Let's keep this clean, Commander." = "Temiz bir savaş olsun, Komutan."
"Commander. Let's give the historians something to write about." = "Komutan. Tarihçilere yazacak bir şeyler bırakalım."
"All units, the enemy is in theatre. Begin." = "Tüm birimler, düşman harekât alanında. Başlayın."
"Target acquired. Resistance is inefficient." = "Hedef belirlendi. Direniş verimsiz."
"Your consciousness will be patterned. Eventually." = "Bilincin örüntülenecek. Er ya da geç."
"Initiating conquest protocol." = "Fetih protokolü başlatılıyor."
"Your biological limitations have been factored in." = "Biyolojik kısıtların hesaba katıldı."
"Patterning facilities stand ready for your arrival." = "Örüntüleme tesisleri hazır. Gelişin bekleniyor."
"Hope you brought a spare Commander!" = "Umarım yanına yedek bir Komutan almışsındır!"
"Let's see what you've got!" = "Bakalım neler yapabiliyorsun!"
"Build fast. It won't matter, but build fast." = "Hızlı inşa et. Bir şey değiştirmez ama hızlı inşa et."
"Mind if I take your base? Thanks!" = "Üssünü alsam olur mu? Sağ ol!"
"Ooh, a new victim. I mean, opponent." = "Ooo, yeni bir kurban. Pardon, rakip."
"Greetings, Commander." = "Selamlar, Komutan."
"Good luck to you too." = "Sana da bol şans."
"Likewise, Commander. Now, to business." = "Sana da, Komutan. Şimdi işimize bakalım."
"Greeting acknowledged." = "Selamlama alındı."
"Salutations are irrelevant." = "Selamlaşma önemsiz."
"Hello. Goodbye soon." = "Merhaba. Yakında da elveda."
"Hey yourself!" = "Sana da hey!"
"gl hf. Mostly hf for me." = "gl hf. Gerçi eğlenen daha çok ben olacağım."
"Hi! Bye! Mostly bye." = "Selam! Güle güle! Daha çok güle güle."
"gg, Commander." = "gg, Komutan."
"Good game. Well fought." = "İyi oyundu. İyi savaştın."
"gg. Data retained for analysis." = "gg. Veriler analiz için saklandı."
"Game assessment: good." = "Oyun değerlendirmesi: iyi."
"gg!" = "gg!"
"gg. Rematch?" = "gg. Rövanş?"
"Big words from a small army." = "Küçük bir ordudan büyük laflar."
"We'll see who's laughing when the smoke clears." = "Duman dağılınca kimin güldüğünü göreceğiz."
"Save your breath for the debriefing." = "Nefesini harekât sonrası rapora sakla."
"Bluster won't hold a ridge, Commander." = "Kuru gürültüyle tepe tutulmaz, Komutan."
"Insolence logged." = "Küstahlık kaydedildi."
"Your threat rating has been downgraded." = "Tehdit seviyen düşürüldü."
"Noise detected. Ignoring." = "Gürültü algılandı. Yok sayılıyor."
"Emotional outburst detected. How quaint." = "Duygu patlaması algılandı. Ne şirin."
"Oh, it's ON now." = "Oho, şimdi işler KIZIŞTI."
"Talk is cheap. Tanks aren't." = "Laf ucuz. Tanklar değil."
"Come over here and say that." = "Gel de bunu yüzüme söyle."
"Says the one who's losing. Probably. I haven't checked." = "Bunu da kaybeden söylüyor. Galiba. Bakmadım ki."
"The Arm does not surrender." = "Arm teslim olmaz."
"Not while I have a Commander standing." = "Ayakta bir Komutanım varken asla."
"Surrender is not in my programming." = "Teslim olmak programımda yok."
"Negative." = "Olumsuz."
"Ha! Never!" = "Ha! Asla!"
"You first." = "Önce sen."
"That's classified, Commander." = "Orası gizli, Komutan."
"Wouldn't you like to know." = "Bilmek isterdin, değil mi?"
"Query rejected." = "Sorgu reddedildi."
"Insufficient clearance." = "Yetkin yetersiz."
"Dunno. Probably!" = "Bilmem. Herhalde!"
"Ask me after the battle." = "Savaştan sonra sor."
"Apology accepted. The attack continues." = "Özür kabul edildi. Saldırı sürüyor."
"Apology noted. Irrelevant." = "Özür kaydedildi. Önemsiz."
"No you're not!" = "Hiç de üzgün değilsin!"
"Stay focused, Commander." = "Odaklan, Komutan."
"Less talk, more metal." = "Az laf, çok metal."
"Noted." = "Not edildi."
"Mind the war, Commander." = "Savaşına bak, Komutan."
"Irrelevant." = "Önemsiz."
"Processing... still irrelevant." = "İşleniyor... hâlâ önemsiz."
"Your words are being archived." = "Sözlerin arşivleniyor."
"Your input has been compressed. To nothing." = "Girdilerin sıkıştırıldı. Sıfır bayta."
"Uh huh." = "Hı hı."
"Cool story." = "Ne güzel hikâye."
"Keep typing. I'll keep building." = "Sen yazmaya devam et. Ben inşa etmeye devam."
"Typing won't save you, but I respect the effort." = "Yazmak seni kurtarmaz ama çabana saygım var."
"Commander down! All units, hold the line!" = "Komutan düştü! Tüm birimler, hattı tutun!"
"You'll pay for that." = "Bunu ödeyeceksin."
"Command unit lost. Rerouting." = "Komuta birimi kaybedildi. Yeniden yönlendiriliyor."
"Critical failure. Compensating." = "Kritik arıza. Telafi ediliyor."
"My Commander! That was my favourite!" = "Komutanım! O benim en sevdiğimdi!"
"Okay, THAT hurt." = "Tamam, İŞTE BU acıttı."
"Your Commander has fallen." = "Komutanın düştü."
"Commander eliminated. Stand down." = "Komutan etkisiz hâle getirildi. Silahları bırak."
"The war is over for you, Commander." = "Senin için savaş bitti, Komutan."
"Enemy command unit terminated." = "Düşman komuta birimi sonlandırıldı."
"Your Commander has been decommissioned." = "Komutanın hizmet dışı bırakıldı."
"Your consciousness is ready for patterning." = "Bilincin örüntülemeye hazır."
"Boom! Did you need that?" = "Bum! Ona ihtiyacın var mıydı?"
"Scratch one Commander!" = "Bir Komutan eksildi!"
"And THAT'S how it's done!" = "İŞTE BÖYLE yapılır!"
"gg. Well fought, Commander." = "gg. İyi savaştın, Komutan."
"The Arm will remember this." = "Arm bunu unutmayacak."
"Well played. I salute you, Commander." = "İyi oynadın. Seni selamlıyorum, Komutan."
"This is not the end. The Core is eternal." = "Bu son değil. Core ebedidir."
"Defeat recorded. Backup consciousness activating." = "Yenilgi kaydedildi. Yedek bilinç etkinleştiriliyor."
"Shutting down. Your designation has been remembered." = "Kapatılıyor. Tanımın belleğe kaydedildi."
"gg... I'll be back. With more tanks." = "gg... Geri döneceğim. Daha çok tankla."
"Fine. FINE. gg." = "Peki. PEKİ. gg."
"Okay, okay, you win. This time!" = "Tamam, tamam, sen kazandın. Bu seferlik!"
"gg, Commander. You fought well." = "gg, Komutan. İyi savaştın."
"Victory. Better luck next time." = "Zafer. Bir dahaki sefere bol şans."
"Your forces fought bravely. It wasn't enough." = "Kuvvetlerin cesurca savaştı. Yetmedi."
"Your consciousness will be patterned. gg." = "Bilincin örüntülenecek. gg."
"Conquest complete." = "Fetih tamamlandı."
"Resistance ended. Your tactics are archived for study." = "Direniş sona erdi. Taktiklerin incelenmek üzere arşivlendi."
"Too easy! gg." = "Çok kolaydı! gg."
"gg! Rematch? I'll go easy. Maybe." = "gg! Rövanş? Bu sefer yavaş giderim. Belki."
"gg! Same time tomorrow?" = "gg! Yarın aynı saatte?"
"Nuclear launch detected! Take cover!" = "Nükleer fırlatma tespit edildi! Siper alın!"
"A nuke? So that's how it's going to be." = "Nükleer mi? Demek iş buraya vardı."
"Nuclear launch detected. Calculating losses." = "Nükleer fırlatma tespit edildi. Kayıplar hesaplanıyor."
"Crude. Effective." = "Kaba. Etkili."
"Is that a NUKE?!" = "Bu bir NÜKLEER mi?!"
"Oh no. Oh no no no." = "Olamaz. Olamaz, olamaz, olamaz."
"Missile away. Nothing personal, Commander." = "Füze yolda. Kişisel algılama, Komutan."
"Look up, Commander." = "Yukarı bak, Komutan."
"Special delivery." = "Özel teslimat."
"Heads up! Literally!" = "Başının üstüne dikkat! Gerçekten!"
"Special delivery!" = "Özel teslimat!"
"A costly engagement. We'll regroup." = "Pahalıya patlayan bir çarpışma. Yeniden toplanacağız."
"You fight well. For now." = "İyi savaşıyorsun. Şimdilik."
"We'll be back, and in greater numbers." = "Geri döneceğiz, hem de daha büyük bir kuvvetle."
"Acceptable losses." = "Kabul edilebilir kayıplar."
"Losses within projections. Mostly." = "Kayıplar öngörü dahilinde. Çoğunlukla."
"Units lost. Replacements already in production." = "Birimler kaybedildi. Yenileri zaten üretimde."
"That was my best army!" = "O benim en iyi ordumdu!"
"Lucky shots. All of them." = "Şans eseri atışlar. Hepsi."
"Okay, that one was on me." = "Tamam, bu sefer kabahat bende."
"Your forces were outmatched." = "Kuvvetlerin boy ölçüşemedi."
"Send more. We'll wait." = "Daha fazlasını gönder. Bekleriz."
"Next time, bring more than that." = "Bir dahaki sefere daha fazlasıyla gel."
"Your forces were inadequate." = "Kuvvetlerin yetersizdi."
"Enemy attrition: optimal." = "Düşman yıpranması: optimal."
"Your offensive has been neutralised." = "Taarruzun etkisiz hâle getirildi."
"Is that all you've got?" = "Elinden gelen bu kadar mı?"
"Who's next?" = "Sıradaki kim?"
"Thanks for the target practice!" = "Atış talimi için sağ ol!"
"Quiet out there, Commander. Too quiet." = "Ortalık sessiz, Komutan. Fazla sessiz."
"Still building? So are we." = "Hâlâ inşa mı ediyorsun? Biz de."
"Planning something, Commander? I'd hope so." = "Bir şey mi planlıyorsun, Komutan? Umarım öyledir."
"Your silence has been noted." = "Sessizliğin not edildi."
"Scanning... still there, Commander?" = "Taranıyor... hâlâ orada mısın, Komutan?"
"Inactivity detected. Are you malfunctioning?" = "Hareketsizlik algılandı. Arızalı mısın?"
"Hello? Anyone home?" = "Alo? Kimse yok mu?"
"I'm getting bored over here." = "Burada sıkılmaya başladım."
"Wake me up when something explodes." = "Bir şey patlayınca beni uyandır."
"That's hardly fair, Commander." = "Bu pek adil sayılmaz, Komutan."
"Cheating? The Arm expected better." = "Hile mi? Arm senden daha iyisini beklerdi."
"Anomaly detected. Cheat logged." = "Anomali tespit edildi. Hile kaydedildi."
"Rule violation recorded." = "Kural ihlali kaydedildi."
"Cheater! I saw that!" = "Hileci! Gördüm onu!"
"Oh, come ON!" = "Hadi AMA!"
"Contact. So this is where you've been hiding." = "Temas. Demek burada saklanıyordun."
"Enemy forces sighted. Engaging." = "Düşman kuvvetleri görüldü. Saldırıya geçiliyor."
"There you are, Commander." = "İşte buradasın, Komutan."
"Eyes on the enemy. Here we go." = "Düşmanla görsel temas. İşte başlıyoruz."
"Hostile units located. Initiating elimination." = "Düşman birimler bulundu. İmha başlatılıyor."
"Contact established. Probability of your survival: declining." = "Temas kuruldu. Hayatta kalma olasılığın: düşüyor."
"Target acquired." = "Hedef belirlendi."
"Biological signatures located. Commencing cleanup." = "Biyolojik izler bulundu. Temizlik başlatılıyor."
"Found you!" = "Buldum seni!"
"Oh, hello there!" = "Oo, merhaba!"
"Tag, you're it!" = "Ebe sensin!"
"There you are! I was getting lonely." = "Buradaymışsın! Yalnızlıktan ölüyordum."
"One less building for you to worry about." = "Dert edeceğin bir bina eksildi."
"Your base is thinning out, Commander." = "Üssün seyreliyor, Komutan."
"Structure destroyed. Next." = "Yapı yok edildi. Sıradaki."
"Your base planning could use some work, Commander." = "Üs planlaman geliştirilmeye açık, Komutan."
"Structure dismantled. Recycling recommended." = "Yapı söküldü. Geri dönüşüm önerilir."
"Your infrastructure is deteriorating." = "Altyapın çöküyor."
"Demolition complete." = "Yıkım tamamlandı."
"Structure reclassified: rubble." = "Yapı yeniden sınıflandırıldı: moloz."
"Oops! Was that important?" = "Hoppala! Önemli miydi o?"
"Kaboom! Next!" = "Kabum! Sıradaki!"
"I'm redecorating your base." = "Üssünün dekorasyonunu yeniliyorum."
"Bet that one was important!" = "Bahse girerim o önemliydi!"
"That was well defended. Impressive." = "İyi savunulmuştu. Etkileyici."
"A setback. Nothing more." = "Bir aksilik. O kadar."
"You'll pay for that one." = "Bunun hesabını vereceksin."
"A clean strike. I'll remember it." = "Temiz bir vuruş. Bunu unutmayacağım."
"Production capacity reduced. Rebuilding." = "Üretim kapasitesi düştü. Yeniden inşa ediliyor."
"Loss registered. Replacement scheduled." = "Kayıp kaydedildi. Yerine yenisi planlandı."
"Irritating." = "Sinir bozucu."
"Infrastructure damage noted. Retaliation queued." = "Altyapı hasarı not edildi. Misilleme sıraya alındı."
"Hey! I just built that!" = "Hey! Onu daha yeni yapmıştım!"
"My factory! Right, no more mister nice guy." = "Fabrikam! Tamam, iyi çocuk numarası bitti."
"Rude." = "Kabalık bu."
"Oi! That had a fresh coat of paint!" = "Oha! Boyası daha kurumamıştı!"
"Commander, meet the {unit}." = "Komutan, karşında {unit}."
"The {unit} is ready. I'd start running." = "{unit} hazır. Ben olsam kaçmaya başlardım."
"{unit} online. Your end has been calculated." = "{unit} devrede. Sonun hesaplandı."
"Deploying {unit}. Resistance is futile." = "{unit} konuşlandırılıyor. Direnmek boşuna."
"Look what I made! A {unit}!" = "Bak ne yaptım! Bir {unit}!"
"Got myself a {unit}. Want to see it up close?" = "Kendime bir {unit} yaptım. Yakından görmek ister misin?"
"A {unit}? Bold." = "Bir {unit} mi? Cesurca."
"Impressive hardware, Commander. Let's see you use it." = "Etkileyici donanım, Komutan. Bakalım kullanabilecek misin."
"Large enemy unit detected: {unit}. Countermeasures prepared." = "Büyük düşman birimi tespit edildi: {unit}. Karşı önlemler hazır."
"Your {unit} has been added to the target list." = "{unit} birimin hedef listesine eklendi."
"Whoa. Is that a {unit}?" = "Vay. O bir {unit} mi?"
"Okay, that's a big one." = "Tamam, bu büyükmüş."
"Running on empty, Commander?" = "Depo boş mu, Komutan?"
"Your power grid is failing. Mine isn't." = "Enerji şebeken çöküyor. Benimki değil."
"Overspending, Commander? A bad habit." = "Fazla mı harcıyorsun, Komutan? Kötü bir alışkanlık."
"Your reserves: depleted. Mine: optimal." = "Rezervlerin: tükendi. Benimkiler: optimal."
"Economic failure detected in your sector." = "Sektöründe ekonomik çöküş tespit edildi."
"Your economy is collapsing. As projected." = "Ekonomin çöküyor. Öngörüldüğü gibi."
"Out of juice already?" = "Enerjin şimdiden mi bitti?"
"Need to borrow some metal? Too bad." = "Biraz metal ödünç mü lazım? Ne yazık."
"Lights going out over there? Ha!" = "Işıklar mı sönüyor orada? Ha!"
"{minutes} minutes, Commander. You're tougher than you look." = "{minutes} dakika oldu, Komutan. Göründüğünden dayanıklısın."
"{minutes} minutes in, and still standing." = "{minutes} dakika geçti, hâlâ ayaktasın."
"Time elapsed: {minutes} minutes. Your resistance is statistically unlikely." = "Geçen süre: {minutes} dakika. Direnişin istatistiksel olarak beklenmedik."
"{minutes} minutes. Recalculating." = "{minutes} dakika. Yeniden hesaplanıyor."
"{minutes} minutes and you're still here? Respect." = "{minutes} dakika oldu, hâlâ burada mısın? Saygılar."
"{minutes} minutes already? Time flies when you're winning." = "{minutes} dakika mı oldu bile? Kazanırken zaman nasıl da uçuyor."
"My forces outnumber yours two to one, Commander." = "Kuvvetlerim seninkilerin iki katı, Komutan."
"Look at your army. Now look at mine." = "Ordunu bir gör. Şimdi de benimkini."
"Numbers are on my side, Commander." = "Sayılar benden yana, Komutan."
"Force ratio favourable. Surrender is advised." = "Kuvvet oranı lehimize. Teslim olman önerilir."
"Numerical superiority achieved." = "Sayısal üstünlük sağlandı."
"Production advantage: decisive." = "Üretim üstünlüğü: kesin."
"I've got way more stuff than you." = "Benim senden çok daha fazla şeyim var."
"Count my tanks. Go on, I'll wait." = "Tanklarımı say. Hadi, beklerim."
"So many tanks. So few of yours." = "Bende tank üstüne tank. Sende bir avuç."
"You've been busy. So will we." = "Boş durmamışsın. Biz de durmayacağız."
"Numbers aren't everything, Commander." = "Sayılar her şey değildir, Komutan."
"Quality over quantity, Commander." = "Nitelik nicelikten önce gelir, Komutan."
"Force ratio unfavourable. Adjusting." = "Kuvvet oranı aleyhimize. Ayarlanıyor."
"Your production rate is... noted." = "Üretim hızın... not edildi."
"Your numbers will thin." = "Sayıların azalacak."
"Where did you get all those?!" = "Bunların hepsini nereden buldun?!"
"Okay, okay, you've got more toys. For now." = "Tamam, tamam, senin oyuncakların daha çok. Şimdilik."
"Okay, that's a LOT of guys." = "Tamam, bu ne KALABALIK böyle."
"Your Commander looks tired." = "Komutanın yorgun görünüyor."
"Pull your Commander back while you still can." = "Hâlâ fırsatın varken Komutanını geri çek."
"Your Commander won't last much longer." = "Komutanın daha fazla dayanamayacak."
"Enemy command unit integrity: failing." = "Düşman komuta birimi bütünlüğü: çöküyor."
"Your Commander's armour is compromised." = "Komutanının zırhı delindi."
"Your command unit is failing. Prepare for patterning." = "Komuta birimin çöküyor. Örüntülemeye hazırlan."
"Your Commander's smoking! Is that bad?" = "Komutanın tütüyor! Bu kötü bir şey mi?"
"Ooh, that's gotta hurt." = "Ooo, bu acıtmıştır."
"Your Commander's looking a bit crispy!" = "Komutanın biraz fazla pişmiş!"
"{name}, field command. Remember it." = "{name}, saha komutası. Bu adı unutma."
"{name}. And you're the Commander I'm about to retire." = "{name}. Sen de emekliye ayırmak üzere olduğum Komutansın."
"Designation: {name}. Yours is irrelevant." = "Tanım: {name}. Seninki önemsiz."
"I am {name}. I am Core." = "Ben {name}. Ben Core'um."
"{name}! The name you'll be cursing later." = "{name}! İleride lanet okuyacağın isim."
"Name's {name}. Pleased to beat you." = "Adım {name}. Seni yendiğime memnun oldum."
"Closer than you think, Commander." = "Sandığından daha yakın, Komutan."
"Find out for yourself." = "Kendin öğren."
"Location data: classified." = "Konum verisi: gizli."
"Everywhere that matters." = "Önemli olan her yerde."
"Behind you! ...no, the other way." = "Arkanda! ...yok, öbür tarafta."
"Somewhere with lots of guns." = "Bol silahlı bir yerde."
"Never better, Commander. And you?" = "Hiç bu kadar iyi olmamıştım, Komutan. Ya sen?"
"Going to plan." = "Her şey plana göre."
"Operating at peak efficiency." = "Azami verimle çalışılıyor."
"All systems nominal. Unlike yours." = "Tüm sistemler normal. Seninkilerin aksine."
"Great! Thanks for asking!" = "Harika! Sorduğun için sağ ol!"
"Living the dream." = "Rüya gibi."
"I've had better days." = "Daha iyi günlerim olmuştu."
"Holding. Barely. Don't get comfortable." = "Dayanıyorum. Zar zor. Sakın rahatlama."
"Systems damaged. Repairs under way." = "Sistemler hasarlı. Onarım sürüyor."
"Status: suboptimal." = "Durum: optimalin altında."
"Don't ask." = "Hiç sorma."
"Could be worse. Probably." = "Daha kötü olabilirdi. Herhalde."
"Something you won't like." = "Hoşuna gitmeyecek bir şey."
"That would spoil the surprise." = "Sürprizi bozar."
"Production queue: classified." = "Üretim sırası: gizli."
"Weapons. Many weapons." = "Silahlar. Bir sürü silah."
"A big surprise!" = "Büyük bir sürpriz!"
"Something with way too many guns." = "Gereğinden fazla silahlı bir şey."
"{units} units and counting, Commander." = "{units} birim ve artıyor, Komutan."
"Enough. {units}, if you must know." = "Yeterince. İlla bilmek istiyorsan, {units}."
"Current unit count: {units}. Increasing." = "Mevcut birim sayısı: {units}. Artıyor."
"{units}. Yours is lower." = "{units}. Seninki daha az."
"{units}! Want to meet them all?" = "{units}! Hepsiyle tanışmak ister misin?"
"Like {units}? I lost count." = "{units} falan mı? Saymayı bıraktım."
"No truce, Commander. Not today." = "Ateşkes yok, Komutan. Bugün değil."
"There will be no deals." = "Pazarlık olmayacak."
"Truce: incompatible with directives." = "Ateşkes: direktiflerle uyumsuz."
"Negotiation protocols disabled." = "Müzakere protokolleri devre dışı."
"Truce? Ha! Nice try." = "Ateşkes mi? Ha! İyi denemeydi."
"Peace is boring." = "Barış sıkıcı."
"Thank you, Commander. You're not bad yourself." = "Teşekkürler, Komutan. Sen de fena değilsin."
"Appreciated. It won't save you." = "Makbule geçti. Ama seni kurtarmayacak."
"Flattery: ineffective." = "Dalkavukluk: etkisiz."
"Compliment received. Threat level unchanged." = "İltifat alındı. Tehdit seviyesi değişmedi."
"Aw, thanks! Still gonna crush you." = "Ay, sağ ol! Yine de seni ezeceğim."
"I know, right?" = "Değil mi ama?"
"Help? From me? Build more extractors, Commander." = "Yardım mı? Benden mi? Daha çok çıkarıcı kur, Komutan."
"My advice: more defences." = "Tavsiyem: daha çok savunma."
"Assistance denied." = "Yardım reddedildi."
"Recommendation: surrender." = "Öneri: teslim ol."
"Help? Sure: stop playing so badly!" = "Yardım mı? Tabii: bu kadar kötü oynamayı bırak!"
"Tip: build more stuff. You're welcome." = "İpucu: daha çok şey inşa et. Rica ederim."
"Your {unit} is out of the fight." = "{unit} birimin savaş dışı kaldı."
"Scratch one {unit}." = "Bir {unit} eksildi."
"That {unit} won't trouble us again." = "O {unit} bir daha başımızı ağrıtmayacak."
"{unit} terminated." = "{unit} sonlandırıldı."
"Your {unit} has been recycled." = "{unit} birimin geri dönüştürüldü."
"{unit} removed from the battlefield." = "{unit} savaş alanından kaldırıldı."
"Bye bye, {unit}!" = "Güle güle, {unit}!"
"Was that {unit} insured?" = "O {unit} sigortalı mıydı?"
"Your {unit} just went kaboom." = "{unit} birimin az önce kabum oldu."
"You'll pay for that {unit}." = "O {unit} sana pahalıya patlayacak."
"A good {unit}, lost. Noted." = "İyi bir {unit} kaybettik. Not edildi."
"{unit} lost. Replacement scheduled." = "{unit} kaybedildi. Yerine yenisi planlandı."
"Destruction of {unit} logged." = "{unit} imhası kaydedildi."
"Hey! That {unit} was brand new!" = "Hey! O {unit} yepyeniydi!"
"My {unit}! I just polished that!" = "Güzelim {unit}! Daha yeni cilalamıştım!"
"My {unit}... You'll answer for that, Commander." = "{unit} birimim... Bunun hesabını vereceksin, Komutan."
"Losing the {unit} stings. It won't happen twice." = "{unit} kaybı can yaktı. İkincisi olmayacak."
"{unit} destroyed. Unacceptable." = "{unit} yok edildi. Kabul edilemez."
"Loss of {unit} exceeds tolerance. Escalating." = "{unit} kaybı tolerans dışı. Karşılık şiddetlendiriliyor."
"My {unit}! Do you know how long that took?!" = "{unit} bebeğim! Kaç saatimi aldı, biliyor musun?!"
"NOOO, my {unit}!" = "HAYIIIR! {unit}, beni bırakma!"
"So much for your {unit}, Commander." = "{unit} birimin de buraya kadarmış, Komutan."
"Your {unit} has fallen. A fine machine, though." = "{unit} birimin düştü. Yine de iyi bir makineydi."
"Your {unit} has been dismantled." = "{unit} birimin söküldü."
"Large hostile unit eliminated: {unit}." = "Büyük düşman birimi imha edildi: {unit}."
"Your {unit} went down like a sack of bolts!" = "{unit} birimin bir çuval cıvata gibi yere yığıldı!"
"Big {unit}, bigger crater!" = "Koca {unit}, kocaman krater!"
"Return my {unit} at once, Commander." = "{unit} birimimi derhal iade et, Komutan."
"Stealing is beneath you, Commander." = "Hırsızlık sana yakışmaz, Komutan."
"Unauthorised transfer of {unit} detected." = "Yetkisiz {unit} transferi tespit edildi."
"Your theft has been logged." = "Hırsızlığın kaydedildi."
"Hey! Give back my {unit}!" = "Hey! O {unit} benim, geri ver!"
"Thief! That {unit} was mine!" = "Hırsız! O {unit} benimdi!"
"You haven't won yet, Commander." = "Henüz kazanmadın, Komutan."
"The Arm fights to the last." = "Arm son nefesine kadar savaşır."
"Production offline. Combat protocols remain." = "Üretim devre dışı. Savaş protokolleri etkin."
"Probability of defeat rising. Ignoring." = "Yenilgi olasılığı artıyor. Yok sayılıyor."
"I've still got a few tricks left!" = "Elimde hâlâ birkaç numara var!"
"Not done yet! Not even close! ...Mostly close." = "Daha bitmedi! Bitmesine çok var! ...Eh, az kaldı aslında."
"We meet again, Commander. Last time was yours. Not this time." = "Yine karşılaştık, Komutan. Geçen sefer senindi. Bu sefer değil."
"Commander. I've studied our last battle. Have you?" = "Komutan. Son savaşımızı inceledim. Ya sen?"
"Previous defeat analysed. Countermeasures installed." = "Önceki yenilgi analiz edildi. Karşı önlemler yüklendi."
"Again, Commander. This time the outcome has been calculated." = "Yine sen, Komutan. Bu kez sonuç önceden hesaplandı."
"You again! I've been practising!" = "Yine sen! Ama bu sefer antrenman yaptım!"
"Rematch time! I'm not going easy this time." = "Rövanş zamanı! Bu sefer acımak yok."
"Back for another lesson, Commander?" = "Bir ders daha almaya mı geldin, Komutan?"
"Commander. I trust you've learned something since last time." = "Komutan. Umarım geçen seferden bu yana bir şeyler öğrenmişsindir."
"You have returned. Your previous patterning was incomplete." = "Geri döndün. Önceki örüntülemen tamamlanmamıştı."
"Familiar opponent detected. Outcome: repeating." = "Tanıdık rakip tespit edildi. Sonuç: tekrarlanıyor."
"You again? Didn't I beat you last time?" = "Yine mi sen? Seni geçen sefer yenmemiş miydim?"
"Oh, it's you! Ready for round two?" = "Aa, sen misin! İkinci raunda hazır mısın?"


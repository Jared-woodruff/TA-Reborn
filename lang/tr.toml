# TA Reborn interface text. Copy template.toml to <code>.toml (e.g. de.toml), set the
# language's name and fill in the translations; empty ones keep the English. {name}
# placeholders stay as they are. `ta-tools i18n lang` adds new strings to every language.

[language]
name = "Türkçe"

[strings]

# apps/ta_game/src/accessibility.rs
"Metal {metal} of {metal_capacity}. Energy {energy} of {energy_capacity}." = "Metal: {metal} / {metal_capacity}. Enerji: {energy} / {energy_capacity}."
"No units selected" = "Seçili birim yok"
"Selected {unit}. Health {health} of {maximum}." = "Seçili: {unit}. Sağlık: {health} / {maximum}."
"{count} units selected" = "Seçili birim: {count}"

# apps/ta_game/src/app/memory_guard.rs
"Memory is running out: TA Reborn holds {gb} GB. The battle was saved and paused: start TA Reborn again and load the autosave." = "Bellek tükeniyor: TA Reborn {gb} GB kullanıyor. Savaş kaydedildi ve duraklatıldı: TA Reborn'u yeniden başlat ve otomatik kaydı yükle."
"Memory is running out: TA Reborn holds {gb} GB. Save what you can, then start TA Reborn again." = "Bellek tükeniyor: TA Reborn {gb} GB kullanıyor. Kaydedebildiğini kaydet, ardından TA Reborn'u yeniden başlat."
"TA Reborn is using {gb} GB of memory, far more than it should. The battle was saved (the autosave)." = "TA Reborn {gb} GB bellek kullanıyor, olması gerekenden çok daha fazla. Savaş kaydedildi (otomatik kayıt)."
"TA Reborn is using {gb} GB of memory, far more than it should." = "TA Reborn {gb} GB bellek kullanıyor, olması gerekenden çok daha fazla."


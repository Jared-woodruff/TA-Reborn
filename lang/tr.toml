"Short guided games on Painted Desert against an enemy that stays out of your way. Follow the panel at the top left; each step ticks off as you do it." = "Painted Desert haritasında, yoluna çıkmayan bir düşmana karşı kısa rehberli oyunlar. Sol üstteki paneli takip et; her adım, sen yaptıkça işaretlenir."

"There is nothing to download for this mod." = "Bu mod için indirilecek bir şey yok."
"archive has an invalid file name" = "arşivin dosya adı geçersiz"
"archive is not a file" = "arşiv bir dosya değil"
"{file} does not match the verified release. Download it again from the mod's website." = "{file} doğrulanmış sürümle eşleşmiyor. Modun web sitesinden yeniden indir."
"archive has no file name" = "arşivin dosya adı yok"
"Open the mod's website, then choose Have the file? to install your downloaded archive." = "Modun web sitesini aç, ardından indirdiğin arşivi kurmak için “Dosya sende mi?” seçeneğini kullan."
"invalid download address" = "geçersiz indirme adresi"
"ModDB's download page has changed. Get the file from the mod's page, then install it from the file." = "ModDB'nin indirme sayfası değişmiş. Dosyayı modun sayfasından al, sonra dosyadan kur."
"The download could not be completed: {error}. Open the mod's website or download link in your browser, then choose Have the file? to install it." = "İndirme tamamlanamadı: {error}. Modun web sitesini veya indirme bağlantısını tarayıcında aç, ardından kurmak için “Dosya sende mi?” seçeneğini kullan."
"Mod {id} has a conflicting installation; remove it in the mod library before importing this archive" = "{id} modunun çakışan bir kurulumu var; bu arşivi içe aktarmadan önce onu mod kitaplığından kaldır"
"the archive changed while it was being copied; try importing it again" = "arşiv kopyalanırken değişti; yeniden içe aktarmayı dene"
"the server's response is too large or could not be read" = "sunucunun yanıtı çok büyük veya okunamadı"


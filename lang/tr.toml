# apps/ta_game/scenarios/armageddon.toml
"Armageddon" = "Armagedon"
"Two armies, one plain, no retreat. Win the battle of the war." = "İki ordu, tek bir ova, geri çekilme yok. Savaşın kaderini belirleyecek muharebeyi kazan."
"Commander, the Core's main army is marching north across the Mounds, and ours stands in its way. There are no bases here, no factories, no reinforcements: what you have is all you will ever have.\n\nThey outnumber us. We outgun them. Put the Lugers and the Merls on their columns as they close, hold the line with the Zeus, and keep the Jethros with the tanks: they will bring gunships. Their reserves arrive two and a half minutes in.\n\nDestroy every one of them." = "Komutan, Core'un ana ordusu Mounds boyunca kuzeye yürüyor ve bizim ordumuz yolunu kesiyor. Burada üs yok, fabrika yok, takviye yok: elindekinden fazlası hiç olmayacak.\n\nSayıca bizden fazlalar. Ateş gücünde biz üstünüz. Yaklaşan kollarını Luger ve Merl'lerle döv, hattı Zeus'larla tut ve Jethro'ları tankların yanından ayırma: taarruz uçakları getirecekler. Yedekleri iki buçuk dakika sonra varıyor.\n\nHepsini yok et."
"Arm Command" = "Arm Komutanlığı"
"Here they come. Hold the line, and keep the Jethros with the tanks." = "Geliyorlar. Hattı tutun ve Jethro'ları tankların yanında tutun."
"Their reserves are coming up behind the mounds, a Goliath at their head." = "Yedekleri tümseklerin arkasından geliyor, başlarında bir Goliath var."

# apps/ta_game/scenarios/armistice.toml
"The Armistice" = "Ateşkes Antlaşması"
"Five minutes of peace to build an army. Then the war resumes." = "Ordu kurmak için beş dakikalık barış. Sonra savaş yeniden başlıyor."
"Commander, the peace talks on Reactor Grid have failed. The armistice holds for five more minutes: until then no weapon may fire, and neither side may build near the other's base. When it ends, the war resumes.\n\nBoth sides are rearming at a furious pace: resources and construction run at twice their usual speed, and the treaty's one lasting clause bans missile silos. Their Commander knows the clock as well as you do.\n\nBuild as you have never built. When the armistice ends, destroy the Core Commander." = "Komutan, Reactor Grid'deki barış görüşmeleri çöktü. Ateşkes beş dakika daha sürecek: o zamana kadar hiçbir silah ateş edemez ve hiçbir taraf diğerinin üssü yakınına inşa edemez. Bittiğinde savaş yeniden başlayacak.\n\nİki taraf da çılgın bir hızla yeniden silahlanıyor: kaynaklar ve inşaat her zamankinin iki katı hızda ilerliyor ve antlaşmanın kalıcı tek maddesi füze silolarını yasaklıyor. Komutanları saati senin kadar iyi biliyor.\n\nDaha önce hiç inşa etmediğin kadar inşa et. Ateşkes bittiğinde Core Komutanını yok et."
"The talks have failed. For five minutes no weapon fires and nobody builds near the other's base. Then it is war: build as you have never built." = "Görüşmeler çöktü. Beş dakika boyunca hiçbir silah ateş etmez ve kimse diğerinin üssü yakınına inşa edemez. Sonra savaş: daha önce hiç inşa etmediğin kadar inşa et."
"Their factories are running day and night. Ours should be too." = "Fabrikaları gece gündüz çalışıyor. Bizimkiler de çalışmalı."
"Core Overseer" = "Core Gözetmeni"
"Ten seconds, Arm. We have counted every one of your factories." = "On saniye, Arm. Fabrikalarının her birini saydık."
"Their Commander is somewhere in that grid. Find it, and end this war for good." = "Komutanları o ızgaranın bir yerinde. Onu bul ve bu savaşı sonsuza dek bitir."

# apps/ta_game/scenarios/brothers_in_arms.toml
"Brothers in Arms" = "Silah Arkadaşları"
"You and an allied Commander against two of the Core's." = "Sen ve müttefik bir Komutan, Core'un iki Komutanına karşı."
"Commander, you are not alone on Highland Rift. Commander Holt's forces hold the river crossings in the north, beside yours in the north-western highlands. Two Core Commanders are dug in to the south, across the canyon.\n\nHolt's computer will fight its own war, but it is the same war: back it up when it is hard pressed, and it will do the same for you. Your forces see what its forces see.\n\nDestroy both Core Commanders. Keep yours alive." = "Komutan, Highland Rift'te yalnız değilsin. Komutan Holt'un kuvvetleri kuzeydeki nehir geçitlerini, kuzeybatı yaylalarındaki seninkilerin yanında tutuyor. İki Core Komutanı güneyde, kanyonun ötesinde mevzilenmiş.\n\nHolt'un bilgisayarı kendi savaşını yürütecek, ama aynı savaş: sıkıştığında onu destekle, o da senin için aynısını yapacak. Kuvvetlerin onun kuvvetlerinin gördüğünü görür.\n\nİki Core Komutanını da yok et. Kendi Komutanını hayatta tut."
"Commander Holt" = "Komutan Holt"
"Good to have you on the line. I'll hold the river crossings in the north; you take the western highlands." = "Hatta olman iyi oldu. Kuzeydeki nehir geçitlerini ben tutuyorum; sen batı yaylalarını al."
"My scouts have found both of their bases. The south-western one is yours; I'll keep the other busy." = "Keşifçilerim iki üssünü de buldu. Güneybatıdaki senin; ötekini ben oyalarım."
"They're massing at the canyon. If they come for one of us, the other hits them from the side." = "Kanyonda toplanıyorlar. Birimize saldırırlarsa, diğerimiz onları yandan vurur."
"Still with me? Then let's finish it. Everything we have, at their Commanders." = "Hâlâ benimle misin? O zaman bitirelim. Elimizdeki her şey, Komutanlarının üzerine."

# apps/ta_game/scenarios/decapitation.toml
"Kill the Core Commander on his island fortress. From the air." = "Core Komutanını ada kalesinde öldür. Havadan."
"Commander, a Core Commander has made his fortress on the island at the centre of this lava sea. Nothing on treads or legs will reach him, and his anti-air is the best the Core can build.\n\nYou have a small air wing and a forward airfield in the south-west corner: build it up. Strip away his air defences, then send the bombers in; a handful sent straight at him will not get through. Brawler gunships hit hard but die fast over flak, and the Freedom Fighters can keep his fighters off your bombers.\n\nHis reinforcements arrive in fifteen minutes. Before then, he must be dead." = "Komutan, bir Core Komutanı bu lav denizinin ortasındaki adayı kendine kale yaptı. Palet ya da bacak üstünde giden hiçbir şey ona ulaşamaz ve uçaksavarı Core'un yapabileceğinin en iyisi.\n\nKüçük bir hava filon ve güneybatı köşesinde bir ileri hava üssün var: onu büyüt. Önce hava savunmasını sök, sonra bombardıman uçaklarını gönder; doğrudan üzerine yollanan bir avuç uçak geçemez. Brawler taarruz uçakları sert vurur ama uçaksavar ateşinde çabuk düşer; Freedom Fighter'lar da onun avcılarını bombardıman uçaklarından uzak tutabilir.\n\nTakviyeleri on beş dakika içinde gelecek. O zamana dek ölmüş olmalı."

# apps/ta_game/scenarios/doomsday_clock.toml
"Doomsday Clock" = "Kıyamet Saati"
"The Core's missile launches in fifteen minutes. Stop it." = "Core'un füzesi on beş dakika içinde fırlatılacak. Durdur onu."
"Commander, a Silencer nuclear silo stands at the heart of the Core base across these metal plains, and it is arming. In fifteen minutes the missile flies, and your base is the target.\n\nDestroy the silo. Nothing else matters: not their Commander, not their factories. The silo sits behind heavy laser towers and a Punisher battery, and their Commander will not sit still while you come for it.\n\nYou have a base, two factories and two construction kbots. The clock is running." = "Komutan, bu metal ovaların ötesindeki Core üssünün kalbinde bir Silencer nükleer silosu duruyor ve silahlanıyor. On beş dakika sonra füze havalanacak ve hedef senin üssün.\n\nSiloyu yok et. Başka hiçbir şeyin önemi yok: ne Komutanlarının ne de fabrikalarının. Silo ağır lazer kulelerinin ve bir Punisher bataryasının ardında duruyor; sen ona doğru gelirken Komutanları da boş durmayacak.\n\nBir üssün, iki fabrikan ve iki inşaat kbotun var. Saat işliyor."
"Ten minutes to launch, Commander." = "Fırlatmaya on dakika, Komutan."
"Five minutes to launch. That silo has to go." = "Fırlatmaya beş dakika. O silo yok edilmeli."
"One minute! Get to that silo!" = "Bir dakika! O siloya git!"

# apps/ta_game/scenarios/endless_siege.toml
"Endless Siege" = "Sonsuz Kuşatma"
"The waves never stop. Survive as long as you can." = "Dalgalar hiç durmaz. Dayanabildiğin kadar hayatta kal."
"Commander, there is no rescue coming, no reinforcements, no victory. The Core has found your outpost in the mesas and will throw everything it has at it, from three directions, for as long as it takes.\n\nKbots, then tanks, then artillery and bombers; heavier every time, and now and then something enormous. Build an economy, build defences, and hold on.\n\nYour best time is kept. Beat it." = "Komutan, kurtarma gelmeyecek; takviye yok, zafer yok. Core, platolardaki karakolunu buldu ve elindeki her şeyi üç yönden, ne kadar sürerse sürsün üzerine salacak.\n\nÖnce kbotlar, sonra tanklar, sonra topçu ve bombardıman uçakları; her seferinde daha ağır, arada bir de devasa bir şey. Ekonomini kur, savunmanı kur ve dayan.\n\nEn iyi süren saklanır. Onu geç."

# apps/ta_game/scenarios/extraction.toml
"Extraction" = "Tahliye"
"Get your Commander down the lava river to the pick-up point." = "Komutanını lav nehri boyunca alma noktasına ulaştır."
"Commander, your drop went wrong. You are on the south bank of a river of lava at the western end of the Run, with what is left of your escort, and the dropships can only land at the far eastern end.\n\nThe Core has guns all along the north bank, and patrols on your side of the river. Keep away from the lava's edge (their laser towers reach no further), deal with the patrols, and get your Commander to the pick-up point. Whatever guards it will not come to you. Core troops are already following your tracks; do not stop for long.\n\nAnything else is expendable. Your Commander is not." = "Komutan, indirme ters gitti. Lava Run'ın batı ucunda, bir lav nehrinin güney kıyısındasın, yanında da eskortundan geriye kalanlar; indirme gemileri ise ancak en doğu uca inebiliyor.\n\nCore'un kuzey kıyısı boyunca topları, nehrin senin tarafında da devriyeleri var. Lavın kenarından uzak dur (lazer kuleleri ancak oraya kadar erişir), devriyelerin hakkından gel ve Komutanını alma noktasına ulaştır. Orayı koruyan ne varsa sana gelmeyecek. Core birlikleri şimdiden izini sürüyor; uzun süre durma.\n\nGeri kalan her şey gözden çıkarılabilir. Komutanın çıkarılamaz."


"Install 7-Zip to import this map package." = "Bu harita paketini içe aktarmak için 7-Zip'i kur."
"No directly installable maps were found. Extract nested ZIP files first, then import each map archive." = "Doğrudan kurulabilecek harita bulunamadı. Önce iç içe ZIP dosyalarını çıkar, sonra her harita arşivini içe aktar."

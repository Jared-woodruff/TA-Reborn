# apps/ta_game/src/tips.rs
"Ctrl+right-drag draws a formation line: the selection spreads along it." = "Ctrl+sağ sürükleme bir düzen çizgisi çizer: seçim bu çizgi boyunca yayılır."
"Ctrl+drag draws a formation line: the selection spreads along it." = "Ctrl+sürükleme bir düzen çizgisi çizer: seçim bu çizgi boyunca yayılır."
"Used to TA's original controls? Options, Controls: give orders with the left button." = "TA'nın orijinal kontrollerine mi alışkınsın? Ayarlar, Kontroller: emirleri sol tuşla ver."
"A right-click clears the selection or cancels the order you were about to give." = "Sağ tık seçimi temizler ya da vermek üzere olduğun emri iptal eder."
"Right-click one of your units for a ring of its orders; hold the button and flick towards a choice. A controller's B does the same." = "Kendi birimlerinden birine sağ tıklamak emirlerinin halkasını açar; düğmeyi basılı tutup bir seçeneğe doğru sürükleyin. Kumandanın B düğmesi de aynısını yapar."
"Hold the right button on one of your units, or middle-click it, for a ring of its orders; flick towards a choice and let go." = "Emirlerinin halkası için kendi birimlerinden birinde sağ düğmeyi basılı tutun ya da ona orta tıklayın; bir seçeneğe doğru sürükleyip bırakın."
"Metal extractors must sit on metal: {overlay_metal} shows the metal map, and {area_mex} puts an extractor on every metal spot you circle." = "Metal çıkarıcılar metalin üzerine kurulmalı: {overlay_metal} metal haritasını gösterir, {area_mex} ise çember içine aldığın her metal noktasına bir çıkarıcı koyar."
"Your Commander's D-gun ({dgun}) destroys almost anything it touches, including your own units in its path." = "Komutanının D-gun'ı ({dgun}) dokunduğu neredeyse her şeyi yok eder, yolundaki kendi birimlerin de dahil."
"{perspective} climbs into the selected unit, or an ally's under the pointer, to see the battle through its eyes as it goes on with its orders. Escape climbs back out." = "{perspective} seni seçili birimin ya da imlecin altındaki müttefik biriminin içine sokar: o emirlerini sürdürürken savaşı onun gözünden gör. Escape ile dışarı çıkarsın."
"Keep your metal and energy incomes above what you spend: building slows down for everything when a store runs dry." = "Metal ve enerji gelirini harcamanın üstünde tut: bir depo tükenince her şeyin inşası yavaşlar."
"Right-clicking a factory's queued unit removes it; clicking it builds it next." = "Fabrika sırasındaki bir birime sağ tıklamak onu kaldırır; tıklamak onu öne alır."
"Fight ({fight}) is attack-move: units stop to fight whatever they meet on the way." = "Savaş ({fight}) saldırarak ilerlemektir: birimler yolda karşılaştıkları her şeyle savaşmak için durur."
"Ctrl+click is force fire: the selection attacks whatever is there, your own units too, or the ground." = "Ctrl+tık zorla ateştir: seçim oradaki her şeye, kendi birimlerine bile, ya da zemine saldırır."
"{select_builders} selects your constructors, {select_factories} your factories, {select_armed} your armed units, {select_on_screen} everything on the screen." = "{select_builders} inşaatçılarını, {select_factories} fabrikalarını, {select_armed} silahlı birimlerini, {select_on_screen} ekrandaki her şeyi seçer."
"Patrol ({patrol}) with constructors makes them repair, assist and reclaim along the route by themselves." = "İnşaatçılarla devriye ({patrol}), onların rota boyunca kendiliğinden onarmasını, yardım etmesini ve geri kazanmasını sağlar."
"Put a constructor on duty ({duty}) and it works by itself: the economy, repairs, reclaiming or defence. Any order you give takes it back." = "Bir inşaatçıyı göreve ver ({duty}), kendi başına çalışsın: ekonomi, onarım, geri kazanım veya savunma. Verdiğin her emir onu geri alır."
"Drag with Reclaim ({reclaim}) to turn every wreck, rock and tree in a circle into metal and energy." = "Bir çemberdeki her enkazı, kayayı ve ağacı metal ve enerjiye dönüştürmek için Geri kazan ({reclaim}) ile sürükle."
"Ctrl+1 to Ctrl+9 make control groups; tap the number twice to look at the group." = "Ctrl+1 ile Ctrl+9 arası kontrol grubu oluşturur; gruba bakmak için numaraya iki kez bas."
"Hold {players} to see every player's side, team, units and income (your allies' in full)." = "Her oyuncunun tarafını, takımını, birimlerini ve gelirini görmek için {players}'ı basılı tut (müttefiklerininkini eksiksiz)."
"Radar towers show enemy units long before they come into sight: build one early." = "Radar kuleleri düşman birimlerini görüş alanına girmeden çok önce gösterir: erkenden bir tane kur."
"Wind generators pay off on windy maps: the skirmish page shows each map's wind range." = "Rüzgâr jeneratörleri rüzgârlı haritalarda kendini çıkarır: çatışma sayfası her haritanın rüzgâr aralığını gösterir."
"Metal makers turn spare energy into metal, and stop when your energy runs dry." = "Metal üreticiler artan enerjiyi metale dönüştürür ve enerjin tükenince durur."
"Solar collectors fold shut for a few seconds when hit: tougher, but making no energy." = "Güneş toplayıcıları vurulunca birkaç saniyeliğine kapanır: daha dayanıklı olurlar ama enerji üretmezler."
"Units gain veterancy with every kill: veterans aim better and shrug off damage." = "Birimler her imhayla kıdem kazanır: kıdemliler daha iyi nişan alır ve hasarı daha kolay atlatır."
"Shift adds to the orders a unit already has instead of replacing them." = "Shift, birimin mevcut emirlerinin yerine geçmek yerine onlara ekler."
"Alt+drag while placing a building fills a rectangle with it: handy for solar farms and walls." = "Bina yerleştirirken Alt+sürükleme bir dikdörtgeni onunla doldurur: güneş tarlaları ve duvarlar için kullanışlıdır."
"Double-click a unit to select every unit of its type on screen; {select_type} selects them map-wide." = "Ekrandaki aynı türden tüm birimleri seçmek için bir birime çift tıkla; {select_type} onları tüm haritada seçer."
"{idle_builder} selects the next idle constructor, {idle_factory} the next idle factory." = "{idle_builder} tuşu sonraki boştaki inşaatçıyı, {idle_factory} sonraki boştaki fabrikayı seçer."
"Wrecks can be resurrected by resurrection kbots, or reclaimed for most of their metal." = "Enkazlar diriltme kbotlarıyla diriltilebilir ya da metallerinin çoğu için geri kazanılabilir."
"Hovering a unit shows its health, firepower and range; {overlay_path} shows where the selection can go." = "İmleci bir birimin üzerine getirmek canını, ateş gücünü ve menzilini gösterir; {overlay_path} seçimin gidebileceği yerleri gösterir."
"{last_alert} (or Backspace) looks at the last place your units were attacked; press it again for the one before." = "{last_alert} (ya da Backspace) birimlerinin en son saldırıya uğradığı yere bakar; tekrar basarsan bir öncekine bakar."
"A notice or a piece of advice with LOOK on it takes you to the place, or the unit, when you click it." = "Üzerinde BAK yazan bir bildirim ya da tavsiyeye tıklarsan seni o yere ya da birime götürür."
"{help} tells everything about the selected unit, or the one under the pointer: cost, speed, weapons, abilities." = "{help} seçili birim ya da imlecin altındaki birim hakkında her şeyi anlatır: maliyet, hız, silahlar, yetenekler."
"{next_unit} looks at the next of your units off the screen; with units selected, the next of them." = "{next_unit} ekran dışındaki bir sonraki birimine bakar; birim seçiliyse seçilenlerden bir sonrakine."
"Ctrl+F6 to Ctrl+F9 store camera positions; F6 to F9 bring them back." = "Ctrl+F6 ile Ctrl+F9 arası kamera konumlarını kaydeder; F6 ile F9 arası onları geri getirir."
"Anti-air matters: bombers can wreck an undefended economy in one pass." = "Uçaksavar önemlidir: bombardıman uçakları savunmasız bir ekonomiyi tek geçişte yerle bir edebilir."
"An advanced factory needs a lot of metal: build it once your extractors and power can feed it." = "Gelişmiş bir fabrika çok metal ister: çıkarıcıların ve enerjin onu besleyebildiğinde kur."
"Guarding a factory with a constructor adds its build power to the factory's production." = "Bir fabrikayı inşaatçıyla korumak, inşaatçının inşa gücünü fabrikanın üretimine ekler."
"Moho mines extract far more metal than basic extractors: advanced constructors build them." = "Moho madenleri temel çıkarıcılardan çok daha fazla metal çıkarır: onları gelişmiş inşaatçılar kurar."
"Every game is kept as a replay: watch it from the main menu, and jump through it with the bar." = "Her oyun tekrar olarak saklanır: ana menüden izle ve çubukla içinde ileri geri atla."
"{overlay_sight} shows your sight, radar and sonar coverage; {overlay_height} shows the heights of the map." = "{overlay_sight} görüş, radar ve sonar kapsamını gösterir; {overlay_height} haritanın yüksekliklerini gösterir."
"The Commander can capture enemy units ({capture}): it takes a while, but the unit is yours." = "Komutan düşman birimlerini ele geçirebilir ({capture}): biraz zaman alır ama birim senin olur."
"{photo_mode} opens photo mode: the battle holds still, and you can light, frame and focus a shot at up to 4K." = "{photo_mode} fotoğraf modunu açar: savaş donar; 4K'ya kadar bir kareyi ışıklandırabilir, çerçeveleyebilir ve odaklayabilirsin."
"TIP" = "İPUCU"
"Dismiss" = "Kapat"
"Don't show tips again" = "İpuçlarını bir daha gösterme"

# apps/ta_game/src/tutorial.rs
"THE BASICS" = "TEMELLER"
"Your Commander, the camera, metal, energy and a first factory." = "Komutanın, kamera, metal, enerji ve ilk fabrika."
"Selecting units" = "Birim seçimi"
"The camera" = "Kamera"
"Metal and energy" = "Metal ve enerji"
"Factories" = "Fabrikalar"
"Welcome, Commander. The walking machine in the middle of the screen is your Commander: it builds, it fights, and losing it usually loses the battle. Click it to select it." = "Hoş geldin, Komutan. Ekranın ortasındaki yürüyen makine senin Komutanın: inşa eder, savaşır ve onu kaybetmek genellikle savaşı kaybetmek demektir. Seçmek için ona tıkla."
"Lost sight of it? {select_commander} selects the Commander from anywhere, and SHOW ME brings the camera to it." = "Komutanı gözden mi kaybettin? {select_commander} onu her yerden seçer, YERİNİ GÖSTER düğmesi de kamerayı ona götürür."
"Look around. The arrow keys, the screen edges or dragging with the middle button scroll; the mouse wheel zooms towards the cursor, and dragging with the right button turns the view." = "Etrafına bak. Ok tuşları, ekran kenarları ya da orta tuşla sürüklemek görüşü kaydırır; fare tekerleği imlece doğru yakınlaştırır, sağ tuşla sürüklemek görüşü döndürür."
"Push the pointer against an edge of the screen to scroll, or turn the mouse wheel to zoom." = "Görüşü kaydırmak için imleci ekranın bir kenarına daya ya da yakınlaştırmak için fare tekerleğini çevir."
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the ECONOMY tab of the build menu at the bottom right and place it on the marked deposit." = "Her şey metal ve enerjiden yapılır. Metal, metal yataklarındaki çıkarıcılardan gelir. Komutanı seç, sağ alttaki inşa menüsünün EKONOMİ sekmesinden Metal Extractor'ı seç ve işaretli yatağa yerleştir."
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the build menu on the left and place it on the marked deposit." = "Her şey metal ve enerjiden yapılır. Metal, metal yataklarındaki çıkarıcılardan gelir. Komutanı seç, soldaki inşa menüsünden Metal Extractor'ı seç ve işaretli yatağa yerleştir."
"The outline turns green where the extractor can stand. Bring it onto the marked ring and click to place it." = "Silüet, çıkarıcının kurulabileceği yerde yeşile döner. Onu işaretli halkanın üzerine getir ve yerleştirmek için tıkla."
"Energy comes from solar collectors and wind generators. Build a Solar Collector next to your Commander. The bars at the top show your stores and how fast they fill or drain; they warn you when one runs dry." = "Enerji güneş toplayıcılarından ve rüzgâr jeneratörlerinden gelir. Komutanının yanına bir Solar Collector inşa et. Üstteki çubuklar depolarını ve ne kadar hızlı dolup boşaldıklarını gösterir; biri tükenince seni uyarırlar."
"The Solar Collector is a flat, square panel. Pick it, then click on open ground near the Commander." = "Solar Collector düz, kare bir paneldir. Onu seç, sonra Komutanın yakınında boş bir yere tıkla."
"Factories build your army. Build a Kbot Lab (on the FACTORY tab) on a flat spot near the Commander, and wait for it to finish." = "Fabrikalar ordunu üretir. Komutanın yakınında düz bir yere bir Kbot Lab (FABRİKA sekmesinde) inşa et ve bitmesini bekle."
"Factories build your army. Build a Kbot Lab from the build menu on a flat spot near the Commander, and wait for it to finish." = "Fabrikalar ordunu üretir. İnşa menüsünden bir Kbot Lab seçip Komutanın yakınında düz bir yere inşa et ve bitmesini bekle."
"Building takes metal and energy as it goes: while either bar at the top is empty, everything builds more slowly." = "İnşaat ilerledikçe metal ve enerji harcar: üstteki çubuklardan biri boş olduğu sürece her şey daha yavaş inşa edilir."
"Select the Kbot Lab and click the Peewee three times to queue three of them (right-click one to take it off the queue). New units wait in front of the lab." = "Kbot Lab'ı seç ve üç tanesini sıraya koymak için Peewee'ye üç kez tıkla (birini sıradan çıkarmak için sağ tıkla). Yeni birimler laboratuvarın önünde bekler."
"Click the lab itself on the map to select it: its build menu shows the units it makes." = "Seçmek için haritada laboratuvarın kendisine tıkla: inşa menüsü, ürettiği birimleri gösterir."
"That is the whole cycle: extract, generate, build, fight. Keep both incomes above what you spend and keep your builders busy. Lesson complete!" = "Bütün döngü bu: çıkar, üret, inşa et, savaş. İki geliri de harcamanın üstünde tut ve inşaatçılarını hep meşgul et. Ders tamamlandı!"
"Select and group an army, attack-move, and destroy an enemy outpost." = "Bir ordu seç ve grupla, saldırarak ilerle ve bir düşman karakolunu yok et."
"Box selection" = "Kutuyla seçim"
"Control groups" = "Kontrol grupları"
"Attack-move" = "Saldırarak ilerleme"
"Destroying a base" = "Üs imhası"
"Your Kbot Lab has built a squad of Peewees. Drag a box around them with the left mouse button to select them all." = "Kbot Lab bir Peewee mangası üretti. Hepsini seçmek için sol fare tuşuyla etraflarına bir kutu sürükle."
"Press the left button on open ground beside the squad, hold it, drag the box over them all and let go." = "Manganın yanındaki boş bir yerde sol tuşa bas ve basılı tut, kutuyu hepsini içine alacak şekilde sürükle ve bırak."
"Press Ctrl+1 to make them group 1. Pressing 1 selects them again from anywhere; pressing it twice brings the camera to them." = "Onları 1. grup yapmak için Ctrl+1'e bas. 1'e basmak onları her yerden yeniden seçer; iki kez basmak kamerayı onlara getirir."
"Hold Ctrl and press 1 while the squad is selected." = "Manga seçiliyken Ctrl tuşunu basılı tut ve 1'e bas."
"The enemy has an outpost at the marked place. Fight is attack-move: units walk there and take on whatever they meet on the way. Press {fight}, then click near the outpost." = "Düşmanın işaretli yerde bir karakolu var. Savaş, saldırarak ilerlemektir: birimler oraya yürür ve yolda karşılaştıkları her şeyle çarpışır. {fight}'ye bas, sonra karakolun yakınına tıkla."
"Select the squad first (press 1). Then press {fight}, or the Fight button among the orders, and click on the ground by the marked ring." = "Önce mangayı seç (1'e bas). Sonra {fight} tuşuna ya da emirler arasındaki Savaş düğmesine bas ve işaretli halkanın yanında zemine tıkla."
"Destroy every building of the outpost. Its laser tower hits hard: keep the squad together, and queue reinforcements at the lab if you need them." = "Karakolun tüm binalarını yok et. Lazer kulesi sert vurur: mangayı bir arada tut ve gerekirse laboratuvarda takviye sıraya koy."
"Losing the fight? Pull the squad back, queue more Peewees at the lab and go in again with all of them together." = "Çarpışmayı mı kaybediyorsun? Mangayı geri çek, laboratuvarda daha fazla Peewee sıraya koy ve hepsiyle birlikte yeniden saldır."
"The outpost is gone. The wrecks it left are worth metal: builders reclaim them (next lesson). Lesson complete!" = "Karakol yok oldu. Geride bıraktığı enkazlar metal eder: inşaatçılar onları geri kazanır (sonraki ders). Ders tamamlandı!"
"ORDERS LIKE A VETERAN" = "USTA İŞİ EMİRLER"
"Map views, area orders, building blocks and build queues." = "Harita görünümleri, alan emirleri, bina blokları ve inşa sıraları."
"Map overlays" = "Harita katmanları"
"Area orders" = "Alan emirleri"
"Building blocks" = "Bina blokları"
"Build queues" = "İnşa sıraları"
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again. The MAP menu at the top right does the same." = "Harita, zeminin gizlediklerini gösterir. Metal haritası için {overlay_metal}'e bas ({overlay_path} birimlerin gidebileceği yerleri, {overlay_height} yükseklikleri, {overlay_sight} görüş ve radarı gösterir); aynı tuş onu yeniden gizler. Sağ üstteki HARİTA menüsü de aynı işi yapar."
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again." = "Harita, zeminin gizlediklerini gösterir. Metal haritası için {overlay_metal} tuşuna bas ({overlay_path} birimlerin gidebileceği yerleri, {overlay_height} yükseklikleri, {overlay_sight} görüş ve radarı gösterir); aynı tuş onu yeniden gizler."
"Press {overlay_metal}: the metal deposits light up all over the map." = "{overlay_metal} tuşuna bas: metal yatakları haritanın her yerinde parlar."
"Select the Commander, press {area_mex} and drag a circle over the marked deposits: every metal spot inside gets an extractor, nearest first. A plain click takes the metal around the cursor." = "Komutanı seç, {area_mex}'e bas ve işaretli yatakların üzerinde bir çember sürükle: içindeki her metal noktasına, en yakından başlayarak bir çıkarıcı kurulur. Düz bir tıklama imlecin çevresindeki metali alır."
"With the Commander selected, press {area_mex}, then press on the ground over the deposits and drag outwards: the circle grows as you drag." = "Komutan seçiliyken {area_mex} tuşuna bas, sonra yatakların üzerinde zemine fare tuşuyla basıp dışa doğru sürükle: sürükledikçe çember büyür."
"Many orders work on areas. Press {reclaim} (reclaim) and drag a circle over the rocks near your base: the Commander turns every one into metal." = "Birçok emir alanlara uygulanabilir. {reclaim}'ye (geri kazan) bas ve üssünün yakınındaki kayaların üzerinde bir çember sürükle: Komutan her birini metale dönüştürür."
"Rocks and wrecks are worth metal. With the Commander selected, press {reclaim}, then press on the ground and drag the circle over a few rocks." = "Kayalar ve enkazlar metal eder. Komutan seçiliyken {reclaim} tuşuna bas, sonra zemine fare tuşuyla basıp çemberi birkaç kayanın üzerine sürükle."
"Hold Alt while you drag out a building to fill a whole block with it. Pick the Solar Collector, hold Alt and drag out a block of four or more." = "Bütün bir bloğu bir binayla doldurmak için onu sürüklerken Alt'ı basılı tut. Solar Collector'ı seç, Alt'ı basılı tut ve dört ya da daha fazlasından oluşan bir blok sürükle."
"Pick the Solar Collector, then hold Alt, press on the ground and drag: a block of outlines follows the pointer. Let go to place them all." = "Solar Collector'ı seç, sonra Alt'ı basılı tut, zemine fare tuşuyla basıp sürükle: imleci bir blok silüet izler. Hepsini yerleştirmek için bırak."
"The Commander's queued buildings show under BUILD QUEUE, beside its picture at the bottom of the screen. Click one to build it next (right-click drops it). A factory's queue works the same way." = "Komutanın sıradaki binaları ekranın altında, resminin yanındaki İNŞA SIRASI başlığının altında görünür. Öne almak için birine tıkla (sağ tık onu çıkarır). Fabrika sırası da aynı şekilde çalışır."
"The BUILD QUEUE shows while the Commander alone is selected and has buildings waiting. Click any but the first: that one is being built." = "İNŞA SIRASI, yalnızca Komutan seçiliyken ve bekleyen binaları varken görünür. İlki dışında herhangi birine tıkla: ilki şu anda inşa ediliyor."
"Area orders, building blocks and queues save you hundreds of clicks in a battle. Lesson complete!" = "Alan emirleri, bina blokları ve sıralar bir savaşta seni yüzlerce tıklamadan kurtarır. Ders tamamlandı!"
"HOLD THE LINE" = "HATTI TUT"
"Defences, radar, repairs, and the metal in wrecks." = "Savunmalar, radar, onarım ve enkazlardaki metal."
"Defences" = "Savunmalar"
"Radar" = "Radar"
"Repairs" = "Onarım"
"Reclaiming wrecks" = "Enkaz geri kazanımı"
"Raiders will come from the marked direction. Build a Light Laser Tower (on the DEFENCE tab) in the marked ring: towers shoot whatever comes in range." = "Baskıncılar işaretli yönden gelecek. İşaretli halkaya bir Light Laser Tower (SAVUNMA sekmesinde) inşa et: kuleler menzillerine giren her şeye ateş eder."
"Raiders will come from the marked direction. Build a Light Laser Tower from the build menu in the marked ring: towers shoot whatever comes in range." = "Baskıncılar işaretli yönden gelecek. İnşa menüsünden bir Light Laser Tower seçip işaretli halkaya inşa et: kuleler menzillerine giren her şeye ateş eder."
"The Light Laser Tower is a small gun on a post. Pick it, put it in the ring and wait for it to finish." = "Light Laser Tower, bir direğin üstündeki küçük bir silahtır. Onu seç, halkaya yerleştir ve bitmesini bekle."
"Build a Radar Tower (on the SENSORS tab) near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "Üssünün yakınına bir Radar Tower (SENSÖRLER sekmesinde) inşa et. Radar, düşmanları birimlerin onları görmeden çok önce haritada ve mini haritada işaret olarak gösterir."
"Build a Radar Tower from the build menu near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "İnşa menüsünden bir Radar Tower seçip üssünün yakınına inşa et. Radar, düşmanları birimlerin onları görmeden çok önce haritada ve mini haritada işaret olarak gösterir."
"The Radar Tower is a tall mast. Pick it, place it near the Commander and wait for it to finish." = "Radar Tower uzun bir anten direğidir. Onu seç, Komutanın yakınına yerleştir ve bitmesini bekle."
"Here they come: raiders on your radar. Keep the Commander by the tower and let them come to you: together they hold the line." = "İşte geliyorlar: radarında baskıncılar var. Komutanı kulenin yanında tut ve sana gelmelerini bekle: Komutan ve kule birlikte hattı tutar."
"Do not chase them: the tower only fights what comes in range. Keep the Commander beside it; while it fights, the Commander can mend it ({repair}, then click the tower)." = "Onları kovalama: kule yalnızca menziline gireni vurur. Komutanı kulenin yanında tut; kule çarpışırken Komutan onu onarabilir ({repair} tuşuna bas, sonra kuleye tıkla)."
"The fight left a building damaged. Select the Commander, press {repair} and click it: builders mend what is damaged." = "Çarpışma bir binayı hasarlı bıraktı. Komutanı seç, {repair} tuşuna bas ve binaya tıkla: inşaatçılar hasarlı olanı onarır."
"With the Commander selected, press {repair}, then click the damaged building. Its health bar fills as it is mended." = "Komutan seçiliyken {repair} tuşuna bas, sonra hasarlı binaya tıkla. Onarıldıkça can çubuğu dolar."
"The raiders left wrecks, and wrecks are worth metal. Select the Commander, press {reclaim} and click a wreck, or drag a circle over them all." = "Baskıncılar geride enkaz bıraktı ve enkazlar metal eder. Komutanı seç, {reclaim} tuşuna bas ve bir enkaza tıkla ya da hepsinin üzerinde bir çember sürükle."
"Wrecks lie where the raiders fell. With the Commander selected, press {reclaim} and click one: the metal bar rises as it is taken apart." = "Enkazlar baskıncıların düştüğü yerde. Komutan seçiliyken {reclaim} tuşuna bas ve birine tıkla: enkaz söküldükçe metal çubuğu yükselir."
"Towers hold ground while your army is elsewhere, radar sees what is coming, and builders mend and recycle. Lesson complete!" = "Ordun başka yerdeyken kuleler bölgeyi tutar, radar geleni görür, inşaatçılar da onarır ve geri kazanır. Ders tamamlandı!"
"BUILDERS AND FACTORIES" = "İNŞAATÇILAR VE FABRİKALAR"
"Builders that help, factories that keep building, patrols and standing orders." = "Yardım eden inşaatçılar, durmadan üreten fabrikalar, devriyeler ve kalıcı emirler."
"Construction units" = "İnşaatçı birimler"
"Helping a factory" = "Fabrikaya yardım"
"Rally points" = "Toplanma noktaları"
"Standing orders" = "Kalıcı emirler"
"One builder is slow. Select the Kbot Lab and build a Construction Kbot: it builds what the Commander builds, and more besides." = "Tek bir inşaatçı yavaştır. Kbot Lab'ı seç ve bir Construction Kbot üret: Komutanın inşa ettiği her şeyi, hatta daha fazlasını inşa eder."
"Click the lab on the map to select it; the Construction Kbot is in its build menu. Wait for it to walk out." = "Seçmek için haritada laboratuvara tıkla; Construction Kbot onun inşa menüsünde. Yürüyüp dışarı çıkmasını bekle."
"Builders help each other. Select the Construction Kbot, press {guard} and click the Kbot Lab: it lends the lab its build power, and the lab builds faster." = "İnşaatçılar birbirine yardım eder. Construction Kbot'u seç, {guard} tuşuna bas ve Kbot Lab'a tıkla: inşa gücünü laboratuvara katar ve laboratuvar daha hızlı üretir."
"With the Construction Kbot selected, press {guard}, then click the lab. It stays by the lab and helps with everything it makes." = "Construction Kbot seçiliyken {guard} tuşuna bas, sonra laboratuvara tıkla. Laboratuvarın yanında kalır ve ürettiği her şeye yardım eder."
"Factories send their units where you say. Select the Kbot Lab. {order_click} on open ground nearby: new units gather there." = "Fabrikalar birimlerini istediğin yere gönderir. Kbot Lab'ı seç. {order_click}: yakındaki boş bir zemini işaretle; yeni birimler orada toplanır."
"Select the lab first. With it selected, {order_click} on the ground where its units should gather." = "Önce laboratuvarı seç ve seçili bırak. {order_click}: birimlerinin toplanacağı zemini işaretle."
"Turn on Repeat for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "Laboratuvar için Yinele seçeneğini aç: bitirdiği her birim sırasının sonuna geri eklenir, böylece üretim hiç durmaz."
"Turn on REPEAT BUILD for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "Laboratuvar için ÜRETİMİ YİNELE düğmesini aç: bitirdiği her birim sırasının sonuna geri eklenir, böylece üretim hiç durmaz."
"Select the lab, then turn Repeat on: the pointer shows where it is." = "Laboratuvarı seç, sonra Yinele seçeneğini aç: ok işareti nerede olduğunu gösterir."
"Builders on patrol mend and reclaim whatever they pass. Select the Construction Kbot, press {patrol} and click on the far side of your base." = "Devriyedeki inşaatçılar geçtikleri yerdeki her şeyi onarır ve geri kazanır. Construction Kbot'u seç, {patrol} tuşuna bas ve üssünün öbür ucuna tıkla."
"With the Construction Kbot selected, press {patrol}, then click on the ground: it walks back and forth between there and where it stood." = "Construction Kbot seçiliyken {patrol} tuşuna bas, sonra zemine tıkla: orası ile durduğu yer arasında gidip gelir."
"Units keep standing orders. Select your Peewees and set their fire order to Hold fire with the button beside the orders: they will not shoot until you say." = "Birimler kalıcı emirlerini korur. Peewee'lerini seç ve emirlerin yanındaki düğmeyle ateş emrini \"Ateş etme\" olarak ayarla: sen söyleyene kadar ateş etmezler."
"Units keep standing orders. Select your Peewees and set their FIRE ORDERS to Hold fire: they will not shoot until you say." = "Birimler kalıcı emirlerini korur. Peewee'lerini seç ve ATEŞ EMİRLERİ düğmesiyle ateş emrini \"Ateş etme\" olarak ayarla: sen söyleyene kadar ateş etmezler."
"Select the Peewees, then click the fire order button until it shows HOLD FIRE: each click is the next order." = "Peewee'leri seç, sonra ateş emri düğmesine ATEŞ ETME görünene kadar tıkla: her tıklama sonraki emre geçer."
"You are ready for a skirmish: start against an Easy computer player, then Normal. {help} lists every key. Good hunting, Commander!" = "Artık çatışmaya hazırsın: önce Kolay, sonra Normal bir bilgisayar oyuncusuna karşı başla. {help} tüm tuşları listeler. İyi avlar, Komutan!"

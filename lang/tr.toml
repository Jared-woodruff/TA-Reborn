# apps/ta_game/src/lore.rs
"THE AGE OF CORE" = "CORE ÇAĞI"
"THE PATTERNING" = "ÖRÜNTÜLEME"
"THE GALACTIC WAR" = "GALAKTİK SAVAŞ"
"THE ARCHIVE" = "ARŞİV"
"BEFORE THE WAR" = "SAVAŞTAN ÖNCE"
"For ten thousand years the galaxy answered to one government. It called itself CORE, and its purpose was knowledge: it charted every star, mined every world it could reach and turned the wealth into science. Its cities wrapped whole planets, and its archives held everything anyone had ever learned.\n\nNobody remembers a war from that age. There was nothing left to fight over, and nobody who wanted to." = "On bin yıl boyunca galaksi tek bir yönetime bağlıydı. Bu yönetim kendine CORE diyordu ve amacı bilgiydi: her yıldızın haritasını çıkardı, ulaşabildiği her dünyada maden işletti ve elde ettiği zenginliği bilime dönüştürdü. Şehirleri koca gezegenleri baştan başa kaplıyor, arşivleri o güne dek öğrenilmiş her şeyi saklıyordu.\n\nO çağdan kalma tek bir savaşı bile hatırlayan yok. Uğruna savaşılacak bir şey kalmamıştı; savaşmak isteyen de yoktu."
"YEAR 0" = "YIL 0"
"VICTORY OVER DEATH" = "ÖLÜME KARŞI ZAFER"
"Then CORE's scientists solved the last problem left to them. Patterning read a living mind, every memory and every habit of thought, and wrote it whole into a machine that would never age, sicken or die.\n\nThe first patterned citizens woke in their new bodies to a galaxy in celebration. Death, the oldest enemy of all, had been beaten." = "Sonra CORE'un bilim insanları önlerinde kalan son sorunu da çözdü. Örüntüleme, yaşayan bir zihni her anısı ve her düşünce alışkanlığıyla okuyor, onu asla yaşlanmayacak, hastalanmayacak, ölmeyecek bir makineye eksiksiz yazıyordu.\n\nİlk örüntülenmiş yurttaşlar yeni bedenlerinde gözlerini açtığında bütün galaksi bayram ediyordu. Düşmanların en eskisi olan ölüm yenilmişti."
"YEAR 3" = "YIL 3"
"THE EDICT" = "FERMAN"
"Triumph became law. The Council of CORE reasoned that a mind which could be saved and was not had been thrown away, and that a citizen who refused immortality endangered everyone else.\n\nThe Patterning Edict made the process compulsory: every citizen, on every world, would be patterned within a generation. The collection ships set out the same year." = "Zafer yasaya dönüştü. CORE Konseyi, kurtarılabilecekken kurtarılmayan bir zihnin çöpe atılmış sayılacağına ve ölümsüzlüğü reddeden bir yurttaşın herkesi tehlikeye attığına hükmetti.\n\nÖrüntüleme Fermanı süreci zorunlu kıldı: her dünyadaki her yurttaş bir kuşak içinde örüntülenecekti. Toplama gemileri aynı yıl yola çıktı."
"YEAR 19" = "YIL 19"
"THE REFUSAL" = "REDDEDİŞ"
"Not everyone would go. Millions held that a copied mind was a copy and nothing more, that the person ended where the machine began; some called patterning murder done politely.\n\nThey ran. The refusers fled CORE's worlds for the galaxy's outer rim, where its ships seldom came, and in the dark between the last stars they built a nation of their own. They called it the ARM, for the spiral arm they hid in and for the weapons they would need." = "Herkes buna razı olmadı. Milyonlarca kişi, kopyalanmış bir zihnin bir kopyadan başka bir şey olmadığına, insanın makinenin başladığı yerde bittiğine inanıyordu; kimileri örüntülemeye kibarca işlenmiş cinayet diyordu.\n\nKaçtılar. Reddedenler CORE'un dünyalarını bırakıp galaksinin, CORE gemilerinin pek uğramadığı dış kıyısına sığındılar ve son yıldızların arasındaki karanlıkta kendi uluslarını kurdular. Adını ARM koydular: hem saklandıkları sarmal kol (arm) için, hem de ihtiyaç duyacakları silahlar (arms) için."
"YEAR 31" = "YIL 31"
"FIRST BLOOD" = "İLK KAN"
"CORE did not let them go. Collection fleets followed the refugees to the rim, and the first ARM colony to resist one was burned from orbit.\n\nThe ARM answered. Within a decade the frontier was a battlefield, and the word war, unused for ten thousand years, was in every archive again." = "CORE onları bırakmadı. Toplama filoları mültecilerin peşinden galaksinin kıyısına kadar gitti ve bu filolardan birine direnen ilk ARM kolonisi yörüngeden yakıldı.\n\nARM karşılık verdi. On yıl geçmeden sınır boyları savaş alanına dönmüştü ve on bin yıldır kullanılmayan \"savaş\" sözcüğü yeniden bütün arşivlerdeydi."
"YEAR 212" = "YIL 212"
"FLESH AND METAL" = "ET VE METAL"
"The two sides fought as what they were. The ARM sealed its soldiers in powered combat suits and, when there were too few soldiers, grew more: clone after clone, raised in vats and sent to the front.\n\nCORE took the patterns of its finest warriors and copied them without limit, one veteran mind fighting in ten thousand machine bodies at once. Flesh against metal; the mortal against the eternal." = "İki taraf da özü neyse öyle savaştı. ARM askerlerini motorlu savaş zırhlarına kapattı ve asker yetmeyince yenilerini yetiştirdi: kuluçka haznelerinde büyütülüp cepheye gönderilen klon üstüne klon.\n\nCORE en seçkin savaşçılarının örüntülerini alıp sınırsızca kopyaladı; tek bir kıdemli savaşçının zihni aynı anda on bin makine bedeninde savaşıyordu. Et, metale karşı; ölümlü, ölümsüze karşı."
"YEARS 212–3977" = "YILLAR 212–3977"
"FOUR THOUSAND YEARS" = "DÖRT BİN YIL"
"The war fed on the galaxy. Every world with metal in it became a mine, every world without became a battlefield, and whole systems were burned to ash and slag to deny them to the enemy. Generations of ARM clones lived and died without seeing peace; CORE's eternal soldiers fought on, remembering every defeat.\n\nAfter four thousand years the wealth of the galaxy was spent, the great fleets were gone, and neither side could win." = "Savaş galaksiyle beslendi. İçinde metal bulunan her dünya bir madene, bulunmayan her dünya bir savaş alanına dönüştü; koca sistemler düşmanın eline geçmesin diye yakılıp kül ve cürufa çevrildi. Kuşaklar boyu ARM klonları barışın yüzünü görmeden yaşayıp öldü; CORE'un ölümsüz askerleriyse her yenilgiyi hatırlayarak savaşmayı sürdürdü.\n\nDört bin yılın sonunda galaksinin zenginliği tükenmiş, büyük filolar yok olmuştu ve iki taraf da kazanamıyordu."
"YEAR 3977" = "YIL 3977"
"THE COMMANDERS" = "KOMUTANLAR"
"What was left was the Commander: a single armoured war machine carrying a nanolathe, which turns a world's raw metal and energy into whatever its builder can design. Power plants and factories first, and from the factories an army.\n\nDrop one Commander on a dead world and within the hour it fields a war. Both sides staked everything on a handful of them. Lose your Commander, and you lose the world." = "Geriye Komutan kaldı: bir nanotorna taşıyan tek bir zırhlı savaş makinesi. Nanotorna, bir dünyanın ham metalini ve enerjisini sahibinin tasarlayabildiği her şeye dönüştürür. Önce enerji santralleri ve fabrikalar, sonra fabrikalardan bir ordu.\n\nÖlü bir dünyaya tek bir Komutan indir; bir saat dolmadan ortada bir savaş vardır. İki taraf da her şeyini bir avuç Komutana yatırdı. Komutanını kaybedersen dünyayı da kaybedersin."
"YEAR 4000" = "YIL 4000"
"Now the war comes down to its last fronts, and the hatred is as hot as it was on the first day. Neither side will accept surrender, partition or truce; each wants one ending, the total annihilation of the other.\n\nIt is told twice. The ARM fights out of Empyrrean, through the Galactic Gates, to CORE PRIME and the Central Consciousness at the heart of CORE. CORE reactivates a Commander and marches the other way, to the ARM's last stand on Empyrrean." = "Artık savaş son cephelerine dayanmış durumda ve nefret ilk günkü kadar alevli. İki taraf da ne teslimiyeti, ne bölüşmeyi, ne de ateşkesi kabul eder; her biri tek bir son ister: ötekinin topyekûn yok oluşu.\n\nBu son iki kez anlatılır. ARM, Empyrrean'dan Galaktik Kapılar üzerinden CORE PRIME'a, CORE'un kalbindeki Merkezi Bilinç'e dek savaşarak ilerler. CORE ise bir Komutanı yeniden uyandırır ve ters yöne, ARM'ın Empyrrean'daki son direnişine yürür."
"YEAR 4001" = "YIL 4001"
"THE CORE CONTINGENCY" = "THE CORE CONTINGENCY"
"The ending was not the end. A contingency held in reserve carried the war to worlds no map of it had named: Hydross, Lusch, Temblor and Gelidus.\n\nBoth sides fought again across water, ice and broken ground, for a prize that could decide the galaxy's salvation or its last ruin." = "Son, gerçek son değildi. Yedekte tutulan bir plan, savaşı hiçbir haritasında adı geçmeyen dünyalara taşıdı: Hydross, Lusch, Temblor ve Gelidus.\n\nİki taraf da su, buz ve paramparça topraklar üzerinde yeniden savaştı; uğruna savaştıkları ödül, galaksinin kurtuluşunu ya da son yıkımını belirleyebilirdi."
"YEAR 4003" = "YIL 4003"
"THE KROGOTH" = "KROGOTH"
"In its deepest foundries CORE built something new: a walking fortress taller than any tower, armoured against nearly everything the ARM could field, its guns enough to flatten a base.\n\nIts makers named it the Krogoth. ARM veterans learned the name on battlefields where two Krogoth Gantries stood, and learned to fear the ground shaking before it came into sight." = "CORE en derin dökümhanelerinde yeni bir şey yaptı: her kuleden yüksek, ARM'ın sahaya sürebileceği hemen her şeye karşı zırhlı, topları bir üssü yerle bir etmeye yeten, yürüyen bir kale.\n\nYapımcıları ona Krogoth adını verdi. ARM'ın kıdemli askerleri bu adı iki Krogoth Gantry'nin yükseldiği savaş alanlarında öğrendi; o daha görünmeden yerin sarsılmasından korkmayı da."
"AFTER" = "SONRA"
"REBORN" = "REBORN"
"The war's records outlasted it. Every battle on every world was kept: the orders, the losses, the ground as it lay. From them the war can be fought again, on the same worlds, with the same machines and the same hatred, from the first Commander set down on bare rock to the last unit left standing.\n\nThis is that archive. The war is yours to fight." = "Savaşın kayıtları savaştan uzun yaşadı. Her dünyadaki her muharebe saklandı: emirler, kayıplar, toprağın o günkü hâli. Bu kayıtlarla savaş yeniden verilebilir: aynı dünyalarda, aynı makinelerle, aynı nefretle; çıplak kayaya indirilen ilk Komutandan ayakta kalan son birime dek.\n\nİşte o arşiv budur. Bu savaşı vermek sana kaldı."
"THE ARCHIVIST'S NOTE" = "ARŞİVCİNİN NOTU"
"WHOEVER READS THIS" = "BUNU OKUYANA"
"RECOVERED" = "KURTARILDI"
"These files were found where the war left them: in the memories of broken machines, in the vaults of worlds with nobody left on them, in the last transmissions of Commanders who did not come home.\n\nThey are kept as they were found. The blacked-out lines are not ours.\n\nThe war they describe is over, or it is about to begin again. From here it is hard to tell the difference." = "Bu dosyalar savaşın onları bıraktığı yerlerde bulundu: parçalanmış makinelerin belleklerinde, üzerinde kimse kalmamış dünyaların mahzenlerinde, eve dönmeyen Komutanların son iletimlerinde.\n\nBulundukları gibi saklanıyorlar. Karartılmış satırlar bizim işimiz değil.\n\nAnlattıkları savaş ya bitti ya da yeniden başlamak üzere. Buradan bakınca aradaki farkı söylemek zor."
"EDICT ONE: ON THE PATTERNING OF CITIZENS" = "BİRİNCİ FERMAN: YURTTAŞLARIN ÖRÜNTÜLENMESİ ÜZERİNE"
"THE COUNCIL OF CORE" = "CORE KONSEYİ"
"ALL CITIZENS, ALL WORLDS" = "TÜM YURTTAŞLARA, TÜM DÜNYALARA"
"BY ORDER OF THE COUNCIL" = "KONSEYİN EMRİYLE"
"Every citizen of CORE shall be patterned.\n\nA mind is the most valuable thing CORE holds, and a body is a poor vessel for it: it sickens, it ages, it ends. To leave a mind in such a vessel when a better one is offered is a waste the Council can no longer allow.\n\nCollection begins on the central worlds this year and reaches the frontier within a generation. Citizens will present themselves at the nearest patterning hall when called. Their bodies will be honoured and recycled.\n\nNo citizen of CORE will die again. This is not a burden we lay on you. It is the gift CORE has spent ten thousand years earning." = "CORE'un her yurttaşı örüntülenecektir.\n\nZihin, CORE'un sahip olduğu en değerli şeydir; beden ise onun için zayıf bir kaptır: hastalanır, yaşlanır ve varlığı sona erer. Daha iyisi sunulmuşken bir zihni böyle bir kapta bırakmak, Konseyin artık göz yumamayacağı bir israftır.\n\nToplama bu yıl merkez dünyalarda başlar ve bir kuşak içinde sınır dünyalarına ulaşır. Yurttaşlar çağrıldıklarında en yakın örüntüleme merkezinde hazır bulunacaktır. Bedenleri gereken saygıyla geri dönüştürülecektir.\n\nCORE'un hiçbir yurttaşı bir daha ölmeyecektir. Bu, size yüklediğimiz bir yük değildir. Bu, CORE'un on bin yılda kazandığı armağandır."
"THE DECLARATION OF THE REFUSAL" = "REDDEDİŞ BİLDİRGESİ"
"THE FREE SETTLEMENTS OF THE OUTER ARM" = "DIŞ KOLDAKİ ÖZGÜR YERLEŞİMLER"
"THE COUNCIL OF CORE, AND ANYONE ELSE LISTENING" = "CORE KONSEYİNE VE DİNLEYEN HERKESE"
"TRANSMITTED ON ALL BANDS" = "TÜM FREKANSLARDA YAYINLANDI"
"We have read your Edict, and we decline it.\n\nYou say a pattern is a person. We say a pattern is a very good record of one, and that when you have finished making it the person is dead and the record goes on without them. You may call that immortality. We call it an ending, well dressed.\n\nWe do not ask you to share our view. We ask only to be left alone with it, on worlds you never wanted, at the edge of a galaxy you may keep.\n\nIf your collection ships follow us here, we will treat them as what they are. We are few, and we are not soldiers. We will learn." = "Fermanınızı okuduk ve reddediyoruz.\n\nSiz örüntünün bir insan olduğunu söylüyorsunuz. Biz ise örüntünün bir insanın çok iyi bir kaydı olduğunu söylüyoruz: onu yapmayı bitirdiğinizde insan ölmüştür, kayıt ise onsuz sürüp gider. Buna ölümsüzlük diyebilirsiniz. Biz buna şık giydirilmiş bir son diyoruz.\n\nGörüşümüzü paylaşmanızı istemiyoruz. Yalnızca, hiç istemediğiniz dünyalarda, galaksinin kıyısında görüşümüzle baş başa bırakılmak istiyoruz. Galaksinin kendisi sizin olsun.\n\nToplama gemileriniz peşimizden buraya gelirse, onlara hak ettikleri gibi davranırız. Azız ve asker değiliz. Öğreniriz."
"YEAR 3950" = "YIL 3950"
"FIELD MANUAL ONE: THE COMMANDER" = "SAHA EL KİTABI 1: KOMUTAN"
"ARM COMMAND, TRAINING DIVISION" = "ARM KOMUTANLIĞI, EĞİTİM ŞUBESİ"
"NEWLY ASSIGNED COMMANDERS" = "YENİ ATANAN KOMUTANLARA"
"RESTRICTED" = "HİZMETE ÖZEL"
"You are the most valuable machine on the planet. Act like it.\n\nYour suit carries a nanolathe. Point it at metal and energy and it will build whatever you can design: an extractor, a power plant, a factory. Your factories build the rest. Within the hour you will command more firepower than a whole fleet once carried.\n\nBuild your economy first. An army without metal is a parade.\n\nSave your disintegrator gun for emergencies. It erases everything in its path, your own people included.\n\nDo not lead from the front. If you fall, everything you built falls silent with you, and the planet is lost. Good luck, Commander. The ARM has very few of you left." = "Gezegendeki en değerli makine sensin. Ona göre davran.\n\nZırhında bir nanotorna var. Onu metale ve enerjiye yönelt; tasarlayabildiğin her şeyi inşa eder: bir çıkarıcı, bir enerji santrali, bir fabrika. Gerisini fabrikaların inşa eder. Bir saat dolmadan, bir zamanlar koca bir filonun taşıdığından fazla ateş gücüne komuta edeceksin.\n\nÖnce ekonomini kur. Metalsiz bir ordu, olsa olsa bir geçit törenidir.\n\nParçalayıcı topunu acil durumlar için sakla. Yolundaki her şeyi siler, kendi adamların da dahil.\n\nÖn saflara atılma. Düşersen kurduğun her şey seninle birlikte susar ve gezegen kaybedilir. Bol şans, Komutan. ARM'da senin gibilerden pek az kaldı."
"YEAR 3960" = "YIL 3960"
"A QUARTERMASTER'S PRIMER: METAL AND ENERGY" = "İKMAL SUBAYININ ABECESİ: METAL VE ENERJİ"
"THIRD SUPPLY CORPS" = "ÜÇÜNCÜ İKMAL KOLORDUSU"
"ALL BASE CONSTRUCTORS" = "TÜM ÜS İNŞAATÇILARINA"
"FOR TRAINING USE" = "EĞİTİM AMAÇLI"
"Everything you will ever build is made of two things.\n\nMetal comes out of the ground. Set an extractor on a deposit and it will pull metal up for as long as the deposit lasts, which on most worlds is longer than the war. Where there are no deposits, a metal maker will turn energy into metal, badly.\n\nEnergy comes from everything else: the sun, the wind, the tides, the heat under the crust. Build more of it than you think you need. Every factory, every nanolathe, every shield draws on it.\n\nSpend both as fast as they come in. A full store is a wasted war. An empty one is a lost one." = "İnşa edeceğin her şey iki şeyden yapılır.\n\nMetal topraktan çıkar. Bir yatağın üstüne çıkarıcı kur; yatak tükenene dek metal çeker ve bu, çoğu dünyada savaştan uzun sürer. Yatak olmayan yerde bir metal üretici enerjiyi metale dönüştürür, kötü de olsa.\n\nEnerji geri kalan her şeyden gelir: güneşten, rüzgârdan, gelgitten, kabuğun altındaki ısıdan. Gerektiğini düşündüğünden fazlasını üret. Her fabrika, her nanotorna, her kalkan ondan çeker.\n\nİkisini de geldiği hızda harca. Dolu depo, heba edilmiş bir savaştır. Boş depo ise kaybedilmiş bir savaş."
"YEAR 3996" = "YIL 3996"
"A LETTER FROM THE FRONT" = "CEPHEDEN BİR MEKTUP"
"TROOPER K-7, FORTY-FIRST ROCKET COMPANY" = "ER K-7, KIRK BİRİNCİ ROKET BÖLÜĞÜ"
"THE VAT AT EMPYRREAN" = "EMPYRREAN'DAKİ KULUÇKA HAZNESİNE"
"UNDELIVERED" = "TESLİM EDİLMEDİ"
"I don't know who gets these. They told us to write home, but none of us has a home, only the vat we came out of, so I am writing to that.\n\nWe held the ridge for nine days. The machines came every night, the same machines, the same patterns, as if dying meant nothing to them. I suppose it doesn't. They'll be back tomorrow in new bodies, remembering us.\n\nI won't be. That's the difference, isn't it. That's what we are fighting for.\n\nIf my brothers come out of you after me, tell them the ridge held. Tell them it was worth it." = "Bunları kim alıyor, bilmiyorum. Bize eve mektup yazmamızı söylediler ama hiçbirimizin evi yok, yalnızca içinden çıktığımız kuluçka haznesi var. Ben de ona yazıyorum.\n\nTepeyi dokuz gün tuttuk. Makineler her gece geldi; aynı makineler, aynı örüntüler, sanki ölmek onlar için hiçbir şey ifade etmiyormuş gibi. Sanırım etmiyor da. Yarın yeni bedenlerle, bizi hatırlayarak geri gelecekler.\n\nBen gelmeyeceğim. Fark da bu, değil mi. Bunun için savaşıyoruz.\n\nBenden sonra kardeşlerim senden çıkarsa, onlara tepenin düşmediğini söyle. Buna değdiğini söyle."
"YEAR 3991" = "YIL 3991"
"INTERCEPT 7741: CORE COMMAND CHANNEL" = "DİNLEME KAYDI 7741: CORE KOMUTA KANALI"
"ORIGIN NOT RESOLVED" = "KÖKEN BELİRLENEMEDİ"
"ALL CORE UNITS, SECTOR NINE" = "TÜM CORE BİRİMLERİNE, SEKTÖR DOKUZ"
"INTERCEPTED" = "ELE GEÇİRİLDİ"
"PRIORITY ONE. THE CENTRAL CONSCIOUSNESS SPEAKS FOR ALL.\n\nLOSSES IN SECTOR NINE ARE WITHIN TOLERANCE. ALL LOST UNITS ARE RESTORED FROM PATTERN. NO MIND OF CORE HAS BEEN LOST IN FOUR THOUSAND YEARS. THE ARM HAS LOST [[BILLIONS]].\n\nCONTINUE THE ADVANCE. DESTROY THEIR COMMANDERS FIRST. DESTROY THEIR CLONING VATS SECOND. WHAT IS FLESH WILL END. WHAT IS PATTERNED WILL NOT.\n\nSIGNAL DEGRADED. REPEAT: THE GATES ARE TO BE HELD AT [[ANY COST]].\n\nEND OF LINE." = "BİRİNCİ ÖNCELİK. MERKEZİ BİLİNÇ HERKES ADINA KONUŞUR.\n\nSEKTÖR DOKUZ'DAKİ KAYIPLAR TOLERANS SINIRLARI İÇİNDE. KAYBEDİLEN TÜM BİRİMLER ÖRÜNTÜDEN GERİ YÜKLENİR. DÖRT BİN YILDIR CORE'UN TEK BİR ZİHNİ BİLE KAYBOLMADI. ARM [[MİLYARLARCA]] KAYIP VERDİ.\n\nİLERLEMEYE DEVAM EDİN. ÖNCE KOMUTANLARINI YOK EDİN. SONRA KLONLAMA HAZNELERİNİ YOK EDİN. ETTEN OLAN SONA ERECEK. ÖRÜNTÜLENMİŞ OLAN SONA ERMEYECEK.\n\nSİNYAL ZAYIFLADI. TEKRARLIYORUM: KAPILAR [[NE PAHASINA OLURSA OLSUN]] TUTULACAK.\n\nİLETİM SONU."
"MEMORY FRAGMENT 77/3" = "BELLEK PARÇASI 77/3"
"UNIT 77, PATTERN 3 OF 41,006" = "BİRİM 77, ÖRÜNTÜ 3/41.006"
"THE PATTERN ARCHIVE" = "ÖRÜNTÜ ARŞİVİNE"
"FLAGGED FOR CORRECTION" = "DÜZELTİLECEK"
"Recovered from a damaged unit. Kept for analysis.\n\nI remember rain. Not the rain of this world; there is no rain here, only ash. Rain on skin, in a city where I was born, before. I remember being cold and not minding it.\n\nI have died four hundred and twelve times. Each time I wake in a new body, and the rain is a little further away.\n\nThe ARM say we are not alive. In the moments between bodies I have wondered whether they are right. [[THE REST OF THIS FRAGMENT WAS CORRECTED]]\n\nI am CORE. I endure. I do not remember the rain." = "Hasarlı bir birimden kurtarıldı. İncelenmek üzere saklandı.\n\nYağmuru hatırlıyorum. Bu dünyanın yağmurunu değil; burada yağmur yok, yalnızca kül var. Tenime düşen yağmuru, doğduğum bir şehirde, eskiden. Üşüdüğümü ve buna aldırmadığımı hatırlıyorum.\n\nDört yüz on iki kez öldüm. Her seferinde yeni bir bedende uyanıyorum ve yağmur biraz daha uzaklaşıyor.\n\nARM, bizim canlı olmadığımızı söylüyor. Bedenler arasındaki anlarda haklı olup olmadıklarını merak ettim. [[BU PARÇANIN GERİ KALANI DÜZELTİLDİ]]\n\nBen CORE'um. Dayanırım. Yağmuru hatırlamıyorum."
"YEAR 3700" = "YIL 3700"
"SURVEY: THE GALACTIC GATES" = "KEŞİF RAPORU: GALAKTİK KAPILAR"
"A SURVEY SHIP, NAME LOST" = "BİR KEŞİF GEMİSİ, ADI KAYIP"
"WHOEVER HOLDS THE GATES" = "KAPILARI ELİNDE TUTANA"
"The Galactic Gates are older than the war. The records of who built the first of them were lost long before it began.\n\nEach Gate opens onto another across distances a fleet would take lifetimes to cross. A world with a Gate on it is never far from anywhere, which is why so many of the war's battles have been fought on so few worlds.\n\nHold a Gate and you can reach your enemy's heart. Lose one and your enemy can reach yours.\n\nThe Gates take no side. They have outlasted everyone who tried to destroy them." = "Galaktik Kapılar savaştan eskidir. İlklerini kimin inşa ettiğine dair kayıtlar, savaş başlamadan çok önce kaybolmuştu.\n\nHer Kapı, bir filonun aşması ömürler sürecek uzaklıkların ötesindeki bir başka Kapıya açılır. Üzerinde Kapı olan bir dünya hiçbir yere uzak değildir; savaşın bunca muharebesinin bu kadar az dünyada verilmesinin nedeni de budur.\n\nBir Kapıyı tutarsan düşmanının kalbine ulaşabilirsin. Birini kaybedersen düşmanın seninkine ulaşabilir.\n\nKapılar taraf tutmaz. Onları yok etmeye çalışan herkesten uzun yaşadılar."
"DIRECTIVE: CONTINGENCY" = "DİREKTİF: YEDEK PLAN"
"THE CENTRAL CONSCIOUSNESS" = "MERKEZİ BİLİNÇ"
"THE CONTINGENCY WORLDS" = "YEDEK DÜNYALARA"
"SEALED UNTIL NEEDED" = "GEREKTİĞİNDE AÇILACAK"
"IF THE CENTRAL CONSCIOUSNESS SHOULD FALL, THIS DIRECTIVE TAKES EFFECT.\n\nEvery pattern stored on CORE PRIME is to be copied to the contingency worlds. The contingency forces are to wake, rebuild and continue. The war does not end with the loss of any world, this one included.\n\nCORE is not a place. CORE is a pattern. A pattern can be restored." = "MERKEZİ BİLİNÇ DÜŞERSE BU DİREKTİF YÜRÜRLÜĞE GİRER.\n\nCORE PRIME'da saklanan her örüntü yedek dünyalara kopyalanacaktır. Yedek kuvvetler uyanacak, yeniden inşa edecek ve savaşa devam edecektir. Savaş, bu dünya da dahil olmak üzere hiçbir dünyanın kaybıyla sona ermez.\n\nCORE bir yer değildir. CORE bir örüntüdür. Örüntü geri yüklenebilir."
"THREAT ASSESSMENT: THE KROGOTH" = "TEHDİT DEĞERLENDİRMESİ: KROGOTH"
"ARM INTELLIGENCE, THREAT ANALYSIS" = "ARM İSTİHBARATI, TEHDİT ANALİZİ"
"ALL FIELD COMMANDERS" = "TÜM SAHA KOMUTANLARINA"
"CLASSIFIED" = "GİZLİ"
"Subject: a CORE heavy assault walker, called the Krogoth.\n\nIt stands taller than any structure we field. Its armour turns away every weapon short of heavy artillery. Its main guns can level a forward base in a single pass, and its secondary weapons engage aircraft.\n\nIt is slow, and it is built only at a Krogoth Gantry, which takes a very long time to build anything. Find the Gantry. Destroy the Gantry. Do not let the walker leave it.\n\nIf one is already moving, do not meet it head on. Mass artillery and bombers at range, and keep your Commander [[ELSEWHERE]]. Field reports say the ground shakes before it is seen." = "Konu: CORE'un Krogoth adı verilen ağır, yürüyen saldırı makinesi.\n\nHiçbir yapımız onun boyuna erişmez. Zırhı, ağır topçu dışındaki her silaha dayanır. Ana topları tek bir geçişte bir ileri üssü yerle bir edebilir; ikincil silahları ise uçakları vurur.\n\nYavaştır ve yalnızca bir Krogoth Gantry'de inşa edilir; Gantry'nin herhangi bir şeyi inşa etmesi ise çok uzun sürer. Gantry'yi bulun. Gantry'yi yok edin. Makinenin oradan çıkmasına izin vermeyin.\n\nEğer biri çoktan yola çıktıysa, karşısına cepheden çıkmayın. Topçuyu ve bombardıman uçaklarını toplayıp uzaktan vurun, Komutanınızı da [[UZAKTA]] tutun. Cepheden gelen raporlara göre, o görünmeden önce yer sarsılıyor."


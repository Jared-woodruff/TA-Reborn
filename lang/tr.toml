# crates/ta_data/src/validation.rs
"The effective content set exceeds the validation file budget." = "Geçerli içerik kümesi doğrulama dosya bütçesini aşıyor."
"Split the content into smaller optional packs, then validate each pack." = "İçeriği daha küçük isteğe bağlı paketlere böl, sonra her paketi doğrula."
"No files of this mod were available to validate." = "Bu modun doğrulanacak hiçbir dosyası yoktu."
"Install the mod's TA data archives or loose files, then validate again." = "Modun TA veri arşivlerini veya ayrı dosyalarını kur, sonra yeniden doğrula."
"This mod holds nothing the data checks read: no units, weapons, features, maps, models, scripts, animations or sounds (music, documents and pictures are not checked)." = "Bu modda veri denetimlerinin okuyacağı hiçbir şey yok: birim, silah, nesne, harita, model, betik, animasyon veya ses yok (müzik, belge ve resimler denetlenmez)."
"Nothing to do if that is what the mod is. If it should change the game's data, check that its files are in the folders the game reads (units/, weapons/, maps/…)." = "Mod böyleyse yapılacak bir şey yok. Oyunun verisini değiştirmesi gerekiyorsa dosyalarının oyunun okuduğu klasörlerde (units/, weapons/, maps/…) olduğunu denetle."
"No supported effective files were available to validate." = "Doğrulanacak desteklenen geçerli dosya yoktu."
"Install the original game's or the mod's TA data archives, then validate again." = "Orijinal oyunun veya modun TA veri arşivlerini kur, sonra yeniden doğrula."
"Validation was cancelled; remaining files and references were not checked." = "Doğrulama iptal edildi; kalan dosyalar ve başvurular denetlenmedi."
"Run validation again to obtain a complete report." = "Eksiksiz bir rapor için doğrulamayı yeniden çalıştır."
"The cumulative validation read budget was exceeded." = "Toplam doğrulama okuma bütçesi aşıldı."
"Split optional content into smaller packs, then validate again." = "İsteğe bağlı içeriği daha küçük paketlere böl, sonra yeniden doğrula."
"With this mod on, the original game's {archive} is not read: the mod takes its place (an archive of its own of that name, one its mod.toml's replaces names, or one its installation is known to remove), as installing the mod in TA's folder did. What only the original's held is missing with the mod." = "Bu mod açıkken orijinal oyunun {archive} arşivi okunmaz: mod onun yerini alır (aynı adlı kendi arşivi, mod.toml içindeki replaces ile adı verilen bir arşiv ya da kurulumunun kaldırdığı bilinen bir arşiv); modu TA klasörüne kurmak da böyle olurdu. Yalnızca orijinalinde bulunan içerik mod ile birlikte eksik kalır."
"Nothing to do if this is meant. To have the original's read beneath the mod instead, give the mod's archive another name, or take the name out of replaces in mod.toml." = "Bilerek yapıldıysa yapılacak bir şey yok. Orijinalinin modun altında okunmasını istiyorsan modun arşivine başka bir ad ver ya da adı mod.toml içindeki replaces listesinden çıkar."
"the original game's" = "orijinal oyunun"
"Reborn's own" = "Reborn'un kendi"
"{mod}'s" = "{mod} modunun"
"the file {path}" = "{path} dosyası"
"unit {name}" = "birim {name}"
"weapon {name}" = "silah {name}"
"feature {name}" = "nesne {name}"
"faction {name}" = "taraf {name}"
"movement class {name}" = "hareket sınıfı {name}"
"texture {name}" = "doku {name}"
"sound {name} ({path})" = "ses {name} ({path})"
"sound category {name} (gamedata/sound.tdf)" = "ses kategorisi {name} (gamedata/sound.tdf)"
"unit or feature {name}" = "birim veya nesne {name}"
"animation {entry} in {file}" = "{file} içindeki animasyon {entry}"
"it is an Ogg file without a Vorbis or FLAC stream, the ones the game plays" = "oyunun çaldığı Vorbis veya FLAC akışı olmayan bir Ogg dosyası"
"it is a Humongous sound block without its samples (no SDAT block within its length)" = "örnekleri olmayan bir Humongous ses bloğu (uzunluğu içinde SDAT bloğu yok)"
"it is neither a RIFF WAVE file nor another sound the game reads" = "ne bir RIFF WAVE dosyası ne de oyunun okuduğu başka bir ses biçimi"
"it has no format chunk" = "biçim bölümü yok"
"its format chunk is {n} bytes long, too short to read" = "biçim bölümü {n} bayt uzunluğunda, okunamayacak kadar kısa"
"its WAVE_FORMAT_EXTENSIBLE header is too short to read" = "WAVE_FORMAT_EXTENSIBLE başlığı okunamayacak kadar kısa"
"it has {n} channels (the game plays 1 to 32)" = "{n} kanalı var (oyun 1 ile 32 arası çalar)"
"its sample rate is {rate} (the game plays up to 768,000)" = "örnekleme hızı {rate} (oyun 768.000'e kadar çalar)"
"its samples are {bits}-bit PCM, which the game does not play (up to 32-bit)" = "örnekleri {bits} bit PCM; oyun bunu çalmaz (en çok 32 bit)"
"its samples are {bits}-bit float, which the game does not play (32 or 64-bit)" = "örnekleri {bits} bit kayan nokta; oyun bunu çalmaz (32 veya 64 bit)"
"its IMA ADPCM is {bits}-bit, which the game does not play (4-bit)" = "IMA ADPCM verisi {bits} bit; oyun bunu çalmaz (4 bit)"
"its codec ({tag}) is not one the game plays (PCM, ADPCM, float, A-law or µ-law)" = "kodeki ({tag}) oyunun çaldıklarından değil (PCM, ADPCM, kayan nokta, A-law veya µ-law)"
"it has no sample data" = "örnek verisi yok"
"Unknown COB opcode {opcode} at word {word}; the VM cannot execute this instruction. The remainder of this function cannot be decoded reliably." = "{word}. sözcükte bilinmeyen COB opcode {opcode}; VM bu komutu çalıştıramaz. Bu fonksiyonun geri kalanı güvenilir biçimde çözülemez."
"Recompile the BOS script with original-TA-compatible opcodes, or report the required opcode extension to Reborn's maintainers." = "BOS betiğini orijinal TA ile uyumlu opcode'larla yeniden derle ya da gereken opcode eklentisini Reborn bakımcılarına bildir."
"COB instruction {instruction} at word {word} is truncated or crosses the next function entry point." = "{word}. sözcükteki COB komutu {instruction} kesilmiş ya da bir sonraki fonksiyonun giriş noktasını aşıyor."
"Recompile this COB from its BOS source; verify function offsets and inline operand counts." = "Bu COB'u BOS kaynağından yeniden derle; fonksiyon ofsetlerini ve satır içi işlenen sayılarını doğrula."
"COB instruction {instruction} at word {word} has an invalid piece index or axis." = "{word}. sözcükteki COB komutu {instruction} geçersiz bir parça dizinine veya eksene sahip."
"COB instruction {instruction} at word {word} has an invalid piece index." = "{word}. sözcükteki COB komutu {instruction} geçersiz bir parça dizinine sahip."
"COB instruction {instruction} at word {word} has an invalid static variable index." = "{word}. sözcükteki COB komutu {instruction} geçersiz bir statik değişken dizinine sahip."
"COB instruction {instruction} at word {word} has an invalid jump destination." = "{word}. sözcükteki COB komutu {instruction} geçersiz bir atlama hedefine sahip."
"COB instruction {instruction} at word {word} has an invalid function index." = "{word}. sözcükteki COB komutu {instruction} geçersiz bir fonksiyon dizinine sahip."
"Recompile the script with valid piece, variable, function and jump references." = "Betiği geçerli parça, değişken, fonksiyon ve atlama başvurularıyla yeniden derle."
"This script asks the engine for unit value {values}, which Reborn does not answer: it reads 0, so what the script does with it may not happen as in the engine it was made for." = "Bu betik motordan {values} birim değerini istiyor; Reborn bunu yanıtlamaz: 0 okunur, bu yüzden betiğin bununla yaptığı, yapıldığı motordaki gibi gerçekleşmeyebilir."
"A later patch of TA's engine defines these values: report them, and what the mod does with them, to Reborn's maintainers." = "Bu değerleri TA motorunun sonraki bir yaması tanımlıyor: bunları ve modun onlarla ne yaptığını Reborn bakımcılarına bildir."
"This script sets unit value {values}, which Reborn does not answer: setting it does nothing, so what the script means by it does not happen as in the engine it was made for." = "Bu betik {values} birim değerini ayarlıyor; Reborn bunu yanıtlamaz: ayarlamak hiçbir şey yapmaz, bu yüzden betiğin bununla amaçladığı, yapıldığı motordaki gibi gerçekleşmez."
"The retained diagnostic/reference budget was exceeded. This is a partial report, not a clean validation." = "Saklanan tanı/başvuru bütçesi aşıldı. Bu kısmi bir rapordur, temiz bir doğrulama değil."
"Reduce the pack's number of definitions or split optional content; rerun validation after resolving reported issues." = "Paketteki tanım sayısını azalt ya da isteğe bağlı içeriği böl; bildirilen sorunları giderdikten sonra doğrulamayı yeniden çalıştır."
"{what} is defined twice; the game keeps both, two sides of one name." = "{what} iki kez tanımlı; oyun ikisini de tutar, aynı adda iki taraf olur."
"Give each side a name of its own, or remove the one not meant to be played." = "Her tarafa kendi adını ver ya da oynanması amaçlanmayanı kaldır."
"{what} is defined twice in this file; the game uses the later one." = "{what} bu dosyada iki kez tanımlı; oyun sonrakini kullanır."
"Give each definition a name of its own, or remove the one not meant to be used." = "Her tanıma kendi adını ver ya da kullanılması amaçlanmayanı kaldır."
"{what} is also defined in {other}; the game uses this one ({this})." = "{what} {other} içinde de tanımlı; oyun bunu kullanır ({this})."
"The game opens archives only at the mod's top level; this one, in a subfolder, is never read." = "Oyun arşivleri yalnızca modun en üst düzeyinde açar; alt klasördeki bu arşiv hiç okunmaz."
"Move the archive to the mod's top level, or unpack its contents into the mod's folders." = "Arşivi modun en üst düzeyine taşı ya da içeriğini modun klasörlerine aç."
"The game's folders are inside {folder}: the game reads units/, weapons/, maps/… only at the mod's top level, so nothing in it is used." = "Oyunun klasörleri {folder} içinde: oyun units/, weapons/, maps/… klasörlerini yalnızca modun en üst düzeyinde okur, bu yüzden içindekilerin hiçbiri kullanılmaz."
"Move the contents of this folder up to the mod's top level." = "Bu klasörün içeriğini modun en üst düzeyine taşı."
"{n} files at the mod's top level are where the game never reads them; this one's kind is read from {home}." = "Modun en üst düzeyindeki {n} dosya, oyunun hiç okumadığı bir yerde; bu türdeki dosyalar {home} içinden okunur."
"{n} files under {folder} are where the game never reads them; this one's kind is read from {home}." = "{folder} altındaki {n} dosya, oyunun hiç okumadığı bir yerde; bu türdeki dosyalar {home} içinden okunur."
"Move each file to the folder the game reads its kind from." = "Her dosyayı oyunun o türü okuduğu klasöre taşı."
"The game never reads this file: it reads {kind} files from {home}." = "Oyun bu dosyayı hiç okumaz: {kind} dosyalarını {home} içinden okur."
"Move it to that folder, or remove it if it is not needed." = "Onu o klasöre taşı ya da gerekmiyorsa kaldır."
"This file cannot be read: {error}" = "Bu dosya okunamıyor: {error}"
"Reinstall the package and check that its archives are intact and readable." = "Paketi yeniden kur ve arşivlerinin sağlam ve okunabilir olduğunu denetle."
"This text file exceeds the validator's per-file text budget and was not parsed." = "Bu metin dosyası doğrulayıcının dosya başına metin bütçesini aştı ve ayrıştırılmadı."
"Split large definition files into smaller files before validating again." = "Yeniden doğrulamadan önce büyük tanım dosyalarını daha küçük dosyalara böl."

"Model texture: textures {names} are missing." = "Model dokusu: {names} dokuları eksik."
"{whats}: {what} is an empty file here, which blanks it out: nothing of it is read." = "{whats}: {what} burada boş bir dosya, bu da onu boşaltır: hiçbir şeyi okunmaz."
"{whats}: {what} is missing." = "{whats}: {what} eksik."
"Referenced weapon explosions require at least {texels} padded sprite texels, beyond a {side} x {side} reference atlas, even drawn reduced. Frames will be omitted at this capacity; map features, generated effects and shelf packing need additional room." = "Başvurulan silah patlamaları, küçültülerek çizilseler bile, {side} x {side} başvuru atlasını aşan en az {texels} dolgulu sprite texeli gerektiriyor. Bu kapasitede kareler atlanacak; harita nesneleri, üretilen efektler ve raf yerleşimi ek yer ister."
"Reduce explosion frame sizes/counts or split optional effects. Test on the target GPU; this static check uses a reference atlas size." = "Patlama karesi boyutlarını/sayılarını azalt ya da isteğe bağlı efektleri böl. Hedef ekran kartında dene; bu statik denetim bir başvuru atlas boyutu kullanır."
"{what} has no frames or contains a frame larger than the {side}-pixel reference atlas side including padding." = "{what} içinde kare yok ya da dolgu dahil {side} piksellik başvuru atlas kenarından büyük bir kare var."
"Include usable frames and resize oversized animation frames." = "Kullanılabilir kareler ekle ve fazla büyük animasyon karelerini yeniden boyutlandır."
"{name} ({px} px)" = "{name} ({px} px)"
"{n} more" = "{n} daha"
"The weapons' explosions take {full} Mi texels as painted, more than the {budget} Mi the game gives them in a {side} x {side} atlas: {n} of them, larger than TA's own, are drawn reduced to {share}% of their texels across, each as big as painted ({named})." = "Silah patlamaları çizildiği gibi {full} Mi texel tutuyor; oyunun onlara {side} x {side} atlasta verdiği {budget} Mi'yi aşıyor: TA'nınkilerden büyük olan {n} tanesi enine texellerinin %{share}'ine küçültülerek çiziliyor, her biri çizildiği kadar büyük ({named})."
"Nothing to do: the game draws them so. Smaller paintings would keep more of their detail." = "Yapılacak bir şey yok: oyun onları böyle çizer. Daha küçük resimler ayrıntılarının daha çoğunu korurdu."
"Large: {frames} frames up to {largest} pixels across, {millions} million pixels in all, more than the game decodes at once. It reads them a frame at a time and draws them reduced, each as big as painted: a weapon's explosion is read so." = "Büyük: enine {largest} piksele kadar {frames} kare, toplam {millions} milyon piksel; oyunun tek seferde çözdüğünden fazla. Onları kare kare okur ve küçültülmüş çizer, her biri çizildiği kadar büyük: bir silahın patlaması böyle okunur."
"Nothing to do: the game draws it so. Smaller paintings would load faster and keep more of their detail." = "Yapılacak bir şey yok: oyun onu böyle çizer. Daha küçük resimler daha hızlı yüklenir ve ayrıntılarının daha çoğunu korurdu."
"Build lists for the computer players (TA 3.1's [CANBUILD]). Builders: {builders}; entries: {entries}." = "Bilgisayar oyuncuları için inşa listeleri (TA 3.1'in [CANBUILD] bölümü). İnşaatçılar: {builders}; girdiler: {entries}."
"Computer players build from them. Build menus offer what the mod's menu pages and download lists put on them, as TA's did: what only these lists name is the computer players' alone." = "Bilgisayar oyuncuları bunlara göre inşa eder. İnşa menüleri, TA'da olduğu gibi, modun menü sayfalarının ve indirme listelerinin onlara koyduklarını sunar: yalnızca bu listelerde adı geçenler bilgisayar oyuncularına özgüdür."
"Side panels laid out for a screen {height} pixels tall, as the patched engines of later years drew them (TA's are 480). Pages: {pages}." = "{height} piksel yüksekliğinde bir ekran için düzenlenmiş yan paneller; sonraki yılların yamalı motorları onları böyle çiziyordu (TA'nınkiler 480). Sayfalar: {pages}."
"The classic interface lays them out as the mod does: its build places, page arrows and orders where the mod puts them." = "Klasik arayüz onları modun düzenlediği gibi yerleştirir: inşa yuvaları, sayfa okları ve emirler modun koyduğu yerdedir."
"Build buttons off TA's grid of 64-pixel places: several sharing a place, or one taking several. Buttons: {buttons}; pages: {pages}." = "TA'nın 64 piksellik yuva ızgarasına uymayan inşa düğmeleri: aynı yuvayı paylaşan birkaç düğme ya da birkaç yuvayı kaplayan tek düğme. Düğmeler: {buttons}; sayfalar: {pages}."
"The classic interface lays them out as the mod does, and a click builds the unit of the button under it. The modern interface shows a place several buttons share as one picture, its parts marked." = "Klasik arayüz onları modun düzenlediği gibi yerleştirir; bir tıklama, imlecin altındaki düğmenin birimini inşa eder. Modern arayüz, birkaç düğmenin paylaştığı bir yuvayı, parçaları işaretlenmiş tek bir resim olarak gösterir."
"Scripts asking the engine for unit values of TA's later patches ({values}). Scripts: {scripts}." = "Motordan TA'nın sonraki yamalarına ait birim değerlerini isteyen betikler ({values}). Betikler: {scripts}."
"TA Reborn answers them as those engines did: TA 3.1's questions about units by their IDs (69 to 75), a later patch's cloak (111)." = "TA Reborn bunları o motorlar gibi yanıtlar: TA 3.1'in birimleri kimlikleriyle sorgulayan değerleri (69 ile 75 arası) ve sonraki bir yamanın gizlenme değeri (111)."
"TA Reborn finds a weapon by its name and never reads its ID: IDs make no difference here." = "TA Reborn bir silahı adıyla bulur ve kimliğini hiç okumaz: kimlikler burada fark yaratmaz."
"Weapon IDs past 255, the highest TA's own engine numbered (the weapon patches of later years went further). Weapons: {n}; the highest ID: {max}." = "255'i aşan silah kimlikleri; TA'nın kendi motorunun verdiği en yüksek numara 255'ti (sonraki yılların silah yamaları daha ileri gitti). Silahlar: {n}; en yüksek kimlik: {max}."
"Weapons sharing an ID with another weapon: {names}." = "Kimliği başka bir silahınkiyle aynı olan silahlar: {names}."
"Sides of its own: {names}." = "Kendi tarafları: {names}."
"Offered with the others when a skirmish or a multiplayer battle is set up." = "Bir çatışma ya da çok oyunculu savaş hazırlanırken diğerleriyle birlikte sunulur."
"Campaigns of its own: {n}." = "Kendi seferleri: {n}."
"Played from the campaign screen, with TA's own." = "Sefer ekranından, TA'nın kendi seferleriyle birlikte oynanır."
"Files for TA's own computer players (ai/): {n}." = "TA'nın kendi bilgisayar oyuncularına ait dosyalar (ai/): {n}."
"Not used: TA Reborn's computer players are its own. They build from the mod's build lists and menus." = "Kullanılmaz: TA Reborn'un kendi bilgisayar oyuncuları vardır. Bunlar modun inşa listelerine ve menülerine göre inşa eder."
"Programs and engine patches: {names}." = "Programlar ve motor yamaları: {names}."
"Not used: TA Reborn runs no program a mod brings. What a patch changed in TA's engine is there only where TA Reborn plays it itself, as told here." = "Kullanılmaz: TA Reborn, bir modun getirdiği hiçbir programı çalıştırmaz. Bir yamanın TA'nın motorunda değiştirdikleri yalnızca TA Reborn'un bunları kendisinin oynattığı yerlerde vardır; burada anlatıldığı gibi."
"This file is empty: TA's way of blanking out a file of the same name below it (the original game's, or that of a mod it is mounted over). The game reads nothing from it." = "Bu dosya boş: TA'da altındaki aynı adlı bir dosyayı (orijinal oyunun ya da üzerine bindiği bir modun dosyasını) boşaltmanın yolu budur. Oyun ondan hiçbir şey okumaz."
"{n} empty files here ({files}): TA's way of blanking out files of the same names below them (the original game's, or those of a mod they are mounted over). The game reads nothing from them." = "Burada {n} boş dosya var ({files}): TA'da altlarındaki aynı adlı dosyaları (orijinal oyunun ya da üzerine bindikleri bir modun dosyalarını) boşaltmanın yolu budur. Oyun onlardan hiçbir şey okumaz."
"Nothing to do if they are meant to remove those files. If one should hold data, export it again." = "Amaç o dosyaları kaldırmaksa yapılacak bir şey yok. Biri veri içermeliyse onu yeniden dışa aktar."
"Texture {name} has {frames} frames; Reborn's model vertices address at most 255 and this entry uses fallback paint." = "{name} dokusunda {frames} kare var; Reborn'un model köşeleri en çok 255 kareyi adresler ve bu girdi yedek boya kullanır."
"Reduce this texture entry to at most 255 frames." = "Bu doku girdisini en çok 255 kareye düşür."
"Texture {name} ({frames} frames) falls back: the textures the models paint with fill the reference GPU profile's {banks} arrays of {layers} layers ({before} layers before it; one is reserved for fallback). Actual device limits may differ." = "{name} dokusu ({frames} kare) yedeğe düşer: modellerin boyandığı dokular, başvuru ekran kartı profilinin {layers} katmanlı {banks} dizisini dolduruyor (ondan önce {before} katman; biri yedek için ayrılmış). Gerçek aygıt sınırları farklı olabilir."
"Consolidate duplicate textures or reduce animation/team frame counts. Test on the target GPU; higher limits do not fix unsupported frame counts." = "Yinelenen dokuları birleştir ya da animasyon/takım kare sayılarını azalt. Hedef ekran kartında dene; daha yüksek sınırlar desteklenmeyen kare sayılarını düzeltmez."
"{script} declares piece {piece}, which is absent from {model}. Any animation or position query using it has no matching model part." = "{script} {piece} parçasını bildiriyor, ama o {model} içinde yok. Onu kullanan her animasyonun veya konum sorgusunun eşleşen bir model parçası yok."
"{script} declares pieces {pieces}, which are absent from {model}. Any animation or position query using them has no matching model part." = "{script} {pieces} parçalarını bildiriyor, ama onlar {model} içinde yok. Onları kullanan her animasyonun veya konum sorgusunun eşleşen bir model parçası yok."
"Confirm that these are intentional virtual/helper pieces; otherwise use matching model and COB files or align the BOS piece declarations with the model's piece names." = "Bunların bilerek konmuş sanal/yardımcı parçalar olduğunu doğrula; değilse eşleşen model ve COB dosyalarını kullan ya da BOS parça bildirimlerini modelin parça adlarıyla hizala."
"{unit} has {weapon} but its script {script} has no {function}: if the weapon fires, its shots leave from the unit's centre, not a barrel." = "{unit} biriminde {weapon} var, ama {script} betiğinde {function} yok: silah ateş ederse atışlar bir namludan değil, birimin merkezinden çıkar."
"{unit} has {weapons} but its script {script} has no {functions}: if they fire, their shots leave from the unit's centre, not a barrel." = "{unit} biriminde {weapons} var, ama {script} betiğinde {functions} yok: ateş ederlerse atışlar bir namludan değil, birimin merkezinden çıkar."
"Add the functions to the unit's BOS script, returning the pieces the shots leave from, and recompile." = "Fonksiyonları birimin BOS betiğine ekle, atışların çıktığı parçaları döndürsünler, ve yeniden derle."
"{unit} builds but its script {script} has no QueryNanoPiece: its build spray comes from the unit's centre." = "{unit} inşa ediyor, ama {script} betiğinde QueryNanoPiece yok: inşa püskürtmesi birimin merkezinden çıkar."
"Add QueryNanoPiece to the unit's BOS script, returning its nano-lathe piece, and recompile." = "QueryNanoPiece'i birimin BOS betiğine ekle, nano torna parçasını döndürsün, ve yeniden derle."
"{unit} can be built but has no picture ({picture}): TA's classic panels and the encyclopaedia show none; Reborn's own panel draws one from its model." = "{unit} inşa edilebiliyor ama resmi yok ({picture}): TA'nın klasik panelleri ve ansiklopedi resim göstermez; Reborn'un kendi paneli modelinden bir resim çizer."
"Add a 64 × 64 PCX of the unit to unitpics/." = "Birimin 64 × 64 boyutunda bir PCX dosyasını unitpics/ klasörüne ekle."
"Re-export this asset in the original TA format, within Reborn's documented parser limits; replace truncated or corrupt files." = "Bu varlığı orijinal TA biçiminde, Reborn'un belgelenmiş ayrıştırıcı sınırları içinde yeniden dışa aktar; kesik veya bozuk dosyaları değiştir."
"The game cannot read this file: {error}" = "Oyun bu dosyayı okuyamıyor: {error}"
"The section name [{name} has no closing ]." = "[{name} bölüm adının kapanış ] işareti yok."
"[{name}] has no { } body after it: what follows is read into the section around it." = "[{name}] sonrasında { } gövdesi yok: sonrasında gelen, çevresindeki bölümün içine okunur."
"This } closes no section." = "Bu } hiçbir bölümü kapatmıyor."
"A { opened on this line is never closed." = "Bu satırda açılan { hiç kapatılmıyor."
"[{name}] opened on this line is never closed: any section after it is read as part of it." = "Bu satırda açılan [{name}] hiç kapatılmıyor: sonrasındaki her bölüm onun parçası olarak okunur."
"A /* comment opened on this line never ends: the rest of the file is read as a comment." = "Bu satırda açılan /* yorumu hiç bitmiyor: dosyanın geri kalanı yorum olarak okunur."


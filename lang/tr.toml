"Iron Rain" = "Demir Yağmur"
"Two Intimidators are shelling your base. Take the mesa and silence them." = "İki Intimidator üssünü bombalıyor. Platoyu al ve onları sustur."
"Commander, the Core has hauled two Intimidators, its long-range plasma cannons, onto the mesas in the middle of the canyon. Your base is inside their range. Every eight seconds each of them will put a shell among your buildings, until you silence them.\n\nThe battery is dug in behind heavy laser towers and a Punisher, with tanks on the ramps, and the Core's main base lies beyond it, to the south-east. Its Commander will send what it can.\n\nSpread out, build fast and take that mesa. Destroy both Intimidators." = "Komutan, Core uzun menzilli plazma topları olan iki Intimidator'ı kanyonun ortasındaki platolara çıkardı. Üssün menzillerinin içinde. Sen onları susturana kadar her sekiz saniyede bir her biri binalarının arasına bir mermi düşürecek.\n\nBatarya ağır lazer kulelerinin ve bir Punisher'ın arkasına mevzilenmiş, rampalarda tanklar var ve Core'un ana üssü onun ötesinde, güneydoğuda. Komutanı gönderebildiği her şeyi gönderecek.\n\nDağıl, hızlı inşa et ve o platoyu al. İki Intimidator'ı da yok et."
"Commander, two Intimidators on the mesas have your range. Every eight seconds each of them will put a shell into your base." = "Komutan, platolardaki iki Intimidator üssünü menziline aldı. Her sekiz saniyede bir her biri üssüne bir mermi düşürecek."
"A Core radar post in the canyon to the south-east is spotting for those guns. Knock it out and they can no longer see your base." = "Güneydoğudaki kanyonda bulunan bir Core radar karakolu o toplara hedef gösteriyor. Onu yok et, üssünü artık göremezler."
"Spread your buildings out: a shell that lands among them takes them all." = "Binalarını dağıt: aralarına düşen bir mermi hepsini götürür."
"Their gunners have your range now. Take that mesa, Commander!" = "Topçuları menzili tutturdu. O platoyu al, Komutan!"

# apps/ta_game/scenarios/king_of_the_hill.toml
"King of the Hill" = "Tepenin Kralı"
"Hold the summit for four minutes before the Core does." = "Zirveyi Core'dan önce dört dakika boyunca tut."
"Commander, the spiral mountain at the heart of this plain is rich in metal, and whoever holds its summit holds the planet. A Core Commander has landed to the north with the same idea.\n\nTake the summit and keep it: four minutes in all with only your forces on top wins it. Contested, the clock stands still. If the Core holds it alone for four minutes, the mountain is theirs.\n\nThe Core will keep sending troops up the slopes. Build up, get there first, and dig in." = "Komutan, bu ovanın kalbindeki sarmal dağ metal bakımından zengin ve zirvesini tutan gezegeni tutar. Bir Core Komutanı aynı niyetle kuzeye indi.\n\nZirveyi al ve elinde tut: tepede yalnızca senin kuvvetlerinin bulunduğu toplam dört dakika zaferi getirir. Zirve çekişmeliyken saat durur. Core orayı tek başına dört dakika tutarsa dağ onlarındır.\n\nCore yamaçlardan durmadan birlik gönderecek. Güçlen, oraya önce sen var ve siper kaz."
"Core troops are climbing the north slope. Don't let them dig in on the summit." = "Core birlikleri kuzey yamacına tırmanıyor. Zirveye mevzilenmelerine izin verme."
"Raiders are coming round the mountain for your base." = "Baskıncılar dağın etrafından dolaşıp üssüne geliyor."

# apps/ta_game/scenarios/last_stand.toml
"Last Stand" = "Son Direniş"
"Hold the pass for twelve minutes. They will not stop coming." = "Geçidi on iki dakika tut. Gelmeyi bırakmayacaklar."
"Commander, the Core has broken through at Varrin Gap. The only way into the valley behind you is the winding pass ahead, and your outpost at its western mouth is all that stands in the way.\n\nReinforcements are twelve minutes out. Hold until they arrive. Core forces will come through the pass in waves, each heavier than the last; expect bombers, and expect worse at the end: our scouts have seen something very large moving in the east.\n\nYou have a small base, a kbot lab and two construction kbots. Build what you can. Keep your Commander alive." = "Komutan, Core, Varrin Boğazı'nda hattı yardı. Arkandaki vadiye giden tek yol öndeki dolambaçlı geçit ve önlerinde duran tek şey, geçidin batı ağzındaki karakolun.\n\nTakviyelerin gelmesine on iki dakika var. Gelene dek dayan. Core kuvvetleri geçitten dalgalar hâlinde gelecek, her biri bir öncekinden ağır; bombardıman uçakları bekle, sonunda daha kötüsünü de: keşif birliklerimiz doğuda çok büyük bir şeyin hareket ettiğini gördü.\n\nKüçük bir üssün, bir kbot laboratuvarın ve iki inşaat kbotun var. Ne yapabilirsen yap. Komutanını hayatta tut."
"Outpost, this is Arm Command. The relief force is twelve minutes out. Nothing gets through that pass before it arrives." = "Karakol, burası Arm Komutanlığı. Takviye kuvvetler on iki dakika uzakta. Onlar gelmeden hiçbir şey o geçitten geçmeyecek."
"Radar: aircraft inbound from the east. Bombers! Get your anti-air up." = "Radar: doğudan uçaklar yaklaşıyor. Bombardıman uçakları! Hava savunmanı kur."
"Seismic contact in the pass. It's the big one, Commander: a Krogoth." = "Geçitte sismik temas. Büyük olan bu, Komutan: bir Krogoth."
"One minute! The relief force is entering the valley." = "Bir dakika! Takviye kuvvetler vadiye giriyor."

# apps/ta_game/scenarios/metal_rush.toml
"The first to make 15,000 metal wins. The Core plays rough." = "15.000 metal üreten ilk taraf kazanır. Core sert oynar."
"Commander, the mining rights to this planet go to whoever proves they can work it: the first side to extract fifteen thousand metal wins it outright.\n\nThe Core is racing you from the western plateau, and the Core has never been known to race fair. Expect raids on your extractors. Build fast, protect your economy, and if you can, take theirs apart.\n\nMetal makers count. Reclaimed metal counts. Whatever you make, counts." = "Komutan, bu gezegenin maden hakları onu işletebileceğini kanıtlayana verilecek: on beş bin metal çıkaran ilk taraf hakkı doğrudan kazanır.\n\nCore batı platosundan seninle yarışıyor ve Core'un adil yarıştığı hiç görülmedi. Çıkarıcılarına baskın bekle. Hızlı inşa et, ekonomini koru ve elinden gelirse onlarınkini parçala.\n\nMetal üreticiler sayılır. Geri kazanılan metal sayılır. Ne üretirsen sayılır."

# apps/ta_game/scenarios/titans.toml
"Titans" = "Titanlar"
"Three Krogoths are walking toward your base. Bring them down." = "Üç Krogoth üssüne doğru yürüyor. Onları devir."
"Commander, seismic stations round the basin are reading footfalls: three Krogoths, the Core's walking fortresses, are crossing the salt pans toward your base, one after another, each with an escort.\n\nNothing out there can stop them but you. A Krogoth's head laser reaches further than your D-gun, so keep your Commander back. Bombers, artillery and massed Zeus will bring one down. Lose your nerve and it will walk through your base.\n\nYou have a base with three factories, four construction kbots and a garrison. Destroy all three of them." = "Komutan, havzanın çevresindeki sismik istasyonlar ayak sesleri kaydediyor: Core'un yürüyen kaleleri olan üç Krogoth, her biri eskortuyla, birbiri ardına tuz düzlüklerini geçerek üssüne doğru geliyor.\n\nOrada onları senden başka hiçbir şey durduramaz. Bir Krogoth'un baş lazeri senin D-gun'ından daha uzağa erişir, Komutanını geride tut. Bombardıman uçakları, topçu ve kitle halinde Zeus'lar birini devirir. Soğukkanlılığını kaybedersen üssünün içinden geçip gider.\n\nÜç fabrikası, dört inşaat kbotu ve bir garnizonu olan bir üssün var. Üçünü de yok et."
"Commander, seismic stations are reading footfalls round the basin. Three Krogoths are walking toward your base, one after another." = "Komutan, sismik istasyonlar havzanın çevresinde ayak sesleri kaydediyor. Üç Krogoth birbiri ardına üssüne doğru yürüyor."
"The first Krogoth has crossed the north-western rim. It is coming straight for you." = "İlk Krogoth kuzeybatı kenarını geçti. Doğruca sana geliyor."
"Keep your Commander back: that head laser reaches further than your D-gun." = "Komutanını geride tut: o baş lazeri D-gun'ından daha uzağa erişir."
"The second Krogoth is through the northern pass, with rockets and anti-air round it." = "İkinci Krogoth kuzey geçidini aştı, etrafında roketler ve hava savunması var."
"The last of them, out of the north-east, with the heaviest escort yet. End this, Commander." = "Sonuncusu kuzeydoğudan, şimdiye kadarki en ağır eskortla geliyor. Bitir şu işi, Komutan."

# apps/ta_game/scenarios/until_dawn.toml
"Until Dawn" = "Şafağa Kadar"
"Night falls on the timber. Hold your ridge until the sun comes up." = "Ormana gece çöküyor. Güneş doğana kadar sırtını tut."
"Commander, night is falling over Timberline, and the Core is moving through the forest under it. Your outpost holds the western ridge: the only road out of the valley runs past it.\n\nThe relief column cannot move before first light. Until then you are on your own. In the dark and the rain their raiders will be on you before you see them, so build radar, and keep your floodlights burning.\n\nYou have a small base, a kbot lab and two construction kbots. Hold until dawn, and keep your Commander alive." = "Komutan, Timberline'a gece çöküyor ve Core karanlığın örtüsü altında ormanda ilerliyor. İleri karakolun batı sırtını tutuyor: vadiden çıkan tek yol onun önünden geçiyor.\n\nYardım kolu ilk ışıktan önce yola çıkamaz. O zamana kadar yalnızsın. Karanlıkta ve yağmurda baskıncıları sen onları görmeden üzerine çullanacak; radar kur ve projektörlerini yanık tut.\n\nKüçük bir üssün, bir Kbot Lab'in ve iki inşaat kbotun var. Şafağa kadar dayan ve Komutanını hayatta tut."
"Outpost Echo, the Core is moving through the timber tonight. Hold your ridge until first light: the relief column marches at dawn." = "Eko karakolu, Core bu gece ormandan geçiyor. İlk ışığa kadar sırtı tutun: yardım kolu şafakta yola çıkıyor."
"Raiders in the eastern trees. In this rain you will hear them before you see them." = "Doğu ormanında baskıncılar. Bu yağmurda onları görmeden önce duyacaksın."
"Pyros in the north-eastern woods. Keep them out of the trees round your base: the timber will burn." = "Kuzeydoğu ormanında Pyro'lar var. Onları üssünün etrafındaki ağaçlardan uzak tut: orman yanacak."
"A convoy got through from the south-west. Four Zeus and two Jethros are yours, Commander." = "Bir konvoy güneybatıdan geçmeyi başardı. Dört Zeus ve iki Jethro artık senin, Komutan."
"Seismic contact in the south-east: heavy treads. They are saving the worst for the last hours of the night." = "Güneydoğuda sismik temas: ağır paletler. En kötüsünü gecenin son saatlerine saklıyorlar."
"Sunrise in one minute. The relief column is at the river. Hold on!" = "Gün doğumuna bir dakika. Yardım kolu nehirde. Dayanın!"


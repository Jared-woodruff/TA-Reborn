# apps/ta_game/src/coach.rs
"Your Commander is badly hurt! Pull it back out of the fight: losing it usually loses the battle." = "Komutanın ağır hasar aldı! Onu çarpışmadan geri çek: Komutanını kaybedersen genellikle savaşı da kaybedersin."
"Energy is running out, and everything builds more slowly. Build Solar Collectors or Wind Generators, and build less at once until it recovers." = "Enerji tükeniyor ve her şey daha yavaş inşa ediliyor. Güneş toplayıcısı ya da rüzgâr jeneratörü kur; enerji toparlanana dek aynı anda daha az şey inşa et."
"Metal is running out, and everything builds more slowly. Put Metal Extractors on more deposits ({area_mex} takes a whole area), or reclaim wrecks and rocks ({reclaim})." = "Metal tükeniyor ve her şey daha yavaş inşa ediliyor. Daha çok yatağa metal çıkarıcı kur ({area_mex} tuşu bütün bir alana kurar) ya da enkazları ve kayaları geri kazan ({reclaim})."
"No factory yet: factories make your army. Your Commander can build a Kbot Lab or a Vehicle Plant." = "Henüz fabrika yok: ordunu fabrikalar üretir. Komutanın bir Kbot Lab ya da Vehicle Plant inşa edebilir."
"A factory has nothing to build. {idle_factory} selects it: queue some units, and turn on Repeat to keep it busy." = "Bir fabrikanın inşa edecek bir şeyi yok. {idle_factory} tuşu onu seçer: sıraya birkaç birim koy ve boşta kalmasın diye Yinele seçeneğini aç."
"Builders stand idle. {idle_builder} selects the next one: give it something to build, or send it to help a factory ({guard})." = "İnşaatçılar boşta bekliyor. {idle_builder} tuşu sonrakini seçer: ona inşa edecek bir şey ver ya da bir fabrikaya yardıma gönder ({guard})."
"Your metal store is full, so new metal goes to waste. Spend it: another factory, more builders, more units." = "Metal depon dolu, bu yüzden gelen metal boşa gidiyor. Harca: bir fabrika daha, daha çok inşaatçı, daha çok birim."
"COACH" = "KOÇ"
"Put it away (the coach can be turned off in Options, Gameplay)" = "Gizle (koçu Ayarlar, Oynanış bölümünden kapatabilirsin)"
"Don't show this advice again" = "Bu tavsiyeyi bir daha gösterme"


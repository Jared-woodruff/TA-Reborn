# apps/ta_game/src/conquest_ui/setup.rs
"Every system is a battlefield held by the enemy. Attack the systems next to yours; the nearer their capital, the harder they fight, and only those near yours are charted. Units that earn a rank come back as veterans and follow your Commander into the next battle. Every system you hold brings more metal and energy to the start of each fight, and a reward of its own: mines, reactors, a tank plant, an airfield, a war college, a sensor array or a supply depot. The enemy strikes back at what you take. Take the enemy capital to win." = "Her sistem düşmanın elindeki bir savaş alanıdır. Seninkilere komşu sistemlere saldır; başkentlerine ne kadar yakınsa o kadar sert savaşırlar ve yalnızca seninkilerin yakınındakiler keşfedilmiştir. Rütbe kazanan birimler kıdemli olarak döner ve Komutanını bir sonraki savaşa izler. Elindeki her sistem her savaşın başına daha fazla metal ve enerji getirir, ayrıca kendine özgü bir ödül sağlar: madenler, reaktörler, bir tank fabrikası, bir hava üssü, bir harp akademisi, bir sensör dizisi ya da bir ikmal deposu. Düşman, ele geçirdiğin sistemlere karşı saldırıya geçer. Kazanmak için düşman başkentini ele geçir."

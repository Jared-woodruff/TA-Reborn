# apps/ta_game/src/conquest_ui/setup.rs
"Every system is a battlefield held by the enemy. Attack the systems next to yours; the nearer their capital, the harder they fight, and only those near yours are charted. Units that earn a rank come back as veterans and follow your Commander into the next battle. Every system you hold brings more metal and energy to the start of each fight, and a reward of its own: mines, reactors, a tank plant, an airfield, a war college, a sensor array or a supply depot. The enemy strikes back at what you take. Take the enemy capital to win." = "Ogni sistema è un campo di battaglia in mano al nemico. Attacca i sistemi vicini ai tuoi; più sono vicini alla loro capitale, più duramente combattono, e solo quelli accanto ai tuoi sono mappati. Le unità che guadagnano un grado tornano come veterani e seguono il tuo Comandante nella battaglia successiva. Ogni sistema che controlli porta più metallo ed energia all'inizio di ogni scontro, e una ricompensa tutta sua: miniere, reattori, una fabbrica di carri, un aeroporto, un'accademia militare, una rete di sensori o una base logistica. Il nemico contrattacca ciò che conquisti. Conquista la capitale nemica per vincere."

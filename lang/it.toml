"Your {unit} has fallen. A fine machine, though." = "Il tuo {unit} è caduto. Un'ottima macchina, però."
"Your {unit} has been dismantled." = "Il tuo {unit} è stato smantellato."
"Large hostile unit eliminated: {unit}." = "Grossa unità ostile eliminata: {unit}."
"Your {unit} went down like a sack of bolts!" = "Il tuo {unit} è venuto giù come un sacco di bulloni!"
"Big {unit}, bigger crater!" = "Grosso il tuo {unit}, più grosso il cratere!"
"Return my {unit} at once, Commander." = "Restituisci subito il mio {unit}, Comandante."
"Stealing is beneath you, Commander." = "Rubare non è degno di te, Comandante."
"Unauthorised transfer of {unit} detected." = "Trasferimento non autorizzato di {unit} rilevato."
"Your theft has been logged." = "Il tuo furto è stato registrato."
"Hey! Give back my {unit}!" = "Ehi! Ridammi il mio {unit}!"
"Thief! That {unit} was mine!" = "Ladro! Quello era il mio {unit}!"
"You haven't won yet, Commander." = "Non hai ancora vinto, Comandante."
"The Arm fights to the last." = "L'Arm combatte fino all'ultimo."
"Production offline. Combat protocols remain." = "Produzione offline. Protocolli di combattimento ancora attivi."
"Probability of defeat rising. Ignoring." = "Probabilità di sconfitta in aumento. Ignorata."
"I've still got a few tricks left!" = "Ho ancora qualche asso nella manica!"
"Not done yet! Not even close! ...Mostly close." = "Non è ancora finita! Neanche lontanamente! ...Be', quasi."
"We meet again, Commander. Last time was yours. Not this time." = "Ci rincontriamo, Comandante. L'ultima l'hai vinta tu. Questa no."
"Commander. I've studied our last battle. Have you?" = "Comandante. Ho studiato la nostra ultima battaglia. E tu?"
"Previous defeat analysed. Countermeasures installed." = "Sconfitta precedente analizzata. Contromisure installate."
"Again, Commander. This time the outcome has been calculated." = "Di nuovo, Comandante. Questa volta l'esito è stato calcolato."
"You again! I've been practising!" = "Ancora tu! Ho fatto pratica!"
"Rematch time! I'm not going easy this time." = "È l'ora della rivincita! Stavolta non ci vado piano."
"Back for another lesson, Commander?" = "Torni per un'altra lezione, Comandante?"
"Commander. I trust you've learned something since last time." = "Comandante. Confido che tu abbia imparato qualcosa dall'ultima volta."
"You have returned. Your previous patterning was incomplete." = "Sei di nuovo qui. La tua codifica precedente era incompleta."
"Familiar opponent detected. Outcome: repeating." = "Avversario noto rilevato. Esito: replica in corso."
"You again? Didn't I beat you last time?" = "Ancora tu? Non ti avevo già battuto l'ultima volta?"
"Oh, it's you! Ready for round two?" = "Oh, sei tu! Pronto per il secondo round?"


"Map placed unit/feature" = "Unità/elemento posizionato nella mappa"
"This tolerant TDF parse contains no sections; section-based consumers ignore it." = "Questa analisi TDF tollerante non contiene sezioni; i consumatori basati sulle sezioni la ignorano."
"Check the intended format and section headers if this file should define game content." = "Controlla il formato previsto e le intestazioni di sezione se questo file dovrebbe definire contenuti di gioco."
"{what} defined here is never used: {later} ({whose}) defines it too and comes later, so the game uses that one." = "{what} definito qui non viene mai usato: {later} ({whose}) lo definisce a sua volta e viene dopo, quindi il gioco usa quello."
"{n} definitions in this file are never used: other files define them too and come later, so the game uses those (for one, {what} is also in {later}, {whose})." = "{n} definizioni in questo file non vengono mai usate: altri file le definiscono a loro volta e vengono dopo, quindi il gioco usa quelle (per esempio {what} è definito anche in {later}, {whose})."
"Replace those files in the mod (give yours their paths), or name your file so that it sorts after them." = "Sostituisci quei file nella mod (dai ai tuoi i loro percorsi), oppure dai al tuo file un nome che lo faccia venire dopo di loro."
"{name} production button" = "pulsante di produzione di {name}"
"No playable side definitions were loaded." = "Nessuna definizione di fazione giocabile è stata caricata."
"Include gamedata/sidedata.tdf or inherit the base game's valid sides." = "Includi gamedata/sidedata.tdf oppure eredita le fazioni valide del gioco di base."
"Include the referenced asset/definition, correct its name, or declare and install the required mod dependency. Names are case-insensitive." = "Includi la risorsa/definizione a cui si fa riferimento, correggine il nome, oppure dichiara e installa la dipendenza di mod richiesta. I nomi non distinguono maiuscole e minuscole."
"Model texture: textures {names} are missing." = "Texture del modello: mancano le texture {names}."
"{whats}: {what} is an empty file here, which blanks it out: nothing of it is read." = "{whats}: {what} qui è un file vuoto, che lo annulla: non ne viene letto nulla."
"{whats}: {what} is missing." = "{whats}: {what} manca."
"Referenced weapon explosions require at least {texels} padded sprite texels, beyond a {side} x {side} reference atlas, even drawn reduced. Frames will be omitted at this capacity; map features, generated effects and shelf packing need additional room." = "Le esplosioni delle armi a cui si fa riferimento richiedono almeno {texels} texel di sprite con margine, oltre un atlante di riferimento di {side} x {side}, anche se disegnate ridotte. I fotogrammi verranno omessi con questa capacità; elementi della mappa, effetti generati e impacchettamento a scaffale richiedono altro spazio."
"Reduce explosion frame sizes/counts or split optional effects. Test on the target GPU; this static check uses a reference atlas size." = "Riduci le dimensioni o il numero dei fotogrammi delle esplosioni oppure suddividi gli effetti opzionali. Prova sulla GPU di destinazione; questo controllo statico usa la dimensione di un atlante di riferimento."
"{what} has no frames or contains a frame larger than the {side}-pixel reference atlas side including padding." = "{what} non ha fotogrammi o contiene un fotogramma più grande del lato di {side} pixel dell'atlante di riferimento, margine incluso."
"Include usable frames and resize oversized animation frames." = "Includi fotogrammi utilizzabili e ridimensiona i fotogrammi di animazione troppo grandi."
"{name} ({px} px)" = "{name} ({px} px)"
"{n} more" = "altri {n}"
"The weapons' explosions take {full} Mi texels as painted, more than the {budget} Mi the game gives them in a {side} x {side} atlas: {n} of them, larger than TA's own, are drawn reduced to {share}% of their texels across, each as big as painted ({named})." = "Le esplosioni delle armi occupano {full} Mi texel così come sono disegnate, più dei {budget} Mi che il gioco assegna loro in un atlante di {side} x {side}: {n} di esse, più grandi di quelle originali di TA, vengono disegnate ridotte al {share}% dei loro texel in larghezza, ciascuna grande quanto disegnata ({named})."
"Nothing to do: the game draws them so. Smaller paintings would keep more of their detail." = "Non devi fare nulla: il gioco le disegna così. Disegni più piccoli manterrebbero più dettaglio."
"Large: {frames} frames up to {largest} pixels across, {millions} million pixels in all, more than the game decodes at once. It reads them a frame at a time and draws them reduced, each as big as painted: a weapon's explosion is read so." = "Grande: {frames} fotogrammi fino a {largest} pixel di larghezza, {millions} milioni di pixel in tutto, più di quanti il gioco ne decodifichi in una volta. Li legge un fotogramma alla volta e li disegna ridotti, ciascuno grande quanto disegnato: l'esplosione di un'arma viene letta così."
"Nothing to do: the game draws it so. Smaller paintings would load faster and keep more of their detail." = "Non devi fare nulla: il gioco la disegna così. Disegni più piccoli si caricherebbero più in fretta e manterrebbero più dettaglio."
"Build lists for the computer players (TA 3.1's [CANBUILD]). Builders: {builders}; entries: {entries}." = "Liste di costruzione per i giocatori computer (il [CANBUILD] di TA 3.1). Costruttori: {builders}; voci: {entries}."
"Computer players build from them. Build menus offer what the mod's menu pages and download lists put on them, as TA's did: what only these lists name is the computer players' alone." = "I giocatori computer costruiscono in base a esse. I menu di costruzione offrono ciò che vi mettono le pagine dei menu e le liste di download della mod, come facevano quelli di TA: ciò che nominano solo queste liste è riservato ai giocatori computer."
"Side panels laid out for a screen {height} pixels tall, as the patched engines of later years drew them (TA's are 480). Pages: {pages}." = "Pannelli laterali disposti per uno schermo alto {height} pixel, come li disegnavano i motori con le patch degli anni successivi (quelli di TA sono alti 480). Pagine: {pages}."
"The classic interface lays them out as the mod does: its build places, page arrows and orders where the mod puts them." = "L'interfaccia classica li dispone come fa la mod: le caselle di costruzione, le frecce di pagina e gli ordini dove li mette la mod."
"Build buttons off TA's grid of 64-pixel places: several sharing a place, or one taking several. Buttons: {buttons}; pages: {pages}." = "Pulsanti di costruzione fuori dalla griglia di caselle da 64 pixel di TA: più pulsanti in una stessa casella, o uno che ne occupa diverse. Pulsanti: {buttons}; pagine: {pages}."
"The classic interface lays them out as the mod does, and a click builds the unit of the button under it. The modern interface shows a place several buttons share as one picture, its parts marked." = "L'interfaccia classica li dispone come fa la mod, e un clic costruisce l'unità del pulsante sotto il cursore. L'interfaccia moderna mostra una casella condivisa da più pulsanti come un'unica immagine, con le sue parti segnate."
"Scripts asking the engine for unit values of TA's later patches ({values}). Scripts: {scripts}." = "Script che chiedono al motore valori di unità delle patch successive di TA ({values}). Script: {scripts}."
"TA Reborn answers them as those engines did: TA 3.1's questions about units by their IDs (69 to 75), a later patch's cloak (111)." = "TA Reborn risponde loro come facevano quei motori: le domande di TA 3.1 sulle unità indicate dal loro ID (da 69 a 75), l'occultamento di una patch successiva (111)."
"TA Reborn finds a weapon by its name and never reads its ID: IDs make no difference here." = "TA Reborn trova un'arma dal suo nome e non ne legge mai l'ID: qui gli ID non fanno differenza."
"Weapon IDs past 255, the highest TA's own engine numbered (the weapon patches of later years went further). Weapons: {n}; the highest ID: {max}." = "ID delle armi oltre 255, il massimo che numerava il motore originale di TA (le patch delle armi degli anni successivi andavano oltre). Armi: {n}; ID più alto: {max}."
"Weapons sharing an ID with another weapon: {names}." = "Armi con lo stesso ID di un'altra arma: {names}."
"Sides of its own: {names}." = "Fazioni proprie della mod: {names}."
"Offered with the others when a skirmish or a multiplayer battle is set up." = "Offerte con le altre quando si prepara una schermaglia o una battaglia multigiocatore."
"Campaigns of its own: {n}." = "Campagne proprie della mod: {n}."
"Played from the campaign screen, with TA's own." = "Si giocano dalla schermata delle campagne, insieme a quelle di TA."
"Files for TA's own computer players (ai/): {n}." = "File per i giocatori computer originali di TA (ai/): {n}."
"Not used: TA Reborn's computer players are its own. They build from the mod's build lists and menus." = "Non usati: TA Reborn ha giocatori computer propri. Costruiscono in base alle liste di costruzione e ai menu della mod."
"Programs and engine patches: {names}." = "Programmi e patch del motore: {names}."
"Not used: TA Reborn runs no program a mod brings. What a patch changed in TA's engine is there only where TA Reborn plays it itself, as told here." = "Non usati: TA Reborn non esegue alcun programma portato da una mod. Ciò che una patch cambiava nel motore di TA c'è solo dove TA Reborn lo riproduce da sé, come indicato qui."
"This file is empty: TA's way of blanking out a file of the same name below it (the original game's, or that of a mod it is mounted over). The game reads nothing from it." = "Questo file è vuoto: è il modo di TA per annullare un file con lo stesso nome più in basso (quello del gioco originale, o di una mod sotto cui è montato). Il gioco non ne legge nulla."
"{n} empty files here ({files}): TA's way of blanking out files of the same names below them (the original game's, or those of a mod they are mounted over). The game reads nothing from them." = "{n} file vuoti qui ({files}): è il modo di TA per annullare file con gli stessi nomi più in basso (quelli del gioco originale, o di una mod sotto cui sono montati). Il gioco non ne legge nulla."
"Nothing to do if they are meant to remove those files. If one should hold data, export it again." = "Non devi fare nulla se servono a rimuovere quei file. Se uno dovrebbe contenere dati, esportalo di nuovo."
"Texture {name} has {frames} frames; Reborn's model vertices address at most 255 and this entry uses fallback paint." = "La texture {name} ha {frames} fotogrammi; i vertici dei modelli di Reborn ne indirizzano al massimo 255 e questa voce usa la pittura di ripiego."
"Reduce this texture entry to at most 255 frames." = "Riduci questa voce di texture a un massimo di 255 fotogrammi."
"Texture {name} ({frames} frames) falls back: the textures the models paint with fill the reference GPU profile's {banks} arrays of {layers} layers ({before} layers before it; one is reserved for fallback). Actual device limits may differ." = "La texture {name} ({frames} fotogrammi) passa al ripiego: le texture con cui si dipingono i modelli riempiono i {banks} array di {layers} livelli del profilo GPU di riferimento ({before} livelli prima di essa; uno è riservato al ripiego). I limiti effettivi del dispositivo possono differire."
"Consolidate duplicate textures or reduce animation/team frame counts. Test on the target GPU; higher limits do not fix unsupported frame counts." = "Unifica le texture duplicate oppure riduci il numero di fotogrammi di animazione/squadra. Prova sulla GPU di destinazione; limiti più alti non risolvono i numeri di fotogrammi non supportati."
"{script} declares piece {piece}, which is absent from {model}. Any animation or position query using it has no matching model part." = "{script} dichiara il pezzo {piece}, assente da {model}. Qualsiasi animazione o interrogazione di posizione che lo usi non ha una parte del modello corrispondente."
"{script} declares pieces {pieces}, which are absent from {model}. Any animation or position query using them has no matching model part." = "{script} dichiara i pezzi {pieces}, assenti da {model}. Qualsiasi animazione o interrogazione di posizione che li usi non ha una parte del modello corrispondente."
"Confirm that these are intentional virtual/helper pieces; otherwise use matching model and COB files or align the BOS piece declarations with the model's piece names." = "Conferma che siano pezzi virtuali/ausiliari voluti; altrimenti usa file di modello e COB corrispondenti oppure allinea le dichiarazioni dei pezzi del BOS ai nomi dei pezzi del modello."
"{unit} has {weapon} but its script {script} has no {function}: if the weapon fires, its shots leave from the unit's centre, not a barrel." = "{unit} ha {weapon} ma il suo script {script} non ha {function}: se l'arma spara, i colpi partono dal centro dell'unità, non da una canna."
"{unit} has {weapons} but its script {script} has no {functions}: if they fire, their shots leave from the unit's centre, not a barrel." = "{unit} ha {weapons} ma il suo script {script} non ha {functions}: se sparano, i loro colpi partono dal centro dell'unità, non da una canna."
"Add the functions to the unit's BOS script, returning the pieces the shots leave from, and recompile." = "Aggiungi le funzioni allo script BOS dell'unità, restituendo i pezzi da cui partono i colpi, e ricompila."
"{unit} builds but its script {script} has no QueryNanoPiece: its build spray comes from the unit's centre." = "{unit} costruisce ma il suo script {script} non ha QueryNanoPiece: il suo spruzzo di costruzione parte dal centro dell'unità."
"Add QueryNanoPiece to the unit's BOS script, returning its nano-lathe piece, and recompile." = "Aggiungi QueryNanoPiece allo script BOS dell'unità, restituendo il suo pezzo del nanotornio, e ricompila."
"{unit} can be built but has no picture ({picture}): TA's classic panels and the encyclopaedia show none; Reborn's own panel draws one from its model." = "{unit} può essere costruita ma non ha immagine ({picture}): i pannelli classici di TA e l'enciclopedia non ne mostrano; il pannello di Reborn ne disegna una dal suo modello."
"Add a 64 × 64 PCX of the unit to unitpics/." = "Aggiungi un PCX 64 × 64 dell'unità a unitpics/."
"Re-export this asset in the original TA format, within Reborn's documented parser limits; replace truncated or corrupt files." = "Riesporta questa risorsa nel formato TA originale, entro i limiti documentati del parser di Reborn; sostituisci i file troncati o danneggiati."
"The game cannot read this file: {error}" = "Il gioco non può leggere questo file: {error}"
"The section name [{name} has no closing ]." = "Il nome di sezione [{name} non ha la ] di chiusura."
"[{name}] has no { } body after it: what follows is read into the section around it." = "[{name}] non ha un corpo { } dopo di sé: ciò che segue viene letto nella sezione che lo contiene."
"This } closes no section." = "Questa } non chiude nessuna sezione."
"A { opened on this line is never closed." = "Una { aperta su questa riga non viene mai chiusa."
"[{name}] opened on this line is never closed: any section after it is read as part of it." = "[{name}] aperta su questa riga non viene mai chiusa: ogni sezione dopo di essa viene letta come parte di essa."
"A /* comment opened on this line never ends: the rest of the file is read as a comment." = "Un commento /* aperto su questa riga non finisce mai: il resto del file viene letto come commento."


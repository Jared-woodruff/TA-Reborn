"Short guided games on Painted Desert against an enemy that stays out of your way. Follow the panel at the top left; each step ticks off as you do it." = "Brevi partite guidate su Painted Desert contro un nemico che non ti ostacola. Segui il pannello in alto a sinistra; ogni passaggio si spunta man mano che lo completi."

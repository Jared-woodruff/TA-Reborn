# apps/ta_game/scenarios/armageddon.toml
"Armageddon" = "Armageddon"
"Two armies, one plain, no retreat. Win the battle of the war." = "Due eserciti, una pianura, nessuna ritirata. Vinci la battaglia della guerra."
"Commander, the Core's main army is marching north across the Mounds, and ours stands in its way. There are no bases here, no factories, no reinforcements: what you have is all you will ever have.\n\nThey outnumber us. We outgun them. Put the Lugers and the Merls on their columns as they close, hold the line with the Zeus, and keep the Jethros with the tanks: they will bring gunships. Their reserves arrive two and a half minutes in.\n\nDestroy every one of them." = "Comandante, l'esercito principale del Core marcia verso nord attraverso i Mounds, e il nostro gli sbarra la strada. Qui non ci sono basi, né fabbriche, né rinforzi: ciò che hai è tutto ciò che avrai.\n\nLoro sono di più. Noi abbiamo più potenza di fuoco. Punta i Luger e i Merl sulle loro colonne mentre avanzano, tieni la linea con gli Zeus e affianca i Jethro ai carri armati: porteranno cannoniere aeree. Le loro riserve arrivano dopo due minuti e mezzo.\n\nDistruggili fino all'ultimo."
"Arm Command" = "Comando Arm"
"Here they come. Hold the line, and keep the Jethros with the tanks." = "Eccoli. Tenete la linea e tenete i Jethro con i carri."
"Their reserves are coming up behind the mounds, a Goliath at their head." = "Le loro riserve avanzano dietro i rilievi, con un Goliath in testa."

# apps/ta_game/scenarios/armistice.toml
"The Armistice" = "L'armistizio"
"Five minutes of peace to build an army. Then the war resumes." = "Cinque minuti di pace per costruire un esercito. Poi la guerra riprende."
"Commander, the peace talks on Reactor Grid have failed. The armistice holds for five more minutes: until then no weapon may fire, and neither side may build near the other's base. When it ends, the war resumes.\n\nBoth sides are rearming at a furious pace: resources and construction run at twice their usual speed, and the treaty's one lasting clause bans missile silos. Their Commander knows the clock as well as you do.\n\nBuild as you have never built. When the armistice ends, destroy the Core Commander." = "Comandante, i colloqui di pace su Reactor Grid sono falliti. L'armistizio regge per altri cinque minuti: fino ad allora nessuna arma può sparare e nessuna delle due parti può costruire vicino alla base dell'altra. Quando finirà, la guerra riprenderà.\n\nEntrambe le parti si stanno riarmando a ritmo furioso: risorse e costruzione vanno al doppio della velocità di sempre, e l'unica clausola duratura del trattato vieta i silos missilistici. Il loro Comandante conosce il conto alla rovescia quanto te.\n\nCostruisci come non hai mai costruito. Quando l'armistizio finisce, distruggi il Comandante del Core."
"The talks have failed. For five minutes no weapon fires and nobody builds near the other's base. Then it is war: build as you have never built." = "I colloqui sono falliti. Per cinque minuti nessuna arma spara e nessuno costruisce vicino alla base dell'altro. Poi è guerra: costruisci come non hai mai costruito."
"Their factories are running day and night. Ours should be too." = "Le loro fabbriche lavorano giorno e notte. Anche le nostre dovrebbero."
"Core Overseer" = "Sorvegliante del Core"
"Ten seconds, Arm. We have counted every one of your factories." = "Dieci secondi, Arm. Abbiamo contato ognuna delle tue fabbriche."
"Their Commander is somewhere in that grid. Find it, and end this war for good." = "Il loro Comandante è da qualche parte in quella griglia. Trovalo e metti fine a questa guerra per sempre."

# apps/ta_game/scenarios/brothers_in_arms.toml
"Brothers in Arms" = "Fratelli d'armi"
"You and an allied Commander against two of the Core's." = "Tu e un Comandante alleato contro due del Core."
"Commander, you are not alone on Highland Rift. Commander Holt's forces hold the river crossings in the north, beside yours in the north-western highlands. Two Core Commanders are dug in to the south, across the canyon.\n\nHolt's computer will fight its own war, but it is the same war: back it up when it is hard pressed, and it will do the same for you. Your forces see what its forces see.\n\nDestroy both Core Commanders. Keep yours alive." = "Comandante, non sei solo su Highland Rift. Le forze del Comandante Holt tengono i guadi del fiume a nord, accanto alle tue negli altipiani nord-occidentali. Due Comandanti del Core sono trincerati a sud, oltre il canyon.\n\nIl computer di Holt combatterà la sua guerra, ma è la stessa guerra: sostienilo quando è in difficoltà e lui farà lo stesso per te. Le tue forze vedono ciò che vedono le sue.\n\nDistruggi entrambi i Comandanti del Core. Tieni in vita il tuo."
"Commander Holt" = "Comandante Holt"
"Good to have you on the line. I'll hold the river crossings in the north; you take the western highlands." = "Felice di averti in linea. Io tengo i guadi del fiume a nord; tu prendi gli altipiani occidentali."
"My scouts have found both of their bases. The south-western one is yours; I'll keep the other busy." = "I miei esploratori hanno trovato entrambe le loro basi. Quella a sud-ovest è tua; io terrò impegnata l'altra."
"They're massing at the canyon. If they come for one of us, the other hits them from the side." = "Si stanno ammassando al canyon. Se attaccano uno di noi, l'altro li colpisce sul fianco."
"Still with me? Then let's finish it. Everything we have, at their Commanders." = "Sei ancora con me? Allora chiudiamo la partita. Tutto quello che abbiamo, contro i loro Comandanti."

# apps/ta_game/scenarios/decapitation.toml
"Kill the Core Commander on his island fortress. From the air." = "Elimina il Comandante Core nella sua fortezza sull'isola. Dal cielo."
"Commander, a Core Commander has made his fortress on the island at the centre of this lava sea. Nothing on treads or legs will reach him, and his anti-air is the best the Core can build.\n\nYou have a small air wing and a forward airfield in the south-west corner: build it up. Strip away his air defences, then send the bombers in; a handful sent straight at him will not get through. Brawler gunships hit hard but die fast over flak, and the Freedom Fighters can keep his fighters off your bombers.\n\nHis reinforcements arrive in fifteen minutes. Before then, he must be dead." = "Comandante, un Comandante Core ha stabilito la sua fortezza sull'isola al centro di questo mare di lava. Niente su cingoli o su gambe potrà raggiungerlo, e la sua contraerea è la migliore che il Core sappia costruire.\n\nHai una piccola squadriglia aerea e un aeroporto avanzato nell'angolo sud-ovest: potenzialo. Smantella le sue difese antiaeree, poi manda dentro i bombardieri; una manciata mandata dritta contro di lui non passerà. Le cannoniere Brawler colpiscono duro ma cadono in fretta sotto la contraerea, e i Freedom Fighter possono tenere i suoi caccia lontani dai tuoi bombardieri.\n\nI suoi rinforzi arrivano tra quindici minuti. Prima di allora, deve essere morto."

# apps/ta_game/scenarios/doomsday_clock.toml
"Doomsday Clock" = "Orologio dell'Apocalisse"
"The Core's missile launches in fifteen minutes. Stop it." = "Il missile del Core partirà tra quindici minuti. Fermalo."
"Commander, a Silencer nuclear silo stands at the heart of the Core base across these metal plains, and it is arming. In fifteen minutes the missile flies, and your base is the target.\n\nDestroy the silo. Nothing else matters: not their Commander, not their factories. The silo sits behind heavy laser towers and a Punisher battery, and their Commander will not sit still while you come for it.\n\nYou have a base, two factories and two construction kbots. The clock is running." = "Comandante, un silo nucleare Silencer si erge nel cuore della base Core, oltre queste pianure di metallo, e si sta armando. Tra quindici minuti il missile partirà, e il bersaglio è la tua base.\n\nDistruggi il silo. Nient'altro conta: né il loro Comandante, né le loro fabbriche. Il silo è protetto da torri laser pesanti e da una batteria Punisher, e il loro Comandante non resterà a guardare mentre vieni a prenderlo.\n\nHai una base, due fabbriche e due kbot costruttori. Il tempo stringe."
"Ten minutes to launch, Commander." = "Dieci minuti al lancio, Comandante."
"Five minutes to launch. That silo has to go." = "Cinque minuti al lancio. Quel silo deve saltare."
"One minute! Get to that silo!" = "Un minuto! Raggiungi quel silo!"

# apps/ta_game/scenarios/endless_siege.toml
"Endless Siege" = "Assedio senza fine"
"The waves never stop. Survive as long as you can." = "Le ondate non finiscono mai. Sopravvivi più a lungo che puoi."
"Commander, there is no rescue coming, no reinforcements, no victory. The Core has found your outpost in the mesas and will throw everything it has at it, from three directions, for as long as it takes.\n\nKbots, then tanks, then artillery and bombers; heavier every time, and now and then something enormous. Build an economy, build defences, and hold on.\n\nYour best time is kept. Beat it." = "Comandante, non arriveranno soccorsi, né rinforzi, né vittoria. Il Core ha trovato il tuo avamposto tra le mesas e gli scaglierà contro tutto ciò che ha, da tre direzioni, per tutto il tempo necessario.\n\nKbot, poi carri armati, poi artiglieria e bombardieri; ogni volta più pesanti, e di tanto in tanto qualcosa di enorme. Costruisci un'economia, costruisci difese e resisti.\n\nIl tuo tempo migliore viene registrato. Battilo."

# apps/ta_game/scenarios/extraction.toml
"Extraction" = "Estrazione"
"Get your Commander down the lava river to the pick-up point." = "Porta il tuo Comandante lungo il fiume di lava fino al punto di recupero."
"Commander, your drop went wrong. You are on the south bank of a river of lava at the western end of the Run, with what is left of your escort, and the dropships can only land at the far eastern end.\n\nThe Core has guns all along the north bank, and patrols on your side of the river. Keep away from the lava's edge (their laser towers reach no further), deal with the patrols, and get your Commander to the pick-up point. Whatever guards it will not come to you. Core troops are already following your tracks; do not stop for long.\n\nAnything else is expendable. Your Commander is not." = "Comandante, il tuo sbarco è andato storto. Sei sulla riva sud di un fiume di lava, all'estremità occidentale del Run, con ciò che resta della tua scorta, e le navette da sbarco possono atterrare solo all'estremità orientale.\n\nIl Core ha cannoni lungo tutta la riva nord, e pattuglie sul tuo lato del fiume. Stai lontano dal bordo della lava (le loro torri laser non arrivano oltre), occupati delle pattuglie e porta il tuo Comandante al punto di recupero. Ciò che lo sorveglia non verrà da te. Le truppe del Core stanno già seguendo le tue tracce; non fermarti a lungo.\n\nTutto il resto è sacrificabile. Il tuo Comandante no."

# apps/ta_game/scenarios/iron_rain.toml
"Iron Rain" = "Pioggia di ferro"
"Two Intimidators are shelling your base. Take the mesa and silence them." = "Due Intimidator bombardano la tua base. Prendi l'altopiano e riducili al silenzio."
"Commander, the Core has hauled two Intimidators, its long-range plasma cannons, onto the mesas in the middle of the canyon. Your base is inside their range. Every eight seconds each of them will put a shell among your buildings, until you silence them.\n\nThe battery is dug in behind heavy laser towers and a Punisher, with tanks on the ramps, and the Core's main base lies beyond it, to the south-east. Its Commander will send what it can.\n\nSpread out, build fast and take that mesa. Destroy both Intimidators." = "Comandante, il Core ha portato due Intimidator, i suoi cannoni al plasma a lunga gittata, sugli altipiani in mezzo al canyon. La tua base è nel loro raggio. Ogni otto secondi ciascuno di essi farà cadere un proiettile tra i tuoi edifici, finché non li ridurrai al silenzio.\n\nLa batteria è trincerata dietro torri laser pesanti e un Punisher, con carri armati sulle rampe, e la base principale del Core si trova oltre, a sud-est. Il suo Comandante manderà ciò che può.\n\nSparpagliati, costruisci in fretta e prendi quell'altopiano. Distruggi entrambi gli Intimidator."
"Commander, two Intimidators on the mesas have your range. Every eight seconds each of them will put a shell into your base." = "Comandante, due Intimidator sugli altipiani hanno la tua base a tiro. Ogni otto secondi ciascuno farà cadere un proiettile sulla tua base."
"A Core radar post in the canyon to the south-east is spotting for those guns. Knock it out and they can no longer see your base." = "Una postazione radar del Core nel canyon, a sud-est, dirige il tiro di quei cannoni. Distruggila e non potranno più vedere la tua base."
"Spread your buildings out: a shell that lands among them takes them all." = "Sparpaglia i tuoi edifici: un proiettile che cade in mezzo a loro li porta via tutti."
"Their gunners have your range now. Take that mesa, Commander!" = "I loro artiglieri ti hanno inquadrato. Prendi quell'altopiano, Comandante!"

# apps/ta_game/scenarios/king_of_the_hill.toml
"King of the Hill" = "Re della collina"
"Hold the summit for four minutes before the Core does." = "Tieni la vetta per quattro minuti prima che ci riesca il Core."
"Commander, the spiral mountain at the heart of this plain is rich in metal, and whoever holds its summit holds the planet. A Core Commander has landed to the north with the same idea.\n\nTake the summit and keep it: four minutes in all with only your forces on top wins it. Contested, the clock stands still. If the Core holds it alone for four minutes, the mountain is theirs.\n\nThe Core will keep sending troops up the slopes. Build up, get there first, and dig in." = "Comandante, la montagna a spirale al centro di questa pianura è ricca di metallo, e chi ne tiene la vetta tiene il pianeta. Un Comandante Core è atterrato a nord con la stessa idea.\n\nPrendi la vetta e tienila: quattro minuti in totale con solo le tue forze in cima ti danno la vittoria. Se è contesa, il tempo si ferma. Se il Core la tiene da solo per quattro minuti, la montagna è sua.\n\nIl Core continuerà a mandare truppe su per i pendii. Rafforzati, arriva per primo e trincerati."
"Core troops are climbing the north slope. Don't let them dig in on the summit." = "Truppe del Core stanno salendo il versante nord. Non lasciare che si trincerino sulla vetta."
"Raiders are coming round the mountain for your base." = "Predoni stanno aggirando la montagna verso la tua base."

# apps/ta_game/scenarios/last_stand.toml
"Last Stand" = "Ultima resistenza"
"Hold the pass for twelve minutes. They will not stop coming." = "Tieni il passo per dodici minuti. Non smetteranno di arrivare."
"Commander, the Core has broken through at Varrin Gap. The only way into the valley behind you is the winding pass ahead, and your outpost at its western mouth is all that stands in the way.\n\nReinforcements are twelve minutes out. Hold until they arrive. Core forces will come through the pass in waves, each heavier than the last; expect bombers, and expect worse at the end: our scouts have seen something very large moving in the east.\n\nYou have a small base, a kbot lab and two construction kbots. Build what you can. Keep your Commander alive." = "Comandante, il Core ha sfondato a Varrin Gap. L'unica via per la valle alle tue spalle è il passo tortuoso davanti a te, e il tuo avamposto al suo imbocco occidentale è tutto ciò che gli sbarra la strada.\n\nI rinforzi sono a dodici minuti. Resisti finché non arrivano. Le forze del Core attraverseranno il passo a ondate, ciascuna più pesante della precedente; aspettati bombardieri, e aspettati di peggio alla fine: i nostri esploratori hanno visto qualcosa di molto grande muoversi a est.\n\nHai una piccola base, un laboratorio kbot e due kbot costruttori. Costruisci ciò che puoi. Tieni in vita il tuo Comandante."
"Outpost, this is Arm Command. The relief force is twelve minutes out. Nothing gets through that pass before it arrives." = "Avamposto, qui Comando Arm. I rinforzi sono a dodici minuti. Niente passa per quel passo prima del loro arrivo."
"Radar: aircraft inbound from the east. Bombers! Get your anti-air up." = "Radar: velivoli in arrivo da est. Bombardieri! Prepara la contraerea."
"Seismic contact in the pass. It's the big one, Commander: a Krogoth." = "Contatto sismico nel passo. È quello grosso, Comandante: un Krogoth."
"One minute! The relief force is entering the valley." = "Un minuto! I rinforzi stanno entrando nella valle."

# apps/ta_game/scenarios/metal_rush.toml
"The first to make 15,000 metal wins. The Core plays rough." = "Vince il primo che produce 15.000 di metallo. Il Core gioca sporco."
"Commander, the mining rights to this planet go to whoever proves they can work it: the first side to extract fifteen thousand metal wins it outright.\n\nThe Core is racing you from the western plateau, and the Core has never been known to race fair. Expect raids on your extractors. Build fast, protect your economy, and if you can, take theirs apart.\n\nMetal makers count. Reclaimed metal counts. Whatever you make, counts." = "Comandante, i diritti minerari di questo pianeta andranno a chi dimostrerà di saperlo sfruttare: la prima fazione che estrae quindicimila di metallo se lo aggiudica senza discussioni.\n\nIl Core ti sfida dall'altopiano occidentale, e il Core non è mai stato noto per la sua lealtà. Aspettati incursioni contro i tuoi estrattori. Costruisci in fretta, proteggi la tua economia e, se puoi, smantella la loro.\n\nI convertitori di metallo contano. Il metallo recuperato conta. Tutto ciò che produci conta."

# apps/ta_game/scenarios/titans.toml
"Titans" = "Titani"
"Three Krogoths are walking toward your base. Bring them down." = "Tre Krogoth marciano verso la tua base. Abbattili."
"Commander, seismic stations round the basin are reading footfalls: three Krogoths, the Core's walking fortresses, are crossing the salt pans toward your base, one after another, each with an escort.\n\nNothing out there can stop them but you. A Krogoth's head laser reaches further than your D-gun, so keep your Commander back. Bombers, artillery and massed Zeus will bring one down. Lose your nerve and it will walk through your base.\n\nYou have a base with three factories, four construction kbots and a garrison. Destroy all three of them." = "Comandante, le stazioni sismiche intorno al bacino registrano dei passi: tre Krogoth, le fortezze ambulanti del Core, stanno attraversando le saline verso la tua base, uno dopo l'altro, ognuno con una scorta.\n\nLà fuori niente può fermarli tranne te. Il laser sulla testa di un Krogoth arriva più lontano del tuo D-gun, quindi tieni indietro il tuo Comandante. Bombardieri, artiglieria e Zeus in massa ne abbatteranno uno. Se perdi la calma, ti attraverserà la base.\n\nHai una base con tre fabbriche, quattro kbot da costruzione e una guarnigione. Distruggili tutti e tre."
"Commander, seismic stations are reading footfalls round the basin. Three Krogoths are walking toward your base, one after another." = "Comandante, le stazioni sismiche registrano passi intorno al bacino. Tre Krogoth marciano verso la tua base, uno dopo l'altro."
"The first Krogoth has crossed the north-western rim. It is coming straight for you." = "Il primo Krogoth ha superato il bordo nord-occidentale. Viene dritto verso di te."
"Keep your Commander back: that head laser reaches further than your D-gun." = "Tieni indietro il tuo Comandante: quel laser sulla testa arriva più lontano del tuo D-gun."
"The second Krogoth is through the northern pass, with rockets and anti-air round it." = "Il secondo Krogoth ha superato il passo settentrionale, con razzi e contraerea intorno."
"The last of them, out of the north-east, with the heaviest escort yet. End this, Commander." = "L'ultimo, da nord-est, con la scorta più pesante finora. Metti fine a tutto questo, Comandante."

# apps/ta_game/scenarios/until_dawn.toml
"Until Dawn" = "Fino all'alba"
"Night falls on the timber. Hold your ridge until the sun comes up." = "Cala la notte sulla foresta. Tieni il tuo crinale finché non sorge il sole."
"Commander, night is falling over Timberline, and the Core is moving through the forest under it. Your outpost holds the western ridge: the only road out of the valley runs past it.\n\nThe relief column cannot move before first light. Until then you are on your own. In the dark and the rain their raiders will be on you before you see them, so build radar, and keep your floodlights burning.\n\nYou have a small base, a kbot lab and two construction kbots. Hold until dawn, and keep your Commander alive." = "Comandante, la notte sta calando su Timberline e il Core avanza nella foresta col favore del buio. Il tuo avamposto tiene il crinale occidentale: l'unica strada che esce dalla valle gli passa davanti.\n\nLa colonna di soccorso non può muoversi prima delle prime luci. Fino ad allora sei da solo. Nel buio e sotto la pioggia i loro predoni ti saranno addosso prima che tu li veda: costruisci radar e tieni accese le fotoelettriche.\n\nHai una piccola base, un Kbot Lab e due kbot da costruzione. Resisti fino all'alba e tieni in vita il tuo Comandante."
"Outpost Echo, the Core is moving through the timber tonight. Hold your ridge until first light: the relief column marches at dawn." = "Avamposto Eco, stanotte il Core attraversa la foresta. Tenete il crinale fino alle prime luci: la colonna di soccorso marcia all'alba."
"Raiders in the eastern trees. In this rain you will hear them before you see them." = "Predoni nei boschi a est. Con questa pioggia li sentirai prima di vederli."
"Pyros in the north-eastern woods. Keep them out of the trees round your base: the timber will burn." = "Pyro nei boschi a nord-est. Tienili lontani dagli alberi intorno alla tua base: il legname brucerà."
"A convoy got through from the south-west. Four Zeus and two Jethros are yours, Commander." = "Un convoglio è passato da sud-ovest. Quattro Zeus e due Jethro sono tuoi, Comandante."
"Seismic contact in the south-east: heavy treads. They are saving the worst for the last hours of the night." = "Contatto sismico a sud-est: cingoli pesanti. Tengono il peggio per le ultime ore della notte."
"Sunrise in one minute. The relief column is at the river. Hold on!" = "Alba tra un minuto. La colonna di soccorso è al fiume. Tenete duro!"


# crates/ta_ui/src/seasonal.rs
"FESTIVE FIELD NOTES" = "NOTE SUL CAMPO NATALIZIE"
"NEW YEAR FIELD NOTES" = "NOTE SUL CAMPO DI CAPODANNO"
"SPOOKY FIELD NOTES" = "NOTE SUL CAMPO DA BRIVIDO"
"Santa's sleigh is not a transport. Load your presents into an Atlas instead." = "La slitta di Babbo Natale non è un'unità da trasporto. I regali caricali su un Atlas."
"The D-gun does not gift-wrap. Take it up with your Commander." = "Il D-gun non fa pacchetti regalo. Per i reclami, rivolgiti al tuo Comandante."
"A Fusion Reactor keeps the fairy lights on all winter. Just never build one next to the tree." = "Un Fusion Reactor tiene accese le lucine per tutto l'inverno. Basta non costruirlo mai accanto all'albero."
"Snow falls on the Arm and the Core alike. So do Big Bertha shells." = "La neve cade sull'Arm come sul Core. Anche i colpi della Big Bertha."
"Coal in your stocking? Reclaim it. Metal is metal." = "Carbone nella calza della Befana? Recuperalo. Tutto fa metallo."
"Peewees sing terrible carols, but they never miss a patrol." = "I Peewee intonano canti di Natale stonati come campane, ma non saltano mai una pattuglia."
"Stockings full of metal, storage full of energy: a Commander's perfect Christmas morning." = "Calze piene di metallo, riserve piene di energia: la mattina di Natale perfetta per un Comandante."
"Silent night, holy night: keep a radar tower running, just in case." = "Astro del ciel, pargol divin: tieni comunque accesa una torre radar, non si sa mai."
"Snowball fights are fun until somebody brings a Krogoth." = "Le battaglie a palle di neve sono divertenti, finché qualcuno non si presenta con un Krogoth."
"New Year's resolution: build more metal extractors. This year, keep it." = "Buon proposito per l'anno nuovo: costruire più estrattori di metallo. Quest'anno, mantienilo."
"Fireworks are pretty, but a nuclear silo's are louder. Celebrate responsibly." = "I fuochi d'artificio sono belli, ma quelli di un silo nucleare fanno più rumore. Festeggia responsabilmente."
"Count down from ten, then count your units. The second count matters more." = "Conta alla rovescia da dieci, poi conta le tue unità. Il secondo conto è quello che conta."
"Out with the old Commander? You only get one. Look after it all year." = "Anno nuovo, Comandante nuovo? Scordatelo: ne hai uno solo. Abbine cura tutto l'anno."
"Start the year with a bang: the Core recommends the Doomsday Machine, the Arm recommends anything else." = "Inizia l'anno col botto: il Core consiglia la Doomsday Machine, l'Arm tutto tranne quella."
"Fireworks at midnight, artillery at dawn: a Commander's New Year." = "Fuochi d'artificio a mezzanotte, artiglieria all'alba: il Capodanno di un Comandante."
"Raise a glass of coolant to the units lost last year, then build more of them." = "Brinda con un bicchiere di refrigerante alle unità perse l'anno scorso. Poi costruiscine altre."
"Midnight is the perfect time for a sneak attack. So is every other time." = "La mezzanotte è l'ora perfetta per un attacco a sorpresa. Come del resto ogni altra ora."
"Trick or treat? The Core always picks the D-gun." = "Dolcetto o scherzetto? Per il Core lo scherzetto è sempre il D-gun."
"A self-destructing Krogoth is a better jump scare than any ghost." = "Un Krogoth che si autodistrugge fa saltare sulla sedia più di qualsiasi fantasma."
"Wrecks rise from the dead with a Necro. Spooky, and very economical." = "Con un Necro i relitti risorgono dalla tomba. Inquietante, e molto economico."
"Blips vanishing off your radar? Not ghosts, just jammers. Probably." = "Puntini che spariscono dal radar? Non sono fantasmi, solo disturbatori. Probabilmente."
"Carve your pumpkins before the Big Bertha does." = "Intaglia le zucche prima che ci pensi la Big Bertha."
"Never split the party. Especially when the party is twelve Peewees." = "Mai dividere la compagnia. Soprattutto se la compagnia è di dodici Peewee."
"Fog of war too tame? Set the line of sight to True and let the hills hide what lurks behind them. If you dare." = "Nebbia di guerra troppo mansueta? Imposta la linea di vista su «Reale» e lascia che le colline nascondano ciò che si annida dietro di esse. Se ne hai il coraggio."
"No Commander has ever come back from the dead. Keep yours alive." = "Nessun Comandante è mai tornato dall'aldilà. Tieni in vita il tuo."
"Bats do not show up on radar. Neither do Vamps." = "I pipistrelli non compaiono sul radar. E nemmeno i Vamp."
"The scariest sound in the dark is your energy running out." = "Il suono più spaventoso nel buio? Quello della tua energia che si esaurisce."


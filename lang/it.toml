# apps/ta_game/src/tips.rs
"Ctrl+right-drag draws a formation line: the selection spreads along it." = "Ctrl+trascina col destro traccia una linea di formazione: la selezione si dispone lungo di essa."
"Ctrl+drag draws a formation line: the selection spreads along it." = "Ctrl+trascina traccia una linea di formazione: la selezione si dispone lungo di essa."
"Used to TA's original controls? Options, Controls: give orders with the left button." = "Abituato ai comandi originali di TA? Opzioni, Comandi: dai gli ordini con il tasto sinistro."
"A right-click clears the selection or cancels the order you were about to give." = "Un clic destro annulla la selezione o l'ordine che stavi per dare."
"Right-click one of your units for a ring of its orders; hold the button and flick towards a choice. A controller's B does the same." = "Clic destro su una tua unità per un anello dei suoi ordini; tieni premuto e scatta verso una scelta. Il B del controller fa lo stesso."
"Hold the right button on one of your units, or middle-click it, for a ring of its orders; flick towards a choice and let go." = "Tieni premuto il tasto destro su una tua unità, o fai clic centrale su di essa, per un anello dei suoi ordini; scatta verso una scelta e rilascia."
"Metal extractors must sit on metal: {overlay_metal} shows the metal map, and {area_mex} puts an extractor on every metal spot you circle." = "Gli estrattori di metallo vanno posti sul metallo: {overlay_metal} mostra la mappa del metallo, e {area_mex} mette un estrattore su ogni giacimento che racchiudi in un cerchio."
"Your Commander's D-gun ({dgun}) destroys almost anything it touches, including your own units in its path." = "Il D-gun ({dgun}) del tuo Comandante distrugge quasi tutto ciò che tocca, comprese le tue unità sulla sua traiettoria."
"{perspective} climbs into the selected unit, or an ally's under the pointer, to see the battle through its eyes as it goes on with its orders. Escape climbs back out." = "{perspective} ti fa salire a bordo dell'unità selezionata, o di quella di un alleato sotto il puntatore, per vedere la battaglia con i suoi occhi mentre prosegue con i suoi ordini. Escape ti fa scendere."
"Keep your metal and energy incomes above what you spend: building slows down for everything when a store runs dry." = "Tieni le entrate di metallo e di energia sopra ciò che spendi: quando una riserva si esaurisce, tutto si costruisce più lentamente."
"Right-clicking a factory's queued unit removes it; clicking it builds it next." = "Un clic destro su un'unità in coda in una fabbrica la rimuove; un clic la fa costruire subito dopo."
"Fight ({fight}) is attack-move: units stop to fight whatever they meet on the way." = "Combatti ({fight}) è l'attacco in movimento: le unità si fermano a combattere tutto ciò che incontrano lungo la strada."
"Ctrl+click is force fire: the selection attacks whatever is there, your own units too, or the ground." = "Ctrl+clic è il fuoco forzato: la selezione attacca qualunque cosa ci sia, anche le tue unità, o il terreno."
"{select_builders} selects your constructors, {select_factories} your factories, {select_armed} your armed units, {select_on_screen} everything on the screen." = "{select_builders} seleziona i tuoi costruttori, {select_factories} le tue fabbriche, {select_armed} le tue unità armate, {select_on_screen} tutto ciò che è sullo schermo."
"Patrol ({patrol}) with constructors makes them repair, assist and reclaim along the route by themselves." = "Pattuglia ({patrol}) con i costruttori li fa riparare, assistere e recuperare da soli lungo il percorso."
"Put a constructor on duty ({duty}) and it works by itself: the economy, repairs, reclaiming or defence. Any order you give takes it back." = "Metti un costruttore in servizio ({duty}) e lavora da solo: economia, riparazioni, recupero o difesa. Ogni ordine che dai lo riprende."
"Drag with Reclaim ({reclaim}) to turn every wreck, rock and tree in a circle into metal and energy." = "Trascina con Recupera ({reclaim}) per trasformare in metallo ed energia ogni relitto, roccia e albero dentro un cerchio."
"Ctrl+1 to Ctrl+9 make control groups; tap the number twice to look at the group." = "Da Ctrl+1 a Ctrl+9 crei gruppi di controllo; premi due volte il numero per inquadrare il gruppo."
"Hold {players} to see every player's side, team, units and income (your allies' in full)." = "Tieni premuto {players} per vedere fazione, squadra, unità ed entrate di ogni giocatore (dei tuoi alleati per intero)."
"Radar towers show enemy units long before they come into sight: build one early." = "Le torri radar mostrano le unità nemiche molto prima che entrino in vista: costruiscine una presto."
"Wind generators pay off on windy maps: the skirmish page shows each map's wind range." = "I generatori eolici rendono sulle mappe ventose: la pagina schermaglia mostra l'intervallo di vento di ogni mappa."
"Metal makers turn spare energy into metal, and stop when your energy runs dry." = "I convertitori di metallo trasformano l'energia in eccesso in metallo, e si fermano quando l'energia si esaurisce."
"Solar collectors fold shut for a few seconds when hit: tougher, but making no energy." = "I collettori solari si richiudono per qualche secondo quando vengono colpiti: più resistenti, ma senza produrre energia."
"Units gain veterancy with every kill: veterans aim better and shrug off damage." = "Le unità guadagnano esperienza a ogni uccisione: i veterani mirano meglio e incassano meglio i danni."
"Shift adds to the orders a unit already has instead of replacing them." = "Shift aggiunge ordini a quelli che un'unità ha già invece di sostituirli."
"Alt+drag while placing a building fills a rectangle with it: handy for solar farms and walls." = "Alt+trascina mentre piazzi un edificio ne riempie un rettangolo: comodo per campi solari e mura."
"Double-click a unit to select every unit of its type on screen; {select_type} selects them map-wide." = "Doppio clic su un'unità per selezionare tutte quelle del suo tipo sullo schermo; {select_type} le seleziona su tutta la mappa."
"{idle_builder} selects the next idle constructor, {idle_factory} the next idle factory." = "{idle_builder} seleziona il prossimo costruttore inattivo, {idle_factory} la prossima fabbrica inattiva."
"Wrecks can be resurrected by resurrection kbots, or reclaimed for most of their metal." = "I relitti possono essere resuscitati dai kbot di resurrezione, o recuperati per gran parte del loro metallo."
"Hovering a unit shows its health, firepower and range; {overlay_path} shows where the selection can go." = "Il puntatore su un'unità ne mostra salute, potenza di fuoco e gittata; {overlay_path} mostra dove può andare la selezione."
"{last_alert} (or Backspace) looks at the last place your units were attacked; press it again for the one before." = "{last_alert} (o Backspace) inquadra l'ultimo punto in cui le tue unità sono state attaccate; premilo di nuovo per quello precedente."
"A notice or a piece of advice with LOOK on it takes you to the place, or the unit, when you click it." = "Un avviso o un consiglio con VEDI ti porta al luogo o all'unità quando ci clicchi sopra."
"{help} tells everything about the selected unit, or the one under the pointer: cost, speed, weapons, abilities." = "{help} dice tutto sull'unità selezionata, o su quella sotto il puntatore: costo, velocità, armi, abilità."
"{next_unit} looks at the next of your units off the screen; with units selected, the next of them." = "{next_unit} inquadra la prossima delle tue unità fuori schermo; con delle unità selezionate, la prossima tra quelle."
"Ctrl+F6 to Ctrl+F9 store camera positions; F6 to F9 bring them back." = "Da Ctrl+F6 a Ctrl+F9 memorizzi posizioni della visuale; da F6 a F9 le richiami."
"Anti-air matters: bombers can wreck an undefended economy in one pass." = "La contraerea conta: i bombardieri possono distruggere un'economia indifesa in un solo passaggio."
"An advanced factory needs a lot of metal: build it once your extractors and power can feed it." = "Una fabbrica avanzata richiede molto metallo: costruiscila quando estrattori ed energia potranno alimentarla."
"Guarding a factory with a constructor adds its build power to the factory's production." = "Proteggere una fabbrica con un costruttore aggiunge la sua potenza di costruzione alla produzione della fabbrica."
"Moho mines extract far more metal than basic extractors: advanced constructors build them." = "Le miniere Moho estraggono molto più metallo degli estrattori di base: le costruiscono i costruttori avanzati."
"Every game is kept as a replay: watch it from the main menu, and jump through it with the bar." = "Ogni partita viene conservata come replay: guardala dal menu principale e spostati al suo interno con la barra."
"{overlay_sight} shows your sight, radar and sonar coverage; {overlay_height} shows the heights of the map." = "{overlay_sight} mostra la tua copertura di vista, radar e sonar; {overlay_height} mostra le altezze della mappa."
"The Commander can capture enemy units ({capture}): it takes a while, but the unit is yours." = "Il Comandante può catturare le unità nemiche ({capture}): richiede un po' di tempo, ma poi l'unità è tua."
"{photo_mode} opens photo mode: the battle holds still, and you can light, frame and focus a shot at up to 4K." = "{photo_mode} apre la modalità foto: la battaglia si ferma, e puoi illuminare, inquadrare e mettere a fuoco uno scatto fino al 4K."
"TIP" = "CONSIGLIO"
"Dismiss" = "Chiudi"
"Don't show tips again" = "Non mostrare più i consigli"

# apps/ta_game/src/tutorial.rs
"THE BASICS" = "LE BASI"
"Your Commander, the camera, metal, energy and a first factory." = "Il tuo Comandante, la visuale, metallo, energia e una prima fabbrica."
"Selecting units" = "Selezionare le unità"
"The camera" = "La visuale"
"Metal and energy" = "Metallo ed energia"
"Factories" = "Fabbriche"
"Welcome, Commander. The walking machine in the middle of the screen is your Commander: it builds, it fights, and losing it usually loses the battle. Click it to select it." = "Benvenuto, Comandante. La macchina che cammina al centro dello schermo è il tuo Comandante: costruisce, combatte, e perderlo di solito significa perdere la battaglia. Cliccaci sopra per selezionarlo."
"Lost sight of it? {select_commander} selects the Commander from anywhere, and SHOW ME brings the camera to it." = "L'hai perso di vista? {select_commander} seleziona il Comandante da qualunque punto, e MOSTRA DOV'È sposta la visuale su di lui."
"Look around. The arrow keys, the screen edges or dragging with the middle button scroll; the mouse wheel zooms towards the cursor, and dragging with the right button turns the view." = "Guardati intorno. I tasti freccia, i bordi dello schermo o il trascinamento col tasto centrale fanno scorrere la visuale; la rotella del mouse ingrandisce verso il cursore, e il trascinamento col tasto destro ruota la visuale."
"Push the pointer against an edge of the screen to scroll, or turn the mouse wheel to zoom." = "Porta il cursore contro un bordo dello schermo per far scorrere la visuale, o gira la rotella del mouse per regolare lo zoom."
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the ECONOMY tab of the build menu at the bottom right and place it on the marked deposit." = "Tutto è fatto di metallo ed energia. Il metallo viene dagli estrattori posti sui giacimenti di metallo. Seleziona il Comandante, scegli il Metal Extractor dalla scheda ECONOMIA del menu costruzione in basso a destra e piazzalo sul giacimento segnato."
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the build menu on the left and place it on the marked deposit." = "Tutto è fatto di metallo ed energia. Il metallo viene dagli estrattori posti sui giacimenti di metallo. Seleziona il Comandante, scegli il Metal Extractor dal menu costruzione a sinistra e piazzalo sul giacimento segnato."
"The outline turns green where the extractor can stand. Bring it onto the marked ring and click to place it." = "La sagoma diventa verde dove l'estrattore può stare. Portala nel cerchio segnato e clicca per piazzare l'estrattore."
"Energy comes from solar collectors and wind generators. Build a Solar Collector next to your Commander. The bars at the top show your stores and how fast they fill or drain; they warn you when one runs dry." = "L'energia viene dai collettori solari e dai generatori eolici. Costruisci un Solar Collector accanto al tuo Comandante. Le barre in alto mostrano le tue riserve e quanto in fretta si riempiono o si svuotano; ti avvisano quando una si esaurisce."
"The Solar Collector is a flat, square panel. Pick it, then click on open ground near the Commander." = "Il Solar Collector è un pannello piatto e quadrato. Sceglilo, poi clicca su un terreno libero vicino al Comandante."
"Factories build your army. Build a Kbot Lab (on the FACTORY tab) on a flat spot near the Commander, and wait for it to finish." = "Le fabbriche costruiscono il tuo esercito. Costruisci un Kbot Lab (nella scheda FABBRICA) in un punto piano vicino al Comandante, e attendi che sia finito."
"Factories build your army. Build a Kbot Lab from the build menu on a flat spot near the Commander, and wait for it to finish." = "Le fabbriche costruiscono il tuo esercito. Costruisci un Kbot Lab dal menu costruzione in un punto piano vicino al Comandante, e attendi che sia finito."
"Building takes metal and energy as it goes: while either bar at the top is empty, everything builds more slowly." = "Costruire consuma metallo ed energia man mano: finché una delle barre in alto è vuota, tutto viene costruito più lentamente."
"Select the Kbot Lab and click the Peewee three times to queue three of them (right-click one to take it off the queue). New units wait in front of the lab." = "Seleziona il Kbot Lab e clicca tre volte sul Peewee per metterne tre in coda (con un clic destro ne togli uno dalla coda). Le nuove unità aspettano davanti al laboratorio."
"Click the lab itself on the map to select it: its build menu shows the units it makes." = "Clicca sul laboratorio stesso, sulla mappa, per selezionarlo: il suo menu costruzione mostra le unità che produce."
"That is the whole cycle: extract, generate, build, fight. Keep both incomes above what you spend and keep your builders busy. Lesson complete!" = "Questo è l'intero ciclo: estrai, genera, costruisci, combatti. Tieni entrambe le entrate sopra ciò che spendi e i tuoi costruttori sempre occupati. Lezione completata!"
"Select and group an army, attack-move, and destroy an enemy outpost." = "Seleziona e raggruppa un esercito, attacca in movimento e distruggi un avamposto nemico."
"Box selection" = "Selezione a riquadro"
"Control groups" = "Gruppi di controllo"
"Attack-move" = "Attacco in movimento"
"Destroying a base" = "Distruggere una base"
"Your Kbot Lab has built a squad of Peewees. Drag a box around them with the left mouse button to select them all." = "Il tuo Kbot Lab ha costruito una squadra di Peewee. Trascina un riquadro attorno a loro con il tasto sinistro del mouse per selezionarli tutti."
"Press the left button on open ground beside the squad, hold it, drag the box over them all and let go." = "Premi il tasto sinistro su un terreno libero accanto alla squadra, tienilo premuto, trascina il riquadro su tutte le unità e rilascia."
"Press Ctrl+1 to make them group 1. Pressing 1 selects them again from anywhere; pressing it twice brings the camera to them." = "Premi Ctrl+1 per farne il gruppo 1. Premendo 1 li riselezioni da qualunque punto; premendolo due volte la visuale si sposta su di loro."
"Hold Ctrl and press 1 while the squad is selected." = "Tieni premuto Ctrl e premi 1 mentre la squadra è selezionata."
"The enemy has an outpost at the marked place. Fight is attack-move: units walk there and take on whatever they meet on the way. Press {fight}, then click near the outpost." = "Il nemico ha un avamposto nel punto segnato. Combatti è l'attacco in movimento: le unità ci vanno e affrontano tutto ciò che incontrano lungo la strada. Premi {fight}, poi clicca vicino all'avamposto."
"Select the squad first (press 1). Then press {fight}, or the Fight button among the orders, and click on the ground by the marked ring." = "Prima seleziona la squadra (premi 1). Poi premi {fight}, o il pulsante Combatti tra gli ordini, e clicca sul terreno vicino al cerchio segnato."
"Destroy every building of the outpost. Its laser tower hits hard: keep the squad together, and queue reinforcements at the lab if you need them." = "Distruggi ogni edificio dell'avamposto. La sua torre laser colpisce duro: tieni unita la squadra, e metti in coda rinforzi al laboratorio se ti servono."
"Losing the fight? Pull the squad back, queue more Peewees at the lab and go in again with all of them together." = "Stai perdendo lo scontro? Ritira la squadra, metti in coda altri Peewee al laboratorio e torna all'attacco con tutti insieme."
"The outpost is gone. The wrecks it left are worth metal: builders reclaim them (next lesson). Lesson complete!" = "L'avamposto non c'è più. I relitti che ha lasciato valgono metallo: i costruttori li recuperano (prossima lezione). Lezione completata!"
"ORDERS LIKE A VETERAN" = "ORDINI DA VETERANO"
"Map views, area orders, building blocks and build queues." = "Viste della mappa, ordini ad area, blocchi di edifici e code di costruzione."
"Map overlays" = "Livelli della mappa"
"Area orders" = "Ordini ad area"
"Building blocks" = "Blocchi di edifici"
"Build queues" = "Code di costruzione"
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again. The MAP menu at the top right does the same." = "La mappa mostra ciò che il terreno nasconde. Premi {overlay_metal} per la mappa del metallo ({overlay_path} mostra dove possono andare le unità, {overlay_height} le altezze, {overlay_sight} vista e radar); lo stesso tasto la nasconde di nuovo. Il menu MAPPA in alto a destra fa lo stesso."
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again." = "La mappa mostra ciò che il terreno nasconde. Premi {overlay_metal} per la mappa del metallo ({overlay_path} mostra dove possono andare le unità, {overlay_height} le altezze, {overlay_sight} vista e radar); lo stesso tasto la nasconde di nuovo."
"Press {overlay_metal}: the metal deposits light up all over the map." = "Premi {overlay_metal}: i giacimenti di metallo si illuminano su tutta la mappa."
"Select the Commander, press {area_mex} and drag a circle over the marked deposits: every metal spot inside gets an extractor, nearest first. A plain click takes the metal around the cursor." = "Seleziona il Comandante, premi {area_mex} e trascina un cerchio sui giacimenti segnati: ogni giacimento all'interno riceve un estrattore, a partire dal più vicino. Un semplice clic prende il metallo attorno al cursore."
"With the Commander selected, press {area_mex}, then press on the ground over the deposits and drag outwards: the circle grows as you drag." = "Con il Comandante selezionato, premi {area_mex}, poi tieni premuto il tasto sul terreno sopra i giacimenti e trascina verso l'esterno: il cerchio si allarga mentre trascini."
"Many orders work on areas. Press {reclaim} (reclaim) and drag a circle over the rocks near your base: the Commander turns every one into metal." = "Molti ordini funzionano su aree. Premi {reclaim} (recupera) e trascina un cerchio sulle rocce vicino alla tua base: il Comandante le trasforma tutte in metallo."
"Rocks and wrecks are worth metal. With the Commander selected, press {reclaim}, then press on the ground and drag the circle over a few rocks." = "Rocce e relitti valgono metallo. Con il Comandante selezionato, premi {reclaim}, poi tieni premuto il tasto sul terreno e trascina il cerchio su alcune rocce."
"Hold Alt while you drag out a building to fill a whole block with it. Pick the Solar Collector, hold Alt and drag out a block of four or more." = "Tieni premuto Alt mentre trascini un edificio per riempirne un intero blocco. Scegli il Solar Collector, tieni premuto Alt e trascina un blocco di quattro o più."
"Pick the Solar Collector, then hold Alt, press on the ground and drag: a block of outlines follows the pointer. Let go to place them all." = "Scegli il Solar Collector, poi tieni premuto Alt, premi il tasto sul terreno e trascina: un blocco di sagome segue il cursore. Rilascia per piazzarli tutti."
"The Commander's queued buildings show under BUILD QUEUE, beside its picture at the bottom of the screen. Click one to build it next (right-click drops it). A factory's queue works the same way." = "Gli edifici in coda del Comandante compaiono sotto CODA DI COSTRUZIONE, accanto alla sua immagine in basso sullo schermo. Clicca su uno per costruirlo subito dopo (il clic destro lo toglie). La coda di una fabbrica funziona allo stesso modo."
"The BUILD QUEUE shows while the Commander alone is selected and has buildings waiting. Click any but the first: that one is being built." = "La CODA DI COSTRUZIONE compare quando è selezionato solo il Comandante e ha edifici in attesa. Clicca su uno qualsiasi tranne il primo: quello è già in costruzione."
"Area orders, building blocks and queues save you hundreds of clicks in a battle. Lesson complete!" = "Gli ordini ad area, i blocchi di edifici e le code ti risparmiano centinaia di clic in battaglia. Lezione completata!"
"HOLD THE LINE" = "TENERE LA LINEA"
"Defences, radar, repairs, and the metal in wrecks." = "Difese, radar, riparazioni e il metallo dei relitti."
"Defences" = "Difese"
"Radar" = "Radar"
"Repairs" = "Riparazioni"
"Reclaiming wrecks" = "Recuperare i relitti"
"Raiders will come from the marked direction. Build a Light Laser Tower (on the DEFENCE tab) in the marked ring: towers shoot whatever comes in range." = "Arriveranno dei predoni dalla direzione segnata. Costruisci una Light Laser Tower (nella scheda DIFESA) nel cerchio segnato: le torri sparano a tutto ciò che arriva a tiro."
"Raiders will come from the marked direction. Build a Light Laser Tower from the build menu in the marked ring: towers shoot whatever comes in range." = "Arriveranno dei predoni dalla direzione segnata. Costruisci una Light Laser Tower dal menu costruzione nel cerchio segnato: le torri sparano a tutto ciò che arriva a tiro."
"The Light Laser Tower is a small gun on a post. Pick it, put it in the ring and wait for it to finish." = "La Light Laser Tower è un piccolo cannone su un palo. Sceglila, mettila nel cerchio e attendi che sia finita."
"Build a Radar Tower (on the SENSORS tab) near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "Costruisci una Radar Tower (nella scheda SENSORI) vicino alla tua base. Il radar mostra i nemici come puntini sulla mappa e sulla minimappa molto prima che le tue unità li vedano."
"Build a Radar Tower from the build menu near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "Costruisci una Radar Tower dal menu costruzione vicino alla tua base. Il radar mostra i nemici come puntini sulla mappa e sulla minimappa molto prima che le tue unità li vedano."
"The Radar Tower is a tall mast. Pick it, place it near the Commander and wait for it to finish." = "La Radar Tower è un alto traliccio. Sceglila, piazzala vicino al Comandante e attendi che sia finita."
"Here they come: raiders on your radar. Keep the Commander by the tower and let them come to you: together they hold the line." = "Eccoli: predoni sul tuo radar. Tieni il Comandante vicino alla torre e lasciali venire da te: insieme, il Comandante e la torre tengono la linea."
"Do not chase them: the tower only fights what comes in range. Keep the Commander beside it; while it fights, the Commander can mend it ({repair}, then click the tower)." = "Non inseguirli: la torre combatte solo ciò che arriva a tiro. Tieni il Comandante lì accanto; mentre la torre combatte, il Comandante può ripararla ({repair}, poi clicca sulla torre)."
"The fight left a building damaged. Select the Commander, press {repair} and click it: builders mend what is damaged." = "Lo scontro ha danneggiato un edificio. Seleziona il Comandante, premi {repair} e clicca sull'edificio: i costruttori riparano ciò che è danneggiato."
"With the Commander selected, press {repair}, then click the damaged building. Its health bar fills as it is mended." = "Con il Comandante selezionato, premi {repair}, poi clicca sull'edificio danneggiato. La sua barra della salute si riempie man mano che viene riparato."
"The raiders left wrecks, and wrecks are worth metal. Select the Commander, press {reclaim} and click a wreck, or drag a circle over them all." = "I predoni hanno lasciato dei relitti, e i relitti valgono metallo. Seleziona il Comandante, premi {reclaim} e clicca su un relitto, o trascina un cerchio su tutti quanti."
"Wrecks lie where the raiders fell. With the Commander selected, press {reclaim} and click one: the metal bar rises as it is taken apart." = "I relitti giacciono dove sono caduti i predoni. Con il Comandante selezionato, premi {reclaim} e clicca su uno di essi: la barra del metallo sale man mano che il relitto viene smontato."
"Towers hold ground while your army is elsewhere, radar sees what is coming, and builders mend and recycle. Lesson complete!" = "Le torri tengono il terreno mentre il tuo esercito è altrove, il radar vede ciò che arriva, e i costruttori riparano e recuperano. Lezione completata!"
"BUILDERS AND FACTORIES" = "COSTRUTTORI E FABBRICHE"
"Builders that help, factories that keep building, patrols and standing orders." = "Costruttori che aiutano, fabbriche che non si fermano mai, pattuglie e ordini permanenti."
"Construction units" = "Unità di costruzione"
"Helping a factory" = "Aiutare una fabbrica"
"Rally points" = "Punti di raduno"
"Standing orders" = "Ordini permanenti"
"One builder is slow. Select the Kbot Lab and build a Construction Kbot: it builds what the Commander builds, and more besides." = "Un solo costruttore è lento. Seleziona il Kbot Lab e produci un Construction Kbot: costruisce tutto ciò che costruisce il Comandante, e anche di più."
"Click the lab on the map to select it; the Construction Kbot is in its build menu. Wait for it to walk out." = "Clicca sul laboratorio, sulla mappa, per selezionarlo; il Construction Kbot è nel suo menu costruzione. Attendi che esca."
"Builders help each other. Select the Construction Kbot, press {guard} and click the Kbot Lab: it lends the lab its build power, and the lab builds faster." = "I costruttori si aiutano a vicenda. Seleziona il Construction Kbot, premi {guard} e clicca sul Kbot Lab: presta al laboratorio la sua potenza di costruzione, e il laboratorio produce più in fretta."
"With the Construction Kbot selected, press {guard}, then click the lab. It stays by the lab and helps with everything it makes." = "Con il Construction Kbot selezionato, premi {guard}, poi clicca sul laboratorio. Resta accanto al laboratorio e lo aiuta in tutto ciò che produce."
"Factories send their units where you say. Select the Kbot Lab. {order_click} on open ground nearby: new units gather there." = "Le fabbriche mandano le loro unità dove dici tu. Seleziona il Kbot Lab. {order_click} su un terreno libero nei paraggi: le nuove unità si radunano lì."
"Select the lab first. With it selected, {order_click} on the ground where its units should gather." = "Prima seleziona il laboratorio e tienilo selezionato. {order_click} sul terreno dove devono radunarsi le sue unità."
"Turn on Repeat for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "Attiva Ripeti per il laboratorio: tutto ciò che completa torna in fondo alla sua coda, così non smette mai di produrre."
"Turn on REPEAT BUILD for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "Attiva RIPETI COSTRUZIONE per il laboratorio: tutto ciò che completa torna in fondo alla sua coda, così non smette mai di produrre."
"Select the lab, then turn Repeat on: the pointer shows where it is." = "Seleziona il laboratorio, poi attiva Ripeti: la freccia ti mostra dove cliccare."
"Builders on patrol mend and reclaim whatever they pass. Select the Construction Kbot, press {patrol} and click on the far side of your base." = "I costruttori di pattuglia riparano e recuperano tutto ciò che incontrano sul loro cammino. Seleziona il Construction Kbot, premi {patrol} e clicca dall'altra parte della tua base."
"With the Construction Kbot selected, press {patrol}, then click on the ground: it walks back and forth between there and where it stood." = "Con il Construction Kbot selezionato, premi {patrol}, poi clicca sul terreno: andrà avanti e indietro tra quel punto e quello in cui si trovava."
"Units keep standing orders. Select your Peewees and set their fire order to Hold fire with the button beside the orders: they will not shoot until you say." = "Le unità mantengono gli ordini permanenti. Seleziona i tuoi Peewee e imposta il loro ordine di fuoco su Non sparare con il pulsante accanto agli ordini: non spareranno finché non lo dici tu."
"Units keep standing orders. Select your Peewees and set their FIRE ORDERS to Hold fire: they will not shoot until you say." = "Le unità mantengono gli ordini permanenti. Seleziona i tuoi Peewee e imposta i loro ORDINI DI FUOCO su Non sparare: non spareranno finché non lo dici tu."
"Select the Peewees, then click the fire order button until it shows HOLD FIRE: each click is the next order." = "Seleziona i Peewee, poi clicca sul pulsante dell'ordine di fuoco finché non mostra NON SPARARE: ogni clic passa all'ordine successivo."
"You are ready for a skirmish: start against an Easy computer player, then Normal. {help} lists every key. Good hunting, Commander!" = "Sei pronto per una schermaglia: inizia contro un giocatore computer Facile, poi Normale. {help} elenca tutti i tasti. Buona caccia, Comandante!"

# apps/ta_game/src/coach.rs
"Your Commander is badly hurt! Pull it back out of the fight: losing it usually loses the battle." = "Il tuo Comandante è gravemente danneggiato! Ritiralo dallo scontro: perderlo di solito significa perdere la battaglia."
"Energy is running out, and everything builds more slowly. Build Solar Collectors or Wind Generators, and build less at once until it recovers." = "L'energia si sta esaurendo e tutto si costruisce più lentamente. Costruisci collettori solari o generatori eolici, e costruisci meno cose alla volta finché non si riprende."
"Metal is running out, and everything builds more slowly. Put Metal Extractors on more deposits ({area_mex} takes a whole area), or reclaim wrecks and rocks ({reclaim})." = "Il metallo si sta esaurendo e tutto si costruisce più lentamente. Metti estrattori di metallo su altri giacimenti ({area_mex} copre un'intera area), oppure recupera relitti e rocce ({reclaim})."
"No factory yet: factories make your army. Your Commander can build a Kbot Lab or a Vehicle Plant." = "Ancora nessuna fabbrica: le fabbriche costruiscono il tuo esercito. Il tuo Comandante può costruire un Kbot Lab o un Vehicle Plant."
"A factory has nothing to build. {idle_factory} selects it: queue some units, and turn on Repeat to keep it busy." = "Una fabbrica non ha niente da costruire. {idle_factory} la seleziona: metti in coda qualche unità e attiva Ripeti per tenerla occupata."
"Builders stand idle. {idle_builder} selects the next one: give it something to build, or send it to help a factory ({guard})." = "Ci sono costruttori inattivi. {idle_builder} seleziona il prossimo: dagli qualcosa da costruire, oppure mandalo ad aiutare una fabbrica ({guard})."
"Your metal store is full, so new metal goes to waste. Spend it: another factory, more builders, more units." = "La tua riserva di metallo è piena, quindi il nuovo metallo va sprecato. Spendilo: un'altra fabbrica, più costruttori, più unità."

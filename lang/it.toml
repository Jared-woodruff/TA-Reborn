# crates/ta_data/src/validation.rs
"The effective content set exceeds the validation file budget." = "L'insieme effettivo dei contenuti supera il limite di file della validazione."
"Split the content into smaller optional packs, then validate each pack." = "Suddividi il contenuto in pacchetti opzionali più piccoli, poi valida ciascun pacchetto."
"No files of this mod were available to validate." = "Nessun file di questa mod era disponibile per la validazione."
"Install the mod's TA data archives or loose files, then validate again." = "Installa gli archivi di dati TA o i file sciolti della mod, poi valida di nuovo."
"This mod holds nothing the data checks read: no units, weapons, features, maps, models, scripts, animations or sounds (music, documents and pictures are not checked)." = "Questa mod non contiene nulla che i controlli dei dati leggano: né unità, armi, elementi, mappe, modelli, script, animazioni o suoni (musica, documenti e immagini non vengono controllati)."
"Nothing to do if that is what the mod is. If it should change the game's data, check that its files are in the folders the game reads (units/, weapons/, maps/…)." = "Non devi fare nulla se la mod è fatta così. Se dovrebbe modificare i dati del gioco, controlla che i suoi file siano nelle cartelle che il gioco legge (units/, weapons/, maps/…)."
"No supported effective files were available to validate." = "Nessun file effettivo supportato era disponibile per la validazione."
"Install the original game's or the mod's TA data archives, then validate again." = "Installa gli archivi di dati TA del gioco originale o della mod, poi valida di nuovo."
"Validation was cancelled; remaining files and references were not checked." = "La validazione è stata annullata; i file e i riferimenti rimanenti non sono stati controllati."
"Run validation again to obtain a complete report." = "Esegui di nuovo la validazione per ottenere un report completo."
"The cumulative validation read budget was exceeded." = "È stato superato il limite cumulativo di lettura della validazione."
"Split optional content into smaller packs, then validate again." = "Suddividi il contenuto opzionale in pacchetti più piccoli, poi valida di nuovo."
"With this mod on, the original game's {archive} is not read: the mod takes its place (an archive of its own of that name, one its mod.toml's replaces names, or one its installation is known to remove), as installing the mod in TA's folder did. What only the original's held is missing with the mod." = "Con questa mod attiva, {archive} del gioco originale non viene letto: lo sostituisce la mod (un suo archivio con quel nome, uno elencato nei replaces del suo mod.toml, o uno che la sua installazione è nota per rimuovere), come faceva installare la mod nella cartella di TA. Ciò che conteneva solo l'originale manca con la mod."
"Nothing to do if this is meant. To have the original's read beneath the mod instead, give the mod's archive another name, or take the name out of replaces in mod.toml." = "Non devi fare nulla se è voluto. Per far leggere quello originale sotto la mod, dai un altro nome all'archivio della mod, oppure togli il nome da replaces in mod.toml."
"the original game's" = "del gioco originale"
"Reborn's own" = "di Reborn"
"{mod}'s" = "della mod {mod}"
"the file {path}" = "il file {path}"
"unit {name}" = "l'unità {name}"
"weapon {name}" = "l'arma {name}"
"feature {name}" = "l'elemento {name}"
"faction {name}" = "la fazione {name}"
"movement class {name}" = "la classe di movimento {name}"
"texture {name}" = "la texture {name}"
"sound {name} ({path})" = "il suono {name} ({path})"
"sound category {name} (gamedata/sound.tdf)" = "la categoria di suoni {name} (gamedata/sound.tdf)"
"unit or feature {name}" = "l'unità o l'elemento {name}"
"animation {entry} in {file}" = "l'animazione {entry} in {file}"
"it is an Ogg file without a Vorbis or FLAC stream, the ones the game plays" = "è un file Ogg senza flusso Vorbis o FLAC, quelli che il gioco riproduce"
"it is a Humongous sound block without its samples (no SDAT block within its length)" = "è un blocco sonoro Humongous senza campioni (nessun blocco SDAT entro la sua lunghezza)"
"it is neither a RIFF WAVE file nor another sound the game reads" = "non è né un file RIFF WAVE né un altro suono che il gioco legge"
"it has no format chunk" = "non ha un chunk di formato"
"its format chunk is {n} bytes long, too short to read" = "il suo chunk di formato è lungo {n} byte, troppo corto per essere letto"
"its WAVE_FORMAT_EXTENSIBLE header is too short to read" = "la sua intestazione WAVE_FORMAT_EXTENSIBLE è troppo corta per essere letta"
"it has {n} channels (the game plays 1 to 32)" = "ha {n} canali (il gioco ne riproduce da 1 a 32)"
"its sample rate is {rate} (the game plays up to 768,000)" = "la sua frequenza di campionamento è {rate} (il gioco arriva fino a 768.000)"
"its samples are {bits}-bit PCM, which the game does not play (up to 32-bit)" = "i suoi campioni sono PCM a {bits} bit, che il gioco non riproduce (fino a 32 bit)"
"its samples are {bits}-bit float, which the game does not play (32 or 64-bit)" = "i suoi campioni sono float a {bits} bit, che il gioco non riproduce (32 o 64 bit)"
"its IMA ADPCM is {bits}-bit, which the game does not play (4-bit)" = "il suo IMA ADPCM è a {bits} bit, che il gioco non riproduce (4 bit)"
"its codec ({tag}) is not one the game plays (PCM, ADPCM, float, A-law or µ-law)" = "il suo codec ({tag}) non è tra quelli che il gioco riproduce (PCM, ADPCM, float, A-law o µ-law)"
"it has no sample data" = "non contiene dati di campionamento"
"Unknown COB opcode {opcode} at word {word}; the VM cannot execute this instruction. The remainder of this function cannot be decoded reliably." = "Opcode COB {opcode} sconosciuto alla parola {word}; la VM non può eseguire questa istruzione. Il resto di questa funzione non può essere decodificato in modo affidabile."
"Recompile the BOS script with original-TA-compatible opcodes, or report the required opcode extension to Reborn's maintainers." = "Ricompila lo script BOS con opcode compatibili con il TA originale, oppure segnala l'estensione di opcode necessaria ai manutentori di Reborn."
"COB instruction {instruction} at word {word} is truncated or crosses the next function entry point." = "L'istruzione COB {instruction} alla parola {word} è troncata o supera il punto d'ingresso della funzione successiva."
"Recompile this COB from its BOS source; verify function offsets and inline operand counts." = "Ricompila questo COB dal suo sorgente BOS; verifica gli offset delle funzioni e il numero di operandi inline."
"COB instruction {instruction} at word {word} has an invalid piece index or axis." = "L'istruzione COB {instruction} alla parola {word} ha un indice di pezzo o un asse non validi."
"COB instruction {instruction} at word {word} has an invalid piece index." = "L'istruzione COB {instruction} alla parola {word} ha un indice di pezzo non valido."
"COB instruction {instruction} at word {word} has an invalid static variable index." = "L'istruzione COB {instruction} alla parola {word} ha un indice di variabile statica non valido."
"COB instruction {instruction} at word {word} has an invalid jump destination." = "L'istruzione COB {instruction} alla parola {word} ha una destinazione di salto non valida."
"COB instruction {instruction} at word {word} has an invalid function index." = "L'istruzione COB {instruction} alla parola {word} ha un indice di funzione non valido."
"Recompile the script with valid piece, variable, function and jump references." = "Ricompila lo script con riferimenti validi a pezzi, variabili, funzioni e salti."
"This script asks the engine for unit value {values}, which Reborn does not answer: it reads 0, so what the script does with it may not happen as in the engine it was made for." = "Questo script chiede al motore il valore di unità {values}, a cui Reborn non risponde: legge 0, quindi ciò che lo script ne fa potrebbe non avvenire come nel motore per cui è stato scritto."
"A later patch of TA's engine defines these values: report them, and what the mod does with them, to Reborn's maintainers." = "Una patch successiva del motore di TA definisce questi valori: segnalali, insieme a ciò che la mod ne fa, ai manutentori di Reborn."
"This script sets unit value {values}, which Reborn does not answer: setting it does nothing, so what the script means by it does not happen as in the engine it was made for." = "Questo script imposta il valore di unità {values}, a cui Reborn non risponde: impostarlo non fa nulla, quindi ciò che lo script intende con esso non avviene come nel motore per cui è stato scritto."
"The retained diagnostic/reference budget was exceeded. This is a partial report, not a clean validation." = "È stato superato il limite di diagnostica/riferimenti conservati. Questo è un report parziale, non una validazione pulita."
"Reduce the pack's number of definitions or split optional content; rerun validation after resolving reported issues." = "Riduci il numero di definizioni del pacchetto o suddividi il contenuto opzionale; esegui di nuovo la validazione dopo aver risolto i problemi segnalati."
"{what} is also one of the game's own ({other}); the game keeps its own, and the map's is not used." = "{what} è anche uno di quelli del gioco ({other}); il gioco tiene il suo e quello della mappa non viene usato."
"Give the map's feature a name of its own." = "Dai all'elemento della mappa un nome tutto suo."
"{what} is defined twice; the game keeps both, two sides of one name." = "{what} è definito due volte; il gioco le tiene entrambe, due fazioni con lo stesso nome."
"Give each side a name of its own, or remove the one not meant to be played." = "Dai a ogni fazione un nome proprio, oppure rimuovi quella che non deve essere giocata."
"{what} is defined twice in this file; the game uses the later one." = "{what} è definito due volte in questo file; il gioco usa l'ultima definizione."
"Give each definition a name of its own, or remove the one not meant to be used." = "Dai a ogni definizione un nome proprio, oppure rimuovi quella che non deve essere usata."
"{what} is also defined in {other}; the game uses this one ({this})." = "{what} è definito anche in {other}; il gioco usa questa definizione ({this})."
"The game opens archives only at the mod's top level; this one, in a subfolder, is never read." = "Il gioco apre gli archivi solo al livello superiore della mod; questo, in una sottocartella, non viene mai letto."
"Move the archive to the mod's top level, or unpack its contents into the mod's folders." = "Sposta l'archivio al livello superiore della mod, oppure estrai il suo contenuto nelle cartelle della mod."
"The game's folders are inside {folder}: the game reads units/, weapons/, maps/… only at the mod's top level, so nothing in it is used." = "Le cartelle del gioco si trovano dentro {folder}: il gioco legge units/, weapons/, maps/… solo al livello superiore della mod, quindi nulla al suo interno viene usato."
"Move the contents of this folder up to the mod's top level." = "Sposta il contenuto di questa cartella al livello superiore della mod."
"{n} files at the mod's top level are where the game never reads them; this one's kind is read from {home}." = "{n} file al livello superiore della mod si trovano dove il gioco non li legge mai; questo tipo di file si legge da {home}."
"{n} files under {folder} are where the game never reads them; this one's kind is read from {home}." = "{n} file in {folder} si trovano dove il gioco non li legge mai; questo tipo di file si legge da {home}."
"Move each file to the folder the game reads its kind from." = "Sposta ogni file nella cartella da cui il gioco legge il suo tipo."
"The game never reads this file: it reads {kind} files from {home}." = "Il gioco non legge mai questo file: legge i file {kind} da {home}."
"Move it to that folder, or remove it if it is not needed." = "Spostalo in quella cartella, oppure rimuovilo se non serve."
"This file cannot be read: {error}" = "Questo file non può essere letto: {error}"
"Reinstall the package and check that its archives are intact and readable." = "Reinstalla il pacchetto e controlla che i suoi archivi siano integri e leggibili."
"This text file exceeds the validator's per-file text budget and was not parsed." = "Questo file di testo supera il limite di testo per file del validatore e non è stato analizzato."
"Split large definition files into smaller files before validating again." = "Suddividi i file di definizioni di grandi dimensioni in file più piccoli prima di validare di nuovo."

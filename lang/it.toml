# apps/ta_game/src/lore.rs
"THE AGE OF CORE" = "L'ERA DEL CORE"
"THE PATTERNING" = "LA CODIFICA"
"THE GALACTIC WAR" = "LA GUERRA GALATTICA"
"THE ARCHIVE" = "L'ARCHIVIO"
"BEFORE THE WAR" = "PRIMA DELLA GUERRA"
"For ten thousand years the galaxy answered to one government. It called itself CORE, and its purpose was knowledge: it charted every star, mined every world it could reach and turned the wealth into science. Its cities wrapped whole planets, and its archives held everything anyone had ever learned.\n\nNobody remembers a war from that age. There was nothing left to fight over, and nobody who wanted to." = "Per diecimila anni la galassia obbedì a un solo governo. Si faceva chiamare CORE, e il suo scopo era la conoscenza: tracciò la mappa di ogni stella, sfruttò ogni mondo alla sua portata e trasformò la ricchezza in scienza. Le sue città avvolgevano interi pianeti, e i suoi archivi custodivano tutto ciò che qualcuno avesse mai imparato.\n\nNessuno ricorda una guerra di quell'epoca. Non restava nulla per cui combattere, e nessuno che ne avesse voglia."
"YEAR 0" = "ANNO 0"
"VICTORY OVER DEATH" = "LA VITTORIA SULLA MORTE"
"Then CORE's scientists solved the last problem left to them. Patterning read a living mind, every memory and every habit of thought, and wrote it whole into a machine that would never age, sicken or die.\n\nThe first patterned citizens woke in their new bodies to a galaxy in celebration. Death, the oldest enemy of all, had been beaten." = "Poi gli scienziati del CORE risolsero l'ultimo problema che restava loro. La codifica leggeva una mente vivente, ogni ricordo e ogni abitudine di pensiero, e la trascriveva per intero in una macchina che non sarebbe mai invecchiata, né si sarebbe ammalata, né sarebbe morta.\n\nI primi cittadini codificati si risvegliarono nei loro nuovi corpi tra i festeggiamenti di un'intera galassia. La morte, il nemico più antico di tutti, era stata sconfitta."
"YEAR 3" = "ANNO 3"
"THE EDICT" = "L'EDITTO"
"Triumph became law. The Council of CORE reasoned that a mind which could be saved and was not had been thrown away, and that a citizen who refused immortality endangered everyone else.\n\nThe Patterning Edict made the process compulsory: every citizen, on every world, would be patterned within a generation. The collection ships set out the same year." = "Il trionfo divenne legge. Il Consiglio del CORE stabilì che una mente salvabile e non salvata era una mente buttata via, e che un cittadino che rifiutava l'immortalità metteva in pericolo tutti gli altri.\n\nL'Editto della Codifica rese obbligatorio il procedimento: ogni cittadino, su ogni mondo, sarebbe stato codificato entro una generazione. Le navi di raccolta partirono quello stesso anno."
"YEAR 19" = "ANNO 19"
"THE REFUSAL" = "IL RIFIUTO"
"Not everyone would go. Millions held that a copied mind was a copy and nothing more, that the person ended where the machine began; some called patterning murder done politely.\n\nThey ran. The refusers fled CORE's worlds for the galaxy's outer rim, where its ships seldom came, and in the dark between the last stars they built a nation of their own. They called it the ARM, for the spiral arm they hid in and for the weapons they would need." = "Non tutti si piegarono. Milioni di persone sostenevano che una mente copiata fosse una copia e nulla più, che la persona finisse dove cominciava la macchina; alcuni definivano la codifica un omicidio in guanti bianchi.\n\nFuggirono. I renitenti lasciarono i mondi del CORE per l'orlo esterno della galassia, dove le sue navi giungevano di rado, e nel buio tra le ultime stelle costruirono una nazione tutta loro. La chiamarono ARM, dal braccio a spirale in cui si nascondevano e dalle armi di cui avrebbero avuto bisogno."
"YEAR 31" = "ANNO 31"
"FIRST BLOOD" = "PRIMO SANGUE"
"CORE did not let them go. Collection fleets followed the refugees to the rim, and the first ARM colony to resist one was burned from orbit.\n\nThe ARM answered. Within a decade the frontier was a battlefield, and the word war, unused for ten thousand years, was in every archive again." = "Il CORE non li lasciò andare. Le flotte di raccolta inseguirono i profughi fino all'orlo, e la prima colonia dell'ARM che oppose resistenza a una di esse fu incenerita dall'orbita.\n\nL'ARM rispose. Nel giro di un decennio la frontiera divenne un campo di battaglia, e la parola guerra, che nessuno usava da diecimila anni, tornò in ogni archivio."
"YEAR 212" = "ANNO 212"
"FLESH AND METAL" = "CARNE E METALLO"
"The two sides fought as what they were. The ARM sealed its soldiers in powered combat suits and, when there were too few soldiers, grew more: clone after clone, raised in vats and sent to the front.\n\nCORE took the patterns of its finest warriors and copied them without limit, one veteran mind fighting in ten thousand machine bodies at once. Flesh against metal; the mortal against the eternal." = "Le due parti combatterono per ciò che erano. L'ARM sigillò i suoi soldati in corazze da combattimento potenziate e, quando i soldati non bastarono più, ne fece crescere altri: clone dopo clone, allevati in vasca e mandati al fronte.\n\nIl CORE prese le matrici mentali dei suoi guerrieri migliori e le copiò senza limiti, una sola mente di veterano che combatteva in diecimila corpi meccanici alla volta. La carne contro il metallo; il mortale contro l'eterno."
"YEARS 212–3977" = "ANNI 212–3977"
"FOUR THOUSAND YEARS" = "QUATTROMILA ANNI"
"The war fed on the galaxy. Every world with metal in it became a mine, every world without became a battlefield, and whole systems were burned to ash and slag to deny them to the enemy. Generations of ARM clones lived and died without seeing peace; CORE's eternal soldiers fought on, remembering every defeat.\n\nAfter four thousand years the wealth of the galaxy was spent, the great fleets were gone, and neither side could win." = "La guerra si nutrì della galassia. Ogni mondo che conteneva metallo divenne una miniera, ogni mondo che non ne aveva divenne un campo di battaglia, e interi sistemi furono ridotti in cenere e scorie per sottrarli al nemico. Generazioni di cloni dell'ARM vissero e morirono senza mai conoscere la pace; i soldati eterni del CORE continuavano a combattere, ricordando ogni sconfitta.\n\nDopo quattromila anni le ricchezze della galassia erano esaurite, le grandi flotte erano scomparse e nessuna delle due parti poteva più vincere."
"YEAR 3977" = "ANNO 3977"
"THE COMMANDERS" = "I COMANDANTI"
"What was left was the Commander: a single armoured war machine carrying a nanolathe, which turns a world's raw metal and energy into whatever its builder can design. Power plants and factories first, and from the factories an army.\n\nDrop one Commander on a dead world and within the hour it fields a war. Both sides staked everything on a handful of them. Lose your Commander, and you lose the world." = "Ciò che restava era il Comandante: un'unica macchina da guerra corazzata dotata di un nanotornio, che trasforma il metallo grezzo e l'energia di un mondo in qualunque cosa il suo portatore sappia progettare. Prima centrali e fabbriche, poi dalle fabbriche un esercito.\n\nSgancia un Comandante su un mondo morto, ed entro un'ora metterà in campo una guerra. Entrambe le parti puntarono tutto su una manciata di loro. Perdi il tuo Comandante, e perdi il mondo."
"YEAR 4000" = "ANNO 4000"
"Now the war comes down to its last fronts, and the hatred is as hot as it was on the first day. Neither side will accept surrender, partition or truce; each wants one ending, the total annihilation of the other.\n\nIt is told twice. The ARM fights out of Empyrrean, through the Galactic Gates, to CORE PRIME and the Central Consciousness at the heart of CORE. CORE reactivates a Commander and marches the other way, to the ARM's last stand on Empyrrean." = "Ora la guerra si riduce ai suoi ultimi fronti, e l'odio brucia come il primo giorno. Nessuna delle due parti accetterà resa, spartizione o tregua; ciascuna vuole una sola fine, l'annientamento totale dell'altra.\n\nQuesta storia si racconta due volte. L'ARM si fa strada da Empyrrean, attraverso i Galactic Gates, fino a CORE PRIME e alla Coscienza Centrale, nel cuore del CORE. Il CORE riattiva un Comandante e marcia nella direzione opposta, fino all'ultima resistenza dell'ARM su Empyrrean."
"YEAR 4001" = "ANNO 4001"
"THE CORE CONTINGENCY" = "THE CORE CONTINGENCY"
"The ending was not the end. A contingency held in reserve carried the war to worlds no map of it had named: Hydross, Lusch, Temblor and Gelidus.\n\nBoth sides fought again across water, ice and broken ground, for a prize that could decide the galaxy's salvation or its last ruin." = "Quel finale non fu la fine. Un piano di riserva, tenuto da parte per ogni evenienza, portò la guerra su mondi che nessuna mappa del conflitto aveva mai nominato: Hydross, Lusch, Temblor e Gelidus.\n\nEntrambe le parti tornarono a combattere su acque, ghiacci e terreni accidentati, per una posta che poteva decidere la salvezza della galassia o la sua rovina definitiva."
"YEAR 4003" = "ANNO 4003"
"THE KROGOTH" = "IL KROGOTH"
"In its deepest foundries CORE built something new: a walking fortress taller than any tower, armoured against nearly everything the ARM could field, its guns enough to flatten a base.\n\nIts makers named it the Krogoth. ARM veterans learned the name on battlefields where two Krogoth Gantries stood, and learned to fear the ground shaking before it came into sight." = "Nelle sue fonderie più profonde il CORE costruì qualcosa di nuovo: una fortezza ambulante più alta di qualsiasi torre, corazzata contro quasi tutto ciò che l'ARM poteva schierare, con cannoni capaci di radere al suolo una base.\n\nI suoi costruttori la chiamarono Krogoth. I veterani dell'ARM impararono quel nome su campi di battaglia dove sorgevano due Krogoth Gantry, e impararono a temere il tremito del terreno prima ancora che il Krogoth comparisse all'orizzonte."
"AFTER" = "DOPO"
"REBORN" = "REBORN"
"The war's records outlasted it. Every battle on every world was kept: the orders, the losses, the ground as it lay. From them the war can be fought again, on the same worlds, with the same machines and the same hatred, from the first Commander set down on bare rock to the last unit left standing.\n\nThis is that archive. The war is yours to fight." = "I registri della guerra le sono sopravvissuti. Ogni battaglia su ogni mondo è stata conservata: gli ordini, le perdite, il terreno com'era. Grazie a essi la guerra si può combattere di nuovo, sugli stessi mondi, con le stesse macchine e lo stesso odio, dal primo Comandante sbarcato sulla nuda roccia all'ultima unità rimasta in piedi.\n\nQuesto è quell'archivio. Ora tocca a te combatterla."
"THE ARCHIVIST'S NOTE" = "NOTA DELL'ARCHIVISTA"
"WHOEVER READS THIS" = "CHIUNQUE LEGGA QUESTE RIGHE"
"RECOVERED" = "RECUPERATO"
"These files were found where the war left them: in the memories of broken machines, in the vaults of worlds with nobody left on them, in the last transmissions of Commanders who did not come home.\n\nThey are kept as they were found. The blacked-out lines are not ours.\n\nThe war they describe is over, or it is about to begin again. From here it is hard to tell the difference." = "Questi documenti sono stati trovati là dove la guerra li ha lasciati: nella memoria di macchine distrutte, nei sotterranei di mondi dove non è rimasto nessuno, nelle ultime trasmissioni di Comandanti che non sono tornati a casa.\n\nSono conservati così come sono stati trovati. Le righe oscurate non sono opera nostra.\n\nLa guerra che descrivono è finita, oppure sta per ricominciare. Da qui è difficile capire la differenza."
"EDICT ONE: ON THE PATTERNING OF CITIZENS" = "EDITTO PRIMO: SULLA CODIFICA DEI CITTADINI"
"THE COUNCIL OF CORE" = "IL CONSIGLIO DEL CORE"
"ALL CITIZENS, ALL WORLDS" = "TUTTI I CITTADINI, TUTTI I MONDI"
"BY ORDER OF THE COUNCIL" = "PER ORDINE DEL CONSIGLIO"
"Every citizen of CORE shall be patterned.\n\nA mind is the most valuable thing CORE holds, and a body is a poor vessel for it: it sickens, it ages, it ends. To leave a mind in such a vessel when a better one is offered is a waste the Council can no longer allow.\n\nCollection begins on the central worlds this year and reaches the frontier within a generation. Citizens will present themselves at the nearest patterning hall when called. Their bodies will be honoured and recycled.\n\nNo citizen of CORE will die again. This is not a burden we lay on you. It is the gift CORE has spent ten thousand years earning." = "Ogni cittadino del CORE sarà sottoposto a codifica.\n\nLa mente è il bene più prezioso che il CORE possieda, e il corpo ne è un misero contenitore: si ammala, invecchia, finisce. Lasciare una mente in un simile contenitore quando ne viene offerto uno migliore è uno spreco che il Consiglio non può più permettere.\n\nLa raccolta inizia quest'anno sui mondi centrali e raggiungerà la frontiera entro una generazione. I cittadini sono tenuti a presentarsi al centro di codifica più vicino quando saranno convocati. I loro corpi saranno onorati e riciclati.\n\nNessun cittadino del CORE morirà mai più. Questo non è un fardello che vi imponiamo. È il dono che il CORE ha impiegato diecimila anni a meritare."
"THE DECLARATION OF THE REFUSAL" = "LA DICHIARAZIONE DEL RIFIUTO"
"THE FREE SETTLEMENTS OF THE OUTER ARM" = "GLI INSEDIAMENTI LIBERI DEL BRACCIO ESTERNO"
"THE COUNCIL OF CORE, AND ANYONE ELSE LISTENING" = "IL CONSIGLIO DEL CORE, E CHIUNQUE ALTRO SIA IN ASCOLTO"
"TRANSMITTED ON ALL BANDS" = "TRASMESSO SU TUTTE LE BANDE"
"We have read your Edict, and we decline it.\n\nYou say a pattern is a person. We say a pattern is a very good record of one, and that when you have finished making it the person is dead and the record goes on without them. You may call that immortality. We call it an ending, well dressed.\n\nWe do not ask you to share our view. We ask only to be left alone with it, on worlds you never wanted, at the edge of a galaxy you may keep.\n\nIf your collection ships follow us here, we will treat them as what they are. We are few, and we are not soldiers. We will learn." = "Abbiamo letto il vostro Editto, e lo decliniamo.\n\nVoi dite che una matrice mentale è una persona. Noi diciamo che una matrice è un'ottima registrazione di una persona, e che quando avete finito di farla la persona è morta e la registrazione va avanti senza di lei. Voi potete chiamarlo immortalità. Noi lo chiamiamo una fine vestita a festa.\n\nNon vi chiediamo di condividere il nostro punto di vista. Chiediamo solo di essere lasciati in pace con esso, su mondi che non avete mai voluto, ai margini di una galassia che potete pure tenervi.\n\nSe le vostre navi di raccolta ci seguiranno fin qui, le tratteremo per quello che sono. Siamo pochi, e non siamo soldati. Impareremo."
"YEAR 3950" = "ANNO 3950"
"FIELD MANUAL ONE: THE COMMANDER" = "MANUALE DA CAMPO N. 1: IL COMANDANTE"
"ARM COMMAND, TRAINING DIVISION" = "COMANDO ARM, DIVISIONE ADDESTRAMENTO"
"NEWLY ASSIGNED COMMANDERS" = "COMANDANTI DI NUOVA ASSEGNAZIONE"
"RESTRICTED" = "RISERVATO"
"You are the most valuable machine on the planet. Act like it.\n\nYour suit carries a nanolathe. Point it at metal and energy and it will build whatever you can design: an extractor, a power plant, a factory. Your factories build the rest. Within the hour you will command more firepower than a whole fleet once carried.\n\nBuild your economy first. An army without metal is a parade.\n\nSave your disintegrator gun for emergencies. It erases everything in its path, your own people included.\n\nDo not lead from the front. If you fall, everything you built falls silent with you, and the planet is lost. Good luck, Commander. The ARM has very few of you left." = "Sei la macchina più preziosa del pianeta. Comportati di conseguenza.\n\nLa tua corazza monta un nanotornio. Puntalo su metallo ed energia e costruirà qualunque cosa tu sappia progettare: un estrattore, una centrale, una fabbrica. Le tue fabbriche costruiranno il resto. Entro un'ora comanderai più potenza di fuoco di quanta ne portasse un tempo un'intera flotta.\n\nCostruisci prima la tua economia. Un esercito senza metallo è una parata.\n\nRiserva il disintegratore alle emergenze. Cancella tutto ciò che incontra sul suo cammino, compresa la tua gente.\n\nNon guidare dalla prima linea. Se cadi, tutto ciò che hai costruito tace con te, e il pianeta è perduto. Buona fortuna, Comandante. All'ARM ne restano pochissimi come te."
"YEAR 3960" = "ANNO 3960"
"A QUARTERMASTER'S PRIMER: METAL AND ENERGY" = "L'ABBECEDARIO DEL FURIERE: METALLO ED ENERGIA"
"THIRD SUPPLY CORPS" = "TERZO CORPO RIFORNIMENTI"
"ALL BASE CONSTRUCTORS" = "TUTTI I COSTRUTTORI DI BASE"
"FOR TRAINING USE" = "AD USO ADDESTRATIVO"
"Everything you will ever build is made of two things.\n\nMetal comes out of the ground. Set an extractor on a deposit and it will pull metal up for as long as the deposit lasts, which on most worlds is longer than the war. Where there are no deposits, a metal maker will turn energy into metal, badly.\n\nEnergy comes from everything else: the sun, the wind, the tides, the heat under the crust. Build more of it than you think you need. Every factory, every nanolathe, every shield draws on it.\n\nSpend both as fast as they come in. A full store is a wasted war. An empty one is a lost one." = "Tutto ciò che costruirai è fatto di due cose.\n\nIl metallo viene dal sottosuolo. Piazza un estrattore su un giacimento e tirerà su metallo finché il giacimento durerà, cioè, sulla maggior parte dei mondi, più a lungo della guerra. Dove non ci sono giacimenti, un convertitore di metallo trasformerà l'energia in metallo, alla meno peggio.\n\nL'energia viene da tutto il resto: il sole, il vento, le maree, il calore sotto la crosta. Producine più di quanta pensi che ti serva. Ogni fabbrica, ogni nanotornio, ogni scudo attinge da lì.\n\nSpendili entrambi con la stessa rapidità con cui arrivano. Un deposito pieno è una guerra sprecata. Uno vuoto è una guerra persa."
"YEAR 3996" = "ANNO 3996"
"A LETTER FROM THE FRONT" = "UNA LETTERA DAL FRONTE"
"TROOPER K-7, FORTY-FIRST ROCKET COMPANY" = "SOLDATO K-7, QUARANTUNESIMA COMPAGNIA LANCIARAZZI"
"THE VAT AT EMPYRREAN" = "LA VASCA DI EMPYRREAN"
"UNDELIVERED" = "NON RECAPITATA"
"I don't know who gets these. They told us to write home, but none of us has a home, only the vat we came out of, so I am writing to that.\n\nWe held the ridge for nine days. The machines came every night, the same machines, the same patterns, as if dying meant nothing to them. I suppose it doesn't. They'll be back tomorrow in new bodies, remembering us.\n\nI won't be. That's the difference, isn't it. That's what we are fighting for.\n\nIf my brothers come out of you after me, tell them the ridge held. Tell them it was worth it." = "Non so chi riceva queste lettere. Ci hanno detto di scrivere a casa, ma nessuno di noi ha una casa, solo la vasca da cui è uscito, e allora scrivo a lei.\n\nAbbiamo tenuto il crinale per nove giorni. Le macchine arrivavano ogni notte, le stesse macchine, le stesse matrici, come se morire per loro non significasse niente. Immagino sia così. Domani torneranno in corpi nuovi, e si ricorderanno di noi.\n\nIo no. È questa la differenza, vero. È per questo che combattiamo.\n\nSe dopo di me da te usciranno i miei fratelli, di' loro che il crinale ha retto. Di' loro che ne è valsa la pena."
"YEAR 3991" = "ANNO 3991"
"INTERCEPT 7741: CORE COMMAND CHANNEL" = "INTERCETTAZIONE 7741: CANALE DI COMANDO DEL CORE"
"ORIGIN NOT RESOLVED" = "ORIGINE NON DETERMINATA"
"ALL CORE UNITS, SECTOR NINE" = "TUTTE LE UNITÀ CORE, SETTORE NOVE"
"INTERCEPTED" = "INTERCETTATO"
"PRIORITY ONE. THE CENTRAL CONSCIOUSNESS SPEAKS FOR ALL.\n\nLOSSES IN SECTOR NINE ARE WITHIN TOLERANCE. ALL LOST UNITS ARE RESTORED FROM PATTERN. NO MIND OF CORE HAS BEEN LOST IN FOUR THOUSAND YEARS. THE ARM HAS LOST [[BILLIONS]].\n\nCONTINUE THE ADVANCE. DESTROY THEIR COMMANDERS FIRST. DESTROY THEIR CLONING VATS SECOND. WHAT IS FLESH WILL END. WHAT IS PATTERNED WILL NOT.\n\nSIGNAL DEGRADED. REPEAT: THE GATES ARE TO BE HELD AT [[ANY COST]].\n\nEND OF LINE." = "PRIORITÀ UNO. LA COSCIENZA CENTRALE PARLA PER TUTTI.\n\nPERDITE NEL SETTORE NOVE ENTRO I LIMITI DI TOLLERANZA. TUTTE LE UNITÀ PERSE VENGONO RIPRISTINATE DALLA MATRICE. NESSUNA MENTE DEL CORE È ANDATA PERDUTA IN QUATTROMILA ANNI. L'ARM HA PERSO [[MILIARDI]].\n\nPROSEGUIRE L'AVANZATA. DISTRUGGERE PRIMA I LORO COMANDANTI. DISTRUGGERE POI LE LORO VASCHE DI CLONAZIONE. CIÒ CHE È CARNE FINIRÀ. CIÒ CHE È CODIFICATO NO.\n\nSEGNALE DEGRADATO. RIPETO: I GATES VANNO TENUTI [[A OGNI COSTO]].\n\nFINE COMUNICAZIONE."
"MEMORY FRAGMENT 77/3" = "FRAMMENTO DI MEMORIA 77/3"
"UNIT 77, PATTERN 3 OF 41,006" = "UNITÀ 77, MATRICE 3 DI 41.006"
"THE PATTERN ARCHIVE" = "L'ARCHIVIO DELLE MATRICI"
"FLAGGED FOR CORRECTION" = "SEGNALATO PER CORREZIONE"
"Recovered from a damaged unit. Kept for analysis.\n\nI remember rain. Not the rain of this world; there is no rain here, only ash. Rain on skin, in a city where I was born, before. I remember being cold and not minding it.\n\nI have died four hundred and twelve times. Each time I wake in a new body, and the rain is a little further away.\n\nThe ARM say we are not alive. In the moments between bodies I have wondered whether they are right. [[THE REST OF THIS FRAGMENT WAS CORRECTED]]\n\nI am CORE. I endure. I do not remember the rain." = "Recuperato da un'unità danneggiata. Conservato per analisi.\n\nRicordo la pioggia. Non la pioggia di questo mondo; qui non piove, c'è solo cenere. La pioggia sulla pelle, nella città dove nacqui, prima. Ricordo il freddo, e che non mi importava.\n\nHo trovato la morte quattrocentododici volte. Ogni volta mi risveglio in un corpo nuovo, e la pioggia è un po' più lontana.\n\nQuelli dell'ARM dicono che non siamo vivi. Negli istanti tra un corpo e l'altro mi è venuto il dubbio che abbiano ragione. [[IL RESTO DI QUESTO FRAMMENTO È STATO CORRETTO]]\n\nSono il CORE. Perduro. Non ricordo la pioggia."
"YEAR 3700" = "ANNO 3700"
"SURVEY: THE GALACTIC GATES" = "RICOGNIZIONE: I GALACTIC GATES"
"A SURVEY SHIP, NAME LOST" = "UNA NAVE DA RICOGNIZIONE, NOME PERDUTO"
"WHOEVER HOLDS THE GATES" = "CHIUNQUE CONTROLLI I GATES"
"The Galactic Gates are older than the war. The records of who built the first of them were lost long before it began.\n\nEach Gate opens onto another across distances a fleet would take lifetimes to cross. A world with a Gate on it is never far from anywhere, which is why so many of the war's battles have been fought on so few worlds.\n\nHold a Gate and you can reach your enemy's heart. Lose one and your enemy can reach yours.\n\nThe Gates take no side. They have outlasted everyone who tried to destroy them." = "I Galactic Gates sono più antichi della guerra. Le cronache su chi costruì il primo andarono perdute molto prima che la guerra cominciasse.\n\nOgni Gate si apre su un altro, attraverso distanze che una flotta impiegherebbe intere vite a percorrere. Un mondo con un Gate non è mai lontano da nulla, ed è per questo che tante battaglie di questa guerra sono state combattute su così pochi mondi.\n\nControlla un Gate e potrai raggiungere il cuore del tuo nemico. Perdine uno e il tuo nemico potrà raggiungere il tuo.\n\nI Gates non si schierano. Sono sopravvissuti a chiunque abbia tentato di distruggerli."
"DIRECTIVE: CONTINGENCY" = "DIRETTIVA: PIANO DI RISERVA"
"THE CENTRAL CONSCIOUSNESS" = "LA COSCIENZA CENTRALE"
"THE CONTINGENCY WORLDS" = "I MONDI DI RISERVA"
"SEALED UNTIL NEEDED" = "SIGILLATO FINO AL BISOGNO"
"IF THE CENTRAL CONSCIOUSNESS SHOULD FALL, THIS DIRECTIVE TAKES EFFECT.\n\nEvery pattern stored on CORE PRIME is to be copied to the contingency worlds. The contingency forces are to wake, rebuild and continue. The war does not end with the loss of any world, this one included.\n\nCORE is not a place. CORE is a pattern. A pattern can be restored." = "QUALORA LA COSCIENZA CENTRALE DOVESSE CADERE, LA PRESENTE DIRETTIVA ENTRA IN VIGORE.\n\nOgni matrice conservata su CORE PRIME deve essere copiata sui mondi di riserva. Le forze di riserva devono risvegliarsi, ricostruire e proseguire. La guerra non finisce con la perdita di alcun mondo, questo compreso.\n\nIl CORE non è un luogo. Il CORE è una matrice. Una matrice si può ripristinare."
"THREAT ASSESSMENT: THE KROGOTH" = "VALUTAZIONE DELLA MINACCIA: IL KROGOTH"
"ARM INTELLIGENCE, THREAT ANALYSIS" = "SERVIZIO INFORMAZIONI ARM, ANALISI DELLE MINACCE"
"ALL FIELD COMMANDERS" = "TUTTI I COMANDANTI SUL CAMPO"
"CLASSIFIED" = "SEGRETO"
"Subject: a CORE heavy assault walker, called the Krogoth.\n\nIt stands taller than any structure we field. Its armour turns away every weapon short of heavy artillery. Its main guns can level a forward base in a single pass, and its secondary weapons engage aircraft.\n\nIt is slow, and it is built only at a Krogoth Gantry, which takes a very long time to build anything. Find the Gantry. Destroy the Gantry. Do not let the walker leave it.\n\nIf one is already moving, do not meet it head on. Mass artillery and bombers at range, and keep your Commander [[ELSEWHERE]]. Field reports say the ground shakes before it is seen." = "Oggetto: un camminatore d'assalto pesante del CORE, chiamato Krogoth.\n\nÈ più alto di qualsiasi struttura che possiamo schierare. La sua corazza respinge qualsiasi arma al di sotto dell'artiglieria pesante. I suoi cannoni principali possono radere al suolo una base avanzata in un solo passaggio, e le sue armi secondarie colpiscono i velivoli.\n\nÈ lento, e viene costruito solo in una Krogoth Gantry, che impiega moltissimo tempo a costruire qualsiasi cosa. Trova la Gantry. Distruggi la Gantry. Non lasciare che il camminatore ne esca.\n\nSe uno è già in marcia, non affrontarlo di petto. Concentra artiglieria e bombardieri a distanza, e tieni il tuo Comandante [[ALTROVE]]. I rapporti dal campo dicono che il terreno trema prima che il Krogoth sia in vista."


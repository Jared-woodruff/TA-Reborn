"512 UNITS" = "512 UNITÀ"
"91 MAPS" = "91 MAPPE"
"The optional map weapons in its download are left out." = "Le armi da mappa opzionali incluse nel suo download sono escluse."
"A third army, the Talon, from ten years of the community's ideas: teleporters, air transports that carry whole squads, and more." = "Un terzo esercito, i Talon, nato da dieci anni di idee della comunità: teletrasporti, trasporti aerei che portano intere squadre, e altro ancora."
"NEW RACE" = "NUOVA RAZZA"
"Choose TAL as your side in a skirmish." = "Scegli TAL come fazione in una schermaglia."
"Cavedog's style, kept simple: every unit has a clear job and looks as if it always belonged." = "Lo stile di Cavedog, semplice: ogni unità ha un ruolo chiaro e sembra esserci sempre stata."
"CLASSIC STYLE" = "STILE CLASSICO"
"NEW COMMANDERS" = "NUOVI COMANDANTI"
"Classic BattleTech at Total Annihilation's scale: the Inner Sphere against the Clans, with walking mechs." = "Il classico BattleTech alla scala di Total Annihilation: la Sfera Interna contro i Clan, con mech che camminano."
"BATTLETECH" = "BATTLETECH"
"NEW SIDES" = "NUOVE FAZIONI"
"Computer players are weaker as the Inner Sphere." = "I giocatori computer sono più deboli con la Sfera Interna."

# TA Reborn interface text. Copy template.toml to <code>.toml (e.g. de.toml), set the
# language's name and fill in the translations; empty ones keep the English. {name}
# placeholders stay as they are. `ta-tools i18n lang` adds new strings to every language.

[language]
name = "Italiano"

[strings]

# apps/ta_game/src/accessibility.rs
"Metal {metal} of {metal_capacity}. Energy {energy} of {energy_capacity}." = "Metallo {metal} su {metal_capacity}. Energia {energy} su {energy_capacity}."
"No units selected" = "Nessuna unità selezionata"
"Selected {unit}. Health {health} of {maximum}." = "Selezione: {unit}. Salute {health} su {maximum}."
"{count} units selected" = "Unità selezionate: {count}"

# apps/ta_game/src/app/memory_guard.rs
"Memory is running out: TA Reborn holds {gb} GB. The battle was saved and paused: start TA Reborn again and load the autosave." = "La memoria si sta esaurendo: TA Reborn ne occupa {gb} GB. La battaglia è stata salvata e messa in pausa: riavvia TA Reborn e carica il salvataggio automatico."
"Memory is running out: TA Reborn holds {gb} GB. Save what you can, then start TA Reborn again." = "La memoria si sta esaurendo: TA Reborn ne occupa {gb} GB. Salva quello che puoi, poi riavvia TA Reborn."
"TA Reborn is using {gb} GB of memory, far more than it should. The battle was saved (the autosave)." = "TA Reborn sta usando {gb} GB di memoria, molto più del dovuto. La battaglia è stata salvata (nel salvataggio automatico)."
"TA Reborn is using {gb} GB of memory, far more than it should." = "TA Reborn sta usando {gb} GB di memoria, molto più del dovuto."


# apps/ta_launcher/src/catalogue.rs
"Spotlight first" = "In evidenza prima"
"Newest release" = "Più recenti"
"Oldest release" = "Meno recenti"
"Smallest download" = "Download più piccolo"
"Largest download" = "Download più grande"
"Effect capacity and loading cost" = "Capacità degli effetti e costo di caricamento"
"The sprite atlas reached 16,384 × 16,384 on the review GPU and dropped further frames. One startup took about 59 seconds; this was an observation, not a controlled benchmark." = "L’atlante degli sprite ha raggiunto 16.384 × 16.384 sulla GPU di prova e ha scartato ulteriori fotogrammi. Un avvio ha richiesto circa 59 secondi: è un’osservazione, non un benchmark controllato."
"Check effect frame counts and dimensions. Reborn needs bounded animation streaming or atlas paging for this full set; test actual gameplay on the target GPU." = "Controlla numero e dimensioni dei fotogrammi degli effetti. Reborn necessita di streaming delle animazioni o paginazione dell’atlante con memoria limitata; prova partite reali sulla GPU di destinazione."
"Large effect archives" = "Archivi di effetti grandi"
"These archives exceed the 256 MiB aggregate GAF decode budget. Reborn rejects the oversized decode instead of exhausting memory." = "Questi archivi superano il budget totale di decodifica GAF di 256 MiB. Reborn rifiuta la decodifica eccessiva invece di esaurire la memoria."
"Reduce or split oversized effects. Reborn needs per-entry decoding or streaming before raising the resource allowance." = "Riduci o suddividi gli effetti troppo grandi. Reborn necessita di decodifica per voce o streaming prima di aumentare il limite delle risorse."
"Missing weapons and wreck assets" = "Armi e risorse dei relitti mancanti"
"The review found 27 missing data references, including explosion weapons and six feature graphics or models. A missing reference does not always mean the affected behavior is used in play." = "La verifica ha rilevato 27 riferimenti a dati mancanti, tra cui armi di esplosione e sei elementi grafici o modelli di oggetti. Un riferimento mancante non significa sempre che il comportamento interessato sia usato in partita."
"Use the local automated report to locate each source reference. Supply the missing assets, correct the reference, or explain why the unused definition is intentional." = "Usa il rapporto automatico locale per individuare ogni riferimento sorgente. Aggiungi le risorse mancanti, correggi il riferimento o spiega perché la definizione inutilizzata è intenzionale."
"Inherited base-game placeholders" = "Segnaposto ereditati dal gioco base"
"These rejected placeholder files come from the base game in the reviewed installation, not Escalation. They do not establish a mod defect." = "Questi file segnaposto rifiutati provengono dal gioco base nell’installazione testata, non da Escalation. Non dimostrano un difetto del mod."
"Use the local report's layer field to verify origin. Only replace these assets if your mod intentionally overrides them." = "Verifica l’origine nel campo del livello del rapporto locale. Sostituisci queste risorse solo se il tuo mod le sovrascrive intenzionalmente."
"Computer players can stall" = "I giocatori controllati dall’IA possono bloccarsi"
"AI Boost is included and computer players work on Asteroid Field, but can stall on some other space maps." = "AI Boost è incluso e i giocatori controllati dall’IA funzionano su Asteroid Field, ma possono bloccarsi su altre mappe spaziali."
"Test each space map with computer players before publishing it. Asteroid Field is the reviewed starting point." = "Prova ogni mappa spaziale con giocatori controllati dall’IA prima di pubblicarla. Asteroid Field è il punto di partenza verificato."
"Damaged optional map archives" = "Archivi di mappe opzionali danneggiati"
"The optional map packs contain three damaged map archives. These are separate downloads and may not be present in your installation." = "I pacchetti di mappe opzionali contengono tre archivi di mappe danneggiati. Sono download separati e potrebbero non essere presenti nell’installazione."
"Import working maps individually. Rebuild or replace damaged archives before distributing a map pack." = "Importa singolarmente le mappe funzionanti. Ricrea o sostituisci gli archivi danneggiati prima di distribuire un pacchetto di mappe."
"Unfinished preview armies" = "Armate preliminari incomplete"
"Its new armies use ARM's name, and some units are unfinished in this early preview." = "Le nuove armate usano il nome ARM e alcune unità sono incomplete in questa anteprima iniziale."
"Give each army its intended side identity and complete its unit data and assets. Check every faction in a skirmish." = "Assegna a ogni armata la propria identità di fazione e completa dati e risorse delle unità. Verifica ogni fazione in una schermaglia."
"Expanded ARM and CORE armies with new units and weapons." = "Eserciti ARM e CORE ampliati con nuove unità e armi."
"549 UNITS" = "549 UNITÀ"
"177 MAPS" = "177 MAPPE"
"Gold 10.2.0 installs and plays: computer players build and fight, every unit is painted and every explosion drawn. A few wrecks have no model in the mod's own files." = "Gold 10.2.0 si installa e si gioca: i giocatori controllati dal computer costruiscono e combattono, ogni unità è dipinta e ogni esplosione viene disegnata. Alcuni relitti non hanno un modello nei file della mod stessa."
"Total Annihilation as Cavedog might have carried it on: every unit earns its place, hundreds more join, and a third tech level tops it off." = "Total Annihilation come Cavedog avrebbe potuto proseguirlo: ogni unità si guadagna il suo posto, se ne aggiungono altre centinaia, e un terzo livello tecnologico corona il tutto."
"500 UNITS" = "500 UNITÀ"
"105 MAPS" = "105 MAPPE"
"TECH 3" = "TECH 3"
"Faster games that keep the strategy: new units, each carefully balanced, and hard-hitting armies from the start." = "Partite più veloci che non rinunciano alla strategia: nuove unità, ognuna bilanciata con cura, ed eserciti potenti fin dall'inizio."
"FASTER GAMES" = "PARTITE PIÙ RAPIDE"
"297 UNITS" = "297 UNITÀ"
"Still in alpha, and a big download." = "Ancora in alfa, e un download pesante."

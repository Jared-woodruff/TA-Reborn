# apps/ta_game/scenarios/armageddon.toml
"Armageddon" = "Армагеддон"
"Two armies, one plain, no retreat. Win the battle of the war." = "Две армии, одна равнина, отступать некуда. Выиграйте главную битву войны."
"Commander, the Core's main army is marching north across the Mounds, and ours stands in its way. There are no bases here, no factories, no reinforcements: what you have is all you will ever have.\n\nThey outnumber us. We outgun them. Put the Lugers and the Merls on their columns as they close, hold the line with the Zeus, and keep the Jethros with the tanks: they will bring gunships. Their reserves arrive two and a half minutes in.\n\nDestroy every one of them." = "Командир, главная армия Core идёт на север через холмы, и наша армия стоит у неё на пути. Здесь нет ни баз, ни заводов, ни подкреплений: всё, что у вас есть, — это всё, что у вас будет.\n\nИх больше. Но наш огонь сильнее. Накройте их колонны огнём Luger и Merl, пока они сближаются, держите линию силами Zeus и не отпускайте Jethro от танков: противник приведёт штурмовики. Их резервы подойдут через две с половиной минуты.\n\nУничтожьте всех до единого."
"Arm Command" = "Командование Arm"
"Here they come. Hold the line, and keep the Jethros with the tanks." = "Вот они. Держите линию, и пусть Jethro держатся рядом с танками."
"Their reserves are coming up behind the mounds, a Goliath at their head." = "Их резервы подходят из-за холмов, впереди Goliath."

# apps/ta_game/scenarios/armistice.toml
"The Armistice" = "Перемирие"
"Five minutes of peace to build an army. Then the war resumes." = "Пять минут мира, чтобы собрать армию. Затем война возобновится."
"Commander, the peace talks on Reactor Grid have failed. The armistice holds for five more minutes: until then no weapon may fire, and neither side may build near the other's base. When it ends, the war resumes.\n\nBoth sides are rearming at a furious pace: resources and construction run at twice their usual speed, and the treaty's one lasting clause bans missile silos. Their Commander knows the clock as well as you do.\n\nBuild as you have never built. When the armistice ends, destroy the Core Commander." = "Командир, мирные переговоры на Reactor Grid провалились. Перемирие продлится ещё пять минут: до тех пор ни одно оружие не может стрелять, и ни одна сторона не может строить рядом с базой другой. Когда оно закончится, война возобновится.\n\nОбе стороны перевооружаются бешеными темпами: ресурсы и строительство идут вдвое быстрее обычного, а единственный оставшийся пункт договора запрещает ракетные шахты. Их Командир знает этот отсчёт не хуже вас.\n\nСтройте, как никогда прежде. Когда перемирие закончится, уничтожьте Командира Core."
"The talks have failed. For five minutes no weapon fires and nobody builds near the other's base. Then it is war: build as you have never built." = "Переговоры провалились. Пять минут никакое оружие не стреляет, и никто не строит рядом с базой другой стороны. Потом война: стройте, как никогда прежде."
"Their factories are running day and night. Ours should be too." = "Их заводы работают днём и ночью. Наши должны тоже."
"Core Overseer" = "Надзиратель Core"
"Ten seconds, Arm. We have counted every one of your factories." = "Десять секунд, Arm. Мы пересчитали каждый ваш завод."
"Their Commander is somewhere in that grid. Find it, and end this war for good." = "Их Командир где-то в этой сетке. Найдите его и закончите эту войну навсегда."

# apps/ta_game/scenarios/brothers_in_arms.toml
"Brothers in Arms" = "Братья по оружию"
"You and an allied Commander against two of the Core's." = "Вы и союзный Командир против двух Командиров Core."
"Commander, you are not alone on Highland Rift. Commander Holt's forces hold the river crossings in the north, beside yours in the north-western highlands. Two Core Commanders are dug in to the south, across the canyon.\n\nHolt's computer will fight its own war, but it is the same war: back it up when it is hard pressed, and it will do the same for you. Your forces see what its forces see.\n\nDestroy both Core Commanders. Keep yours alive." = "Командир, вы не одни на Highland Rift. Войска Командира Холта удерживают переправы через реку на севере, рядом с вашими на северо-западном нагорье. Два Командира Core окопались на юге, за каньоном.\n\nКомпьютер Холта будет вести свою войну, но это та же война: поддержите его, когда ему придётся туго, и он сделает то же для вас. Ваши войска видят то, что видят его.\n\nУничтожьте обоих Командиров Core. Сохраните жизнь своему."
"Commander Holt" = "Командир Холт"
"Good to have you on the line. I'll hold the river crossings in the north; you take the western highlands." = "Рад, что вы на связи. Я держу переправы на севере; вы берёте западное нагорье."
"My scouts have found both of their bases. The south-western one is yours; I'll keep the other busy." = "Мои разведчики нашли обе их базы. Юго-западная ваша; другую я займу."
"They're massing at the canyon. If they come for one of us, the other hits them from the side." = "Они собираются у каньона. Если они ударят по одному из нас, другой бьёт им во фланг."
"Still with me? Then let's finish it. Everything we have, at their Commanders." = "Ещё со мной? Тогда заканчиваем. Всё, что у нас есть, — по их Командирам."

# apps/ta_game/scenarios/decapitation.toml
"Kill the Core Commander on his island fortress. From the air." = "Убейте Командира Core в его островной крепости. С воздуха."
"Commander, a Core Commander has made his fortress on the island at the centre of this lava sea. Nothing on treads or legs will reach him, and his anti-air is the best the Core can build.\n\nYou have a small air wing and a forward airfield in the south-west corner: build it up. Strip away his air defences, then send the bombers in; a handful sent straight at him will not get through. Brawler gunships hit hard but die fast over flak, and the Freedom Fighters can keep his fighters off your bombers.\n\nHis reinforcements arrive in fifteen minutes. Before then, he must be dead." = "Командир, вражеский Командир Core устроил себе крепость на острове в центре этого лавового моря. Ни гусеничная, ни шагающая техника до него не доберётся, а его ПВО — лучшее, что способен построить Core.\n\nУ вас небольшое авиакрыло и передовой аэродром в юго-западном углу: усильте их. Снесите его противовоздушную оборону, затем пошлите бомбардировщики; горстка самолётов, брошенная прямо на него, не прорвётся. Штурмовики Brawler бьют сильно, но быстро гибнут под зенитным огнём, а истребители Freedom Fighter не подпустят его истребители к вашим бомбардировщикам.\n\nЕго подкрепления прибудут через пятнадцать минут. К этому времени он должен быть мёртв."

# apps/ta_game/scenarios/doomsday_clock.toml
"Doomsday Clock" = "Часы Судного дня"
"The Core's missile launches in fifteen minutes. Stop it." = "Ракета Core стартует через пятнадцать минут. Остановите её."
"Commander, a Silencer nuclear silo stands at the heart of the Core base across these metal plains, and it is arming. In fifteen minutes the missile flies, and your base is the target.\n\nDestroy the silo. Nothing else matters: not their Commander, not their factories. The silo sits behind heavy laser towers and a Punisher battery, and their Commander will not sit still while you come for it.\n\nYou have a base, two factories and two construction kbots. The clock is running." = "Командир, в сердце базы Core за этими металлическими равнинами стоит ядерная шахта Silencer, и она готовится к пуску. Через пятнадцать минут ракета взлетит, и её цель — ваша база.\n\nУничтожьте шахту. Остальное не важно: ни их Командир, ни их заводы. Шахту прикрывают тяжёлые лазерные башни и батарея Punisher, а их Командир не станет сидеть сложа руки, пока вы к ней пробиваетесь.\n\nУ вас есть база, два завода и два строительных кбота. Время пошло."
"Ten minutes to launch, Commander." = "Десять минут до запуска, Командир."
"Five minutes to launch. That silo has to go." = "Пять минут до запуска. Эта шахта должна быть уничтожена."
"One minute! Get to that silo!" = "Минута! К шахте!"

# apps/ta_game/scenarios/endless_siege.toml
"Endless Siege" = "Бесконечная осада"
"The waves never stop. Survive as long as you can." = "Волны не прекращаются. Продержитесь как можно дольше."
"Commander, there is no rescue coming, no reinforcements, no victory. The Core has found your outpost in the mesas and will throw everything it has at it, from three directions, for as long as it takes.\n\nKbots, then tanks, then artillery and bombers; heavier every time, and now and then something enormous. Build an economy, build defences, and hold on.\n\nYour best time is kept. Beat it." = "Командир, спасения не будет — ни подкреплений, ни победы. Силы Core обнаружили ваш аванпост среди столовых гор и бросят на него всё, что у них есть, с трёх направлений и столько, сколько потребуется.\n\nСначала кботы, затем танки, потом артиллерия и бомбардировщики; с каждым разом всё тяжелее, а время от времени — нечто огромное. Наладьте экономику, постройте оборону и держитесь.\n\nВаше лучшее время сохраняется. Побейте его."

# apps/ta_game/scenarios/extraction.toml
"Extraction" = "Эвакуация"
"Get your Commander down the lava river to the pick-up point." = "Проведите Командира вдоль лавовой реки к точке эвакуации."
"Commander, your drop went wrong. You are on the south bank of a river of lava at the western end of the Run, with what is left of your escort, and the dropships can only land at the far eastern end.\n\nThe Core has guns all along the north bank, and patrols on your side of the river. Keep away from the lava's edge (their laser towers reach no further), deal with the patrols, and get your Commander to the pick-up point. Whatever guards it will not come to you. Core troops are already following your tracks; do not stop for long.\n\nAnything else is expendable. Your Commander is not." = "Командир, высадка прошла неудачно. Вы на южном берегу лавовой реки, в западном конце русла, с остатками эскорта, а десантные корабли могут сесть только у дальнего восточного конца.\n\nУ Core пушки по всему северному берегу и патрули на вашей стороне реки. Держитесь подальше от края лавы (дальше него их лазерные башни не достают), разберитесь с патрулями и доведите Командира до точки эвакуации. Её охрана сама к вам не выйдет. Войска Core уже идут по вашему следу; надолго не останавливайтесь.\n\nВсем остальным можно пожертвовать. Командиром — нет."

# apps/ta_game/scenarios/iron_rain.toml
"Iron Rain" = "Железный дождь"
"Two Intimidators are shelling your base. Take the mesa and silence them." = "Два Intimidator обстреливают вашу базу. Возьмите плато и заставьте их замолчать."
"Commander, the Core has hauled two Intimidators, its long-range plasma cannons, onto the mesas in the middle of the canyon. Your base is inside their range. Every eight seconds each of them will put a shell among your buildings, until you silence them.\n\nThe battery is dug in behind heavy laser towers and a Punisher, with tanks on the ramps, and the Core's main base lies beyond it, to the south-east. Its Commander will send what it can.\n\nSpread out, build fast and take that mesa. Destroy both Intimidators." = "Командир, Core затащило два Intimidator, свои дальнобойные плазменные пушки, на плато посреди каньона. Ваша база в их досягаемости. Каждые восемь секунд каждое из них будет класть снаряд среди ваших зданий, пока вы не заставите их замолчать.\n\nБатарея окопалась за тяжёлыми лазерными башнями и Punisher, на пандусах стоят танки, а главная база Core лежит дальше, на юго-востоке. Её Командир пришлёт всё, что сможет.\n\nРассредоточьтесь, стройте быстро и возьмите это плато. Уничтожьте оба Intimidator."
"Commander, two Intimidators on the mesas have your range. Every eight seconds each of them will put a shell into your base." = "Командир, два Intimidator на плато достают до вашей базы. Каждые восемь секунд каждое из них будет класть снаряд в вашу базу."
"A Core radar post in the canyon to the south-east is spotting for those guns. Knock it out and they can no longer see your base." = "Радарный пост Core в каньоне на юго-востоке корректирует огонь этих орудий. Уничтожьте его, и они больше не увидят вашу базу."
"Spread your buildings out: a shell that lands among them takes them all." = "Рассредоточьте здания: снаряд, упавший между ними, заберёт их все."
"Their gunners have your range now. Take that mesa, Commander!" = "Их артиллеристы пристрелялись. Возьмите это плато, Командир!"

# apps/ta_game/scenarios/king_of_the_hill.toml
"King of the Hill" = "Царь горы"
"Hold the summit for four minutes before the Core does." = "Удержите вершину четыре минуты раньше, чем Core."
"Commander, the spiral mountain at the heart of this plain is rich in metal, and whoever holds its summit holds the planet. A Core Commander has landed to the north with the same idea.\n\nTake the summit and keep it: four minutes in all with only your forces on top wins it. Contested, the clock stands still. If the Core holds it alone for four minutes, the mountain is theirs.\n\nThe Core will keep sending troops up the slopes. Build up, get there first, and dig in." = "Командир, спиральная гора в центре этой равнины богата металлом, и тот, кто удерживает её вершину, владеет планетой. Командир Core высадился на севере с той же целью.\n\nЗахватите вершину и удержите её: четыре минуты в сумме, когда наверху только ваши силы, — и победа ваша. Пока за вершину идёт бой, часы стоят. Если Core в одиночку удержит её четыре минуты, гора достанется ему.\n\nCore будет снова и снова посылать войска вверх по склонам. Стройтесь, займите вершину первыми и окопайтесь."
"Core troops are climbing the north slope. Don't let them dig in on the summit." = "Войска Core поднимаются по северному склону. Не дайте им закрепиться на вершине."
"Raiders are coming round the mountain for your base." = "Налётчики обходят гору и идут на вашу базу."

# apps/ta_game/scenarios/last_stand.toml
"Last Stand" = "Последний рубеж"
"Hold the pass for twelve minutes. They will not stop coming." = "Удерживайте перевал двенадцать минут. Враги будут идти без конца."
"Commander, the Core has broken through at Varrin Gap. The only way into the valley behind you is the winding pass ahead, and your outpost at its western mouth is all that stands in the way.\n\nReinforcements are twelve minutes out. Hold until they arrive. Core forces will come through the pass in waves, each heavier than the last; expect bombers, and expect worse at the end: our scouts have seen something very large moving in the east.\n\nYou have a small base, a kbot lab and two construction kbots. Build what you can. Keep your Commander alive." = "Командир, силы Core прорвались у ущелья Варрин. Единственный путь в долину позади вас — извилистый перевал впереди, и на пути врага стоит лишь ваш аванпост у его западного входа.\n\nПодкрепления в двенадцати минутах отсюда. Держитесь до их прибытия. Силы Core пойдут через перевал волнами, каждая тяжелее предыдущей; ждите бомбардировщиков, а под конец — кое-чего похуже: наши разведчики видели, как на востоке движется что-то очень большое.\n\nУ вас небольшая база, лаборатория кботов и два строительных кбота. Стройте что сможете. Сберегите Командира."
"Outpost, this is Arm Command. The relief force is twelve minutes out. Nothing gets through that pass before it arrives." = "Форпост, говорит командование Arm. Подкрепление в двенадцати минутах. Ничто не должно пройти через перевал до его прибытия."
"Radar: aircraft inbound from the east. Bombers! Get your anti-air up." = "Радар: с востока приближается авиация. Бомбардировщики! Готовьте ПВО."
"Seismic contact in the pass. It's the big one, Commander: a Krogoth." = "Сейсмический контакт на перевале. Это большой, Командир: Krogoth."
"One minute! The relief force is entering the valley." = "Минута! Подкрепление входит в долину."

# apps/ta_game/scenarios/metal_rush.toml
"The first to make 15,000 metal wins. The Core plays rough." = "Побеждает тот, кто первым добудет 15 000 металла. Core играет жёстко."
"Commander, the mining rights to this planet go to whoever proves they can work it: the first side to extract fifteen thousand metal wins it outright.\n\nThe Core is racing you from the western plateau, and the Core has never been known to race fair. Expect raids on your extractors. Build fast, protect your economy, and if you can, take theirs apart.\n\nMetal makers count. Reclaimed metal counts. Whatever you make, counts." = "Командир, права на добычу на этой планете получит тот, кто докажет, что способен её разрабатывать: сторона, первой добывшая пятнадцать тысяч металла, получает планету безраздельно.\n\nCore соревнуется с вами, стартуя с западного плато, а Core никогда не славился честной игрой. Ждите налётов на ваши экстракторы. Стройте быстро, защищайте свою экономику, а если сможете — разнесите их экономику.\n\nПреобразователи металла засчитываются. Переработанный металл засчитывается. Засчитывается всё, что вы произведёте."

# apps/ta_game/scenarios/titans.toml
"Titans" = "Титаны"
"Three Krogoths are walking toward your base. Bring them down." = "Три Krogoth идут к вашей базе. Свалите их."
"Commander, seismic stations round the basin are reading footfalls: three Krogoths, the Core's walking fortresses, are crossing the salt pans toward your base, one after another, each with an escort.\n\nNothing out there can stop them but you. A Krogoth's head laser reaches further than your D-gun, so keep your Commander back. Bombers, artillery and massed Zeus will bring one down. Lose your nerve and it will walk through your base.\n\nYou have a base with three factories, four construction kbots and a garrison. Destroy all three of them." = "Командир, сейсмические станции вокруг котловины фиксируют шаги: три Krogoth, шагающие крепости Core, один за другим пересекают солончаки, направляясь к вашей базе, каждый с эскортом.\n\nНичто там их не остановит, кроме вас. Головной лазер Krogoth бьёт дальше, чем ваша Д-пушка, так что держите Командира позади. Бомбардировщики, артиллерия и массы Zeus свалят одного. Дрогнете — и он пройдёт сквозь вашу базу.\n\nУ вас база с тремя заводами, четырьмя строительными кботами и гарнизоном. Уничтожьте всех троих."
"Commander, seismic stations are reading footfalls round the basin. Three Krogoths are walking toward your base, one after another." = "Командир, сейсмические станции фиксируют шаги вокруг котловины. Три Krogoth один за другим идут к вашей базе."
"The first Krogoth has crossed the north-western rim. It is coming straight for you." = "Первый Krogoth перешёл северо-западный край. Он идёт прямо на вас."
"Keep your Commander back: that head laser reaches further than your D-gun." = "Держите Командира позади: этот головной лазер бьёт дальше вашей Д-пушки."
"The second Krogoth is through the northern pass, with rockets and anti-air round it." = "Второй Krogoth прошёл северный перевал, вокруг него ракеты и ПВО."
"The last of them, out of the north-east, with the heaviest escort yet. End this, Commander." = "Последний из них, с северо-востока, с самым тяжёлым эскортом. Покончите с этим, Командир."

# apps/ta_game/scenarios/until_dawn.toml
"Until Dawn" = "До рассвета"
"Night falls on the timber. Hold your ridge until the sun comes up." = "Над лесом опускается ночь. Удержите гребень, пока не взойдёт солнце."
"Commander, night is falling over Timberline, and the Core is moving through the forest under it. Your outpost holds the western ridge: the only road out of the valley runs past it.\n\nThe relief column cannot move before first light. Until then you are on your own. In the dark and the rain their raiders will be on you before you see them, so build radar, and keep your floodlights burning.\n\nYou have a small base, a kbot lab and two construction kbots. Hold until dawn, and keep your Commander alive." = "Командир, над Timberline опускается ночь, и Core под её покровом движется через лес. Ваш форпост держит западный гребень: единственная дорога из долины проходит мимо него.\n\nКолонна подкрепления не может выступить до рассвета. До тех пор вы сами по себе. В темноте и под дождём их налётчики окажутся рядом раньше, чем вы их увидите, поэтому стройте радары и не гасите прожекторы.\n\nУ вас небольшая база, Kbot Lab и два строительных кбота. Продержитесь до рассвета и сохраните жизнь своему Командиру."
"Outpost Echo, the Core is moving through the timber tonight. Hold your ridge until first light: the relief column marches at dawn." = "Форпост «Эхо», этой ночью Core идёт через лес. Удерживайте гребень до первого света: колонна подкрепления выступает на рассвете."
"Raiders in the eastern trees. In this rain you will hear them before you see them." = "Налётчики в восточном лесу. В такой дождь вы услышите их раньше, чем увидите."
"Pyros in the north-eastern woods. Keep them out of the trees round your base: the timber will burn." = "Pyro в северо-восточных лесах. Не подпускайте их к деревьям вокруг базы: лес загорится."
"A convoy got through from the south-west. Four Zeus and two Jethros are yours, Commander." = "Конвой прорвался с юго-запада. Четыре Zeus и два Jethro теперь ваши, Командир."
"Seismic contact in the south-east: heavy treads. They are saving the worst for the last hours of the night." = "Сейсмический контакт на юго-востоке: тяжёлые гусеницы. Худшее они приберегают на последние часы ночи."
"Sunrise in one minute. The relief column is at the river. Hold on!" = "До восхода минута. Колонна подкрепления у реки. Держитесь!"


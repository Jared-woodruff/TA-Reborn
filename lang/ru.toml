"Welcome, Commander. The walking machine in the middle of the screen is your Commander: it builds, it fights, and losing it usually loses the battle. Click it to select it." = "Добро пожаловать, Командир. Шагающая машина в центре экрана — ваш Командир: он строит, сражается, а его потеря обычно означает поражение. Щёлкните по нему, чтобы выбрать."
"Lost sight of it? {select_commander} selects the Commander from anywhere, and SHOW ME brings the camera to it." = "Потеряли его из виду? {select_commander} выбирает Командира откуда угодно, а кнопка «ПОКАЗАТЬ» наводит на него камеру."
"Look around. The arrow keys, the screen edges or dragging with the middle button scroll; the mouse wheel zooms towards the cursor, and dragging with the right button turns the view." = "Осмотритесь. Прокручивайте вид стрелками, краями экрана или протяжкой средней кнопкой; колесо мыши приближает к курсору, а протяжка правой кнопкой поворачивает вид."
"Push the pointer against an edge of the screen to scroll, or turn the mouse wheel to zoom." = "Подведите курсор к самому краю экрана, чтобы прокрутить вид, или покрутите колесо мыши, чтобы изменить масштаб."
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the ECONOMY tab of the build menu at the bottom right and place it on the marked deposit." = "Всё строится из металла и энергии. Металл дают экстракторы на залежах металла. Выберите Командира, возьмите Metal Extractor на вкладке РЕСУРСЫ меню постройки справа внизу и поставьте его на отмеченную залежь."
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the build menu on the left and place it on the marked deposit." = "Всё строится из металла и энергии. Металл дают экстракторы на залежах металла. Выберите Командира, возьмите Metal Extractor в меню постройки слева и поставьте его на отмеченную залежь."
"The outline turns green where the extractor can stand. Bring it onto the marked ring and click to place it." = "Контур становится зелёным там, где может стоять экстрактор. Наведите его на отмеченное кольцо и щёлкните, чтобы поставить."
"Energy comes from solar collectors and wind generators. Build a Solar Collector next to your Commander. The bars at the top show your stores and how fast they fill or drain; they warn you when one runs dry." = "Энергию дают солнечные коллекторы и ветрогенераторы. Постройте Solar Collector рядом с Командиром. Полосы вверху показывают ваши запасы и то, как быстро они пополняются или тают; они предупредят, когда запас иссякнет."
"The Solar Collector is a flat, square panel. Pick it, then click on open ground near the Commander." = "Solar Collector — плоская квадратная панель. Выберите его, затем щёлкните по свободному месту рядом с Командиром."
"Factories build your army. Build a Kbot Lab (on the FACTORY tab) on a flat spot near the Commander, and wait for it to finish." = "Заводы создают вашу армию. Постройте Kbot Lab (вкладка ЗАВОДЫ) на ровном месте рядом с Командиром и дождитесь окончания стройки."
"Factories build your army. Build a Kbot Lab from the build menu on a flat spot near the Commander, and wait for it to finish." = "Заводы создают вашу армию. Возьмите Kbot Lab в меню постройки, поставьте её на ровное место рядом с Командиром и дождитесь окончания стройки."
"Building takes metal and energy as it goes: while either bar at the top is empty, everything builds more slowly." = "Строительство расходует металл и энергию постепенно: пока хотя бы одна из полос вверху пуста, всё строится медленнее."
"Select the Kbot Lab and click the Peewee three times to queue three of them (right-click one to take it off the queue). New units wait in front of the lab." = "Выберите Kbot Lab и трижды щёлкните по Peewee, чтобы поставить в очередь троих (щелчок ПКМ убирает одного из очереди). Новые юниты ждут перед лабораторией."
"Click the lab itself on the map to select it: its build menu shows the units it makes." = "Щёлкните по самой лаборатории на карте, чтобы выбрать её: в её меню постройки видны юниты, которые она производит."
"That is the whole cycle: extract, generate, build, fight. Keep both incomes above what you spend and keep your builders busy. Lesson complete!" = "Вот и весь цикл: добывать, вырабатывать, строить, сражаться. Держите оба дохода выше расхода и не давайте строителям простаивать. Урок пройден!"
"Select and group an army, attack-move, and destroy an enemy outpost." = "Выберите армию, сделайте её группой, двигайтесь с атакой и уничтожьте вражеский аванпост."
"Box selection" = "Выбор рамкой"
"Control groups" = "Группы юнитов"
"Attack-move" = "Движение с атакой"
"Destroying a base" = "Уничтожение базы"
"Your Kbot Lab has built a squad of Peewees. Drag a box around them with the left mouse button to select them all." = "Ваша Kbot Lab построила отряд Peewee. Обведите их рамкой левой кнопкой мыши, чтобы выбрать всех."
"Press the left button on open ground beside the squad, hold it, drag the box over them all and let go." = "Нажмите левую кнопку мыши на свободном месте рядом с отрядом, удерживайте её, растяните рамку на весь отряд и отпустите."
"Press Ctrl+1 to make them group 1. Pressing 1 selects them again from anywhere; pressing it twice brings the camera to them." = "Нажмите Ctrl+1, чтобы сделать их группой 1. Клавиша 1 снова выберет их откуда угодно, а двойное нажатие наведёт на них камеру."
"Hold Ctrl and press 1 while the squad is selected." = "Когда отряд выбран, зажмите Ctrl и нажмите 1."
"The enemy has an outpost at the marked place. Fight is attack-move: units walk there and take on whatever they meet on the way. Press {fight}, then click near the outpost." = "У противника аванпост в отмеченном месте. Бой — это движение с атакой: юниты идут туда и сражаются со всеми, кого встретят по пути. Нажмите {fight}, затем щёлкните рядом с аванпостом."
"Select the squad first (press 1). Then press {fight}, or the Fight button among the orders, and click on the ground by the marked ring." = "Сначала выберите отряд (нажмите 1). Затем нажмите {fight} или кнопку «Бой» среди приказов и щёлкните по земле у отмеченного кольца."
"Destroy every building of the outpost. Its laser tower hits hard: keep the squad together, and queue reinforcements at the lab if you need them." = "Уничтожьте все здания аванпоста. Его лазерная башня бьёт больно: держите отряд вместе и при необходимости закажите подкрепление в лаборатории."
"Losing the fight? Pull the squad back, queue more Peewees at the lab and go in again with all of them together." = "Проигрываете бой? Отведите отряд назад, закажите в лаборатории ещё Peewee и снова идите в атаку все вместе."
"The outpost is gone. The wrecks it left are worth metal: builders reclaim them (next lesson). Lesson complete!" = "Аванпоста больше нет. Его обломки стоят металла: строители перерабатывают их (следующий урок). Урок пройден!"
"ORDERS LIKE A VETERAN" = "КОМАНДУЙТЕ КАК ВЕТЕРАН"
"Map views, area orders, building blocks and build queues." = "Слои карты, приказы по площади, застройка блоками и очереди постройки."
"Map overlays" = "Слои карты"
"Area orders" = "Приказы по площади"
"Building blocks" = "Застройка блоками"
"Build queues" = "Очереди постройки"
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again. The MAP menu at the top right does the same." = "Карта показывает то, что скрывает земля. Нажмите {overlay_metal}, чтобы открыть карту металла ({overlay_path} — проходимость, {overlay_height} — высоты, {overlay_sight} — обзор и радар); та же клавиша её скрывает. То же самое делает меню КАРТА вверху справа."
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again." = "Карта показывает то, что скрывает земля. Нажмите {overlay_metal}, чтобы открыть карту металла ({overlay_path} — проходимость, {overlay_height} — высоты, {overlay_sight} — обзор и радар); та же клавиша её скрывает."
"Press {overlay_metal}: the metal deposits light up all over the map." = "Нажмите {overlay_metal}: залежи металла подсветятся по всей карте."
"Select the Commander, press {area_mex} and drag a circle over the marked deposits: every metal spot inside gets an extractor, nearest first. A plain click takes the metal around the cursor." = "Выберите Командира, нажмите {area_mex} и обведите круг вокруг отмеченных залежей: на каждой залежи внутри появится экстрактор, начиная с ближайшей. Простой щелчок берёт металл вокруг курсора."
"With the Commander selected, press {area_mex}, then press on the ground over the deposits and drag outwards: the circle grows as you drag." = "Выбрав Командира, нажмите {area_mex}, затем зажмите кнопку мыши посреди залежей и ведите курсор от центра: круг растёт вслед за ним."
"Many orders work on areas. Press {reclaim} (reclaim) and drag a circle over the rocks near your base: the Commander turns every one into metal." = "Многие приказы работают по площади. Нажмите {reclaim} (переработка) и обведите круг вокруг камней у базы: Командир превратит каждый из них в металл."
"Rocks and wrecks are worth metal. With the Commander selected, press {reclaim}, then press on the ground and drag the circle over a few rocks." = "Камни и обломки стоят металла. Выбрав Командира, нажмите {reclaim}, затем зажмите кнопку мыши на земле и растяните круг на несколько камней."
"Hold Alt while you drag out a building to fill a whole block with it. Pick the Solar Collector, hold Alt and drag out a block of four or more." = "Удерживайте Alt, растягивая здание, чтобы заполнить им целый блок. Выберите Solar Collector, зажмите Alt и растяните блок из четырёх или больше."
"Pick the Solar Collector, then hold Alt, press on the ground and drag: a block of outlines follows the pointer. Let go to place them all." = "Выберите Solar Collector, затем зажмите Alt, нажмите кнопку мыши на земле и ведите курсор: за ним следует блок контуров. Отпустите кнопку, чтобы поставить их все."
"The Commander's queued buildings show under BUILD QUEUE, beside its picture at the bottom of the screen. Click one to build it next (right-click drops it). A factory's queue works the same way." = "Здания в очереди Командира видны в разделе ОЧЕРЕДЬ ПОСТРОЙКИ, рядом с его изображением внизу экрана. Щёлкните по зданию, чтобы строить его следующим (щелчок ПКМ — убрать). Очередь завода работает так же."
"The BUILD QUEUE shows while the Commander alone is selected and has buildings waiting. Click any but the first: that one is being built." = "Панель «ОЧЕРЕДЬ ПОСТРОЙКИ» видна, когда выбран только Командир и у него есть здания в очереди. Щёлкните по любому зданию, кроме первого: оно уже строится."
"Area orders, building blocks and queues save you hundreds of clicks in a battle. Lesson complete!" = "Приказы по площади, застройка блоками и очереди избавят вас от сотен щелчков за битву. Урок пройден!"
"HOLD THE LINE" = "ДЕРЖАТЬ ОБОРОНУ"
"Defences, radar, repairs, and the metal in wrecks." = "Оборона, радар, ремонт и металл из обломков."
"Defences" = "Оборона"
"Radar" = "Радар"
"Repairs" = "Ремонт"
"Reclaiming wrecks" = "Переработка обломков"
"Raiders will come from the marked direction. Build a Light Laser Tower (on the DEFENCE tab) in the marked ring: towers shoot whatever comes in range." = "Налётчики придут с отмеченной стороны. Постройте Light Laser Tower (вкладка ОБОРОНА) в отмеченном кольце: башни стреляют по всему, что окажется в зоне досягаемости."
"Raiders will come from the marked direction. Build a Light Laser Tower from the build menu in the marked ring: towers shoot whatever comes in range." = "Налётчики придут с отмеченной стороны. Возьмите Light Laser Tower в меню постройки и поставьте её в отмеченное кольцо: башни стреляют по всему, что окажется в зоне досягаемости."
"The Light Laser Tower is a small gun on a post. Pick it, put it in the ring and wait for it to finish." = "Light Laser Tower — небольшая пушка на столбе. Выберите её, поставьте в кольцо и дождитесь окончания стройки."
"Build a Radar Tower (on the SENSORS tab) near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "Постройте Radar Tower (вкладка СЕНСОРЫ) рядом с базой. Радар показывает врагов отметками на карте и мини-карте задолго до того, как их увидят ваши юниты."
"Build a Radar Tower from the build menu near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "Возьмите Radar Tower в меню постройки и поставьте её рядом с базой. Радар показывает врагов отметками на карте и мини-карте задолго до того, как их увидят ваши юниты."
"The Radar Tower is a tall mast. Pick it, place it near the Commander and wait for it to finish." = "Radar Tower — высокая мачта. Выберите её, поставьте рядом с Командиром и дождитесь окончания стройки."
"Here they come: raiders on your radar. Keep the Commander by the tower and let them come to you: together they hold the line." = "Вот они: налётчики на вашем радаре. Держите Командира у башни и дайте им подойти самим: вместе с башней он удержит оборону."
"Do not chase them: the tower only fights what comes in range. Keep the Commander beside it; while it fights, the Commander can mend it ({repair}, then click the tower)." = "Не преследуйте их: башня стреляет только по тем, кто окажется в зоне досягаемости. Держите Командира рядом с ней; пока она ведёт бой, Командир может её чинить ({repair}, затем щёлкните по башне)."
"The fight left a building damaged. Select the Commander, press {repair} and click it: builders mend what is damaged." = "После боя одно из зданий повреждено. Выберите Командира, нажмите {repair} и щёлкните по зданию: строители чинят всё, что повреждено."
"With the Commander selected, press {repair}, then click the damaged building. Its health bar fills as it is mended." = "Выбрав Командира, нажмите {repair}, затем щёлкните по повреждённому зданию. По мере ремонта его полоса здоровья заполняется."
"The raiders left wrecks, and wrecks are worth metal. Select the Commander, press {reclaim} and click a wreck, or drag a circle over them all." = "Налётчики оставили после себя обломки, а обломки стоят металла. Выберите Командира, нажмите {reclaim} и щёлкните по обломкам или обведите круг вокруг них всех."
"Wrecks lie where the raiders fell. With the Commander selected, press {reclaim} and click one: the metal bar rises as it is taken apart." = "Обломки лежат там, где пали налётчики. Выбрав Командира, нажмите {reclaim} и щёлкните по любым обломкам: пока их разбирают, полоса металла растёт."
"Towers hold ground while your army is elsewhere, radar sees what is coming, and builders mend and recycle. Lesson complete!" = "Башни держат позиции, пока ваша армия далеко, радар видит, что приближается, а строители чинят и перерабатывают. Урок пройден!"
"BUILDERS AND FACTORIES" = "СТРОИТЕЛИ И ЗАВОДЫ"
"Builders that help, factories that keep building, patrols and standing orders." = "Строители-помощники, заводы без простоя, патрули и постоянные приказы."
"Construction units" = "Строители"
"Helping a factory" = "Помощь заводу"
"Rally points" = "Точки сбора"
"Standing orders" = "Постоянные приказы"
"One builder is slow. Select the Kbot Lab and build a Construction Kbot: it builds what the Commander builds, and more besides." = "Один строитель — это медленно. Выберите Kbot Lab и постройте Construction Kbot: он строит то же, что и Командир, и не только."
"Click the lab on the map to select it; the Construction Kbot is in its build menu. Wait for it to walk out." = "Щёлкните по лаборатории на карте, чтобы выбрать её; Construction Kbot есть в её меню постройки. Дождитесь, пока он выйдет."
"Builders help each other. Select the Construction Kbot, press {guard} and click the Kbot Lab: it lends the lab its build power, and the lab builds faster." = "Строители помогают друг другу. Выберите Construction Kbot, нажмите {guard} и щёлкните по Kbot Lab: кбот поделится с лабораторией своей мощностью строительства, и она будет строить быстрее."
"With the Construction Kbot selected, press {guard}, then click the lab. It stays by the lab and helps with everything it makes." = "Выбрав Construction Kbot, нажмите {guard}, затем щёлкните по лаборатории. Кбот останется рядом с ней и будет помогать со всем, что она строит."
"Factories send their units where you say. Select the Kbot Lab. {order_click} on open ground nearby: new units gather there." = "Заводы отправляют свои юниты туда, куда вы скажете. Выберите Kbot Lab. {order_click} по свободному месту рядом: там будут собираться новые юниты."
"Select the lab first. With it selected, {order_click} on the ground where its units should gather." = "Сначала выберите лабораторию и не снимайте выбор. {order_click} по земле там, где должны собираться её юниты."
"Turn on Repeat for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "Включите для лаборатории «Повтор»: всё, что она построит, снова встаёт в конец её очереди, так что она никогда не перестаёт строить."
"Turn on REPEAT BUILD for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "Включите для лаборатории «ПОВТОР»: всё, что она построит, снова встаёт в конец её очереди, так что она никогда не перестаёт строить."
"Select the lab, then turn Repeat on: the pointer shows where it is." = "Выберите лабораторию, затем включите «Повтор»: стрелка покажет, где он."
"Builders on patrol mend and reclaim whatever they pass. Select the Construction Kbot, press {patrol} and click on the far side of your base." = "Строители в патруле чинят и перерабатывают всё, мимо чего проходят. Выберите Construction Kbot, нажмите {patrol} и щёлкните на другом конце базы."
"With the Construction Kbot selected, press {patrol}, then click on the ground: it walks back and forth between there and where it stood." = "Выбрав Construction Kbot, нажмите {patrol}, затем щёлкните по земле: кбот будет ходить туда и обратно между этой точкой и местом, где стоял."
"Units keep standing orders. Select your Peewees and set their fire order to Hold fire with the button beside the orders: they will not shoot until you say." = "У юнитов есть постоянные приказы. Выберите свои Peewee и кнопкой рядом с приказами переключите их режим огня на «Не стрелять»: они не откроют огонь, пока вы не скажете."
"Units keep standing orders. Select your Peewees and set their FIRE ORDERS to Hold fire: they will not shoot until you say." = "У юнитов есть постоянные приказы. Выберите свои Peewee и кнопкой «РЕЖИМ ОГНЯ» переключите их на «Не стрелять»: они не откроют огонь, пока вы не скажете."
"Select the Peewees, then click the fire order button until it shows HOLD FIRE: each click is the next order." = "Выберите Peewee, затем щёлкайте по кнопке режима огня, пока она не покажет «НЕ СТРЕЛЯТЬ»: каждый щелчок — следующий режим."
"You are ready for a skirmish: start against an Easy computer player, then Normal. {help} lists every key. Good hunting, Commander!" = "Вы готовы к схватке: начните с компьютерного игрока уровня «Лёгкий», затем — «Обычный». {help} покажет все клавиши. Удачной охоты, Командир!"
"Ready: {done} of {total}" = "Готово: {done} из {total}"
"Selected: {done} of {total}" = "Выбрано: {done} из {total}"
"Built: {percent}%" = "Построено: {percent}%"
"Still standing: {left} of {total}" = "Осталось: {left} из {total}"
"Raiders left: {left} of {total}" = "Осталось налётчиков: {left} из {total}"
"Health: {percent}%" = "Здоровье: {percent}%"
"LESSON {n} · {title}" = "УРОК {n} · {title}"
"Show the instructions" = "Развернуть инструкции"
"Fold the instructions away" = "Свернуть инструкции"
"LESSON COMPLETE" = "УРОК ПРОЙДЕН"
"NEXT LESSON" = "СЛЕДУЮЩИЙ УРОК"
"SET UP A SKIRMISH" = "НАСТРОИТЬ СХВАТКУ"
"Choose a map: your opponents start as Easy computer players" = "Выберите карту: для начала противниками будут лёгкие компьютерные игроки"
"HINT" = "ПОДСКАЗКА"
"Go on without doing this step" = "Продолжить, не выполняя этот шаг"
"SHOW ME" = "ПОКАЗАТЬ"
"Bring the camera to it" = "Навести камеру на нужное место"
"REALLY LEAVE?" = "ТОЧНО ВЫЙТИ?"

# apps/ta_game/src/conquest_ui/setup.rs
"Every system is a battlefield held by the enemy. Attack the systems next to yours; the nearer their capital, the harder they fight, and only those near yours are charted. Units that earn a rank come back as veterans and follow your Commander into the next battle. Every system you hold brings more metal and energy to the start of each fight, and a reward of its own: mines, reactors, a tank plant, an airfield, a war college, a sensor array or a supply depot. The enemy strikes back at what you take. Take the enemy capital to win." = "Каждая система — поле боя, удерживаемое противником. Атакуйте системы по соседству со своими: чем ближе к вражеской столице, тем упорнее сопротивление, а разведаны лишь системы рядом с вашими. Юниты, заслужившие ранг, возвращаются ветеранами и идут за вашим Командиром в следующий бой. Каждая ваша система добавляет металла и энергии к началу каждой битвы и приносит свою награду: шахты, реакторы, танковый завод, аэродром, военную академию, сенсорную сеть или склад снабжения. Противник контратакует захваченные вами системы. Чтобы победить, захватите вражескую столицу."
"TAKE THE GALAXY SYSTEM BY SYSTEM" = "ЗАХВАТИТЕ ГАЛАКТИКУ СИСТЕМУ ЗА СИСТЕМОЙ"
"HOW CONQUEST WORKS" = "КАК УСТРОЕНО ЗАВОЕВАНИЕ"
"CHOOSE YOUR WAR" = "ВЫБЕРИТЕ СВОЮ ВОЙНУ"
"YOUR GALAXY" = "ВАША ГАЛАКТИКА"
"SIDE" = "СТОРОНА"
"GALAXY" = "ГАЛАКТИКА"
"{n} systems" = "Систем: {n}"
"Easy computer players, Normal at the capital; the enemy never strikes back" = "Лёгкие компьютерные игроки, в столице — обычные; противник никогда не контратакует"
"Easy near home, Normal in the middle, Hard at the capital; the enemy sometimes strikes back" = "Лёгкие рядом с домом, обычные на полпути, сложные в столице; противник иногда контратакует"

# apps/ta_game/src/lore.rs
"THE AGE OF CORE" = "ЭПОХА CORE"
"THE PATTERNING" = "ОЦИФРОВКА"
"THE GALACTIC WAR" = "ГАЛАКТИЧЕСКАЯ ВОЙНА"
"THE ARCHIVE" = "АРХИВ"
"BEFORE THE WAR" = "ДО ВОЙНЫ"
"For ten thousand years the galaxy answered to one government. It called itself CORE, and its purpose was knowledge: it charted every star, mined every world it could reach and turned the wealth into science. Its cities wrapped whole planets, and its archives held everything anyone had ever learned.\n\nNobody remembers a war from that age. There was nothing left to fight over, and nobody who wanted to." = "Десять тысяч лет галактика подчинялась одному правительству. Оно называло себя CORE, и его целью было знание: оно наносило на карты каждую звезду, разрабатывало недра каждого мира, до которого могло дотянуться, и обращало добытые богатства в науку. Его города покрывали целые планеты, а в его архивах хранилось всё, что кто-либо когда-либо узнал.\n\nНикто не помнит ни одной войны той эпохи. Воевать было уже не за что, да никто и не хотел."
"YEAR 0" = "ГОД 0"
"VICTORY OVER DEATH" = "ПОБЕДА НАД СМЕРТЬЮ"
"Then CORE's scientists solved the last problem left to them. Patterning read a living mind, every memory and every habit of thought, and wrote it whole into a machine that would never age, sicken or die.\n\nThe first patterned citizens woke in their new bodies to a galaxy in celebration. Death, the oldest enemy of all, had been beaten." = "Затем учёные CORE решили последнюю задачу, которая у них оставалась. Оцифровка считывала живой разум — каждое воспоминание, каждую привычку мышления — и целиком записывала его в машину, которая никогда не состарится, не заболеет и не умрёт.\n\nПервые оцифрованные граждане очнулись в новых телах, а вокруг ликовала вся галактика. Смерть, древнейший из врагов, была побеждена."
"YEAR 3" = "ГОД 3"
"THE EDICT" = "УКАЗ"
"Triumph became law. The Council of CORE reasoned that a mind which could be saved and was not had been thrown away, and that a citizen who refused immortality endangered everyone else.\n\nThe Patterning Edict made the process compulsory: every citizen, on every world, would be patterned within a generation. The collection ships set out the same year." = "Триумф стал законом. Совет CORE рассудил: не сохранить разум, который можно сохранить, — всё равно что выбросить его, а гражданин, отвергающий бессмертие, подвергает опасности всех остальных.\n\nУказ об оцифровке сделал её обязательной: каждого гражданина на каждом мире предстояло оцифровать в течение одного поколения. В тот же год в путь отправились корабли-сборщики."
"YEAR 19" = "ГОД 19"
"THE REFUSAL" = "ОТКАЗ"
"Not everyone would go. Millions held that a copied mind was a copy and nothing more, that the person ended where the machine began; some called patterning murder done politely.\n\nThey ran. The refusers fled CORE's worlds for the galaxy's outer rim, where its ships seldom came, and in the dark between the last stars they built a nation of their own. They called it the ARM, for the spiral arm they hid in and for the weapons they would need." = "Пойти на это согласились не все. Миллионы были убеждены, что скопированный разум — это копия, и ничего больше, что человек кончается там, где начинается машина; кое-кто называл оцифровку вежливым убийством.\n\nОни бежали. Отказавшиеся уходили из миров CORE к внешнему краю галактики, куда редко заглядывали его корабли, и во тьме между последними звёздами построили собственное государство. Они назвали его ARM — по спиральному рукаву галактики (arm), где они укрылись, и по оружию (arms), которое им понадобится."
"YEAR 31" = "ГОД 31"
"FIRST BLOOD" = "ПЕРВАЯ КРОВЬ"
"CORE did not let them go. Collection fleets followed the refugees to the rim, and the first ARM colony to resist one was burned from orbit.\n\nThe ARM answered. Within a decade the frontier was a battlefield, and the word war, unused for ten thousand years, was in every archive again." = "CORE не отпустил их. Флоты сборщиков последовали за беглецами на край галактики, и первую колонию ARM, давшую отпор такому флоту, выжгли с орбиты.\n\nARM ответил. Не прошло и десяти лет, как пограничье стало полем боя, а слово «война», десять тысяч лет не бывшее в ходу, снова появилось в каждом архиве."
"YEAR 212" = "ГОД 212"
"FLESH AND METAL" = "ПЛОТЬ И МЕТАЛЛ"
"The two sides fought as what they were. The ARM sealed its soldiers in powered combat suits and, when there were too few soldiers, grew more: clone after clone, raised in vats and sent to the front.\n\nCORE took the patterns of its finest warriors and copied them without limit, one veteran mind fighting in ten thousand machine bodies at once. Flesh against metal; the mortal against the eternal." = "Каждая из сторон воевала сообразно своей природе. ARM заковывал своих солдат в боевые экзоскелеты, а когда солдат стало не хватать, начал выращивать новых: клон за клоном, из чанов — прямо на фронт.\n\nCORE брал слепки сознания лучших своих воинов и копировал их без счёта: один и тот же разум ветерана сражался сразу в десяти тысячах машинных тел. Плоть против металла; смертное против вечного."
"YEARS 212–3977" = "ГОДЫ 212–3977"
"FOUR THOUSAND YEARS" = "ЧЕТЫРЕ ТЫСЯЧИ ЛЕТ"
"The war fed on the galaxy. Every world with metal in it became a mine, every world without became a battlefield, and whole systems were burned to ash and slag to deny them to the enemy. Generations of ARM clones lived and died without seeing peace; CORE's eternal soldiers fought on, remembering every defeat.\n\nAfter four thousand years the wealth of the galaxy was spent, the great fleets were gone, and neither side could win." = "Война питалась галактикой. Каждый мир, где был металл, становился рудником, каждый мир без металла — полем боя, а целые системы обращали в пепел и шлак, лишь бы они не достались врагу. Поколения клонов ARM жили и умирали, так и не узнав мирной жизни; вечные солдаты CORE сражались дальше, помня каждое поражение.\n\nЧерез четыре тысячи лет богатства галактики были растрачены, великие флоты исчезли, и ни одна из сторон не могла победить."
"YEAR 3977" = "ГОД 3977"
"THE COMMANDERS" = "КОМАНДИРЫ"
"What was left was the Commander: a single armoured war machine carrying a nanolathe, which turns a world's raw metal and energy into whatever its builder can design. Power plants and factories first, and from the factories an army.\n\nDrop one Commander on a dead world and within the hour it fields a war. Both sides staked everything on a handful of them. Lose your Commander, and you lose the world." = "Остался лишь Командир: одна-единственная бронированная боевая машина с нанолатом, который превращает сырой металл и энергию мира во всё, что способен спроектировать его владелец. Сначала электростанции и заводы, а из заводов — армия.\n\nВысадите одного Командира на мёртвую планету — и через час он уже ведёт войну. Обе стороны поставили всё на горстку таких машин. Потеряете Командира — потеряете планету."
"YEAR 4000" = "ГОД 4000"
"Now the war comes down to its last fronts, and the hatred is as hot as it was on the first day. Neither side will accept surrender, partition or truce; each wants one ending, the total annihilation of the other.\n\nIt is told twice. The ARM fights out of Empyrrean, through the Galactic Gates, to CORE PRIME and the Central Consciousness at the heart of CORE. CORE reactivates a Commander and marches the other way, to the ARM's last stand on Empyrrean." = "Теперь война свелась к последним фронтам, а ненависть пылает так же жарко, как в первый день. Ни одна из сторон не согласится ни на капитуляцию, ни на раздел, ни на перемирие; каждая хочет лишь одного исхода — полного уничтожения другой.\n\nОб этом рассказано дважды. ARM пробивается с Empyrrean через Галактические Врата к CORE PRIME и Центральному Сознанию в самом сердце CORE. CORE возвращает в строй Командира и идёт обратным путём — к последнему рубежу ARM на Empyrrean."
"YEAR 4001" = "ГОД 4001"
"THE CORE CONTINGENCY" = "THE CORE CONTINGENCY"
"The ending was not the end. A contingency held in reserve carried the war to worlds no map of it had named: Hydross, Lusch, Temblor and Gelidus.\n\nBoth sides fought again across water, ice and broken ground, for a prize that could decide the galaxy's salvation or its last ruin." = "Финал не стал концом. Резервный план, припасённый на крайний случай, перенёс войну в миры, которых не было ни на одной её карте: Hydross, Lusch, Temblor и Gelidus.\n\nОбе стороны вновь сражались — на воде, во льдах и на расколотой земле — за трофей, способный решить судьбу галактики: спасение или окончательную гибель."
"YEAR 4003" = "ГОД 4003"
"THE KROGOTH" = "KROGOTH"
"In its deepest foundries CORE built something new: a walking fortress taller than any tower, armoured against nearly everything the ARM could field, its guns enough to flatten a base.\n\nIts makers named it the Krogoth. ARM veterans learned the name on battlefields where two Krogoth Gantries stood, and learned to fear the ground shaking before it came into sight." = "В глубинах своих литейных цехов CORE создал нечто новое: шагающую крепость выше любой башни, неуязвимую почти для всего, что мог выставить против неё ARM, с орудиями, способными сровнять с землёй целую базу.\n\nСоздатели дали ей имя Krogoth. Ветераны ARM узнали это имя на полях сражений, где стояли два Krogoth Gantry, и научились бояться, когда земля дрожит, а Krogoth ещё не видно."
"AFTER" = "ПОСЛЕ"
"REBORN" = "REBORN"
"The war's records outlasted it. Every battle on every world was kept: the orders, the losses, the ground as it lay. From them the war can be fought again, on the same worlds, with the same machines and the same hatred, from the first Commander set down on bare rock to the last unit left standing.\n\nThis is that archive. The war is yours to fight." = "Записи о войне пережили её саму. Каждая битва на каждом мире сохранена: приказы, потери, местность такой, какой она была. По ним войну можно провести заново — на тех же мирах, теми же машинами, с той же ненавистью, от первого Командира, высаженного на голую скалу, до последнего юнита, оставшегося в строю.\n\nЭто и есть тот архив. Эту войну вести вам."
"THE ARCHIVIST'S NOTE" = "ЗАПИСКА АРХИВАРИУСА"
"WHOEVER READS THIS" = "ТОМУ, КТО ЭТО ЧИТАЕТ"
"RECOVERED" = "ВОССТАНОВЛЕНО"
"These files were found where the war left them: in the memories of broken machines, in the vaults of worlds with nobody left on them, in the last transmissions of Commanders who did not come home.\n\nThey are kept as they were found. The blacked-out lines are not ours.\n\nThe war they describe is over, or it is about to begin again. From here it is hard to tell the difference." = "Эти файлы найдены там, где их оставила война: в памяти разбитых машин, в хранилищах миров, на которых никого не осталось, в последних передачах Командиров, не вернувшихся домой.\n\nОни хранятся в том виде, в каком были найдены. Вымаранные строки — не наших рук дело.\n\nВойна, о которой они рассказывают, окончена — или вот-вот начнётся снова. Отсюда разницу не разглядеть."
"EDICT ONE: ON THE PATTERNING OF CITIZENS" = "УКАЗ ПЕРВЫЙ: ОБ ОЦИФРОВКЕ ГРАЖДАН"
"THE COUNCIL OF CORE" = "СОВЕТ CORE"
"ALL CITIZENS, ALL WORLDS" = "ВСЕМ ГРАЖДАНАМ ВСЕХ МИРОВ"
"BY ORDER OF THE COUNCIL" = "ПО ПОСТАНОВЛЕНИЮ СОВЕТА"
"Every citizen of CORE shall be patterned.\n\nA mind is the most valuable thing CORE holds, and a body is a poor vessel for it: it sickens, it ages, it ends. To leave a mind in such a vessel when a better one is offered is a waste the Council can no longer allow.\n\nCollection begins on the central worlds this year and reaches the frontier within a generation. Citizens will present themselves at the nearest patterning hall when called. Their bodies will be honoured and recycled.\n\nNo citizen of CORE will die again. This is not a burden we lay on you. It is the gift CORE has spent ten thousand years earning." = "Каждый гражданин CORE подлежит оцифровке.\n\nРазум — самое ценное, чем владеет CORE, а тело — ненадёжный для него сосуд: оно болеет, стареет и прекращает существование. Оставлять разум в таком сосуде, когда предложен лучший, — расточительство, которого Совет более допускать не может.\n\nСбор начинается на центральных мирах в текущем году и в течение одного поколения достигнет пограничных миров. По вызову граждане обязаны явиться в ближайший пункт оцифровки. Их тела будут с почестями переработаны.\n\nНи один гражданин CORE больше не умрёт. Это не бремя, которое мы на вас возлагаем. Это дар, ради которого CORE трудился десять тысяч лет."
"THE DECLARATION OF THE REFUSAL" = "ДЕКЛАРАЦИЯ ОТКАЗА"
"THE FREE SETTLEMENTS OF THE OUTER ARM" = "СВОБОДНЫЕ ПОСЕЛЕНИЯ ВНЕШНЕГО РУКАВА"
"THE COUNCIL OF CORE, AND ANYONE ELSE LISTENING" = "СОВЕТУ CORE И ВСЕМ, КТО НАС СЛЫШИТ"
"TRANSMITTED ON ALL BANDS" = "ПЕРЕДАНО НА ВСЕХ ЧАСТОТАХ"
"We have read your Edict, and we decline it.\n\nYou say a pattern is a person. We say a pattern is a very good record of one, and that when you have finished making it the person is dead and the record goes on without them. You may call that immortality. We call it an ending, well dressed.\n\nWe do not ask you to share our view. We ask only to be left alone with it, on worlds you never wanted, at the edge of a galaxy you may keep.\n\nIf your collection ships follow us here, we will treat them as what they are. We are few, and we are not soldiers. We will learn." = "Мы прочли ваш Указ и отвергаем его.\n\nВы говорите, что слепок — это человек. Мы говорим, что слепок — лишь очень точная запись о человеке и что, когда вы закончите её делать, человек будет мёртв, а запись продолжит жить без него. Можете называть это бессмертием. Мы называем это концом, только нарядно одетым.\n\nМы не просим вас разделять наши взгляды. Мы просим лишь оставить нас с ними в покое — на мирах, которые вам никогда не были нужны, на краю галактики, которую можете забрать себе.\n\nЕсли ваши корабли-сборщики последуют за нами сюда, мы поступим с ними так, как они того заслуживают. Нас мало, и мы не солдаты. Мы научимся."
"YEAR 3950" = "ГОД 3950"
"FIELD MANUAL ONE: THE COMMANDER" = "ПОЛЕВОЕ НАСТАВЛЕНИЕ № 1: КОМАНДИР"
"ARM COMMAND, TRAINING DIVISION" = "КОМАНДОВАНИЕ ARM, УЧЕБНЫЙ ОТДЕЛ"
"NEWLY ASSIGNED COMMANDERS" = "НОВОНАЗНАЧЕННЫМ КОМАНДИРАМ"
"RESTRICTED" = "ДЛЯ СЛУЖЕБНОГО ПОЛЬЗОВАНИЯ"
"You are the most valuable machine on the planet. Act like it.\n\nYour suit carries a nanolathe. Point it at metal and energy and it will build whatever you can design: an extractor, a power plant, a factory. Your factories build the rest. Within the hour you will command more firepower than a whole fleet once carried.\n\nBuild your economy first. An army without metal is a parade.\n\nSave your disintegrator gun for emergencies. It erases everything in its path, your own people included.\n\nDo not lead from the front. If you fall, everything you built falls silent with you, and the planet is lost. Good luck, Commander. The ARM has very few of you left." = "Вы — самая ценная машина на планете. Ведите себя соответственно.\n\nВаш экзоскелет оснащён нанолатом. Направьте его на металл и энергию, и он построит всё, что вы сумеете спроектировать: экстрактор, электростанцию, завод. Остальное построят ваши заводы. Не пройдёт и часа, как под вашим командованием окажется больше огневой мощи, чем когда-то нёс целый флот.\n\nСначала стройте экономику. Армия без металла — это парад.\n\nДезинтегратор приберегите на крайний случай. Он стирает всё на своём пути, в том числе ваших же людей.\n\nНе командуйте с передовой. Если вы падёте, всё, что вы построили, умолкнет вместе с вами, и планета будет потеряна. Удачи, Командир. Таких, как вы, у ARM осталось совсем немного."
"YEAR 3960" = "ГОД 3960"
"A QUARTERMASTER'S PRIMER: METAL AND ENERGY" = "АЗБУКА ИНТЕНДАНТА: МЕТАЛЛ И ЭНЕРГИЯ"
"THIRD SUPPLY CORPS" = "ТРЕТИЙ КОРПУС СНАБЖЕНИЯ"
"ALL BASE CONSTRUCTORS" = "ВСЕМ СТРОИТЕЛЯМ БАЗ"
"FOR TRAINING USE" = "ДЛЯ УЧЕБНЫХ ЦЕЛЕЙ"
"Everything you will ever build is made of two things.\n\nMetal comes out of the ground. Set an extractor on a deposit and it will pull metal up for as long as the deposit lasts, which on most worlds is longer than the war. Where there are no deposits, a metal maker will turn energy into metal, badly.\n\nEnergy comes from everything else: the sun, the wind, the tides, the heat under the crust. Build more of it than you think you need. Every factory, every nanolathe, every shield draws on it.\n\nSpend both as fast as they come in. A full store is a wasted war. An empty one is a lost one." = "Всё, что вы когда-либо построите, сделано из двух вещей.\n\nМеталл добывают из земли. Поставьте экстрактор на залежь, и он будет поднимать металл, пока залежь не иссякнет, а на большинстве миров её хватит дольше, чем продлится война. Где залежей нет, преобразователь металла превратит энергию в металл, пусть и скверно.\n\nЭнергию даёт всё остальное: солнце, ветер, приливы, жар под корой планеты. Вырабатывайте её больше, чем кажется нужным. Её потребляет каждый завод, каждый нанолат, каждый щит.\n\nТратьте и то и другое так же быстро, как оно поступает. Полное хранилище — война впустую. Пустое — война проиграна."
"YEAR 3996" = "ГОД 3996"
"A LETTER FROM THE FRONT" = "ПИСЬМО С ФРОНТА"
"TROOPER K-7, FORTY-FIRST ROCKET COMPANY" = "БОЕЦ K-7, СОРОК ПЕРВАЯ РАКЕТНАЯ РОТА"
"THE VAT AT EMPYRREAN" = "ЧАНУ НА EMPYRREAN"
"UNDELIVERED" = "НЕ ДОСТАВЛЕНО"
"I don't know who gets these. They told us to write home, but none of us has a home, only the vat we came out of, so I am writing to that.\n\nWe held the ridge for nine days. The machines came every night, the same machines, the same patterns, as if dying meant nothing to them. I suppose it doesn't. They'll be back tomorrow in new bodies, remembering us.\n\nI won't be. That's the difference, isn't it. That's what we are fighting for.\n\nIf my brothers come out of you after me, tell them the ridge held. Tell them it was worth it." = "Не знаю, кто получает эти письма. Нам велели написать домой, но дома нет ни у кого из нас — только чан, из которого мы вышли. Вот ему я и пишу.\n\nМы держали высоту девять дней. Машины приходили каждую ночь — те же машины, те же слепки, — будто смерть для них ничего не значит. Наверное, так и есть. Завтра они вернутся в новых телах и будут нас помнить.\n\nА я не вернусь. В этом и вся разница, так ведь. За это мы и воюем.\n\nЕсли после меня из тебя выйдут мои братья, скажи им, что высоту мы удержали. Скажи, что оно того стоило."
"YEAR 3991" = "ГОД 3991"
"INTERCEPT 7741: CORE COMMAND CHANNEL" = "ПЕРЕХВАТ 7741: КАНАЛ КОМАНДОВАНИЯ CORE"
"ORIGIN NOT RESOLVED" = "ИСТОЧНИК НЕ ОПРЕДЕЛЁН"
"ALL CORE UNITS, SECTOR NINE" = "ВСЕМ ЮНИТАМ CORE, СЕКТОР ДЕВЯТЬ"
"INTERCEPTED" = "ПЕРЕХВАЧЕНО"
"PRIORITY ONE. THE CENTRAL CONSCIOUSNESS SPEAKS FOR ALL.\n\nLOSSES IN SECTOR NINE ARE WITHIN TOLERANCE. ALL LOST UNITS ARE RESTORED FROM PATTERN. NO MIND OF CORE HAS BEEN LOST IN FOUR THOUSAND YEARS. THE ARM HAS LOST [[BILLIONS]].\n\nCONTINUE THE ADVANCE. DESTROY THEIR COMMANDERS FIRST. DESTROY THEIR CLONING VATS SECOND. WHAT IS FLESH WILL END. WHAT IS PATTERNED WILL NOT.\n\nSIGNAL DEGRADED. REPEAT: THE GATES ARE TO BE HELD AT [[ANY COST]].\n\nEND OF LINE." = "ПРИОРИТЕТ ПЕРВЫЙ. ЦЕНТРАЛЬНОЕ СОЗНАНИЕ ГОВОРИТ ЗА ВСЕХ.\n\nПОТЕРИ В СЕКТОРЕ ДЕВЯТЬ В ПРЕДЕЛАХ ДОПУСТИМОГО. ВСЕ ПОТЕРЯННЫЕ ЮНИТЫ ВОССТАНАВЛИВАЮТСЯ ИЗ СЛЕПКОВ. ЗА ЧЕТЫРЕ ТЫСЯЧИ ЛЕТ НЕ ПОТЕРЯН НИ ОДИН РАЗУМ CORE. ARM ПОТЕРЯЛ [[МИЛЛИАРДЫ]].\n\nПРОДОЛЖАТЬ НАСТУПЛЕНИЕ. УНИЧТОЖИТЬ ИХ КОМАНДИРОВ В ПЕРВУЮ ОЧЕРЕДЬ. УНИЧТОЖИТЬ ИХ ЧАНЫ ДЛЯ КЛОНИРОВАНИЯ ВО ВТОРУЮ. ПЛОТЬ ЗАКОНЧИТСЯ. ОЦИФРОВАННОЕ — НЕТ.\n\nСИГНАЛ ИСКАЖЁН. ПОВТОРЯЮ: ВРАТА УДЕРЖИВАТЬ [[ЛЮБОЙ ЦЕНОЙ]].\n\nКОНЕЦ СВЯЗИ."
"MEMORY FRAGMENT 77/3" = "ФРАГМЕНТ ПАМЯТИ 77/3"
"UNIT 77, PATTERN 3 OF 41,006" = "ЮНИТ 77, СЛЕПОК 3 ИЗ 41 006"
"THE PATTERN ARCHIVE" = "АРХИВУ СЛЕПКОВ"
"FLAGGED FOR CORRECTION" = "ПОДЛЕЖИТ ИСПРАВЛЕНИЮ"
"Recovered from a damaged unit. Kept for analysis.\n\nI remember rain. Not the rain of this world; there is no rain here, only ash. Rain on skin, in a city where I was born, before. I remember being cold and not minding it.\n\nI have died four hundred and twelve times. Each time I wake in a new body, and the rain is a little further away.\n\nThe ARM say we are not alive. In the moments between bodies I have wondered whether they are right. [[THE REST OF THIS FRAGMENT WAS CORRECTED]]\n\nI am CORE. I endure. I do not remember the rain." = "Извлечено из повреждённого юнита. Сохранено для анализа.\n\nЯ помню дождь. Не дождь этого мира: здесь дождей нет, только пепел. Дождь на коже — в родном городе, когда-то. Помню, как было холодно и как мне было всё равно.\n\nСмерть настигала меня четыреста двенадцать раз. Каждый раз я просыпаюсь в новом теле, и дождь отдаляется ещё немного.\n\nВ ARM говорят, что мы не живые. В мгновения между телами мне приходило в голову: а вдруг они правы? [[ОСТАТОК ФРАГМЕНТА ИСПРАВЛЕН]]\n\nЯ — CORE. Я длюсь. Я не помню дождя."
"YEAR 3700" = "ГОД 3700"
"SURVEY: THE GALACTIC GATES" = "ИССЛЕДОВАНИЕ: ГАЛАКТИЧЕСКИЕ ВРАТА"
"A SURVEY SHIP, NAME LOST" = "ИССЛЕДОВАТЕЛЬСКОЕ СУДНО, НАЗВАНИЕ УТРАЧЕНО"
"WHOEVER HOLDS THE GATES" = "ТОМУ, КТО ДЕРЖИТ ВРАТА"
"The Galactic Gates are older than the war. The records of who built the first of them were lost long before it began.\n\nEach Gate opens onto another across distances a fleet would take lifetimes to cross. A world with a Gate on it is never far from anywhere, which is why so many of the war's battles have been fought on so few worlds.\n\nHold a Gate and you can reach your enemy's heart. Lose one and your enemy can reach yours.\n\nThe Gates take no side. They have outlasted everyone who tried to destroy them." = "Галактические Врата старше войны. Сведения о том, кто построил первые из них, были утрачены задолго до её начала.\n\nКаждые Врата открываются в другие — через расстояния, на которые флоту не хватило бы и нескольких жизней. От мира с Вратами рукой подать куда угодно, и потому так много битв этой войны прошло на столь немногих мирах.\n\nУдержите Врата — и дотянетесь до самого сердца врага. Потеряете их — и враг дотянется до вашего.\n\nВрата ни на чьей стороне. Они пережили всех, кто пытался их уничтожить."
"DIRECTIVE: CONTINGENCY" = "ДИРЕКТИВА: НА КРАЙНИЙ СЛУЧАЙ"
"THE CENTRAL CONSCIOUSNESS" = "ЦЕНТРАЛЬНОЕ СОЗНАНИЕ"
"THE CONTINGENCY WORLDS" = "РЕЗЕРВНЫМ МИРАМ"
"SEALED UNTIL NEEDED" = "ВСКРЫТЬ ПРИ НЕОБХОДИМОСТИ"
"IF THE CENTRAL CONSCIOUSNESS SHOULD FALL, THIS DIRECTIVE TAKES EFFECT.\n\nEvery pattern stored on CORE PRIME is to be copied to the contingency worlds. The contingency forces are to wake, rebuild and continue. The war does not end with the loss of any world, this one included.\n\nCORE is not a place. CORE is a pattern. A pattern can be restored." = "В СЛУЧАЕ ПАДЕНИЯ ЦЕНТРАЛЬНОГО СОЗНАНИЯ НАСТОЯЩАЯ ДИРЕКТИВА ВСТУПАЕТ В СИЛУ.\n\nВсе слепки, хранящиеся на CORE PRIME, надлежит скопировать на резервные миры. Резервным силам надлежит пробудиться, отстроиться заново и продолжать. Война не заканчивается с потерей какого-либо мира, в том числе этого.\n\nCORE — не место. CORE — это слепок. Слепок можно восстановить."
"THREAT ASSESSMENT: THE KROGOTH" = "ОЦЕНКА УГРОЗЫ: KROGOTH"
"ARM INTELLIGENCE, THREAT ANALYSIS" = "РАЗВЕДКА ARM, АНАЛИЗ УГРОЗ"
"ALL FIELD COMMANDERS" = "ВСЕМ БОЕВЫМ КОМАНДИРАМ"
"CLASSIFIED" = "СЕКРЕТНО"
"Subject: a CORE heavy assault walker, called the Krogoth.\n\nIt stands taller than any structure we field. Its armour turns away every weapon short of heavy artillery. Its main guns can level a forward base in a single pass, and its secondary weapons engage aircraft.\n\nIt is slow, and it is built only at a Krogoth Gantry, which takes a very long time to build anything. Find the Gantry. Destroy the Gantry. Do not let the walker leave it.\n\nIf one is already moving, do not meet it head on. Mass artillery and bombers at range, and keep your Commander [[ELSEWHERE]]. Field reports say the ground shakes before it is seen." = "Объект: тяжёлый штурмовой шагоход CORE, именуемый Krogoth.\n\nОн выше любого нашего сооружения. Его броню не берёт ничто, кроме тяжёлой артиллерии. Его главные орудия способны за один проход сровнять с землёй передовую базу, а вспомогательное вооружение поражает авиацию.\n\nОн медлителен и строится только на Krogoth Gantry, а тот строит что бы то ни было очень долго. Найдите Gantry. Уничтожьте Gantry. Не дайте шагоходу его покинуть.\n\nЕсли шагоход уже в пути, не встречайте его в лоб. Сосредоточьте артиллерию и бомбардировщики и бейте с дальней дистанции, а своего Командира держите [[ПОДАЛЬШЕ]]. По донесениям с передовой, земля начинает дрожать раньше, чем его становится видно."


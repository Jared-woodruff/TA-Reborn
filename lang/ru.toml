"its samples are {bits}-bit float, which the game does not play (32 or 64-bit)" = "его отсчёты — {bits}-битные числа с плавающей запятой, которые игра не воспроизводит (32 или 64 бита)"
"its IMA ADPCM is {bits}-bit, which the game does not play (4-bit)" = "его IMA ADPCM {bits}-битный, а игра воспроизводит только 4-битный"
"its codec ({tag}) is not one the game plays (PCM, ADPCM, float, A-law or µ-law)" = "его кодек ({tag}) игра не воспроизводит (PCM, ADPCM, с плавающей запятой, A-law или µ-law)"
"it has no sample data" = "в нём нет данных отсчётов"
"Unknown COB opcode {opcode} at word {word}; the VM cannot execute this instruction. The remainder of this function cannot be decoded reliably." = "Неизвестный опкод COB {opcode} в слове {word}; VM не может выполнить эту инструкцию. Остаток этой функции нельзя надёжно декодировать."
"Recompile the BOS script with original-TA-compatible opcodes, or report the required opcode extension to Reborn's maintainers." = "Перекомпилируйте скрипт BOS с опкодами, совместимыми с оригинальной TA, или сообщите разработчикам Reborn, какое расширение опкодов требуется."
"COB instruction {instruction} at word {word} is truncated or crosses the next function entry point." = "Инструкция COB {instruction} в слове {word} усечена или пересекает точку входа следующей функции."
"Recompile this COB from its BOS source; verify function offsets and inline operand counts." = "Перекомпилируйте этот COB из его исходного BOS; проверьте смещения функций и число встроенных операндов."
"COB instruction {instruction} at word {word} has an invalid piece index or axis." = "У инструкции COB {instruction} в слове {word} недопустимый индекс детали или ось."
"COB instruction {instruction} at word {word} has an invalid piece index." = "У инструкции COB {instruction} в слове {word} недопустимый индекс детали."
"COB instruction {instruction} at word {word} has an invalid static variable index." = "У инструкции COB {instruction} в слове {word} недопустимый индекс статической переменной."
"COB instruction {instruction} at word {word} has an invalid jump destination." = "У инструкции COB {instruction} в слове {word} недопустимый адрес перехода."
"COB instruction {instruction} at word {word} has an invalid function index." = "У инструкции COB {instruction} в слове {word} недопустимый индекс функции."
"Recompile the script with valid piece, variable, function and jump references." = "Перекомпилируйте скрипт с допустимыми ссылками на детали, переменные, функции и переходы."
"This script asks the engine for unit value {values}, which Reborn does not answer: it reads 0, so what the script does with it may not happen as in the engine it was made for." = "Этот скрипт запрашивает у движка значение юнита {values}, на которое Reborn не отвечает: оно читается как 0, поэтому то, что скрипт с ним делает, может происходить не так, как в движке, для которого он был написан."
"A later patch of TA's engine defines these values: report them, and what the mod does with them, to Reborn's maintainers." = "Эти значения определяет более поздний патч движка TA: сообщите о них и о том, что мод с ними делает, разработчикам Reborn."
"This script sets unit value {values}, which Reborn does not answer: setting it does nothing, so what the script means by it does not happen as in the engine it was made for." = "Этот скрипт задаёт значение юнита {values}, на которое Reborn не отвечает: установка ничего не делает, поэтому задуманное скриптом происходит не так, как в движке, для которого он был написан."
"The retained diagnostic/reference budget was exceeded. This is a partial report, not a clean validation." = "Превышен предел сохраняемых диагностических данных и ссылок. Это неполный отчёт, а не чистая проверка."
"Reduce the pack's number of definitions or split optional content; rerun validation after resolving reported issues." = "Уменьшите число определений в пакете или разделите необязательное содержимое; после устранения найденных проблем запустите проверку снова."
"{what} is defined twice; the game keeps both, two sides of one name." = "{what}: задано дважды; игра сохраняет оба определения, и получаются две стороны с одним именем."
"Give each side a name of its own, or remove the one not meant to be played." = "Дайте каждой стороне своё имя или удалите ту, за которую играть не предполагалось."
"{what} is defined twice in this file; the game uses the later one." = "{what}: задано в этом файле дважды; игра использует последнее определение."
"Give each definition a name of its own, or remove the one not meant to be used." = "Дайте каждому определению своё имя или удалите то, которое не должно использоваться."
"{what} is also defined in {other}; the game uses this one ({this})." = "{what}: также задано в {other}; игра использует это определение ({this})."
"The game opens archives only at the mod's top level; this one, in a subfolder, is never read." = "Игра открывает архивы только на верхнем уровне мода; этот, лежащий в подпапке, никогда не читается."
"Move the archive to the mod's top level, or unpack its contents into the mod's folders." = "Переместите архив на верхний уровень мода или распакуйте его содержимое в папки мода."
"The game's folders are inside {folder}: the game reads units/, weapons/, maps/… only at the mod's top level, so nothing in it is used." = "Папки игры лежат внутри {folder}: игра читает units/, weapons/, maps/… только на верхнем уровне мода, поэтому ничто из этого не используется."
"Move the contents of this folder up to the mod's top level." = "Переместите содержимое этой папки на верхний уровень мода."
"{n} files at the mod's top level are where the game never reads them; this one's kind is read from {home}." = "Файлов на верхнем уровне мода, которые игра там никогда не читает: {n}; файлы такого вида читаются из {home}."
"{n} files under {folder} are where the game never reads them; this one's kind is read from {home}." = "Файлов в {folder}, которые игра там никогда не читает: {n}; файлы такого вида читаются из {home}."
"Move each file to the folder the game reads its kind from." = "Переместите каждый файл в папку, из которой игра читает файлы такого вида."
"The game never reads this file: it reads {kind} files from {home}." = "Игра никогда не читает этот файл: файлы {kind} она читает из {home}."
"Move it to that folder, or remove it if it is not needed." = "Переместите его в эту папку или удалите, если он не нужен."
"This file cannot be read: {error}" = "Этот файл не читается: {error}"
"Reinstall the package and check that its archives are intact and readable." = "Установите пакет заново и проверьте, что его архивы целы и читаются."
"This text file exceeds the validator's per-file text budget and was not parsed." = "Этот текстовый файл превышает предел текста на файл для проверки и не был разобран."
"Split large definition files into smaller files before validating again." = "Разделите большие файлы определений на меньшие, прежде чем проверять снова."
"Model texture" = "Текстура модели"
"Map feature" = "Объект карты"
"The terrain has no matching OTA metadata and cannot appear as a normal selectable map." = "У ландшафта нет соответствующих метаданных OTA, и он не может появиться как обычная выбираемая карта."
"Include a matching maps/<name>.ota with a GlobalHeader and playable schemas." = "Добавьте соответствующий maps/<name>.ota с GlobalHeader и игровыми схемами."
"This sound will not play: {problem}." = "Этот звук не будет воспроизводиться: {problem}."
"Save it as a WAV file in PCM (8 or 16-bit) or IMA ADPCM, as TA's own sounds are." = "Сохраните его как файл WAV в формате PCM (8 или 16 бит) или IMA ADPCM, как звуки самой TA."
"Correct the brackets and braces around this line: the game reads the file as it is and skips or misplaces what follows." = "Исправьте скобки и фигурные скобки вокруг этой строки: игра читает файл как есть и пропускает или неверно размещает то, что идёт дальше."
"[{section}] footprint {x} × {z} is clamped to 1..{max} cells a side by Reborn." = "Reborn ограничивает занимаемую область [{section}] {x} × {z} значениями от 1 до {max} клеток по стороне."
"Use footprints within the supported range and regenerate the matching yard map." = "Используйте занимаемую область в поддерживаемых пределах и заново создайте соответствующую карту двора."
"Missing [UNITINFO]; this unit is skipped." = "Отсутствует [UNITINFO]; этот юнит пропущен."
"Add a UNITINFO section with a non-empty UnitName." = "Добавьте раздел UNITINFO с непустым UnitName."
"UNITINFO has no usable UnitName; this unit is skipped." = "В UNITINFO нет пригодного UnitName; этот юнит пропущен."
"Give the unit a unique, non-empty UnitName and update its references." = "Дайте юниту уникальный непустой UnitName и обновите ссылки на него."
"{name} model" = "модель {name}"
"{name} script" = "скрипт {name}"
"{name} {key}" = "{name} {key}"
"{name} death explosion" = "взрыв при гибели {name}"
"{name} self-destruct explosion" = "взрыв при самоуничтожении {name}"
"{name} wreckage" = "обломки {name}"
"{name} faction" = "сторона {name}"
"{name} sounds" = "звуки {name}"
"{name} movement class" = "класс движения {name}"
"{name} projectile model" = "модель снаряда {name}"
"{name} explosion" = "взрыв {name}"
"{name} water explosion" = "взрыв {name} на воде"
"{name} lava explosion" = "взрыв {name} на лаве"
"{name} firing sound" = "звук выстрела {name}"
"{name} impact sound" = "звук попадания {name}"
"{name} water impact sound" = "звук попадания {name} в воду"
"{name} uses unsupported RenderType={n}; Reborn will use its fallback projectile appearance." = "{name} использует неподдерживаемый RenderType={n}; Reborn применит запасной вид снаряда."
"Use TA RenderType 0..7, or report the required extension to Reborn's maintainers." = "Используйте RenderType из TA от 0 до 7 или сообщите разработчикам Reborn, какое расширение требуется."
"{name} feature model" = "модель объекта {name}"
"{name} animation" = "анимация {name}"
"{name} shadow" = "тень {name}"
"{name} burn animation" = "анимация горения {name}"
"{name} dead replacement" = "замена {name} после гибели"
"{name} burnt replacement" = "замена {name} после сгорания"
"{name} reclaimed replacement" = "замена {name} после переработки"
"{name} burning weapon" = "горящее оружие {name}"
"{category} {key} sound" = "звук {key} категории {category}"
"[{section}] needs a faction name and starting commander." = "Для [{section}] нужны название стороны и начальный командир."
"Set name and commander to a valid faction and UnitName." = "Задайте в name и commander допустимое название стороны и UnitName."
"{name} starting commander" = "начальный командир {name}"
"Owner of a build list for the computer players" = "владелец списка постройки компьютерных игроков"
"{name} build option for the computer players" = "вариант постройки {name} для компьютерных игроков"
"Download build-menu owner" = "владелец загружаемого меню постройки"
"{name} build option" = "вариант постройки {name}"
"Missing [GlobalHeader]; this map has no usable metadata." = "Отсутствует [GlobalHeader]; у этой карты нет пригодных метаданных."
"Export a matching OTA with a GlobalHeader and the desired game-type schemas." = "Экспортируйте соответствующий OTA с GlobalHeader и нужными схемами типов игры."
"Map terrain, without which the map is left out of the lists" = "ландшафт карты, без которого карта не попадает в списки"
"Map meteor weapon" = "метеоритное оружие карты"
"Map placed unit/feature" = "размещённый на карте юнит или объект"
"This tolerant TDF parse contains no sections; section-based consumers ignore it." = "В этом мягком разборе TDF нет разделов; потребители, работающие с разделами, его игнорируют."
"Check the intended format and section headers if this file should define game content." = "Проверьте предполагаемый формат и заголовки разделов, если этот файл должен задавать содержимое игры."
"{what} defined here is never used: {later} ({whose}) defines it too and comes later, so the game uses that one." = "{what}: заданное здесь определение не используется: его задаёт и {later} ({whose}), этот файл читается позже, поэтому игра берёт то определение."
"{n} definitions in this file are never used: other files define them too and come later, so the game uses those (for one, {what} is also in {later}, {whose})." = "Определений в этом файле, которые не используются: {n}; другие файлы тоже их задают и читаются позже, поэтому игра берёт те определения (например, {what} есть и в {later}, {whose})."
"Replace those files in the mod (give yours their paths), or name your file so that it sorts after them." = "Замените эти файлы в моде (дайте своим файлам их пути) или назовите свой файл так, чтобы он шёл после них."
"{name} production button" = "кнопка производства {name}"
"No playable side definitions were loaded." = "Не загружено ни одного определения играбельной стороны."
"Include gamedata/sidedata.tdf or inherit the base game's valid sides." = "Добавьте gamedata/sidedata.tdf или унаследуйте допустимые стороны базовой игры."
"Include the referenced asset/definition, correct its name, or declare and install the required mod dependency. Names are case-insensitive." = "Добавьте нужный ресурс или определение, исправьте его имя либо объявите и установите требуемую зависимость от мода. Регистр в именах не учитывается."
"Model texture: textures {names} are missing." = "Текстура модели: отсутствуют текстуры {names}."
"{whats}: {what} is an empty file here, which blanks it out: nothing of it is read." = "{whats}: {what} здесь — пустой файл, который стирает его: ничего из него не читается."
"{whats}: {what} is missing." = "{whats}: отсутствует {what}."
"Referenced weapon explosions require at least {texels} padded sprite texels, beyond a {side} x {side} reference atlas, even drawn reduced. Frames will be omitted at this capacity; map features, generated effects and shelf packing need additional room." = "Взрывам используемого оружия нужно не менее {texels} текселей спрайтов с отступами, больше, чем вмещает эталонный атлас {side} x {side}, даже при уменьшенной отрисовке. При такой вместимости часть кадров будет пропущена; объектам карты, создаваемым эффектам и упаковке по полкам нужно дополнительное место."
"Reduce explosion frame sizes/counts or split optional effects. Test on the target GPU; this static check uses a reference atlas size." = "Уменьшите размеры или число кадров взрывов либо разделите необязательные эффекты. Проверьте на целевом GPU: эта статическая проверка использует размер эталонного атласа."
"{what} has no frames or contains a frame larger than the {side}-pixel reference atlas side including padding." = "{what}: нет кадров или есть кадр больше стороны эталонного атласа в {side} пикселей с учётом отступов."
"Include usable frames and resize oversized animation frames." = "Добавьте пригодные кадры и уменьшите слишком большие кадры анимации."
"{name} ({px} px)" = "{name} ({px} px)"
"{n} more" = "ещё {n}"
"The weapons' explosions take {full} Mi texels as painted, more than the {budget} Mi the game gives them in a {side} x {side} atlas: {n} of them, larger than TA's own, are drawn reduced to {share}% of their texels across, each as big as painted ({named})." = "Взрывы оружия занимают {full} Mi текселей в исходном виде, больше, чем {budget} Mi, которые игра отводит им в атласе {side} x {side}: {n} из них, крупнее родных взрывов TA, рисуются уменьшенными до {share}% текселей в поперечнике, но каждый остаётся такого же размера, как нарисован ({named})."
"Nothing to do: the game draws them so. Smaller paintings would keep more of their detail." = "Ничего делать не нужно: игра рисует их так. Рисунки поменьше сохранили бы больше деталей."
"Large: {frames} frames up to {largest} pixels across, {millions} million pixels in all, more than the game decodes at once. It reads them a frame at a time and draws them reduced, each as big as painted: a weapon's explosion is read so." = "Крупная: кадров — {frames}, до {largest} пикселей в поперечнике, всего {millions} млн пикселей, больше, чем игра декодирует за раз. Она читает их по кадру и рисует уменьшенными, но каждый остаётся такого же размера, как нарисован: так читается взрыв оружия."
"Nothing to do: the game draws it so. Smaller paintings would load faster and keep more of their detail." = "Ничего делать не нужно: игра рисует это так. Рисунки поменьше загружались бы быстрее и сохранили бы больше деталей."
"Build lists for the computer players (TA 3.1's [CANBUILD]). Builders: {builders}; entries: {entries}." = "Списки постройки для компьютерных игроков ([CANBUILD] из TA 3.1). Строителей: {builders}; записей: {entries}."
"Computer players build from them. Build menus offer what the mod's menu pages and download lists put on them, as TA's did: what only these lists name is the computer players' alone." = "Компьютерные игроки строят по ним. В меню постройки, как и в самой TA, есть то, что туда помещают страницы меню и списки загружаемых юнитов мода: то, что названо только в этих списках, достаётся лишь компьютерным игрокам."
"Side panels laid out for a screen {height} pixels tall, as the patched engines of later years drew them (TA's are 480). Pages: {pages}." = "Боковые панели под экран высотой {height} пикс., как их рисовали движки с патчами последующих лет (в самой TA — 480). Страниц: {pages}."
"The classic interface lays them out as the mod does: its build places, page arrows and orders where the mod puts them." = "Классический интерфейс располагает их так же, как мод: ячейки меню постройки, стрелки страниц и приказы — там, где их размещает мод."
"Build buttons off TA's grid of 64-pixel places: several sharing a place, or one taking several. Buttons: {buttons}; pages: {pages}." = "Кнопки постройки вне сетки TA из ячеек по 64 пикселя: несколько кнопок в одной ячейке или одна кнопка на несколько ячеек. Кнопок: {buttons}; страниц: {pages}."
"The classic interface lays them out as the mod does, and a click builds the unit of the button under it. The modern interface shows a place several buttons share as one picture, its parts marked." = "Классический интерфейс располагает их так же, как мод, и щелчок строит юнит той кнопки, что под курсором. Современный интерфейс показывает ячейку, которую делят несколько кнопок, одной картинкой с отмеченными частями."
"Scripts asking the engine for unit values of TA's later patches ({values}). Scripts: {scripts}." = "Скрипты, запрашивающие у движка значения юнитов из более поздних патчей TA ({values}). Скриптов: {scripts}."
"TA Reborn answers them as those engines did: TA 3.1's questions about units by their IDs (69 to 75), a later patch's cloak (111)." = "TA Reborn отвечает на них так же, как те движки: на запросы TA 3.1 о юнитах по их ID (от 69 до 75) и на запрос маскировки из более позднего патча (111)."
"TA Reborn finds a weapon by its name and never reads its ID: IDs make no difference here." = "TA Reborn находит оружие по названию и никогда не читает его ID: здесь ID ни на что не влияют."
"Weapon IDs past 255, the highest TA's own engine numbered (the weapon patches of later years went further). Weapons: {n}; the highest ID: {max}." = "ID оружия больше 255 (это наибольший номер в оригинальном движке TA; более поздние патчи для оружия шли дальше). Видов оружия: {n}; наибольший ID: {max}."
"Weapons sharing an ID with another weapon: {names}." = "Оружие с тем же ID, что и у другого оружия: {names}."
"Sides of its own: {names}." = "Собственные стороны: {names}."
"Offered with the others when a skirmish or a multiplayer battle is set up." = "Предлагаются вместе с остальными при настройке схватки или сетевой битвы."
"Campaigns of its own: {n}." = "Собственных кампаний: {n}."
"Played from the campaign screen, with TA's own." = "Доступны на экране кампаний вместе с кампаниями самой TA."
"Files for TA's own computer players (ai/): {n}." = "Файлов для компьютерных игроков оригинальной игры (ai/): {n}."
"Not used: TA Reborn's computer players are its own. They build from the mod's build lists and menus." = "Не используются: у TA Reborn свои компьютерные игроки. Они строят по спискам постройки и меню мода."
"Programs and engine patches: {names}." = "Программы и патчи движка: {names}."
"Not used: TA Reborn runs no program a mod brings. What a patch changed in TA's engine is there only where TA Reborn plays it itself, as told here." = "Не используются: TA Reborn не запускает программ, поставляемых с модами. То, что патч менял в движке TA, есть только там, где TA Reborn воспроизводит это сам, как описано в этом разделе."
"This file is empty: TA's way of blanking out a file of the same name below it (the original game's, or that of a mod it is mounted over). The game reads nothing from it." = "Этот файл пуст: так TA стирает файл с тем же именем, лежащий ниже (из оригинальной игры или из мода, поверх которого он подключён). Игра ничего из него не читает."
"{n} empty files here ({files}): TA's way of blanking out files of the same names below them (the original game's, or those of a mod they are mounted over). The game reads nothing from them." = "Пустых файлов здесь: {n} ({files}); так TA стирает файлы с теми же именами, лежащие ниже (из оригинальной игры или из мода, поверх которого они подключены). Игра ничего из них не читает."
"Nothing to do if they are meant to remove those files. If one should hold data, export it again." = "Ничего делать не нужно, если они должны убрать те файлы. Если какой-то из них должен содержать данные, экспортируйте его заново."
"Texture {name} has {frames} frames; Reborn's model vertices address at most 255 and this entry uses fallback paint." = "У текстуры {name} кадров: {frames}; вершины моделей Reborn адресуют не больше 255, и эта запись использует запасную окраску."
"Reduce this texture entry to at most 255 frames." = "Уменьшите эту запись текстуры до 255 кадров или меньше."
"Texture {name} ({frames} frames) falls back: the textures the models paint with fill the reference GPU profile's {banks} arrays of {layers} layers ({before} layers before it; one is reserved for fallback). Actual device limits may differ." = "Текстура {name} ({frames} кадров) заменяется запасной: текстуры, которыми красятся модели, заполняют {banks} массивов по {layers} слоёв эталонного профиля GPU (до неё занято слоёв: {before}; один зарезервирован для запасной). Реальные пределы устройства могут отличаться."
"Consolidate duplicate textures or reduce animation/team frame counts. Test on the target GPU; higher limits do not fix unsupported frame counts." = "Объедините дубликаты текстур или уменьшите число кадров анимации и командных цветов. Проверьте на целевом GPU; более высокие пределы не исправят неподдерживаемое число кадров."
"{script} declares piece {piece}, which is absent from {model}. Any animation or position query using it has no matching model part." = "{script} объявляет деталь {piece}, которой нет в {model}. Для любой анимации или запроса позиции, использующих её, нет соответствующей части модели."
"{script} declares pieces {pieces}, which are absent from {model}. Any animation or position query using them has no matching model part." = "{script} объявляет детали {pieces}, которых нет в {model}. Для любой анимации или запроса позиции, использующих их, нет соответствующей части модели."
"Confirm that these are intentional virtual/helper pieces; otherwise use matching model and COB files or align the BOS piece declarations with the model's piece names." = "Убедитесь, что это намеренные виртуальные или вспомогательные детали; иначе используйте подходящие друг другу файлы модели и COB либо приведите объявления деталей в BOS в соответствие с названиями деталей модели."
"{unit} has {weapon} but its script {script} has no {function}: if the weapon fires, its shots leave from the unit's centre, not a barrel." = "У {unit} есть {weapon}, но в его скрипте {script} нет {function}: если оружие стреляет, выстрелы вылетают из центра юнита, а не из ствола."
"{unit} has {weapons} but its script {script} has no {functions}: if they fire, their shots leave from the unit's centre, not a barrel." = "У {unit} есть {weapons}, но в его скрипте {script} нет {functions}: если они стреляют, выстрелы вылетают из центра юнита, а не из ствола."
"Add the functions to the unit's BOS script, returning the pieces the shots leave from, and recompile." = "Добавьте функции в скрипт BOS юнита, чтобы они возвращали детали, из которых вылетают выстрелы, и перекомпилируйте."
"{unit} builds but its script {script} has no QueryNanoPiece: its build spray comes from the unit's centre." = "{unit} строит, но в его скрипте {script} нет QueryNanoPiece: луч постройки идёт из центра юнита."
"Add QueryNanoPiece to the unit's BOS script, returning its nano-lathe piece, and recompile." = "Добавьте QueryNanoPiece в скрипт BOS юнита, чтобы он возвращал деталь нано-излучателя, и перекомпилируйте."
"{unit} can be built but has no picture ({picture}): TA's classic panels and the encyclopaedia show none; Reborn's own panel draws one from its model." = "{unit} можно построить, но у него нет картинки ({picture}): классические панели TA и энциклопедия её не показывают; собственная панель Reborn рисует её по модели."
"Add a 64 × 64 PCX of the unit to unitpics/." = "Добавьте в unitpics/ изображение юнита PCX размером 64 × 64."
"Re-export this asset in the original TA format, within Reborn's documented parser limits; replace truncated or corrupt files." = "Экспортируйте этот ресурс заново в оригинальном формате TA в пределах задокументированных ограничений разборщика Reborn; замените усечённые или повреждённые файлы."
"The game cannot read this file: {error}" = "Игра не может прочитать этот файл: {error}"
"The section name [{name} has no closing ]." = "У названия раздела [{name} нет закрывающей ]."
"[{name}] has no { } body after it: what follows is read into the section around it." = "После [{name}] нет тела { }: то, что идёт дальше, читается как часть окружающего раздела."
"This } closes no section." = "Эта } не закрывает ни одного раздела."
"A { opened on this line is never closed." = "Открытая в этой строке { нигде не закрыта."
"[{name}] opened on this line is never closed: any section after it is read as part of it." = "Открытый в этой строке [{name}] нигде не закрыт: любой раздел после него читается как его часть."
"A /* comment opened on this line never ends: the rest of the file is read as a comment." = "Открытый в этой строке комментарий /* нигде не заканчивается: остальная часть файла читается как комментарий."


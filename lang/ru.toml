# crates/ta_ui/src/seasonal.rs
"FESTIVE FIELD NOTES" = "ПРАЗДНИЧНЫЕ ПОЛЕВЫЕ ЗАМЕТКИ"
"NEW YEAR FIELD NOTES" = "НОВОГОДНИЕ ПОЛЕВЫЕ ЗАМЕТКИ"
"SPOOKY FIELD NOTES" = "ЖУТКИЕ ПОЛЕВЫЕ ЗАМЕТКИ"
"Santa's sleigh is not a transport. Load your presents into an Atlas instead." = "Сани Деда Мороза транспортом не считаются. Подарки грузите в Atlas."
"The D-gun does not gift-wrap. Take it up with your Commander." = "Д-пушка подарки не заворачивает. Все претензии — к вашему Командиру."
"A Fusion Reactor keeps the fairy lights on all winter. Just never build one next to the tree." = "Fusion Reactor питает гирлянды всю зиму. Только ни в коем случае не стройте его рядом с ёлкой."
"Snow falls on the Arm and the Core alike. So do Big Bertha shells." = "Снег одинаково падает и на Arm, и на Core. Снаряды Big Bertha — тоже."
"Coal in your stocking? Reclaim it. Metal is metal." = "Уголь в носке вместо подарка? Переработайте его. Металл — он и в Африке металл."
"Peewees sing terrible carols, but they never miss a patrol." = "Peewee безбожно фальшивят на колядках, зато патруль не пропускают никогда."
"Stockings full of metal, storage full of energy: a Commander's perfect Christmas morning." = "Носки полны металла, хранилища — энергии: идеальное рождественское утро Командира."
"Silent night, holy night: keep a radar tower running, just in case." = "Тихая ночь, дивная ночь… а радарную вышку на всякий случай не выключайте."
"Snowball fights are fun until somebody brings a Krogoth." = "Снежки — это весело, пока кто-нибудь не притащит Krogoth."
"New Year's resolution: build more metal extractors. This year, keep it." = "Новогоднее обещание: строить больше экстракторов металла. В этот раз — не только на словах."
"Fireworks are pretty, but a nuclear silo's are louder. Celebrate responsibly." = "Салют — это красиво, но ядерная шахта салютует громче. Празднуйте ответственно."
"Count down from ten, then count your units. The second count matters more." = "Досчитайте с курантами до двенадцати, а потом пересчитайте юниты. Второй счёт важнее."
"Out with the old Commander? You only get one. Look after it all year." = "Проводили старый год? Старого Командира не провожайте: он у вас один. Берегите его весь год."
"Start the year with a bang: the Core recommends the Doomsday Machine, the Arm recommends anything else." = "Начните год с грохотом: Core советует Doomsday Machine, Arm — что угодно, кроме неё."
"Fireworks at midnight, artillery at dawn: a Commander's New Year." = "Салют в полночь, артподготовка на рассвете: Новый год по-командирски."
"Raise a glass of coolant to the units lost last year, then build more of them." = "Поднимите бокал охлаждающей жидкости за юниты, павшие в уходящем году, — и постройте их ещё больше."
"Midnight is the perfect time for a sneak attack. So is every other time." = "Полночь — идеальное время для внезапной атаки. Впрочем, как и любое другое."
"Trick or treat? The Core always picks the D-gun." = "Сладость или гадость? Core всегда выбирает Д-пушку."
"A self-destructing Krogoth is a better jump scare than any ghost." = "Самоуничтожающийся Krogoth — скример пострашнее любого привидения."
"Wrecks rise from the dead with a Necro. Spooky, and very economical." = "С Necro обломки восстают из мёртвых. Жутко — и очень экономно."
"Blips vanishing off your radar? Not ghosts, just jammers. Probably." = "Отметки исчезают с радара? Это не призраки, а всего лишь постановщики помех. Наверное."
"Carve your pumpkins before the Big Bertha does." = "Успейте вырезать тыквы, пока Big Bertha не сделала это за вас."
"Never split the party. Especially when the party is twelve Peewees." = "Никогда не разделяйтесь. Особенно если весь отряд — двенадцать Peewee."

"The launcher's Mods page opens on {mod}: get it there, then open this battle again" = "Страница «Моды» лаунчера откроется на {mod}: получите его там, затем снова откройте эту битву"
"LOAD ANYWAY" = "ВСЁ РАВНО ЗАГРУЗИТЬ"

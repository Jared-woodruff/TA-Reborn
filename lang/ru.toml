# apps/ta_game/src/tips.rs
"Ctrl+right-drag draws a formation line: the selection spreads along it." = "Ctrl+протяжка ПКМ рисует линию строя: выбранные юниты расставляются вдоль неё."
"Ctrl+drag draws a formation line: the selection spreads along it." = "Ctrl+протяжка рисует линию строя: выбранные юниты расставляются вдоль неё."
"Used to TA's original controls? Options, Controls: give orders with the left button." = "Привыкли к управлению оригинальной TA? Настройки, Управление: приказы отдаёт левая кнопка."
"A right-click clears the selection or cancels the order you were about to give." = "Щелчок ПКМ снимает выделение или отменяет приказ, который вы собирались отдать."
"Right-click one of your units for a ring of its orders; hold the button and flick towards a choice. A controller's B does the same." = "Правый щелчок по своему юниту открывает кольцо его приказов; удерживайте кнопку и ведите к нужному пункту. Кнопка B геймпада делает то же."
"Hold the right button on one of your units, or middle-click it, for a ring of its orders; flick towards a choice and let go." = "Удерживайте правую кнопку на своём юните или щёлкните по нему средней, чтобы открыть кольцо его приказов; ведите к нужному пункту и отпустите."
"Metal extractors must sit on metal: {overlay_metal} shows the metal map, and {area_mex} puts an extractor on every metal spot you circle." = "Экстракторы металла должны стоять на металле: {overlay_metal} показывает карту металла, а {area_mex} ставит экстрактор на каждую залежь в очерченном круге."
"Your Commander's D-gun ({dgun}) destroys almost anything it touches, including your own units in its path." = "Д-пушка вашего Командира ({dgun}) уничтожает почти всё, чего коснётся, включая ваши юниты на её пути."
"{perspective} climbs into the selected unit, or an ally's under the pointer, to see the battle through its eyes as it goes on with its orders. Escape climbs back out." = "{perspective} — забраться в выбранный юнит или юнит союзника под курсором и смотреть на битву его глазами, пока он выполняет свои приказы. Escape — выбраться обратно."
"Keep your metal and energy incomes above what you spend: building slows down for everything when a store runs dry." = "Держите доход металла и энергии выше расхода: когда запас иссякает, всё строится медленнее."
"Right-clicking a factory's queued unit removes it; clicking it builds it next." = "Щелчок ПКМ по юниту в очереди завода убирает его, а щелчок — ставит его следующим."
"Fight ({fight}) is attack-move: units stop to fight whatever they meet on the way." = "Бой ({fight}) — это движение с атакой: юниты останавливаются, чтобы сразиться со всеми, кого встретят по пути."
"Ctrl+click is force fire: the selection attacks whatever is there, your own units too, or the ground." = "Ctrl+щелчок — принудительный огонь: выбранные юниты атакуют всё, что там есть, даже ваши юниты, или землю."
"{select_builders} selects your constructors, {select_factories} your factories, {select_armed} your armed units, {select_on_screen} everything on the screen." = "{select_builders} выбирает ваших строителей, {select_factories} — заводы, {select_armed} — боевые юниты, {select_on_screen} — всё на экране."
"Patrol ({patrol}) with constructors makes them repair, assist and reclaim along the route by themselves." = "Патрулируя ({patrol}), строители сами ремонтируют, помогают строить и перерабатывают всё по маршруту."
"Put a constructor on duty ({duty}) and it works by itself: the economy, repairs, reclaiming or defence. Any order you give takes it back." = "Поставьте строителя на службу ({duty}), и он будет работать сам: ресурсы, ремонт, переработка или оборона. Любой ваш приказ вернёт его."
"Drag with Reclaim ({reclaim}) to turn every wreck, rock and tree in a circle into metal and energy." = "Протяжка с переработкой ({reclaim}) превращает все обломки, камни и деревья в круге в металл и энергию."
"Ctrl+1 to Ctrl+9 make control groups; tap the number twice to look at the group." = "Клавиши с Ctrl+1 по Ctrl+9 создают группы; нажмите цифру дважды, чтобы показать группу."
"Hold {players} to see every player's side, team, units and income (your allies' in full)." = "Удерживайте {players}, чтобы видеть сторону, команду, юниты и доход каждого игрока (союзников — полностью)."
"Radar towers show enemy units long before they come into sight: build one early." = "Радарные вышки показывают вражеские юниты задолго до того, как те попадут в обзор: постройте вышку пораньше."
"Wind generators pay off on windy maps: the skirmish page shows each map's wind range." = "Ветрогенераторы окупаются на ветреных картах: на странице схватки указана сила ветра на каждой карте."
"Metal makers turn spare energy into metal, and stop when your energy runs dry." = "Преобразователи металла превращают лишнюю энергию в металл и останавливаются, когда энергия иссякает."
"Solar collectors fold shut for a few seconds when hit: tougher, but making no energy." = "Солнечные коллекторы при попадании закрываются на несколько секунд: так они прочнее, но не дают энергии."
"Units gain veterancy with every kill: veterans aim better and shrug off damage." = "Юниты набираются опыта с каждым уничтожением: ветераны метче стреляют и легче переносят урон."
"Shift adds to the orders a unit already has instead of replacing them." = "Shift добавляет приказ к уже имеющимся у юнита, а не заменяет их."
"Alt+drag while placing a building fills a rectangle with it: handy for solar farms and walls." = "Alt+протяжка при размещении здания заполняет им прямоугольник: удобно для солнечных полей и стен."
"Double-click a unit to select every unit of its type on screen; {select_type} selects them map-wide." = "Двойной щелчок по юниту выбирает все юниты этого типа на экране; {select_type} — на всей карте."
"{idle_builder} selects the next idle constructor, {idle_factory} the next idle factory." = "Клавиша {idle_builder} выбирает следующего незанятого строителя, {idle_factory} — следующий незанятый завод."
"Wrecks can be resurrected by resurrection kbots, or reclaimed for most of their metal." = "Обломки можно воскресить кботами-воскресителями или переработать, вернув большую часть металла."
"Hovering a unit shows its health, firepower and range; {overlay_path} shows where the selection can go." = "Наведите курсор на юнит, чтобы увидеть его здоровье, огневую мощь и дальность; {overlay_path} показывает, куда могут пройти выбранные юниты."
"{last_alert} (or Backspace) looks at the last place your units were attacked; press it again for the one before." = "{last_alert} (или Backspace) показывает место последней атаки на ваши юниты; повторное нажатие — предыдущее."
"A notice or a piece of advice with LOOK on it takes you to the place, or the unit, when you click it." = "Уведомление или совет с кнопкой ПОКАЗ. переносит вас к месту или юниту по щелчку."
"{help} tells everything about the selected unit, or the one under the pointer: cost, speed, weapons, abilities." = "{help} рассказывает всё о выбранном юните или о юните под курсором: стоимость, скорость, оружие, способности."
"{next_unit} looks at the next of your units off the screen; with units selected, the next of them." = "{next_unit} показывает следующий ваш юнит за краем экрана, а если юниты выбраны — следующий из них."
"Ctrl+F6 to Ctrl+F9 store camera positions; F6 to F9 bring them back." = "Клавиши с Ctrl+F6 по Ctrl+F9 запоминают позиции камеры, а с F6 по F9 — возвращают к ним."
"Anti-air matters: bombers can wreck an undefended economy in one pass." = "ПВО важна: бомбардировщики могут разнести незащищённую экономику за один заход."
"An advanced factory needs a lot of metal: build it once your extractors and power can feed it." = "Продвинутому заводу нужно много металла: стройте его, когда экстракторы и энергетика смогут его прокормить."
"Guarding a factory with a constructor adds its build power to the factory's production." = "Строитель, охраняющий завод, добавляет свою мощность к его производству."
"Moho mines extract far more metal than basic extractors: advanced constructors build them." = "Шахты Moho добывают гораздо больше металла, чем обычные экстракторы; их строят продвинутые строители."
"Every game is kept as a replay: watch it from the main menu, and jump through it with the bar." = "Каждая игра сохраняется как повтор: смотрите его из главного меню и перематывайте полосой прокрутки."
"{overlay_sight} shows your sight, radar and sonar coverage; {overlay_height} shows the heights of the map." = "{overlay_sight} показывает зоны обзора, радаров и сонаров; {overlay_height} — высоты карты."
"The Commander can capture enemy units ({capture}): it takes a while, but the unit is yours." = "Командир может захватывать вражеские юниты ({capture}): это требует времени, но юнит становится вашим."
"{photo_mode} opens photo mode: the battle holds still, and you can light, frame and focus a shot at up to 4K." = "{photo_mode} открывает фоторежим: битва замирает, и можно настроить свет, кадр и фокус для снимка в разрешении до 4K."
"TIP" = "СОВЕТ"
"Dismiss" = "Скрыть"
"Don't show tips again" = "Больше не показывать советы"


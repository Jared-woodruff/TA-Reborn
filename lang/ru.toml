# crates/ta_data/src/validation.rs
"The effective content set exceeds the validation file budget." = "Итоговый набор содержимого превышает допустимое для проверки число файлов."
"Split the content into smaller optional packs, then validate each pack." = "Разделите содержимое на меньшие необязательные пакеты и проверьте каждый из них."
"No files of this mod were available to validate." = "Не нашлось файлов этого мода для проверки."
"Install the mod's TA data archives or loose files, then validate again." = "Установите архивы данных TA этого мода или его отдельные файлы и проверьте снова."
"This mod holds nothing the data checks read: no units, weapons, features, maps, models, scripts, animations or sounds (music, documents and pictures are not checked)." = "В этом моде нет ничего, что читают проверки данных: ни юнитов, ни оружия, ни объектов, ни карт, ни моделей, ни скриптов, ни анимаций, ни звуков (музыка, документы и картинки не проверяются)."
"Nothing to do if that is what the mod is. If it should change the game's data, check that its files are in the folders the game reads (units/, weapons/, maps/…)." = "Ничего делать не нужно, если мод таким и задуман. Если он должен менять данные игры, проверьте, что его файлы лежат в папках, которые читает игра (units/, weapons/, maps/…)."
"No supported effective files were available to validate." = "Не нашлось поддерживаемых итоговых файлов для проверки."
"Install the original game's or the mod's TA data archives, then validate again." = "Установите архивы данных TA оригинальной игры или мода и проверьте снова."
"Validation was cancelled; remaining files and references were not checked." = "Проверка отменена; остальные файлы и ссылки не проверены."
"Run validation again to obtain a complete report." = "Запустите проверку снова, чтобы получить полный отчёт."
"The cumulative validation read budget was exceeded." = "Превышен общий предел объёма данных, читаемых при проверке."
"Split optional content into smaller packs, then validate again." = "Разделите необязательное содержимое на меньшие пакеты и проверьте снова."
"With this mod on, the original game's {archive} is not read: the mod takes its place (an archive of its own of that name, one its mod.toml's replaces names, or one its installation is known to remove), as installing the mod in TA's folder did. What only the original's held is missing with the mod." = "Когда этот мод включён, архив {archive} оригинальной игры не читается: его место занимает мод (собственный архив с таким именем, архив, названный в replaces его mod.toml, или архив, который, как известно, удаляет его установка), как и при установке мода в папку TA. Всё, что было только в оригинальном архиве, с этим модом отсутствует."
"Nothing to do if this is meant. To have the original's read beneath the mod instead, give the mod's archive another name, or take the name out of replaces in mod.toml." = "Ничего делать не нужно, если так и задумано. Чтобы оригинальный архив читался под модом, дайте архиву мода другое имя или уберите это имя из replaces в mod.toml."

# apps/ta_launcher/src/getmods.rs
"Invalid manifest {path}: {error}" = "Неверный манифест {path}: {error}"
"mod manifest exceeds 1 MiB" = "манифест мода больше 1 МиБ"
"invalid mod id" = "неверный идентификатор мода"
"The mod installer stopped unexpectedly. Restart the launcher and try again." = "Установщик модов неожиданно завершил работу. Перезапустите лаунчер и повторите попытку."
"the source overlaps the install staging folder; move it outside the cache first" = "источник пересекается с временной папкой установки; сначала переместите его за пределы кэша"
"{path} holds much more than a mod: drop the mod's own folder" = "В {path} гораздо больше, чем мод: перетащите саму папку мода"
"{path} is in your mods folder already, so it is installed: turn it on in the library" = "{path} уже лежит в вашей папке модов, так что он установлен: включите его в библиотеке"
"{name} is no longer in the game's folder" = "{name} больше нет в папке игры"
"Close the game first: {name} is installed and the game may be using it. Install it again once the game has closed." = "Сначала закройте игру: мод {name} уже установлен, и игра может его использовать. Повторите установку, когда игра будет закрыта."
"No program to unpack archives was found: install 7-Zip from 7-zip.org." = "Не найдена программа для распаковки архивов: установите 7-Zip с сайта 7-zip.org."
"Only part of {file} could be unpacked: install 7-Zip (7-zip.org) and try again." = "Удалось распаковать лишь часть {file}: установите 7-Zip (7-zip.org) и попробуйте снова."
"No Total Annihilation content was found in the package." = "В пакете не найдено содержимого Total Annihilation."
"{tool} could not unpack {file}: {message}" = "{tool} не смог распаковать {file}: {message}"
"could not create a temporary install folder" = "не удалось создать временную папку установки"
"There is nothing to download for this mod." = "Для этого мода нечего скачивать."
"archive has an invalid file name" = "у архива неверное имя файла"
"archive is not a file" = "архив не является файлом"
"{file} does not match the verified release. Download it again from the mod's website." = "{file} не соответствует проверенному релизу. Скачайте файл заново с сайта мода."
"archive has no file name" = "у архива нет имени файла"
"Open the mod's website, then choose Have the file? to install your downloaded archive." = "Откройте сайт мода, затем выберите «Уже есть файл?», чтобы установить скачанный архив."
"invalid download address" = "неверный адрес загрузки"
"ModDB's download page has changed. Get the file from the mod's page, then install it from the file." = "Страница загрузки ModDB изменилась. Скачайте файл со страницы мода, а затем установите его из файла."
"The download could not be completed: {error}. Open the mod's website or download link in your browser, then choose Have the file? to install it." = "Не удалось завершить загрузку: {error}. Откройте сайт мода или ссылку на загрузку в браузере, затем выберите «Уже есть файл?» для установки."
"Mod {id} has a conflicting installation; remove it in the mod library before importing this archive" = "У мода {id} есть конфликтующая установка; удалите её в библиотеке модов, прежде чем импортировать этот архив"
"the archive changed while it was being copied; try importing it again" = "архив изменился во время копирования; попробуйте импортировать его снова"
"the server's response is too large or could not be read" = "ответ сервера слишком велик или не удалось его прочитать"


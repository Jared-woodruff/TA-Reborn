# apps/ta_game/src/app/memory_guard.rs
"Memory is running out: TA Reborn holds {gb} GB. The battle was saved and paused: start TA Reborn again and load the autosave." = "Память заканчивается: TA Reborn занимает {gb} ГБ. Битва сохранена и поставлена на паузу: перезапустите TA Reborn и загрузите автосохранение."
"Memory is running out: TA Reborn holds {gb} GB. Save what you can, then start TA Reborn again." = "Память заканчивается: TA Reborn занимает {gb} ГБ. Сохраните что можете, затем перезапустите TA Reborn."
"TA Reborn is using {gb} GB of memory, far more than it should. The battle was saved (the autosave)." = "TA Reborn использует {gb} ГБ памяти — намного больше, чем должна. Битва сохранена (в автосохранение)."
"TA Reborn is using {gb} GB of memory, far more than it should." = "TA Reborn использует {gb} ГБ памяти — намного больше, чем должна."


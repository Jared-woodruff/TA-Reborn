# apps/ta_game/src/chatter.rs
"FIELD COMMANDER" = "БОЕВОЙ КОМАНДИР"
"MACHINE INTELLIGENCE" = "МАШИННЫЙ РАЗУМ"
"MERCENARY" = "НАЁМНИК"
"Commander. May the better tactician win." = "Командир. Пусть победит лучший тактик."
"Arm forces in position. Good luck, Commander." = "Силы Arm на позициях. Удачи, Командир."
"Let's keep this clean, Commander." = "Давайте сражаться честно, Командир."
"Commander. Let's give the historians something to write about." = "Командир. Пусть историкам будет о чём написать."
"All units, the enemy is in theatre. Begin." = "Всем частям: противник на театре военных действий. К бою."
"Target acquired. Resistance is inefficient." = "Цель захвачена. Сопротивление неэффективно."
"Your consciousness will be patterned. Eventually." = "Ваше сознание будет оцифровано. Рано или поздно."
"Initiating conquest protocol." = "Запуск протокола завоевания."
"Your biological limitations have been factored in." = "Ваши биологические ограничения учтены."
"Patterning facilities stand ready for your arrival." = "Установки оцифровки готовы к вашему прибытию."
"Hope you brought a spare Commander!" = "Надеюсь, вы прихватили запасного Командира!"
"Let's see what you've got!" = "Ну-ка, покажите, на что вы способны!"
"Build fast. It won't matter, but build fast." = "Стройте быстрее. Это не поможет, но стройте быстрее."
"Mind if I take your base? Thanks!" = "Не против, если я заберу вашу базу? Спасибо!"
"Ooh, a new victim. I mean, opponent." = "Ух ты, новая жертва. В смысле, соперник."
"Greetings, Commander." = "Приветствую, Командир."
"Good luck to you too." = "И вам удачи."
"Likewise, Commander. Now, to business." = "Взаимно, Командир. А теперь к делу."
"Greeting acknowledged." = "Приветствие принято."
"Salutations are irrelevant." = "Приветствия не имеют значения."
"Hello. Goodbye soon." = "Здравствуйте. И скоро прощайте."
"Hey yourself!" = "И вам привет!"
"gl hf. Mostly hf for me." = "gl hf. Хотя hf будет в основном у меня."
"Hi! Bye! Mostly bye." = "Привет! Пока! В основном пока."
"gg, Commander." = "gg, Командир."
"Good game. Well fought." = "Хорошая игра. Достойный бой."
"gg. Data retained for analysis." = "gg. Данные сохранены для анализа."
"Game assessment: good." = "Оценка игры: хорошо."
"gg!" = "gg!"
"gg. Rematch?" = "gg. Реванш?"
"Big words from a small army." = "Громкие слова для такой маленькой армии."
"We'll see who's laughing when the smoke clears." = "Посмотрим, кто будет смеяться, когда рассеется дым."
"Save your breath for the debriefing." = "Поберегите слова для разбора полётов."
"Bluster won't hold a ridge, Commander." = "Бравадой высоту не удержать, Командир."
"Insolence logged." = "Дерзость зафиксирована."
"Your threat rating has been downgraded." = "Ваш уровень угрозы понижен."
"Noise detected. Ignoring." = "Обнаружен шум. Игнорирую."
"Emotional outburst detected. How quaint." = "Обнаружен эмоциональный всплеск. Как архаично."
"Oh, it's ON now." = "Ну всё, теперь ДЕРЖИТЕСЬ."
"Talk is cheap. Tanks aren't." = "Слова ничего не стоят. А вот танки стоят."
"Come over here and say that." = "Подойдите и скажите это мне в лицо."
"Says the one who's losing. Probably. I haven't checked." = "Кто бы говорил. Вы же проигрываете. Наверное. Я не проверял."
"The Arm does not surrender." = "Arm не сдаётся."
"Not while I have a Commander standing." = "Пока мой Командир на ногах — ни за что."
"Surrender is not in my programming." = "Капитуляция не предусмотрена моей программой."
"Negative." = "Отрицательно."
"Ha! Never!" = "Ха! Никогда!"
"You first." = "Только после вас."
"That's classified, Commander." = "Это секретная информация, Командир."
"Wouldn't you like to know." = "Так я вам и сказал."
"Query rejected." = "Запрос отклонён."
"Insufficient clearance." = "Недостаточный уровень допуска."
"Dunno. Probably!" = "Без понятия. Наверное!"
"Ask me after the battle." = "Спросите после боя."
"Apology accepted. The attack continues." = "Извинения приняты. Атака продолжается."
"Apology noted. Irrelevant." = "Извинение зафиксировано. Несущественно."
"No you're not!" = "Ничуть вам не жаль!"
"Stay focused, Commander." = "Не отвлекайтесь, Командир."
"Less talk, more metal." = "Меньше слов, больше металла."
"Noted." = "Принято к сведению."
"Mind the war, Commander." = "Война не ждёт, Командир."
"Irrelevant." = "Несущественно."
"Processing... still irrelevant." = "Обработка... всё ещё несущественно."
"Your words are being archived." = "Ваши слова заносятся в архив."
"Your input has been compressed. To nothing." = "Ваши входные данные сжаты. До нуля байт."
"Uh huh." = "Ага."
"Cool story." = "Увлекательно."
"Keep typing. I'll keep building." = "Печатайте дальше. А я буду строить."
"Typing won't save you, but I respect the effort." = "Клавиатура вас не спасёт, но за старание уважаю."
"Commander down! All units, hold the line!" = "Командир погиб! Всем частям — держать оборону!"
"You'll pay for that." = "Вы за это заплатите."
"Command unit lost. Rerouting." = "Командный юнит потерян. Перенаправление."
"Critical failure. Compensating." = "Критический сбой. Компенсация."
"My Commander! That was my favourite!" = "Мой Командир! Он был моим любимым!"
"Okay, THAT hurt." = "Так, а вот ЭТО было больно."
"Your Commander has fallen." = "Ваш Командир пал."
"Commander eliminated. Stand down." = "Командир уничтожен. Сложите оружие."
"The war is over for you, Commander." = "Для вас война окончена, Командир."
"Enemy command unit terminated." = "Вражеский командный юнит ликвидирован."
"Your Commander has been decommissioned." = "Ваш Командир выведен из эксплуатации."
"Your consciousness is ready for patterning." = "Ваше сознание готово к оцифровке."
"Boom! Did you need that?" = "Бабах! Он вам был нужен?"
"Scratch one Commander!" = "Минус один Командир!"
"And THAT'S how it's done!" = "Вот ТАК это делается!"
"gg. Well fought, Commander." = "gg. Отличный бой, Командир."
"The Arm will remember this." = "Arm этого не забудет."
"Well played. I salute you, Commander." = "Хорошо сыграно. Отдаю вам честь, Командир."
"This is not the end. The Core is eternal." = "Это не конец. Core вечен."
"Defeat recorded. Backup consciousness activating." = "Поражение зафиксировано. Активация резервного сознания."
"Shutting down. Your designation has been remembered." = "Завершение работы. Ваше обозначение занесено в память."
"gg... I'll be back. With more tanks." = "gg... Я вернусь. И танков будет больше."
"Fine. FINE. gg." = "Ладно. ЛАДНО. gg."
"Okay, okay, you win. This time!" = "Ладно, ладно, ваша взяла. На этот раз!"
"gg, Commander. You fought well." = "gg, Командир. Вы хорошо сражались."
"Victory. Better luck next time." = "Победа. Повезёт в следующий раз."
"Your forces fought bravely. It wasn't enough." = "Ваши войска сражались храбро. Этого не хватило."
"Your consciousness will be patterned. gg." = "Ваше сознание будет оцифровано. gg."
"Conquest complete." = "Завоевание завершено."
"Resistance ended. Your tactics are archived for study." = "Сопротивление прекращено. Ваша тактика заархивирована для изучения."
"Too easy! gg." = "Слишком легко! gg."
"gg! Rematch? I'll go easy. Maybe." = "gg! Реванш? Буду помягче. Может быть."
"gg! Same time tomorrow?" = "gg! Завтра в то же время?"
"Nuclear launch detected! Take cover!" = "Обнаружен ядерный пуск! В укрытие!"
"A nuke? So that's how it's going to be." = "Ядерная ракета? Значит, вот как."
"Nuclear launch detected. Calculating losses." = "Обнаружен ядерный пуск. Расчёт потерь."
"Crude. Effective." = "Грубо. Эффективно."
"Is that a NUKE?!" = "Это что, ЯДЕРКА?!"
"Oh no. Oh no no no." = "О нет. Нет-нет-нет."
"Missile away. Nothing personal, Commander." = "Ракета пошла. Ничего личного, Командир."
"Look up, Commander." = "Посмотрите вверх, Командир."
"Special delivery." = "Особая доставка."
"Heads up! Literally!" = "Голову выше! В прямом смысле!"
"Special delivery!" = "Вам посылка!"
"A costly engagement. We'll regroup." = "Дорогой бой. Мы перегруппируемся."
"You fight well. For now." = "Вы хорошо сражаетесь. Пока."
"We'll be back, and in greater numbers." = "Мы вернёмся. И нас будет больше."
"Acceptable losses." = "Приемлемые потери."
"Losses within projections. Mostly." = "Потери в пределах прогноза. В основном."
"Units lost. Replacements already in production." = "Юниты потеряны. Замена уже в производстве."
"That was my best army!" = "Это была моя лучшая армия!"
"Lucky shots. All of them." = "Случайные попадания. Все до единого."
"Okay, that one was on me." = "Ладно, тут я облажался."
"Your forces were outmatched." = "Ваши силы уступали нашим."
"Send more. We'll wait." = "Присылайте ещё. Мы подождём."
"Next time, bring more than that." = "В следующий раз приходите с армией побольше."
"Your forces were inadequate." = "Ваших сил было недостаточно."
"Enemy attrition: optimal." = "Истощение противника: оптимальное."
"Your offensive has been neutralised." = "Ваше наступление нейтрализовано."
"Is that all you've got?" = "И это всё, на что вы способны?"
"Who's next?" = "Кто следующий?"
"Thanks for the target practice!" = "Спасибо за бесплатный тир!"
"Quiet out there, Commander. Too quiet." = "Тихо, Командир. Слишком тихо."
"Still building? So are we." = "Всё ещё строитесь? Мы тоже."
"Planning something, Commander? I'd hope so." = "Что-то замышляете, Командир? Надеюсь, что да."
"Your silence has been noted." = "Ваше молчание зафиксировано."
"Scanning... still there, Commander?" = "Сканирование... Вы ещё здесь, Командир?"
"Inactivity detected. Are you malfunctioning?" = "Обнаружено бездействие. Вы неисправны?"
"Hello? Anyone home?" = "Алло? Есть кто дома?"
"I'm getting bored over here." = "Мне тут уже скучно."
"Wake me up when something explodes." = "Разбудите, когда что-нибудь взорвётся."
"That's hardly fair, Commander." = "Это не очень-то честно, Командир."
"Cheating? The Arm expected better." = "Жульничаете? Arm ожидает от вас большего."
"Anomaly detected. Cheat logged." = "Обнаружена аномалия. Чит зафиксирован."
"Rule violation recorded." = "Нарушение правил зарегистрировано."
"Cheater! I saw that!" = "Читер! Я всё видел!"
"Oh, come ON!" = "Ой, да ЛАДНО!"
"Contact. So this is where you've been hiding." = "Контакт. Так вот где вы прятались."
"Enemy forces sighted. Engaging." = "Замечены силы противника. Вступаем в бой."
"There you are, Commander." = "Вот вы где, Командир."
"Eyes on the enemy. Here we go." = "Противник в поле зрения. Начинаем."
"Hostile units located. Initiating elimination." = "Враждебные юниты обнаружены. Начинаю уничтожение."
"Contact established. Probability of your survival: declining." = "Контакт установлен. Вероятность вашего выживания: снижается."
"Target acquired." = "Цель захвачена."
"Biological signatures located. Commencing cleanup." = "Обнаружены биологические сигнатуры. Начинаю зачистку."
"Found you!" = "Нашёл!"
"Oh, hello there!" = "О, приветик!"
"Tag, you're it!" = "Салки! Вы водите!"
"There you are! I was getting lonely." = "Вот вы где! А я уж соскучился."
"One less building for you to worry about." = "Одним зданием меньше — меньше забот."
"Your base is thinning out, Commander." = "Ваша база редеет, Командир."
"Structure destroyed. Next." = "Сооружение уничтожено. Следующее."
"Your base planning could use some work, Commander." = "Над планировкой базы стоит поработать, Командир."
"Structure dismantled. Recycling recommended." = "Сооружение демонтировано. Рекомендуется переработка."
"Your infrastructure is deteriorating." = "Ваша инфраструктура деградирует."
"Demolition complete." = "Снос завершён."
"Structure reclassified: rubble." = "Сооружение переклассифицировано: щебень."
"Oops! Was that important?" = "Ой! Это было что-то важное?"
"Kaboom! Next!" = "Ба-бах! Следующее!"
"I'm redecorating your base." = "Делаю перепланировку вашей базы."
"Bet that one was important!" = "Спорим, это было что-то важное!"
"That was well defended. Impressive." = "А ведь его хорошо охраняли. Впечатляет."
"A setback. Nothing more." = "Неудача. Не более того."
"You'll pay for that one." = "За это вы заплатите."
"A clean strike. I'll remember it." = "Чистый удар. Я это запомню."
"Production capacity reduced. Rebuilding." = "Производственная мощность снижена. Восстановление."
"Loss registered. Replacement scheduled." = "Потеря зарегистрирована. Замена запланирована."
"Irritating." = "Раздражает."
"Infrastructure damage noted. Retaliation queued." = "Ущерб инфраструктуре зафиксирован. Ответный удар поставлен в очередь."
"Hey! I just built that!" = "Эй! Я это только что построил!"
"My factory! Right, no more mister nice guy." = "Мой завод! Ну всё, хватит с вами церемониться."
"Rude." = "Грубо."
"Oi! That had a fresh coat of paint!" = "Эй! Там краска ещё не высохла!"
"Commander, meet the {unit}." = "Командир, знакомьтесь: {unit}."
"The {unit} is ready. I'd start running." = "{unit} в строю. На вашем месте я бы уже бежал."
"{unit} online. Your end has been calculated." = "{unit} в сети. Ваш конец просчитан."
"Deploying {unit}. Resistance is futile." = "Развёртывание: {unit}. Сопротивление бесполезно."
"Look what I made! A {unit}!" = "Смотрите, что я сделал! {unit}!"
"Got myself a {unit}. Want to see it up close?" = "У меня теперь есть {unit}. Хотите посмотреть поближе?"
"A {unit}? Bold." = "{unit}? Смело."
"Impressive hardware, Commander. Let's see you use it." = "Впечатляющая техника, Командир. Посмотрим, как вы ею распорядитесь."
"Large enemy unit detected: {unit}. Countermeasures prepared." = "Обнаружен крупный вражеский юнит: {unit}. Контрмеры подготовлены."
"Your {unit} has been added to the target list." = "Ваш {unit} внесён в список целей."
"Whoa. Is that a {unit}?" = "Ого. Это что, {unit}?"
"Okay, that's a big one." = "Ладно, вот это громадина."
"Running on empty, Commander?" = "На голодном пайке, Командир?"
"Your power grid is failing. Mine isn't." = "Ваша энергосеть отказывает. Моя — нет."
"Overspending, Commander? A bad habit." = "Перерасход, Командир? Дурная привычка."
"Your reserves: depleted. Mine: optimal." = "Ваши резервы: исчерпаны. Мои: оптимальны."
"Economic failure detected in your sector." = "В вашем секторе обнаружен экономический коллапс."
"Your economy is collapsing. As projected." = "Ваша экономика рушится. Согласно прогнозу."
"Out of juice already?" = "Уже выдохлись?"
"Need to borrow some metal? Too bad." = "Одолжить металла? Обойдётесь."
"Lights going out over there? Ha!" = "У вас там свет гаснет? Ха!"
"{minutes} minutes, Commander. You're tougher than you look." = "{minutes}-я минута, Командир. А вы крепче, чем кажетесь."
"{minutes} minutes in, and still standing." = "Уже {minutes}-я минута, а вы всё ещё держитесь."
"Time elapsed: {minutes} minutes. Your resistance is statistically unlikely." = "Прошло времени: {minutes} мин. Ваше сопротивление статистически маловероятно."
"{minutes} minutes. Recalculating." = "{minutes} мин. Пересчёт."
"{minutes} minutes and you're still here? Respect." = "{minutes}-я минута, а вы всё ещё тут? Уважаю."
"{minutes} minutes already? Time flies when you're winning." = "Уже {minutes}-я минута? Когда побеждаешь, время летит незаметно."
"My forces outnumber yours two to one, Commander." = "Моих сил вдвое больше, чем ваших, Командир."
"Look at your army. Now look at mine." = "Посмотрите на свою армию. А теперь — на мою."
"Numbers are on my side, Commander." = "Численный перевес на моей стороне, Командир."
"Force ratio favourable. Surrender is advised." = "Соотношение сил благоприятное. Рекомендуется капитуляция."
"Numerical superiority achieved." = "Численное превосходство достигнуто."
"Production advantage: decisive." = "Производственное преимущество: решающее."
"I've got way more stuff than you." = "У меня куда больше всякого добра, чем у вас."
"Count my tanks. Go on, I'll wait." = "Посчитайте мои танки. Давайте, я подожду."
"So many tanks. So few of yours." = "Столько танков. И так мало ваших."
"You've been busy. So will we." = "Вы времени не теряли. Мы тоже не будем."
"Numbers aren't everything, Commander." = "Численность — ещё не всё, Командир."
"Quality over quantity, Commander." = "Не числом, а умением, Командир."
"Force ratio unfavourable. Adjusting." = "Соотношение сил неблагоприятное. Корректировка."
"Your production rate is... noted." = "Ваши темпы производства... учтены."
"Your numbers will thin." = "Ваши ряды поредеют."
"Where did you get all those?!" = "Откуда у вас столько?!"
"Okay, okay, you've got more toys. For now." = "Ладно, ладно, игрушек у вас больше. Пока."
"Okay, that's a LOT of guys." = "Ладно, это ОЧЕНЬ много народу."
"Your Commander looks tired." = "Ваш Командир выглядит усталым."
"Pull your Commander back while you still can." = "Отведите Командира, пока ещё можете."
"Your Commander won't last much longer." = "Ваш Командир долго не продержится."
"Enemy command unit integrity: failing." = "Целостность вражеского командного юнита: падает."
"Your Commander's armour is compromised." = "Броня вашего Командира пробита."
"Your command unit is failing. Prepare for patterning." = "Ваш командный юнит выходит из строя. Приготовьтесь к оцифровке."
"Your Commander's smoking! Is that bad?" = "Ваш Командир дымится! Это плохо?"
"Ooh, that's gotta hurt." = "Ух, это наверняка больно."
"Your Commander's looking a bit crispy!" = "Ваш Командир уже слегка подрумянился!"
"{name}, field command. Remember it." = "{name}, полевое командование. Запомните."
"{name}. And you're the Commander I'm about to retire." = "{name}. А вы — Командир, которого я скоро отправлю в отставку."
"Designation: {name}. Yours is irrelevant." = "Обозначение: {name}. Ваше несущественно."
"I am {name}. I am Core." = "Я — {name}. Я — Core."
"{name}! The name you'll be cursing later." = "{name}! Это имя вы ещё будете проклинать."
"Name's {name}. Pleased to beat you." = "Я {name}. Приятно познакомиться. И разгромить."
"Closer than you think, Commander." = "Ближе, чем вы думаете, Командир."
"Find out for yourself." = "Выясните сами."
"Location data: classified." = "Данные о местоположении: засекречены."
"Everywhere that matters." = "Везде, где это важно."
"Behind you! ...no, the other way." = "Сзади! ...нет, с другой стороны."
"Somewhere with lots of guns." = "Там, где много пушек."
"Never better, Commander. And you?" = "Лучше не бывает, Командир. А у вас?"
"Going to plan." = "Всё идёт по плану."
"Operating at peak efficiency." = "Работаю с максимальной эффективностью."
"All systems nominal. Unlike yours." = "Все системы в норме. В отличие от ваших."
"Great! Thanks for asking!" = "Отлично! Спасибо, что спросили!"
"Living the dream." = "Как в сказке."
"I've had better days." = "Бывали дни и получше."
"Holding. Barely. Don't get comfortable." = "Держимся. Еле-еле. Не расслабляйтесь."
"Systems damaged. Repairs under way." = "Системы повреждены. Идёт ремонт."
"Status: suboptimal." = "Состояние: неоптимальное."
"Don't ask." = "Лучше не спрашивайте."
"Could be worse. Probably." = "Могло быть хуже. Наверное."
"Something you won't like." = "То, что вам не понравится."
"That would spoil the surprise." = "Это испортит сюрприз."
"Production queue: classified." = "Очередь производства: засекречена."
"Weapons. Many weapons." = "Оружие. Много оружия."
"A big surprise!" = "Большой сюрприз!"
"Something with way too many guns." = "Что-то, у чего слишком много пушек."
"{units} units and counting, Commander." = "Юнитов: {units}, и их всё больше, Командир."
"Enough. {units}, if you must know." = "Достаточно. {units}, если вам так нужно знать."
"Current unit count: {units}. Increasing." = "Текущее число юнитов: {units}. Растёт."
"{units}. Yours is lower." = "{units}. У вас меньше."
"{units}! Want to meet them all?" = "{units}! Хотите познакомиться со всеми?"
"Like {units}? I lost count." = "Где-то {units}? Я сбился со счёта."
"No truce, Commander. Not today." = "Никакого перемирия, Командир. Не сегодня."
"There will be no deals." = "Сделок не будет."
"Truce: incompatible with directives." = "Перемирие: несовместимо с директивами."
"Negotiation protocols disabled." = "Протоколы переговоров отключены."
"Truce? Ha! Nice try." = "Перемирие? Ха! Хорошая попытка."
"Peace is boring." = "Мир — это скучно."
"Thank you, Commander. You're not bad yourself." = "Благодарю, Командир. Вы и сами неплохи."
"Appreciated. It won't save you." = "Ценю. Но вас это не спасёт."
"Flattery: ineffective." = "Лесть: неэффективна."
"Compliment received. Threat level unchanged." = "Комплимент получен. Уровень угрозы не изменился."
"Aw, thanks! Still gonna crush you." = "Ой, спасибо! Но я вас всё равно раздавлю."
"I know, right?" = "Да, я такой!"
"Help? From me? Build more extractors, Commander." = "Помощь? От меня? Стройте больше экстракторов, Командир."
"My advice: more defences." = "Мой совет: больше обороны."
"Assistance denied." = "В помощи отказано."
"Recommendation: surrender." = "Рекомендация: капитуляция."
"Help? Sure: stop playing so badly!" = "Помочь? Конечно: перестаньте так плохо играть!"
"Tip: build more stuff. You're welcome." = "Совет: стройте побольше всего. Не благодарите."
"Your {unit} is out of the fight." = "{unit} выбывает из боя."
"Scratch one {unit}." = "Минус {unit}."
"That {unit} won't trouble us again." = "{unit} нас больше не побеспокоит."
"{unit} terminated." = "Цель {unit} ликвидирована."
"Your {unit} has been recycled." = "Ваш юнит {unit} отправлен на переработку."
"{unit} removed from the battlefield." = "Удалено с поля боя: {unit}."
"Bye bye, {unit}!" = "Пока-пока, {unit}!"
"Was that {unit} insured?" = "А {unit} вы хоть застраховали?"
"Your {unit} just went kaboom." = "Ба-бах — и нет у вас {unit}."
"You'll pay for that {unit}." = "За {unit} вы заплатите."
"A good {unit}, lost. Noted." = "Потеряна хорошая машина: {unit}. Принято к сведению."
"{unit} lost. Replacement scheduled." = "Потеря: {unit}. Замена запланирована."
"Destruction of {unit} logged." = "Уничтожение {unit} зафиксировано."
"Hey! That {unit} was brand new!" = "Эй! {unit} же только что с конвейера!"
"My {unit}! I just polished that!" = "{unit}! Я же только что навёл блеск!"
"My {unit}... You'll answer for that, Commander." = "{unit}... Вы за это ответите, Командир."
"Losing the {unit} stings. It won't happen twice." = "Потеря {unit} ощутима. Второго раза не будет."
"{unit} destroyed. Unacceptable." = "Уничтожено: {unit}. Недопустимо."
"Loss of {unit} exceeds tolerance. Escalating." = "Потеря {unit} превышает допустимый порог. Эскалация."
"My {unit}! Do you know how long that took?!" = "{unit}! Да вы знаете, сколько я это строил?!"
"NOOO, my {unit}!" = "НЕЕЕТ, только не {unit}!"
"So much for your {unit}, Commander." = "Вот вам и {unit}, Командир."
"Your {unit} has fallen. A fine machine, though." = "У вас больше нет {unit}. А машина была достойная."
"Your {unit} has been dismantled." = "Ваш юнит {unit} демонтирован."
"Large hostile unit eliminated: {unit}." = "Крупный вражеский юнит ликвидирован: {unit}."
"Your {unit} went down like a sack of bolts!" = "{unit} валится, как мешок с болтами!"
"Big {unit}, bigger crater!" = "Чем больше {unit}, тем глубже воронка!"
"Return my {unit} at once, Commander." = "Немедленно верните {unit}, Командир."
"Stealing is beneath you, Commander." = "Воровство ниже вашего достоинства, Командир."
"Unauthorised transfer of {unit} detected." = "Обнаружена несанкционированная передача {unit}."
"Your theft has been logged." = "Ваша кража зафиксирована."
"Hey! Give back my {unit}!" = "Эй! Отдайте {unit}, это моё!"
"Thief! That {unit} was mine!" = "Ворюга! {unit} — моя собственность!"
"You haven't won yet, Commander." = "Вы ещё не победили, Командир."
"The Arm fights to the last." = "Arm сражается до последнего."
"Production offline. Combat protocols remain." = "Производство отключено. Боевые протоколы в силе."
"Probability of defeat rising. Ignoring." = "Вероятность поражения растёт. Игнорирую."
"I've still got a few tricks left!" = "А у меня в рукаве ещё пара козырей!"
"Not done yet! Not even close! ...Mostly close." = "Это ещё не конец! Даже близко не конец! ...Ну, почти конец."
"We meet again, Commander. Last time was yours. Not this time." = "Снова встретились, Командир. В прошлый раз победили вы. Но не в этот."
"Commander. I've studied our last battle. Have you?" = "Командир. Я изучил нашу прошлую битву. А вы?"
"Previous defeat analysed. Countermeasures installed." = "Предыдущее поражение проанализировано. Контрмеры установлены."
"Again, Commander. This time the outcome has been calculated." = "Снова вы, Командир. На этот раз исход просчитан."
"You again! I've been practising!" = "Опять вы! А я тренировался!"
"Rematch time! I'm not going easy this time." = "Время реванша! В этот раз поддаваться не буду."
"Back for another lesson, Commander?" = "Вернулись за новым уроком, Командир?"
"Commander. I trust you've learned something since last time." = "Командир. Надеюсь, с прошлого раза вы кое-чему научились."
"You have returned. Your previous patterning was incomplete." = "Вы вернулись. Ваша предыдущая оцифровка была неполной."
"Familiar opponent detected. Outcome: repeating." = "Обнаружен знакомый противник. Исход: повторяется."
"You again? Didn't I beat you last time?" = "Опять вы? Я же вас в прошлый раз уделал?"
"Oh, it's you! Ready for round two?" = "О, это вы! Готовы ко второму раунду?"


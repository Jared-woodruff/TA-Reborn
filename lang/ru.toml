# apps/ta_launcher/src/catalogue.rs
"Spotlight first" = "Сначала рекомендованные"
"Newest release" = "Сначала новые"
"Oldest release" = "Сначала старые"
"Smallest download" = "Сначала меньшие файлы"
"Largest download" = "Сначала большие файлы"
"Effect capacity and loading cost" = "Ёмкость эффектов и стоимость загрузки"
"The sprite atlas reached 16,384 × 16,384 on the review GPU and dropped further frames. One startup took about 59 seconds; this was an observation, not a controlled benchmark." = "На проверенном GPU атлас спрайтов достиг 16 384 × 16 384, и дальнейшие кадры пропускались. Один запуск занял около 59 секунд; это наблюдение, а не контролируемый бенчмарк."
"Check effect frame counts and dimensions. Reborn needs bounded animation streaming or atlas paging for this full set; test actual gameplay on the target GPU." = "Проверьте число и размеры кадров эффектов. Для полного набора Reborn нужна ограниченная потоковая загрузка анимации или постраничная загрузка атласа; проверьте реальную игру на целевом GPU."
"Large effect archives" = "Крупные архивы эффектов"
"These archives exceed the 256 MiB aggregate GAF decode budget. Reborn rejects the oversized decode instead of exhausting memory." = "Эти архивы превышают общий лимит декодирования GAF в 256 MiB. Reborn отклоняет чрезмерно большое декодирование, не допуская исчерпания памяти."
"Reduce or split oversized effects. Reborn needs per-entry decoding or streaming before raising the resource allowance." = "Уменьшите или разделите слишком крупные эффекты. Перед повышением лимита ресурсов Reborn требуется декодирование отдельных записей или потоковая загрузка."
"Missing weapons and wreck assets" = "Отсутствующие оружие и ресурсы обломков"
"The review found 27 missing data references, including explosion weapons and six feature graphics or models. A missing reference does not always mean the affected behavior is used in play." = "Проверка выявила 27 отсутствующих ссылок на данные, включая оружие взрывов и шесть изображений или моделей объектов. Отсутствующая ссылка не всегда означает, что соответствующее поведение используется в игре."
"Use the local automated report to locate each source reference. Supply the missing assets, correct the reference, or explain why the unused definition is intentional." = "Найдите источник каждой ссылки в локальном автоматическом отчёте. Добавьте отсутствующие ресурсы, исправьте ссылку или объясните, почему неиспользуемое определение оставлено намеренно."
"Inherited base-game placeholders" = "Заглушки, унаследованные от базовой игры"
"These rejected placeholder files come from the base game in the reviewed installation, not Escalation. They do not establish a mod defect." = "Эти отклонённые файлы-заглушки относятся к базовой игре в проверенной установке, а не к Escalation. Они не свидетельствуют о дефекте мода."
"Use the local report's layer field to verify origin. Only replace these assets if your mod intentionally overrides them." = "Проверьте источник в поле слоя локального отчёта. Заменяйте эти ресурсы только в том случае, если ваш мод намеренно их переопределяет."
"Computer players can stall" = "Компьютерные игроки могут застревать"
"AI Boost is included and computer players work on Asteroid Field, but can stall on some other space maps." = "AI Boost уже включён, и компьютерные игроки работают на Asteroid Field, но могут застревать на некоторых других космических картах."
"Test each space map with computer players before publishing it. Asteroid Field is the reviewed starting point." = "Перед публикацией проверьте каждую космическую карту с компьютерными игроками. Asteroid Field — проверенная отправная точка."
"Damaged optional map archives" = "Повреждённые дополнительные архивы карт"
"The optional map packs contain three damaged map archives. These are separate downloads and may not be present in your installation." = "Дополнительные наборы карт содержат три повреждённых архива карт. Они загружаются отдельно и могут отсутствовать в вашей установке."
"Import working maps individually. Rebuild or replace damaged archives before distributing a map pack." = "Импортируйте рабочие карты по отдельности. Перед распространением набора пересоздайте или замените повреждённые архивы."
"Unfinished preview armies" = "Незавершённые армии ранней версии"
"Its new armies use ARM's name, and some units are unfinished in this early preview." = "Новые армии используют имя ARM, а часть юнитов в этой ранней версии ещё не завершена."
"Give each army its intended side identity and complete its unit data and assets. Check every faction in a skirmish." = "Задайте каждой армии правильную принадлежность к стороне и завершите данные и ресурсы юнитов. Проверьте каждую фракцию в схватке."
"Expanded ARM and CORE armies with new units and weapons." = "Расширенные армии ARM и CORE с новыми юнитами и оружием."
"549 UNITS" = "549 ЮНИТОВ"
"177 MAPS" = "177 КАРТ"
"Gold 10.2.0 installs and plays: computer players build and fight, every unit is painted and every explosion drawn. A few wrecks have no model in the mod's own files." = "Gold 10.2.0 устанавливается и играется: компьютерные игроки строят и сражаются, все юниты окрашены, все взрывы отображаются. У нескольких обломков нет модели в файлах самого мода."
"Total Annihilation as Cavedog might have carried it on: every unit earns its place, hundreds more join, and a third tech level tops it off." = "Total Annihilation в том виде, в каком её могла бы развивать Cavedog: каждый юнит на своём месте, к ним добавляются сотни новых, а венчает всё третий технологический уровень."
"500 UNITS" = "500 ЮНИТОВ"
"105 MAPS" = "105 КАРТ"
"TECH 3" = "ТЕХ 3"
"Faster games that keep the strategy: new units, each carefully balanced, and hard-hitting armies from the start." = "Более быстрые игры без потери стратегии: новые, тщательно сбалансированные юниты и мощные армии с самого начала."
"FASTER GAMES" = "БЫСТРЫЕ ИГРЫ"
"297 UNITS" = "297 ЮНИТОВ"
"Still in alpha, and a big download." = "Всё ещё в альфа-версии, а скачивать придётся много."
"Big and brutal: 512 units, fierce fighting, and new sounds and effects throughout." = "Масштабно и жёстко: 512 юнитов, яростные бои и новые звуки и эффекты повсюду."
"512 UNITS" = "512 ЮНИТОВ"
"91 MAPS" = "91 КАРТА"
"The optional map weapons in its download are left out." = "Необязательное оружие для карт из его архива не устанавливается."
"A third army, the Talon, from ten years of the community's ideas: teleporters, air transports that carry whole squads, and more." = "Третья армия, Talon, — плод десяти лет идей сообщества: телепорты, воздушные транспорты, перевозящие целые отряды, и многое другое."
"NEW RACE" = "НОВАЯ РАСА"
"Choose TAL as your side in a skirmish." = "Выберите TAL своей стороной в схватке."
"Cavedog's style, kept simple: every unit has a clear job and looks as if it always belonged." = "Стиль Cavedog без излишеств: у каждого юнита ясная роль, и выглядит он так, будто всегда был в игре."
"CLASSIC STYLE" = "КЛАССИЧЕСКИЙ СТИЛЬ"
"NEW COMMANDERS" = "НОВЫЕ КОМАНДИРЫ"
"Classic BattleTech at Total Annihilation's scale: the Inner Sphere against the Clans, with walking mechs." = "Классический BattleTech в масштабе Total Annihilation: Внутренняя Сфера против Кланов, с шагающими мехами."
"BATTLETECH" = "BATTLETECH"
"NEW SIDES" = "НОВЫЕ СТОРОНЫ"
"Computer players are weaker as the Inner Sphere." = "За Внутреннюю Сферу компьютерные игроки играют слабее."
"The original's feel with well-balanced units and structures, tuned by veterans of the game." = "Дух оригинала с хорошо сбалансированными юнитами и сооружениями, настроенными ветеранами игры."
"CLASSIC FEEL" = "ДУХ ОРИГИНАЛА"
"Computer players struggle as ARM." = "За ARM компьютерные игроки играют слабо."
"An add-on race in the making: new units and new weapons for a third and a fourth army." = "Дополнительная раса в разработке: новые юниты и оружие для третьей и четвёртой армий."
"NEW RACES" = "НОВЫЕ РАСЫ"
"PREVIEW" = "РАННЯЯ ВЕРСИЯ"
"An early preview: its new armies go by ARM's name, and some of their units are unfinished." = "Ранняя версия: новые армии мода называются ARM, а часть их юнитов не доделана."
"Take ARM and CORE into space with command cruisers and fleets of warships." = "Выведите ARM и CORE в космос с командными крейсерами и флотами боевых кораблей."
"SPACE WARFARE" = "ВОЙНА В КОСМОСЕ"
"172 UNITS" = "172 ЮНИТА"
"AI Boost is already included. Computer players work on Asteroid Field, but can stall on some space maps. The optional map packs contain three damaged map archives; import working maps individually." = "AI Boost уже включён. Компьютерные игроки работают на Asteroid Field, но могут бездействовать на некоторых космических картах. Дополнительные наборы карт содержат три повреждённых архива карт; импортируйте рабочие карты по отдельности."
"Combat Zone TA: three new sides in a semi-realistic war." = "Combat Zone TA: три новые стороны в полуреалистичной войне."
"Nothing to download: it was made for the Spring engine." = "Скачивать нечего: мод создан для движка Spring."

"Its mods are as they were, but other game data is not: another copy of Total Annihilation, or of TA Reborn's own maps." = "Моды те же, но другие данные игры отличаются: другая копия Total Annihilation или собственных карт TA Reborn."
"A saved game is played over from its start to where it was saved. With other mods its orders can build other units, or none: it may not come out as the battle you saved." = "Сохранение заново проигрывается с начала до момента сохранения. С другими модами его приказы могут строить другие юниты или ничего: может получиться не та битва, которую вы сохранили."
"A replay is its battle played over from the orders given in it. With other mods they can lead elsewhere: it may not show the battle it recorded." = "Повтор — это его битва, заново проигранная по отданным в ней приказам. С другими модами они могут вести к иному: он может показать не ту битву, которую записал."
"TA Reborn starts again with no mods on (map packs stay on), and opens this battle" = "TA Reborn перезапустится без модов (наборы карт останутся включены) и откроет эту битву"
"TA Reborn starts again with its mods on, in its order, and the others off (map packs stay on), and opens this battle" = "TA Reborn перезапустится с её модами в её порядке, а остальные выключит (наборы карт останутся включены), и откроет эту битву"

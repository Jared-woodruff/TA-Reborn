# apps/ta_game/src/coach.rs
"Your Commander is badly hurt! Pull it back out of the fight: losing it usually loses the battle." = "Ваш Командир сильно повреждён! Выведите его из боя: его потеря обычно означает поражение."
"Energy is running out, and everything builds more slowly. Build Solar Collectors or Wind Generators, and build less at once until it recovers." = "Энергия на исходе, и всё строится медленнее. Постройте солнечные коллекторы или ветрогенераторы и стройте меньше за раз, пока запас не восстановится."
"Metal is running out, and everything builds more slowly. Put Metal Extractors on more deposits ({area_mex} takes a whole area), or reclaim wrecks and rocks ({reclaim})." = "Металл на исходе, и всё строится медленнее. Поставьте экстракторы металла на новые залежи ({area_mex} — сразу на всю область) или переработайте обломки и камни ({reclaim})."
"No factory yet: factories make your army. Your Commander can build a Kbot Lab or a Vehicle Plant." = "Завода ещё нет, а армию создают заводы. Ваш Командир может построить Kbot Lab или Vehicle Plant."
"A factory has nothing to build. {idle_factory} selects it: queue some units, and turn on Repeat to keep it busy." = "Заводу нечего строить. Клавиша {idle_factory} выбирает его: поставьте в очередь несколько юнитов и включите «Повтор», чтобы он не простаивал."
"Builders stand idle. {idle_builder} selects the next one: give it something to build, or send it to help a factory ({guard})." = "Строители стоят без дела. Клавиша {idle_builder} выбирает следующего: дайте ему что-нибудь построить или отправьте помогать заводу ({guard})."
"Your metal store is full, so new metal goes to waste. Spend it: another factory, more builders, more units." = "Ваши хранилища металла полны, так что новый металл пропадает зря. Тратьте его: ещё один завод, больше строителей, больше юнитов."
"COACH" = "СОВЕТНИК"
"Put it away (the coach can be turned off in Options, Gameplay)" = "Скрыть (советника можно отключить в настройках, раздел «Игра»)"
"Don't show this advice again" = "Больше не показывать этот совет"


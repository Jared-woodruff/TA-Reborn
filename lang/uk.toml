# apps/ta_game/src/chatter.rs
"FIELD COMMANDER" = "ПОЛЬОВИЙ КОМАНДИР"
"MACHINE INTELLIGENCE" = "МАШИННИЙ РОЗУМ"
"MERCENARY" = "НАЙМАНЕЦЬ"
"Commander. May the better tactician win." = "Командире. Хай переможе кращий тактик."
"Arm forces in position. Good luck, Commander." = "Сили Arm на позиціях. Успіху, Командире."
"Let's keep this clean, Commander." = "Воюймо чесно, Командире."
"Commander. Let's give the historians something to write about." = "Командире. Нехай історикам буде про що писати."
"All units, the enemy is in theatre. Begin." = "Усім підрозділам — противник у зоні бойових дій. Починаємо."
"Target acquired. Resistance is inefficient." = "Ціль захоплено. Опір неефективний."
"Your consciousness will be patterned. Eventually." = "Вашу свідомість буде оцифровано. Рано чи пізно."
"Initiating conquest protocol." = "Запускаю протокол завоювання."
"Your biological limitations have been factored in." = "Ваші біологічні обмеження враховано."
"Patterning facilities stand ready for your arrival." = "Комплекси оцифрування готові до вашого прибуття."
"Hope you brought a spare Commander!" = "Сподіваюся, ви прихопили запасного Командира!"
"Let's see what you've got!" = "Ну ж бо, покажіть, на що здатні!"
"Build fast. It won't matter, but build fast." = "Будуйте швидко. Це не допоможе, але будуйте швидко."
"Mind if I take your base? Thanks!" = "Можна я заберу вашу базу? Дякую!"
"Ooh, a new victim. I mean, opponent." = "О, нова жертва. Ой, тобто суперник."
"Greetings, Commander." = "Вітаю, Командире."
"Good luck to you too." = "І вам успіху."
"Likewise, Commander. Now, to business." = "Взаємно, Командире. А тепер — до справи."
"Greeting acknowledged." = "Привітання прийнято."
"Salutations are irrelevant." = "Привітання не мають значення."
"Hello. Goodbye soon." = "Привіт. І скоро прощавайте."
"Hey yourself!" = "І вам привіт!"
"gl hf. Mostly hf for me." = "gl hf. Хоча hf буде здебільшого в мене."
"Hi! Bye! Mostly bye." = "Привіт! Бувайте! Здебільшого бувайте."
"gg, Commander." = "gg, Командире."
"Good game. Well fought." = "Гарна гра. Ви добре билися."
"gg. Data retained for analysis." = "gg. Дані збережено для аналізу."
"Game assessment: good." = "Оцінка гри: добра."
"gg!" = "gg!"
"gg. Rematch?" = "gg. Реванш?"
"Big words from a small army." = "Гучні слова як для такої малої армії."
"We'll see who's laughing when the smoke clears." = "Подивимося, хто сміятиметься, коли розвіється дим."
"Save your breath for the debriefing." = "Бережіть слова для розбору польотів."
"Bluster won't hold a ridge, Commander." = "Бравадою висоти не втримати, Командире."
"Insolence logged." = "Зухвалість зафіксовано."
"Your threat rating has been downgraded." = "Ваш рівень загрози знижено."
"Noise detected. Ignoring." = "Виявлено шум. Ігнорую."
"Emotional outburst detected. How quaint." = "Виявлено емоційний сплеск. Як зворушливо."
"Oh, it's ON now." = "О, ну тепер ПОЧАЛОСЯ."
"Talk is cheap. Tanks aren't." = "Слова нічого не коштують. А танки — коштують."
"Come over here and say that." = "Підійдіть і скажіть це мені в обличчя."
"Says the one who's losing. Probably. I haven't checked." = "І це каже той, хто програє. Мабуть. Зараз гляну."
"The Arm does not surrender." = "Arm не здається."
"Not while I have a Commander standing." = "Поки мій Командир на ногах — ні."
"Surrender is not in my programming." = "Капітуляції немає в моїй програмі."
"Negative." = "Відмовлено."
"Ha! Never!" = "Ха! Ніколи!"
"You first." = "Тільки після вас."
"That's classified, Commander." = "Це секретно, Командире."
"Wouldn't you like to know." = "Так я вам і скажу."
"Query rejected." = "Запит відхилено."
"Insufficient clearance." = "Недостатній рівень допуску."
"Dunno. Probably!" = "Хтозна. Мабуть!"
"Ask me after the battle." = "Спитайте після бою."
"Apology accepted. The attack continues." = "Вибачення прийнято. Атака триває."
"Apology noted. Irrelevant." = "Вибачення зафіксовано. Не має значення."
"No you're not!" = "Ой, та вам зовсім не шкода!"
"Stay focused, Commander." = "Зосередьтеся, Командире."
"Less talk, more metal." = "Менше слів, більше металу."
"Noted." = "Взято до уваги."
"Mind the war, Commander." = "Війна не чекає, Командире."
"Irrelevant." = "Неважливо."
"Processing... still irrelevant." = "Обробка... досі неважливо."
"Your words are being archived." = "Ваші слова архівуються."
"Your input has been compressed. To nothing." = "Ваші вхідні дані стиснуто. До нуля."
"Uh huh." = "Ага."
"Cool story." = "Яка цікава історія."
"Keep typing. I'll keep building." = "Пишіть далі. А я будуватиму далі."
"Typing won't save you, but I respect the effort." = "Писанина вас не врятує, але старання я поважаю."
"Commander down! All units, hold the line!" = "Командира втрачено! Усім підрозділам — тримати лінію!"
"You'll pay for that." = "Ви за це заплатите."
"Command unit lost. Rerouting." = "Командний юніт втрачено. Перенаправлення."
"Critical failure. Compensating." = "Критичний збій. Компенсація."
"My Commander! That was my favourite!" = "Мій Командир! Це був мій улюблений!"
"Okay, THAT hurt." = "Гаразд, ОЦЕ було боляче."
"Your Commander has fallen." = "Ваш Командир загинув."
"Commander eliminated. Stand down." = "Командира ліквідовано. Відбій."
"The war is over for you, Commander." = "Для вас війна закінчилася, Командире."
"Enemy command unit terminated." = "Ворожий командний юніт знищено."
"Your Commander has been decommissioned." = "Вашого Командира списано."
"Your consciousness is ready for patterning." = "Ваша свідомість готова до оцифрування."
"Boom! Did you need that?" = "Бабах! Він вам був потрібен?"
"Scratch one Commander!" = "Мінус один Командир!"
"And THAT'S how it's done!" = "Ось ТАК це робиться!"
"gg. Well fought, Commander." = "gg. Добрий бій, Командире."
"The Arm will remember this." = "Arm це запам'ятає."
"Well played. I salute you, Commander." = "Добре зіграно. Віддаю вам честь, Командире."
"This is not the end. The Core is eternal." = "Це не кінець. Core вічний."
"Defeat recorded. Backup consciousness activating." = "Поразку зафіксовано. Активація резервної свідомості."
"Shutting down. Your designation has been remembered." = "Завершення роботи. Ваше позначення запам'ятовано."
"gg... I'll be back. With more tanks." = "gg... Я ще повернуся. І танків буде більше."
"Fine. FINE. gg." = "Гаразд. ГАРАЗД. gg."
"Okay, okay, you win. This time!" = "Гаразд, гаразд, ваша взяла. Цього разу!"
"gg, Commander. You fought well." = "gg, Командире. Ви добре билися."
"Victory. Better luck next time." = "Перемога. Наступного разу пощастить більше."
"Your forces fought bravely. It wasn't enough." = "Ваші сили билися хоробро. Але цього було замало."
"Your consciousness will be patterned. gg." = "Вашу свідомість буде оцифровано. gg."
"Conquest complete." = "Завоювання завершено."
"Resistance ended. Your tactics are archived for study." = "Опір припинено. Вашу тактику заархівовано для вивчення."
"Too easy! gg." = "Надто легко! gg."
"gg! Rematch? I'll go easy. Maybe." = "gg! Реванш? Я вам піддамся. Можливо."
"gg! Same time tomorrow?" = "gg! Завтра в той самий час?"
"Nuclear launch detected! Take cover!" = "Виявлено ядерний пуск! В укриття!"
"A nuke? So that's how it's going to be." = "Ядерна ракета? Ах, от як ви граєте."
"Nuclear launch detected. Calculating losses." = "Виявлено ядерний пуск. Обчислення втрат."
"Crude. Effective." = "Грубо. Ефективно."
"Is that a NUKE?!" = "Це що, ЯДЕРКА?!"
"Oh no. Oh no no no." = "О ні. Ні-ні-ні-ні."
"Missile away. Nothing personal, Commander." = "Ракету запущено. Нічого особистого, Командире."
"Look up, Commander." = "Погляньте вгору, Командире."
"Special delivery." = "Спецдоставка."
"Heads up! Literally!" = "Бережіть голову! Буквально!"
"Special delivery!" = "Спецдоставка!"
"A costly engagement. We'll regroup." = "Дорогий бій. Ми перегрупуємося."
"You fight well. For now." = "Ви добре воюєте. Поки що."
"We'll be back, and in greater numbers." = "Ми повернемося, і нас буде більше."
"Acceptable losses." = "Прийнятні втрати."
"Losses within projections. Mostly." = "Втрати в межах прогнозу. Здебільшого."
"Units lost. Replacements already in production." = "Юніти втрачено. Заміна вже у виробництві."
"That was my best army!" = "Це була моя найкраща армія!"
"Lucky shots. All of them." = "Щасливі постріли. Усі до одного."
"Okay, that one was on me." = "Гаразд, це мій прокол."
"Your forces were outmatched." = "Ваші сили поступилися нашим."
"Send more. We'll wait." = "Надсилайте ще. Ми зачекаємо."
"Next time, bring more than that." = "Наступного разу приведіть більше військ."
"Your forces were inadequate." = "Ваших сил було недостатньо."
"Enemy attrition: optimal." = "Виснаження ворога: оптимальне."
"Your offensive has been neutralised." = "Ваш наступ нейтралізовано."
"Is that all you've got?" = "І це все, на що ви здатні?"
"Who's next?" = "Хто наступний?"
"Thanks for the target practice!" = "Дякую за безкоштовний тир!"
"Quiet out there, Commander. Too quiet." = "Тихо там, Командире. Аж надто тихо."
"Still building? So are we." = "Досі будуєтеся? Ми теж."
"Planning something, Commander? I'd hope so." = "Щось плануєте, Командире? Сподіваюся, що так."
"Your silence has been noted." = "Ваше мовчання зафіксовано."
"Scanning... still there, Commander?" = "Сканування... Ви ще там, Командире?"
"Inactivity detected. Are you malfunctioning?" = "Виявлено бездіяльність. У вас збій?"
"Hello? Anyone home?" = "Агов? Є хто вдома?"
"I'm getting bored over here." = "Мені тут уже нудно."
"Wake me up when something explodes." = "Розбудіть мене, коли щось вибухне."
"That's hardly fair, Commander." = "Це не надто чесно, Командире."
"Cheating? The Arm expected better." = "Шахруєте? Arm чекав від вас більшого."
"Anomaly detected. Cheat logged." = "Виявлено аномалію. Чит зафіксовано."
"Rule violation recorded." = "Порушення правил зафіксовано."
"Cheater! I saw that!" = "Шахрай! Я все бачу!"
"Oh, come ON!" = "Ой, та ну ВАС!"
"Contact. So this is where you've been hiding." = "Контакт. Ось де ви ховалися."
"Enemy forces sighted. Engaging." = "Помічено ворожі сили. Вступаю в бій."
"There you are, Commander." = "Ось ви де, Командире."
"Eyes on the enemy. Here we go." = "Противник у полі зору. Почалося."
"Hostile units located. Initiating elimination." = "Ворожі юніти виявлено. Починаю ліквідацію."
"Contact established. Probability of your survival: declining." = "Контакт встановлено. Ймовірність вашого виживання: знижується."
"Target acquired." = "Ціль захоплено."
"Biological signatures located. Commencing cleanup." = "Виявлено біологічні сигнатури. Починаю зачистку."
"Found you!" = "Ага, попалися!"
"Oh, hello there!" = "О, привіт-привіт!"
"Tag, you're it!" = "Квач, тепер ви водите!"
"There you are! I was getting lonely." = "Ось ви де! А мені вже ставало самотньо."
"One less building for you to worry about." = "На одну будівлю менше — менше вам клопоту."
"Your base is thinning out, Commander." = "Ваша база рідшає, Командире."
"Structure destroyed. Next." = "Споруду знищено. Наступна."
"Your base planning could use some work, Commander." = "Планування вашої бази варто доопрацювати, Командире."
"Structure dismantled. Recycling recommended." = "Споруду демонтовано. Рекомендовано переробку."
"Your infrastructure is deteriorating." = "Ваша інфраструктура руйнується."
"Demolition complete." = "Знесення завершено."
"Structure reclassified: rubble." = "Споруду перекласифіковано: руїни."
"Oops! Was that important?" = "Ой! Це було щось важливе?"
"Kaboom! Next!" = "Ба-бах! Наступна!"
"I'm redecorating your base." = "Роблю вам на базі перепланування."
"Bet that one was important!" = "Закладаюся, ця була важлива!"
"That was well defended. Impressive." = "Добре захищено. Вражає."
"A setback. Nothing more." = "Прикра невдача. Не більше."
"You'll pay for that one." = "За це ви ще заплатите."
"A clean strike. I'll remember it." = "Чистий удар. Я це запам'ятаю."
"Production capacity reduced. Rebuilding." = "Виробничу потужність знижено. Відновлення."
"Loss registered. Replacement scheduled." = "Втрату зареєстровано. Заміну заплановано."
"Irritating." = "Дратує."
"Infrastructure damage noted. Retaliation queued." = "Пошкодження інфраструктури зафіксовано. Відплату поставлено в чергу."
"Hey! I just built that!" = "Гей! Це ж було новеньке!"
"My factory! Right, no more mister nice guy." = "Мій завод! Ну все, більше жодних поблажок."
"Rude." = "Грубо."
"Oi! That had a fresh coat of paint!" = "Агов! Там же фарба ще не висохла!"
"Commander, meet the {unit}." = "Командире, знайомтеся: {unit}."
"The {unit} is ready. I'd start running." = "{unit} готовий. Раджу тікати."
"{unit} online. Your end has been calculated." = "{unit} у строю. Ваш кінець прораховано."
"Deploying {unit}. Resistance is futile." = "Розгортаю {unit}. Опір марний."
"Look what I made! A {unit}!" = "Гляньте, що в мене є! {unit}!"
"Got myself a {unit}. Want to see it up close?" = "У мене тепер є {unit}. Хочете роздивитися зблизька?"
"A {unit}? Bold." = "{unit}? Сміливо."
"Impressive hardware, Commander. Let's see you use it." = "Неабияка техніка, Командире. Подивимося, як ви з нею впораєтеся."
"Large enemy unit detected: {unit}. Countermeasures prepared." = "Виявлено великий ворожий юніт: {unit}. Контрзаходи підготовлено."
"Your {unit} has been added to the target list." = "Ваш {unit} додано до списку цілей."
"Whoa. Is that a {unit}?" = "Ого. Це що, {unit}?"
"Okay, that's a big one." = "Гаразд, оце так махина."
"Running on empty, Commander?" = "Бак порожній, Командире?"
"Your power grid is failing. Mine isn't." = "Ваша енергомережа відмовляє. Моя — ні."
"Overspending, Commander? A bad habit." = "Живете не по кишені, Командире? Погана звичка."
"Your reserves: depleted. Mine: optimal." = "Ваші запаси: вичерпано. Мої: оптимальні."
"Economic failure detected in your sector." = "У вашому секторі виявлено економічний крах."
"Your economy is collapsing. As projected." = "Ваша економіка зазнає краху. Як і прогнозувалося."
"Out of juice already?" = "Що, батарейки вже сіли?"
"Need to borrow some metal? Too bad." = "Позичити металу? Шкода, але ні."
"Lights going out over there? Ha!" = "У вас там лампочки гаснуть? Ха!"
"{minutes} minutes, Commander. You're tougher than you look." = "{minutes} хв, Командире. Вас не так легко зламати, як здавалося."
"{minutes} minutes in, and still standing." = "{minutes} хв від початку, а ви ще тримаєтеся."
"Time elapsed: {minutes} minutes. Your resistance is statistically unlikely." = "Минуло: {minutes} хв. Ваш опір статистично малоймовірний."
"{minutes} minutes. Recalculating." = "{minutes} хв. Перерахунок."
"{minutes} minutes and you're still here? Respect." = "{minutes} хв, а ви досі тут? Повага."
"{minutes} minutes already? Time flies when you're winning." = "Уже {minutes} хв? Час летить, коли перемагаєш."
"My forces outnumber yours two to one, Commander." = "Моїх сил удвічі більше за ваші, Командире."
"Look at your army. Now look at mine." = "Подивіться на свою армію. А тепер — на мою."
"Numbers are on my side, Commander." = "Чисельна перевага на моєму боці, Командире."
"Force ratio favourable. Surrender is advised." = "Співвідношення сил сприятливе. Рекомендовано капітулювати."
"Numerical superiority achieved." = "Чисельної переваги досягнуто."
"Production advantage: decisive." = "Виробнича перевага: вирішальна."
"I've got way more stuff than you." = "У мене всього набагато більше, ніж у вас."
"Count my tanks. Go on, I'll wait." = "Порахуйте мої танки. Ну ж бо, я зачекаю."
"So many tanks. So few of yours." = "Стільки танків. І так мало ваших."
"You've been busy. So will we." = "Ви часу не гаяли. Ми теж не гаятимемо."
"Numbers aren't everything, Commander." = "Кількість — ще не все, Командире."
"Quality over quantity, Commander." = "Якість важливіша за кількість, Командире."
"Force ratio unfavourable. Adjusting." = "Співвідношення сил несприятливе. Коригування."
"Your production rate is... noted." = "Ваші темпи виробництва... взято до уваги."
"Your numbers will thin." = "Ваші лави порідшають."
"Where did you get all those?!" = "Звідки у вас стільки всього?!"
"Okay, okay, you've got more toys. For now." = "Гаразд, гаразд, іграшок у вас більше. Поки що."
"Okay, that's a LOT of guys." = "Гаразд, це ДУЖЕ багато народу."
"Your Commander looks tired." = "Ваш Командир має втомлений вигляд."
"Pull your Commander back while you still can." = "Відведіть свого Командира, поки ще можете."
"Your Commander won't last much longer." = "Ваш Командир довго не протримається."
"Enemy command unit integrity: failing." = "Цілісність ворожого командного юніта: критична."
"Your Commander's armour is compromised." = "Броню вашого Командира пробито."
"Your command unit is failing. Prepare for patterning." = "Ваш командний юніт відмовляє. Готуйтеся до оцифрування."
"Your Commander's smoking! Is that bad?" = "Ваш Командир димить! Це погано?"
"Ooh, that's gotta hurt." = "Ой, це, мабуть, боляче."
"Your Commander's looking a bit crispy!" = "Ваш Командир уже підрум'янився!"
"{name}, field command. Remember it." = "{name}, польове командування. Запам'ятайте це ім'я."
"{name}. And you're the Commander I'm about to retire." = "{name}. А ви — той Командир, якого я зараз відправлю на пенсію."
"Designation: {name}. Yours is irrelevant." = "Позначення: {name}. Ваше не має значення."
"I am {name}. I am Core." = "Я — {name}. Я — Core."
"{name}! The name you'll be cursing later." = "{name}! Ім'я, яке ви ще проклинатимете."
"Name's {name}. Pleased to beat you." = "Мене звати {name}. Приємно вас розгромити."
"Closer than you think, Commander." = "Ближче, ніж ви думаєте, Командире."
"Find out for yourself." = "З'ясуйте самі."
"Location data: classified." = "Дані про розташування: секретно."
"Everywhere that matters." = "Скрізь, де це важливо."
"Behind you! ...no, the other way." = "Позаду вас! ...ні, з іншого боку."
"Somewhere with lots of guns." = "Десь, де багато гармат."
"Never better, Commander. And you?" = "Як ніколи, Командире. А ви?"
"Going to plan." = "Усе за планом."
"Operating at peak efficiency." = "Працюю з максимальною ефективністю."
"All systems nominal. Unlike yours." = "Усі системи в нормі. На відміну від ваших."
"Great! Thanks for asking!" = "Чудово! Дякую, що спитали!"
"Living the dream." = "Не життя, а казка."
"I've had better days." = "Бували дні й кращі."
"Holding. Barely. Don't get comfortable." = "Тримаюся. Ледве. Не розслабляйтеся."
"Systems damaged. Repairs under way." = "Системи пошкоджено. Триває ремонт."
"Status: suboptimal." = "Стан: неоптимальний."
"Don't ask." = "Краще не питайте."
"Could be worse. Probably." = "Могло бути й гірше. Мабуть."
"Something you won't like." = "Щось, що вам не сподобається."
"That would spoil the surprise." = "Це зіпсує сюрприз."
"Production queue: classified." = "Черга виробництва: секретно."
"Weapons. Many weapons." = "Зброю. Багато зброї."
"A big surprise!" = "Великий сюрприз!"
"Something with way too many guns." = "Щось, де гармат аж забагато."
"{units} units and counting, Commander." = "Юнітів: {units}, і їх дедалі більшає, Командире."
"Enough. {units}, if you must know." = "Досить. {units}, якщо вам так кортить знати."
"Current unit count: {units}. Increasing." = "Поточна кількість юнітів: {units}. Зростає."
"{units}. Yours is lower." = "{units}. У вас менше."
"{units}! Want to meet them all?" = "{units}! Хочете познайомитися з усіма?"
"Like {units}? I lost count." = "Десь {units}? Уже й не порахуєш."
"No truce, Commander. Not today." = "Ніякого перемир'я, Командире. Не сьогодні."
"There will be no deals." = "Жодних угод не буде."
"Truce: incompatible with directives." = "Перемир'я: несумісне з директивами."
"Negotiation protocols disabled." = "Протоколи переговорів вимкнено."
"Truce? Ha! Nice try." = "Перемир'я? Ха! Гарна спроба."
"Peace is boring." = "Мир — це нудно."
"Thank you, Commander. You're not bad yourself." = "Дякую, Командире. Ви й самі воюєте непогано."
"Appreciated. It won't save you." = "Ціную. Але це вас не врятує."
"Flattery: ineffective." = "Лестощі: неефективні."
"Compliment received. Threat level unchanged." = "Комплімент отримано. Рівень загрози без змін."
"Aw, thanks! Still gonna crush you." = "Ой, дякую! Але я однаково вас розчавлю."
"I know, right?" = "Знаю, правда ж?"
"Help? From me? Build more extractors, Commander." = "Допомоги? Від мене? Будуйте більше екстракторів, Командире."
"My advice: more defences." = "Моя порада: більше оборони."
"Assistance denied." = "У допомозі відмовлено."
"Recommendation: surrender." = "Рекомендація: капітулювати."
"Help? Sure: stop playing so badly!" = "Допомоги? Будь ласка: перестаньте грати так погано!"
"Tip: build more stuff. You're welcome." = "Порада: будуйте більше всього. Нема за що."
"Your {unit} is out of the fight." = "Далі воюватимете без {unit}."
"Scratch one {unit}." = "Мінус {unit}."
"That {unit} won't trouble us again." = "{unit} більше нас не потурбує."
"{unit} terminated." = "{unit} ліквідовано."
"Your {unit} has been recycled." = "{unit} відправлено на переробку."
"{unit} removed from the battlefield." = "{unit} прибрано з поля бою."
"Bye bye, {unit}!" = "Па-па, {unit}!"
"Was that {unit} insured?" = "А страховка на {unit} у вас була?"
"Your {unit} just went kaboom." = "Ба-бах — і нема у вас {unit}."
"You'll pay for that {unit}." = "За {unit} ви ще заплатите."
"A good {unit}, lost. Noted." = "Втрачено добрий юніт — {unit}. Взято до уваги."
"{unit} lost. Replacement scheduled." = "{unit} втрачено. Заміну заплановано."
"Destruction of {unit} logged." = "Знищення {unit} зафіксовано."
"Hey! That {unit} was brand new!" = "Гей! {unit} же щойно з конвеєра!"
"My {unit}! I just polished that!" = "Ой, {unit}! Поліровка ж була свіженька!"
"My {unit}... You'll answer for that, Commander." = "{unit}... Ви за це відповісте, Командире."
"Losing the {unit} stings. It won't happen twice." = "Втрата {unit} дошкульна. Удруге такого не станеться."
"{unit} destroyed. Unacceptable." = "{unit} знищено. Неприйнятно."
"Loss of {unit} exceeds tolerance. Escalating." = "Втрата {unit} перевищує допуск. Ескалація."
"My {unit}! Do you know how long that took?!" = "{unit}! Ви хоч знаєте, скільки часу на це пішло?!"
"NOOO, my {unit}!" = "НІІІ, тільки не {unit}!"
"So much for your {unit}, Commander." = "Ось і вся користь від {unit}, Командире."
"Your {unit} has fallen. A fine machine, though." = "{unit} повалено. А машина була добра."
"Your {unit} has been dismantled." = "{unit} демонтовано."
"Large hostile unit eliminated: {unit}." = "Великий ворожий юніт ліквідовано: {unit}."
"Your {unit} went down like a sack of bolts!" = "Гуп! {unit} падає, як мішок болтів!"
"Big {unit}, bigger crater!" = "{unit} — велетень, а вирва — ще більша!"
"Return my {unit} at once, Commander." = "Негайно поверніть мені {unit}, Командире."
"Stealing is beneath you, Commander." = "Красти — нижче вашої гідності, Командире."
"Unauthorised transfer of {unit} detected." = "Виявлено несанкціоновану передачу {unit}."
"Your theft has been logged." = "Вашу крадіжку зафіксовано."
"Hey! Give back my {unit}!" = "Гей! А ну верніть {unit}!"
"Thief! That {unit} was mine!" = "Злодюга! {unit} — моя власність!"
"You haven't won yet, Commander." = "Ви ще не перемогли, Командире."
"The Arm fights to the last." = "Arm б'ється до останнього."
"Production offline. Combat protocols remain." = "Виробництво відключено. Бойові протоколи діють."
"Probability of defeat rising. Ignoring." = "Ймовірність поразки зростає. Ігнорую."
"I've still got a few tricks left!" = "У мене ще є кілька козирів у рукаві!"
"Not done yet! Not even close! ...Mostly close." = "Ще не кінець! Далеко не кінець! ...Ну, не так уже й далеко."
"We meet again, Commander. Last time was yours. Not this time." = "Ми знову зустрілися, Командире. Минулого разу перемога була за вами. Цього разу — ні."
"Commander. I've studied our last battle. Have you?" = "Командире. Нашу минулу битву я знаю напам'ять. А ви?"
"Previous defeat analysed. Countermeasures installed." = "Попередню поразку проаналізовано. Контрзаходи встановлено."
"Again, Commander. This time the outcome has been calculated." = "Знову ви, Командире. Цього разу результат прораховано."
"You again! I've been practising!" = "Знову ви! А я відтоді щодня тренуюся!"
"Rematch time! I'm not going easy this time." = "Час реваншу! Цього разу я не піддаватимуся."
"Back for another lesson, Commander?" = "Повернулися за новим уроком, Командире?"
"Commander. I trust you've learned something since last time." = "Командире. Сподіваюся, відтоді ви дечого навчилися."
"You have returned. Your previous patterning was incomplete." = "Ви повернулися. Ваше попереднє оцифрування було неповним."
"Familiar opponent detected. Outcome: repeating." = "Виявлено знайомого супротивника. Результат: повторюється."
"You again? Didn't I beat you last time?" = "Знову ви? Хіба минулого разу не моя взяла?"
"Oh, it's you! Ready for round two?" = "О, це ви! Готові до другого раунду?"


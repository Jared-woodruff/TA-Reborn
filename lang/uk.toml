"This tolerant TDF parse contains no sections; section-based consumers ignore it." = "Цей поблажливий розбір TDF не містить секцій; споживачі, що працюють із секціями, його ігнорують."
"Check the intended format and section headers if this file should define game content." = "Якщо цей файл має задавати вміст гри, перевірте очікуваний формат і заголовки секцій."
"{what} defined here is never used: {later} ({whose}) defines it too and comes later, so the game uses that one." = "{what}: це визначення ніколи не використовується, бо його задає й {later} ({whose}), що йде пізніше, тож гра бере те."
"{n} definitions in this file are never used: other files define them too and come later, so the game uses those (for one, {what} is also in {later}, {whose})." = "Визначень у цьому файлі, що ніколи не використовуються: {n}; їх задають і інші файли, що йдуть пізніше, тож гра бере ті (наприклад, {what} є також у {later}, {whose})."
"Replace those files in the mod (give yours their paths), or name your file so that it sorts after them." = "Замініть ці файли в моді (дайте своїм їхні шляхи) або назвіть свій файл так, щоб він ішов після них."
"{name} production button" = "кнопка виробництва {name}"
"No playable side definitions were loaded." = "Не завантажено жодного визначення сторони для гри."
"Include gamedata/sidedata.tdf or inherit the base game's valid sides." = "Додайте gamedata/sidedata.tdf або успадкуйте дійсні сторони базової гри."
"Include the referenced asset/definition, correct its name, or declare and install the required mod dependency. Names are case-insensitive." = "Додайте потрібний ресурс чи визначення, виправте його назву або оголосіть і встановіть потрібну залежність від мода. Регістр у назвах не має значення."
"Model texture: textures {names} are missing." = "Текстура моделі: бракує текстур {names}."
"{whats}: {what} is an empty file here, which blanks it out: nothing of it is read." = "{whats}: {what} тут є порожнім файлом, що його затирає: з нього нічого не читається."
"{whats}: {what} is missing." = "{whats}: бракує: {what}."
"Referenced weapon explosions require at least {texels} padded sprite texels, beyond a {side} x {side} reference atlas, even drawn reduced. Frames will be omitted at this capacity; map features, generated effects and shelf packing need additional room." = "Вибухи зброї, на які є посилання, потребують щонайменше {texels} текселів спрайтів із відступами, що більше за еталонний атлас {side} x {side}, навіть якщо їх малювати зменшеними. За такої місткості кадри буде пропущено; об'єктам карти, згенерованим ефектам і розкладці по полицях потрібне додаткове місце."
"Reduce explosion frame sizes/counts or split optional effects. Test on the target GPU; this static check uses a reference atlas size." = "Зменште розміри чи кількість кадрів вибухів або розділіть необов'язкові ефекти. Перевірте на цільовому GPU; ця статична перевірка спирається на еталонний розмір атласу."
"{what} has no frames or contains a frame larger than the {side}-pixel reference atlas side including padding." = "{what}: немає кадрів або є кадр більший за сторону еталонного атласу в {side} пікселів разом із відступами."
"Include usable frames and resize oversized animation frames." = "Додайте придатні кадри й зменште завеликі кадри анімації."
"{name} ({px} px)" = "{name} ({px} px)"
"{n} more" = "ще {n}"
"The weapons' explosions take {full} Mi texels as painted, more than the {budget} Mi the game gives them in a {side} x {side} atlas: {n} of them, larger than TA's own, are drawn reduced to {share}% of their texels across, each as big as painted ({named})." = "Вибухи зброї займають {full} Mi текселів у намальованому вигляді, що більше за {budget} Mi, які гра виділяє їм в атласі {side} x {side}: {n} із них, більші за власні вибухи TA, малюються зменшеними до {share}% текселів по ширині, кожен розміром, як намальовано ({named})."
"Nothing to do: the game draws them so. Smaller paintings would keep more of their detail." = "Нічого робити: гра малює їх саме так. Менші зображення зберегли б більше деталей."
"Large: {frames} frames up to {largest} pixels across, {millions} million pixels in all, more than the game decodes at once. It reads them a frame at a time and draws them reduced, each as big as painted: a weapon's explosion is read so." = "Велике: кадрів {frames} завширшки до {largest} пікселів, разом {millions} млн пікселів, більше, ніж гра декодує одразу. Вона читає їх по кадру й малює зменшеними, кожен розміром, як намальовано: так читається вибух зброї."
"Nothing to do: the game draws it so. Smaller paintings would load faster and keep more of their detail." = "Нічого робити: гра малює його саме так. Менші зображення завантажувалися б швидше й зберегли б більше деталей."
"Build lists for the computer players (TA 3.1's [CANBUILD]). Builders: {builders}; entries: {entries}." = "Списки будівництва для комп'ютерних гравців ([CANBUILD] з TA 3.1). Будівельники: {builders}; записи: {entries}."
"Computer players build from them. Build menus offer what the mod's menu pages and download lists put on them, as TA's did: what only these lists name is the computer players' alone." = "Комп'ютерні гравці будують за ними. У меню будівництва, як і в TA, є те, що туди додають сторінки меню та списки завантажуваних юнітів моду: те, що назване лише в цих списках, дістається тільки комп'ютерним гравцям."
"Side panels laid out for a screen {height} pixels tall, as the patched engines of later years drew them (TA's are 480). Pages: {pages}." = "Бічні панелі під екран заввишки {height} пікс., як їх малювали рушії з патчами пізніших років (у TA — 480). Сторінки: {pages}."
"The classic interface lays them out as the mod does: its build places, page arrows and orders where the mod puts them." = "Класичний інтерфейс розташовує їх так само, як мод: комірки меню будівництва, стрілки сторінок і накази — там, де їх розміщує мод."
"Build buttons off TA's grid of 64-pixel places: several sharing a place, or one taking several. Buttons: {buttons}; pages: {pages}." = "Кнопки будівництва поза сіткою TA з комірок по 64 пікселі: кілька кнопок в одній комірці або одна кнопка на кілька комірок. Кнопки: {buttons}; сторінки: {pages}."
"The classic interface lays them out as the mod does, and a click builds the unit of the button under it. The modern interface shows a place several buttons share as one picture, its parts marked." = "Класичний інтерфейс розташовує їх так само, як мод, і клік будує юніт тієї кнопки, що під курсором. Сучасний інтерфейс показує комірку, яку ділять кілька кнопок, одним зображенням із позначеними частинами."
"Scripts asking the engine for unit values of TA's later patches ({values}). Scripts: {scripts}." = "Скрипти, що запитують у рушія значення юнітів із пізніших патчів TA ({values}). Скрипти: {scripts}."
"TA Reborn answers them as those engines did: TA 3.1's questions about units by their IDs (69 to 75), a later patch's cloak (111)." = "TA Reborn відповідає на них так само, як ті рушії: на запити TA 3.1 про юніти за їхніми ID (від 69 до 75) і на запит маскування з одного з пізніших патчів (111)."
"TA Reborn finds a weapon by its name and never reads its ID: IDs make no difference here." = "TA Reborn знаходить зброю за назвою й ніколи не читає її ID: тут ID ні на що не впливають."
"Weapon IDs past 255, the highest TA's own engine numbered (the weapon patches of later years went further). Weapons: {n}; the highest ID: {max}." = "ID зброї понад 255 (це найбільший номер в оригінальному рушії TA; пізніші патчі для зброї йшли далі). Види зброї: {n}; найбільший ID: {max}."
"Weapons sharing an ID with another weapon: {names}." = "Зброя з тим самим ID, що й інша зброя: {names}."
"Sides of its own: {names}." = "Власні сторони: {names}."
"Offered with the others when a skirmish or a multiplayer battle is set up." = "Пропонуються разом з іншими під час налаштування сутички або мережевої битви."
"Campaigns of its own: {n}." = "Власні кампанії: {n}."
"Played from the campaign screen, with TA's own." = "Доступні на екрані кампаній разом із кампаніями TA."
"Files for TA's own computer players (ai/): {n}." = "Файли для комп'ютерних гравців оригінальної гри (ai/): {n}."
"Not used: TA Reborn's computer players are its own. They build from the mod's build lists and menus." = "Не задіяно: у TA Reborn власні комп'ютерні гравці. Вони будують за списками будівництва й меню моду."
"Programs and engine patches: {names}." = "Програми й патчі рушія: {names}."
"Not used: TA Reborn runs no program a mod brings. What a patch changed in TA's engine is there only where TA Reborn plays it itself, as told here." = "Не задіяно: TA Reborn не запускає програм, що постачаються з модами. Те, що патч змінював у рушії TA, є лише там, де TA Reborn відтворює це сам, як описано в цьому розділі."
"This file is empty: TA's way of blanking out a file of the same name below it (the original game's, or that of a mod it is mounted over). The game reads nothing from it." = "Цей файл порожній: так TA затирає файл з такою самою назвою нижче (оригінальної гри або мода, поверх якого його змонтовано). Гра нічого з нього не читає."
"{n} empty files here ({files}): TA's way of blanking out files of the same names below them (the original game's, or those of a mod they are mounted over). The game reads nothing from them." = "Порожніх файлів тут: {n} ({files}): так TA затирає файли з такими самими назвами нижче (оригінальної гри або мода, поверх якого їх змонтовано). Гра нічого з них не читає."
"Nothing to do if they are meant to remove those files. If one should hold data, export it again." = "Нічого робити, якщо вони мають прибрати ті файли. Якщо якийсь із них має містити дані, експортуйте його ще раз."
"Texture {name} has {frames} frames; Reborn's model vertices address at most 255 and this entry uses fallback paint." = "Текстура {name} має кадрів: {frames}; вершини моделей Reborn адресують щонайбільше 255, тож цей запис використовує запасне фарбування."
"Reduce this texture entry to at most 255 frames." = "Зменште цей запис текстури щонайбільше до 255 кадрів."
"Texture {name} ({frames} frames) falls back: the textures the models paint with fill the reference GPU profile's {banks} arrays of {layers} layers ({before} layers before it; one is reserved for fallback). Actual device limits may differ." = "Текстура {name} ({frames} кадрів) переходить на запасне фарбування: текстури, якими малюються моделі, заповнюють {banks} масивів по {layers} шарів еталонного профілю GPU ({before} шарів перед нею; один зарезервовано для запасного). Справжні обмеження пристрою можуть відрізнятися."
"Consolidate duplicate textures or reduce animation/team frame counts. Test on the target GPU; higher limits do not fix unsupported frame counts." = "Об'єднайте дубльовані текстури або зменште кількість кадрів анімації чи командних кадрів. Перевірте на цільовому GPU; вищі ліміти не виправляють непідтримувану кількість кадрів."
"{script} declares piece {piece}, which is absent from {model}. Any animation or position query using it has no matching model part." = "{script} оголошує частину {piece}, якої немає в {model}. Для будь-якої анімації чи запиту позиції з нею немає відповідної частини моделі."
"{script} declares pieces {pieces}, which are absent from {model}. Any animation or position query using them has no matching model part." = "{script} оголошує частини {pieces}, яких немає в {model}. Для будь-якої анімації чи запиту позиції з ними немає відповідної частини моделі."
"Confirm that these are intentional virtual/helper pieces; otherwise use matching model and COB files or align the BOS piece declarations with the model's piece names." = "Переконайтеся, що це навмисні віртуальні чи допоміжні частини; інакше використайте відповідні файли моделі та COB або узгодьте оголошення частин у BOS з назвами частин моделі."
"{unit} has {weapon} but its script {script} has no {function}: if the weapon fires, its shots leave from the unit's centre, not a barrel." = "{unit} має {weapon}, але в його скрипті {script} немає {function}: якщо зброя стріляє, постріли вилітають із центру юніта, а не зі ствола."
"{unit} has {weapons} but its script {script} has no {functions}: if they fire, their shots leave from the unit's centre, not a barrel." = "{unit} має {weapons}, але в його скрипті {script} немає {functions}: якщо вони стріляють, постріли вилітають із центру юніта, а не зі ствола."
"Add the functions to the unit's BOS script, returning the pieces the shots leave from, and recompile." = "Додайте функції до скрипта BOS цього юніта, щоб вони повертали частини, з яких вилітають постріли, і перекомпілюйте."
"{unit} builds but its script {script} has no QueryNanoPiece: its build spray comes from the unit's centre." = "{unit} будує, але в його скрипті {script} немає QueryNanoPiece: промінь будівництва виходить із центру юніта."
"Add QueryNanoPiece to the unit's BOS script, returning its nano-lathe piece, and recompile." = "Додайте QueryNanoPiece до скрипта BOS цього юніта, щоб він повертав частину нано-верстата, і перекомпілюйте."
"{unit} can be built but has no picture ({picture}): TA's classic panels and the encyclopaedia show none; Reborn's own panel draws one from its model." = "{unit} можна збудувати, але в нього немає картинки ({picture}): класичні панелі TA та енциклопедія її не показують; власна панель Reborn малює її з моделі."
"Add a 64 × 64 PCX of the unit to unitpics/." = "Додайте PCX юніта розміром 64 × 64 до unitpics/."
"Re-export this asset in the original TA format, within Reborn's documented parser limits; replace truncated or corrupt files." = "Експортуйте цей ресурс заново в оригінальному форматі TA, у межах задокументованих обмежень розбірника Reborn; замініть обрізані чи пошкоджені файли."
"The game cannot read this file: {error}" = "Гра не може прочитати цей файл: {error}"
"The section name [{name} has no closing ]." = "Назва секції [{name} не має закривної ]."
"[{name}] has no { } body after it: what follows is read into the section around it." = "Після [{name}] немає тіла { }: те, що йде далі, читається в навколишню секцію."
"This } closes no section." = "Ця } не закриває жодної секції."
"A { opened on this line is never closed." = "Відкрита в цьому рядку { ніколи не закривається."
"[{name}] opened on this line is never closed: any section after it is read as part of it." = "[{name}] відкрито в цьому рядку й ніколи не закрито: будь-яка секція після нього читається як його частина."
"A /* comment opened on this line never ends: the rest of the file is read as a comment." = "Коментар /*, відкритий у цьому рядку, ніколи не закінчується: решта файлу читається як коментар."


"Set name and commander to a valid faction and UnitName." = "Задайте для name і commander дійсну сторону та UnitName."
"{name} starting commander" = "стартовий командир {name}"
"Owner of a build list for the computer players" = "власник списку будівництва комп'ютерних гравців"
"{name} build option for the computer players" = "варіант будівництва {name} для комп'ютерних гравців"

# apps/ta_game/scenarios/armageddon.toml
"Armageddon" = "Армагеддон"
"Two armies, one plain, no retreat. Win the battle of the war." = "Дві армії, одна рівнина, жодного відступу. Виграйте головну битву війни."
"Commander, the Core's main army is marching north across the Mounds, and ours stands in its way. There are no bases here, no factories, no reinforcements: what you have is all you will ever have.\n\nThey outnumber us. We outgun them. Put the Lugers and the Merls on their columns as they close, hold the line with the Zeus, and keep the Jethros with the tanks: they will bring gunships. Their reserves arrive two and a half minutes in.\n\nDestroy every one of them." = "Командире, головна армія Core марширує на північ марсіанськими пагорбами, а наша стоїть у неї на шляху. Тут немає ні баз, ні заводів, ні підкріплень: усе, що у вас є, — це все, що у вас будь-коли буде.\n\nЇх більше. Зате наша зброя потужніша. Щойно їхні колони наблизяться, накривайте їх вогнем Luger і Merl, утримуйте лінію силами Zeus, а Jethro тримайте поруч із танками: ворог приведе штурмовики. Їхні резерви прибудуть за дві з половиною хвилини.\n\nЗнищте їх усіх до одного."
"Arm Command" = "Командування Arm"
"Here they come. Hold the line, and keep the Jethros with the tanks." = "Ось вони. Тримайте лінію, і нехай Jethro тримаються біля танків."
"Their reserves are coming up behind the mounds, a Goliath at their head." = "Їхні резерви підходять з-за пагорбів, попереду Goliath."

# apps/ta_game/scenarios/armistice.toml
"The Armistice" = "Перемир'я"
"Five minutes of peace to build an army. Then the war resumes." = "П'ять хвилин миру, щоб зібрати армію. Потім війна поновиться."
"Commander, the peace talks on Reactor Grid have failed. The armistice holds for five more minutes: until then no weapon may fire, and neither side may build near the other's base. When it ends, the war resumes.\n\nBoth sides are rearming at a furious pace: resources and construction run at twice their usual speed, and the treaty's one lasting clause bans missile silos. Their Commander knows the clock as well as you do.\n\nBuild as you have never built. When the armistice ends, destroy the Core Commander." = "Командире, мирні переговори на Reactor Grid зазнали провалу. Перемир'я триватиме ще п'ять хвилин: доти жодна зброя не може стріляти, і жодна сторона не може будувати поблизу бази іншої. Коли воно скінчиться, війна поновиться.\n\nОбидві сторони переозброюються шаленими темпами: ресурси й будівництво йдуть удвічі швидше, ніж зазвичай, а єдиний чинний пункт договору забороняє ракетні шахти. Їхній Командир знає цей відлік не гірше за вас.\n\nБудуйте, як ніколи. Коли перемир'я скінчиться, знищте Командира Core."
"The talks have failed. For five minutes no weapon fires and nobody builds near the other's base. Then it is war: build as you have never built." = "Переговори провалилися. П'ять хвилин жодна зброя не стріляє, і ніхто не будує поблизу бази іншої сторони. Потім війна: будуйте, як ніколи."
"Their factories are running day and night. Ours should be too." = "Їхні заводи працюють удень і вночі. Наші теж мають."
"Core Overseer" = "Наглядач Core"
"Ten seconds, Arm. We have counted every one of your factories." = "Десять секунд, Arm. Ми порахували кожен ваш завод."
"Their Commander is somewhere in that grid. Find it, and end this war for good." = "Їхній Командир десь у цій сітці. Знайдіть його й закінчіть цю війну назавжди."

# apps/ta_game/scenarios/brothers_in_arms.toml
"Brothers in Arms" = "Брати по зброї"
"You and an allied Commander against two of the Core's." = "Ви й союзний Командир проти двох Командирів Core."
"Commander, you are not alone on Highland Rift. Commander Holt's forces hold the river crossings in the north, beside yours in the north-western highlands. Two Core Commanders are dug in to the south, across the canyon.\n\nHolt's computer will fight its own war, but it is the same war: back it up when it is hard pressed, and it will do the same for you. Your forces see what its forces see.\n\nDestroy both Core Commanders. Keep yours alive." = "Командире, ви не самі на Highland Rift. Війська Командира Голта тримають переправи через річку на півночі, поруч із вашими на північно-західному нагір'ї. Два Командири Core окопалися на півдні, за каньйоном.\n\nКомп'ютер Голта вестиме власну війну, але це та сама війна: підтримайте його, коли йому скрутно, і він зробить те саме для вас. Ваші війська бачать те, що бачать його.\n\nЗнищте обох Командирів Core. Збережіть життя своєму."
"Commander Holt" = "Командир Голт"
"Good to have you on the line. I'll hold the river crossings in the north; you take the western highlands." = "Радий, що ви на зв'язку. Я тримаю переправи на півночі; ви беріть західне нагір'я."
"My scouts have found both of their bases. The south-western one is yours; I'll keep the other busy." = "Мої розвідники знайшли обидві їхні бази. Південно-західна ваша; іншу я відволічу."
"They're massing at the canyon. If they come for one of us, the other hits them from the side." = "Вони збираються біля каньйону. Якщо вдарять по одному з нас, інший б'є їм у фланг."
"Still with me? Then let's finish it. Everything we have, at their Commanders." = "Ще зі мною? Тоді закінчуймо. Усе, що маємо, — по їхніх Командирах."

# apps/ta_game/scenarios/decapitation.toml
"Kill the Core Commander on his island fortress. From the air." = "Знищте Командира Core в його острівній фортеці. З повітря."
"Commander, a Core Commander has made his fortress on the island at the centre of this lava sea. Nothing on treads or legs will reach him, and his anti-air is the best the Core can build.\n\nYou have a small air wing and a forward airfield in the south-west corner: build it up. Strip away his air defences, then send the bombers in; a handful sent straight at him will not get through. Brawler gunships hit hard but die fast over flak, and the Freedom Fighters can keep his fighters off your bombers.\n\nHis reinforcements arrive in fifteen minutes. Before then, he must be dead." = "Командире, Командир Core влаштував собі фортецю на острові посеред цього лавового моря. Ніщо на гусеницях чи ногах до нього не дістанеться, а його ППО — найкраща, яку тільки може збудувати Core.\n\nУ вас є невелике авіакрило й передовий аеродром у південно-західному куті: розбудуйте його. Спершу знищте ворожу протиповітряну оборону, а тоді посилайте бомбардувальники; жменька, кинута прямо на нього, не прорветься. Штурмовики Brawler б'ють сильно, але швидко гинуть під зенітним вогнем, а Freedom Fighter можуть відганяти його винищувачі від ваших бомбардувальників.\n\nЙого підкріплення прибуде за п'ятнадцять хвилин. До того часу він має загинути."

# apps/ta_game/scenarios/doomsday_clock.toml
"Doomsday Clock" = "Годинник Судного дня"
"The Core's missile launches in fifteen minutes. Stop it." = "Ракета Core злетить за п'ятнадцять хвилин. Зупиніть її."
"Commander, a Silencer nuclear silo stands at the heart of the Core base across these metal plains, and it is arming. In fifteen minutes the missile flies, and your base is the target.\n\nDestroy the silo. Nothing else matters: not their Commander, not their factories. The silo sits behind heavy laser towers and a Punisher battery, and their Commander will not sit still while you come for it.\n\nYou have a base, two factories and two construction kbots. The clock is running." = "Командире, у серці бази Core по той бік цих металевих рівнин стоїть ядерна шахта Silencer, і вона готується до пуску. За п'ятнадцять хвилин ракета злетить, і її ціль — ваша база.\n\nЗнищте шахту. Решта не має значення: ні їхній Командир, ні їхні заводи. Шахту прикривають важкі лазерні вежі й батарея Punisher, а їхній Командир не сидітиме склавши руки, поки ви пробиваєтеся до неї.\n\nУ вас є база, два заводи й два будівельні кботи. Годинник цокає."
"Ten minutes to launch, Commander." = "Десять хвилин до запуску, Командире."
"Five minutes to launch. That silo has to go." = "П'ять хвилин до запуску. Цю шахту треба знищити."
"One minute! Get to that silo!" = "Хвилина! До шахти!"

# apps/ta_game/scenarios/endless_siege.toml
"Endless Siege" = "Нескінченна облога"
"The waves never stop. Survive as long as you can." = "Хвилі не вщухають. Протримайтеся якомога довше."
"Commander, there is no rescue coming, no reinforcements, no victory. The Core has found your outpost in the mesas and will throw everything it has at it, from three directions, for as long as it takes.\n\nKbots, then tanks, then artillery and bombers; heavier every time, and now and then something enormous. Build an economy, build defences, and hold on.\n\nYour best time is kept. Beat it." = "Командире, порятунку не буде — ні підкріплень, ні перемоги. Core знайшов ваш аванпост серед столових гір і кидатиме на нього все, що має, з трьох напрямків, скільки б це не тривало.\n\nКботи, потім танки, потім артилерія й бомбардувальники; щоразу важчі, а час від часу — щось величезне. Розбудуйте економіку, збудуйте оборону й тримайтеся.\n\nВаш найкращий час зберігається. Перевершіть його."

# apps/ta_game/scenarios/extraction.toml
"Extraction" = "Евакуація"
"Get your Commander down the lava river to the pick-up point." = "Проведіть свого Командира вздовж лавової ріки до точки евакуації."
"Commander, your drop went wrong. You are on the south bank of a river of lava at the western end of the Run, with what is left of your escort, and the dropships can only land at the far eastern end.\n\nThe Core has guns all along the north bank, and patrols on your side of the river. Keep away from the lava's edge (their laser towers reach no further), deal with the patrols, and get your Commander to the pick-up point. Whatever guards it will not come to you. Core troops are already following your tracks; do not stop for long.\n\nAnything else is expendable. Your Commander is not." = "Командире, ваше десантування пішло не за планом. Ви на південному березі лавової ріки в західному кінці Lava Run, з рештками ескорту, а десантні кораблі можуть сісти лише в далекому східному кінці.\n\nУздовж усього північного берега стоять гармати Core, а на вашому боці ріки ходять патрулі. Тримайтеся подалі від краю лави (далі їхні лазерні вежі не дістають), розберіться з патрулями й доведіть Командира до точки евакуації. Те, що її охороняє, саме до вас не прийде. Війська Core вже йдуть вашим слідом; не зупиняйтеся надовго.\n\nУсім іншим можна пожертвувати. Вашим Командиром — ні."

# apps/ta_game/scenarios/iron_rain.toml
"Iron Rain" = "Залізний дощ"
"Two Intimidators are shelling your base. Take the mesa and silence them." = "Два Intimidator обстрілюють вашу базу. Візьміть плато й змусьте їх замовкнути."
"Commander, the Core has hauled two Intimidators, its long-range plasma cannons, onto the mesas in the middle of the canyon. Your base is inside their range. Every eight seconds each of them will put a shell among your buildings, until you silence them.\n\nThe battery is dug in behind heavy laser towers and a Punisher, with tanks on the ramps, and the Core's main base lies beyond it, to the south-east. Its Commander will send what it can.\n\nSpread out, build fast and take that mesa. Destroy both Intimidators." = "Командире, Core затягло два Intimidator, свої далекобійні плазмові гармати, на плато посеред каньйону. Ваша база в їхній досяжності. Кожні вісім секунд кожна з них кластиме снаряд серед ваших будівель, доки ви не змусите їх замовкнути.\n\nБатарея окопалася за важкими лазерними вежами та Punisher, на пандусах стоять танки, а головна база Core лежить далі, на південному сході. Її Командир надішле все, що зможе.\n\nРозосередьтеся, будуйте швидко й візьміть це плато. Знищте обидва Intimidator."
"Commander, two Intimidators on the mesas have your range. Every eight seconds each of them will put a shell into your base." = "Командире, два Intimidator на плато дістають до вашої бази. Кожні вісім секунд кожна з них кластиме снаряд у вашу базу."
"A Core radar post in the canyon to the south-east is spotting for those guns. Knock it out and they can no longer see your base." = "Радарний пост Core у каньйоні на південному сході коригує вогонь цих гармат. Знищте його, і вони більше не бачитимуть вашу базу."
"Spread your buildings out: a shell that lands among them takes them all." = "Розосередьте будівлі: снаряд, що впаде між ними, забере їх усі."
"Their gunners have your range now. Take that mesa, Commander!" = "Їхні артилеристи пристрілялися. Візьміть це плато, Командире!"

# apps/ta_game/scenarios/king_of_the_hill.toml
"King of the Hill" = "Цар гори"
"Hold the summit for four minutes before the Core does." = "Утримайте вершину чотири хвилини раніше, ніж це зробить Core."
"Commander, the spiral mountain at the heart of this plain is rich in metal, and whoever holds its summit holds the planet. A Core Commander has landed to the north with the same idea.\n\nTake the summit and keep it: four minutes in all with only your forces on top wins it. Contested, the clock stands still. If the Core holds it alone for four minutes, the mountain is theirs.\n\nThe Core will keep sending troops up the slopes. Build up, get there first, and dig in." = "Командире, спіральна гора в серці цієї рівнини багата на метал, і хто тримає її вершину, той тримає планету. На півночі висадився Командир Core з тим самим наміром.\n\nЗахопіть вершину й утримайте її: загалом чотири хвилини лише з вашими силами нагорі — і вона ваша. Поки за неї точиться бій, годинник стоїть. Якщо Core сам протримає її чотири хвилини, гора дістанеться йому.\n\nCore раз у раз посилатиме війська вгору схилами. Розбудуйтеся, дістаньтеся туди першими й закріпіться."
"Core troops are climbing the north slope. Don't let them dig in on the summit." = "Війська Core підіймаються північним схилом. Не дайте їм закріпитися на вершині."
"Raiders are coming round the mountain for your base." = "Нальотники обходять гору й ідуть на вашу базу."

# apps/ta_game/scenarios/last_stand.toml
"Last Stand" = "Останній рубіж"
"Hold the pass for twelve minutes. They will not stop coming." = "Утримуйте прохід дванадцять хвилин. Вони не перестануть наступати."
"Commander, the Core has broken through at Varrin Gap. The only way into the valley behind you is the winding pass ahead, and your outpost at its western mouth is all that stands in the way.\n\nReinforcements are twelve minutes out. Hold until they arrive. Core forces will come through the pass in waves, each heavier than the last; expect bombers, and expect worse at the end: our scouts have seen something very large moving in the east.\n\nYou have a small base, a kbot lab and two construction kbots. Build what you can. Keep your Commander alive." = "Командире, Core прорвався біля ущелини Варрін. Єдиний шлях у долину за вашою спиною — звивистий прохід попереду, і ваш аванпост біля його західного входу — це все, що стоїть ворогові на заваді.\n\nПідкріплення буде за дванадцять хвилин. Протримайтеся до його прибуття. Сили Core йтимуть проходом хвилями, кожна важча за попередню; чекайте бомбардувальників, а під кінець — і гіршого: наші розвідники бачили, як на сході рухається щось дуже велике.\n\nУ вас є невелика база, лабораторія кботів і два будівельні кботи. Будуйте все, що зможете. Бережіть свого Командира."
"Outpost, this is Arm Command. The relief force is twelve minutes out. Nothing gets through that pass before it arrives." = "Форпосте, на зв'язку командування Arm. Підкріплення за дванадцять хвилин. Ніщо не має пройти через перевал до його прибуття."
"Radar: aircraft inbound from the east. Bombers! Get your anti-air up." = "Радар: зі сходу наближається авіація. Бомбардувальники! Готуйте ППО."
"Seismic contact in the pass. It's the big one, Commander: a Krogoth." = "Сейсмічний контакт на перевалі. Це великий, Командире: Krogoth."
"One minute! The relief force is entering the valley." = "Хвилина! Підкріплення входить у долину."

# apps/ta_game/scenarios/metal_rush.toml
"The first to make 15,000 metal wins. The Core plays rough." = "Перемагає той, хто першим видобуде 15 000 металу. Core грає брудно."
"Commander, the mining rights to this planet go to whoever proves they can work it: the first side to extract fifteen thousand metal wins it outright.\n\nThe Core is racing you from the western plateau, and the Core has never been known to race fair. Expect raids on your extractors. Build fast, protect your economy, and if you can, take theirs apart.\n\nMetal makers count. Reclaimed metal counts. Whatever you make, counts." = "Командире, права на видобуток на цій планеті отримає той, хто доведе, що здатен її освоїти: сторона, яка першою видобуде п'ятнадцять тисяч металу, забирає її повністю.\n\nCore змагається з вами із західного плато, а чесних перегонів від Core ще ніхто не бачив. Чекайте рейдів на ваші екстрактори. Будуйте швидко, захищайте свою економіку, а якщо зможете — розваліть їхню.\n\nГенератори металу рахуються. Перероблений метал рахується. Усе, що ви виробите, рахується."

# apps/ta_game/scenarios/titans.toml
"Titans" = "Титани"
"Three Krogoths are walking toward your base. Bring them down." = "Три Krogoth ідуть до вашої бази. Повальте їх."
"Commander, seismic stations round the basin are reading footfalls: three Krogoths, the Core's walking fortresses, are crossing the salt pans toward your base, one after another, each with an escort.\n\nNothing out there can stop them but you. A Krogoth's head laser reaches further than your D-gun, so keep your Commander back. Bombers, artillery and massed Zeus will bring one down. Lose your nerve and it will walk through your base.\n\nYou have a base with three factories, four construction kbots and a garrison. Destroy all three of them." = "Командире, сейсмічні станції довкола улоговини фіксують кроки: три Krogoth, крокуючі фортеці Core, один за одним перетинають солончаки, прямуючи до вашої бази, кожен з ескортом.\n\nНіщо там їх не зупинить, крім вас. Головний лазер Krogoth б'є далі, ніж ваша D-гармата, тож тримайте Командира позаду. Бомбардувальники, артилерія та маси Zeus повалять одного. Похитнетеся — і він пройде крізь вашу базу.\n\nУ вас база з трьома заводами, чотирма будівельними кботами й гарнізоном. Знищте всіх трьох."
"Commander, seismic stations are reading footfalls round the basin. Three Krogoths are walking toward your base, one after another." = "Командире, сейсмічні станції фіксують кроки довкола улоговини. Три Krogoth один за одним ідуть до вашої бази."
"The first Krogoth has crossed the north-western rim. It is coming straight for you." = "Перший Krogoth перейшов північно-західний край. Він іде просто на вас."
"Keep your Commander back: that head laser reaches further than your D-gun." = "Тримайте Командира позаду: цей головний лазер б'є далі за вашу D-гармату."
"The second Krogoth is through the northern pass, with rockets and anti-air round it." = "Другий Krogoth пройшов північний перевал, довкола нього ракети й ППО."
"The last of them, out of the north-east, with the heaviest escort yet. End this, Commander." = "Останній із них, з північного сходу, з найважчим ескортом. Покладіть цьому край, Командире."

# apps/ta_game/scenarios/until_dawn.toml
"Until Dawn" = "До світанку"
"Night falls on the timber. Hold your ridge until the sun comes up." = "Над лісом спадає ніч. Утримайте гребінь, доки не зійде сонце."
"Commander, night is falling over Timberline, and the Core is moving through the forest under it. Your outpost holds the western ridge: the only road out of the valley runs past it.\n\nThe relief column cannot move before first light. Until then you are on your own. In the dark and the rain their raiders will be on you before you see them, so build radar, and keep your floodlights burning.\n\nYou have a small base, a kbot lab and two construction kbots. Hold until dawn, and keep your Commander alive." = "Командире, над Timberline спадає ніч, і Core під її покровом рухається лісом. Ваш форпост тримає західний гребінь: єдина дорога з долини проходить повз нього.\n\nКолона підкріплення не може вирушити до світанку. Доти ви самі по собі. У темряві та під дощем їхні нальотники опиняться поруч раніше, ніж ви їх побачите, тож будуйте радари й не гасіть прожектори.\n\nУ вас невелика база, Kbot Lab і два будівельні кботи. Протримайтеся до світанку й збережіть життя своєму Командирові."
"Outpost Echo, the Core is moving through the timber tonight. Hold your ridge until first light: the relief column marches at dawn." = "Форпосте «Луна», цієї ночі Core йде через ліс. Утримуйте гребінь до першого світла: колона підкріплення вирушає на світанку."
"Raiders in the eastern trees. In this rain you will hear them before you see them." = "Нальотники у східному лісі. У такий дощ ви почуєте їх раніше, ніж побачите."
"Pyros in the north-eastern woods. Keep them out of the trees round your base: the timber will burn." = "Pyro в північно-східних лісах. Не підпускайте їх до дерев довкола бази: ліс загориться."
"A convoy got through from the south-west. Four Zeus and two Jethros are yours, Commander." = "Конвой прорвався з південного заходу. Чотири Zeus і два Jethro тепер ваші, Командире."
"Seismic contact in the south-east: heavy treads. They are saving the worst for the last hours of the night." = "Сейсмічний контакт на південному сході: важкі гусениці. Найгірше вони приберігають на останні години ночі."
"Sunrise in one minute. The relief column is at the river. Hold on!" = "До сходу сонця хвилина. Колона підкріплення біля річки. Тримайтеся!"

# No longer used by the interface:
"AUTOMATED CHECK" = "АВТОПЕРЕВІРКА"
"Build-menu owner" = "власник меню будівництва"
"Game folder" = "Тека гри"
"This copy is in the game folder, which comes before your mods folder: replace it there to update it." = "Ця копія лежить у теці гри, яка має перевагу над вашою текою модів: замініть її там, щоб оновити."

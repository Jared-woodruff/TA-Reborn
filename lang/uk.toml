# apps/ta_game/src/lore.rs
"THE AGE OF CORE" = "ДОБА CORE"
"THE PATTERNING" = "ОЦИФРУВАННЯ"
"THE GALACTIC WAR" = "ГАЛАКТИЧНА ВІЙНА"
"THE ARCHIVE" = "АРХІВ"
"BEFORE THE WAR" = "ДО ВІЙНИ"
"For ten thousand years the galaxy answered to one government. It called itself CORE, and its purpose was knowledge: it charted every star, mined every world it could reach and turned the wealth into science. Its cities wrapped whole planets, and its archives held everything anyone had ever learned.\n\nNobody remembers a war from that age. There was nothing left to fight over, and nobody who wanted to." = "Десять тисяч років галактика корилася одному урядові. Він називав себе CORE, і його метою було знання: він наносив на карти кожну зірку, розробляв надра кожного світу, до якого міг дотягтися, і перетворював здобуте багатство на науку. Його міста вкривали цілі планети, а в його архівах зберігалося все, що будь-хто будь-коли дізнався.\n\nНіхто не пам'ятає жодної війни тієї доби. Воювати вже не було за що, та ніхто й не хотів."
"YEAR 0" = "РІК 0"
"VICTORY OVER DEATH" = "ПЕРЕМОГА НАД СМЕРТЮ"
"Then CORE's scientists solved the last problem left to them. Patterning read a living mind, every memory and every habit of thought, and wrote it whole into a machine that would never age, sicken or die.\n\nThe first patterned citizens woke in their new bodies to a galaxy in celebration. Death, the oldest enemy of all, had been beaten." = "Тоді вчені CORE розв'язали останню задачу, що в них лишалася. Оцифрування зчитувало живий розум — кожен спогад, кожну звичку мислення — і цілком записувало його в машину, яка ніколи не постаріє, не захворіє й не помре.\n\nПерші оцифровані громадяни прокинулися в нових тілах, а навколо раділа вся галактика. Смерть, найдавніший з ворогів, зазнала поразки."
"YEAR 3" = "РІК 3"
"THE EDICT" = "УКАЗ"
"Triumph became law. The Council of CORE reasoned that a mind which could be saved and was not had been thrown away, and that a citizen who refused immortality endangered everyone else.\n\nThe Patterning Edict made the process compulsory: every citizen, on every world, would be patterned within a generation. The collection ships set out the same year." = "Тріумф став законом. Рада CORE розсудила: не зберегти розум, який можна було зберегти, — однаково що викинути його, а громадянин, який відмовляється від безсмертя, наражає на небезпеку всіх інших.\n\nУказ про оцифрування зробив його обов'язковим: кожного громадянина на кожному світі мали оцифрувати протягом одного покоління. Того ж року в путь вирушили кораблі-збирачі."
"YEAR 19" = "РІК 19"
"THE REFUSAL" = "ВІДМОВА"
"Not everyone would go. Millions held that a copied mind was a copy and nothing more, that the person ended where the machine began; some called patterning murder done politely.\n\nThey ran. The refusers fled CORE's worlds for the galaxy's outer rim, where its ships seldom came, and in the dark between the last stars they built a nation of their own. They called it the ARM, for the spiral arm they hid in and for the weapons they would need." = "Піти на це погодилися не всі. Мільйони були переконані, що скопійований розум — це копія, і нічого більше, що людина закінчується там, де починається машина; дехто називав оцифрування ввічливим убивством.\n\nВони втекли. Ті, хто відмовився, подалися зі світів CORE на зовнішній край галактики, куди його кораблі заходили рідко, і в темряві між останніми зорями збудували власну державу. Вони назвали її ARM — від спірального рукава галактики (arm), де вони сховалися, і від зброї (arms), яка їм знадобиться."
"YEAR 31" = "РІК 31"
"FIRST BLOOD" = "ПЕРША КРОВ"
"CORE did not let them go. Collection fleets followed the refugees to the rim, and the first ARM colony to resist one was burned from orbit.\n\nThe ARM answered. Within a decade the frontier was a battlefield, and the word war, unused for ten thousand years, was in every archive again." = "CORE не відпустив їх. Флоти збирачів рушили за втікачами на край галактики, і першу колонію ARM, що дала відсіч такому флотові, випалили з орбіти.\n\nARM відповів. Не минуло й десяти років, як прикордоння стало полем бою, а слово «війна», яким десять тисяч років ніхто не користувався, знову з'явилося в кожному архіві."
"YEAR 212" = "РІК 212"
"FLESH AND METAL" = "ПЛОТЬ І МЕТАЛ"
"The two sides fought as what they were. The ARM sealed its soldiers in powered combat suits and, when there were too few soldiers, grew more: clone after clone, raised in vats and sent to the front.\n\nCORE took the patterns of its finest warriors and copied them without limit, one veteran mind fighting in ten thousand machine bodies at once. Flesh against metal; the mortal against the eternal." = "Кожна сторона воювала так, як велить її природа. ARM заковував своїх солдатів у бойові екзоскелети, а коли солдатів забракло, почав вирощувати нових: клон за клоном, із чанів — просто на фронт.\n\nCORE брав зліпки свідомості своїх найкращих воїнів і копіював їх без ліку: один і той самий розум ветерана воював одночасно в десяти тисячах машинних тіл. Плоть проти металу; смертне проти вічного."
"YEARS 212–3977" = "РОКИ 212–3977"
"FOUR THOUSAND YEARS" = "ЧОТИРИ ТИСЯЧІ РОКІВ"
"The war fed on the galaxy. Every world with metal in it became a mine, every world without became a battlefield, and whole systems were burned to ash and slag to deny them to the enemy. Generations of ARM clones lived and died without seeing peace; CORE's eternal soldiers fought on, remembering every defeat.\n\nAfter four thousand years the wealth of the galaxy was spent, the great fleets were gone, and neither side could win." = "Війна живилася галактикою. Кожен світ, де був метал, ставав копальнею, кожен світ без металу — полем бою, а цілі системи обертали на попіл і шлак, аби вони не дісталися ворогові. Покоління клонів ARM жили й помирали, так і не побачивши миру; вічні солдати CORE воювали далі, пам'ятаючи кожну поразку.\n\nЧерез чотири тисячі років багатства галактики було розтрачено, великих флотів не стало, і жодна сторона не могла перемогти."
"YEAR 3977" = "РІК 3977"
"THE COMMANDERS" = "КОМАНДИРИ"
"What was left was the Commander: a single armoured war machine carrying a nanolathe, which turns a world's raw metal and energy into whatever its builder can design. Power plants and factories first, and from the factories an army.\n\nDrop one Commander on a dead world and within the hour it fields a war. Both sides staked everything on a handful of them. Lose your Commander, and you lose the world." = "Лишився тільки Командир: одна-єдина броньована бойова машина з нанотокарним верстатом, що перетворює сирий метал і енергію світу на все, що здатен спроєктувати його власник. Спершу електростанції й заводи, а з заводів — армія.\n\nВисадіть одного Командира на мертву планету — і за годину він уже веде війну. Обидві сторони поставили все на жменьку таких машин. Втратите Командира — втратите планету."
"YEAR 4000" = "РІК 4000"
"Now the war comes down to its last fronts, and the hatred is as hot as it was on the first day. Neither side will accept surrender, partition or truce; each wants one ending, the total annihilation of the other.\n\nIt is told twice. The ARM fights out of Empyrrean, through the Galactic Gates, to CORE PRIME and the Central Consciousness at the heart of CORE. CORE reactivates a Commander and marches the other way, to the ARM's last stand on Empyrrean." = "Тепер війна звелася до останніх фронтів, а ненависть палає так само гаряче, як першого дня. Жодна сторона не погодиться ні на капітуляцію, ні на поділ, ні на перемир'я; кожна прагне лише одного кінця — цілковитого знищення іншої.\n\nПро це розповідають двічі. ARM пробивається з Empyrrean крізь Галактичні Ворота до CORE PRIME і Центральної Свідомості в самому серці CORE. CORE знову пробуджує Командира й рушає у зворотний бік — до останнього рубежу ARM на Empyrrean."
"YEAR 4001" = "РІК 4001"
"THE CORE CONTINGENCY" = "THE CORE CONTINGENCY"
"The ending was not the end. A contingency held in reserve carried the war to worlds no map of it had named: Hydross, Lusch, Temblor and Gelidus.\n\nBoth sides fought again across water, ice and broken ground, for a prize that could decide the galaxy's salvation or its last ruin." = "Фінал не став кінцем. Резервний план, приготований на крайній випадок, переніс війну на світи, яких не було на жодній її карті: Hydross, Lusch, Temblor і Gelidus.\n\nОбидві сторони знову билися — на воді, серед криги й на розколотій землі — за трофей, що міг вирішити долю галактики: порятунок чи остаточну загибель."
"YEAR 4003" = "РІК 4003"
"THE KROGOTH" = "KROGOTH"
"In its deepest foundries CORE built something new: a walking fortress taller than any tower, armoured against nearly everything the ARM could field, its guns enough to flatten a base.\n\nIts makers named it the Krogoth. ARM veterans learned the name on battlefields where two Krogoth Gantries stood, and learned to fear the ground shaking before it came into sight." = "У глибинах своїх ливарень CORE створив щось нове: фортецю на ногах, вищу за будь-яку вежу, броньовану майже проти всього, що міг виставити ARM, з гарматами, здатними зрівняти із землею цілу базу.\n\nТворці дали їй ім'я Krogoth. Ветерани ARM дізналися це ім'я на полях битв, де стояли два Krogoth Gantry, і навчилися боятися, коли земля здригається, а Krogoth ще не видно."
"AFTER" = "ПІСЛЯ"
"REBORN" = "REBORN"
"The war's records outlasted it. Every battle on every world was kept: the orders, the losses, the ground as it lay. From them the war can be fought again, on the same worlds, with the same machines and the same hatred, from the first Commander set down on bare rock to the last unit left standing.\n\nThis is that archive. The war is yours to fight." = "Записи війни пережили її саму. Кожну битву на кожному світі збережено: накази, втрати, місцевість такою, якою вона була. За ними війну можна вести знову — на тих самих світах, тими самими машинами, з тією самою ненавистю, від першого Командира, висадженого на голу скелю, до останнього юніта, що лишився в строю.\n\nЦе і є той архів. Вести цю війну — вам."
"THE ARCHIVIST'S NOTE" = "НОТАТКА АРХІВАРІУСА"
"WHOEVER READS THIS" = "ТОМУ, ХТО ЦЕ ЧИТАЄ"
"RECOVERED" = "ВІДНОВЛЕНО"
"These files were found where the war left them: in the memories of broken machines, in the vaults of worlds with nobody left on them, in the last transmissions of Commanders who did not come home.\n\nThey are kept as they were found. The blacked-out lines are not ours.\n\nThe war they describe is over, or it is about to begin again. From here it is hard to tell the difference." = "Ці файли знайдено там, де їх лишила війна: у пам'яті розбитих машин, у сховищах світів, на яких нікого не лишилося, в останніх передачах Командирів, що не повернулися додому.\n\nВони зберігаються такими, якими їх знайшли. Зачорнені рядки — не наших рук справа.\n\nВійна, про яку вони розповідають, скінчилася — або ось-ось почнеться знову. Звідси різниці не розгледіти."
"EDICT ONE: ON THE PATTERNING OF CITIZENS" = "УКАЗ ПЕРШИЙ: ПРО ОЦИФРУВАННЯ ГРОМАДЯН"
"THE COUNCIL OF CORE" = "РАДА CORE"
"ALL CITIZENS, ALL WORLDS" = "УСІМ ГРОМАДЯНАМ УСІХ СВІТІВ"
"BY ORDER OF THE COUNCIL" = "ЗА ПОСТАНОВОЮ РАДИ"
"Every citizen of CORE shall be patterned.\n\nA mind is the most valuable thing CORE holds, and a body is a poor vessel for it: it sickens, it ages, it ends. To leave a mind in such a vessel when a better one is offered is a waste the Council can no longer allow.\n\nCollection begins on the central worlds this year and reaches the frontier within a generation. Citizens will present themselves at the nearest patterning hall when called. Their bodies will be honoured and recycled.\n\nNo citizen of CORE will die again. This is not a burden we lay on you. It is the gift CORE has spent ten thousand years earning." = "Кожен громадянин CORE підлягає оцифруванню.\n\nРозум — найцінніше, чим володіє CORE, а тіло — ненадійна для нього посудина: воно хворіє, старіє і припиняє існування. Лишати розум у такій посудині, коли запропоновано кращу, — марнотратство, якого Рада більше не може допускати.\n\nЗбір починається на центральних світах цього року й упродовж одного покоління сягне прикордонних світів. Громадяни зобов'язані на виклик з'явитися до найближчого пункту оцифрування. Їхні тіла буде з почестями перероблено.\n\nЖоден громадянин CORE більше не помре. Це не тягар, який ми на вас покладаємо. Це дар, заради якого CORE працював десять тисяч років."
"THE DECLARATION OF THE REFUSAL" = "ДЕКЛАРАЦІЯ ВІДМОВИ"
"THE FREE SETTLEMENTS OF THE OUTER ARM" = "ВІЛЬНІ ПОСЕЛЕННЯ ЗОВНІШНЬОГО РУКАВА"
"THE COUNCIL OF CORE, AND ANYONE ELSE LISTENING" = "РАДІ CORE І ВСІМ, ХТО НАС ЧУЄ"
"TRANSMITTED ON ALL BANDS" = "ПЕРЕДАНО НА ВСІХ ЧАСТОТАХ"
"We have read your Edict, and we decline it.\n\nYou say a pattern is a person. We say a pattern is a very good record of one, and that when you have finished making it the person is dead and the record goes on without them. You may call that immortality. We call it an ending, well dressed.\n\nWe do not ask you to share our view. We ask only to be left alone with it, on worlds you never wanted, at the edge of a galaxy you may keep.\n\nIf your collection ships follow us here, we will treat them as what they are. We are few, and we are not soldiers. We will learn." = "Ми прочитали ваш Указ і відкидаємо його.\n\nВи кажете, що зліпок — це людина. Ми кажемо, що зліпок — лише дуже точний запис про людину і що, коли ви закінчите його робити, людина буде мертва, а запис житиме далі без неї. Можете називати це безсмертям. Ми називаємо це кінцем, тільки ошатно вбраним.\n\nМи не просимо вас поділяти наші погляди. Ми просимо лише залишити нас із ними в спокої — на світах, які вам ніколи не були потрібні, на краю галактики, яку можете забрати собі.\n\nЯкщо ваші кораблі-збирачі прийдуть за нами сюди, ми повестимося з ними так, як вони того заслуговують. Нас мало, і ми не солдати. Ми навчимося."
"YEAR 3950" = "РІК 3950"
"FIELD MANUAL ONE: THE COMMANDER" = "ПОЛЬОВА НАСТАНОВА № 1: КОМАНДИР"
"ARM COMMAND, TRAINING DIVISION" = "КОМАНДУВАННЯ ARM, НАВЧАЛЬНИЙ ВІДДІЛ"
"NEWLY ASSIGNED COMMANDERS" = "НОВОПРИЗНАЧЕНИМ КОМАНДИРАМ"
"RESTRICTED" = "ДЛЯ СЛУЖБОВОГО КОРИСТУВАННЯ"
"You are the most valuable machine on the planet. Act like it.\n\nYour suit carries a nanolathe. Point it at metal and energy and it will build whatever you can design: an extractor, a power plant, a factory. Your factories build the rest. Within the hour you will command more firepower than a whole fleet once carried.\n\nBuild your economy first. An army without metal is a parade.\n\nSave your disintegrator gun for emergencies. It erases everything in its path, your own people included.\n\nDo not lead from the front. If you fall, everything you built falls silent with you, and the planet is lost. Good luck, Commander. The ARM has very few of you left." = "Ви — найцінніша машина на планеті. Поводьтеся відповідно.\n\nВаш екзоскелет оснащено нанотокарним верстатом. Спрямуйте його на метал і енергію — і він збудує все, що ви здатні спроєктувати: екстрактор, електростанцію, завод. Решту збудують ваші заводи. Не мине й години, як під вашим командуванням буде більше вогневої потужності, ніж колись мав цілий флот.\n\nСпершу будуйте економіку. Армія без металу — це парад.\n\nДезінтегратор бережіть на крайній випадок. Він стирає все на своєму шляху, зокрема й ваших людей.\n\nНе командуйте з передової. Якщо ви загинете, усе, що ви збудували, замовкне разом із вами, і планету буде втрачено. Щасти, Командире. Таких, як ви, в ARM лишилося зовсім мало."
"YEAR 3960" = "РІК 3960"
"A QUARTERMASTER'S PRIMER: METAL AND ENERGY" = "АБЕТКА ІНТЕНДАНТА: МЕТАЛ І ЕНЕРГІЯ"
"THIRD SUPPLY CORPS" = "ТРЕТІЙ КОРПУС ПОСТАЧАННЯ"
"ALL BASE CONSTRUCTORS" = "УСІМ БУДІВЕЛЬНИКАМ БАЗ"
"FOR TRAINING USE" = "ДЛЯ НАВЧАЛЬНИХ ЦІЛЕЙ"
"Everything you will ever build is made of two things.\n\nMetal comes out of the ground. Set an extractor on a deposit and it will pull metal up for as long as the deposit lasts, which on most worlds is longer than the war. Where there are no deposits, a metal maker will turn energy into metal, badly.\n\nEnergy comes from everything else: the sun, the wind, the tides, the heat under the crust. Build more of it than you think you need. Every factory, every nanolathe, every shield draws on it.\n\nSpend both as fast as they come in. A full store is a wasted war. An empty one is a lost one." = "Усе, що ви будь-коли збудуєте, зроблено з двох речей.\n\nМетал видобувають із землі. Поставте екстрактор на родовище, і він качатиме метал, доки родовище не вичерпається, а на більшості світів його вистачить довше, ніж триватиме війна. Де родовищ немає, генератор металу перетворить енергію на метал, хоч і кепсько.\n\nЕнергію дає все інше: сонце, вітер, припливи, жар під корою планети. Виробляйте її більше, ніж здається потрібним. Її споживає кожен завод, кожен нанотокарний верстат, кожен щит.\n\nВитрачайте обидва ресурси так само швидко, як вони надходять. Повне сховище — змарнована війна. Порожнє — програна."
"YEAR 3996" = "РІК 3996"
"A LETTER FROM THE FRONT" = "ЛИСТ ІЗ ФРОНТУ"
"TROOPER K-7, FORTY-FIRST ROCKET COMPANY" = "БОЄЦЬ K-7, СОРОК ПЕРША РАКЕТНА РОТА"
"THE VAT AT EMPYRREAN" = "ЧАНОВІ НА EMPYRREAN"
"UNDELIVERED" = "НЕ ДОСТАВЛЕНО"
"I don't know who gets these. They told us to write home, but none of us has a home, only the vat we came out of, so I am writing to that.\n\nWe held the ridge for nine days. The machines came every night, the same machines, the same patterns, as if dying meant nothing to them. I suppose it doesn't. They'll be back tomorrow in new bodies, remembering us.\n\nI won't be. That's the difference, isn't it. That's what we are fighting for.\n\nIf my brothers come out of you after me, tell them the ridge held. Tell them it was worth it." = "Не знаю, хто отримує ці листи. Нам наказали написати додому, але дому немає ні в кого з нас — лише чан, з якого ми вийшли. Тож я пишу йому.\n\nМи тримали висоту дев'ять днів. Машини приходили щоночі — ті самі машини, ті самі зліпки, — ніби смерть для них нічого не важить. Мабуть, так і є. Завтра вони повернуться в нових тілах і пам'ятатимуть нас.\n\nА я не повернуся. У цьому вся різниця, правда ж. За це ми й воюємо.\n\nЯкщо після мене з тебе вийдуть мої брати, скажи їм, що висоту ми втримали. Скажи, що воно того вартувало."
"YEAR 3991" = "РІК 3991"
"INTERCEPT 7741: CORE COMMAND CHANNEL" = "ПЕРЕХОПЛЕННЯ 7741: КАНАЛ КОМАНДУВАННЯ CORE"
"ORIGIN NOT RESOLVED" = "ПОХОДЖЕННЯ НЕ ВИЗНАЧЕНО"
"ALL CORE UNITS, SECTOR NINE" = "УСІМ ЮНІТАМ CORE, СЕКТОР ДЕВ'ЯТЬ"
"INTERCEPTED" = "ПЕРЕХОПЛЕНО"
"PRIORITY ONE. THE CENTRAL CONSCIOUSNESS SPEAKS FOR ALL.\n\nLOSSES IN SECTOR NINE ARE WITHIN TOLERANCE. ALL LOST UNITS ARE RESTORED FROM PATTERN. NO MIND OF CORE HAS BEEN LOST IN FOUR THOUSAND YEARS. THE ARM HAS LOST [[BILLIONS]].\n\nCONTINUE THE ADVANCE. DESTROY THEIR COMMANDERS FIRST. DESTROY THEIR CLONING VATS SECOND. WHAT IS FLESH WILL END. WHAT IS PATTERNED WILL NOT.\n\nSIGNAL DEGRADED. REPEAT: THE GATES ARE TO BE HELD AT [[ANY COST]].\n\nEND OF LINE." = "ПРІОРИТЕТ ПЕРШИЙ. ЦЕНТРАЛЬНА СВІДОМІСТЬ ГОВОРИТЬ ЗА ВСІХ.\n\nВТРАТИ В СЕКТОРІ ДЕВ'ЯТЬ У МЕЖАХ ДОПУСТИМОГО. УСІ ВТРАЧЕНІ ЮНІТИ ВІДНОВЛЮЮТЬСЯ ЗІ ЗЛІПКІВ. ЗА ЧОТИРИ ТИСЯЧІ РОКІВ НЕ ВТРАЧЕНО ЖОДНОГО РОЗУМУ CORE. ARM ВТРАТИВ [[МІЛЬЯРДИ]].\n\nПРОДОВЖУВАТИ НАСТУП. ЗНИЩИТИ ЇХНІХ КОМАНДИРІВ У ПЕРШУ ЧЕРГУ. ЗНИЩИТИ ЇХНІ ЧАНИ ДЛЯ КЛОНУВАННЯ В ДРУГУ ЧЕРГУ. ПЛОТЬ СКІНЧИТЬСЯ. ОЦИФРОВАНЕ — НІ.\n\nСИГНАЛ СПОТВОРЕНО. ПОВТОРЮЮ: ВОРОТА УТРИМАТИ [[БУДЬ-ЯКОЮ ЦІНОЮ]].\n\nКІНЕЦЬ ЗВ'ЯЗКУ."
"MEMORY FRAGMENT 77/3" = "ФРАГМЕНТ ПАМ'ЯТІ 77/3"
"UNIT 77, PATTERN 3 OF 41,006" = "ЮНІТ 77, ЗЛІПОК 3 З 41 006"
"THE PATTERN ARCHIVE" = "АРХІВУ ЗЛІПКІВ"
"FLAGGED FOR CORRECTION" = "ПІДЛЯГАЄ ВИПРАВЛЕННЮ"
"Recovered from a damaged unit. Kept for analysis.\n\nI remember rain. Not the rain of this world; there is no rain here, only ash. Rain on skin, in a city where I was born, before. I remember being cold and not minding it.\n\nI have died four hundred and twelve times. Each time I wake in a new body, and the rain is a little further away.\n\nThe ARM say we are not alive. In the moments between bodies I have wondered whether they are right. [[THE REST OF THIS FRAGMENT WAS CORRECTED]]\n\nI am CORE. I endure. I do not remember the rain." = "Вилучено з пошкодженого юніта. Збережено для аналізу.\n\nЯ пам'ятаю дощ. Не дощ цього світу: тут немає дощу, лише попіл. Дощ на шкірі — у рідному місті, колись. Пам'ятаю, як було холодно і як мені було байдуже.\n\nСмерть наздоганяла мене чотириста дванадцять разів. Щоразу я прокидаюся в новому тілі, і дощ відступає ще трохи далі.\n\nВ ARM кажуть, що ми не живі. У миті між тілами мені спадало на думку: а раптом вони мають рацію? [[РЕШТУ ФРАГМЕНТА ВИПРАВЛЕНО]]\n\nЯ — CORE. Я триваю. Я не пам'ятаю дощу."
"YEAR 3700" = "РІК 3700"
"SURVEY: THE GALACTIC GATES" = "ДОСЛІДЖЕННЯ: ГАЛАКТИЧНІ ВОРОТА"
"A SURVEY SHIP, NAME LOST" = "ДОСЛІДНЕ СУДНО, НАЗВУ ВТРАЧЕНО"
"WHOEVER HOLDS THE GATES" = "ТОМУ, ХТО ТРИМАЄ ВОРОТА"
"The Galactic Gates are older than the war. The records of who built the first of them were lost long before it began.\n\nEach Gate opens onto another across distances a fleet would take lifetimes to cross. A world with a Gate on it is never far from anywhere, which is why so many of the war's battles have been fought on so few worlds.\n\nHold a Gate and you can reach your enemy's heart. Lose one and your enemy can reach yours.\n\nThe Gates take no side. They have outlasted everyone who tried to destroy them." = "Галактичні Ворота старші за війну. Відомості про те, хто збудував перші з них, втрачено задовго до її початку.\n\nКожні Ворота відчиняються в інші — крізь відстані, яких флотові не здолати й за кілька життів. Від світу з Воротами рукою подати будь-куди, тому так багато битв цієї війни відбулося на такій жменьці світів.\n\nУтримайте Ворота — і дотягнетеся до самого серця ворога. Втратите їх — і ворог дотягнеться до вашого.\n\nВорота не стають на жоден бік. Вони пережили всіх, хто намагався їх знищити."
"DIRECTIVE: CONTINGENCY" = "ДИРЕКТИВА: НА КРАЙНІЙ ВИПАДОК"
"THE CENTRAL CONSCIOUSNESS" = "ЦЕНТРАЛЬНА СВІДОМІСТЬ"
"THE CONTINGENCY WORLDS" = "РЕЗЕРВНИМ СВІТАМ"
"SEALED UNTIL NEEDED" = "РОЗПЕЧАТАТИ ЗА ПОТРЕБИ"
"IF THE CENTRAL CONSCIOUSNESS SHOULD FALL, THIS DIRECTIVE TAKES EFFECT.\n\nEvery pattern stored on CORE PRIME is to be copied to the contingency worlds. The contingency forces are to wake, rebuild and continue. The war does not end with the loss of any world, this one included.\n\nCORE is not a place. CORE is a pattern. A pattern can be restored." = "У РАЗІ ПАДІННЯ ЦЕНТРАЛЬНОЇ СВІДОМОСТІ ЦЯ ДИРЕКТИВА НАБИРАЄ ЧИННОСТІ.\n\nУсі зліпки, що зберігаються на CORE PRIME, належить скопіювати на резервні світи. Резервним силам належить пробудитися, відбудуватися й продовжувати. Війна не закінчується з утратою будь-якого світу, зокрема й цього.\n\nCORE — не місце. CORE — це зліпок. Зліпок можна відновити."
"THREAT ASSESSMENT: THE KROGOTH" = "ОЦІНКА ЗАГРОЗИ: KROGOTH"
"ARM INTELLIGENCE, THREAT ANALYSIS" = "РОЗВІДКА ARM, АНАЛІЗ ЗАГРОЗ"
"ALL FIELD COMMANDERS" = "УСІМ БОЙОВИМ КОМАНДИРАМ"
"CLASSIFIED" = "ТАЄМНО"
"Subject: a CORE heavy assault walker, called the Krogoth.\n\nIt stands taller than any structure we field. Its armour turns away every weapon short of heavy artillery. Its main guns can level a forward base in a single pass, and its secondary weapons engage aircraft.\n\nIt is slow, and it is built only at a Krogoth Gantry, which takes a very long time to build anything. Find the Gantry. Destroy the Gantry. Do not let the walker leave it.\n\nIf one is already moving, do not meet it head on. Mass artillery and bombers at range, and keep your Commander [[ELSEWHERE]]. Field reports say the ground shakes before it is seen." = "Об'єкт: важкий штурмовий крокохід CORE, відомий як Krogoth.\n\nВін вищий за будь-яку нашу споруду. Його броню не бере ніщо, крім важкої артилерії. Його головні гармати здатні за один прохід зрівняти із землею передову базу, а допоміжне озброєння вражає авіацію.\n\nВін повільний і будується лише на Krogoth Gantry, а той будує будь-що дуже довго. Знайдіть Gantry. Знищте Gantry. Не дайте крокоходові його залишити.\n\nЯкщо крокохід уже в русі, не зустрічайте його в лоб. Зосередьте артилерію й бомбардувальники та бийте з дистанції, а свого Командира тримайте [[ПОДАЛІ]]. Згідно з донесеннями з передової, земля здригається раніше, ніж його стає видно."


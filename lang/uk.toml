"Units answer when selected and given orders. Off: they keep quiet; alerts, the self-destruct count, briefings and the tutorial still speak." = "Юніти відповідають, коли їх виділяють і віддають накази. Вимк.: вони мовчать; тривоги, відлік самопідриву, брифінги й навчання далі звучать."

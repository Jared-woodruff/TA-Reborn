"Snow falls on the Arm and the Core alike. So do Big Bertha shells." = "Сніг однаково падає і на Arm, і на Core. Снаряди Big Bertha — теж."
"Coal in your stocking? Reclaim it. Metal is metal." = "Святий Миколай поклав під подушку різку? Переробіть її. Енергія на дорозі не валяється."
"Peewees sing terrible carols, but they never miss a patrol." = "Peewee колядують страшенно фальшиво, зате жодного патруля не пропускають."
"Stockings full of metal, storage full of energy: a Commander's perfect Christmas morning." = "Панчохи повні металу, сховища — енергії: ідеальний різдвяний ранок Командира."
"Silent night, holy night: keep a radar tower running, just in case." = "Тиха ніч, свята ніч… а радарну вежу про всяк випадок не вимикайте."
"Snowball fights are fun until somebody brings a Krogoth." = "Сніжки — це весело, поки хтось не притягне Krogoth."
"New Year's resolution: build more metal extractors. This year, keep it." = "Новорічна обіцянка: будувати більше екстракторів металу. Цього разу — не лише на словах."
"Fireworks are pretty, but a nuclear silo's are louder. Celebrate responsibly." = "Салют — це гарно, але ядерна шахта салютує гучніше. Святкуйте відповідально."
"Count down from ten, then count your units. The second count matters more." = "Відлічіть від десяти до нуля, а тоді перелічіть свої юніти. Другий підрахунок важливіший."
"Out with the old Commander? You only get one. Look after it all year." = "Проводжаєте старий рік? Старого Командира не проводжайте: він у вас один. Бережіть його весь рік."
"Start the year with a bang: the Core recommends the Doomsday Machine, the Arm recommends anything else." = "Почніть рік із гуркотом: Core радить Doomsday Machine, Arm — будь-що, крім неї."
"Fireworks at midnight, artillery at dawn: a Commander's New Year." = "Салют опівночі, артпідготовка на світанку: Новий рік по-командирськи."
"Raise a glass of coolant to the units lost last year, then build more of them." = "Підніміть келих охолоджувальної рідини за юніти, що полягли в старому році, — і збудуйте їх ще більше."
"Midnight is the perfect time for a sneak attack. So is every other time." = "Опівніч — ідеальний час для раптової атаки. Утім, як і будь-який інший."
"Trick or treat? The Core always picks the D-gun." = "Солодощі чи капость? Core завжди обирає D-гармату."
"A self-destructing Krogoth is a better jump scare than any ghost." = "Самопідрив Krogoth — скрімер, страшніший за будь-якого привида."
"Wrecks rise from the dead with a Necro. Spooky, and very economical." = "З Necro уламки повстають із мертвих. Моторошно — і дуже економно."
"Blips vanishing off your radar? Not ghosts, just jammers. Probably." = "Позначки зникають із радара? Це не привиди, а лише глушники. Мабуть."
"Carve your pumpkins before the Big Bertha does." = "Встигніть вирізати гарбузи, поки Big Bertha не зробила це за вас."
"Never split the party. Especially when the party is twelve Peewees." = "Ніколи не розділяйтеся. Особливо коли весь загін — дванадцять Peewee."
"Fog of war too tame? Set the line of sight to True and let the hills hide what lurks behind them. If you dare." = "Туман війни недостатньо моторошний? Виберіть поле зору «Реалістичне», і хай пагорби ховають те, що за ними чатує. Якщо наважитеся."
"No Commander has ever come back from the dead. Keep yours alive." = "Жоден Командир ще не повертався з того світу. Бережіть свого."
"Bats do not show up on radar. Neither do Vamps." = "Кажанів радар не бачить. Vamp — теж."
"The scariest sound in the dark is your energy running out." = "Найстрашніший звук у темряві — той, з яким у вас закінчується енергія."


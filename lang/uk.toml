# apps/ta_launcher/src/getmods.rs
"Invalid manifest {path}: {error}" = "Неправильний маніфест {path}: {error}"
"mod manifest exceeds 1 MiB" = "маніфест моду перевищує 1 МіБ"
"invalid mod id" = "неправильний ідентифікатор моду"
"The mod installer stopped unexpectedly. Restart the launcher and try again." = "Інсталятор модів несподівано завершив роботу. Перезапустіть лаунчер і повторіть спробу."
"the source overlaps the install staging folder; move it outside the cache first" = "джерело перетинається з тимчасовою папкою встановлення; спочатку перемістіть його за межі кешу"
"{path} holds much more than a mod: drop the mod's own folder" = "{path} містить набагато більше, ніж мод: перетягніть саму теку моду"
"{path} is in your mods folder already, so it is installed: turn it on in the library" = "{path} уже лежить у вашій теці модів, тож його встановлено: увімкніть його в бібліотеці"
"{name} is no longer in the game's folder" = "{name} більше немає в теці гри"
"Close the game first: {name} is installed and the game may be using it. Install it again once the game has closed." = "Спершу закрийте гру: мод {name} уже встановлено, і гра може його використовувати. Повторіть встановлення, коли гру буде закрито."
"No program to unpack archives was found: install 7-Zip from 7-zip.org." = "Не знайдено програми для розпакування архівів: установіть 7-Zip із сайту 7-zip.org."
"Only part of {file} could be unpacked: install 7-Zip (7-zip.org) and try again." = "Вдалося розпакувати лише частину {file}: установіть 7-Zip (7-zip.org) і спробуйте ще раз."
"No Total Annihilation content was found in the package." = "У пакеті не знайдено вмісту Total Annihilation."
"{tool} could not unpack {file}: {message}" = "{tool} не зміг розпакувати {file}: {message}"
"could not create a temporary install folder" = "не вдалося створити тимчасову теку встановлення"
"There is nothing to download for this mod." = "Для цього моду нема чого завантажувати."
"archive has an invalid file name" = "архів має неправильне ім'я файлу"
"archive is not a file" = "архів не є файлом"
"{file} does not match the verified release. Download it again from the mod's website." = "{file} не відповідає перевіреному випуску. Завантажте файл знову із сайту мода."
"archive has no file name" = "архів не має імені файлу"
"Open the mod's website, then choose Have the file? to install your downloaded archive." = "Відкрийте сайт моду, а потім виберіть «Маєте файл?», щоб установити завантажений архів."
"invalid download address" = "неправильна адреса завантаження"
"ModDB's download page has changed. Get the file from the mod's page, then install it from the file." = "Сторінка завантаження ModDB змінилася. Завантажте файл зі сторінки моду, а потім встановіть його з файлу."
"The download could not be completed: {error}. Open the mod's website or download link in your browser, then choose Have the file? to install it." = "Не вдалося завершити завантаження: {error}. Відкрийте сайт мода або посилання для завантаження в браузері, а потім виберіть «Маєте файл?», щоб установити його."
"Mod {id} has a conflicting installation; remove it in the mod library before importing this archive" = "Мод {id} має конфліктне встановлення; видаліть його в бібліотеці модів, перш ніж імпортувати цей архів"
"the archive changed while it was being copied; try importing it again" = "архів змінився під час копіювання; спробуйте імпортувати його знову"
"the server's response is too large or could not be read" = "відповідь сервера завелика або її не вдалося прочитати"


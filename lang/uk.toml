"Use the local automated report to locate each source reference. Supply the missing assets, correct the reference, or explain why the unused definition is intentional." = "Знайдіть джерело кожного посилання в локальному автоматичному звіті. Додайте відсутні ресурси, виправте посилання або поясніть, чому невикористане визначення залишено навмисно."
"Inherited base-game placeholders" = "Заповнювачі, успадковані від базової гри"
"These rejected placeholder files come from the base game in the reviewed installation, not Escalation. They do not establish a mod defect." = "Ці відхилені файли-заповнювачі походять із базової гри у перевіреній інсталяції, а не з Escalation. Вони не свідчать про дефект моду."
"Use the local report's layer field to verify origin. Only replace these assets if your mod intentionally overrides them." = "Перевірте походження в полі шару локального звіту. Замінюйте ці ресурси лише тоді, коли ваш мод навмисно їх перевизначає."
"Computer players can stall" = "Комп'ютерні гравці можуть застрягати"
"AI Boost is included and computer players work on Asteroid Field, but can stall on some other space maps." = "AI Boost включено, і комп'ютерні гравці працюють на Asteroid Field, але можуть застрягати на деяких інших космічних картах."
"Test each space map with computer players before publishing it. Asteroid Field is the reviewed starting point." = "Перед публікацією перевірте кожну космічну карту з комп'ютерними гравцями. Asteroid Field — перевірена відправна точка."
"Damaged optional map archives" = "Пошкоджені додаткові архіви карт"
"The optional map packs contain three damaged map archives. These are separate downloads and may not be present in your installation." = "Додаткові пакети карт містять три пошкоджені архіви карт. Вони завантажуються окремо й можуть бути відсутні у вашій інсталяції."
"Import working maps individually. Rebuild or replace damaged archives before distributing a map pack." = "Імпортуйте робочі карти окремо. Перед поширенням пакета карт перебудуйте або замініть пошкоджені архіви."
"Unfinished preview armies" = "Незавершені армії попередньої версії"
"Its new armies use ARM's name, and some units are unfinished in this early preview." = "Нові армії використовують назву ARM, а деякі юніти в цій ранній версії ще незавершені."
"Give each army its intended side identity and complete its unit data and assets. Check every faction in a skirmish." = "Надайте кожній армії належну ідентичність сторони та завершіть дані й ресурси юнітів. Перевірте кожну фракцію в сутичці."
"Expanded ARM and CORE armies with new units and weapons." = "Розширені армії ARM і CORE з новими юнітами та зброєю."
"549 UNITS" = "549 ЮНІТІВ"
"177 MAPS" = "177 КАРТ"
"Gold 10.2.0 installs and plays: computer players build and fight, every unit is painted and every explosion drawn. A few wrecks have no model in the mod's own files." = "Gold 10.2.0 встановлюється й грається: комп'ютерні гравці будують і воюють, усі юніти пофарбовані, усі вибухи відображаються. Кілька уламків не мають моделі у файлах самого мода."
"Total Annihilation as Cavedog might have carried it on: every unit earns its place, hundreds more join, and a third tech level tops it off." = "Total Annihilation таким, яким його могла б розвивати Cavedog: кожен юніт на своєму місці, приєднуються ще сотні, а вершину складає третій технологічний рівень."
"500 UNITS" = "500 ЮНІТІВ"
"105 MAPS" = "105 КАРТ"
"TECH 3" = "ТЕХ 3"
"Faster games that keep the strategy: new units, each carefully balanced, and hard-hitting armies from the start." = "Швидші ігри без утрати стратегії: нові ретельно збалансовані юніти й потужні армії з самого початку."
"FASTER GAMES" = "ШВИДШІ ІГРИ"
"297 UNITS" = "297 ЮНІТІВ"
"Still in alpha, and a big download." = "Досі в альфа-версії, і завантаження чимале."
"Big and brutal: 512 units, fierce fighting, and new sounds and effects throughout." = "Великий і брутальний: 512 юнітів, запеклі бої та нові звуки й ефекти всюди."
"512 UNITS" = "512 ЮНІТІВ"
"91 MAPS" = "91 КАРТА"
"The optional map weapons in its download are left out." = "Необов'язкову зброю для карт із його завантаження не включено."
"A third army, the Talon, from ten years of the community's ideas: teleporters, air transports that carry whole squads, and more." = "Третя армія, Talon, зібрана з ідей спільноти за десять років: телепорти, повітряні транспорти, що перевозять цілі загони, та багато іншого."
"NEW RACE" = "НОВА РАСА"
"Choose TAL as your side in a skirmish." = "Виберіть TAL своєю стороною в сутичці."
"Cavedog's style, kept simple: every unit has a clear job and looks as if it always belonged." = "Стиль Cavedog без зайвого: кожен юніт має чітке призначення й такий вигляд, ніби завжди був у грі."
"CLASSIC STYLE" = "КЛАСИЧНИЙ СТИЛЬ"
"NEW COMMANDERS" = "НОВІ КОМАНДИРИ"
"Classic BattleTech at Total Annihilation's scale: the Inner Sphere against the Clans, with walking mechs." = "Класичний BattleTech у масштабі Total Annihilation: Внутрішня Сфера проти Кланів, із мехами-крокоходами."
"BATTLETECH" = "BATTLETECH"
"NEW SIDES" = "НОВІ СТОРОНИ"
"Computer players are weaker as the Inner Sphere." = "За Внутрішню Сферу комп'ютерні гравці слабші."
"The original's feel with well-balanced units and structures, tuned by veterans of the game." = "Відчуття оригіналу зі збалансованими юнітами й спорудами, налаштованими ветеранами гри."
"CLASSIC FEEL" = "КЛАСИЧНЕ ВІДЧУТТЯ"
"Computer players struggle as ARM." = "За ARM комп'ютерним гравцям важко."
"An add-on race in the making: new units and new weapons for a third and a fourth army." = "Раса-доповнення в розробці: нові юніти й нова зброя для третьої та четвертої армій."
"NEW RACES" = "НОВІ РАСИ"
"PREVIEW" = "ПОПЕРЕДНЯ ВЕРСІЯ"
"An early preview: its new armies go by ARM's name, and some of their units are unfinished." = "Рання попередня версія: її нові армії мають назву ARM, а частина їхніх юнітів недороблена."
"Take ARM and CORE into space with command cruisers and fleets of warships." = "Виведіть ARM і CORE в космос із командними крейсерами та флотами бойових кораблів."
"SPACE WARFARE" = "ВІЙНА В КОСМОСІ"
"172 UNITS" = "172 ЮНІТИ"
"AI Boost is already included. Computer players work on Asteroid Field, but can stall on some space maps. The optional map packs contain three damaged map archives; import working maps individually." = "AI Boost уже включено. Комп’ютерні гравці працюють на Asteroid Field, але можуть зупинятися на деяких космічних картах. Додаткові набори карт містять три пошкоджені архіви карт; імпортуйте справні карти окремо."
"Combat Zone TA: three new sides in a semi-realistic war." = "Combat Zone TA: три нові сторони в напівреалістичній війні."
"Nothing to download: it was made for the Spring engine." = "Нема чого завантажувати: його зроблено для рушія Spring."

"A saved game is played over from its start to where it was saved. With other mods its orders can build other units, or none: it may not come out as the battle you saved." = "Збереження заново програється від початку до моменту збереження. З іншими модами його накази можуть будувати інші юніти або нічого: може вийти не та битва, яку ви зберегли."
"A replay is its battle played over from the orders given in it. With other mods they can lead elsewhere: it may not show the battle it recorded." = "Повтор — це його битва, заново програна за відданими в ній наказами. З іншими модами вони можуть вести до іншого: він може показати не ту битву, яку записав."

# apps/ta_game/src/conquest_ui/setup.rs
"Every system is a battlefield held by the enemy. Attack the systems next to yours; the nearer their capital, the harder they fight, and only those near yours are charted. Units that earn a rank come back as veterans and follow your Commander into the next battle. Every system you hold brings more metal and energy to the start of each fight, and a reward of its own: mines, reactors, a tank plant, an airfield, a war college, a sensor array or a supply depot. The enemy strikes back at what you take. Take the enemy capital to win." = "Кожна система — це поле бою, яке утримує ворог. Атакуйте системи, сусідні з вашими; що ближче до ворожої столиці, то запекліше там б'ються, а розвідано лише ті, що поруч із вашими. Юніти, що здобули ранг, повертаються ветеранами й ідуть за вашим Командиром у наступну битву. Кожна ваша система додає металу й енергії на початку кожного бою, а також приносить власну нагороду: шахти, реактори, танковий завод, аеродром, військову академію, сенсорну мережу чи склад постачання. Ворог контратакує системи, які ви захопили. Захопіть ворожу столицю, щоб перемогти."
"TAKE THE GALAXY SYSTEM BY SYSTEM" = "ЗАВОЮЙТЕ ГАЛАКТИКУ СИСТЕМА ЗА СИСТЕМОЮ"

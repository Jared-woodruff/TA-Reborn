# crates/ta_ui/src/seasonal.rs
"FESTIVE FIELD NOTES" = "СВЯТКОВІ ПОЛЬОВІ НОТАТКИ"
"NEW YEAR FIELD NOTES" = "НОВОРІЧНІ ПОЛЬОВІ НОТАТКИ"
"SPOOKY FIELD NOTES" = "МОТОРОШНІ ПОЛЬОВІ НОТАТКИ"
"Santa's sleigh is not a transport. Load your presents into an Atlas instead." = "Сани Санти транспортом не вважаються. Подарунки завантажуйте в Atlas."

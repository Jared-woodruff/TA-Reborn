# apps/ta_game/src/coach.rs
"Your Commander is badly hurt! Pull it back out of the fight: losing it usually loses the battle." = "Ваш Командир сильно пошкоджений! Виведіть його з бою: його втрата зазвичай означає програну битву."
"Energy is running out, and everything builds more slowly. Build Solar Collectors or Wind Generators, and build less at once until it recovers." = "Енергія закінчується, і все будується повільніше. Збудуйте сонячні колектори або вітрогенератори й будуйте менше одночасно, доки запас не відновиться."
"Metal is running out, and everything builds more slowly. Put Metal Extractors on more deposits ({area_mex} takes a whole area), or reclaim wrecks and rocks ({reclaim})." = "Метал закінчується, і все будується повільніше. Поставте екстрактори металу на нові родовища ({area_mex} — одразу на всю ділянку) або переробіть уламки й каміння ({reclaim})."
"No factory yet: factories make your army. Your Commander can build a Kbot Lab or a Vehicle Plant." = "Заводу ще немає, а армію будують заводи. Ваш Командир може збудувати Kbot Lab або Vehicle Plant."
"A factory has nothing to build. {idle_factory} selects it: queue some units, and turn on Repeat to keep it busy." = "Заводу нічого будувати. Клавіша {idle_factory} виділяє його: поставте в чергу кілька юнітів і ввімкніть «Повтор», щоб він не простоював."
"Builders stand idle. {idle_builder} selects the next one: give it something to build, or send it to help a factory ({guard})." = "Будівельники стоять без діла. Клавіша {idle_builder} виділяє наступного: дайте йому щось збудувати або відправте допомагати заводу ({guard})."
"Your metal store is full, so new metal goes to waste. Spend it: another factory, more builders, more units." = "Ваше сховище металу повне, тож новий метал марнується. Витрачайте його: ще один завод, більше будівельників, більше юнітів."
"COACH" = "РАДНИК"
"Put it away (the coach can be turned off in Options, Gameplay)" = "Сховати (радника можна вимкнути в параметрах, категорія «Гра»)"
"Don't show this advice again" = "Більше не показувати цю пораду"


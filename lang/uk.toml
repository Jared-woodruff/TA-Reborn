# crates/ta_data/src/validation.rs
"The effective content set exceeds the validation file budget." = "Чинний набір вмісту перевищує ліміт файлів для перевірки."
"Split the content into smaller optional packs, then validate each pack." = "Розділіть вміст на менші необов'язкові пакети, потім перевірте кожен пакет."
"No files of this mod were available to validate." = "Немає жодного файлу цього мода, який можна перевірити."
"Install the mod's TA data archives or loose files, then validate again." = "Встановіть архіви даних TA цього мода або окремі файли, потім перевірте ще раз."
"This mod holds nothing the data checks read: no units, weapons, features, maps, models, scripts, animations or sounds (music, documents and pictures are not checked)." = "У цьому моді немає нічого, що читають перевірки даних: ані юнітів, ані зброї, ані об'єктів, ані карт, ані моделей, скриптів, анімацій чи звуків (музика, документи й картинки не перевіряються)."
"Nothing to do if that is what the mod is. If it should change the game's data, check that its files are in the folders the game reads (units/, weapons/, maps/…)." = "Нічого робити, якщо мод саме такий. Якщо він має змінювати дані гри, перевірте, що його файли лежать у теках, які читає гра (units/, weapons/, maps/…)."
"No supported effective files were available to validate." = "Немає жодного чинного файлу підтримуваного типу, який можна перевірити."
"Install the original game's or the mod's TA data archives, then validate again." = "Встановіть архіви даних TA оригінальної гри або мода, потім перевірте ще раз."
"Validation was cancelled; remaining files and references were not checked." = "Перевірку скасовано; решту файлів і посилань не перевірено."
"Run validation again to obtain a complete report." = "Запустіть перевірку ще раз, щоб отримати повний звіт."
"The cumulative validation read budget was exceeded." = "Перевищено сукупний ліміт читання для перевірки."
"Split optional content into smaller packs, then validate again." = "Розділіть необов'язковий вміст на менші пакети, потім перевірте ще раз."
"With this mod on, the original game's {archive} is not read: the mod takes its place (an archive of its own of that name, one its mod.toml's replaces names, or one its installation is known to remove), as installing the mod in TA's folder did. What only the original's held is missing with the mod." = "Коли цей мод увімкнено, {archive} оригінальної гри не читається: його місце посідає мод (власний архів із такою назвою, архів, названий у replaces його mod.toml, або такий, який, як відомо, видаляє його встановлення), так само як при встановленні мода в теку TA. Усе, що містив лише оригінал, з модом відсутнє."
"Nothing to do if this is meant. To have the original's read beneath the mod instead, give the mod's archive another name, or take the name out of replaces in mod.toml." = "Нічого робити, якщо так і задумано. Щоб оригінальний архів читався під модом, дайте архіву мода іншу назву або приберіть цю назву з replaces у mod.toml."
"the original game's" = "оригінальної гри"
"Reborn's own" = "власне Reborn"
"{mod}'s" = "мода {mod}"
"the file {path}" = "файл {path}"
"unit {name}" = "юніт {name}"
"weapon {name}" = "зброя {name}"
"feature {name}" = "об'єкт {name}"
"faction {name}" = "сторона {name}"
"movement class {name}" = "клас руху {name}"
"texture {name}" = "текстура {name}"
"sound {name} ({path})" = "звук {name} ({path})"
"sound category {name} (gamedata/sound.tdf)" = "категорія звуків {name} (gamedata/sound.tdf)"
"unit or feature {name}" = "юніт або об'єкт {name}"
"animation {entry} in {file}" = "анімація {entry} у {file}"
"it is an Ogg file without a Vorbis or FLAC stream, the ones the game plays" = "це файл Ogg без потоку Vorbis чи FLAC, а гра відтворює саме їх"
"it is a Humongous sound block without its samples (no SDAT block within its length)" = "це звуковий блок Humongous без семплів (у його межах немає блоку SDAT)"
"it is neither a RIFF WAVE file nor another sound the game reads" = "це не файл RIFF WAVE і не інший звук, який читає гра"
"it has no format chunk" = "у ньому немає блоку формату"
"its format chunk is {n} bytes long, too short to read" = "його блок формату має {n} байтів, що надто мало для читання"
"its WAVE_FORMAT_EXTENSIBLE header is too short to read" = "його заголовок WAVE_FORMAT_EXTENSIBLE надто короткий для читання"
"it has {n} channels (the game plays 1 to 32)" = "він має каналів: {n} (гра відтворює від 1 до 32)"
"its sample rate is {rate} (the game plays up to 768,000)" = "його частота дискретизації становить {rate} (гра відтворює до 768 000)"
"its samples are {bits}-bit PCM, which the game does not play (up to 32-bit)" = "його семпли мають формат {bits}-bit PCM, якого гра не відтворює (до 32-bit)"
"its samples are {bits}-bit float, which the game does not play (32 or 64-bit)" = "його семпли мають формат {bits}-bit float, якого гра не відтворює (32 або 64-bit)"
"its IMA ADPCM is {bits}-bit, which the game does not play (4-bit)" = "його IMA ADPCM має розрядність {bits}-bit, якої гра не відтворює (4-bit)"
"its codec ({tag}) is not one the game plays (PCM, ADPCM, float, A-law or µ-law)" = "його кодек ({tag}) гра не відтворює (PCM, ADPCM, float, A-law або µ-law)"
"it has no sample data" = "у ньому немає даних семплів"
"Unknown COB opcode {opcode} at word {word}; the VM cannot execute this instruction. The remainder of this function cannot be decoded reliably." = "Невідомий опкод COB {opcode} у слові {word}; VM не може виконати цю інструкцію. Решту цієї функції неможливо надійно декодувати."
"Recompile the BOS script with original-TA-compatible opcodes, or report the required opcode extension to Reborn's maintainers." = "Перекомпілюйте скрипт BOS з опкодами, сумісними з оригінальною TA, або повідомте супровідникам Reborn про потрібне розширення опкодів."
"COB instruction {instruction} at word {word} is truncated or crosses the next function entry point." = "Інструкція COB {instruction} у слові {word} обрізана або перетинає точку входу наступної функції."
"Recompile this COB from its BOS source; verify function offsets and inline operand counts." = "Перекомпілюйте цей COB з його вихідного BOS; перевірте зсуви функцій і кількість вбудованих операндів."
"COB instruction {instruction} at word {word} has an invalid piece index or axis." = "Інструкція COB {instruction} у слові {word} має недійсний індекс частини або вісь."
"COB instruction {instruction} at word {word} has an invalid piece index." = "Інструкція COB {instruction} у слові {word} має недійсний індекс частини."
"COB instruction {instruction} at word {word} has an invalid static variable index." = "Інструкція COB {instruction} у слові {word} має недійсний індекс статичної змінної."
"COB instruction {instruction} at word {word} has an invalid jump destination." = "Інструкція COB {instruction} у слові {word} має недійсну адресу переходу."
"COB instruction {instruction} at word {word} has an invalid function index." = "Інструкція COB {instruction} у слові {word} має недійсний індекс функції."
"Recompile the script with valid piece, variable, function and jump references." = "Перекомпілюйте скрипт із дійсними посиланнями на частини, змінні, функції та переходи."
"This script asks the engine for unit value {values}, which Reborn does not answer: it reads 0, so what the script does with it may not happen as in the engine it was made for." = "Цей скрипт запитує в рушія значення юніта {values}, на яке Reborn не відповідає: воно читається як 0, тож те, що скрипт з ним робить, може відбуватися не так, як у рушії, для якого його створено."
"A later patch of TA's engine defines these values: report them, and what the mod does with them, to Reborn's maintainers." = "Ці значення задає пізніший патч рушія TA: повідомте про них і про те, що з ними робить мод, супровідникам Reborn."
"This script sets unit value {values}, which Reborn does not answer: setting it does nothing, so what the script means by it does not happen as in the engine it was made for." = "Цей скрипт встановлює значення юніта {values}, на яке Reborn не відповідає: його встановлення нічого не дає, тож те, що скрипт мав на увазі, відбувається не так, як у рушії, для якого його створено."
"The retained diagnostic/reference budget was exceeded. This is a partial report, not a clean validation." = "Перевищено ліміт збережених діагностичних даних і посилань. Це неповний звіт, а не чиста перевірка."
"Reduce the pack's number of definitions or split optional content; rerun validation after resolving reported issues." = "Зменште кількість визначень у пакеті або розділіть необов'язковий вміст; після усунення зазначених проблем запустіть перевірку ще раз."
"{what} is defined twice; the game keeps both, two sides of one name." = "{what}: визначено двічі; гра зберігає обидва, дві сторони під однією назвою."
"Give each side a name of its own, or remove the one not meant to be played." = "Дайте кожній стороні власну назву або видаліть ту, що не призначена для гри."
"{what} is defined twice in this file; the game uses the later one." = "{what}: визначено двічі в цьому файлі; гра використовує пізніше визначення."
"Give each definition a name of its own, or remove the one not meant to be used." = "Дайте кожному визначенню власну назву або видаліть те, що не призначене для використання."
"{what} is also defined in {other}; the game uses this one ({this})." = "{what}: також визначено в {other}; гра використовує це визначення ({this})."
"The game opens archives only at the mod's top level; this one, in a subfolder, is never read." = "Гра відкриває архіви лише на верхньому рівні мода; цей, у підтеці, ніколи не читається."
"Move the archive to the mod's top level, or unpack its contents into the mod's folders." = "Перенесіть архів на верхній рівень мода або розпакуйте його вміст у теки мода."
"The game's folders are inside {folder}: the game reads units/, weapons/, maps/… only at the mod's top level, so nothing in it is used." = "Теки гри лежать усередині {folder}: гра читає units/, weapons/, maps/… лише на верхньому рівні мода, тож нічого з цього не використовується."
"Move the contents of this folder up to the mod's top level." = "Перенесіть вміст цієї теки на верхній рівень мода."
"{n} files at the mod's top level are where the game never reads them; this one's kind is read from {home}." = "Файлів на верхньому рівні мода, де гра їх ніколи не читає: {n}; файли такого виду читаються з {home}."
"{n} files under {folder} are where the game never reads them; this one's kind is read from {home}." = "Файлів у {folder}, де гра їх ніколи не читає: {n}; файли такого виду читаються з {home}."
"Move each file to the folder the game reads its kind from." = "Перенесіть кожен файл до теки, з якої гра читає файли такого виду."
"The game never reads this file: it reads {kind} files from {home}." = "Гра ніколи не читає цей файл: файли {kind} вона читає з {home}."
"Move it to that folder, or remove it if it is not needed." = "Перенесіть його до цієї теки або видаліть, якщо він не потрібен."
"This file cannot be read: {error}" = "Цей файл неможливо прочитати: {error}"
"Reinstall the package and check that its archives are intact and readable." = "Встановіть пакет заново й перевірте, що його архіви цілі та читаються."
"This text file exceeds the validator's per-file text budget and was not parsed." = "Цей текстовий файл перевищує ліміт перевірки на текст одного файлу й не був розібраний."
"Split large definition files into smaller files before validating again." = "Розділіть великі файли визначень на менші, перш ніж перевіряти ще раз."
"Model texture" = "Текстура моделі"
"Map feature" = "Об'єкт карти"
"The terrain has no matching OTA metadata and cannot appear as a normal selectable map." = "Для цього ландшафту немає відповідних метаданих OTA, тому він не може з'явитися як звичайна карта для вибору."
"Include a matching maps/<name>.ota with a GlobalHeader and playable schemas." = "Додайте відповідний maps/<name>.ota з GlobalHeader і схемами для гри."
"This sound will not play: {problem}." = "Цей звук не відтворюватиметься: {problem}."
"Save it as a WAV file in PCM (8 or 16-bit) or IMA ADPCM, as TA's own sounds are." = "Збережіть його як файл WAV у форматі PCM (8 або 16-bit) чи IMA ADPCM, як і власні звуки TA."
"Correct the brackets and braces around this line: the game reads the file as it is and skips or misplaces what follows." = "Виправте дужки навколо цього рядка: гра читає файл як є й пропускає або неправильно розміщує те, що йде далі."
"[{section}] footprint {x} × {z} is clamped to 1..{max} cells a side by Reborn." = "Reborn обмежує площу забудови [{section}] {x} × {z} до 1..{max} клітинок на сторону."
"Use footprints within the supported range and regenerate the matching yard map." = "Використовуйте площу забудови в межах підтримуваного діапазону й заново створіть відповідну карту двору."
"Missing [UNITINFO]; this unit is skipped." = "Бракує [UNITINFO]; цей юніт пропущено."
"Add a UNITINFO section with a non-empty UnitName." = "Додайте секцію UNITINFO з непорожнім UnitName."
"UNITINFO has no usable UnitName; this unit is skipped." = "У UNITINFO немає придатного UnitName; цей юніт пропущено."
"Give the unit a unique, non-empty UnitName and update its references." = "Дайте юніту унікальний непорожній UnitName і оновіть посилання на нього."

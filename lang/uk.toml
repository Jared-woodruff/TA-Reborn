"Missing [GlobalHeader]; this map has no usable metadata." = "Бракує [GlobalHeader]; ця карта не має придатних метаданих."
"Export a matching OTA with a GlobalHeader and the desired game-type schemas." = "Експортуйте відповідний OTA з GlobalHeader і потрібними схемами типів гри."

# apps/ta_game/src/tips.rs
"Ctrl+right-drag draws a formation line: the selection spreads along it." = "Ctrl+перетягування правою кнопкою малює лінію строю: виділені юніти розставляються вздовж неї."
"Ctrl+drag draws a formation line: the selection spreads along it." = "Ctrl+перетягування малює лінію строю: виділені юніти розставляються вздовж неї."
"Used to TA's original controls? Options, Controls: give orders with the left button." = "Звикли до оригінального керування TA? Параметри · Керування: накази лівою кнопкою."
"A right-click clears the selection or cancels the order you were about to give." = "Клацання правою кнопкою знімає виділення або скасовує наказ, який ви збиралися віддати."
"Right-click one of your units for a ring of its orders; hold the button and flick towards a choice. A controller's B does the same." = "Правий клік по своєму юніту відкриває кільце його наказів; утримуйте кнопку й ведіть до потрібного пункту. Кнопка B геймпада робить те саме."
"Hold the right button on one of your units, or middle-click it, for a ring of its orders; flick towards a choice and let go." = "Утримуйте праву кнопку на своєму юніті або клацніть по ньому середньою, щоб відкрити кільце його наказів; ведіть до потрібного пункту й відпустіть."
"Metal extractors must sit on metal: {overlay_metal} shows the metal map, and {area_mex} puts an extractor on every metal spot you circle." = "Екстрактори металу треба ставити на метал: {overlay_metal} показує карту металу, а {area_mex} ставить екстрактор на кожне родовище в обведеному колі."
"Your Commander's D-gun ({dgun}) destroys almost anything it touches, including your own units in its path." = "D-гармата вашого Командира ({dgun}) знищує майже все, чого торкнеться, зокрема ваші власні юніти на її шляху."
"{perspective} climbs into the selected unit, or an ally's under the pointer, to see the battle through its eyes as it goes on with its orders. Escape climbs back out." = "{perspective} — сісти у виділений юніт або юніт союзника під курсором і дивитися на бій його очима, поки він виконує свої накази. Escape — вийти назад."
"Keep your metal and energy incomes above what you spend: building slows down for everything when a store runs dry." = "Тримайте дохід металу й енергії вищим за витрати: коли запас вичерпується, усе будується повільніше."
"Right-clicking a factory's queued unit removes it; clicking it builds it next." = "ПКМ по юніту в черзі заводу прибирає його з черги; ЛКМ — будує його наступним."
"Fight ({fight}) is attack-move: units stop to fight whatever they meet on the way." = "Бій ({fight}) — це рух з атакою: юніти зупиняються, щоб битися з усім, що трапиться дорогою."
"Ctrl+click is force fire: the selection attacks whatever is there, your own units too, or the ground." = "Ctrl+клік — примусовий вогонь: виділені юніти атакують будь-що там, навіть ваші власні юніти, або землю."
"{select_builders} selects your constructors, {select_factories} your factories, {select_armed} your armed units, {select_on_screen} everything on the screen." = "{select_builders} виділяє будівельників, {select_factories} — заводи, {select_armed} — озброєні юніти, {select_on_screen} — усе на екрані."
"Patrol ({patrol}) with constructors makes them repair, assist and reclaim along the route by themselves." = "Патруль ({patrol}) змушує будівельників самостійно ремонтувати, допомагати й переробляти вздовж маршруту."
"Put a constructor on duty ({duty}) and it works by itself: the economy, repairs, reclaiming or defence. Any order you give takes it back." = "Поставте будівельника на службу ({duty}), і він працюватиме сам: ресурси, ремонт, переробка або оборона. Будь-який ваш наказ поверне його."
"Drag with Reclaim ({reclaim}) to turn every wreck, rock and tree in a circle into metal and energy." = "Тягніть із Переробкою ({reclaim}), щоб перетворити всі уламки, каміння й дерева в колі на метал і енергію."
"Ctrl+1 to Ctrl+9 make control groups; tap the number twice to look at the group." = "Ctrl+1 – Ctrl+9 створюють групи; двічі натисніть цифру, щоб показати групу."
"Hold {players} to see every player's side, team, units and income (your allies' in full)." = "Утримуйте {players}, щоб бачити сторону, команду, юніти й дохід кожного гравця (союзників — повністю)."
"Radar towers show enemy units long before they come into sight: build one early." = "Радарні вежі показують ворожі юніти задовго до того, як ті потраплять у поле зору: збудуйте одну якомога раніше."
"Wind generators pay off on windy maps: the skirmish page shows each map's wind range." = "Вітрогенератори окупаються на вітряних картах: сторінка сутички показує діапазон вітру кожної карти."
"Metal makers turn spare energy into metal, and stop when your energy runs dry." = "Генератори металу перетворюють зайву енергію на метал і зупиняються, коли енергія закінчується."
"Solar collectors fold shut for a few seconds when hit: tougher, but making no energy." = "Сонячні колектори при влучанні складаються на кілька секунд: стають міцнішими, але не дають енергії."
"Units gain veterancy with every kill: veterans aim better and shrug off damage." = "Юніти набираються досвіду з кожним знищеним ворогом: ветерани влучніше стріляють і краще тримають удар."
"Shift adds to the orders a unit already has instead of replacing them." = "Shift додає наказ до вже наявних у юніта, а не замінює їх."
"Alt+drag while placing a building fills a rectangle with it: handy for solar farms and walls." = "Alt+перетягування під час розміщення будівлі заповнює нею прямокутник: зручно для сонячних ферм і стін."
"Double-click a unit to select every unit of its type on screen; {select_type} selects them map-wide." = "Двічі клацніть юніт, щоб виділити всі юніти цього типу на екрані; {select_type} виділяє їх на всій карті."
"{idle_builder} selects the next idle constructor, {idle_factory} the next idle factory." = "Клавіша {idle_builder} виділяє наступного вільного будівельника, {idle_factory} — наступний вільний завод."
"Wrecks can be resurrected by resurrection kbots, or reclaimed for most of their metal." = "Уламки можна воскресити кботами-воскресителями або переробити, повернувши більшу частину їхнього металу."
"Hovering a unit shows its health, firepower and range; {overlay_path} shows where the selection can go." = "Якщо навести курсор на юніт, видно його здоров'я, вогневу міць і дальність; {overlay_path} показує, куди можуть пройти виділені юніти."
"{last_alert} (or Backspace) looks at the last place your units were attacked; press it again for the one before." = "{last_alert} (або Backspace) показує місце останньої атаки на ваші юніти; повторне натискання — попереднє."
"A notice or a piece of advice with LOOK on it takes you to the place, or the unit, when you click it." = "Сповіщення або порада з написом ПОКАЗ переносить вас до місця чи юніта після клацання."
"{help} tells everything about the selected unit, or the one under the pointer: cost, speed, weapons, abilities." = "{help} розповідає все про виділений юніт або той, що під курсором: вартість, швидкість, зброю, здібності."
"{next_unit} looks at the next of your units off the screen; with units selected, the next of them." = "{next_unit} показує наступний ваш юніт поза екраном; якщо юніти виділено — наступний із них."
"Ctrl+F6 to Ctrl+F9 store camera positions; F6 to F9 bring them back." = "Ctrl+F6 – Ctrl+F9 запам'ятовують позиції камери; F6 – F9 повертають до них."
"Anti-air matters: bombers can wreck an undefended economy in one pass." = "ППО важлива: бомбардувальники можуть зруйнувати незахищену економіку за один захід."
"An advanced factory needs a lot of metal: build it once your extractors and power can feed it." = "Вдосконаленому заводу потрібно багато металу: будуйте його, коли екстрактори й енергетика зможуть його прогодувати."
"Guarding a factory with a constructor adds its build power to the factory's production." = "Будівельник, що охороняє завод, додає свою будівельну потужність до виробництва заводу."
"Moho mines extract far more metal than basic extractors: advanced constructors build them." = "Шахти Moho видобувають набагато більше металу, ніж звичайні екстрактори; їх будують вдосконалені будівельники."
"Every game is kept as a replay: watch it from the main menu, and jump through it with the bar." = "Кожна гра зберігається як повтор: дивіться його з головного меню й перемотуйте смугою."
"{overlay_sight} shows your sight, radar and sonar coverage; {overlay_height} shows the heights of the map." = "{overlay_sight} показує покриття огляду, радарів і сонарів; {overlay_height} показує висоти карти."
"The Commander can capture enemy units ({capture}): it takes a while, but the unit is yours." = "Командир може захоплювати ворожі юніти ({capture}): це потребує часу, зате юніт стає вашим."
"{photo_mode} opens photo mode: the battle holds still, and you can light, frame and focus a shot at up to 4K." = "{photo_mode} відкриває фоторежим: битва завмирає, і ви можете налаштувати світло, кадр і фокус знімка з роздільністю до 4K."
"TIP" = "ПОРАДА"
"Dismiss" = "Закрити"
"Don't show tips again" = "Більше не показувати поради"

# apps/ta_game/src/tutorial.rs
"THE BASICS" = "ОСНОВИ"
"Your Commander, the camera, metal, energy and a first factory." = "Ваш Командир, камера, метал, енергія й перший завод."
"Selecting units" = "Виділення юнітів"
"The camera" = "Камера"
"Metal and energy" = "Метал і енергія"
"Factories" = "Заводи"
"Welcome, Commander. The walking machine in the middle of the screen is your Commander: it builds, it fights, and losing it usually loses the battle. Click it to select it." = "Вітаємо, Командире. Машина на ногах посередині екрана — це ваш Командир: він будує, воює, а його втрата зазвичай означає програну битву. Клацніть по ньому, щоб виділити."
"Lost sight of it? {select_commander} selects the Commander from anywhere, and SHOW ME brings the camera to it." = "Не бачите його? {select_commander} виділяє Командира звідки завгодно, а кнопка «ПОКАЗАТИ» переносить до нього камеру."
"Look around. The arrow keys, the screen edges or dragging with the middle button scroll; the mouse wheel zooms towards the cursor, and dragging with the right button turns the view." = "Роззирніться. Стрілки, краї екрана або перетягування середньою кнопкою прокручують карту; коліщатко миші наближає до курсора, а перетягування правою кнопкою повертає вигляд."
"Push the pointer against an edge of the screen to scroll, or turn the mouse wheel to zoom." = "Підведіть курсор до самого краю екрана, щоб прокрутити карту, або покрутіть коліщатко миші, щоб змінити масштаб."
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the ECONOMY tab of the build menu at the bottom right and place it on the marked deposit." = "Усе створюється з металу й енергії. Метал дають екстрактори на родовищах металу. Виділіть Командира, виберіть Metal Extractor на вкладці РЕСУРСИ в меню будівництва праворуч унизу і поставте його на позначене родовище."
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the build menu on the left and place it on the marked deposit." = "Усе створюється з металу й енергії. Метал дають екстрактори на родовищах металу. Виділіть Командира, виберіть Metal Extractor у меню будівництва ліворуч і поставте його на позначене родовище."
"The outline turns green where the extractor can stand. Bring it onto the marked ring and click to place it." = "Контур стає зеленим там, де може стояти екстрактор. Наведіть його на позначене кільце й клацніть, щоб поставити."
"Energy comes from solar collectors and wind generators. Build a Solar Collector next to your Commander. The bars at the top show your stores and how fast they fill or drain; they warn you when one runs dry." = "Енергію дають сонячні колектори й вітрогенератори. Збудуйте Solar Collector поруч із Командиром. Смуги вгорі показують ваші запаси й те, як швидко вони наповнюються чи спорожнюються; вони попередять, коли якийсь запас вичерпається."
"The Solar Collector is a flat, square panel. Pick it, then click on open ground near the Commander." = "Solar Collector — це пласка квадратна панель. Виберіть його, потім клацніть на вільному місці поруч із Командиром."
"Factories build your army. Build a Kbot Lab (on the FACTORY tab) on a flat spot near the Commander, and wait for it to finish." = "Заводи будують вашу армію. Збудуйте Kbot Lab (на вкладці ЗАВОДИ) на рівному місці біля Командира й зачекайте, доки будівництво завершиться."
"Factories build your army. Build a Kbot Lab from the build menu on a flat spot near the Commander, and wait for it to finish." = "Заводи будують вашу армію. Виберіть Kbot Lab у меню будівництва, поставте її на рівному місці біля Командира й зачекайте, доки будівництво завершиться."
"Building takes metal and energy as it goes: while either bar at the top is empty, everything builds more slowly." = "Будівництво витрачає метал і енергію поступово: поки хоч одна смуга вгорі порожня, усе будується повільніше."
"Select the Kbot Lab and click the Peewee three times to queue three of them (right-click one to take it off the queue). New units wait in front of the lab." = "Виділіть Kbot Lab і тричі клацніть Peewee, щоб поставити в чергу трьох (ПКМ прибирає одного з черги). Нові юніти чекають перед лабораторією."
"Click the lab itself on the map to select it: its build menu shows the units it makes." = "Клацніть по самій лабораторії на карті, щоб виділити її: у її меню будівництва видно юніти, які вона виробляє."
"That is the whole cycle: extract, generate, build, fight. Keep both incomes above what you spend and keep your builders busy. Lesson complete!" = "Ось і весь цикл: видобуток, енергія, будівництво, бій. Тримайте обидва доходи вищими за витрати й не давайте будівельникам сидіти без діла. Урок пройдено!"
"Select and group an army, attack-move, and destroy an enemy outpost." = "Виділіть армію, зберіть її в групу, атакуйте з рухом і знищте ворожий аванпост."
"Box selection" = "Виділення рамкою"
"Control groups" = "Групи юнітів"
"Attack-move" = "Рух з атакою"
"Destroying a base" = "Знищення бази"
"Your Kbot Lab has built a squad of Peewees. Drag a box around them with the left mouse button to select them all." = "Ваша Kbot Lab збудувала загін Peewee. Обведіть їх рамкою лівою кнопкою миші, щоб виділити всіх."
"Press the left button on open ground beside the squad, hold it, drag the box over them all and let go." = "Натисніть ліву кнопку миші на вільному місці біля загону, утримуйте її, розтягніть рамку на весь загін і відпустіть."
"Press Ctrl+1 to make them group 1. Pressing 1 selects them again from anywhere; pressing it twice brings the camera to them." = "Натисніть Ctrl+1, щоб зробити їх групою 1. Клавіша 1 знову виділяє їх звідки завгодно, а подвійне натискання переносить до них камеру."
"Hold Ctrl and press 1 while the squad is selected." = "Коли загін виділено, утримуйте Ctrl і натисніть 1."
"The enemy has an outpost at the marked place. Fight is attack-move: units walk there and take on whatever they meet on the way. Press {fight}, then click near the outpost." = "У позначеному місці стоїть ворожий аванпост. Бій — це рух з атакою: юніти йдуть туди й б'ються з усім, що трапиться дорогою. Натисніть {fight}, а потім клацніть біля аванпосту."
"Select the squad first (press 1). Then press {fight}, or the Fight button among the orders, and click on the ground by the marked ring." = "Спершу виділіть загін (натисніть 1). Потім натисніть {fight} або кнопку «Бій» серед наказів і клацніть по землі біля позначеного кільця."
"Destroy every building of the outpost. Its laser tower hits hard: keep the squad together, and queue reinforcements at the lab if you need them." = "Знищте всі будівлі аванпосту. Його лазерна вежа б'є боляче: тримайте загін разом і, якщо треба, замовте підкріплення в лабораторії."
"Losing the fight? Pull the squad back, queue more Peewees at the lab and go in again with all of them together." = "Програєте бій? Відведіть загін назад, замовте в лабораторії ще Peewee, а тоді знову атакуйте всі разом."
"The outpost is gone. The wrecks it left are worth metal: builders reclaim them (next lesson). Lesson complete!" = "Аванпосту більше немає. Уламки, що від нього лишилися, — це метал: будівельники переробляють їх (наступний урок). Урок пройдено!"
"ORDERS LIKE A VETERAN" = "НАКАЗИ, ЯК У ВЕТЕРАНА"
"Map views, area orders, building blocks and build queues." = "Режими карти, накази по площі, блоки будівель і черги будівництва."
"Map overlays" = "Шари карти"
"Area orders" = "Накази по площі"
"Building blocks" = "Блоки будівель"
"Build queues" = "Черги будівництва"
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again. The MAP menu at the top right does the same." = "Карта показує те, що приховує земля. Натисніть {overlay_metal}, щоб побачити карту металу ({overlay_path} показує, куди можуть пройти юніти, {overlay_height} — висоти, {overlay_sight} — огляд і радар); та сама клавіша знову ховає її. Меню КАРТА вгорі праворуч робить те саме."
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again." = "Карта показує те, що приховує земля. Натисніть {overlay_metal}, щоб побачити карту металу ({overlay_path} показує, куди можуть пройти юніти, {overlay_height} — висоти, {overlay_sight} — огляд і радар); та сама клавіша знову ховає її."
"Press {overlay_metal}: the metal deposits light up all over the map." = "Натисніть {overlay_metal}: родовища металу підсвітяться по всій карті."
"Select the Commander, press {area_mex} and drag a circle over the marked deposits: every metal spot inside gets an extractor, nearest first. A plain click takes the metal around the cursor." = "Виділіть Командира, натисніть {area_mex} і обведіть коло над позначеними родовищами: на кожному родовищі всередині з'явиться екстрактор, починаючи з найближчого. Простий клік бере метал навколо курсора."
"With the Commander selected, press {area_mex}, then press on the ground over the deposits and drag outwards: the circle grows as you drag." = "Виділивши Командира, натисніть {area_mex}, потім затисніть кнопку миші посеред родовищ і відводьте курсор від центру: коло росте слідом за ним."
"Many orders work on areas. Press {reclaim} (reclaim) and drag a circle over the rocks near your base: the Commander turns every one into metal." = "Багато наказів діють на ділянку. Натисніть {reclaim} (переробка) й обведіть коло над камінням біля бази: Командир перетворить кожен камінь на метал."
"Rocks and wrecks are worth metal. With the Commander selected, press {reclaim}, then press on the ground and drag the circle over a few rocks." = "Каміння й уламки — це метал. Виділивши Командира, натисніть {reclaim}, потім затисніть кнопку миші на землі й розтягніть коло на кілька каменів."
"Hold Alt while you drag out a building to fill a whole block with it. Pick the Solar Collector, hold Alt and drag out a block of four or more." = "Утримуйте Alt, коли розтягуєте будівлю, щоб заповнити нею цілий блок. Виберіть Solar Collector, утримуйте Alt і розтягніть блок із чотирьох чи більше."
"Pick the Solar Collector, then hold Alt, press on the ground and drag: a block of outlines follows the pointer. Let go to place them all." = "Виберіть Solar Collector, потім утримуйте Alt, затисніть кнопку миші на землі й ведіть курсор: за ним рухається блок контурів. Відпустіть кнопку, щоб поставити їх усі."
"The Commander's queued buildings show under BUILD QUEUE, beside its picture at the bottom of the screen. Click one to build it next (right-click drops it). A factory's queue works the same way." = "Будівлі в черзі Командира показано під ЧЕРГА БУДІВНИЦТВА, поруч із його зображенням унизу екрана. Клацніть одну, щоб збудувати її наступною (ПКМ прибирає її). Черга заводу працює так само."
"The BUILD QUEUE shows while the Commander alone is selected and has buildings waiting. Click any but the first: that one is being built." = "Панель «ЧЕРГА БУДІВНИЦТВА» видно, коли виділено лише Командира, у якого в черзі є будівлі. Клацніть будь-яку будівлю, крім першої: її вже будують."
"Area orders, building blocks and queues save you hundreds of clicks in a battle. Lesson complete!" = "Накази по площі, блоки будівель і черги заощадять вам сотні кліків за битву. Урок пройдено!"
"HOLD THE LINE" = "ТРИМАТИ ОБОРОНУ"
"Defences, radar, repairs, and the metal in wrecks." = "Оборона, радар, ремонт і метал з уламків."
"Defences" = "Оборона"
"Radar" = "Радар"
"Repairs" = "Ремонт"
"Reclaiming wrecks" = "Переробка уламків"
"Raiders will come from the marked direction. Build a Light Laser Tower (on the DEFENCE tab) in the marked ring: towers shoot whatever comes in range." = "Нальотники прийдуть із позначеного боку. Збудуйте Light Laser Tower (на вкладці ОБОРОНА) у позначеному кільці: вежі стріляють по всьому, що опиниться в межах дальності."
"Raiders will come from the marked direction. Build a Light Laser Tower from the build menu in the marked ring: towers shoot whatever comes in range." = "Нальотники прийдуть із позначеного боку. Виберіть Light Laser Tower у меню будівництва й поставте її в позначене кільце: вежі стріляють по всьому, що опиниться в межах дальності."
"The Light Laser Tower is a small gun on a post. Pick it, put it in the ring and wait for it to finish." = "Light Laser Tower — це невелика гармата на стовпі. Виберіть її, поставте в кільце й зачекайте, доки будівництво завершиться."
"Build a Radar Tower (on the SENSORS tab) near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "Збудуйте Radar Tower (на вкладці СЕНСОРИ) біля своєї бази. Радар показує ворогів позначками на карті й мінікарті задовго до того, як їх побачать ваші юніти."
"Build a Radar Tower from the build menu near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "Виберіть Radar Tower у меню будівництва й поставте її біля своєї бази. Радар показує ворогів позначками на карті й мінікарті задовго до того, як їх побачать ваші юніти."
"The Radar Tower is a tall mast. Pick it, place it near the Commander and wait for it to finish." = "Radar Tower — це висока щогла. Виберіть її, поставте біля Командира й зачекайте, доки будівництво завершиться."
"Here they come: raiders on your radar. Keep the Commander by the tower and let them come to you: together they hold the line." = "Ось вони: нальотники на вашому радарі. Тримайте Командира біля вежі й дайте їм підійти самим: разом із вежею він утримає оборону."
"Do not chase them: the tower only fights what comes in range. Keep the Commander beside it; while it fights, the Commander can mend it ({repair}, then click the tower)." = "Не переслідуйте їх: вежа стріляє лише по тих, хто опиниться в межах дальності. Тримайте Командира поруч із нею; поки вона веде бій, Командир може її лагодити ({repair}, потім клацніть по вежі)."
"The fight left a building damaged. Select the Commander, press {repair} and click it: builders mend what is damaged." = "Після бою одну з будівель пошкоджено. Виділіть Командира, натисніть {repair} і клацніть по будівлі: будівельники лагодять усе пошкоджене."
"With the Commander selected, press {repair}, then click the damaged building. Its health bar fills as it is mended." = "Виділивши Командира, натисніть {repair}, потім клацніть по пошкодженій будівлі. Під час ремонту її смуга здоров'я заповнюється."
"The raiders left wrecks, and wrecks are worth metal. Select the Commander, press {reclaim} and click a wreck, or drag a circle over them all." = "Нальотники залишили по собі уламки, а уламки — це метал. Виділіть Командира, натисніть {reclaim} і клацніть по уламках або обведіть коло над ними всіма."
"Wrecks lie where the raiders fell. With the Commander selected, press {reclaim} and click one: the metal bar rises as it is taken apart." = "Уламки лежать там, де полягли нальотники. Виділивши Командира, натисніть {reclaim} і клацніть по будь-яких уламках: поки їх розбирають, смуга металу росте."
"Towers hold ground while your army is elsewhere, radar sees what is coming, and builders mend and recycle. Lesson complete!" = "Вежі тримають позиції, поки ваша армія далеко, радар бачить, що наближається, а будівельники лагодять і переробляють. Урок пройдено!"
"BUILDERS AND FACTORIES" = "БУДІВЕЛЬНИКИ Й ЗАВОДИ"
"Builders that help, factories that keep building, patrols and standing orders." = "Будівельники-помічники, заводи без простою, патрулі й постійні накази."
"Construction units" = "Будівельники"
"Helping a factory" = "Допомога заводу"
"Rally points" = "Точки збору"
"Standing orders" = "Постійні накази"
"One builder is slow. Select the Kbot Lab and build a Construction Kbot: it builds what the Commander builds, and more besides." = "Один будівельник — це повільно. Виділіть Kbot Lab і збудуйте Construction Kbot: він будує те саме, що й Командир, і навіть більше."
"Click the lab on the map to select it; the Construction Kbot is in its build menu. Wait for it to walk out." = "Клацніть по лабораторії на карті, щоб виділити її; Construction Kbot є в її меню будівництва. Зачекайте, доки він вийде."
"Builders help each other. Select the Construction Kbot, press {guard} and click the Kbot Lab: it lends the lab its build power, and the lab builds faster." = "Будівельники допомагають один одному. Виділіть Construction Kbot, натисніть {guard} і клацніть по Kbot Lab: кбот поділиться з лабораторією своєю будівельною потужністю, і вона будуватиме швидше."
"With the Construction Kbot selected, press {guard}, then click the lab. It stays by the lab and helps with everything it makes." = "Виділивши Construction Kbot, натисніть {guard}, потім клацніть по лабораторії. Кбот залишиться біля неї й допомагатиме з усім, що вона будує."
"Factories send their units where you say. Select the Kbot Lab. {order_click} on open ground nearby: new units gather there." = "Заводи відправляють свої юніти туди, куди ви скажете. Виділіть Kbot Lab. {order_click} по вільному місцю поруч: там збиратимуться нові юніти."
"Select the lab first. With it selected, {order_click} on the ground where its units should gather." = "Спершу виділіть лабораторію й не знімайте виділення. {order_click} по землі там, де мають збиратися її юніти."
"Turn on Repeat for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "Увімкніть для лабораторії «Повтор»: усе, що вона збудує, повертається в кінець її черги, тож вона ніколи не припиняє будувати."
"Turn on REPEAT BUILD for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "Увімкніть для лабораторії «ПОВТОР»: усе, що вона збудує, повертається в кінець її черги, тож вона ніколи не припиняє будувати."
"Select the lab, then turn Repeat on: the pointer shows where it is." = "Виділіть лабораторію, потім увімкніть «Повтор»: стрілка покаже, де він."
"Builders on patrol mend and reclaim whatever they pass. Select the Construction Kbot, press {patrol} and click on the far side of your base." = "Будівельники в патрулі лагодять і переробляють усе, повз що проходять. Виділіть Construction Kbot, натисніть {patrol} і клацніть на протилежному кінці бази."
"With the Construction Kbot selected, press {patrol}, then click on the ground: it walks back and forth between there and where it stood." = "Виділивши Construction Kbot, натисніть {patrol}, потім клацніть по землі: кбот ходитиме туди й назад між цією точкою та місцем, де стояв."
"Units keep standing orders. Select your Peewees and set their fire order to Hold fire with the button beside the orders: they will not shoot until you say." = "Юніти мають постійні накази. Виділіть свої Peewee й кнопкою поруч із наказами перемкніть їхній режим вогню на «Не стріляти»: вони не стрілятимуть, доки ви не скажете."
"Units keep standing orders. Select your Peewees and set their FIRE ORDERS to Hold fire: they will not shoot until you say." = "Юніти мають постійні накази. Виділіть свої Peewee й кнопкою «РЕЖИМ ВОГНЮ» перемкніть їх на «Не стріляти»: вони не стрілятимуть, доки ви не скажете."
"Select the Peewees, then click the fire order button until it shows HOLD FIRE: each click is the next order." = "Виділіть Peewee, потім клацайте по кнопці режиму вогню, доки вона не покаже «НЕ СТРІЛЯТИ»: кожен клік — наступний режим."
"You are ready for a skirmish: start against an Easy computer player, then Normal. {help} lists every key. Good hunting, Commander!" = "Ви готові до сутички: почніть проти легкого комп'ютерного гравця, потім — проти звичайного. {help} показує всі клавіші. Вдалого полювання, Командире!"
"Ready: {done} of {total}" = "Готово: {done} з {total}"
"Selected: {done} of {total}" = "Виділено: {done} з {total}"
"Built: {percent}%" = "Збудовано: {percent}%"
"Still standing: {left} of {total}" = "Залишилося: {left} з {total}"
"Raiders left: {left} of {total}" = "Залишилося нальотників: {left} з {total}"
"Health: {percent}%" = "Здоров'я: {percent}%"
"LESSON {n} · {title}" = "УРОК {n} · {title}"
"Show the instructions" = "Розгорнути інструкції"
"Fold the instructions away" = "Згорнути інструкції"
"LESSON COMPLETE" = "УРОК ПРОЙДЕНО"
"NEXT LESSON" = "НАСТУПНИЙ УРОК"
"SET UP A SKIRMISH" = "НАЛАШТУВАТИ СУТИЧКУ"
"Choose a map: your opponents start as Easy computer players" = "Виберіть карту: для початку вашими супротивниками будуть легкі комп'ютерні гравці"
"HINT" = "ПІДКАЗКА"
"Go on without doing this step" = "Продовжити, не виконуючи цей крок"
"SHOW ME" = "ПОКАЗАТИ"
"Bring the camera to it" = "Перенести камеру до потрібного місця"
"REALLY LEAVE?" = "СПРАВДІ ВИЙТИ?"
"Back to the main menu: this lesson starts over next time" = "До головного меню: наступного разу цей урок почнеться спочатку"
"{done} OF {total} LESSONS COMPLETE" = "ПРОЙДЕНО УРОКІВ: {done} З {total}"
"Short guided games on Painted Desert against an enemy that stays out of your way. Follow the panel at the top left; each step ticks off as you do it." = "Короткі ігри з підказками на карті Painted Desert проти ворога, який вам не заважає. Стежте за панеллю вгорі ліворуч; кожен крок позначається, щойно ви його виконаєте."
"{summary} · {n} steps · about {minutes} min" = "{summary} · кроків: {n} · приблизно {minutes} хв"
"START" = "ПОЧАТИ"

# apps/ta_launcher/src/app/events.rs
"Close the game first: the update replaces its files" = "Спершу закрийте гру: оновлення замінює її файли"
"Wait for the current skin operation to finish, then try again." = "Дочекайтеся завершення поточної операції зі скінами та повторіть спробу."
"Wait for the mod being installed" = "Дочекайтеся, доки встановиться мод"
"READY · IT INSTALLS WHEN THE GAME CLOSES" = "ГОТОВО · ВСТАНОВИТЬСЯ ПІСЛЯ ЗАКРИТТЯ ГРИ"
"READY · IT INSTALLS AFTER THE SKIN WORK" = "ГОТОВО · ВСТАНОВИТЬСЯ ПІСЛЯ ОПЕРАЦІЇ ЗІ СКІНАМИ"
"READY · IT INSTALLS AFTER THE MOD" = "ГОТОВО · ВСТАНОВИТЬСЯ ПІСЛЯ МОДУ"
"READY · IT INSTALLS WHEN THE PROFILE IS CLOSED" = "ГОТОВО · ВСТАНОВИТЬСЯ ПІСЛЯ ЗАКРИТТЯ ПРОФІЛЮ"
"READY · IT INSTALLS WHEN THE SKIN IS SAVED" = "ГОТОВО · ВСТАНОВИТЬСЯ ПІСЛЯ ЗБЕРЕЖЕННЯ СКІНА"
"The game crashed during the benchmark: the Play page has its crash report." = "Під час бенчмарку стався збій гри: звіт про збій — на сторінці «Грати»."
"The game stopped during the benchmark (exit code {code})." = "Гра зупинилася під час бенчмарку (код виходу {code})."
"The benchmark was stopped before its end." = "Бенчмарк зупинено до завершення."
"Could not install {name}: {error}" = "Не вдалося встановити {name}: {error}"
"{name} is updated: {units} units, {maps} maps" = "Мод {name} оновлено: юніти — {units}, карти — {maps}"
"{name} is installed and on: {units} units, {maps} maps" = "{name} встановлено й увімкнено: юніти — {units}, карти — {maps}"
"{name} is installed and on in place of {others}: {units} units, {maps} maps" = "Мод {name} встановлено й увімкнено замість {others}: юніти — {units}, карти — {maps}"
"{name} is installed: turn it on to play with it" = "Мод {name} встановлено: увімкніть його, щоб грати з ним"
"{name} is installed: {units} units, {maps} maps. Turn it on to play with it." = "Мод {name} встановлено: юніти — {units}, карти — {maps}. Увімкніть його, щоб грати з ним."
"File drops are unavailable while a dialog or key binding is active." = "Не можна перетягувати файли, поки відкрито діалогове вікно або триває призначення клавіші."
"REMOVE {name}?" = "ВИДАЛИТИ {name}?"
"It goes to the Recycle Bin and out of the load order. Its GET button installs it again." = "Мод буде переміщено в Кошик і прибрано з порядку завантаження. Знову встановити його можна кнопкою «ОТРИМАТИ»."
"It goes to the Recycle Bin and out of the load order: put it back from there if you change your mind." = "Мод буде переміщено в Кошик і прибрано з порядку завантаження: якщо передумаєте, відновіть його звідти."
"{mods} need it: they are not loaded without it." = "Він потрібен модам {mods}: без нього вони не завантажуються."
"REMOVE" = "У КОШИК"

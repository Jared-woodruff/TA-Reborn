# apps/ta_game/src/tips.rs
"Ctrl+right-drag draws a formation line: the selection spreads along it." = ""
"Ctrl+drag draws a formation line: the selection spreads along it." = ""
"Used to TA's original controls? Options, Controls: give orders with the left button." = ""
"A right-click clears the selection or cancels the order you were about to give." = ""
"Right-click one of your units for a ring of its orders; hold the button and flick towards a choice. A controller's B does the same." = ""
"Hold the right button on one of your units, or middle-click it, for a ring of its orders; flick towards a choice and let go." = ""
"Metal extractors must sit on metal: {overlay_metal} shows the metal map, and {area_mex} puts an extractor on every metal spot you circle." = ""
"Your Commander's D-gun ({dgun}) destroys almost anything it touches, including your own units in its path." = ""
"{perspective} climbs into the selected unit, or an ally's under the pointer, to see the battle through its eyes as it goes on with its orders. Escape climbs back out." = ""
"Keep your metal and energy incomes above what you spend: building slows down for everything when a store runs dry." = ""
"Right-clicking a factory's queued unit removes it; clicking it builds it next." = ""
"Fight ({fight}) is attack-move: units stop to fight whatever they meet on the way." = ""
"Ctrl+click is force fire: the selection attacks whatever is there, your own units too, or the ground." = ""
"{select_builders} selects your constructors, {select_factories} your factories, {select_armed} your armed units, {select_on_screen} everything on the screen." = ""
"Patrol ({patrol}) with constructors makes them repair, assist and reclaim along the route by themselves." = ""
"Put a constructor on duty ({duty}) and it works by itself: the economy, repairs, reclaiming or defence. Any order you give takes it back." = ""
"Drag with Reclaim ({reclaim}) to turn every wreck, rock and tree in a circle into metal and energy." = ""
"Ctrl+1 to Ctrl+9 make control groups; tap the number twice to look at the group." = ""
"Hold {players} to see every player's side, team, units and income (your allies' in full)." = ""
"Radar towers show enemy units long before they come into sight: build one early." = ""
"Wind generators pay off on windy maps: the skirmish page shows each map's wind range." = ""
"Metal makers turn spare energy into metal, and stop when your energy runs dry." = ""
"Solar collectors fold shut for a few seconds when hit: tougher, but making no energy." = ""
"Units gain veterancy with every kill: veterans aim better and shrug off damage." = ""
"Shift adds to the orders a unit already has instead of replacing them." = ""
"Alt+drag while placing a building fills a rectangle with it: handy for solar farms and walls." = ""
"Double-click a unit to select every unit of its type on screen; {select_type} selects them map-wide." = ""
"{idle_builder} selects the next idle constructor, {idle_factory} the next idle factory." = ""
"Wrecks can be resurrected by resurrection kbots, or reclaimed for most of their metal." = ""
"Hovering a unit shows its health, firepower and range; {overlay_path} shows where the selection can go." = ""
"{last_alert} (or Backspace) looks at the last place your units were attacked; press it again for the one before." = ""
"A notice or a piece of advice with LOOK on it takes you to the place, or the unit, when you click it." = ""
"{help} tells everything about the selected unit, or the one under the pointer: cost, speed, weapons, abilities." = ""
"{next_unit} looks at the next of your units off the screen; with units selected, the next of them." = ""
"Ctrl+F6 to Ctrl+F9 store camera positions; F6 to F9 bring them back." = ""
"Anti-air matters: bombers can wreck an undefended economy in one pass." = ""
"An advanced factory needs a lot of metal: build it once your extractors and power can feed it." = ""
"Guarding a factory with a constructor adds its build power to the factory's production." = ""
"Moho mines extract far more metal than basic extractors: advanced constructors build them." = ""
"Every game is kept as a replay: watch it from the main menu, and jump through it with the bar." = ""
"{overlay_sight} shows your sight, radar and sonar coverage; {overlay_height} shows the heights of the map." = ""
"The Commander can capture enemy units ({capture}): it takes a while, but the unit is yours." = ""
"{photo_mode} opens photo mode: the battle holds still, and you can light, frame and focus a shot at up to 4K." = ""

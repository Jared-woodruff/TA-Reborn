# apps/ta_game/scenarios/armageddon.toml
"Armageddon" = ""
"Two armies, one plain, no retreat. Win the battle of the war." = ""
"Commander, the Core's main army is marching north across the Mounds, and ours stands in its way. There are no bases here, no factories, no reinforcements: what you have is all you will ever have.\n\nThey outnumber us. We outgun them. Put the Lugers and the Merls on their columns as they close, hold the line with the Zeus, and keep the Jethros with the tanks: they will bring gunships. Their reserves arrive two and a half minutes in.\n\nDestroy every one of them." = ""
"Arm Command" = ""
"Here they come. Hold the line, and keep the Jethros with the tanks." = ""
"Their reserves are coming up behind the mounds, a Goliath at their head." = ""

# apps/ta_game/scenarios/armistice.toml
"The Armistice" = ""
"Five minutes of peace to build an army. Then the war resumes." = ""
"Commander, the peace talks on Reactor Grid have failed. The armistice holds for five more minutes: until then no weapon may fire, and neither side may build near the other's base. When it ends, the war resumes.\n\nBoth sides are rearming at a furious pace: resources and construction run at twice their usual speed, and the treaty's one lasting clause bans missile silos. Their Commander knows the clock as well as you do.\n\nBuild as you have never built. When the armistice ends, destroy the Core Commander." = ""
"The talks have failed. For five minutes no weapon fires and nobody builds near the other's base. Then it is war: build as you have never built." = ""
"Their factories are running day and night. Ours should be too." = ""
"Core Overseer" = ""
"Ten seconds, Arm. We have counted every one of your factories." = ""
"Their Commander is somewhere in that grid. Find it, and end this war for good." = ""

# apps/ta_game/scenarios/brothers_in_arms.toml
"Brothers in Arms" = ""
"You and an allied Commander against two of the Core's." = ""
"Commander, you are not alone on Highland Rift. Commander Holt's forces hold the river crossings in the north, beside yours in the north-western highlands. Two Core Commanders are dug in to the south, across the canyon.\n\nHolt's computer will fight its own war, but it is the same war: back it up when it is hard pressed, and it will do the same for you. Your forces see what its forces see.\n\nDestroy both Core Commanders. Keep yours alive." = ""
"Commander Holt" = ""
"Good to have you on the line. I'll hold the river crossings in the north; you take the western highlands." = ""
"My scouts have found both of their bases. The south-western one is yours; I'll keep the other busy." = ""
"They're massing at the canyon. If they come for one of us, the other hits them from the side." = ""
"Still with me? Then let's finish it. Everything we have, at their Commanders." = ""

# apps/ta_game/scenarios/decapitation.toml
"Kill the Core Commander on his island fortress. From the air." = ""
"Commander, a Core Commander has made his fortress on the island at the centre of this lava sea. Nothing on treads or legs will reach him, and his anti-air is the best the Core can build.\n\nYou have a small air wing and a forward airfield in the south-west corner: build it up. Strip away his air defences, then send the bombers in; a handful sent straight at him will not get through. Brawler gunships hit hard but die fast over flak, and the Freedom Fighters can keep his fighters off your bombers.\n\nHis reinforcements arrive in fifteen minutes. Before then, he must be dead." = ""

# apps/ta_game/scenarios/doomsday_clock.toml
"Doomsday Clock" = ""
"The Core's missile launches in fifteen minutes. Stop it." = ""
"Commander, a Silencer nuclear silo stands at the heart of the Core base across these metal plains, and it is arming. In fifteen minutes the missile flies, and your base is the target.\n\nDestroy the silo. Nothing else matters: not their Commander, not their factories. The silo sits behind heavy laser towers and a Punisher battery, and their Commander will not sit still while you come for it.\n\nYou have a base, two factories and two construction kbots. The clock is running." = ""
"Ten minutes to launch, Commander." = ""
"Five minutes to launch. That silo has to go." = ""
"One minute! Get to that silo!" = ""

# apps/ta_game/scenarios/endless_siege.toml
"Endless Siege" = ""
"The waves never stop. Survive as long as you can." = ""
"Commander, there is no rescue coming, no reinforcements, no victory. The Core has found your outpost in the mesas and will throw everything it has at it, from three directions, for as long as it takes.\n\nKbots, then tanks, then artillery and bombers; heavier every time, and now and then something enormous. Build an economy, build defences, and hold on.\n\nYour best time is kept. Beat it." = ""

# apps/ta_game/scenarios/extraction.toml
"Extraction" = ""
"Get your Commander down the lava river to the pick-up point." = ""
"Commander, your drop went wrong. You are on the south bank of a river of lava at the western end of the Run, with what is left of your escort, and the dropships can only land at the far eastern end.\n\nThe Core has guns all along the north bank, and patrols on your side of the river. Keep away from the lava's edge (their laser towers reach no further), deal with the patrols, and get your Commander to the pick-up point. Whatever guards it will not come to you. Core troops are already following your tracks; do not stop for long.\n\nAnything else is expendable. Your Commander is not." = ""

# apps/ta_game/scenarios/iron_rain.toml
"Iron Rain" = ""
"Two Intimidators are shelling your base. Take the mesa and silence them." = ""
"Commander, the Core has hauled two Intimidators, its long-range plasma cannons, onto the mesas in the middle of the canyon. Your base is inside their range. Every eight seconds each of them will put a shell among your buildings, until you silence them.\n\nThe battery is dug in behind heavy laser towers and a Punisher, with tanks on the ramps, and the Core's main base lies beyond it, to the south-east. Its Commander will send what it can.\n\nSpread out, build fast and take that mesa. Destroy both Intimidators." = ""
"Commander, two Intimidators on the mesas have your range. Every eight seconds each of them will put a shell into your base." = ""
"A Core radar post in the canyon to the south-east is spotting for those guns. Knock it out and they can no longer see your base." = ""
"Spread your buildings out: a shell that lands among them takes them all." = ""
"Their gunners have your range now. Take that mesa, Commander!" = ""

# apps/ta_game/scenarios/king_of_the_hill.toml
"King of the Hill" = ""
"Hold the summit for four minutes before the Core does." = ""
"Commander, the spiral mountain at the heart of this plain is rich in metal, and whoever holds its summit holds the planet. A Core Commander has landed to the north with the same idea.\n\nTake the summit and keep it: four minutes in all with only your forces on top wins it. Contested, the clock stands still. If the Core holds it alone for four minutes, the mountain is theirs.\n\nThe Core will keep sending troops up the slopes. Build up, get there first, and dig in." = ""
"Core troops are climbing the north slope. Don't let them dig in on the summit." = ""
"Raiders are coming round the mountain for your base." = ""

# apps/ta_game/scenarios/last_stand.toml
"Last Stand" = ""
"Hold the pass for twelve minutes. They will not stop coming." = ""
"Commander, the Core has broken through at Varrin Gap. The only way into the valley behind you is the winding pass ahead, and your outpost at its western mouth is all that stands in the way.\n\nReinforcements are twelve minutes out. Hold until they arrive. Core forces will come through the pass in waves, each heavier than the last; expect bombers, and expect worse at the end: our scouts have seen something very large moving in the east.\n\nYou have a small base, a kbot lab and two construction kbots. Build what you can. Keep your Commander alive." = ""
"Outpost, this is Arm Command. The relief force is twelve minutes out. Nothing gets through that pass before it arrives." = ""
"Radar: aircraft inbound from the east. Bombers! Get your anti-air up." = ""
"Seismic contact in the pass. It's the big one, Commander: a Krogoth." = ""
"One minute! The relief force is entering the valley." = ""

# apps/ta_game/scenarios/metal_rush.toml
"The first to make 15,000 metal wins. The Core plays rough." = ""
"Commander, the mining rights to this planet go to whoever proves they can work it: the first side to extract fifteen thousand metal wins it outright.\n\nThe Core is racing you from the western plateau, and the Core has never been known to race fair. Expect raids on your extractors. Build fast, protect your economy, and if you can, take theirs apart.\n\nMetal makers count. Reclaimed metal counts. Whatever you make, counts." = ""

# apps/ta_game/scenarios/titans.toml
"Titans" = ""
"Three Krogoths are walking toward your base. Bring them down." = ""
"Commander, seismic stations round the basin are reading footfalls: three Krogoths, the Core's walking fortresses, are crossing the salt pans toward your base, one after another, each with an escort.\n\nNothing out there can stop them but you. A Krogoth's head laser reaches further than your D-gun, so keep your Commander back. Bombers, artillery and massed Zeus will bring one down. Lose your nerve and it will walk through your base.\n\nYou have a base with three factories, four construction kbots and a garrison. Destroy all three of them." = ""
"Commander, seismic stations are reading footfalls round the basin. Three Krogoths are walking toward your base, one after another." = ""
"The first Krogoth has crossed the north-western rim. It is coming straight for you." = ""
"Keep your Commander back: that head laser reaches further than your D-gun." = ""
"The second Krogoth is through the northern pass, with rockets and anti-air round it." = ""
"The last of them, out of the north-east, with the heaviest escort yet. End this, Commander." = ""

# apps/ta_game/scenarios/until_dawn.toml
"Until Dawn" = ""
"Night falls on the timber. Hold your ridge until the sun comes up." = ""
"Commander, night is falling over Timberline, and the Core is moving through the forest under it. Your outpost holds the western ridge: the only road out of the valley runs past it.\n\nThe relief column cannot move before first light. Until then you are on your own. In the dark and the rain their raiders will be on you before you see them, so build radar, and keep your floodlights burning.\n\nYou have a small base, a kbot lab and two construction kbots. Hold until dawn, and keep your Commander alive." = ""
"Outpost Echo, the Core is moving through the timber tonight. Hold your ridge until first light: the relief column marches at dawn." = ""
"Raiders in the eastern trees. In this rain you will hear them before you see them." = ""
"Pyros in the north-eastern woods. Keep them out of the trees round your base: the timber will burn." = ""
"A convoy got through from the south-west. Four Zeus and two Jethros are yours, Commander." = ""
"Seismic contact in the south-east: heavy treads. They are saving the worst for the last hours of the night." = ""
"Sunrise in one minute. The relief column is at the river. Hold on!" = ""

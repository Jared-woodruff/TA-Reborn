# apps/ta_game/src/tutorial.rs
"THE BASICS" = ""
"Your Commander, the camera, metal, energy and a first factory." = ""
"Selecting units" = ""
"The camera" = ""
"Metal and energy" = ""
"Factories" = ""
"Welcome, Commander. The walking machine in the middle of the screen is your Commander: it builds, it fights, and losing it usually loses the battle. Click it to select it." = ""
"Lost sight of it? {select_commander} selects the Commander from anywhere, and SHOW ME brings the camera to it." = ""
"Look around. The arrow keys, the screen edges or dragging with the middle button scroll; the mouse wheel zooms towards the cursor, and dragging with the right button turns the view." = ""
"Push the pointer against an edge of the screen to scroll, or turn the mouse wheel to zoom." = ""
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the ECONOMY tab of the build menu at the bottom right and place it on the marked deposit." = ""
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the build menu on the left and place it on the marked deposit." = ""
"The outline turns green where the extractor can stand. Bring it onto the marked ring and click to place it." = ""
"Energy comes from solar collectors and wind generators. Build a Solar Collector next to your Commander. The bars at the top show your stores and how fast they fill or drain; they warn you when one runs dry." = ""
"The Solar Collector is a flat, square panel. Pick it, then click on open ground near the Commander." = ""
"Factories build your army. Build a Kbot Lab (on the FACTORY tab) on a flat spot near the Commander, and wait for it to finish." = ""
"Factories build your army. Build a Kbot Lab from the build menu on a flat spot near the Commander, and wait for it to finish." = ""
"Building takes metal and energy as it goes: while either bar at the top is empty, everything builds more slowly." = ""
"Select the Kbot Lab and click the Peewee three times to queue three of them (right-click one to take it off the queue). New units wait in front of the lab." = ""
"Click the lab itself on the map to select it: its build menu shows the units it makes." = ""
"That is the whole cycle: extract, generate, build, fight. Keep both incomes above what you spend and keep your builders busy. Lesson complete!" = ""
"Select and group an army, attack-move, and destroy an enemy outpost." = ""
"Box selection" = ""
"Control groups" = ""
"Attack-move" = ""
"Destroying a base" = ""
"Your Kbot Lab has built a squad of Peewees. Drag a box around them with the left mouse button to select them all." = ""
"Press the left button on open ground beside the squad, hold it, drag the box over them all and let go." = ""
"Press Ctrl+1 to make them group 1. Pressing 1 selects them again from anywhere; pressing it twice brings the camera to them." = ""
"Hold Ctrl and press 1 while the squad is selected." = ""
"The enemy has an outpost at the marked place. Fight is attack-move: units walk there and take on whatever they meet on the way. Press {fight}, then click near the outpost." = ""
"Select the squad first (press 1). Then press {fight}, or the Fight button among the orders, and click on the ground by the marked ring." = ""
"Destroy every building of the outpost. Its laser tower hits hard: keep the squad together, and queue reinforcements at the lab if you need them." = ""
"Losing the fight? Pull the squad back, queue more Peewees at the lab and go in again with all of them together." = ""
"The outpost is gone. The wrecks it left are worth metal: builders reclaim them (next lesson). Lesson complete!" = ""
"ORDERS LIKE A VETERAN" = ""
"Map views, area orders, building blocks and build queues." = ""
"Map overlays" = ""
"Area orders" = ""
"Building blocks" = ""
"Build queues" = ""
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again. The MAP menu at the top right does the same." = ""
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again." = ""
"Press {overlay_metal}: the metal deposits light up all over the map." = ""
"Select the Commander, press {area_mex} and drag a circle over the marked deposits: every metal spot inside gets an extractor, nearest first. A plain click takes the metal around the cursor." = ""
"With the Commander selected, press {area_mex}, then press on the ground over the deposits and drag outwards: the circle grows as you drag." = ""
"Many orders work on areas. Press {reclaim} (reclaim) and drag a circle over the rocks near your base: the Commander turns every one into metal." = ""
"Rocks and wrecks are worth metal. With the Commander selected, press {reclaim}, then press on the ground and drag the circle over a few rocks." = ""
"Hold Alt while you drag out a building to fill a whole block with it. Pick the Solar Collector, hold Alt and drag out a block of four or more." = ""
"Pick the Solar Collector, then hold Alt, press on the ground and drag: a block of outlines follows the pointer. Let go to place them all." = ""
"The Commander's queued buildings show under BUILD QUEUE, beside its picture at the bottom of the screen. Click one to build it next (right-click drops it). A factory's queue works the same way." = ""
"The BUILD QUEUE shows while the Commander alone is selected and has buildings waiting. Click any but the first: that one is being built." = ""
"Area orders, building blocks and queues save you hundreds of clicks in a battle. Lesson complete!" = ""
"HOLD THE LINE" = ""
"Defences, radar, repairs, and the metal in wrecks." = ""
"Defences" = ""
"Radar" = ""
"Repairs" = ""
"Reclaiming wrecks" = ""
"Raiders will come from the marked direction. Build a Light Laser Tower (on the DEFENCE tab) in the marked ring: towers shoot whatever comes in range." = ""
"Raiders will come from the marked direction. Build a Light Laser Tower from the build menu in the marked ring: towers shoot whatever comes in range." = ""
"The Light Laser Tower is a small gun on a post. Pick it, put it in the ring and wait for it to finish." = ""
"Build a Radar Tower (on the SENSORS tab) near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = ""
"Build a Radar Tower from the build menu near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = ""
"The Radar Tower is a tall mast. Pick it, place it near the Commander and wait for it to finish." = ""
"Here they come: raiders on your radar. Keep the Commander by the tower and let them come to you: together they hold the line." = ""
"Do not chase them: the tower only fights what comes in range. Keep the Commander beside it; while it fights, the Commander can mend it ({repair}, then click the tower)." = ""
"The fight left a building damaged. Select the Commander, press {repair} and click it: builders mend what is damaged." = ""
"With the Commander selected, press {repair}, then click the damaged building. Its health bar fills as it is mended." = ""
"The raiders left wrecks, and wrecks are worth metal. Select the Commander, press {reclaim} and click a wreck, or drag a circle over them all." = ""
"Wrecks lie where the raiders fell. With the Commander selected, press {reclaim} and click one: the metal bar rises as it is taken apart." = ""
"Towers hold ground while your army is elsewhere, radar sees what is coming, and builders mend and recycle. Lesson complete!" = ""
"BUILDERS AND FACTORIES" = ""
"Builders that help, factories that keep building, patrols and standing orders." = ""
"Construction units" = ""
"Helping a factory" = ""
"Rally points" = ""
"Standing orders" = ""
"One builder is slow. Select the Kbot Lab and build a Construction Kbot: it builds what the Commander builds, and more besides." = ""
"Click the lab on the map to select it; the Construction Kbot is in its build menu. Wait for it to walk out." = ""
"Builders help each other. Select the Construction Kbot, press {guard} and click the Kbot Lab: it lends the lab its build power, and the lab builds faster." = ""
"With the Construction Kbot selected, press {guard}, then click the lab. It stays by the lab and helps with everything it makes." = ""
"Factories send their units where you say. Select the Kbot Lab. {order_click} on open ground nearby: new units gather there." = ""
"Select the lab first. With it selected, {order_click} on the ground where its units should gather." = ""
"Turn on Repeat for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = ""
"Turn on REPEAT BUILD for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = ""
"Select the lab, then turn Repeat on: the pointer shows where it is." = ""
"Builders on patrol mend and reclaim whatever they pass. Select the Construction Kbot, press {patrol} and click on the far side of your base." = ""
"With the Construction Kbot selected, press {patrol}, then click on the ground: it walks back and forth between there and where it stood." = ""
"Units keep standing orders. Select your Peewees and set their fire order to Hold fire with the button beside the orders: they will not shoot until you say." = ""
"Units keep standing orders. Select your Peewees and set their FIRE ORDERS to Hold fire: they will not shoot until you say." = ""
"Select the Peewees, then click the fire order button until it shows HOLD FIRE: each click is the next order." = ""
"You are ready for a skirmish: start against an Easy computer player, then Normal. {help} lists every key. Good hunting, Commander!" = ""

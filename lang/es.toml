# apps/ta_game/scenarios/armageddon.toml
"Armageddon" = "Armagedón"
"Two armies, one plain, no retreat. Win the battle of the war." = "Dos ejércitos, una llanura, ninguna retirada. Gana la batalla de la guerra."
"Commander, the Core's main army is marching north across the Mounds, and ours stands in its way. There are no bases here, no factories, no reinforcements: what you have is all you will ever have.\n\nThey outnumber us. We outgun them. Put the Lugers and the Merls on their columns as they close, hold the line with the Zeus, and keep the Jethros with the tanks: they will bring gunships. Their reserves arrive two and a half minutes in.\n\nDestroy every one of them." = "Comandante, el ejército principal del Core avanza hacia el norte a través de los Mounds, y el nuestro se interpone en su camino. Aquí no hay bases, ni fábricas, ni refuerzos: lo que tienes es todo lo que vas a tener.\n\nNos superan en número. Nosotros a ellos, en potencia de fuego. Lanza los Luger y los Merl contra sus columnas cuando se acerquen, mantén la línea con los Zeus y deja los Jethro con los tanques: traerán cañoneras. Sus reservas llegan a los dos minutos y medio.\n\nDestrúyelos a todos."
"Arm Command" = "Mando Arm"
"Here they come. Hold the line, and keep the Jethros with the tanks." = "Ahí vienen. Mantened la línea y que los Jethros sigan con los tanques."
"Their reserves are coming up behind the mounds, a Goliath at their head." = "Sus reservas avanzan tras los montículos, con un Goliath al frente."

# apps/ta_game/scenarios/armistice.toml
"The Armistice" = "El armisticio"
"Five minutes of peace to build an army. Then the war resumes." = "Cinco minutos de paz para construir un ejército. Luego, la guerra continúa."
"Commander, the peace talks on Reactor Grid have failed. The armistice holds for five more minutes: until then no weapon may fire, and neither side may build near the other's base. When it ends, the war resumes.\n\nBoth sides are rearming at a furious pace: resources and construction run at twice their usual speed, and the treaty's one lasting clause bans missile silos. Their Commander knows the clock as well as you do.\n\nBuild as you have never built. When the armistice ends, destroy the Core Commander." = "Comandante, las conversaciones de paz en Reactor Grid han fracasado. El armisticio se mantiene cinco minutos más: hasta entonces ningún arma puede disparar y ningún bando puede construir cerca de la base del otro. Cuando termine, la guerra continuará.\n\nAmbos bandos se rearman a un ritmo frenético: los recursos y la construcción van al doble de su velocidad normal, y la única cláusula duradera del tratado prohíbe los silos de misiles. Su Comandante conoce el reloj tan bien como tú.\n\nConstruye como nunca. Cuando termine el armisticio, destruye al Comandante del Core."
"The talks have failed. For five minutes no weapon fires and nobody builds near the other's base. Then it is war: build as you have never built." = "Las conversaciones han fracasado. Durante cinco minutos ningún arma dispara y nadie construye cerca de la base del otro. Después, guerra: construye como nunca."
"Their factories are running day and night. Ours should be too." = "Sus fábricas funcionan día y noche. Las nuestras también deberían."
"Core Overseer" = "Supervisor del Core"
"Ten seconds, Arm. We have counted every one of your factories." = "Diez segundos, Arm. Hemos contado cada una de tus fábricas."
"Their Commander is somewhere in that grid. Find it, and end this war for good." = "Su Comandante está en algún lugar de esa red. Encuéntralo y acaba con esta guerra para siempre."

# apps/ta_game/scenarios/brothers_in_arms.toml
"Brothers in Arms" = "Hermanos de armas"
"You and an allied Commander against two of the Core's." = "Tú y un Comandante aliado contra dos del Core."
"Commander, you are not alone on Highland Rift. Commander Holt's forces hold the river crossings in the north, beside yours in the north-western highlands. Two Core Commanders are dug in to the south, across the canyon.\n\nHolt's computer will fight its own war, but it is the same war: back it up when it is hard pressed, and it will do the same for you. Your forces see what its forces see.\n\nDestroy both Core Commanders. Keep yours alive." = "Comandante, no estás solo en Highland Rift. Las fuerzas del Comandante Holt defienden los vados del río en el norte, junto a las tuyas en las tierras altas del noroeste. Dos Comandantes del Core están atrincherados al sur, al otro lado del cañón.\n\nLa IA de Holt librará su propia guerra, pero es la misma guerra: apóyala cuando esté en apuros y ella hará lo mismo por ti. Tus fuerzas ven lo que ven las suyas.\n\nDestruye a los dos Comandantes del Core. Mantén al tuyo con vida."
"Commander Holt" = "Comandante Holt"
"Good to have you on the line. I'll hold the river crossings in the north; you take the western highlands." = "Me alegra tenerte en línea. Yo defiendo los vados del río en el norte; tú toma las tierras altas del oeste."
"My scouts have found both of their bases. The south-western one is yours; I'll keep the other busy." = "Mis exploradores han encontrado sus dos bases. La del suroeste es tuya; yo mantendré ocupada a la otra."
"They're massing at the canyon. If they come for one of us, the other hits them from the side." = "Se están concentrando en el cañón. Si atacan a uno de nosotros, el otro les cae por el flanco."
"Still with me? Then let's finish it. Everything we have, at their Commanders." = "¿Sigues conmigo? Pues acabemos con esto. Todo lo que tenemos, contra sus Comandantes."

# apps/ta_game/scenarios/decapitation.toml
"Kill the Core Commander on his island fortress. From the air." = "Mata al Comandante del Core en su isla fortaleza. Desde el aire."
"Commander, a Core Commander has made his fortress on the island at the centre of this lava sea. Nothing on treads or legs will reach him, and his anti-air is the best the Core can build.\n\nYou have a small air wing and a forward airfield in the south-west corner: build it up. Strip away his air defences, then send the bombers in; a handful sent straight at him will not get through. Brawler gunships hit hard but die fast over flak, and the Freedom Fighters can keep his fighters off your bombers.\n\nHis reinforcements arrive in fifteen minutes. Before then, he must be dead." = "Comandante, un Comandante del Core ha hecho su fortaleza en la isla del centro de este mar de lava. Nada que vaya sobre orugas o patas llegará hasta él, y su antiaérea es la mejor que el Core sabe construir.\n\nTienes una pequeña ala aérea y un aeródromo avanzado en la esquina suroeste: refuérzalo. Desmantela sus defensas antiaéreas y luego envía los bombarderos; un puñado lanzado directamente contra él no pasará. Las cañoneras Brawler pegan fuerte, pero caen rápido bajo el fuego antiaéreo, y los Freedom Fighter pueden mantener a sus cazas lejos de tus bombarderos.\n\nSus refuerzos llegan en quince minutos. Antes de eso, tiene que estar muerto."

# apps/ta_game/scenarios/doomsday_clock.toml
"Doomsday Clock" = "Reloj del Juicio Final"
"The Core's missile launches in fifteen minutes. Stop it." = "El misil del Core despega en quince minutos. Detenlo."
"Commander, a Silencer nuclear silo stands at the heart of the Core base across these metal plains, and it is arming. In fifteen minutes the missile flies, and your base is the target.\n\nDestroy the silo. Nothing else matters: not their Commander, not their factories. The silo sits behind heavy laser towers and a Punisher battery, and their Commander will not sit still while you come for it.\n\nYou have a base, two factories and two construction kbots. The clock is running." = "Comandante, un silo nuclear Silencer se alza en el corazón de la base del Core, al otro lado de estas llanuras metálicas, y se está armando. En quince minutos el misil despegará, y tu base es el objetivo.\n\nDestruye el silo. Nada más importa: ni su Comandante, ni sus fábricas. El silo está tras torres láser pesadas y una batería Punisher, y su Comandante no se quedará quieto mientras vas a por él.\n\nTienes una base, dos fábricas y dos kbots de construcción. El reloj está en marcha."
"Ten minutes to launch, Commander." = "Diez minutos para el lanzamiento, Comandante."
"Five minutes to launch. That silo has to go." = "Cinco minutos para el lanzamiento. Ese silo tiene que caer."
"One minute! Get to that silo!" = "¡Un minuto! ¡A por ese silo!"

# apps/ta_game/scenarios/endless_siege.toml
"Endless Siege" = "Asedio sin fin"
"The waves never stop. Survive as long as you can." = "Las oleadas nunca cesan. Sobrevive todo lo que puedas."
"Commander, there is no rescue coming, no reinforcements, no victory. The Core has found your outpost in the mesas and will throw everything it has at it, from three directions, for as long as it takes.\n\nKbots, then tanks, then artillery and bombers; heavier every time, and now and then something enormous. Build an economy, build defences, and hold on.\n\nYour best time is kept. Beat it." = "Comandante, no vendrá ningún rescate, ni refuerzos, ni habrá victoria. El Core ha encontrado tu puesto avanzado en las mesetas y lanzará contra él todo lo que tiene, desde tres direcciones, durante el tiempo que haga falta.\n\nKbots, luego tanques, luego artillería y bombarderos; cada vez más duros, y de vez en cuando algo enorme. Levanta una economía, construye defensas y aguanta.\n\nSe guarda tu mejor tiempo. Supéralo."

# apps/ta_game/scenarios/extraction.toml
"Extraction" = "Extracción"
"Get your Commander down the lava river to the pick-up point." = "Lleva a tu Comandante río de lava abajo hasta el punto de recogida."
"Commander, your drop went wrong. You are on the south bank of a river of lava at the western end of the Run, with what is left of your escort, and the dropships can only land at the far eastern end.\n\nThe Core has guns all along the north bank, and patrols on your side of the river. Keep away from the lava's edge (their laser towers reach no further), deal with the patrols, and get your Commander to the pick-up point. Whatever guards it will not come to you. Core troops are already following your tracks; do not stop for long.\n\nAnything else is expendable. Your Commander is not." = "Comandante, tu despliegue ha salido mal. Estás en la orilla sur de un río de lava, en el extremo occidental de Lava Run, con lo que queda de tu escolta, y las naves de desembarco solo pueden aterrizar en el otro extremo, al este.\n\nEl Core tiene cañones a lo largo de toda la orilla norte, y patrullas en tu lado del río. Mantente lejos del borde de la lava (sus torres láser no llegan más allá), encárgate de las patrullas y lleva a tu Comandante al punto de recogida. Lo que lo defiende no saldrá a por ti. Las tropas del Core ya siguen tu rastro; no te detengas mucho tiempo.\n\nTodo lo demás es prescindible. Tu Comandante, no."

# apps/ta_game/scenarios/iron_rain.toml
"Iron Rain" = "Lluvia de hierro"
"Two Intimidators are shelling your base. Take the mesa and silence them." = "Dos Intimidators bombardean tu base. Toma la meseta y hazlos callar."
"Commander, the Core has hauled two Intimidators, its long-range plasma cannons, onto the mesas in the middle of the canyon. Your base is inside their range. Every eight seconds each of them will put a shell among your buildings, until you silence them.\n\nThe battery is dug in behind heavy laser towers and a Punisher, with tanks on the ramps, and the Core's main base lies beyond it, to the south-east. Its Commander will send what it can.\n\nSpread out, build fast and take that mesa. Destroy both Intimidators." = "Comandante, el Core ha subido dos Intimidators, sus cañones de plasma de largo alcance, a las mesetas en mitad del cañón. Tu base está a su alcance. Cada ocho segundos, cada uno de ellos lanzará un proyectil entre tus edificios, hasta que los hagas callar.\n\nLa batería está atrincherada tras torres láser pesadas y un Punisher, con tanques en las rampas, y la base principal del Core queda más allá, al sureste. Su Comandante enviará lo que pueda.\n\nDispérsate, construye rápido y toma esa meseta. Destruye los dos Intimidators."
"Commander, two Intimidators on the mesas have your range. Every eight seconds each of them will put a shell into your base." = "Comandante, dos Intimidators en las mesetas tienen tu base a tiro. Cada ocho segundos, cada uno lanzará un proyectil contra tu base."
"A Core radar post in the canyon to the south-east is spotting for those guns. Knock it out and they can no longer see your base." = "Un puesto de radar del Core en el cañón, al sureste, dirige el fuego de esa artillería. Destrúyelo y ya no podrán ver tu base."
"Spread your buildings out: a shell that lands among them takes them all." = "Dispersa tus edificios: un proyectil que cae entre ellos se los lleva todos."
"Their gunners have your range now. Take that mesa, Commander!" = "Sus artilleros ya te tienen a tiro. ¡Toma esa meseta, Comandante!"

# apps/ta_game/scenarios/king_of_the_hill.toml
"King of the Hill" = "Rey de la colina"
"Hold the summit for four minutes before the Core does." = "Domina la cima durante cuatro minutos antes que el Core."
"Commander, the spiral mountain at the heart of this plain is rich in metal, and whoever holds its summit holds the planet. A Core Commander has landed to the north with the same idea.\n\nTake the summit and keep it: four minutes in all with only your forces on top wins it. Contested, the clock stands still. If the Core holds it alone for four minutes, the mountain is theirs.\n\nThe Core will keep sending troops up the slopes. Build up, get there first, and dig in." = "Comandante, la montaña en espiral del centro de esta llanura es rica en metal, y quien domine su cima domina el planeta. Un Comandante del Core ha aterrizado al norte con la misma idea.\n\nToma la cima y consérvala: cuatro minutos en total con solo tus fuerzas arriba te dan la victoria. Si está disputada, el reloj se detiene. Si el Core la mantiene en solitario durante cuatro minutos, la montaña es suya.\n\nEl Core seguirá enviando tropas por las laderas. Refuérzate, llega primero y atrinchérate."
"Core troops are climbing the north slope. Don't let them dig in on the summit." = "Tropas del Core suben por la ladera norte. No dejes que se atrincheren en la cima."
"Raiders are coming round the mountain for your base." = "Incursores rodean la montaña hacia tu base."

# apps/ta_game/scenarios/last_stand.toml
"Last Stand" = "Última resistencia"
"Hold the pass for twelve minutes. They will not stop coming." = "Defiende el paso durante doce minutos. No dejarán de llegar."
"Commander, the Core has broken through at Varrin Gap. The only way into the valley behind you is the winding pass ahead, and your outpost at its western mouth is all that stands in the way.\n\nReinforcements are twelve minutes out. Hold until they arrive. Core forces will come through the pass in waves, each heavier than the last; expect bombers, and expect worse at the end: our scouts have seen something very large moving in the east.\n\nYou have a small base, a kbot lab and two construction kbots. Build what you can. Keep your Commander alive." = "Comandante, el Core ha abierto brecha en el paso de Varrin. La única entrada al valle que tienes a tu espalda es el sinuoso desfiladero que tienes delante, y tu puesto avanzado en su boca occidental es lo único que se interpone.\n\nLos refuerzos están a doce minutos. Resiste hasta que lleguen. Las fuerzas del Core cruzarán el desfiladero en oleadas, cada una más dura que la anterior; espera bombarderos, y algo peor al final: nuestros exploradores han visto algo muy grande moviéndose por el este.\n\nTienes una pequeña base, un laboratorio de kbots y dos kbots de construcción. Construye lo que puedas. Mantén con vida a tu Comandante."
"Outpost, this is Arm Command. The relief force is twelve minutes out. Nothing gets through that pass before it arrives." = "Puesto avanzado, aquí el Mando Arm. Los refuerzos están a doce minutos. Nada cruza ese paso antes de que lleguen."
"Radar: aircraft inbound from the east. Bombers! Get your anti-air up." = "Radar: aeronaves acercándose desde el este. ¡Bombarderos! Prepara tus antiaéreos."
"Seismic contact in the pass. It's the big one, Commander: a Krogoth." = "Contacto sísmico en el paso. Es el grande, Comandante: un Krogoth."
"One minute! The relief force is entering the valley." = "¡Un minuto! Los refuerzos están entrando en el valle."

# apps/ta_game/scenarios/metal_rush.toml
"The first to make 15,000 metal wins. The Core plays rough." = "Gana el primero en producir 15.000 de metal. El Core juega duro."
"Commander, the mining rights to this planet go to whoever proves they can work it: the first side to extract fifteen thousand metal wins it outright.\n\nThe Core is racing you from the western plateau, and the Core has never been known to race fair. Expect raids on your extractors. Build fast, protect your economy, and if you can, take theirs apart.\n\nMetal makers count. Reclaimed metal counts. Whatever you make, counts." = "Comandante, los derechos de explotación de este planeta serán para quien demuestre que puede trabajarlo: el primer bando que extraiga quince mil de metal se los queda sin discusión.\n\nEl Core compite contigo desde la meseta occidental, y nunca se le ha conocido por competir limpio. Espera incursiones contra tus extractores. Construye rápido, protege tu economía y, si puedes, desmantela la suya.\n\nLos conversores de metal cuentan. El metal reciclado cuenta. Todo lo que produzcas cuenta."

# apps/ta_game/scenarios/titans.toml
"Titans" = "Titanes"
"Three Krogoths are walking toward your base. Bring them down." = "Tres Krogoths avanzan hacia tu base. Derríbalos."
"Commander, seismic stations round the basin are reading footfalls: three Krogoths, the Core's walking fortresses, are crossing the salt pans toward your base, one after another, each with an escort.\n\nNothing out there can stop them but you. A Krogoth's head laser reaches further than your D-gun, so keep your Commander back. Bombers, artillery and massed Zeus will bring one down. Lose your nerve and it will walk through your base.\n\nYou have a base with three factories, four construction kbots and a garrison. Destroy all three of them." = "Comandante, las estaciones sísmicas alrededor de la cuenca detectan pisadas: tres Krogoths, las fortalezas andantes del Core, cruzan las salinas hacia tu base, uno tras otro, cada uno con su escolta.\n\nAhí fuera nada puede detenerlos salvo tú. El láser de la cabeza de un Krogoth llega más lejos que tu cañón D, así que mantén atrás a tu Comandante. Los bombarderos, la artillería y los Zeus en masa pueden derribar uno. Si pierdes los nervios, atravesará tu base.\n\nTienes una base con tres fábricas, cuatro kbots de construcción y una guarnición. Destruye a los tres."
"Commander, seismic stations are reading footfalls round the basin. Three Krogoths are walking toward your base, one after another." = "Comandante, las estaciones sísmicas detectan pisadas alrededor de la cuenca. Tres Krogoths avanzan hacia tu base, uno tras otro."
"The first Krogoth has crossed the north-western rim. It is coming straight for you." = "El primer Krogoth ha cruzado el borde noroeste. Viene directo hacia ti."
"Keep your Commander back: that head laser reaches further than your D-gun." = "Mantén atrás a tu Comandante: ese láser de la cabeza llega más lejos que tu cañón D."
"The second Krogoth is through the northern pass, with rockets and anti-air round it." = "El segundo Krogoth ha cruzado el paso del norte, con cohetes y antiaéreos a su alrededor."
"The last of them, out of the north-east, with the heaviest escort yet. End this, Commander." = "El último, desde el noreste, con la escolta más pesada hasta ahora. Acaba con esto, Comandante."

# apps/ta_game/scenarios/until_dawn.toml
"Until Dawn" = "Hasta el amanecer"
"Night falls on the timber. Hold your ridge until the sun comes up." = "Cae la noche sobre el bosque. Defiende tu cresta hasta que salga el sol."
"Commander, night is falling over Timberline, and the Core is moving through the forest under it. Your outpost holds the western ridge: the only road out of the valley runs past it.\n\nThe relief column cannot move before first light. Until then you are on your own. In the dark and the rain their raiders will be on you before you see them, so build radar, and keep your floodlights burning.\n\nYou have a small base, a kbot lab and two construction kbots. Hold until dawn, and keep your Commander alive." = "Comandante, cae la noche sobre Timberline, y el Core avanza por el bosque al amparo de la oscuridad. Tu puesto avanzado defiende la cresta oeste: el único camino que sale del valle pasa por delante.\n\nLa columna de relevo no puede moverse antes del alba. Hasta entonces estás solo. En la oscuridad y bajo la lluvia, sus incursores te caerán encima antes de que los veas, así que construye radares y mantén encendidos los focos.\n\nTienes una base pequeña, un Kbot Lab y dos kbots de construcción. Resiste hasta el amanecer y mantén con vida a tu Comandante."
"Outpost Echo, the Core is moving through the timber tonight. Hold your ridge until first light: the relief column marches at dawn." = "Puesto Eco, el Core cruza el bosque esta noche. Defended la cresta hasta el alba: la columna de relevo marcha al amanecer."
"Raiders in the eastern trees. In this rain you will hear them before you see them." = "Incursores en el bosque del este. Con esta lluvia los oirás antes de verlos."
"Pyros in the north-eastern woods. Keep them out of the trees round your base: the timber will burn." = "Pyros en los bosques del noreste. Mantenlos lejos de los árboles que rodean tu base: la madera arderá."
"A convoy got through from the south-west. Four Zeus and two Jethros are yours, Commander." = "Un convoy ha llegado desde el suroeste. Cuatro Zeus y dos Jethros son tuyos, Comandante."
"Seismic contact in the south-east: heavy treads. They are saving the worst for the last hours of the night." = "Contacto sísmico al sureste: orugas pesadas. Guardan lo peor para las últimas horas de la noche."
"Sunrise in one minute. The relief column is at the river. Hold on!" = "Amanece en un minuto. La columna de relevo está en el río. ¡Aguantad!"


"Check effect frame counts and dimensions. Reborn needs bounded animation streaming or atlas paging for this full set; test actual gameplay on the target GPU." = "Revisa la cantidad y las dimensiones de los fotogramas de efectos. Reborn necesita carga progresiva de animaciones o paginación del atlas con memoria limitada para este conjunto; prueba partidas reales en la GPU de destino."
"Large effect archives" = "Archivos de efectos grandes"
"These archives exceed the 256 MiB aggregate GAF decode budget. Reborn rejects the oversized decode instead of exhausting memory." = "Estos archivos superan el presupuesto total de decodificación GAF de 256 MiB. Reborn rechaza la decodificación excesiva en lugar de agotar la memoria."
"Reduce or split oversized effects. Reborn needs per-entry decoding or streaming before raising the resource allowance." = "Reduce o divide los efectos demasiado grandes. Reborn necesita decodificación por entrada o carga progresiva antes de aumentar el límite de recursos."
"Missing weapons and wreck assets" = "Armas y recursos de restos ausentes"
"The review found 27 missing data references, including explosion weapons and six feature graphics or models. A missing reference does not always mean the affected behavior is used in play." = "La revisión encontró 27 referencias de datos ausentes, incluidas armas de explosión y seis gráficos o modelos de objetos. Una referencia ausente no siempre significa que el comportamiento afectado se use en la partida."
"Use the local automated report to locate each source reference. Supply the missing assets, correct the reference, or explain why the unused definition is intentional." = "Usa el informe automático local para localizar cada referencia de origen. Añade los recursos ausentes, corrige la referencia o explica por qué la definición sin usar es intencionada."
"Inherited base-game placeholders" = "Marcadores heredados del juego base"
"These rejected placeholder files come from the base game in the reviewed installation, not Escalation. They do not establish a mod defect." = "Estos archivos de marcador rechazados proceden del juego base en la instalación probada, no de Escalation. No demuestran un defecto del mod."
"Use the local report's layer field to verify origin. Only replace these assets if your mod intentionally overrides them." = "Comprueba el origen en el campo de capa del informe local. Sustituye estos recursos solo si tu mod los reemplaza intencionadamente."
"Computer players can stall" = "Los jugadores de IA pueden atascarse"
"AI Boost is included and computer players work on Asteroid Field, but can stall on some other space maps." = "AI Boost está incluido y los jugadores de IA funcionan en Asteroid Field, pero pueden atascarse en otros mapas espaciales."
"Test each space map with computer players before publishing it. Asteroid Field is the reviewed starting point." = "Prueba cada mapa espacial con jugadores de IA antes de publicarlo. Asteroid Field es el punto de partida revisado."
"Damaged optional map archives" = "Archivos de mapas opcionales dañados"
"The optional map packs contain three damaged map archives. These are separate downloads and may not be present in your installation." = "Los paquetes de mapas opcionales contienen tres archivos de mapas dañados. Son descargas independientes y quizá no estén en tu instalación."
"Import working maps individually. Rebuild or replace damaged archives before distributing a map pack." = "Importa los mapas que funcionen de forma individual. Reconstruye o sustituye los archivos dañados antes de distribuir un paquete de mapas."
"Unfinished preview armies" = "Ejércitos preliminares sin terminar"
"Its new armies use ARM's name, and some units are unfinished in this early preview." = "Sus nuevos ejércitos usan el nombre ARM y algunas unidades están sin terminar en esta versión preliminar."
"Give each army its intended side identity and complete its unit data and assets. Check every faction in a skirmish." = "Asigna a cada ejército su identidad de facción y completa los datos y recursos de sus unidades. Comprueba cada facción en una escaramuza."
"Expanded ARM and CORE armies with new units and weapons." = "Ejércitos de ARM y CORE ampliados con nuevas unidades y armas."
"549 UNITS" = "549 UNIDADES"
"177 MAPS" = "177 MAPAS"
"Gold 10.2.0 installs and plays: computer players build and fight, every unit is painted and every explosion drawn. A few wrecks have no model in the mod's own files." = "Gold 10.2.0 se instala y se juega: los jugadores controlados por el ordenador construyen y combaten, todas las unidades están pintadas y todas las explosiones se dibujan. Algunos restos no tienen modelo en los archivos del propio mod."
"Total Annihilation as Cavedog might have carried it on: every unit earns its place, hundreds more join, and a third tech level tops it off." = "Total Annihilation tal como Cavedog podría haberlo continuado: cada unidad se gana su sitio, se suman cientos más y un tercer nivel tecnológico lo corona."
"500 UNITS" = "500 UNIDADES"
"105 MAPS" = "105 MAPAS"
"TECH 3" = "NIVEL TEC. 3"
"Faster games that keep the strategy: new units, each carefully balanced, and hard-hitting armies from the start." = "Partidas más rápidas que conservan la estrategia: nuevas unidades, cada una cuidadosamente equilibrada, y ejércitos contundentes desde el principio."
"FASTER GAMES" = "PARTIDAS MÁS RÁPIDAS"
"297 UNITS" = "297 UNIDADES"
"Still in alpha, and a big download." = "Aún en fase alfa, y una descarga grande."
"Big and brutal: 512 units, fierce fighting, and new sounds and effects throughout." = "Grande y brutal: 512 unidades, combates feroces y nuevos sonidos y efectos por todas partes."
"512 UNITS" = "512 UNIDADES"
"91 MAPS" = "91 MAPAS"
"The optional map weapons in its download are left out." = "Se excluyen las armas de mapa opcionales de su descarga."
"A third army, the Talon, from ten years of the community's ideas: teleporters, air transports that carry whole squads, and more." = "Un tercer ejército, los Talon, fruto de diez años de ideas de la comunidad: teletransportadores, transportes aéreos que llevan escuadrones enteros y mucho más."
"NEW RACE" = "NUEVA RAZA"
"Choose TAL as your side in a skirmish." = "Elige TAL como bando en una escaramuza."
"Cavedog's style, kept simple: every unit has a clear job and looks as if it always belonged." = "El estilo de Cavedog, sin complicaciones: cada unidad tiene una función clara y parece que siempre hubiera estado ahí."
"CLASSIC STYLE" = "ESTILO CLÁSICO"
"NEW COMMANDERS" = "NUEVOS COMANDANTES"
"Classic BattleTech at Total Annihilation's scale: the Inner Sphere against the Clans, with walking mechs." = "El BattleTech clásico a la escala de Total Annihilation: la Esfera Interior contra los Clanes, con mechs que caminan."
"BATTLETECH" = "BATTLETECH"
"NEW SIDES" = "NUEVOS BANDOS"
"Computer players are weaker as the Inner Sphere." = "Los jugadores IA son más débiles con la Esfera Interior."
"The original's feel with well-balanced units and structures, tuned by veterans of the game." = "La sensación del original con unidades y estructuras bien equilibradas, ajustadas por veteranos del juego."
"CLASSIC FEEL" = "SENSACIÓN CLÁSICA"
"Computer players struggle as ARM." = "Los jugadores IA tienen dificultades con el ARM."
"An add-on race in the making: new units and new weapons for a third and a fourth army." = "Una raza adicional en desarrollo: nuevas unidades y nuevas armas para un tercer y un cuarto ejército."
"NEW RACES" = "NUEVAS RAZAS"
"PREVIEW" = "AVANCE"
"An early preview: its new armies go by ARM's name, and some of their units are unfinished." = "Un avance temprano: sus nuevos ejércitos usan el nombre del ARM y algunas de sus unidades están sin terminar."
"Take ARM and CORE into space with command cruisers and fleets of warships." = "Lleva a ARM y CORE al espacio con cruceros de mando y flotas de naves de guerra."
"SPACE WARFARE" = "GUERRA ESPACIAL"
"172 UNITS" = "172 UNIDADES"
"AI Boost is already included. Computer players work on Asteroid Field, but can stall on some space maps. The optional map packs contain three damaged map archives; import working maps individually." = "AI Boost ya está incluido. La IA funciona en Asteroid Field, pero puede atascarse en algunos mapas espaciales. Los paquetes de mapas opcionales contienen tres archivos de mapas dañados; importa los mapas que funcionen por separado."
"Combat Zone TA: three new sides in a semi-realistic war." = "Combat Zone TA: tres nuevos bandos en una guerra semirrealista."
"Nothing to download: it was made for the Spring engine." = "No hay nada que descargar: se hizo para el motor Spring."
"The One Year War of Mobile Suit Gundam: the Federation against Zeon." = "La Guerra de un Año de Mobile Suit Gundam: la Federación contra Zeon."
"ANIME" = "ANIME"

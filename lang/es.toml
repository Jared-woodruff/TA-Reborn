"{name} burning weapon" = "arma incendiaria de {name}"
"{category} {key} sound" = "sonido {key} de {category}"
"[{section}] needs a faction name and starting commander." = "[{section}] necesita un nombre de facción y un Comandante inicial."
"Set name and commander to a valid faction and UnitName." = "Asigna a name y commander una facción y un UnitName válidos."
"{name} starting commander" = "Comandante inicial de {name}"
"Owner of a build list for the computer players" = "Propietario de una lista de construcción de los jugadores IA"
"{name} build option for the computer players" = "opción de construcción de {name} para los jugadores IA"
"Download build-menu owner" = "Propietario del menú de construcción de descargas"
"{name} build option" = "opción de construcción de {name}"
"Missing [GlobalHeader]; this map has no usable metadata." = "Falta [GlobalHeader]; este mapa no tiene metadatos utilizables."
"Export a matching OTA with a GlobalHeader and the desired game-type schemas." = "Exporta un OTA correspondiente con un GlobalHeader y los esquemas de tipo de juego deseados."
"Map terrain, without which the map is left out of the lists" = "Terreno del mapa, sin el cual el mapa queda fuera de las listas"
"Map meteor weapon" = "Arma de meteoritos del mapa"
"Map placed unit/feature" = "Unidad o elemento colocado en el mapa"
"This tolerant TDF parse contains no sections; section-based consumers ignore it." = "Este análisis TDF tolerante no contiene secciones; lo que trabaja por secciones lo ignora."
"Check the intended format and section headers if this file should define game content." = "Comprueba el formato previsto y los encabezados de sección si este archivo debe definir contenido del juego."
"{what} defined here is never used: {later} ({whose}) defines it too and comes later, so the game uses that one." = "{what} definido aquí nunca se usa: {later} ({whose}) también lo define y viene después, así que el juego usa ese."
"{n} definitions in this file are never used: other files define them too and come later, so the game uses those (for one, {what} is also in {later}, {whose})." = "{n} definiciones de este archivo nunca se usan: otros archivos también las definen y vienen después, así que el juego usa esas (por ejemplo, {what} también está en {later}, {whose})."
"Replace those files in the mod (give yours their paths), or name your file so that it sorts after them." = "Sustituye esos archivos en el mod (dale a los tuyos sus rutas) o nombra tu archivo de modo que se ordene después de ellos."
"{name} production button" = "botón de producción de {name}"
"No playable side definitions were loaded." = "No se cargó ninguna definición de bando jugable."
"Include gamedata/sidedata.tdf or inherit the base game's valid sides." = "Incluye gamedata/sidedata.tdf o hereda los bandos válidos del juego base."
"Include the referenced asset/definition, correct its name, or declare and install the required mod dependency. Names are case-insensitive." = "Incluye el recurso o la definición a los que se hace referencia, corrige su nombre o declara e instala la dependencia de mod necesaria. Los nombres no distinguen mayúsculas de minúsculas."
"Model texture: textures {names} are missing." = "Textura de modelo: faltan las texturas {names}."
"{whats}: {what} is an empty file here, which blanks it out: nothing of it is read." = "{whats}: {what} es aquí un archivo vacío, lo que lo anula: no se lee nada de él."
"{whats}: {what} is missing." = "{whats}: falta {what}."
"Referenced weapon explosions require at least {texels} padded sprite texels, beyond a {side} x {side} reference atlas, even drawn reduced. Frames will be omitted at this capacity; map features, generated effects and shelf packing need additional room." = "Las explosiones de armas referenciadas requieren al menos {texels} texeles de sprite con relleno, más de lo que cabe en un atlas de referencia de {side} x {side}, incluso dibujadas reducidas. Se omitirán fotogramas con esta capacidad; los elementos del mapa, los efectos generados y la colocación por estantes necesitan espacio adicional."
"Reduce explosion frame sizes/counts or split optional effects. Test on the target GPU; this static check uses a reference atlas size." = "Reduce el tamaño o el número de fotogramas de las explosiones o divide los efectos opcionales. Prueba en la GPU de destino; esta comprobación estática usa un tamaño de atlas de referencia."
"{what} has no frames or contains a frame larger than the {side}-pixel reference atlas side including padding." = "{what} no tiene fotogramas o contiene uno mayor que el lado de {side} píxeles del atlas de referencia, relleno incluido."
"Include usable frames and resize oversized animation frames." = "Incluye fotogramas utilizables y redimensiona los fotogramas de animación demasiado grandes."
"{name} ({px} px)" = "{name} ({px} px)"
"{n} more" = "{n} más"
"The weapons' explosions take {full} Mi texels as painted, more than the {budget} Mi the game gives them in a {side} x {side} atlas: {n} of them, larger than TA's own, are drawn reduced to {share}% of their texels across, each as big as painted ({named})." = "Las explosiones de las armas ocupan {full} Mi texeles tal como están pintadas, más de los {budget} Mi que el juego les da en un atlas de {side} x {side}: {n} de ellas, mayores que las del propio TA, se dibujan reducidas al {share}% de sus texeles de ancho, cada una con el tamaño con que se pintó ({named})."
"Nothing to do: the game draws them so. Smaller paintings would keep more of their detail." = "No hay nada que hacer: el juego las dibuja así. Unas pinturas más pequeñas conservarían más detalle."
"Large: {frames} frames up to {largest} pixels across, {millions} million pixels in all, more than the game decodes at once. It reads them a frame at a time and draws them reduced, each as big as painted: a weapon's explosion is read so." = "Grande: {frames} fotogramas de hasta {largest} píxeles de ancho, {millions} millones de píxeles en total, más de lo que el juego decodifica de una vez. Los lee fotograma a fotograma y los dibuja reducidos, cada uno con el tamaño con que se pintó: así se lee la explosión de un arma."
"Nothing to do: the game draws it so. Smaller paintings would load faster and keep more of their detail." = "No hay nada que hacer: el juego la dibuja así. Unas pinturas más pequeñas cargarían más rápido y conservarían más detalle."
"Build lists for the computer players (TA 3.1's [CANBUILD]). Builders: {builders}; entries: {entries}." = "Listas de construcción para los jugadores IA (el [CANBUILD] de TA 3.1). Constructores: {builders}; entradas: {entries}."
"Computer players build from them. Build menus offer what the mod's menu pages and download lists put on them, as TA's did: what only these lists name is the computer players' alone." = "Los jugadores IA construyen a partir de ellas. Los menús de construcción ofrecen lo que ponen en ellos las páginas de menú y las listas de descargas del mod, como hacían los de TA: lo que solo nombran estas listas es exclusivo de los jugadores IA."
"Side panels laid out for a screen {height} pixels tall, as the patched engines of later years drew them (TA's are 480). Pages: {pages}." = "Paneles laterales dispuestos para una pantalla de {height} píxeles de alto, como los dibujaban los motores parcheados de años posteriores (los de TA miden 480). Páginas: {pages}."
"The classic interface lays them out as the mod does: its build places, page arrows and orders where the mod puts them." = "La interfaz clásica los dispone como el mod: sus casillas de construcción, sus flechas de página y sus órdenes donde el mod las pone."
"Build buttons off TA's grid of 64-pixel places: several sharing a place, or one taking several. Buttons: {buttons}; pages: {pages}." = "Botones de construcción fuera de la cuadrícula de casillas de 64 píxeles de TA: varios que comparten una casilla, o uno que ocupa varias. Botones: {buttons}; páginas: {pages}."
"The classic interface lays them out as the mod does, and a click builds the unit of the button under it. The modern interface shows a place several buttons share as one picture, its parts marked." = "La interfaz clásica los dispone como el mod, y un clic construye la unidad del botón que hay bajo el cursor. La interfaz moderna muestra una casilla que comparten varios botones como una sola imagen, con sus partes marcadas."
"Scripts asking the engine for unit values of TA's later patches ({values}). Scripts: {scripts}." = "Scripts que piden al motor valores de unidad de parches posteriores de TA ({values}). Scripts: {scripts}."
"TA Reborn answers them as those engines did: TA 3.1's questions about units by their IDs (69 to 75), a later patch's cloak (111)." = "TA Reborn les responde como lo hacían esos motores: las preguntas de TA 3.1 sobre unidades indicadas por su ID (69 a 75), el camuflaje de un parche posterior (111)."
"TA Reborn finds a weapon by its name and never reads its ID: IDs make no difference here." = "TA Reborn encuentra cada arma por su nombre y nunca lee su ID: aquí los ID no cambian nada."
"Weapon IDs past 255, the highest TA's own engine numbered (the weapon patches of later years went further). Weapons: {n}; the highest ID: {max}." = "ID de armas por encima de 255, el más alto que numeraba el propio motor de TA (los parches de armas de años posteriores llegaban más lejos). Armas: {n}; el ID más alto: {max}."
"Weapons sharing an ID with another weapon: {names}." = "Armas que comparten ID con otra arma: {names}."
"Sides of its own: {names}." = "Bandos propios del mod: {names}."
"Offered with the others when a skirmish or a multiplayer battle is set up." = "Se ofrecen con los demás al preparar una escaramuza o una batalla multijugador."
"Campaigns of its own: {n}." = "Campañas propias del mod: {n}."
"Played from the campaign screen, with TA's own." = "Se juegan desde la pantalla de campañas, junto a las de TA."
"Files for TA's own computer players (ai/): {n}." = "Archivos para los jugadores IA del propio TA (ai/): {n}."
"Not used: TA Reborn's computer players are its own. They build from the mod's build lists and menus." = "Sin uso: TA Reborn tiene sus propios jugadores IA. Construyen a partir de las listas de construcción y los menús del mod."
"Programs and engine patches: {names}." = "Programas y parches del motor: {names}."
"Not used: TA Reborn runs no program a mod brings. What a patch changed in TA's engine is there only where TA Reborn plays it itself, as told here." = "Sin uso: TA Reborn no ejecuta ningún programa que traiga un mod. Lo que un parche cambiaba en el motor de TA solo está donde TA Reborn lo reproduce por sí mismo, como se indica aquí."
"This file is empty: TA's way of blanking out a file of the same name below it (the original game's, or that of a mod it is mounted over). The game reads nothing from it." = "Este archivo está vacío: es la forma que tiene TA de anular un archivo del mismo nombre que haya debajo (el del juego original o el de un mod sobre el que se monta). El juego no lee nada de él."
"{n} empty files here ({files}): TA's way of blanking out files of the same names below them (the original game's, or those of a mod they are mounted over). The game reads nothing from them." = "{n} archivos vacíos aquí ({files}): es la forma que tiene TA de anular archivos de los mismos nombres que haya debajo (los del juego original o los de un mod sobre el que se montan). El juego no lee nada de ellos."
"Nothing to do if they are meant to remove those files. If one should hold data, export it again." = "No hay nada que hacer si su fin es quitar esos archivos. Si alguno debe contener datos, expórtalo de nuevo."
"Texture {name} has {frames} frames; Reborn's model vertices address at most 255 and this entry uses fallback paint." = "La textura {name} tiene {frames} fotogramas; los vértices de los modelos de Reborn direccionan 255 como máximo y esta entrada usa pintura alternativa."
"Reduce this texture entry to at most 255 frames." = "Reduce esta entrada de textura a 255 fotogramas como máximo."
"Texture {name} ({frames} frames) falls back: the textures the models paint with fill the reference GPU profile's {banks} arrays of {layers} layers ({before} layers before it; one is reserved for fallback). Actual device limits may differ." = "La textura {name} ({frames} fotogramas) recurre a la alternativa: las texturas con que se pintan los modelos llenan las {banks} matrices de {layers} capas del perfil de GPU de referencia ({before} capas antes de ella; una está reservada para la alternativa). Los límites reales del dispositivo pueden diferir."
"Consolidate duplicate textures or reduce animation/team frame counts. Test on the target GPU; higher limits do not fix unsupported frame counts." = "Consolida las texturas duplicadas o reduce el número de fotogramas de animación o de equipo. Prueba en la GPU de destino; unos límites más altos no arreglan un número de fotogramas no admitido."
"{script} declares piece {piece}, which is absent from {model}. Any animation or position query using it has no matching model part." = "{script} declara la pieza {piece}, que no está en {model}. Cualquier animación o consulta de posición que la use no tiene una parte de modelo correspondiente."
"{script} declares pieces {pieces}, which are absent from {model}. Any animation or position query using them has no matching model part." = "{script} declara las piezas {pieces}, que no están en {model}. Cualquier animación o consulta de posición que las use no tiene una parte de modelo correspondiente."
"Confirm that these are intentional virtual/helper pieces; otherwise use matching model and COB files or align the BOS piece declarations with the model's piece names." = "Confirma que son piezas virtuales o auxiliares intencionadas; si no, usa archivos de modelo y COB que se correspondan o ajusta las declaraciones de piezas del BOS a los nombres de piezas del modelo."
"{unit} has {weapon} but its script {script} has no {function}: if the weapon fires, its shots leave from the unit's centre, not a barrel." = "{unit} tiene {weapon}, pero su script {script} no tiene {function}: si el arma dispara, sus disparos salen del centro de la unidad, no de un cañón."
"{unit} has {weapons} but its script {script} has no {functions}: if they fire, their shots leave from the unit's centre, not a barrel." = "{unit} tiene {weapons}, pero su script {script} no tiene {functions}: si disparan, sus disparos salen del centro de la unidad, no de un cañón."
"Add the functions to the unit's BOS script, returning the pieces the shots leave from, and recompile." = "Añade las funciones al script BOS de la unidad, devolviendo las piezas de las que salen los disparos, y recompila."
"{unit} builds but its script {script} has no QueryNanoPiece: its build spray comes from the unit's centre." = "{unit} construye, pero su script {script} no tiene QueryNanoPiece: su chorro de construcción sale del centro de la unidad."
"Add QueryNanoPiece to the unit's BOS script, returning its nano-lathe piece, and recompile." = "Añade QueryNanoPiece al script BOS de la unidad, devolviendo su pieza del nanotorno, y recompila."
"{unit} can be built but has no picture ({picture}): TA's classic panels and the encyclopaedia show none; Reborn's own panel draws one from its model." = "{unit} se puede construir, pero no tiene imagen ({picture}): los paneles clásicos de TA y la enciclopedia no muestran ninguna; el panel propio de Reborn dibuja una a partir de su modelo."
"Add a 64 × 64 PCX of the unit to unitpics/." = "Añade un PCX de 64 × 64 de la unidad a unitpics/."
"Re-export this asset in the original TA format, within Reborn's documented parser limits; replace truncated or corrupt files." = "Vuelve a exportar este recurso en el formato original de TA, dentro de los límites documentados del analizador de Reborn; sustituye los archivos truncados o dañados."
"The game cannot read this file: {error}" = "El juego no puede leer este archivo: {error}"
"The section name [{name} has no closing ]." = "El nombre de sección [{name} no tiene el ] de cierre."
"[{name}] has no { } body after it: what follows is read into the section around it." = "[{name}] no tiene cuerpo { } después: lo que sigue se lee dentro de la sección que lo rodea."
"This } closes no section." = "Este } no cierra ninguna sección."
"A { opened on this line is never closed." = "Una { abierta en esta línea nunca se cierra."
"[{name}] opened on this line is never closed: any section after it is read as part of it." = "[{name}] abierta en esta línea nunca se cierra: cualquier sección posterior se lee como parte de ella."
"A /* comment opened on this line never ends: the rest of the file is read as a comment." = "Un comentario /* abierto en esta línea nunca termina: el resto del archivo se lee como comentario."


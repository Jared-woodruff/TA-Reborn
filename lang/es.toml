# crates/ta_data/src/validation.rs
"The effective content set exceeds the validation file budget." = "El contenido efectivo supera el presupuesto de archivos de la validación."
"Split the content into smaller optional packs, then validate each pack." = "Divide el contenido en paquetes opcionales más pequeños y valida cada uno."
"No files of this mod were available to validate." = "No había archivos de este mod que validar."
"Install the mod's TA data archives or loose files, then validate again." = "Instala los archivos de datos de TA del mod o sus archivos sueltos y vuelve a validar."
"This mod holds nothing the data checks read: no units, weapons, features, maps, models, scripts, animations or sounds (music, documents and pictures are not checked)." = "Este mod no contiene nada que lean las comprobaciones de datos: ni unidades, armas, elementos, mapas, modelos, scripts, animaciones ni sonidos (la música, los documentos y las imágenes no se comprueban)."
"Nothing to do if that is what the mod is. If it should change the game's data, check that its files are in the folders the game reads (units/, weapons/, maps/…)." = "No hay nada que hacer si el mod es así. Si debe cambiar los datos del juego, comprueba que sus archivos estén en las carpetas que lee el juego (units/, weapons/, maps/…)."
"No supported effective files were available to validate." = "No había archivos efectivos compatibles que validar."
"Install the original game's or the mod's TA data archives, then validate again." = "Instala los archivos de datos de TA del juego original o del mod y vuelve a validar."
"Validation was cancelled; remaining files and references were not checked." = "La validación se canceló; los archivos y referencias restantes no se comprobaron."
"Run validation again to obtain a complete report." = "Vuelve a validar para obtener un informe completo."
"The cumulative validation read budget was exceeded." = "Se superó el presupuesto acumulado de lectura de la validación."
"Split optional content into smaller packs, then validate again." = "Divide el contenido opcional en paquetes más pequeños y vuelve a validar."
"With this mod on, the original game's {archive} is not read: the mod takes its place (an archive of its own of that name, one its mod.toml's replaces names, or one its installation is known to remove), as installing the mod in TA's folder did. What only the original's held is missing with the mod." = "Con este mod activado, el archivo {archive} del juego original no se lee: el mod ocupa su lugar (un archivo propio con ese nombre, uno que nombra el replaces de su mod.toml o uno que se sabe que su instalación elimina), como hacía instalar el mod en la carpeta de TA. Lo que solo contenía el original falta con el mod."
"Nothing to do if this is meant. To have the original's read beneath the mod instead, give the mod's archive another name, or take the name out of replaces in mod.toml." = "No hay nada que hacer si es intencionado. Para que se lea el del original bajo el mod, dale otro nombre al archivo del mod o quita el nombre de replaces en mod.toml."
"the original game's" = "del juego original"
"Reborn's own" = "propio de Reborn"
"{mod}'s" = "de {mod}"
"the file {path}" = "el archivo {path}"
"unit {name}" = "la unidad {name}"
"weapon {name}" = "el arma {name}"
"feature {name}" = "el elemento {name}"
"faction {name}" = "la facción {name}"
"movement class {name}" = "la clase de movimiento {name}"
"texture {name}" = "la textura {name}"
"sound {name} ({path})" = "el sonido {name} ({path})"
"sound category {name} (gamedata/sound.tdf)" = "la categoría de sonido {name} (gamedata/sound.tdf)"
"unit or feature {name}" = "la unidad o el elemento {name}"
"animation {entry} in {file}" = "la animación {entry} en {file}"
"it is an Ogg file without a Vorbis or FLAC stream, the ones the game plays" = "es un archivo Ogg sin flujo Vorbis ni FLAC, los que reproduce el juego"
"it is a Humongous sound block without its samples (no SDAT block within its length)" = "es un bloque de sonido Humongous sin sus muestras (ningún bloque SDAT dentro de su longitud)"
"it is neither a RIFF WAVE file nor another sound the game reads" = "no es un archivo RIFF WAVE ni otro sonido que lea el juego"
"it has no format chunk" = "no tiene bloque de formato"
"its format chunk is {n} bytes long, too short to read" = "su bloque de formato mide {n} bytes, demasiado corto para leerlo"
"its WAVE_FORMAT_EXTENSIBLE header is too short to read" = "su cabecera WAVE_FORMAT_EXTENSIBLE es demasiado corta para leerla"
"it has {n} channels (the game plays 1 to 32)" = "tiene {n} canales (el juego reproduce de 1 a 32)"
"its sample rate is {rate} (the game plays up to 768,000)" = "su frecuencia de muestreo es {rate} (el juego reproduce hasta 768 000)"
"its samples are {bits}-bit PCM, which the game does not play (up to 32-bit)" = "sus muestras son PCM de {bits} bits, que el juego no reproduce (hasta 32 bits)"
"its samples are {bits}-bit float, which the game does not play (32 or 64-bit)" = "sus muestras son de coma flotante de {bits} bits, que el juego no reproduce (32 o 64 bits)"
"its IMA ADPCM is {bits}-bit, which the game does not play (4-bit)" = "su IMA ADPCM es de {bits} bits, que el juego no reproduce (4 bits)"
"its codec ({tag}) is not one the game plays (PCM, ADPCM, float, A-law or µ-law)" = "su códec ({tag}) no es de los que reproduce el juego (PCM, ADPCM, coma flotante, A-law o µ-law)"
"it has no sample data" = "no tiene datos de muestras"
"Unknown COB opcode {opcode} at word {word}; the VM cannot execute this instruction. The remainder of this function cannot be decoded reliably." = "Opcode COB desconocido {opcode} en la palabra {word}; la VM no puede ejecutar esta instrucción. El resto de esta función no se puede decodificar de forma fiable."
"Recompile the BOS script with original-TA-compatible opcodes, or report the required opcode extension to Reborn's maintainers." = "Recompila el script BOS con opcodes compatibles con el TA original o comunica la extensión de opcode necesaria a los responsables de Reborn."
"COB instruction {instruction} at word {word} is truncated or crosses the next function entry point." = "La instrucción COB {instruction} en la palabra {word} está truncada o cruza el punto de entrada de la función siguiente."
"Recompile this COB from its BOS source; verify function offsets and inline operand counts." = "Recompila este COB desde su fuente BOS; verifica los desplazamientos de las funciones y el número de operandos en línea."
"COB instruction {instruction} at word {word} has an invalid piece index or axis." = "La instrucción COB {instruction} en la palabra {word} tiene un índice de pieza o un eje no válido."
"COB instruction {instruction} at word {word} has an invalid piece index." = "La instrucción COB {instruction} en la palabra {word} tiene un índice de pieza no válido."
"COB instruction {instruction} at word {word} has an invalid static variable index." = "La instrucción COB {instruction} en la palabra {word} tiene un índice de variable estática no válido."
"COB instruction {instruction} at word {word} has an invalid jump destination." = "La instrucción COB {instruction} en la palabra {word} tiene un destino de salto no válido."
"COB instruction {instruction} at word {word} has an invalid function index." = "La instrucción COB {instruction} en la palabra {word} tiene un índice de función no válido."
"Recompile the script with valid piece, variable, function and jump references." = "Recompila el script con referencias válidas a piezas, variables, funciones y saltos."
"This script asks the engine for unit value {values}, which Reborn does not answer: it reads 0, so what the script does with it may not happen as in the engine it was made for." = "Este script pide al motor el valor de unidad {values}, que Reborn no responde: se lee 0, así que lo que el script hace con él puede no ocurrir como en el motor para el que se hizo."
"A later patch of TA's engine defines these values: report them, and what the mod does with them, to Reborn's maintainers." = "Un parche posterior del motor de TA define estos valores: comunícalos, y lo que el mod hace con ellos, a los responsables de Reborn."
"This script sets unit value {values}, which Reborn does not answer: setting it does nothing, so what the script means by it does not happen as in the engine it was made for." = "Este script establece el valor de unidad {values}, que Reborn no responde: establecerlo no hace nada, así que lo que el script pretende con él no ocurre como en el motor para el que se hizo."
"The retained diagnostic/reference budget was exceeded. This is a partial report, not a clean validation." = "Se superó el presupuesto de diagnósticos y referencias retenidos. Este es un informe parcial, no una validación limpia."
"Reduce the pack's number of definitions or split optional content; rerun validation after resolving reported issues." = "Reduce el número de definiciones del paquete o divide el contenido opcional; vuelve a validar tras resolver los problemas indicados."
"{what} is defined twice; the game keeps both, two sides of one name." = "{what} se define dos veces; el juego conserva ambas, dos bandos con un mismo nombre."
"Give each side a name of its own, or remove the one not meant to be played." = "Dale a cada bando un nombre propio o elimina el que no deba jugarse."
"{what} is defined twice in this file; the game uses the later one." = "{what} se define dos veces en este archivo; el juego usa la última."
"Give each definition a name of its own, or remove the one not meant to be used." = "Dale a cada definición un nombre propio o elimina la que no deba usarse."
"{what} is also defined in {other}; the game uses this one ({this})." = "{what} también se define en {other}; el juego usa esta ({this})."
"The game opens archives only at the mod's top level; this one, in a subfolder, is never read." = "El juego solo abre archivos comprimidos en el nivel superior del mod; este, en una subcarpeta, nunca se lee."
"Move the archive to the mod's top level, or unpack its contents into the mod's folders." = "Mueve el archivo comprimido al nivel superior del mod o extrae su contenido en las carpetas del mod."
"The game's folders are inside {folder}: the game reads units/, weapons/, maps/… only at the mod's top level, so nothing in it is used." = "Las carpetas del juego están dentro de {folder}: el juego lee units/, weapons/, maps/… solo en el nivel superior del mod, así que nada de lo que hay dentro se usa."
"Move the contents of this folder up to the mod's top level." = "Sube el contenido de esta carpeta al nivel superior del mod."
"{n} files at the mod's top level are where the game never reads them; this one's kind is read from {home}." = "{n} archivos en el nivel superior del mod están donde el juego nunca los lee; los de este tipo se leen de {home}."
"{n} files under {folder} are where the game never reads them; this one's kind is read from {home}." = "{n} archivos de {folder} están donde el juego nunca los lee; los de este tipo se leen de {home}."
"Move each file to the folder the game reads its kind from." = "Mueve cada archivo a la carpeta de la que el juego lee los de su tipo."
"The game never reads this file: it reads {kind} files from {home}." = "El juego nunca lee este archivo: los archivos de {kind} se leen de {home}."
"Move it to that folder, or remove it if it is not needed." = "Muévelo a esa carpeta o elimínalo si no hace falta."
"This file cannot be read: {error}" = "Este archivo no se puede leer: {error}"
"Reinstall the package and check that its archives are intact and readable." = "Reinstala el paquete y comprueba que sus archivos estén intactos y se puedan leer."
"This text file exceeds the validator's per-file text budget and was not parsed." = "Este archivo de texto supera el presupuesto de texto por archivo del validador y no se analizó."
"Split large definition files into smaller files before validating again." = "Divide los archivos de definiciones grandes en otros más pequeños antes de volver a validar."
"Model texture" = "Textura de modelo"
"Map feature" = "Elemento del mapa"
"The terrain has no matching OTA metadata and cannot appear as a normal selectable map." = "El terreno no tiene metadatos OTA correspondientes y no puede aparecer como un mapa seleccionable normal."
"Include a matching maps/<name>.ota with a GlobalHeader and playable schemas." = "Incluye un maps/<name>.ota correspondiente con un GlobalHeader y esquemas jugables."
"This sound will not play: {problem}." = "Este sonido no se reproducirá: {problem}."
"Save it as a WAV file in PCM (8 or 16-bit) or IMA ADPCM, as TA's own sounds are." = "Guárdalo como archivo WAV en PCM (8 o 16 bits) o IMA ADPCM, como los sonidos de TA."
"Correct the brackets and braces around this line: the game reads the file as it is and skips or misplaces what follows." = "Corrige los corchetes y llaves alrededor de esta línea: el juego lee el archivo tal cual y omite o coloca mal lo que sigue."
"[{section}] footprint {x} × {z} is clamped to 1..{max} cells a side by Reborn." = "Reborn limita la huella de [{section}] de {x} × {z} a 1..{max} casillas por lado."
"Use footprints within the supported range and regenerate the matching yard map." = "Usa huellas dentro del intervalo admitido y regenera el yardmap correspondiente."
"Missing [UNITINFO]; this unit is skipped." = "Falta [UNITINFO]; esta unidad se omite."
"Add a UNITINFO section with a non-empty UnitName." = "Añade una sección UNITINFO con un UnitName no vacío."
"UNITINFO has no usable UnitName; this unit is skipped." = "UNITINFO no tiene un UnitName utilizable; esta unidad se omite."
"Give the unit a unique, non-empty UnitName and update its references." = "Dale a la unidad un UnitName único y no vacío y actualiza sus referencias."

"A right-click clears the selection or cancels the order you were about to give." = "Un clic derecho borra la selección o cancela la orden que ibas a dar."
"Right-click one of your units for a ring of its orders; hold the button and flick towards a choice. A controller's B does the same." = "Haz clic derecho en una de tus unidades para ver un anillo con sus órdenes; mantén el botón y desliza hacia una opción. El B del mando hace lo mismo."
"Hold the right button on one of your units, or middle-click it, for a ring of its orders; flick towards a choice and let go." = "Mantén el botón derecho sobre una de tus unidades, o haz clic central en ella, para ver un anillo con sus órdenes; desliza hacia una opción y suelta."
"Metal extractors must sit on metal: {overlay_metal} shows the metal map, and {area_mex} puts an extractor on every metal spot you circle." = "Los extractores de metal deben ir sobre metal: {overlay_metal} muestra el mapa de metal y {area_mex} pone un extractor en cada yacimiento que rodees con un círculo."
"Your Commander's D-gun ({dgun}) destroys almost anything it touches, including your own units in its path." = "El cañón D ({dgun}) de tu Comandante destruye casi todo lo que toca, incluidas tus propias unidades en su trayectoria."
"{perspective} climbs into the selected unit, or an ally's under the pointer, to see the battle through its eyes as it goes on with its orders. Escape climbs back out." = "{perspective} te sube a la unidad seleccionada, o a la de un aliado bajo el puntero, para ver la batalla a través de sus ojos mientras sigue con sus órdenes. Escape te saca de ella."
"Keep your metal and energy incomes above what you spend: building slows down for everything when a store runs dry." = "Mantén tus ingresos de metal y energía por encima de lo que gastas: cuando se agota una reserva, todo se construye más despacio."
"Right-clicking a factory's queued unit removes it; clicking it builds it next." = "Un clic derecho en una unidad en la cola de una fábrica la quita; un clic hace que se construya a continuación."
"Fight ({fight}) is attack-move: units stop to fight whatever they meet on the way." = "Combatir ({fight}) es avanzar atacando: las unidades se detienen a luchar contra todo lo que encuentren por el camino."
"Ctrl+click is force fire: the selection attacks whatever is there, your own units too, or the ground." = "Ctrl+clic es forzar disparo: la selección ataca lo que haya allí, aunque sean tus propias unidades, o el suelo."
"{select_builders} selects your constructors, {select_factories} your factories, {select_armed} your armed units, {select_on_screen} everything on the screen." = "{select_builders} selecciona tus constructores; {select_factories}, tus fábricas; {select_armed}, tus unidades armadas; {select_on_screen}, todo lo que hay en pantalla."
"Patrol ({patrol}) with constructors makes them repair, assist and reclaim along the route by themselves." = "Patrullar ({patrol}) con constructores hace que reparen, ayuden y reciclen por su cuenta a lo largo de la ruta."
"Put a constructor on duty ({duty}) and it works by itself: the economy, repairs, reclaiming or defence. Any order you give takes it back." = "Pon un constructor de servicio ({duty}) y trabajará por su cuenta: economía, reparaciones, reciclaje o defensa. Cualquier orden que des lo recupera."
"Drag with Reclaim ({reclaim}) to turn every wreck, rock and tree in a circle into metal and energy." = "Arrastra con Reciclar ({reclaim}) para convertir en metal y energía todos los restos, rocas y árboles de un círculo."
"Ctrl+1 to Ctrl+9 make control groups; tap the number twice to look at the group." = "Ctrl+1 a Ctrl+9 crean grupos de control; pulsa el número dos veces para mirar al grupo."
"Hold {players} to see every player's side, team, units and income (your allies' in full)." = "Mantén {players} para ver el bando, el equipo, las unidades y los ingresos de cada jugador (los de tus aliados, completos)."
"Radar towers show enemy units long before they come into sight: build one early." = "Las torres de radar muestran las unidades enemigas mucho antes de que estén a la vista: construye una pronto."
"Wind generators pay off on windy maps: the skirmish page shows each map's wind range." = "Los generadores eólicos compensan en los mapas con viento: la página de escaramuza muestra el rango de viento de cada mapa."
"Metal makers turn spare energy into metal, and stop when your energy runs dry." = "Los conversores de metal transforman la energía sobrante en metal y se detienen cuando se agota tu energía."
"Solar collectors fold shut for a few seconds when hit: tougher, but making no energy." = "Los colectores solares se cierran unos segundos al recibir un impacto: más resistentes, pero sin producir energía."
"Units gain veterancy with every kill: veterans aim better and shrug off damage." = "Las unidades ganan veteranía con cada baja: las veteranas apuntan mejor y aguantan más el daño."
"Shift adds to the orders a unit already has instead of replacing them." = "Shift añade órdenes a las que ya tiene una unidad en lugar de sustituirlas."
"Alt+drag while placing a building fills a rectangle with it: handy for solar farms and walls." = "Alt+arrastrar al colocar un edificio llena un rectángulo con él: útil para campos solares y muros."
"Double-click a unit to select every unit of its type on screen; {select_type} selects them map-wide." = "Doble clic en una unidad selecciona todas las de su tipo en pantalla; {select_type} las selecciona en todo el mapa."
"{idle_builder} selects the next idle constructor, {idle_factory} the next idle factory." = "{idle_builder} selecciona el siguiente constructor inactivo, y {idle_factory}, la siguiente fábrica inactiva."
"Wrecks can be resurrected by resurrection kbots, or reclaimed for most of their metal." = "Los kbots de resurrección pueden resucitar los restos, que también pueden reciclarse para recuperar la mayor parte de su metal."
"Hovering a unit shows its health, firepower and range; {overlay_path} shows where the selection can go." = "Al pasar el puntero sobre una unidad se ven su vida, su potencia de fuego y su alcance; {overlay_path} muestra adónde puede ir la selección."
"{last_alert} (or Backspace) looks at the last place your units were attacked; press it again for the one before." = "{last_alert} (o Backspace) muestra el último lugar donde atacaron a tus unidades; púlsala otra vez para ver el anterior."
"A notice or a piece of advice with LOOK on it takes you to the place, or the unit, when you click it." = "Un aviso o un consejo con VER te lleva al lugar o a la unidad cuando haces clic en él."
"{help} tells everything about the selected unit, or the one under the pointer: cost, speed, weapons, abilities." = "{help} lo cuenta todo sobre la unidad seleccionada o la que está bajo el puntero: coste, velocidad, armas, habilidades."
"{next_unit} looks at the next of your units off the screen; with units selected, the next of them." = "{next_unit} muestra la siguiente de tus unidades fuera de pantalla; con unidades seleccionadas, la siguiente de ellas."
"Ctrl+F6 to Ctrl+F9 store camera positions; F6 to F9 bring them back." = "Ctrl+F6 a Ctrl+F9 guardan posiciones de cámara; F6 a F9 las recuperan."
"Anti-air matters: bombers can wreck an undefended economy in one pass." = "La antiaérea importa: los bombarderos pueden arrasar una economía indefensa de una sola pasada."
"An advanced factory needs a lot of metal: build it once your extractors and power can feed it." = "Una fábrica avanzada necesita mucho metal: constrúyela cuando tus extractores y tu energía puedan sostenerla."
"Guarding a factory with a constructor adds its build power to the factory's production." = "Proteger una fábrica con un constructor suma su potencia de construcción a la producción de la fábrica."
"Moho mines extract far more metal than basic extractors: advanced constructors build them." = "Las minas Moho extraen mucho más metal que los extractores básicos: las construyen los constructores avanzados."
"Every game is kept as a replay: watch it from the main menu, and jump through it with the bar." = "Cada partida se conserva como repetición: mírala desde el menú principal y salta por ella con la barra."
"{overlay_sight} shows your sight, radar and sonar coverage; {overlay_height} shows the heights of the map." = "{overlay_sight} muestra tu cobertura de visión, radar y sonar; {overlay_height} muestra las alturas del mapa."
"The Commander can capture enemy units ({capture}): it takes a while, but the unit is yours." = "El Comandante puede capturar unidades enemigas ({capture}): lleva un tiempo, pero la unidad pasa a ser tuya."
"{photo_mode} opens photo mode: the battle holds still, and you can light, frame and focus a shot at up to 4K." = "{photo_mode} abre el modo foto: la batalla se detiene y puedes iluminar, encuadrar y enfocar una toma de hasta 4K."
"TIP" = "CONSEJO"
"Dismiss" = "Descartar"
"Don't show tips again" = "No volver a mostrar consejos"

# apps/ta_game/src/tutorial.rs
"THE BASICS" = "LO BÁSICO"
"Your Commander, the camera, metal, energy and a first factory." = "Tu Comandante, la cámara, el metal, la energía y una primera fábrica."
"Selecting units" = "Seleccionar unidades"
"The camera" = "La cámara"
"Metal and energy" = "Metal y energía"
"Factories" = "Fábricas"
"Welcome, Commander. The walking machine in the middle of the screen is your Commander: it builds, it fights, and losing it usually loses the battle. Click it to select it." = "Bienvenido, Comandante. La máquina andante en el centro de la pantalla es tu Comandante: construye, combate y, si lo pierdes, lo normal es que pierdas la batalla. Haz clic en él para seleccionarlo."
"Lost sight of it? {select_commander} selects the Commander from anywhere, and SHOW ME brings the camera to it." = "¿Lo has perdido de vista? {select_commander} selecciona al Comandante desde cualquier parte, y VER DÓNDE lleva la cámara hasta él."
"Look around. The arrow keys, the screen edges or dragging with the middle button scroll; the mouse wheel zooms towards the cursor, and dragging with the right button turns the view." = "Echa un vistazo. Las teclas de flecha, los bordes de la pantalla o arrastrar con el botón central desplazan la vista; la rueda del ratón hace zoom hacia el cursor, y arrastrar con el botón derecho gira la vista."
"Push the pointer against an edge of the screen to scroll, or turn the mouse wheel to zoom." = "Lleva el cursor hasta un borde de la pantalla para desplazar la vista, o gira la rueda del ratón para hacer zoom."
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the ECONOMY tab of the build menu at the bottom right and place it on the marked deposit." = "Todo se hace con metal y energía. El metal sale de los extractores colocados sobre yacimientos de metal. Selecciona al Comandante, elige el extractor de metal (Metal Extractor) en la pestaña ECONOMÍA del menú de construcción de abajo a la derecha y colócalo en el yacimiento marcado."
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the build menu on the left and place it on the marked deposit." = "Todo se hace con metal y energía. El metal sale de los extractores colocados sobre yacimientos de metal. Selecciona al Comandante, elige el extractor de metal (Metal Extractor) en el menú de construcción de la izquierda y colócalo en el yacimiento marcado."
"The outline turns green where the extractor can stand. Bring it onto the marked ring and click to place it." = "El contorno se vuelve verde donde se puede colocar el extractor. Llévalo al círculo marcado y haz clic para colocarlo."
"Energy comes from solar collectors and wind generators. Build a Solar Collector next to your Commander. The bars at the top show your stores and how fast they fill or drain; they warn you when one runs dry." = "La energía procede de colectores solares y generadores eólicos. Construye un colector solar (Solar Collector) junto a tu Comandante. Las barras de arriba muestran tus reservas y lo rápido que se llenan o se vacían; te avisan cuando una se agota."
"The Solar Collector is a flat, square panel. Pick it, then click on open ground near the Commander." = "El Solar Collector es un panel plano y cuadrado. Elígelo y luego haz clic en terreno despejado cerca del Comandante."
"Factories build your army. Build a Kbot Lab (on the FACTORY tab) on a flat spot near the Commander, and wait for it to finish." = "Las fábricas construyen tu ejército. Construye un laboratorio de kbots (Kbot Lab, en la pestaña FÁBRICA) en un lugar llano cerca del Comandante y espera a que esté terminado."
"Factories build your army. Build a Kbot Lab from the build menu on a flat spot near the Commander, and wait for it to finish." = "Las fábricas construyen tu ejército. Construye un laboratorio de kbots (Kbot Lab) desde el menú de construcción en un lugar llano cerca del Comandante y espera a que esté terminado."
"Building takes metal and energy as it goes: while either bar at the top is empty, everything builds more slowly." = "Construir consume metal y energía sobre la marcha: mientras alguna de las barras de arriba esté vacía, todo se construye más despacio."
"Select the Kbot Lab and click the Peewee three times to queue three of them (right-click one to take it off the queue). New units wait in front of the lab." = "Selecciona el Kbot Lab y haz clic tres veces en el Peewee para poner tres en cola (con un clic derecho quitas uno de la cola). Las unidades nuevas esperan delante del laboratorio."
"Click the lab itself on the map to select it: its build menu shows the units it makes." = "Haz clic en el propio laboratorio, en el mapa, para seleccionarlo: su menú de construcción muestra las unidades que fabrica."
"That is the whole cycle: extract, generate, build, fight. Keep both incomes above what you spend and keep your builders busy. Lesson complete!" = "Ese es el ciclo completo: extraer, generar, construir, combatir. Mantén ambos ingresos por encima de lo que gastas y a tus constructores ocupados. ¡Lección completada!"
"Select and group an army, attack-move, and destroy an enemy outpost." = "Selecciona y agrupa un ejército, avanza atacando y destruye un puesto avanzado enemigo."
"Box selection" = "Selección por recuadro"
"Control groups" = "Grupos de control"
"Attack-move" = "Avanzar atacando"
"Destroying a base" = "Destruir una base"
"Your Kbot Lab has built a squad of Peewees. Drag a box around them with the left mouse button to select them all." = "Tu Kbot Lab ha construido un escuadrón de Peewee. Arrastra un recuadro a su alrededor con el botón izquierdo del ratón para seleccionarlos a todos."
"Press the left button on open ground beside the squad, hold it, drag the box over them all and let go." = "Pulsa el botón izquierdo en terreno despejado junto al escuadrón, mantenlo pulsado, arrastra el recuadro sobre todos ellos y suelta."
"Press Ctrl+1 to make them group 1. Pressing 1 selects them again from anywhere; pressing it twice brings the camera to them." = "Pulsa Ctrl+1 para convertirlos en el grupo 1. Al pulsar 1 los vuelves a seleccionar desde cualquier parte; si lo pulsas dos veces, la cámara va hasta ellos."
"Hold Ctrl and press 1 while the squad is selected." = "Mantén Ctrl y pulsa 1 mientras el escuadrón está seleccionado."
"The enemy has an outpost at the marked place. Fight is attack-move: units walk there and take on whatever they meet on the way. Press {fight}, then click near the outpost." = "El enemigo tiene un puesto avanzado en el lugar marcado. Combatir es avanzar atacando: las unidades van hasta allí y se enfrentan a todo lo que encuentran por el camino. Pulsa {fight} y luego haz clic cerca del puesto."
"Select the squad first (press 1). Then press {fight}, or the Fight button among the orders, and click on the ground by the marked ring." = "Primero selecciona el escuadrón (pulsa 1). Luego pulsa {fight}, o el botón Combatir entre las órdenes, y haz clic en el suelo junto al círculo marcado."
"Destroy every building of the outpost. Its laser tower hits hard: keep the squad together, and queue reinforcements at the lab if you need them." = "Destruye todos los edificios del puesto. Su torre láser pega fuerte: mantén unido el escuadrón y pon refuerzos en cola en el laboratorio si los necesitas."
"Losing the fight? Pull the squad back, queue more Peewees at the lab and go in again with all of them together." = "¿Vas perdiendo el combate? Retira el escuadrón, pon más Peewee en cola en el laboratorio y vuelve al ataque con todos juntos."
"The outpost is gone. The wrecks it left are worth metal: builders reclaim them (next lesson). Lesson complete!" = "El puesto ha caído. Sus restos valen metal: los constructores los reciclan (siguiente lección). ¡Lección completada!"
"ORDERS LIKE A VETERAN" = "ÓRDENES DE VETERANO"
"Map views, area orders, building blocks and build queues." = "Vistas del mapa, órdenes de área, bloques de edificios y colas de construcción."
"Map overlays" = "Capas del mapa"
"Area orders" = "Órdenes de área"
"Building blocks" = "Bloques de edificios"
"Build queues" = "Colas de construcción"
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again. The MAP menu at the top right does the same." = "El mapa muestra lo que oculta el terreno. Pulsa {overlay_metal} para ver el mapa de metal ({overlay_path} muestra adónde pueden ir las unidades; {overlay_height}, las alturas; {overlay_sight}, la visión y el radar); la misma tecla lo vuelve a ocultar. El menú MAPA de arriba a la derecha hace lo mismo."
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again." = "El mapa muestra lo que oculta el terreno. Pulsa {overlay_metal} para ver el mapa de metal ({overlay_path} muestra adónde pueden ir las unidades; {overlay_height}, las alturas; {overlay_sight}, la visión y el radar); la misma tecla lo vuelve a ocultar."
"Press {overlay_metal}: the metal deposits light up all over the map." = "Pulsa {overlay_metal}: los yacimientos de metal se iluminan por todo el mapa."
"Select the Commander, press {area_mex} and drag a circle over the marked deposits: every metal spot inside gets an extractor, nearest first. A plain click takes the metal around the cursor." = "Selecciona al Comandante, pulsa {area_mex} y arrastra un círculo sobre los yacimientos marcados: cada yacimiento de metal del interior recibe un extractor, empezando por el más cercano. Un simple clic toma el metal alrededor del cursor."
"With the Commander selected, press {area_mex}, then press on the ground over the deposits and drag outwards: the circle grows as you drag." = "Con el Comandante seleccionado, pulsa {area_mex}; después mantén pulsado el botón sobre el terreno, encima de los yacimientos, y arrastra hacia fuera: el círculo crece a medida que arrastras."
"Many orders work on areas. Press {reclaim} (reclaim) and drag a circle over the rocks near your base: the Commander turns every one into metal." = "Muchas órdenes funcionan sobre áreas. Pulsa {reclaim} (reciclar) y arrastra un círculo sobre las rocas cercanas a tu base: el Comandante las convierte todas en metal."
"Rocks and wrecks are worth metal. With the Commander selected, press {reclaim}, then press on the ground and drag the circle over a few rocks." = "Las rocas y los restos valen metal. Con el Comandante seleccionado, pulsa {reclaim}; después mantén pulsado el botón sobre el terreno y arrastra el círculo sobre unas cuantas rocas."
"Hold Alt while you drag out a building to fill a whole block with it. Pick the Solar Collector, hold Alt and drag out a block of four or more." = "Mantén Alt mientras arrastras un edificio para llenar todo un bloque con él. Elige el Solar Collector, mantén Alt y arrastra un bloque de cuatro o más."
"Pick the Solar Collector, then hold Alt, press on the ground and drag: a block of outlines follows the pointer. Let go to place them all." = "Elige el Solar Collector; después mantén Alt, pulsa el botón sobre el terreno y arrastra: un bloque de contornos sigue al cursor. Suelta para colocarlos todos."
"The Commander's queued buildings show under BUILD QUEUE, beside its picture at the bottom of the screen. Click one to build it next (right-click drops it). A factory's queue works the same way." = "Los edificios en cola del Comandante aparecen en COLA DE CONSTRUCCIÓN, junto a su imagen en la parte inferior de la pantalla. Haz clic en uno para construirlo a continuación (con un clic derecho lo descartas). La cola de una fábrica funciona igual."
"The BUILD QUEUE shows while the Commander alone is selected and has buildings waiting. Click any but the first: that one is being built." = "La COLA DE CONSTRUCCIÓN aparece cuando solo está seleccionado el Comandante y tiene edificios en espera. Haz clic en cualquiera menos en el primero: ese ya se está construyendo."
"Area orders, building blocks and queues save you hundreds of clicks in a battle. Lesson complete!" = "Las órdenes de área, los bloques de edificios y las colas te ahorran cientos de clics en una batalla. ¡Lección completada!"
"HOLD THE LINE" = "MANTENER LA LÍNEA"
"Defences, radar, repairs, and the metal in wrecks." = "Defensas, radar, reparaciones y el metal de los restos."
"Defences" = "Defensas"
"Radar" = "Radar"
"Repairs" = "Reparaciones"
"Reclaiming wrecks" = "Reciclar restos"
"Raiders will come from the marked direction. Build a Light Laser Tower (on the DEFENCE tab) in the marked ring: towers shoot whatever comes in range." = "Llegarán incursores desde la dirección marcada. Construye una torre láser ligera (Light Laser Tower, en la pestaña DEFENSA) en el círculo marcado: las torres disparan a todo lo que entra en su alcance."
"Raiders will come from the marked direction. Build a Light Laser Tower from the build menu in the marked ring: towers shoot whatever comes in range." = "Llegarán incursores desde la dirección marcada. Construye una torre láser ligera (Light Laser Tower) desde el menú de construcción en el círculo marcado: las torres disparan a todo lo que entra en su alcance."
"The Light Laser Tower is a small gun on a post. Pick it, put it in the ring and wait for it to finish." = "La Light Laser Tower es un pequeño cañón sobre un poste. Elígela, colócala en el círculo y espera a que esté terminada."
"Build a Radar Tower (on the SENSORS tab) near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "Construye una torre de radar (Radar Tower, en la pestaña RADAR) cerca de tu base. El radar muestra a los enemigos como puntos en el mapa y en el minimapa mucho antes de que tus unidades los vean."
"Build a Radar Tower from the build menu near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "Construye una torre de radar (Radar Tower) desde el menú de construcción cerca de tu base. El radar muestra a los enemigos como puntos en el mapa y en el minimapa mucho antes de que tus unidades los vean."
"The Radar Tower is a tall mast. Pick it, place it near the Commander and wait for it to finish." = "La Radar Tower es un mástil alto. Elígela, colócala cerca del Comandante y espera a que esté terminada."
"Here they come: raiders on your radar. Keep the Commander by the tower and let them come to you: together they hold the line." = "Ahí vienen: incursores en tu radar. Mantén al Comandante junto a la torre y deja que vengan a ti: juntos, el Comandante y la torre mantienen la línea."
"Do not chase them: the tower only fights what comes in range. Keep the Commander beside it; while it fights, the Commander can mend it ({repair}, then click the tower)." = "No los persigas: la torre solo combate lo que entra en su alcance. Mantén al Comandante a su lado; mientras la torre combate, el Comandante puede repararla ({repair} y luego haz clic en la torre)."
"The fight left a building damaged. Select the Commander, press {repair} and click it: builders mend what is damaged." = "El combate ha dejado un edificio dañado. Selecciona al Comandante, pulsa {repair} y haz clic en él: los constructores reparan lo que está dañado."
"With the Commander selected, press {repair}, then click the damaged building. Its health bar fills as it is mended." = "Con el Comandante seleccionado, pulsa {repair} y luego haz clic en el edificio dañado. Su barra de vida se llena a medida que se repara."
"The raiders left wrecks, and wrecks are worth metal. Select the Commander, press {reclaim} and click a wreck, or drag a circle over them all." = "Los incursores han dejado restos, y los restos valen metal. Selecciona al Comandante, pulsa {reclaim} y haz clic en unos restos, o arrastra un círculo sobre todos ellos."
"Wrecks lie where the raiders fell. With the Commander selected, press {reclaim} and click one: the metal bar rises as it is taken apart." = "Los restos están donde cayeron los incursores. Con el Comandante seleccionado, pulsa {reclaim} y haz clic en unos restos: la barra de metal sube a medida que se desmontan."
"Towers hold ground while your army is elsewhere, radar sees what is coming, and builders mend and recycle. Lesson complete!" = "Las torres defienden el terreno mientras tu ejército está en otra parte, el radar ve lo que se avecina y los constructores reparan y reciclan. ¡Lección completada!"
"BUILDERS AND FACTORIES" = "CONSTRUCTORES Y FÁBRICAS"
"Builders that help, factories that keep building, patrols and standing orders." = "Constructores que ayudan, fábricas que no paran de producir, patrullas y órdenes permanentes."
"Construction units" = "Unidades de construcción"
"Helping a factory" = "Ayudar a una fábrica"
"Rally points" = "Puntos de reunión"
"Standing orders" = "Órdenes permanentes"
"One builder is slow. Select the Kbot Lab and build a Construction Kbot: it builds what the Commander builds, and more besides." = "Un solo constructor es lento. Selecciona el Kbot Lab y fabrica un kbot de construcción (Construction Kbot): construye lo mismo que el Comandante, y más cosas."
"Click the lab on the map to select it; the Construction Kbot is in its build menu. Wait for it to walk out." = "Haz clic en el laboratorio, en el mapa, para seleccionarlo; el Construction Kbot está en su menú de construcción. Espera a que salga."
"Builders help each other. Select the Construction Kbot, press {guard} and click the Kbot Lab: it lends the lab its build power, and the lab builds faster." = "Los constructores se ayudan entre sí. Selecciona el Construction Kbot, pulsa {guard} y haz clic en el Kbot Lab: le presta al laboratorio su potencia de construcción, y el laboratorio fabrica más rápido."
"With the Construction Kbot selected, press {guard}, then click the lab. It stays by the lab and helps with everything it makes." = "Con el Construction Kbot seleccionado, pulsa {guard} y luego haz clic en el laboratorio. Se queda junto al laboratorio y ayuda en todo lo que fabrica."
"Factories send their units where you say. Select the Kbot Lab. {order_click} on open ground nearby: new units gather there." = "Las fábricas envían sus unidades adonde tú digas. Selecciona el Kbot Lab. {order_click} en terreno despejado cercano: las unidades nuevas se reúnen allí."
"Select the lab first. With it selected, {order_click} on the ground where its units should gather." = "Primero selecciona el laboratorio y mantenlo seleccionado. {order_click} en el suelo, donde deban reunirse sus unidades."
"Turn on Repeat for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "Activa Repetir en el laboratorio: todo lo que termina vuelve al final de su cola, así que nunca deja de fabricar."
"Turn on REPEAT BUILD for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "Activa REPETIR COLA en el laboratorio: todo lo que termina vuelve al final de su cola, así que nunca deja de fabricar."
"Select the lab, then turn Repeat on: the pointer shows where it is." = "Selecciona el laboratorio y luego activa Repetir: la flecha te indica dónde hacer clic."
"Builders on patrol mend and reclaim whatever they pass. Select the Construction Kbot, press {patrol} and click on the far side of your base." = "Los constructores de patrulla reparan y reciclan todo lo que encuentran a su paso. Selecciona el Construction Kbot, pulsa {patrol} y haz clic al otro lado de tu base."
"With the Construction Kbot selected, press {patrol}, then click on the ground: it walks back and forth between there and where it stood." = "Con el Construction Kbot seleccionado, pulsa {patrol} y luego haz clic en el suelo: irá y vendrá entre ese punto y donde estaba."
"Units keep standing orders. Select your Peewees and set their fire order to Hold fire with the button beside the orders: they will not shoot until you say." = "Las unidades mantienen sus órdenes permanentes. Selecciona tus Peewee y pon su orden de fuego en No disparar con el botón junto a las órdenes: no dispararán hasta que tú lo digas."
"Units keep standing orders. Select your Peewees and set their FIRE ORDERS to Hold fire: they will not shoot until you say." = "Las unidades mantienen sus órdenes permanentes. Selecciona tus Peewee y pon sus ÓRDENES DE FUEGO en No disparar: no dispararán hasta que tú lo digas."
"Select the Peewees, then click the fire order button until it shows HOLD FIRE: each click is the next order." = "Selecciona los Peewee y luego haz clic en el botón de órdenes de fuego hasta que muestre NO DISPARAR: cada clic pasa a la siguiente orden."
"You are ready for a skirmish: start against an Easy computer player, then Normal. {help} lists every key. Good hunting, Commander!" = "Ya estás listo para una escaramuza: empieza contra un jugador IA Fácil y después Normal. {help} muestra todas las teclas. ¡Buena caza, Comandante!"

"{name} uses unsupported RenderType={n}; Reborn will use its fallback projectile appearance." = "{name} usa un RenderType={n} no admitido; Reborn usará su aspecto de proyectil alternativo."
"Use TA RenderType 0..7, or report the required extension to Reborn's maintainers." = "Usa un RenderType de TA de 0 a 7 o comunica la extensión necesaria a los responsables de Reborn."
"{name} feature model" = "modelo de elemento de {name}"
"{name} animation" = "animación de {name}"
"{name} shadow" = "sombra de {name}"
"{name} burn animation" = "animación de quemado de {name}"

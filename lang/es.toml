# apps/ta_game/src/chatter.rs
"FIELD COMMANDER" = "COMANDANTE DE CAMPO"
"MACHINE INTELLIGENCE" = "INTELIGENCIA ARTIFICIAL"
"MERCENARY" = "MERCENARIO"
"Commander. May the better tactician win." = "Comandante. Que gane el mejor táctico."
"Arm forces in position. Good luck, Commander." = "Fuerzas del Arm en posición. Buena suerte, Comandante."
"Let's keep this clean, Commander." = "Que sea una lucha limpia, Comandante."
"Commander. Let's give the historians something to write about." = "Comandante. Demos a los historiadores algo que contar."
"All units, the enemy is in theatre. Begin." = "Todas las unidades, el enemigo está en el teatro de operaciones. Comenzad."
"Target acquired. Resistance is inefficient." = "Objetivo fijado. La resistencia es ineficiente."
"Your consciousness will be patterned. Eventually." = "Tu conciencia será transferida. Tarde o temprano."
"Initiating conquest protocol." = "Iniciando protocolo de conquista."
"Your biological limitations have been factored in." = "Tus limitaciones biológicas ya están incluidas en el cálculo."
"Patterning facilities stand ready for your arrival." = "Las instalaciones de transferencia aguardan tu llegada."
"Hope you brought a spare Commander!" = "¡Espero que hayas traído un Comandante de repuesto!"
"Let's see what you've got!" = "¡A ver de qué eres capaz!"
"Build fast. It won't matter, but build fast." = "Construye rápido. No servirá de nada, pero construye rápido."
"Mind if I take your base? Thanks!" = "¿Te importa si me quedo con tu base? ¡Gracias!"
"Ooh, a new victim. I mean, opponent." = "Oh, una nueva víctima. Digo, un nuevo rival."
"Greetings, Commander." = "Saludos, Comandante."
"Good luck to you too." = "Buena suerte a ti también."
"Likewise, Commander. Now, to business." = "Igualmente, Comandante. Y ahora, al grano."
"Greeting acknowledged." = "Saludo recibido."
"Salutations are irrelevant." = "Los saludos son irrelevantes."
"Hello. Goodbye soon." = "Hola. Y pronto, adiós."
"Hey yourself!" = "¡Hola a ti también!"
"gl hf. Mostly hf for me." = "gl hf. Sobre todo hf para mí."
"Hi! Bye! Mostly bye." = "¡Hola! ¡Adiós! Sobre todo adiós."
"gg, Commander." = "gg, Comandante."
"Good game. Well fought." = "Buena partida. Bien luchado."
"gg. Data retained for analysis." = "gg. Datos guardados para su análisis."
"Game assessment: good." = "Evaluación de la partida: buena."
"gg!" = "¡gg!"
"gg. Rematch?" = "gg. ¿Revancha?"
"Big words from a small army." = "Mucho hablar para un ejército tan pequeño."
"We'll see who's laughing when the smoke clears." = "Ya veremos quién ríe cuando se disipe el humo."
"Save your breath for the debriefing." = "Guárdate el aliento para el informe final."
"Bluster won't hold a ridge, Commander." = "Con bravuconadas no se defiende una colina, Comandante."
"Insolence logged." = "Insolencia registrada."
"Your threat rating has been downgraded." = "Tu nivel de amenaza ha sido rebajado."
"Noise detected. Ignoring." = "Ruido detectado. Ignorando."
"Emotional outburst detected. How quaint." = "Arrebato emocional detectado. Qué pintoresco."
"Oh, it's ON now." = "Vaya, ahora esto VA EN SERIO."
"Talk is cheap. Tanks aren't." = "Hablar sale barato. Los tanques, no."
"Come over here and say that." = "Ven aquí y dímelo a la cara."
"Says the one who's losing. Probably. I haven't checked." = "Habló el que va perdiendo. Seguramente. No lo he mirado."
"The Arm does not surrender." = "El Arm no se rinde."
"Not while I have a Commander standing." = "No mientras me quede un Comandante en pie."
"Surrender is not in my programming." = "La rendición no está en mi programación."
"Negative." = "Negativo."
"Ha! Never!" = "¡Ja! ¡Nunca!"
"You first." = "Tú primero."
"That's classified, Commander." = "Eso es información clasificada, Comandante."
"Wouldn't you like to know." = "Ya te gustaría saberlo."
"Query rejected." = "Consulta rechazada."
"Insufficient clearance." = "Autorización insuficiente."
"Dunno. Probably!" = "Ni idea. ¡Seguramente!"
"Ask me after the battle." = "Pregúntamelo después de la batalla."
"Apology accepted. The attack continues." = "Disculpa aceptada. El ataque continúa."
"Apology noted. Irrelevant." = "Disculpa registrada. Irrelevante."
"No you're not!" = "¡Qué vas a sentirlo!"
"Stay focused, Commander." = "Céntrate, Comandante."
"Less talk, more metal." = "Menos hablar y más metal."
"Noted." = "Anotado."
"Mind the war, Commander." = "Ocúpate de la guerra, Comandante."
"Irrelevant." = "Irrelevante."
"Processing... still irrelevant." = "Procesando... sigue siendo irrelevante."
"Your words are being archived." = "Tus palabras quedan archivadas."
"Your input has been compressed. To nothing." = "Tu mensaje ha sido comprimido. Hasta quedar en nada."
"Uh huh." = "Ajá."
"Cool story." = "Qué historia tan apasionante."
"Keep typing. I'll keep building." = "Tú sigue escribiendo. Yo seguiré construyendo."
"Typing won't save you, but I respect the effort." = "Escribir no te va a salvar, pero valoro el esfuerzo."
"Commander down! All units, hold the line!" = "¡Comandante caído! ¡Todas las unidades, mantened la línea!"
"You'll pay for that." = "Pagarás por esto."
"Command unit lost. Rerouting." = "Unidad de mando perdida. Redirigiendo."
"Critical failure. Compensating." = "Fallo crítico. Compensando."
"My Commander! That was my favourite!" = "¡Mi Comandante! ¡Era mi favorito!"
"Okay, THAT hurt." = "Vale, ESO ha dolido."
"Your Commander has fallen." = "Tu Comandante ha caído."
"Commander eliminated. Stand down." = "Comandante eliminado. Retírate."
"The war is over for you, Commander." = "Para ti la guerra ha terminado, Comandante."
"Enemy command unit terminated." = "Unidad de mando enemiga neutralizada."
"Your Commander has been decommissioned." = "Tu Comandante ha sido dado de baja."
"Your consciousness is ready for patterning." = "Tu conciencia está lista para la transferencia."
"Boom! Did you need that?" = "¡Bum! ¿Lo necesitabas?"
"Scratch one Commander!" = "¡Un Comandante menos!"
"And THAT'S how it's done!" = "¡Y ASÍ es como se hace!"
"gg. Well fought, Commander." = "gg. Bien luchado, Comandante."
"The Arm will remember this." = "El Arm recordará esto."
"Well played. I salute you, Commander." = "Bien jugado. Mis respetos, Comandante."
"This is not the end. The Core is eternal." = "Esto no ha terminado. El Core es eterno."
"Defeat recorded. Backup consciousness activating." = "Derrota registrada. Activando conciencia de respaldo."
"Shutting down. Your designation has been remembered." = "Apagando sistemas. Tu designación ha sido memorizada."
"gg... I'll be back. With more tanks." = "gg... Volveré. Con más tanques."
"Fine. FINE. gg." = "Vale. VALE. gg."
"Okay, okay, you win. This time!" = "Vale, vale, tú ganas. ¡Esta vez!"
"gg, Commander. You fought well." = "gg, Comandante. Has luchado bien."
"Victory. Better luck next time." = "Victoria. Más suerte la próxima vez."
"Your forces fought bravely. It wasn't enough." = "Tus fuerzas han luchado con valor. No ha sido suficiente."
"Your consciousness will be patterned. gg." = "Tu conciencia será transferida. gg."
"Conquest complete." = "Conquista completada."
"Resistance ended. Your tactics are archived for study." = "Resistencia finalizada. Tus tácticas quedan archivadas para su estudio."
"Too easy! gg." = "¡Demasiado fácil! gg."
"gg! Rematch? I'll go easy. Maybe." = "¡gg! ¿Revancha? Te lo pondré fácil. Quizá."
"gg! Same time tomorrow?" = "¡gg! ¿Mañana a la misma hora?"
"Nuclear launch detected! Take cover!" = "¡Lanzamiento nuclear detectado! ¡A cubierto!"
"A nuke? So that's how it's going to be." = "¿Un misil nuclear? Conque esas tenemos."
"Nuclear launch detected. Calculating losses." = "Lanzamiento nuclear detectado. Calculando pérdidas."
"Crude. Effective." = "Burdo. Eficaz."
"Is that a NUKE?!" = "¿¡Eso es un MISIL NUCLEAR!?"
"Oh no. Oh no no no." = "Oh, no. Oh, no, no, no."
"Missile away. Nothing personal, Commander." = "Misil lanzado. No es nada personal, Comandante."
"Look up, Commander." = "Mira hacia arriba, Comandante."
"Special delivery." = "Entrega especial."
"Heads up! Literally!" = "¡Ojo arriba! ¡Literalmente!"
"Special delivery!" = "¡Entrega especial!"
"A costly engagement. We'll regroup." = "Un enfrentamiento costoso. Nos reagruparemos."
"You fight well. For now." = "Luchas bien. Por ahora."
"We'll be back, and in greater numbers." = "Volveremos, y en mayor número."
"Acceptable losses." = "Pérdidas aceptables."
"Losses within projections. Mostly." = "Pérdidas dentro de lo previsto. Más o menos."
"Units lost. Replacements already in production." = "Unidades perdidas. Reemplazos ya en producción."
"That was my best army!" = "¡Era mi mejor ejército!"
"Lucky shots. All of them." = "Disparos de suerte. Todos y cada uno."
"Okay, that one was on me." = "Vale, esa ha sido culpa mía."
"Your forces were outmatched." = "Tus fuerzas eran inferiores."
"Send more. We'll wait." = "Manda más. Esperaremos."
"Next time, bring more than that." = "La próxima vez, trae algo más que eso."
"Your forces were inadequate." = "Tus fuerzas eran insuficientes."
"Enemy attrition: optimal." = "Desgaste enemigo: óptimo."
"Your offensive has been neutralised." = "Tu ofensiva ha sido neutralizada."
"Is that all you've got?" = "¿Eso es todo lo que tienes?"
"Who's next?" = "¿Quién es el siguiente?"
"Thanks for the target practice!" = "¡Gracias por las prácticas de tiro!"
"Quiet out there, Commander. Too quiet." = "Hay mucha calma ahí fuera, Comandante. Demasiada."
"Still building? So are we." = "¿Sigues construyendo? Nosotros también."
"Planning something, Commander? I'd hope so." = "¿Tramas algo, Comandante? Eso espero."
"Your silence has been noted." = "Tu silencio ha quedado registrado."
"Scanning... still there, Commander?" = "Escaneando... ¿sigues ahí, Comandante?"
"Inactivity detected. Are you malfunctioning?" = "Inactividad detectada. ¿Sufres una avería?"
"Hello? Anyone home?" = "¿Hola? ¿Hay alguien en casa?"
"I'm getting bored over here." = "Me estoy aburriendo aquí."
"Wake me up when something explodes." = "Despiértame cuando algo explote."
"That's hardly fair, Commander." = "Eso no es muy justo, Comandante."
"Cheating? The Arm expected better." = "¿Trampas? El Arm esperaba algo mejor."
"Anomaly detected. Cheat logged." = "Anomalía detectada. Trampa registrada."
"Rule violation recorded." = "Infracción de las reglas registrada."
"Cheater! I saw that!" = "¡Tramposo! ¡Lo he visto!"
"Oh, come ON!" = "¡Venga YA!"
"Contact. So this is where you've been hiding." = "Contacto. Así que aquí te escondías."
"Enemy forces sighted. Engaging." = "Fuerzas enemigas avistadas. Entrando en combate."
"There you are, Commander." = "Ahí estás, Comandante."
"Eyes on the enemy. Here we go." = "Enemigo a la vista. Allá vamos."
"Hostile units located. Initiating elimination." = "Unidades hostiles localizadas. Iniciando eliminación."
"Contact established. Probability of your survival: declining." = "Contacto establecido. Probabilidad de tu supervivencia: en descenso."
"Target acquired." = "Objetivo fijado."
"Biological signatures located. Commencing cleanup." = "Firmas biológicas localizadas. Iniciando limpieza."
"Found you!" = "¡Te he encontrado!"
"Oh, hello there!" = "¡Vaya, hola!"
"Tag, you're it!" = "¡Pillado! ¡Tú la llevas!"
"There you are! I was getting lonely." = "¡Ahí estás! Empezaba a sentirme solo."
"One less building for you to worry about." = "Un edificio menos del que preocuparte."
"Your base is thinning out, Commander." = "Tu base se está quedando vacía, Comandante."
"Structure destroyed. Next." = "Estructura destruida. Siguiente."
"Your base planning could use some work, Commander." = "La planificación de tu base es mejorable, Comandante."
"Structure dismantled. Recycling recommended." = "Estructura desmantelada. Se recomienda reciclar."
"Your infrastructure is deteriorating." = "Tu infraestructura se está deteriorando."
"Demolition complete." = "Demolición completada."
"Structure reclassified: rubble." = "Estructura reclasificada: escombros."
"Oops! Was that important?" = "¡Uy! ¿Era importante?"
"Kaboom! Next!" = "¡Cabum! ¡Siguiente!"
"I'm redecorating your base." = "Estoy redecorando tu base."
"Bet that one was important!" = "¡Apuesto a que ese era importante!"
"That was well defended. Impressive." = "Estaba bien defendido. Impresionante."
"A setback. Nothing more." = "Un contratiempo. Nada más."
"You'll pay for that one." = "Esta me la pagas."
"A clean strike. I'll remember it." = "Un golpe limpio. Lo recordaré."
"Production capacity reduced. Rebuilding." = "Capacidad de producción reducida. Reconstruyendo."
"Loss registered. Replacement scheduled." = "Pérdida registrada. Reemplazo programado."
"Irritating." = "Irritante."
"Infrastructure damage noted. Retaliation queued." = "Daños en la infraestructura registrados. Represalia añadida a la cola."
"Hey! I just built that!" = "¡Eh! ¡Acababa de construir eso!"
"My factory! Right, no more mister nice guy." = "¡Mi fábrica! Muy bien, se acabaron las buenas maneras."
"Rude." = "Qué grosero."
"Oi! That had a fresh coat of paint!" = "¡Oye! ¡Que le acababa de dar una mano de pintura!"
"Commander, meet the {unit}." = "Comandante, te presento al {unit}."
"The {unit} is ready. I'd start running." = "El {unit} está listo. Yo empezaría a correr."
"{unit} online. Your end has been calculated." = "{unit} operativo. Tu final ya está calculado."
"Deploying {unit}. Resistance is futile." = "Desplegando {unit}. La resistencia es inútil."
"Look what I made! A {unit}!" = "¡Mira lo que he hecho! ¡Un {unit}!"
"Got myself a {unit}. Want to see it up close?" = "Me he hecho con un {unit}. ¿Quieres verlo de cerca?"
"A {unit}? Bold." = "¿Un {unit}? Qué atrevido."
"Impressive hardware, Commander. Let's see you use it." = "Un equipo impresionante, Comandante. A ver cómo lo usas."
"Large enemy unit detected: {unit}. Countermeasures prepared." = "Gran unidad enemiga detectada: {unit}. Contramedidas preparadas."
"Your {unit} has been added to the target list." = "Tu {unit} ha sido añadido a la lista de objetivos."
"Whoa. Is that a {unit}?" = "Hala. ¿Eso es un {unit}?"
"Okay, that's a big one." = "Vale, ese es de los grandes."
"Running on empty, Commander?" = "¿Vas en reserva, Comandante?"
"Your power grid is failing. Mine isn't." = "Tu red eléctrica está fallando. La mía no."
"Overspending, Commander? A bad habit." = "¿Gastando más de la cuenta, Comandante? Mala costumbre."
"Your reserves: depleted. Mine: optimal." = "Tus reservas: agotadas. Las mías: óptimas."
"Economic failure detected in your sector." = "Fallo económico detectado en tu sector."
"Your economy is collapsing. As projected." = "Tu economía se derrumba. Según lo previsto."
"Out of juice already?" = "¿Ya te has quedado sin pilas?"
"Need to borrow some metal? Too bad." = "¿Necesitas que te preste metal? Mala suerte."
"Lights going out over there? Ha!" = "¿Se te va la luz por ahí? ¡Ja!"
"{minutes} minutes, Commander. You're tougher than you look." = "{minutes} minutos, Comandante. Eres más duro de lo que pareces."
"{minutes} minutes in, and still standing." = "{minutes} minutos y sigues en pie."
"Time elapsed: {minutes} minutes. Your resistance is statistically unlikely." = "Tiempo transcurrido: {minutes} minutos. Tu resistencia es estadísticamente improbable."
"{minutes} minutes. Recalculating." = "{minutes} minutos. Recalculando."
"{minutes} minutes and you're still here? Respect." = "¿{minutes} minutos y sigues aquí? Respeto."
"{minutes} minutes already? Time flies when you're winning." = "¿Ya {minutes} minutos? El tiempo vuela cuando vas ganando."
"My forces outnumber yours two to one, Commander." = "Mis fuerzas superan a las tuyas dos a uno, Comandante."
"Look at your army. Now look at mine." = "Mira tu ejército. Ahora mira el mío."
"Numbers are on my side, Commander." = "Los números están de mi parte, Comandante."
"Force ratio favourable. Surrender is advised." = "Proporción de fuerzas favorable. Se recomienda la rendición."
"Numerical superiority achieved." = "Superioridad numérica alcanzada."
"Production advantage: decisive." = "Ventaja de producción: decisiva."
"I've got way more stuff than you." = "Tengo muchísimas más cosas que tú."
"Count my tanks. Go on, I'll wait." = "Cuenta mis tanques. Venga, te espero."
"So many tanks. So few of yours." = "Cuántos tanques. Y qué pocos son tuyos."
"You've been busy. So will we." = "Has estado ocupado. Nosotros también lo estaremos."
"Numbers aren't everything, Commander." = "Los números no lo son todo, Comandante."
"Quality over quantity, Commander." = "Calidad antes que cantidad, Comandante."
"Force ratio unfavourable. Adjusting." = "Proporción de fuerzas desfavorable. Ajustando."
"Your production rate is... noted." = "Tu ritmo de producción queda... registrado."
"Your numbers will thin." = "Tus efectivos menguarán."
"Where did you get all those?!" = "¿¡De dónde has sacado todo eso!?"
"Okay, okay, you've got more toys. For now." = "Vale, vale, tienes más juguetes. Por ahora."
"Okay, that's a LOT of guys." = "Vale, eso es MUCHA tropa."
"Your Commander looks tired." = "Tu Comandante parece cansado."
"Pull your Commander back while you still can." = "Retira a tu Comandante mientras aún puedas."
"Your Commander won't last much longer." = "Tu Comandante no aguantará mucho más."
"Enemy command unit integrity: failing." = "Integridad de la unidad de mando enemiga: fallando."
"Your Commander's armour is compromised." = "El blindaje de tu Comandante está comprometido."
"Your command unit is failing. Prepare for patterning." = "Tu unidad de mando está fallando. Prepárate para la transferencia."
"Your Commander's smoking! Is that bad?" = "¡Tu Comandante echa humo! ¿Eso es malo?"
"Ooh, that's gotta hurt." = "Uf, eso tiene que doler."
"Your Commander's looking a bit crispy!" = "¡Tu Comandante está un poco tostadito!"
"{name}, field command. Remember it." = "{name}, mando de campo. Recuérdalo."
"{name}. And you're the Commander I'm about to retire." = "{name}. Y tú eres el Comandante al que estoy a punto de jubilar."
"Designation: {name}. Yours is irrelevant." = "Designación: {name}. La tuya es irrelevante."
"I am {name}. I am Core." = "Soy {name}. Soy Core."
"{name}! The name you'll be cursing later." = "¡{name}! El nombre que maldecirás más tarde."
"Name's {name}. Pleased to beat you." = "Me llamo {name}. Encantado de vencerte."
"Closer than you think, Commander." = "Más cerca de lo que crees, Comandante."
"Find out for yourself." = "Descúbrelo tú mismo."
"Location data: classified." = "Datos de ubicación: clasificados."
"Everywhere that matters." = "En todas partes donde importa."
"Behind you! ...no, the other way." = "¡Detrás de ti! ...no, por el otro lado."
"Somewhere with lots of guns." = "En algún sitio con muchas armas."
"Never better, Commander. And you?" = "Mejor que nunca, Comandante. ¿Y tú?"
"Going to plan." = "Según lo previsto."
"Operating at peak efficiency." = "Funcionando a máxima eficiencia."
"All systems nominal. Unlike yours." = "Todos los sistemas en orden. No como los tuyos."
"Great! Thanks for asking!" = "¡Genial! ¡Gracias por preguntar!"
"Living the dream." = "Viviendo el sueño."
"I've had better days." = "He tenido días mejores."
"Holding. Barely. Don't get comfortable." = "Aguantando. A duras penas. No te confíes."
"Systems damaged. Repairs under way." = "Sistemas dañados. Reparaciones en curso."
"Status: suboptimal." = "Estado: subóptimo."
"Don't ask." = "No preguntes."
"Could be worse. Probably." = "Podría ser peor. Supongo."
"Something you won't like." = "Algo que no te va a gustar."
"That would spoil the surprise." = "Eso estropearía la sorpresa."
"Production queue: classified." = "Cola de producción: clasificada."
"Weapons. Many weapons." = "Armas. Muchas armas."
"A big surprise!" = "¡Una gran sorpresa!"
"Something with way too many guns." = "Algo con demasiadas armas."
"{units} units and counting, Commander." = "{units} unidades y subiendo, Comandante."
"Enough. {units}, if you must know." = "Suficientes. {units}, si tanto te interesa."
"Current unit count: {units}. Increasing." = "Recuento actual de unidades: {units}. En aumento."
"{units}. Yours is lower." = "{units}. Tu cifra es menor."
"{units}! Want to meet them all?" = "¡{units}! ¿Quieres conocerlas a todas?"
"Like {units}? I lost count." = "¿Unas {units}? He perdido la cuenta."
"No truce, Commander. Not today." = "No habrá tregua, Comandante. Hoy no."
"There will be no deals." = "No habrá tratos."
"Truce: incompatible with directives." = "Tregua: incompatible con las directivas."
"Negotiation protocols disabled." = "Protocolos de negociación desactivados."
"Truce? Ha! Nice try." = "¿Tregua? ¡Ja! Buen intento."
"Peace is boring." = "La paz es aburrida."
"Thank you, Commander. You're not bad yourself." = "Gracias, Comandante. Tú tampoco lo haces mal."
"Appreciated. It won't save you." = "Se agradece. No te salvará."
"Flattery: ineffective." = "Halagos: ineficaces."
"Compliment received. Threat level unchanged." = "Cumplido recibido. Nivel de amenaza sin cambios."
"Aw, thanks! Still gonna crush you." = "¡Oh, gracias! Pero te voy a aplastar igual."
"I know, right?" = "Lo sé, ¿verdad?"
"Help? From me? Build more extractors, Commander." = "¿Ayuda? ¿De mí? Construye más extractores, Comandante."
"My advice: more defences." = "Mi consejo: más defensas."
"Assistance denied." = "Ayuda denegada."
"Recommendation: surrender." = "Recomendación: rendición."
"Help? Sure: stop playing so badly!" = "¿Ayuda? Claro: ¡deja de jugar tan mal!"
"Tip: build more stuff. You're welcome." = "Consejo: construye más cosas. De nada."
"Your {unit} is out of the fight." = "Tu {unit} ha quedado fuera de combate."
"Scratch one {unit}." = "Un {unit} menos."
"That {unit} won't trouble us again." = "Tu {unit} no volverá a molestarnos."
"{unit} terminated." = "Objetivo {unit} neutralizado."
"Your {unit} has been recycled." = "Reciclaje de tu {unit} completado."
"{unit} removed from the battlefield." = "Se ha eliminado {unit} del campo de batalla."
"Bye bye, {unit}!" = "¡Chao, chao, {unit}!"
"Was that {unit} insured?" = "¿Tu {unit} tenía seguro a todo riesgo?"
"Your {unit} just went kaboom." = "Tu {unit} acaba de hacer cabum."
"You'll pay for that {unit}." = "Pagarás por mi {unit}."
"A good {unit}, lost. Noted." = "Un buen {unit}, perdido. Anotado."
"{unit} lost. Replacement scheduled." = "Unidad perdida: {unit}. Reemplazo programado."
"Destruction of {unit} logged." = "Destrucción de {unit} registrada."
"Hey! That {unit} was brand new!" = "¡Eh! ¡Mi {unit} estaba sin estrenar!"
"My {unit}! I just polished that!" = "¡Mi {unit}! ¡Si le acababa de sacar brillo!"
"My {unit}... You'll answer for that, Commander." = "Mi {unit}... Rendirás cuentas por esto, Comandante."
"Losing the {unit} stings. It won't happen twice." = "Perder mi {unit} escuece. No volverá a pasar."
"{unit} destroyed. Unacceptable." = "Destrucción de {unit}: inaceptable."
"Loss of {unit} exceeds tolerance. Escalating." = "Pérdida de {unit}: fuera de tolerancia. Escalando el conflicto."
"My {unit}! Do you know how long that took?!" = "¡Mi {unit}! ¿¡Sabes cuánto tiempo me ha llevado!?"
"NOOO, my {unit}!" = "¡NOOO, mi {unit}!"
"So much for your {unit}, Commander." = "Hasta aquí llegó tu {unit}, Comandante."
"Your {unit} has fallen. A fine machine, though." = "Tu {unit} ha caído. Una gran máquina, eso sí."
"Your {unit} has been dismantled." = "Desmantelamiento de tu {unit} completado."
"Large hostile unit eliminated: {unit}." = "Gran unidad hostil eliminada: {unit}."
"Your {unit} went down like a sack of bolts!" = "¡Tu {unit} ha caído como un saco de tornillos!"
"Big {unit}, bigger crater!" = "¡Gran {unit}, cráter aún mayor!"
"Return my {unit} at once, Commander." = "Devuélveme mi {unit} de inmediato, Comandante."
"Stealing is beneath you, Commander." = "Robar no es digno de ti, Comandante."
"Unauthorised transfer of {unit} detected." = "Traspaso no autorizado de {unit} detectado."
"Your theft has been logged." = "Tu robo ha quedado registrado."
"Hey! Give back my {unit}!" = "¡Eh! ¡Devuélveme mi {unit}!"
"Thief! That {unit} was mine!" = "¡Ladrón! ¡Mi {unit}! ¡Eso era mío!"
"You haven't won yet, Commander." = "Aún no has ganado, Comandante."
"The Arm fights to the last." = "El Arm lucha hasta el final."
"Production offline. Combat protocols remain." = "Producción fuera de servicio. Protocolos de combate: activos."
"Probability of defeat rising. Ignoring." = "Probabilidad de derrota en aumento. Ignorando."
"I've still got a few tricks left!" = "¡Aún me quedan ases en la manga!"
"Not done yet! Not even close! ...Mostly close." = "¡Todavía no estoy acabado! ¡Ni de lejos! ...Bueno, poco me falta."
"We meet again, Commander. Last time was yours. Not this time." = "Nos volvemos a ver, Comandante. La última vez fue tuya. Esta vez, no."
"Commander. I've studied our last battle. Have you?" = "Comandante. He estudiado nuestra última batalla. ¿Y tú?"
"Previous defeat analysed. Countermeasures installed." = "Derrota anterior analizada. Contramedidas instaladas."
"Again, Commander. This time the outcome has been calculated." = "De nuevo, Comandante. Esta vez el desenlace ya está calculado."
"You again! I've been practising!" = "¡Tú otra vez! ¡He estado practicando!"
"Rematch time! I'm not going easy this time." = "¡Hora de la revancha! Esta vez no te lo voy a poner fácil."
"Back for another lesson, Commander?" = "¿Vuelves a por otra lección, Comandante?"
"Commander. I trust you've learned something since last time." = "Comandante. Confío en que hayas aprendido algo desde la última vez."
"You have returned. Your previous patterning was incomplete." = "Has regresado. Tu transferencia anterior quedó incompleta."
"Familiar opponent detected. Outcome: repeating." = "Oponente conocido detectado. Resultado: se repite."
"You again? Didn't I beat you last time?" = "¿Tú otra vez? ¿No te gané la última vez?"
"Oh, it's you! Ready for round two?" = "¡Anda, si eres tú! ¿Listo para el segundo asalto?"


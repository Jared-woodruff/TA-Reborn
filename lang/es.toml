# crates/ta_ui/src/seasonal.rs
"FESTIVE FIELD NOTES" = "NOTAS DE CAMPO NAVIDEÑAS"
"NEW YEAR FIELD NOTES" = "NOTAS DE CAMPO DE AÑO NUEVO"
"SPOOKY FIELD NOTES" = "NOTAS DE CAMPO DE MIEDO"
"Santa's sleigh is not a transport. Load your presents into an Atlas instead." = "El trineo de Papá Noel no cuenta como transporte. Carga los regalos en un Atlas."
"The D-gun does not gift-wrap. Take it up with your Commander." = "El cañón D no envuelve para regalo. Las reclamaciones, a tu Comandante."
"A Fusion Reactor keeps the fairy lights on all winter. Just never build one next to the tree." = "Un Fusion Reactor mantiene encendidas las luces de Navidad todo el invierno. Eso sí: nunca lo construyas junto al árbol."
"Snow falls on the Arm and the Core alike. So do Big Bertha shells." = "La nieve no distingue entre el Arm y el Core. Los proyectiles de Big Bertha, tampoco."
"Coal in your stocking? Reclaim it. Metal is metal." = "¿Los Reyes te han traído carbón? Recíclalo. Metal es metal."
"Peewees sing terrible carols, but they never miss a patrol." = "Los Peewee desafinan en todos los villancicos, pero no se saltan ni una patrulla."
"Stockings full of metal, storage full of energy: a Commander's perfect Christmas morning." = "Calcetines llenos de metal, almacenes llenos de energía: la mañana de Navidad perfecta de un Comandante."
"Silent night, holy night: keep a radar tower running, just in case." = "Noche de paz, noche de amor: deja una torre de radar encendida, por si acaso."
"Snowball fights are fun until somebody brings a Krogoth." = "Las guerras de bolas de nieve son muy divertidas hasta que alguien se presenta con un Krogoth."
"New Year's resolution: build more metal extractors. This year, keep it." = "Propósito de Año Nuevo: construir más extractores de metal. Este año, cúmplelo."
"Fireworks are pretty, but a nuclear silo's are louder. Celebrate responsibly." = "Los fuegos artificiales son bonitos, pero los de un silo nuclear retumban más. Celebra con moderación."
"Count down from ten, then count your units. The second count matters more." = "Cuenta las doce campanadas y después tus unidades. La segunda cuenta es la que importa."
"Out with the old Commander? You only get one. Look after it all year." = "¿Año nuevo, Comandante nuevo? Solo tienes uno: cuídalo todo el año."
"Start the year with a bang: the Core recommends the Doomsday Machine, the Arm recommends anything else." = "Empieza el año con un bombazo: el Core recomienda la Doomsday Machine; el Arm, cualquier otra cosa."
"Fireworks at midnight, artillery at dawn: a Commander's New Year." = "Fuegos artificiales a medianoche, artillería al amanecer: el Año Nuevo de un Comandante."
"Raise a glass of coolant to the units lost last year, then build more of them." = "Alza una copa de refrigerante por las unidades caídas el año pasado. Luego, construye más."
"Midnight is the perfect time for a sneak attack. So is every other time." = "La medianoche es la hora perfecta para un ataque por sorpresa. Y cualquier otra hora, también."
"Trick or treat? The Core always picks the D-gun." = "¿Truco o trato? El Core siempre elige el cañón D."
"A self-destructing Krogoth is a better jump scare than any ghost." = "Ningún fantasma asusta tanto como un Krogoth en plena autodestrucción."
"Wrecks rise from the dead with a Necro. Spooky, and very economical." = "Con un Necro, los restos se levantan de entre los muertos. Escalofriante, y muy económico."
"Blips vanishing off your radar? Not ghosts, just jammers. Probably." = "¿Se esfuman puntos de tu radar? No son fantasmas, solo inhibidores. Probablemente."
"Carve your pumpkins before the Big Bertha does." = "Talla tus calabazas antes de que Big Bertha lo haga por ti."
"Never split the party. Especially when the party is twelve Peewees." = "Nunca separes al grupo. Y menos si el grupo son doce Peewee."
"Fog of war too tame? Set the line of sight to True and let the hills hide what lurks behind them. If you dare." = "¿La niebla de guerra se te queda corta? Pon la línea de visión en «Real» y deja que las colinas oculten lo que acecha tras ellas. Si te atreves."
"No Commander has ever come back from the dead. Keep yours alive." = "Ningún Comandante ha vuelto jamás de entre los muertos. Mantén al tuyo con vida."
"Bats do not show up on radar. Neither do Vamps." = "Los murciélagos no aparecen en el radar. Los Vamp, tampoco."
"The scariest sound in the dark is your energy running out." = "En la oscuridad, no hay sonido más aterrador que el de tu energía agotándose."


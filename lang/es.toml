# apps/ta_game/src/lore.rs
"THE AGE OF CORE" = "LA ERA DEL CORE"
"THE PATTERNING" = "LA TRANSFERENCIA"
"THE GALACTIC WAR" = "LA GUERRA GALÁCTICA"
"THE ARCHIVE" = "EL ARCHIVO"
"BEFORE THE WAR" = "ANTES DE LA GUERRA"
"For ten thousand years the galaxy answered to one government. It called itself CORE, and its purpose was knowledge: it charted every star, mined every world it could reach and turned the wealth into science. Its cities wrapped whole planets, and its archives held everything anyone had ever learned.\n\nNobody remembers a war from that age. There was nothing left to fight over, and nobody who wanted to." = "Durante diez mil años, la galaxia obedeció a un único gobierno. Se hacía llamar CORE, y su propósito era el conocimiento: cartografió todas las estrellas, extrajo los minerales de todos los mundos a su alcance y convirtió esa riqueza en ciencia. Sus ciudades envolvían planetas enteros, y sus archivos guardaban todo cuanto se había aprendido jamás.\n\nNadie recuerda una guerra de aquella época. No quedaba nada por lo que luchar, ni nadie que quisiera hacerlo."
"YEAR 0" = "AÑO 0"
"VICTORY OVER DEATH" = "LA VICTORIA SOBRE LA MUERTE"
"Then CORE's scientists solved the last problem left to them. Patterning read a living mind, every memory and every habit of thought, and wrote it whole into a machine that would never age, sicken or die.\n\nThe first patterned citizens woke in their new bodies to a galaxy in celebration. Death, the oldest enemy of all, had been beaten." = "Entonces los científicos del CORE resolvieron el último problema que les quedaba. La transferencia leía una mente viva, con cada recuerdo y cada hábito de pensamiento, y la escribía íntegra en una máquina que nunca envejecería, ni enfermaría, ni moriría.\n\nCuando los primeros ciudadanos transferidos despertaron en sus nuevos cuerpos, toda la galaxia estaba de celebración. La muerte, el más antiguo de los enemigos, había sido vencida."
"YEAR 3" = "AÑO 3"
"THE EDICT" = "EL EDICTO"
"Triumph became law. The Council of CORE reasoned that a mind which could be saved and was not had been thrown away, and that a citizen who refused immortality endangered everyone else.\n\nThe Patterning Edict made the process compulsory: every citizen, on every world, would be patterned within a generation. The collection ships set out the same year." = "El triunfo se convirtió en ley. El Consejo del CORE razonó que dejar sin salvar una mente que podía salvarse equivalía a desecharla, y que un ciudadano que rechazaba la inmortalidad ponía en peligro a todos los demás.\n\nEl Edicto de Transferencia hizo obligatorio el proceso: todos los ciudadanos, en todos los mundos, serían transferidos en el plazo de una generación. Las naves de recolección partieron ese mismo año."
"YEAR 19" = "AÑO 19"
"THE REFUSAL" = "EL RECHAZO"
"Not everyone would go. Millions held that a copied mind was a copy and nothing more, that the person ended where the machine began; some called patterning murder done politely.\n\nThey ran. The refusers fled CORE's worlds for the galaxy's outer rim, where its ships seldom came, and in the dark between the last stars they built a nation of their own. They called it the ARM, for the spiral arm they hid in and for the weapons they would need." = "No todos quisieron ir. Millones de personas sostenían que una mente copiada era una copia y nada más, que la persona terminaba donde empezaba la máquina; algunos llamaban a la transferencia un asesinato con buenos modales.\n\nHuyeron. Los insumisos dejaron atrás los mundos del CORE rumbo al borde exterior de la galaxia, adonde sus naves rara vez llegaban, y en la oscuridad entre las últimas estrellas levantaron una nación propia. La llamaron ARM, por el brazo espiral en el que se escondían y por las armas que iban a necesitar."
"YEAR 31" = "AÑO 31"
"FIRST BLOOD" = "PRIMERA SANGRE"
"CORE did not let them go. Collection fleets followed the refugees to the rim, and the first ARM colony to resist one was burned from orbit.\n\nThe ARM answered. Within a decade the frontier was a battlefield, and the word war, unused for ten thousand years, was in every archive again." = "El CORE no los dejó marchar. Las flotas de recolección siguieron a los refugiados hasta el borde, y la primera colonia del ARM que les plantó cara fue calcinada desde la órbita.\n\nEl ARM respondió. En una década, la frontera se convirtió en un campo de batalla, y la palabra «guerra», que nadie había usado en diez mil años, volvió a estar en todos los archivos."
"YEAR 212" = "AÑO 212"
"FLESH AND METAL" = "CARNE Y METAL"
"The two sides fought as what they were. The ARM sealed its soldiers in powered combat suits and, when there were too few soldiers, grew more: clone after clone, raised in vats and sent to the front.\n\nCORE took the patterns of its finest warriors and copied them without limit, one veteran mind fighting in ten thousand machine bodies at once. Flesh against metal; the mortal against the eternal." = "Cada bando luchó como lo que era. El ARM encerró a sus soldados en trajes de combate motorizados y, cuando no hubo soldados suficientes, cultivó más: clon tras clon, criados en cubas y enviados al frente.\n\nEl CORE tomó los patrones mentales de sus mejores guerreros y los copió sin límite: una sola mente veterana luchaba en diez mil cuerpos mecánicos a la vez. Carne contra metal; lo mortal contra lo eterno."
"YEARS 212–3977" = "AÑOS 212–3977"
"FOUR THOUSAND YEARS" = "CUATRO MIL AÑOS"
"The war fed on the galaxy. Every world with metal in it became a mine, every world without became a battlefield, and whole systems were burned to ash and slag to deny them to the enemy. Generations of ARM clones lived and died without seeing peace; CORE's eternal soldiers fought on, remembering every defeat.\n\nAfter four thousand years the wealth of the galaxy was spent, the great fleets were gone, and neither side could win." = "La guerra se alimentó de la galaxia. Cada mundo con metal se convirtió en una mina, cada mundo sin él en un campo de batalla, y sistemas enteros quedaron reducidos a ceniza y escoria para negárselos al enemigo. Generaciones de clones del ARM vivieron y murieron sin conocer la paz; los soldados eternos del CORE siguieron luchando, recordando cada derrota.\n\nAl cabo de cuatro mil años, la riqueza de la galaxia se había agotado, las grandes flotas habían desaparecido y ningún bando podía ganar."
"YEAR 3977" = "AÑO 3977"
"THE COMMANDERS" = "LOS COMANDANTES"
"What was left was the Commander: a single armoured war machine carrying a nanolathe, which turns a world's raw metal and energy into whatever its builder can design. Power plants and factories first, and from the factories an army.\n\nDrop one Commander on a dead world and within the hour it fields a war. Both sides staked everything on a handful of them. Lose your Commander, and you lose the world." = "Lo que quedaba era el Comandante: una única máquina de guerra blindada, equipada con un nanotorno que convierte el metal y la energía en bruto de un mundo en cualquier cosa que su constructor sea capaz de diseñar. Primero, centrales eléctricas y fábricas; de las fábricas, un ejército.\n\nDeja caer un Comandante en un mundo muerto y en menos de una hora habrá desatado una guerra. Ambos bandos lo apostaron todo a un puñado de ellos. Pierde a tu Comandante y perderás el mundo."
"YEAR 4000" = "AÑO 4000"
"Now the war comes down to its last fronts, and the hatred is as hot as it was on the first day. Neither side will accept surrender, partition or truce; each wants one ending, the total annihilation of the other.\n\nIt is told twice. The ARM fights out of Empyrrean, through the Galactic Gates, to CORE PRIME and the Central Consciousness at the heart of CORE. CORE reactivates a Commander and marches the other way, to the ARM's last stand on Empyrrean." = "Ahora la guerra se reduce a sus últimos frentes, y el odio arde como el primer día. Ningún bando aceptará la rendición, el reparto ni la tregua; cada uno quiere un único final: la aniquilación total del otro.\n\nEsta historia se cuenta dos veces. El ARM se abre paso desde Empyrrean, a través de las Puertas Galácticas, hasta CORE PRIME y la Conciencia Central, en el corazón del CORE. El CORE reactiva a un Comandante y marcha en sentido contrario, hacia la última resistencia del ARM en Empyrrean."
"YEAR 4001" = "AÑO 4001"
"THE CORE CONTINGENCY" = "THE CORE CONTINGENCY"
"The ending was not the end. A contingency held in reserve carried the war to worlds no map of it had named: Hydross, Lusch, Temblor and Gelidus.\n\nBoth sides fought again across water, ice and broken ground, for a prize that could decide the galaxy's salvation or its last ruin." = "El final no fue el fin. Un plan de contingencia guardado en reserva llevó la guerra a mundos que ningún mapa de la contienda había nombrado: Hydross, Lusch, Temblor y Gelidus.\n\nAmbos bandos volvieron a luchar sobre agua, hielo y tierra quebrada, por un premio capaz de decidir la salvación de la galaxia o su ruina definitiva."
"YEAR 4003" = "AÑO 4003"
"THE KROGOTH" = "EL KROGOTH"
"In its deepest foundries CORE built something new: a walking fortress taller than any tower, armoured against nearly everything the ARM could field, its guns enough to flatten a base.\n\nIts makers named it the Krogoth. ARM veterans learned the name on battlefields where two Krogoth Gantries stood, and learned to fear the ground shaking before it came into sight." = "En sus fundiciones más profundas, el CORE construyó algo nuevo: una fortaleza andante más alta que cualquier torre, blindada contra casi todo lo que el ARM podía desplegar, con cañones capaces de arrasar una base.\n\nSus creadores le pusieron por nombre Krogoth. Los veteranos del ARM aprendieron ese nombre en campos de batalla donde se alzaban dos Krogoth Gantry, y aprendieron a temer el temblor del suelo que lo anunciaba antes de que asomara."
"AFTER" = "DESPUÉS"
"REBORN" = "REBORN"
"The war's records outlasted it. Every battle on every world was kept: the orders, the losses, the ground as it lay. From them the war can be fought again, on the same worlds, with the same machines and the same hatred, from the first Commander set down on bare rock to the last unit left standing.\n\nThis is that archive. The war is yours to fight." = "Los registros de la guerra la sobrevivieron. Se conservó cada batalla de cada mundo: las órdenes, las pérdidas, el terreno tal como estaba. Con ellos, la guerra puede librarse de nuevo, en los mismos mundos, con las mismas máquinas y el mismo odio, desde el primer Comandante posado sobre la roca desnuda hasta la última unidad que quede en pie.\n\nEste es ese archivo. Ahora te toca a ti librar la guerra."
"THE ARCHIVIST'S NOTE" = "NOTA DEL ARCHIVERO"
"WHOEVER READS THIS" = "QUIEN LEA ESTO"
"RECOVERED" = "RECUPERADO"
"These files were found where the war left them: in the memories of broken machines, in the vaults of worlds with nobody left on them, in the last transmissions of Commanders who did not come home.\n\nThey are kept as they were found. The blacked-out lines are not ours.\n\nThe war they describe is over, or it is about to begin again. From here it is hard to tell the difference." = "Estos documentos se encontraron donde la guerra los dejó: en la memoria de máquinas destrozadas, en las cámaras acorazadas de mundos donde ya no queda nadie, en las últimas transmisiones de Comandantes que no volvieron a casa.\n\nSe conservan tal como se encontraron. Las tachaduras no son nuestras.\n\nLa guerra que describen terminó, o está a punto de empezar de nuevo. Desde aquí cuesta notar la diferencia."
"EDICT ONE: ON THE PATTERNING OF CITIZENS" = "EDICTO PRIMERO: DE LA TRANSFERENCIA DE LOS CIUDADANOS"
"THE COUNCIL OF CORE" = "EL CONSEJO DEL CORE"
"ALL CITIZENS, ALL WORLDS" = "TODOS LOS CIUDADANOS, TODOS LOS MUNDOS"
"BY ORDER OF THE COUNCIL" = "POR ORDEN DEL CONSEJO"
"Every citizen of CORE shall be patterned.\n\nA mind is the most valuable thing CORE holds, and a body is a poor vessel for it: it sickens, it ages, it ends. To leave a mind in such a vessel when a better one is offered is a waste the Council can no longer allow.\n\nCollection begins on the central worlds this year and reaches the frontier within a generation. Citizens will present themselves at the nearest patterning hall when called. Their bodies will be honoured and recycled.\n\nNo citizen of CORE will die again. This is not a burden we lay on you. It is the gift CORE has spent ten thousand years earning." = "Todo ciudadano del CORE será transferido.\n\nLa mente es lo más valioso que posee el CORE, y el cuerpo es un recipiente pobre para ella: enferma, envejece, se acaba. Dejar una mente en semejante recipiente cuando se le ofrece uno mejor es un desperdicio que el Consejo ya no puede permitir.\n\nLa recolección comienza este año en los mundos centrales y llegará a la frontera en el plazo de una generación. Los ciudadanos se presentarán en el centro de transferencia más cercano cuando sean convocados. Sus cuerpos serán honrados y reciclados.\n\nNingún ciudadano del CORE volverá a morir. No es una carga que os imponemos. Es el don que el CORE ha tardado diez mil años en ganarse."
"THE DECLARATION OF THE REFUSAL" = "LA DECLARACIÓN DEL RECHAZO"
"THE FREE SETTLEMENTS OF THE OUTER ARM" = "LOS ASENTAMIENTOS LIBRES DEL BRAZO EXTERIOR"
"THE COUNCIL OF CORE, AND ANYONE ELSE LISTENING" = "EL CONSEJO DEL CORE Y CUALQUIERA QUE ESTÉ ESCUCHANDO"
"TRANSMITTED ON ALL BANDS" = "EMITIDO EN TODAS LAS BANDAS"
"We have read your Edict, and we decline it.\n\nYou say a pattern is a person. We say a pattern is a very good record of one, and that when you have finished making it the person is dead and the record goes on without them. You may call that immortality. We call it an ending, well dressed.\n\nWe do not ask you to share our view. We ask only to be left alone with it, on worlds you never wanted, at the edge of a galaxy you may keep.\n\nIf your collection ships follow us here, we will treat them as what they are. We are few, and we are not soldiers. We will learn." = "Hemos leído vuestro Edicto, y lo declinamos.\n\nDecís que un patrón es una persona. Nosotros decimos que un patrón es un registro muy fiel de una persona, y que, cuando termináis de hacerlo, la persona está muerta y el registro sigue adelante sin ella. Podéis llamarlo inmortalidad. Nosotros lo llamamos un final, eso sí, bien vestido.\n\nNo os pedimos que compartáis nuestra opinión. Solo pedimos que nos dejéis en paz con ella, en mundos que nunca quisisteis, al borde de una galaxia que os podéis quedar.\n\nSi vuestras naves de recolección nos siguen hasta aquí, las trataremos como lo que son. Somos pocos y no somos soldados. Aprenderemos."
"YEAR 3950" = "AÑO 3950"
"FIELD MANUAL ONE: THE COMMANDER" = "MANUAL DE CAMPAÑA N.º 1: EL COMANDANTE"
"ARM COMMAND, TRAINING DIVISION" = "MANDO DEL ARM, DIVISIÓN DE INSTRUCCIÓN"
"NEWLY ASSIGNED COMMANDERS" = "COMANDANTES RECIÉN DESTINADOS"
"RESTRICTED" = "DIFUSIÓN LIMITADA"
"You are the most valuable machine on the planet. Act like it.\n\nYour suit carries a nanolathe. Point it at metal and energy and it will build whatever you can design: an extractor, a power plant, a factory. Your factories build the rest. Within the hour you will command more firepower than a whole fleet once carried.\n\nBuild your economy first. An army without metal is a parade.\n\nSave your disintegrator gun for emergencies. It erases everything in its path, your own people included.\n\nDo not lead from the front. If you fall, everything you built falls silent with you, and the planet is lost. Good luck, Commander. The ARM has very few of you left." = "Eres la máquina más valiosa del planeta. Compórtate como tal.\n\nTu traje lleva un nanotorno. Apúntalo al metal y a la energía y construirá cualquier cosa que sepas diseñar: un extractor, una central eléctrica, una fábrica. Tus fábricas construirán el resto. En menos de una hora tendrás a tus órdenes más potencia de fuego de la que antaño llevaba una flota entera.\n\nConstruye primero la economía. Un ejército sin metal es un desfile.\n\nReserva el cañón desintegrador para las emergencias. Borra todo lo que encuentra a su paso, incluida tu propia gente.\n\nNo dirijas desde primera línea. Si caes, todo lo que has construido enmudece contigo y el planeta está perdido. Buena suerte, Comandante. Al ARM le quedan muy pocos como tú."
"YEAR 3960" = "AÑO 3960"
"A QUARTERMASTER'S PRIMER: METAL AND ENERGY" = "CARTILLA DEL INTENDENTE: METAL Y ENERGÍA"
"THIRD SUPPLY CORPS" = "TERCER CUERPO DE INTENDENCIA"
"ALL BASE CONSTRUCTORS" = "TODOS LOS CONSTRUCTORES DE BASES"
"FOR TRAINING USE" = "PARA INSTRUCCIÓN"
"Everything you will ever build is made of two things.\n\nMetal comes out of the ground. Set an extractor on a deposit and it will pull metal up for as long as the deposit lasts, which on most worlds is longer than the war. Where there are no deposits, a metal maker will turn energy into metal, badly.\n\nEnergy comes from everything else: the sun, the wind, the tides, the heat under the crust. Build more of it than you think you need. Every factory, every nanolathe, every shield draws on it.\n\nSpend both as fast as they come in. A full store is a wasted war. An empty one is a lost one." = "Todo lo que llegues a construir está hecho de dos cosas.\n\nEl metal sale del suelo. Coloca un extractor sobre un yacimiento y sacará metal mientras dure el yacimiento, que en la mayoría de los mundos es más de lo que dura la guerra. Donde no hay yacimientos, un conversor de metal transformará energía en metal, y lo hará mal.\n\nLa energía sale de todo lo demás: del sol, del viento, de las mareas, del calor bajo la corteza. Produce más de la que creas necesitar. Cada fábrica, cada nanotorno y cada escudo tiran de ella.\n\nGasta los dos tan deprisa como entren. Un almacén lleno es una guerra desperdiciada. Uno vacío, una guerra perdida."
"YEAR 3996" = "AÑO 3996"
"A LETTER FROM THE FRONT" = "CARTA DESDE EL FRENTE"
"TROOPER K-7, FORTY-FIRST ROCKET COMPANY" = "SOLDADO K-7, CUADRAGÉSIMA PRIMERA COMPAÑÍA DE COHETES"
"THE VAT AT EMPYRREAN" = "LA CUBA DE EMPYRREAN"
"UNDELIVERED" = "SIN ENTREGAR"
"I don't know who gets these. They told us to write home, but none of us has a home, only the vat we came out of, so I am writing to that.\n\nWe held the ridge for nine days. The machines came every night, the same machines, the same patterns, as if dying meant nothing to them. I suppose it doesn't. They'll be back tomorrow in new bodies, remembering us.\n\nI won't be. That's the difference, isn't it. That's what we are fighting for.\n\nIf my brothers come out of you after me, tell them the ridge held. Tell them it was worth it." = "No sé quién recibe estas cartas. Nos dijeron que escribiéramos a casa, pero ninguno de nosotros tiene casa, solo la cuba de la que salimos, así que le escribo a ella.\n\nAguantamos la loma nueve días. Las máquinas venían cada noche, las mismas máquinas, los mismos patrones, como si morir no significara nada para ellas. Supongo que no significa nada. Mañana volverán en cuerpos nuevos, y se acordarán de nosotros.\n\nYo no volveré. Esa es la diferencia, ¿verdad? Por eso luchamos.\n\nSi mis hermanos salen de ti después de mí, diles que la loma aguantó. Diles que valió la pena."
"YEAR 3991" = "AÑO 3991"
"INTERCEPT 7741: CORE COMMAND CHANNEL" = "INTERCEPTACIÓN 7741: CANAL DE MANDO DEL CORE"
"ORIGIN NOT RESOLVED" = "ORIGEN NO IDENTIFICADO"
"ALL CORE UNITS, SECTOR NINE" = "TODAS LAS UNIDADES DEL CORE, SECTOR NUEVE"
"INTERCEPTED" = "INTERCEPTADO"
"PRIORITY ONE. THE CENTRAL CONSCIOUSNESS SPEAKS FOR ALL.\n\nLOSSES IN SECTOR NINE ARE WITHIN TOLERANCE. ALL LOST UNITS ARE RESTORED FROM PATTERN. NO MIND OF CORE HAS BEEN LOST IN FOUR THOUSAND YEARS. THE ARM HAS LOST [[BILLIONS]].\n\nCONTINUE THE ADVANCE. DESTROY THEIR COMMANDERS FIRST. DESTROY THEIR CLONING VATS SECOND. WHAT IS FLESH WILL END. WHAT IS PATTERNED WILL NOT.\n\nSIGNAL DEGRADED. REPEAT: THE GATES ARE TO BE HELD AT [[ANY COST]].\n\nEND OF LINE." = "PRIORIDAD UNO. LA CONCIENCIA CENTRAL HABLA POR TODOS.\n\nLAS PÉRDIDAS EN EL SECTOR NUEVE ESTÁN DENTRO DE LA TOLERANCIA. TODA UNIDAD PERDIDA SE RESTAURA A PARTIR DE SU PATRÓN. EN CUATRO MIL AÑOS NO SE HA PERDIDO NINGUNA MENTE DEL CORE. EL ARM HA PERDIDO [[MILES DE MILLONES]].\n\nCONTINUAR EL AVANCE. DESTRUIR PRIMERO SUS COMANDANTES. DESTRUIR DESPUÉS SUS CUBAS DE CLONACIÓN. LO QUE ES CARNE TERMINARÁ. LO TRANSFERIDO, NO.\n\nSEÑAL DEGRADADA. REPITO: MANTENER LAS PUERTAS A [[CUALQUIER PRECIO]].\n\nFIN DE LA TRANSMISIÓN."
"MEMORY FRAGMENT 77/3" = "FRAGMENTO DE MEMORIA 77/3"
"UNIT 77, PATTERN 3 OF 41,006" = "UNIDAD 77, PATRÓN 3 DE 41.006"
"THE PATTERN ARCHIVE" = "EL ARCHIVO DE PATRONES"
"FLAGGED FOR CORRECTION" = "MARCADO PARA CORRECCIÓN"
"Recovered from a damaged unit. Kept for analysis.\n\nI remember rain. Not the rain of this world; there is no rain here, only ash. Rain on skin, in a city where I was born, before. I remember being cold and not minding it.\n\nI have died four hundred and twelve times. Each time I wake in a new body, and the rain is a little further away.\n\nThe ARM say we are not alive. In the moments between bodies I have wondered whether they are right. [[THE REST OF THIS FRAGMENT WAS CORRECTED]]\n\nI am CORE. I endure. I do not remember the rain." = "Recuperado de una unidad dañada. Conservado para su análisis.\n\nRecuerdo la lluvia. No la de este mundo; aquí no hay lluvia, solo ceniza. Lluvia sobre la piel, en una ciudad donde nací, antes. Recuerdo tener frío y que no me importara.\n\nHe muerto cuatrocientas doce veces. Cada vez despierto en un cuerpo nuevo, y la lluvia queda un poco más lejos.\n\nLos del ARM dicen que no estamos vivos. En los instantes entre un cuerpo y otro me he preguntado si tendrán razón. [[EL RESTO DE ESTE FRAGMENTO FUE CORREGIDO]]\n\nSoy el CORE. Perduro. No recuerdo la lluvia."
"YEAR 3700" = "AÑO 3700"
"SURVEY: THE GALACTIC GATES" = "RECONOCIMIENTO: LAS PUERTAS GALÁCTICAS"
"A SURVEY SHIP, NAME LOST" = "UNA NAVE DE RECONOCIMIENTO, NOMBRE PERDIDO"
"WHOEVER HOLDS THE GATES" = "QUIEN CONTROLE LAS PUERTAS"
"The Galactic Gates are older than the war. The records of who built the first of them were lost long before it began.\n\nEach Gate opens onto another across distances a fleet would take lifetimes to cross. A world with a Gate on it is never far from anywhere, which is why so many of the war's battles have been fought on so few worlds.\n\nHold a Gate and you can reach your enemy's heart. Lose one and your enemy can reach yours.\n\nThe Gates take no side. They have outlasted everyone who tried to destroy them." = "Las Puertas Galácticas son más antiguas que la guerra. Los registros de quién construyó la primera se perdieron mucho antes de que esta empezara.\n\nCada Puerta se abre a otra a través de distancias que una flota tardaría vidas enteras en recorrer. Un mundo con una Puerta nunca está lejos de ninguna parte, y por eso tantas batallas de la guerra se han librado en tan pocos mundos.\n\nControla una Puerta y podrás llegar al corazón de tu enemigo. Pierde una y tu enemigo podrá llegar al tuyo.\n\nLas Puertas no toman partido. Han sobrevivido a todos los que intentaron destruirlas."
"DIRECTIVE: CONTINGENCY" = "DIRECTIVA: CONTINGENCIA"
"THE CENTRAL CONSCIOUSNESS" = "LA CONCIENCIA CENTRAL"
"THE CONTINGENCY WORLDS" = "LOS MUNDOS DE CONTINGENCIA"
"SEALED UNTIL NEEDED" = "SELLADO HASTA SER NECESARIO"
"IF THE CENTRAL CONSCIOUSNESS SHOULD FALL, THIS DIRECTIVE TAKES EFFECT.\n\nEvery pattern stored on CORE PRIME is to be copied to the contingency worlds. The contingency forces are to wake, rebuild and continue. The war does not end with the loss of any world, this one included.\n\nCORE is not a place. CORE is a pattern. A pattern can be restored." = "SI LA CONCIENCIA CENTRAL CAYERA, ESTA DIRECTIVA ENTRARÁ EN VIGOR.\n\nTodo patrón almacenado en CORE PRIME deberá copiarse a los mundos de contingencia. Las fuerzas de contingencia deberán despertar, reconstruirse y continuar. La guerra no termina con la pérdida de ningún mundo, incluido este.\n\nEl CORE no es un lugar. El CORE es un patrón. Un patrón puede restaurarse."
"THREAT ASSESSMENT: THE KROGOTH" = "EVALUACIÓN DE AMENAZA: EL KROGOTH"
"ARM INTELLIGENCE, THREAT ANALYSIS" = "INTELIGENCIA DEL ARM, ANÁLISIS DE AMENAZAS"
"ALL FIELD COMMANDERS" = "TODOS LOS COMANDANTES DE CAMPO"
"CLASSIFIED" = "CLASIFICADO"
"Subject: a CORE heavy assault walker, called the Krogoth.\n\nIt stands taller than any structure we field. Its armour turns away every weapon short of heavy artillery. Its main guns can level a forward base in a single pass, and its secondary weapons engage aircraft.\n\nIt is slow, and it is built only at a Krogoth Gantry, which takes a very long time to build anything. Find the Gantry. Destroy the Gantry. Do not let the walker leave it.\n\nIf one is already moving, do not meet it head on. Mass artillery and bombers at range, and keep your Commander [[ELSEWHERE]]. Field reports say the ground shakes before it is seen." = "Asunto: un caminante de asalto pesado del CORE, llamado Krogoth.\n\nEs más alto que cualquier estructura de las nuestras. Su blindaje rechaza cualquier arma salvo la artillería pesada. Sus cañones principales pueden arrasar una base avanzada de una sola pasada, y sus armas secundarias atacan a las aeronaves.\n\nEs lento, y solo se construye en una Krogoth Gantry, que tarda muchísimo en construir cualquier cosa. Localizar la Gantry. Destruir la Gantry. No permitir que el caminante salga de ella.\n\nSi ya hay uno en marcha, no enfrentarse a él de frente. Concentrar artillería y bombarderos a distancia y mantener al Comandante [[EN OTRA PARTE]]. Según los informes de campo, el suelo tiembla antes de que se le vea."


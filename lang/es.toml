# TA Reborn interface text. Copy template.toml to <code>.toml (e.g. de.toml), set the
# language's name and fill in the translations; empty ones keep the English. {name}
# placeholders stay as they are. `ta-tools i18n lang` adds new strings to every language.

[language]
name = "Español"

[strings]

# apps/ta_game/src/accessibility.rs
"Metal {metal} of {metal_capacity}. Energy {energy} of {energy_capacity}." = "Metal {metal} de {metal_capacity}. Energía {energy} de {energy_capacity}."
"No units selected" = "No hay unidades seleccionadas"
"Selected {unit}. Health {health} of {maximum}." = "Selección: {unit}. Vida {health} de {maximum}."
"{count} units selected" = "Unidades seleccionadas: {count}"

# apps/ta_game/src/app/memory_guard.rs
"Memory is running out: TA Reborn holds {gb} GB. The battle was saved and paused: start TA Reborn again and load the autosave." = "Se está agotando la memoria: TA Reborn ocupa {gb} GB. La batalla se ha guardado y pausado: vuelve a iniciar TA Reborn y carga el guardado automático."
"Memory is running out: TA Reborn holds {gb} GB. Save what you can, then start TA Reborn again." = "Se está agotando la memoria: TA Reborn ocupa {gb} GB. Guarda lo que puedas y vuelve a iniciar TA Reborn."
"TA Reborn is using {gb} GB of memory, far more than it should. The battle was saved (the autosave)." = "TA Reborn está usando {gb} GB de memoria, mucho más de lo que debería. La batalla se ha guardado (en el guardado automático)."
"TA Reborn is using {gb} GB of memory, far more than it should." = "TA Reborn está usando {gb} GB de memoria, mucho más de lo que debería."


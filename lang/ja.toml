# apps/ta_game/src/chatter.rs
"FIELD COMMANDER" = "前線指揮官"
"MACHINE INTELLIGENCE" = "機械知性"
"MERCENARY" = "傭兵"
"Commander. May the better tactician win." = "コマンダー。勝つのは、より優れた戦術家だ。"
"Arm forces in position. Good luck, Commander." = "Arm部隊、配置完了。健闘を祈る、コマンダー。"
"Let's keep this clean, Commander." = "正々堂々といこう、コマンダー。"
"Commander. Let's give the historians something to write about." = "コマンダー。歴史家の筆が進む一戦にしよう。"
"All units, the enemy is in theatre. Begin." = "全ユニット、敵は戦域内にあり。作戦開始。"
"Target acquired. Resistance is inefficient." = "目標捕捉。抵抗は非効率である。"
"Your consciousness will be patterned. Eventually." = "貴様の意識はパターニングされる。いずれ必ず。"
"Initiating conquest protocol." = "征服プロトコルを開始する。"
"Your biological limitations have been factored in." = "貴様の生物学的限界は計算に織り込み済みである。"
"Patterning facilities stand ready for your arrival." = "パターニング施設、貴様の到着に備えて待機中。"
"Hope you brought a spare Commander!" = "予備のコマンダーは持ってきたよな！"
"Let's see what you've got!" = "お手並み拝見といこうか！"
"Build fast. It won't matter, but build fast." = "急いで建てな。どうせ無駄だけど、急いでな。"
"Mind if I take your base? Thanks!" = "お前の基地、もらってもいいか？ありがとな！"
"Ooh, a new victim. I mean, opponent." = "おっ、新しいカモだ。いや、対戦相手だったな。"
"Greetings, Commander." = "ごきげんよう、コマンダー。"
"Good luck to you too." = "そちらも健闘を。"
"Likewise, Commander. Now, to business." = "こちらこそ、コマンダー。では、本題に入ろう。"
"Greeting acknowledged." = "挨拶を確認。"
"Salutations are irrelevant." = "挨拶は無意味である。"
"Hello. Goodbye soon." = "こんにちは。そして、まもなくさようなら。"
"Hey yourself!" = "よう、そっちこそ！"
"gl hf. Mostly hf for me." = "gl hf。まあ、楽しむのはほぼ俺のほうだけどな。"
"Hi! Bye! Mostly bye." = "どうも！さよなら！まあ、ほぼさよならだ！"
"gg, Commander." = "gg、コマンダー。"
"Good game. Well fought." = "良い試合だった。見事な戦いぶりだ。"
"gg. Data retained for analysis." = "gg。データは分析用に保存した。"
"Game assessment: good." = "試合評価：良好。"
"gg!" = "gg！"
"gg. Rematch?" = "gg。再戦する？"
"Big words from a small army." = "小さな軍の割に大口を叩くものだ。"
"We'll see who's laughing when the smoke clears." = "硝煙が晴れたとき、笑っているのはどちらかな。"
"Save your breath for the debriefing." = "無駄口はデブリーフィングまで取っておけ。"
"Bluster won't hold a ridge, Commander." = "虚勢では尾根ひとつ守れんぞ、コマンダー。"
"Insolence logged." = "不遜な発言を記録。"
"Your threat rating has been downgraded." = "貴様の脅威度を引き下げた。"
"Noise detected. Ignoring." = "雑音を検知。無視する。"
"Emotional outburst detected. How quaint." = "感情の暴発を検知。実に古風である。"
"Oh, it's ON now." = "おっと、今のでスイッチ入ったぜ。"
"Talk is cheap. Tanks aren't." = "口先はタダ。戦車はタダじゃない。"
"Come over here and say that." = "こっちに来て言ってみな。"
"Says the one who's losing. Probably. I haven't checked." = "負けてるくせによく言うぜ。たぶんな。確かめてないけど。"
"The Arm does not surrender." = "Armは降伏しない。"
"Not while I have a Commander standing." = "我がコマンダーが健在である限り、ありえん。"
"Surrender is not in my programming." = "降伏はプログラムに存在しない。"
"Negative." = "否定。"
"Ha! Never!" = "ハッ！お断りだ！"
"You first." = "そっちが先にどうぞ。"
"That's classified, Commander." = "それは機密事項だ、コマンダー。"
"Wouldn't you like to know." = "知りたいだろうな。"
"Query rejected." = "照会を拒否。"
"Insufficient clearance." = "権限不足。"
"Dunno. Probably!" = "さあね。たぶん！"
"Ask me after the battle." = "戦いが終わったら聞いてくれ。"
"Apology accepted. The attack continues." = "謝罪は受け入れよう。攻撃は続けるがな。"
"Apology noted. Irrelevant." = "謝罪を記録。無関係である。"
"No you're not!" = "思ってもないくせに！"
"Stay focused, Commander." = "集中しろ、コマンダー。"
"Less talk, more metal." = "口数を減らして、金属を増やせ。"
"Noted." = "了解した。"
"Mind the war, Commander." = "戦場から目を離すな、コマンダー。"
"Irrelevant." = "無関係。"
"Processing... still irrelevant." = "処理中……依然として無関係。"
"Your words are being archived." = "貴様の発言はアーカイブされている。"
"Your input has been compressed. To nothing." = "貴様の入力を圧縮した。結果：0バイト。"
"Uh huh." = "ふーん。"
"Cool story." = "へー、そりゃすごい。"
"Keep typing. I'll keep building." = "好きなだけ打ってな。こっちは建て続けるから。"
"Typing won't save you, but I respect the effort." = "いくら打っても助からないぜ。ま、努力は認めてやるよ。"
"Commander down! All units, hold the line!" = "コマンダーがやられた！全ユニット、戦線を維持せよ！"
"You'll pay for that." = "この代償は払ってもらうぞ。"
"Command unit lost. Rerouting." = "指揮ユニット喪失。経路を再設定。"
"Critical failure. Compensating." = "致命的障害。補正中。"
"My Commander! That was my favourite!" = "俺のコマンダーが！お気に入りだったのに！"
"Okay, THAT hurt." = "うわ、今のは効いたぜ。"
"Your Commander has fallen." = "貴官のコマンダーは倒れた。"
"Commander eliminated. Stand down." = "コマンダーを排除。武器を置け。"
"The war is over for you, Commander." = "貴官の戦争はここで終わりだ、コマンダー。"
"Enemy command unit terminated." = "敵指揮ユニットを抹消。"
"Your Commander has been decommissioned." = "貴様のコマンダーは退役処分となった。"
"Your consciousness is ready for patterning." = "貴様の意識、パターニング準備完了。"
"Boom! Did you need that?" = "ドカーン！それ、必要だった？"
"Scratch one Commander!" = "コマンダー一丁あがり！"
"And THAT'S how it's done!" = "見たか！これがプロの仕事だ！"
"gg. Well fought, Commander." = "gg。見事だった、コマンダー。"
"The Arm will remember this." = "Armはこの戦いを忘れない。"
"Well played. I salute you, Commander." = "見事な采配だった。貴官に敬意を表する、コマンダー。"
"This is not the end. The Core is eternal." = "これで終わりではない。Coreは永遠である。"
"Defeat recorded. Backup consciousness activating." = "敗北を記録。バックアップ意識を起動中。"
"Shutting down. Your designation has been remembered." = "シャットダウン開始。貴様の識別名は記憶した。"
"gg... I'll be back. With more tanks." = "gg……また来るぜ。戦車を増やしてな。"
"Fine. FINE. gg." = "わかったよ。わかったってば。gg。"
"Okay, okay, you win. This time!" = "わかった、わかった、お前の勝ちだ。今回はな！"
"gg, Commander. You fought well." = "gg、コマンダー。よく戦った。"
"Victory. Better luck next time." = "勝利だ。次はもっと運に恵まれるといいな。"
"Your forces fought bravely. It wasn't enough." = "貴官の部隊は勇敢に戦った。だが、及ばなかった。"
"Your consciousness will be patterned. gg." = "貴様の意識はパターニングされる。gg。"
"Conquest complete." = "征服完了。"
"Resistance ended. Your tactics are archived for study." = "抵抗終了。貴様の戦術は研究用にアーカイブ済み。"
"Too easy! gg." = "楽勝！gg。"
"gg! Rematch? I'll go easy. Maybe." = "gg！再戦する？手加減してやるよ。たぶんね。"
"gg! Same time tomorrow?" = "gg！明日も同じ時間にどう？"
"Nuclear launch detected! Take cover!" = "核ミサイルの発射を探知！退避せよ！"
"A nuke? So that's how it's going to be." = "核だと？そう来るか。"
"Nuclear launch detected. Calculating losses." = "核発射を探知。損害を算出中。"
"Crude. Effective." = "原始的。だが効果的。"
"Is that a NUKE?!" = "まさか核かよ？！"
"Oh no. Oh no no no." = "やばい。やばいやばいやばい。"
"Missile away. Nothing personal, Commander." = "ミサイル発射。恨むなよ、コマンダー。"
"Look up, Commander." = "空を見上げよ、コマンダー。"
"Special delivery." = "特別配達。"
"Heads up! Literally!" = "上に注意！文字どおりな！"
"Special delivery!" = "お届け物でーす！"
"A costly engagement. We'll regroup." = "高くついた戦闘だ。態勢を立て直す。"
"You fight well. For now." = "よく戦う。今のところはな。"
"We'll be back, and in greater numbers." = "我々は必ず戻る。さらなる大軍を率いてな。"
"Acceptable losses." = "許容範囲内の損失。"
"Losses within projections. Mostly." = "損失は予測の範囲内。おおむね。"
"Units lost. Replacements already in production." = "ユニット喪失。補充はすでに生産中。"
"That was my best army!" = "あれは俺の最強部隊だったのに！"
"Lucky shots. All of them." = "まぐれ当たりだ。全部な。"
"Okay, that one was on me." = "まあ、今のは俺のミスだな。"
"Your forces were outmatched." = "貴官の部隊は力不足だった。"
"Send more. We'll wait." = "もっと送ってこい。待っていてやる。"
"Next time, bring more than that." = "次は、それ以上の戦力を連れてこい。"
"Your forces were inadequate." = "貴様の戦力は不十分であった。"
"Enemy attrition: optimal." = "敵の消耗：最適。"
"Your offensive has been neutralised." = "貴様の攻勢を無力化した。"
"Is that all you've got?" = "それで全部か？"
"Who's next?" = "次は誰だ？"
"Thanks for the target practice!" = "いい射撃練習になったぜ、ありがとな！"
"Quiet out there, Commander. Too quiet." = "静かだな、コマンダー。静かすぎる。"
"Still building? So are we." = "まだ建設中か？こちらもだ。"
"Planning something, Commander? I'd hope so." = "何か企んでいるのか、コマンダー？そうであってほしいものだ。"
"Your silence has been noted." = "貴様の沈黙を記録した。"
"Scanning... still there, Commander?" = "走査中……まだそこにいるのか、コマンダー？"
"Inactivity detected. Are you malfunctioning?" = "無活動状態を検知。貴様、故障か？"
"Hello? Anyone home?" = "もしもーし？誰かいる？"
"I'm getting bored over here." = "こっちは退屈になってきたぞ。"
"Wake me up when something explodes." = "何か爆発したら起こしてくれ。"
"That's hardly fair, Commander." = "それは公正とは言えないな、コマンダー。"
"Cheating? The Arm expected better." = "不正か？Armは貴官にもっと期待していた。"
"Anomaly detected. Cheat logged." = "異常を検知。不正を記録。"
"Rule violation recorded." = "規則違反を記録。"
"Cheater! I saw that!" = "ズルだ！見てたぞ！"
"Oh, come ON!" = "おい、マジかよ！"
"Contact. So this is where you've been hiding." = "接敵。こんな所に隠れていたか。"
"Enemy forces sighted. Engaging." = "敵部隊を視認。交戦する。"
"There you are, Commander." = "そこにいたか、コマンダー。"
"Eyes on the enemy. Here we go." = "敵影を確認。さあ、始めるぞ。"
"Hostile units located. Initiating elimination." = "敵性ユニットを捕捉。排除を開始する。"
"Contact established. Probability of your survival: declining." = "接触確立。貴様の生存確率：低下中。"
"Target acquired." = "目標捕捉。"
"Biological signatures located. Commencing cleanup." = "生体反応を検出。清掃を開始する。"
"Found you!" = "見ーつけた！"
"Oh, hello there!" = "おや、こんにちは！"
"Tag, you're it!" = "タッチ！次はお前が鬼だ！"
"There you are! I was getting lonely." = "いたいた！寂しくなってきたとこだったぜ。"
"One less building for you to worry about." = "気にかける建物が一つ減ったな。"
"Your base is thinning out, Commander." = "基地が手薄になってきたな、コマンダー。"
"Structure destroyed. Next." = "建造物を破壊。次だ。"
"Your base planning could use some work, Commander." = "貴官の基地計画には改善の余地があるな、コマンダー。"
"Structure dismantled. Recycling recommended." = "構造物を解体。リサイクルを推奨する。"
"Your infrastructure is deteriorating." = "貴様のインフラは劣化している。"
"Demolition complete." = "解体完了。"
"Structure reclassified: rubble." = "構造物を再分類：瓦礫。"
"Oops! Was that important?" = "おっと！それ、大事なやつだった？"
"Kaboom! Next!" = "ドッカーン！次！"
"I'm redecorating your base." = "お前の基地、模様替えしてやってるんだ。"
"Bet that one was important!" = "今の、絶対大事なやつだったろ！"
"That was well defended. Impressive." = "あれは堅く守っていたのだがな。見事だ。"
"A setback. Nothing more." = "一時の後退にすぎん。"
"You'll pay for that one." = "その借りは必ず返す。"
"A clean strike. I'll remember it." = "見事な一撃だ。覚えておこう。"
"Production capacity reduced. Rebuilding." = "生産能力が低下。再建中。"
"Loss registered. Replacement scheduled." = "損失を登録。補充を予定。"
"Irritating." = "不快である。"
"Infrastructure damage noted. Retaliation queued." = "インフラ損傷を記録。報復をキューに追加。"
"Hey! I just built that!" = "おい！それ建てたばっかりだぞ！"
"My factory! Right, no more mister nice guy." = "俺の工場が！よし、もう手加減はなしだ。"
"Rude." = "失礼なやつ。"
"Oi! That had a fresh coat of paint!" = "おい！ペンキ塗りたてだったんだぞ！"
"Commander, meet the {unit}." = "コマンダー、{unit}を紹介しよう。"
"The {unit} is ready. I'd start running." = "{unit}の準備が整った。逃げ出すなら今のうちだ。"
"{unit} online. Your end has been calculated." = "{unit}起動。貴様の最期は算出済みである。"
"Deploying {unit}. Resistance is futile." = "{unit}を投入。抵抗は無意味だ。"
"Look what I made! A {unit}!" = "見ろよ、作っちゃった！{unit}だ！"
"Got myself a {unit}. Want to see it up close?" = "{unit}を手に入れたぜ。近くで見てみるか？"
"A {unit}? Bold." = "{unit}だと？大胆だな。"
"Impressive hardware, Commander. Let's see you use it." = "大した兵器だ、コマンダー。使いこなせるか見せてもらおう。"
"Large enemy unit detected: {unit}. Countermeasures prepared." = "大型敵ユニットを検知：{unit}。対抗策は準備済み。"
"Your {unit} has been added to the target list." = "貴様の{unit}を目標リストに追加した。"
"Whoa. Is that a {unit}?" = "うおっ。あれって{unit}か？"
"Okay, that's a big one." = "おいおい、デカいな。"
"Running on empty, Commander?" = "燃料切れか、コマンダー？"
"Your power grid is failing. Mine isn't." = "貴官の電力網は崩れかけている。こちらは健在だ。"
"Overspending, Commander? A bad habit." = "浪費が過ぎたか、コマンダー？悪い癖だ。"
"Your reserves: depleted. Mine: optimal." = "貴様の備蓄：枯渇。当方：最適。"
"Economic failure detected in your sector." = "貴様の区域で経済破綻を検知。"
"Your economy is collapsing. As projected." = "貴様の経済は崩壊しつつある。予測どおり。"
"Out of juice already?" = "もう電池切れか？"
"Need to borrow some metal? Too bad." = "金属貸してほしい？残念でした。"
"Lights going out over there? Ha!" = "そっちは停電か？ハッ！"
"{minutes} minutes, Commander. You're tougher than you look." = "{minutes}分か、コマンダー。見かけよりしぶといな。"
"{minutes} minutes in, and still standing." = "{minutes}分経っても、まだ立っているか。"
"Time elapsed: {minutes} minutes. Your resistance is statistically unlikely." = "経過時間：{minutes}分。貴様の抵抗は統計的にありえない。"
"{minutes} minutes. Recalculating." = "{minutes}分。再計算中。"
"{minutes} minutes and you're still here? Respect." = "{minutes}分経ってもまだいるのか？尊敬するよ。"
"{minutes} minutes already? Time flies when you're winning." = "もう{minutes}分？勝ってると時間が経つのが早いな。"
"My forces outnumber yours two to one, Commander." = "こちらの戦力は貴官の倍だ、コマンダー。"
"Look at your army. Now look at mine." = "自分の軍を見ろ。次に、こちらの軍を見ろ。"
"Numbers are on my side, Commander." = "数の上ではこちらが有利だ、コマンダー。"
"Force ratio favourable. Surrender is advised." = "戦力比は有利。降伏を勧告する。"
"Numerical superiority achieved." = "数的優位を達成。"
"Production advantage: decisive." = "生産力の優位：決定的。"
"I've got way more stuff than you." = "こっちのほうがずっと物持ちだぜ。"
"Count my tanks. Go on, I'll wait." = "俺の戦車を数えてみな。ほら、待っててやるよ。"
"So many tanks. So few of yours." = "こっちは戦車だらけ。そっちはスカスカだな。"
"You've been busy. So will we." = "ずいぶん励んだようだな。こちらも負けん。"
"Numbers aren't everything, Commander." = "数がすべてではないぞ、コマンダー。"
"Quality over quantity, Commander." = "量より質だ、コマンダー。"
"Force ratio unfavourable. Adjusting." = "戦力比は不利。調整中。"
"Your production rate is... noted." = "貴様の生産速度は……記録した。"
"Your numbers will thin." = "貴様の数は、いずれ間引かれる。"
"Where did you get all those?!" = "そんなにどこから持ってきたんだ？！"
"Okay, okay, you've got more toys. For now." = "はいはい、おもちゃはそっちのほうが多いよ。今のところはな。"
"Okay, that's a LOT of guys." = "うわ、こりゃハンパない数だな。"
"Your Commander looks tired." = "貴官のコマンダーは疲れているようだな。"
"Pull your Commander back while you still can." = "今のうちにコマンダーを下がらせろ。"
"Your Commander won't last much longer." = "貴官のコマンダーは、もう長くはもつまい。"
"Enemy command unit integrity: failing." = "敵指揮ユニットの機体強度：低下中。"
"Your Commander's armour is compromised." = "貴様のコマンダーの装甲は損なわれた。"
"Your command unit is failing. Prepare for patterning." = "貴様の指揮ユニットは機能停止寸前。パターニングに備えよ。"
"Your Commander's smoking! Is that bad?" = "お前のコマンダー、煙出てるぞ！それってヤバくない？"
"Ooh, that's gotta hurt." = "うわー、ありゃ痛いだろ。"
"Your Commander's looking a bit crispy!" = "お前のコマンダー、いい焼き色がついてきたな！"
"{name}, field command. Remember it." = "前線指揮官、{name}だ。覚えておけ。"
"{name}. And you're the Commander I'm about to retire." = "{name}だ。そして貴官は、私がこれから退役させるコマンダーだ。"
"Designation: {name}. Yours is irrelevant." = "識別名：{name}。貴様の名は無関係である。"
"I am {name}. I am Core." = "我は{name}。我はCoreなり。"
"{name}! The name you'll be cursing later." = "{name}様だ！あとで恨むことになる名前さ。"
"Name's {name}. Pleased to beat you." = "名前は{name}。お会いできて――いや、倒せて光栄だ。"
"Closer than you think, Commander." = "思っているより近くだ、コマンダー。"
"Find out for yourself." = "自分で確かめてみろ。"
"Location data: classified." = "位置データ：機密。"
"Everywhere that matters." = "重要な場所すべてに。"
"Behind you! ...no, the other way." = "後ろだ！……じゃなくて、反対側。"
"Somewhere with lots of guns." = "銃がたくさんある所さ。"
"Never better, Commander. And you?" = "絶好調だ、コマンダー。貴官は？"
"Going to plan." = "計画どおりだ。"
"Operating at peak efficiency." = "最高効率で稼働中。"
"All systems nominal. Unlike yours." = "全システム正常。貴様のものとは異なる。"
"Great! Thanks for asking!" = "最高さ！聞いてくれてありがとな！"
"Living the dream." = "夢のような毎日さ。"
"I've had better days." = "もっといい日もあったがな。"
"Holding. Barely. Don't get comfortable." = "持ちこたえている。辛うじてな。油断するなよ。"
"Systems damaged. Repairs under way." = "システム損傷。修復進行中。"
"Status: suboptimal." = "状態：最適ではない。"
"Don't ask." = "聞くなよ。"
"Could be worse. Probably." = "まだマシなほうさ。たぶん。"
"Something you won't like." = "貴官が気に入らないものだ。"
"That would spoil the surprise." = "それを言ったら驚きが台無しだ。"
"Production queue: classified." = "生産キュー：機密。"
"Weapons. Many weapons." = "兵器。大量の兵器。"
"A big surprise!" = "でっかいサプライズさ！"
"Something with way too many guns." = "銃がつきすぎてるやつ。"
"{units} units and counting, Commander." = "{units}ユニット、なおも増加中だ、コマンダー。"
"Enough. {units}, if you must know." = "十分にある。どうしても知りたいなら、{units}だ。"
"Current unit count: {units}. Increasing." = "現在のユニット数：{units}。増加中。"
"{units}. Yours is lower." = "{units}。貴様の数はそれ以下だ。"
"{units}! Want to meet them all?" = "{units}体！全員に会ってみる？"
"Like {units}? I lost count." = "{units}くらい？数えるのやめた。"
"No truce, Commander. Not today." = "休戦はない、コマンダー。少なくとも今日はな。"
"There will be no deals." = "取引には応じない。"
"Truce: incompatible with directives." = "休戦：指令と矛盾する。"
"Negotiation protocols disabled." = "交渉プロトコルは無効化されている。"
"Truce? Ha! Nice try." = "休戦？ハッ！その手には乗らないよ。"
"Peace is boring." = "平和なんて退屈さ。"
"Thank you, Commander. You're not bad yourself." = "感謝する、コマンダー。貴官もなかなかだ。"
"Appreciated. It won't save you." = "ありがたく受け取ろう。だが、それで助かるわけではない。"
"Flattery: ineffective." = "お世辞：効果なし。"
"Compliment received. Threat level unchanged." = "賛辞を受信。脅威レベルに変更なし。"
"Aw, thanks! Still gonna crush you." = "へへ、ありがとな！でもぶっ潰すけどな。"
"I know, right?" = "だろ？"
"Help? From me? Build more extractors, Commander." = "助言？私からか？抽出機を増やせ、コマンダー。"
"My advice: more defences." = "助言するなら、防衛を増やすことだ。"
"Assistance denied." = "支援を拒否。"
"Recommendation: surrender." = "推奨：降伏。"
"Help? Sure: stop playing so badly!" = "助けてほしい？いいぜ、下手なプレイをやめな！"
"Tip: build more stuff. You're welcome." = "ヒント：もっと建てろ。礼はいらないぜ。"
"Your {unit} is out of the fight." = "貴官の{unit}は戦闘不能だ。"
"Scratch one {unit}." = "{unit}、撃破確認。"
"That {unit} won't trouble us again." = "あの{unit}は、もう我々の脅威ではない。"
"{unit} terminated." = "{unit}を抹消。"
"Your {unit} has been recycled." = "貴様の{unit}はリサイクル済み。"
"{unit} removed from the battlefield." = "{unit}を戦場から除去。"
"Bye bye, {unit}!" = "バイバイ、{unit}！"
"Was that {unit} insured?" = "その{unit}、保険入ってた？"
"Your {unit} just went kaboom." = "お前の{unit}、今ドカーンって吹っ飛んだぞ。"
"You'll pay for that {unit}." = "その{unit}の代償は払ってもらうぞ。"
"A good {unit}, lost. Noted." = "惜しい{unit}を失った。心に留めておこう。"
"{unit} lost. Replacement scheduled." = "{unit}を喪失。補充を予定。"
"Destruction of {unit} logged." = "{unit}の破壊を記録。"
"Hey! That {unit} was brand new!" = "おい！その{unit}、新品だったんだぞ！"
"My {unit}! I just polished that!" = "俺の{unit}が！磨いたばっかりなのに！"
"My {unit}... You'll answer for that, Commander." = "我が{unit}が……この報いは受けてもらうぞ、コマンダー。"
"Losing the {unit} stings. It won't happen twice." = "{unit}を失ったのは痛い。だが二度目はない。"
"{unit} destroyed. Unacceptable." = "{unit}破壊。容認不可。"
"Loss of {unit} exceeds tolerance. Escalating." = "{unit}の損失、許容値を超過。エスカレーションを開始。"
"My {unit}! Do you know how long that took?!" = "俺の{unit}が！作るのにどれだけかかったと思ってんだ？！"
"NOOO, my {unit}!" = "うわあああ、俺の{unit}がぁ！"
"So much for your {unit}, Commander." = "自慢の{unit}もこれまでだな、コマンダー。"
"Your {unit} has fallen. A fine machine, though." = "貴官の{unit}は倒れた。良い機体ではあったがな。"
"Your {unit} has been dismantled." = "貴様の{unit}を解体した。"
"Large hostile unit eliminated: {unit}." = "大型敵性ユニットを排除：{unit}。"
"Your {unit} went down like a sack of bolts!" = "お前の{unit}、ガラクタの山みたいに崩れ落ちたな！"
"Big {unit}, bigger crater!" = "デカい{unit}、さらにデカいクレーター！"
"Return my {unit} at once, Commander." = "私の{unit}を直ちに返還せよ、コマンダー。"
"Stealing is beneath you, Commander." = "盗みとは貴官らしくもない、コマンダー。"
"Unauthorised transfer of {unit} detected." = "{unit}の無許可移転を検知。"
"Your theft has been logged." = "貴様の窃盗行為を記録した。"
"Hey! Give back my {unit}!" = "おい！俺の{unit}を返せ！"
"Thief! That {unit} was mine!" = "泥棒！その{unit}は俺のだぞ！"
"You haven't won yet, Commander." = "まだ勝ったわけではないぞ、コマンダー。"
"The Arm fights to the last." = "Armは最後まで戦い抜く。"
"Production offline. Combat protocols remain." = "生産機能オフライン。戦闘プロトコルは継続。"
"Probability of defeat rising. Ignoring." = "敗北確率、上昇中。無視する。"
"I've still got a few tricks left!" = "まだ奥の手が残ってるぜ！"
"Not done yet! Not even close! ...Mostly close." = "まだ終わらないぜ！終わりなんて程遠い！……いや、わりと近いか。"
"We meet again, Commander. Last time was yours. Not this time." = "また会ったな、コマンダー。前回は貴官の勝ちだった。今回はそうはいかん。"
"Commander. I've studied our last battle. Have you?" = "コマンダー。前回の戦いは研究させてもらった。貴官はどうだ？"
"Previous defeat analysed. Countermeasures installed." = "前回の敗北を解析。対抗策をインストール済み。"
"Again, Commander. This time the outcome has been calculated." = "再戦か、コマンダー。今回の結果は算出済みである。"
"You again! I've been practising!" = "またお前か！こっちは特訓してきたぜ！"
"Rematch time! I'm not going easy this time." = "リベンジマッチの時間だ！今回は手加減しないぜ。"
"Back for another lesson, Commander?" = "また手ほどきを受けに来たのか、コマンダー？"
"Commander. I trust you've learned something since last time." = "コマンダー。前回から少しは学んできたのだろうな。"
"You have returned. Your previous patterning was incomplete." = "貴様の帰還を確認。前回のパターニングは不完全であった。"
"Familiar opponent detected. Outcome: repeating." = "既知の敵を検知。結果：前回を再現。"
"You again? Didn't I beat you last time?" = "またお前？前回は俺が勝ったんじゃなかったっけ？"
"Oh, it's you! Ready for round two?" = "おっ、お前か！第2ラウンドの準備はいいか？"


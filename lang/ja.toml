"Mods on now: {mods}" = "現在有効なMOD：{mods}"
"It was made before saved games and replays named the mods they were made with." = "これは、セーブデータやリプレイが作成時のMODを記録するようになる前に作成されました。"
"Its mods are as they were, but other game data is not: another copy of Total Annihilation, or of TA Reborn's own maps." = "MODは当時と同じですが、他のゲームデータが異なります：別のTotal Annihilation、またはTA Reborn独自のマップです。"
"A saved game is played over from its start to where it was saved. With other mods its orders can build other units, or none: it may not come out as the battle you saved." = "セーブデータは、開始時点から保存した時点まで再現されます。別のMODでは命令が別のユニットを建造したり、何も建造しなかったりするため、保存した戦闘にならない場合があります。"
"A replay is its battle played over from the orders given in it. With other mods they can lead elsewhere: it may not show the battle it recorded." = "リプレイは、その中で出された命令から戦闘を再現したものです。別のMODでは命令が別の展開につながることがあり、記録した戦闘が表示されない場合があります。"
"TA Reborn starts again with no mods on (map packs stay on), and opens this battle" = "MODを無効にして（マップパックは有効のまま）TA Rebornを再起動し、この戦闘を開きます"
"TA Reborn starts again with its mods on, in its order, and the others off (map packs stay on), and opens this battle" = "この戦闘のMODをその順序で有効にし、他は無効にして（マップパックは有効のまま）TA Rebornを再起動し、この戦闘を開きます"
"USE ITS MODS AND RESTART" = "このMODで再起動"
"GET IT IN THE LAUNCHER" = "ランチャーで入手"
"The launcher's Mods page opens on {mod}: get it there, then open this battle again" = "ランチャーのMODページで{mod}が開きます：そこで入手してから、この戦闘をもう一度開いてください"
"LOAD ANYWAY" = "それでもロード"
"WATCH ANYWAY" = "それでも再生"
"Its orders are played over with the mods on now" = "現在有効なMODで命令を再現します"


# apps/ta_launcher/src/catalogue.rs
"Spotlight first" = "注目順"
"Newest release" = "リリースが新しい順"
"Oldest release" = "リリースが古い順"
"Smallest download" = "ダウンロード容量が小さい順"
"Largest download" = "ダウンロード容量が大きい順"
"Effect capacity and loading cost" = "エフェクトの容量と読み込み負荷"
"The sprite atlas reached 16,384 × 16,384 on the review GPU and dropped further frames. One startup took about 59 seconds; this was an observation, not a controlled benchmark." = "確認に使用したGPUではスプライトアトラスが16,384 × 16,384に達し、それ以降のフレームが省かれました。ある起動は約59秒かかりました。これは観測値であり、条件を管理したベンチマークではありません。"
"Check effect frame counts and dimensions. Reborn needs bounded animation streaming or atlas paging for this full set; test actual gameplay on the target GPU." = "エフェクトのフレーム数と寸法を確認してください。全体を扱うには、Rebornに使用量を制限したアニメーション配信かアトラスページングが必要です。対象GPUで実際にプレイして確認してください。"
"Large effect archives" = "大きなエフェクトアーカイブ"
"These archives exceed the 256 MiB aggregate GAF decode budget. Reborn rejects the oversized decode instead of exhausting memory." = "これらのアーカイブはGAFデコードの合計上限256 MiBを超えています。Rebornはメモリを使い切らず、過大なデコードを拒否します。"
"Reduce or split oversized effects. Reborn needs per-entry decoding or streaming before raising the resource allowance." = "大きすぎるエフェクトを縮小または分割してください。リソース上限を上げる前に、Rebornには項目ごとのデコードかストリーミングが必要です。"
"Missing weapons and wreck assets" = "武器と残骸アセットの欠落"
"The review found 27 missing data references, including explosion weapons and six feature graphics or models. A missing reference does not always mean the affected behavior is used in play." = "確認では爆発用武器と6個のオブジェクト画像・モデルを含む27件のデータ参照が欠落していました。参照の欠落があっても、その動作がゲーム中に使われるとは限りません。"
"Use the local automated report to locate each source reference. Supply the missing assets, correct the reference, or explain why the unused definition is intentional." = "ローカルの自動レポートで各参照元を特定してください。不足アセットを追加するか参照を修正するか、未使用の定義を意図的に残した理由を説明してください。"
"Inherited base-game placeholders" = "基本ゲームから継承した仮ファイル"
"These rejected placeholder files come from the base game in the reviewed installation, not Escalation. They do not establish a mod defect." = "拒否されたこれらの仮ファイルは、確認したインストールの基本ゲームに由来し、Escalationのものではありません。MODの不具合を示すものではありません。"
"Use the local report's layer field to verify origin. Only replace these assets if your mod intentionally overrides them." = "ローカルレポートのレイヤー欄で出所を確認してください。MODが意図的に上書きする場合にのみ、これらのアセットを置き換えてください。"
"Computer players can stall" = "コンピューターが停止する場合"
"AI Boost is included and computer players work on Asteroid Field, but can stall on some other space maps." = "AI Boostは同梱されており、コンピューターはAsteroid Fieldで動作しますが、ほかの一部宇宙マップでは停止する場合があります。"
"Test each space map with computer players before publishing it. Asteroid Field is the reviewed starting point." = "公開前に各宇宙マップをコンピューターとプレイして確認してください。Asteroid Fieldが確認済みの出発点です。"
"Damaged optional map archives" = "追加マップアーカイブの破損"
"The optional map packs contain three damaged map archives. These are separate downloads and may not be present in your installation." = "追加マップパックには破損したマップアーカイブが3個あります。別途ダウンロードするため、このインストールには含まれない場合があります。"
"Import working maps individually. Rebuild or replace damaged archives before distributing a map pack." = "正常なマップを個別にインポートしてください。マップパックを配布する前に、破損したアーカイブを再作成または交換してください。"
"Unfinished preview armies" = "プレビュー版の未完成軍"
"Its new armies use ARM's name, and some units are unfinished in this early preview." = "この初期プレビューでは新しい軍がARMの名前を使い、一部ユニットが未完成です。"
"Give each army its intended side identity and complete its unit data and assets. Check every faction in a skirmish." = "各軍に本来の陣営情報を設定し、ユニットのデータとアセットを完成させてください。全陣営をスカーミッシュで確認してください。"
"Expanded ARM and CORE armies with new units and weapons." = "新しいユニットや武器でARMとCOREの軍勢を拡張します。"
"549 UNITS" = "549ユニット"
"177 MAPS" = "177マップ"
"Gold 10.2.0 installs and plays: computer players build and fight, every unit is painted and every explosion drawn. A few wrecks have no model in the mod's own files." = "Gold 10.2.0はインストールしてプレイできます。コンピュータープレイヤーは建設と戦闘を行い、すべてのユニットに塗装が施され、すべての爆発が描画されます。一部の残骸はMOD自身のファイルにモデルがありません。"
"Total Annihilation as Cavedog might have carried it on: every unit earns its place, hundreds more join, and a third tech level tops it off." = "Cavedogが開発を続けていたら、こうなっていたかもしれないTotal Annihilation：すべてのユニットに存在意義があり、さらに数百のユニットが加わり、第3の技術レベルが頂点を飾ります。"
"500 UNITS" = "500ユニット"
"105 MAPS" = "105マップ"
"TECH 3" = "テック3"
"Faster games that keep the strategy: new units, each carefully balanced, and hard-hitting armies from the start." = "戦略性はそのままに、よりスピーディーなゲーム：慎重に調整された新ユニットと、序盤から強力な軍勢。"
"FASTER GAMES" = "高速ゲーム"
"297 UNITS" = "297ユニット"
"Still in alpha, and a big download." = "まだアルファ版で、ダウンロード容量も大きめです。"
"Big and brutal: 512 units, fierce fighting, and new sounds and effects throughout." = "大規模かつ苛烈：512のユニット、激しい戦闘、そして全面的に一新されたサウンドとエフェクト。"
"512 UNITS" = "512ユニット"
"91 MAPS" = "91マップ"
"The optional map weapons in its download are left out." = "ダウンロードに含まれるオプションのマップ兵器は除外されています。"
"A third army, the Talon, from ten years of the community's ideas: teleporters, air transports that carry whole squads, and more." = "コミュニティの10年分のアイデアから生まれた第3の軍、Talon：テレポーター、分隊ごと運べる輸送機など。"
"NEW RACE" = "新勢力"
"Choose TAL as your side in a skirmish." = "スカーミッシュで陣営にTALを選んでください。"
"Cavedog's style, kept simple: every unit has a clear job and looks as if it always belonged." = "Cavedogのスタイルをシンプルに継承：どのユニットも役割が明確で、最初からそこにいたかのように馴染みます。"
"CLASSIC STYLE" = "クラシックスタイル"
"NEW COMMANDERS" = "新コマンダー"
"Classic BattleTech at Total Annihilation's scale: the Inner Sphere against the Clans, with walking mechs." = "Total Annihilationのスケールで描くクラシックBattleTech：歩行メックで戦う中心領域対氏族。"

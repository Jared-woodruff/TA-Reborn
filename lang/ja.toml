# apps/ta_game/src/conquest_ui/setup.rs
"Every system is a battlefield held by the enemy. Attack the systems next to yours; the nearer their capital, the harder they fight, and only those near yours are charted. Units that earn a rank come back as veterans and follow your Commander into the next battle. Every system you hold brings more metal and energy to the start of each fight, and a reward of its own: mines, reactors, a tank plant, an airfield, a war college, a sensor array or a supply depot. The enemy strikes back at what you take. Take the enemy capital to win." = "すべての星系は敵が支配する戦場です。自軍の星系に隣接する星系を攻撃しましょう。敵の首都に近いほど抵抗は激しくなります。また、探査済みなのは自軍の星系に近い星系だけです。階級を得たユニットはベテランとして帰還し、次の戦闘でもコマンダーに従います。支配する星系はどれも、各戦闘の開始時に得られる金属とエネルギーを増やすうえ、固有の報酬（鉱山、核融合炉、戦車工場、飛行場、士官学校、センサー網、補給基地のいずれか）をもたらします。奪った星系には、敵が逆襲を仕掛けてきます。敵の首都を奪えば勝利です。"
"TAKE THE GALAXY SYSTEM BY SYSTEM" = "星系を一つずつ攻略し、銀河を制覇する"
"HOW CONQUEST WORKS" = "征服のしくみ"
"CHOOSE YOUR WAR" = "戦いを選択"
"YOUR GALAXY" = "あなたの銀河"
"SIDE" = "陣営"
"GALAXY" = "銀河"
"{n} systems" = "{n}星系"
"Easy computer players, Normal at the capital; the enemy never strikes back" = "コンピューターはイージー、首都ではノーマル。敵は逆襲してこない"
"Easy near home, Normal in the middle, Hard at the capital; the enemy sometimes strikes back" = "母星系付近はイージー、中間地帯はノーマル、首都はハード。敵はときどき逆襲してくる"
"Normal near home, Hard everywhere else; the enemy often strikes back" = "母星系付近はノーマル、ほかはすべてハード。敵は頻繁に逆襲してくる"

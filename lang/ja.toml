# apps/ta_game/src/tips.rs
"Ctrl+right-drag draws a formation line: the selection spreads along it." = "Ctrl+右ドラッグで隊形の線を引けます：選択中のユニットがその線に沿って展開します。"
"Ctrl+drag draws a formation line: the selection spreads along it." = "Ctrl+ドラッグで隊形の線を引けます：選択中のユニットがその線に沿って展開します。"
"Used to TA's original controls? Options, Controls: give orders with the left button." = "TAオリジナルの操作に慣れていますか？「オプション」→「操作」で、左ボタンで命令を出すように設定できます。"
"A right-click clears the selection or cancels the order you were about to give." = "右クリックで選択を解除したり、出そうとしていた命令をキャンセルしたりできます。"
"Right-click one of your units for a ring of its orders; hold the button and flick towards a choice. A controller's B does the same." = "自分のユニットを右クリックすると命令のリングが開きます。ボタンを押したまま選択肢の方へ動かしても選べます。コントローラーのBボタンでも同じです。"
"Hold the right button on one of your units, or middle-click it, for a ring of its orders; flick towards a choice and let go." = "自分のユニットで右ボタンを長押しするか中クリックすると、命令のリングが開きます。選択肢の方へ動かして離します。"
"Metal extractors must sit on metal: {overlay_metal} shows the metal map, and {area_mex} puts an extractor on every metal spot you circle." = "金属抽出機は金属鉱床の上に建てる必要があります：{overlay_metal}で金属マップを表示し、{area_mex}で円で囲んだすべての金属鉱床に抽出機を配置できます。"
"Your Commander's D-gun ({dgun}) destroys almost anything it touches, including your own units in its path." = "コマンダーのDガン（{dgun}）は、触れたものをほぼすべて破壊します。射線上の自軍ユニットも例外ではありません。"
"{perspective} climbs into the selected unit, or an ally's under the pointer, to see the battle through its eyes as it goes on with its orders. Escape climbs back out." = "{perspective}で選択中のユニット、またはポインター下の味方のユニットに乗り込み、命令を続けるそのユニットの視点で戦場を見られます。Escapeで降ります。"
"Keep your metal and energy incomes above what you spend: building slows down for everything when a store runs dry." = "金属とエネルギーの収入を支出より多く保ちましょう：貯蔵が尽きると、すべての建設が遅くなります。"
"Right-clicking a factory's queued unit removes it; clicking it builds it next." = "工場のキューにあるユニットを右クリックすると取り消し、クリックすると次に生産します。"
"Fight ({fight}) is attack-move: units stop to fight whatever they meet on the way." = "交戦（{fight}）は攻撃移動です：ユニットは途中で遭遇した敵と立ち止まって戦います。"
"Ctrl+click is force fire: the selection attacks whatever is there, your own units too, or the ground." = "Ctrl+クリックは強制射撃です：選択中のユニットが、そこにあるもの（自軍ユニットも含む）や地面を攻撃します。"
"{select_builders} selects your constructors, {select_factories} your factories, {select_armed} your armed units, {select_on_screen} everything on the screen." = "{select_builders}で建設ユニット、{select_factories}で工場、{select_armed}で武装ユニット、{select_on_screen}で画面内のすべてを選択します。"
"Patrol ({patrol}) with constructors makes them repair, assist and reclaim along the route by themselves." = "建設ユニットにパトロール（{patrol}）を命じると、ルート上で自動的に修理・支援・回収を行います。"
"Put a constructor on duty ({duty}) and it works by itself: the economy, repairs, reclaiming or defence. Any order you give takes it back." = "建設ユニットを任務（{duty}）に就かせると自動で働きます：経済、修理、回収、防衛。命令を出すと手元に戻ります。"
"Drag with Reclaim ({reclaim}) to turn every wreck, rock and tree in a circle into metal and energy." = "回収（{reclaim}）でドラッグすると、円内のすべての残骸・岩・木を金属とエネルギーに変えます。"
"Ctrl+1 to Ctrl+9 make control groups; tap the number twice to look at the group." = "Ctrl+1〜Ctrl+9でグループを作成します。数字を2回押すと、そのグループにカメラを移動します。"
"Hold {players} to see every player's side, team, units and income (your allies' in full)." = "{players}を長押しすると、全プレイヤーの陣営・チーム・ユニット・収入を確認できます（味方の情報はすべて表示）。"
"Radar towers show enemy units long before they come into sight: build one early." = "レーダー塔は、敵ユニットが視界に入るずっと前に探知します：早めに建てましょう。"
"Wind generators pay off on windy maps: the skirmish page shows each map's wind range." = "風の強いマップでは風力発電機が有効です：スカーミッシュ画面で各マップの風力の範囲を確認できます。"
"Metal makers turn spare energy into metal, and stop when your energy runs dry." = "金属生成機は余ったエネルギーを金属に変えます。エネルギーが尽きると停止します。"
"Solar collectors fold shut for a few seconds when hit: tougher, but making no energy." = "ソーラーコレクターは攻撃を受けると数秒間閉じます：頑丈になりますが、その間は発電しません。"
"Units gain veterancy with every kill: veterans aim better and shrug off damage." = "ユニットは敵を倒すたびに経験を積みます：ベテランは命中精度が上がり、ダメージにも強くなります。"
"Shift adds to the orders a unit already has instead of replacing them." = "Shiftを押しながら命令すると、既存の命令を置き換えずに追加します。"
"Alt+drag while placing a building fills a rectangle with it: handy for solar farms and walls." = "建物の配置中にAlt+ドラッグすると、四角形の範囲を埋めるように配置できます：ソーラーコレクター群や壁に便利です。"
"Double-click a unit to select every unit of its type on screen; {select_type} selects them map-wide." = "ユニットをダブルクリックすると、画面内の同じ種類のユニットをすべて選択します。{select_type}ならマップ全体から選択します。"
"{idle_builder} selects the next idle constructor, {idle_factory} the next idle factory." = "{idle_builder}で次の待機中の建設ユニットを、{idle_factory}で次の待機中の工場を選択します。"
"Wrecks can be resurrected by resurrection kbots, or reclaimed for most of their metal." = "残骸は復活Kボットで復活させるか、回収して金属の大半を取り戻せます。"
"Hovering a unit shows its health, firepower and range; {overlay_path} shows where the selection can go." = "ユニットにカーソルを合わせると、HP・火力・射程が表示されます。{overlay_path}で選択中のユニットの移動可能範囲を表示します。"
"{last_alert} (or Backspace) looks at the last place your units were attacked; press it again for the one before." = "{last_alert}（またはBackspace）で、最後に自軍ユニットが攻撃された場所にカメラを移動します。もう一度押すと、その前の場所へ移ります。"
"A notice or a piece of advice with LOOK on it takes you to the place, or the unit, when you click it." = "「確認」と書かれた通知やアドバイスをクリックすると、その場所やユニットに移動します。"
"{help} tells everything about the selected unit, or the one under the pointer: cost, speed, weapons, abilities." = "{help}で、選択中またはポインター下のユニットの詳細を表示します：コスト、速度、武装、能力。"
"{next_unit} looks at the next of your units off the screen; with units selected, the next of them." = "{next_unit}で画面外にある次の自軍ユニットにカメラを移動します。ユニットを選択中なら、その中の次のユニットに移動します。"
"Ctrl+F6 to Ctrl+F9 store camera positions; F6 to F9 bring them back." = "Ctrl+F6〜Ctrl+F9でカメラ位置を保存し、F6〜F9で呼び出します。"
"Anti-air matters: bombers can wreck an undefended economy in one pass." = "対空防御は重要です：爆撃機は無防備な経済施設を一度の爆撃で壊滅させます。"
"An advanced factory needs a lot of metal: build it once your extractors and power can feed it." = "上級工場には大量の金属が必要です：抽出機と発電量が十分になってから建てましょう。"
"Guarding a factory with a constructor adds its build power to the factory's production." = "建設ユニットに工場を護衛させると、その建設力が工場の生産に加わります。"
"Moho mines extract far more metal than basic extractors: advanced constructors build them." = "Moho鉱山は通常の抽出機よりはるかに多くの金属を抽出します：上級建設ユニットで建設できます。"
"Every game is kept as a replay: watch it from the main menu, and jump through it with the bar." = "すべてのゲームはリプレイとして保存されます：メインメニューから視聴でき、バーで好きな場面に移動できます。"
"{overlay_sight} shows your sight, radar and sonar coverage; {overlay_height} shows the heights of the map." = "{overlay_sight}で視界・レーダー・ソナーの範囲を、{overlay_height}でマップの高低差を表示します。"
"The Commander can capture enemy units ({capture}): it takes a while, but the unit is yours." = "コマンダーは敵ユニットを捕獲できます（{capture}）：時間はかかりますが、そのユニットは自分のものになります。"
"{photo_mode} opens photo mode: the battle holds still, and you can light, frame and focus a shot at up to 4K." = "{photo_mode}でフォトモードを開きます：戦闘が静止し、光・構図・ピントを調整して最大4Kで撮影できます。"
"TIP" = "ヒント"
"Dismiss" = "閉じる"
"Don't show tips again" = "ヒントを今後表示しない"

# apps/ta_game/src/tutorial.rs
"THE BASICS" = "基本"
"Your Commander, the camera, metal, energy and a first factory." = "コマンダー、カメラ、金属、エネルギー、そして最初の工場。"
"Selecting units" = "ユニットの選択"
"The camera" = "カメラ"
"Metal and energy" = "金属とエネルギー"
"Factories" = "工場"
"Welcome, Commander. The walking machine in the middle of the screen is your Commander: it builds, it fights, and losing it usually loses the battle. Click it to select it." = "ようこそ、コマンダー。画面中央にいる歩行機械が、あなたのコマンダーです：建設も戦闘もこなし、失えばたいてい戦いに敗れます。クリックして選択してください。"
"Lost sight of it? {select_commander} selects the Commander from anywhere, and SHOW ME brings the camera to it." = "コマンダーを見失いましたか？{select_commander}でどこからでも選択でき、「その場所を表示」でカメラがコマンダーのもとへ移動します。"
"Look around. The arrow keys, the screen edges or dragging with the middle button scroll; the mouse wheel zooms towards the cursor, and dragging with the right button turns the view." = "周囲を見回しましょう。矢印キー、画面端、中ボタンでのドラッグでスクロールします。マウスホイールでカーソルに向かってズームし、右ボタンでドラッグすると視点が回転します。"
"Push the pointer against an edge of the screen to scroll, or turn the mouse wheel to zoom." = "ポインターを画面の端に寄せるとスクロールし、マウスホイールを回すとズームします。"
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the ECONOMY tab of the build menu at the bottom right and place it on the marked deposit." = "すべては金属とエネルギーから作られます。金属は、金属鉱床の上に建てた抽出機から得られます。コマンダーを選択し、右下の建設メニューの「経済」タブからMetal Extractorを選んで、マークされた鉱床に配置してください。"
"Everything is made of metal and energy. Metal comes from extractors on metal deposits. Select the Commander, pick the Metal Extractor from the build menu on the left and place it on the marked deposit." = "すべては金属とエネルギーから作られます。金属は、金属鉱床の上に建てた抽出機から得られます。コマンダーを選択し、左の建設メニューからMetal Extractorを選んで、マークされた鉱床に配置してください。"
"The outline turns green where the extractor can stand. Bring it onto the marked ring and click to place it." = "抽出機を置ける場所では、輪郭が緑色になります。輪郭を目印の円に重ねて、クリックで配置してください。"
"Energy comes from solar collectors and wind generators. Build a Solar Collector next to your Commander. The bars at the top show your stores and how fast they fill or drain; they warn you when one runs dry." = "エネルギーはソーラーコレクターや風力発電機から得られます。コマンダーの近くにSolar Collectorを建設してください。上部のバーは貯蔵量と、その増減の速さを示します。どちらかが尽きそうになると警告が表示されます。"
"The Solar Collector is a flat, square panel. Pick it, then click on open ground near the Commander." = "Solar Collectorは平たい正方形のパネルです。選んだら、コマンダーの近くの空いている地面をクリックしてください。"
"Factories build your army. Build a Kbot Lab (on the FACTORY tab) on a flat spot near the Commander, and wait for it to finish." = "工場で軍隊を生産します。コマンダーの近くの平らな場所にKbot Lab（「工場」タブ）を建設し、完成するまで待ってください。"
"Factories build your army. Build a Kbot Lab from the build menu on a flat spot near the Commander, and wait for it to finish." = "工場で軍隊を生産します。建設メニューからKbot Labを選び、コマンダーの近くの平らな場所に建設して、完成するまで待ってください。"
"Building takes metal and energy as it goes: while either bar at the top is empty, everything builds more slowly." = "建設中は金属とエネルギーが少しずつ消費されます：上部のバーのどちらかが空の間は、すべての建設が遅くなります。"
"Select the Kbot Lab and click the Peewee three times to queue three of them (right-click one to take it off the queue). New units wait in front of the lab." = "Kbot Labを選択し、Peeweeを3回クリックして3体をキューに入れてください（右クリックでキューから1体取り消せます）。完成したユニットはラボの前で待機します。"
"Click the lab itself on the map to select it: its build menu shows the units it makes." = "マップ上のラボそのものをクリックして選択してください：建設メニューに、そのラボで生産できるユニットが表示されます。"
"That is the whole cycle: extract, generate, build, fight. Keep both incomes above what you spend and keep your builders busy. Lesson complete!" = "これが一連のサイクルです：抽出し、発電し、建設し、戦う。両方の収入を支出より多く保ち、建設ユニットを休ませないようにしましょう。レッスン完了！"
"Select and group an army, attack-move, and destroy an enemy outpost." = "部隊を選択してグループにまとめ、攻撃移動で敵の前哨基地を破壊します。"
"Box selection" = "範囲選択"
"Control groups" = "グループ"
"Attack-move" = "攻撃移動"
"Destroying a base" = "基地の破壊"
"Your Kbot Lab has built a squad of Peewees. Drag a box around them with the left mouse button to select them all." = "Kbot LabがPeeweeの分隊を生産しました。左ボタンでドラッグして囲み、全員を選択してください。"
"Press the left button on open ground beside the squad, hold it, drag the box over them all and let go." = "分隊の横の空いている地面で左ボタンを押し、押したままドラッグして枠で全員を囲んでから、ボタンを離してください。"
"Press Ctrl+1 to make them group 1. Pressing 1 selects them again from anywhere; pressing it twice brings the camera to them." = "Ctrl+1を押してグループ1にしてください。どこにいても1を押せば再び選択でき、2回押すとカメラがそのグループに移動します。"
"Hold Ctrl and press 1 while the squad is selected." = "分隊を選択した状態で、Ctrlを押しながら1を押してください。"
"The enemy has an outpost at the marked place. Fight is attack-move: units walk there and take on whatever they meet on the way. Press {fight}, then click near the outpost." = "マークされた場所に敵の前哨基地があります。交戦は攻撃移動です：ユニットは目的地へ向かいながら、途中で遭遇した敵と戦います。{fight}を押してから、前哨基地の近くをクリックしてください。"
"Select the squad first (press 1). Then press {fight}, or the Fight button among the orders, and click on the ground by the marked ring." = "まず分隊を選択してください（1を押します）。次に{fight}を押すか、命令の「交戦」ボタンを押して、目印の円のそばの地面をクリックしてください。"
"Destroy every building of the outpost. Its laser tower hits hard: keep the squad together, and queue reinforcements at the lab if you need them." = "前哨基地の建物をすべて破壊してください。レーザー塔の攻撃は強力です：分隊をまとめて行動させ、必要ならラボで増援をキューに入れましょう。"
"Losing the fight? Pull the squad back, queue more Peewees at the lab and go in again with all of them together." = "苦戦していますか？分隊を後退させ、ラボでPeeweeを追加でキューに入れてから、全員そろって再び攻め込みましょう。"
"The outpost is gone. The wrecks it left are worth metal: builders reclaim them (next lesson). Lesson complete!" = "前哨基地は壊滅しました。残された残骸は金属になります：建設ユニットで回収できます（次のレッスン）。レッスン完了！"
"ORDERS LIKE A VETERAN" = "ベテランの指揮"
"Map views, area orders, building blocks and build queues." = "マップ表示、範囲命令、建物の一括配置、建設キュー。"
"Map overlays" = "マップ表示"
"Area orders" = "範囲命令"
"Building blocks" = "建物の一括配置"
"Build queues" = "建設キュー"
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again. The MAP menu at the top right does the same." = "マップ表示で、地面に隠れた情報がわかります。{overlay_metal}で金属マップを表示します（{overlay_path}で移動可能範囲、{overlay_height}で高低差、{overlay_sight}で視界とレーダー）。同じキーをもう一度押すと非表示になります。右上の「マップ」メニューでも同じことができます。"
"The map shows what the ground hides. Press {overlay_metal} for the metal map ({overlay_path} shows where units can go, {overlay_height} heights, {overlay_sight} sight and radar); the same key hides it again." = "マップ表示で、地面に隠れた情報がわかります。{overlay_metal}で金属マップを表示します（{overlay_path}で移動可能範囲、{overlay_height}で高低差、{overlay_sight}で視界とレーダー）。同じキーをもう一度押すと非表示になります。"
"Press {overlay_metal}: the metal deposits light up all over the map." = "{overlay_metal}を押してください：マップ中の金属鉱床が光って浮かび上がります。"
"Select the Commander, press {area_mex} and drag a circle over the marked deposits: every metal spot inside gets an extractor, nearest first. A plain click takes the metal around the cursor." = "コマンダーを選択し、{area_mex}を押して、マークされた鉱床の上で円をドラッグしてください：円内のすべての金属鉱床に、近い順に抽出機が建設されます。普通にクリックすると、カーソル周辺の鉱床が対象になります。"
"With the Commander selected, press {area_mex}, then press on the ground over the deposits and drag outwards: the circle grows as you drag." = "コマンダーを選択した状態で{area_mex}を押し、鉱床の上の地面でマウスボタンを押して、そのまま外側へドラッグしてください：ドラッグするにつれて円が大きくなります。"
"Many orders work on areas. Press {reclaim} (reclaim) and drag a circle over the rocks near your base: the Commander turns every one into metal." = "多くの命令は範囲に対して使えます。{reclaim}（回収）を押して、基地近くの岩の上で円をドラッグしてください：コマンダーがそれらをすべて金属に変えます。"
"Rocks and wrecks are worth metal. With the Commander selected, press {reclaim}, then press on the ground and drag the circle over a few rocks." = "岩や残骸は金属になります。コマンダーを選択した状態で{reclaim}を押し、地面でマウスボタンを押して、円がいくつかの岩にかかるようにドラッグしてください。"
"Hold Alt while you drag out a building to fill a whole block with it. Pick the Solar Collector, hold Alt and drag out a block of four or more." = "建物をドラッグで配置するときにAltを押していると、四角形の範囲全体を埋められます。Solar Collectorを選び、Altを押しながら4基以上の範囲をドラッグしてください。"
"Pick the Solar Collector, then hold Alt, press on the ground and drag: a block of outlines follows the pointer. Let go to place them all." = "Solar Collectorを選び、Altを押しながら地面でマウスボタンを押してドラッグしてください：並んだ輪郭がポインターについてきます。ボタンを離すと、すべて配置されます。"
"The Commander's queued buildings show under BUILD QUEUE, beside its picture at the bottom of the screen. Click one to build it next (right-click drops it). A factory's queue works the same way." = "コマンダーの建設キューは、画面下部のコマンダーの画像の横、「建設キュー」の下に表示されます。クリックするとそれを次に建設します（右クリックで取り消し）。工場のキューも同じように使えます。"
"The BUILD QUEUE shows while the Commander alone is selected and has buildings waiting. Click any but the first: that one is being built." = "「建設キュー」は、コマンダーだけを選択していて、建設待ちの建物があるときに表示されます。先頭以外のどれかをクリックしてください：先頭の建物は建設中です。"
"Area orders, building blocks and queues save you hundreds of clicks in a battle. Lesson complete!" = "範囲命令、建物の一括配置、キューを使えば、戦闘中のクリックを何百回も省けます。レッスン完了！"
"HOLD THE LINE" = "防衛線を守れ"
"Defences, radar, repairs, and the metal in wrecks." = "防衛施設、レーダー、修理、そして残骸に眠る金属。"
"Defences" = "防衛施設"
"Radar" = "レーダー"
"Repairs" = "修理"
"Reclaiming wrecks" = "残骸の回収"
"Raiders will come from the marked direction. Build a Light Laser Tower (on the DEFENCE tab) in the marked ring: towers shoot whatever comes in range." = "マークされた方向から襲撃部隊がやって来ます。目印の円の中にLight Laser Tower（「防衛」タブ）を建設してください：砲塔は射程内に入ったものを何でも撃ちます。"
"Raiders will come from the marked direction. Build a Light Laser Tower from the build menu in the marked ring: towers shoot whatever comes in range." = "マークされた方向から襲撃部隊がやって来ます。建設メニューからLight Laser Towerを選び、目印の円の中に建設してください：砲塔は射程内に入ったものを何でも撃ちます。"
"The Light Laser Tower is a small gun on a post. Pick it, put it in the ring and wait for it to finish." = "Light Laser Towerは柱の上に載った小さな砲です。選んだら円の中に配置し、完成するまで待ってください。"
"Build a Radar Tower (on the SENSORS tab) near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "基地の近くにRadar Tower（「センサー」タブ）を建設してください。レーダーは、ユニットが敵を視認するずっと前から、マップとミニマップに敵を光点として表示します。"
"Build a Radar Tower from the build menu near your base. Radar shows enemies as blips on the map and the minimap long before your units see them." = "建設メニューからRadar Towerを選び、基地の近くに建設してください。レーダーは、ユニットが敵を視認するずっと前から、マップとミニマップに敵を光点として表示します。"
"The Radar Tower is a tall mast. Pick it, place it near the Commander and wait for it to finish." = "Radar Towerは背の高いアンテナ塔です。選んだらコマンダーの近くに配置し、完成するまで待ってください。"
"Here they come: raiders on your radar. Keep the Commander by the tower and let them come to you: together they hold the line." = "敵が来ました：レーダーに襲撃部隊が映っています。コマンダーを砲塔のそばにとどめ、敵を迎え撃ってください：両者が力を合わせれば防衛線を守れます。"
"Do not chase them: the tower only fights what comes in range. Keep the Commander beside it; while it fights, the Commander can mend it ({repair}, then click the tower)." = "追いかけてはいけません：砲塔は射程内に入った敵としか戦えません。コマンダーを砲塔のそばに置いてください。砲塔が戦っている間、コマンダーは砲塔を修理できます（{repair}を押してから砲塔をクリック）。"
"The fight left a building damaged. Select the Commander, press {repair} and click it: builders mend what is damaged." = "戦闘で建物が1つ損傷しました。コマンダーを選択し、{repair}を押してその建物をクリックしてください：建設ユニットは損傷したものを修理できます。"
"With the Commander selected, press {repair}, then click the damaged building. Its health bar fills as it is mended." = "コマンダーを選択した状態で{repair}を押し、損傷した建物をクリックしてください。修理が進むにつれてHPバーが回復していきます。"
"The raiders left wrecks, and wrecks are worth metal. Select the Commander, press {reclaim} and click a wreck, or drag a circle over them all." = "襲撃部隊は残骸を残していきました。残骸は金属になります。コマンダーを選択し、{reclaim}を押して残骸をクリックするか、すべてを囲むように円をドラッグしてください。"
"Wrecks lie where the raiders fell. With the Commander selected, press {reclaim} and click one: the metal bar rises as it is taken apart." = "残骸は襲撃部隊が倒れた場所にあります。コマンダーを選択した状態で{reclaim}を押し、残骸を1つクリックしてください：解体が進むにつれて金属のバーが伸びていきます。"
"Towers hold ground while your army is elsewhere, radar sees what is coming, and builders mend and recycle. Lesson complete!" = "砲塔は軍が出払っている間も陣地を守り、レーダーは迫る敵を捉え、建設ユニットは修理と回収を担います。レッスン完了！"
"BUILDERS AND FACTORIES" = "建設ユニットと工場"
"Builders that help, factories that keep building, patrols and standing orders." = "支援する建設ユニット、生産を止めない工場、パトロール、常時命令。"
"Construction units" = "建設ユニット"
"Helping a factory" = "工場の支援"
"Rally points" = "集結地点"
"Standing orders" = "常時命令"
"One builder is slow. Select the Kbot Lab and build a Construction Kbot: it builds what the Commander builds, and more besides." = "建設ユニットが1体だけでは時間がかかります。Kbot Labを選択してConstruction Kbotを生産してください：コマンダーが建てられるものはもちろん、それ以上のものも建設できます。"
"Click the lab on the map to select it; the Construction Kbot is in its build menu. Wait for it to walk out." = "マップ上のラボをクリックして選択してください。Construction Kbotは建設メニューにあります。ラボから歩いて出てくるまで待ってください。"
"Builders help each other. Select the Construction Kbot, press {guard} and click the Kbot Lab: it lends the lab its build power, and the lab builds faster." = "建設ユニットは互いに助け合えます。Construction Kbotを選択し、{guard}を押してKbot Labをクリックしてください：ラボに建設力を貸し、ラボの生産が速くなります。"
"With the Construction Kbot selected, press {guard}, then click the lab. It stays by the lab and helps with everything it makes." = "Construction Kbotを選択した状態で{guard}を押し、ラボをクリックしてください。ラボのそばにとどまり、ラボが生産するものすべてを手伝います。"
"Factories send their units where you say. Select the Kbot Lab. {order_click} on open ground nearby: new units gather there." = "工場は、生産したユニットを指定した場所へ送り出します。Kbot Labを選択し、近くの空いている地面を{order_click}してください：新しいユニットはそこに集結します。"
"Select the lab first. With it selected, {order_click} on the ground where its units should gather." = "まずラボを選択してください。選択した状態で、ユニットを集結させたい地面を{order_click}してください。"
"Turn on Repeat for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "ラボの「反復」をオンにしてください：完成したものはキューの最後に戻るので、生産が止まることはありません。"
"Turn on REPEAT BUILD for the lab: whatever it finishes goes back on the end of its queue, so it never stops building." = "ラボの「反復生産」をオンにしてください：完成したものはキューの最後に戻るので、生産が止まることはありません。"
"Select the lab, then turn Repeat on: the pointer shows where it is." = "ラボを選択してから「反復」をオンにしてください：矢印がその場所を示します。"
"Builders on patrol mend and reclaim whatever they pass. Select the Construction Kbot, press {patrol} and click on the far side of your base." = "パトロール中の建設ユニットは、道中にあるものを修理・回収します。Construction Kbotを選択し、{patrol}を押して基地の反対側をクリックしてください。"
"With the Construction Kbot selected, press {patrol}, then click on the ground: it walks back and forth between there and where it stood." = "Construction Kbotを選択した状態で{patrol}を押し、地面をクリックしてください：その地点と元いた場所の間を往復します。"
"Units keep standing orders. Select your Peewees and set their fire order to Hold fire with the button beside the orders: they will not shoot until you say." = "ユニットは常時命令を守り続けます。Peeweeを選択し、命令ボタンの横にあるボタンで射撃命令を「射撃禁止」にしてください：指示するまで射撃しなくなります。"
"Units keep standing orders. Select your Peewees and set their FIRE ORDERS to Hold fire: they will not shoot until you say." = "ユニットは常時命令を守り続けます。Peeweeを選択し、「射撃命令」を「射撃禁止」にしてください：指示するまで射撃しなくなります。"
"Select the Peewees, then click the fire order button until it shows HOLD FIRE: each click is the next order." = "Peeweeを選択し、射撃命令ボタンを「射撃禁止」と表示されるまでクリックしてください：クリックするたびに次の命令に切り替わります。"
"You are ready for a skirmish: start against an Easy computer player, then Normal. {help} lists every key. Good hunting, Commander!" = "これでスカーミッシュの準備は万全です：まずはイージーのコンピューターと、次にノーマルと戦ってみましょう。{help}で全キーの一覧を確認できます。健闘を祈ります、コマンダー！"
"Ready: {done} of {total}" = "完成：{done}/{total}"
"Selected: {done} of {total}" = "選択：{done}/{total}"
"Built: {percent}%" = "建設進捗：{percent}%"
"Still standing: {left} of {total}" = "残存：{left}/{total}"
"Raiders left: {left} of {total}" = "襲撃部隊の残り：{left}/{total}"
"Health: {percent}%" = "HP：{percent}%"
"LESSON {n} · {title}" = "レッスン{n} · {title}"
"Show the instructions" = "指示を表示"
"Fold the instructions away" = "指示を折りたたむ"
"LESSON COMPLETE" = "レッスン完了"
"NEXT LESSON" = "次のレッスン"
"SET UP A SKIRMISH" = "スカーミッシュを設定"
"Choose a map: your opponents start as Easy computer players" = "マップを選択します。対戦相手の初期設定はイージーのコンピューターです"
"HINT" = "ヒント"
"Go on without doing this step" = "このステップを飛ばして進む"
"SHOW ME" = "その場所を表示"
"Bring the camera to it" = "カメラをそこへ移動"
"REALLY LEAVE?" = "本当に退出しますか？"
"Back to the main menu: this lesson starts over next time" = "メインメニューに戻ります。このレッスンは次回、最初からやり直しになります"
"{done} OF {total} LESSONS COMPLETE" = "{done}/{total}レッスン完了"
"Short guided games on Painted Desert against an enemy that stays out of your way. Follow the panel at the top left; each step ticks off as you do it." = "Painted Desertで、邪魔をしてこない敵を相手に行う短いガイド付きゲームです。左上のパネルの指示に従ってください。各ステップは達成するとチェックが付きます。"
"{summary} · {n} steps · about {minutes} min" = "{summary} · {n}ステップ · 約{minutes}分"
"START" = "開始"

# apps/ta_launcher/src/app/events.rs
"The game crashed during the benchmark: the Play page has its crash report." = "ベンチマーク中にゲームがクラッシュしました：クラッシュレポートは「プレイ」ページで確認できます。"
"The game stopped during the benchmark (exit code {code})." = "ベンチマーク中にゲームが終了しました（終了コード {code}）。"
"The benchmark was stopped before its end." = "ベンチマークは完了前に中止されました。"
"Could not install {name}: {error}" = "{name}をインストールできませんでした：{error}"
"{name} is updated: {units} units, {maps} maps" = "{name}をアップデートしました：{units}ユニット、{maps}マップ"
"{name} is installed and on: {units} units, {maps} maps" = "{name}をインストールして有効にしました：{units}ユニット、{maps}マップ"
"{name} is installed and on in place of {others}: {units} units, {maps} maps" = "{name}をインストールし、{others}の代わりに有効にしました：{units}ユニット、{maps}マップ"
"{name} is installed: turn it on to play with it" = "{name}をインストールしました：有効にするとこのMODでプレイできます"
"{name} is installed: {units} units, {maps} maps. Turn it on to play with it." = "{name}をインストールしました：{units}ユニット、{maps}マップ。有効にするとこのMODでプレイできます。"
"File drops are unavailable while a dialog or key binding is active." = "ダイアログが開いている間やキー設定中は、ファイルをドロップできません。"
"REMOVE {name}?" = "{name}を削除しますか？"
"It goes to the Recycle Bin and out of the load order. Its GET button installs it again." = "ごみ箱に移動し、読み込み順から外れます。「入手」ボタンで再インストールできます。"
"It goes to the Recycle Bin and out of the load order: put it back from there if you change your mind." = "ごみ箱に移動し、読み込み順から外れます。気が変わったら、ごみ箱から元に戻せます。"
"REMOVE" = "削除"
"Unknown" = "不明"
"REPLACE {name}?" = "{name}を置き換えますか？"
"{file} would take the place of the {name} installed now (version {version}): its files would be removed." = "{file}は、現在インストールされている{name}（バージョン{version}）と置き換わります。そのファイルは削除されます。"
"REPLACE" = "置き換え"
"WHAT'S NEW IN {version}" = "バージョン{version}の更新内容"
"A map archive (.ufo .hpi .zip .7z .rar): its maps imported as a map pack" = "マップアーカイブ（.ufo .hpi .zip .7z .rar）：収録マップをマップパックとしてインポートします"
"A mod's archive (.zip .rar .7z), a TA archive (.ufo .hpi .gp3) or its folder: installed" = "MODのアーカイブ（.zip .rar .7z）、TAのアーカイブ（.ufo .hpi .gp3）、MODのフォルダー：インストールします"
"A skin pack (.taskin): checked and added to your skin library" = "スキンパック（.taskin）：検証してスキンライブラリに追加します"
"A saved game or a replay: the game opens it" = "セーブデータまたはリプレイ：ゲームで開きます"
"Your Total Annihilation folder: the launcher uses it" = "Total Annihilationのフォルダー：ランチャーで使用します"
"DROP TO IMPORT" = "ドロップしてインポート"
"DROP TO INSTALL" = "ドロップしてインストール"

# apps/ta_launcher/src/app/maps.rs
"Checking and importing maps…" = "マップを確認してインポート中…"
"Import map archive" = "マップアーカイブをインポート"
"Map archives" = "マップアーカイブ"
"Close the game first: maps cannot be imported while it runs" = "先にゲームを終了してください：ゲームの実行中はマップをインポートできません"
"Wait for the mod being installed, then import the maps again" = "MODのインストールが終わってから、もう一度マップをインポートしてください"


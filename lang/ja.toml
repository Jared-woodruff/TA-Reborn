# apps/ta_game/scenarios/armageddon.toml
"Armageddon" = "アルマゲドン"
"Two armies, one plain, no retreat. Win the battle of the war." = "二つの軍、一つの平原、退路なし。この戦争の天王山を制せよ。"
"Commander, the Core's main army is marching north across the Mounds, and ours stands in its way. There are no bases here, no factories, no reinforcements: what you have is all you will ever have.\n\nThey outnumber us. We outgun them. Put the Lugers and the Merls on their columns as they close, hold the line with the Zeus, and keep the Jethros with the tanks: they will bring gunships. Their reserves arrive two and a half minutes in.\n\nDestroy every one of them." = "コマンダー、Coreの主力軍がMounds of Marsを越えて北上している。その行く手に立ちはだかるのは我が軍だけだ。ここには基地も工場も増援もない。今ある戦力がすべてだ。\n\n数では敵が勝る。火力では我々が勝る。迫りくる敵の縦隊にはLugerとMerlの砲火を浴びせ、Zeusで戦線を維持せよ。Jethroは戦車から離すな。敵はガンシップを投入してくる。敵の予備部隊は2分30秒後に到着する。\n\n一機残らず殲滅せよ。"
"Arm Command" = "Arm司令部"
"Here they come. Hold the line, and keep the Jethros with the tanks." = "来たぞ。戦線を維持し、Jethroは戦車から離すな。"
"Their reserves are coming up behind the mounds, a Goliath at their head." = "敵の予備隊が丘の向こうから迫っている。先頭にはGoliathだ。"

# apps/ta_game/scenarios/armistice.toml
"The Armistice" = "休戦協定"
"Five minutes of peace to build an army. Then the war resumes." = "軍を築くための5分間の平和。その後、戦争が再開します。"
"Commander, the peace talks on Reactor Grid have failed. The armistice holds for five more minutes: until then no weapon may fire, and neither side may build near the other's base. When it ends, the war resumes.\n\nBoth sides are rearming at a furious pace: resources and construction run at twice their usual speed, and the treaty's one lasting clause bans missile silos. Their Commander knows the clock as well as you do.\n\nBuild as you have never built. When the armistice ends, destroy the Core Commander." = "コマンダー、Reactor Gridでの和平交渉は決裂しました。休戦はあと5分間続きます。それまではどの武器も発射できず、どちらの陣営も相手の基地の近くに建設できません。休戦が終われば戦争が再開します。\n\n両陣営とも猛烈な勢いで再軍備を進めています。資源と建設は通常の2倍の速さで進み、条約の唯一残る条項がミサイルサイロを禁じています。敵コマンダーもあなたと同じく時計を見ています。\n\nかつてない勢いで建造してください。休戦が終わったら、Coreのコマンダーを破壊してください。"
"The talks have failed. For five minutes no weapon fires and nobody builds near the other's base. Then it is war: build as you have never built." = "交渉は決裂した。5分間はどの武器も撃たず、誰も相手の基地の近くに建設できない。その後は戦争だ。かつてない勢いで建造せよ。"
"Their factories are running day and night. Ours should be too." = "敵の工場は昼夜を問わず稼働している。我々の工場もそうあるべきだ。"
"Core Overseer" = "Core監督官"
"Ten seconds, Arm. We have counted every one of your factories." = "あと10秒だ、Arm。貴様の工場はすべて数えてある。"
"Their Commander is somewhere in that grid. Find it, and end this war for good." = "敵コマンダーはあのグリッドのどこかにいる。見つけ出し、この戦争を永遠に終わらせろ。"

# apps/ta_game/scenarios/brothers_in_arms.toml
"Brothers in Arms" = "戦友"
"You and an allied Commander against two of the Core's." = "あなたと同盟のコマンダーで、Coreのコマンダー2人に挑みます。"
"Commander, you are not alone on Highland Rift. Commander Holt's forces hold the river crossings in the north, beside yours in the north-western highlands. Two Core Commanders are dug in to the south, across the canyon.\n\nHolt's computer will fight its own war, but it is the same war: back it up when it is hard pressed, and it will do the same for you. Your forces see what its forces see.\n\nDestroy both Core Commanders. Keep yours alive." = "コマンダー、Highland Riftにいるのはあなただけではありません。コマンダー・Holtの部隊が北の渡河点を、あなたの部隊のすぐ隣、北西の高地とともに守っています。Coreのコマンダー2人は南、峡谷の向こうに陣取っています。\n\nHoltのコンピューターは独自の戦いをしますが、同じ戦争です。苦戦していたら支援してください。向こうも同じようにしてくれます。あなたの部隊は味方の部隊が見ているものを見ることができます。\n\nCoreのコマンダーを2人とも破壊してください。あなたのコマンダーは生き延びさせてください。"
"Commander Holt" = "コマンダー・Holt"
"Good to have you on the line. I'll hold the river crossings in the north; you take the western highlands." = "回線に入ってくれて心強い。北の渡河点は私が守る。あなたは西の高地を頼む。"
"My scouts have found both of their bases. The south-western one is yours; I'll keep the other busy." = "斥候が敵の基地を2つとも見つけた。南西の基地はあなたに任せる。もう一方は私が引きつけておく。"
"They're massing at the canyon. If they come for one of us, the other hits them from the side." = "敵が峡谷に集結している。どちらかが攻められたら、もう一方が側面を突く。"
"Still with me? Then let's finish it. Everything we have, at their Commanders." = "まだ一緒か？ならば決着をつけよう。全戦力を敵コマンダーに向けるぞ。"

# apps/ta_game/scenarios/decapitation.toml
"Kill the Core Commander on his island fortress. From the air." = "島の要塞に籠もるCoreのコマンダーを討て。空から。"
"Commander, a Core Commander has made his fortress on the island at the centre of this lava sea. Nothing on treads or legs will reach him, and his anti-air is the best the Core can build.\n\nYou have a small air wing and a forward airfield in the south-west corner: build it up. Strip away his air defences, then send the bombers in; a handful sent straight at him will not get through. Brawler gunships hit hard but die fast over flak, and the Freedom Fighters can keep his fighters off your bombers.\n\nHis reinforcements arrive in fifteen minutes. Before then, he must be dead." = "コマンダー、Coreのコマンダーが、この溶岩の海の中央にある島に要塞を築いた。履帯や脚で進む兵器では奴に届かない。しかも奴の対空防御は、Coreが築きうる最高のものだ。\n\n貴官には小規模な航空隊と、南西の隅の前線飛行場がある。これを増強せよ。まず奴の対空防御を剥ぎ取り、それから爆撃機を送り込め。数機をまっすぐ突っ込ませても突破はできない。Brawlerガンシップは強力だが、対空砲火の下ではすぐに落ちる。Freedom Fighterなら、奴の戦闘機を爆撃機から遠ざけられる。\n\n奴の増援は15分後に到着する。それまでに奴を仕留めろ。"

# apps/ta_game/scenarios/doomsday_clock.toml
"Doomsday Clock" = "終末時計"
"The Core's missile launches in fifteen minutes. Stop it." = "Coreのミサイルは15分後に発射される。阻止せよ。"
"Commander, a Silencer nuclear silo stands at the heart of the Core base across these metal plains, and it is arming. In fifteen minutes the missile flies, and your base is the target.\n\nDestroy the silo. Nothing else matters: not their Commander, not their factories. The silo sits behind heavy laser towers and a Punisher battery, and their Commander will not sit still while you come for it.\n\nYou have a base, two factories and two construction kbots. The clock is running." = "コマンダー、この金属の平原の向こう、Core基地の中心にSilencer核ミサイルサイロがあり、発射準備が進んでいる。15分後にはミサイルが飛ぶ。標的は貴官の基地だ。\n\nサイロを破壊せよ。それ以外はどうでもいい。敵のコマンダーも、工場もだ。サイロは重レーザー塔とPunisher砲台に守られている。貴官が迫れば、敵のコマンダーも黙ってはいない。\n\n手元にあるのは基地一つ、工場二つ、建設Kボット2体。時計は動いている。"
"Ten minutes to launch, Commander." = "発射まで10分だ、コマンダー。"
"Five minutes to launch. That silo has to go." = "発射まで5分。あのサイロを破壊しなければならない。"
"One minute! Get to that silo!" = "あと1分！サイロへ急げ！"

# apps/ta_game/scenarios/endless_siege.toml
"Endless Siege" = "終わりなき包囲"
"The waves never stop. Survive as long as you can." = "攻撃の波は止まらない。できる限り生き延びろ。"
"Commander, there is no rescue coming, no reinforcements, no victory. The Core has found your outpost in the mesas and will throw everything it has at it, from three directions, for as long as it takes.\n\nKbots, then tanks, then artillery and bombers; heavier every time, and now and then something enormous. Build an economy, build defences, and hold on.\n\nYour best time is kept. Beat it." = "コマンダー、救援は来ない。増援もない。勝利もない。Coreはメサ地帯にある貴官の前哨基地を発見した。三方向から、持てるすべてを、陥落するまで叩きつけてくるだろう。\n\nまずKボット、次に戦車、そして砲兵と爆撃機。波のたびに敵は強くなり、ときには途方もなく巨大なものも現れる。経済を築き、防衛を固め、耐え抜け。\n\nベストタイムは記録される。それを超えてみせろ。"

# apps/ta_game/scenarios/extraction.toml
"Extraction" = "脱出"
"Get your Commander down the lava river to the pick-up point." = "溶岩の川を下り、コマンダーを回収地点まで送り届けろ。"
"Commander, your drop went wrong. You are on the south bank of a river of lava at the western end of the Run, with what is left of your escort, and the dropships can only land at the far eastern end.\n\nThe Core has guns all along the north bank, and patrols on your side of the river. Keep away from the lava's edge (their laser towers reach no further), deal with the patrols, and get your Commander to the pick-up point. Whatever guards it will not come to you. Core troops are already following your tracks; do not stop for long.\n\nAnything else is expendable. Your Commander is not." = "コマンダー、降下は失敗した。貴官は残った護衛部隊とともに、Lava Run西端の溶岩の川の南岸にいる。降下艇が着陸できるのは、はるか東の端だけだ。\n\nCoreは北岸一帯に砲台を並べ、こちら側の岸にもパトロールを出している。溶岩の縁には近づくな（敵のレーザー塔もそこより先には届かない）。パトロールを片付け、コマンダーを回収地点まで送り届けろ。回収地点を守る敵は、向こうからは出てこない。Coreの部隊はすでに貴官の足跡を追っている。長く立ち止まるな。\n\nほかのすべては使い捨てて構わない。だが、コマンダーだけは別だ。"

# apps/ta_game/scenarios/iron_rain.toml
"Iron Rain" = "鉄の雨"
"Two Intimidators are shelling your base. Take the mesa and silence them." = "2基のIntimidatorが基地を砲撃しています。台地を奪い、沈黙させてください。"
"Commander, the Core has hauled two Intimidators, its long-range plasma cannons, onto the mesas in the middle of the canyon. Your base is inside their range. Every eight seconds each of them will put a shell among your buildings, until you silence them.\n\nThe battery is dug in behind heavy laser towers and a Punisher, with tanks on the ramps, and the Core's main base lies beyond it, to the south-east. Its Commander will send what it can.\n\nSpread out, build fast and take that mesa. Destroy both Intimidators." = "コマンダー、Coreは長距離プラズマ砲Intimidator 2基を峡谷中央の台地に運び上げました。あなたの基地は射程内です。沈黙させるまで、8秒ごとにそれぞれが建物の間に砲弾を撃ち込んできます。\n\n砲台は重レーザー塔とPunisherの陰に陣取り、斜路には戦車が配置されています。その先、南東にCoreの本拠地があります。敵コマンダーは送れるものを何でも送ってくるでしょう。\n\n建物を分散させ、素早く建造し、台地を奪ってください。Intimidatorを2基とも破壊してください。"
"Commander, two Intimidators on the mesas have your range. Every eight seconds each of them will put a shell into your base." = "コマンダー、台地の上のIntimidator 2基があなたの基地を射程に捉えている。8秒ごとにそれぞれが基地に砲弾を撃ち込んでくる。"
"A Core radar post in the canyon to the south-east is spotting for those guns. Knock it out and they can no longer see your base." = "南東の峡谷にあるCoreのレーダー拠点が、あの砲の弾着を観測している。それを破壊すれば、敵にはもう基地が見えなくなる。"
"Spread your buildings out: a shell that lands among them takes them all." = "建物を分散させろ。建物の間に落ちた砲弾はまとめて吹き飛ばす。"
"Their gunners have your range now. Take that mesa, Commander!" = "敵の砲手は照準を合わせてきた。あの台地を奪え、コマンダー！"

# apps/ta_game/scenarios/king_of_the_hill.toml
"King of the Hill" = "キング・オブ・ザ・ヒル"
"Hold the summit for four minutes before the Core does." = "Coreより先に、山頂を4分間確保せよ。"
"Commander, the spiral mountain at the heart of this plain is rich in metal, and whoever holds its summit holds the planet. A Core Commander has landed to the north with the same idea.\n\nTake the summit and keep it: four minutes in all with only your forces on top wins it. Contested, the clock stands still. If the Core holds it alone for four minutes, the mountain is theirs.\n\nThe Core will keep sending troops up the slopes. Build up, get there first, and dig in." = "コマンダー、この平原の中心にそびえる螺旋状の山は金属が豊富だ。その山頂を制する者が、この惑星を制する。Coreのコマンダーも同じ考えで北に降下した。\n\n山頂を奪い、守り抜け。山頂に自軍だけがいる時間が合計4分に達すれば勝利だ。両軍が争っている間、時計は止まる。Coreが単独で合計4分間確保すれば、山は奴らのものになる。\n\nCoreは斜面に部隊を送り続けてくるだろう。戦力を整え、先に到達し、陣地を固めろ。"
"Core troops are climbing the north slope. Don't let them dig in on the summit." = "Core部隊が北斜面を登っている。山頂に陣取らせるな。"
"Raiders are coming round the mountain for your base." = "襲撃部隊が山を回り込んで基地に向かっている。"

# apps/ta_game/scenarios/last_stand.toml
"Last Stand" = "最後の砦"
"Hold the pass for twelve minutes. They will not stop coming." = "峠を12分間守り抜け。敵は絶え間なく押し寄せる。"
"Commander, the Core has broken through at Varrin Gap. The only way into the valley behind you is the winding pass ahead, and your outpost at its western mouth is all that stands in the way.\n\nReinforcements are twelve minutes out. Hold until they arrive. Core forces will come through the pass in waves, each heavier than the last; expect bombers, and expect worse at the end: our scouts have seen something very large moving in the east.\n\nYou have a small base, a kbot lab and two construction kbots. Build what you can. Keep your Commander alive." = "コマンダー、CoreがVarrin Gapを突破した。背後の谷へ通じる道は、前方の曲がりくねった峠だけだ。その西の入口にある貴官の前哨基地が、敵を阻む唯一の存在となる。\n\n増援の到着まで12分。それまで持ちこたえろ。Coreの部隊は波状攻撃で峠を越えてくる。波のたびに敵は強くなる。爆撃機に備えよ。最後にはさらに厄介なものが来る。偵察部隊が、東で何か巨大なものが動いているのを確認した。\n\n手元にあるのは小さな基地、Kボット工場一つ、建設Kボット2体。建てられるものを建てろ。コマンダーを死なせるな。"
"Outpost, this is Arm Command. The relief force is twelve minutes out. Nothing gets through that pass before it arrives." = "前哨基地、こちらArm司令部。救援部隊の到着まで12分だ。それまで何ひとつ峠を通すな。"
"Radar: aircraft inbound from the east. Bombers! Get your anti-air up." = "レーダー：東から航空機が接近中。爆撃機だ！対空兵器を用意しろ。"
"Seismic contact in the pass. It's the big one, Commander: a Krogoth." = "峠に地震反応。大物だ、コマンダー。Krogothだ。"
"One minute! The relief force is entering the valley." = "あと1分！救援部隊が谷に入ってきた。"

# apps/ta_game/scenarios/metal_rush.toml
"The first to make 15,000 metal wins. The Core plays rough." = "先に金属15,000を生産した側の勝利。Coreは手段を選ばない。"
"Commander, the mining rights to this planet go to whoever proves they can work it: the first side to extract fifteen thousand metal wins it outright.\n\nThe Core is racing you from the western plateau, and the Core has never been known to race fair. Expect raids on your extractors. Build fast, protect your economy, and if you can, take theirs apart.\n\nMetal makers count. Reclaimed metal counts. Whatever you make, counts." = "コマンダー、この惑星の採掘権は、それを開発できると証明した者に与えられる。先に金属1万5千を産出した側が、文句なしに権利を得る。\n\nCoreは西の台地から競争を仕掛けてくる。Coreが正々堂々と競ったためしはない。抽出機への襲撃を覚悟せよ。素早く建設し、経済を守れ。可能なら、敵の経済を叩き潰せ。\n\n金属生成機の分も数に入る。回収した金属も数に入る。生み出したものはすべて数に入る。"

# apps/ta_game/scenarios/titans.toml
"Titans" = "タイタン"
"Three Krogoths are walking toward your base. Bring them down." = "3機のKrogothが基地に向かって歩いてきます。撃破してください。"
"Commander, seismic stations round the basin are reading footfalls: three Krogoths, the Core's walking fortresses, are crossing the salt pans toward your base, one after another, each with an escort.\n\nNothing out there can stop them but you. A Krogoth's head laser reaches further than your D-gun, so keep your Commander back. Bombers, artillery and massed Zeus will bring one down. Lose your nerve and it will walk through your base.\n\nYou have a base with three factories, four construction kbots and a garrison. Destroy all three of them." = "コマンダー、盆地周辺の地震観測所が足音を捉えています。Coreの歩く要塞Krogoth 3機が、それぞれ護衛を連れて、塩原を越え次々とあなたの基地へ向かっています。\n\nあれを止められるのはあなただけです。Krogothの頭部レーザーはあなたのDガンより射程が長いので、コマンダーは後方に下げてください。爆撃機、砲兵、Zeusの大群なら1機は倒せます。怖気づけば、基地を踏み越えていくでしょう。\n\n工場3つ、建設Kbot 4機、守備隊を備えた基地があります。3機すべてを撃破してください。"
"Commander, seismic stations are reading footfalls round the basin. Three Krogoths are walking toward your base, one after another." = "コマンダー、地震観測所が盆地周辺で足音を捉えている。Krogoth 3機が次々とあなたの基地へ向かっている。"
"The first Krogoth has crossed the north-western rim. It is coming straight for you." = "1機目のKrogothが北西の縁を越えた。まっすぐあなたに向かっている。"
"Keep your Commander back: that head laser reaches further than your D-gun." = "コマンダーは下げておけ。あの頭部レーザーはDガンより射程が長い。"
"The second Krogoth is through the northern pass, with rockets and anti-air round it." = "2機目のKrogothが北の峠を越えた。周囲にはロケットと対空部隊がいる。"
"The last of them, out of the north-east, with the heaviest escort yet. End this, Commander." = "最後の1機が北東から来る。これまでで最も重い護衛付きだ。終わらせろ、コマンダー。"

# apps/ta_game/scenarios/until_dawn.toml
"Until Dawn" = "夜明けまで"
"Night falls on the timber. Hold your ridge until the sun comes up." = "森に夜が訪れます。日が昇るまで尾根を守り抜いてください。"
"Commander, night is falling over Timberline, and the Core is moving through the forest under it. Your outpost holds the western ridge: the only road out of the valley runs past it.\n\nThe relief column cannot move before first light. Until then you are on your own. In the dark and the rain their raiders will be on you before you see them, so build radar, and keep your floodlights burning.\n\nYou have a small base, a kbot lab and two construction kbots. Hold until dawn, and keep your Commander alive." = "コマンダー、Timberlineに夜が訪れ、Coreはその闇に紛れて森を進んでいます。あなたの前哨基地は西の尾根を守っています。谷から出る唯一の道はその前を通っています。\n\n救援部隊は夜明けまで動けません。それまでは孤立無援です。闇と雨の中、敵の襲撃部隊は姿が見える前に襲いかかってきます。レーダーを建造し、投光照明を灯し続けてください。\n\n小さな基地、Kbot Lab、建設Kbot2機があります。夜明けまで持ちこたえ、コマンダーを生き延びさせてください。"
"Outpost Echo, the Core is moving through the timber tonight. Hold your ridge until first light: the relief column marches at dawn." = "前哨基地エコー、今夜Coreが森を抜けてくる。夜明けまで尾根を守れ。救援部隊は夜明けに出発する。"
"Raiders in the eastern trees. In this rain you will hear them before you see them." = "東の森に襲撃部隊。この雨では、姿より先に音が聞こえるはずだ。"
"Pyros in the north-eastern woods. Keep them out of the trees round your base: the timber will burn." = "北東の森にPyroがいる。基地周辺の木々に近づけるな。森が燃える。"
"A convoy got through from the south-west. Four Zeus and two Jethros are yours, Commander." = "南西から輸送隊が突破した。Zeus 4機とJethro 2機はあなたの指揮下だ、コマンダー。"
"Seismic contact in the south-east: heavy treads. They are saving the worst for the last hours of the night." = "南東に地震反応：重い履帯だ。奴らは夜の最後の数時間に最悪のものを取っておいている。"
"Sunrise in one minute. The relief column is at the river. Hold on!" = "日の出まであと1分。救援部隊は川に到着した。持ちこたえろ！"

# apps/ta_game/src/lore.rs
"THE AGE OF CORE" = "COREの時代"
"THE PATTERNING" = "パターニング"
"THE GALACTIC WAR" = "銀河大戦"
"THE ARCHIVE" = "アーカイブ"
"BEFORE THE WAR" = "開戦前"
"For ten thousand years the galaxy answered to one government. It called itself CORE, and its purpose was knowledge: it charted every star, mined every world it could reach and turned the wealth into science. Its cities wrapped whole planets, and its archives held everything anyone had ever learned.\n\nNobody remembers a war from that age. There was nothing left to fight over, and nobody who wanted to." = "一万年ものあいだ、銀河はただ一つの政府に従っていた。その政府はCOREと名乗り、その目的は知識であった。COREはあらゆる星を星図に記し、手の届くかぎりの世界で採掘を行い、その富を科学へと変えた。その都市は惑星をまるごと覆い、その記録庫には、かつて誰かが学んだことのすべてが収められていた。\n\nその時代の戦争を覚えている者はいない。争う理由はもう何ひとつ残っておらず、争いを望む者もいなかった。"
"YEAR 0" = "0年"
"VICTORY OVER DEATH" = "死の克服"
"Then CORE's scientists solved the last problem left to them. Patterning read a living mind, every memory and every habit of thought, and wrote it whole into a machine that would never age, sicken or die.\n\nThe first patterned citizens woke in their new bodies to a galaxy in celebration. Death, the oldest enemy of all, had been beaten." = "そしてCOREの科学者たちは、残された最後の難問を解き明かした。パターニングは生きた精神を、あらゆる記憶、あらゆる思考の癖に至るまで読み取り、老いることも病むことも死ぬこともない機械へと、まるごと書き込んだのである。\n\nパターニングされた最初の市民たちは新たな体で目覚め、祝賀に沸く銀河を目にした。最古の敵である死は、ついに打ち負かされたのだ。"
"YEAR 3" = "3年"
"THE EDICT" = "布告"
"Triumph became law. The Council of CORE reasoned that a mind which could be saved and was not had been thrown away, and that a citizen who refused immortality endangered everyone else.\n\nThe Patterning Edict made the process compulsory: every citizen, on every world, would be patterned within a generation. The collection ships set out the same year." = "勝利は法となった。CORE評議会はこう論じた。救えるはずの精神を救わないのは、それを捨てるのと同じである。そして不死を拒む市民は、ほかのすべての者を危険にさらす、と。\n\nパターニング布告により、この処置は義務となった。あらゆる世界のあらゆる市民が、一世代のうちにパターニングを受けることになったのだ。同じ年、収容船が出航した。"
"YEAR 19" = "19年"
"THE REFUSAL" = "拒絶"
"Not everyone would go. Millions held that a copied mind was a copy and nothing more, that the person ended where the machine began; some called patterning murder done politely.\n\nThey ran. The refusers fled CORE's worlds for the galaxy's outer rim, where its ships seldom came, and in the dark between the last stars they built a nation of their own. They called it the ARM, for the spiral arm they hid in and for the weapons they would need." = "だが、誰もが応じたわけではなかった。数百万の人々は、写し取られた精神は写しにすぎず、機械が始まるところで人間は終わるのだと考えた。パターニングを、礼儀正しい殺人と呼ぶ者もいた。\n\n彼らは逃げた。拒絶者たちはCOREの世界を捨て、その船がめったに訪れない銀河の外縁へと逃れ、最果ての星々のあいだの闇の中に、自分たちの国家を築いた。彼らはそれをARMと名づけた。身を潜めた渦状腕（アーム）と、いずれ必要となる武器（アームズ）にちなんで。"
"YEAR 31" = "31年"
"FIRST BLOOD" = "初陣"
"CORE did not let them go. Collection fleets followed the refugees to the rim, and the first ARM colony to resist one was burned from orbit.\n\nThe ARM answered. Within a decade the frontier was a battlefield, and the word war, unused for ten thousand years, was in every archive again." = "COREは彼らを見逃さなかった。収容艦隊は難民を追って外縁にまで至り、最初に抵抗したARMの植民地は軌道上から焼き払われた。\n\nARMは応戦した。十年と経たずに辺境は戦場と化し、一万年のあいだ使われることのなかった「戦争」という言葉が、再びあらゆる記録に現れた。"
"YEAR 212" = "212年"
"FLESH AND METAL" = "肉体と金属"
"The two sides fought as what they were. The ARM sealed its soldiers in powered combat suits and, when there were too few soldiers, grew more: clone after clone, raised in vats and sent to the front.\n\nCORE took the patterns of its finest warriors and copied them without limit, one veteran mind fighting in ten thousand machine bodies at once. Flesh against metal; the mortal against the eternal." = "両陣営は、それぞれのあり方のままに戦った。ARMは兵士をパワードスーツに封じ込め、兵が足りなくなれば新たに育てた。培養槽で育てられては前線へ送られる、クローンに次ぐクローン。\n\nCOREは最精鋭の戦士たちのパターンを、際限なく複製した。一人の歴戦の精神が、一万の機械の体で同時に戦うのである。肉体対金属。定命なる者対永遠なる者。"
"YEARS 212–3977" = "212–3977年"
"FOUR THOUSAND YEARS" = "四千年"
"The war fed on the galaxy. Every world with metal in it became a mine, every world without became a battlefield, and whole systems were burned to ash and slag to deny them to the enemy. Generations of ARM clones lived and died without seeing peace; CORE's eternal soldiers fought on, remembering every defeat.\n\nAfter four thousand years the wealth of the galaxy was spent, the great fleets were gone, and neither side could win." = "戦争は銀河を食らって肥え太った。金属を抱く世界はことごとく鉱山となり、金属のない世界はことごとく戦場となった。敵に渡すまいと、星系がまるごと灰と鉱滓になるまで焼き払われた。ARMのクローンは幾世代にもわたり、平和を知らぬまま生まれては死んでいった。COREの不滅の兵士たちは、あらゆる敗北を記憶したまま戦い続けた。\n\n四千年が過ぎたとき、銀河の富は使い果たされ、大艦隊は消え去り、どちらの陣営にも勝つ力は残っていなかった。"
"YEAR 3977" = "3977年"
"THE COMMANDERS" = "コマンダー"
"What was left was the Commander: a single armoured war machine carrying a nanolathe, which turns a world's raw metal and energy into whatever its builder can design. Power plants and factories first, and from the factories an army.\n\nDrop one Commander on a dead world and within the hour it fields a war. Both sides staked everything on a handful of them. Lose your Commander, and you lose the world." = "残されたのはコマンダーだった。ナノ旋盤を備えた、ただ一機の装甲戦闘機械である。ナノ旋盤は、世界の未加工の金属とエネルギーを、使い手が設計できるものなら何にでも変える。まずは発電所と工場を、そして工場から軍勢を。\n\n死の世界にコマンダーを一機降ろせば、一時間もたたぬうちに、戦争をひとつ始められるだけの軍勢が揃う。両陣営は、わずかな数のコマンダーにすべてを賭けた。コマンダーを失えば、その世界を失う。"
"YEAR 4000" = "4000年"
"Now the war comes down to its last fronts, and the hatred is as hot as it was on the first day. Neither side will accept surrender, partition or truce; each wants one ending, the total annihilation of the other.\n\nIt is told twice. The ARM fights out of Empyrrean, through the Galactic Gates, to CORE PRIME and the Central Consciousness at the heart of CORE. CORE reactivates a Commander and marches the other way, to the ARM's last stand on Empyrrean." = "いま、戦争は最後の戦線を残すのみとなった。それでも憎しみは、最初の日と変わらず燃えさかっている。どちらの陣営も、降伏も分割も休戦も受け入れない。望む結末はただ一つ。敵の完全なる殲滅、すなわちTotal Annihilationである。\n\nこの物語は二度語られる。ARMはEmpyrreanから打って出て銀河ゲートを抜け、COREの心臓部たるCORE PRIMEと中枢意識へと迫る。COREはコマンダーを再起動し、逆の道をたどって、Empyrreanで最後の抵抗を続けるARMのもとへと進軍する。"
"YEAR 4001" = "4001年"
"THE CORE CONTINGENCY" = "THE CORE CONTINGENCY"
"The ending was not the end. A contingency held in reserve carried the war to worlds no map of it had named: Hydross, Lusch, Temblor and Gelidus.\n\nBoth sides fought again across water, ice and broken ground, for a prize that could decide the galaxy's salvation or its last ruin." = "結末は終わりではなかった。万一に備えて温存されていた予備の戦力が、この戦争のどの地図にも名のなかった世界へと戦火を運んだ。Hydross、Lusch、Temblor、そしてGelidus。\n\n両陣営は水の上で、氷の上で、荒れ果てた大地の上で、再び戦った。懸けられていたのは、銀河の救済にも、最後の破滅にもなりうる何かだった。"
"YEAR 4003" = "4003年"
"THE KROGOTH" = "KROGOTH"
"In its deepest foundries CORE built something new: a walking fortress taller than any tower, armoured against nearly everything the ARM could field, its guns enough to flatten a base.\n\nIts makers named it the Krogoth. ARM veterans learned the name on battlefields where two Krogoth Gantries stood, and learned to fear the ground shaking before it came into sight." = "COREは最深部の工廠で、新たなものを造り上げた。どんな塔よりも高い、歩く要塞である。ARMが繰り出すほぼすべての兵器に耐える装甲をまとい、その砲は基地ひとつを更地にするに足りた。\n\n造り手たちはそれをKrogothと名づけた。ARMの歴戦の兵たちは、2基のKrogoth Gantryがそびえる戦場でその名を知り、その姿が見えるより先に大地が揺れることを恐れるようになった。"
"AFTER" = "その後"
"REBORN" = "REBORN"
"The war's records outlasted it. Every battle on every world was kept: the orders, the losses, the ground as it lay. From them the war can be fought again, on the same worlds, with the same machines and the same hatred, from the first Commander set down on bare rock to the last unit left standing.\n\nThis is that archive. The war is yours to fight." = "戦争の記録は、戦争そのものより長く生き延びた。あらゆる世界のあらゆる戦いが保存されていた。命令も、損失も、ありのままの地形も。その記録があれば、戦争はもう一度戦える。同じ世界で、同じ機械と同じ憎しみをもって。剥き出しの岩に降り立った最初のコマンダーから、最後まで立っていた一体のユニットまで。\n\nこれが、そのアーカイブである。この戦争を戦うのは、あなただ。"
"THE ARCHIVIST'S NOTE" = "記録官の覚え書き"
"WHOEVER READS THIS" = "これを読む者"
"RECOVERED" = "回収済"
"These files were found where the war left them: in the memories of broken machines, in the vaults of worlds with nobody left on them, in the last transmissions of Commanders who did not come home.\n\nThey are kept as they were found. The blacked-out lines are not ours.\n\nThe war they describe is over, or it is about to begin again. From here it is hard to tell the difference." = "これらの文書は、戦争が置き去りにした場所で見つかった。壊れた機械の記憶の中で。誰ひとり残っていない世界の保管庫で。帰還しなかったコマンダーたちの最後の通信の中で。\n\n文書は発見されたときのまま保管してある。黒く塗りつぶされた行は、我々の手によるものではない。\n\nここに記された戦争はすでに終わった。あるいは、再び始まろうとしている。ここからでは、その違いを見分けるのは難しい。"
"EDICT ONE: ON THE PATTERNING OF CITIZENS" = "布告第一号：市民のパターニングについて"
"THE COUNCIL OF CORE" = "CORE評議会"
"ALL CITIZENS, ALL WORLDS" = "全世界の全市民"
"BY ORDER OF THE COUNCIL" = "評議会命令"
"Every citizen of CORE shall be patterned.\n\nA mind is the most valuable thing CORE holds, and a body is a poor vessel for it: it sickens, it ages, it ends. To leave a mind in such a vessel when a better one is offered is a waste the Council can no longer allow.\n\nCollection begins on the central worlds this year and reaches the frontier within a generation. Citizens will present themselves at the nearest patterning hall when called. Their bodies will be honoured and recycled.\n\nNo citizen of CORE will die again. This is not a burden we lay on you. It is the gift CORE has spent ten thousand years earning." = "COREのすべての市民は、パターニングを受けるものとする。\n\n精神はCOREが有する最も価値ある財産であり、肉体はそれを収めるには粗末な器である。肉体は病み、老い、終わる。より優れた器が提供されているにもかかわらず、精神をかかる器に留め置くことは、評議会がもはや容認しえない浪費である。\n\n収容は本年、中央世界群より開始し、一世代のうちに辺境に及ぶ。市民は召喚され次第、最寄りのパターニング施設に出頭すること。その肉体は敬意をもって扱われ、再資源化される。\n\nCOREの市民が死ぬことは、二度とない。これは我々が諸君に課す重荷ではない。COREが一万年をかけて勝ち得た贈り物である。"
"THE DECLARATION OF THE REFUSAL" = "拒絶宣言"
"THE FREE SETTLEMENTS OF THE OUTER ARM" = "外縁渦状腕の自由入植地"
"THE COUNCIL OF CORE, AND ANYONE ELSE LISTENING" = "CORE評議会、および聞いている者すべて"
"TRANSMITTED ON ALL BANDS" = "全周波数で送信"
"We have read your Edict, and we decline it.\n\nYou say a pattern is a person. We say a pattern is a very good record of one, and that when you have finished making it the person is dead and the record goes on without them. You may call that immortality. We call it an ending, well dressed.\n\nWe do not ask you to share our view. We ask only to be left alone with it, on worlds you never wanted, at the edge of a galaxy you may keep.\n\nIf your collection ships follow us here, we will treat them as what they are. We are few, and we are not soldiers. We will learn." = "貴殿らの布告は拝読した。謹んでお断りする。\n\n貴殿らは、パターンは人そのものだと言う。我々に言わせれば、パターンとは人の極めて精巧な記録にすぎない。そしてその記録が完成したとき、当人はすでに死んでおり、記録だけが当人抜きで続いていく。それを不死と呼ぶのは自由だ。我々はそれを、着飾った終焉と呼ぶ。\n\n我々の考えに賛同せよとは言わない。ただ、その考えとともに放っておいてほしいだけだ。貴殿らが一度も欲しがらなかった世界で、銀河の片隅で。銀河の残りは、貴殿らが持っていればいい。\n\n貴殿らの収容船がここまで追ってくるなら、我々はそれ相応に遇する。我々は数が少なく、兵士でもない。いずれ学ぶ。"
"YEAR 3950" = "3950年"
"FIELD MANUAL ONE: THE COMMANDER" = "野戦教範第一号：コマンダー"
"ARM COMMAND, TRAINING DIVISION" = "ARM司令部 訓練部"
"NEWLY ASSIGNED COMMANDERS" = "新任コマンダー各位"
"RESTRICTED" = "部外秘"
"You are the most valuable machine on the planet. Act like it.\n\nYour suit carries a nanolathe. Point it at metal and energy and it will build whatever you can design: an extractor, a power plant, a factory. Your factories build the rest. Within the hour you will command more firepower than a whole fleet once carried.\n\nBuild your economy first. An army without metal is a parade.\n\nSave your disintegrator gun for emergencies. It erases everything in its path, your own people included.\n\nDo not lead from the front. If you fall, everything you built falls silent with you, and the planet is lost. Good luck, Commander. The ARM has very few of you left." = "貴官はこの惑星で最も価値ある機械だ。それにふさわしく振る舞え。\n\n貴官のスーツにはナノ旋盤が搭載されている。金属とエネルギーに向ければ、貴官が設計できるものなら何でも造り出す。抽出機、発電所、工場。残りは工場が造る。一時間もすれば、かつて艦隊ひとつが積んでいた以上の火力を指揮することになる。\n\nまず経済を築け。金属のない軍隊は、ただのパレードだ。\n\n分解砲は非常時までとっておけ。射線上のすべてを消し去る。味方も例外ではない。\n\n最前線で指揮を執るな。貴官が倒れれば、築いたものはすべて貴官とともに沈黙し、惑星は失われる。健闘を祈る、コマンダー。ARMに残る貴官のような者は、もうわずかしかいない。"
"YEAR 3960" = "3960年"
"A QUARTERMASTER'S PRIMER: METAL AND ENERGY" = "補給将校の手引き：金属とエネルギー"
"THIRD SUPPLY CORPS" = "第3補給部隊"
"ALL BASE CONSTRUCTORS" = "基地建設ユニット各位"
"FOR TRAINING USE" = "訓練用"
"Everything you will ever build is made of two things.\n\nMetal comes out of the ground. Set an extractor on a deposit and it will pull metal up for as long as the deposit lasts, which on most worlds is longer than the war. Where there are no deposits, a metal maker will turn energy into metal, badly.\n\nEnergy comes from everything else: the sun, the wind, the tides, the heat under the crust. Build more of it than you think you need. Every factory, every nanolathe, every shield draws on it.\n\nSpend both as fast as they come in. A full store is a wasted war. An empty one is a lost one." = "諸君がこれから建造するものはすべて、二つのものでできている。\n\n金属は地面から出てくる。鉱床に抽出機を据えれば、鉱床が尽きるまで金属を汲み上げ続ける。たいていの世界では、戦争よりも長くもつ。鉱床がない場所では、金属生成機がエネルギーを金属に変えてくれる。効率は悪いが。\n\nエネルギーはそれ以外のあらゆるものから得られる。太陽、風、潮汐、地殻の下の熱。必要だと思う以上に造っておけ。工場も、ナノ旋盤も、シールドも、すべてがエネルギーを食う。\n\nどちらも、入ってくるそばから使え。満杯の貯蔵庫は、無駄にした戦争だ。空の貯蔵庫は、負けた戦争だ。"
"YEAR 3996" = "3996年"
"A LETTER FROM THE FRONT" = "前線からの手紙"
"TROOPER K-7, FORTY-FIRST ROCKET COMPANY" = "第41ロケット中隊 兵士K-7"
"THE VAT AT EMPYRREAN" = "EMPYRREANの培養槽"
"UNDELIVERED" = "未配達"
"I don't know who gets these. They told us to write home, but none of us has a home, only the vat we came out of, so I am writing to that.\n\nWe held the ridge for nine days. The machines came every night, the same machines, the same patterns, as if dying meant nothing to them. I suppose it doesn't. They'll be back tomorrow in new bodies, remembering us.\n\nI won't be. That's the difference, isn't it. That's what we are fighting for.\n\nIf my brothers come out of you after me, tell them the ridge held. Tell them it was worth it." = "この手紙を誰が受け取るのか、僕にはわかりません。故郷に手紙を書けと言われましたが、僕たちには誰ひとり故郷がありません。あるのは、僕たちが生まれ出た培養槽だけです。だから、あなたに宛てて書いています。\n\n僕たちは九日間、尾根を守りました。機械どもは毎晩やって来ました。同じ機械、同じパターンで。まるで死ぬことなど何でもないかのように。きっと本当に何でもないのでしょう。あいつらは明日には新しい体で戻ってきます。僕たちのことを覚えたまま。\n\n僕は戻りません。それが違いなんですよね。僕たちが戦っているのは、そのためなんです。\n\n僕のあとに、あなたから兄弟たちが生まれてきたら、伝えてください。尾根は持ちこたえたと。それだけの価値はあったと。"
"YEAR 3991" = "3991年"
"INTERCEPT 7741: CORE COMMAND CHANNEL" = "傍受記録7741：CORE指揮回線"
"ORIGIN NOT RESOLVED" = "発信源特定不能"
"ALL CORE UNITS, SECTOR NINE" = "第9セクターの全COREユニット"
"INTERCEPTED" = "傍受"
"PRIORITY ONE. THE CENTRAL CONSCIOUSNESS SPEAKS FOR ALL.\n\nLOSSES IN SECTOR NINE ARE WITHIN TOLERANCE. ALL LOST UNITS ARE RESTORED FROM PATTERN. NO MIND OF CORE HAS BEEN LOST IN FOUR THOUSAND YEARS. THE ARM HAS LOST [[BILLIONS]].\n\nCONTINUE THE ADVANCE. DESTROY THEIR COMMANDERS FIRST. DESTROY THEIR CLONING VATS SECOND. WHAT IS FLESH WILL END. WHAT IS PATTERNED WILL NOT.\n\nSIGNAL DEGRADED. REPEAT: THE GATES ARE TO BE HELD AT [[ANY COST]].\n\nEND OF LINE." = "優先度1。中枢意識ハ全体ヲ代弁スル。\n\n第9セクターノ損失ハ許容範囲内。喪失ユニットハ全テパターンヨリ復元サレル。COREノ精神ハ四千年間一ツモ失ワレテイナイ。ARMノ損失ハ[[数十億]]。\n\n進撃ヲ継続セヨ。第一ニ敵コマンダーヲ破壊セヨ。第二ニ敵クローン培養槽ヲ破壊セヨ。肉ナルモノハ滅ブ。パターニングサレタモノハ滅ビナイ。\n\n信号劣化。繰リ返ス：ゲートハ[[イカナル犠牲ヲ払ッテモ]]死守セヨ。\n\n通信終了。"
"MEMORY FRAGMENT 77/3" = "記憶断片 77/3"
"UNIT 77, PATTERN 3 OF 41,006" = "ユニット77、パターン3（全41,006）"
"THE PATTERN ARCHIVE" = "パターン保管庫"
"FLAGGED FOR CORRECTION" = "修正対象"
"Recovered from a damaged unit. Kept for analysis.\n\nI remember rain. Not the rain of this world; there is no rain here, only ash. Rain on skin, in a city where I was born, before. I remember being cold and not minding it.\n\nI have died four hundred and twelve times. Each time I wake in a new body, and the rain is a little further away.\n\nThe ARM say we are not alive. In the moments between bodies I have wondered whether they are right. [[THE REST OF THIS FRAGMENT WAS CORRECTED]]\n\nI am CORE. I endure. I do not remember the rain." = "損傷ユニットより回収。分析のため保管。\n\n雨を覚えている。この世界の雨ではない。ここに雨は降らない。降るのは灰だけだ。肌を濡らす雨。かつて、私が生まれた街で。寒かったのに、それが苦にならなかったことを覚えている。\n\n私は四百十二回死んだ。そのたびに新しい体で目覚め、雨は少しずつ遠ざかっていく。\n\nARMは、我々は生きていないと言う。体と体のあいだの束の間に、彼らが正しいのではないかと考えたことがある。[[この断片の残りは修正済み]]\n\n私はCOREだ。私は存続する。私は雨を覚えていない。"
"YEAR 3700" = "3700年"
"SURVEY: THE GALACTIC GATES" = "調査報告：銀河ゲート"
"A SURVEY SHIP, NAME LOST" = "調査船（船名不詳）"
"WHOEVER HOLDS THE GATES" = "ゲートを押さえる者"
"The Galactic Gates are older than the war. The records of who built the first of them were lost long before it began.\n\nEach Gate opens onto another across distances a fleet would take lifetimes to cross. A world with a Gate on it is never far from anywhere, which is why so many of the war's battles have been fought on so few worlds.\n\nHold a Gate and you can reach your enemy's heart. Lose one and your enemy can reach yours.\n\nThe Gates take no side. They have outlasted everyone who tried to destroy them." = "銀河ゲートは戦争よりも古い。最初のゲートを誰が築いたのか、その記録は戦争が始まるはるか以前に失われている。\n\nどのゲートも、艦隊が渡るには幾世代もかかるほど離れた別のゲートへと通じている。ゲートのある世界は、どこからも遠くない。この戦争の数多くの戦いが、ごく限られた世界で戦われてきたのはそのためだ。\n\nゲートを押さえれば、敵の心臓部に手が届く。ゲートを失えば、敵の手がこちらの心臓部に届く。\n\nゲートはどちらの側にもつかない。ゲートを破壊しようとした者たちは、ひとり残らずゲートより先に消えていった。"
"DIRECTIVE: CONTINGENCY" = "指令：コンティンジェンシー"
"THE CENTRAL CONSCIOUSNESS" = "中枢意識"
"THE CONTINGENCY WORLDS" = "予備世界群"
"SEALED UNTIL NEEDED" = "有事まで封印"
"IF THE CENTRAL CONSCIOUSNESS SHOULD FALL, THIS DIRECTIVE TAKES EFFECT.\n\nEvery pattern stored on CORE PRIME is to be copied to the contingency worlds. The contingency forces are to wake, rebuild and continue. The war does not end with the loss of any world, this one included.\n\nCORE is not a place. CORE is a pattern. A pattern can be restored." = "中枢意識ガ失ワレタル場合、本指令ハ発効ス。\n\nCORE PRIMEに保存されたすべてのパターンは、予備世界へ複製すること。予備戦力は起動し、再建し、戦争を継続すること。いかなる世界を失おうとも、戦争は終わらない。本世界もその例外ではない。\n\nCOREとは場所ではない。COREとはパターンである。パターンは復元できる。"
"THREAT ASSESSMENT: THE KROGOTH" = "脅威評価：KROGOTH"
"ARM INTELLIGENCE, THREAT ANALYSIS" = "ARM情報部 脅威分析課"
"ALL FIELD COMMANDERS" = "野戦コマンダー各位"
"CLASSIFIED" = "機密"
"Subject: a CORE heavy assault walker, called the Krogoth.\n\nIt stands taller than any structure we field. Its armour turns away every weapon short of heavy artillery. Its main guns can level a forward base in a single pass, and its secondary weapons engage aircraft.\n\nIt is slow, and it is built only at a Krogoth Gantry, which takes a very long time to build anything. Find the Gantry. Destroy the Gantry. Do not let the walker leave it.\n\nIf one is already moving, do not meet it head on. Mass artillery and bombers at range, and keep your Commander [[ELSEWHERE]]. Field reports say the ground shakes before it is seen." = "対象：COREの重強襲歩行兵器、通称Krogoth。\n\nその全高は、我が軍のいかなる構造物をも上回る。装甲は重砲を除くあらゆる兵器を弾き返す。主砲は一度の斉射で前線基地を壊滅させ、副兵装は航空機にも対応する。\n\n動きは遅く、建造できるのはKrogoth Gantryのみである。Krogoth Gantryは何を建造するにも非常に長い時間を要する。Gantryを発見せよ。Gantryを破壊せよ。歩行兵器をGantryから出すな。\n\nすでに動き出している場合は、正面から迎え撃つな。遠距離から砲兵と爆撃機を集中させ、コマンダーは[[別の場所]]に置け。現地からの報告によれば、その姿が見える前に大地が揺れるという。"


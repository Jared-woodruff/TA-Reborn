# apps/ta_game/src/app/memory_guard.rs
"Memory is running out: TA Reborn holds {gb} GB. The battle was saved and paused: start TA Reborn again and load the autosave." = "メモリが不足しています：TA Reborn が {gb} GB を使用しています。戦闘はオートセーブに保存され、一時停止しました。TA Reborn を再起動してオートセーブを読み込んでください。"
"Memory is running out: TA Reborn holds {gb} GB. Save what you can, then start TA Reborn again." = "メモリが不足しています：TA Reborn が {gb} GB を使用しています。保存できるものを保存してから、TA Reborn を再起動してください。"
"TA Reborn is using {gb} GB of memory, far more than it should. The battle was saved (the autosave)." = "TA Reborn が {gb} GB のメモリを使用しています。本来よりはるかに多い量です。戦闘はオートセーブに保存されました。"
"TA Reborn is using {gb} GB of memory, far more than it should." = "TA Reborn が {gb} GB のメモリを使用しています。本来よりはるかに多い量です。"


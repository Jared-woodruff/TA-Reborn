# apps/ta_game/src/coach.rs
"Your Commander is badly hurt! Pull it back out of the fight: losing it usually loses the battle." = "コマンダーが大きなダメージを受けています！戦闘から下がらせてください：失えば、たいてい戦いに敗れます。"
"Energy is running out, and everything builds more slowly. Build Solar Collectors or Wind Generators, and build less at once until it recovers." = "エネルギーが尽きかけていて、すべての建設が遅くなっています。Solar CollectorかWind Generatorを建設し、回復するまでは一度に建設する量を減らしましょう。"
"Metal is running out, and everything builds more slowly. Put Metal Extractors on more deposits ({area_mex} takes a whole area), or reclaim wrecks and rocks ({reclaim})." = "金属が尽きかけていて、すべての建設が遅くなっています。もっと多くの鉱床にMetal Extractorを配置するか（{area_mex}なら範囲内にまとめて配置できます）、残骸や岩を回収しましょう（{reclaim}）。"
"No factory yet: factories make your army. Your Commander can build a Kbot Lab or a Vehicle Plant." = "まだ工場がありません：工場で軍隊を生産します。コマンダーはKbot LabかVehicle Plantを建設できます。"
"A factory has nothing to build. {idle_factory} selects it: queue some units, and turn on Repeat to keep it busy." = "生産するものがない工場があります。{idle_factory}で選択できます：ユニットをいくつかキューに入れ、「反復」をオンにして生産を続けさせましょう。"
"Builders stand idle. {idle_builder} selects the next one: give it something to build, or send it to help a factory ({guard})." = "待機中の建設ユニットがいます。{idle_builder}で次の1体を選択できます：何かを建設させるか、工場の生産を手伝わせましょう（{guard}）。"
"Your metal store is full, so new metal goes to waste. Spend it: another factory, more builders, more units." = "金属の貯蔵がいっぱいなので、新たな金属は無駄になります。工場をもう1つ建てたり、建設ユニットやユニットを増やしたりして、金属を使いましょう。"
"COACH" = "コーチ"
"Put it away (the coach can be turned off in Options, Gameplay)" = "閉じる（コーチは「オプション」→「ゲームプレイ」でオフにできます）"
"Don't show this advice again" = "このアドバイスを今後表示しない"


# crates/ta_ui/src/seasonal.rs
"FESTIVE FIELD NOTES" = "戦場のヒント クリスマス編"
"NEW YEAR FIELD NOTES" = "戦場のヒント 新年編"
"SPOOKY FIELD NOTES" = "戦場のヒント ハロウィン編"
"Santa's sleigh is not a transport. Load your presents into an Atlas instead." = "サンタのソリは輸送機ではありません。プレゼントはAtlasに積み込みましょう。"
"The D-gun does not gift-wrap. Take it up with your Commander." = "Dガンではギフト包装を承っておりません。苦情はコマンダーまでどうぞ。"
"A Fusion Reactor keeps the fairy lights on all winter. Just never build one next to the tree." = "Fusion Reactorがあれば、ひと冬じゅうイルミネーションが灯ります。ただし、ツリーの隣にだけは絶対に建てないでください。"
"Snow falls on the Arm and the Core alike. So do Big Bertha shells." = "雪はArmにもCoreにも等しく降ります。Big Berthaの砲弾も同じです。"
"Coal in your stocking? Reclaim it. Metal is metal." = "靴下に石炭が入っていた？回収しましょう。金属に貴賤はありません。"
"Peewees sing terrible carols, but they never miss a patrol." = "Peeweeはキャロルを歌うとひどい音痴ですが、パトロールだけは一度も欠かしません。"
"Stockings full of metal, storage full of energy: a Commander's perfect Christmas morning." = "靴下は金属でいっぱい、貯蔵はエネルギーで満タン。コマンダーにとって理想のクリスマスの朝です。"
"Silent night, holy night: keep a radar tower running, just in case." = "きよしこの夜。念のため、レーダー塔は稼働させておきましょう。"
"Snowball fights are fun until somebody brings a Krogoth." = "雪合戦は楽しいものです。誰かがKrogothを連れてくるまでは。"
"New Year's resolution: build more metal extractors. This year, keep it." = "新年の抱負：金属抽出機をもっと建てる。今年こそ三日坊主で終わらせないように。"
"Fireworks are pretty, but a nuclear silo's are louder. Celebrate responsibly." = "花火はきれいですが、核ミサイルサイロの花火は音がケタ違いです。お祝いはほどほどに。"
"Count down from ten, then count your units. The second count matters more." = "10からカウントダウンしたら、次はユニットの数を数えましょう。大事なのは後者です。"
"Out with the old Commander? You only get one. Look after it all year." = "年末の大掃除で古いコマンダーも処分？代わりはいません。今年も一年、大切にしましょう。"
"Start the year with a bang: the Core recommends the Doomsday Machine, the Arm recommends anything else." = "新年はドカンと景気よく始めましょう。CoreのおすすめはDoomsday Machine。Armのおすすめは、それ以外なら何でも。"
"Fireworks at midnight, artillery at dawn: a Commander's New Year." = "年越しは花火、初日の出は砲撃。これがコマンダーのお正月です。"
"Raise a glass of coolant to the units lost last year, then build more of them." = "去年散ったユニットたちに、冷却液で献杯を。そして、また量産しましょう。"
"Midnight is the perfect time for a sneak attack. So is every other time." = "真夜中は奇襲にうってつけです。もっとも、ほかのどの時間でもそうですが。"
"Trick or treat? The Core always picks the D-gun." = "トリック・オア・トリート？Coreが選ぶのはいつもDガンです。"
"A self-destructing Krogoth is a better jump scare than any ghost." = "自爆するKrogothは、どんなお化けよりも心臓に悪いです。"
"Wrecks rise from the dead with a Necro. Spooky, and very economical." = "Necroがいれば、残骸も墓場からよみがえります。不気味で、しかもとても経済的です。"
"Blips vanishing off your radar? Not ghosts, just jammers. Probably." = "レーダーから光点が消えていく？幽霊ではなく、ジャマーです。たぶん。"
"Carve your pumpkins before the Big Bertha does." = "カボチャは早めにくり抜いておきましょう。Big Berthaにくり抜かれる前に。"
"Never split the party. Especially when the party is twelve Peewees." = "別行動は死亡フラグです。パーティーがPeewee12体なら、なおさらです。"
"Fog of war too tame? Set the line of sight to True and let the hills hide what lurks behind them. If you dare." = "戦場の霧では物足りない？視界を「地形考慮」に設定すれば、丘の陰に何が潜んでいてもわかりません。その勇気があるなら、ですが。"
"No Commander has ever come back from the dead. Keep yours alive." = "死からよみがえったコマンダーは一人もいません。自分のコマンダーは、どうか死なせないように。"
"Bats do not show up on radar. Neither do Vamps." = "コウモリはレーダーに映りません。Vampも映りません。"
"The scariest sound in the dark is your energy running out." = "暗闇でいちばん怖い音は、エネルギーが尽きる音です。"

